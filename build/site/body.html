<div class="shell">
  <header class="topbar" id="topbar">
    <div class="brand">
      <a class="tb-home" id="tbHome" href="../" title="Back to the Workspace, the menu of tools" aria-label="Back to the Workspace, the menu of tools"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M2 7.5 8 2.5l6 5V13.5H10V9.5H6v4H2Z"/></svg><span class="tb-home-txt">Tools</span></a>
      <a class="wordmark" href="../" title="Back to the Workspace, the menu of tools">CMRLM</a>
      <span class="brand-sep"></span>
      <h1 class="app-title">Site Model</h1>
      <span class="proj-pill" id="projPill" hidden></span>
    </div>
    <div class="tb-spacer"></div>
    <div class="tb-group tb-zoom" id="tbZoom" role="group" aria-label="Zoom the view">
      <button class="btn tb-zbtn" id="tbZoomSite" type="button" title="Zoom to the whole site" aria-label="Zoom to the whole site"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5h4M16 5h4v4M20 15v4h-4M8 19H4v-4"/><path d="M9 14l1.2-4 4.8-1 1 5z"/></svg><span class="tb-ztxt">Site</span></button>
      <button class="btn tb-zbtn" id="tbZoomBuilding" type="button" title="Zoom to the building" aria-label="Zoom to the building" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 20V5l9-2v17M15 8h3v12M4 20h16M9.5 8h2M9.5 12h2M9.5 16h2"/></svg><span class="tb-ztxt">Building</span></button>
    </div>
    <div class="tb-group" id="tbActions"></div>
  </header>

  <main class="app" id="app">
    <section class="viewport" id="viewport" aria-label="3D view">
      <div class="canvas-host" id="canvasHost"></div>
      <div class="empty" id="emptyState"><div><strong>No site yet</strong><span>Type an address in the panel, then tap Go.</span></div></div>
      <div class="status-chip" id="statusChip" hidden></div>
      <div class="sel-card" id="selCard" role="region" aria-label="Selected building" aria-live="polite" hidden></div>
      <div class="compass" id="compass" aria-label="North arrow" role="img"><svg viewBox="0 0 48 48" aria-hidden="true"><g id="compassRose"><circle cx="24" cy="24" r="21.5" class="c-ring"/><path d="M24 10.5l3.6 13.5h-7.2z" class="c-n"/><path d="M24 37.5l-3.6-13.5h7.2z" class="c-s"/></g><text id="compassN" x="24" y="10.2" text-anchor="middle" class="c-t">N</text></svg></div>
      <nav class="views" id="views" aria-label="Camera views"></nav>
      <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
      <div class="test-panel" id="testPanel" hidden></div>
    </section>

    <aside class="panel" id="panel" aria-label="Controls">
      <div class="grabber" id="grabber" role="separator" aria-orientation="horizontal" aria-label="Drag to resize the controls sheet" tabindex="0"><span></span></div>
      <div class="panel-head panel-head-solo" id="panelHead">
        <button class="panel-collapse" id="panelCollapse" type="button" title="Close every block of the panel" aria-label="Collapse all sections"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l5 5 5-5M7 19l5-5 5 5"/></svg><span class="pc-txt">Collapse all</span></button>
      </div>
      <div class="panel-scroll" id="panelScroll">
        <div id="sections"></div>
      </div>
    </aside>
  </main>
</div>
<input type="file" id="projFile" accept=".json,application/json" hidden>
