<div class="shell">
  <header class="topbar" id="topbar">
    <div class="brand">
      <a class="tb-home" id="tbHome" href="../" title="Back to the Workspace, the menu of tools" aria-label="Back to the Workspace, the menu of tools"><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M2 7.5 8 2.5l6 5V13.5H10V9.5H6v4H2Z"/></svg><span class="tb-home-txt">Tools</span></a>
      <a class="wordmark" href="../" title="Back to the Workspace, the menu of tools">CMRLM</a>
      <span class="brand-sep"></span>
      <h1 class="app-title">Model Viewer</h1>
    </div>
    <div class="tb-group" id="tbProject"></div>
    <span class="proj-pill" id="projPill" hidden></span>
    <div class="tb-spacer"></div>
    <div class="tb-group" id="tbExport"></div>
    <div class="tb-group" id="tbHelp"></div>
  </header>

  <main class="app" id="app">
    <section class="viewport" id="viewport" aria-label="3D view">
      <div class="canvas-host" id="canvasHost"></div>
      <aside class="hud" id="hud" data-collapsed="true" aria-label="Numbers and warnings" hidden></aside>
      <div class="legend" id="legend" hidden role="group" aria-label="Color legend"></div>
      <div class="viewbar" id="viewBar" role="toolbar" aria-label="View and display controls">
        <nav class="views vb-g" id="views" aria-label="Preset views"></nav>
        <div class="vb-g tb-zoom" id="tbZoom" role="group" aria-label="Zoom the view">
          <button class="btn tb-zbtn" id="tbZoomSite" type="button" title="Zoom to the whole site" aria-label="Zoom to the whole site"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5h4M16 5h4v4M20 15v4h-4M8 19H4v-4"/><path d="M9 14l1.2-4 4.8-1 1 5z"/></svg><span class="tb-ztxt">Site</span></button>
          <button class="btn tb-zbtn" id="tbZoomBuilding" type="button" title="Zoom to the building" aria-label="Zoom to the building"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 20V5l9-2v17M15 8h3v12M4 20h16M9.5 8h2M9.5 12h2M9.5 16h2"/></svg><span class="tb-ztxt">Building</span></button>
        </div>
        <div class="seg vb-g" id="styleToggle" role="group" aria-label="Visual style"></div>
        <div class="vb-g" id="tbHud" role="group" aria-label="Metrics panel"></div>
      </div>
      <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
      <section class="empty-state" id="emptyState" aria-label="No project open" hidden>
        <div class="empty-card">
          <h2 id="emptyTitle">Open a project to view it.</h2>
          <p class="help" id="emptyNote">The Model Viewer shows every section of a project in one model. It never changes the project.</p>
          <div class="empty-list" id="emptyList"></div>
          <div class="empty-actions"><button class="btn outline" id="emptyImport" type="button">Import a project file</button></div>
        </div>
      </section>
    </section>

    <aside class="panel" id="panel" aria-label="Controls">
      <div class="grabber" id="grabber" role="separator" aria-orientation="horizontal" aria-label="Drag to resize the controls sheet" tabindex="0"><span></span></div>
      <div id="selection-card" hidden></div>
      <div class="panel-head" id="panelHead">
        <div class="tabs" id="panelTabs" role="tablist" aria-label="Control groups"></div>
      </div>
      <div class="panel-scroll" id="panelScroll">
        <div id="sections"></div>
      </div>
    </aside>
  </main>
</div>
<input type="file" id="projFile" accept=".json,application/json" hidden>
