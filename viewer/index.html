      col.needsUpdate = true;
    };
    writeAll(parts.main, ranges.main);
    writeAll(parts.neighbors, ranges.neighbors);
    paintKey = paintKeyNow();
    needsRender = true;
  }
  const paintKeyNow = () => { const s = State.raw(); return `${s.mode}|${s.colorBy}|${aiReady}|${themeEpoch}`; };

  function geometryKey() {
    const s = State.raw();
    return [Model.version(), JSON.stringify(s.layers), s.cutKey || '', s.siteStyle, themeEpoch].join('|');
  }

  function rebuildModel() {
    disposeGroup(modelGroup);
    for (const k of Object.keys(parts)) parts[k] = null;
    ranges = { main: [], neighbors: [] };
    const doc = Model.doc();
    drawn = { items: 0, solids: 0, flats: 0, ramps: 0, neighbors: 0, byLayer: {}, triangles: 0, vertices: 0 };
    if (!doc) return;
    const sh = Model.shift() || ZERO();
    const mainItems = [], nbItems = [];
    for (const id of TOGGLE_LAYERS) {
      for (const it of Model.shown(id)) {
        if (it.kind === 'ground') continue;           // the proposed ground is drawn by the site adapter below
        if (it.kind === 'neighbor') nbItems.push(it); else mainItems.push(it);
      }
    }
    const edgeColor = cssColor('--scene-edge', '#20262d');
    const mkEdge = (opacity) => new THREE.LineBasicMaterial({ color: edgeColor, transparent: true, opacity });
    const solidMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, metalness: 0, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
    const main = buildMerged(mainItems, sh, solidMat, mkEdge(0.55));
    if (main) {
      parts.main = main.mesh; parts.mainEdges = main.edges; ranges.main = main.ranges;
      main.mesh.userData.ownMat = true;
      main.mesh.castShadow = true; main.mesh.receiveShadow = true;
      modelGroup.add(main.mesh, main.edges);
    }
    const style = State.get('siteStyle');
    const nbMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
    if (style === 'glass') { nbMat.transparent = true; nbMat.opacity = 0.25; nbMat.depthWrite = false; }
    if (style === 'wireframe') { nbMat.colorWrite = false; nbMat.depthWrite = false; }
    const nb = buildMerged(nbItems, sh, nbMat, mkEdge(style === 'glass' ? 0.85 : 0.6));
    if (nb) {
      parts.neighbors = nb.mesh; parts.neighborEdges = nb.edges; ranges.neighbors = nb.ranges;
      nb.mesh.userData.ownMat = true;
      nb.mesh.castShadow = style === 'solid'; nb.mesh.receiveShadow = style !== 'wireframe';
      if (style === 'glass') nb.mesh.renderOrder = 2;
      modelGroup.add(nb.mesh, nb.edges);
    }
    for (const r of [...ranges.main, ...ranges.neighbors]) {
      const it = r.item;
      drawn.items++;
      drawn.byLayer[it.layer] = (drawn.byLayer[it.layer] || 0) + 1;
      if (it.kind === 'neighbor') drawn.neighbors++;
      else if (it.kind === 'stall') drawn.flats++;
      else if (it.kind === 'ramp') drawn.ramps++;
      else drawn.solids++;
    }
    drawn.vertices = (main ? main.vertices : 0) + (nb ? nb.vertices : 0);
    drawn.triangles = drawn.vertices / 3;
    // The light covers the model.
    const b = Model.buildingBounds(), s = Model.siteBounds();
    const box = b || s;
    if (box) {
      const ex = Math.max(box.maxX - box.minX, 40), ey = Math.max(box.maxY - box.minY, 40), hh = Math.max((box.zMax || 0) - sh.z, 40);
      sceneRadius = Math.max(120, 0.5 * Math.sqrt(ex * ex + ey * ey + hh * hh));
    }
    sunKeySeen = '';
    if (selectedId) { const it = Model.itemById(selectedId); drawSelection(it && Model.shown(it.layer).includes(it) ? it : null); }
  }

  /* ---- the site adapter: the ground, boundary, roads, walks, water and trees come from the shared site layer ----------- */
  function syncSite() {
    const doc = Model.doc();
    const st = State.raw();
    const all = Model.all();
    const wantSite = !!doc && !!all && all.site.ok && st.layers.site;
    const grad = !!doc && !!all && st.layers.grading && all.grading.ok ? all.grading.items.find((i) => i.kind === 'ground') : null;
    const key = [Model.version(), wantSite, !!grad, themeEpoch].join('|');
    if (siteDrawn.key === key) return false;
    SiteLayer3D.dispose(siteGroup.children);
    disposeGroup(siteGroup);
    siteDrawn = { key, info: null };
    const sh = Model.shift() || ZERO();
    if (!doc || (!wantSite && !grad)) { gridMesh.visible = true; return true; }
    let dv = null;
    try { const sec = ProjectMod.getSection(doc, 'site'); dv = sec && sec.derived && typeof sec.derived === 'object' ? sec.derived : null; } catch (e) { dv = null; }
    if (!wantSite) dv = null;
    if (grad) dv = { ...(dv || {}), ground: { spacing: grad.grid.spacing, n: grad.grid.n, points: grad.grid.points } };
    let data = null;
    try { data = SiteLayerMod.buildSiteLayerData(dv, { x: sh.x, y: sh.y, rotation: 0, baseZ: sh.z }, { contextIds: new Set() }); } catch (e) { console.error(e); data = null; }
    if (data && data.ok) {
      // The neighbor buildings are the viewer's own solids (so they can be tapped, cut and colored), not part of the site layer.
      data.buildings = [];
      let res = null;
      try { res = SiteLayer3D.objects(data, { style: 'solid', parts: ['ground', 'boundary', 'roads', 'walks', 'water', 'trees'], rotation: 0, edges: true, shadows: true, css: (n, f) => cssColor(n, f) }); } catch (e) { console.error(e); res = null; }
      if (res) { for (const o of res.objects) siteGroup.add(o); siteDrawn.info = res.info; }
    }
    gridMesh.visible = !(siteDrawn.info && siteDrawn.info.ground);
    return true;
  }

  /* ---- selection outline ---------------------------------------------------------------------------------------------- */
  function drawSelection(item) {
    disposeGroup(selGroup);
    selectedId = item ? item.id : null;
    needsRender = true;
    if (!item) return;
    const sh = Model.shift() || ZERO();
    const W = (p, z) => worldVec(p[0] - sh.x, p[1] - sh.y, z - sh.z);
    const segs = [];
    const ring = (pts, z) => { for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; segs.push(W(a, z), W(b, z)); } };
    if (Array.isArray(item.outer3) && item.outer3.length) {
      for (let i = 0; i < item.outer3.length; i++) { const a = item.outer3[i], b = item.outer3[(i + 1) % item.outer3.length]; segs.push(W(a, a[2] + 0.3), W(b, b[2] + 0.3)); }
    } else if (Array.isArray(item.outer) && item.outer.length >= 3) {
      const z1 = typeof item.z1 === 'number' ? item.z1 : item.z0;
      ring(item.outer, z1 + 0.2);
      if (z1 - item.z0 > 0.5) { ring(item.outer, item.z0); item.outer.forEach((p) => segs.push(W(p, item.z0), W(p, z1 + 0.2))); }
    }
    if (!segs.length) return;
    const g = new THREE.BufferGeometry().setFromPoints(segs);
    const m = new THREE.LineBasicMaterial({ color: 0xff8a00, depthTest: false, transparent: true });
    const lines = new THREE.LineSegments(g, m);
    lines.userData.ownMat = true; lines.renderOrder = 11; lines.raycast = () => {};
    selGroup.add(lines);
  }

  /* ---- light ------------------------------------------------------------------------------------------------------------ */
  function updateSun() {
    const st = State.raw(), now = Model.sunNow() || DEFAULT_SUN;
    const key = [now.azimuth, now.altitude, sceneRadius, st.shadows, aiReady].join('|');
    if (key === sunKeySeen) return;
    sunKeySeen = key;
    const R = sceneRadius, az = rad(now.azimuth), alt = rad(clamp(now.altitude, 3, 90));
    const dir = new THREE.Vector3(...planToWorld(Math.sin(az) * Math.cos(alt), Math.cos(az) * Math.cos(alt), Math.sin(alt)));
    const target = worldVec(0, 0, R * 0.3);
    sun.target.position.copy(target);
    sun.position.copy(target).addScaledVector(dir, R * 2.5);
    sun.castShadow = !!st.shadows && !aiReady;
    const c = sun.shadow.camera, ext = Math.max(R * 1.6, 300);
    c.left = -ext; c.right = ext; c.top = ext; c.bottom = -ext; c.near = R * 0.3; c.far = R * 6 + ext;
    c.updateProjectionMatrix();
    sun.target.updateMatrixWorld();
    needsRender = true;
  }

  function refreshColors() {
    scene.background = aiReady ? new THREE.Color('#eef0f3') : cssColor('--scene-sky');
    gridUniforms.uMinor.value.copy(cssColor('--scene-grid-minor'));
    gridUniforms.uMajor.value.copy(cssColor('--scene-grid-major'));
    themeSeen = themeEpoch;
    needsRender = true;
  }

  /* ---- per-frame sync ----------------------------------------------------------------------------------------------------- */
  function sync() {
    if (themeSeen !== themeEpoch) refreshColors();
    let changed = false;
    if (modelVersionSeen !== Model.version() || viewVersionSeen !== State.version()) {
      const first = modelVersionSeen !== Model.version();
      modelVersionSeen = Model.version(); viewVersionSeen = State.version();
      const gk = geometryKey();
      if (gk !== geomKey) {
        geomKey = gk; rebuildModel(); paint(); changed = true;
        if (syncSite()) changed = true;
        if (first && Model.doc()) setView(preset || 'axon', false);
        else if (first) { tween = null; }
      } else if (paintKeyNow() !== paintKey) { paint(); changed = true; }
      if (syncSite()) changed = true;
      updateSun();
    }
    if (changed) needsRender = true;
  }

  /* ---- cameras ---------------------------------------------------------------------------------------------------------- */
  const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  function switchCamera(type) {
    if (type === camType) return;
    const target = controls.target;
    const offset = cam.position.clone().sub(target);
    const dist = offset.length();
    if (type === 'ortho') {
      ortho.zoom = (2 * ORTHO_HALF) / (2 * dist * tanHalfFov);
      ortho.position.copy(cam.position); ortho.quaternion.copy(cam.quaternion);
      cam = ortho;
    } else {
      const visible = (2 * ORTHO_HALF) / ortho.zoom;
      const d = visible / (2 * tanHalfFov);
      persp.position.copy(target).addScaledVector(offset.normalize(), d);
      persp.quaternion.copy(cam.quaternion);
      cam = persp;
    }
    camType = type;
    cam.updateProjectionMatrix();
    controls.object = cam;
  }
  function setCamAspect(a) {
    persp.aspect = a; persp.updateProjectionMatrix();
    ortho.left = -ORTHO_HALF * a; ortho.right = ORTHO_HALF * a; ortho.top = ORTHO_HALF; ortho.bottom = -ORTHO_HALF;
    ortho.updateProjectionMatrix();
  }
  const hostAspect = () => Math.max(0.2, host.clientWidth) / Math.max(1, host.clientHeight);

  /* ---- framing. Boxes are in scene coordinates (project frame minus the shift). ----------------------------------------------- */
  const toScene = (b) => {
    const sh = Model.shift() || ZERO();
    return { minX: b.minX - sh.x, maxX: b.maxX - sh.x, minY: b.minY - sh.y, maxY: b.maxY - sh.y, height: Math.max(0, (Number.isFinite(b.zMax) ? b.zMax : sh.z) - sh.z), minZ: 0 };
  };
  const EMPTY_BOX = { minX: -100, maxX: 100, minY: -100, maxY: 100, height: 40, minZ: 0 };
  /** The building (what stands on the ground), or the site when the project draws no building. */
  function buildingBox() {
    const b = Model.buildingBounds();
    return b ? toScene(b) : { ...EMPTY_BOX };
  }
  /** The whole site square with the building (a building that sticks out stays in), or the building box without a site. */
  function siteBox() {
    const b = buildingBox(), sb = Model.siteBounds();
    if (!sb) return b;
    const s = toScene({ ...sb, zMax: Model.shift().z });
    return { minX: Math.min(b.minX, s.minX), maxX: Math.max(b.maxX, s.maxX), minY: Math.min(b.minY, s.minY), maxY: Math.max(b.maxY, s.maxY), height: b.height, minZ: 0 };
  }
  /** The Axon box: the building with a margin of max(150 ft, 0.6 x its larger plan span), clamped to the site square. */
  function axonBox() {
    const b = buildingBox(), sb = Model.siteBounds();
    if (!sb) return b;
    const s = toScene({ ...sb, zMax: Model.shift().z });
    return Object.assign({ ...b }, SiteLayer3D.frameAround(b, s));
  }

  function fitPersp(box, dir, aspect, H) {
    const corners = [];
    for (const x of [box.minX, box.maxX]) for (const y of [box.minY, box.maxY]) for (const z of [0, H]) corners.push(worldVec(x, y, z));
    const fwd = dir.clone().negate();
    const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0)).normalize();
    const up = new THREE.Vector3().crossVectors(right, fwd).normalize();
    const fit = 1 - 2 * FIT_MARGIN;
    const tY = tanHalfFov, tX = tanHalfFov * aspect;
    const target = worldVec((box.minX + box.maxX) / 2, (box.minY + box.maxY) / 2, H / 2);
    const solve = () => {
      let dist = 1;
      for (const p of corners) {
        const v = p.clone().sub(target), dd = v.dot(dir);
        dist = Math.max(dist, dd + Math.abs(v.dot(right)) / (tX * fit), dd + Math.abs(v.dot(up)) / (tY * fit));
      }
      return dist;
    };
    let dist = solve();
    for (let i = 0; i < 6; i++) {
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (const p of corners) {
        const v = p.clone().sub(target), z = dist - v.dot(dir);
        const nx = v.dot(right) / (z * tX), ny = v.dot(up) / (z * tY);
        x0 = Math.min(x0, nx); x1 = Math.max(x1, nx); y0 = Math.min(y0, ny); y1 = Math.max(y1, ny);
      }
      target.addScaledVector(right, ((x0 + x1) / 2) * tX * dist).addScaledVector(up, ((y0 + y1) / 2) * tY * dist);
      dist = solve();
    }
    return { dist, target };
  }

  function viewTarget(id, box, aspect) {
    const H = Math.max(box.height, 20);
    const ex = box.maxX - box.minX, ey = box.maxY - box.minY;
    const cx = (box.minX + box.maxX) / 2, cy = (box.minY + box.maxY) / 2;
    const fit = 1 - 2 * FIT_MARGIN;
    if (id === 'axon') {
      const az = rad(135), el = rad(28);
      const dirPlan = [Math.sin(az) * Math.cos(el), Math.cos(az) * Math.cos(el), Math.sin(el)];
      const dir = new THREE.Vector3(...planToWorld(...dirPlan)).normalize();
      const f = fitPersp(box, dir, aspect, H);
      return { type: 'persp', dist: f.dist, target: f.target, dir };
    }
    const reach = 0.55 * Math.sqrt(ex * ex + ey * ey + H * H);
    if (id === 'plan') {
      const vis = Math.max(ey / fit, ex / (aspect * fit), 30);
      const e = 0.0008;
      return { type: 'ortho', zoom: (2 * ORTHO_HALF) / vis, minDist: reach, target: worldVec(cx, cy, 0), dir: new THREE.Vector3(...planToWorld(0, -Math.sin(e), Math.cos(e))).normalize() };
    }
    const d = { n: [0, 1], e: [1, 0], s: [0, -1], w: [-1, 0] }[id];
    const along = (id === 'n' || id === 's') ? ex : ey;
    const vis = Math.max(H / fit, along / (aspect * fit), 40);
    return { type: 'ortho', zoom: (2 * ORTHO_HALF) / vis, minDist: reach, target: worldVec(cx, cy, H / 2), dir: new THREE.Vector3(...planToWorld(d[0], d[1], 0)).normalize() };
  }

  /* Plan view locks the orientation (Cade, October 25, 2026): no orbit; a left drag and one finger pan; the wheel and two
     fingers zoom. Any other view button orbits again. planLock survives the Site and Building zoom buttons. */
  let planLock = false;
  function applyPlanLock() {
    if (!controls) return;
    controls.enableRotate = !planLock;
    controls.mouseButtons = planLock
      ? { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN }
      : { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
    controls.touches = planLock ? { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_PAN } : { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
  }

  function setView(id, animate = true) {
    if (!renderer) return;
    const custom = !!id && typeof id === 'object';
    const goal = custom ? id : viewTarget(id, id === 'axon' ? axonBox() : buildingBox(), hostAspect());
    if (!custom) planLock = id === 'plan';
    preset = custom ? (planLock ? 'plan' : null) : id;
    applyPlanLock();
    tween = null;
    if (goal.type !== camType) switchCamera(goal.type);
    const curTarget = controls.target.clone();
    const curOffset = cam.position.clone().sub(curTarget);
    const curDist = Math.max(1, curOffset.length());
    const fromDir = curOffset.clone().normalize();
    const toDist = goal.type === 'persp' ? goal.dist : Math.max(curDist, goal.minDist || 0);
    const apply = (target, dir, dist, zoom) => {
      controls.target.copy(target);
      cam.position.copy(target).addScaledVector(dir, dist);
      if (camType === 'ortho') cam.zoom = zoom;
      cam.updateProjectionMatrix();
      controls.update();
    };
    if (!animate || reduceMotion) apply(goal.target, goal.dir, toDist, goal.zoom);
    else {
      tween = {
        t0: performance.now(), dur: 400, fromTarget: curTarget, toTarget: goal.target, fromDir, toDir: goal.dir, fromDist: curDist, toDist,
        fromZoom: cam.zoom, toZoom: goal.zoom || cam.zoom, q: new THREE.Quaternion().setFromUnitVectors(fromDir, goal.dir), apply,
      };
    }
    needsRender = true;
    viewListeners.forEach((fn) => fn(preset));
  }

  /** Fits `box` in the current camera direction. Returns the goal it flew to. */
  function fitBox(box, animate = true) {
    if (!renderer || !cam || !controls || !box) return null;
    const dir = cam.position.clone().sub(controls.target).normalize();
    const aspect = hostAspect();
    const z0 = box.minZ || 0, H = Math.max(box.height || 0, z0 + 20);
    let goal;
    if (camType === 'persp') {
      const f = fitPersp(box, dir, aspect, H);
      goal = { type: 'persp', dist: f.dist, target: f.target, dir };
    } else {
      const fwd = dir.clone().negate();
      const cr = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0));
      const right = cr.length() < 1e-6 ? new THREE.Vector3(1, 0, 0) : cr.normalize();
      const up = new THREE.Vector3().crossVectors(right, fwd).normalize();
      let r0 = Infinity, r1 = -Infinity, u0 = Infinity, u1 = -Infinity;
      for (const x of [box.minX, box.maxX]) for (const y of [box.minY, box.maxY]) for (const z of [z0, H]) {
        const p = worldVec(x, y, z), r = p.dot(right), u = p.dot(up);
        r0 = Math.min(r0, r); r1 = Math.max(r1, r); u0 = Math.min(u0, u); u1 = Math.max(u1, u);
      }
      const c = worldVec((box.minX + box.maxX) / 2, (box.minY + box.maxY) / 2, (z0 + H) / 2);
      const target = c.clone().addScaledVector(right, (r0 + r1) / 2 - c.dot(right)).addScaledVector(up, (u0 + u1) / 2 - c.dot(up));
      const fit = 1 - 2 * FIT_MARGIN;
      const vis = Math.max((u1 - u0) / fit, (r1 - r0) / (aspect * fit), 30);
      const ex = box.maxX - box.minX, ey = box.maxY - box.minY;
      goal = { type: 'ortho', zoom: (2 * ORTHO_HALF) / vis, minDist: 0.55 * Math.sqrt(ex * ex + ey * ey + (H - z0) * (H - z0)), target, dir };
    }
    setView(goal, animate);
    return goal;
  }
  const frameSite = (animate = true) => fitBox(siteBox(), animate);
  const frameBuilding = (animate = true) => fitBox(buildingBox(), animate);

  function stepTween(now) {
    const k = tween;
    const p = clamp((now - k.t0) / k.dur, 0, 1), e = easeInOut(p);
    const target = k.fromTarget.clone().lerp(k.toTarget, e);
    const dir = k.fromDir.clone().applyQuaternion(new THREE.Quaternion().slerp(k.q, e)).normalize();
    const dist = k.fromDist + (k.toDist - k.fromDist) * e;
    const zoom = k.fromZoom * Math.pow(k.toZoom / k.fromZoom, e);
    k.apply(target, dir, dist, zoom);
    needsRender = true;
    if (p >= 1) tween = null;
  }
  function updateClip() {
    const dist = cam.position.distanceTo(controls.target);
    if (camType === 'persp') { cam.near = Math.max(0.5, dist * 0.01); cam.far = dist * 20 + sceneRadius * 4 + 2000; }
    else { cam.near = 0.1; cam.far = dist + 60000; }
    cam.updateProjectionMatrix();
  }
  function resize() {
    if (!renderer) return;
    const w = Math.max(1, host.clientWidth), hh = Math.max(1, host.clientHeight);
    renderer.setSize(w, hh, false);
    setCamAspect(w / hh);
    if (preset) setView(preset, false);
    needsRender = true;
    renderer.render(scene, cam);
  }

  function frame(now) {
    requestAnimationFrame(frame);
    if (capturing) return;
    if (tween) stepTween(now);
    const moved = controls.update();
    sync();
    if (moved || needsRender) { updateClip(); renderer.render(scene, cam); needsRender = false; }
  }

  /* ---- picking ----------------------------------------------------------------------------------------------------------------- */
  const ray = new THREE.Raycaster();
  function itemAt(rs, vertex) {
    let lo = 0, hi = rs.length - 1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1, r = rs[mid];
      if (vertex < r.start) hi = mid - 1; else if (vertex >= r.start + r.count) lo = mid + 1; else return r.item;
    }
    return null;
  }
  /** The item under a client point, or null. */
  function pickAt(clientX, clientY) {
    if (!renderer) return null;
    cam.updateMatrixWorld();
    const rect = renderer.domElement.getBoundingClientRect();
    const ndc = new THREE.Vector2(((clientX - rect.left) / rect.width) * 2 - 1, -(((clientY - rect.top) / rect.height) * 2 - 1));
    ray.setFromCamera(ndc, cam);
    const targets = [parts.main, parts.neighbors].filter(Boolean);
    const hits = ray.intersectObjects(targets, false);
    for (const hit of hits) {
      if (hit.faceIndex == null) continue;
      const v = hit.faceIndex * 3;
      const item = hit.object === parts.main ? itemAt(ranges.main, v) : itemAt(ranges.neighbors, v);
      if (item) return item;
    }
    return null;
  }
  function screenOf(x, y, z) {       // project-frame point -> client px
    cam.updateMatrixWorld();
    const sh = Model.shift() || ZERO();
    const v = worldVec(x - sh.x, y - sh.y, z - sh.z).project(cam);
    const r = renderer.domElement.getBoundingClientRect();
    return { x: r.left + ((v.x + 1) / 2) * r.width, y: r.top + ((1 - v.y) / 2) * r.height, depth: v.z };
  }
  function centerOf(item) {
    const pts = item.outer || item.outer3 || [];
    if (!pts.length) return null;
    let cx = 0, cy = 0;
    for (const p of pts) { cx += p[0]; cy += p[1]; }
    cx /= pts.length; cy /= pts.length;
    const z = typeof item.z1 === 'number' ? item.z1 : (item.outer3 ? item.outer3[0][2] : item.z0);
    return { x: cx, y: cy, z };
  }

  let down = null;
  function bindPointer(el) {
    el.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId }; });
    el.addEventListener('pointerup', (e) => {
      if (!down || down.id !== e.pointerId) return;
      const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t;
      down = null;
      if (moved > 6 || dt > 500) return;
      click(e.clientX, e.clientY);
    });
  }
  function click(x, y) {
    const item = pickAt(x, y);
    pickListeners.forEach((fn) => fn(item));
    return item;
  }

  /* ---- pictures ------------------------------------------------------------------------------------------------------------------ */
  async function capture(overlay, scale = 2) {
    if (!renderer) throw new Error('The 3D view is not available.');
    capturing = true;
    const selWas = selGroup.visible;
    selGroup.visible = false;
    try { return await ShotMod.captureView({ renderer, scene, camera: cam, scale, overlay }); }
    finally { capturing = false; selGroup.visible = selWas; needsRender = true; }
  }
  /** AI-ready picture: plain light sky, no grid, no site marks, no selection. The project building is amber, everything else is white. */
  let lastCapture = null;
  async function captureClean(scale = 2) {
    if (!renderer) throw new Error('The 3D view is not available.');
    capturing = true;
    const was = { aiReady, grid: gridMesh.visible, sel: selGroup.visible, bg: scene.background };
    const hid = [];
    for (const o of siteGroup.children) { const k = o.userData && o.userData.kind; if ((k === 'site-boundary' || k === 'site-arrow') && o.visible) { o.visible = false; hid.push(o); } }
    try {
      aiReady = true; gridMesh.visible = false; selGroup.visible = false;
      refreshColors(); paint(); sunKeySeen = ''; updateSun();
      lastCapture = { grid: gridMesh.visible, marks: hid.length > 0 ? false : true, selection: selGroup.visible, aiReady, edges: !!parts.mainEdges };
      return await ShotMod.captureView({ renderer, scene, camera: cam, scale });
    } finally {
      aiReady = was.aiReady; gridMesh.visible = was.grid; selGroup.visible = was.sel; hid.forEach((o) => { o.visible = true; });
      refreshColors(); paint(); sunKeySeen = ''; updateSun();
      capturing = false; needsRender = true;
    }
  }

  function init(hostEl) {
    host = hostEl;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    } catch (e) {
      host.innerHTML = '<div class="gl-fail">WebGL is not available in this browser, so the 3D view cannot start. The numbers still work.</div>';
      renderer = null;
      return false;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    host.appendChild(renderer.domElement);
    buildScene();
    persp = new THREE.PerspectiveCamera(FOV, 1, 1, 100000);
    ortho = new THREE.OrthographicCamera(-ORTHO_HALF, ORTHO_HALF, ORTHO_HALF, -ORTHO_HALF, 0.1, 100000);
    cam = persp;
    persp.position.set(300, 250, 300);
    controls = new OrbitControls(cam, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.12;
    controls.maxPolarAngle = Math.PI / 2;
    controls.minDistance = 8; controls.maxDistance = 60000;
    controls.minZoom = 0.01; controls.maxZoom = 80;
    controls.screenSpacePanning = true;
    controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
    controls.addEventListener('start', () => { tween = null; if (preset && !planLock) { preset = null; viewListeners.forEach((fn) => fn(null)); } });
    controls.addEventListener('change', () => { needsRender = true; });
    bindPointer(renderer.domElement);
    const ro = new ResizeObserver(resize);
    ro.observe(host);
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onTheme = () => { themeEpoch++; };
    if (mq.addEventListener) mq.addEventListener('change', onTheme); else if (mq.addListener) mq.addListener(onTheme);
    renderer.domElement.addEventListener('webglcontextlost', (e) => e.preventDefault());
    refreshColors();
    resize();
    requestAnimationFrame(frame);
    return true;
  }

  return {
    init, setView, fitBox, frameSite, frameBuilding, capture, captureClean, pickAt, click, screenOf, centerOf,
    select: (item) => drawSelection(item),
    selectedId: () => selectedId,
    onViewChange: (fn) => viewListeners.push(fn),
    onPick: (fn) => pickListeners.push(fn),
    ready: () => !!renderer,
    requestRender: () => { needsRender = true; },
    canvas: () => (renderer ? renderer.domElement : null),
    camera: () => cam,
    syncNow: () => { sync(); },
    captureFlags: () => (lastCapture ? { ...lastCapture } : null),
    framedBox: (id) => (id === 'site' ? siteBox() : id === 'building' ? buildingBox() : axonBox()),
    info: () => ({ camera: camType, preset, tweening: !!tween, distance: cam ? cam.position.distanceTo(controls.target) : 0, items: drawn.items, drawn: { ...drawn, byLayer: { ...drawn.byLayer } }, site: siteDrawn.info ? { ...siteDrawn.info } : null, grid: gridMesh ? gridMesh.visible : false, shadows: sun ? sun.castShadow : false, sun: sun ? { x: sun.position.x, y: sun.position.y, z: sun.position.z } : null }),
    /** For tests: the colors drawn for each item id (hex), read back from the vertex color attribute. */
    colorOfItem: (id) => {
      for (const [mesh, rs] of [[parts.main, ranges.main], [parts.neighbors, ranges.neighbors]]) {
        if (!mesh) continue;
        const r = rs.find((q) => q.item.id === id);
        if (!r) continue;
        const col = mesh.geometry.attributes.color;
        return `#${new THREE.Color(col.getX(r.start), col.getY(r.start), col.getZ(r.start)).getHexString()}`;
      }
      return null;
    },
    itemsDrawn: () => [...ranges.main, ...ranges.neighbors].map((r) => r.item.id),
    sceneObjects: () => { const out = []; scene.traverse((o) => out.push(o)); return out; },
    themeChanged: () => { themeEpoch++; needsRender = true; },
  };
})();

/* ==========================================================================
   SITE LAYER 3D  (docs/site-layer-technical-plan.md sections 4 and 5)
   `SiteLayer3D` turns the data of SiteLayerMod.buildSiteLayerData (plain arrays in a tool's local frame, z relative to the
   tool's base) into Three.js objects: the ground with elevation shading and a skirt, the draped boundary with its north arrow,
   the neighbor buildings (solid, with dark edges), roads, walks, water and trees. One merged BufferGeometry per kind.
   Same look as the Site Model scene (build/site/03_scene.js).

   Shared by every tool. Page globals used (at call time only): THREE, BufferGeometryUtils, planToWorld, planMatrix, worldVec.
   The tool's own 06c_site.js (SiteLayer) decides when to build and calls objects() inside kit.syncLayer.

   Everything draped on the ground (roads, walks, trees, the boundary arrow) samples the drawn ground MESH (the same two
   triangles per cell as the ground geometry), so nothing floats or sinks. Without a ground the sampler gives 0.
   ========================================================================== */
const SiteLayer3D = (() => {
  const ALL_PARTS = ['ground', 'boundary', 'buildings', 'roads', 'walks', 'water', 'trees'];
  const EDGE_ANGLE = 30;
  const GLASS_OPACITY = 0.25;            // site style 'glass'
  const STYLES = ['solid', 'glass', 'wireframe'];
  const BOUNDARY_COLOR = 0xc0701a;       // the Tower's dashed site loop
  const ARROW_COLOR = 0x1d2733;

  /* ---- colors from the CSS tokens (light value, dark value when the page has no token yet) ---- */
  const FALLBACK = {
    '--scene-terrain-lo': ['#d6dadd', '#3a4047'], '--scene-terrain-hi': ['#eceeef', '#4a5159'], '--scene-skirt': ['#bcc2c8', '#2a2f35'],
    '--scene-est': ['#efe2cf', '#dccaa9'], '--scene-road': ['#9ba1a8', '#656c74'], '--scene-walk': ['#c6cacd', '#858d95'],
    '--scene-water': ['#8dbbe3', '#3f72a6'], '--scene-tree': ['#8fa88b', '#6e8d6c'], '--scene-trunk': ['#8a8378', '#8a8378'],
    '--scene-model': ['#f6f6f3', '#efefec'], '--scene-edge': ['#20262d', '#e7eaee'],
  };
  const isDark = () => { try { return !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); } catch (e) { return false; } };
  function defaultCss(name, fallback) {
    let v = '';
    try { v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); } catch (e) { v = ''; }
    const fb = fallback || (FALLBACK[name] ? FALLBACK[name][isDark() ? 1 : 0] : '#888888');
    try { return new THREE.Color(v || fb); } catch (e) { return new THREE.Color(fb); }
  }

  /* ---- the drawn ground surface: elevation at a local point (relative z) ---- */
  /** Sampler over data.ground. The grid may be rotated (a rotated placement turns the mesh as a solid), so the query point is
   *  projected on the two grid axes. Same triangles as the mesh: cell split a-b-c / a-c-d, u >= v. null without a ground. */
  function makeSampler(g) {
    if (!g || !g.positions || !(g.n >= 2)) return null;
    const P = g.positions, n = g.n, d = g.spacing;
    const x0 = P[0], y0 = P[1];
    let e1x = (P[3] - x0) / d, e1y = (P[4] - y0) / d;
    let e2x = (P[3 * n] - x0) / d, e2y = (P[3 * n + 1] - y0) / d;
    const l1 = Math.hypot(e1x, e1y) || 1, l2 = Math.hypot(e2x, e2y) || 1;
    e1x /= l1; e1y /= l1; e2x /= l2; e2y /= l2;
    const L = n - 1;
    return (x, y) => {
      const dx = x - x0, dy = y - y0;
      const cu = Math.min(L, Math.max(0, (dx * e1x + dy * e1y) / d)), cv = Math.min(L, Math.max(0, (dx * e2x + dy * e2y) / d));
      const i = Math.min(Math.floor(cu), n - 2), j = Math.min(Math.floor(cv), n - 2);
      const u = cu - i, v = cv - j, o = j * n + i;
      const za = P[3 * o + 2], zb = P[3 * (o + 1) + 2], zc = P[3 * (o + n + 1) + 2], zd = P[3 * (o + n) + 2];
      return u >= v ? za + u * (zb - za) + v * (zc - zb) : za + u * (zc - zd) + v * (zd - za);
    };
  }

  /* ---- helpers ---- */
  /** Maps the y (elevation) of a world-space geometry through zOf. Only for a non-identity zOf. */
  function mapElevation(geo, zOf) {
    if (!zOf) return geo;
    const p = geo.getAttribute('position');
    for (let i = 0; i < p.count; i++) p.setY(i, zOf(p.getY(i)));
    p.needsUpdate = true;
    return geo;
  }
  function densifyRing(ring, step) {
    const out = [];
    for (let i = 0; i < ring.length; i++) {
      const a = ring[i], b = ring[(i + 1) % ring.length];
      out.push(a);
      const L = Math.hypot(b[0] - a[0], b[1] - a[1]), k = Math.ceil(L / step);
      for (let s = 1; s < k; s++) out.push([a[0] + (b[0] - a[0]) * s / k, a[1] + (b[1] - a[1]) * s / k]);
    }
    return out;
  }
  /** Drops a repeated closing point (ShapeUtils would drop it and shift the hole indices). */
  function trimRing(r) {
    const o = r.slice();
    while (o.length > 1 && o[0][0] === o[o.length - 1][0] && o[0][1] === o[o.length - 1][1]) o.pop();
    return o;
  }
  /** polys: [{ outer, holes }]. elevOf(x, y) gives the local elevation, zOf maps it to world y. Returns a BufferGeometry or null. */
  function polyGeometry(polys, elevOf, zOf, step) {
    const pos = [], idx = [];
    for (const p of polys) {
      try {
        const outer = step ? densifyRing(trimRing(p.outer), step) : trimRing(p.outer);
        const holes = (p.holes || []).map((hh) => (step ? densifyRing(trimRing(hh), step) : trimRing(hh)));
        const tris = THREE.ShapeUtils.triangulateShape(outer.map((q) => new THREE.Vector2(q[0], q[1])), holes.map((hh) => hh.map((q) => new THREE.Vector2(q[0], q[1]))));
        const all = outer.concat(...holes), base = pos.length / 3;
        for (const q of all) pos.push(q[0], zOf(elevOf(q[0], q[1])), -q[1]);
        for (const [a, b, c] of tris) {
          const ax = all[a][0], ay = all[a][1], bx = all[b][0], by = all[b][1], cx = all[c][0], cy = all[c][1];
          const ccw = (bx - ax) * (cy - ay) - (by - ay) * (cx - ax) > 0;      // plan CCW = facing up
          if (ccw) idx.push(base + a, base + b, base + c); else idx.push(base + a, base + c, base + b);
        }
      } catch (e) { console.warn('site polygon skipped', e); }
    }
    if (!idx.length) return null;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    return geo;
  }
  const mergeAll = (list) => {
    if (list.length === 1) return list[0];
    const merged = BufferGeometryUtils.mergeGeometries(list, false);
    list.forEach((g) => g.dispose());
    return merged;
  };

  /* ---- the parts ---- */
  function buildGround(data, o, mats, out, info) {
    const g = data.ground;
    if (!g) return;
    const n = g.n, N = n * n, P = g.positions;
    const lo = o.css('--scene-terrain-lo'), hi = o.css('--scene-terrain-hi'), c = new THREE.Color();
    const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
    for (let k = 0; k < N; k++) {
      pos[3 * k] = P[3 * k]; pos[3 * k + 1] = o.zOf(P[3 * k + 2]); pos[3 * k + 2] = -P[3 * k + 1];
      c.copy(lo).lerp(hi, g.shade[k]);
      col[3 * k] = c.r; col[3 * k + 1] = c.g; col[3 * k + 2] = c.b;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    geo.setIndex(new THREE.BufferAttribute(g.indices, 1));
    geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, metalness: 0, polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 2 });
    mats.push(mat);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.userData.kind = 'site-ground';
    mesh.userData.site = true;
    mesh.userData.receives = true;
    out.push(mesh);
    info.triangles += g.indices.length / 3;

    // skirt: a thin plate under the ground, the site reads as a physical model
    const sk = g.skirt;
    if (sk && sk.positions && sk.indices) {
      const sp = new Float32Array(sk.positions.length);
      for (let k = 0; k < sk.positions.length; k += 3) { sp[k] = sk.positions[k]; sp[k + 1] = o.zOf(sk.positions[k + 2]); sp[k + 2] = -sk.positions[k + 1]; }
      const sg = new THREE.BufferGeometry();
      sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
      sg.setIndex(new THREE.BufferAttribute(sk.indices, 1));
      sg.computeVertexNormals();
      const smat = new THREE.MeshStandardMaterial({ color: o.css('--scene-skirt'), roughness: 1, metalness: 0 });
      mats.push(smat);
      const skirt = new THREE.Mesh(sg, smat);
      skirt.userData.kind = 'site-skirt';
      skirt.userData.site = true;
      out.push(skirt);
      info.triangles += sk.indices.length / 3;
    }
  }

  /** The dashed site loop, just above the ground, and the north arrow beside its north-east corner (turns with the placement). */
  function buildBoundary(data, o, mats, out, zAt) {
    const ring = data.boundary;
    if (!ring || ring.length < 3) return;
    const dashed = new THREE.LineDashedMaterial({ color: BOUNDARY_COLOR, dashSize: 12, gapSize: 8 });
    const solid = new THREE.LineBasicMaterial({ color: ARROW_COLOR });
    mats.push(dashed, solid);
    const loop = new THREE.BufferGeometry().setFromPoints(ring.map((q) => worldVec(q[0], q[1], o.zOf(q[2]))));
    const line = new THREE.LineLoop(loop, dashed);
    line.computeLineDistances();
    line.userData.kind = 'site-boundary';
    out.push(line);

    // north arrow: project north in the local frame is (sin r, cos r); a shaft, a head and an N, flat on the ground
    const r = ((o.rotation || 0) * Math.PI) / 180, nx = Math.sin(r), ny = Math.cos(r), ex = ny, ey = -nx;     // north and east unit vectors
    let maxX = -Infinity, maxY = -Infinity, minX = Infinity, minY = Infinity;
    for (const q of ring) { maxX = Math.max(maxX, q[0]); maxY = Math.max(maxY, q[1]); minX = Math.min(minX, q[0]); minY = Math.min(minY, q[1]); }
    const span = Math.max(maxX - minX, maxY - minY, 1);
    const k = Math.max(0.5, Math.min(4, span / 1000));                                         // scales with the site, 1 at 1,000 ft
    let best = null;                                                                           // the boundary corner farthest toward north-east
    for (const q of ring) { const s = q[0] * (ex + nx) + q[1] * (ey + ny); if (!best || s > best.s) best = { s, q }; }
    const base = [best.q[0] + (ex - nx) * 30 * k, best.q[1] + (ey - ny) * 30 * k];
    const P = (a, b) => [base[0] + ex * a * k + nx * b * k, base[1] + ey * a * k + ny * b * k];   // a = east, b = north
    const pts = [];
    const seg = (p, q) => { pts.push(worldVec(p[0], p[1], o.zOf(zAt(p[0], p[1]) + 0.3)), worldVec(q[0], q[1], o.zOf(zAt(q[0], q[1]) + 0.3))); };
    // each stroke is cut into short pieces so it follows a sloping ground
    const stroke = (p, q) => { const m = Math.max(1, Math.ceil(Math.hypot(q[0] - p[0], q[1] - p[1]) / (6 * k))); for (let s = 0; s < m; s++) seg([p[0] + (q[0] - p[0]) * s / m, p[1] + (q[1] - p[1]) * s / m], [p[0] + (q[0] - p[0]) * (s + 1) / m, p[1] + (q[1] - p[1]) * (s + 1) / m]); };
    stroke(P(0, 0), P(0, 40)); stroke(P(0, 40), P(-7, 26)); stroke(P(0, 40), P(7, 26));
    stroke(P(-6, 50), P(-6, 68)); stroke(P(-6, 68), P(6, 50)); stroke(P(6, 50), P(6, 68));      // the letter N
    const arrow = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), solid);
    arrow.userData.kind = 'site-arrow';
    out.push(arrow);
  }

  function buildBuildings(data, o, mats, out, info) {
    const plain = [], est = [];
    let count = 0;
    for (const b of data.buildings || []) {
      try {
        if (!b.outer || b.outer.length < 3) continue;
        const shape = new THREE.Shape(b.outer.map((q) => new THREE.Vector2(q[0], q[1])));
        for (const hole of b.holes || []) if (hole.length >= 3) shape.holes.push(new THREE.Path(hole.map((q) => new THREE.Vector2(q[0], q[1]))));
        const geo = new THREE.ExtrudeGeometry(shape, { depth: Math.max(0.1, b.height) + 1, bevelEnabled: false, steps: 1, curveSegments: 1 });
        geo.deleteAttribute('uv');
        geo.applyMatrix4(planMatrix(b.base - 1));
        mapElevation(geo, o.identity ? null : o.zOf);
        (b.rule === 'estimate' ? est : plain).push(geo);
        count++;
      } catch (e) { console.warn('site building skipped', b && b.id, e); }
    }
    const style = o.style;
    for (const [list, color] of [[plain, o.css('--scene-model')], [est, o.css('--scene-est')]]) {
      if (!list.length) continue;
      const merged = mergeAll(list);
      let tris = 0;
      if (style !== 'wireframe') {                                  // wireframe: edges only, no faces
        const glass = style === 'glass';
        const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.94, metalness: 0 });
        if (glass) { mat.transparent = true; mat.opacity = GLASS_OPACITY; mat.depthWrite = false; }
        mats.push(mat);
        const mesh = new THREE.Mesh(merged, mat);
        mesh.userData.kind = 'site-buildings';
        mesh.userData.site = true;
        mesh.userData.casts = true; mesh.userData.receives = !glass;
        if (glass) mesh.renderOrder = 2;                            // after the ground and the roads
        out.push(mesh);
        tris = (merged.index ? merged.index.count : merged.getAttribute('position').count) / 3;
        info.triangles += tris;
      }
      if (o.edges || style === 'wireframe') {                       // a wireframe is its edges: they stay even when edges is off
        const emat = new THREE.LineBasicMaterial({ color: o.css('--scene-edge') });
        mats.push(emat);
        const edges = new THREE.LineSegments(new THREE.EdgesGeometry(merged, EDGE_ANGLE), emat);
        edges.userData.kind = 'site-building-edges';
        edges.userData.site = true;
        if (style !== 'solid') edges.renderOrder = 3;
        out.push(edges);
      }
      if (style === 'wireframe') merged.dispose();                  // no mesh holds it
    }
    info.buildings = count;
  }

  function buildPavement(polys, colorName, lift, factor, kind, o, mats, out, info, zAt) {
    if (!polys || !polys.length) return;
    const geo = polyGeometry(polys, (x, y) => zAt(x, y) + lift, o.zOf, 10);
    if (!geo) return;
    const mat = new THREE.MeshStandardMaterial({ color: o.css(colorName), roughness: 1, metalness: 0, polygonOffset: true, polygonOffsetFactor: factor, polygonOffsetUnits: factor });
    mats.push(mat);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.userData.kind = kind;
    mesh.userData.site = true;
    mesh.userData.receives = true;
    out.push(mesh);
    info.triangles += geo.index.count / 3;
    info[kind === 'site-roads' ? 'roads' : 'walks'] = polys.length;
  }

  function buildWater(data, o, mats, out, info) {
    const w = data.water || {};
    const geos = [];
    for (const a of w.areas || []) {
      const g = polyGeometry([a], () => a.level, o.zOf, 0);
      if (g) geos.push(g);
    }
    info.waterAreas = geos.length;
    const color = o.css('--scene-water');
    if (geos.length) {
      const merged = mergeAll(geos);
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0, polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3 });
      mats.push(mat);
      const mesh = new THREE.Mesh(merged, mat);
      mesh.userData.kind = 'site-water';
      mesh.userData.site = true;
      mesh.userData.receives = true;
      out.push(mesh);
      info.triangles += merged.index.count / 3;
    }
    const seg = [];
    for (const line of w.lines || []) {
      for (let i = 1; i < line.length; i++) {
        const a = line[i - 1], b = line[i];
        seg.push(a[0], o.zOf(a[2]), -a[1], b[0], o.zOf(b[2]), -b[1]);
      }
    }
    if (seg.length) {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(seg, 3));
      const lmat = new THREE.LineBasicMaterial({ color });
      mats.push(lmat);
      const lines = new THREE.LineSegments(g, lmat);
      lines.userData.kind = 'site-water-lines';
      out.push(lines);
    }
  }

  /** Two InstancedMesh (low-poly canopy, thin trunk), like the Site Model. */
  function buildTrees(data, o, mats, out, info, zAt) {
    const trees = data.trees || [];
    if (!trees.length) return;
    info.trees = trees.length;
    const canopyGeo = new THREE.IcosahedronGeometry(1, 1);
    const trunkGeo = new THREE.CylinderGeometry(0.55, 0.8, 1, 6);
    trunkGeo.translate(0, 0.5, 0);
    const cm = new THREE.MeshStandardMaterial({ color: o.css('--scene-tree'), roughness: 0.94, metalness: 0, flatShading: true });
    const tm = new THREE.MeshStandardMaterial({ color: o.css('--scene-trunk'), roughness: 0.94, metalness: 0 });
    mats.push(cm, tm);
    const canopy = new THREE.InstancedMesh(canopyGeo, cm, trees.length);
    const trunk = new THREE.InstancedMesh(trunkGeo, tm, trees.length);
    const ky = o.identity ? 1 : o.zOf(1) - o.zOf(0);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), s = new THREE.Vector3();
    trees.forEach((t, i) => {
      const e = o.hasGround ? zAt(t.x, t.y) : t.z, r = t.canopy / 2;
      p.set(t.x, o.zOf(e + t.height - r), -t.y); s.set(r, r * 0.9 * ky, r);
      canopy.setMatrixAt(i, m.compose(p, q, s));
      p.set(t.x, o.zOf(e), -t.y); s.set(1, (t.height - r) * ky, 1);
      trunk.setMatrixAt(i, m.compose(p, q, s));
    });
    canopy.instanceMatrix.needsUpdate = trunk.instanceMatrix.needsUpdate = true;
    canopy.computeBoundingSphere(); trunk.computeBoundingSphere();
    for (const mesh of [trunk, canopy]) { mesh.userData.kind = 'site-trees'; mesh.userData.site = true; mesh.userData.casts = true; out.push(mesh); }
    info.triangles += (canopyGeo.index ? canopyGeo.index.count / 3 : 0) * trees.length + (trunkGeo.index ? trunkGeo.index.count / 3 : 0) * trees.length;
  }

  /* ---- public ---- */
  /** THREE objects for a data result of SiteLayerMod.buildSiteLayerData.
   *  opts: { parts: ['ground','boundary','buildings','roads','walks','water','trees'] (default all),
   *          zOf: (localZ) => worldY (default identity; the Grading Sketch passes its exaggeration mapper),
   *          css: (name, fallback) => THREE.Color, edges: true, shadows: true,
   *          rotation: placement rotation in degrees (turns the north arrow; default 0),
   *          style: 'solid' (default) | 'glass' (buildings opacity 0.25, depthWrite off, renderOrder 2, edges 3) | 'wireframe' (buildings as edges only;
   *                 the edges are drawn even when edges is false). Only the neighbor buildings change; an unknown value means 'solid'.
   *          zAt: (x, y) => local ground z (default: the drawn ground mesh) }
   *  Returns { objects: [THREE.Object3D], info: { style, ground, buildings, roads, walks, waterAreas, trees, triangles, bounds } }.
   *  Each object has userData.kind ('site-ground', 'site-skirt', 'site-boundary', 'site-arrow', 'site-buildings',
   *  'site-building-edges', 'site-roads', 'site-walks', 'site-water', 'site-water-lines', 'site-trees') and userData.site = true;
   *  userData.casts / userData.receives say which shadow flags setShadows() turns on. */
  function objects(data, opts = {}) {
    const info = { style: 'solid', ground: false, buildings: 0, roads: 0, walks: 0, waterAreas: 0, trees: 0, triangles: 0, bounds: data && data.bounds ? { ...data.bounds } : null };
    const out = [], mats = [];
    if (!data || !data.ok) return { objects: out, info };
    const parts = new Set(Array.isArray(opts.parts) ? opts.parts : ALL_PARTS);
    const identity = typeof opts.zOf !== 'function';
    const o = {
      zOf: identity ? (z) => z : opts.zOf, identity,
      css: typeof opts.css === 'function' ? opts.css : defaultCss,
      edges: opts.edges !== false, rotation: opts.rotation || 0,
      hasGround: !!data.ground,
      style: STYLES.includes(opts.style) ? opts.style : 'solid',
    };
    info.style = o.style;
    const sampler = makeSampler(data.ground);
    const zAt = typeof opts.zAt === 'function' ? opts.zAt : (sampler || (() => 0));
    if (parts.has('ground')) { buildGround(data, o, mats, out, info); info.ground = !!data.ground; }
    if (parts.has('boundary')) buildBoundary(data, o, mats, out, zAt);
    if (parts.has('buildings')) buildBuildings(data, o, mats, out, info);
    if (parts.has('roads')) buildPavement(data.roads, '--scene-road', 0.3, -2, 'site-roads', o, mats, out, info, zAt);
    if (parts.has('walks')) buildPavement(data.walks, '--scene-walk', 0.45, -4, 'site-walks', o, mats, out, info, zAt);
    if (parts.has('water')) buildWater(data, o, mats, out, info);
    if (parts.has('trees')) buildTrees(data, o, mats, out, info, zAt);
    info.triangles = Math.round(info.triangles);
    const shadows = opts.shadows !== false;
    for (const obj of out) {
      obj.userData.ownMaterials = mats;             // all of this call's materials; dispose() frees them once
      obj.castShadow = shadows && !!obj.userData.casts;
      obj.receiveShadow = shadows && !!obj.userData.receives;
    }
    return { objects: out, info };
  }

  /** Disposes the geometries and the own materials of objects made by objects(). Safe to call twice. */
  function dispose(objs) {
    const done = new Set();
    for (const o of objs || []) {
      if (o.geometry) o.geometry.dispose();
      if (o.isInstancedMesh) o.dispose();
      const list = o.userData && o.userData.ownMaterials;
      if (list && !done.has(list)) { done.add(list); list.forEach((m) => m.dispose()); }
    }
  }

  /** Turns the shadow flags of objects made by objects() on or off (casters only when `cast`, receivers only when `receive`). */
  function setShadows(objs, cast, receive) {
    for (const o of objs || []) {
      if (!o.userData || !o.userData.site) continue;
      o.castShadow = !!cast && !!o.userData.casts;
      o.receiveShadow = !!receive && !!o.userData.receives;
    }
  }

  /** The cache key for a tool's syncLayer: `${siteUpdatedAt}|${x},${y},${rot},${baseZ}|${showFlags}|${themeEpoch}|${style}`.
   *  doc: the project document (or null); show: a string or an object of flags; style: the site style ('solid' when missing). */
  function keyFor(doc, placement, show, themeEpoch, style) {
    let stamp = '';
    try {
      const sec = ProjectMod.getSection(doc, 'site');
      if (sec) {
        const dv = sec.derived || {};
        stamp = `${sec.updatedAt || ''}#${dv.ground ? dv.ground.n : 0}.${(dv.buildings || []).length}`;
      }
    } catch (e) { stamp = ''; }
    const p = placement || {};
    const flags = show && typeof show === 'object' ? Object.keys(show).sort().map((k) => `${k}=${show[k] ? 1 : 0}`).join(',') : String(show === undefined ? '' : show);
    return `${stamp}|${p.x || 0},${p.y || 0},${p.rotation || 0},${p.baseZ || 0}|${flags}|${themeEpoch || 0}|${STYLES.includes(style) ? style : 'solid'}`;
  }

  /** The box a view frames when a site is open: the building box grown by max(150 ft, 0.6 x its larger plan span) on every side,
   *  then clamped to the site square, so the site runs past the edges of the view. A building that sticks out of the square stays inside the box.
   *  b, sb: { minX, maxX, minY, maxY } (b may carry height and minZ, which are kept). → a new box. */
  function frameAround(b, sb) {
    const span = Math.max(b.maxX - b.minX, b.maxY - b.minY);
    const m = Math.max(150, 0.6 * span);
    return {
      ...b,
      minX: Math.min(b.minX, Math.max(b.minX - m, sb.minX)), maxX: Math.max(b.maxX, Math.min(b.maxX + m, sb.maxX)),
      minY: Math.min(b.minY, Math.max(b.minY - m, sb.minY)), maxY: Math.max(b.maxY, Math.min(b.maxY + m, sb.maxY)),
    };
  }

  return { objects, dispose, setShadows, keyFor, makeSampler, frameAround, STYLES };
})();

/* ==========================================================================
   PROJECT (view only)
   Opens a saved project for reading (?project=<id> or the Project menu), or a project file in memory. This part has NO write path:
   it never calls writeSection, saveProject or importProject (which saves), and it never sets or removes a project key.
   It reads with listProjects and loadProject, and it saves a copy of the open project to disk only through Export (a download).
   An imported file stays in memory only: the project is not in the list, so the "Edit in" links are off for it.
   ========================================================================== */
const ViewerProject = (() => {
  const storage = (() => { try { return window.localStorage; } catch (e) { return null; } })();
  const listeners = [];
  let note = '';
  const notice = (m) => { note = m; Toast.show(m, 'warn', 6000); };
  const emit = () => listeners.forEach((fn) => { try { fn(); } catch (e) { console.error(e); } });

  function list() {
    if (!storage) return [];
    try { return ProjectMod.listProjects(storage, { onNotice: notice }); } catch (e) { return []; }
  }
  function open(id) {
    note = '';
    if (!storage) { notice('This browser does not give the page its saved projects.'); return false; }
    let doc = null;
    try { doc = ProjectMod.loadProject(storage, id, { onNotice: notice }); } catch (e) { doc = null; }
    if (!doc) { if (!note) notice('This project could not be opened.'); return false; }
    note = '';
    openDoc(doc, 'saved');
    try { history.replaceState(null, '', `?project=${encodeURIComponent(doc.id)}${TEST_MODE ? '&test' : ''}`); } catch (e) { /* the address stays as it is */ }
    return true;
  }
  /** Shows a project document. src: 'saved' | 'file'. The document is read, never changed. */
  function openDoc(doc, src = 'file') {
    Model.load(doc, src);
    Render.select(null);
    for (const id of TOGGLE_LAYERS) if (!Model.hasData(id)) { /* a layer without data stays off in the list; its toggle is disabled */ }
    State.changed();
    emit();
    return true;
  }
  function close() { Model.load(null); Render.select(null); State.changed(); emit(); try { history.replaceState(null, '', location.pathname + (TEST_MODE ? '?test' : '')); } catch (e) { /* ignore */ } }

  /** Reads a project file into memory. Resolves { doc }. Rejects with a message for the person. Nothing is saved. */
  async function importFile(file) {
    if (!file) throw new Error('No file was chosen.');
    if (typeof file !== 'string' && typeof file.size === 'number' && file.size > 8 * 1024 * 1024) throw new Error('That file is too large to be a project file.');
    let text;
    try { text = typeof file === 'string' ? file : await file.text(); } catch (e) { throw new Error('The file could not be read.'); }
    let obj;
    try { obj = JSON.parse(text.charCodeAt(0) === 0xfeff ? text.slice(1) : text); } catch (e) { throw new Error('This file is not valid JSON, so it is not a project file.'); }
    if (!obj || typeof obj !== 'object' || obj.format !== ProjectMod.FORMAT) throw new Error('This file is not a design tools project file.');
    if (Number.isFinite(obj.version) && obj.version > ProjectMod.VERSION) throw new Error('This file was made by a newer version of the design tools. Update the tools and try again.');
    const doc = ProjectMod.migrate(obj);
    const check = ProjectMod.validate(doc);
    if (!check.ok) throw new Error(`This project file is not valid: ${check.errors[0]}.`);
    openDoc(doc, 'file');
    return { doc };
  }
  function pickFile() { const input = $('projFile'); input.value = ''; input.click(); }
  async function onFile(e) {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    try { await importFile(f); Toast.show('The file is open in the viewer only. It is not saved to your project list.'); } catch (err) { Toast.show(err && err.message ? err.message : 'The file could not be opened.', 'bad', 6000); }
  }

  /** Downloads the open project as a .cmrlm.json file (a copy; nothing is saved in the browser). */
  function exportFile() {
    const doc = Model.doc();
    if (!doc) return null;
    const out = ProjectMod.exportProject(doc);
    if (out.blob) {
      const url = URL.createObjectURL(out.blob);
      const a = h('a', { href: url, download: out.filename });
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      Toast.show('Project file saved to your downloads.');
    }
    return out;
  }

  const when = (iso) => { const d = new Date(iso); return Number.isFinite(d.getTime()) ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : ''; };
  /** The project list as buttons (the empty state and the Project menu). */
  function listButtons(onPick) {
    const items = list();
    if (!items.length) return [h('p', { class: 'help empty-none' }, 'There are no saved projects in this browser. Make one in a tool, or import a project file.')];
    return items.map((p) => h('button', { class: 'pop-item proj-row', type: 'button', 'data-project': p.id, onclick: () => { if (onPick) onPick(); open(p.id); } },
      h('span', { class: 'grow' }, p.name, h('small', null, [when(p.updatedAt), p.bytes ? `${Math.round(p.bytes / 1024)} KB` : ''].filter(Boolean).join(', ')))));
  }
  function openMenu(anchor) {
    const el = h('div', { role: 'menu', id: 'projectMenu' });
    el.append(h('div', { class: 'label pop-label' }, 'Open'), ...listButtons(() => Pop.close()),
      h('div', { class: 'pop-sep' }),
      h('button', { class: 'pop-item', type: 'button', id: 'miImport', onclick: () => { Pop.close(); pickFile(); } }, h('span', { class: 'grow' }, 'Import', h('small', null, 'Open a project file. It is not saved.'))),
      h('button', { class: 'pop-item', type: 'button', id: 'miExportProject', disabled: !Model.doc(), onclick: () => { Pop.close(); exportFile(); } }, h('span', { class: 'grow' }, 'Export', h('small', null, 'Download this project as a file'))));
    Pop.open(anchor, el);
  }

  function start() {
    $('projFile').addEventListener('change', onFile);
    $('emptyImport').addEventListener('click', pickFile);
    const id = ProjectMod.projectIdFromUrl(location);
    if (id && !TEST_MODE) { if (!open(id)) emit(); } else emit();
  }
  return { list, open, openDoc, close, importFile, exportFile, openMenu, listButtons, start, onChange: (fn) => listeners.push(fn), notice: () => note, hasStorage: () => !!storage };
})();

/* ==========================================================================
   EXPORTS
   Shots: Image and AI-ready image (ShotMod). FileExports: the SketchUp file (ViewerSketchup). Prompts: the AI Prompts panel.
   Every action returns what it made and takes { deliver } so tests can catch the file instead of downloading it.
   ========================================================================== */
const Shots = (() => {
  const prefersDark = () => !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  function keyMetrics() {
    const m = Model.hud(), out = [];
    if (m.gfa) out.push(['GFA', m.gfa]);
    if (m.units) out.push(['Units', m.units]);
    if (m.stalls) out.push(['Stalls', m.stalls]);
    if (m.efficiency) out.push(['Efficiency', m.efficiency]);
    if (m.far) out.push(['FAR', m.far]);
    out.push(['Caution', 'Design-stage numbers. No code check.']);
    return out;
  }
  function buildOverlay() {
    return { theme: prefersDark() ? 'dark' : 'light', title: Model.hud().name, date: true, metrics: keyMetrics(), mark: 'CMRLM' };
  }
  async function capture({ deliver = false, scale = 2 } = {}) {
    const blob = await Render.capture(buildOverlay(), scale);
    if (deliver) {
      const result = await ShotMod.deliverImage(blob, ShotMod.screenshotFilename(Model.hud().name));
      if (result === 'downloaded') Toast.show('Image saved to your downloads.');
    }
    return blob;
  }
  async function take() {
    if (!Model.doc()) { Toast.show('Open a project first.', 'warn'); return null; }
    try { return await capture({ deliver: true }); } catch (e) { console.error(e); Toast.show(e && e.message ? e.message : 'The image could not be made.', 'bad', 6000); return null; }
  }
  /** The AI-ready picture: no overlay, grid, marks or selection; a plain light sky; the project building amber, the rest white. */
  async function aiReady({ deliver = true, scale = 2 } = {}) {
    const blob = await Render.captureClean(scale);
    if (deliver) {
      const result = await ShotMod.deliverImage(blob, ShotMod.screenshotFilename(`${Model.hud().name}-ai-ready`));
      if (result === 'downloaded') Toast.show('AI-ready image saved to your downloads.');
    }
    return blob;
  }
  async function takeAiReady() {
    if (!Model.doc()) { Toast.show('Open a project first.', 'warn'); return null; }
    try { return await aiReady({ deliver: true }); } catch (e) { console.error(e); Toast.show(e && e.message ? e.message : 'The image could not be made.', 'bad', 6000); return null; }
  }
  return { take, capture, aiReady, takeAiReady, buildOverlay, keyMetrics };
})();

const FileExports = (() => {
  const save = (blob, name) => {
    const url = URL.createObjectURL(blob);
    const a = h('a', { href: url, download: name, style: 'display:none' });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  };
  /** The SketchUp document for the layers that are on now (the level cut does not change it: it holds the whole project). */
  function sketchupDoc() {
    const doc = Model.doc();
    if (!doc) throw new Error('No project is open.');
    return ViewerSketchup.viewerToSketchup(doc, State.get('layers'), { name: doc.name });
  }
  function sketchup({ deliver } = {}) {
    let d;
    try { d = sketchupDoc(); } catch (e) { console.error(e); Toast.show('The SketchUp file could not be built.', 'bad'); return { ok: false, errors: [String(e && e.message)] }; }
    const v = SkFmt.validateDoc(d);
    if (!v.ok) { console.error(v.errors); Toast.show('The SketchUp file did not pass its own check, so it was not saved.', 'bad'); return { ok: false, errors: v.errors }; }
    if (!v.counts.solid && !v.counts.mesh && !v.counts.lines) { Toast.show('Nothing is on. Turn on a layer first.', 'warn'); return { ok: false, errors: ['empty'] }; }
    const name = SkFmt.sketchupFilename(Model.hud().name);
    const blob = SkFmt.docToBlob(d);
    (deliver || save)(blob, name);
    if (!deliver) Toast.show(`Saved ${name}. In SketchUp: Extensions > CMRLM > Import Design Tools file.`);
    return { ok: true, filename: name, blob, counts: v.counts };
  }
  return { sketchupDoc, sketchup, save };
})();

/* ---- AI Prompts: pick a prompt, pick the words it uses, copy the text. Pair it with the AI-ready image. ---- */
const Prompts = (() => {
  const { PROMPTS, fillPrompt } = PromptsMod;
  const FIELDS = PromptsMod.PROMPT_FIELDS;
  const GROUPS = [['hero', 'Hero'], ['time', 'Time'], ['material', 'Material'], ['context', 'Context'], ['camera', 'Camera']];
  const ui = { open: false, el: null, back: null, id: PROMPTS[0].id, values: {} };

  /** The words the prompt fills in by itself, from the massing section of the open project. */
  function autoValues() {
    const doc = Model.doc();
    const sec = doc ? ProjectMod.getSection(doc, 'massing') : null;
    const dv = sec && sec.derived && typeof sec.derived === 'object' ? sec.derived : {};
    const levels = Array.isArray(dv.levels) ? dv.levels : [];
    const m = dv.metrics || {};
    const floors = Number.isFinite(m.floors) ? m.floors : levels.length;
    const height = Number.isFinite(m.height) ? m.height : levels.reduce((s, l) => s + (Number.isFinite(l && l.ftf) ? l.ftf : 10), 0);
    const progs = levels.map((l) => (l && typeof l.program === 'string' ? l.program : null)).filter(Boolean);
    const top = progs.length ? progs[progs.length - 1] : null;
    let podium = 0;
    while (podium < progs.length && progs[podium] !== top) podium++;
    if (podium >= progs.length) podium = 0;
    const program = top === 'residential' ? 'residential' : top || 'mixed-use';
    let hero = '';
    try { hero = PromptsMod.heroFor('tower', sec && sec.state, { floorCount: floors, totalHeight: height }); } catch (e) { hero = ''; }
    return {
      form: floors ? `a ${floors}-floor ${program} building` : 'this massing',
      floors: String(floors || 0), height: `${Math.round(height)} feet`, program,
      podium: podium ? `a ${podium}-story podium` : 'no podium',
      hero, heroColor: CONFIG.heroColorName,
    };
  }
  const prompt = () => PROMPTS.find((p) => p.id === ui.id) || PROMPTS[0];
  const fieldValue = (key) => {
    const f = FIELDS[key], v = ui.values[key];
    return v != null && f.options.some((o) => o.value === v) ? v : (f.default != null ? f.default : f.options[0].value);
  };
  function textFor(p, overrides) {
    const values = { ...autoValues() };
    for (const k of Object.keys(FIELDS)) values[k] = fieldValue(k);
    return fillPrompt(p, { ...values, ...(overrides || {}) });
  }
  const wordCount = (t) => (t.trim() ? t.trim().split(/\s+/).length : 0);

  function render() {
    const el = ui.el;
    el.textContent = '';
    const p = prompt();
    const steps = h('div', { class: 'ai-steps' },
      h('div', { class: 'ai-step-row' },
        h('button', { class: 'btn outline step', type: 'button', id: 'aiStepImage', onclick: () => Shots.takeAiReady() }, '1. Save the AI-ready image'),
        h('button', { class: 'btn solid step', type: 'button', id: 'aiStepCopy', onclick: () => copy() }, '2. Copy the prompt')),
      h('p', { class: 'help' }, 'Paste the image and the prompt into ChatGPT or Gemini. The project building is amber in the image. The prompt says which parts stay as drawn.'));
    const body = h('div', { class: 'ai-body' });
    const chips = h('div', { class: 'chips', id: 'aiPromptChips' });
    for (const [g, label] of GROUPS) {
      const list = PROMPTS.filter((q) => q.group === g);
      if (!list.length) continue;
      const row = h('div', { class: 'ai-row' }, h('span', { class: 'ai-row-label' }, label), h('div', { class: 'chips' }));
      for (const q of list) row.lastChild.append(h('button', { class: 'chip', type: 'button', 'aria-pressed': String(q.id === ui.id), 'data-prompt': q.id, onclick: () => { ui.id = q.id; render(); } }, q.title));
      body.append(row);
    }
    body.append(h('p', { class: 'ai-ddesc' }, p.description || ''));
    const uses = (p.uses || []).filter((k) => FIELDS[k]);
    const pick = h('div', { class: 'ai-fields' });
    for (const k of uses) {
      const f = FIELDS[k], row = h('div', { class: 'ai-row' }, h('span', { class: 'ai-row-label' }, f.label), h('div', { class: 'chips' }));
      for (const o of f.options) row.lastChild.append(h('button', { class: 'chip', type: 'button', 'aria-pressed': String(fieldValue(k) === o.value), 'data-field': k, onclick: () => { ui.values[k] = o.value; render(); } }, o.label));
      pick.append(row);
    }
    body.append(pick);
    const text = textFor(p);
    body.append(h('div', { class: 'ai-preview-wrap' }, h('div', { class: 'ai-count', id: 'aiCount' }, `${wordCount(text)} words`),
      h('textarea', { class: 'ai-preview', id: 'aiPreview', readonly: true, 'aria-label': 'The prompt text' }, text)));
    el.append(h('div', { class: 'ai-head' }, h('h2', null, 'AI Prompts'), h('button', { class: 'ibtn', type: 'button', id: 'aiClose', 'aria-label': 'Close AI Prompts', html: ICONS.x, onclick: close })), steps, body);
    $('aiPreview').value = text;
  }
  async function copy() {
    const text = textFor(prompt());
    try { await navigator.clipboard.writeText(text); Toast.show('The prompt is on your clipboard.'); } catch (e) {
      const ta = $('aiPreview'); if (ta) { ta.focus(); ta.select(); }
      try { document.execCommand('copy'); Toast.show('The prompt is on your clipboard.'); } catch (e2) { Toast.show('Select the text and copy it.', 'warn'); }
    }
    return text;
  }
  function open() {
    if (!ui.el) {
      ui.back = h('div', { class: 'ai-back', id: 'aiBack', onclick: close, hidden: true });

    const items = [['axon', 'Axon'], ['n', 'N'], ['e', 'E'], ['s', 'S'], ['w', 'W'], ['plan', 'Plan']];
    const labels = { axon: 'Axonometric view', n: 'North elevation', e: 'East elevation', s: 'South elevation', w: 'West elevation', plan: 'Plan view' };
    for (const [id, text] of items) nav.append(h('button', { type: 'button', 'data-view': id, 'aria-pressed': 'false', title: labels[id], 'aria-label': labels[id], onclick: () => Render.setView(id, true) }, text));
    Render.onViewChange((active) => nav.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.view === active ? 'true' : 'false')));
  }

  /* ---- the empty state and the project label ------------------------------------------------------------- */
  function syncEmpty() {
    const has = !!Model.doc();
    $('emptyState').hidden = has;
    $('views').hidden = !has;
    const list = $('emptyList');
    list.textContent = '';
    if (!has) list.append(...ViewerProject.listButtons());
    const pill = $('projPill');
    pill.hidden = !has;
    if (has) { pill.textContent = Model.source() === 'file' ? `${Model.hud().name} (file, not saved)` : Model.hud().name; pill.title = pill.textContent; }
    setText('projLabel', 'Project');
    document.title = has ? `${Model.hud().name} - Model Viewer` : 'Model Viewer';
  }

  /* ---- sync ---------------------------------------------------------------------------------------------- */
  function syncMode() {
    $('styleToggle').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.style === State.get('mode') ? 'true' : 'false'));
  }
  function syncAll() {
    syncMode(); syncLayers(); syncLevels(); syncView(); syncHud(); syncLegend(); checkSelection();
  }
  let builtFor = -1;
  function rebuildForModel() {
    builtFor = Model.version();
    buildLayers(); buildLevels(); buildView(); buildSummary();
    showCard(null);
    syncEmpty();
    for (const t of TABS) $(`tabpanel-${t.id}`).hidden = t.id !== activeTab;
    syncAll();
  }

  /* ---- the bottom sheet (iPad portrait and narrow screens) ------------------------------------------------- */
  function initSheet() {
    const app = $('app'), grabber = $('grabber');
    const GRAB = 44;
    const total = () => app.clientHeight;
    const lowest = () => GRAB + ($('panelTabs').offsetHeight || 45) + 2;
    const snaps = () => [lowest(), Math.round(total() * 0.42), Math.round(total() * 0.86)];
    const setH = (px) => app.style.setProperty('--sheet-h', `${Math.round(clamp(px, lowest(), total() * 0.9))}px`);
    const curH = () => $('panel').getBoundingClientRect().height;
    const animateTo = (to) => {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return setH(to);
      const from = curH(), t0 = performance.now();
      const step = (now) => { const p = clamp((now - t0) / 180, 0, 1); setH(from + (to - from) * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    };
    let drag = null;
    grabber.addEventListener('pointerdown', (e) => { grabber.setPointerCapture(e.pointerId); drag = { y: e.clientY, h: curH(), moved: false }; });
    grabber.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const dy = drag.y - e.clientY;
      if (Math.abs(dy) > 4) drag.moved = true;
      if (drag.moved) setH(drag.h + dy);
    });
    const end = () => {
      if (!drag) return;
      const s = snaps(), now = curH();
      if (!drag.moved) animateTo(s.find((v) => v > now + 8) || s[0]);
      else animateTo(s.reduce((a, b) => (Math.abs(b - now) < Math.abs(a - now) ? b : a)));
      drag = null;
    };
    grabber.addEventListener('pointerup', end);
    grabber.addEventListener('pointercancel', end);
    grabber.addEventListener('keydown', (e) => { if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return; e.preventDefault(); setH(curH() + (e.key === 'ArrowUp' ? 60 : -60)); });
    const reset = () => { if (sheetQuery.matches) setH(total() * 0.42); else app.style.removeProperty('--sheet-h'); };
    (sheetQuery.addEventListener ? sheetQuery.addEventListener('change', reset) : sheetQuery.addListener(reset));
    reset();
    window.addEventListener('resize', () => { if (sheetQuery.matches) { const px = parseFloat(app.style.getPropertyValue('--sheet-h')); if (px) setH(px); } });
    sheetRaise = () => { if (sheetQuery.matches && curH() < lowest() + 24) animateTo(snaps()[1]); };
  }

  function init() {
    buildTopBar();
    buildTabs();
    buildViews();
    buildHud();
    initSheet();
    setTab(activeTab, { remember: false });
    Render.onPick((item) => select(item));
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !Pop.isOpen() && !Prompts.isOpen() && Render.selectedId()) select(null); });
    State.subscribe(syncAll);
    ViewerProject.onChange(() => { rebuildForModel(); });
    rebuildForModel();
  }
  /** For tests. */
  return {
    init, setTab, activeTab: () => activeTab, select, showCard, toolFor, rebuildForModel, syncAll,
    cardInfo: () => { const c = $('selection-card'); return { visible: !c.hidden, title: ($('cardTitle') || {}).textContent || '', text: c.textContent, edit: $('cardEdit') ? $('cardEdit').getAttribute('href') : null }; },
  };
})();
