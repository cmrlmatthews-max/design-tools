    out[id] = { ...L, items };
  }
  out.cutZ = cutZ;
  return out;
}

/* ---------- colors ---------- */

const PROGRAM_COLORS = { residential: "#4f7fd1", hotel: "#8a63c9", office: "#2f9e9a", retail: "#d9a22b", amenity: "#58a65c", parking: "#8b929a", mechanical: "#e0762f" };
const UNIT_COLORS = { Studio: "#9cc3e6", "1BR": "#4f7fd1", "1BR + den": "#6b5fc7", "2BR": "#2f9e9a", "3BR": "#d9a22b", King: "#8a63c9", "Double queen": "#b48ad9", Suite: "#5b3f99" };
const SYSTEM_COLORS = { punched: "#b59a7b", "window-wall": "#5aa7d8", "curtain-wall": "#3d8fcf", storefront: "#2f9e9a", solid: "#a3a8ae" };
const STALL_COLORS = { standard: "#5f6b79", compact: "#7d8794", accessible: "#2f6fb5", van: "#1d4f8a", ev: "#2f9e5b" };
const LAYER_COLORS = { site: "#c9cdd2", massing: "#8b929a", units: "#4f7fd1", cores: "#7b838b", parking: "#9aa1a9", facade: "#5aa7d8", grading: "#a85a12", sun: "#e0a458" };
const KIND_COLORS = { corridor: "#d9dadc", core: "#8f959c", stair: "#6f757c", elevator: "#a3a8ae", slab: "#a9afb6", ramp: "#e0a21b", wall: "#c4c8cc", neighbor: "#c9cdd2" };
const EXTRA = ["#4f7fd1", "#2f9e9a", "#d9a22b", "#8a63c9", "#58a65c", "#e0762f", "#b48ad9", "#6b5fc7"];

function hashColor(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return EXTRA[h % EXTRA.length]; }

/** The hex color of a palette key made by colorKey. */
function colorOf(key) {
  const k = String(key || "");
  const i = k.indexOf(":"), kind = i < 0 ? k : k.slice(0, i), name = i < 0 ? "" : k.slice(i + 1);
  if (kind === "program") return PROGRAM_COLORS[name] || hashColor(name);
  if (kind === "unit") return UNIT_COLORS[name] || hashColor(name);
  if (kind === "facade") return SYSTEM_COLORS[name] || SYSTEM_COLORS.solid;
  if (kind === "stall") return STALL_COLORS[name] || STALL_COLORS.standard;
  if (kind === "kind") return KIND_COLORS[name] || "#9aa3ad";
  if (kind === "layer") return LAYER_COLORS[name] || "#9aa3ad";
  return "#9aa3ad";
}

/** The palette key of an item. mode: "program" | "unitType" | "source". */
function colorKey(item, mode) {
  const it = item || {};
  if (it.kind === "stall") return `stall:${it.stall || "standard"}`;
  if (it.layer === "facade") return `facade:${it.system || "solid"}`;
  if (mode === "source") return `layer:${it.layer || "site"}`;
  if (mode === "unitType" && it.type) return `unit:${it.type}`;
  if (mode !== "unitType" && it.program) return `program:${it.program}`;
  if (it.layer === "cores" || it.layer === "parking" || it.layer === "grading" || it.layer === "site") return KIND_COLORS[it.kind] ? `kind:${it.kind}` : `layer:${it.layer}`;
  if (it.type) return `unit:${it.type}`;
  return `layer:${it.layer || "massing"}`;
}

return { HIDDEN_LAYERS, LAYER_IDS, LAYER_LABELS, LAYER_TOOLS, TOOL_NAMES, DEFAULT_ON, DEFAULT_FTF, SLAB, BAND, WALL_T, cleanRing, ringArea, sunSamples, layersFrom, levelsIndex, cutAt, PROGRAM_COLORS, UNIT_COLORS, colorOf, colorKey };
})();

/* ---- src/viewer/summary.js ---- */
const ViewerSummary = (() => {
/* ==========================================================================
   viewer/summary.js — Model Viewer: the project summary table and the stale flags
   (docs/model-viewer-technical-plan.md section 3).

   summary(doc)    → rows [{ id, group, label, value, text }]; value is a number (or a string for text rows), text is what the table shows.
                     Every number comes from the section's derived.metrics (a sum over the levels only when the metrics are missing).
   staleFlags(doc) → [{ section, message }]

   Rules: pure, no DOM, never mutates the document, no NaN. The numbers are design-stage numbers. Nothing here checks a code.
   ========================================================================== */

const { getSection } = ProjectMod;

const isObj = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
const fin = (v) => typeof v === "number" && Number.isFinite(v);
const grouped = (v, d = 0) => v.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const dv = (doc, key) => { const s = getSection(doc, key); return s && isObj(s.derived) && Object.keys(s.derived).length ? s.derived : null; };
const mt = (d) => (d && isObj(d.metrics) ? d.metrics : {});

function ringArea(r) {
  let a = 0;
  for (let i = 0, n = r.length; i < n; i++) { const p = r[i], q = r[(i + 1) % n]; a += p[0] * q[1] - q[0] * p[1]; }
  return Math.abs(a / 2);
}

/** The summary rows of a project, in pipeline order. An empty project gives the project row only.
 *  The Facade Studio is hidden (October 26, 2026): its rows come only with opts.includeHidden. */
function summary(doc, opts) {
  const includeHidden = !!(opts && opts.includeHidden);
  const rows = [];
  const row = (id, group, label, value, text) => { if (value === null || value === undefined || (typeof value === "number" && !Number.isFinite(value))) return; rows.push({ id, group, label, value, text: text === undefined ? String(value) : text }); };
  const num = (id, group, label, v, d = 0, unit = "") => { if (fin(v)) row(id, group, label, v, `${grouped(v, d)}${unit}`); };

  const frame = doc && isObj(doc.frame) ? doc.frame : {};
  const name = doc && typeof doc.name === "string" && doc.name ? doc.name : "Untitled";
  row("project", "Project", "Project", name, `${name}${frame.kind === "site" ? ", with a site" : ", local frame"}`);

  const site = dv(doc, "site");
  if (site) {
    const S = fin(site.size) ? site.size : null;
    let area = null;
    if (Array.isArray(site.boundary) && site.boundary.length >= 3 && site.boundary.every((p) => Array.isArray(p) && fin(p[0]) && fin(p[1]))) area = ringArea(site.boundary);
    else if (S !== null) area = S * S;
    if (area !== null) row("site.area", "Site", "Site area", Math.round(area), `${grouped(area)} sf (${grouped(area / 43560, 2)} acres)`);
    if (fin(site.lat) && fin(site.lon)) row("site.latlon", "Site", "Latitude, longitude", `${site.lat.toFixed(4)}, ${site.lon.toFixed(4)}`);
    const nb = (Array.isArray(site.buildings) ? site.buildings : []).filter((b) => isObj(b) && b.removed !== true).length;
    row("site.buildings", "Site", "Neighbor buildings", nb);
  }

  const mass = dv(doc, "massing");
  if (mass) {
    const m = mt(mass), levels = Array.isArray(mass.levels) ? mass.levels : [];
    num("massing.gfa", "Massing", "Gross floor area", m.gfa, 0, " sf");
    row("massing.floors", "Massing", "Floors", fin(m.floors) ? m.floors : levels.length);
    num("massing.height", "Massing", "Height", fin(m.height) ? m.height : mass.height, 1, " ft");
    if (fin(m.far) && m.far > 0) num("massing.far", "Massing", "FAR", m.far, 2);
    else if (fin(m.far)) row("massing.far", "Massing", "FAR", 0, "No site");
    if (fin(m.siteCoverage) && m.siteCoverage > 0) row("massing.coverage", "Massing", "Site coverage", m.siteCoverage, `${grouped(m.siteCoverage * 100, 1)} percent`);
    else if (fin(m.siteCoverage)) row("massing.coverage", "Massing", "Site coverage", 0, "No site");
    if (fin(m.units)) row("massing.units", "Massing", "Units (estimate)", m.units);
  }

  const plates = dv(doc, "plates");
  if (plates) {
    const m = mt(plates), levels = Array.isArray(plates.levels) ? plates.levels : [];
    const total = fin(m.units) ? m.units : levels.reduce((s, l) => s + (isObj(l) && Array.isArray(l.units) ? l.units.length : 0), 0);
    row("plates.units", "Plates", plates.mode === "hotel" ? "Keys" : "Units", total);
    for (const t of Array.isArray(plates.mix) ? plates.mix : []) {
      if (!isObj(t) || typeof t.type !== "string" || !fin(t.count)) continue;
      row(`plates.mix.${t.type}`, "Plates", t.type, t.count, `${grouped(t.count)}${fin(t.share) ? ` (${grouped(t.share * 100, 0)} percent)` : ""}${fin(t.avgArea) ? `, ${grouped(t.avgArea)} sf each` : ""}`);
    }
    num("plates.nrsf", "Plates", "Net rentable area", m.nrsf, 0, " sf");
    num("plates.gsf", "Plates", "Gross area", m.gsf, 0, " sf");
    if (fin(m.efficiency)) row("plates.efficiency", "Plates", "Efficiency", m.efficiency, `${grouped(m.efficiency * 100, 1)} percent`);
    let flagged = 0;
    for (const l of levels) if (isObj(l)) for (const u of Array.isArray(l.units) ? l.units : []) if (isObj(u) && Array.isArray(u.flags) && u.flags.length) flagged++;
    if (flagged) row("plates.flagged", "Plates", "Units flagged (area high)", flagged);
    if (fin(m.inRange)) row("plates.inRange", "Plates", "Units in range", m.inRange);
  }

  const park = dv(doc, "parking");
  if (park) {
    const m = mt(park), levels = Array.isArray(park.levels) ? park.levels : [];
    const stalls = fin(m.stalls) ? m.stalls : levels.reduce((s, l) => s + (isObj(l) && Array.isArray(l.stalls) ? l.stalls.length : 0), 0);
    row("parking.stalls", "Parking", "Stalls", stalls);
    if (isObj(m.byKind)) for (const k of Object.keys(m.byKind).sort()) if (fin(m.byKind[k])) row(`parking.kind.${k}`, "Parking", `Stalls, ${k}`, m.byKind[k]);
    num("parking.sfPerStall", "Parking", "Area per stall", m.sfPerStall, 0, " sf");
    row("parking.levels", "Parking", "Parking levels", fin(m.levels) ? m.levels : levels.length);
  }

  const fac = includeHidden ? dv(doc, "facade") : null;
  if (fac) {
    const m = mt(fac), faces = Array.isArray(fac.faces) ? fac.faces : [];
    if (fin(m.wwr)) row("facade.wwr", "Facade", "Window-to-wall ratio", m.wwr, `${grouped(m.wwr * 100, 0)} percent`);
    if (isObj(m.wwrByOrientation)) for (const k of ["N", "E", "S", "W"]) if (fin(m.wwrByOrientation[k])) row(`facade.wwr.${k}`, "Facade", `Window-to-wall, ${k}`, m.wwrByOrientation[k], `${grouped(m.wwrByOrientation[k] * 100, 0)} percent`);
    const bal = fin(m.balconyCount) ? m.balconyCount : faces.reduce((s, f) => s + (isObj(f) && fin(f.balconies) ? f.balconies : 0), 0);
    row("facade.balconies", "Facade", "Balconies", bal);
    if (fin(m.groundTransparency)) row("facade.groundTransparency", "Facade", "Ground floor transparency", m.groundTransparency, `${grouped(m.groundTransparency * 100, 0)} percent`);
  }

  const grad = dv(doc, "grading");
  if (grad) {
    const m = mt(grad);
    num("grading.cut", "Grading", "Cut", m.cutCy, 0, " cy");
    num("grading.fill", "Grading", "Fill", m.fillCy, 0, " cy");
    if (fin(m.netCy)) row("grading.net", "Grading", "Net (fill minus cut)", m.netCy, `${m.netCy > 0 ? "+" : ""}${grouped(m.netCy)} cy`);
  }
  return rows;
}

const ms = (t) => { const v = typeof t === "string" ? Date.parse(t) : NaN; return Number.isFinite(v) ? v : null; };

/** Sections that look older than the massing they were made from. [{ section, message }] */
function staleFlags(doc, opts) {
  const includeHidden = !!(opts && opts.includeHidden);
  const out = [];
  const mass = getSection(doc, "massing");
  if (!mass || !dv(doc, "massing")) return out;
  const mAt = ms(mass.updatedAt);
  const plates = getSection(doc, "plates");
  if (plates && dv(doc, "plates")) {
    const stamp = ms(plates.derived.massingUpdatedAt);
    const at = stamp !== null ? stamp : ms(plates.updatedAt);
    if (mAt !== null && at !== null && at < mAt) out.push({ section: "plates", message: "The plates were made from an older massing. Open the Plate Planner to update them." });
    const have = new Set((Array.isArray(mass.derived.levels) ? mass.derived.levels : []).filter((l) => isObj(l)).map((l) => l.index));
    const gone = (Array.isArray(plates.derived.levels) ? plates.derived.levels : []).filter((l) => isObj(l) && !have.has(l.index)).length;
    if (gone) out.push({ section: "plates", message: `The plates have ${gone} level${gone === 1 ? "" : "s"} that the massing no longer has.` });
  }
  for (const [key, text] of [["parking", "The parking deck"], ["facade", "The facade"]]) {
    if (key === "facade" && !includeHidden) continue;
    const s = getSection(doc, key);
    if (!s || !dv(doc, key)) continue;
    const at = ms(s.updatedAt);
    if (mAt !== null && at !== null && at < mAt) out.push({ section: key, message: `${text} was saved before the massing changed. It may be out of date.` });
  }
  return out;
}

return { summary, staleFlags };
})();

/* ---- src/viewer/sketchup.js ---- */
const ViewerSketchup = (() => {
/* ==========================================================================
   viewer/sketchup.js — Model Viewer → ".sketchup.json" (docs/sketchup-spec.md, source "viewer")

   viewerToSketchup(doc, layersOn, meta) → a document made with makeDoc, source "viewer".
     doc       the project document (every section is read through scene.js; nothing is written)
     layersOn  { site, massing, units, cores, parking, grading: true | false }; missing keys use DEFAULT_ON
     meta      optional { createdAt, name }

   Structure: root group (the project name) > one group per layer that is on and has items:
     Site      one solid per neighbor building, and the site ground as a soft mesh
     Massing   one solid per level plate (levels the plates do not cover)
     Units     one group per level, one solid per unit (tag = the type name)
     Cores     one group per level, one solid per core piece, stair, elevator or corridor
     Parking   one group per level: the slab solid, the cores, the stalls as one lines node, the ramps as one lines node
     Grading   the proposed ground as a soft mesh and one solid per wall piece
   zShift brings the lowest drawn z to 0. Units: feet, project frame (x east, y north).
   Pure: no DOM, no input mutation.
   ========================================================================== */

const { makeDoc, cleanRing2 } = SkFmt;
const { getSection } = ProjectMod;
const { layersFrom, colorKey, colorOf, LAYER_LABELS, DEFAULT_ON } = ViewerScene;

const SKETCHUP_SOURCE = "viewer";

const r3 = (v) => Math.round(v * 1000) / 1000;
const fin = (v) => typeof v === "number" && Number.isFinite(v);
const attrs = (it) => {
  const a = { id: String(it.id), layer: it.layer };
  if (it.type) a.type = it.type;
  if (it.program) a.program = it.program;
  if (it.level !== undefined) a.level = it.level;
  return a;
};

function meshOf(grid, baseZ) {
  const { n, points } = grid;
  const vertices = points.map((p) => [r3(p[0]), r3(p[1]), r3(p[2] + baseZ)]);
  const triangles = [];
  for (let j = 0; j < n - 1; j++) for (let i = 0; i < n - 1; i++) {
    const a = j * n + i, b = a + 1, c = a + n + 1, d = a + n;
    triangles.push([a, b, c], [a, c, d]);
  }
  return { vertices, triangles };
}

function viewerToSketchup(doc, layersOn, meta) {
  if (!doc || typeof doc !== "object") throw new Error('viewerToSketchup: missing input "doc".');
  const mt = meta || {};
  const on = (id) => (layersOn && id in layersOn ? !!layersOn[id] : !!DEFAULT_ON[id]);
  const L = layersFrom(doc);

  const tagList = [], matList = [], declared = new Set();
  const declare = (name, color) => {
    if (!declared.has(name)) { declared.add(name); tagList.push({ name, color, visible: true }); matList.push({ name, color, alpha: 1 }); }
    return name;
  };
  const solidOf = (it, tagName, color) => {
    const outer = cleanRing2(it.outer);
    if (!outer || !fin(it.z0) || !fin(it.z1) || !(it.z1 - it.z0 > 0.001)) return null;
    const holes = (it.holes || []).map((h) => cleanRing2(h, { hole: true })).filter(Boolean);
    return { type: "solid", name: String(it.id), tag: declare(tagName, color), material: tagName, outer, holes, z0: r3(it.z0), z1: r3(it.z1), attributes: attrs(it) };
  };
  const levelGroups = (items, nameOf, build) => {
    const by = new Map();
    for (const it of items) { const k = it.level; if (!by.has(k)) by.set(k, []); by.get(k).push(it); }
    const out = [];
    for (const k of [...by.keys()].sort((a, b) => a - b)) {
      const kids = build(by.get(k));
      if (kids.length) out.push({ type: "group", name: nameOf(k), children: kids });
    }
    return out;
  };

  const groups = [];
  let zMin = Infinity;
  const track = (z) => { if (fin(z) && z < zMin) zMin = z; };

  if (on("site") && L.site.ok) {
    const kids = [];
    for (const it of L.site.items) { const s = solidOf(it, "Site buildings", colorOf("layer:site")); if (s) { kids.push(s); track(s.z0); } }
    const sec = getSection(doc, "site");
    const g = sec && sec.derived && sec.derived.ground;
    if (g && Array.isArray(g.points) && g.points.length === g.n * g.n && g.points.every((p) => Array.isArray(p) && p.length >= 3 && p.slice(0, 3).every(fin))) {
      const pl = sec.placement && typeof sec.placement === "object" ? sec.placement : {};
      const m = meshOf(g, fin(pl.baseZ) ? pl.baseZ : 0);
      kids.unshift({ type: "mesh", name: "Site ground", tag: declare("Site ground", "#d6dadd"), material: "Site ground", vertices: m.vertices, triangles: m.triangles, soft: true, closed: false });
      for (const v of m.vertices) track(v[2]);
    }
    if (kids.length) groups.push({ type: "group", name: LAYER_LABELS.site, children: kids });
  }
  if (on("massing") && L.massing.items.length) {
    const kids = [];
    for (const it of L.massing.items) { const k = colorKey(it, "program"); const s = solidOf(it, it.program ? it.program : "Massing", colorOf(k)); if (s) { kids.push(s); track(s.z0); } }
    if (kids.length) groups.push({ type: "group", name: LAYER_LABELS.massing, children: kids });
  }
  if (on("units") && L.units.items.length) {
    const kids = levelGroups(L.units.items, (k) => `Level ${k}`, (items) => items.map((it) => { const s = solidOf(it, it.type, colorOf(colorKey(it, "unitType"))); if (s) track(s.z0); return s; }).filter(Boolean));
    if (kids.length) groups.push({ type: "group", name: LAYER_LABELS.units, children: kids });
  }
  if (on("cores") && L.cores.items.length) {
    const label = { corridor: "Corridor", core: "Core", stair: "Stairs", elevator: "Elevators" };
    const kids = levelGroups(L.cores.items, (k) => `Level ${k}`, (items) => items.map((it) => { const tag = label[it.kind] || "Core rooms"; const s = solidOf(it, tag, colorOf(`kind:${it.kind in label ? it.kind : "core"}`)); if (s) track(s.z0); return s; }).filter(Boolean));
    if (kids.length) groups.push({ type: "group", name: LAYER_LABELS.cores, children: kids });
  }
  if (on("parking") && L.parking.items.length) {
    const kids = levelGroups(L.parking.items, (k) => `Parking level ${k}`, (items) => {
      const out = [];
      for (const it of items) {
        if (it.kind === "slab" || it.kind === "core") { const s = solidOf(it, it.kind === "slab" ? "Parking slab" : "Parking cores", colorOf(`kind:${it.kind === "slab" ? "slab" : "core"}`)); if (s) { out.push(s); track(s.z0); } }
      }
      const stalls = items.filter((it) => it.kind === "stall" && it.line3 && it.line3.length >= 4);
      if (stalls.length) { out.push({ type: "lines", name: "Stalls", tag: declare("Parking stalls", colorOf("stall:standard")), lines: stalls.map((s) => s.line3.map((q) => [r3(q[0]), r3(q[1]), r3(q[2])])), attributes: { count: stalls.length } }); stalls.forEach((s) => track(s.line3[0][2])); }
      const ramps = items.filter((it) => it.kind === "ramp" && it.line3 && it.line3.length >= 3);
      if (ramps.length) { out.push({ type: "lines", name: "Ramps", tag: declare("Parking ramps", colorOf("kind:ramp")), lines: ramps.map((s) => s.line3.map((q) => [r3(q[0]), r3(q[1]), r3(q[2])])), attributes: { count: ramps.length } }); ramps.forEach((s) => s.line3.forEach((q) => track(q[2]))); }
      return out;
    });
    if (kids.length) groups.push({ type: "group", name: LAYER_LABELS.parking, children: kids });
  }
  if (on("grading") && L.grading.items.length) {
    const kids = [];
    for (const it of L.grading.items) {
      if (it.kind === "ground") {
        const sec = getSection(doc, "grading"), pl = sec && sec.placement && typeof sec.placement === "object" ? sec.placement : {};
        const m = meshOf(it.grid, fin(pl.baseZ) ? pl.baseZ : 0);
        kids.push({ type: "mesh", name: "Proposed ground", tag: declare("Proposed ground", colorOf("layer:grading")), material: "Proposed ground", vertices: m.vertices, triangles: m.triangles, soft: true, closed: false });
        for (const v of m.vertices) track(v[2]);
      } else { const s = solidOf(it, "Grading walls", colorOf("kind:wall")); if (s) { kids.push(s); track(s.z0); } }
    }
    if (kids.length) groups.push({ type: "group", name: LAYER_LABELS.grading, children: kids });
  }

  const name = String(mt.name || doc.name || "Model Viewer");
  const sitesec = getSection(doc, "site");
  const sd = sitesec && sitesec.derived;
  const location = sd && fin(sd.lat) && fin(sd.lon) ? { lat: sd.lat, lon: sd.lon } : null;
  const frame = doc.frame && typeof doc.frame === "object" ? doc.frame : {};
  const shift = frame.kind === "site" && zMin !== Infinity ? -zMin : 0;
  const notes = [
    "Plan origin = the project frame origin (the southwest corner of the site when the project has a site). x = east, y = north. Lengths in feet.",
    `Model Viewer: ${groups.length} layer${groups.length === 1 ? "" : "s"}: ${groups.map((g) => g.name).join(", ") || "none"}.`,
    "Each layer is one group. Units, cores, and parking are grouped by level. Tags: one per unit type, program, and part.",
    "Caution: the numbers come from design-stage tools. The viewer checks no code.",
  ];
  return makeDoc({
    source: SKETCHUP_SOURCE, name, location, zShift: shift, notes,
    tags: tagList, materials: matList, createdAt: mt.createdAt,
    root: { type: "group", name, children: groups },
  });
}

return { SKETCHUP_SOURCE, viewerToSketchup };
})();


const CONFIG = {
  tool: 'viewer',
  caution: 'Caution: the numbers come from design-stage tools. The viewer checks no code.',
  heroColor: '#E0A458',      // the AI-ready image: the project building draws in this color, everything else stays white
  heroColorName: 'amber',
  modelColor: '#f6f6f3',
  whiteColor: '#f6f6f3',
  uiKey: 'viewer.ui.v1',
  toolPath: (tool, id) => `../${tool}/?project=${encodeURIComponent(id)}`,
};
const $ = (id) => document.getElementById(id);
