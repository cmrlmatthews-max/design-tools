/** Reads and writes that never throw (private mode, blocked storage). */
const Local = {
  get(key, fallback) { try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; } },
};

const Toast = (() => {
  function show(message, kind = '', ms = 3600) {
    const host = $('toasts');
    const t = h('div', { class: `toast ${kind}`.trim() }, message);
    t.addEventListener('click', () => t.remove());
    host.append(t);
    while (host.children.length > 4) host.firstChild.remove();
    if (ms > 0) setTimeout(() => t.remove(), ms);
    return t;
  }
  return { show };
})();

const Pop = (() => {
  let cur = null;
  function close() {
    if (!cur) return;
    const c = cur; cur = null;
    c.el.remove();
    document.removeEventListener('pointerdown', c.onDown, true);
    document.removeEventListener('keydown', c.onKey, true);
    c.anchor.setAttribute('aria-expanded', 'false');
  }
  /** Opens `el` under `anchor`. A second call for the same anchor closes it. */
  function open(anchor, el, { align = 'right' } = {}) {
    const same = cur && cur.anchor === anchor;
    close();
    if (same) return false;
    el.classList.add('pop');
    el.style.visibility = 'hidden';
    document.body.append(el);
    const r = anchor.getBoundingClientRect(), w = el.offsetWidth;
    let left = align === 'right' ? r.right - w : r.left;
    left = clamp(left, 8, Math.max(8, window.innerWidth - w - 8));
    const top = Math.min(r.bottom + 6, window.innerHeight - 120);
    el.style.left = `${left}px`; el.style.top = `${top}px`;
    el.style.visibility = '';
    anchor.setAttribute('aria-expanded', 'true');
    const onDown = (e) => { if (!el.contains(e.target) && !anchor.contains(e.target)) close(); };
    const onKey = (e) => { if (e.key === 'Escape') { close(); anchor.focus(); } };
    document.addEventListener('pointerdown', onDown, true);
    document.addEventListener('keydown', onKey, true);
    cur = { el, anchor, onDown, onKey };
    return true;
  }
  return { open, close };
})();

/* ==========================================================================
   PIPELINE
   Address -> frame -> (ground DEM | Overture release -> three PMTiles themes) -> model.
   Network functions take a fetch function so the in-page tests can inject fakes.
   A failure in one Overture theme marks that step and the rest still renders.
   A ground failure stops the run with a clear message.
   ========================================================================== */
const Pipeline = (() => {
  const { geocode, parseCoordinates } = GeocodeMod;
  const { makeFrame, tilesForBBox } = GeoMod;
  const { demRequestUrl, readFloatTiff } = TiffMod;
  const { latestOvertureRelease, openPMTiles, OVERTURE_BUCKET } = PMTilesMod;
  const { decodeTile } = MvtMod;
  const { buildModel, buildRoads, featuresFromTiles, summarize } = ModelMod;

  const errText = (e) => (e && e.message ? e.message : String(e));
  const netText = (e, what) => (e instanceof TypeError ? `Could not reach the ${what}. Check the connection and try again.` : errText(e));
  const now = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());

  /** DEM for the site box plus margin; about 1 pixel per 3 ft, at most 1024 per side. */
  async function fetchDem(frame, fetchFn) {
    const px = clamp(Math.ceil((frame.size + 2 * CONFIG.demMargin) / CONFIG.demFtPerPixel), 32, CONFIG.demMaxPixels);
    const url = demRequestUrl(frame.bbox(CONFIG.demMargin), px, px);
    let res;
    try { res = await fetchFn(url); } catch (e) { throw new Error(netText(e, 'USGS elevation service')); }
    if (!res.ok) throw new Error(`The USGS elevation service answered HTTP ${res.status}.`);
    const buf = await res.arrayBuffer();
    try { return readFloatTiff(buf); } catch (e) { throw new Error(`The elevation data could not be read (${errText(e)}).`); }
  }

  /** Every tile of one Overture theme that touches the site square, decoded. */
  async function fetchTheme(release, theme, frame, fetchFn) {
    const pm = openPMTiles(`${OVERTURE_BUCKET}/tiles/${release}/${theme}.pmtiles`, { fetchFn });
    let header;
    try { header = await pm.header(); } catch (e) { throw new Error(netText(e, 'Overture map data')); }
    const z = Math.min(header.maxZoom, CONFIG.zoomCap[theme]);
    const list = tilesForBBox(frame.bbox(0), z);
    const out = [];
    await Promise.all(list.map(async (t) => {
      let bytes;
      try { bytes = await pm.getTile(t.z, t.x, t.y); } catch (e) { throw new Error(netText(e, 'Overture map data')); }
      if (bytes) out.push({ z: t.z, x: t.x, y: t.y, layers: decodeTile(bytes) });
    }));
    out.sort((a, b) => a.y - b.y || a.x - b.x);
    return out;
  }

  const THEMES = [['buildings', 'buildings'], ['roads', 'transportation'], ['base', 'base']];   // [step, theme]

  /**
   * @param {{text:string, size:number, loc?:{lat:number,lon:number,label:string}}} req
   *   `loc` skips the address lookup (used by the recent-sites list).
   * @param {(step:string, status:'pending'|'working'|'done'|'error', message?:string)=>void} report
   * @param {{fetchFn?:Function, walks?:boolean}} [opts]
   * @returns {Promise<{loc, frame, dem, tiles, release, model, timings}>}
   */
  async function run(req, report, { fetchFn = (u, o) => fetch(u, o), walks = false } = {}) {
    const t0 = now(), timings = {};
    const mark = (k) => { timings[k] = Math.round(now() - t0); };
    for (const [k] of CONFIG.steps) report(k, 'pending');

    // 1. address
    report('address', 'working', req.loc ? 'Saved site' : 'Looking up the address');
    let loc;
    try { loc = req.loc || await geocode(req.text, { fetchFn }); } catch (e) {
      const msg = e instanceof TypeError ? 'Could not reach the address service. Check the connection.' : errText(e);
      report('address', 'error', msg);
      throw new Error(msg);
    }
    mark('address');
    report('address', 'done', `${loc.lat.toFixed(5)}, ${loc.lon.toFixed(5)}`);
    const frame = makeFrame(loc.lat, loc.lon, req.size);

    // 2. in parallel: ground, release then three themes
    report('ground', 'working', 'Loading elevation');
    const demP = fetchDem(frame, fetchFn).then((dem) => { mark('dem'); return { ok: true, dem }; }, (e) => ({ ok: false, error: errText(e) }));

    report('release', 'working', 'Finding the newest release');
    const relP = latestOvertureRelease({ fetchFn }).then((r) => { mark('release'); report('release', 'done', r); return r; });

    const themeP = THEMES.map(([step, theme]) => {
      report(step, 'working', 'Waiting for the release');
      return relP.then(async (release) => {
        report(step, 'working', 'Loading map tiles');
        const tiles = await fetchTheme(release, theme, frame, fetchFn);
        mark(theme);
        report(step, 'working', `${tiles.length} ${tiles.length === 1 ? 'tile' : 'tiles'} loaded`);
        return { ok: true, tiles };
      }).catch((e) => { report(step, 'error', errText(e)); return { ok: false, tiles: [], error: errText(e) }; });
    });

    const [demR, release, ...themeR] = await Promise.all([demP, relP, ...themeP]);
    if (!demR.ok) {
      report('ground', 'error', demR.error);
      THEMES.forEach(([step], i) => report(step, themeR[i].ok ? 'pending' : 'error', themeR[i].ok ? 'Not built, no ground data' : themeR[i].error));
      throw new Error(`Ground elevation could not be loaded. ${demR.error}`);
    }
    const tiles = themeR.flatMap((r) => r.tiles);

    // 3. model
    THEMES.forEach(([step], i) => { if (themeR[i].ok) report(step, 'working', 'Building the model'); });
    report('ground', 'working', 'Building the ground');
    await new Promise((r) => setTimeout(r, 0));          // let the progress list paint before the model blocks the thread
    const tm = now();
    let model;
    try { model = buildModel(frame, { dem: demR.dem, tiles, walks }); } catch (e) {
      report('ground', 'error', errText(e));
      throw new Error(`Ground elevation could not be used. ${errText(e)}`);
    }
    timings.model = Math.round(now() - tm);
    mark('total');

    const g = model.ground, s = summarize(model), E = model.errors || {};
    report('ground', 'done', `${g.n} by ${g.n} points, ${grouped(s.groundMin, 1)} to ${grouped(s.groundMax, 1)} ft`);
    const fin = (step, ok, err, msg) => {
      if (!ok) return;                                 // already marked as an error
      if (err) report(step, 'error', err); else report(step, 'done', msg);
    };
    fin('buildings', themeR[0].ok, E.features || E.buildings, `${s.buildings} buildings${s.estimated ? `, ${s.estimated} with an estimated height` : ''}`);
    fin('roads', themeR[1].ok, E.features || E.roads, `${model.roads.segments.length} road segments, ${grouped(s.roadsFt)} ft`);
    fin('base', themeR[2].ok, E.features || E.trees || E.water, `${s.trees} trees, ${s.waterAreas} water ${s.waterAreas === 1 ? 'area' : 'areas'}`);

    return { loc, frame, dem: demR.dem, tiles, release, model, timings, failed: THEMES.filter((t, i) => !themeR[i].ok).map((t) => t[0]) };
  }

  /** Rebuild roads with walks from the cached tiles (no refetch). Returns the new roads object. */
  function buildWalks(result) {
    const features = result.features || (result.features = featuresFromTiles(result.tiles, result.frame));
    return buildRoads(features, result.frame, result.model.ground, { walks: true });
  }

  return { run, buildWalks, fetchDem, fetchTheme, parseCoordinates };
})();

/* ==========================================================================
   SCENE
   Three.js view of the site model. Same render style as the Tower Generator:
   white model, dark edges, soft hemisphere + sun light, colors read from the CSS tokens.
   Plan coordinates (x east, y north, elevation up) map to world [x, elevation, -y]
   (north is world -z). planToWorld() and planMatrix() are the only places that write the mapping.
   Vertical scale is the root group's y scale about the ground minimum, so buildings stay on the ground.
   Everything draped on the ground (roads, walks, water lines, trees, outline) samples the ground MESH
   (same triangles as the drawn surface), so nothing floats or sinks.
   ========================================================================== */
function planToWorld(x, y, elev = 0) { return [x, elev, -y]; }
const worldVec = (x, y, e = 0) => new THREE.Vector3(...planToWorld(x, y, e));
/** Matrix for geometry authored in plan space (shape x, y; extrusion up = elevation), lifted by `elev`. */
function planMatrix(elev = 0) {
  return new THREE.Matrix4().set(
    1, 0, 0, 0,
    0, 0, 1, elev,
    0, -1, 0, 0,
    0, 0, 0, 1);
}

const Scene = (() => {
  const FOV = 30;
  const tanHalfFov = Math.tan(rad(FOV) / 2);
  const FIT_MARGIN = 0.04;
  const EDGE_ANGLE = 30;
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  let host, renderer, scene, cam, controls, root, sun, hemi;
  let needsRender = true, capturing = false, tween = null, sceneRadius = 500;
  let site = null;                          // { model, S, gmin, gmax, top, meshAt }
  let vscale = 1, contour = 0;
  const cameraListeners = [];
  const pickListeners = [];
  const TAP_PX = 6, TAP_MS = 500;           // a click selects only when it travels under 6 px and lasts under 500 ms
  let removedSet = new Set();               // ids of removed buildings (base ids, no ~n suffix)
  let pickSets = [];                        // [{ mesh, unit, ranges: [{ b, start, count }] }] for the two merged building meshes
  let removedBuildings = [];                // model buildings that are removed (footprints for picking the outlines)
  let groundMesh = null, selGroup = null, selected = null;
  const raycaster = new THREE.Raycaster();
  const layerVisible = { ground: true, buildings: true, roads: true, walks: false, trees: true, water: true };
  const G = {};                             // layer groups
  const M = {};                             // materials
  const info = { buildings: 0, removed: 0, buildingMeshes: 0, trees: 0, waterAreas: 0, roadTriangles: 0, walkTriangles: 0, triangles: 0 };
  const contourU = { uInterval: { value: 2 }, uOn: { value: 0 }, uContourColor: { value: new THREE.Color('#3a424a') } };

  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const cssColor = (name, fallback = '#888') => new THREE.Color(css(name) || fallback);

  /* ---- materials ----------------------------------------------------------- */
  function makeMaterials() {
    const std = (extra = {}) => new THREE.MeshStandardMaterial({ roughness: 0.94, metalness: 0, ...extra });
    M.ground = std({ vertexColors: true, roughness: 1, polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 2 });
    M.ground.onBeforeCompile = (shader) => {
      Object.assign(shader.uniforms, contourU);
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', '#include <common>\nvarying float vElev;')
        .replace('#include <begin_vertex>', '#include <begin_vertex>\nvElev = position.y;');
      shader.fragmentShader = shader.fragmentShader
        .replace('#include <common>', '#include <common>\nvarying float vElev; uniform float uInterval; uniform float uOn; uniform vec3 uContourColor;')
        .replace('#include <color_fragment>', `#include <color_fragment>
          {
            float c1 = vElev / uInterval;
            float w1 = max(fwidth(c1), 1e-5);
            float d1 = abs(fract(c1 - 0.5) - 0.5) / w1;
            float m1 = (1.0 - smoothstep(0.3, 0.95, d1)) * (1.0 - smoothstep(0.22, 0.5, w1));
            float c5 = c1 / 5.0;
            float w5 = max(fwidth(c5), 1e-5);
            float d5 = abs(fract(c5 - 0.5) - 0.5) / w5;
            float m5 = (1.0 - smoothstep(0.85, 1.6, d5)) * (1.0 - smoothstep(0.22, 0.5, w5));
            float a = max(m1 * 0.5, m5 * 0.9) * uOn;
            diffuseColor.rgb = mix(diffuseColor.rgb, uContourColor, a);
          }`);
    };
    M.ground.customProgramCacheKey = () => 'site-ground-contour';
    M.skirt = std({ roughness: 1 });
    M.building = std();
    M.estimate = std();
    M.edge = new THREE.LineBasicMaterial();
    M.road = std({ roughness: 1, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
    M.walk = std({ roughness: 1, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 });
    M.water = std({ roughness: 0.35, polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3 });
    M.waterLine = new THREE.LineBasicMaterial();
    M.canopy = std({ flatShading: true });
    M.trunk = std();
    M.site = new THREE.LineBasicMaterial();
    M.removed = new THREE.LineDashedMaterial({ dashSize: 8, gapSize: 5 });
    M.selFill = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.35, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3 });
    M.selLine = new THREE.LineBasicMaterial();
  }
  function applyTheme() {
    if (!scene) return;
    scene.background = cssColor('--scene-sky');
    M.skirt.color.copy(cssColor('--scene-skirt'));
    M.building.color.copy(cssColor('--scene-model'));
    M.estimate.color.copy(cssColor('--scene-est'));
    M.edge.color.copy(cssColor('--scene-edge'));
    M.road.color.copy(cssColor('--scene-road'));
    M.walk.color.copy(cssColor('--scene-walk'));
    M.water.color.copy(cssColor('--scene-water'));
    M.waterLine.color.copy(cssColor('--scene-water'));
    M.canopy.color.copy(cssColor('--scene-tree'));
    M.trunk.color.copy(cssColor('--scene-trunk'));
    M.site.color.copy(cssColor('--scene-site'));
    M.removed.color.copy(cssColor('--scene-edge'));
    M.selFill.color.copy(cssColor('--accent'));
    M.selLine.color.copy(cssColor('--accent'));
    contourU.uContourColor.value.copy(cssColor('--scene-contour'));
    M.ground.color.set(0xffffff);
    paintGround();
    needsRender = true;
  }

  /* ---- scene ------------------------------------------------------------------ */
  function buildScene() {
    scene = new THREE.Scene();
    hemi = new THREE.HemisphereLight(0xffffff, 0xb4bac2, 2.0);
    sun = new THREE.DirectionalLight(0xffffff, 1.8);
    scene.add(hemi, sun, sun.target);
    root = new THREE.Group();
    scene.add(root);
    for (const k of ['ground', 'site', 'buildings', 'roads', 'walks', 'trees', 'water']) {
      G[k] = new THREE.Group();
      G[k].visible = k === 'site' ? true : !!layerVisible[k];
      root.add(G[k]);
    }
  }

  function clearGroup(g) {
    for (const o of [...g.children]) {
      g.remove(o);
      if (o.geometry) o.geometry.dispose();
      if (o.isInstancedMesh) o.dispose();
    }
  }

  /* ---- ground mesh -------------------------------------------------------------- */
  let groundGeo = null, skirtGeo = null, skirtBottom = [];

  /** Elevation of the drawn ground surface at (x, y): same two triangles per cell as buildGroundMesh. */
  function makeMeshAt(ground) {
    const { n, spacing: d, z } = ground, L = (n - 1) * d;
    return (x, y) => {
      const cx = clamp(x, 0, L) / d, cy = clamp(y, 0, L) / d;
      const i = Math.min(Math.floor(cx), n - 2), j = Math.min(Math.floor(cy), n - 2);
      const u = cx - i, v = cy - j, o = j * n + i;
      const za = z[o], zb = z[o + 1], zc = z[o + n + 1], zd = z[o + n];
      return u >= v ? za + u * (zb - za) + v * (zc - zb) : za + u * (zc - zd) + v * (zd - za);
    };
  }

  function buildGroundMesh(ground) {
    const { n, xs, ys, z } = ground;
    const pos = new Float32Array(n * n * 3);
    for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
      const k = (j * n + i) * 3;
      pos[k] = xs[i]; pos[k + 1] = z[j * n + i]; pos[k + 2] = -ys[j];
    }
    const idx = new Uint32Array((n - 1) * (n - 1) * 6);
    let q = 0;
    for (let j = 0; j < n - 1; j++) for (let i = 0; i < n - 1; i++) {
      const a = j * n + i, b = a + 1, c = a + n + 1, d = a + n;
      idx[q++] = a; idx[q++] = b; idx[q++] = c;
      idx[q++] = a; idx[q++] = c; idx[q++] = d;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(n * n * 3), 3));
    geo.setIndex(new THREE.BufferAttribute(idx, 1));
    geo.computeVertexNormals();
    groundGeo = geo;
    const mesh = new THREE.Mesh(geo, M.ground);
    mesh.userData.kind = 'ground';
    groundMesh = mesh;
    return mesh;
  }

  function paintGround() {
    if (!groundGeo || !site) return;
    const lo = cssColor('--scene-terrain-lo'), hi = cssColor('--scene-terrain-hi');
    const { z } = site.model.ground, col = groundGeo.getAttribute('color');
    const range = site.gmax - site.gmin, c = new THREE.Color();
    for (let k = 0; k < z.length; k++) {
      c.copy(lo).lerp(hi, range > 0.5 ? (z[k] - site.gmin) / range : 0.5);
      col.setXYZ(k, c.r, c.g, c.b);
    }
    col.needsUpdate = true;
  }

  /** Thin plate under the ground so the site reads as a physical model. Bottom depth stays constant on screen. */
  function buildSkirt(ground) {
    const { n, xs, ys, z } = ground;
    const sides = [
      (k) => [xs[k], ys[0], z[k], 0, -1],                         // south, travelling east
      (k) => [xs[n - 1], ys[k], z[k * n + n - 1], 1, 0],          // east, travelling north
      (k) => [xs[n - 1 - k], ys[n - 1], z[(n - 1) * n + n - 1 - k], 0, 1],   // north, travelling west
      (k) => [xs[0], ys[n - 1 - k], z[(n - 1 - k) * n], -1, 0],   // west, travelling south
    ];
    const pos = [], nor = [], idx = [];
    skirtBottom = [];
    for (const side of sides) {
      const base = pos.length / 3;
      for (let k = 0; k < n; k++) {
        const [x, y, e, nx, ny] = side(k);
        pos.push(x, e, -y, x, e, -y);                 // top, bottom (bottom is set by setSkirtBottom)
        nor.push(nx, 0, -ny, nx, 0, -ny);
        skirtBottom.push(pos.length / 3 - 1);
      }
      for (let k = 0; k < n - 1; k++) {
        const t0 = base + 2 * k, b0 = t0 + 1, t1 = t0 + 2, b1 = t0 + 3;
        idx.push(t0, b0, t1, t1, b0, b1);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
    geo.setIndex(idx);
    skirtGeo = geo;
    setSkirtBottom();
    return new THREE.Mesh(geo, M.skirt);
  }
  function setSkirtBottom() {
    if (!skirtGeo || !site) return;
    const yb = site.gmin - Math.max(8, site.S * 0.03) / vscale;
    const p = skirtGeo.getAttribute('position');
    for (const k of skirtBottom) p.setY(k, yb);
    p.needsUpdate = true;
    skirtGeo.computeBoundingSphere();
  }

  function buildOutline(ground, meshAt) {
    const { n, xs, ys } = ground, pts = [];
    const add = (x, y) => pts.push(worldVec(x, y, meshAt(x, y) + 0.6));
    for (let k = 0; k < n - 1; k++) add(xs[k], ys[0]);
    for (let k = 0; k < n - 1; k++) add(xs[n - 1], ys[k]);
    for (let k = n - 1; k > 0; k--) add(xs[k], ys[n - 1]);
    for (let k = n - 1; k > 0; k--) add(xs[0], ys[k]);
    return new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), M.site);
  }

  /* ---- buildings ------------------------------------------------------------------ */
  const baseId = (id) => String(id).replace(/~\d+$/, '');       // a piece id "x~2" belongs to the feature "x"
  const isRemoved = (b) => removedSet.has(baseId(b.id));

  /** The solid of one building, in world space (null for a bad ring). */
  function buildingGeometry(b) {
    if (!b.ring || b.ring.length < 3) return null;
    const shape = new THREE.Shape(b.ring.map((q) => new THREE.Vector2(q[0], q[1])));
    for (const hole of b.holes || []) if (hole.length >= 3) shape.holes.push(new THREE.Path(hole.map((q) => new THREE.Vector2(q[0], q[1]))));
    const geo = new THREE.ExtrudeGeometry(shape, { depth: b.height + 1, bevelEnabled: false, steps: 1, curveSegments: 1 });
    geo.deleteAttribute('uv');
    geo.applyMatrix4(planMatrix(b.base - 1));
    return geo;
  }

  /** Dashed or plain line segments for the rings of buildings, draped on the ground every 10 ft. `lineDistance` runs along each ring so dashes are even. */
  function drapedRings(list, lift, mat) {
    const pos = [], dist = [];
    for (const b of list) {
      for (const ring of [b.ring, ...(b.holes || [])]) {
        if (!ring || ring.length < 3) continue;
        const pts = densifyRing(trimRing(ring), 10);
        let d = 0;
        for (let i = 0; i < pts.length; i++) {
          const p = pts[i], q = pts[(i + 1) % pts.length], L = Math.hypot(q[0] - p[0], q[1] - p[1]);
          pos.push(p[0], site.meshAt(p[0], p[1]) + lift, -p[1], q[0], site.meshAt(q[0], q[1]) + lift, -q[1]);
          dist.push(d, d + L);
          d += L;
        }
      }
    }
    if (!pos.length) return null;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    if (mat.isLineDashedMaterial) g.setAttribute('lineDistance', new THREE.Float32BufferAttribute(dist, 1));
    return new THREE.LineSegments(g, mat);
  }

  /** Solids for every building that is not removed (two merged meshes with per-building ranges) and one dashed outline object for the removed ones. */
  function buildBuildings(buildings) {
    const data = [], est = [];
    const gone = [];
    pickSets = [];
    let count = 0;
    for (const b of buildings) {
      try {
        if (isRemoved(b)) { if (b.ring && b.ring.length >= 3) gone.push(b); continue; }
        const geo = buildingGeometry(b);
        if (!geo) continue;
        (b.rule === 'estimate' ? est : data).push({ geo, b });
        count++;
      } catch (e) { console.warn('building skipped', b && b.id, e); }
    }
    const out = [];
    for (const [items, mat] of [[data, M.building], [est, M.estimate]]) {
      if (!items.length) continue;
      const list = items.map((it) => it.geo);
      const unit = list[0].index ? 'index' : 'vertex';
      const ranges = [];
      let at = 0;
      for (const it of items) {
        const n = it.geo.index ? it.geo.index.count : it.geo.getAttribute('position').count;
        ranges.push({ b: it.b, start: at, count: n });
        at += n;
      }
      const merged = list.length === 1 ? list[0] : BufferGeometryUtils.mergeGeometries(list, false);
      if (list.length > 1) list.forEach((g) => g.dispose());
      const mesh = new THREE.Mesh(merged, mat);
      mesh.userData.kind = 'buildings';
      pickSets.push({ mesh, unit, ranges });
      out.push(mesh, new THREE.LineSegments(new THREE.EdgesGeometry(merged, EDGE_ANGLE), M.edge));
    }
    removedBuildings = gone;
    if (gone.length) {
      const lines = drapedRings(gone, 0.4, M.removed);
      if (lines) { lines.userData.kind = 'removed'; out.push(lines); }
    }
    info.buildings = count;
    info.removed = gone.length;
    info.buildingMeshes = out.filter((o) => o.isMesh).length;
    return out;
  }

  /* ---- picking and selection ------------------------------------------------------- */
  function inRing(x, y, ring) {
    let inside = false;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const a = ring[i], b = ring[j];
      if ((a[1] > y) !== (b[1] > y) && x < ((b[0] - a[0]) * (y - a[1])) / (b[1] - a[1]) + a[0]) inside = !inside;
    }
    return inside;
  }
  function rangeAt(set, k) {
    const r = set.ranges;
    let lo = 0, hi = r.length - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (r[mid].start <= k) lo = mid; else hi = mid - 1; }
    return r[lo];
  }

  /**
   * The building under a screen point (client coordinates), or null.
   * A solid building gives { id, building, removed: false }. A removed building is found by its dashed footprint on the
   * ground (point in polygon on the ground hit) and gives removed: true. The nearer of the two wins.
   */
  function pick(clientX, clientY) {
    if (!renderer || !site || !layerVisible.buildings) return null;
    const rc = renderer.domElement.getBoundingClientRect();
    if (!rc.width || !rc.height) return null;
    scene.updateMatrixWorld(true);
    cam.updateMatrixWorld();
    raycaster.setFromCamera(new THREE.Vector2(((clientX - rc.left) / rc.width) * 2 - 1, -(((clientY - rc.top) / rc.height) * 2 - 1)), cam);
    let best = null;
    if (pickSets.length) {
      const hits = raycaster.intersectObjects(pickSets.map((p) => p.mesh), false);
      if (hits.length) {
        const hit = hits[0], set = pickSets.find((p) => p.mesh === hit.object);
        if (set && hit.faceIndex != null) {
          const range = rangeAt(set, hit.faceIndex * 3);
          best = { id: range.b.id, building: range.b, removed: false, distance: hit.distance };
        }
      }
    }
    if (removedBuildings.length && groundMesh && layerVisible.ground) {
      const gh = raycaster.intersectObject(groundMesh, false)[0];
      if (gh && (!best || gh.distance < best.distance)) {
        const p = root.worldToLocal(gh.point.clone()), x = p.x, y = -p.z;
        const found = removedBuildings.find((b) => inRing(x, y, b.ring));
        if (found) best = { id: found.id, building: found, removed: true, distance: gh.distance };
      }
    }
    return best ? { id: best.id, building: best.building, removed: best.removed } : null;
  }

  /** Client coordinates of a plan point (x, y, elevation), for tests and overlays. */
  function screenOf(x, y, elev = 0) {
    const rc = renderer.domElement.getBoundingClientRect();
    scene.updateMatrixWorld(true);
    cam.updateMatrixWorld();
    const v = new THREE.Vector3(x, elev, -y).applyMatrix4(root.matrixWorld).project(cam);
    return { x: rc.left + ((v.x + 1) / 2) * rc.width, y: rc.top + ((1 - v.y) / 2) * rc.height };
  }

  function clearSelection() {
    if (!selGroup) return;
    for (const o of [...selGroup.children]) { selGroup.remove(o); if (o.geometry) o.geometry.dispose(); }
  }
  /** Highlights the building with this id (every piece of it), or clears with null. A removed building gets an accent ring on the ground. */
  function select(id) {
    clearSelection();
    selected = id == null ? null : baseId(id);
    if (selected != null && site && selGroup) {
      const mine = site.model.buildings.filter((b) => baseId(b.id) === selected);
      if (!mine.length) selected = null;
      for (const b of mine) {
        if (isRemoved(b)) {
          const ring = drapedRings([b], 0.8, M.selLine);
          if (ring) { ring.userData.kind = 'select'; selGroup.add(ring); }
        } else {
          const geo = buildingGeometry(b);
          if (!geo) continue;
          const fill = new THREE.Mesh(geo, M.selFill);
          fill.userData.kind = 'select';
          fill.renderOrder = 3;
          const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo, EDGE_ANGLE), M.selLine);
          edges.userData.kind = 'select';
          edges.renderOrder = 4;
          selGroup.add(fill, edges);
        }
      }
    }
    needsRender = true;
    return selected;
  }

  /** Rebuilds only the buildings layer with a new removed set. The camera stays. */
  function setRemoved(ids) {
    removedSet = new Set([...(ids || [])].map(baseId));
    if (!site) return 0;
    clearGroup(G.buildings);
    for (const o of buildBuildings(site.model.buildings)) G.buildings.add(o);
    if (selected != null) select(selected);
    info.triangles = countTriangles();
    needsRender = true;
    return info.removed;
  }

  /* ---- draped polygons (roads, walks) and flat polygons (water) ------------------------ */
  function densifyRing(ring, step) {
    const out = [];
    for (let i = 0; i < ring.length; i++) {
      const a = ring[i], b = ring[(i + 1) % ring.length];
      out.push(a);
      const L = Math.hypot(b[0] - a[0], b[1] - a[1]), k = Math.ceil(L / step);
      for (let s = 1; s < k; s++) out.push([a[0] + (b[0] - a[0]) * s / k, a[1] + (b[1] - a[1]) * s / k]);
    }
    return out;
  }
  /** Drops a repeated closing point (ShapeUtils would drop it and shift the hole indices). */
  function trimRing(r) {
    const o = r.slice();
    while (o.length > 1 && o[0][0] === o[o.length - 1][0] && o[0][1] === o[o.length - 1][1]) o.pop();
    return o;
  }
  /** polys: [{outer, holes}]. zOf(x, y) gives the elevation. Returns a BufferGeometry (or null). */
  function polyGeometry(polys, zOf, step) {
    const pos = [], idx = [];
    for (const p of polys) {
      try {
        const outer = step ? densifyRing(trimRing(p.outer), step) : trimRing(p.outer);
        const holes = (p.holes || []).map((hh) => (step ? densifyRing(trimRing(hh), step) : trimRing(hh)));
        const tris = THREE.ShapeUtils.triangulateShape(outer.map((q) => new THREE.Vector2(q[0], q[1])), holes.map((hh) => hh.map((q) => new THREE.Vector2(q[0], q[1]))));
        const all = outer.concat(...holes), base = pos.length / 3;
        for (const q of all) pos.push(q[0], zOf(q[0], q[1]), -q[1]);
        for (const [a, b, c] of tris) {
          // world winding must face up
          const ax = all[a][0], ay = all[a][1], bx = all[b][0], by = all[b][1], cx = all[c][0], cy = all[c][1];
          const ccw = (bx - ax) * (cy - ay) - (by - ay) * (cx - ax) > 0;      // plan CCW = facing up
          if (ccw) idx.push(base + a, base + b, base + c); else idx.push(base + a, base + c, base + b);
        }
      } catch (e) { console.warn('polygon skipped', e); }
    }
    if (!idx.length) return null;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    return geo;
  }

  function buildPavement(polys, mat, lift, key) {
    if (!polys || !polys.length) { info[key] = 0; return []; }
    const geo = polyGeometry(polys, (x, y) => site.meshAt(x, y) + lift, 10);
    if (!geo) { info[key] = 0; return []; }
    info[key] = geo.index.count / 3;
    const mesh = new THREE.Mesh(geo, mat);
    mesh.userData.kind = key;
    return [mesh];
  }

  function buildWater(water) {
    const out = [];
    const areas = (water.areas || []).map((a) => ({ outer: a.ring, holes: a.holes, level: a.level }));
    info.waterAreas = areas.length;
    // one geometry per area: each has its own flat level
    const geos = [];
    for (const a of areas) {
      const g = polyGeometry([a], () => a.level, 0);
      if (g) geos.push(g);
    }
    if (geos.length) {
      const merged = geos.length === 1 ? geos[0] : BufferGeometryUtils.mergeGeometries(geos, false);
      if (geos.length > 1) geos.forEach((g) => g.dispose());
      out.push(new THREE.Mesh(merged, M.water));
    }
    const seg = [];
    for (const line of water.lines || []) {
      for (let i = 1; i < line.length; i++) {
        const a = line[i - 1], b = line[i];
        seg.push(a[0], site.meshAt(a[0], a[1]) + 0.4, -a[1], b[0], site.meshAt(b[0], b[1]) + 0.4, -b[1]);
      }
    }
    if (seg.length) {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(seg, 3));
      out.push(new THREE.LineSegments(g, M.waterLine));
    }
    return out;
  }

  /* ---- trees: instanced low-poly canopy + thin trunk -------------------------------------- */
  function buildTrees(trees) {
    info.trees = trees.length;
    if (!trees.length) return [];
    const canopyGeo = new THREE.IcosahedronGeometry(1, 1);
    const trunkGeo = new THREE.CylinderGeometry(0.55, 0.8, 1, 6);
    trunkGeo.translate(0, 0.5, 0);
    const canopy = new THREE.InstancedMesh(canopyGeo, M.canopy, trees.length);
    const trunk = new THREE.InstancedMesh(trunkGeo, M.trunk, trees.length);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), s = new THREE.Vector3();
    trees.forEach((t, i) => {
      const e = site.meshAt(t.x, t.y), r = t.canopy / 2;
      p.set(t.x, e + t.height - r, -t.y); s.set(r, r * 0.9, r);
      canopy.setMatrixAt(i, m.compose(p, q, s));
      p.set(t.x, e, -t.y); s.set(1, t.height - r, 1);
      trunk.setMatrixAt(i, m.compose(p, q, s));
    });
    canopy.instanceMatrix.needsUpdate = trunk.instanceMatrix.needsUpdate = true;
    canopy.computeBoundingSphere(); trunk.computeBoundingSphere();
    return [trunk, canopy];
  }

  /* ---- model in, scene out --------------------------------------------------------------------- */
  function countTriangles() {
    let t = 0;
    root.traverse((o) => {
      if (!o.visible || !o.geometry || o.userData.kind === 'select') return;
      const g = o.geometry, n = g.index ? g.index.count : g.getAttribute('position').count;
      if (o.isInstancedMesh) t += (n / 3) * o.count; else if (o.isMesh) t += n / 3;
    });
    return Math.round(t);
  }

  function setModel(model, removed = []) {
    for (const k of Object.keys(G)) clearGroup(G[k]);
    removedSet = new Set([...(removed || [])].map(baseId));
    selected = null; groundMesh = null; pickSets = []; removedBuildings = [];
    const ground = model.ground;
    let top = ground.max;
    for (const b of model.buildings) top = Math.max(top, b.top);
    for (const t of model.trees) top = Math.max(top, t.z + t.height);
    site = { model, S: model.frame.size, gmin: ground.min, gmax: ground.max, top, meshAt: makeMeshAt(ground) };
    for (const k of ['buildings', 'removed', 'trees', 'waterAreas', 'roadTriangles', 'walkTriangles']) info[k] = 0;
    G.ground.add(buildGroundMesh(ground), buildSkirt(ground));
    G.site.add(buildOutline(ground, site.meshAt));
    selGroup = new THREE.Group();
    G.site.add(selGroup);
    for (const o of buildBuildings(model.buildings)) G.buildings.add(o);
    for (const o of buildPavement(model.roads.pavement, M.road, 0.3, 'roadTriangles')) G.roads.add(o);
    for (const o of buildPavement(model.roads.walks, M.walk, 0.4, 'walkTriangles')) G.walks.add(o);
    for (const o of buildTrees(model.trees)) G.trees.add(o);
    for (const o of buildWater(model.water)) G.water.add(o);
    paintGround();
    applyScale();
    applyLayers();
    info.triangles = countTriangles();
    sceneRadius = Math.hypot(site.S, site.S, site.top - site.gmin) / 2;
    updateSun();
    fit(false);
    needsRender = true;
  }

  /** Replace the walks layer after a rebuild with walks:true (the roads object comes from Pipeline.buildWalks). */
  function setWalks(roads) {
    if (!site) return;
    site.model.roads = roads;
    clearGroup(G.walks);
    for (const o of buildPavement(roads.walks, M.walk, 0.4, 'walkTriangles')) G.walks.add(o);
    info.triangles = countTriangles();
    needsRender = true;
  }

  function applyLayers() {
    for (const k of Object.keys(layerVisible)) if (G[k]) G[k].visible = !!layerVisible[k];
    if (selGroup) selGroup.visible = !!layerVisible.buildings;
    if (site) info.triangles = countTriangles();
    needsRender = true;
  }
  function setLayer(name, on) { layerVisible[name] = !!on; applyLayers(); }

  function applyScale() {
    if (!site) { root.scale.y = vscale; root.position.y = 0; return; }
    root.scale.y = vscale;
    root.position.y = site.gmin * (1 - vscale);
    setSkirtBottom();
    needsRender = true;
  }
  function setVScale(v) {
    const was = vscale;
    vscale = v;
    applyScale();
    if (site && was !== v) refit();
  }
  function setContour(ft) {
    contour = ft;
    contourU.uOn.value = ft > 0 ? 1 : 0;
    if (ft > 0) contourU.uInterval.value = ft;
    needsRender = true;
  }

  function updateSun() {
    const az = rad(150), alt = rad(46), R = Math.max(200, sceneRadius);
    const dir = new THREE.Vector3(...planToWorld(Math.sin(az) * Math.cos(alt), Math.cos(az) * Math.cos(alt), Math.sin(alt)));
    const c = site ? worldVec(site.S / 2, site.S / 2, site.gmin) : new THREE.Vector3();
    sun.target.position.copy(c);
    sun.position.copy(c).addScaledVector(dir, R * 3);
    sun.target.updateMatrixWorld();
  }

  /* ---- camera & framing ------------------------------------------------------------------------- */
  const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const hostAspect = () => Math.max(0.1, host.clientWidth) / Math.max(1, host.clientHeight);

  /** Corners of what a view must show, in world space (vertical scale applied). */
  function fitCorners() {
    const S = site ? site.S : 1000, lo = site ? site.gmin : 0;
    const hi = site ? lo + (site.top - lo) * vscale : 50;
    const pts = [];
    for (const x of [0, S]) for (const y of [0, S]) for (const e of [lo, Math.max(hi, lo + S * 0.02)]) pts.push(worldVec(x, y, e));
    return pts;
  }
  /** Nearest distance (and look-at point) that puts all corners inside the view with a margin. */
  function fitPersp(corners, dir, aspect) {
    const fwd = dir.clone().negate();
    const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0)).normalize();
    const up = new THREE.Vector3().crossVectors(right, fwd).normalize();
    const fit = 1 - 2 * FIT_MARGIN;
    const tY = tanHalfFov, tX = tanHalfFov * aspect;
    const target = corners.reduce((a, p) => a.add(p), new THREE.Vector3()).multiplyScalar(1 / corners.length);
    const solve = () => {
      let dist = 1;
      for (const p of corners) {
        const v = p.clone().sub(target), dd = v.dot(dir);
        dist = Math.max(dist, dd + Math.abs(v.dot(right)) / (tX * fit), dd + Math.abs(v.dot(up)) / (tY * fit));
      }
      return dist;
    };
    let dist = solve();
    for (let i = 0; i < 6; i++) {               // centre the projected box, then re-solve the distance
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (const p of corners) {
        const v = p.clone().sub(target), z = dist - v.dot(dir);
        const nx = v.dot(right) / (z * tX), ny = v.dot(up) / (z * tY);
        x0 = Math.min(x0, nx); x1 = Math.max(x1, nx); y0 = Math.min(y0, ny); y1 = Math.max(y1, ny);
      }
      target.addScaledVector(right, ((x0 + x1) / 2) * tX * dist).addScaledVector(up, ((y0 + y1) / 2) * tY * dist);
      dist = solve();
    }
    return { dist, target };
  }

  let preset = 'fit';
  const presetListeners = [];
  const setPreset = (p) => { preset = p; presetListeners.forEach((fn) => fn(p)); };
  const VIEW_DIRS = {
    fit: () => new THREE.Vector3(...planToWorld(Math.sin(rad(225)) * Math.cos(rad(32)), Math.cos(rad(225)) * Math.cos(rad(32)), Math.sin(rad(32)))).normalize(),   // 3/4 view from the southwest
    plan: () => new THREE.Vector3(...planToWorld(0, -Math.sin(0.012), Math.cos(0.012))).normalize(),
  };
  function goTo(id, animate) {
    if (!renderer) return;
    setPreset(id);
    const dir = VIEW_DIRS[id]();
    const goal = fitPersp(fitCorners(), dir, hostAspect());
    setCamera(goal.target, dir, goal.dist, animate);
  }
  function setCamera(target, dir, dist, animate) {
    const apply = (t, d, r) => {
      controls.target.copy(t);
      cam.position.copy(t).addScaledVector(d, r);
      controls.update();
      needsRender = true;
    };
    tween = null;
    if (!animate || reduceMotion) { apply(target, dir, dist); return; }
    const curOffset = cam.position.clone().sub(controls.target);
    const fromDir = curOffset.clone().normalize(), fromDist = Math.max(1, curOffset.length());
    tween = {
      t0: performance.now(), dur: 450, fromTarget: controls.target.clone(), toTarget: target.clone(),
      fromDir, toDir: dir.clone(), fromDist, toDist: dist, apply,
      q: new THREE.Quaternion().setFromUnitVectors(fromDir, dir),
    };
    needsRender = true;
  }
  function stepTween(now) {
    const k = tween, p = clamp((now - k.t0) / k.dur, 0, 1), e = easeInOut(p);
    const dir = k.fromDir.clone().applyQuaternion(new THREE.Quaternion().slerp(k.q, e)).normalize();
    k.apply(k.fromTarget.clone().lerp(k.toTarget, e), dir, k.fromDist + (k.toDist - k.fromDist) * e);
    if (p >= 1) tween = null;
  }
  const fit = (animate = true) => goTo('fit', animate);
  const planView = (animate = true) => goTo('plan', animate);
  function refit() { if (preset) goTo(preset, true); }

  function updateClip() {
    const dist = cam.position.distanceTo(controls.target);
    cam.near = Math.max(0.5, dist * 0.01);
    cam.far = dist * 20 + sceneRadius * 4 + 2000;
    cam.updateProjectionMatrix();
  }

  function resize() {
    if (!renderer) return;
    const w = Math.max(1, host.clientWidth), hh = Math.max(1, host.clientHeight);
    renderer.setSize(w, hh, false);
    cam.aspect = w / hh;
    cam.updateProjectionMatrix();
    if (site && preset) goTo(preset, false);
    needsRender = true;
    renderer.render(scene, cam);
  }

  function frame(now) {
    requestAnimationFrame(frame);
    if (capturing) return;
    if (tween) stepTween(now);
    const moved = controls.update();
    if (moved || needsRender) {
      updateClip();
      renderer.render(scene, cam);
      needsRender = false;
      cameraListeners.forEach((fn) => fn(cam));
    }
  }

  /** Screenshot of what is on screen with the shared overlay. */
  async function capture(overlay, scale = 2) {
    if (!renderer) throw new Error('The 3D view is not available.');
    capturing = true;
    try { return await ShotMod.captureView({ renderer, scene, camera: cam, scale, overlay }); }
    finally { capturing = false; needsRender = true; }
  }

  /** Tap to select: pointerdown then pointerup within 6 px and 500 ms. An orbit drag, a pinch or a long press selects nothing. */
  function wirePointer() {
    const down = new Set();
    let tap = null;
    host.addEventListener('pointerdown', (e) => {
      down.add(e.pointerId);
      tap = down.size === 1 && (e.pointerType !== 'mouse' || e.button === 0) ? { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now() } : null;
    });
    host.addEventListener('pointermove', (e) => {
      if (tap && tap.id === e.pointerId && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) >= TAP_PX) tap = null;
    });
    host.addEventListener('pointerup', (e) => {
      down.delete(e.pointerId);
      const k = tap;
      tap = null;
      if (!k || k.id !== e.pointerId) return;
      if (Math.hypot(e.clientX - k.x, e.clientY - k.y) >= TAP_PX || performance.now() - k.t >= TAP_MS) return;
      const hit = pick(e.clientX, e.clientY);
      pickListeners.forEach((fn) => fn(hit, { x: e.clientX, y: e.clientY }));
    });
    host.addEventListener('pointercancel', (e) => { down.delete(e.pointerId); tap = null; });
  }

  function init(hostEl) {
    host = hostEl;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    } catch (e) {
      host.innerHTML = '<div class="gl-fail">WebGL is not available in this browser, so the 3D view cannot start.</div>';
      renderer = null;
      return false;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    host.appendChild(renderer.domElement);
    makeMaterials();
    buildScene();
    cam = new THREE.PerspectiveCamera(FOV, 1, 1, 100000);
    cam.position.set(-900, 700, 900);
    controls = new OrbitControls(cam, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.12;
    controls.maxPolarAngle = Math.PI / 2 - 0.02;      // never below the ground
    controls.minDistance = 15;
    controls.maxDistance = 40000;
    controls.screenSpacePanning = true;
    controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
    controls.addEventListener('start', () => { tween = null; if (preset) setPreset(null); });
    controls.addEventListener('change', () => { needsRender = true; });
    wirePointer();
    new ResizeObserver(resize).observe(host);
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', applyTheme); else if (mq.addListener) mq.addListener(applyTheme);
    renderer.domElement.addEventListener('webglcontextlost', (e) => e.preventDefault());
    applyTheme();
    updateSun();
    resize();
    requestAnimationFrame(frame);
    return true;
  }

  return {
    init, setModel, setRemoved, setWalks, pick, select, screenOf, setLayer, setVScale, setContour, fit, planView, capture,
    onCamera: (fn) => cameraListeners.push(fn),
    onPreset: (fn) => presetListeners.push(fn),
    /** fn(hit | null, { x, y }) after every tap (see pick for hit). null = a tap on empty ground. */
    onPick: (fn) => pickListeners.push(fn),
    selection: () => selected,
    removedIds: () => [...removedSet].sort(),
    canvas: () => (renderer ? renderer.domElement : null),
    camera: () => cam,
    ready: () => !!renderer,
    hasSite: () => !!site,
    info: () => ({ ...info, triangles: site ? countTriangles() : 0, vscale, contour, layers: { ...layerVisible }, preset, camDistance: cam ? cam.position.distanceTo(controls.target) : 0 }),
    /** For tests: render now and read a pixel row to prove something was drawn. */
    renderNow: () => { if (renderer) { updateClip(); renderer.render(scene, cam); } },
    meshAt: (x, y) => (site ? site.meshAt(x, y) : 0),
    groups: () => G,
    drawCalls: () => (renderer ? renderer.info.render.calls : 0),
  };
})();

/* ==========================================================================
   UI
   Top bar, control panel, progress list, metrics, downloads, screenshot,
   recent sites and the bottom sheet (iPad portrait and phone).
   ========================================================================== */
const App = (() => {
  const { googleMapsUrl, parseCoordinates } = GeocodeMod;
  const { summarize } = ModelMod;
  const { revitCsv, siteDxf, notesMarkdown, CREDITS } = ExportsMod;
  const { siteToSketchup } = SkSite;
  const { sketchupFilename, docToBlob } = SkFmt;
  const { siteDerived, siteState, derivedBytes } = SiteDerivedMod;

  const HELP_REMOVE = 'Click a building in the 3D view to open its card. Select Remove on the card to take the building out of the site. A dashed outline stays on the ground where the building stood. Select Restore on the card to put the building back. Select Restore all in the panel to put back every removed building. The list of removed buildings stays when you load the same address again. Every other tool and every export leaves out a removed building. The DXF file draws its ground outline on the layer BLDG-REMOVED. A removed building casts no shadow.';

  const state = {
    size: CONFIG.defaultSize,
    layers: { ground: true, buildings: true, roads: true, walks: false, trees: true, water: true },
    vscale: 1, contour: 0,
    busy: false, runId: 0, t0: 0, timer: 0,
    result: null, typed: '', elapsed: null,
    removed: new Set(),         // ids of the buildings the user removed (base ids, no ~n suffix); saved as meta.removed in the project
    removedKey: null,           // the site (lat, lon, size) the list belongs to; null = it adopts the next site that loads
    selected: null,             // { id, building } of the building in the selection card, or null
  };
  const baseId = (id) => String(id).replace(/~\d+$/, '');
  const removedList = () => [...state.removed].sort();
  const siteKeyOf = (r) => `${Number(r.loc.lat).toFixed(5)},${Number(r.loc.lon).toFixed(5)},${r.frame.size}`;
  const els = {};
  /* The open project (docs/project-file-spec.md). The injectable parts (storage, navigate, updateUrl) are for the in-page tests. */
  const project = {
    doc: null,                  // the open project, a document in memory, or null
    storage: null,              // a Storage-like object; null = the localStorage of the browser
    readOnly: false,            // the site section is newer than this page: never write
    pending: null,              // the site section waiting to be written: { section, frame } (see flushProject)
    dirty: false, timer: 0,     // the document in memory has a change that is not saved yet; the autosave timer
    written: null,              // { result, walks } of the last queued write (Send does not queue the same site twice)
    noted: {},                  // notices that were shown already, by key (each one is shown once)
    navigate: (url) => { location.href = url; },
    updateUrl: (id) => { try { history.replaceState(null, '', projectHref(id)); } catch (e) { /* ignore */ } },
  };
  const prefersDark = () => !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  const sheetQuery = window.matchMedia('(max-width: 899px), (orientation: portrait)');

  /* ---- naming ------------------------------------------------------------------ */
  function slugOf(r = state.result) {
    const base = (state.typed || (r && r.loc.label) || 'site').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48).replace(/-+$/, '') || 'site';
    return `${base}-${r ? r.frame.size : state.size}ft`;
  }
  const todayIso = () => { const d = new Date(), p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
  function metaOf(r = state.result) {
    return { address: state.typed || r.loc.label, lat: r.loc.lat, lon: r.loc.lon, size: r.frame.size, release: r.release, date: todayIso(), removed: removedList() };
  }
  /** metaOf plus the walks flag: the model has a walk layer. Used for the project file. */
  function projectMeta(r = state.result) { return { ...metaOf(r), walks: !!(r.model.roads && r.model.roads.walks) }; }

  /* ---- progress list ----------------------------------------------------------------- */
  function setStep(step, status, msg) {
    const li = els.steps && els.steps.querySelector(`[data-step="${step}"]`);
    if (!li) return;
    li.dataset.s = status;
    li.querySelector('.ms').textContent = msg || (status === 'pending' ? 'Waiting' : '');
  }
  function setProgressOpen(open) {
    els.progressHead.setAttribute('aria-expanded', String(open));
    els.steps.hidden = !open;
  }
  function resetSteps() { for (const [k] of CONFIG.steps) setStep(k, 'pending'); }
  const secs = (ms) => `${(ms / 1000).toFixed(1)} s`;
  function chip(text, kind = '') {
    els.chip.hidden = !text;
    els.chip.textContent = text || '';
    els.chip.className = `status-chip ${kind}`.trim();
  }
  function tick() { const t = secs(performance.now() - state.t0); els.elapsed.textContent = t; chip(`Loading the site, ${t}`); }

  /* ---- metrics ------------------------------------------------------------------------- */
  function renderMetrics() {
    const r = state.result, box = els.metrics;
    box.textContent = '';
    if (!r) { box.append(h('p', { class: 'help' }, 'Metrics appear after the site loads.')); return; }
    const m = r.model, s = summarize(m), g = m.ground;
    const row = (k, v, small) => [h('dt', null, k), h('dd', null, v, small ? h('small', null, ` ${small}`) : null)];
    box.append(h('dl', { class: 'kv' },
      row('Buildings', grouped(s.buildings), s.estimated ? `${grouped(s.estimated)} estimated` : ''),
      row('Road length', fmtFt(s.roadsFt, 0)),
      row('Trees', grouped(s.trees)),
      row('Water areas', grouped(s.waterAreas)),
      row('Ground', `${grouped(s.groundMin, 1)} to ${grouped(s.groundMax, 1)} ft`),
      row('Grid spacing', fmtFt(g.spacing, 1)),
      row('Grid points', grouped(g.n * g.n), `${g.n} by ${g.n}`),
    ));
    if (state.removed.size) {
      box.append(h('div', { class: 'removed-line', id: 'removedLine' },
        h('span', { id: 'removedText' }, `Removed buildings: ${state.removed.size}`),
        h('span', { class: 'dot', 'aria-hidden': 'true' }, '·'),
        h('button', { class: 'link-btn', type: 'button', id: 'restoreAll', onclick: restoreAll }, 'Restore all')));
    }
  }

  /* ---- remove and restore buildings ------------------------------------------------------------
     Click a building in the 3D view (Scene.onPick) to open the selection card. Remove takes it out of the solids
     (a dashed outline stays on the ground), Restore puts it back. Click its outline to select it again. The list is
     state.removed; it goes into the project as meta.removed on every project write (metaOf). */
  const RULE_TEXT = { data: 'height from the data', floors: 'height from the floor count', estimate: 'height estimated' };
  function renderCard() {
    const box = els.selCard, sel = state.selected;
    if (!box) return;
    box.textContent = '';
    box.hidden = !sel;
    if (!sel) return;
    const b = sel.building, gone = state.removed.has(baseId(sel.id));
    const floors = Math.max(1, Math.round(b.floors || b.height / 12));
    box.append(
      h('div', { class: 'sc-head' },
        h('div', { class: 'sc-titles' },
          h('div', { class: 'sc-title', id: 'selTitle' }, b.name || 'Building', gone ? h('span', { class: 'sc-tag' }, 'Removed') : null),
          h('div', { class: 'sc-sub', id: 'selSub' }, `Height ${fmtFt(b.height, 1)} · ${floors} ${floors === 1 ? 'floor' : 'floors'} · ${RULE_TEXT[b.rule] || b.rule}`),
          h('div', { class: 'sc-id', id: 'selId' }, `ID ${sel.id}`)),
        h('button', { class: 'btn icon sc-close', type: 'button', id: 'selClose', title: 'Close (Escape)', 'aria-label': 'Close the building card', onclick: () => selectHit(null) }, '×')),
      h('div', { class: 'sc-actions' },
        h('button', { class: gone ? 'btn outline' : 'btn solid', type: 'button', id: 'selAction', onclick: () => (gone ? restoreBuilding(sel.id) : removeBuilding(sel.id)) }, gone ? 'Restore' : 'Remove')));
  }
  /** Opens the card for a hit of Scene.pick (or closes it with null). */
  function selectHit(hit) {
    if (hit && state.busy) return;
    state.selected = hit ? { id: baseId(hit.id), building: hit.building } : null;
    Scene.select(state.selected ? state.selected.id : null);
    renderCard();
  }
  /** Replaces the removed set: rebuilds the buildings, redraws the panel line and the card, and writes the open project. */
  function setRemoved(ids) {
    state.removed = new Set([...(ids || [])].map(baseId));
    Scene.setRemoved(state.removed);
    renderMetrics();
    renderCard();
    if (state.result && project.doc && !project.readOnly && projectWrite(state.result)) scheduleProjectSave();
  }
  const removeBuilding = (id) => setRemoved([...state.removed, baseId(id)]);
  const restoreBuilding = (id) => setRemoved([...state.removed].filter((x) => x !== baseId(id)));
  const restoreAll = () => setRemoved([]);

  /* ---- recent sites ----------------------------------------------------------------------- */
  const loadRecents = () => { const v = Local.get(CONFIG.recentKey, []); return Array.isArray(v) ? v.filter((e) => e && e.text && e.size && Number.isFinite(e.lat) && Number.isFinite(e.lon)) : []; };
  function saveRecent(r) {
    const entry = { text: state.typed || r.loc.label, label: r.loc.label, lat: r.loc.lat, lon: r.loc.lon, size: r.frame.size, t: Date.now() };
    const list = loadRecents().filter((e) => !(e.text === entry.text && e.size === entry.size));
    list.unshift(entry);
    Local.set(CONFIG.recentKey, list.slice(0, CONFIG.recentMax));
    renderRecents();
  }
  function renderRecents() {
    const list = loadRecents(), box = els.recents;
    box.textContent = '';
    els.recentsWrap.hidden = !list.length;
    for (const e of list) {
      box.append(h('button', { class: 'recent', type: 'button', title: e.label, onclick: () => { els.addr.value = e.text; setSize(e.size); go({ text: e.text, size: e.size, loc: { lat: e.lat, lon: e.lon, label: e.label } }); } },
        h('span', { class: 't' }, e.text), h('span', { class: 's' }, `${grouped(e.size)} ft`)));
    }
  }

  /* ---- the Go action ------------------------------------------------------------------------- */
  function setBusy(b) {
    state.busy = b;
    els.go.disabled = b;
    els.go.textContent = b ? 'Working' : 'Go';
    els.viewport.dataset.busy = String(b && !!state.result);
    syncActions();
  }
  function setSize(v) {
    state.size = v;
    if (![...els.size.options].some((o) => o.value === String(v))) els.size.append(h('option', { value: String(v) }, `${grouped(v)} ft`));     // a size from a project file
    els.size.value = String(v);
  }

  async function go(req = {}) {
    if (state.busy) return;
    const text = (req.text != null ? req.text : els.addr.value).trim();
    if (!text) { Toast.show('Type an address, coordinates, or a Google Maps link first.', 'warn'); els.addr.focus(); return; }
    const size = req.size || state.size;
    const id = ++state.runId;
    const id0 = project.doc ? project.doc.id : null;
    els.progressSec.hidden = false;
    setProgressOpen(true);
    resetSteps();
    setBusy(true);
    state.t0 = performance.now();
    clearInterval(state.timer);
    state.timer = setInterval(tick, 200);
    tick();
    let r = null, failure = null;
    try {
      const runner = req.runFn || Pipeline.run;                       // runFn: the in-page tests give a result without the network
      r = await runner({ text, size, loc: req.loc }, (step, st, msg) => { if (id === state.runId) setStep(step, st, msg); }, { walks: !!state.layers.walks, fetchFn: req.fetchFn });
    } catch (e) { failure = e; }
    clearInterval(state.timer);
    const dt = performance.now() - state.t0;
    els.elapsed.textContent = secs(dt);
    setBusy(false);
    if (id !== state.runId) return;
    if (failure) {
      console.error(failure);
      chip(failure.message, 'bad');
      Toast.show(failure.message, 'bad', 8000);
      return;
    }
    state.typed = text;
    state.result = r;
    state.elapsed = dt;
    r.uiMs = Math.round(dt);
    if (!r.failed.length) setProgressOpen(false);          // all done: fold the list, one tap opens it
    // The removed list belongs to one site: another site clears it. On the same site, ids that no longer exist are dropped without a message.
    const key = siteKeyOf(r);
    if (state.removedKey && state.removedKey !== key) state.removed = new Set();
    state.removedKey = key;
    const have = new Set(r.model.buildings.map((b) => baseId(b.id)));
    state.removed = new Set([...state.removed].filter((x) => have.has(x)));
    state.selected = null;
    renderCard();
    const t1 = performance.now();
    Scene.setModel(r.model, state.removed);
    r.timings.scene = Math.round(performance.now() - t1);
    els.empty.hidden = true;
    renderMetrics();
    syncActions();
    if (!req.runFn) saveRecent(r);
    if (project.doc && (!id0 || id0 === project.doc.id) && projectWrite(r)) scheduleProjectSave();      // a project is open: the site goes into it
    const bad = r.failed.map((k) => CONFIG.steps.find((s) => s[0] === k)[1]);
    chip(bad.length ? `Loaded in ${secs(dt)}. Not loaded: ${bad.join(', ')}` : `Loaded in ${secs(dt)}`, bad.length ? 'bad' : '');
    if (bad.length) Toast.show(`${bad.join(' and ')} could not be loaded. The rest of the site is shown.`, 'warn', 7000);
    else setTimeout(() => { if (!state.busy) chip(''); }, 5000);
  }

  /* ---- layers, scale, contours ------------------------------------------------------------------ */
  function toggleLayer(key, on) {
    state.layers[key] = on;
    for (const b of els.toggles.querySelectorAll('[data-layer]')) if (b.dataset.layer === key) b.setAttribute('aria-checked', String(on));
    if (key === 'walks' && on && state.result && !state.result.model.roads.walks) {
      chip('Building walks');
      setTimeout(() => {
        try {
          const roads = Pipeline.buildWalks(state.result);
          Scene.setWalks(roads);
          Scene.setLayer('walks', state.layers.walks);
          chip(`${roads.walks ? roads.walks.length : 0} walk areas added`);
          if (project.doc && !project.readOnly && projectWrite(state.result)) scheduleProjectSave();
          setTimeout(() => { if (!state.busy) chip(''); }, 2500);
        } catch (e) { console.error(e); chip(''); Toast.show(`Walks could not be built. ${e.message}`, 'bad', 6000); }
      }, 20);
    }
    Scene.setLayer(key, on);
  }
  function setSegPressed(group, attr, val) {
    for (const b of group.querySelectorAll('button')) b.setAttribute('aria-pressed', String(Number(b.dataset[attr]) === val));
  }
  function setVScale(v) { state.vscale = v; setSegPressed(els.scaleSeg, 'scale', v); Scene.setVScale(v); }
  function setContour(v) { state.contour = v; setSegPressed(els.contourSeg, 'contour', v); Scene.setContour(v); }

  /* ---- downloads and screenshot -------------------------------------------------------------------- */
  const FILES = {
    csv: { suffix: 'topo.csv', type: 'text/csv', make: (r) => revitCsv(r.model.ground) },
    dxf: { suffix: 'site.dxf', type: 'application/dxf', make: (r) => siteDxf(r.model, { removed: new Set(state.removed) }) },
    notes: { suffix: 'notes.md', type: 'text/markdown', make: (r) => notesMarkdown(r.model, metaOf(r)) },
    // SketchUp: the name comes from sketchupFilename (slug + date) and the file is a Blob made by docToBlob
    sketchup: { type: 'application/json', name: (r) => sketchupFilename(slugOf(r), new Date()), blob: (r) => docToBlob(siteToSketchup(r.model, metaOf(r))) },
  };
  function fileFor(kind, r = state.result) {
    const f = FILES[kind];
    if (f.blob) return { name: f.name(r), blob: f.blob(r), type: f.type };
    return { name: `${slugOf(r)}-${f.suffix}`, text: f.make(r), type: f.type };
  }
  /** The SketchUp document for a result (default: the current site). */
  function sketchupDoc(r = state.result) { return r ? siteToSketchup(r.model, metaOf(r)) : null; }
  async function download(kind) {
    Pop.close();
    if (!state.result) return;
    try {
      const f = fileFor(kind);
      const res = await ShotMod.deliverImage(f.blob || new Blob([f.text], { type: f.type }), f.name);
      if (res === 'downloaded') Toast.show(`Saved ${f.name}`);
    } catch (e) { console.error(e); Toast.show(`The file could not be made. ${e.message}`, 'bad', 6000); }
  }
  function openDownloads() {
    const item = (kind, title, sub) => h('button', { class: 'pop-item', type: 'button', 'data-dl': kind, onclick: () => download(kind) }, h('span', { class: 'grow' }, title, h('small', null, sub)));
    Pop.open(els.btnDl, h('div', { role: 'menu' },
      item('csv', 'Revit CSV', 'Ground points for a Revit toposolid'),
      item('dxf', 'DXF', 'Topo mesh, buildings, roads, trees, water'),
      item('sketchup', 'SketchUp', 'Ground, buildings, roads, water. Import with the CMRLM extension'),
      item('notes', 'Notes', 'Origin, counts, and Revit import steps')));
  }
  function overlayMetrics(r) {
    const s = summarize(r.model);
    return [
      ['Site', `${grouped(r.frame.size)} ft square`],
      ['Buildings', `${grouped(s.buildings)}${s.estimated ? ` (${grouped(s.estimated)} est.)` : ''}`],
      ['Roads', fmtFt(s.roadsFt, 0)],
      ['Trees', grouped(s.trees)],
      ['Ground', `${grouped(s.groundMin, 1)} to ${grouped(s.groundMax, 1)} ft`],
    ];
  }
  async function screenshot({ deliver = true } = {}) {
    const r = state.result;
    if (!r) return null;
    try {
      const blob = await Scene.capture({ title: state.typed || r.loc.label, date: true, metrics: overlayMetrics(r), mark: 'CMRLM', theme: prefersDark() ? 'dark' : 'light' }, 2);
      if (deliver) {
        const res = await ShotMod.deliverImage(blob, ShotMod.screenshotFilename(slugOf(r)));
        if (res === 'downloaded') Toast.show('Image saved to your downloads.');
      }
      return blob;
    } catch (e) { console.error(e); Toast.show(e && e.message ? e.message : 'The image could not be made.', 'bad', 6000); return null; }
  }

  /* ---- Google Maps ------------------------------------------------------------------------------------ */
  function currentPoint() {
    const typed = parseCoordinates(els.addr.value);
    if (typed) return typed;
    return state.result ? { lat: state.result.loc.lat, lon: state.result.loc.lon } : null;
  }
  function openMaps() {
    const p = currentPoint();
    if (!p) return;
    window.open(googleMapsUrl(p.lat, p.lon), '_blank', 'noopener');
  }
  function syncActions() {
    const has = !!state.result;
    els.btnMaps.disabled = !currentPoint();
    els.btnDl.disabled = !has || state.busy;
    els.btnShot.disabled = !has || state.busy;
    els.btnFit.disabled = els.btnPlan.disabled = !has;
    const canSend = has && !state.busy;
    els.btnSendTower.disabled = !canSend;
    els.btnSendTower.title = canSend ? 'Save this site in a project and open the Tower Generator' : 'Load a site first';
    els.btnSendMid.disabled = !canSend;
    els.btnSendMid.title = canSend ? 'Save this site in a project and open the Mid-Rise Generator' : 'Load a site first';
    els.btnSendGrading.disabled = !canSend;
    els.btnSendGrading.title = canSend ? 'Save this site in a project and open the Grading Sketch' : 'Load a site first';
  }

  /* ---- project file (docs/project-file-spec.md, sections 8 and 12) ----------------------------------------------
     With ?project=<id> the page opens that project, shows its name, loads the saved site again, and writes the
     "site" section after every run (saved 1 s later, and when the page is hidden). Without a project, nothing here
     runs until the Project menu or a Send button is used. Every storage call is inside try/catch.
     ProjectMod.writeSection returns a new project and does not change the one it gets. So a run only queues its
     section (project.pending). The save loads the project fresh from storage, writes the section on that copy and
     saves it, so sections that another tool saved from a second tab are kept (spec section 8, Conflicts). */
  const READ_ONLY_TEXT = 'This project was saved by a newer version of this tool. You can view it, but changes will not be saved.';
  const NO_STORAGE_TEXT = 'Saving is unavailable in this browser, so the project is kept only until you close this page.';
  const MOVED_TEXT = 'The site of this project changed. Work from other tools in this project may need a new placement.';
  const megabytes = (b) => `${(b / 1048576).toFixed(1)} MB`;
  const projectHref = (id) => `${location.pathname}?project=${encodeURIComponent(id)}`;
  function storageOf() {
    if (project.storage) return project.storage;
    try { return window.localStorage; } catch (e) { return null; }
  }
  /** Shows a notice one time per page, by key. */
  function noticeOnce(key, message, kind = 'warn', ms = 9000) {
    if (project.noted[key]) return;
    project.noted[key] = true;
    Toast.show(message, kind, ms);
  }
  /** The last argument of the storage functions of ProjectMod: each message becomes one toast. */
  const storageNotice = () => ({ onNotice: (message) => noticeOnce(`storage:${message}`, String(message)) });
  function renderProjectPill() {
    const pill = els.projPill, doc = project.doc;
    if (!pill) return;
    pill.hidden = !doc;
    if (!doc) return;
    pill.textContent = `Project: ${doc.name}${project.readOnly ? ' (read only)' : ''}`;
    pill.title = pill.textContent;
  }

  /** Makes `doc` the open project and checks that this page may write to it. It does not load the site (see siteRequest). */
  function openProjectDoc(doc) {
    if (project.doc) flushProject();
    clearTimeout(project.timer);
    Object.assign(project, { doc, timer: 0, pending: null, dirty: false, written: null, readOnly: false });
    let sec = null;
    try { sec = ProjectMod.getSection(doc, 'site'); } catch (e) { sec = null; }
    if ((sec && Number(sec.schema) > CONFIG.projectSchema) || Number(doc.version) > Number(ProjectMod.VERSION || 1)) {
      project.readOnly = true;
      noticeOnce('readonly', READ_ONLY_TEXT);
    }
    renderProjectPill();
    syncActions();
    return doc;
  }
  /** Forgets the open project. The saved copy stays where it is. */
  function projectClose() {
    clearTimeout(project.timer);
    Object.assign(project, { doc: null, timer: 0, pending: null, dirty: false, written: null, readOnly: false });
    renderProjectPill();
    syncActions();
  }

  const siteFrameOf = (r) => ({ kind: 'site', lat: r.loc.lat, lon: r.loc.lon, size: r.frame.size, zDatum: 'NAVD88' });
  /**
   * The Site Model owns the project frame (spec section 4). Sets `want` as the frame of `doc` (a copy that belongs to
   * this page). Returns true when the frame changed while other tools hold work in the project.
   */
  function adoptSiteFrame(doc, want) {
    const have = doc.frame || {};
    if (have.kind === 'site' && have.lat === want.lat && have.lon === want.lon && have.size === want.size && have.zDatum === want.zDatum) return false;
    doc.frame = { ...have, ...want };
    return Object.keys(doc.sections || {}).some((k) => {
      const sec = doc.sections[k];
      return k !== 'site' && sec && ((sec.state && Object.keys(sec.state).length) || (sec.derived && Object.keys(sec.derived).length));
    });
  }

  /** Queues the site of a run as the "site" section of the open project. flushProject writes it and saves the project. */
  function projectWrite(r = state.result) {
    if (!project.doc || !r) return false;
    if (project.readOnly) { noticeOnce('readonly', READ_ONLY_TEXT); return false; }
    const meta = projectMeta(r);
    try {
      project.pending = {
        section: {
          tool: 'site', schema: CONFIG.projectSchema, placement: { x: 0, y: 0, rotation: 0, baseZ: 0 },
          state: siteState(meta), derived: siteDerived(r.model, meta), note: `${meta.address}, ${grouped(meta.size)} ft`,
        },
        frame: siteFrameOf(r),
      };
    } catch (e) {
      console.error(e);
      Toast.show(`The project could not be updated. ${e && e.message ? e.message : ''}`.trim(), 'bad', 8000);
      return false;
    }
    project.written = { result: r, walks: meta.walks };
    return true;
  }

  function scheduleProjectSave() {
    clearTimeout(project.timer);
    project.timer = setTimeout(flushProject, CONFIG.projectSaveMs);
  }
  function saveFailureText(doc, res) {
    if (!res) return NO_STORAGE_TEXT;
    let text = String(res.warning || 'The project could not be saved.');
    if (res.bytes > (ProjectMod.SIZE_MAX || 4 * 1024 * 1024)) {
      let sec = null;
      try { sec = ProjectMod.getSection(doc, 'site'); } catch (e) { sec = null; }
      if (sec && sec.derived) text += ` The site data is ${megabytes(derivedBytes(sec.derived))}. A smaller site size gives a smaller file.`;
    }
    return text;
  }
  /**
   * Writes the queued site section and saves the project. The project is loaded fresh from storage first (another tool
   * may have saved its section from a second tab), the section is written on that copy, and the copy is saved.
   * Returns the result of saveProject, { ok: true, skipped: true } when there is nothing to save, or { ok: false }.
   */
  function flushProject() {
    clearTimeout(project.timer);
    project.timer = 0;
    const doc = project.doc, patch = project.pending;
    if (!doc || project.readOnly || (!patch && !project.dirty)) return { ok: true, skipped: true };
    const opts = storageNotice();
    if (patch) {
      let base = doc;
      try { base = ProjectMod.loadProject(storageOf(), doc.id, opts) || doc; } catch (e) { base = doc; }
      let next = null;
      try { next = ProjectMod.writeSection(base, 'site', patch.section); } catch (e) {
        project.pending = null;
        if (e && e.readOnly) { project.readOnly = true; renderProjectPill(); noticeOnce('readonly', e.message || READ_ONLY_TEXT); return { ok: false, readOnly: true }; }
        console.error(e);
        Toast.show(`The project could not be updated. ${e && e.message ? e.message : ''}`.trim(), 'bad', 8000);
        return { ok: false };
      }
      const moved = adoptSiteFrame(next, patch.frame);
      Object.assign(project, { doc: next, pending: null, dirty: true });
      if (moved) noticeOnce('moved', MOVED_TEXT);
    }
    let res = null;
    try { res = ProjectMod.saveProject(storageOf(), project.doc, opts); } catch (e) { console.error(e); }
    if (!res || res.ok === false) {                           // the project stays dirty in memory: the next trigger tries again
      noticeOnce(`save:${(res && res.warning) || ''}`, saveFailureText(project.doc, res), 'bad', 12000);
      return res || { ok: false };
    }
    project.dirty = false;
    if (res.warning) noticeOnce('warning', String(res.warning));
    return res;
  }
  let projectEventsWired = false;
  function wireProjectEvents() {
    if (projectEventsWired) return;
    projectEventsWired = true;
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushProject(); });
    window.addEventListener('pagehide', () => { flushProject(); });
  }

  function defaultProjectName() {
    const r = state.result;
    return (state.typed || (r && r.loc && r.loc.label) || els.addr.value || '').trim().slice(0, 80) || 'New project';
  }
  /** New project. With a site on screen it is a site project and gets the site section; without a site it has a local frame. */
  function projectCreate(name, { quiet = false } = {}) {
    flushProject();
    const r = state.result;
    const title = String(name || '').trim().slice(0, 80) || defaultProjectName();
    let doc;
    try { doc = r ? ProjectMod.newProject({ name: title, frame: siteFrameOf(r) }) : ProjectMod.newProject({ name: title }); } catch (e) {
      console.error(e);
      Toast.show(`The project could not be made. ${e && e.message ? e.message : ''}`.trim(), 'bad', 8000);
      return null;
    }
    openProjectDoc(doc);
    if (r) projectWrite(r); else project.dirty = true;
    const saved = flushProject();
    project.updateUrl(doc.id);
    if (!quiet && saved && saved.ok !== false) Toast.show(`Project ${project.doc.name} created.`);
    return project.doc;
  }
  /** Send: the project holds the site (made now when none is open), then the next tool opens with ?project=<id>. */
  async function projectSend(toolId) {
    Pop.close();
    const r = state.result;
    if (!['tower', 'midrise', 'grading'].includes(toolId) || !r || state.busy) return false;
    if (project.readOnly) { noticeOnce('readonly', READ_ONLY_TEXT); return false; }
    if (!project.doc) {
      if (!projectCreate(defaultProjectName(), { quiet: true })) return false;
    } else {
      const w = project.written, walks = projectMeta(r).walks;
      if ((!w || w.result !== r || w.walks !== walks) && !projectWrite(r)) return false;
    }
    const saved = flushProject();
    if (saved && saved.ok === false) return false;
    let url = null;
    try { url = ProjectMod.sendTo(storageOf(), project.doc, toolId, 'site', storageNotice()); } catch (e) {
      console.error(e);
      Toast.show(`The project could not be sent. ${e && e.message ? e.message : ''}`.trim(), 'bad', 8000);
      return false;
    }
    if (!url) { Toast.show('The project could not be sent.', 'bad', 8000); return false; }
    try { project.doc = ProjectMod.loadProject(storageOf(), project.doc.id, storageNotice()) || project.doc; } catch (e) { /* keep the copy in memory */ }     // sendTo saved a copy with a log entry
    project.dirty = false;
    project.navigate(url);
    return url;
  }
  function projectOpen(id) { flushProject(); project.navigate(projectHref(id)); }
  async function projectExport() {

  function initSheet() {

    const lowest = () => GRAB + 40;
    const snaps = () => [lowest(), Math.round(total() * 0.42), Math.round(total() * 0.86)];
    const setH = (px) => app.style.setProperty('--sheet-h', `${Math.round(clamp(px, lowest(), total() * 0.9))}px`);
    const curH = () => $('panel').getBoundingClientRect().height;
    const animateTo = (to) => {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return setH(to);
      const from = curH(), t0 = performance.now();
      const step = (now) => {
        const p = clamp((now - t0) / 180, 0, 1);
        setH(from + (to - from) * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    };
    let drag = null;
    grabber.addEventListener('pointerdown', (e) => { grabber.setPointerCapture(e.pointerId); drag = { y: e.clientY, h: curH(), moved: false }; });
    grabber.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const dy = drag.y - e.clientY;
      if (Math.abs(dy) > 4) drag.moved = true;
      if (drag.moved) setH(drag.h + dy);
    });
    const end = () => {
      if (!drag) return;
      const s = snaps(), now = curH();
      if (!drag.moved) animateTo(s.find((v) => v > now + 8) || s[0]);
      else animateTo(s.reduce((a, b) => (Math.abs(b - now) < Math.abs(a - now) ? b : a)));
      drag = null;
    };
    grabber.addEventListener('pointerup', end);
    grabber.addEventListener('pointercancel', end);
    grabber.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
      e.preventDefault();
      setH(curH() + (e.key === 'ArrowUp' ? 60 : -60));
    });
    const reset = () => { if (sheetQuery.matches) setH(total() * 0.42); else app.style.removeProperty('--sheet-h'); };
    (sheetQuery.addEventListener ? sheetQuery.addEventListener('change', reset) : sheetQuery.addListener(reset));
