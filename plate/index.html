      for (const p of corners) {
        const v = p.clone().sub(target), dd = v.dot(dir);
        dist = Math.max(dist, dd + Math.abs(v.dot(right)) / (tX * fit), dd + Math.abs(v.dot(up)) / (tY * fit));
      }
      return dist;
    };
    let dist = solve();
    for (let i = 0; i < 6; i++) {            // centre the projected box in the visible area, then re-solve the distance
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (const p of corners) {
        const v = p.clone().sub(target), z = dist - v.dot(dir);
        const nx = v.dot(right) / (z * tX), ny = v.dot(up) / (z * tY);
        x0 = Math.min(x0, nx); x1 = Math.max(x1, nx); y0 = Math.min(y0, ny); y1 = Math.max(y1, ny);
      }
      target.addScaledVector(right, ((x0 + x1) / 2) * tX * dist).addScaledVector(up, ((y0 + y1) / 2) * tY * dist);
      dist = solve();
    }
    return { dist, target };
  }

  /** Where each preset puts the camera. Every view frames the whole box (see boxOf) with a small margin. */
  function viewTarget(id, box, aspect, rot = 0) {
    const H = Math.max(box.height, 20);
    const ex = box.maxX - box.minX, ey = box.maxY - box.minY;
    const cx = (box.minX + box.maxX) / 2, cy = (box.minY + box.maxY) / 2;
    const fit = 1 - 2 * FIT_MARGIN;
    if (id === 'axon') {
      const az = rad(135), el = rad(28);      // camera sits south-east, looking north-west
      const dirPlan = [Math.sin(az) * Math.cos(el), Math.cos(az) * Math.cos(el), Math.sin(el)];
      const dir = new THREE.Vector3(...planToWorld(...dirPlan)).normalize();
      const f = fitPersp(box, dir, aspect, H);
      return { type: 'persp', dist: f.dist, target: f.target, dir };
    }
    const reach = 0.55 * Math.sqrt(ex * ex + ey * ey + H * H);     // keeps the whole box in front of an orthographic camera
    if (id === 'plan') {
      const vis = Math.max(ey / fit, ex / (aspect * fit), 30);
      const e = 0.0008;     // tiny tilt toward the south keeps "north up" without a degenerate up-vector
      const pz = box.planZ || 0;       // the plate stands at its level's z inside the massing: the camera looks at that height and stays above the top of the massing
      return {
        type: 'ortho', zoom: (2 * ORTHO_HALF) / vis, minDist: Math.max(reach, H - pz + 40),
        target: worldVec(cx, cy, pz),
        dir: new THREE.Vector3(...planToWorld(0, -Math.sin(e), Math.cos(e))).normalize(),
      };
    }
    // Elevations: N = looking at the north face from the north, etc.
    // Elevations look at a sector of the PROJECT frame. The scene is in the massing frame, so the viewing direction turns back by the placement rotation.
    const pd = { n: [0, 1], e: [1, 0], s: [0, -1], w: [-1, 0] }[id];
    const rr = rad(rot), cr = Math.cos(rr), sr = Math.sin(rr);
    const d = [pd[0] * cr + pd[1] * sr, -pd[0] * sr + pd[1] * cr];
    const turned = Math.abs(Math.sin(rr * 2)) > 1e-6;
    const along = turned ? Math.hypot(ex, ey) : ((id === 'n' || id === 's') ? ex : ey);
    const vis = Math.max(H / fit, along / (aspect * fit), 40);
    return {
      type: 'ortho', zoom: (2 * ORTHO_HALF) / vis, minDist: reach,
      target: worldVec(cx, cy, H / 2),
      dir: new THREE.Vector3(...planToWorld(d[0], d[1], 0)).normalize(),
    };
  }

  function framingAspect() {
    if (cmp) {
      const r = cmpRects();
      return r.length ? r[0].w / r[0].h : hostAspect();
    }
    return Math.max(0.2, (host.clientWidth - clamp(insetProvider().right || 0, 0, host.clientWidth * 0.6)) / Math.max(1, host.clientHeight));
  }

  function setView(id, animate = true) {
    if (!renderer) return;
    const goal = viewTarget(id, framingBox(id === 'axon'), framingAspect(), cmp ? 0 : num(Derived.get().rotation, 0));
    preset = id;
    overlayVis = null;
    tween = null;
    if (goal.type !== camType) switchCamera(goal.type);
    const curTarget = controls.target.clone();
    const curOffset = cam.position.clone().sub(curTarget);
    const curDist = Math.max(1, curOffset.length());
    const fromDir = curOffset.clone().normalize();
    const toDist = goal.type === 'persp' ? goal.dist : Math.max(curDist, goal.minDist || 0);
    const apply = (target, dir, dist, zoom) => {
      controls.target.copy(target);
      cam.position.copy(target).addScaledVector(dir, dist);
      if (camType === 'ortho') cam.zoom = zoom;
      cam.updateProjectionMatrix();
      controls.update();
    };
    if (!animate || reduceMotion) {
      apply(goal.target, goal.dir, toDist, goal.zoom);
    } else {
      tween = {
        t0: performance.now(), dur: 400,
        fromTarget: curTarget, toTarget: goal.target,
        fromDir, toDir: goal.dir, fromDist: curDist, toDist,
        fromZoom: cam.zoom, toZoom: goal.zoom || cam.zoom,
        q: new THREE.Quaternion().setFromUnitVectors(fromDir, goal.dir),
        apply,
      };
    }
    needsRender = true;
    viewListeners.forEach((fn) => fn(preset));
  }

  function stepTween(now) {
    const k = tween;
    const p = clamp((now - k.t0) / k.dur, 0, 1), e = easeInOut(p);
    const target = k.fromTarget.clone().lerp(k.toTarget, e);
    const dir = k.fromDir.clone().applyQuaternion(new THREE.Quaternion().slerp(k.q, e)).normalize();
    const dist = k.fromDist + (k.toDist - k.fromDist) * e;
    const zoom = k.fromZoom * Math.pow(k.toZoom / k.fromZoom, e);
    k.apply(target, dir, dist, zoom);
    needsRender = true;
    if (p >= 1) tween = null;
  }

  function updateClip() {
    const dist = cam.position.distanceTo(controls.target);
    if (camType === 'persp') {
      cam.near = Math.max(0.5, dist * 0.01);
      cam.far = dist * 20 + sceneRadius * 4 + 2000;
    } else {
      cam.near = 0.1;
      cam.far = dist + 60000;
    }
    cam.updateProjectionMatrix();
  }

  function resize() {
    if (!renderer) return;
    const w = Math.max(1, host.clientWidth), h = Math.max(1, host.clientHeight);
    renderer.setSize(w, h, false);
    setCamAspect(w / h);
    applyViewOffset();
    if (preset) setView(preset, false);
    needsRender = true;
    if (cmp) renderCompare(renderer, scene, cam, false); else renderer.render(scene, cam);
    resizeListeners.forEach((fn) => fn());
  }

  /* ---- compare: one renderer, one camera, one viewport per option -------------------------- */
  const cmpReserve = () => (cmp && cmp.reserve ? cmp.reserve() : { top: 0, bottom: 0 });
  function cmpRects(W = host.clientWidth, H = host.clientHeight, reserve = cmpReserve(), gap = 2) {
    return compareRects(cmp ? cmp.entries.length : 0, W, H, reserve, gap);
  }
  /** Draws every option into its own cell. Also used by screenshots (reserve = none, scaled size). */
  function renderCompare(r, s, c, forCapture) {
    if (!cmp || !cmp.entries.length) { r.render(s, c); return; }
    const size = r.getSize(_v2);
    const W = size.x, H = size.y;
    const k = W / Math.max(1, host.clientWidth);
    const reserve = forCapture ? { top: 0, bottom: 0 } : cmpReserve();
    const rects = compareRects(cmp.entries.length, W, H, reserve, 2 * k);
    r.setScissorTest(false);
    r.setViewport(0, 0, W, H);
    r.setClearColor(cssColor('--line'), 1);
    r.clear();
    r.setScissorTest(true);
    rects.forEach((rc, i) => {
      cmp.entries.forEach((e, j) => { e.group.visible = (i === j); });
      const x = Math.round(rc.x), y = Math.round(H - rc.y - rc.h), w = Math.round(rc.w), h = Math.round(rc.h);
      r.setViewport(x, y, w, h);
      r.setScissor(x, y, w, h);
      setCamAspect(rc.w / rc.h);
      r.render(s, c);
    });
    cmp.entries.forEach((e) => { e.group.visible = true; });
    r.setScissorTest(false);
    r.setViewport(0, 0, W, H);
    setCamAspect(hostAspect());
  }
  function combineBounds(list) {
    const ranges = (k) => list.map((d) => d.bounds[k]);
    const merge = (k) => {
      const rs = ranges(k);
      return {
        minX: Math.min(...rs.map((r) => r.minX)), maxX: Math.max(...rs.map((r) => r.maxX)),
        minY: Math.min(...rs.map((r) => r.minY)), maxY: Math.max(...rs.map((r) => r.maxY)),
        height: Math.max(...rs.map((r) => r.height || 0)),
      };
    };
    return { model: merge('model'), site: merge('site'), union: merge('union'), all: merge('all') };
  }
  function syncCompare() {
    const s = Store.raw(), v = s.view;
    const key = [v.style, v.labels, v.walls, v.levels3d, cmp.entries.map((e) => e.uid).join(',')].join('|');
    if (key === cmp.key) return;
    cmp.key = key;
    for (const e of cmp.entries) {
      if (e.group) { clearGroup(e.group); scene.remove(e.group); }
      const st = { ...e.state, view: { ...v } };
      const group = new THREE.Group();
      const built = Plate3D.build(e.d, st, { quality: 'full', key: 'cmp' });
      for (const o of built.model) group.add(o);
      for (const o of built.overlay) { if (!o.userData.flags) group.add(o); }
      e.group = group;
      scene.add(group);
    }
    viewVersion = -1; needsRender = true;
  }
  function enterCompare(entries, reserve, { keepView = false } = {}) {
    const wasComparing = !!cmp;
    exitCompare(true);
    const list = entries.map((e, i) => ({ ...e, uid: `${i}:${e.uid || e.name}`, group: null }));
    cmp = { entries: list, key: null, reserve, bounds: combineBounds(list.map((e) => e.d)) };
    layers.model.group.visible = layers.context.group.visible = layers.overlay.group.visible = false;
    layers.site.group.visible = false;
    layers.massing.group.visible = false;
    selOverlay.visible = false;
    figure.visible = false;
    applyViewOffset();
    syncCompare();
    viewVersion = -1;
    if (!(keepView && wasComparing)) setView('axon', false);
    needsRender = true;
  }
  function exitCompare(quiet) {
    if (!cmp) return;
    for (const e of cmp.entries) if (e.group) { clearGroup(e.group); scene.remove(e.group); }
    cmp = null;
    layers.model.group.visible = layers.context.group.visible = layers.overlay.group.visible = true;
    layers.site.group.visible = true;
    layers.massing.group.visible = true;
    selOverlay.visible = true;
    overlayVis = null;
    resetLayers();
    viewVersion = -1;
    if (!quiet) { applyViewOffset(); setCamAspect(hostAspect()); if (preset) setView(preset, false); needsRender = true; }
  }

  /* ---- loop ------------------------------------------------------------------------ */
  /** Line materials (fat lines) need the size of the view to draw a width in pixels. */
  function syncLineResolution() {
    const w = host.clientWidth, h = host.clientHeight;
    scene.traverse((o) => { if (o.material && o.material.isLineMaterial) o.material.resolution.set(w, h); });
  }
  function frame(now) {
    requestAnimationFrame(frame);
    if (capturing) return;
    if (tween) stepTween(now);
    const moved = controls.update();
    if (cmp) {
      syncCompare();
      if (viewVersion !== Store.version()) { viewVersion = Store.version(); applyView(); }
      if (moved || needsRender) { updateClip(); syncLineResolution(); renderCompare(renderer, scene, cam, false); needsRender = false; }
      return;
    }
    const d = Derived.get();
    const state = Store.raw();
    const disp = Derived.display();
    const first = derived === null;
    if (d.geomId !== geomIdSeen) {
      // Geometry changed: re-frame once the edit settles, but only when the framed area moved (a handle drag keeps the camera).
      const u = d.bounds.union, fk = [u.minX, u.maxX, u.minY, u.maxY].map((v) => Math.round(v / 40)).join(',');
      if (!first && fk !== frameKey) refitPending = true;
      frameKey = fk;
      geomIdSeen = d.geomId;
    }
    derived = d;
    const sfk = `${SiteLayer.frameKey(Store.raw())}|${Plate3D.editingAtZ(state)}`;       // the massing switching on or off moves the plate and the plan target
    if (siteFrameSeen !== null && sfk !== siteFrameSeen) refitPending = true;     // the site layer switched on or off: it is part of the framed box
    siteFrameSeen = sfk;
    syncMain(d, disp, state);
    syncOverlayVisibility(disp.quality === 'draft');
    if (moved || tween) syncMassingMode();
    if (first && !preset) setView('plan', false);
    if (rebuildNotified !== d) { rebuildNotified = d; rebuildListeners.forEach((fn) => fn(d)); }
    if (refitPending && !Store.gestureActive()) { refitPending = false; if (preset) setView(preset, true); }
    if (viewVersion !== Store.version()) { viewVersion = Store.version(); applyView(); }
    if (moved || needsRender) {
      for (const fn of frameListeners) { try { fn(); } catch (e) { console.error(e); } }
      updateClip(); syncLineResolution(); renderer.render(scene, cam); needsRender = false;
    }
  }

  /** Screenshot of what is on screen (main or compare). The HUD inset is removed so the model is centred. */
  async function capture(overlay, scale = 2) {
    if (!renderer) throw new Error('The 3D view is not available.');
    capturing = true;
    const overlayWas = selOverlay.visible;
    selOverlay.visible = false;
    try {
      for (const c of [persp, ortho]) c.clearViewOffset();
      syncLineResolution();
      return await ShotMod.captureView({
        renderer, scene, camera: cam, scale, overlay,
        render: cmp ? (r, s, c) => renderCompare(r, s, c, true) : undefined,
      });
    } finally {
      capturing = false;
      selOverlay.visible = overlayWas && !cmp;
      applyViewOffset();
      needsRender = true;
    }
  }

  function init(hostEl) {
    host = hostEl;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    } catch (e) {
      host.innerHTML = '<div class="gl-fail">WebGL is not available in this browser, so the 3D view cannot start.</div>';
      renderer = null;
      return false;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    host.appendChild(renderer.domElement);

    buildScene();
    persp = new THREE.PerspectiveCamera(FOV, 1, 1, 100000);
    ortho = new THREE.OrthographicCamera(-ORTHO_HALF, ORTHO_HALF, ORTHO_HALF, -ORTHO_HALF, 0.1, 100000);
    cam = persp;
    persp.position.set(300, 250, 300);

    controls = new OrbitControls(cam, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.12;
    controls.maxPolarAngle = Math.PI / 2;      // never below ground; exactly horizontal is allowed (elevations)
    controls.minDistance = 8;
    controls.maxDistance = 60000;
    controls.minZoom = 0.01; controls.maxZoom = 80;
    controls.screenSpacePanning = true;
    controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
    controls.addEventListener('start', () => {
      tween = null;
      if (preset) { preset = null; overlayVis = null; viewListeners.forEach((fn) => fn(null)); }
    });
    controls.addEventListener('change', () => { needsRender = true; });

    const ro = new ResizeObserver(resize);
    ro.observe(host);
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onTheme = () => { themeEpoch++; viewVersion = -1; };
    if (mq.addEventListener) mq.addEventListener('change', onTheme); else if (mq.addListener) mq.addListener(onTheme);

    renderer.domElement.addEventListener('webglcontextlost', (e) => e.preventDefault());
    refreshColors();
    resize();
    requestAnimationFrame(frame);
    return true;
  }

  return {
    init, setView, capture, enterCompare, exitCompare, pxPerFt,
    sceneFlags: () => ({ site: layers.site.group.visible, gridA: gridUniforms.uMajorA.value, grid: gridMesh.visible, figure: figure.visible, model: layers.model.group.visible, context: layers.context.group.visible, overlay: layers.overlay.group.visible, children: scene.children.length }),
    setInsetProvider: (fn) => { insetProvider = fn; },
    refreshInsets: (animate = true) => { if (!renderer) return; applyViewOffset(); if (preset) setView(preset, animate); else needsRender = true; },
    relayout: () => { needsRender = true; resizeListeners.forEach((fn) => fn()); },
    cells: () => (cmp ? cmpRects() : []),
    requestRender: () => { needsRender = true; },
    onRebuild: (fn) => rebuildListeners.push(fn),
    onViewChange: (fn) => viewListeners.push(fn),
    onResize: (fn) => resizeListeners.push(fn),
    overlayInfo: () => { const kids = layers.overlay.group.children; return { total: kids.length, plan: kids.filter((o) => o.userData.plan).length, planVisible: kids.some((o) => o.userData.plan && o.visible), labels: kids.filter((o) => o.userData.label).map((o) => o.userData.label) }; },
    /** Sizes of the drawn layers (tests): meshes by role, lines, labels. */
    layerInfo: () => {
      const role = (o) => (o.userData.units ? 'units' : o.userData.plate ? 'plate' : o.userData.corridor ? 'corridor' : o.userData.blocks ? 'blocks' : o.userData.context ? 'context' : 'other');
      const kind = (o) => (o.userData.labelId ? 'label' : o.userData.flags ? 'flags' : o.isLineSegments2 ? 'line' : 'other');
      const cnt = (g, f) => g.children.reduce((a, o) => { const k = f(o); a[k] = (a[k] || 0) + 1; return a; }, {});
      return { overlay: cnt(layers.overlay.group, kind), model: cnt(layers.model.group, role) };
    },
    framedBox: (id = 'axon') => framingBox(id === 'axon'),       // tests: the box a preset frames
    info: () => ({ camera: camType, preset, meshes: layers ? layers.model.group.children.length : 0, tweening: !!tween, distance: cam ? cam.position.distanceTo(controls.target) : 0, zoom: cam ? cam.zoom : 0, compare: !!cmp, drawQuality: derived ? Derived.display().quality : null }),
    ready: () => !!renderer,
    comparing: () => !!cmp,
    // v1.1 hooks for direct editing (Select): the camera, the orbit controls, the overlay group and a per-frame callback
    overlayGroup: () => selOverlay,
    onFrame: (fn) => frameListeners.push(fn),
    camera: () => cam,
    cameraType: () => camType,
    canvas: () => (renderer ? renderer.domElement : null),
    themeChanged: () => { themeEpoch++; viewVersion = -1; needsRender = true; },        // tests: what a light/dark switch does
    sceneObjects: () => { const out = []; scene.traverse((o) => out.push(o)); return out; },        // tests
    /** Tests: the massing layer. { solids, edges, rings, outlines, foot, active, visibleSolids, visibleOutlines, levels: [index of each solid] } */
    massingInfo: () => {
      const kids = layers.massing.group.children;
      const solids = kids.filter((o) => o.userData.massingMesh), outl = kids.filter((o) => o.userData.massingKind === 'outline');
      return {
        solids: solids.length, edges: kids.filter((o) => o.userData.massingEdges).length, rings: kids.filter((o) => o.userData.massingRing).length, outlines: outl.length, foot: kids.some((o) => o.userData.massingFoot),
        active: solids.filter((o) => o.userData.active).map((o) => o.userData.level), levels: solids.map((o) => o.userData.level), podium: solids.filter((o) => o.userData.podium).length,
        visibleSolids: solids.filter((o) => o.visible).length, visibleOutlines: outl.filter((o) => o.visible).length, groupVisible: layers.massing.group.visible,
        topY: solids.length ? Math.max(...solids.map((o) => { o.geometry.computeBoundingBox(); return o.geometry.boundingBox.max.y; })) : null,
      };
    },
    contextMeshes: () => layers.context.group.children.filter((o) => o.isMesh).length,       // tests: the ghost of the site neighbors
    setOrbitEnabled: (on) => { if (controls) { controls.enabled = !!on; if (!on) tween = null; } },
    orbitEnabled: () => !!controls && controls.enabled,
  };
})();

/* ==========================================================================
   SITE LAYER 3D  (docs/site-layer-technical-plan.md sections 4 and 5)
   `SiteLayer3D` turns the data of SiteLayerMod.buildSiteLayerData (plain arrays in a tool's local frame, z relative to the
   tool's base) into Three.js objects: the ground with elevation shading and a skirt, the draped boundary with its north arrow,
   the neighbor buildings (solid, with dark edges), roads, walks, water and trees. One merged BufferGeometry per kind.
   Same look as the Site Model scene (build/site/03_scene.js).

   Shared by every tool. Page globals used (at call time only): THREE, BufferGeometryUtils, planToWorld, planMatrix, worldVec.
   The tool's own 06c_site.js (SiteLayer) decides when to build and calls objects() inside kit.syncLayer.

   Everything draped on the ground (roads, walks, trees, the boundary arrow) samples the drawn ground MESH (the same two
   triangles per cell as the ground geometry), so nothing floats or sinks. Without a ground the sampler gives 0.
   ========================================================================== */
const SiteLayer3D = (() => {
  const ALL_PARTS = ['ground', 'boundary', 'buildings', 'roads', 'walks', 'water', 'trees'];
  const EDGE_ANGLE = 30;
  const GLASS_OPACITY = 0.25;            // site style 'glass'
  const STYLES = ['solid', 'glass', 'wireframe'];
  const BOUNDARY_COLOR = 0xc0701a;       // the Tower's dashed site loop
  const ARROW_COLOR = 0x1d2733;

  /* ---- colors from the CSS tokens (light value, dark value when the page has no token yet) ---- */
  const FALLBACK = {
    '--scene-terrain-lo': ['#d6dadd', '#3a4047'], '--scene-terrain-hi': ['#eceeef', '#4a5159'], '--scene-skirt': ['#bcc2c8', '#2a2f35'],
    '--scene-est': ['#efe2cf', '#dccaa9'], '--scene-road': ['#9ba1a8', '#656c74'], '--scene-walk': ['#c6cacd', '#858d95'],
    '--scene-water': ['#8dbbe3', '#3f72a6'], '--scene-tree': ['#8fa88b', '#6e8d6c'], '--scene-trunk': ['#8a8378', '#8a8378'],
    '--scene-model': ['#f6f6f3', '#efefec'], '--scene-edge': ['#20262d', '#e7eaee'],
  };
  const isDark = () => { try { return !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); } catch (e) { return false; } };
  function defaultCss(name, fallback) {
    let v = '';
    try { v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); } catch (e) { v = ''; }
    const fb = fallback || (FALLBACK[name] ? FALLBACK[name][isDark() ? 1 : 0] : '#888888');
    try { return new THREE.Color(v || fb); } catch (e) { return new THREE.Color(fb); }
  }

  /* ---- the drawn ground surface: elevation at a local point (relative z) ---- */
  /** Sampler over data.ground. The grid may be rotated (a rotated placement turns the mesh as a solid), so the query point is
   *  projected on the two grid axes. Same triangles as the mesh: cell split a-b-c / a-c-d, u >= v. null without a ground. */
  function makeSampler(g) {
    if (!g || !g.positions || !(g.n >= 2)) return null;
    const P = g.positions, n = g.n, d = g.spacing;
    const x0 = P[0], y0 = P[1];
    let e1x = (P[3] - x0) / d, e1y = (P[4] - y0) / d;
    let e2x = (P[3 * n] - x0) / d, e2y = (P[3 * n + 1] - y0) / d;
    const l1 = Math.hypot(e1x, e1y) || 1, l2 = Math.hypot(e2x, e2y) || 1;
    e1x /= l1; e1y /= l1; e2x /= l2; e2y /= l2;
    const L = n - 1;
    return (x, y) => {
      const dx = x - x0, dy = y - y0;
      const cu = Math.min(L, Math.max(0, (dx * e1x + dy * e1y) / d)), cv = Math.min(L, Math.max(0, (dx * e2x + dy * e2y) / d));
      const i = Math.min(Math.floor(cu), n - 2), j = Math.min(Math.floor(cv), n - 2);
      const u = cu - i, v = cv - j, o = j * n + i;
      const za = P[3 * o + 2], zb = P[3 * (o + 1) + 2], zc = P[3 * (o + n + 1) + 2], zd = P[3 * (o + n) + 2];
      return u >= v ? za + u * (zb - za) + v * (zc - zb) : za + u * (zc - zd) + v * (zd - za);
    };
  }

  /* ---- helpers ---- */
  /** Maps the y (elevation) of a world-space geometry through zOf. Only for a non-identity zOf. */
  function mapElevation(geo, zOf) {
    if (!zOf) return geo;
    const p = geo.getAttribute('position');
    for (let i = 0; i < p.count; i++) p.setY(i, zOf(p.getY(i)));
    p.needsUpdate = true;
    return geo;
  }
  function densifyRing(ring, step) {
    const out = [];
    for (let i = 0; i < ring.length; i++) {
      const a = ring[i], b = ring[(i + 1) % ring.length];
      out.push(a);
      const L = Math.hypot(b[0] - a[0], b[1] - a[1]), k = Math.ceil(L / step);
      for (let s = 1; s < k; s++) out.push([a[0] + (b[0] - a[0]) * s / k, a[1] + (b[1] - a[1]) * s / k]);
    }
    return out;
  }
  /** Drops a repeated closing point (ShapeUtils would drop it and shift the hole indices). */
  function trimRing(r) {
    const o = r.slice();
    while (o.length > 1 && o[0][0] === o[o.length - 1][0] && o[0][1] === o[o.length - 1][1]) o.pop();
    return o;
  }
  /** polys: [{ outer, holes }]. elevOf(x, y) gives the local elevation, zOf maps it to world y. Returns a BufferGeometry or null. */
  function polyGeometry(polys, elevOf, zOf, step) {
    const pos = [], idx = [];
    for (const p of polys) {
      try {
        const outer = step ? densifyRing(trimRing(p.outer), step) : trimRing(p.outer);
        const holes = (p.holes || []).map((hh) => (step ? densifyRing(trimRing(hh), step) : trimRing(hh)));
        const tris = THREE.ShapeUtils.triangulateShape(outer.map((q) => new THREE.Vector2(q[0], q[1])), holes.map((hh) => hh.map((q) => new THREE.Vector2(q[0], q[1]))));
        const all = outer.concat(...holes), base = pos.length / 3;
        for (const q of all) pos.push(q[0], zOf(elevOf(q[0], q[1])), -q[1]);
        for (const [a, b, c] of tris) {
          const ax = all[a][0], ay = all[a][1], bx = all[b][0], by = all[b][1], cx = all[c][0], cy = all[c][1];
          const ccw = (bx - ax) * (cy - ay) - (by - ay) * (cx - ax) > 0;      // plan CCW = facing up
          if (ccw) idx.push(base + a, base + b, base + c); else idx.push(base + a, base + c, base + b);
        }
      } catch (e) { console.warn('site polygon skipped', e); }
    }
    if (!idx.length) return null;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    return geo;
  }
  const mergeAll = (list) => {
    if (list.length === 1) return list[0];
    const merged = BufferGeometryUtils.mergeGeometries(list, false);
    list.forEach((g) => g.dispose());
    return merged;
  };

  /* ---- the parts ---- */
  function buildGround(data, o, mats, out, info) {
    const g = data.ground;
    if (!g) return;
    const n = g.n, N = n * n, P = g.positions;
    const lo = o.css('--scene-terrain-lo'), hi = o.css('--scene-terrain-hi'), c = new THREE.Color();
    const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
    for (let k = 0; k < N; k++) {
      pos[3 * k] = P[3 * k]; pos[3 * k + 1] = o.zOf(P[3 * k + 2]); pos[3 * k + 2] = -P[3 * k + 1];
      c.copy(lo).lerp(hi, g.shade[k]);
      col[3 * k] = c.r; col[3 * k + 1] = c.g; col[3 * k + 2] = c.b;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    geo.setIndex(new THREE.BufferAttribute(g.indices, 1));
    geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, metalness: 0, polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 2 });
    mats.push(mat);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.userData.kind = 'site-ground';
    mesh.userData.site = true;
    mesh.userData.receives = true;
    out.push(mesh);
    info.triangles += g.indices.length / 3;

    // skirt: a thin plate under the ground, the site reads as a physical model
    const sk = g.skirt;
    if (sk && sk.positions && sk.indices) {
      const sp = new Float32Array(sk.positions.length);
      for (let k = 0; k < sk.positions.length; k += 3) { sp[k] = sk.positions[k]; sp[k + 1] = o.zOf(sk.positions[k + 2]); sp[k + 2] = -sk.positions[k + 1]; }
      const sg = new THREE.BufferGeometry();
      sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
      sg.setIndex(new THREE.BufferAttribute(sk.indices, 1));
      sg.computeVertexNormals();
      const smat = new THREE.MeshStandardMaterial({ color: o.css('--scene-skirt'), roughness: 1, metalness: 0 });
      mats.push(smat);
      const skirt = new THREE.Mesh(sg, smat);
      skirt.userData.kind = 'site-skirt';
      skirt.userData.site = true;
      out.push(skirt);
      info.triangles += sk.indices.length / 3;
    }
  }

  /** The dashed site loop, just above the ground, and the north arrow beside its north-east corner (turns with the placement). */
  function buildBoundary(data, o, mats, out, zAt) {
    const ring = data.boundary;
    if (!ring || ring.length < 3) return;
    const dashed = new THREE.LineDashedMaterial({ color: BOUNDARY_COLOR, dashSize: 12, gapSize: 8 });
    const solid = new THREE.LineBasicMaterial({ color: ARROW_COLOR });
    mats.push(dashed, solid);
    const loop = new THREE.BufferGeometry().setFromPoints(ring.map((q) => worldVec(q[0], q[1], o.zOf(q[2]))));
    const line = new THREE.LineLoop(loop, dashed);
    line.computeLineDistances();
    line.userData.kind = 'site-boundary';
    out.push(line);

    // north arrow: project north in the local frame is (sin r, cos r); a shaft, a head and an N, flat on the ground
    const r = ((o.rotation || 0) * Math.PI) / 180, nx = Math.sin(r), ny = Math.cos(r), ex = ny, ey = -nx;     // north and east unit vectors
    let maxX = -Infinity, maxY = -Infinity, minX = Infinity, minY = Infinity;
    for (const q of ring) { maxX = Math.max(maxX, q[0]); maxY = Math.max(maxY, q[1]); minX = Math.min(minX, q[0]); minY = Math.min(minY, q[1]); }
    const span = Math.max(maxX - minX, maxY - minY, 1);
    const k = Math.max(0.5, Math.min(4, span / 1000));                                         // scales with the site, 1 at 1,000 ft
    let best = null;                                                                           // the boundary corner farthest toward north-east
    for (const q of ring) { const s = q[0] * (ex + nx) + q[1] * (ey + ny); if (!best || s > best.s) best = { s, q }; }
    const base = [best.q[0] + (ex - nx) * 30 * k, best.q[1] + (ey - ny) * 30 * k];
    const P = (a, b) => [base[0] + ex * a * k + nx * b * k, base[1] + ey * a * k + ny * b * k];   // a = east, b = north
    const pts = [];
    const seg = (p, q) => { pts.push(worldVec(p[0], p[1], o.zOf(zAt(p[0], p[1]) + 0.3)), worldVec(q[0], q[1], o.zOf(zAt(q[0], q[1]) + 0.3))); };
    // each stroke is cut into short pieces so it follows a sloping ground
    const stroke = (p, q) => { const m = Math.max(1, Math.ceil(Math.hypot(q[0] - p[0], q[1] - p[1]) / (6 * k))); for (let s = 0; s < m; s++) seg([p[0] + (q[0] - p[0]) * s / m, p[1] + (q[1] - p[1]) * s / m], [p[0] + (q[0] - p[0]) * (s + 1) / m, p[1] + (q[1] - p[1]) * (s + 1) / m]); };
    stroke(P(0, 0), P(0, 40)); stroke(P(0, 40), P(-7, 26)); stroke(P(0, 40), P(7, 26));
    stroke(P(-6, 50), P(-6, 68)); stroke(P(-6, 68), P(6, 50)); stroke(P(6, 50), P(6, 68));      // the letter N
    const arrow = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), solid);
    arrow.userData.kind = 'site-arrow';
    out.push(arrow);
  }

  function buildBuildings(data, o, mats, out, info) {
    const plain = [], est = [];
    let count = 0;
    for (const b of data.buildings || []) {
      try {
        if (!b.outer || b.outer.length < 3) continue;
        const shape = new THREE.Shape(b.outer.map((q) => new THREE.Vector2(q[0], q[1])));
        for (const hole of b.holes || []) if (hole.length >= 3) shape.holes.push(new THREE.Path(hole.map((q) => new THREE.Vector2(q[0], q[1]))));
        const geo = new THREE.ExtrudeGeometry(shape, { depth: Math.max(0.1, b.height) + 1, bevelEnabled: false, steps: 1, curveSegments: 1 });
        geo.deleteAttribute('uv');
        geo.applyMatrix4(planMatrix(b.base - 1));
        mapElevation(geo, o.identity ? null : o.zOf);
        (b.rule === 'estimate' ? est : plain).push(geo);
        count++;
      } catch (e) { console.warn('site building skipped', b && b.id, e); }
    }
    const style = o.style;
    for (const [list, color] of [[plain, o.css('--scene-model')], [est, o.css('--scene-est')]]) {
      if (!list.length) continue;
      const merged = mergeAll(list);
      let tris = 0;
      if (style !== 'wireframe') {                                  // wireframe: edges only, no faces
        const glass = style === 'glass';
        const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.94, metalness: 0 });
        if (glass) { mat.transparent = true; mat.opacity = GLASS_OPACITY; mat.depthWrite = false; }
        mats.push(mat);
        const mesh = new THREE.Mesh(merged, mat);
        mesh.userData.kind = 'site-buildings';
        mesh.userData.site = true;
        mesh.userData.casts = true; mesh.userData.receives = !glass;
        if (glass) mesh.renderOrder = 2;                            // after the ground and the roads
        out.push(mesh);
        tris = (merged.index ? merged.index.count : merged.getAttribute('position').count) / 3;
        info.triangles += tris;
      }
      if (o.edges || style === 'wireframe') {                       // a wireframe is its edges: they stay even when edges is off
        const emat = new THREE.LineBasicMaterial({ color: o.css('--scene-edge') });
        mats.push(emat);
        const edges = new THREE.LineSegments(new THREE.EdgesGeometry(merged, EDGE_ANGLE), emat);
        edges.userData.kind = 'site-building-edges';
        edges.userData.site = true;
        if (style !== 'solid') edges.renderOrder = 3;
        out.push(edges);
      }
      if (style === 'wireframe') merged.dispose();                  // no mesh holds it
    }
    info.buildings = count;
  }

  function buildPavement(polys, colorName, lift, factor, kind, o, mats, out, info, zAt) {
    if (!polys || !polys.length) return;
    const geo = polyGeometry(polys, (x, y) => zAt(x, y) + lift, o.zOf, 10);
    if (!geo) return;
    const mat = new THREE.MeshStandardMaterial({ color: o.css(colorName), roughness: 1, metalness: 0, polygonOffset: true, polygonOffsetFactor: factor, polygonOffsetUnits: factor });
    mats.push(mat);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.userData.kind = kind;
    mesh.userData.site = true;
    mesh.userData.receives = true;
    out.push(mesh);
    info.triangles += geo.index.count / 3;
    info[kind === 'site-roads' ? 'roads' : 'walks'] = polys.length;
  }

  function buildWater(data, o, mats, out, info) {
    const w = data.water || {};
    const geos = [];
    for (const a of w.areas || []) {
      const g = polyGeometry([a], () => a.level, o.zOf, 0);
      if (g) geos.push(g);
    }
    info.waterAreas = geos.length;
    const color = o.css('--scene-water');
    if (geos.length) {
      const merged = mergeAll(geos);
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0, polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3 });
      mats.push(mat);
      const mesh = new THREE.Mesh(merged, mat);
      mesh.userData.kind = 'site-water';
      mesh.userData.site = true;
      mesh.userData.receives = true;
      out.push(mesh);
      info.triangles += merged.index.count / 3;
    }
    const seg = [];
    for (const line of w.lines || []) {
      for (let i = 1; i < line.length; i++) {
        const a = line[i - 1], b = line[i];
        seg.push(a[0], o.zOf(a[2]), -a[1], b[0], o.zOf(b[2]), -b[1]);
      }
    }
    if (seg.length) {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(seg, 3));
      const lmat = new THREE.LineBasicMaterial({ color });
      mats.push(lmat);
      const lines = new THREE.LineSegments(g, lmat);
      lines.userData.kind = 'site-water-lines';
      out.push(lines);
    }
  }

  /** Two InstancedMesh (low-poly canopy, thin trunk), like the Site Model. */
  function buildTrees(data, o, mats, out, info, zAt) {
    const trees = data.trees || [];
    if (!trees.length) return;
    info.trees = trees.length;
    const canopyGeo = new THREE.IcosahedronGeometry(1, 1);
    const trunkGeo = new THREE.CylinderGeometry(0.55, 0.8, 1, 6);
    trunkGeo.translate(0, 0.5, 0);
    const cm = new THREE.MeshStandardMaterial({ color: o.css('--scene-tree'), roughness: 0.94, metalness: 0, flatShading: true });
    const tm = new THREE.MeshStandardMaterial({ color: o.css('--scene-trunk'), roughness: 0.94, metalness: 0 });
    mats.push(cm, tm);
    const canopy = new THREE.InstancedMesh(canopyGeo, cm, trees.length);
    const trunk = new THREE.InstancedMesh(trunkGeo, tm, trees.length);
    const ky = o.identity ? 1 : o.zOf(1) - o.zOf(0);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), s = new THREE.Vector3();
    trees.forEach((t, i) => {
      const e = o.hasGround ? zAt(t.x, t.y) : t.z, r = t.canopy / 2;
      p.set(t.x, o.zOf(e + t.height - r), -t.y); s.set(r, r * 0.9 * ky, r);
      canopy.setMatrixAt(i, m.compose(p, q, s));
      p.set(t.x, o.zOf(e), -t.y); s.set(1, (t.height - r) * ky, 1);
      trunk.setMatrixAt(i, m.compose(p, q, s));
    });
    canopy.instanceMatrix.needsUpdate = trunk.instanceMatrix.needsUpdate = true;
    canopy.computeBoundingSphere(); trunk.computeBoundingSphere();
    for (const mesh of [trunk, canopy]) { mesh.userData.kind = 'site-trees'; mesh.userData.site = true; mesh.userData.casts = true; out.push(mesh); }
    info.triangles += (canopyGeo.index ? canopyGeo.index.count / 3 : 0) * trees.length + (trunkGeo.index ? trunkGeo.index.count / 3 : 0) * trees.length;
  }

  /* ---- public ---- */
  /** THREE objects for a data result of SiteLayerMod.buildSiteLayerData.
   *  opts: { parts: ['ground','boundary','buildings','roads','walks','water','trees'] (default all),
   *          zOf: (localZ) => worldY (default identity; the Grading Sketch passes its exaggeration mapper),
   *          css: (name, fallback) => THREE.Color, edges: true, shadows: true,
   *          rotation: placement rotation in degrees (turns the north arrow; default 0),
   *          style: 'solid' (default) | 'glass' (buildings opacity 0.25, depthWrite off, renderOrder 2, edges 3) | 'wireframe' (buildings as edges only;
   *                 the edges are drawn even when edges is false). Only the neighbor buildings change; an unknown value means 'solid'.
   *          zAt: (x, y) => local ground z (default: the drawn ground mesh) }
   *  Returns { objects: [THREE.Object3D], info: { style, ground, buildings, roads, walks, waterAreas, trees, triangles, bounds } }.
   *  Each object has userData.kind ('site-ground', 'site-skirt', 'site-boundary', 'site-arrow', 'site-buildings',
   *  'site-building-edges', 'site-roads', 'site-walks', 'site-water', 'site-water-lines', 'site-trees') and userData.site = true;
   *  userData.casts / userData.receives say which shadow flags setShadows() turns on. */
  function objects(data, opts = {}) {
    const info = { style: 'solid', ground: false, buildings: 0, roads: 0, walks: 0, waterAreas: 0, trees: 0, triangles: 0, bounds: data && data.bounds ? { ...data.bounds } : null };
    const out = [], mats = [];
    if (!data || !data.ok) return { objects: out, info };
    const parts = new Set(Array.isArray(opts.parts) ? opts.parts : ALL_PARTS);
    const identity = typeof opts.zOf !== 'function';
    const o = {
      zOf: identity ? (z) => z : opts.zOf, identity,
      css: typeof opts.css === 'function' ? opts.css : defaultCss,
      edges: opts.edges !== false, rotation: opts.rotation || 0,
      hasGround: !!data.ground,
      style: STYLES.includes(opts.style) ? opts.style : 'solid',
    };
    info.style = o.style;
    const sampler = makeSampler(data.ground);
    const zAt = typeof opts.zAt === 'function' ? opts.zAt : (sampler || (() => 0));
    if (parts.has('ground')) { buildGround(data, o, mats, out, info); info.ground = !!data.ground; }
    if (parts.has('boundary')) buildBoundary(data, o, mats, out, zAt);
    if (parts.has('buildings')) buildBuildings(data, o, mats, out, info);
    if (parts.has('roads')) buildPavement(data.roads, '--scene-road', 0.3, -2, 'site-roads', o, mats, out, info, zAt);
    if (parts.has('walks')) buildPavement(data.walks, '--scene-walk', 0.45, -4, 'site-walks', o, mats, out, info, zAt);
    if (parts.has('water')) buildWater(data, o, mats, out, info);
    if (parts.has('trees')) buildTrees(data, o, mats, out, info, zAt);
    info.triangles = Math.round(info.triangles);
    const shadows = opts.shadows !== false;
    for (const obj of out) {
      obj.userData.ownMaterials = mats;             // all of this call's materials; dispose() frees them once
      obj.castShadow = shadows && !!obj.userData.casts;
      obj.receiveShadow = shadows && !!obj.userData.receives;
    }
    return { objects: out, info };
  }

  /** Disposes the geometries and the own materials of objects made by objects(). Safe to call twice. */
  function dispose(objs) {
    const done = new Set();
    for (const o of objs || []) {
      if (o.geometry) o.geometry.dispose();
      if (o.isInstancedMesh) o.dispose();
      const list = o.userData && o.userData.ownMaterials;
      if (list && !done.has(list)) { done.add(list); list.forEach((m) => m.dispose()); }
    }
  }

  /** Turns the shadow flags of objects made by objects() on or off (casters only when `cast`, receivers only when `receive`). */
  function setShadows(objs, cast, receive) {
    for (const o of objs || []) {
      if (!o.userData || !o.userData.site) continue;
      o.castShadow = !!cast && !!o.userData.casts;
      o.receiveShadow = !!receive && !!o.userData.receives;
    }
  }

  /** The cache key for a tool's syncLayer: `${siteUpdatedAt}|${x},${y},${rot},${baseZ}|${showFlags}|${themeEpoch}|${style}`.
   *  doc: the project document (or null); show: a string or an object of flags; style: the site style ('solid' when missing). */
  function keyFor(doc, placement, show, themeEpoch, style) {
    let stamp = '';
    try {
      const sec = ProjectMod.getSection(doc, 'site');
      if (sec) {
        const dv = sec.derived || {};
        stamp = `${sec.updatedAt || ''}#${dv.ground ? dv.ground.n : 0}.${(dv.buildings || []).length}`;
      }
    } catch (e) { stamp = ''; }
    const p = placement || {};
    const flags = show && typeof show === 'object' ? Object.keys(show).sort().map((k) => `${k}=${show[k] ? 1 : 0}`).join(',') : String(show === undefined ? '' : show);
    return `${stamp}|${p.x || 0},${p.y || 0},${p.rotation || 0},${p.baseZ || 0}|${flags}|${themeEpoch || 0}|${STYLES.includes(style) ? style : 'solid'}`;
  }

  /** The box a view frames when a site is open: the building box grown by max(150 ft, 0.6 x its larger plan span) on every side,
   *  then clamped to the site square, so the site runs past the edges of the view. A building that sticks out of the square stays inside the box.
   *  b, sb: { minX, maxX, minY, maxY } (b may carry height and minZ, which are kept). → a new box. */
  function frameAround(b, sb) {
    const span = Math.max(b.maxX - b.minX, b.maxY - b.minY);
    const m = Math.max(150, 0.6 * span);
    return {
      ...b,
      minX: Math.min(b.minX, Math.max(b.minX - m, sb.minX)), maxX: Math.max(b.maxX, Math.min(b.maxX + m, sb.maxX)),
      minY: Math.min(b.minY, Math.max(b.minY - m, sb.minY)), maxY: Math.max(b.maxY, Math.min(b.maxY + m, sb.maxY)),
    };
  }

  return { objects, dispose, setShadows, keyFor, makeSampler, frameAround, STYLES };
})();

/* ==========================================================================
   SELECT, EDIT and DRAW  (plan section 5 "Editing", 6 "Picking")
   Click a unit to select it (the card shows type, width, area, exposures, flags, a lock toggle and the type chips).
   Drag a bay line (the demising line between two units) to move it along the run: the two units change width, their sum stays, and both
   become locks. Drag the core, a stair or a support block to move it (snap to the grid). Draw: tap points for a polygon plate, or two
   corners for a block. Mac shortcuts: 1 to 6 views (Plan is 6 and the default), D Model/Diagram, L lock, F re-fill, Delete removes a block,
   Escape clears.

   Picking is plane math: a ray to the plane at the elevation of the editing level, then the plan point is tested against the unit
   rings. There are no picking meshes. A bay line is hit within BAY_PX screen pixels (16 on a mouse, 28 on touch).

   Selection and the drawing in progress live HERE, never in the Store, so they are never saved, exported or undone. A lock is state:
   `locks` for a drawn plate, `levels.groups[gid].locks` for a project. Locked units keep their outline and type through every fill.
   ========================================================================== */
const Select = (() => {
  const $ = (id) => document.getElementById(id);
  const PICK_PX = 6, PICK_MS = 400, BAY_PX = 16, BAY_PX_TOUCH = 28;
  const D = () => Derived.get();
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  let sel = null, ready = false, draw = null, drag = null, hover = null;
  const listeners = [];
  let group = null, previewGroup = null, dotTexture = null;
  const fmt = (v) => Units.formatFeetInches(v);

  /* ---- levels, units, locks -------------------------------------------------------------------------------- */
  const editing = () => { const d = D(); return d.ok ? d.editing : null; };
  const unitAt = (k) => { const L = editing(); return L && L.units[k] ? L.units[k] : null; };
  const mixList = () => { const s = Store.raw(); return (s.mix && s.mix[s.mode]) || []; };

    table.append(h('thead', null, h('tr', null, h('th', null, 'Type'), h('th', null, 'Placed'), h('th', null, 'Target'), h('th', null, 'Avg area'))));
    const body = h('tbody');
    for (const r of rows) {
      body.append(h('tr', { 'data-type': r.type }, h('td', null, h('span', { class: 'sw', style: `background:${colorOf(r.type)}` }), nameOf(r.type)), h('td', null, String(r.count)), h('td', { class: Math.abs(r.diff) > 1 ? 'bad' : '' }, r.target === undefined ? '-' : String(r.target)), h('td', null, r.avgArea ? SF(r.avgArea) : '-')));
    }
    table.append(body);
  }

  function updateHud(d) {
    const m = d.hud;
    const hotel = isHotel();
    setText('kUnits', hotel ? 'Keys' : 'Units');
    setText('mUnits', Units.formatInt(m.units));
    setText('mNrsf', SF(m.nrsf));
    setText('mEff', pct1(m.efficiency));
    setText('mGsf', SF(m.gsf));
    setText('mAvg', SF(m.avgUnit));
    setText('mCor', m.corridorFt ? `${FT(m.corridorFt)}${m.corridorPerUnit ? ` · ${FT(m.corridorPerUnit)} per ${hotel ? 'key' : 'unit'}` : ''}` : 'none');
    setText('mPath', opt(m.stairPathFt, FT));
    setText('mDead', m.deadEnds && m.deadEnds.length ? `${m.deadEnds.length} · longest ${opt(m.deadEndMax, FT)}` : 'none');
    setText('mSupport', m.support ? `${SF(m.support.areaSf !== undefined ? m.support.areaSf : 0)}${m.support.count !== undefined ? ` · ${m.support.count} blocks` : ''}` : 'none');
    setText('mAcc', String(m.accessible));
    $('mHotelRow').hidden = !hotel;
    if (hotel && m.hotel) setText('mReach', m.hotel.reachable !== undefined ? `${m.hotel.reachable} of ${m.units} keys within ${FT(Store.get('housekeepingReach'))}` : 'reported');
    const types = (get(`mix.${hotel ? 'hotel' : 'multifamily'}`) || []);
    mixTable($('hudMixTable'), m.mix, types);
    mixTable($('mixTable'), m.mix, types);
    $('hudMix').hidden = !m.mix.length;
    $('hudBuilding').hidden = !(m.building && m.building.floors > 1);
    if (m.building) kvRows($('hudBuildingList'), [
      ['Floors', Units.formatInt(m.building.floors)], [hotel ? 'Keys' : 'Units', Units.formatInt(m.building.units)], ['NRSF', SF(m.building.nrsf)], ['GSF', SF(m.building.gsf)], ['Efficiency', pct1(m.building.efficiency)],
    ]);

    const list = $('warnList');
    list.textContent = '';
    if (!d.warnings.length) list.append(h('li', { class: 'none' }, 'No warnings'));
    for (const w of d.warnings) list.append(warnItem(w));
    const nw = d.warnings.filter((w) => w.level !== 'info').length;
    $('warnCount').textContent = String(d.warnings.length);
    $('warnBlock').dataset.n = String(d.warnings.length);
    $('hudBadge').dataset.n = String(nw);
    $('hudBadge').textContent = `${nw} ${nw === 1 ? 'warning' : 'warnings'}`;
    $('staleNote').hidden = !d.stale;

    updateNotes(d);
    updateGroups(d);
    updateLegend(d);
  }

  /** The small readouts inside the panel sections. */
  function updateNotes(d) {
    const st = Store.raw(), m = d.hud;
    const sn = $('sourceNote');
    if (sn) {
      const err = !d.ok && d.warnings[0] ? d.warnings[0].text : '';
      sn.textContent = err || (d.notes || []).join(' ');
      sn.hidden = !sn.textContent;
      sn.classList.toggle('caution', !!err);
    }
    const pn = $('polyNote');
    if (pn) pn.textContent = st.plate.points.length >= 3 ? `${st.plate.points.length} points, ${SF(Math.abs(ringArea(st.plate.points)))}.` : 'No outline yet. Draw one.';
    updateMixNote();
    const ln = $('lockNote');
    if (ln) { const n = Select.locks().length; ln.textContent = n ? `${n} locked unit${n === 1 ? '' : 's'} in this ${st.source === 'project' ? 'group' : 'plate'}.` : 'No locked units.'; }
    const an = $('accNote');
    if (an && d.metrics) {
      const a = d.metrics.building.accessible;
      an.textContent = isHotel() ? `Required ${a.required} accessible keys (${a.rollIn} roll-in) for ${m.building ? m.building.units : m.units} keys; provided ${a.provided}.` : `Required ${a.required} Type A units for ${m.building ? m.building.units : m.units} units; provided ${a.provided}.`;
    }
    const cw = $('checksWarnings');
    if (cw) { cw.textContent = ''; if (!d.warnings.length) cw.append(h('li', { class: 'none' }, 'No warnings')); for (const w of d.warnings) cw.append(warnItem(w)); }
    const hotel = isHotel();
    kvRows($('numbersTable'), [
      [hotel ? 'Keys' : 'Units', Units.formatInt(m.units)], ['NRSF', SF(m.nrsf)], ['GSF', SF(m.gsf)], ['Efficiency', pct1(m.efficiency)], ['Average unit', SF(m.avgUnit)],
      ['Corner units', Units.formatInt(m.corners)], ['Exposures N E S W', ['N', 'E', 'S', 'W'].map((k) => `${k} ${m.exposures[k]}`).join(' · ')],
      ['Corridor length', m.corridorFt ? FT(m.corridorFt) : 'none'], ['Stair doors', Units.formatInt(m.stairDoors)], ['Longest stair door path', opt(m.stairPathFt, FT)],
      ['Dead ends', m.deadEnds && m.deadEnds.length ? m.deadEnds.map((x) => (typeof x === 'number' ? FT(x) : FT(x.length || 0))).join(', ') : 'none'],
      ['Area closure', m.closure ? (m.closure.ok ? 'closes' : `off by ${m.closure.diff} sf`) : 'not reported'],
    ]);
    const mn = $('mixNote');
    if (mn) mn.textContent = m.mix.length ? 'The target is the count the shares give for the length of the runs. A miss is more than one unit off.' : 'No mix targets for this plate.';
  }

  /* ---- legend ------------------------------------------------------------------------------ */
  function updateLegend() {
    const box = $('legend');
    const v = Store.raw().view;
    if (Render.comparing()) { box.hidden = true; return; }
    const rows = [];
    if (v.style === 'diagram') {
      for (const t of get(`mix.${isHotel() ? 'hotel' : 'multifamily'}`) || []) rows.push([t.color, t.name, `type-${t.id}`]);
    }
    rows.push([CONFIG.corridorColor, 'Corridor', 'role-corridor'], [CONFIG.coreColor, 'Core, stairs, elevators', 'role-core'], [CONFIG.supportColor, 'Support', 'role-support']);
    const key = JSON.stringify([rows, v.style]);
    box.hidden = false;
    if (box.dataset.key === key) return;
    box.dataset.key = key;
    box.textContent = '';
    for (const r of rows) box.append(h('div', { class: 'lg-row', 'data-key': r[2] }, h('span', { class: 'sw', style: `background:${r[0]}` }), h('span', null, r[1])));
  }
  /* ---- bottom sheet (iPad portrait / narrow) -------------------------------------------- */
  function initSheet() {
    const app = $('app'), grabber = $('grabber');
    const GRAB = 44;
    const total = () => app.clientHeight;
    // The lowest stop shows the grabber and the tab bar, so the tabs sit at the top of the sheet even when it is pulled down.
    const lowest = () => GRAB + ($('panelTabs').offsetHeight || 45) + 2;
    const snaps = () => [lowest(), Math.round(total() * 0.42), Math.round(total() * 0.86)];
    const setH = (px) => app.style.setProperty('--sheet-h', `${Math.round(clamp(px, lowest(), total() * 0.9))}px`);
    const curH = () => $('panel').getBoundingClientRect().height;
    const animateTo = (to) => {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return setH(to);
      const from = curH(), t0 = performance.now();
      const step = (now) => {
        const p = clamp((now - t0) / 180, 0, 1);
        setH(from + (to - from) * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    };
    let drag = null;
    grabber.addEventListener('pointerdown', (e) => {
      grabber.setPointerCapture(e.pointerId);
      drag = { y: e.clientY, h: curH(), moved: false };
    });
    grabber.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const dy = drag.y - e.clientY;
      if (Math.abs(dy) > 4) drag.moved = true;
      if (drag.moved) setH(drag.h + dy);
    });
    const end = () => {
      if (!drag) return;
      const s = snaps(), now = curH();
      if (!drag.moved) {                                   // tap: cycle to the next snap
        const next = s.find((v) => v > now + 8) || s[0];
        animateTo(next);
      } else {
        animateTo(s.reduce((a, b) => (Math.abs(b - now) < Math.abs(a - now) ? b : a)));
      }
      drag = null;
    };
    grabber.addEventListener('pointerup', end);
    grabber.addEventListener('pointercancel', end);
    grabber.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
      e.preventDefault();
      setH(curH() + (e.key === 'ArrowUp' ? 60 : -60));
    });
    const reset = () => { if (sheetQuery.matches) setH(total() * 0.42); else app.style.removeProperty('--sheet-h'); };
    (sheetQuery.addEventListener ? sheetQuery.addEventListener('change', reset) : sheetQuery.addListener(reset));
    reset();
    window.addEventListener('resize', () => { if (sheetQuery.matches) { const px = parseFloat(app.style.getPropertyValue('--sheet-h')); if (px) setH(px); } });
    /** Pulls a collapsed sheet up to its middle stop (a tab was tapped, or an item was opened). */
    sheetRaise = () => { if (sheetQuery.matches && curH() < lowest() + 24) animateTo(snaps()[1]); };
  }
  let sheetRaise = () => {};
  const raiseSheet = () => sheetRaise();

  /* ---- keyboard ---------------------------------------------------------------------------- */
  function initKeys() {
    window.addEventListener('keydown', (e) => {
      if (!(e.metaKey || e.ctrlKey) || e.altKey) return;
      const key = e.key.toLowerCase();
      if (key === 's') { e.preventDefault(); Options.save(); return; }
      if (key !== 'z' && key !== 'y') return;
      const t = e.target;
      if (t && t.matches && t.matches('input[type="text"], textarea') && t.dataset.dirty === '1') return;   // let the browser undo typing
      e.preventDefault();
      if (key === 'y' || e.shiftKey) Store.redo(); else Store.undo();
    });
  }

  function init() {
    buildTopBar();
    buildPanel();
    buildTabs();
    setTab(TABS.some((t) => t.id === prefs.tab) ? prefs.tab : 'plate', { remember: false });
    buildViews();
    buildHud();
    initSheet();
    initKeys();
    Store.subscribe(() => { Controls.refreshAll(); updateLegend(); });
    Controls.refreshAll();
    Render.onRebuild(updateHud);
    // A viewport that is not WebGL-capable still gets numbers.
    updateHud(Derived.get());
  }
  return {
    init, updateHud, rebuildPanel: () => { Controls.refreshAll(); },
    // test hooks: the section controllers, and a rebuild of the panel from the saved UI prefs (a simulated reload)
    sectionCtl, rebuildSections: () => { buildPanel(); setTab(activeTab, { remember: false }); Controls.refreshAll(); },
    setTab, activeTab: () => activeTab, tabs: () => TABS.map((t) => t.id),
    setHudOpen, hudOpen: () => $('hud').dataset.collapsed === 'false', sections: () => SECTIONS.map((s) => ({ id: s.id, tab: s.tab })),
    openSection,
  };
})();

/* ==========================================================================
   FILE EXPORTS  (plan sections 4 and 5)
   Export menu > Rooms (.csv), DXF (.dxf), SketchUp (.json), Notes (.md). Each one reads the same build the screen shows
   (Derived.get().built and .derived) through the src/plate writers: PlateExportsMod.roomsCsv / plateDxf / notesMarkdown and
   SkPlate.plateToSketchup. The file format helpers for the SketchUp document are src/shared/sketchup-format.js (SkFmt).
   Every action returns { ok, filename, blob, ... } and takes `{ deliver }` so tests can catch the file instead of downloading it.
   ========================================================================== */
const FileExports = (() => {
  const slug = (name) => String(name || 'plate').trim().replace(/[^\w\-]+/g, '-').replace(/^-+|-+$/g, '').toLowerCase() || 'plate';
  const stamp = () => { const d = new Date(), p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
  function save(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);   // revoking sooner can break some downloads
  }
  const fail = (what, e) => { console.error(e); Toast.show(`The ${what} could not be built for these settings.`, 'bad'); return { ok: false, errors: [String(e && e.message)] }; };
  const noPlates = () => { const d = Derived.get(); if (d.ok && d.derived && d.derived.levels.length) return false; Toast.show('Nothing to export yet. The plates are empty.', 'warn'); return true; };
  const meta = (s) => ({ name: s.name, date: stamp(), source: s.source, createdAt: new Date().toISOString() });
  const placementNow = () => { const p = ProjectUI.placement(); return p; };

  /* ---- Rooms CSV ---- */
  const roomsText = () => PlateExportsMod.roomsCsv(Derived.get().derived, placementNow());
  function rooms({ deliver } = {}) {
    if (noPlates()) return { ok: false, errors: ['empty'] };
    let text;
    try { text = roomsText(); } catch (e) { return fail('rooms file', e); }
    const name = `${slug(Store.get('name'))}-${stamp()}-rooms.csv`;
    const blob = new Blob([text], { type: 'text/csv' });
    (deliver || save)(blob, name);
    if (!deliver) Toast.show(`Saved ${name}`);
    return { ok: true, filename: name, blob, text };
  }

  /* ---- DXF ---- */
  const dxfText = () => PlateExportsMod.plateDxf(Derived.get().derived, Store.raw());
  function dxf({ deliver } = {}) {
    if (noPlates()) return { ok: false, errors: ['empty'] };
    let text;
    try { text = dxfText(); } catch (e) { return fail('DXF file', e); }
    const name = `${slug(Store.get('name'))}-${stamp()}-plates.dxf`;
    const blob = new Blob([text], { type: 'application/dxf' });
    (deliver || save)(blob, name);
    if (!deliver) Toast.show(`Saved ${name}`);
    return { ok: true, filename: name, blob, text };
  }

  /* ---- SketchUp ---- */
  function sketchupDoc(state, built) {
    const s = state || Store.raw();
    const d = built ? { built, metrics: PlateMetricsMod.computeMetrics(s, built) } : Derived.get();
    return SkPlate.plateToSketchup(s, d.built, d.metrics, { name: s.name, createdAt: new Date().toISOString() });
  }
  const sketchupName = (state) => SkFmt.sketchupFilename((state || Store.raw()).name);
  function sketchup({ deliver } = {}) {
    if (noPlates()) return { ok: false, errors: ['empty'] };
    let d;
    try { d = sketchupDoc(); } catch (e) { return fail('SketchUp file', e); }
    const v = SkFmt.validateDoc(d);
    if (!v.ok) { console.error(v.errors); Toast.show('The SketchUp file did not pass its own check, so it was not saved.', 'bad'); return { ok: false, errors: v.errors }; }
    if (!v.counts.solid && !v.counts.mesh) { Toast.show('Nothing to export yet.', 'warn'); return { ok: false, errors: ['empty'] }; }
    const name = sketchupName();
    const blob = SkFmt.docToBlob(d);
    (deliver || save)(blob, name);
    if (!deliver) Toast.show(`Saved ${name}. In SketchUp: Extensions > CMRLM > Import Design Tools file.`);
    return { ok: true, filename: name, blob, counts: v.counts };
  }

  /* ---- Notes ---- */
  const notesText = () => { const d = Derived.get(), s = Store.raw(); return PlateExportsMod.notesMarkdown(s, d.built, d.metrics, meta(s)); };
  function notes({ deliver } = {}) {
    if (noPlates()) return { ok: false, errors: ['empty'] };
    let text;
    try { text = notesText(); } catch (e) { return fail('notes file', e); }
    const name = `${slug(Store.get('name'))}-${stamp()}-plate-notes.md`;
    const blob = new Blob([text], { type: 'text/markdown' });
    (deliver || save)(blob, name);
    if (!deliver) Toast.show(`Saved ${name}`);
    return { ok: true, filename: name, blob, text };
  }
  return { roomsText, rooms, dxfText, dxf, sketchupDoc, sketchupName, sketchup, notesText, notes, save };
})();

/* ==========================================================================
   SHARED: storage
   src/shared/storage.js (inlined with the other modules),
   plus `Options`, the page's glue: save, duplicate, rename, delete, the
   option menu, export / import, autosave and restore.
   Saved options live under localStorage key `plate.options.v1`; the
   working copy autosaves into the "__current" slot after a 1 s pause.
   ========================================================================== */
const Options = (() => {
  const storage = StorageMod.createStorage({
    key: CONFIG.storageKey, schema: CONFIG.schema, migrate: (s) => s, filePrefix: 'plate-options',
    onNotice: (message) => Toast.show(message, 'warn', 7000),
  });
  let currentId = null;            // the saved option the working copy came from (null = unsaved)
  let savedPrint = null;           // fingerprint of that option's state, to show "unsaved changes"
  let dirtyTimer = null;
  let autosaveHeld = false;       // tests hold the autosave so a ?test visit cannot overwrite the saved working copy

  const fingerprint = (s) => JSON.stringify({ ...s, name: '' });
  const savedNames = () => storage.list().map((o) => o.name);
  const quoted = (name) => `“${name}”`;

  function syncDirty() {
    clearTimeout(dirtyTimer);
    const dot = document.getElementById('unsavedDot');
    const dirty = !currentId || savedPrint !== fingerprint(Store.raw());
    if (dot) dot.hidden = !dirty;
    const btn = document.getElementById('btnSave');
    if (btn) btn.classList.toggle('is-on', dirty);
    return dirty;
  }
  function link(id, state) {
    currentId = id || null;
    uiPrefs.currentId = currentId;
    saveUiPrefs(uiPrefs);
    savedPrint = currentId ? fingerprint(state || Store.raw()) : null;
    syncDirty();
  }
  /** While a project is open, a design that replaces the one on screen keeps the project as its source (the plates come from the massing). */
  function keepProject(s) {
    if (!(typeof ProjectUI !== 'undefined' && ProjectUI.has())) return s;
    const cur = Store.raw();
    if (cur.source === 'project' && ProjectUI.hasMassing()) s.source = 'project';
    return s;
  }
  const reframe = () => {
    if (!Render.ready()) return;
    const p = Render.info().preset;
    Render.setView(p || 'plan', true);
  };

  /** Put a state on screen as the working copy. Undo brings the previous design back. */
  function show(raw, { id = null, name } = {}) {
    const s = fillDefaults(raw);
    if (name) s.name = name;
    keepProject(s);
    if (Render.comparing()) Compare.exit();
    Store.replace(s);
    link(id, s);
    reframe();
    return s;
  }

  function loadOption(id) {
    const rec = storage.get(id);
    if (!rec) { Toast.show('That option is no longer saved.', 'warn'); return false; }
