    const next = String(name || '').trim().slice(0, 80);
    if (!project.doc || !next || next === project.doc.name) return false;
    project.doc = { ...project.doc, name: next };
    project.renamed = next;
    project.dirty = true;
    renderPill();
    markDirty();
    return true;
  }

  const SEND_TO = ['parking', 'facade'];
  /** Send to another tool: save the project, then open ../<tool>/?project=<id>. With no project open, one is made first. */
  async function send(toolId) {
    Pop.close();
    if (!SEND_TO.includes(toolId)) return false;
    if (!project.doc && !create(defaultName(), { quiet: true })) return false;
    if (project.readOnly) { noticeOnce('readonly', READ_ONLY_TEXT); return false; }
    project.dirty = true;
    const saved = flush();
    if (saved && saved.ok === false) return false;
    let url = null;
    try { url = ProjectMod.sendTo(storageOf(), project.doc, toolId, CONFIG.tool, storageNotice()); } catch (e) {
      console.error(e);
      Toast.show(`The project could not be sent. ${e && e.message ? e.message : ''}`.trim(), 'bad', 8000);
      return false;
    }
    if (!url) { Toast.show('The project could not be sent.', 'bad', 8000); return false; }
    try { project.doc = ProjectMod.loadProject(storageOf(), project.doc.id, storageNotice()) || project.doc; } catch (e) { /* keep the copy in memory */ }
    project.dirty = false;
    project.navigate(url);
    return url;
  }
  function openById(id) { flush(); project.navigate(`${location.pathname}?project=${encodeURIComponent(id)}`); }
  async function exportFile() {
    const doc = project.doc;
    if (!doc) return false;
    project.dirty = true;
    flush();
    try {
      const { filename, blob } = ProjectMod.exportProject(project.doc);
      const res = await ShotMod.deliverImage(blob, filename);
      if (res === 'downloaded') Toast.show(`Saved ${filename}`);
      return filename;
    } catch (e) { console.error(e); Toast.show(`The project file could not be made. ${e && e.message ? e.message : ''}`.trim(), 'bad', 6000); return false; }
  }
  async function importFile(file) {
    flush();
    try {
      const res = await ProjectMod.importProject(file, storageOf(), storageNotice());
      const doc = res && res.doc;
      if (!doc) throw new Error('The file could not be read.');
      openDoc(doc);
      project.updateUrl(doc.id);
      Toast.show(res.renamed ? `Imported as ${doc.name}.` : `Imported ${doc.name}.`);
      if (res.warning) noticeOnce('warning', String(res.warning));
      return doc;
    } catch (e) { console.error(e); Toast.show(e && e.message ? e.message : 'The file could not be imported.', 'bad', 8000); return null; }
  }
  /** When the page comes back to the front, another tool may have changed the massing: take the fresh project data. */
  function reloadData() {
    if (!project.doc || project.dirty) return false;
    let fresh = null;
    try { fresh = ProjectMod.loadProject(storageOf(), project.doc.id, storageNotice()); } catch (e) { fresh = null; }
    if (!fresh) return false;
    const before = dataKey();
    project.doc = fresh;
    if (dataKey() !== before) { renderPill(); Render.requestRender(); return true; }
    return false;
  }

  /* ---- Project menu -------------------------------------------------------------------------------- */
  const whenText = (t) => { try { const d = new Date(t); return Number.isNaN(d.getTime()) ? '' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); } catch (e) { return ''; } };
  const bytesText = (b) => (Number.isFinite(b) && b > 0 ? (b >= 1048576 ? `${(b / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(b / 1024))} KB`) : '');
  function openMenu(anchor) {
    const el = h('div', { role: 'menu', id: 'projectMenu' });
    const item = (key, title, sub, onclick, o = {}) => h('button', { class: 'pop-item', type: 'button', role: 'menuitem', 'data-proj': key, 'data-project-id': o.id, disabled: o.disabled, onclick: () => { if (!o.keep) Pop.close(); onclick(); } },
      h('span', { class: 'grow' }, title, sub ? h('small', null, sub) : null));
    const nameField = h('input', { class: 'pop-name', id: 'projName', type: 'text', maxlength: '80', spellcheck: 'false', autocomplete: 'off', autocapitalize: 'off', enterkeyhint: 'done', 'aria-label': 'Project name', placeholder: 'Project name', value: defaultName() });
    const doCreate = () => { Pop.close(); create(nameField.value); };
    nameField.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); doCreate(); } });
    const newRow = item('new', 'New project', 'Save this design in a new project', () => { newRow.hidden = true; form.hidden = false; nameField.focus(); nameField.select(); }, { keep: true });
    const form = h('div', { class: 'proj-new', id: 'projNewForm', hidden: true }, nameField,
      h('div', { class: 'pop-actions' },
        h('button', { class: 'btn outline', type: 'button', id: 'projCancel', onclick: () => { form.hidden = true; newRow.hidden = false; } }, 'Cancel'),
        h('button', { class: 'btn solid', type: 'button', id: 'projCreate', onclick: doCreate }, 'Create')));
    el.append(newRow, form);
    el.append(h('div', { class: 'pop-sep' }), h('div', { class: 'label pop-label' }, 'Open'));
    let list = [];
    try { list = ProjectMod.listProjects(storageOf(), storageNotice()) || []; } catch (e) { console.error(e); noticeOnce('storage', NO_STORAGE_TEXT); }
    if (!list.length) el.append(h('div', { class: 'pop-note' }, 'No saved projects yet.'));
    for (const p of list.slice(0, CONFIG.projectListMax)) {
      const here = !!project.doc && p.id === project.doc.id;
      el.append(item('open', p.name, [here ? 'Open now' : whenText(p.updatedAt), bytesText(p.bytes)].filter(Boolean).join(' · '), () => openById(p.id), { id: p.id, disabled: here }));
    }
    if (list.length > CONFIG.projectListMax) el.append(item('all', 'All projects', `${list.length - CONFIG.projectListMax} more on the Workspace page`, () => { flush(); project.navigate('../'); }));
    el.append(h('div', { class: 'pop-sep' }),
      item('import', 'Import', 'Add a project file (.cmrlm.json)', () => $('projFile').click()),
      item('export', 'Export', project.doc ? `Download ${project.doc.name} as a file` : 'Open or create a project first', exportFile, { disabled: !project.doc }),
      item('close', 'Close project', project.doc ? 'Keep working without a project' : 'No project is open', close, { disabled: !project.doc }));
    Pop.open(anchor, el);
  }

  /** The project name field for the Source section. */
  function nameControl() {
    const input = h('input', { class: 'pop-name', id: 'projNameField', type: 'text', maxlength: '80', spellcheck: 'false', autocomplete: 'off', 'aria-label': 'Project name' });
    input.addEventListener('change', () => { rename(input.value); });
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
    const refresh = () => { if (document.activeElement !== input) input.value = project.doc ? project.doc.name : ''; };
    Store.subscribe(refresh);
    return { el: h('div', { class: 'ctl text-row' }, h('label', { class: 'ctl-label', for: 'projNameField' }, 'Project name'), input), refresh };
  }

  /* ---- start ------------------------------------------------------------------------------------------ */
  let wired = false;
  function wire() {
    if (wired) return;
    wired = true;
    Store.subscribe((s, info) => {
      if (project.doc && !project.loading && (!info || !info.live)) markDirty();
      renderPill();
    });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); else reloadData(); });
    window.addEventListener('pagehide', () => { flush(); });
    const file = $('projFile');
    if (file) file.addEventListener('change', async () => {
      const f = file.files && file.files[0];
      file.value = '';
      if (f) await importFile(f);
    });
  }
  /** On start: with ?project=<id> open that project. Without one, a placement left over from an earlier project is cleared. Returns true when a project was opened. */
  function start() {
    wire();
    let id = null;
    try { id = ProjectMod.projectIdFromUrl(location); } catch (e) { id = null; }
    if (!id) {
      if (Store.raw().source !== 'drawn') {
        const next = deepClone(Store.raw());
        next.source = 'drawn';
        Store.replace(fillDefaults(next), { resetHistory: true });
      }
      renderPill();
      return false;
    }
    let doc = null, told = false;
    try { doc = ProjectMod.loadProject(storageOf(), id, { onNotice: (message) => { told = true; noticeOnce(`storage:${message}`, String(message)); } }); } catch (e) { console.error(e); }
    if (!doc) {
      if (!told) Toast.show('That project could not be opened. It may have been deleted, or it was saved in another browser.', 'warn', 9000);
      return false;
    }
    openDoc(doc, { startup: true });
    return true;
  }

  return {
    has, hasMassing, hasSection, massingInfo, massingMode, massingSolids, massingBox, placement, useProject, useDrawn, contextPolys, dataDoc, dataKey, massingPlacement, massingStamp, fillStamp, refill,
    start, openDoc, close, create, rename, flush, openMenu, exportFile, importFile, nameControl, reloadData, send,
    markDirty, renderPill,
    doc: () => project.doc,
    status: () => ({ open: !!project.doc, id: project.doc && project.doc.id, name: project.doc && project.doc.name, dirty: project.dirty, readOnly: project.readOnly, stamp: project.stamp }),
    // tests: inject storage, navigation and the address bar
    configure: (o) => { Object.assign(project, o || {}); },
    restoreDefaults: () => { Object.assign(project, { storage: null, navigate: DEFAULT_NAV, updateUrl: DEFAULT_URL }); },
    reset: () => { clearTimeout(project.timer); Object.assign(project, { doc: null, timer: 0, dirty: false, readOnly: false, loading: false, noted: {}, renamed: null, stamp: null }); renderPill(); },
  };
})();

/* ==========================================================================
   SHARED: screenshot
   src/shared/screenshot.js (inlined with the other modules),
   plus `Shots`: the image action and the overlay choices (shown in the Export menu's
   "Image overlay" view). The choices are kept in state.view.shot.
   ========================================================================== */
const Shots = (() => {
  const SHOT_ITEMS = [
    ['title', 'Option name'], ['date', 'Date'], ['metrics', 'Key metrics'], ['mark', 'CMRLM mark'],
  ];
  const prefersDark = () => !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);

  /** The key metrics on the picture: units (keys), NRSF, efficiency, corridor length, then the test-fit caution. */
  function keyMetrics(d) {
    const m = d.hud, hotel = Store.raw().mode === 'hotel';
    return [
      [hotel ? 'Keys' : 'Units', Units.formatInt(m.units)],
      ['NRSF', Units.formatArea(m.nrsf)],
      ['Efficiency', pct1(m.efficiency)],
      ['Avg unit', Units.formatArea(m.avgUnit)],
      ['Warnings', String(d.warnings.filter((w) => w.level !== 'info').length)],
      ['Caution', 'Test fit only. Not a code check.'],
    ];
  }

  function buildOverlay() {
    const state = Store.raw(), o = state.view.shot || {};
    const overlay = { theme: prefersDark() ? 'dark' : 'light' };
    const comparing = Render.comparing();
    if (o.title) overlay.title = comparing ? Compare.names().join('  |  ') : state.name;
    if (o.date) overlay.date = true;
    if (o.metrics && !comparing) overlay.metrics = keyMetrics(Derived.get());
    if (o.mark) overlay.mark = 'CMRLM';
    return overlay;
  }

  /** Renders the picture. With deliver = true it also downloads it (or opens the share sheet on an iPad). */
  async function capture({ deliver = false, scale = 2 } = {}) {
    const blob = await Render.capture(buildOverlay(), scale);
    if (deliver) {
      const name = Render.comparing() ? `${Store.get('name')}-compare` : Store.get('name');
      const result = await ShotMod.deliverImage(blob, ShotMod.screenshotFilename(name));
      if (result === 'downloaded') Toast.show('Image saved to your downloads.');
    }
    return blob;
  }
  async function take() {
    try { return await capture({ deliver: true }); } catch (e) { console.error(e); Toast.show(e && e.message ? e.message : 'The image could not be made.', 'bad', 6000); return null; }
  }

  /** The overlay choices as menu elements (a label and one switch per item). Used by the Export menu's "Image overlay" view. */
  function overlayControls() {
    const out = [h('div', { class: 'label pop-label' }, 'The image shows')];
    for (const [key, text] of SHOT_ITEMS) {
      const btn = h('button', { class: 'toggle-row', type: 'button', role: 'switch', 'aria-checked': String(!!Store.get(`view.shot.${key}`)), 'data-shot': key, style: 'padding:0 8px' },
        h('span', null, text), h('span', { class: 'switch', 'aria-hidden': 'true' }));
      btn.addEventListener('click', () => {
        const next = !Store.get(`view.shot.${key}`);
        Store.set(`view.shot.${key}`, next, { live: false });
        btn.setAttribute('aria-checked', String(next));
      });
      out.push(btn);
    }
    return out;
  }

  return { take, capture, overlayControls, buildOverlay, keyMetrics };
})();

/* ==========================================================================
   COMPARE
   Choose 2 to 4 options. One renderer draws each option in its own part of
   the screen (setViewport / setScissor, see Render.enterCompare), one camera
   control moves them all, and a table under the views lists the metrics with
   the best value in each ranked row in bold.
   ========================================================================== */
const Compare = (() => {
  const CURRENT = '__current';
  const MIN = 2, MAX = 4;
  const $ = (id) => document.getElementById(id);
  let active = false, chosen = [], entries = [], version = 0, refreshTimer = null, ro = null;

  const RULE = 'Bold marks the best value in a row. Efficiency and units rank higher is better; the warning count ranks lower is better. A higher count is not always a better plate.';
  const sf = (v) => Units.formatArea(v);
  const ROWS = [
    { label: 'Units (keys)', get: (e) => e.d.hud.units, fmt: Units.formatInt, higher: true },
    { label: 'NRSF', get: (e) => e.d.hud.nrsf, fmt: sf, higher: true },
    { label: 'GSF', get: (e) => e.d.hud.gsf, fmt: sf },
    { label: 'Efficiency', get: (e) => e.d.hud.efficiency, fmt: (v) => pct1(v), higher: true },
    { label: 'Average unit', get: (e) => e.d.hud.avgUnit, fmt: sf },
    { label: 'Corridor length', get: (e) => e.d.hud.corridorFt, fmt: Units.formatFeetInches },
    { label: 'Corridor per unit', get: (e) => e.d.hud.corridorPerUnit, fmt: Units.formatFeetInches },
    { label: 'Stair door path', get: (e) => e.d.hud.stairPathFt, fmt: Units.formatFeetInches },
    { label: 'Accessible', get: (e) => e.d.hud.accessible, fmt: Units.formatInt },
    { label: 'Building NRSF', get: (e) => (e.d.hud.building ? e.d.hud.building.nrsf : null), fmt: sf },
    { label: 'Warnings', get: (e) => e.d.warnings.filter((w) => w.level !== 'info').length, fmt: Units.formatInt, lower: true },
  ];

  /** Everything that can be compared: the design on screen (if it differs from its saved copy) and the saved options. */
  function candidates() {
    const list = [];
    if (Options.syncDirty()) list.push({ key: CURRENT, name: `${Store.get('name')} (on screen)`, state: () => Store.snapshot() });
    for (const o of Options.list()) list.push({ key: o.id, name: o.name, state: () => o.state });
    return list;
  }

  function buildEntries() {
    const cands = candidates();
    entries = chosen.map((key) => cands.find((c) => c.key === key)).filter(Boolean).map((c) => {
      const state = fillDefaults(c.state());
      state.name = c.name;
      return { key: c.key, name: c.name, state, d: computeDerived(state, { project: ProjectUI.dataDoc() }), uid: `${c.key}#${version}` };
    });
  }

  function renderBar(cands) {
    const bar = $('cmpBar');
    bar.textContent = '';
    const chips = h('div', { class: 'chips', role: 'group', 'aria-label': 'Options to compare' });
    for (const c of cands) {
      const on = chosen.includes(c.key);
      const b = h('button', { class: 'chip', type: 'button', 'aria-pressed': String(on), 'data-key': c.key, title: on ? 'Click to remove from the comparison' : 'Click to add to the comparison' }, c.name);
      b.addEventListener('click', () => {
        if (on) { if (chosen.length <= MIN) { Toast.show(`Compare needs at least ${MIN} options.`, 'warn'); return; } select(chosen.filter((k) => k !== c.key)); }
        else { if (chosen.length >= MAX) { Toast.show(`Compare shows at most ${MAX} options.`, 'warn'); return; } select([...chosen, c.key]); }
      });
      chips.append(b);
    }
    bar.append(h('span', { class: 'label' }, 'Compare'), chips, h('button', { class: 'btn outline sm', type: 'button', onclick: () => exit() }, 'Close'));
  }

  function renderTable() {
    const t = $('cmpTable');
    const head = h('tr', null, h('th', { title: RULE }, 'Metric'), entries.map((e) => h('th', { title: e.name }, e.name)));
    const body = ROWS.map((row) => {
      const vals = entries.map((e) => row.get(e));
      const nums = vals.filter((v) => typeof v === 'number' && isFinite(v));
      const best = nums.length ? (row.higher ? Math.max(...nums) : row.lower ? Math.min(...nums) : null) : null;
      const allSame = nums.length > 0 && nums.every((v) => Math.abs(v - nums[0]) < 1e-9);
      return h('tr', null,
        h('td', { title: row.higher || row.lower ? RULE : null }, row.label),
        vals.map((v) => {
          const isBest = best !== null && !allSame && typeof v === 'number' && Math.abs(v - best) < 1e-9;
          return h('td', { class: isBest ? 'best' : null }, v == null ? '—' : row.fmt(v));
        }));
    });
    t.replaceChildren(h('table', { class: 'cmp' }, h('thead', null, head), h('tbody', null, body)));
  }

  function positionLabels() {
    const host = $('cmpLabels');
    host.textContent = '';
    if (!active) return;
    const cells = Render.cells();
    entries.forEach((e, i) => {
      const c = cells[i];
      if (!c) return;
      host.append(h('div', { class: 'cmp-label', style: `left:${Math.round(c.x + 8)}px;top:${Math.round(c.y + 8)}px;max-width:${Math.max(60, Math.round(c.w - 16))}px` }, e.name));
    });
  }

  const reserve = () => {
    const bar = $('cmpBar'), table = $('cmpTable');
    return { top: bar.offsetTop + bar.offsetHeight + 6, bottom: table.offsetHeight };
  };
  function layoutChanged() {
    $('viewport').style.setProperty('--cmp-table-h', `${$('cmpTable').offsetHeight}px`);
    Render.refreshInsets(false);
    Render.relayout();
    positionLabels();
  }

  function apply(wasActive = false) {
    version++;
    buildEntries();
    renderBar(candidates());
    renderTable();
    Render.enterCompare(entries.map((e) => ({ name: e.name, state: e.state, d: e.d, uid: e.uid })), reserve, { keepView: wasActive });
    layoutChanged();
    markComparing(true);
  }
  /** The Option button shows a highlight while comparing (the Compare item itself lives in the Option menu). */
  function markComparing(on) {
    const b = $('btnOption');
    if (!b) return;
    b.classList.toggle('is-on', on);
    b.dataset.comparing = on ? 'true' : 'false';
    b.title = on ? 'Comparing options. Open the menu to exit.' : 'Option: name, presets, save, compare';
  }
  function select(keys) {
    chosen = keys.slice(0, MAX);
    apply(true);
  }

  /** Start comparing. keys: option ids (or '__current'); default = the design on screen plus the newest saved one. */
  function enter(keys) {
    const cands = candidates();
    if (cands.length < MIN) {
      Toast.show('Compare needs at least 2 options. Save this design, use Duplicate, change the copy, then try again.', 'warn', 6000);
      return false;
    }
    chosen = (keys && keys.length ? keys : cands.slice(0, 2).map((c) => c.key)).filter((k) => cands.some((c) => c.key === k)).slice(0, MAX);
    if (chosen.length < MIN) chosen = cands.slice(0, 2).map((c) => c.key);
    active = true;
    $('compare').hidden = false;
    $('viewport').dataset.compare = 'true';
    if (!ro) { ro = new ResizeObserver(() => { if (active) layoutChanged(); }); ro.observe($('cmpTable')); ro.observe($('cmpBar')); Render.onResize(() => { if (active) positionLabels(); }); }
    apply();
    return true;
  }
  function exit() {
    if (!active) return;
    active = false; entries = []; chosen = [];
    clearTimeout(refreshTimer);
    Render.exitCompare();
    $('compare').hidden = true;
    $('viewport').dataset.compare = 'false';
    $('viewport').style.removeProperty('--cmp-table-h');
    $('cmpLabels').textContent = '';
    markComparing(false);
  }
  function toggle() { if (active) exit(); else enter(); }

  /** While comparing, edits to the design on screen refresh its column and its view. */
  function init() {
    Store.subscribe((s, info) => {
      if (!active || !chosen.includes(CURRENT) || (info && info.live)) return;
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(() => { if (active) apply(true); }, 200);
    });
  }

  return { toggle, enter, exit, init, names: () => entries.map((e) => e.name), isActive: () => active, chosen: () => chosen.slice(), table: () => $('cmpTable').innerText };
})();

/* ==========================================================================
   TESTS
   Calculation and export tests. Run by adding ?test to the address (plan section 9.2). They cover the shell helpers, the default
   plate (17 units, NRSF 15,077.8 sf, efficiency 0.7732), every case in src/plate/testcases.js through the integrated pipeline (the six
   presets of plan section 8), the warning list, the SketchUp document, the rooms CSV, the DXF, the notes, the derived section and the
   save / export / import round trip. The other test files (12b page, 12c editing, 12d project) run after this one; runAllTests (in 12d)
   merges the results. The result toast appears in ?test mode only.
   ========================================================================== */
const TestHelp = (() => {
  const eq = (a, b) => (JSON.stringify(a) === JSON.stringify(b) ? true : `got ${JSON.stringify(a)}, expected ${JSON.stringify(b)}`);
  const near = (a, b, tol = 1e-9) => (Math.abs(a - b) <= tol ? true : `got ${a}, expected ${b}`);
  const within = (a, b, tol) => (Math.abs(a - b) <= tol ? true : `got ${a}, expected ${b} (+/- ${tol})`);
  const make = () => {
    const results = [];
    const t = async (name, fn) => {
      let r;
      try { r = await fn(); } catch (e) { r = `threw ${e && e.message}`; }
      results.push({ name, ok: r === true, detail: r === true ? '' : String(r) });
    };
    return { results, t };
  };
  const $ = (id) => document.getElementById(id);
  const frames = (n = 2) => new Promise((res) => { const f = () => (--n <= 0 ? res() : requestAnimationFrame(f)); requestAnimationFrame(f); });
  const wait = (ms) => new Promise((res) => setTimeout(res, ms));
  const visible = (el) => !!el && el.getClientRects().length > 0 && getComputedStyle(el).visibility !== 'hidden';
  const snap = () => JSON.stringify(Store.snapshot());
  /** One undo returns the state from before the action, and one redo puts the result back (checked by behavior). */
  const oneStep = (before) => { Store.undo(); const back = snap() === before; Store.redo(); return back; };
  const toastText = () => [...document.querySelectorAll('#toasts .toast')].map((x) => x.textContent).join(' | ');
  const merged = (name, results) => {
    const bad = results.filter((r) => !r.ok);
    console.log(`[tests] ${name} ${results.length - bad.length}/${results.length} passed`, bad.length ? JSON.stringify(bad) : '');
  };
  const presetState = (id) => fillDefaults(deepClone(CONFIG.presets.find((p) => p.id === id).state));
  const cases = () => TestCasesMod.TEST_CASES;
  /** Opens one panel section (every section starts collapsed: docs/site-base-style-technical-plan.md section 4.4). Does not touch the saved choice. */
  const openSection = (id) => { const c = UI.sectionCtl[id]; if (c && !c.isOpen()) c.setOpen(true); return !!c; };
  return { openSection, eq, near, within, make, $, frames, wait, visible, snap, oneStep, toastText, merged, presetState, cases };
})();

async function runTests() {
  const { eq, near, within, make, presetState } = TestHelp;
  const { results, t } = make();
  const def = () => fillDefaults(defaultState());

  /* ---- shell helpers ---- */
  await t('formatFeetInches 312.5', () => eq(Units.formatFeetInches(312.5), `312'-6"`));
  await t('formatArea 15078 and formatAreaDec 15077.8', () => eq([Units.formatArea(15077.8), Units.formatAreaDec(15077.8)], ['15,078 sf', '15,077.8 sf']));
  await t('parseLength 10\'-6" and 10-6', () => eq([Units.parseLength(`10'-6"`), Units.parseLength('10-6')], [10.5, 10.5]));
  await t('planToWorld north is -z', () => eq(planToWorld(3, 4, 5), [3, 5, -4]));
  await t('storage key, title and tool', () => eq([CONFIG.storageKey, document.title, CONFIG.tool], ['plate.options.v1', 'Plate Planner', 'plate']));
  await t('all the src modules are in the page', () => {
    const names = ['MixMod', 'LevelsMod', 'CorridorMod', 'FillMod', 'PlateMetricsMod', 'PlateDerivedMod', 'PlateExportsMod', 'SkPlate', 'PresetsMod', 'TestCasesMod', 'ProjectMod', 'StorageMod', 'ShotMod', 'SkFmt', 'TowerGeo'];
    const miss = names.filter((n) => { try { return typeof eval(n) !== 'object'; } catch (e) { return true; } });
    return eq(miss, []);
  });
  await t('geometry helpers: ring area, point in ring, nearest point on a segment, offset line', () => {
    const sq = [[0, 0], [10, 0], [10, 10], [0, 10]];
    const off = offsetLine([[0, 0], [10, 0]], 2);
    return eq([ringArea(sq), pointInRing(5, 5, sq), pointInRing(15, 5, sq), nearestOnSeg(5, 3, [0, 0], [10, 0]).d, off[0][1], ringRect(sq)], [100, true, false, 3, 2, [0, 0, 10, 10]]);
  });

  /* ---- the default plate (plan section 8.1) ---- */
  await t('the default plate: 17 units, NRSF 15,077.8 sf, efficiency 0.7732 on the HUD numbers', () => {
    const d = computeDerived(def()), h = d.hud;
    return eq([d.ok, h.units, Math.abs(h.nrsf - 15077.8) <= 0.5, h.efficiency, h.gsf], [true, 17, true, 0.7732, 19500]);
  });
  await t('the default plate has no warning that blocks the fill', () => {
    const d = computeDerived(def());
    return eq([d.warnings.filter((w) => w.level === 'error').length, d.warnings.length === d.metrics.warnings.length], [0, true]);
  });
  await t('the page is showing the default numbers (17, 15,078 sf, 77.3%)', () => {
    if (!document.getElementById('mUnits')) return true;
    const saved = Store.snapshot();
    Store.replace(def());
    UI.updateHud(Derived.get());
    const out = ['mUnits', 'mNrsf', 'mEff'].map((id) => document.getElementById(id).textContent);
    Store.replace(saved);
    UI.updateHud(Derived.get());
    return eq(out, ['17', '15,078 sf', '77.3%']);
  });

  /* ---- every preset against its hand-calculated case (plan section 8) ---- */
  for (const c of TestHelp.cases()) {
    await t(`preset ${c.id}: ${c.expect.units || c.expect.keys} ${c.expect.keys ? 'keys' : 'units'}, NRSF ${c.expect.nrsf}, efficiency ${c.expect.efficiency}`, () => {
      const d = computeDerived(fillDefaults(deepClone(c.state)));
      if (!d.ok) return `build failed: ${d.warnings[0] && d.warnings[0].text}`;
      const h = d.hud, e = c.expect;
      const n = e.units || e.keys;
      const a = eq(h.units, n); if (a !== true) return `units ${a}`;
      const b = within(h.nrsf, e.nrsf, e.tolerance); if (b !== true) return `nrsf ${b}`;
      const f = within(h.efficiency, e.efficiency, e.efficiencyTolerance); if (f !== true) return `efficiency ${f}`;
      if (e.bays !== undefined) { const bb = eq(h.bays, e.bays); if (bb !== true) return `bays ${bb}`; }
      if (e.corners !== undefined) { const cc = eq(h.corners, e.corners); if (cc !== true) return `corners ${cc}`; }
      return true;
    });
    await t(`preset ${c.id}: the counts by type are inside the mix rule (each type within 1 of the reference)`, () => {
      const d = computeDerived(fillDefaults(deepClone(c.state)));
      if (!d.ok) return 'build failed';
      const by = {};
      for (const u of d.editing.units) by[u.type] = (by[u.type] || 0) + (c.state.mode === 'hotel' && u.accessible ? 0 : 1);
      const bad = Object.keys(c.expect.counts).filter((k) => Math.abs((by[k] || 0) - c.expect.counts[k]) > 1);
      return eq(bad, []);
    });
    await t(`preset ${c.id}: the area closes (no area-closure warning) and no fatal warning`, () => {
      const d = computeDerived(fillDefaults(deepClone(c.state)));
      return eq([d.ok, d.warnings.filter((w) => w.id === 'area-closure' || w.level === 'error').length], [true, 0]);
    });
  }
  await t('loading a preset through the Option menu code path puts its numbers on the page', () => {
    const saved = Store.snapshot();
    Options.loadPreset('l-plate-60-ft-arms');
    const h = Derived.get().hud;
    UI.updateHud(Derived.get());
    const out = [h.units, h.nrsf, document.getElementById('mUnits') ? document.getElementById('mUnits').textContent : '16'];
    Store.replace(saved);
    return eq(out, [16, 12816.5, '16']);
  });

  /* ---- the area rule (decision 5) ---- */
  await t('the area rule: a unit of the default plate spans the corridor face to the inside of the exterior wall', () => {
    const d = computeDerived(def());
    const L = d.editing;
    // the south run: the plate edge is y = -32.5, the exterior wall is 1.0 ft, the unit starts at y = -31.5; the corridor face is y = -2.835
    const south = L.units.filter((u) => Math.min(...u.outer.map((p) => p[1])) < -30);
    if (!south.length) return 'no south units';
    const u = south[0];
    const ys = u.outer.map((p) => p[1]);
    return eq([Math.min(...ys), Math.round(Math.max(...ys) * 1000) / 1000], [-31.5, -2.835]);
  });
  await t('the area rule text names the centerline, the corridor face and the inside face', () => {
    const txt = CONFIG.areaRule;
    return eq([/centerline of demising walls/.test(txt), /corridor face of the corridor wall/.test(txt), /inside face of the exterior wall/.test(txt)], [true, true, true]);
  });

  /* ---- mode and mix ---- */
  await t('switching to hotel mode gives keys and bays on the same plate', () => {
    const s = def(); s.mode = 'hotel';
    const d = computeDerived(s);
    return eq([d.ok, d.hud.units > 0, d.hud.bays >= d.hud.units], [true, true, true]);
  });
  await t('a share change moves the counts: 2BR 0.50 gives more 2BR than the default', () => {
    const a = computeDerived(def());
    const s = def(); s.mix.multifamily.find((x) => x.id === '2br').share = 0.5; s.mix.multifamily.find((x) => x.id === '1br').share = 0.25;
    const b = computeDerived(s);
    const n2 = (d) => d.editing.units.filter((u) => u.type === '2br').length;
    return eq(n2(b) > n2(a), true);
  });

  /* ---- exports ---- */
  await t('the SketchUp document has source "plate", a solid per unit, and validates', () => {
    const doc = FileExports.sketchupDoc();
    const v = SkFmt.validateDoc(doc);
    const only = v.errors.filter((e) => !/source/.test(String(e)));
    const sourceOk = !v.errors.some((e) => /source/.test(String(e)));
    window.__plateSketchupSourceAccepted = sourceOk;
    return eq([doc.source, only.length, v.counts.solid >= Derived.get().hud.units], ['plate', 0, true]);
  });
  await t('the SketchUp validator accepts source "plate" (needs the integrator edit in src/shared/sketchup-format.js)', () => eq(window.__plateSketchupSourceAccepted, true));
  await t('the SketchUp download delivers a .sketchup.json file', () => {
    let name = '';
    const r = FileExports.sketchup({ deliver: (blob, n) => { name = n; } });
    return eq([r.ok, /\.sketchup\.json$/.test(name)], [true, true]);
  });
  await t('the rooms CSV has a header, the area rule and one row per unit', () => {
    const txt = FileExports.roomsText();
    const lines = txt.trim().split(/\r?\n/);
    const rows = lines.filter((l) => !l.startsWith('#') && !l.startsWith('level_index'));
    return eq([lines.some((l) => l.startsWith('level_index')), /area rule/i.test(txt), rows.length], [true, true, Derived.get().hud.units]);
  });
  await t('the rooms download delivers a file named -rooms.csv', () => {
    let name = '';
    const r = FileExports.rooms({ deliver: (blob, n) => { name = n; } });
    return eq([r.ok, /-rooms\.csv$/.test(name)], [true, true]);
  });
  await t('the DXF has the plate layers, entities and EOF', () => {
    const txt = FileExports.dxfText();
    const layers = ['PLATE', 'UNIT-LINE', 'UNIT-AREA', 'CORRIDOR', 'CORE', 'STAIR'].filter((l) => txt.includes(l));
    return eq([layers.length, /ENTITIES/.test(txt), /EOF/.test(txt)], [6, true, true]);
  });
  await t('the DXF download delivers a file named -plates.dxf', () => {
    let name = '';
    const r = FileExports.dxf({ deliver: (blob, n) => { name = n; } });
    return eq([r.ok, /-plates\.dxf$/.test(name)], [true, true]);
  });
  await t('the notes carry the area rule, the cautions and the NRSF; the download is .md', () => {
    let name = '';
    const r = FileExports.notes({ deliver: (blob, n) => { name = n; } });
    return eq([r.ok, /\.md$/.test(name), /never says "compliant"/.test(r.text), /centerline/.test(r.text), /15,077\.8|15077\.8/.test(r.text)], [true, true, true, true, true]);
  });
  await t('the derived section: levels with units, a mix and the metrics the plan names', () => {
    const d = Derived.get(), sec = PlateDerivedMod.platesDerived(Store.snapshot(), d.built, d.metrics);
    return eq([sec.levels.length, sec.levels[0].units.length, sec.metrics.units, Math.abs(sec.metrics.nrsf - 15077.8) <= 0.5, sec.mix.reduce((s, m) => s + m.count, 0), sec.levels[0].units[0].id], [1, 17, 17, true, 17, '1-01']);
  });

  /* ---- save / export / import ---- */
  await t('state survives a JSON round trip and fillDefaults', () => {
    const s = def(), back = fillDefaults(JSON.parse(JSON.stringify(s)));
    return eq(back, s);
  });
  await t('fillDefaults fills a partial state and drops nothing the user typed', () => {
    const s = fillDefaults({ plate: { w: 180 }, mode: 'hotel', locks: [{ id: 'U-01', outer: [[0, 0], [10, 0], [10, 10]], type: 'king' }] });
    return eq([s.plate.w, s.plate.d, s.mode, s.locks.length, s.corridor.wall, s.mix.hotel.length], [180, 65, 'hotel', 1, 0.5, 3]);
  });
  await t('every preset survives fillDefaults unchanged', () => {
    const bad = CONFIG.presets.filter((p) => JSON.stringify(fillDefaults(deepClone(p.state))) !== JSON.stringify(fillDefaults(fillDefaults(deepClone(p.state))))).map((p) => p.id);
    return eq(bad, []);
  });
  return results;
}

/* ==========================================================================
   TESTS: the page  (plan section 9.2)
   The HUD and its numbers, the tabs and their controls, the Export menu, the Help panel with the area rule, the Option menu, the style
   toggle and the legend, the views, compare, and the draw tool. They change the design on screen and put it back at the end.
   ========================================================================== */
async function runUiTests() {
  const { eq, make, $, frames, wait, visible, toastText } = TestHelp;
  const { results, t } = make();
  const savedState = Store.snapshot(), savedTab = UI.activeTab();
  Options.holdAutosave(true);
  const fresh = () => { Store.replace(fillDefaults(defaultState())); UI.updateHud(Derived.get()); };
  try {
    fresh();
    await t('the title bar says Plate Planner with the CMRLM mark', () => eq([document.querySelector('.app-title').textContent, document.querySelector('.wordmark').textContent], ['Plate Planner', 'CMRLM']));
    await t('the Tools button and the CMRLM mark link back to the Workspace (../)', () => {
      const home = document.getElementById('tbHome'), mark = document.querySelector('.wordmark');
      return eq([home && home.tagName, home && home.getAttribute('href'), mark.tagName, mark.getAttribute('href'), home && home.textContent.trim()], ['A', '../', 'A', '../', 'Tools']);
    });
    await t('the HUD shows 17 units, 15,078 sf and 77.3% for the default plate', () => eq(['mUnits', 'mNrsf', 'mEff'].map((id) => $(id).textContent), ['17', '15,078 sf', '77.3%']));
    await t('the HUD expands to the mix, the corridor, the stair door path and the support', () => {
      UI.setHudOpen(true);
      const rows = document.querySelectorAll('#hudMixTable tbody tr').length;
      const out = [rows > 0, visible($('hudBody')), $('mGsf').textContent, $('mCor').textContent !== '-', $('mPath').textContent !== '-'];
      UI.setHudOpen(false);
      return eq(out, [true, true, '19,500 sf', true, true]);
    });
    await t('the tabs are Plate, Units, Checks and View, and the Plan view is the first view', () => eq([UI.tabs(), Render.ready() ? Render.info().preset : 'plan'], [['plate', 'units', 'checks', 'view'], 'plan']));
    await t('no control of the copied tools is left: no cut and fill style, no section panel, no AI prompts item', () => {
      const bad = ['sectionPanel', 'miAiPrompts', 'miAiReady', 'miRevit'].filter((id) => $(id));
      const styles = [...$('styleToggle').querySelectorAll('button')].map((b) => b.dataset.style);
      return eq([bad, styles], [[], ['model', 'diagram']]);
    });

    /* ---- Plate tab ---- */
    await t('the program chips switch to a hotel and back', () => {
      UI.setTab('plate');
      const chip = [...$('modeChips').querySelectorAll('button')].find((b) => b.dataset.value === 'hotel');
      chip.click();
      const hotel = Store.get('mode');
      UI.updateHud(Derived.get());
      const key = $('kUnits').textContent;
      [...$('modeChips').querySelectorAll('button')].find((b) => b.dataset.value === 'multifamily').click();
      UI.updateHud(Derived.get());
      return eq([hotel, key, Store.get('mode'), $('kUnits').textContent], ['hotel', 'Keys', 'multifamily', 'Units']);
    });
    await t('the shape select changes the plate and the numbers; Undo brings the bar back', () => {
      const before = TestHelp.snap();
      Store.set('plate.shape', 'L', { live: false });
      const changed = Math.abs(Derived.get().hud.nrsf - 15077.8) > 1;
      const ok = TestHelp.oneStep(before);
      Store.undo();
      return eq([changed, ok, Derived.get().hud.units], [true, true, 17]);
    });
    await t('the corridor width control: automatic is 5.67 ft, a typed 6.5 ft changes the unit depth', () => {
      const a = Derived.get().hud.nrsf;
      Store.set('corridor.width', 6.5, { live: false });
      const b = Derived.get().hud.nrsf;
      Store.set('corridor.width', null, { live: false });
      return eq([b < a, Math.abs(Derived.get().hud.nrsf - 15077.8) < 0.5], [true, true]);
    });
    await t('the block controls: a support block adds a hatched block on the plan and takes area from the units', () => {
      const a = Derived.get().hud.nrsf;
      Store.set('support', [{ id: 'B1', kind: 'trash', rect: [-100, -31, -92, -21] }], { live: false });
      const d = Derived.get();
      const hasBlock = d.editing.support.some((b) => b.kind === 'trash');
      Store.set('support', [], { live: false });
      return eq([hasBlock, d.hud.nrsf < a, Math.abs(Derived.get().hud.nrsf - 15077.8) < 0.5], [true, true, true]);
    });
    await t('the level group list is empty for a drawn plate and says so', () => {
      UI.openSection('levels');
      return eq([$('groupList').children.length, /Open a project/.test($('levelsNote').textContent)], [0, true]);
    });

    /* ---- Units tab ---- */
    await t('the Units tab lists one card per type and the corner type select', () => {
      UI.setTab('units');
      const items = document.querySelectorAll('#tabpanel-units .item').length;
      return eq([items >= 5, !!$('cornerType'), $('cornerType').value], [true, true, '2br']);
    });
    await t('a share edit in the panel changes the counts', () => {
      const a = Derived.get().editing.units.filter((u) => u.type === '3br').length;
      Store.set('mix.multifamily.4.share', 0.2, { live: false });
      const b = Derived.get().editing.units.filter((u) => u.type === '3br').length;
      Store.set('mix.multifamily.4.share', 0.05, { live: false });
      return eq([b > a, Derived.get().hud.units], [true, 17]);
    });
    await t('Re-fill and Unlock all are buttons of the Units tab', () => {
      const labels = [...document.querySelectorAll('#tabpanel-units button')].map((b) => b.textContent);
      return eq([labels.includes('Re-fill'), labels.includes('Unlock all')], [true, true]);
    });

    /* ---- Checks and View tabs ---- */
    await t('the Checks tab lists the numbers, the mix table and the cautions', () => {
      UI.setTab('checks');
      const kv = $('numbersTable').textContent;
      return eq([/Units17/.test(kv.replace(/\s/g, '')), /NRSF15,078sf/.test(kv.replace(/\s/g, '')), document.querySelectorAll('#mixTable tbody tr').length > 0, /never checks a code/.test($('tabpanel-checks').textContent)], [true, true, true, true]);
    });
    await t('a mix that cannot fit shows its warning in the Checks list', () => {
      Store.set('plate.d', 40, { live: false });
      const ids = Derived.get().warnings.map((w) => w.id);
      const listed = $('checksWarnings').children.length;
      Store.set('plate.d', 65, { live: false });
      return eq([ids.includes('type-does-not-fit') || ids.includes('run-too-short') || ids.length > 0, listed > 0], [true, true]);
    });
    await t('the style toggle switches Model and Diagram, and the legend lists the type colors in Diagram', () => {
      UI.setTab('view');
      Store.set('view.style', 'diagram', { live: false });
      const rows = [...$('legend').querySelectorAll('.lg-row')].map((r) => r.dataset.key);
      const pressed = [...$('styleToggle').querySelectorAll('button')].find((b) => b.getAttribute('aria-pressed') === 'true').dataset.style;
      Store.set('view.style', 'model', { live: false });
      return eq([pressed, rows.filter((k) => k.startsWith('type-')).length, rows.includes('role-corridor')], ['diagram', 5, true]);
    });
    await t('the View tab toggles labels, walls, bays and 3D levels', () => {
      const names = [...document.querySelectorAll('#tabpanel-view .toggle-row span:first-child')].map((x) => x.textContent);
      return eq(['Unit labels', 'Corridor wall lines', 'Bay lines (drag to move)', 'Levels in 3D'].every((n) => names.includes(n)), true);
    });

    /* ---- the scene ---- */
    if (Render.ready()) {
      await t('the plan view draws the plate: a model mesh per role and the unit outlines', async () => {
        await frames(3);
        const info = Render.layerInfo();
        return eq([info.model.units >= 1, info.model.corridor >= 1, info.model.blocks >= 1, info.overlay.line >= 3], [true, true, true, true]);
      });
      await t('labels show the type and area at the zoom of the plan view (and not when Labels are off)', async () => {
        await frames(3);
        const a = Render.overlayInfo().labels.length;
        Store.set('view.labels', false, { live: false }); await frames(3);
        const b = Render.overlayInfo().labels.filter((l) => /sf/.test(l)).length;
        Store.set('view.labels', true, { live: false }); await frames(3);
        return eq([a >= 17, b], [true, 0]);
      });
      await t('the preset views: 1 to 6 keys change the view and 6 is Plan', async () => {
        Render.setView('axon', false);
        const a = Render.info().preset;
        window.dispatchEvent(new KeyboardEvent('keydown', { key: '6', bubbles: true }));
        await frames(2);
        return eq([a, Render.info().preset, Render.info().camera], ['axon', 'plan', 'ortho']);
      });
      await t('D switches Model and Diagram', async () => {
        const a = Store.get('view.style');
        window.dispatchEvent(new KeyboardEvent('keydown', { key: 'd', bubbles: true }));
        const b = Store.get('view.style');
        window.dispatchEvent(new KeyboardEvent('keydown', { key: 'd', bubbles: true }));
        return eq([a, b, Store.get('view.style')], ['model', 'diagram', 'model']);
      });
      await t('levels in 3D off draws one level only; the plate shows a faint context outline for other groups', async () => {
        const a = Render.layerInfo().model.units;
        return eq(a, 1);
      });
      await t('the screenshot has the title, the metrics and the CMRLM mark in its overlay', () => {
        const o = Shots.buildOverlay();
        return eq([o.title, o.mark, o.metrics.map((m) => m[0]).slice(0, 3)], [Store.get('name'), 'CMRLM', ['Units', 'NRSF', 'Efficiency']]);
      });
    }

    /* ---- menus ---- */
    await t('the Export menu lists Image, Rooms, DXF, SketchUp, Notes, JSON and both Send items', () => {
      $('btnExport').click();
      const ids = [...document.querySelectorAll('#exportMenu [id]')].map((b) => b.id);
      Pop.close();
      return eq(['miImage', 'miRooms', 'miDxf', 'miSketchup', 'miNotes', 'miExportJson', 'miImportJson', 'miSendParking', 'miSendFacade'].filter((i) => !ids.includes(i)), []);
    });
    await t('the Export menu has no item of another tool (Revit, AI prompts, AI-ready image)', () => {
      $('btnExport').click();
      const txt = $('exportMenu').textContent;
      Pop.close();
      return eq([/Revit/.test(txt), /AI/.test(txt), /Contours/.test(txt)], [false, false, false]);
    });
    await t('the Help panel states the area rule and the cautions', () => {
      $('btnHelp').click();
      const txt = $('helpPanel').textContent;
      Pop.close();
      return eq([/centerline of the demising walls/.test(txt), /corridor face of the corridor wall/.test(txt), /inside face of the exterior wall/.test(txt), /never checks a code/.test(txt), /Caution: the accessible counts/.test(txt)], [true, true, true, true, true]);
    });
    await t('the Option menu lists the six presets and Compare', () => {
      $('btnOption').click();
      const ids = [...document.querySelectorAll('#optionMenu [id]')].map((b) => b.id);
      Pop.close();
      return eq([ids.filter((i) => i.startsWith('preset-')).length, ids.includes('miCompare'), ids.includes('miNewDesign')], [6, true, true]);
    });
    await t('Save, Duplicate, Compare of two options and Exit', async () => {
      const id = Options.save();
      Store.set('plate.w', 260, { live: false });
      Options.duplicate();
      const ok = Compare.enter();
      await frames(2);
      const tbl = Compare.table();
      Compare.exit();
      for (const o of Options.list()) Options.storage.remove(o.id);
      return eq([!!id, ok, /Units/.test(tbl), /Efficiency/.test(tbl)], [true, true, true, true]);
    });

    /* ---- drawing ---- */
    if (Render.ready()) {
      await t('Draw outline: taps make a polygon plate; Enter finishes; the plate becomes a drawn polygon', () => {
        fresh();
        const ok = Select.startDraw('polygon');
        for (const p of [[0, 0], [160, 0], [160, 60], [60, 60], [60, 120], [0, 120]]) Select.drawPoint(p[0], p[1]);
        Select.finishDraw();
        const s = Store.snapshot();
        const out = [ok, s.plate.shape, s.plate.points.length, Derived.get().ok, Derived.get().hud.units > 0];
        fresh();
        return eq(out, [true, 'polygon', 6, true, true]);
      });
      await t('Draw outline: Escape cancels and changes nothing', () => {
        fresh();
        const before = TestHelp.snap();
        Select.startDraw('polygon'); Select.drawPoint(1, 1);
        window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
        return eq([Select.drawing(), TestHelp.snap() === before], [null, true]);
      });
    }
  } finally {
    Store.replace(savedState); UI.setTab(savedTab);
    Options.holdAutosave(false);
    UI.updateHud(Derived.get());
  }
  TestHelp.merged('ui', results);
  return results;
}

/* ==========================================================================
   TESTS: selecting and editing  (plan section 9.2 "Editing")
   Pick a unit by a click (plane math), the selection card, a bay drag of 2 ft (two widths change, NRSF stays), a drag past a neighbor's
   minimum (refused), a lock that survives Re-fill, a type change that re-solves its run, moving and deleting blocks, and the pointer
   drag of a bay line. They change the design on screen and put it back at the end.
   ========================================================================== */
async function runSelectTests() {
  const { eq, near, make, $, frames, wait, visible } = TestHelp;
  const { results, t } = make();
  const savedState = Store.snapshot(), savedTab = UI.activeTab();
  Options.holdAutosave(true);
  const fresh = () => { Select.clear(); Store.replace(fillDefaults(defaultState())); UI.updateHud(Derived.get()); };
  const L = () => Derived.get().editing;
  const nrsf = () => Derived.get().hud.nrsf;
  const widthOf = (u) => Math.round(Math.abs(Select.frameOf(L().units.indexOf(u)).w) * 1000) / 1000;
  /** The bay edge with the most room (the first one with at least `room` ft either way). */
  const southBay = (room = 0) => {
    const bays = Select.bays();
    let best = null;
    bays.forEach((b, i) => {
      const lim = Select.bayLimits(i), r = Math.max(lim.fwd, -lim.back);
      if (!best || (best.r < room && r > best.r)) best = { i, b, r, lim };
    });
    return best;
  };
  try {
    fresh();
    if (Render.ready()) Render.setView('plan', false);
    await frames(3);

    await t('the default plate has bay lines between neighbors (17 units: at least 12 bay lines)', () => eq(Select.bays().length >= 12, true));

    /* ---- picking ---- */
    if (Render.ready()) {
      await t('a click on a unit selects it and the card shows its type, area and a lock button', async () => {
        const u = L().units[0];
        const c = ringCentroidXY(u.outer);
        const p = Select.screenOf(c[0], c[1]);
        Select.click(p.x, p.y);
        await frames(2);
        const sel = Select.get();
        const card = $('selection-card');
        return eq([sel && sel.kind, sel && sel.k, visible(card), /sf/.test(card.textContent), !!card.querySelector('[data-action="lock"]'), card.querySelectorAll('#itemTypes .chip').length], ['unit', 0, true, true, true, 5]);
      });
      await t('a click on empty ground clears the selection', async () => {
        const p = Select.screenOf(-400, 200);
        Select.click(p.x, p.y);
        return eq(Select.get(), null);
      });
      await t('a click on the core selects the core; a click on a unit after it selects the unit', async () => {
        const c = L().core ? ringCentroidXY(L().core) : null;
        if (!c) return 'no core';
        const p = Select.screenOf(c[0], c[1]);
        Select.click(p.x, p.y);
        const a = Select.get();
        const u = L().units[3], cu = ringCentroidXY(u.outer), pu = Select.screenOf(cu[0], cu[1]);
        Select.click(pu.x, pu.y);
        return eq([a && a.kind, Select.get().kind, Select.get().k], ['core', 'unit', 3]);
      });
      await t('Escape clears the selection', () => {
        Select.selectUnit(2);
        window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
        return eq(Select.get(), null);
      });
    }

    /* ---- the bay drag ---- */
    await t('a bay drag of 2 ft changes two widths by 2 ft and keeps NRSF', () => {
      fresh();
      const s = southBay(2);
      if (!s) return 'no south bay';
      const before = nrsf(), A = L().units[s.b.a], B = L().units[s.b.b];
      const wa = widthOf(A), wb = widthOf(B);
      const lim = s.lim;
      const d = lim.fwd >= 2 ? 2 : (lim.back <= -2 ? -2 : 0);
      if (!d) return `no room to move: limits ${JSON.stringify(lim)}`;
      const ok = Select.moveBay(s.i, d);
      const units = L().units;
      const lockedAt = units.map((u, k) => (u.locked ? k : -1)).filter((k) => k >= 0);
      const wa2 = widthOf(units[s.b.a]), wb2 = widthOf(units[s.b.b]);
      return eq([ok, lockedAt, Select.locks().length, Math.round(Math.abs(wa2 - wa) * 100) / 100, Math.round(Math.abs(wb2 - wb) * 100) / 100, Math.abs(nrsf() - before) < 0.2], [true, [s.b.a, s.b.b].sort((x, y) => x - y), 2, 2, 2, true]);
    });
    await t('the bay drag is one undo step', () => {
      fresh();
      const s = southBay(1);
      const before = TestHelp.snap();
      Select.moveBay(s.i, s.lim.fwd >= 1 ? 1 : -1);
      return eq([Select.locks().length, TestHelp.oneStep(before)], [2, true]);
    });
    await t('a drag past a neighbor\'s minimum is refused: nothing changes', () => {
      fresh();
      const s = southBay();
      const before = TestHelp.snap();
      const lim = Select.bayLimits(s.i);
      const ok = Select.moveBay(s.i, lim.fwd + 3), ok2 = Select.moveBay(s.i, lim.back - 3);
      return eq([ok, ok2, TestHelp.snap() === before, Select.locks().length], [false, false, true, 0]);
    });
    await t('the limits are the widths each type allows: a 1BR (24 to 28 ft) stays inside its range after a drag to the limit', () => {
      fresh();
      const s = southBay();
      const lim = Select.bayLimits(s.i);
      const d = lim.fwd > 0.2 ? lim.fwd - 0.01 : lim.back + 0.01;
      const ok = Select.moveBay(s.i, d);
      const flagged = L().units.filter((u) => u.flagged).length;
      return eq([ok, flagged], [true, 0]);
    });

    /* ---- locks ---- */
    await t('L locks the selected unit: an amber lock appears; L again unlocks', () => {
      fresh();
      Select.selectUnit(1);
      window.dispatchEvent(new KeyboardEvent('keydown', { key: 'l', bubbles: true }));
      const a = [Select.locks().length, L().units[1].locked];
      window.dispatchEvent(new KeyboardEvent('keydown', { key: 'l', bubbles: true }));
      return eq([a, Select.locks().length], [[1, true], 0]);
    });
    await t('a lock survives Re-fill: the outline and the type do not change while the others re-solve', () => {
      fresh();
      Select.toggleLock(1); Select.toggleLock(4);
      const keep = Select.locks().map((l) => JSON.stringify([l.outer, l.type]));
      const unitsBefore = L().units.length;
      Store.set('mix.multifamily.3.share', 0.5, { live: false });
      Store.set('mix.multifamily.1.share', 0.25, { live: false });
      Select.refill();
      const after = L().units.filter((u) => u.locked).map((u) => JSON.stringify([Select.locks().find((l) => JSON.stringify(l.outer) === JSON.stringify(u.outer)) ? u.outer : null, u.type]));
      const kept = keep.every((k) => after.includes(k));
      const n2 = L().units.filter((u) => u.type === '2br').length;
      return eq([Select.locks().length, kept, n2 >= 5, unitsBefore > 0], [2, true, true, true]);
    });
    await t('Unlock all removes the locks and the plate returns to the plain fill', () => {
      fresh();
      Select.toggleLock(1); Select.toggleLock(2);
      const had = Select.locks().length;
      Select.unlockAll();
      return eq([had, Select.locks().length, Derived.get().hud.units, Math.abs(nrsf() - 15077.8) <= 0.5], [2, 0, 17, true]);
    });

    /* ---- type change ---- */
    await t('a type change from the card re-solves the run: the unit takes the new type and the run still fills', () => {
      fresh();
      const k = L().units.findIndex((u) => u.type === '1br');
      const r = Select.setUnitType(k, 'studio');
      const d = Derived.get();
      const bad = d.warnings.filter((w) => w.id === 'run-too-short').length;
      return eq([r.ok, Select.locks().length, Select.locks()[0].type, bad, d.hud.units >= 16], [true, 1, 'studio', 0, true]);
    });
    await t('the type chips of the card change the type of the selected unit', () => {
      fresh();
      const k = L().units.findIndex((u) => u.type === '1br');
      Select.selectUnit(k);
      const chip = $('itemTypes').querySelector('[data-type="2br"]');
      chip.click();
      const sel = Select.get();
      const u = sel && sel.kind === 'unit' ? L().units[sel.k] : null;
      return eq([!!u, u && u.type, u && u.locked], [true, '2br', true]);
    });
    await t('a type that does not fit the depth is refused by the card (no lock is made)', () => {
      fresh();
      Store.set('plate.d', 55, { live: false });
      const before = Select.locks().length;
      const r = Select.setUnitType(0, '3br');
      return eq([r.ok === false, Select.locks().length - before], [true, 0]);
    });

    /* ---- blocks ---- */
    await t('a support block: Add draws a rectangle, the block moves with a snap, and Delete removes it', () => {
      fresh();
      const ok = Select.startDraw('rect', { target: { type: 'support', kind: 'trash' }, label: 'a trash block' });
      Select.drawPoint(-120, -31); Select.drawPoint(-112, -21);
      const item = Select.finishDraw();
      const added = Store.get('support').length;
      Select.setBlockRect(item, [-100, -31, -92, -21]);
      const moved = Store.get('support')[0].rect;
      const sel = Select.get();
      Select.deleteBlock(sel);
      return eq([ok, added, moved, Store.get('support').length, Derived.get().hud.units], [true, 1, [-100, -31, -92, -21], 0, 17]);
    });
    await t('moving a stair switches the stairs to Manual and the fill follows', () => {
      fresh();
      const st = L().stairs[0];
      const r0 = ringRect(st.outer);
      Select.setBlockRect({ kind: 'stair', id: st.id }, [r0[0] + 2, r0[1], r0[2] + 2, r0[3]]);
      const s = Store.snapshot();
      return eq([s.stairs.mode, s.stairs.items.length, Derived.get().ok], ['manual', L().stairs.length, true]);
    });
    await t('moving the core changes the plan and Undo puts it back', () => {
      fresh();
      const before = TestHelp.snap();
      Select.setBlockRect({ kind: 'core', id: 'core' }, [-45, 2.835, -15, 32.5]);
      const moved = Store.get('core.rect');
      return eq([moved, TestHelp.oneStep(before)], [[-45, 2.835, -15, 32.5], true]);
    });

    /* ---- the pointer drag ---- */
    if (Render.ready()) {
      await t('a pointer drag on a bay line moves it: two units lock and NRSF stays', async () => {
        fresh();
        Store.set('view.bays', true, { live: false });
        Render.setView('plan', false);
        await frames(3);
        const s = southBay();
        const lim = Select.bayLimits(s.i);
        const sgn = lim.fwd >= 2 ? 1 : -1;
        const mid = s.b.mid, t0 = s.b.t;
        const a = Select.bayScreen(s.i), z = Select.screenOf(mid[0] + t0[0] * 2 * sgn, mid[1] + t0[1] * 2 * sgn, 0.9);
        const c = Render.canvas();
        const ev = (type, x, y) => c.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, pointerId: 7, pointerType: 'mouse', button: 0, buttons: 1, clientX: x, clientY: y }));
        const before = nrsf();
        ev('pointerdown', a.x, a.y);
        ev('pointermove', a.x + (z.x - a.x) / 2, a.y + (z.y - a.y) / 2);
        ev('pointermove', z.x, z.y);
        ev('pointerup', z.x, z.y);
        await frames(2);
        return eq([Select.locks().length, Math.abs(nrsf() - before) < 0.5 || `${before} -> ${nrsf()}`, Render.orbitEnabled()], [2, true, true]);
      });
    }
  } finally {
    Select.clear();
    Store.replace(savedState); UI.setTab(savedTab);
    Options.holdAutosave(false);
    UI.updateHud(Derived.get());
  }
  TestHelp.merged('select', results);
  return results;
}

/* ==========================================================================
   TESTS: the project file  (plan sections 7 and 9.2)
   A hand-built Mid-Rise massing: two bars, five levels with the same plate, placed at x 40, y 60. Open it, fill it (one group of five
   floors), write the plates section (1 s debounce, visibilitychange, pagehide), keep every other section, a newer massing shows the stale
   notice, a newer schema is read only, and the Send items open ../parking/?project=<id> and ../facade/?project=<id>.
   The fixture lives in an in-memory storage, so a ?test visit never touches the saved projects.
   runAllTests (below) runs every test file and merges the results.
   ========================================================================== */
const ProjectFixture = (() => {
  const memory = () => ({ data: {}, getItem(k) { return this.data[k] === undefined ? null : this.data[k]; }, setItem(k, v) { this.data[k] = String(v); }, removeItem(k) { delete this.data[k]; } });
  const rect = (x0, y0, x1, y1) => [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
  /** Two bars in the massing frame, 200 x 60 each, 30 ft apart. */
  const plate = () => [{ outer: rect(-100, -75, 100, -15), holes: [] }, { outer: rect(-100, 15, 100, 75), holes: [] }];
  const level = (index) => ({ index, name: `Level ${index}`, zone: 'bar', z: (index - 1) * 10, ftf: 10, program: 'residential', plates: plate(), core: null, spines: [], seeds: [] });
  const massing = (updatedAt) => ({ tool: 'midrise', schema: 1, placement: { x: 40, y: 60, rotation: 0, baseZ: 0 }, state: {}, derived: { levels: [1, 2, 3, 4, 5].map(level) }, ...(updatedAt ? { updatedAt } : {}) });
  function project({ name = 'Fixture', withMassing = true } = {}) {
    let doc = ProjectMod.newProject({ name });
    if (withMassing) doc = ProjectMod.writeSection(doc, 'massing', massing());
    return doc;
  }
  return { memory, project, massing, plate };
})();

      const lv = (index) => ({ index, name: `Level ${index}`, zone: 'tower', z: (index - 1) * 15, ftf: 15, program: 'hotel', plates: [{ outer: rect(117, 93), holes: [] }], core: rect(52, 42), spines: [], seeds: [] });

  } finally {
    ProjectUI.close();
    ProjectUI.restoreDefaults();
    ProjectUI.reset();
    Store.replace(savedState); UI.setTab(savedTab);
    Options.holdAutosave(false);
    UI.updateHud(Derived.get());
  }
  TestHelp.merged('project', results);
  return results;
}
async function runAllTests() {
  const base = await runTests();
  const ui = await runUiTests();
  const select = await runSelectTests();
  const project = await runProjectTests();
  const all = [...base, ...ui, ...select, ...project];
  const failed = all.filter((r) => !r.ok);
  TestHelp.merged('all', all);
  window.__plateTestResults = { total: all.length, passed: all.length - failed.length, failed, results: all };
  return window.__plateTestResults;
}

/* ==========================================================================
   TESTS: the project site layer  (docs/site-layer-technical-plan.md section 9.2, tests 1 to 6)
   A project with a 1,000 ft site (a sloping 11 x 11 ground, two buildings, a road, a walk, a pond and three trees) and a deck massing
   placed on it. The layer draws the whole site: the ground, the neighbors, the pavement, the water and the trees. View > Site switches
   it, Compare and the AI-ready image hide it, a theme change rebuilds it. A fixture project lives in an in-memory storage, so a ?test
   visit never touches the saved projects. runAllTests below picks these tests up after the others.
   ========================================================================== */
const SiteFixture = (() => {
  const memory = () => ({ data: {}, getItem(k) { return this.data[k] === undefined ? null : this.data[k]; }, setItem(k, v) { this.data[k] = String(v); }, removeItem(k) { delete this.data[k]; } });
  const S = 1000, N = 11, SPACING = 100;
  const rect = (x0, y0, x1, y1) => [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
  /** The massing placement on the site: its ground floor at the ground there (1000 + 0.01 x + 0.02 y = 1008 at x 300, y 250). */
  const PLACEMENT = { x: 300, y: 250, rotation: 0, baseZ: 1008 };
  /** A 1000 ft site square with a sloping ground (z = 1000 + 0.01 x + 0.02 y), a near and a far building, a road, a walk, a pond and trees. */
  function siteProject({ massing = null } = {}) {
    let doc = ProjectMod.newProject({ name: 'Site fixture', frame: { kind: 'site', lat: 33.927, lon: -84.339, size: S } });
    const points = [];
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) points.push([i * SPACING, j * SPACING, 1000 + 0.01 * i * SPACING + 0.02 * j * SPACING]);
    const derived = {
      address: 'Fixture', lat: 33.927, lon: -84.339, size: S, release: 'test',
      boundary: rect(0, 0, S, S), ground: { spacing: SPACING, n: N, points },
      buildings: [
        { id: 'near', outer: rect(480, 380, 560, 420), holes: [], base: 1010, height: 40, top: 1050, floors: 3, rule: 'data', name: 'Near' },
        { id: 'far', outer: rect(950, 950, 990, 990), holes: [], base: 1030, height: 30, top: 1060, floors: 2, rule: 'data', name: 'Far' },
      ],
      roads: { segments: [], pavement: [{ outer: rect(0, 560, S, 600), holes: [] }] },
      walks: [{ outer: rect(0, 610, S, 618), holes: [] }],
      trees: [{ x: 620, y: 300, z: 1010, canopy: 22, height: 34 }, { x: 660, y: 330, z: 1011, canopy: 18, height: 30 }, { x: 700, y: 280, z: 1010, canopy: 20, height: 32 }],
      water: { areas: [{ outer: rect(760, 120, 860, 200), holes: [], level: 1010 }], lines: [] },
    };
    doc = ProjectMod.writeSection(doc, 'site', { tool: 'site', schema: 1, placement: { x: 0, y: 0, rotation: 0, baseZ: 0 }, state: { query: 'Fixture', lat: 33.927, lon: -84.339, size: S, release: 'test', walks: false }, derived });
    if (massing) doc = ProjectMod.writeSection(doc, 'massing', massing);
    return doc;
  }
  return { memory, siteProject, S, PLACEMENT };
})();

async function runSiteTests() {
  const { eq, near, make, $, wait, frames } = TestHelp;
  const { results, t } = make();
  const savedState = Store.snapshot(), savedTab = UI.activeTab();
  Options.holdAutosave(true);
  const mem = SiteFixture.memory();
  ProjectUI.reset();
  ProjectUI.configure({ storage: mem, navigate: () => {}, updateUrl: () => {} });
  const fresh = () => { Store.replace(fillDefaults(defaultState())); };
  const errors = [];
  const onErr = (e) => { errors.push(String(e && e.message ? e.message : e)); };
  window.addEventListener('error', onErr);
  const siteMesh = (kind) => Render.sceneObjects().find((o) => o.userData && o.userData.kind === kind) || null;
  const viewRow = () => [...document.querySelectorAll('#tabpanel-view .toggle-row')].find((b) => b.textContent.trim() === 'Site');
  const massing = () => { const m = ProjectFixture.massing(); m.placement = { ...SiteFixture.PLACEMENT }; return m; };
  const open = () => { const doc = SiteFixture.siteProject({ massing: massing() }); ProjectMod.saveProject(mem, doc); ProjectUI.openDoc(doc); return doc; };

  try {
    fresh();
    await frames(3);
    await t('1 no project: the site layer is off and the grid keeps full strength', () => eq([SiteLayer.info().shown, SiteLayer.groundMesh() === null, Render.sceneFlags().gridA], [false, true, 0.8]));
    await t('2 a project with a site draws the ground, the pavement, the water, the trees and 2 neighbors; the grid fades to 40 percent', async () => {
      open();
      await frames(4);
      const i = SiteLayer.info(), f = Render.sceneFlags();
      return eq([i.shown, i.ground, i.buildings, i.roads, i.walks, i.waterAreas, i.trees, f.site, Math.round(f.gridA * 1000) / 1000, errors.length],
        [true, true, 2, 1, 1, 1, 3, true, 0.32, 0]);
    });
    await t('2d a building removed in the Site Model (removed: true) is not drawn: 1 neighbor, counts.removed 1', async () => {
      const doc = SiteFixture.siteProject({ massing: massing() });
      const site = ProjectMod.getSection(doc, 'site');
      const d2 = JSON.parse(JSON.stringify(site.derived));
      d2.buildings[0].removed = true;
      const doc2 = ProjectMod.writeSection(doc, 'site', { ...site, state: { ...site.state, removed: ['near'] }, derived: d2 });
      ProjectMod.saveProject(mem, doc2);
      ProjectUI.openDoc(doc2);
      await frames(4);
      const i = SiteLayer.info();
      const data = SiteLayerMod.buildSiteLayerData(d2, ProjectUI.placement(), {});
      open();
      await frames(4);
      return eq([i.buildings, data.counts.buildings, data.counts.removed, SiteLayer.info().buildings], [1, 1, 1, 2]);
    });
    await t('3 the View Site toggle switches the layer off and on again', async () => {
      UI.setTab('view');
      const row = viewRow();
      const a = [SiteLayer.info().shown, !!row, row && row.getAttribute('aria-checked')];
      row.click();
      await frames(3);
      const off = [SiteLayer.info().shown, Store.get('view.site'), Render.sceneFlags().gridA, Render.sceneFlags().site];
      row.click();
      await frames(3);
      const on = [SiteLayer.info().shown, Store.get('view.site'), SiteLayer.info().buildings];
      return eq([a, off, on], [[true, true, 'true'], [false, false, 0.8, true], [true, true, 2]]);
    });
    await t('4 the Compare view hides the layer; closing Compare shows it again', async () => {
      fresh();
      Options.save(); Options.duplicate();
      const ok = Compare.enter();
      await frames(3);
      const during = [ok !== false, Render.sceneFlags().site, Render.sceneFlags().gridA];
      Compare.exit();
      await frames(3);
      for (const o of Options.list()) Options.storage.remove(o.id);
      return eq([during, Render.sceneFlags().site, SiteLayer.info().shown], [[true, false, 0.8], true, true]);
    });
    // test 5: the Plate Planner has no AI-ready image
    await t('6 a theme change rebuilds the layer (the key carries the theme epoch)', async () => {
      const k0 = SiteLayer.info().key, m0 = siteMesh('site-buildings');
      Render.themeChanged();
      await frames(4);
      const k1 = SiteLayer.info().key, m1 = siteMesh('site-buildings');
      return eq([k0 !== k1, !!m0, !!m1, m0 !== m1, SiteLayer.info().buildings], [true, true, true, true, 2]);
    });
    await t('7 the layer draws the site meshes: ground, buildings, roads, walks, water, trees', async () => {
      const kinds = [];
      Render.sceneObjects().forEach((o) => { if (o.userData && o.userData.site && !kinds.includes(o.userData.kind)) kinds.push(o.userData.kind); });
      return eq(['site-ground', 'site-buildings', 'site-roads', 'site-walks', 'site-water', 'site-trees'].every((k) => kinds.includes(k)), true);
    });
    await t('9 the ghost of the site neighbors does not double the solid ones; it returns when the Site switch is off', async () => {
      Store.set('view.context', true, { live: false });
      await frames(3);
      const on = [SiteLayer.info().buildings, Render.contextMeshes()];
      Store.set('view.site', false, { live: false });
      await frames(3);
      const off = [SiteLayer.info().buildings, Render.contextMeshes()];
      Store.set('view.site', true, { live: false });
      await frames(3);
      return eq([on, off], [[2, 0], [0, 1]]);
    });
    await t('10 the layer never feeds a number: the plate numbers stay the same when the Site switch flips', async () => {
      const a = JSON.stringify(Derived.get().hud);
      Store.set('view.site', false, { live: false });
      await frames(2);
      const b = JSON.stringify(Derived.get().hud);
      Store.set('view.site', true, { live: false });
      await frames(2);
      return eq([a === b, a.length > 20], [true, true]);
    });
    await t('12 Axon frames the building plus a margin of max(150 ft, 0.6 x its span), clamped to the site square: smaller than the site, holding the building; the layer off frames the building alone', async () => {
      Render.setView('axon', false);
      await frames(3);
      const on = Render.framedBox('axon'), sb = SiteLayer.frameBox(Store.raw()), a = Render.info().distance;
      Store.set('view.site', false, { live: false });
      await wait(1600);
      const off = Render.framedBox('axon'), b = Render.info().distance;
      Store.set('view.site', true, { live: false });
      await wait(1600);
      const c = Render.info().distance;
      const m = Math.max(150, 0.6 * Math.max(off.maxX - off.minX, off.maxY - off.minY));
      const holds = on.minX <= off.minX && on.maxX >= off.maxX && on.minY <= off.minY && on.maxY >= off.maxY;
      const smaller = on.maxX - on.minX < sb.maxX - sb.minX - 1 && on.maxY - on.minY < sb.maxY - sb.minY - 1;
      const margin = [on.minX - Math.min(off.minX, Math.max(off.minX - m, sb.minX)), on.maxX - Math.max(off.maxX, Math.min(off.maxX + m, sb.maxX)), on.minY - Math.min(off.minY, Math.max(off.minY - m, sb.minY)), on.maxY - Math.max(off.maxY, Math.min(off.maxY + m, sb.maxY))].every((v) => Math.abs(v) < 1e-6);
      return eq([holds, smaller, margin, a > b * 1.1, Math.abs(a - c) < a * 0.01, m >= 150], [true, true, true, true, true, true]);
    });
    await t('8s site style: glass draws the neighbors transparent (opacity 0.25, no depth write, drawn after the ground) with their edges kept; wireframe draws edges only; solid is opaque again; the ground and roads do not change; info.style and the layer key follow', async () => {
      if (!SiteLayer.info().shown) open();
      await frames(4);
      const objs = () => Render.sceneObjects();
      const read = () => {
        const o = objs(), m = o.find((x) => x.userData.kind === 'site-buildings'), e = o.filter((x) => x.userData.kind === 'site-building-edges'), r = o.find((x) => x.userData.kind === 'site-roads') || o.find((x) => x.userData.kind === 'site-ground');
        return {
          style: SiteLayer.info().style, mesh: !!m, transparent: m ? m.material.transparent : null, opacity: m ? m.material.opacity : null, depthWrite: m ? m.material.depthWrite : null,
          order: m ? m.renderOrder : null, edges: e.length, edgeOrder: e.length ? e[0].renderOrder : null, roads: r ? [r.material.transparent, r.material.opacity] : null, buildings: SiteLayer.info().buildings,
        };
      };
      const keys = [];
      const out = {};
      for (const s of ['solid', 'glass', 'wireframe', 'solid']) {
        Store.set('view.siteStyle', s, { live: false });
        await frames(4);
        out[s] = read();
        keys.push(SiteLayer.info().key);
      }
      const n = out.solid.edges;
      const ok = {
        solid: eq(out.solid, { style: 'solid', mesh: true, transparent: false, opacity: 1, depthWrite: true, order: 0, edges: n, edgeOrder: 0, roads: [false, 1], buildings: 2 }),
        glass: eq(out.glass, { style: 'glass', mesh: true, transparent: true, opacity: 0.25, depthWrite: false, order: 2, edges: n, edgeOrder: 3, roads: [false, 1], buildings: 2 }),
        wire: eq(out.wireframe, { style: 'wireframe', mesh: false, transparent: null, opacity: null, depthWrite: null, order: null, edges: n, edgeOrder: 3, roads: [false, 1], buildings: 2 }),
        keys: keys[0] !== keys[1] && keys[1] !== keys[2] && keys[0] !== keys[2] && keys[3] === keys[0],
        edges: n > 0, errors: errors.length,
      };
      const bad = Object.entries(ok).filter(([k, v]) => k === 'errors' ? v !== 0 : v !== true);
      return bad.length ? JSON.stringify(bad) : true;
    });

    await t('8t site style chips: the View tab has Site style Solid, Glass, Wireframe under the Site toggle (hidden while Site is off); a click sets view.siteStyle; an unknown saved value fills as solid', async () => {
      if (!SiteLayer.info().shown) open();
      await frames(4);
      const q = (v) => document.querySelector(`#siteStyleChips [data-value="${v}"]`);
      const row = document.getElementById('siteStyleChips');
      const labels = row ? [...row.querySelectorAll('[data-value]')].map((b) => b.textContent.trim()) : [];
      const visible = () => !!row && !row.closest('.when[hidden]');
      Store.set('view.siteStyle', 'solid', { live: false });
      await frames(4);
      const a = [visible(), q('solid') && q('solid').getAttribute('aria-pressed')];
      q('glass').click();
      await frames(4);
      const b = [Store.get('view.siteStyle'), q('glass').getAttribute('aria-pressed'), q('solid').getAttribute('aria-pressed')];
      Store.set('view.site', false, { live: false });
      await frames(4);
      const hidden = !visible();
      Store.set('view.site', true, { live: false });
      Store.set('view.siteStyle', 'solid', { live: false });
      await frames(4);
      const fill = [fillDefaults({ view: { siteStyle: 'bogus' } }).view.siteStyle, fillDefaults({ view: { siteStyle: 'glass' } }).view.siteStyle, fillDefaults({}).view.siteStyle];
      return eq([labels, a, b, hidden, fill], [['Solid', 'Glass', 'Wireframe'], [true, 'true'], ['glass', 'true', 'false'], true, ['solid', 'glass', 'solid']]);
    });

    await t('8 closing the project removes the layer', async () => {
      ProjectUI.close();
      await frames(3);
      return eq([SiteLayer.info().shown, Math.round(Render.sceneFlags().gridA * 1000) / 1000], [false, 0.8]);
    });
  } finally {
    window.removeEventListener('error', onErr);
    if (Compare.isActive()) Compare.exit();
    ProjectUI.reset();
    ProjectUI.restoreDefaults();
    Select.clear();
    Store.replace(savedState);
    UI.setTab(savedTab, { remember: false });
    Options.holdAutosave(false);
  }
  return results;
}

/* The merged run (runAllTests, in 12d) picks the site tests up here, after the others. */
{
  const runAllBefore = runAllTests;
  runAllTests = async function runAllTestsWithSite() {
    const r = await runAllBefore();
    const site = await runSiteTests();
    const failed = site.filter((x) => !x.ok);
    r.results.push(...site);

    r.total += site.length;

    TestHelp.merged('site', site);
    return r;
  };
}

/* ==========================================================================
   TESTS: the project massing in the 3D view
   A project with a massing of nine levels (a two-level podium, a four-level tower group, a two-level upper group, a crown). View > Massing draws
   every level as a solid with dark edges (the podium softer), the active group highlighted, the editing level standing at its own z;
   Plan draws the massing as outlines so the plate stays readable; Compare hides it. runAllTests below picks these tests up after the others.
   ========================================================================== */
const MassingFixture = (() => {
  const rect = (w, d) => [[-w / 2, -d / 2], [w / 2, -d / 2], [w / 2, d / 2], [-w / 2, d / 2]];
  const lv = (index, zone, z, ftf, w, d, extra = {}) => ({ index, name: `Level ${index}`, zone, z, ftf, program: zone === 'crown' ? null : 'residential', plates: [{ outer: rect(w, d), holes: extra.hole ? [rect(w - 2, d - 2).reverse()] : [] }], core: zone === 'tower' ? rect(30, 24) : null, spines: [], seeds: [] });
  /** Podium 1-2 (120 x 100), group A = levels 3-6 (80 x 60), group B = levels 7-8 (60 x 50), crown 9. */
  const massing = (placement = { x: 0, y: 0, rotation: 0, baseZ: 0 }) => ({
    tool: 'tower', schema: 1, placement, state: {},
    derived: { levels: [lv(1, 'podium', 0, 15, 120, 100), lv(2, 'podium', 15, 15, 120, 100), lv(3, 'tower', 30, 10, 80, 60), lv(4, 'tower', 40, 10, 80, 60), lv(5, 'tower', 50, 10, 80, 60), lv(6, 'tower', 60, 10, 80, 60), lv(7, 'tower', 70, 10, 60, 50), lv(8, 'tower', 80, 10, 60, 50), lv(9, 'crown', 90, 20, 60, 50, { hole: true })] },
  });
  return { massing };
})();

async function runMassingTests() {
