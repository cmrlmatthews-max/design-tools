  const title = [
    `PLATE PLANNER - ${name}`,
    "SKETCH ONLY - A TEST FIT FOR EARLY DESIGN. IT CHECKS NO CODE.",
    "AREA RULE: UNIT AREA TO THE CENTERLINE OF DEMISING WALLS, THE CORRIDOR FACE OF THE CORRIDOR WALL, AND THE INSIDE FACE OF THE EXTERIOR WALL.",
  ];
  if (derived.metrics) title.push(`UNITS ${derived.metrics.units}   NRSF ${n0(derived.metrics.nrsf)} SF   GSF ${n0(derived.metrics.gsf)} SF   EFFICIENCY ${(derived.metrics.efficiency * 100).toFixed(1)} PERCENT`);
  title.forEach((s, k) => D.text("TEXT", x0, y0 - k * 3.5, 0, 2, s));

  const head = new Dxf();
  const ext = (a, d) => (isFinite(a) ? a : d);
  head.g(0, "SECTION"); head.g(2, "HEADER");
  head.g(9, "$ACADVER"); head.g(1, "AC1009");
  head.g(9, "$EXTMIN"); head.g(10, ext(D.min[0], 0)); head.g(20, ext(D.min[1], 0)); head.g(30, ext(D.min[2], 0));
  head.g(9, "$EXTMAX"); head.g(10, ext(D.max[0], 0)); head.g(20, ext(D.max[1], 0)); head.g(30, ext(D.max[2], 0));
  head.g(0, "ENDSEC");
  head.g(0, "SECTION"); head.g(2, "TABLES");
  head.g(0, "TABLE"); head.g(2, "LTYPE"); head.g(70, 1);
  head.g(0, "LTYPE"); head.g(2, "CONTINUOUS"); head.g(70, 0); head.g(3, "Solid line"); head.g(72, 65); head.g(73, 0); head.g(40, 0);
  head.g(0, "ENDTAB");
  head.g(0, "TABLE"); head.g(2, "LAYER"); head.g(70, PLATE_DXF_LAYERS.length + 1);
  head.g(0, "LAYER"); head.g(2, "0"); head.g(70, 0); head.g(62, 7); head.g(6, "CONTINUOUS");
  for (const [lname, color] of PLATE_DXF_LAYERS) { head.g(0, "LAYER"); head.g(2, lname); head.g(70, 0); head.g(62, color); head.g(6, "CONTINUOUS"); }
  head.g(0, "ENDTAB");
  head.g(0, "ENDSEC");
  head.g(0, "SECTION"); head.g(2, "ENTITIES");
  const tail = ["  0", "ENDSEC", "  0", "EOF"];
  return head.out.concat(D.out, tail).join("\n") + "\n";
}

/* ---------------- notes ---------------- */

/** The first number found at any of the dotted paths, else null. */
function dig(obj, ...paths) {
  for (const p of paths) {
    let v = obj;
    for (const k of p.split(".")) { if (v === null || v === undefined || typeof v !== "object") { v = undefined; break; } v = v[k]; }
    if (isNum(v)) return v;
  }
  return null;
}

function groupLabel(g, derived) {
  if (g.label) return String(g.label);
  const idx = (Array.isArray(g.levels) ? g.levels : []).map((e) => (isNum(e) ? e : e && e.index)).filter(isNum).sort((a, b) => a - b);
  if (!idx.length) return String(g.id ?? "Group");
  const n = idx.length;
  const contiguous = idx.every((v, k) => k === 0 || v === idx[k - 1] + 1);
  const span = n === 1 ? `Level ${idx[0]}` : contiguous ? `Levels ${idx[0]}-${idx[n - 1]}` : `Levels ${idx.join(", ")}`;
  return `${span} (${n} floor${n === 1 ? "" : "s"})`;
}

/**
 * Notes file in Markdown (ASD-STE100 style: short sentences, active voice).
 * metrics is optional (the computeMetrics result): stair door path, dead ends (groups[].row.stairDoors), the fill mix targets
 * (building.mix) and the warnings are read from it when present.
 * @param meta  optional { date, address, source ("drawn" | "project"), massingName }
 */
function notesMarkdown(state, built, metrics, meta) {
  if (!state) throw new Error('notesMarkdown: missing input "state".');
  if (!built) throw new Error('notesMarkdown: missing input "built".');
  const mt = meta || {};
  const m = metrics || {};
  const derived = platesDerived(state, built, metrics);
  const table = typeTable(state);
  const hotel = derived.mode === "hotel";
  const unitWord = hotel ? "keys" : "units";
  const date = mt.date || new Date().toISOString().slice(0, 10);
  const recs = levelRecords(built);
  const first = recs[0] && recs[0].fill;
  const kind = (first && (first.kind || first.corridorKind)) || (state.corridor && state.corridor.kind) || "auto";
  const pl = built.placement || state.placement || null;
  const p = plc(pl);
  const total = derived.metrics.units;

  const L = [];
  L.push(`# Plate Planner: ${String(state.name || "Option")}`, "");
  L.push("This is a test fit for early design. It is not a unit plan and it checks no code.", "");
  L.push(CAUTIONS[0], "");

  L.push("## Project", "");
  L.push(`- Option: ${String(state.name || "Option")}`);
  if (mt.address) L.push(`- Address: ${mt.address}`);
  L.push(`- Source: ${mt.source || state.source || "drawn"}`);
  L.push(`- Mode: ${derived.mode}`);
  L.push(`- Date: ${date}`);
  if (derived.massingUpdatedAt) L.push(`- Massing updated: ${derived.massingUpdatedAt}`);
  L.push(`- Placement: x ${p.x}, y ${p.y}, rotation ${p.rotation} degrees, base z ${p.baseZ} ft`);
  L.push("- Units: feet and square feet. Coordinates are in the plate frame (the massing local frame).", "");

  L.push("## Area rule", "");
  L.push(AREA_RULE, "");
  L.push(`- Exterior wall allowance: ${n1(isNum(state.extWall) ? state.extWall : 1)} ft, taken from the plate edge.`);
  L.push(`- Corridor wall: ${n1(wallThickness(state))} ft. The unit area includes it.`);
  L.push("- NRSF is the sum of the unit areas. GSF is the plate area. Efficiency is NRSF divided by GSF.", "");
  L.push(CAUTIONS[1], "");

  L.push("## Corridor and core", "");
  L.push(`- Corridor type: ${kind}`);
  L.push(`- Clear corridor width: ${n1(corridorWidth(state))} ft`);
  L.push(`- Stairs: ${state.stairs && state.stairs.mode ? state.stairs.mode : "auto"}`);
  // metrics.js (computeMetrics) keeps the corridor graph numbers per group: groups[].row.stairDoors { pathFt, deadEnds }
  const sdoors = (Array.isArray(m.groups) ? m.groups : []).map((g) => g && g.row && g.row.stairDoors).filter(Boolean);
  const stairPath = dig(m, "stairPathFt", "corridor.stairPathFt", "building.stairPathFt", "building.corridor.stairPathFt")
    ?? (sdoors.length && sdoors.every((s) => isNum(s.pathFt)) ? Math.max(...sdoors.map((s) => s.pathFt)) : null);
  if (stairPath !== null) L.push(`- Stair door path (farthest two doors, along the corridor): ${n1(stairPath)} ft`);
  const dead = m.deadEnds || (m.building && m.building.deadEnds) || (m.corridor && m.corridor.deadEnds) || (sdoors.length ? sdoors.flatMap((s) => s.deadEnds || []) : null);
  if (Array.isArray(dead)) {
    if (!dead.length || dead.every((d) => !(d.ft > 0))) L.push("- Dead ends: none");
    else for (const d of dead) L.push(`- Dead end at stair ${d.stairId}: ${n1(d.ft)} ft`);
  }
  L.push(`- Corridor length, all levels: ${n0(derived.metrics.corridorFt)} ft`, "");
  L.push(CAUTIONS[3], "");

  L.push("## Unit mix", "");
  const shareSum = table.reduce((s, t) => s + t.share, 0) || 1;
  L.push(`| Type | Target share | Target ${unitWord} | Placed | Placed share | Average area (sf) |`, "|---|---|---|---|---|---|");
  const scored = m.building && Array.isArray(m.building.mix) ? m.building.mix : [];     // computeMetrics: the fill targets, by type id
  for (const t of table) {
    const placed = derived.mix.find((r) => r.type === t.name);
    const tg = t.share / shareSum, sc = scored.find((r) => r.type === t.id);
    L.push(`| ${t.name} | ${pct(tg)} | ${n1(sc && isNum(sc.target) ? sc.target : tg * total)} | ${placed ? placed.count : 0} | ${pct(placed ? placed.share : 0)} | ${placed ? n1(placed.avgArea) : "-"} |`);
  }
  for (const r of derived.mix) if (!table.some((t) => t.name === r.type)) L.push(`| ${r.type} | - | - | ${r.count} | ${pct(r.share)} | ${n1(r.avgArea)} |`);
  L.push("", "The target shares come from the mix table. Small plates often miss the targets. The totals for the whole building come closer.", "");

  L.push("## Metrics", "");
  L.push("| Item | Value |", "|---|---|");
  L.push(`| ${hotel ? "Keys" : "Units"}, whole building | ${total} |`);
  if (hotel && isNum(derived.metrics.bays)) L.push(`| Bays | ${derived.metrics.bays} |`);
  L.push(`| NRSF | ${n1(derived.metrics.nrsf)} sf |`, `| GSF | ${n1(derived.metrics.gsf)} sf |`, `| Efficiency | ${pct(derived.metrics.efficiency)} |`);
  if (total) L.push(`| Average ${hotel ? "key" : "unit"} area | ${n1(derived.metrics.nrsf / total)} sf |`);
  L.push("");
  const groups = (Array.isArray(built.groups) ? built.groups : []).filter((g) => g && g.fill);
  if (groups.length) {
    L.push("| Level group | Floors | " + (hotel ? "Keys" : "Units") + " per floor | NRSF per floor (sf) | Efficiency |", "|---|---|---|---|---|");
    for (const g of groups) {
      const idx = (Array.isArray(g.levels) ? g.levels : []).map((e) => (isNum(e) ? e : e && e.index));
      const lv = derived.levels.find((l) => idx.includes(l.index));
      if (lv) L.push(`| ${groupLabel(g, derived)} | ${idx.length} | ${lv.metrics.units} | ${n1(lv.metrics.nrsf)} | ${pct(lv.metrics.efficiency)} |`);
    }
    L.push("");
  }

  L.push("## Accessible", "");
  const acc = derived.levels.reduce((s, l) => s + l.units.filter((u) => u.accessible).length, 0);
  const roll = derived.levels.reduce((s, l) => s + l.units.filter((u) => u.accessible === "roll-in").length, 0);
  L.push(`- Accessible ${hotel ? "keys" : "units"} placed, whole building: ${acc}${hotel && roll ? ` (${roll} roll-in)` : ""}`);
  const ac = state.accessible || {};
  if (!hotel && ac.multifamily) L.push(`- Source row: ${pct(ac.multifamily.typeAShare ?? 0)} of the units, at least ${ac.multifamily.minUnits ?? 0}, when the building has more than ${ac.multifamily.over ?? 0} units.`);
  if (hotel && Array.isArray(ac.hotel)) L.push(`- Source table (keys up to, accessible, roll-in): ${ac.hotel.map((r) => `${r[0]}: ${r[1]}, ${r[2]}`).join("; ")}`);
  L.push("");
  L.push(CAUTIONS[2], "");

  const raw = [...(Array.isArray(built.warnings) ? built.warnings : []), ...recs.flatMap((r) => (Array.isArray(r.fill.warnings) ? r.fill.warnings : [])), ...(Array.isArray(m.warnings) ? m.warnings : [])];
  const seen = new Set(), warnings = [];
  for (const w of raw) {
    if (!w) continue;
    const where = w && w.where ? (typeof w.where === "object" ? Object.entries(w.where).filter(([, v]) => v !== null && v !== undefined && typeof v !== "object").map(([k, v]) => `${k} ${v}`).join(", ") : String(w.where)) : "";
    const s = typeof w === "string" ? w : `${w.code ? w.code + (where ? ` (${where})` : "") + ": " : ""}${w.message || ""}`;
    if (s && !seen.has(s)) { seen.add(s); warnings.push(s); }
  }
  L.push("## Warnings", "");
  if (!warnings.length) L.push("No warnings.", "");
  else { for (const s of warnings) L.push(`- ${s}`); L.push(""); }

  if (Array.isArray(built.notes) && built.notes.length) { L.push("## Build notes", ""); for (const s of built.notes) L.push(`- ${s}`); L.push(""); }

  L.push("## Import", "");
  L.push("1. Rooms: use the rooms CSV with a pyRevit script. The script places a room at (cx, cy) on each level at the z in the file. The first comment line holds the placement. Rooms get the plate frame coordinates.");
  L.push("2. Lines: Insert > Import CAD. Select the DXF file. Set Positioning to Auto - Origin to Internal Origin. Set Units to Foot.");
  L.push("3. SketchUp: use Extensions > CMRLM > Import Design Tools file.", "");
  L.push(CAUTIONS[4], "");
  return L.join("\n");
}

return { PLATE_DXF_LAYERS, AREA_RULE, CAUTIONS, CSV_COLUMNS, roomsCsv, plateDxf, notesMarkdown };
})();

/* ---- src/plate/sketchup.js ---- */
const SkPlate = (() => {
/* ==========================================================================
   plate/sketchup.js — Plate Planner → ".sketchup.json" (docs/sketchup-spec.md, plan section 4)

   plateToSketchup(state, built, metrics, meta) → a document made with makeDoc, source "plate".
     state    the plate state
     built    buildPlates(state, ...) result (see derived.js for the fields read)
     metrics  computeMetrics result (optional; not read: the numbers come from platesDerived)
     meta     optional { createdAt, name, location, zShift, date }

   Structure: root group (the option name) > one group per level (the level name, "Level 3"; "Level 3 - Podium" when the name has no index; index order) >
     one solid per unit  (name = unit id, z to z + ftf, tag = the type name, in the type color; attributes type, area, corner, accessible, exposures)
     "Corridor"   one solid per corridor piece (holes kept)
     "Core"       the core outline
     "Stairs"     one solid per stair ("S1")
     "Elevators"  one solid per cab ("E1")
     "Support"    one solid per support block ("B1 (trash)")
   A level group with no corridor, core, stair, elevator, or support leaves those out. Raw geometry stays untagged: tags sit on the
   solids and groups, as in the other exports. The spec says "put tags on groups only"; a solid is a group in SketchUp.

   z: every z = the level z (floor surface above baseZ, plate frame) + zShift. zShift is 0 unless meta.zShift is given.
   Units: feet. Plan (x, y): the plate frame (the massing local frame). The notes carry the placement.

   Note: validateDoc in src/shared/sketchup-format.js must accept source "plate" (an integrator edit, plan section 10).
   Pure: no DOM, no input mutation.
   ========================================================================== */

const { makeDoc } = SkFmt;
const { platesDerived, typeTable, typeRow, r3 } = PlateDerivedMod;

const SKETCHUP_SOURCE = "plate";

const COLORS = { Corridor: "#d9dadc", Core: "#8f959c", Stairs: "#6f757c", Elevators: "#a3a8ae", Support: "#c9b99a" };
const isNum = (v) => typeof v === "number" && Number.isFinite(v);

function plateToSketchup(state, built, metrics, meta) {
  if (!state) throw new Error('plateToSketchup: missing input "state".');
  if (!built) throw new Error('plateToSketchup: missing input "built".');
  void metrics;
  const mt = meta || {};
  const derived = platesDerived(state, built, metrics);
  const table = typeTable(state);
  const shift = isNum(mt.zShift) ? Math.round(mt.zShift * 100) / 100 : 0;

  const tagList = [], matList = [], declared = new Set();
  const declare = (name, color) => {
    if (!declared.has(name)) { declared.add(name); tagList.push({ name, color, visible: true }); matList.push({ name, color, alpha: 1 }); }
    return name;
  };

  const children = [];
  let nUnits = 0;
  for (const lv of derived.levels) {
    const z0 = r3(lv.z + shift), z1 = r3(lv.z + lv.ftf + shift);
    const kids = [];
    const solid = (name, outer, holes, tagName, color, attributes) => {
      const n = { type: "solid", name, tag: declare(tagName, color), material: tagName, outer, holes: holes || [], z0, z1 };
      if (attributes) n.attributes = attributes;
      return n;
    };
    for (const u of lv.units) {
      const row = typeRow(table, u.type);
      const attrs = { type: u.type, area: u.area, corner: u.corner, accessible: !!u.accessible, exposures: u.exposures.join(" ") };
      kids.push(solid(u.id, u.outer, [], u.type, row ? row.color : "#9aa3ad", attrs));
      nUnits++;
    }
    lv.corridor.forEach((pc, k) => kids.push(solid(lv.corridor.length > 1 ? `Corridor ${k + 1}` : "Corridor", pc.outer, pc.holes, "Corridor", COLORS.Corridor)));
    if (lv.core.outer) kids.push(solid("Core", lv.core.outer, [], "Core", COLORS.Core));
    for (const s of lv.core.stairs) kids.push(solid(String(s.id), s.outer, [], "Stairs", COLORS.Stairs));
    for (const e of lv.core.elevators) kids.push(solid(String(e.id), e.outer, [], "Elevators", COLORS.Elevators));
    for (const s of lv.support) kids.push(solid(`${s.id} (${s.kind})`, s.outer, [], "Support", COLORS.Support));
    if (!kids.length) continue;
    children.push({
      type: "group", name: new RegExp(`\\b${lv.index}\\b`).test(lv.name) ? lv.name : `Level ${lv.index} - ${lv.name}`, children: kids,
      attributes: { index: lv.index, z: lv.z, ftf: lv.ftf, units: lv.metrics.units, nrsf: lv.metrics.nrsf, gsf: lv.metrics.gsf, efficiency: lv.metrics.efficiency },
    });
  }

  const name = String(mt.name || state.name || "Plate Planner");
  const pl = built.placement || state.placement || null;
  const pn = (k) => (pl && isNum(pl[k]) ? pl[k] : 0);
  const dm = derived.metrics;
  const notes = [
    "Plan origin = the plate frame origin (the massing local frame). x = east, y = north. Lengths in feet. z = the level floor surface above the base.",
    `Placement of the plates section: x ${pn("x")}, y ${pn("y")}, rotation ${pn("rotation")} degrees, base z ${pn("baseZ")} ft.`,
    `Plate Planner: ${derived.mode}, ${derived.levels.length} levels, ${nUnits} ${derived.mode === "hotel" ? "keys" : "units"} drawn, NRSF ${dm.nrsf.toFixed(1)} sf, GSF ${dm.gsf.toFixed(1)} sf, efficiency ${(dm.efficiency * 100).toFixed(1)} percent.`,
    "Each unit is one solid from the floor to the floor above. Corridor, core, stairs, elevators, and support are separate solids. Tags: one per unit type, plus Corridor, Core, Stairs, Elevators, and Support.",
    "Area rule: unit area runs to the centerline of the demising walls, the corridor face of the corridor wall, and the inside face of the exterior wall.",
    "Caution: this is a test fit for early design. Unit counts and areas are design-stage numbers. The tool checks no code. Verify before use.",
  ];

  return makeDoc({
    source: SKETCHUP_SOURCE, name, location: mt.location || null, zShift: shift, notes,
    tags: tagList, materials: matList, createdAt: mt.createdAt,
    root: { type: "group", name, children },
  });
}

return { SKETCHUP_SOURCE, plateToSketchup };
})();

// Section 8.4: a U plate with 60 ft arms, drawn as a polygon. No core and no elevators.
// The spine is set explicitly to the three arm centerline segments of the plan.
function uPlate(s) {
  s.plate = {
    shape: 'polygon',
    w: 200, d: 140, arm: 60,

    points: [

/* ==========================================================================
   SHARED: units
   Decimal feet, square feet, percent, and parsing of typed values.
   Feet and square feet only (version 1).
   ========================================================================== */
const Units = (() => {
  const grouped = (n, digits = 0) => n.toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits });

  /** 312.5 -> 312'-6"  (rounds to the nearest inch) */
  function formatFeetInches(ft) {
    if (typeof ft !== 'number' || !isFinite(ft)) return '—';
    const totalIn = Math.round(Math.abs(ft) * 12);
    const f = Math.floor(totalIn / 12), i = totalIn % 12;
    return `${ft < 0 && totalIn > 0 ? '-' : ''}${grouped(f)}'-${i}"`;
  }
  /** 100000 -> "100,000 sf" */
  function formatArea(sf) {
    if (typeof sf !== 'number' || !isFinite(sf)) return '—';
    return `${grouped(Math.round(sf) || 0)} sf`;
  }
  /** 1.625 -> "1.63 ft" */
  const formatFt = (v, d = 2) => (typeof v === 'number' && isFinite(v) ? `${grouped(v, d)} ft` : '—');
  /** 1234.56 -> "1,234.6 sf" */
  const formatAreaDec = (sf, d = 1) => (typeof sf === 'number' && isFinite(sf) ? `${grouped(sf, d)} sf` : '—');
  const formatSigned = (v, f) => (typeof v === 'number' && isFinite(v) ? `${v > 0.00001 ? '+' : v < -0.00001 ? '−' : '±'}${f(Math.abs(v))}` : '—');
  /** 0.0833 -> "8.3%" */
  const formatPct = (f, d = 1) => (typeof f === 'number' && isFinite(f) ? `${grouped(f * 100, d)}%` : '—');
  const formatInt = (n) => (typeof n === 'number' && isFinite(n)) ? grouped(Math.round(n) || 0) : '—';
  const formatRatio = (n, d = 2) => (typeof n === 'number' && isFinite(n)) ? grouped(n, d) : '—';
  const formatDeg = (n) => `${Math.round(n)}°`;

  /** Parse "10'-6\"", "10.5", "10'", "10' 6", "6\"", "10 ft 6 in", "10-6", "6 1/2\"" to feet. NaN when invalid. */
  function parseLength(input) {
    if (typeof input === 'number') return isFinite(input) ? input : NaN;
    let s = String(input == null ? '' : input).trim().toLowerCase();
    s = s.replace(/[, ]/g, '').replace(/[′’‘]/g, "'").replace(/[″“”]/g, '"').replace(/\s+/g, ' ');
    if (!s) return NaN;
    let sign = 1;
    if (s[0] === '-') { sign = -1; s = s.slice(1).trim(); } else if (s[0] === '+') { s = s.slice(1).trim(); }
    const NUM = '(\\d+\\.?\\d*|\\.\\d+)';
    if (new RegExp('^' + NUM + '$').test(s)) return sign * parseFloat(s);

    const parseInches = (t) => {
      t = t.trim().replace(/\s*(?:"|in\.?|inch|inches)$/, '').trim();
      if (t === '') return 0;
      let m;
      if ((m = t.match(new RegExp('^' + NUM + '$')))) return parseFloat(m[1]);
      if ((m = t.match(/^(\d+)\s*\/\s*(\d+)$/))) return +m[2] ? m[1] / m[2] : NaN;
      if ((m = t.match(new RegExp('^' + NUM + '\\s+(\\d+)\\s*/\\s*(\\d+)$')))) return +m[3] ? parseFloat(m[1]) + m[2] / m[3] : NaN;
      return NaN;
    };
    let m;
    if ((m = s.match(new RegExp('^' + NUM + "\\s*(?:'|ft\\.?|feet|foot)\\s*-?\\s*(.*)$")))) {
      const inch = parseInches(m[2]);
      return isNaN(inch) ? NaN : sign * (parseFloat(m[1]) + inch / 12);
    }
    if (/("|in\.?|inch|inches)$/.test(s)) {
      const inch = parseInches(s);
      return isNaN(inch) ? NaN : sign * inch / 12;
    }
    if ((m = s.match(new RegExp('^' + NUM + '\\s*-\\s*(.+)$')))) {   // architect shorthand: 10-6
      const inch = parseInches(m[2]);
      return isNaN(inch) ? NaN : sign * (parseFloat(m[1]) + inch / 12);
    }
    return NaN;
  }
  /** Plain number with optional unit decoration ("45°", "20%", "1,200 sf"). NaN when invalid. */
  function parseNumber(input) {
    if (typeof input === 'number') return isFinite(input) ? input : NaN;
    const s = String(input == null ? '' : input).replace(/[,\s°%]|sf$/gi, '');
    return /^[-+]?(\d+\.?\d*|\.\d+)$/.test(s) ? parseFloat(s) : NaN;
  }
  return { formatFeetInches, formatArea, formatAreaDec, formatFt, formatSigned, formatPct, formatInt, formatRatio, formatDeg, parseLength, parseNumber, grouped };
})();

/* ==========================================================================
   STATE
   The default state and fillDefaults (older, partial or imported states become complete).
   Schema: docs/plate-planner-technical-plan.md section 2. The default state and the presets come from
   src/plate/presets.js (PresetsMod). All lengths are feet, areas square feet.
   East = +x, north = +y. With a project the plate frame is the massing local frame.
   ========================================================================== */
const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const deepClone = (o) => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));
const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);

const SOURCE_LABELS = { drawn: 'Drawn or typed plate', project: 'Open project' };
const MODES = ['multifamily', 'hotel'];
const MODE_LABELS = { multifamily: 'Multifamily', hotel: 'Hotel' };
const SHAPES = ['rect', 'L', 'U', 'O', 'circle', 'polygon'];
const SHAPE_LABELS = { rect: 'Rectangle', L: 'L', U: 'U', O: 'Courtyard (O)', circle: 'Circle', polygon: 'Drawn polygon' };
const CORRIDOR_KINDS = ['auto', 'bar', 'single', 'point'];
const CORRIDOR_LABELS = { auto: 'Automatic', bar: 'Bar', single: 'Single-loaded', point: 'Point (ring)' };
const SIDES = ['north', 'east', 'south', 'west'];
const STAIR_MODES = ['auto', 'seeds', 'manual'];
const SUPPORT_KINDS = ['trash', 'electrical', 'storage', 'linen', 'ice', 'data'];
const STYLES = ['model', 'diagram'];
/** The sizes a new support block takes (ft: along x, along y). */
const SUPPORT_SIZES = { trash: [8, 10], electrical: [6, 8], storage: [10, 10], linen: [8, 14], ice: [6, 8], data: [6, 8] };

/** The default design: "Double-loaded bar" (plan section 8.1). 17 units, NRSF 15,077.8 sf, efficiency 0.7732. */
function defaultState() { return PresetsMod.defaultState(); }

const isPt = (p) => Array.isArray(p) && p.length >= 2 && typeof p[0] === 'number' && typeof p[1] === 'number' && isFinite(p[0]) && isFinite(p[1]);
const cleanPts = (arr, min) => {
  const pts = (Array.isArray(arr) ? arr : []).filter(isPt).map((p) => [p[0], p[1]]);
  return pts.length >= min ? pts : null;
};
const cleanRect = (r) => {
  if (!Array.isArray(r) || r.length < 4 || !r.slice(0, 4).every((v) => typeof v === 'number' && isFinite(v))) return null;
  const x0 = Math.min(r[0], r[2]), x1 = Math.max(r[0], r[2]), y0 = Math.min(r[1], r[3]), y1 = Math.max(r[1], r[3]);
  return x1 - x0 > 0.01 && y1 - y0 > 0.01 ? [x0, y0, x1, y1] : null;
};
const cleanId = (raw, prefix, i, taken) => {
  let id = typeof raw === 'string' && raw ? raw : `${prefix}${i + 1}`;
  let n = i + 1;
  while (taken.has(id)) id = `${prefix}${++n}`;
  taken.add(id);
  return id;
};

/** Fill every missing field from the defaults so older or partial states (presets, imports) are complete. */
function fillDefaults(src) {
  const s = isObj(src) ? deepClone(src) : {};
  const base = defaultState();
  const merge = (t, d) => {
    for (const k of Object.keys(d)) {
      if (t[k] === undefined) t[k] = deepClone(d[k]);
      else if (isObj(d[k]) && isObj(t[k])) merge(t[k], d[k]);
    }
  };
  merge(s, base);
  if (!MODES.includes(s.mode)) s.mode = 'multifamily';
  if (!['drawn', 'project'].includes(s.source)) s.source = 'drawn';

  // the drawn plate
  const p = s.plate;
  if (!SHAPES.includes(p.shape)) p.shape = 'rect';
  p.w = clamp(num(p.w, 300), 10, CONFIG.limits.maxDim);
  p.d = clamp(num(p.d, 65), 10, CONFIG.limits.maxDim);
  p.arm = clamp(num(p.arm, 60), 10, CONFIG.limits.maxDim);
  p.courtW = clamp(num(p.courtW, 120), 10, CONFIG.limits.maxDim);
  p.courtD = clamp(num(p.courtD, 90), 10, CONFIG.limits.maxDim);
  p.segments = Math.round(clamp(num(p.segments, 64), 12, 180));
  p.points = cleanPts(p.points, 3) || [];
  if (p.shape === 'polygon' && p.points.length < 3) p.shape = 'rect';

  // levels (project source)
  const lv = s.levels;
  lv.showPodium = !!lv.showPodium;
  lv.selected = typeof lv.selected === 'string' && lv.selected ? lv.selected : null;
  if (!isObj(lv.groups)) lv.groups = {};
  for (const k of Object.keys(lv.groups)) {
    const g = isObj(lv.groups[k]) ? lv.groups[k] : {};
    lv.groups[k] = { filled: g.filled !== false, locks: cleanLocks(g.locks) };
  }

  // corridor
  const c = s.corridor;
  if (!CORRIDOR_KINDS.includes(c.kind)) c.kind = 'auto';
  c.width = c.width === null || c.width === undefined ? null : clamp(num(c.width, 5.67), 3, 20);
  c.wall = clamp(num(c.wall, 0.5), 0, 3);
  if (!SIDES.includes(c.side)) c.side = 'south';
  c.spine = Array.isArray(c.spine) && c.spine.length ? c.spine.filter((seg) => Array.isArray(seg) && seg.length >= 2 && isPt(seg[0]) && isPt(seg[1])).map((seg) => [[seg[0][0], seg[0][1]], [seg[1][0], seg[1][1]]]) : null;
  if (c.spine && !c.spine.length) c.spine = null;
  s.extWall = clamp(num(s.extWall, 1), 0, 6);

  // core, stairs, elevators, support
  s.core.rect = cleanRect(s.core.rect);
  const st = s.stairs;
  if (!STAIR_MODES.includes(st.mode)) st.mode = 'auto';
  st.size = [clamp(num(st.size && st.size[0], 11), 4, 60), clamp(num(st.size && st.size[1], 22), 4, 80)];
  const tk = new Set();
  st.items = (Array.isArray(st.items) ? st.items : []).filter(isObj).slice(0, CONFIG.limits.maxStairs).map((it, i) => ({ id: cleanId(it.id, 'S', i, tk), rect: cleanRect(it.rect) })).filter((it) => it.rect);
  const el = s.elevators;
  el.count = el.count === null || el.count === undefined ? null : Math.round(clamp(num(el.count, 2), 0, 8));
  el.size = [clamp(num(el.size && el.size[0], 8), 3, 30), clamp(num(el.size && el.size[1], 10), 3, 30)];

    const warnings = sortWarnings((metrics.warnings || []).map(mapWarning));
    const derived = PlateDerivedMod.platesDerived(s, built, metrics);
    const groups = metrics.groups.map((g) => ({ id: g.id, label: g.label || g.id, first: g.first, levels: g.levels, floors: g.floors, row: g.row }));
    const sel = s.levels && s.levels.selected;
    const group = groups.find((g) => g.id === sel) || groups[0] || null;
    const editIndex = group ? group.levels[0] !== undefined ? group.levels[0] : group.first : 1;
    const levels = sceneOf(s, built, derived, editIndex);
    const editing = levels.find((l) => l.editing) || levels[0] || null;
    // Context: the plates of the other groups as faint outlines (project source), in the plate frame.
    const contextRings = [];
    for (const L of levels) if (L.groupId !== (editing && editing.groupId) && L.index === (groups.find((g) => g.id === L.groupId) || {}).first) contextRings.push(outerRingsOf(L.plate));
    const hud = summarize(s, metrics, group);
    hud.warnCount = warnings.filter((w) => w.level !== 'info').length;
    const stack = levels.length ? Math.max(...levels.map((l) => l.z + l.ftf)) : 0;
    const rings = levels.flatMap((l) => outerRingsOf(l.plate));
    const bounds = computeBounds(rings, Math.max(stack, CONFIG.slabHeight + 2));
    return {
      ok: true, state: s, built, metrics, derived, warnings, groups, group, editing, hud, bounds, rotation: 0,
      scene: { levels, contextRings, groups }, notes: built.notes || [], stale: warnings.some((w) => w.id === 'stale-massing'), source: built.source,
    };
  } catch (e) {
    console.error(e);
    const d = emptyDerived(s && s.source === 'project' ? 'The open project has no massing levels to fill. Open a project that has a massing, or switch to a drawn plate.' : 'The plates could not be built for these settings.');
    d.state = s;
    return d;
  }
}

const Derived = (() => {
  let gKey = null, geomId = 0, counter = 0, cache = null;
  // Geometry key: everything that changes the build or the numbers. The name and the view only change drawing.
  const geomKeyOf = (s) => { const { view, name, ...rest } = s; return JSON.stringify(rest); };
  const qualityNow = () => (Store.gestureActive() && !Store.gesturePath().startsWith('view') ? 'draft' : 'full');
  function get() {
    const s = Store.raw();
    const q = qualityNow();
    const gk = `${geomKeyOf(s)}|${ProjectUI.dataKey()}|${ProjectUI.fillStamp()}|${q}`;
    if (gk !== gKey || !cache) {
      gKey = gk; geomId++;
      cache = { id: ++counter, geomId, ...computeDerived(s, { project: ProjectUI.dataDoc(), fillStamp: ProjectUI.fillStamp(), currentStamp: ProjectUI.massingStamp(), quality: q }) };
    }
    return cache;
  }
  /** What to draw: the draft or the full build. */
  function display() {
    const d = get();
    return { key: `${d.geomId}`, quality: Store.gestureActive() ? 'draft' : 'full' };
  }
  return { get, display };
})();

/* ==========================================================================
   OVERLAYS  (flat text labels and lines laid on the deck)
   Objects are plain three.js lines and meshes. Each one owns its material (userData.ownMat), so the renderer
   disposes it when the layer is rebuilt. Text is drawn into a canvas and laid flat on a plane that has a size in feet,
   so it stays readable in plan and shrinks with distance in the axon view.
   ========================================================================== */
const Overlays = (() => {
  const rootCss = (name, fb) => { const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); return new THREE.Color(v || fb); };
  const W = (p, z) => planToWorld(p[0], p[1], z);
  const fmtN = (n) => Math.round(n).toLocaleString('en-US');
  const SEED_COLORS = { stair: '#d9731a', 'exterior-stair': '#d9a22b', elevator: '#7a5cc2' };

  function lines(pos, { color, opacity = 1, dashed = false, order = 4, dash = 4, gap = 3 }) {
    if (!pos.length) return null;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    const mat = dashed
      ? new THREE.LineDashedMaterial({ color, transparent: opacity < 1, opacity, dashSize: dash, gapSize: gap, depthWrite: false })
      : new THREE.LineBasicMaterial({ color, transparent: opacity < 1, opacity, depthWrite: false });
    const ls = new THREE.LineSegments(geo, mat);
    ls.renderOrder = order; ls.frustumCulled = false; ls.userData.ownMat = true;
    if (dashed) ls.computeLineDistances();
    return ls;
  }
  const loopPos = (pos, ring, z) => { for (let i = 0; i < ring.length; i++) pos.push(...W(ring[i], z), ...W(ring[(i + 1) % ring.length], z)); };

  /** Text lying flat on the plan at (x, y, z). `height` is the height of one line of text in feet. */
  function label(text, x, y, z, { height = 5, color = '#1d2733', halo = '#ffffff' } = {}) {
    const rows = String(text).split('\n');
    const px = 48, pad = 12;
    const cv = document.createElement('canvas');
    const ctx0 = cv.getContext('2d');
    ctx0.font = `600 ${px}px system-ui, -apple-system, Segoe UI, sans-serif`;
    const widest = Math.max(...rows.map((r) => ctx0.measureText(r).width));
    cv.width = Math.ceil(widest + pad * 2); cv.height = Math.ceil(rows.length * px * 1.2 + pad * 2);
    const ctx = cv.getContext('2d');
    ctx.font = `600 ${px}px system-ui, -apple-system, Segoe UI, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    rows.forEach((r, i) => {
      const yy = pad + px * 0.6 + i * px * 1.2;
      ctx.lineWidth = 9; ctx.strokeStyle = halo; ctx.strokeText(r, cv.width / 2, yy);
      ctx.fillStyle = color; ctx.fillText(r, cv.width / 2, yy);
    });
    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
    const hh = height * rows.length * 1.2 + (height * 2 * pad) / px, ww = (hh * cv.width) / cv.height;
    const geo = new THREE.PlaneGeometry(ww, hh);
    geo.translate(x, y, 0);
    geo.applyMatrix4(planMatrix(z));
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.renderOrder = 6; mesh.frustumCulled = false; mesh.userData.ownMat = true; mesh.userData.label = text;
    return mesh;
  }

  return { label, lines, loopPos };
})();

/* ==========================================================================
   PLATE 3D
   Builds the three.js objects of a plate fill from one Derived result (plan section 6):
     the plate slab (white), the units as thin slabs (white in Model style, colored by type in Diagram style) with dark demising lines and
     the corridor wall line, the corridor (light gray), the core and the stairs (mid gray, with tread lines), the elevators (crossed boxes),
     support blocks and pockets (hatched), unit labels (type and area), accessible symbols, red outlines on flagged units, amber outlines
     on locked units, bay-line handles, the context (other level groups as a faint outline, site neighbors as a ghost).
   Every drawn level comes from D.scene.levels: { index, name, z, ftf, editing, plate, corridor, core, stairs, elevators, support, units }.
   With "3D levels" off, only the editing level is drawn, at elevation 0; with it on, every filled level stands at its z and ftf.
   Everything the renderer owns (materials) is created here with userData.ownMat, so the renderer disposes it on rebuild.
   ========================================================================== */
const Plate3D = (() => {
  const css = (name, fb) => new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fb);
  const col = (hex) => new THREE.Color(hex);

  /* ---- fat lines (LineSegments2): width in CSS pixels, the renderer sets the resolution each frame ---- */
  function fat(pos, hex, width, o = {}) {
    if (!pos.length) return null;
    const geo = new LineSegmentsGeometry();
    geo.setPositions(pos);
    const op = o.opacity == null ? 1 : o.opacity;
    const mat = new LineMaterial({ color: col(hex).getHex(), linewidth: width, transparent: op < 1, opacity: op, depthWrite: false, depthTest: o.depthTest !== false, dashed: !!o.dashed, dashSize: o.dash || 3, gapSize: o.gap || 2 });
    const ls = new LineSegments2(geo, mat);
    if (o.dashed) ls.computeLineDistances();
    ls.renderOrder = o.order == null ? 5 : o.order; ls.frustumCulled = false; ls.userData.ownMat = true;
    return ls;
  }
  const ringSegs = (out, ring, z) => { for (let i = 0; i < ring.length; i++) { const a = ring[i], b = ring[(i + 1) % ring.length]; out.push(a[0], z, -a[1], b[0], z, -b[1]); } };
  const lineSeg = (out, a, b, z) => { out.push(a[0], z, -a[1], b[0], z, -b[1]); };

  /** A THREE.Shape from a ring and its holes. */
  function shapeOf(outer, holes) {
    const sh = new THREE.Shape(outer.map((p) => new THREE.Vector2(p[0], p[1])));
    for (const h2 of holes || []) if (h2 && h2.length >= 3) sh.holes.push(new THREE.Path(h2.map((p) => new THREE.Vector2(p[0], p[1]))));
    return sh;
  }
  /** An extruded plan polygon from elevation z0 up by height (geometry authored in plan space, then mapped to the Y-up world). */
  function slabGeo(outer, holes, z0, height) {
    let geo;
    try {
      geo = height > 0.001 ? new THREE.ExtrudeGeometry(shapeOf(outer, holes), { depth: height, bevelEnabled: false, curveSegments: 1 }) : new THREE.ShapeGeometry(shapeOf(outer, holes), 1);
    } catch (e) { return null; }
    geo.applyMatrix4(planMatrix(z0));
    return geo;
  }
  function tint(geo, color) {
    const n = geo.getAttribute('position').count, arr = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { arr[3 * i] = color.r; arr[3 * i + 1] = color.g; arr[3 * i + 2] = color.b; }
    geo.setAttribute('color', new THREE.BufferAttribute(arr, 3));
    return geo;
  }
  function mergedMesh(geos, { roughness = 0.95, order = 0, opacity = 1, pick = null } = {}) {
    const list = geos.filter(Boolean).map((g) => (g.index ? g.toNonIndexed() : g));
    if (!list.length) return null;
    for (const g of list) if (g.getAttribute('uv')) g.deleteAttribute('uv');
    const geo = list.length === 1 ? list[0] : BufferGeometryUtils.mergeGeometries(list, false);
    if (!geo) return null;
    if (list.length > 1) list.forEach((g) => g.dispose());
    geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, vertexColors: true, roughness, metalness: 0, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1, transparent: opacity < 1, opacity });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.userData.model = true; mesh.userData.ownMat = true; mesh.renderOrder = order;
    if (pick) mesh.userData.pick = pick;
    return mesh;
  }

  const polyRings = (mp) => (mp || []).filter((p) => p && p.outer && p.outer.length >= 3);

  /** Diagonal hatch lines inside a ring: sampled so any simple polygon works. → plan segments [[a, b], …] */
  function hatch(ring, spacing = 2.4, step = 0.6) {
    const xs = ring.map((p) => p[0]), ys = ring.map((p) => p[1]);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    const out = [];
    const span = (maxX - minX) + (maxY - minY);
    for (let k = -(maxY - minY); k <= (maxX - minX); k += spacing) {
      let start = null, prev = null;
      for (let t = 0; t <= span; t += step) {
        const x = minX + k + t, y = minY + t * 1;
        const inside = x >= minX - 1e-9 && x <= maxX + 1e-9 && y >= minY - 1e-9 && y <= maxY + 1e-9 && pointInRing(x, y, ring);
        if (inside) { if (!start) start = [x, y]; prev = [x, y]; } else if (start) { if (prev && Math.hypot(prev[0] - start[0], prev[1] - start[1]) > 0.4) out.push([start, prev]); start = null; prev = null; }
      }
      if (start && prev && Math.hypot(prev[0] - start[0], prev[1] - start[1]) > 0.4) out.push([start, prev]);
    }
    return out;
  }

  /** Stair treads across the long side of the ring's bounding box. */
  function treads(ring, tread = 1.0) {
    const xs = ring.map((p) => p[0]), ys = ring.map((p) => p[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const out = [];
    if ((x1 - x0) >= (y1 - y0)) { for (let x = x0 + tread; x < x1 - 0.2; x += tread) out.push([[x, y0], [x, y1]]); }
    else { for (let y = y0 + tread; y < y1 - 0.2; y += tread) out.push([[x0, y], [x1, y]]); }
    return out;
  }
  const cross = (ring) => {
    const xs = ring.map((p) => p[0]), ys = ring.map((p) => p[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    return [[[x0, y0], [x1, y1]], [[x0, y1], [x1, y0]]];
  };

  /** Context rings: the plates of the other level groups as a faint outline. */
  function contextObjects(D, state, opts = {}) {
    const out = [];
    if (!state.view.context || !D.scene) return out;
    if (!opts.massing) {        // with the massing drawn, the other level groups are solids and the faint outlines would only repeat them
      const pos = [];
      for (const rings of D.scene.contextRings || []) for (const r of rings) ringSegs(pos, r, 0.02);
      const f = fat(pos, '#8a949f', 1, { opacity: 0.55, order: 3 });
      if (f) out.push(f);
    }
    // site neighbors (a ghost)
    const geos = [];
    for (const p of ProjectUI.contextPolys()) {
      if (!p.outer || p.outer.length < 3) continue;
      const g = slabGeo(p.outer, p.holes, 0, Math.min(120, Math.max(8, num(p.height, 30))));
      if (g) geos.push(g);
    }
    const list = geos.map((g) => (g.index ? g.toNonIndexed() : g));
    if (list.length) {
      for (const g of list) if (g.getAttribute('uv')) g.deleteAttribute('uv');
      const merged = list.length === 1 ? list[0] : BufferGeometryUtils.mergeGeometries(list, false);
      if (merged) {
        if (list.length > 1) list.forEach((g) => g.dispose());
        merged.computeVertexNormals();
        const mesh = new THREE.Mesh(merged, new THREE.MeshStandardMaterial({ color: col('#9aa3ad'), roughness: 0.95, metalness: 0, transparent: true, opacity: 0.22, depthWrite: false }));
        mesh.userData.model = true; mesh.userData.ownMat = true; mesh.userData.context = true; mesh.renderOrder = 4;
        out.push(mesh);
      }
    }
    return out;
  }

  /** One level → model meshes and overlay lines and labels. `stack` = true draws at the level's z and the full floor height. */
  function levelObjects(L, state, stack, model, overlay) {
    const diagram = state.view.style === 'diagram';
    const z0 = stack ? L.z : 0;
    const slab = stack ? Math.max(1, L.ftf - 1) : CONFIG.slabHeight;
    const modelC = css('--scene-model', '#f6f6f3');
    const lineHex = getComputedStyle(document.documentElement).getPropertyValue('--scene-edge').trim() || CONFIG.lineColor;
    const top = z0 + slab + 0.08;

    // plate slab (thin, under everything)
    const plateGeos = [];
    for (const p of polyRings(L.plate)) { const g = slabGeo(p.outer, p.holes, z0 - 0.5, 0.5); if (g) plateGeos.push(tint(g, modelC)); }
    const pm = mergedMesh(plateGeos); if (pm) { pm.userData.plate = true; model.push(pm); }

    // corridor
    const corGeos = [];
    for (const p of polyRings(L.corridor)) { const g = slabGeo(p.outer, p.holes, z0, 0.1); if (g) corGeos.push(tint(g, col(CONFIG.corridorColor))); }
    const cm = mergedMesh(corGeos); if (cm) { cm.userData.corridor = true; model.push(cm); }

    // core, stairs, elevators, support, pockets
    const blockGeos = [];
    const addBlock = (ring, hex, h) => { if (!ring || ring.length < 3) return; const g = slabGeo(ring, [], z0, h); if (g) blockGeos.push(tint(g, col(hex))); };
    if (L.core) addBlock(L.core, CONFIG.coreColor, slab);
    for (const s of L.stairs) addBlock(s.outer, CONFIG.stairColor, slab);
    for (const e of L.elevators) addBlock(e.outer, CONFIG.elevColor, slab);
    for (const b of L.support) addBlock(b.outer, b.kind === 'pocket' || b.kind === 'remainder' ? CONFIG.pocketColor : CONFIG.supportColor, slab * 0.8);
    const bm = mergedMesh(blockGeos); if (bm) { bm.userData.blocks = true; model.push(bm); }

    // units
    const unitGeos = [];
    for (const u of L.units) {
      const g = slabGeo(u.outer, [], z0, slab);
      if (!g) continue;
      unitGeos.push(tint(g, diagram ? col(u.color || '#cfd6dd') : modelC));
    }
    const um = mergedMesh(unitGeos, { roughness: 0.9 }); if (um) { um.userData.units = true; model.push(um); }

    // lines
    const dem = [], outl = [], walls = [], det = [];
    for (const u of L.units) {
      ringSegs(outl, u.outer, top);
      for (const ln of u.demising || []) lineSeg(dem, ln[0], ln[1], top + 0.02);
    }
    if (state.view.walls) for (const ln of L.wallLines || []) lineSeg(walls, ln[0], ln[1], top + 0.02);
    for (const p of polyRings(L.plate)) { ringSegs(det, p.outer, top); for (const h2 of p.holes || []) ringSegs(det, h2, top); }
    for (const p of polyRings(L.corridor)) { ringSegs(det, p.outer, top); for (const h2 of p.holes || []) ringSegs(det, h2, top); }
    const blockRings = [L.core, ...L.stairs.map((s) => s.outer), ...L.elevators.map((e) => e.outer), ...L.support.map((b) => b.outer)].filter((r) => r && r.length >= 3);
    for (const r of blockRings) ringSegs(det, r, top);
    const hat = [], tr = [], xs = [];
    for (const b of L.support) for (const [a, c] of hatch(b.outer)) lineSeg(hat, a, c, top + 0.01);
    for (const s of L.stairs) for (const [a, c] of treads(s.outer)) lineSeg(tr, a, c, top + 0.01);
    for (const e of L.elevators) for (const [a, c] of cross(e.outer)) lineSeg(xs, a, c, top + 0.01);
    const L1 = [fat(det, lineHex, 1.2, { order: 5, opacity: 0.8 }), fat(outl, lineHex, 1, { order: 5, opacity: 0.55 }), fat(dem, lineHex, 1.6, { order: 6 }),
      fat(walls, lineHex, 1, { order: 6, dashed: true, dash: 1.5, gap: 1, opacity: 0.8 }), fat(hat, lineHex, 0.8, { order: 5, opacity: 0.4 }),
      fat(tr, lineHex, 0.8, { order: 5, opacity: 0.5 }), fat(xs, lineHex, 1, { order: 5, opacity: 0.7 })];
    for (const o of L1) if (o) { o.userData.level = L.index; overlay.push(o); }

    if (!L.editing && stack) return;
    // flagged (red) and locked (amber) outlines
    const flag = [], lock = [];
    for (const u of L.units) {
      if (u.flagged) ringSegs(flag, u.outer, top + 0.04);
      if (u.locked) ringSegs(lock, u.outer, top + 0.05);
    }
    const f1 = fat(flag, CONFIG.flagColor, 2.6, { order: 8 }), f2 = fat(lock, CONFIG.lockColor, 2.4, { order: 8, dashed: true, dash: 4, gap: 2 });
    for (const o of [f1, f2]) if (o) { o.userData.flags = true; overlay.push(o); }
  }

  /** The unit labels and the accessible marks of the editing level (flat text, scaled with the plan). */
  function labelObjects(D, state, overlay, atZ) {
    const L = D.scene && D.scene.levels.find((x) => x.editing);
    if (!L) return;
    const stack = !!state.view.levels3d || !!atZ;
    const z = (stack ? L.z + Math.max(1, L.ftf - 1) : CONFIG.slabHeight) + 0.2;
    const ub = D.bounds.union, unit = clamp(Math.max(ub.maxX - ub.minX, ub.maxY - ub.minY) / 300, 1, 2.2);
    const add = (text, x, y, o, tag) => {
      const lab = Overlays.label(text, x, y, z, o);
      lab.userData.plan = true; lab.userData.labelId = tag;
      overlay.push(lab);
    };
    if (state.view.labels) {
      for (const u of L.units) {
        const p = u.label || ringCentroidXY(u.outer);
        add(`${u.typeName}\n${Math.round(u.area).toLocaleString('en-US')} sf`, p[0], p[1], { height: 2.5 * unit, color: u.flagged ? CONFIG.flagColor : '#1d2733' }, `u-${u.id}`);
      }
    }
    for (const u of L.units) {
      if (!u.accessible) continue;
      const p = u.label || ringCentroidXY(u.outer);
      add('A', p[0], p[1] - 7 * unit, { height: 3 * unit, color: CONFIG.accentColor }, `a-${u.id}`);
    }
    for (const b of L.support) {
      if (b.kind === 'pocket' || b.kind === 'remainder') continue;
      const p = ringCentroidXY(b.outer);
      add(b.kind.charAt(0).toUpperCase() + b.kind.slice(1), p[0], p[1], { height: 1.9 * unit, color: '#4a535c' }, `b-${b.id}`);
    }
    for (const e of L.elevators.slice(0, 1)) { const p = ringCentroidXY(e.outer); void p; }
  }

  /** The viewer's mapper (the plan is drawn at its own elevation; no vertical exaggeration). */
  function mapper() { return { W: (x, y, e) => planToWorld(x, y, e), V: (x, y, e) => new THREE.Vector3(...planToWorld(x, y, e)) }; }

  function build(D, state, disp, opts = {}) {
    const model = [], overlay = [];
    if (!D.scene) return { model, overlay };
    const stack = !!state.view.levels3d;
    const atZ = !!opts.atZ;              // the editing level stands at its own z (inside the massing volume)
    const levels = stack ? D.scene.levels : D.scene.levels.filter((l) => l.editing);
    for (const L of levels) {
      try { levelObjects(L, state, stack || atZ, model, overlay); } catch (e) { console.error(e); }
    }
    if (opts.clean) return { model, overlay: overlay.filter((o) => !o.userData.flags) };
    try { labelObjects(D, state, overlay, atZ); } catch (e) { console.error(e); }
    return { model, overlay };
  }

  /** True when the editing level is drawn at its own z inside the massing volume: a project source, View > Massing on, a massing with levels. */
  function editingAtZ(state) {
    return !!state && state.source === 'project' && state.view.massing !== false && ProjectUI.massingSolids().length > 0;
  }

  /* ---- the project massing (the whole building as solids) -----------------------------------------------------
     Every massing level is an extrusion (plates with holes, from z to z + ftf) in the massing frame, in the model color with dark edges (the
     look of the Tower and of the site neighbors, white against their grey). Podium levels are softer (a little grey, fainter edges). The levels of
     the active group carry a slight accent (a tint and an accent ring on the top). The editing level is not in the volume: its fill stands there at its z
     (with "Levels in 3D" every filled level does). A "foot" extends the lowest levels down to the lowest ground under them.
     Each object has userData.massingKind: 'solid' (the volumes and their edges) or 'outline' (the footprint rings the Plan shows instead). */
  function massingObjects(D, state, opts = {}) {
    const out = [];
    const list = ProjectUI.massingSolids();
    if (!list.length || !D.ok) return out;
    const modelC = css('--scene-model', '#f6f6f3');
    const edgeHex = getComputedStyle(document.documentElement).getPropertyValue('--scene-edge').trim() || CONFIG.lineColor;
    const accent = col(CONFIG.accentColor);
    const active = new Set(D.group ? D.group.levels : []);
    const skip = new Set(state.view.levels3d ? D.scene.levels.map((l) => l.index) : D.editing ? [D.editing.index] : []);
