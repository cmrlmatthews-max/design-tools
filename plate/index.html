function towerPre(sc, f, setbacks) {
  if (!sc.base.length) return { mp: [], cause: "shape" };
  const sx = 1 + (sc.taperX / 100) * curveOf(f.t, sc.taperCurve);
  const sy = 1 + (sc.taperY / 100) * curveOf(f.t, sc.taperCurve);
  if (!(sx > 0 && sy > 0)) return { mp: [], cause: "taper" };
  const sb = setbackAt(setbacks, f.n);
  const key = `${sx},${sy},${sb.all},${sb.front},${sb.back},${sb.left},${sb.right}`;
  let local = sc.cache.get(key);
  if (!local) {
    // 1. taper
    let mp = sx === 1 && sy === 1 ? sc.base : mapMP(sc.base, (q) => [q[0] * sx, q[1] * sy]);
    // 2. setbacks (local frame, before rotation)
    const bb = { minX: sc.bounds.minX * sx, maxX: sc.bounds.maxX * sx, minY: sc.bounds.minY * sy, maxY: sc.bounds.maxY * sy };
    if (sb.all > 0) mp = insetMP(mp, sb.all);
    if (mp.length && sb.front > 0) mp = clipSide(mp, "front", bb.minY + sb.all + sb.front);
    if (mp.length && sb.back > 0) mp = clipSide(mp, "back", bb.maxY - sb.all - sb.back);
    if (mp.length && sb.left > 0) mp = clipSide(mp, "left", bb.minX + sb.all + sb.left);
    if (mp.length && sb.right > 0) mp = clipSide(mp, "right", bb.maxX - sb.all - sb.right);
    local = mp;
    sc.cache.set(key, local);
  }
  if (!local.length || multiPolyArea(local) <= AREA_EPS) return { mp: [], cause: "setbacks" };
  // 3. rotation
  const theta = (sc.rotation + sc.twistDeg * curveOf(twistT(sc, f.t), sc.twistCurve)) * DEG;
  // 4. translation
  const tx = sc.ox + sc.lx * f.t, ty = sc.oy + sc.ly * f.t;
  let mp = local;
  if (theta !== 0) {
    const c = Math.cos(theta), s = Math.sin(theta);
    mp = mapMP(mp, (q) => [q[0] * c - q[1] * s + tx, q[0] * s + q[1] * c + ty]);
  } else if (tx !== 0 || ty !== 0) {
    mp = mapMP(mp, (q) => [q[0] + tx, q[1] + ty]);
  } else {
    mp = cloneMP(mp);
  }
  return { mp, local, theta, tx, ty, cause: null };
}

function makeCore(state, sc, pre) {
  const core = state.core || {};
  const mode = String(core.mode || "percent").toLowerCase();
  const b = mpBounds(pre.local);
  const W = b.maxX - b.minX, D = b.maxY - b.minY;
  let cw0, cd0;
  if (mode === "percent") {
    const A = (clamp(num(core.percent, 0), 0, 100) / 100) * multiPolyArea(pre.mp);
    if (!(A > 0) || !(W > 0) || !(D > 0)) return null;
    cw0 = Math.sqrt((A * W) / D); cd0 = Math.sqrt((A * D) / W);
  } else {
    cw0 = Math.max(0, num(core.w, 0)); cd0 = Math.max(0, num(core.d, 0));
    if (!(cw0 > 0 && cd0 > 0)) return null;
  }
  // Work in the local frame (after taper and setbacks, before rotation and translation).
  let [cx, cy] = mpCentroid(pre.local);
  if (!quadInsideFast(rectQuad(cx, cy, cw0, cd0, 0), pre.local)) {
    // L, U and other concave plates: the centroid can sit outside the material. Use the
    // grid point nearest the centroid where the whole core fits (25 x 25 over the bounds).
    const G = 24, cands = [];
    for (let i = 0; i <= G; i++) for (let j = 0; j <= G; j++) {
      const x = b.minX + (W * i) / G, y = b.minY + (D * j) / G;
      cands.push([x, y, (x - cx) ** 2 + (y - cy) ** 2]);
    }
    cands.sort((p, q) => p[2] - q[2]);
    for (const [x, y] of cands) {
      if (quadInsideFast(rectQuad(x, y, cw0, cd0, 0), pre.local)) { cx = x; cy = y; break; }
    }
  }
  const c = Math.cos(pre.theta), s = Math.sin(pre.theta);
  const quad = rectQuad(cx, cy, cw0, cd0, 0).map((q) => (pre.theta === 0
    ? [q[0] + pre.tx, q[1] + pre.ty]
    : [q[0] * c - q[1] * s + pre.tx, q[0] * s + q[1] * c + pre.ty]));
  return { quad, area: cw0 * cd0 };
}

/**
 * Build every floor plate, the crown solids and the geometry warnings.
 * → { plates: Plate[], solids: Solid[], warnings: Warning[], floors }
 */
function buildPlates(state, { quality = "full" } = {}) {
  state = state || {};
  const segN = quality === "draft" ? 32 : 96;
  const warnings = [];
  const floors = floorListInternal(state, warnings);
  const lastN = floors.length ? floors[floors.length - 1].n : 0;
  const floorByN = new Map(floors.map((f) => [f.n, f]));

  const segs = (Array.isArray(state.segments) ? state.segments : []).map((s) => prepSegment(s, segN));
  const pod = state.podium && state.podium.on ? state.podium : null;
  let podiumMP = [];
  if (pod) {
    const ox = num(pod.offset && pod.offset.x, 0), oy = num(pod.offset && pod.offset.y, 0);
    podiumMP = shapeToMP(pod.shape, segN);
    if (ox !== 0 || oy !== 0) podiumMP = mapMP(podiumMP, (q) => [q[0] + ox, q[1] + oy]);
  }
  const setbacks = normSetbacks(state.setbacks);
  const carves = normCarves(state.carves, lastN);
  const cuts = normCuts(state.cuts, lastN, floorByN);

  const plates = [];
  const empty = { shape: [], taper: [], setbacks: [], carves: [], cuts: [] };
  const coreOut = [];
  let below = null;   // { mp (pre-carve), core, segmentIndex } of the floor below

  for (const f of floors) {
    let pre, core = null, cause = null;
    if (f.zone === "podium") {
      pre = cloneMP(podiumMP);
      if (!pre.length) cause = "shape";
    } else if (f.zone === "mechanical") {
      pre = below ? cloneMP(below.mp) : [];
      core = below ? below.core : null;
      if (!pre.length) cause = below && below.cause ? below.cause : "shape";
    } else {
      const sc = segs[f.segmentIndex];
      const r = towerPre(sc, f, setbacks);
      pre = r.mp; cause = r.cause;
      if (pre.length && sc.core === undefined) sc.core = makeCore(state, sc, r);
      core = sc.core || null;
    }
    below = { mp: pre, core, cause };
    if (!pre.length) { empty[cause || "shape"].push(f.n); continue; }

    // 5. carves
    let mp = pre, isVoid = false;
    const here = carves.filter((c) => f.n >= c.s && f.n <= c.e);
    if (here.some((c) => c.kind === "full")) {
      isVoid = true; mp = [];
    } else if (here.length) {
      const bb = mpBounds(pre);
      const [cx, cy] = mpCentroid(pre);
      const rects = [];
      for (const c of here) {
        let x0, x1, y0, y1;
        if (c.kind === "center") {
          x0 = cx - c.w / 2; x1 = cx + c.w / 2; y0 = cy - c.d / 2; y1 = cy + c.d / 2;
        } else {
          const m = 1;   // reach past the bounding box so no sliver is left on the edge
          if (c.corner.includes("E")) { x0 = bb.maxX - c.w; x1 = bb.maxX + m; } else { x0 = bb.minX - m; x1 = bb.minX + c.w; }
          if (c.corner.includes("N")) { y0 = bb.maxY - c.d; y1 = bb.maxY + m; } else { y0 = bb.minY - m; y1 = bb.minY + c.d; }
        }
        rects.push([[x0, y0], [x1, y0], [x1, y1], [x0, y1]]);
      }
      mp = boolOp(pre, rects, "diff");
      if (!mp.length || multiPolyArea(mp) <= AREA_EPS) { empty.carves.push(f.n); continue; }
    }

    // 6. cuts
    if (!isVoid) {
      let cutEmpty = false;
      for (const c of cuts) {
        if (f.n < c.s || f.n > c.e) continue;
        if (!c.ref) c.ref = mpBounds(pre);
        const dz = c.ze - c.zs;
        const dep = dz > 0 ? (c.depth * (f.z - c.zs)) / dz : c.depth;
        if (!(dep > 0)) continue;
        const v = c.side === "front" ? c.ref.minY + dep : c.side === "back" ? c.ref.maxY - dep
          : c.side === "left" ? c.ref.minX + dep : c.ref.maxX - dep;
        mp = clipSide(mp, c.side, v);
        if (!mp.length) { cutEmpty = true; break; }
      }
      if (cutEmpty || multiPolyArea(mp) <= AREA_EPS) { empty.cuts.push(f.n); continue; }
    }

    const area = isVoid ? 0 : multiPolyArea(mp);
    // core
    let coreArea = 0;
    const coreRect = f.zone === "podium" || !core ? null : core.quad.map((q) => [q[0], q[1]]);
    if (coreRect && !isVoid) {
      if (quadInsideFast(core.quad, mp)) {
        coreArea = core.area;
      } else {
        const inside = multiPolyArea(boolOp(mp, [core.quad], "int"));
        const outside = core.area - inside;
        if (outside > CORE_TOL) { coreOut.push(f.n); coreArea = Math.min(inside, area); }
        else coreArea = Math.min(core.area, area);
      }
    }
    plates.push({
      n: f.n, zone: f.zone, program: f.program, segmentIndex: f.segmentIndex,
      t: f.t, z: f.z, ftf: f.ftf,
      polygons: mp, area, coreArea, coreRect,
      outsideEnvelopeArea: 0,
      void: isVoid,
    });
  }

  // warnings
  const why = { shape: "the shape has no size", taper: "taper", setbacks: "setbacks", carves: "carves", cuts: "cuts" };
  for (const k of Object.keys(empty)) {
    const list = empty[k];
    if (!list.length) continue;
    const verb = list.length === 1 ? "has" : "have";
    const msg = k === "shape" ? `${groupFloors(list)} ${verb} no area: ${why[k]}.` : `${groupFloors(list)} ${verb} no area after ${why[k]}.`;
    warnings.push(warn("plate-empty", list, msg));
  }
  if (coreOut.length) {
    warnings.push(warn("core-outside", coreOut, `${groupFloors(coreOut)}: the core does not fit inside the plate.`));
  }

  // crown
  let solids = [];
  const real = plates.filter((p) => !p.void && p.area > AREA_EPS);
  if (real.length) {
    const top = real[real.length - 1];
    const topOfFloors = plates.reduce((m, p) => Math.max(m, p.z + p.ftf), 0);
    solids = buildCrown(state, top.polygons, topOfFloors, segN);
  }
  return { plates, solids, warnings, floors };
}

/* ---------------------------------------------------------------- metrics */

function siteAreaOf(state) {
  const s = state.site || {};
  if (s.shape === "none") return 0;                 // Unlimited: no site, so no site area
  if (s.shape === "polygon" && Array.isArray(s.points) && s.points.length >= 3) {
    return Math.abs(ringArea(s.points.map((p) => [+p[0], +p[1]])));
  }
  return clamp(num(s.width, 0), 0, MAX_DIM) * clamp(num(s.depth, 0), 0, MAX_DIM);
}

function factorOf(v) {
  const f = num(v, 0);
  return f > 1 ? f / 100 : Math.max(0, f);
}

/** Plan section 5: every metric, from the plate list. */
function computeMetrics(state, plates) {
  state = state || {};
  plates = plates || [];
  const progs = programsOf(state);
  let gfa = 0, top = 0, coreArea = 0, mechanicalArea = 0, netArea = 0, floorCount = 0, voidFloors = 0;
  let towerArea = 0, towerNet = 0;
  const byZone = { podium: 0, tower: 0, mechanical: 0, crown: 0 };
  const towerAreas = [];
  const efficiency = [];
  const byProgram = {};
  let floor1Area = 0;

  for (const p of plates) {
    top = Math.max(top, p.z + p.ftf);
    if (p.void || !(p.area > 0)) { voidFloors += p.void ? 1 : 0; continue; }
    const area = p.area, core = Math.min(num(p.coreArea, 0), area);
    gfa += area;
    floorCount += 1;
    byZone[p.zone] = (byZone[p.zone] || 0) + 1;
    if (p.n === 1) floor1Area = area;
    efficiency.push({ n: p.n, zone: p.zone, efficiency: (area - core) / area });
    const key = p.program || p.zone;
    const bp = byProgram[key] || (byProgram[key] = { floors: 0, gross: 0, core: 0, net: 0 });
    bp.floors += 1; bp.gross += area;
    if (p.zone === "mechanical") {
      mechanicalArea += area;
    } else {
      coreArea += core; netArea += area - core;
      bp.core += core; bp.net += area - core;
    }
    if (p.zone === "tower") { towerAreas.push(area); towerArea += area; towerNet += area - core; }
  }
  for (const [k, bp] of Object.entries(byProgram)) {
    const pr = progs[k] || {};
    const unitSize = Math.max(0, num(pr.unitSize, 0));
    const unitFactor = factorOf(pr.unitFactor);
    bp.unitSize = unitSize;
    bp.unitFactor = unitFactor;
    bp.units = unitSize > 0 && unitFactor > 0 ? (bp.net * unitFactor) / unitSize : null;
    bp.unitsWhole = bp.units == null ? null : Math.floor(bp.units + 1e-9);
  }

  const crownHeight = floorCount ? crownExtra(state) : 0;
  const siteArea = siteAreaOf(state);
  const far = siteArea > 0 ? gfa / siteArea : 0;
  const t = state.targets || {};
  const check = (target, current) => (num(target, 0) > 0
    ? { target, current, diff: current - target, pct: ((current - target) / target) * 100 }
    : null);

  return {
    gfa,
    floorCount,
    voidFloors,
    levelCount: plates.length,
    floorsByZone: byZone,
    topOfFloors: top,
    crownHeight,
    totalHeight: top + crownHeight,
    plateMin: towerAreas.length ? Math.min(...towerAreas) : 0,
    plateMax: towerAreas.length ? Math.max(...towerAreas) : 0,
    plateAvg: towerAreas.length ? towerArea / towerAreas.length : 0,
    siteArea,
    hasSite: !(state.site && state.site.shape === "none"),   // false: siteArea, far and siteCoverage are 0 and mean "no site"
    far,
    floor1Area,
    siteCoverage: siteArea > 0 ? floor1Area / siteArea : 0,
    coreArea,
    mechanicalArea,
    netArea,
    efficiency,
    efficiencyAvg: towerArea > 0 ? towerNet / towerArea : 0,
    byProgram,
    target: { gfa: check(num(t.gfa, 0), gfa), far: check(num(t.far, 0), far) },
  };
}

/* ---------------------------------------------------------------- text */

/** [31,32,33,34,40] → "Floors 31–34 and 40"; [5] → "Floor 5". En dash for ranges. */
function groupFloors(numbers) {
  const nums = [...new Set((numbers || []).map((x) => Math.round(+x)).filter(Number.isFinite))].sort((a, b) => a - b);
  if (!nums.length) return "";
  const groups = [];
  for (const n of nums) {
    const g = groups[groups.length - 1];
    if (g && n === g[1] + 1) g[1] = n; else groups.push([n, n]);
  }
  const parts = groups.map(([a, b]) => (a === b ? `${a}` : `${a}–${b}`));
  const list = parts.length === 1 ? parts[0] : `${parts.slice(0, -1).join(", ")} and ${parts[parts.length - 1]}`;
  return `${nums.length === 1 ? "Floor" : "Floors"} ${list}`;
}

return { SCALE, PROGRAM_DEFAULTS, ringArea, multiPolyArea, shapeToRing, buildFloorList, buildPlates, computeMetrics, groupFloors };
})();

/* ---- src/plate/mix.js ---- */
const MixMod = (() => {
/* ==========================================================================
   mix.js — the unit mix model of the Plate Planner (plan sections 3.6, 3.10, 4)

   Contract: docs/plate-planner-technical-plan.md sections 2, 3.6, 3.10 and 4.
   Pure: no DOM, no Clipper, no mutation of inputs. Feet and square feet.

   Caution: the accessible counts are seeds for an editable table. Verify every
   count against the adopted code before use. The tool never writes "compliant".

   Rule choices where the plan leaves room:
   - effectiveTypes keeps full precision. Display layers round. A type whose
     range is empty by less than 1e-9 ft is kept with lo = hi.
   - effectiveTypes renormalizes the shares of the kept types to 1. When every
     kept share is 0 the kept types share equally.
   - weightedWidth: W is the width per unit (key), Wbay the width per bay.
     Multifamily types have 1 bay, so W = Wbay. Hotel: W = Σ share × w ÷ Σ share,
     Wbay = Σ share × w ÷ Σ share × bays (example 8.2: 14.895 and 14.150).
   - countsFor(lengthFt, types, corners): N = floor(lengthFt ÷ W) + corner units.
     Hotel callers pass the run length less the accessible key widths
     (plan 3.6 item 4). `corners` is one of: nothing; a number (corner units
     of unknown type, they only raise N); an array of type ids, one per corner
     unit; { type, count }; or a map { [typeId]: count }. Corner units count
     toward their type: when the largest-remainder count of that type is
     below the corner count, the type is raised and the largest surpluses of
     the other types give the units back, so N does not change.
   - Largest remainder: quota = share × N; the leftover units go to the
     largest remainders, ties by type order (the earlier type first).
   - scoreMix: target = the count given for the type, count = placed units,
     diff = count − target, share = placed share. `misses` lists the types
     of `types` with |diff| > 1 (plan 3.12, mix-miss). A placed type that is not in `types`
     gets a trailing row and is never a miss.
   - requiredAccessible: the hotel table row is the first row whose max keys
     is at least the building count. Above the last row the last row is used
     and the result carries beyond: true (the table ends; extend it in the panel).
   ========================================================================== */

const EPS = 1e-9;
const isNum = (v) => typeof v === "number" && Number.isFinite(v);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

function need(cond, fn, what) {
  if (!cond) throw new Error(`${fn}: ${what} is missing or not valid`);
}

/* ---------------------------------------------------------------- defaults */

const MULTIFAMILY_TYPES = [
  { id: "studio", name: "Studio",    widthMin: 20, widthMax: 24, targetArea: 525,  areaMin: 450,  areaMax: 600,  share: 0.10, color: "#9cc3e6" },
  { id: "1br",    name: "1BR",       widthMin: 24, widthMax: 28, targetArea: 725,  areaMin: 650,  areaMax: 800,  share: 0.45, color: "#4f7fd1" },
  { id: "1brden", name: "1BR + den", widthMin: 28, widthMax: 32, targetArea: 900,  areaMin: 850,  areaMax: 950,  share: 0.10, color: "#6b5fc7" },
  { id: "2br",    name: "2BR",       widthMin: 32, widthMax: 40, targetArea: 1100, areaMin: 1000, areaMax: 1200, share: 0.30, color: "#2f9e9a" },
  { id: "3br",    name: "3BR",       widthMin: 40, widthMax: 48, targetArea: 1400, areaMin: 1300, areaMax: 1500, share: 0.05, color: "#d9a22b" },
];

const HOTEL_TYPES = [
  { id: "king",  name: "King",         widthMin: 13.5, widthMax: 14.5, target: 14,   bays: 1, share: 0.60, color: "#8a63c9" },
  { id: "dq",    name: "Double queen", widthMin: 14,   widthMax: 15,   target: 14.5, bays: 1, share: 0.30, color: "#b48ad9" },
  { id: "suite", name: "Suite",        widthMin: 27,   widthMax: 29,   target: 28,   bays: 2, share: 0.05, color: "#5b3f99" },
];

/** Seeds of the editable accessible table (plan section 2). Hotel rows: [max keys, accessible, roll-in]. */
const ACCESSIBLE_DEFAULTS = {
  multifamily: { typeAShare: 0.02, minUnits: 1, over: 20 },
  hotel: [[25, 1, 0], [50, 2, 0], [75, 4, 1], [100, 5, 1], [150, 7, 2], [200, 8, 2], [300, 10, 3], [400, 12, 4]],
};

/* ---------------------------------------------------------- effectiveTypes */

/**
 * Plan 3.6 items 1 and 2: the usable width range of every type at an area depth.
 * Multifamily: lo = max(widthMin, areaMin ÷ d), hi = min(widthMax, areaMax ÷ d), w = clamp(targetArea ÷ d, lo, hi).
 * Hotel: lo = widthMin, hi = widthMax, w = target (clamped); the depth is not used.
 * → { types: [{ id, name, color, w, lo, hi, bays, share }], dropped: [{ id, name, lo, hi }] }
 *   `share` is renormalized over the kept types. A type with lo > hi drops out.
 */
function effectiveTypes(types, depth, mode = "multifamily") {
  need(Array.isArray(types), "effectiveTypes", "types");
  const hotel = mode === "hotel";
  if (!hotel) need(isNum(depth) && depth > 0, "effectiveTypes", "depth");
  const kept = [], dropped = [];
  for (const t of types) {
    need(t && t.id !== undefined, "effectiveTypes", "a type id");
    need(isNum(t.widthMin) && isNum(t.widthMax) && t.widthMin > 0, "effectiveTypes", `the widths of type "${t.id}"`);
    let lo, hi, target;
    if (hotel) {
      lo = t.widthMin; hi = t.widthMax;
      target = isNum(t.target) ? t.target : (lo + hi) / 2;
    } else {
      lo = isNum(t.areaMin) ? Math.max(t.widthMin, t.areaMin / depth) : t.widthMin;
      hi = isNum(t.areaMax) ? Math.min(t.widthMax, t.areaMax / depth) : t.widthMax;
      target = isNum(t.targetArea) ? t.targetArea / depth : (lo + hi) / 2;
    }
    const base = { id: t.id, ...(t.name !== undefined ? { name: t.name } : {}) };
    if (lo > hi + EPS) { dropped.push({ ...base, lo, hi }); continue; }
    if (lo > hi) lo = hi;
    kept.push({
      ...base, ...(t.color !== undefined ? { color: t.color } : {}),
      w: clamp(target, lo, hi), lo, hi,
      bays: isNum(t.bays) && t.bays >= 1 ? Math.round(t.bays) : 1,
      share: isNum(t.share) && t.share > 0 ? t.share : 0,
    });
  }
  const sum = kept.reduce((s, t) => s + t.share, 0);
  for (const t of kept) t.share = sum > EPS ? t.share / sum : 1 / kept.length;
  return { types: kept, dropped };
}

/* ----------------------------------------------------------- weightedWidth */

/**
 * Plan 3.6 item 3. `types` are effective types. → { W, Wbay }
 * W = Σ share × w ÷ Σ share (width per unit); Wbay = Σ share × w ÷ Σ share × bays (width per bay).
 */
function weightedWidth(types) {
  need(Array.isArray(types) && types.length > 0, "weightedWidth", "types");
  const sum = types.reduce((s, t) => s + (t.share > 0 ? t.share : 0), 0);
  const wt = (t) => (sum > EPS ? Math.max(0, t.share) / sum : 1 / types.length);
  const W = types.reduce((s, t) => s + wt(t) * t.w, 0);
  const bays = types.reduce((s, t) => s + wt(t) * (t.bays || 1), 0);
  return { W, Wbay: W / bays };
}

/* ---------------------------------------------------------------- countsFor */

function cornerSpec(corners, ids) {
  const out = { total: 0, byType: {} };
  const add = (id, n) => { out.total += n; if (id !== undefined && id !== null && ids.includes(id)) out.byType[id] = (out.byType[id] || 0) + n; };
  if (corners === undefined || corners === null) return out;
  if (isNum(corners)) { out.total = Math.max(0, Math.round(corners)); return out; }
  if (Array.isArray(corners)) {
    for (const c of corners) add(c && typeof c === "object" ? c.type : c, 1);
    return out;
  }
  if (typeof corners === "object") {
    if (isNum(corners.count)) { add(corners.type !== undefined ? corners.type : corners.id, Math.max(0, Math.round(corners.count))); return out; }
    for (const id of Object.keys(corners)) if (isNum(corners[id])) add(id, Math.max(0, Math.round(corners[id])));
    return out;
  }
  need(false, "countsFor", "corners");
  return out;
}

/**
 * Plan 3.6 items 4 and 5. → { N, counts: { [id]: n }, W }
 * lengthFt is the total run length (hotel: less the accessible key widths); `types` are effective types.
 */
function countsFor(lengthFt, types, corners) {
  need(isNum(lengthFt) && lengthFt >= 0, "countsFor", "lengthFt");
  need(Array.isArray(types) && types.length > 0, "countsFor", "types");
  const { W } = weightedWidth(types);
  need(W > 0, "countsFor", "a positive weighted width");
  const ids = types.map((t) => t.id);
  const cs = cornerSpec(corners, ids);
  const N = Math.floor(lengthFt / W + EPS) + cs.total;

  const sum = types.reduce((s, t) => s + Math.max(0, t.share), 0);
  const quota = types.map((t) => (sum > EPS ? Math.max(0, t.share) / sum : 1 / types.length) * N);
  const base = quota.map((q) => Math.floor(q + EPS));
  let left = N - base.reduce((s, v) => s + v, 0);
  const order = quota.map((q, i) => ({ i, rem: q - base[i] }))
    .sort((a, b) => (Math.abs(a.rem - b.rem) > EPS ? b.rem - a.rem : a.i - b.i));
  for (let k = 0; left > 0 && order.length; k = (k + 1) % order.length, left--) base[order[k].i]++;

  // corner units count toward their type: raise it, take the units back from the largest surpluses
  for (const id of Object.keys(cs.byType)) {
    const i = ids.indexOf(id);
    let need_ = cs.byType[id] - base[i];
    while (need_ > 0) {
      let best = -1, surplus = -Infinity;
      for (let j = 0; j < base.length; j++) {
        if (j === i || base[j] <= (cs.byType[ids[j]] || 0)) continue;
        const s = base[j] - quota[j];
        if (s >= surplus - EPS) { best = j; surplus = s; }   // ties: the later type gives
      }
      if (best < 0) break;
      base[best]--; base[i]++; need_--;
    }
  }
  const counts = {};
  ids.forEach((id, i) => { counts[id] = base[i]; });
  return { N, counts, W };
}

/* ---------------------------------------------------------------- scoreMix */

/**
 * Placed units against the target counts. units: [{ type }]; counts: { [id]: target }; types: the mix types (order and names).
 * → { byType: [{ type, count, target, share, targetShare, diff }], misses: [type] }
 */
function scoreMix(units, counts, types) {
  need(Array.isArray(units), "scoreMix", "units");
  need(Array.isArray(types), "scoreMix", "types");
  const tg = counts || {};
  const placed = {};
  for (const u of units) placed[u.type] = (placed[u.type] || 0) + 1;
  const total = units.length;
  const targetTotal = types.reduce((s, t) => s + (isNum(tg[t.id]) ? tg[t.id] : 0), 0);
  const row = (id, inList) => {
    const count = placed[id] || 0, target = inList && isNum(tg[id]) ? tg[id] : 0;
    return { type: id, count, target, share: total ? count / total : 0, targetShare: targetTotal ? target / targetTotal : 0, diff: count - target };
  };
  const byType = types.map((t) => row(t.id, true));
  const known = new Set(types.map((t) => t.id));
  for (const id of Object.keys(placed)) if (!known.has(id)) byType.push(row(id, false));
  const misses = byType.filter((r, i) => i < types.length && Math.abs(r.diff) > 1).map((r) => r.type);
  return { byType, misses };
}

/* ------------------------------------------------------ requiredAccessible */

/**
 * Plan 3.10. Multifamily → { typeA, row }. Hotel → { keys, rollIn, row, beyond }.
 * Caution: seeds for an editable table; verify against the adopted code.
 */
function requiredAccessible(state, buildingCount) {
  need(state && typeof state === "object", "requiredAccessible", "state");
  need(isNum(buildingCount) && buildingCount >= 0, "requiredAccessible", "buildingCount");
  const count = Math.round(buildingCount);
  const acc = state.accessible || {};
  if (state.mode === "hotel") {
    const table = Array.isArray(acc.hotel) && acc.hotel.length ? acc.hotel : ACCESSIBLE_DEFAULTS.hotel;
    if (count === 0) return { keys: 0, rollIn: 0, row: null, beyond: false };
    const rows = table.slice().sort((a, b) => a[0] - b[0]);
    let hit = rows.find((r) => count <= r[0]);
    const beyond = !hit;
    if (!hit) hit = rows[rows.length - 1];
    return { keys: hit[1], rollIn: hit[2], row: hit.slice(), beyond };
  }
  const row = { ...ACCESSIBLE_DEFAULTS.multifamily, ...(acc.multifamily || {}) };
  const typeA = count > row.over ? Math.max(row.minUnits, Math.ceil(row.typeAShare * count - EPS)) : 0;
  return { typeA, row };
}

return { MULTIFAMILY_TYPES, HOTEL_TYPES, ACCESSIBLE_DEFAULTS, effectiveTypes, weightedWidth, countsFor, scoreMix, requiredAccessible };
})();

/* ---- src/plate/levels.js ---- */
const LevelsMod = (() => {
/* ==========================================================================
   levels.js — levels, level groups, and the drawn plate (plan sections 3.1, 4)

   Contract: docs/plate-planner-technical-plan.md sections 2, 3.1 and 4.
   Pure: no DOM, no Clipper, no mutation of inputs. Feet. Plan (x, y): x = east, y = north.

   Rule choices where the plan leaves room:
   - levelsFrom(state, project) reads the project from any of: the project
     document ({ sections: { massing: { derived } } }), a massing section
     ({ derived }), or the massing derived itself ({ levels }).
   - A drawn level has index 1, zone "typical", z 0, ftf 10, program "residential"
     (hotel mode: "hotel"), the typed core as a ring, the typed corridor spine
     (corridor.spine, else []) and no seeds.
   - Project levels keep the massing order (the Mid-Rise lists podium, bars, decks;
     `index` is an id, not an elevation). They are skipped when the zone is deck,
     crown or mechanical, when `plates` has no ring of 3 points or more, and for
     zone podium unless state.levels.showPodium.
   - Group key: FNV-1a (32 bit, 8 hex digits) over the JSON of the level's zone,
     plate rings, core ring, seed rings and spines. The plan names rings, core and seeds;
     the zone and the spines are added so a podium never merges with a bar of
     the same footprint and a fill never copies across different corridors.
     Rings are rounded to 0.01 ft, made counter-clockwise, and start at the vertex
     with the smallest x, then the smallest y. Pieces and seeds are sorted.
   - Group id "g" + key. Groups sort by the elevation of their lowest level, then index.
     Inside a group the levels sort the same way; `first` is the lowest one, the level the tool fills.
   - Group label: "Levels 7–22 (16 floors)", "Level 4 (1 floor)", "Levels 2, 4–6 (4 floors)".
   - plateFromState: shapes through shapeToRing (centered on the bounding box,
     L along the south and west, U open to the north); O = rect minus a centered
     court; polygon points are kept as given, counter-clockwise. Rings are cleaned
     with cleanRing2 and rounded to 0.001 ft. Outer rings run counter-clockwise, holes clockwise.
   ========================================================================== */

const { shapeToRing } = TowerGeo;
const { cleanRing2 } = SkFmt;

const isNum = (v) => typeof v === "number" && Number.isFinite(v);
const r2 = (v) => Math.round(v * 100) / 100 + 0;
const r3 = (v) => Math.round(v * 1000) / 1000 + 0;
const isPair = (p) => Array.isArray(p) && p.length >= 2 && isNum(p[0]) && isNum(p[1]);

function need(cond, fn, what) {
  if (!cond) throw new Error(`${fn}: ${what} is missing or not valid`);
}

const SKIP_ZONES = new Set(["deck", "crown", "mechanical"]);

/* ------------------------------------------------------------ plateFromState */

const roundRing = (ring) => ring.map((p) => [r3(p[0]), r3(p[1])]);

/** The drawn plate (plan section 2, `plate`) → MultiPoly [{ outer, holes }]. Throws when the shape has no area. */
function plateFromState(plateState) {
  need(plateState && typeof plateState === "object", "plateFromState", "plate");
  const p = plateState;
  const shape = String(p.shape || "rect").toLowerCase();
  const segments = isNum(p.segments) ? Math.max(8, Math.round(p.segments)) : 64;
  const w = isNum(p.w) ? p.w : 0, d = isNum(p.d) ? p.d : 0;
  let outer, holes = [];
  switch (shape) {
    case "circle":
      outer = shapeToRing({ type: "circle", w: w > 0 ? w : d }, { segments });
      break;
    case "l":
      outer = shapeToRing({ type: "l", w, d, arm: p.arm }, { segments });
      break;
    case "u":
      outer = shapeToRing({ type: "u", w, d, arm: p.arm }, { segments });
      break;
    case "o": {
      outer = shapeToRing({ type: "rect", w, d }, { segments });
      const cw = isNum(p.courtW) ? p.courtW : 0, cd = isNum(p.courtD) ? p.courtD : 0;
      need(cw > 0 && cd > 0, "plateFromState", "the court size (courtW and courtD)");
      if (!(cw < w && cd < d)) throw new Error(`plateFromState: the court ${cw} × ${cd} ft must be smaller than the plate ${w} × ${d} ft`);
      const hole = shapeToRing({ type: "rect", w: cw, d: cd }, { segments });
      holes = [hole];
      break;
    }
    case "polygon":
      outer = shapeToRing({ type: "polygon", points: (Array.isArray(p.points) ? p.points : []).filter(isPair) }, { segments });
      break;
    case "rect":
      outer = shapeToRing({ type: "rect", w, d }, { segments });
      break;

  }

  if (!o) throw new Error(`plateFromState: the ${shape} plate has no area`);

/* ---------------------------------------------------------------- levelsFrom */

function rectRing(rect) {
  const [x0, y0, x1, y1] = rect;
  const a = Math.min(x0, x1), b = Math.min(y0, y1), c = Math.max(x0, x1), e = Math.max(y0, y1);
  return [[a, b], [c, b], [c, e], [a, e]];
}

const clone = (o) => JSON.parse(JSON.stringify(o));

function massingLevels(project) {
  if (!project || typeof project !== "object") return null;
  const sec = project.sections && project.sections.massing ? project.sections.massing : project;
  const derived = sec && sec.derived ? sec.derived : sec;
  return derived && Array.isArray(derived.levels) ? derived.levels : null;

const hasArea = (mp) => Array.isArray(mp) && mp.some((pc) => pc && Array.isArray(pc.outer) && pc.outer.length >= 3);

/**
 * Plan 3.1. → [{ index, name, zone, z, ftf, program, plate, core, spines, seeds }]
 * Drawn source: one level from state.plate. Project source: the fillable levels of the massing.
 */
function levelsFrom(state, project) {
  need(state && typeof state === "object", "levelsFrom", "state");
  if (state.source === "project") {
    const list = massingLevels(project);
    need(list, "levelsFrom", "the project massing levels (sections.massing.derived.levels)");
    const showPodium = !!(state.levels && state.levels.showPodium);
    const out = [];
    for (const l of list) {
      if (!l || SKIP_ZONES.has(l.zone)) continue;
      if (l.zone === "podium" && !showPodium) continue;
      if (!hasArea(l.plates)) continue;
      out.push({
        index: l.index,
        name: l.name !== undefined ? l.name : `Level ${l.index}`,
        zone: l.zone,
        z: isNum(l.z) ? l.z : 0,
        ftf: isNum(l.ftf) ? l.ftf : 10,
        program: l.program !== undefined ? l.program : "residential",
        plate: clone(l.plates),
        core: Array.isArray(l.core) && l.core.length >= 3 ? clone(l.core) : null,
        spines: Array.isArray(l.spines) ? clone(l.spines) : [],
        seeds: Array.isArray(l.seeds) ? clone(l.seeds) : [],
      });
    }
    return out;
  }
  need(state.plate, "levelsFrom", "state.plate");
  const rect = state.core && Array.isArray(state.core.rect) && state.core.rect.length === 4 && state.core.rect.every(isNum) ? state.core.rect : null;
  const spine = state.corridor && Array.isArray(state.corridor.spine) ? state.corridor.spine : [];
  return [{
    index: 1, name: "Level 1", zone: "typical", z: 0, ftf: 10,
    program: state.mode === "hotel" ? "hotel" : "residential",
    plate: plateFromState(state.plate),
    core: rect ? rectRing(rect) : null,
    spines: clone(spine),
    seeds: [],
  }];
}

/* --------------------------------------------------------------- groupLevels */

const area2 = (ring) => {
  let a = 0;
  for (let i = 0; i < ring.length; i++) { const p = ring[i], q = ring[(i + 1) % ring.length]; a += p[0] * q[1] - q[0] * p[1]; }
  return a / 2;
};

/** A ring in a form that is equal for equal shapes: rounded to 0.01 ft, counter-clockwise, starting at the smallest x then y. */
function canonRing(ring) {
  let pts = (Array.isArray(ring) ? ring : []).filter(isPair).map((p) => [r2(p[0]), r2(p[1])]);
  pts = pts.filter((p, i) => !i || p[0] !== pts[i - 1][0] || p[1] !== pts[i - 1][1]);
  if (pts.length > 1 && pts[0][0] === pts[pts.length - 1][0] && pts[0][1] === pts[pts.length - 1][1]) pts.pop();
  if (pts.length >= 3 && area2(pts) < 0) pts.reverse();
  let s = 0;
  for (let i = 1; i < pts.length; i++) if (pts[i][0] < pts[s][0] || (pts[i][0] === pts[s][0] && pts[i][1] < pts[s][1])) s = i;
  return pts.slice(s).concat(pts.slice(0, s));
}

const sortedJson = (list) => list.map((x) => JSON.stringify(x)).sort();

function levelKeyText(l) {
  const pieces = (Array.isArray(l.plate) ? l.plate : []).map((pc) => ({ o: canonRing(pc.outer), h: sortedJson((pc.holes || []).map(canonRing)) }));
  const seeds = (Array.isArray(l.seeds) ? l.seeds : []).map((s) => ({ k: s.kind, r: canonRing(s.outer) }));
  const spines = (Array.isArray(l.spines) ? l.spines : []).map((s) => (Array.isArray(s) ? s.filter(isPair).map((p) => [r2(p[0]), r2(p[1])]) : []));
  return JSON.stringify({ zone: l.zone || "", plate: sortedJson(pieces), core: l.core ? canonRing(l.core) : null, seeds: sortedJson(seeds), spines: sortedJson(spines) });
}

function fnv1a(text) {
  let h = 0x811c9dc5;
  for (let i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h.toString(16).padStart(8, "0");
}

function rangeLabel(indices) {
  const nums = [...new Set(indices)].sort((a, b) => a - b);
  const parts = [];
  for (let i = 0; i < nums.length;) {
    let j = i;
    while (j + 1 < nums.length && nums[j + 1] === nums[j] + 1) j++;
    parts.push(j > i ? `${nums[i]}–${nums[j]}` : `${nums[i]}`);
    i = j + 1;
  }
  return parts.join(", ");
}

/**
 * Plan 3.1: levels with the same key form one group; the tool fills the lowest and copies the result.
 * → [{ id, key, levels: [index], first, floors, label }]
 */
function groupLevels(levels) {
  need(Array.isArray(levels), "groupLevels", "levels");
  const byText = new Map();
  for (const l of levels) {
    const text = levelKeyText(l);
    if (!byText.has(text)) byText.set(text, []);
    byText.get(text).push(l);
  }
  const order = (a, b) => (a.z - b.z) || (a.index - b.index);
  const used = new Set();
  const groups = [...byText.values()].map((list) => {
    list.sort(order);
    return list;
  }).sort((a, b) => order(a[0], b[0]));
  return groups.map((list) => {
    const hash = fnv1a(levelKeyText(list[0]));
    let key = hash;
    for (let n = 2; used.has(key); n++) key = `${hash}${n}`;   // a hash clash between different keys
    used.add(key);
    const indices = list.map((l) => l.index);
    const floors = list.length;
    const label = `${floors === 1 ? "Level" : "Levels"} ${rangeLabel(indices)} (${floors} ${floors === 1 ? "floor" : "floors"})`;
    return { id: `g${key}`, key, levels: indices, first: indices[0], floors, label };
  });
}

return { plateFromState, levelsFrom, groupLevels };
})();

const CorridorMod = (() => {
/* ==========================================================================
   plate/corridor.js — corridor spine, corridor polygon, stairs, corridor graph
   (docs/plate-planner-technical-plan.md sections 3.2, 3.3, 3.4, 3.11 and 4)

   spineFor(plate, level, state)                 → { kind, spine: [[[x,y],[x,y]],…], width, core, warnings }
   corridorPolygon(spine, width, plate)          → MultiPoly (clear corridor, clipped to the plate)

   corridorGraph(spine, stairs, units, opts)     → { lengthFt, stairPathFt, deadEnds: [{ stairId, ft }], doors, nodes, edges, reach(fromPoint, maxFt) }

   Clipper: globalThis.ClipperLib at SCALE 1000 (0.001 ft). Feet; plan (x, y): x = east, y = north.
   MultiPoly = [{ outer: Ring, holes: [Ring] }], outer counter-clockwise, holes clockwise.

   Rule choices where the plan leaves room:
   - Point corridor: the spine is the ring at core + width ÷ 2, so the clear corridor runs from the core face
     to core + width (section 8.5: corridor outer square ±20.67 for a ±15 core). Section 3.2 also names the
     wall; the section 8 numbers decide (the wall belongs to the units, and there are no units on the core side).
   - Kind "auto": point when the level has a core and no spines (massing or state), else bar.
   - Bar spine without massing spines: a four-corner rectangle takes its long axis through the centroid. Other
     plates look for arms: two facing parallel edges whose band lies inside the plate and is longer than it is deep;
     the arm centerlines extend to the crossing of the next centerline (L, U, O). With no arm, the long axis of the
     minimum-area bounding rectangle through the centroid, clipped to the plate (circles, odd polygons).
   - Massing and typed spines: pieces that share an end point and run straight merge (0.5 degrees).
   - Auto stairs: one at each spine end that touches nothing else (bar, single). A closed spine (an O ring) has no
     ends: two stairs at the middles of its two longest pieces. Point: two stairs inside the core at the ends of its
     long axis. "auto" with massing stair seeds uses the seeds (plan section 7).
   - Stair door: the middle of the stair edge that has clear corridor just outside it; with two such edges, the one
     nearer the plate centroid; with none, the middle of the edge nearest the corridor.
   - Graph: segments split at crossings, junctions, stair-face crossings and door projections. Stair door path =
     the longest of the shortest door-to-door paths. Dead end = for every spine end, the corridor length (spine
     outside stair blocks) to the nearest node that lies on a door-to-door path or is a door. lengthFt = clear
     corridor area ÷ width when opts.corridor and opts.width are given, else the spine length outside stairs.
   - reach(fromPoint, maxFt) → { count, ids, ft: [{ id, ft }] } over the `units` passed in (unit.door or the unit's

const { cleanRing2 } = SkFmt;

const SCALE = 1000;
const EPS = 1e-9;
const isNum = (v) => typeof v === "number" && Number.isFinite(v);
const r3 = (v) => { const r = Math.round(v * 1000) / 1000; return r === 0 ? 0 : r; };
const isPt = (p) => Array.isArray(p) && p.length >= 2 && isNum(p[0]) && isNum(p[1]);
const need = (v, fn, name) => { if (v === undefined || v === null) throw new Error(`${fn}: missing input "${name}".`); return v; };

/* ======================================================================= geometry */

function clipper(fn) {
  const C = globalThis.ClipperLib;
  if (!C) throw new Error(`${fn || "plate"}: ClipperLib is not loaded (globalThis.ClipperLib).`);
  return C;
}

function ringArea(ring) {
  let a = 0;
  for (let i = 0, n = ring.length; i < n; i++) { const p = ring[i], q = ring[(i + 1) % n]; a += p[0] * q[1] - q[0] * p[1]; }
  return a / 2;
}

/** Any of: MultiPoly, one { outer, holes }, a list of rings, one ring → MultiPoly (orientation fixed, nothing else changed). */
function asMP(x) {
  if (!x) return [];
  if (!Array.isArray(x)) return x.outer ? [{ outer: orient(x.outer, false), holes: (x.holes || []).map((h) => orient(h, true)) }] : [];
  if (!x.length) return [];
  if (x[0] && x[0].outer) return x.filter((p) => p && Array.isArray(p.outer) && p.outer.length >= 3).map((p) => ({ outer: orient(p.outer, false), holes: (p.holes || []).filter((h) => h && h.length >= 3).map((h) => orient(h, true)) }));
  if (isPt(x[0])) return x.length >= 3 ? [{ outer: orient(x, false), holes: [] }] : [];
  return x.filter((r) => Array.isArray(r) && r.length >= 3 && isPt(r[0])).map((r) => ({ outer: orient(r, false), holes: [] }));
}

function orient(ring, hole) {
  const pts = ring.filter(isPt).map((p) => [p[0], p[1]]);
  const a = ringArea(pts);
  if ((a > 0) === !!hole) pts.reverse();
  return pts;
}

const toPath = (ring) => ring.map((p) => ({ X: Math.round(p[0] * SCALE), Y: Math.round(p[1] * SCALE) }));
const fromPath = (path) => path.map((p) => [p.X / SCALE, p.Y / SCALE]);
function pathsOf(mp) {
  const out = [];
  for (const pc of asMP(mp)) { out.push(toPath(pc.outer)); for (const h of pc.holes) out.push(toPath(h)); }
  return out;
}

/** PolyTree → MultiPoly with clean rings (0.001 ft, collinear points dropped, slivers under 0.25 sf dropped). */
function fromTree(tree) {
  const out = [];
  const visit = (node) => {
    if (!node.IsHole()) {
      const outer = cleanRing2(fromPath(node.Contour()));
      const holes = [];
      for (const ch of node.Childs()) { const h = cleanRing2(fromPath(ch.Contour()), { hole: true }); if (h) holes.push(h); }
      if (outer) out.push({ outer, holes });
    }
    for (const ch of node.Childs()) for (const g of ch.Childs()) visit(g);
  };
  for (const top of tree.Childs()) visit(top);
  return out;
}

/** Boolean of two shape sets: "union" | "diff" | "int" | "xor". → MultiPoly */
function bool(op, a, b) {
  const C = clipper("bool");
  const clip = new C.Clipper();
  const pa = pathsOf(a), pb = pathsOf(b);
  if (!pa.length) return [];
  clip.AddPaths(pa, C.PolyType.ptSubject, true);
  if (pb.length) clip.AddPaths(pb, C.PolyType.ptClip, true);
  const type = { union: C.ClipType.ctUnion, diff: C.ClipType.ctDifference, int: C.ClipType.ctIntersection, xor: C.ClipType.ctXor }[op];
  if (type === undefined) throw new Error(`bool: unknown operation "${op}".`);
  if (!pb.length && op === "int") return [];
  const tree = new C.PolyTree();
  clip.Execute(type, tree, C.PolyFillType.pftNonZero, C.PolyFillType.pftNonZero);
  return fromTree(tree);
}

const union = (...sets) => bool("union", sets.flatMap((s) => asMP(s)), []);

/** Closed offset of a MultiPoly by `delta` ft (negative = inset), miter joins. */
function offsetMP(mp, delta) {
  const C = clipper("offsetMP");
  const co = new C.ClipperOffset(4, 0.25);
  co.AddPaths(pathsOf(mp), C.JoinType.jtMiter, C.EndType.etClosedPolygon);
  const tree = new C.PolyTree();
  co.Execute(tree, delta * SCALE);
  return fromTree(tree);
}

/** Open-path offset of spine segments by `half` ft, square end caps, miter joins, unioned. */
function offsetSegments(segments, half) {

    segs.push({ p, q, o });
