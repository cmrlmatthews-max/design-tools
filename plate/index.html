/* ==========================================================================
   TESTS: collapsed panel sections (docs/site-base-style-technical-plan.md section 4)
   Every panel section starts collapsed on a fresh profile. A click on a section title opens it and saves the choice in the UI prefs
   (localStorage key plate.ui.v1, prefs.sections); a rebuild of the panel from the saved prefs (a simulated reload) brings the
   choice back.
   The tests restore the UI prefs and the panel when they finish. runAllTests is extended at the end of this file.
   ========================================================================== */
async function runSectionTests() {
  const results = [];
  const eq = (a, b) => (JSON.stringify(a) === JSON.stringify(b) ? true : `got ${JSON.stringify(a)}, expected ${JSON.stringify(b)}`);
  const t = async (name, fn) => {
    let r;
    try { r = await fn(); } catch (e) { r = `threw ${e && e.message}`; }
    results.push({ name, ok: r === true, detail: r === true ? '' : String(r) });
  };
  const $ = (id) => document.getElementById(id);
  const frames = (n = 2) => new Promise((res) => { const f = () => (--n <= 0 ? res() : requestAnimationFrame(f)); requestAnimationFrame(f); });
  const savedState = Store.snapshot(), savedTab = UI.activeTab();
  const savedSections = uiPrefs.sections === undefined ? undefined : JSON.parse(JSON.stringify(uiPrefs.sections));
  Options.holdAutosave(true);
  const accs = () => [...document.querySelectorAll('#sections section.acc')];
  const openIds = () => accs().filter((a) => a.dataset.open === 'true').map((a) => a.dataset.section);
  const stored = () => { try { return JSON.parse(localStorage.getItem(UI_STORAGE_KEY)) || {}; } catch (e) { return {}; } };
  /** A fresh profile: no remembered choice. The panel is rebuilt from the prefs, as at load. */
  const freshProfile = () => { uiPrefs.sections = {}; saveUiPrefs(uiPrefs); UI.rebuildSections(); };
  /** A reload: the prefs are read again from localStorage and the panel is rebuilt from them. */
  const reload = () => { uiPrefs.sections = stored().sections; UI.rebuildSections(); };
  const firstShown = () => accs().find((a) => !a.hidden);

  try {
    await t('S1. every panel section starts collapsed on a fresh profile (and there are sections to collapse)', () => {
      freshProfile();
      const all = accs();
      const ctl = Object.keys(UI.sectionCtl);
      return eq([all.length >= 8, all.length === ctl.length, openIds(), ctl.filter((id) => UI.sectionCtl[id].isOpen())], [true, true, [], []]);
    });
    await t('S2. a collapsed section keeps its controls in the page, hidden by the style sheet (value tests still see them)', () => {
      freshProfile();
      const acc = firstShown();
      const body = acc.querySelector('.acc-body');
      const rendered = getComputedStyle(body).display !== 'none';
      return eq([acc.dataset.open, !!body.querySelector('input, button, select, textarea'), rendered], ['false', true, false]);
    });
    await t('S3. a click on a section title opens it and saves the choice under the tool UI key; a second click closes it and saves that', () => {
      freshProfile();
      const acc = firstShown(), id = acc.dataset.section;
      acc.querySelector('.acc-head').click();
      const afterOpen = [acc.dataset.open, (stored().sections || {})[id]];
      acc.querySelector('.acc-head').click();
      const afterClose = [acc.dataset.open, (stored().sections || {})[id]];
      return eq([afterOpen, afterClose], [['true', true], ['false', false]]);
    });
    await t('S4. an open section is open again after a simulated reload, and the other sections stay collapsed', () => {
      freshProfile();
      const ids = accs().filter((a) => !a.hidden).map((a) => a.dataset.section);
      const a = ids[0], b = ids[ids.length - 1];
      document.querySelector(`#sections section.acc[data-section="${a}"] .acc-head`).click();
      document.querySelector(`#sections section.acc[data-section="${b}"] .acc-head`).click();
      reload();
      return eq([new Set(openIds())].map((s) => [...s].sort()), [[a, b].sort()]);
    });
    await t('S5. a section the user closed stays closed after a reload (the saved choice wins over the default)', () => {
      freshProfile();
      const id = firstShown().dataset.section;
      const head = () => document.querySelector(`#sections section.acc[data-section="${id}"] .acc-head`);
      head().click(); reload();
      const reopened = openIds().includes(id);
      head().click(); reload();
      return eq([reopened, openIds().includes(id), (stored().sections || {})[id]], [true, false, false]);
    });
    await t('S6. the HUD and the selection card are not panel sections', () => {
      const hud = $('hud'), card = $('selection-card');
      return eq([!!hud && !hud.closest('.acc'), !card || !card.closest('.acc')], [true, true]);
    });
    await t('S7. the UI prefs key is this tool\'s own (plate.ui.v1)', () => eq(UI_STORAGE_KEY, 'plate.ui.v1'));

  } finally {
    try { const p = document.querySelector('#aiPanel'); if (p && typeof Prompts !== 'undefined' && Prompts.isOpen()) Prompts.close(); } catch (e) { /* no prompt panel */ }
    if (savedSections === undefined) delete uiPrefs.sections; else uiPrefs.sections = savedSections;
    saveUiPrefs(uiPrefs);
    UI.rebuildSections();
    Store.replace(savedState); UI.setTab(savedTab);
    Options.holdAutosave(false);
  }
  return results;
}

/* Extend runAllTests with the section tests (the other test files stay as they are). */
runAllTests = ((base) => async function runAllWithSections() {
  const r = await base();
  const g = await runSectionTests();
  const bad = g.filter((x) => !x.ok);
  r.results.push(...g);
  r.total += g.length;
  r.passed += g.length - bad.length;
  r.failed.push(...bad);
  console.log(`[tests] sections ${g.length - bad.length}/${g.length} passed`, bad.length ? JSON.stringify(bad) : '');
  return r;
})(runAllTests);

/* ==========================================================================
   Start-up and test hook
   ========================================================================== */
const TEST_MODE = /[?&]test\b/.test(location.search);
Options.init({ restore: !TEST_MODE });
UI.init();
Compare.init();
Options.syncDirty();
if (!Render.init(document.getElementById('canvasHost'))) Store.subscribe(() => UI.updateHud(Derived.get()));
Select.init();
ProjectUI.start();

const optionInfo = (o) => ({ id: o.id, name: o.name, updatedAt: o.updatedAt });
window.__plate = {
  getState: () => Store.snapshot(),
  setState: (path, value) => { Store.set(path, value, { live: false }); },
  setStateLive: (path, value) => { Store.set(path, value, { live: true }); },
  commit: () => Store.commit(),
  replaceState: (state) => { Store.replace(fillDefaults(state)); },
  getDerived: () => { const d = Derived.get(); return { ok: d.ok, hud: d.hud, warnings: d.warnings, notes: d.notes, stale: d.stale, groups: d.groups.map((g) => ({ id: g.id, label: g.label, floors: g.floors })) }; },
  getHud: () => Derived.get().hud,
  getMetrics: () => Derived.get().metrics,
  getBuilt: () => Derived.get().built,
  getScene: () => Derived.get().scene,
  getWarnings: () => Derived.get().warnings,
  loadPreset: (id) => Options.loadPreset(id),
  newDesign: (opts) => Options.newDesign(opts),            // { confirm: false } skips the unsaved-changes question (tests)
  hasUnsavedChanges: () => Options.hasUnsavedChanges(),
  listPresets: () => CONFIG.presets.map((p) => ({ id: p.id, name: p.name })),
  listOptions: () => Options.list().map(optionInfo),
  saveOption: () => Options.save(),
  duplicateOption: () => Options.duplicate(),
  loadOption: (id) => Options.loadOption(id),
  compare: (keys) => Compare.enter(keys),
  exitCompare: () => Compare.exit(),
  getCompare: () => ({ active: Compare.isActive(), names: Compare.names(), chosen: Compare.chosen(), table: Compare.isActive() ? Compare.table() : '' }),
  screenshot: (opts) => Shots.capture(opts),
  undo: () => Store.undo(),
  redo: () => Store.redo(),
  history: () => ({ depth: Store.historyDepth(), canUndo: !!Store.canUndo(), canRedo: !!Store.canRedo() }),
  setView: (id, animate = false) => Render.setView(id, animate),
  getView: () => Render.info(),
  units: Units,
  runTests: runAllTests,
  // exports
  sketchupDoc: () => FileExports.sketchupDoc(),
  sketchupDownload: (opts) => FileExports.sketchup(opts),
  roomsText: () => FileExports.roomsText(),
  roomsDownload: (opts) => FileExports.rooms(opts),
  dxfText: () => FileExports.dxfText(),
  dxfDownload: (opts) => FileExports.dxf(opts),
  notesText: () => FileExports.notesText(),
  notesDownload: (opts) => FileExports.notes(opts),
  exportJson: () => Options.exportJson(),
  importJson: (file) => Options.importFile(file),
  getDerivedSection: () => { const st = Store.snapshot(), d = Derived.get(); return PlateDerivedMod.platesDerived(st, d.built, d.metrics); },
  overlayInfo: () => Render.overlayInfo(),
  layerInfo: () => Render.layerInfo(),
  massingInfo: () => Render.massingInfo(),
  framedBox: (id) => Render.framedBox(id),
  // project file (ProjectUI; tests inject storage and navigation with projectConfigure)
  projectConfigure: (o) => ProjectUI.configure(o),
  projectReset: () => ProjectUI.reset(),
  projectOpenDoc: (doc) => ProjectUI.openDoc(doc),
  projectStatus: () => ProjectUI.status(),
  projectDoc: () => ProjectUI.doc(),
  projectInfo: () => ProjectUI.massingInfo(),
  projectUseProject: () => ProjectUI.useProject({ quiet: true }),
  projectFlush: () => { ProjectUI.markDirty(); return ProjectUI.flush(); },
  projectCreate: (name) => ProjectUI.create(name, { quiet: true }),
  projectClose: () => ProjectUI.close(),
  projectSend: (toolId) => ProjectUI.send(toolId),
  // panels, selection, editing and drawing (the same functions the clicks and the keys call)
  setTab: (id) => UI.setTab(id),
  getTab: () => UI.activeTab(),
  select: (item) => Select.select(item),
  selectUnit: (k) => Select.selectUnit(k),
  getSelection: () => Select.get(),
  clearSelection: () => Select.clear(),
  pickAt: (x, y) => Select.pickAt(x, y),                      // client px -> { kind, id } | null
  clickAt: (x, y) => Select.click(x, y),
  screenOf: (x, y, z) => Select.screenOf(x, y, z),            // plan point -> client px
  startDraw: (kind, opts) => Select.startDraw(kind, opts),
  drawing: () => Select.drawing(),
  drawTap: (cx, cy, alt) => Select.drawTap(cx, cy, alt),
  drawPoint: (x, y) => Select.drawPoint(x, y),
  finishDraw: () => Select.finishDraw(),
  cancelDraw: () => Select.cancelDraw(),
  bays: () => Select.bays(),
  bayLimits: (i) => Select.bayLimits(i),
  moveBay: (i, delta, live) => Select.moveBay(i, delta, live),
  bayScreen: (i) => Select.bayScreen(i),
  toggleLock: (k) => Select.toggleLock(k),
  locks: () => Select.locks(),
  unlockAll: () => Select.unlockAll(),
  setUnitType: (k, id) => Select.setUnitType(k, id),
  refill: () => Select.refill(),
  addBlock: (target, rect) => Select.addBlock(target, rect),
  deleteBlock: (it) => Select.deleteBlock(it),
  setBlockRect: (it, rect, live) => Select.setBlockRect(it, rect, live),
  snapPoint: (p, o) => Select.snapPoint(p, o),
};
if (TEST_MODE) {
  runAllTests().then((r) => {
    document.getElementById('toasts').textContent = '';
    const msg = r.failed.length
      ? `Tests: ${r.failed.length} of ${r.total} failed. ${r.failed.map((f) => `${f.name} (${f.detail})`).join(' | ')}`
      : `Tests: all ${r.total} passed`;
    Toast.show(msg, r.failed.length ? 'bad' : 'test-pass', 0);
  });
}
</script>
