/* ------------------------------------------------------------ stepping (section 3.7) */

/**
 * Section 3.7. Samples the existing ground every 1 ft along the axis centerline of the footprint.
 * rise = max − min (never less than the end-to-end difference). count = ceil(rise ÷ maxStep), at least 1.
 * → { count, lengths: [ft, …] equal, rise }
 */
function suggestTiers(building, existingAt, maxStep = 4) {
  const rings = ringsOfBuilding(building);
  if (!rings.length) return { count: 1, lengths: [0], rise: 0 };
  const ex = typeof existingAt === "function" ? existingAt : () => 0;
  const A = axisFrame(axisOf(building, rings));
  const pts = rings.flat();
  const ss = pts.map(A.s), ts = pts.map(A.t);
  const s0 = Math.min(...ss), s1 = Math.max(...ss), tc = (Math.min(...ts) + Math.max(...ts)) / 2;
  const Ls = s1 - s0, N = Math.max(1, Math.ceil(Ls - 1e-9));
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i <= N; i++) {
    const p = A.xy(s0 + (i / N) * Ls, tc), z = ex(p[0], p[1]);
    if (z < lo) lo = z; if (z > hi) hi = z;
  }
  const rise = r2(hi - lo);
  const step = num(maxStep, 4) > 0 ? num(maxStep, 4) : 4;
  const count = Math.max(1, Math.ceil(rise / step - 1e-9));
  return { count, lengths: Array.from({ length: count }, () => r3(Ls / count)), rise };
}

/* ------------------------------------------------------------ drives and lots (section 3.4) */

/**
 * Section 3.4. drive = { id, line, width (24), start: "existing" | number, slope (percent, 5),
 * cross (percent, 2), crown (true) }. Station s and signed offset r (positive right of travel) come
 * from the nearest centerline segment. Square ends; round joints at bends.
 * → Feature { id, kind: "drive", ring (outline, miter), rings, box, contains, z, nearest, zMin, zMax,
 *             slope (fraction), cross (fraction), start (ft), width, line }
 */
function driveFeature(drive, existingAt) {
  const dv = drive || {};
  const ex = typeof existingAt === "function" ? existingAt : () => 0;
  const line = [];
  for (const p of Array.isArray(dv.line) ? dv.line : []) {
    if (!isPt(p)) continue;
    const q = [r3(p[0]), r3(p[1])], l = line[line.length - 1];
    if (!l || Math.hypot(q[0] - l[0], q[1] - l[1]) >= 0.001) line.push(q);
  }
  const w = Math.max(0, num(dv.width, 24)), hw = w / 2;
  const slope = num(dv.slope, 5) / 100, cross = num(dv.cross, 2) / 100, crown = dv.crown !== false;
  const zs = typeof dv.start === "number" && Number.isFinite(dv.start) ? dv.start : line.length ? ex(line[0][0], line[0][1]) : 0;
  const segs = [];
  let acc = 0;
  for (let i = 0; i + 1 < line.length; i++) {
    const a = line[i], b = line[i + 1], dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
    segs.push({ a, b, ux: dx / L, uy: dy / L, L, s0: acc });
    acc += L;
  }
  const last = segs.length - 1;
  const base = { id: dv.id, kind: "drive", slope: Math.abs(slope), cross: Math.abs(cross), start: r2(zs), width: w, line };
  if (!segs.length) return { ...base, ring: [], rings: [], box: [0, 0, -1, -1], contains: () => false, z: () => zs, nearest: (x, y) => ({ x, y, d: Infinity }), zMin: zs, zMax: zs };

  const local = (x, y) => {                     // nearest segment: { s, r, t, k, d }
    let best = null;
    for (let k = 0; k < segs.length; k++) {
      const g = segs[k];
      const t = (x - g.a[0]) * g.ux + (y - g.a[1]) * g.uy;
      const tc = Math.max(0, Math.min(g.L, t));
      const cx = g.a[0] + tc * g.ux, cy = g.a[1] + tc * g.uy;
      const d = Math.hypot(x - cx, y - cy);
      if (!best || d < best.d - 1e-12) best = { k, t, tc, d, r: (x - g.a[0]) * g.uy - (y - g.a[1]) * g.ux };
    }
    return best;
  };
  const zAt = (x, y) => {
    const L = local(x, y), g = segs[L.k];
    const zc = zs + slope * (g.s0 + L.tc);
    const r = Math.abs(L.r) <= L.d + 1e-9 && L.t >= 0 && L.t <= g.L ? L.r : Math.sign(L.r || 1) * L.d;
    return crown ? zc - cross * Math.abs(r) : zc - cross * r;
  };
  const inRect = (g, k, x, y) => {
    const t = (x - g.a[0]) * g.ux + (y - g.a[1]) * g.uy, r = (x - g.a[0]) * g.uy - (y - g.a[1]) * g.ux;
    return Math.abs(r) <= hw + EPS && t >= -EPS && t <= g.L + EPS;
  };
  const contains = (x, y) => {
    for (let k = 0; k < segs.length; k++) if (inRect(segs[k], k, x, y)) return true;
    for (let k = 1; k < line.length - 1; k++) if (Math.hypot(x - line[k][0], y - line[k][1]) <= hw + EPS) return true;
    return false;
  };
  const nearest = (x, y) => {
    let best = { x, y, d: Infinity };
    for (const g of segs) {                       // nearest point of each segment rectangle
      const t = (x - g.a[0]) * g.ux + (y - g.a[1]) * g.uy, r = (x - g.a[0]) * g.uy - (y - g.a[1]) * g.ux;
      const tc = Math.max(0, Math.min(g.L, t)), rc = Math.max(-hw, Math.min(hw, r));
      const qx = g.a[0] + tc * g.ux + rc * g.uy, qy = g.a[1] + tc * g.uy - rc * g.ux;
      const d = Math.hypot(x - qx, y - qy);
      if (d < best.d) best = { x: qx, y: qy, d };
    }
    for (let k = 1; k < line.length - 1; k++) {   // joint discs
      const c = line[k], dc = Math.hypot(x - c[0], y - c[1]);
      if (dc > hw) { const d = dc - hw; if (d < best.d) best = { x: c[0] + ((x - c[0]) / dc) * hw, y: c[1] + ((y - c[1]) / dc) * hw, d }; }
    }
    return best;
  };
  // Outline: left and right offset lines with miter joins.
  const side = (sgn) => line.map((p, i) => {
    const g1 = segs[Math.max(0, i - 1)], g2 = segs[Math.min(last, i)];
    const n1 = [g1.uy * sgn, -g1.ux * sgn], n2 = [g2.uy * sgn, -g2.ux * sgn];
    const bx = n1[0] + n2[0], by = n1[1] + n2[1], bl = Math.hypot(bx, by);
    if (i === 0 || i === line.length - 1 || bl < 1e-9) { const n = i === 0 ? n2 : n1; return [r3(p[0] + hw * n[0]), r3(p[1] + hw * n[1])]; }
    const m = hw / Math.max(0.25, (bx * n2[0] + by * n2[1]) / bl);
    return [r3(p[0] + (m * bx) / bl), r3(p[1] + (m * by) / bl)];
  });
  const ring = cleanRing2(side(1).concat(side(-1).reverse())) || [];
  const box = [Infinity, Infinity, -Infinity, -Infinity];
  for (const g of segs) for (const p of [g.a, g.b]) {
    box[0] = Math.min(box[0], p[0] - hw); box[1] = Math.min(box[1], p[1] - hw);
    box[2] = Math.max(box[2], p[0] + hw); box[3] = Math.max(box[3], p[1] + hw);
  }
  const zcs = [zs, zs + slope * acc];
  const zMin = Math.min(...zcs) - Math.abs(cross) * hw, zMax = Math.max(...zcs) + (crown ? 0 : Math.abs(cross) * hw);
  return { ...base, ring, rings: ring.length ? [ring] : [], box, contains, z: zAt, nearest, zMin, zMax, length: r3(acc) };
}

/**
 * Section 3.4. lot = { id, ring, anchor: null | [x, y], start: "existing" | number, dir (degrees, the
 * uphill bearing, 0 = north, clockwise), slope (percent, 2), cross (percent, 1) }.
 * z = za + slope (p − a)·u + cross (p − a)·v, u = (sin dir, cos dir), v = (−cos dir, sin dir).
 * → Feature { id, kind: "lot", ring, rings, box, contains, z, nearest, zMin, zMax,
 *             slope (fraction), cross (fraction), anchor, start (ft) }
 */
function lotFeature(lot, existingAt) {
  const l = lot || {};
  const ex = typeof existingAt === "function" ? existingAt : () => 0;
  const ring = cleanRing2(l.ring) || [];
  const a = isPt(l.anchor) ? [l.anchor[0], l.anchor[1]] : ring.length ? centroid(ring) : [0, 0];
  const za = typeof l.start === "number" && Number.isFinite(l.start) ? l.start : ex(a[0], a[1]);
  const b = (num(l.dir, 0) * Math.PI) / 180;
  const u = [snap0(Math.sin(b)), snap0(Math.cos(b))], v = [-u[1], u[0]];
  const s = num(l.slope, 2) / 100, c = num(l.cross, 1) / 100;
  const z = (x, y) => za + s * ((x - a[0]) * u[0] + (y - a[1]) * u[1]) + c * ((x - a[0]) * v[0] + (y - a[1]) * v[1]);
  const zv = ring.map((p) => z(p[0], p[1]));
  const f = areaFeature({ id: l.id, kind: "lot", rings: ring.length ? [ring] : [], z, zMin: zv.length ? Math.min(...zv) : za, zMax: zv.length ? Math.max(...zv) : za });
  return { ...f, slope: Math.abs(s), cross: Math.abs(c), anchor: [r3(a[0]), r3(a[1])], start: r2(za) };
}

/* ------------------------------------------------------------ build (sections 3.1 to 3.7) */

function cleanLine(raw) {
  const out = [];
  for (const p of Array.isArray(raw) ? raw : []) {
    if (!isPt(p)) continue;
    const q = [r3(p[0]), r3(p[1])], l = out[out.length - 1];
    if (!l || Math.hypot(q[0] - l[0], q[1] - l[1]) >= 0.001) out.push(q);
  }
  return out;
}

function extent(rings, st) {
  const box = [Infinity, Infinity, -Infinity, -Infinity];
  const add = (p) => { if (!isPt(p)) return; box[0] = Math.min(box[0], p[0]); box[1] = Math.min(box[1], p[1]); box[2] = Math.max(box[2], p[0]); box[3] = Math.max(box[3], p[1]); };
  for (const r of rings) for (const p of r) add(p);
  for (const dv of Array.isArray(st.drives) ? st.drives : []) {
    const w = Math.max(0, num(dv && dv.width, 24)) / 2;
    for (const p of (dv && dv.line) || []) if (isPt(p)) { add([p[0] - w, p[1] - w]); add([p[0] + w, p[1] + w]); }
  }
  for (const l of Array.isArray(st.lots) ? st.lots : []) for (const p of (l && l.ring) || []) add(p);
  for (const r of Array.isArray(st.routes) ? st.routes : []) for (const p of (r && r.line) || []) add(p);
  return Number.isFinite(box[0]) ? box : null;
}

function propertyRing(st, project, grid) {
  const pr = st.property || {};
  if (pr.mode === "drawn") { const r = cleanRing2(pr.ring); if (r) return r; }
  if (st.ground && st.ground.mode === "site") {
    const sec = getSection(project, "site");
    const r = sec && sec.derived && cleanRing2(sec.derived.boundary);
    if (r) return r;
  }
  const x0 = grid.x0, y0 = grid.y0, L = (grid.n - 1) * grid.spacing;
  return [[x0, y0], [r3(x0 + L), y0], [r3(x0 + L), r3(y0 + L)], [x0, r3(y0 + L)]];
}

/**
 * The whole grading build (sections 3.1 to 3.7). The only function that reads the project.
 * quality "draft": k = 1 (earthwork and the site balance) while a handle moves.
 * → { source: "standalone" | "project", ground: "site" | "plane", grid, existingAt, surface, buildings,
 *     tiers, features, walls, conflicts, warnings, notes, property, subdivide, quality, daylight, zRange }
 *   surface  = makeSurface(...) with every wall: { at, sample, existingAt, conflicts }
 *   buildings = [{ id, source, name, outer, rings, axis, padOffset, padDepth, tiers: [tier id, …] }]
 *   tiers    = tierPads rows, flat, first-wins order
 *   features = pads (Feature, id = tier id), then drives, then lots
 *   walls    = [{ id, kind: "drawn" | "pad-step" | "auto", line, auto, accepted, heightMax, heightAvg,
 *                 length, top: [[x, y, z], …] }]
 *   warnings = [{ code, severity, where, message }]: tower-no-levels, slope-conflict, outside-site
 */
function buildGrading(state, { project = null, quality = "full" } = {}) {
  const st = state || {};
  const notes = [], warnings = [];
  const fr = footprintRings(st, project);
  notes.push(...fr.notes);
  warnings.push(...fr.warnings);
  const fps = footprints(st, project);
  const ex = existingSurface(st, project, extent(fps.flatMap((f) => f.rings), st));
  notes.push(...ex.notes);
  const grid = ex.grid, existingAt = ex.at;
  const zRange = [grid.min, grid.max];
  const kFull = Math.max(1, Math.floor(num(st.earthwork && st.earthwork.subdivide, 4)));
  const k = quality === "draft" ? 1 : kFull;
  const daylight = { on: !st.daylight || st.daylight.on !== false, fill: num(st.daylight && st.daylight.fill, 3), cut: num(st.daylight && st.daylight.cut, 2) };

  // Tiers and pads, first wins (section 3.3); pad-mode balance first.
  const tiers = [], buildings = [], prior = [];
  for (const f of fps) {
    const b = f.building || {};
    const bld = { ...b, id: f.id, source: f.source, name: f.name, rings: f.rings, outer: f.outer, axis: f.axis };
    const tp = tierPads(bld, existingAt, { balance: st.balance === "site" ? "site" : "pad", grid, subdivide: kFull, prior });
    for (const t of tp) { tiers.push(t); if (t.pads.length) prior.push(t.pads); }
    buildings.push({ id: f.id, source: f.source, name: f.name, outer: f.outer, rings: f.rings, axis: f.axis,
      padOffset: Math.max(0, num(b.padOffset, 5)), padDepth: num(b.padDepth, 1), tiers: tp.map((t) => t.id) });
  }
  const drives = (Array.isArray(st.drives) ? st.drives : []).map((d) => driveFeature(d, existingAt)).filter((d) => d.ring.length);
  const lots = (Array.isArray(st.lots) ? st.lots : []).map((l) => lotFeature(l, existingAt)).filter((l) => l.ring.length);
  const drawn = (Array.isArray(st.walls) ? st.walls : []).map((w, i) => ({ id: String((w && w.id) || `W${i + 1}`), kind: "drawn", line: cleanLine(w && w.line), auto: false, accepted: true }))
    .filter((w) => w.line.length >= 2);
  const featuresOf = () => [...tiers.map(padFeature), ...drives, ...lots];

  // Balance "site" (section 3.7): the whole surface in g(t), tiers in order, a second pass with several.
  const balancing = tiers.filter((t) => t.ffeMode === "balance" && t.pads.length);
  if (st.balance === "site" && balancing.length) {
    const kb = k;
    const h = grid.spacing / kb;
    const fill = Math.max(1e-6, daylight.fill), cut = Math.max(1e-6, daylight.cut);
    const reach = daylight.on ? (grid.max - grid.min + 2) * Math.max(fill, cut) + 1 : 0;
    const fb = featuresOf().map((f) => f.box);
    const rb = [Math.min(...fb.map((b) => b[0])) - reach, Math.min(...fb.map((b) => b[1])) - reach, Math.max(...fb.map((b) => b[2])) + reach, Math.max(...fb.map((b) => b[3])) + reach];
    const nSub = (grid.n - 1) * kb;               // sub-cells per side; cells outside the reach add 0
    const samples = [];
    const i0 = Math.max(0, Math.floor((rb[0] - grid.x0) / h)), i1 = Math.min(nSub, Math.ceil((rb[2] - grid.x0) / h));
    const j0 = Math.max(0, Math.floor((rb[1] - grid.y0) / h)), j1 = Math.min(nSub, Math.ceil((rb[3] - grid.y0) / h));
    for (let j = j0; j < j1; j++) for (let i = i0; i < i1; i++) {
      const x = grid.x0 + (i + 0.5) * h, y = grid.y0 + (j + 0.5) * h;
      samples.push([x, y, existingAt(x, y)]);
    }
    const steps = padStepWalls(tiers);
    const passes = balancing.length > 1 ? 2 : 1;
    for (let pass = 0; pass < passes; pass++) for (const t of balancing) {
      const g = (top) => {
        const feats = [...tiers.map((u) => padFeature(u === t ? { ...u, padTop: top } : u)), ...drives, ...lots];
        const surf = makeSurface(feats, [...drawn, ...steps], existingAt, daylight, { zRange });
        let sum = 0;
        for (const p of samples) sum += surf.at(p[0], p[1]) - p[2];
        return sum;
      };
      const res = balanceTier(t.pads, existingAt, t.padDepth, g);
      t.padTop = res.padTop; t.ffe = res.ffe; t.iterations += res.iterations;
    }
  }

  // Walls (section 3.6): drawn and pad-step, then auto walls on that surface, then the surface once more.
  const features = featuresOf();
  const steps = padStepWalls(tiers);
  const surface0 = makeSurface(features, [...drawn, ...steps], existingAt, daylight, { zRange });
  const property = propertyRing(st, project, grid);
  const autos = st.autoWalls && st.autoWalls.on === false ? [] : autoWalls(st, surface0, property, features);
  const allWalls = [...drawn, ...steps, ...autos];
  const surface = makeSurface(features, allWalls, existingAt, daylight, { zRange, probe: grid });
  const walls = allWalls.map((w) => ({ ...w, ...wallStats(w, surface.at) }));

  for (const c of surface.conflicts) {
    warnings.push({ code: "slope-conflict", severity: "warn", where: { x: c.x, y: c.y, a: c.a, b: c.b },
      message: `The slopes from ${c.a} and ${c.b} cannot meet near (${Math.round(c.x)}, ${Math.round(c.y)}). Add a wall or more distance.` });
  }
  for (const f of features) {
    const out = f.rings.some((r) => r.some((p) => !inRing(property, p[0], p[1])));
    if (out) warnings.push({ code: "outside-site", severity: "warn", where: { id: f.id }, message: `${f.kind === "pad" ? "Pad" : f.kind === "drive" ? "Drive" : "Lot"} ${f.id} crosses the property line.` });
  }

  return {
    source: st.source === "project" && project ? "project" : "standalone", ground: ex.source,
    grid, existingAt, surface, buildings, tiers, features, walls, conflicts: surface.conflicts, warnings, notes,
    property, subdivide: k, quality: quality === "draft" ? "draft" : "full", daylight, zRange,
  };
}

return { footprints, balanceTier, tierPads, suggestTiers, driveFeature, lotFeature, buildGrading };
})();

/* ---- src/grading/earthwork.js ---- */
const EarthMod = (() => {
/* ==========================================================================
   earthwork.js — cut, fill, and the proposed grid (Grading Sketch)

   Contract: docs/grading-sketch-technical-plan.md sections 3.8 and 4.
   Pure: no DOM, no Clipper, no mutation of inputs.

   Caution: grid earthwork compares options. It is not a quantity takeoff.
   Expect about 5 to 10 percent against a civil surface model, more where
   edges fall between samples.

   What this module reads from `built` (the buildGrading result):
   - built.grid       { spacing, n, x0, y0, nodes } with nodes row-major from
                      the south, [x, y, z] per node (the existing ground).
   - built.existingAt (x, y) => z, built.surface.at (x, y) => z.
   - built.tiers[].pad and built.features[].ring give the feature boxes for
     the skip rule. Any nesting of [x, y] pairs is read; a missing list just
     means no boxes, and then only the corner test decides.

   Rule choices where the plan leaves room:
   - `region` limits the sums to part of the site. It is one of: a function
     (x, y) => boolean on the sub-cell center, a box { minX, minY, maxX,
     maxY }, or a ring [[x, y], ...]. null means the whole grid.
   - Volumes round to 0.1 cy, areas to 0.1 sf, the balance to 0.001. The
     balance is computed from the unrounded sums.
   - A grid with fewer than 2 nodes a side gives all zeros.
   ========================================================================== */

const isNum = (v) => typeof v === "number" && Number.isFinite(v);
const r1 = (v) => Math.round(v * 10) / 10 + 0;
const r3 = (v) => Math.round(v * 1000) / 1000 + 0;

const CF_PER_CY = 27;
const UNCHANGED = 0.001;   // ft: corners closer than this count as unchanged (plan 3.8, skip rule)
const DISTURBED = 0.1;     // ft: |proposed - existing| above this is disturbed ground

function need(cond, fn, what) {
  if (!cond) throw new Error(`${fn}: ${what} is missing or not valid`);
}

function needBuilt(built, fn) {
  const g = built && built.grid;
  need(g && isNum(g.spacing) && g.spacing > 0 && Number.isInteger(g.n) && isNum(g.x0) && isNum(g.y0), fn, "built.grid");
  need(built.surface && typeof built.surface.at === "function", fn, "built.surface.at");
}

/* -------------------------------------------------------------- helpers */

/** Pushes every [x, y] pair found anywhere in `v` into `out`. */
function collectPoints(v, out) {
  if (!Array.isArray(v)) return out;
  if (v.length >= 2 && isNum(v[0]) && isNum(v[1])) { out.push(v); return out; }
  for (const item of v) collectPoints(item, out);
  return out;
}

function boxOf(points) {
  if (!points.length) return null;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of points) {
    if (p[0] < minX) minX = p[0];
    if (p[0] > maxX) maxX = p[0];
    if (p[1] < minY) minY = p[1];
    if (p[1] > maxY) maxY = p[1];
  }
  return { minX, minY, maxX, maxY };
}

/** One box per feature: every tier pad, and the ring of every drive and lot. */
function featureBoxes(built) {
  const boxes = [];
  for (const t of Array.isArray(built.tiers) ? built.tiers : []) {
    const b = boxOf(collectPoints(t && t.pad, []));
    if (b) boxes.push(b);
  }
  const feats = built.features;
  const list = Array.isArray(feats) ? feats : feats && typeof feats === "object" ? Object.values(feats).flat() : [];
  for (const f of list) {
    const b = boxOf(collectPoints(f && f.ring, []));
    if (b) boxes.push(b);
  }
  return boxes;
}

/** Flags every cell that a feature box grown by one cell touches (Uint8Array, (n-1)^2). */
function nearFlags(grid, boxes) {
  const { spacing: d, n, x0, y0 } = grid;
  const m = n - 1;
  const flags = new Uint8Array(m * m);
  for (const b of boxes) {
    // cells i with [x0 + i d, x0 + (i + 1) d] touching [minX - d, maxX + d]
    const i0 = Math.max(0, Math.floor((b.minX - d - x0) / d) - 0);
    const i1 = Math.min(m - 1, Math.ceil((b.maxX + d - x0) / d));
    const j0 = Math.max(0, Math.floor((b.minY - d - y0) / d) - 0);
    const j1 = Math.min(m - 1, Math.ceil((b.maxY + d - y0) / d));
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) flags[j * m + i] = 1;
  }
  return flags;
}

function pointInRing(x, y, ring) {
  let inside = false;
  for (let a = 0, b = ring.length - 1; a < ring.length; b = a++) {
    const [xa, ya] = ring[a], [xb, yb] = ring[b];
    if ((ya > y) !== (yb > y) && x < ((xb - xa) * (y - ya)) / (yb - ya) + xa) inside = !inside;
  }
  return inside;
}

function regionTest(region) {
  if (region == null) return null;
  if (typeof region === "function") return region;
  if (Array.isArray(region)) {
    need(region.length >= 3, "earthwork", "region ring (3 points or more)");
    return (x, y) => pointInRing(x, y, region);
  }
  need(isNum(region.minX) && isNum(region.minY) && isNum(region.maxX) && isNum(region.maxY), "earthwork", "region");
  return (x, y) => x >= region.minX && x <= region.maxX && y >= region.minY && y <= region.maxY;
}

/** Existing z at every node: the grid's own node values when it has them, else existingAt. */
function existingNodes(built) {
  const { n, spacing: d, x0, y0, nodes } = built.grid;
  const out = new Float64Array(n * n);
  const useNodes = nodes && nodes.length >= n * n * 3;
  for (let j = 0; j < n; j++) {
    for (let i = 0; i < n; i++) {
      const idx = j * n + i;
      out[idx] = useNodes ? nodes[idx * 3 + 2] : built.existingAt(x0 + i * d, y0 + j * d);
    }
  }
  return out;
}

/* ----------------------------------------------------------- proposedGrid */

/** Plan 3.8. The proposed ground at every node of the existing grid, row-major from the south.
    → Float64Array of n * n elevations. */
function proposedGrid(built) {
  needBuilt(built, "proposedGrid");
  const { n, spacing: d, x0, y0 } = built.grid;
  const at = built.surface.at;
  const out = new Float64Array(n * n);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) out[j * n + i] = at(x0 + i * d, y0 + j * d);
  return out;
}

/* -------------------------------------------------------------- earthwork */

/** Plan 3.8. Midpoint rule on k x k sub-cells per grid cell.
    → { cutCy, fillCy, netCy, bulkedNetCy, balance, disturbedArea, cellsSampled }.
    netCy = fill - cut (positive = import). bulkedNetCy = fill - cut x bulking.
    balance = min / max of cut and fill, 1 when both are 0. */
function earthwork(built, { subdivide = 4, bulking = 1, region = null } = {}) {
  needBuilt(built, "earthwork");
  need(typeof built.existingAt === "function", "earthwork", "built.existingAt");
  const k = Math.max(1, Math.floor(isNum(subdivide) ? subdivide : 4));
  const bulk = isNum(bulking) && bulking > 0 ? bulking : 1;
  const { n, spacing: d, x0, y0 } = built.grid;
  const out = { cutCy: 0, fillCy: 0, netCy: 0, bulkedNetCy: 0, balance: 1, disturbedArea: 0, cellsSampled: 0 };
  if (n < 2) return out;

  const h = d / k, area = h * h, m = n - 1;
  const inRegion = regionTest(region);
  const exist = existingNodes(built);
  const prop = proposedGrid(built);
  const near = nearFlags(built.grid, featureBoxes(built));
  const exAt = built.existingAt, prAt = built.surface.at;

  let cut = 0, fill = 0, disturbed = 0, cells = 0;
  for (let j = 0; j < m; j++) {
    for (let i = 0; i < m; i++) {
      if (!near[j * m + i]) {
        const a = j * n + i, b = a + 1, c = a + n, e = c + 1;
        const same = Math.abs(prop[a] - exist[a]) < UNCHANGED && Math.abs(prop[b] - exist[b]) < UNCHANGED
          && Math.abs(prop[c] - exist[c]) < UNCHANGED && Math.abs(prop[e] - exist[e]) < UNCHANGED;
        if (same) continue;
      }
      cells++;
      const cx0 = x0 + i * d, cy0 = y0 + j * d;
      for (let sj = 0; sj < k; sj++) {
        const y = cy0 + (sj + 0.5) * h;
        for (let si = 0; si < k; si++) {
          const x = cx0 + (si + 0.5) * h;
          if (inRegion && !inRegion(x, y)) continue;
          const diff = prAt(x, y) - exAt(x, y);
          if (diff > 0) fill += diff * area; else cut -= diff * area;
          if (Math.abs(diff) > DISTURBED) disturbed += area;
        }
      }
    }
  }

  const cutCy = cut / CF_PER_CY, fillCy = fill / CF_PER_CY;
  const hi = Math.max(cutCy, fillCy), lo = Math.min(cutCy, fillCy);
  out.cutCy = r1(cutCy);
  out.fillCy = r1(fillCy);
  out.netCy = r1(fillCy - cutCy);
  out.bulkedNetCy = r1(fillCy - cutCy * bulk);
  out.balance = hi > 0 ? r3(lo / hi) : 1;
  out.disturbedArea = r1(disturbed);
  out.cellsSampled = cells;
  return out;
}

return { proposedGrid, earthwork };
})();

/* ---- src/grading/routes.js ---- */
const RoutesMod = (() => {
/* ==========================================================================
   routes.js — running and cross slope along a drawn route (Grading Sketch)

   Contract: docs/grading-sketch-technical-plan.md sections 3.9 and 4.
   Pure: no DOM, no mutation of inputs.

   Caution: route limits come from the 2010 ADA Standards and ICC A117.1.
   The adopted code and its amendments decide. The tool reports slopes; it
   never says "compliant".

   Rule choices where the plan leaves room:
   - Samples sit every 1 ft from s = 0, and the last sample sits on the end
     of the route when the length is not a whole number of feet.
   - Running slope at s = |z(s + 5) - z(s)| / 5. When s + 5 passes the end
     the sample looks back to s - 5 (clamped to the start, so a route
     shorter than 5 ft uses its own length as the run).
   - Cross slope uses the normal of the segment the sample sits on (the
     last segment at the end of the route).
   - A slope compares to its limit with 1e-9 of room, so a 5 percent plane
     is a walk, not a ramp, in floating point.
   - A ramp-landing run is a run of consecutive ramp samples; its rise is the
     elevation difference from its first to its last sample.
   - Elevations round to 0.01 ft, plan coordinates to 0.001 ft, slopes to
     0.0001. Classes use the unrounded values.
   - Warnings are { code, severity, where, message } with where =
     { route, s, x, y }. route-fail is one per run of failing samples.
   ========================================================================== */

const isNum = (v) => typeof v === "number" && Number.isFinite(v);
const r2 = (v) => Math.round(v * 100) / 100 + 0;
const r3 = (v) => Math.round(v * 1000) / 1000 + 0;
const r4 = (v) => Math.round(v * 10000) / 10000 + 0;

const EPS = 1e-9;
const RUN = 5;        // ft: run length for the running slope
const CROSS_SPAN = 5; // ft: total width for the cross slope (2.5 ft each side)
const DEFAULT_LIMITS = { walk: 0.05, ramp: 0.0833, cross: 0.0208, rampRise: 2.5 };

function need(cond, fn, what) {
  if (!cond) throw new Error(`${fn}: ${what} is missing or not valid`);
}

/** Cumulative length at each vertex, and the total. Zero-length segments stay (they are skipped on lookup). */
function stations(line) {
  const cum = [0];
  for (let i = 1; i < line.length; i++) cum.push(cum[i - 1] + Math.hypot(line[i][0] - line[i - 1][0], line[i][1] - line[i - 1][1]));
  return { cum, length: cum[cum.length - 1] };
}

/** Point and unit direction at station s; the direction is that of the segment holding s. */
function locate(line, cum, s) {
  let seg = line.length - 2;
  for (let i = 0; i < line.length - 1; i++) {
    if (cum[i + 1] - cum[i] > 0 && s < cum[i + 1] - 1e-12) { seg = i; break; }
  }
  // the last segment with length, when s sits at the very end
  while (seg > 0 && cum[seg + 1] - cum[seg] <= 0) seg--;
  const a = line[seg], b = line[seg + 1];
  const len = cum[seg + 1] - cum[seg];
  if (len <= 0) return { x: a[0], y: a[1], dx: 1, dy: 0 };
  const t = Math.min(1, Math.max(0, (s - cum[seg]) / len));
  return { x: a[0] + (b[0] - a[0]) * t, y: a[1] + (b[1] - a[1]) * t, dx: (b[0] - a[0]) / len, dy: (b[1] - a[1]) / len };
}

/** Plan 3.9. route: { id, line, name }; surfaceAt (x, y) => z; limits: { walk, ramp, cross, rampRise }.
    → { samples: [{ s, x, y, z, running, cross, cls }], maxSlope, maxCross, kind, warnings }.
    cls is "walk", "ramp", or "fail". kind is "walk" when every sample is a walk, else "ramp". */
function routeProfile(route, surfaceAt, limits) {
  need(route && Array.isArray(route.line) && route.line.length >= 2, "routeProfile", "route.line (2 points or more)");
  need(typeof surfaceAt === "function", "routeProfile", "surfaceAt");
  const lim = { ...DEFAULT_LIMITS, ...(limits || {}) };
  const line = route.line;
  const { cum, length } = stations(line);
  const id = route.id != null ? route.id : null;

  const zAt = (s) => { const p = locate(line, cum, s); return surfaceAt(p.x, p.y); };

  const ss = [];
  for (let s = 0; s <= length + 1e-9; s += 1) ss.push(Math.min(s, length));
  if (length - ss[ss.length - 1] > 1e-6) ss.push(length);

  const samples = [];
  let maxSlope = 0, maxCross = 0;
  for (const s of ss) {
    const p = locate(line, cum, s);
    const z = surfaceAt(p.x, p.y);
    let partner = s + RUN <= length + 1e-9 ? s + RUN : Math.max(0, s - RUN);
    const span = Math.abs(partner - s);
    const running = span > 0 ? Math.abs(zAt(partner) - z) / span : 0;
    // normal: left of travel
    const nx = -p.dy, ny = p.dx;
    const half = CROSS_SPAN / 2;
    const cross = Math.abs(surfaceAt(p.x + half * nx, p.y + half * ny) - surfaceAt(p.x - half * nx, p.y - half * ny)) / CROSS_SPAN;
    let cls = running <= lim.walk + EPS ? "walk" : running <= lim.ramp + EPS ? "ramp" : "fail";
    if (cross > lim.cross + EPS) cls = "fail";
    if (running > maxSlope) maxSlope = running;
    if (cross > maxCross) maxCross = cross;
    samples.push({ s: r3(s), x: r3(p.x), y: r3(p.y), z: r2(z), running: r4(running), cross: r4(cross), cls, _z: z });
  }

  const label = route.name ? `${route.name}` : id != null ? `Route ${id}` : "Route";
  const warnings = [];

  // ramp-landing: each run of consecutive ramp samples whose rise passes rampRise
  for (let i = 0; i < samples.length; ) {
    if (samples[i].cls !== "ramp") { i++; continue; }
    let e = i;
    while (e + 1 < samples.length && samples[e + 1].cls === "ramp") e++;
    const rise = Math.abs(samples[e]._z - samples[i]._z);
    if (rise > lim.rampRise + EPS) {
      warnings.push({
        code: "ramp-landing", severity: "warn",
        where: { route: id, s: samples[i].s, x: samples[i].x, y: samples[i].y },
        message: `${label} climbs ${r2(rise)} ft on ramp slopes between stations ${samples[i].s} and ${samples[e].s} ft, above ${lim.rampRise} ft in one run. It needs a landing. Route limits come from the 2010 ADA Standards and ICC A117.1: the adopted code decides.`,
      });
    }
    i = e + 1;
  }

  // route-fail: each run of failing samples
  for (let i = 0; i < samples.length; ) {
    if (samples[i].cls !== "fail") { i++; continue; }
    let e = i, run = 0, cr = 0;
    while (e < samples.length && samples[e].cls === "fail") { run = Math.max(run, samples[e].running); cr = Math.max(cr, samples[e].cross); e++; }
    const last = samples[e - 1];
    warnings.push({
      code: "route-fail", severity: "warn",
      where: { route: id, s: samples[i].s, x: samples[i].x, y: samples[i].y },
      message: `${label} is steeper than the ramp limit from station ${samples[i].s} to ${last.s} ft (running ${(run * 100).toFixed(1)} percent, cross ${(cr * 100).toFixed(1)} percent). Limits: running ${(lim.ramp * 100).toFixed(2)} percent, cross ${(lim.cross * 100).toFixed(2)} percent. Route limits come from the 2010 ADA Standards and ICC A117.1: the adopted code decides.`,
    });
    i = e;
  }

  const out = samples.map(({ _z, ...rest }) => rest);
  const kind = out.every((q) => q.cls === "walk") ? "walk" : "ramp";
  return { samples: out, maxSlope: r4(maxSlope), maxCross: r4(maxCross), kind, warnings };
}

return { routeProfile };
})();

/* ---- src/grading/contours.js ---- */
const ContoursMod = (() => {
/* ==========================================================================
   contours.js — marching squares on the ground grid (Grading Sketch)

   Contract: docs/grading-sketch-technical-plan.md sections 3.10 and 4.
   Pure: no DOM, no mutation of inputs.

   Works on any square grid { spacing, n, x0, y0 } with values row-major from
   the south (values[j * n + i] sits at (x0 + i spacing, y0 + j spacing)).
   The 2x refinement near features (plan 3.10) is the caller's job: pass a
   half-spacing grid of proposedAt values and this runs the same way.

   Rule choices where the plan leaves room:
   - A node whose value equals the level counts as above it, so a contour
     that runs exactly through a row of nodes is one straight line.
   - A saddle cell connects its two high corners when the cell average is at
     or above the level.
   - Segments join into polylines by shared end points (0.001 ft). A closed
     contour repeats its first point at the end. Open polylines run in the
     direction the segments were found; no orientation is promised.
   - Levels are whole multiples of the interval. A level is major when
     round(z / interval) is a multiple of majorEvery. Output runs by level,
     lowest first.
   - zeroLine snaps |value| under 1e-6 to 0 first, so floating-point noise
     where proposed equals existing does not draw wandering lines.
   ========================================================================== */

const isNum = (v) => typeof v === "number" && Number.isFinite(v);
const q3 = (v) => Math.round(v * 1000) / 1000 + 0;

const MAX_LEVELS = 5000;

function need(cond, fn, what) {
  if (!cond) throw new Error(`${fn}: ${what} is missing or not valid`);
}

function needGrid(grid, values, fn) {
  need(grid && isNum(grid.spacing) && grid.spacing > 0 && Number.isInteger(grid.n) && grid.n >= 2 && isNum(grid.x0) && isNum(grid.y0), fn, "grid");
  need(values && values.length >= grid.n * grid.n, fn, "values (n * n elevations)");
}

/* Corner order: 0 SW, 1 SE, 2 NE, 3 NW. Edge order: 0 south, 1 east, 2 north, 3 west.
   Edge e joins corners e and (e + 1) % 4. */
const CASES = [
  [], [[3, 0]], [[0, 1]], [[3, 1]], [[1, 2]], null, [[0, 2]], [[3, 2]],
  [[3, 2]], [[0, 2]], null, [[1, 2]], [[3, 1]], [[0, 1]], [[3, 0]], [],
];

/** All segments of one level: [[x1, y1], [x2, y2]] with rounded ends. */
function segmentsAt(grid, v, level) {
  const { spacing: d, n, x0, y0 } = grid;
  const segs = [];
  const m = n - 1;
  for (let j = 0; j < m; j++) {
    for (let i = 0; i < m; i++) {
      const a = j * n + i;
      const z0 = v[a], z1 = v[a + 1], z2 = v[a + n + 1], z3 = v[a + n];
      const mask = (z0 >= level ? 1 : 0) | (z1 >= level ? 2 : 0) | (z2 >= level ? 4 : 0) | (z3 >= level ? 8 : 0);
      if (mask === 0 || mask === 15) continue;
      const xs = x0 + i * d, ys = y0 + j * d;
      const zs = [z0, z1, z2, z3];
      const cx = [xs, xs + d, xs + d, xs], cy = [ys, ys, ys + d, ys + d];
      const cross = (e) => {
        const p = e, r = (e + 1) % 4;
        const t = (level - zs[p]) / (zs[r] - zs[p]);
        return [q3(cx[p] + (cx[r] - cx[p]) * t), q3(cy[p] + (cy[r] - cy[p]) * t)];
      };
      let pairs = CASES[mask];
      if (pairs === null) {
        const high = (z0 + z1 + z2 + z3) / 4 >= level;
        if (mask === 5) pairs = high ? [[3, 2], [0, 1]] : [[3, 0], [1, 2]];
        else pairs = high ? [[0, 3], [1, 2]] : [[0, 1], [3, 2]];
      }
      for (const [e1, e2] of pairs) {
        const p = cross(e1), r = cross(e2);
        if (p[0] === r[0] && p[1] === r[1]) continue;
        segs.push([p, r]);
      }
    }
  }
  return segs;
}

const key = (p) => `${Math.round(p[0] * 1000)},${Math.round(p[1] * 1000)}`;

/** Joins segments into polylines by shared end points. */
function join(segs) {
  const ends = new Map();
  const add = (k, idx) => { const l = ends.get(k); if (l) l.push(idx); else ends.set(k, [idx]); };
  segs.forEach((s, idx) => { add(key(s[0]), idx); add(key(s[1]), idx); });
  const used = new Uint8Array(segs.length);
  const lines = [];

  const next = (k) => {
    const l = ends.get(k);
    if (!l) return -1;
    for (const idx of l) if (!used[idx]) return idx;
    return -1;
  };

  for (let s = 0; s < segs.length; s++) {
    if (used[s]) continue;
    used[s] = 1;
    const line = [segs[s][0], segs[s][1]];
    // grow at the tail, then at the head
    for (let side = 0; side < 2; side++) {
      for (;;) {
        const tip = side === 0 ? line[line.length - 1] : line[0];
        const idx = next(key(tip));
        if (idx < 0) break;
        used[idx] = 1;
        const [p, r] = segs[idx];
        const far = key(p) === key(tip) ? r : p;
        if (side === 0) line.push(far); else line.unshift(far);
        if (key(far) === key(side === 0 ? line[0] : line[line.length - 1])) break;   // closed
      }
    }
    lines.push(line);
  }
  return lines;
}

/** Plan 3.10. grid: { spacing, n, x0, y0 }; zValues: n * n elevations; interval: ft (> 0).
    → [{ z, major, line: [[x, y], ...] }], lowest level first. */
function contours(grid, zValues, interval, { majorEvery = 5 } = {}) {
  needGrid(grid, zValues, "contours");
  need(isNum(interval) && interval > 0, "contours", "interval");
  const nn = grid.n * grid.n;
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < nn; i++) { const z = zValues[i]; if (z < lo) lo = z; if (z > hi) hi = z; }
  if (!(hi > lo)) return [];
  const first = Math.ceil(lo / interval - 1e-9), last = Math.floor(hi / interval + 1e-9);
  need(last - first < MAX_LEVELS, "contours", "interval (too many levels)");
  const every = Number.isInteger(majorEvery) && majorEvery > 0 ? majorEvery : 5;
  const out = [];
  for (let k = first; k <= last; k++) {
    const z = q3(k * interval);
    const major = ((k % every) + every) % every === 0;
    for (const line of join(segmentsAt(grid, zValues, k * interval))) out.push({ z, major, line });
  }
  return out;
}

/** Plan 3.10. The cut and fill line: the zero contour of proposed - existing.
    diffValues: n * n differences. → [[[x, y], ...], ...] one polyline per piece. */
function zeroLine(grid, diffValues) {
  needGrid(grid, diffValues, "zeroLine");
  const nn = grid.n * grid.n;
  const v = new Float64Array(nn);
  for (let i = 0; i < nn; i++) v[i] = Math.abs(diffValues[i]) < 1e-6 ? 0 : diffValues[i];
  return join(segmentsAt(grid, v, 0));
}

return { contours, zeroLine };
})();

/* ---- src/grading/metrics.js ---- */
const GradMetricsMod = (() => {
/* ==========================================================================
   metrics.js — every row of plan 3.11 and the warning list (Grading Sketch)

   Contract: docs/grading-sketch-technical-plan.md sections 3.7, 3.11 and 4.
   Pure: no DOM, no Clipper, no mutation of inputs.

   Caution: these are design checks against editable values, not a code
   review and not a grading plan. The tool never writes "compliant". Walls,
   drive grades, lot grades, and route slopes all need the civil engineer.

   Reads `built` (the buildGrading result): grid, existingAt, surface.at,
   tiers, walls, features, conflicts, warnings, and `quality` ("draft" runs
   the earthwork at k = 1, as plan section 6 asks while a handle moves).

   Rule choices where the plan leaves room:
   - Tiers group into buildings by the id "<building>-T<k>", in tier order.
   - A tier's corners are the vertices of its `outer` ring(s). `above` =
     ffe - existingAt(corner).
   - Exposed foundation and cut face (plan 3.7): along every pad edge, every
     1 ft and at both ends, take the point 0.01 ft outside. If it belongs to any pad it is
     skipped (that edge touches another pad). Otherwise exposed = padTop -
     proposedAt, cutFace = proposedAt - padTop. Each tier keeps its maximum,
     never below 0.
   - A wall that already holds heightMax, heightAvg, and length keeps them.
     Otherwise they come from plan 3.6 (about every 1 ft at mid-stretch,
     0.01 ft each side of the line). Totals count every wall, accepted or not, and byKind splits
     drawn, pad-step, and auto.
   - wallHeightAvg is the length-weighted mean of the wall averages.
   - steepestRoute is the steepest running slope over all routes (0 when
     there are none); `routes` holds one row each.
   - outside-site: a pad, drive, or lot vertex outside the property ring.
     property.mode "site" uses the grid square.
   - slope-conflict points group into 20 ft squares: one warning each, at
     most 8.
   - Warnings are { code, severity, where, message }; where is { x, y, ... }
     or null. Build warnings (tower-no-levels and the like) pass through
     metrics.buildWarnings, as the Facade Studio does.
   - Volumes round to 0.1 cy, heights and steps to 0.01 ft, corners to 0.001.
   ========================================================================== */

const { earthwork } = EarthMod;
const { routeProfile } = RoutesMod;

const isNum = (v) => typeof v === "number" && Number.isFinite(v);
const r1 = (v) => Math.round(v * 10) / 10 + 0;
const r2 = (v) => Math.round(v * 100) / 100 + 0;
const r3 = (v) => Math.round(v * 1000) / 1000 + 0;
const r4 = (v) => Math.round(v * 10000) / 10000 + 0;

const EPS = 1e-9;
const KINDS = ["drawn", "pad-step", "auto"];
const DEFAULT_LIMITS = { walk: 0.05, ramp: 0.0833, cross: 0.0208, rampRise: 2.5, wallFlag: 4, lotMin: 0.01, lotMax: 0.05, driveMax: 0.10 };

function need(cond, fn, what) {
  if (!cond) throw new Error(`${fn}: ${what} is missing or not valid`);
}

/* -------------------------------------------------------------- geometry */

const isPair = (v) => Array.isArray(v) && v.length >= 2 && isNum(v[0]) && isNum(v[1]);

/** A ring, or a list of rings, as a list of rings. */
function rings(v) {
  if (!Array.isArray(v) || !v.length) return [];
  if (isPair(v[0])) return [v];
  return v.filter((r) => Array.isArray(r) && r.length >= 3 && isPair(r[0]));
}

function signedArea(ring) {
  let a = 0;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) a += (ring[j][0] * ring[i][1]) - (ring[i][0] * ring[j][1]);
  return a / 2;
}

function inRing(x, y, ring, tol = 1e-6) {
  let inside = false;
  for (let a = 0, b = ring.length - 1; a < ring.length; b = a++) {
    const [xa, ya] = ring[a], [xb, yb] = ring[b];
    // on the edge counts as inside
    const cr = (xb - xa) * (y - ya) - (yb - ya) * (x - xa);
    const len = Math.hypot(xb - xa, yb - ya);
    if (len > 0 && Math.abs(cr) / len <= tol && x >= Math.min(xa, xb) - tol && x <= Math.max(xa, xb) + tol && y >= Math.min(ya, yb) - tol && y <= Math.max(ya, yb) + tol) return true;
    if ((ya > y) !== (yb > y) && x < ((xb - xa) * (y - ya)) / (yb - ya) + xa) inside = !inside;
  }
  return inside;
}

const inAny = (x, y, ringList) => ringList.some((r) => inRing(x, y, r));

/* ------------------------------------------------------------------ tiers */

function parseTierId(id) {
  const m = /^(.*)-T(\d+)$/.exec(String(id));
  return m ? { building: m[1], k: Number(m[2]) } : { building: String(id), k: 1 };
}

/** Plan 3.7, per tier: corner heights above the existing ground, exposed foundation, cut face. */
function tierRows(built) {
  const tiers = Array.isArray(built.tiers) ? built.tiers : [];
  const padRings = tiers.map((t) => rings(t && t.pad));
  const allPads = padRings.flat();
  const at = built.surface.at, exAt = built.existingAt;

  const rows = tiers.map((t, idx) => {
    const { building, k } = parseTierId(t.id);
    const corners = [];
    for (const ring of rings(t.outer)) for (const [x, y] of ring) corners.push({ x: r3(x), y: r3(y), existing: r2(exAt(x, y)), above: r3(t.ffe - exAt(x, y)) });
    let exposed = 0, cutFace = 0;
    for (const ring of padRings[idx]) {
      const ccw = signedArea(ring) > 0;
      for (let i = 0; i < ring.length; i++) {
        const a = ring[i], b = ring[(i + 1) % ring.length];
        const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);
        if (len < 1e-9) continue;
        const nx = (ccw ? dy : -dy) / len, ny = (ccw ? -dx : dx) / len;   // outward
        const count = Math.max(1, Math.ceil(len / 1 - 1e-9));
        for (let c = 0; c <= count; c++) {
          const f = c / count;   // both ends included: the worst exposure of a sloping edge sits at its end
          const x = a[0] + dx * f + nx * 0.01, y = a[1] + dy * f + ny * 0.01;
          if (inAny(x, y, allPads)) continue;
          const diff = t.padTop - at(x, y);
          if (diff > exposed) exposed = diff;
          if (-diff > cutFace) cutFace = -diff;
        }
      }
    }
    const above = corners.map((c) => c.above);
    return {
      id: t.id, building, tier: k, ffe: t.ffe, padTop: t.padTop,
      existingMin: isNum(t.existingMin) ? t.existingMin : null, existingMax: isNum(t.existingMax) ? t.existingMax : null,
      step: null, corners,
      cornerMin: above.length ? Math.min(...above) : null, cornerMax: above.length ? Math.max(...above) : null,
      exposed: r2(exposed), cutFace: r2(cutFace),
    };
  });

  // steps between adjacent tiers of one building
  const steps = [];
  const byBuilding = new Map();
  for (const r of rows) { if (!byBuilding.has(r.building)) byBuilding.set(r.building, []); byBuilding.get(r.building).push(r); }
  for (const list of byBuilding.values()) {
    list.sort((p, q) => p.tier - q.tier);
    for (let i = 0; i + 1 < list.length; i++) {
      const step = r2(Math.abs(list[i + 1].ffe - list[i].ffe));
      list[i].step = step;
      steps.push({ from: list[i].id, to: list[i + 1].id, step });
    }
  }
  const padArea = r1(padRings.flat().reduce((s, ring) => s + Math.abs(signedArea(ring)), 0));
  return { rows, steps, padArea, padRings };
}

/* ------------------------------------------------------------------ walls */

/** Plan 3.6 fallback for a wall that arrives without its stats. */
function wallStatsFallback(wall, at) {
  const line = (wall.line || []).map((p) => [p[0], p[1]]);
  let length = 0, sum = 0, count = 0, max = 0;
  for (let i = 0; i + 1 < line.length; i++) {
    const a = line[i], b = line[i + 1];
    const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);
    if (len < 1e-9) continue;
    const nx = -dy / len, ny = dx / len;
    const steps = Math.max(1, Math.ceil(len / 1 - 1e-9));
    for (let c = 0; c < steps; c++) {
      const f = (c + 0.5) / steps;   // mid-stretch samples: a wall end that meets a corner cone would drag the average
      const x = a[0] + dx * f, y = a[1] + dy * f;
      const h = Math.abs(at(x + 0.01 * nx, y + 0.01 * ny) - at(x - 0.01 * nx, y - 0.01 * ny));
      if (h > max) max = h;
      sum += h; count++;
    }
    length += len;
  }
  return { heightMax: max, heightAvg: count ? sum / count : 0, length };
}

function wallRows(built, limits) {
  const list = Array.isArray(built.walls) ? built.walls : [];
  const rows = list.map((w) => {
    const have = isNum(w.heightMax) && isNum(w.heightAvg) && isNum(w.length);
    const s = have ? w : wallStatsFallback(w, built.surface.at);
    const kind = KINDS.includes(w.kind) ? w.kind : "drawn";
    const first = Array.isArray(w.line) && w.line[0] ? w.line[0] : [0, 0];
    return {
      id: w.id, kind, heightMax: r2(s.heightMax), heightAvg: r2(s.heightAvg), length: r1(s.length),
      auto: kind === "auto", accepted: w.accepted !== false, flagged: s.heightMax > limits.wallFlag + EPS,
      where: { x: r3(first[0]), y: r3(first[1]) },
    };
  });
  const byKind = {};
  for (const k of KINDS) byKind[k] = { count: 0, length: 0 };
  let length = 0, weighted = 0, max = 0;
  for (const r of rows) {
    byKind[r.kind].count++;
    byKind[r.kind].length += r.length;
    length += r.length; weighted += r.heightAvg * r.length;
    if (r.heightMax > max) max = r.heightMax;
  }
  for (const k of KINDS) byKind[k].length = r1(byKind[k].length);
  return { count: rows.length, length: r1(length), heightMax: r2(max), heightAvg: length > 0 ? r2(weighted / length) : 0, byKind, list: rows };
}

/* ------------------------------------------------------------ site extent */

function propertyRing(state, built) {
  const p = state && state.property;
  if (p && p.mode === "drawn" && Array.isArray(p.ring) && p.ring.length >= 3) return p.ring;
  const { spacing: d, n, x0, y0 } = built.grid;
  const x1 = x0 + (n - 1) * d, y1 = y0 + (n - 1) * d;
  return [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
}

function outsideSite(state, built, padRingsByTier) {
  const ring = propertyRing(state, built);
  const out = [];
  const test = (kind, id, ringList) => {
    for (const r of ringList) {
      const bad = r.find((p) => !inRing(p[0], p[1], ring, 1e-6));
      if (bad) { out.push({ kind, id, x: r3(bad[0]), y: r3(bad[1]) }); return; }
    }
  };
  (Array.isArray(built.tiers) ? built.tiers : []).forEach((t, i) => test("pad", t.id, padRingsByTier[i]));
  const feats = built.features;
  const fl = Array.isArray(feats) ? feats : feats && typeof feats === "object" ? Object.values(feats).flat() : [];
  for (const f of fl) if (f && f.ring) test(f.kind || "feature", f.id, rings(f.ring));
  return out;
}

/* --------------------------------------------------------------- metrics */

/** Plan 3.11. → every row of the table, as plain data (see the header for the rules).
    { cutCy, fillCy, netCy, bulkedNetCy, balance, disturbedArea, cellsSampled, padArea,
      tiers, steps, walls, wallLength, wallHeightMax, wallHeightAvg,
      routes, steepestRoute, drives, lots, slopeConflicts, outsideSite, buildWarnings, limits, maxStep, warnings } */
function computeMetrics(state, built) {
  need(state && typeof state === "object", "computeMetrics", "state");
  need(built && built.grid && built.surface && typeof built.surface.at === "function" && typeof built.existingAt === "function", "computeMetrics", "built");
  const limits = { ...DEFAULT_LIMITS, ...(state.limits || {}) };
  const ew = state.earthwork || {};
  const k = built.quality === "draft" ? 1 : isNum(ew.subdivide) ? ew.subdivide : 4;
  const ewk = earthwork(built, { subdivide: k, bulking: isNum(ew.bulking) ? ew.bulking : 1 });

  const t = tierRows(built);
  const walls = wallRows(built, limits);

  const routes = (Array.isArray(state.routes) ? state.routes : []).filter((r) => r && Array.isArray(r.line) && r.line.length >= 2).map((r) => {
    const p = routeProfile(r, built.surface.at, limits);
    return { id: r.id, name: r.name || null, kind: p.kind, maxSlope: p.maxSlope, maxCross: p.maxCross, warnings: p.warnings };
  });
  const steepestRoute = routes.reduce((m, r) => Math.max(m, r.maxSlope), 0);

  const drives = (Array.isArray(state.drives) ? state.drives : []).map((d) => ({ id: d.id, slopePct: isNum(d.slope) ? d.slope : 0, crossPct: isNum(d.cross) ? d.cross : 0, where: d.line && d.line[0] ? { x: r3(d.line[0][0]), y: r3(d.line[0][1]) } : null }));
  const lots = (Array.isArray(state.lots) ? state.lots : []).map((l) => {
    const pts = rings(l.ring)[0] || [];
    const c = l.anchor && isPair(l.anchor) ? l.anchor : pts.length ? [pts.reduce((s, p) => s + p[0], 0) / pts.length, pts.reduce((s, p) => s + p[1], 0) / pts.length] : null;
    return { id: l.id, slopePct: isNum(l.slope) ? l.slope : 0, crossPct: isNum(l.cross) ? l.cross : 0, where: c ? { x: r3(c[0]), y: r3(c[1]) } : null };
  });

  const conflicts = Array.isArray(built.conflicts) ? built.conflicts : built.surface && Array.isArray(built.surface.conflicts) ? built.surface.conflicts : [];

  const m = {
    cutCy: ewk.cutCy, fillCy: ewk.fillCy, netCy: ewk.netCy, bulkedNetCy: ewk.bulkedNetCy, balance: ewk.balance,
    disturbedArea: ewk.disturbedArea, cellsSampled: ewk.cellsSampled, subdivide: k,
    padArea: t.padArea,
    tiers: t.rows, steps: t.steps,
    walls, wallLength: walls.length, wallHeightMax: walls.heightMax, wallHeightAvg: walls.heightAvg,
    routes, steepestRoute: r4(steepestRoute),
    drives, lots,
    slopeConflicts: conflicts.filter((c) => c && isNum(c.x) && isNum(c.y)).map((c) => ({ x: r3(c.x), y: r3(c.y) })),
    outsideSite: outsideSite(state, built, t.padRings),
    buildWarnings: Array.isArray(built.warnings) ? built.warnings.map((w) => ({ ...w })) : [],
    limits, maxStep: isNum(state.maxStep) ? state.maxStep : null,
  };
  m.warnings = checks(state, m);   // so one list reaches the page, the notes, and the exports
  return m;
}

/* ----------------------------------------------------------------- checks */

const warn = (code, message, where = null, severity = "warn") => ({ code, severity, where, message });

/** Plan 3.11. → Warning[] { code, severity, where, message }:
    slope-conflict, wall-height, step, lot-slope, drive-slope, ramp-landing, route-fail, outside-site,
    plus the build warnings (tower-no-levels and the like). */
function checks(state, metrics) {
  need(state && metrics && isNum(metrics.cutCy), "checks", "state and metrics");
  const limits = { ...DEFAULT_LIMITS, ...(metrics.limits || {}), ...(state.limits || {}) };
  const maxStep = isNum(state.maxStep) ? state.maxStep : isNum(metrics.maxStep) ? metrics.maxStep : null;
  const out = [];

  // slope conflicts: one warning per 20 ft square, at most 8
  const buckets = new Map();
  for (const c of metrics.slopeConflicts || []) {
    const key = `${Math.floor(c.x / 20)},${Math.floor(c.y / 20)}`;
    const b = buckets.get(key) || { sx: 0, sy: 0, n: 0 };
    b.sx += c.x; b.sy += c.y; b.n++;
    buckets.set(key, b);
  }
  let shown = 0;
  for (const b of buckets.values()) {
    if (shown++ >= 8) break;
    const x = r1(b.sx / b.n), y = r1(b.sy / b.n);
    out.push(warn("slope-conflict", `Two features need slopes that cannot meet near (${x}, ${y}). The proposed ground takes the midpoint. Add a wall or more distance between the features.`, { x, y }));
  }

  const walls = metrics.walls && Array.isArray(metrics.walls.list) ? metrics.walls.list : [];
  for (const w of walls) {
    if (w.heightMax > limits.wallFlag + EPS) {
      out.push(warn("wall-height", `Wall ${w.id} is up to ${r2(w.heightMax)} ft tall, above the ${limits.wallFlag} ft flag. Walls over about 4 ft often need an engineered design, a permit, and a guard. Verify every wall with the civil and structural engineers.`, { ...w.where, wall: w.id }));
    }
  }

  if (maxStep != null) {
    for (const s of metrics.steps || []) {
      if (s.step > maxStep + 0.005) out.push(warn("step", `The step from ${s.from} to ${s.to} is ${r2(s.step)} ft, above the ${maxStep} ft maximum between tiers. Add a tier or a wall, and verify the step with the civil engineer.`, { from: s.from, to: s.to }));
    }
  }

  for (const l of metrics.lots || []) {
    const s = Math.abs(l.slopePct) / 100;
    if (s < limits.lotMin - EPS) out.push(warn("lot-slope", `Lot ${l.id} slopes ${r2(Math.abs(l.slopePct))} percent, below the ${r2(limits.lotMin * 100)} percent minimum. Lot grades are design values for a sketch: verify with the civil engineer.`, l.where ? { ...l.where, lot: l.id } : { lot: l.id }));
    else if (s > limits.lotMax + EPS) out.push(warn("lot-slope", `Lot ${l.id} slopes ${r2(Math.abs(l.slopePct))} percent, above the ${r2(limits.lotMax * 100)} percent maximum. Lot grades are design values for a sketch: verify with the civil engineer.`, l.where ? { ...l.where, lot: l.id } : { lot: l.id }));
  }
  for (const d of metrics.drives || []) {
    const s = Math.abs(d.slopePct) / 100;
    if (s > limits.driveMax + EPS) out.push(warn("drive-slope", `Drive ${d.id} slopes ${r2(Math.abs(d.slopePct))} percent, above the ${r2(limits.driveMax * 100)} percent check value. The fire marshal and the local code set fire access grades: verify with the civil engineer.`, d.where ? { ...d.where, drive: d.id } : { drive: d.id }));
  }

  for (const r of metrics.routes || []) for (const w of r.warnings || []) out.push({ ...w, where: w.where ? { ...w.where } : null });

  for (const o of metrics.outsideSite || []) {
    out.push(warn("outside-site", `${o.kind === "pad" ? "Pad" : o.kind === "drive" ? "Drive" : o.kind === "lot" ? "Lot" : "Feature"} ${o.id} reaches past the property line near (${o.x}, ${o.y}). Move it inside or adjust the property line.`, { x: o.x, y: o.y }));
  }

  for (const w of metrics.buildWarnings || []) out.push({ ...w });
  return out;
}

return { computeMetrics, checks };
})();

/* ---- src/grading/derived.js ---- */
const GradDerivedMod = (() => {
/* ==========================================================================
   grading/derived.js — Grading Sketch → grading.derived
   (docs/grading-sketch-technical-plan.md sections 3.12 and 4; project file spec 6.7 once the integrator adds it)

   gradingDerived(state, built, metrics) → { ffe, ground, walls, routes, metrics }
     state    the grading state (plan section 2)
     built    buildGrading(state, ...) result (plan section 4): { grid, surface, buildings, tiers, features, walls, ... }
     metrics  computeMetrics(state, built) result. A row may sit flat (metrics.cutCy) or in a group (metrics.earthwork.cutCy).
              A missing wall, pad, or route row falls back to a figure computed from `built`. cut and fill are required.

   ffe[]      one per tier: id ("<building id>-T<k>"; building id is "massing" or "parking" for those sources), source
              ("standalone" | "massing" | "parking"), tier, outer, ffe, padTop, existingMin, existingMax.
   ground     { spacing, n, points } the proposed grid, same nodes as the existing grid, z to 0.01 ft.
   walls[]    { id, kind, line (the top, [x, y, z]), heightMax, heightAvg, length, auto, accepted }.
   routes[]   { id, kind, line ([x, y, z] every 5 ft), maxSlope, maxCross }.
   metrics    { cutCy, fillCy, netCy, balance, bulkedNetCy, wallLength, wallHeightMax, wallHeightAvg, padArea,
                disturbedArea, steepestRoute }

   The shared helpers below (groundData, wallProfile, routeStats, tierList, padPolygons, ...) are also used by
   exports.js and sketchup.js, so the three writers read the build the same way.

   Rounding: coordinates 0.001 ft, elevations 0.01 ft, volumes 0.1 cy, areas 0.1 sf, ratios 0.001, slopes 0.0001.
   Pure: no DOM, no input mutation, no hidden state.
   ========================================================================== */

const WALL_STEP = 1;             // ft between wall height samples (plan 3.6)
const WALL_PROBE = 0.01;         // ft each side of the wall line
const ROUTE_STEP = 5;            // ft between route points in derived

const isNum = (v) => typeof v === "number" && Number.isFinite(v);
const r1 = (v) => { const r = Math.round(v * 10) / 10; return r === 0 ? 0 : r; };
const r2 = (v) => { const r = Math.round(v * 100) / 100; return r === 0 ? 0 : r; };
const r3 = (v) => { const r = Math.round(v * 1000) / 1000; return r === 0 ? 0 : r; };
const r4 = (v) => { const r = Math.round(v * 10000) / 10000; return r === 0 ? 0 : r; };
const need = (v, name) => { if (v === undefined || v === null) throw new Error(`gradingDerived: missing input "${name}".`); return v; };

/** The first number found at any of the dotted paths ("cutCy", "earthwork.cutCy"), else null. */
function pick(obj, ...paths) {
  for (const p of paths) {
    let v = obj;
    for (const k of p.split(".")) { if (v === null || v === undefined || typeof v !== "object") { v = undefined; break; } v = v[k]; }
    if (isNum(v)) return v;
  }
  return null;
}

/* ---------------- rings and polygons ---------------- */

const isPt = (p) => Array.isArray(p) && p.length >= 2 && isNum(p[0]) && isNum(p[1]);
const isRing = (v) => Array.isArray(v) && v.length >= 3 && v.every(isPt);

/** A ring from a ring, a polygon { outer }, or a list of rings (the first one). Else null. */
function ringOf(v) {
  if (isRing(v)) return v;
  if (v && !Array.isArray(v) && isRing(v.outer)) return v.outer;
  if (Array.isArray(v) && v.length && isRing(v[0])) return v[0];
  return null;
}

/**
 * Polygons [{ outer, holes }] from a pad: one ring, a list of rings (separate polygons), a polygon
 * { outer, holes }, or a list of polygons.
 */
function padPolygons(pad) {
  if (isRing(pad)) return [{ outer: pad, holes: [] }];
  if (pad && !Array.isArray(pad) && isRing(pad.outer)) return [{ outer: pad.outer, holes: (pad.holes || []).filter(isRing) }];
  if (Array.isArray(pad)) return pad.flatMap((p) => padPolygons(p));
  return [];
}

function ringArea(ring) {
  let a = 0;
  for (let i = 0; i < ring.length; i++) { const p = ring[i], q = ring[(i + 1) % ring.length]; a += p[0] * q[1] - q[0] * p[1]; }
  return a / 2;
}

/* ---------------- ground grid ---------------- */

/**
 * The grid of a build as plain arrays.
 * @returns {{ n, spacing, x0, y0, xs: number[], ys: number[], ez: Float64Array, pz: Float64Array }}
 *   ez = existing z, pz = proposed z at every node (row-major from the south).
 *   pz comes from built.proposedZ when it holds n*n numbers, else from built.surface.at at each node.
 */
function groundData(built) {
  const g = need(need(built, "built").grid, "built.grid");
  const n = g.n, d = g.spacing;
  if (!Number.isInteger(n) || n < 2 || !isNum(d) || !(d > 0)) throw new Error("gradingDerived: built.grid needs n (2 or more) and spacing.");
  const nodes = g.nodes && g.nodes.length >= n * n * 3 ? g.nodes : null;
  const x0 = isNum(g.x0) ? g.x0 : nodes ? nodes[0] : 0;
  const y0 = isNum(g.y0) ? g.y0 : nodes ? nodes[1] : 0;
  const xs = [], ys = [];
  for (let i = 0; i < n; i++) { xs.push(x0 + i * d); ys.push(y0 + i * d); }
  const exAt = typeof g.at === "function" ? g.at : typeof built.existingAt === "function" ? built.existingAt : null;
  const at = built.surface && typeof built.surface.at === "function" ? built.surface.at : null;
  const ez = new Float64Array(n * n), pz = new Float64Array(n * n);
  const given = built.proposedZ && built.proposedZ.length >= n * n ? built.proposedZ : null;
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const k = j * n + i;
    ez[k] = nodes ? nodes[k * 3 + 2] : exAt ? exAt(xs[i], ys[j]) : 0;
    if (given) pz[k] = given[k];
    else if (at) pz[k] = at(xs[i], ys[j]);
    else throw new Error('gradingDerived: missing input "built.surface.at".');
  }
  return { n, spacing: d, x0, y0, xs, ys, ez, pz };
}

/* ---------------- tiers ---------------- */

/** The pad of a tier: `pad` (tierPads) or `pads` (the rings a pad feature takes). */
function padOf(t) {
  return t && (t.pad !== undefined && t.pad !== null ? t.pad : t.pads);
}

/** The tier records of a build (flat list). */
function tierList(built) {
  const t = Array.isArray(built && built.tiers) ? built.tiers : [];
  return t.flat().filter((x) => x && typeof x === "object");
}

/** { id, source, buildingId, building } for a tier. See the id rule in the file header. */
function tierIdentity(t, built) {
  const buildings = Array.isArray(built && built.buildings) ? built.buildings : [];
  const m = typeof t.id === "string" ? /^(.*)-T\d+$/.exec(t.id) : null;
  const buildingId = String(t.buildingId ?? t.building ?? (m ? m[1] : t.id ?? ""));
  const building = buildings.find((b) => b && b.id === buildingId) || null;
  const raw = t.source ?? (building && building.source) ?? "typed";
  const source = raw === "massing" || raw === "parking" ? raw : "standalone";
  const prefix = source === "standalone" ? buildingId : source;
  return { id: `${prefix}-T${t.tier}`, source, buildingId, building };
}

/* ---------------- walls ---------------- */

const segLen = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
function lineLength(line) { let L = 0; for (let i = 1; i < line.length; i++) L += segLen(line[i - 1], line[i]); return L; }

/**
 * Height samples along a wall (plan 3.6): every 1 ft along every segment, h = |z(p + 0.01 n) − z(p − 0.01 n)|.
 * @returns {{ samples: {x,y,top,bottom,h,seg}[], length, heightMax, heightAvg, iMax }}
 *   top = the higher of the two sides, bottom = the lower. n is the left normal of the segment. seg = the polyline segment index.
 */
function wallProfile(wall, at) {
  const line = (wall.line || []).filter(isPt);
  const samples = [];
  let length = 0;
  for (let s = 0; s < line.length - 1; s++) {
    const a = line[s], b = line[s + 1], L = segLen(a, b);
    if (!(L > 0)) continue;
    const tx = (b[0] - a[0]) / L, ty = (b[1] - a[1]) / L, nx = -ty, ny = tx;
    const steps = Math.max(1, Math.ceil(L / WALL_STEP - 1e-9));
    for (let k = s === 0 || !samples.length ? 0 : 1; k <= steps; k++) {
      const u = (k / steps) * L, x = a[0] + tx * u, y = a[1] + ty * u;
      const z1 = at(x + nx * WALL_PROBE, y + ny * WALL_PROBE), z2 = at(x - nx * WALL_PROBE, y - ny * WALL_PROBE);
      samples.push({ x, y, top: Math.max(z1, z2), bottom: Math.min(z1, z2), h: Math.abs(z1 - z2), seg: s });
    }
    length += L;
  }
  // The first and last sample sit on the wall's end points. A probe line that runs through an end point does not
  // "properly cross" the wall, so the daylight can leak around the end. Both ends take the sample 1 ft inside.
  if (samples.length >= 3) {
    const take = (to, from) => { Object.assign(samples[to], { top: samples[from].top, bottom: samples[from].bottom, h: samples[from].h }); };
    take(0, 1); take(samples.length - 1, samples.length - 2);
  }
  let iMax = 0, sum = 0;
  samples.forEach((p, i) => { sum += p.h; if (p.h > samples[iMax].h) iMax = i; });
  return { samples, length, heightMax: samples.length ? samples[iMax].h : 0, heightAvg: samples.length ? sum / samples.length : 0, iMax };
}

/** Douglas-Peucker in 3D: drops points within tol of the line through their neighbours. */
function simplify3(pts, tol = 0.01) {
  if (pts.length <= 2) return pts.slice();
  const keep = new Array(pts.length).fill(false);
  keep[0] = keep[pts.length - 1] = true;
  const stack = [[0, pts.length - 1]];
  while (stack.length) {
    const [i, j] = stack.pop();
    const a = pts[i], b = pts[j], ab = [b[0] - a[0], b[1] - a[1], b[2] - a[2]], L2 = ab[0] ** 2 + ab[1] ** 2 + ab[2] ** 2;
    let worst = -1, wd = tol;
    for (let k = i + 1; k < j; k++) {
      const p = pts[k], ap = [p[0] - a[0], p[1] - a[1], p[2] - a[2]];
      const t = L2 > 0 ? Math.max(0, Math.min(1, (ap[0] * ab[0] + ap[1] * ab[1] + ap[2] * ab[2]) / L2)) : 0;
      const d = Math.hypot(ap[0] - t * ab[0], ap[1] - t * ab[1], ap[2] - t * ab[2]);
      if (d > wd) { wd = d; worst = k; }
    }
    if (worst >= 0) { keep[worst] = true; stack.push([i, worst], [worst, j]); }
  }
  return pts.filter((_, k) => keep[k]);
}

/**
 * Everything the writers need about one wall.
 * Uses the numbers on the wall when it carries them (heightMax, heightAvg, length, top); else computes them.
 * @returns {{ id, kind, auto, accepted, line, top: number[][], length, heightMax, heightAvg, profile }}
 *   top = the top line [x, y, z] (simplified); profile = the 1 ft samples (for the DXF text and the SketchUp solid).
 */
function wallRecord(wall, state, built) {
  const at = built.surface.at;
  const profile = wallProfile(wall, at);
  const kind = typeof wall.kind === "string" ? wall.kind : "drawn";
  const auto = kind === "auto";
  const acc = state && state.autoWalls && Array.isArray(state.autoWalls.accepted) ? state.autoWalls.accepted : [];
  const accepted = !auto ? true : typeof wall.accepted === "boolean" ? wall.accepted : acc.includes(wall.id);
  let top;
  if (Array.isArray(wall.top) && wall.top.length >= 2 && wall.top.every((p) => Array.isArray(p) && p.length >= 3 && p.every(isNum))) top = wall.top.map((p) => [p[0], p[1], p[2]]);
  else top = simplify3(profile.samples.map((p) => [p.x, p.y, p.top]));
  return {
    id: String(wall.id), kind, auto, accepted, line: wall.line,
    top: top.map((p) => [r3(p[0]), r3(p[1]), r2(p[2])]),
    length: isNum(wall.length) ? wall.length : profile.length,
    heightMax: isNum(wall.heightMax) ? wall.heightMax : profile.heightMax,
    heightAvg: isNum(wall.heightAvg) ? wall.heightAvg : profile.heightAvg,
    profile,
  };
}

/** wallRecord for every wall in built.walls. */
function wallRecords(state, built) {
  return (Array.isArray(built.walls) ? built.walls : []).filter((w) => w && Array.isArray(w.line) && w.line.length >= 2).map((w) => wallRecord(w, state, built));
}

/* ---------------- routes ---------------- */

/** Points every `step` ft along a polyline, ends included: [[x, y, z], …] with z from `at`. */
function sampleLine(line, step, at) {
  const pts = line.filter(isPt);
  const out = [];
  const push = (x, y) => out.push([x, y, at(x, y)]);
  for (let s = 0; s < pts.length - 1; s++) {
    const a = pts[s], b = pts[s + 1], L = segLen(a, b);
    if (!(L > 0)) continue;
    const steps = Math.max(1, Math.ceil(L / step - 1e-9));
    for (let k = s === 0 || !out.length ? 0 : 1; k <= steps; k++) push(a[0] + (b[0] - a[0]) * k / steps, a[1] + (b[1] - a[1]) * k / steps);
  }
  if (!out.length && pts.length) push(pts[0][0], pts[0][1]);
  return out;
}

/**
 * Slopes of a route by the plan 3.9 rules (used only when the build or the metrics carry no route profile).
 * Running slope at s = |z(s + 5) − z(s)| / 5 (the last 5 ft look back); cross slope = |z(p + 2.5 n) − z(p − 2.5 n)| / 5.
 * @returns {{ maxSlope, maxCross, kind }} kind = "walk" when every sample is a walk, else "ramp".
 */
function routeStats(line, at, limits) {
  const lim = limits || {};
  const walk = isNum(lim.walk) ? lim.walk : 0.05, cross = isNum(lim.cross) ? lim.cross : 0.0208;
  const pts = line.filter(isPt);
  const L = lineLength(pts);
  const pos = (s) => {                       // point at station s
    let acc = 0;
    for (let i = 1; i < pts.length; i++) {
      const l = segLen(pts[i - 1], pts[i]);
      if (acc + l >= s - 1e-9 && l > 0) { const u = Math.min(1, Math.max(0, (s - acc) / l)); return { x: pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * u, y: pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * u, tx: (pts[i][0] - pts[i - 1][0]) / l, ty: (pts[i][1] - pts[i - 1][1]) / l }; }
      acc += l;
    }
    const a = pts[pts.length - 2] || pts[0], b = pts[pts.length - 1], l = segLen(a, b) || 1;
    return { x: b[0], y: b[1], tx: (b[0] - a[0]) / l, ty: (b[1] - a[1]) / l };
  };
  let maxSlope = 0, maxCross = 0, allWalk = true;
  const N = Math.max(1, Math.floor(L));
  for (let k = 0; k <= N; k++) {
    const s = Math.min(k, L), p = pos(s);
    const s2 = s + 5 <= L + 1e-9 ? s + 5 : Math.max(0, s - 5), q = pos(s2);
    const run = Math.abs(at(q.x, q.y) - at(p.x, p.y)) / Math.max(1e-9, Math.abs(s2 - s));
    const nx = -p.ty, ny = p.tx;
    const cr = Math.abs(at(p.x + 2.5 * nx, p.y + 2.5 * ny) - at(p.x - 2.5 * nx, p.y - 2.5 * ny)) / 5;
    if (run > maxSlope) maxSlope = run;
    if (cr > maxCross) maxCross = cr;
    if (run > walk + 1e-9 || cr > cross + 1e-9) allWalk = false;
  }
  return { maxSlope, maxCross, kind: allWalk ? "walk" : "ramp" };
}

/** The route rows of a build: [{ id, name, line (the drawn line), points ([x,y,z] every 5 ft), kind, maxSlope, maxCross }]. */
function routeRecords(state, built, metrics) {
  const routes = Array.isArray(state && state.routes) ? state.routes : [];
  const at = built.surface.at;
  const rows = (v) => (Array.isArray(v) ? v : []);
  const given = (id) => rows(built.routes).find((r) => r && r.id === id) || rows(metrics && metrics.routes).find((r) => r && r.id === id) || null;
  return routes.filter((r) => r && Array.isArray(r.line) && r.line.filter(isPt).length >= 2).map((r) => {
    const g = given(r.id);
    const st = g && isNum(g.maxSlope) && isNum(g.maxCross) ? g : routeStats(r.line, at, state.limits);
    const kind = g && (g.kind === "walk" || g.kind === "ramp") ? g.kind : st.kind || "ramp";
    return { id: String(r.id), name: r.name ? String(r.name) : String(r.id), line: r.line, points: sampleLine(r.line, ROUTE_STEP, at), kind, maxSlope: st.maxSlope, maxCross: st.maxCross };
  });
}

/* ---------------- the writer ---------------- */

/**
 * The metrics block of derived (and the notes). The metrics rows win; a missing wall, pad, or route row falls back to the build.
 * wr = wallRecords(...), rr = routeRecords(...).
 */
function metricsSummary(state, built, metrics, wr, rr) {
  const cut = pick(metrics, "cutCy", "earthwork.cutCy"), fill = pick(metrics, "fillCy", "earthwork.fillCy");
  if (cut === null) throw new Error('gradingDerived: missing input "metrics.cutCy".');
  if (fill === null) throw new Error('gradingDerived: missing input "metrics.fillCy".');
  const bulking = isNum(state.earthwork && state.earthwork.bulking) ? state.earthwork.bulking : 1;
  const net = pick(metrics, "netCy", "earthwork.netCy");
  const bal = pick(metrics, "balance", "earthwork.balance");
  const bulked = pick(metrics, "bulkedNetCy", "earthwork.bulkedNetCy");
  const wLen = wr.reduce((s, w) => s + w.length, 0);
  const wAvg = wLen > 0 ? wr.reduce((s, w) => s + w.heightAvg * w.length, 0) / wLen : 0;
  const padFallback = tierList(built).reduce((s, t) => s + padPolygons(padOf(t)).reduce((a, p) => a + Math.abs(ringArea(p.outer)) - p.holes.reduce((h, r) => h + Math.abs(ringArea(r)), 0), 0), 0);
  const hi = Math.max(cut, fill);

  return {
    cutCy: r1(cut),
    fillCy: r1(fill),
    netCy: r1(net !== null ? net : fill - cut),
    balance: r3(bal !== null ? bal : hi > 0 ? Math.min(cut, fill) / hi : 1),
    bulkedNetCy: r1(bulked !== null ? bulked : fill - cut * bulking),
    wallLength: r1(pick(metrics, "wallLength", "walls.length", "walls.totalLength") ?? wLen),
    wallHeightMax: r2(pick(metrics, "wallHeightMax", "walls.heightMax") ?? wr.reduce((m, w) => Math.max(m, w.heightMax), 0)),
    wallHeightAvg: r2(pick(metrics, "wallHeightAvg", "walls.heightAvg") ?? wAvg),
    padArea: r1(pick(metrics, "padArea") ?? padFallback),
    disturbedArea: r1(pick(metrics, "disturbedArea", "earthwork.disturbedArea") ?? 0),
    steepestRoute: r4(pick(metrics, "steepestRoute", "routes.steepestRunning") ?? rr.reduce((m, r) => Math.max(m, r.maxSlope), 0)),
  };
}

function gradingDerived(state, built, metrics) {
  need(state, "state"); need(built, "built"); need(metrics, "metrics");
  const gd = groundData(built);

  const ffe = tierList(built).map((t) => {
    const idn = tierIdentity(t, built);
    const outer = ringOf(t.outer) || ringOf(padOf(t)) || [];
    return {
      id: idn.id, source: idn.source, tier: t.tier,
      outer: outer.map((p) => [r3(p[0]), r3(p[1])]),
      ffe: r2(t.ffe), padTop: r2(t.padTop), existingMin: r2(t.existingMin), existingMax: r2(t.existingMax),
    };
  });

  const points = [];
  for (let j = 0; j < gd.n; j++) for (let i = 0; i < gd.n; i++) points.push([r3(gd.xs[i]), r3(gd.ys[j]), r2(gd.pz[j * gd.n + i])]);

  const wr = wallRecords(state, built);
  const walls = wr.map((w) => ({
    id: w.id, kind: w.kind, line: w.top, heightMax: r2(w.heightMax), heightAvg: r2(w.heightAvg), length: r1(w.length), auto: w.auto, accepted: w.accepted,
  }));

  const rr = routeRecords(state, built, metrics);
  const routes = rr.map((r) => ({
    id: r.id, kind: r.kind, line: r.points.map((p) => [r3(p[0]), r3(p[1]), r2(p[2])]), maxSlope: r4(r.maxSlope), maxCross: r4(r.maxCross),
  }));

  return {
    ffe,
    ground: { spacing: gd.spacing, n: gd.n, points },
    walls,
    routes,
    metrics: metricsSummary(state, built, metrics, wr, rr),
  };
}

return { WALL_STEP, WALL_PROBE, ROUTE_STEP, r1, r2, r3, r4, pick, ringOf, padPolygons, ringArea, groundData, padOf, tierList, tierIdentity, lineLength, wallProfile, simplify3, wallRecord, wallRecords, sampleLine, routeStats, routeRecords, metricsSummary, gradingDerived };
})();

/* ---- src/grading/exports.js ---- */
const GradExportsMod = (() => {
/* ==========================================================================
   grading/exports.js — Revit CSV, DXF R12, and the notes file
   (docs/grading-sketch-technical-plan.md section 4 "DXF layers" and section 3.12)

   revitCsv(built)                          "x,y,z\n" for every proposed ground node, row-major from the south, 3 decimals, no header.
   gradingDxf(state, built, metrics)        DXF R12 (AC1009), feet, project frame, hand-written like src/site/exports.js.

     GRD-WALL        the top line of each wall (3D polyline)

   ========================================================================== */

const { contours, zeroLine } = ContoursMod;
const { groundData, tierList, tierIdentity, padPolygons, padOf, wallRecords, routeRecords, metricsSummary, ringOf } = GradDerivedMod;

const GRADING_DXF_LAYERS = [
  ["GRD-EXIST-MINOR", 9], ["GRD-EXIST-MAJOR", 8], ["GRD-PROP-MINOR", 3], ["GRD-PROP-MAJOR", 5], ["GRD-PAD", 2],
  ["GRD-WALL", 1], ["GRD-WALL-TEXT", 1], ["GRD-CUTFILL", 6], ["GRD-DRIVE", 4], ["GRD-LOT", 30],
  ["GRD-ROUTE", 7], ["GRD-SPOT", 7], ["GRD-TEXT", 7],
];

const CAUTIONS = [
  "Caution: the Grading Sketch is a sketch for early coordination with the civil engineer. It is never a grading plan. Every volume, slope, and wall height here is a design-stage estimate.",
  "Caution: grid earthwork compares options. It is not a quantity takeoff. Expect about plus or minus 5 to 10 percent against a civil surface model, more where edges fall between samples.",
  "Caution: a step between tiers changes the building, not only the ground. A 4 ft step needs stairs or a ramp inside the building and a stepped slab. Confirm every step with the design team.",
  "Caution: stable slopes depend on the soil. 2:1 and 3:1 are common starting values, not a geotechnical recommendation.",
  "Caution: walls over about 4 ft often need an engineered design, a permit, and a guard. Verify every wall with the civil and structural engineers.",
  "Caution: drive and lot slopes are design values for a sketch. The fire marshal and the local code set fire access grades. Verify every grade with the civil engineer and the fire marshal.",
