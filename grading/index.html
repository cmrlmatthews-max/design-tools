        minX: Math.min(...bs.map((x) => x.minX)), maxX: Math.max(...bs.map((x) => x.maxX)),
        minY: Math.min(...bs.map((x) => x.minY)), maxY: Math.max(...bs.map((x) => x.maxY)),
        height: Math.max(...bs.map((x) => x.height)),
      };
    }
    return boxOf(Derived.get());
  }

  /** Perspective: the nearest distance (and the look-at point) that puts all box corners inside the visible area. */
  function fitPersp(box, dir, aspect, H) {
    const corners = [];
    for (const x of [box.minX, box.maxX]) for (const y of [box.minY, box.maxY]) for (const z of [0, H]) corners.push(worldVec(x, y, z));
    const fwd = dir.clone().negate();
    const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0)).normalize();
    const up = new THREE.Vector3().crossVectors(right, fwd).normalize();
    const fit = 1 - 2 * FIT_MARGIN;
    const tY = tanHalfFov, tX = tanHalfFov * aspect;
    const target = worldVec((box.minX + box.maxX) / 2, (box.minY + box.maxY) / 2, H / 2);
    const solve = () => {
      let dist = 1;
      for (const p of corners) {
        const v = p.clone().sub(target), dd = v.dot(dir);
        dist = Math.max(dist, dd + Math.abs(v.dot(right)) / (tX * fit), dd + Math.abs(v.dot(up)) / (tY * fit));
      }
      return dist;
    };
    let dist = solve();
    for (let i = 0; i < 6; i++) {            // centre the projected box in the visible area, then re-solve the distance
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (const p of corners) {
        const v = p.clone().sub(target), z = dist - v.dot(dir);
        const nx = v.dot(right) / (z * tX), ny = v.dot(up) / (z * tY);
        x0 = Math.min(x0, nx); x1 = Math.max(x1, nx); y0 = Math.min(y0, ny); y1 = Math.max(y1, ny);
      }
      target.addScaledVector(right, ((x0 + x1) / 2) * tX * dist).addScaledVector(up, ((y0 + y1) / 2) * tY * dist);
      dist = solve();
    }
    return { dist, target };
  }

  /** Where each preset puts the camera. Every view frames the whole box (see boxOf) with a small margin. */
  function viewTarget(id, box, aspect, rot = 0) {
    const H = Math.max(box.height, 20);
    const ex = box.maxX - box.minX, ey = box.maxY - box.minY;
    const cx = (box.minX + box.maxX) / 2, cy = (box.minY + box.maxY) / 2;
    const fit = 1 - 2 * FIT_MARGIN;
    if (id === 'axon') {
      const az = rad(135), el = rad(28);      // camera sits south-east, looking north-west
      const dirPlan = [Math.sin(az) * Math.cos(el), Math.cos(az) * Math.cos(el), Math.sin(el)];
      const dir = new THREE.Vector3(...planToWorld(...dirPlan)).normalize();
      const f = fitPersp(box, dir, aspect, H);
      return { type: 'persp', dist: f.dist, target: f.target, dir };
    }
    const reach = 0.55 * Math.sqrt(ex * ex + ey * ey + H * H);     // keeps the whole box in front of an orthographic camera
    if (id === 'plan') {
      const vis = Math.max(ey / fit, ex / (aspect * fit), 30);
      const e = 0.0008;     // tiny tilt toward the south keeps "north up" without a degenerate up-vector
      return {
        type: 'ortho', zoom: (2 * ORTHO_HALF) / vis, minDist: reach,
        target: worldVec(cx, cy, 0),
        dir: new THREE.Vector3(...planToWorld(0, -Math.sin(e), Math.cos(e))).normalize(),
      };
    }
    // Elevations: N = looking at the north face from the north, etc.
    // Elevations look at a sector of the PROJECT frame. The scene is in the massing frame, so the viewing direction turns back by the placement rotation.
    const pd = { n: [0, 1], e: [1, 0], s: [0, -1], w: [-1, 0] }[id];
    const rr = rad(rot), cr = Math.cos(rr), sr = Math.sin(rr);
    const d = [pd[0] * cr + pd[1] * sr, -pd[0] * sr + pd[1] * cr];

    const along = turned ? Math.hypot(ex, ey) : ((id === 'n' || id === 's') ? ex : ey);
    const vis = Math.max(H / fit, along / (aspect * fit), 40);
    return {
      type: 'ortho', zoom: (2 * ORTHO_HALF) / vis, minDist: reach,
      target: worldVec(cx, cy, H / 2),
      dir: new THREE.Vector3(...planToWorld(d[0], d[1], 0)).normalize(),
    };
  }

  function framingAspect() {
    if (cmp) {
      const r = cmpRects();
      return r.length ? r[0].w / r[0].h : hostAspect();
    }
    return Math.max(0.2, (host.clientWidth - clamp(insetProvider().right || 0, 0, host.clientWidth * 0.6)) / Math.max(1, host.clientHeight));
  }

  function setView(id, animate = true) {
    if (!renderer) return;
    const goal = viewTarget(id, framingBox(), framingAspect(), cmp ? 0 : num(Derived.get().rotation, 0));
    preset = id;
    overlayVis = null;
    tween = null;
    if (goal.type !== camType) switchCamera(goal.type);
    const curTarget = controls.target.clone();
    const curOffset = cam.position.clone().sub(curTarget);
    const curDist = Math.max(1, curOffset.length());
    const fromDir = curOffset.clone().normalize();
    const toDist = goal.type === 'persp' ? goal.dist : Math.max(curDist, goal.minDist || 0);
    const apply = (target, dir, dist, zoom) => {
      controls.target.copy(target);

      if (camType === 'ortho') cam.zoom = zoom;
      cam.updateProjectionMatrix();
      controls.update();

    if (!animate || reduceMotion) {
      apply(goal.target, goal.dir, toDist, goal.zoom);
    } else {

        fromTarget: curTarget, toTarget: goal.target,
        fromDir, toDir: goal.dir, fromDist: curDist, toDist,

  function stepTween(now) {
    const k = tween;

  function updateClip() {

    }
    cam.updateProjectionMatrix();
  }

  function resize() {
    if (!renderer) return;

    needsRender = true;
    if (cmp) renderCompare(renderer, scene, cam, false); else renderer.render(scene, cam);
    resizeListeners.forEach((fn) => fn());
  }

  /* ---- compare: one renderer, one camera, one viewport per option -------------------------- */
  const cmpReserve = () => (cmp && cmp.reserve ? cmp.reserve() : { top: 0, bottom: 0 });
  function cmpRects(W = host.clientWidth, H = host.clientHeight, reserve = cmpReserve(), gap = 2) {

  }
  /** Draws every option into its own cell. Also used by screenshots (reserve = none, scaled size). */
  function renderCompare(r, s, c, forCapture) {

    const size = r.getSize(_v2);
    const W = size.x, H = size.y;
    const k = W / Math.max(1, host.clientWidth);

    const rects = compareRects(cmp.entries.length, W, H, reserve, 2 * k);

  function combineBounds(list) {

        minX: Math.min(...rs.map((r) => r.minX)), maxX: Math.max(...rs.map((r) => r.maxX)),
        minY: Math.min(...rs.map((r) => r.minY)), maxY: Math.max(...rs.map((r) => r.maxY)),

  }
  function syncCompare() {
    const s = Store.raw(), v = s.view;

    if (key === cmp.key) return;
    cmp.key = key;
    for (const e of cmp.entries) {
      if (e.group) { clearGroup(e.group); scene.remove(e.group); }
      const st = { ...e.state, view: { ...v } };
      const group = new THREE.Group();
      const built = Ground3D.build(e.d, st, { quality: 'full', key: 'cmp' });
      for (const o of built.model) group.add(o);

  }

    const wasComparing = !!cmp;

    cmp = { entries: list, key: null, reserve, bounds: combineBounds(list.map((e) => e.d)) };

  }

  /* ---- loop ------------------------------------------------------------------------ */
  /** Line materials (fat lines) need the size of the view to draw a width in pixels. */
  function syncLineResolution() {

  }
  function frame(now) {
    requestAnimationFrame(frame);
    if (capturing) return;

    const moved = controls.update();
    if (cmp) {
      syncCompare();
      if (viewVersion !== Store.version()) { viewVersion = Store.version(); applyView(); }
      if (moved || needsRender) { updateClip(); syncLineResolution(); renderCompare(renderer, scene, cam, false); needsRender = false; }
      return;
    }
    const d = Derived.get();
    const state = Store.raw();
    const disp = Derived.display();
    const first = derived === null;
    if (d.geomId !== geomIdSeen) {
      // Geometry changed: re-frame once the edit settles, but only when the framed area moved (a handle drag keeps the camera).
      const u = d.bounds.union, fk = [u.minX, u.maxX, u.minY, u.maxY].map((v) => Math.round(v / 40)).join(',');

    const bar = $('panelTabs');

      bar.append(h('button', {
        class: 'tab', type: 'button', role: 'tab', id: `tab-${t.id}`, 'data-tab': t.id, 'aria-controls': `tabpanel-${t.id}`, 'aria-selected': 'false', tabindex: '-1',

    bar.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight' && e.key !== 'Home' && e.key !== 'End') return;
      e.preventDefault();
      const i = TABS.findIndex((t) => t.id === activeTab);
      const next = e.key === 'Home' ? 0 : e.key === 'End' ? TABS.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + TABS.length) % TABS.length;
      setTab(TABS[next].id);

    });

  function setTab(id, { remember = true } = {}) {
    if (!TABS.some((t) => t.id === id)) return false;
    const scroller = $('panelScroll');
    if (id !== activeTab) scrollPos[activeTab] = scroller.scrollTop;
    activeTab = id;
    for (const t of TABS) {
      const on = t.id === id;
      const btn = $(`tab-${t.id}`), pnl = $(`tabpanel-${t.id}`);
      btn.setAttribute('aria-selected', on ? 'true' : 'false');

    scroller.scrollTop = scrollPos[id] || 0;
    if (remember && prefs.tab !== id) { prefs.tab = id; saveUiPrefs(prefs); }
    return true;
  }

  const HOME = {

  /** Switches to the tab of an item, opens its section and its card, and scrolls it into view. item: { kind, id }. Returns true when something was opened. */
  function openItem(item) {
    const home = item && HOME[item.kind];
    if (!home) return false;
    setTab(home.tab);
    const sec = sectionCtl[home.sec];
    if (!sec) return false;
    if (!sec.isOpen()) { sec.setOpen(true); rememberSection(home.sec, true); }
    let target = sec.el;
    if (home.list) {
      let i = (get(home.arr) || []).findIndex((x) => (item.kind === 'building' ? (x.source === 'typed' ? x.id : x.source) : x.id) === item.id);
      if (i >= 0 && lists[home.list]) { const row = lists[home.list].openAt(i); if (row) target = row; }
      else if (item.kind === 'wall') target = $('autoWalls') || target;
    }
    raiseSheet();
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    try { target.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' }); } catch (e) { target.scrollIntoView(); }
    target.classList.remove('is-focus'); void target.offsetWidth; target.classList.add('is-focus');
    setTimeout(() => target.classList.remove('is-focus'), 1600);
    return true;
  }

  }

  function updateHud(d) {
    const m = d.hud;
    setText('mCut', Units.formatCy10(m.cutCy));
    setText('mFill', Units.formatCy10(m.fillCy));
    setText('mNet', signedCy(round10(m.netCy)));
    setText('mWallMax', wallFt(m.wallMax));
    $('mWallMax').classList.toggle('bad', m.wallMax > num(Store.get('limits.wallFlag'), 4) + 1e-9);
    setText('mBalance', `${(m.balance * 100).toFixed(0)}%`);
    setText('mBulked', signedCy(round10(m.bulkedNetCy)));
    setText('mPad', Units.formatArea(m.padArea));
    setText('mDist', Units.formatArea(m.disturbed));
    setText('mWallLen', FT(m.wallLength));
    setText('mRoute', m.routes.length ? pct1(m.steepestRoute) : 'no routes');
    fillTierTable($('hudTierTable'), m.tiers);
    const rl = $('hudRouteList');
    $('hudRoutes').hidden = !m.routes.length;
    kvRows(rl, m.routes.map((r) => [r.name || r.id, `${pct1(r.maxSlope)} · cross ${pct1(r.maxCross)} · ${classWord(r.kind)}`, r.kind === 'fail' ? 'tgt-neg' : '']));

    const list = $('warnList');
    list.textContent = '';
    if (!d.warnings.length) list.append(h('li', { class: 'none' }, 'No warnings'));
    for (const w of d.warnings) list.append(warnItem(w));

    const nw = d.warnings.length;
    $('hudBadge').dataset.n = String(nw);
    $('hudBadge').textContent = `${nw} ${nw === 1 ? 'warning' : 'warnings'}`;

    updateNotes(d);
    updateLegend(d);

  function round10(v) { const r = Math.round(v / 10) * 10; return r === 0 ? 0 : r; }

  /** The small readouts inside the panel sections. */
  function updateNotes(d) {
    const st = Store.raw(), m = d.hud;
    const sn = $('sourceNote');
    if (sn) {
      const tw = d.warnings.find((w) => w.id === 'tower-no-levels');
      const notes = (d.notes || []).filter((t) => !tw || t !== tw.text);
      sn.textContent = tw ? tw.text : (notes.length ? notes.join(' ') : '');
      sn.hidden = !sn.textContent;
      sn.classList.toggle('caution', !!tw);
    }
    const gn = $('groundNote');
    if (gn) gn.textContent = `Falls toward ${compassOf(st.ground.plane.downhill)} at ${round1(st.ground.plane.slope)} percent.`;
    fillTierTable($('tierTable'), m.tiers);

    ui.saveBtn = h('button', { class: 'btn outline step', type: 'button', id: 'aiStepImage', onclick: () => saveImage() }, '1. Save AI-ready image');
    ui.copyBtn = h('button', { class: 'btn solid step', type: 'button', id: 'aiStepCopy', onclick: () => copyPrompt() }, '2. Copy prompt');
    ui.body = h('div', { class: 'ai-body', id: 'aiBody' });
    ui.toasts = h('div', { class: 'ai-toasts', 'aria-live': 'polite' });
    const panel = h('aside', { class: 'ai-panel', id: 'aiPanel', role: 'dialog', 'aria-label': 'AI Prompts', 'aria-modal': 'false', 'data-open': 'false', 'aria-hidden': 'true', tabindex: '-1' },
      h('header', { class: 'ai-head' }, h('h2', null, 'AI Prompts'), closeBtn),
      h('div', { class: 'ai-steps' },
        h('div', { class: 'ai-step-row' }, ui.saveBtn, ui.copyBtn),
        h('p', { class: 'help' }, 'Paste the image and the prompt into ChatGPT or Gemini.')),
      ui.body, ui.toasts);
    document.body.append(back, panel);
    ui.back = back; ui.el = panel;
  }
  function syncSteps() { if (ui.saveBtn) { ui.saveBtn.disabled = ui.busy; ui.saveBtn.textContent = ui.busy ? 'Saving image…' : '1. Save AI-ready image'; } }

  function tabsEl() {
    const g = currentGroup();
    const tabs = h('div', { class: 'ai-tabs', role: 'tablist', 'aria-label': 'Prompt groups' });
    for (const [id, label] of GROUPS) {
      tabs.append(h('button', {
        class: 'ai-tab', type: 'button', role: 'tab', id: `aiTab-${id}`, 'aria-selected': String(id === g), 'data-group': id,
        onclick: () => { if (ui.editing && id !== 'custom') ui.editing = null; ui.group = id; select(id, selectedId(id) || (groupPrompts(id)[0] || {}).id); render(); },
      }, label));
    }
    return tabs;
  }

  function listEl() {
    const g = currentGroup(), list = groupPrompts(g), cur = currentPrompt();
    const wrap = h('div', { class: 'ai-listwrap' });
    if (g === 'custom') {
      wrap.append(h('div', { class: 'ai-listbar' }, h('button', { class: 'btn outline sm', type: 'button', id: 'aiNew', onclick: startNew }, '+ New prompt')));
      if (!list.length && !ui.editing) wrap.append(h('p', { class: 'help ai-empty' }, 'Nothing here yet. Use New prompt, or open any other tab and press Duplicate to edit.'));
    }
    const ul = h('div', { class: 'ai-list', role: 'group', 'aria-label': 'Prompts' });
    for (const p of list) {
      ul.append(h('button', {
        class: 'ai-item', type: 'button', 'aria-pressed': String(ui.editing ? ui.editing.id === p.id : !!cur && cur.id === p.id), 'data-id': p.id,
        onclick: () => { ui.editing = null; select(g, p.id); render(); },
      }, h('span', { class: 'ai-item-title' }, p.title), p.description ? h('span', { class: 'ai-item-desc' }, p.description) : null));
    }
    if (ui.editing && !ui.editing.id) ul.append(h('div', { class: 'ai-item is-draft', 'aria-pressed': 'true' }, h('span', { class: 'ai-item-title' }, ui.editing.title || 'New prompt'), h('span', { class: 'ai-item-desc' }, 'Not saved yet')));
    wrap.append(ul);
    return wrap;
  }

  function fieldsEl(prompt, uses, onPick) {
    const wrap = h('div', { class: 'ai-fields' });
    for (const key of uses) {
      const f = PROMPT_FIELDS[key];
      if (!f) continue;
      const id = `aiField-${key}`;
      const sel = h('select', { id }, f.options.map((o) => h('option', { value: o.value }, o.label)));
      sel.value = fieldValue(prompt, key);
      sel.addEventListener('change', () => { rememberField(prompt, key, sel.value); if (onPick) onPick(); updatePreview(); });
      wrap.append(h('div', { class: 'ctl select-row' }, h('label', { for: id }, f.label), sel));
    }
    return wrap;
  }

  function autoEl() {
    const wrap = h('div', { class: 'ai-auto', id: 'aiAuto' });
    wrap.append(h('div', { class: 'label' }, 'From your design'));
    const chips = h('div', { class: 'ai-chips' });
    ui.chips = {};
    for (const [k, label] of AUTO) {
      const v = h('span', { class: 'v' });
      ui.chips[k] = v;
      chips.append(h('span', { class: `ai-chip${k === 'form' ? ' wide' : ''}`, 'data-auto': k }, h('span', { class: 'k' }, label), v));
    }
    wrap.append(chips);
    return wrap;
  }
  function updateChips() {
    if (!ui.chips) return;
    const a = currentAuto();
    for (const [k] of AUTO) if (ui.chips[k]) ui.chips[k].textContent = a[k];
  }

  function previewEl() {
    const wrap = h('div', { class: 'ai-preview-wrap' });
    ui.preview = h('textarea', { class: 'ai-preview', id: 'aiPreview', readonly: true, rows: '9', 'aria-label': 'Prompt preview', spellcheck: 'false' });
    ui.count = h('span', { class: 'ai-count', id: 'aiCount' });
    wrap.append(h('div', { class: 'sub-title' }, h('span', { class: 'label' }, 'Prompt preview'), ui.count), ui.preview);
    return wrap;
  }
  function updatePreview() {
    if (!ui.preview) return;
    const text = activeText();
    if (ui.preview.value !== text) ui.preview.value = text;
    if (ui.count) ui.count.textContent = `${wordCount(text)} words`;
    ui.copyBtn.disabled = !text;
  }

  function editorEl(refreshFields) {
    const e = ui.editing;
    const wrap = h('div', { class: 'ai-editor' });
    const title = h('input', { type: 'text', id: 'aiEditTitle', maxlength: '60', value: e.title, autocomplete: 'off', spellcheck: 'false', 'aria-label': 'Prompt title' });
    title.addEventListener('input', () => { e.title = title.value; updatePreview(); });
    const tpl = h('textarea', { id: 'aiEditTemplate', rows: '8', 'aria-label': 'Prompt text', spellcheck: 'true' });
    tpl.value = e.template;
    tpl.addEventListener('input', () => { e.template = tpl.value; updatePreview(); });
    wrap.append(
      h('div', { class: 'label' }, e.id ? 'Edit prompt' : 'New prompt'),
      h('label', { class: 'ai-lab', for: 'aiEditTitle' }, 'Title'), title,
      h('label', { class: 'ai-lab', for: 'aiEditTemplate' }, 'Prompt text'), tpl,
      h('p', { class: 'points-note', id: 'aiTokenHelp' }, TOKEN_HELP),
      h('div', { class: 'label' }, 'Menus to show'),
    );
    const uses = h('div', { class: 'ai-uses', role: 'group', 'aria-label': 'Menus to show' });
    for (const k of FIELD_KEYS) {
      const cb = h('input', { type: 'checkbox', id: `aiUse-${k}` });
      cb.checked = e.uses.includes(k);
      cb.addEventListener('change', () => { e.uses = FIELD_KEYS.filter((x) => (x === k ? cb.checked : e.uses.includes(x))); refreshFields(); updatePreview(); });
      uses.append(h('label', { class: 'ai-check', for: `aiUse-${k}` }, cb, h('span', null, PROMPT_FIELDS[k].label)));
    }
    wrap.append(uses);
    if (ui.error) wrap.append(h('p', { class: 'points-note bad', role: 'alert' }, ui.error));
    wrap.append(h('div', { class: 'ai-actions' },
      h('button', { class: 'btn outline sm', type: 'button', id: 'aiEditCancel', onclick: cancelEditing }, 'Cancel'),
      h('button', { class: 'btn solid sm', type: 'button', id: 'aiEditSave', onclick: saveEditing }, 'Save prompt')));
    return wrap;
  }

  function detailEl() {
    const wrap = h('div', { class: 'ai-detail' });
    if (ui.editing) {
      const host = h('div', { class: 'ai-fields-host' });
      const refreshFields = () => { host.textContent = ''; host.append(fieldsEl(activePrompt(), ui.editing.uses, null)); };
      wrap.append(editorEl(refreshFields), host, autoEl(), previewEl());
      refreshFields();
      return wrap;
    }
    const p = currentPrompt();
    if (!p) { wrap.append(h('p', { class: 'help' }, 'Select a prompt to see its fields.')); ui.preview = null; ui.chips = null; return wrap; }
    const custom = p.group === 'custom';
    const head = h('div', { class: 'ai-dhead' }, h('div', { class: 'ai-dtitle' }, p.title));
    const desc = p.description ? h('p', { class: 'ai-ddesc', id: 'aiDesc' }, p.description) : null;
    const acts = h('div', { class: 'ai-dacts' });
    if (custom) {
      acts.append(
        h('button', { class: 'btn outline sm', type: 'button', id: 'aiEdit', onclick: () => startEdit(p) }, 'Edit'),
        h('button', { class: 'btn outline sm danger-text', type: 'button', id: 'aiDelete', onclick: () => removePrompt(p) }, 'Delete'));
    } else {
      acts.append(h('button', { class: 'btn outline sm', type: 'button', id: 'aiDuplicate', onclick: () => duplicateToEdit(p) }, 'Duplicate to edit'));
    }
    head.append(acts);
    wrap.append(head);
    if (desc) wrap.append(desc);
    const uses = (p.uses || []).filter((k) => PROMPT_FIELDS[k]);
    if (uses.length) wrap.append(h('div', { class: 'label' }, 'Choose'), fieldsEl(p, uses, null));
    wrap.append(autoEl(), previewEl());
    return wrap;
  }

  function render() {
    if (!ui.el) return;
    const keepScroll = ui.body.scrollTop;
    ui.body.textContent = '';
    ui.body.append(tabsEl(), listEl(), detailEl());
    updateChips();
    updatePreview();
    syncSteps();
    ui.body.scrollTop = keepScroll;
    if (ui.editing && ui.editing.focus) {
      const f = ui.editing.focus; ui.editing.focus = null;
      const el = document.getElementById(f === 'title' ? 'aiEditTitle' : 'aiEditTemplate');
      if (el && ui.open) { try { el.focus({ preventScroll: true }); if (f === 'title') el.select(); } catch (e) { /* ignore */ } }
    }
  }

  /* ---- open / close ------------------------------------------------------------------------------ */
  function open() {
    if (!ui.el) return false;
    if (ui.open) return true;
    Pop.close();
    ui.open = true;
    { const ae = document.activeElement; ui.restoreFocus = ae && ae !== document.body && document.contains(ae) ? ae : document.getElementById('btnExport'); }
    render();
    ui.back.hidden = false;
    ui.el.setAttribute('data-open', 'true');
    ui.el.removeAttribute('aria-hidden');
    const btn = document.getElementById('btnExport');
    if (btn) btn.classList.add('is-on');
    try { ui.el.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    return true;
  }
  function close() {
    if (!ui.open) return false;
    ui.open = false;
    ui.back.hidden = true;
    ui.el.setAttribute('data-open', 'false');
    ui.el.setAttribute('aria-hidden', 'true');
    ui.toasts.textContent = '';
    const btn = document.getElementById('btnExport');
    if (btn) btn.classList.remove('is-on');
    const f = ui.restoreFocus;
    ui.restoreFocus = null;
    if (f && f.focus && document.contains(f)) { try { f.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
    return true;
  }
  const toggle = () => (ui.open ? close() : open());

  function init() {
    build();
    window.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape' || !ui.open) return;
      if (document.querySelector('.modal-back')) return;      // a confirm dialog handles its own Escape
      e.preventDefault();
      close();
    });
    // The numbers in the chips and the preview follow the design while the panel is open.
    Store.subscribe(() => {
      if (!ui.open || ui.raf) return;
      ui.raf = requestAnimationFrame(() => { ui.raf = 0; updateChips(); updatePreview(); });
    });
    Options.onImport(({ promptsAdded }) => { if (promptsAdded && ui.el) render(); });
  }

  return {
    init, open, close, toggle, copyPrompt, saveImage, isOpen: () => ui.open,
    formPhrase, autoValues, currentAuto, textFor, findPrompt, allPrompts, valuesFor,
    // the same text the preview shows for a prompt id; `values` overrides auto or pick fields
    promptText: (id, values) => { const p = findPrompt(id); return p ? textFor(p, values) : null; },
    startNew, startEdit, saveEditing, cancelEditing, duplicateToEdit, removePrompt,
    editing: () => (ui.editing ? { ...ui.editing } : null),
    setEditing: (patch) => { if (ui.editing) { Object.assign(ui.editing, patch); render(); } },
    select, render,
  };
})();

/* ==========================================================================
   FILE EXPORTS  (plan sections 4 and 5.2)
   Export menu > SketchUp (.json), Revit points (.csv), Contours (.dxf), Notes (.md). Each one reads the same build the screen shows
   (Derived.get().built) through the src/grading writers: SkGrading.gradingToSketchup, GradExportsMod.revitCsv / gradingDxf / notesMarkdown.
   The file format helpers for the SketchUp document are src/shared/sketchup-format.js (SkFmt). Every action returns { ok, filename, blob, ... }
   and takes `{ deliver }` so tests can catch the file instead of downloading it.
   ========================================================================== */
const FileExports = (() => {
  const slug = (name) => String(name || 'grading').trim().replace(/[^\w\-]+/g, '-').replace(/^-+|-+$/g, '').toLowerCase() || 'grading';
  const stamp = () => { const d = new Date(), p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
  function save(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);   // revoking sooner can break some downloads
  }
  const fail = (what, e) => { console.error(e); Toast.show(`The ${what} could not be built for these settings.`, 'bad'); return { ok: false, errors: [String(e && e.message)] }; };
  const meta = (s) => ({ name: s.name, date: stamp(), source: s.source, groundNote: s.ground.mode === 'site' ? 'Existing ground from the project site (NAVD88 feet).' : 'Existing ground is the typed plane (local feet).' });

  /* ---- SketchUp ---- */
  function sketchupDoc(state, built) {
    const s = state || Store.raw();
    const d = built ? { built, metrics: GradMetricsMod.computeMetrics(s, built) } : Derived.get();
    return SkGrading.gradingToSketchup(s, d.built, d.metrics, { name: s.name });
  }
  const sketchupName = (state) => SkFmt.sketchupFilename((state || Store.raw()).name);
  function sketchup({ deliver } = {}) {
    let d;
    try { d = sketchupDoc(); } catch (e) { return fail('SketchUp file', e); }
    const v = SkFmt.validateDoc(d);
    if (!v.ok) { console.error(v.errors); Toast.show('The SketchUp file did not pass its own check, so it was not saved.', 'bad'); return { ok: false, errors: v.errors }; }
    if (!v.counts.solid && !v.counts.mesh) { Toast.show('Nothing to export yet.', 'warn'); return { ok: false, errors: ['empty'] }; }
    const name = sketchupName();
    const blob = SkFmt.docToBlob(d);
    (deliver || save)(blob, name);
    if (!deliver) Toast.show(`Saved ${name}. In SketchUp: Extensions > CMRLM > Import Design Tools file.`);
    return { ok: true, filename: name, blob, counts: v.counts };
  }

  /* ---- Revit points ---- */
  const revitText = () => GradExportsMod.revitCsv(Derived.get().built);
  function revit({ deliver } = {}) {
    let text;
    try { text = revitText(); } catch (e) { return fail('points file', e); }
    const name = `${slug(Store.get('name'))}-${stamp()}-ground-points.csv`;
    const blob = new Blob([text], { type: 'text/csv' });
    (deliver || save)(blob, name);
    if (!deliver) Toast.show(`Saved ${name}. In Revit: Toposurface > Create from Import > Specify Points File.`);
    return { ok: true, filename: name, blob, text };
  }

  /* ---- DXF ---- */
  const dxfText = () => { const d = Derived.get(); return GradExportsMod.gradingDxf(Store.raw(), d.built, d.metrics); };
  function dxf({ deliver } = {}) {
    let text;
    try { text = dxfText(); } catch (e) { return fail('DXF file', e); }
    const name = `${slug(Store.get('name'))}-${stamp()}-grading.dxf`;
    const blob = new Blob([text], { type: 'application/dxf' });
    (deliver || save)(blob, name);
    if (!deliver) Toast.show(`Saved ${name}`);
    return { ok: true, filename: name, blob, text };
  }

  /* ---- Notes ---- */
  const notesText = () => { const d = Derived.get(), s = Store.raw(); return GradExportsMod.notesMarkdown(s, d.built, d.metrics, meta(s)); };
  function notes({ deliver } = {}) {
    let text;
    try { text = notesText(); } catch (e) { return fail('notes file', e); }
    const name = `${slug(Store.get('name'))}-${stamp()}-grading-notes.md`;
    const blob = new Blob([text], { type: 'text/markdown' });
    (deliver || save)(blob, name);
    if (!deliver) Toast.show(`Saved ${name}`);
    return { ok: true, filename: name, blob, text };
  }
  return { sketchupDoc, sketchupName, sketchup, revitText, revit, dxfText, dxf, notesText, notes, save };
})();

/* ==========================================================================
   SECTION VIEW  (plan section 5.3)
   A 2D profile under the 3D view for the section line (view.section, two points). The existing ground is dashed, the proposed ground
   solid, pads are bars at pad top, walls are heavy ticks with their heights. Sampled every 1 ft. Elevations are labeled at the ends and
   at the high and low points. Redraws when the design changes (not while a handle moves: only the numbers are cheap enough there, so
   it follows the draft build). Hidden when there is no section line.
   ========================================================================== */
const SectionView = (() => {
  const $ = (id) => document.getElementById(id);
  let canvas = null, ctx = null, last = null, raf = 0;
  const css = (name, fb) => getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fb;

  /** The profile of the line a-b: samples every 1 ft { s, x, y, ex, pr } plus the pads and walls crossed. Pure (tests call it). */
  function profile(a, b, d) {
    const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const n = Math.max(1, Math.ceil(L - 1e-9));
    const samples = [];
    for (let i = 0; i <= n; i++) {
      const f = i / n, x = a[0] + (b[0] - a[0]) * f, y = a[1] + (b[1] - a[1]) * f;
      samples.push({ s: L * f, x, y, ex: d.built.existingAt(x, y), pr: d.built.surface.at(x, y) });
    }
    const pads = [];
    for (const t of d.built.tiers) {
      for (const ring of (t.pads || [])) {
        let inside = false, s0 = 0;
        samples.forEach((p, i) => {
          const hit = pointInRing(p.x, p.y, ring);
          if (hit && !inside) { inside = true; s0 = p.s; }
          if ((!hit || i === samples.length - 1) && inside) { inside = false; pads.push({ id: t.id, s0, s1: p.s, z: t.padTop }); }
        });
      }
    }
    const walls = [];
    for (const w of d.metrics && d.metrics.walls ? d.built.walls : []) {
      for (let i = 0; i + 1 < w.line.length; i++) {
        const c = segCross(a, b, w.line[i], w.line[i + 1]);
        if (c) {
          const h = Math.abs(d.built.surface.at(c.x + 0.01 * (b[1] - a[1]) / (L || 1), c.y - 0.01 * (b[0] - a[0]) / (L || 1)) - d.built.surface.at(c.x - 0.01 * (b[1] - a[1]) / (L || 1), c.y + 0.01 * (b[0] - a[0]) / (L || 1)));
          walls.push({ id: w.id, s: c.t * L, z: d.built.surface.at(c.x, c.y), h });
        }
      }
    }
    let lo = Infinity, hi = -Infinity;
    for (const p of samples) { lo = Math.min(lo, p.ex, p.pr); hi = Math.max(hi, p.ex, p.pr); }
    for (const p of pads) { lo = Math.min(lo, p.z); hi = Math.max(hi, p.z); }
    return { length: L, samples, pads, walls, lo, hi };
  }

  function draw(pr, w, h) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    canvas.style.width = `${w}px`; canvas.style.height = `${h}px`;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const ink = css('--ink', '#1b2733'), muted = css('--ink-3', '#6b7785'), accent = css('--accent', '#23508f'), line = css('--line', '#cfd6de');
    ctx.clearRect(0, 0, w, h);
    ctx.font = '11px system-ui, sans-serif';
    const padL = 58, padR = 16, padT = 16, padB = 26;
    const iw = Math.max(40, w - padL - padR), ih = Math.max(40, h - padT - padB);
    const span = Math.max(2, pr.hi - pr.lo), lo = pr.lo - span * 0.12, hi = pr.hi + span * 0.12;
    const X = (s) => padL + (s / Math.max(1, pr.length)) * iw;
    const Y = (z) => padT + (1 - (z - lo) / (hi - lo)) * ih;
    // grid and elevation labels
    ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.fillStyle = muted; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    const ticks = 4;
    for (let i = 0; i <= ticks; i++) {
      const z = lo + ((hi - lo) * i) / ticks, y = Y(z);
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + iw, y); ctx.globalAlpha = 0.5; ctx.stroke(); ctx.globalAlpha = 1;
      ctx.fillText(Units.formatElev(z), padL - 6, y);
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const stepS = pr.length > 400 ? 100 : pr.length > 150 ? 50 : pr.length > 60 ? 20 : 10;
    for (let s = 0; s <= pr.length + 1e-6; s += stepS) ctx.fillText(Units.formatFeetInches(s), X(s), padT + ih + 6);
    // pads
    ctx.fillStyle = accent; ctx.globalAlpha = 0.25;
    for (const p of pr.pads) ctx.fillRect(X(p.s0), Y(p.z) - 2, Math.max(1, X(p.s1) - X(p.s0)), 4);
    ctx.globalAlpha = 1;
    // existing (dashed)
    const path = (key) => { ctx.beginPath(); pr.samples.forEach((p, i) => { const x = X(p.s), y = Y(p[key]); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); }); ctx.stroke(); };
    ctx.strokeStyle = muted; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]); path('ex'); ctx.setLineDash([]);
    // proposed (solid)
    ctx.strokeStyle = ink; ctx.lineWidth = 2; path('pr');
    // walls
    ctx.textBaseline = 'bottom'; ctx.fillStyle = CONFIG.wallFlagColor;
    for (const wl of pr.walls) {
      ctx.strokeStyle = wl.h > num(Store.get('limits.wallFlag'), 4) ? CONFIG.wallFlagColor : ink; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(X(wl.s), Y(wl.z)); ctx.lineTo(X(wl.s), Y(wl.z - wl.h)); ctx.stroke();
      ctx.fillText(`${wl.h.toFixed(1)} ft`, X(wl.s), Y(wl.z) - 3);
    }
    // end elevations
    ctx.fillStyle = ink; ctx.textBaseline = 'bottom';
    const first = pr.samples[0], endp = pr.samples[pr.samples.length - 1];
    ctx.textAlign = 'left'; ctx.fillText(`A  ${Units.formatElev(first.pr)}`, X(0) + 3, Y(first.pr) - 4);
    ctx.textAlign = 'right'; ctx.fillText(`B  ${Units.formatElev(endp.pr)}`, X(pr.length) - 3, Y(endp.pr) - 4);
    // legend
    ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillStyle = muted;
    ctx.fillText('Existing (dashed)  Proposed (solid)  Pads', padL + 4, 2);
  }

  function render() {
    raf = 0;
    const panel = $('sectionPanel');
    if (!panel) return;
    const sec = Store.get('view.section');
    panel.hidden = !sec || Render.comparing();
    document.getElementById('viewport').dataset.section = panel.hidden ? 'false' : 'true';
    if (panel.hidden) { last = null; return; }
    const d = Derived.get();
    if (!d.ok) return;
    last = profile(sec[0], sec[1], d);
    const host = $('sectionHost');
    const w = Math.max(200, host.clientWidth), h = Math.max(80, host.clientHeight);
    draw(last, w, h);
    const t = $('sectionTitle');
    if (t) t.textContent = `Section A to B · ${Units.formatFeetInches(last.length)} long · every 1 ft`;
  }
  const schedule = () => { if (!raf) raf = requestAnimationFrame(render); };

  function init() {
    const panel = $('sectionPanel');
    if (!panel) return;
    canvas = h('canvas', { id: 'sectionCanvas', role: 'img', 'aria-label': 'Section profile of the existing and the proposed ground' });
    ctx = canvas.getContext('2d');
    $('sectionHost').append(canvas);
    $('sectionClose').addEventListener('click', () => Store.set('view.section', null, { live: false }));
    Store.subscribe(schedule);
    Render.onRebuild(schedule);
    window.addEventListener('resize', schedule);
    schedule();
  }
  return { init, profile, render, info: () => (last ? { length: last.length, samples: last.samples.length, pads: last.pads.length, walls: last.walls.length, lo: last.lo, hi: last.hi } : null), visible: () => { const p = $('sectionPanel'); return !!p && !p.hidden; } };
})();
