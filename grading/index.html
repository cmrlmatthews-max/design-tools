/* ==========================================================================
   SHARED: storage
   src/shared/storage.js (inlined with the other modules),
   plus `Options`, the page's glue: save, duplicate, rename, delete, the
   option menu, export / import, autosave and restore.
   Custom AI prompts ride in the same blob (storage.listPrompts / savePrompt / removePrompt).
   Saved options live under localStorage key `grading.options.v1`; the
   working copy autosaves into the "__current" slot after a 1 s pause.
   ========================================================================== */
const Options = (() => {
  const storage = StorageMod.createStorage({
    key: CONFIG.storageKey, schema: CONFIG.schema, migrate: (s) => s, filePrefix: 'grading-options',
    onNotice: (message) => Toast.show(message, 'warn', 7000),
  });
  let currentId = null;            // the saved option the working copy came from (null = unsaved)
  let savedPrint = null;           // fingerprint of that option's state, to show "unsaved changes"
  let dirtyTimer = null;
  let autosaveHeld = false;       // tests hold the autosave so a ?test visit cannot overwrite the saved working copy

  const fingerprint = (s) => JSON.stringify({ ...s, name: '' });
  const savedNames = () => storage.list().map((o) => o.name);
  const quoted = (name) => `“${name}”`;

  function syncDirty() {
    clearTimeout(dirtyTimer);
    const dot = document.getElementById('unsavedDot');
    const dirty = !currentId || savedPrint !== fingerprint(Store.raw());
    if (dot) dot.hidden = !dirty;
    const btn = document.getElementById('btnSave');
    if (btn) btn.classList.toggle('is-on', dirty);
    return dirty;
  }
  function link(id, state) {
    currentId = id || null;
    uiPrefs.currentId = currentId;
    saveUiPrefs(uiPrefs);
    savedPrint = currentId ? fingerprint(state || Store.raw()) : null;
    syncDirty();
  }
  /** While a project is open, a design that replaces the one on screen keeps the project's ground: the site ground stays the existing ground. */
  function keepProject(s) {
    if (!(typeof ProjectUI !== 'undefined' && ProjectUI.has())) return s;
    const cur = Store.raw();
    if (cur.source === 'project') s.source = 'project';
    if (cur.ground.mode === 'site' && ProjectUI.hasSiteGround()) s.ground.mode = 'site';
    return s;
  }
  const reframe = () => {
    if (!Render.ready()) return;
    const p = Render.info().preset;
    Render.setView(p || 'axon', true);
  };

  /** Put a state on screen as the working copy. Undo brings the previous design back. */
  function show(raw, { id = null, name } = {}) {
    const s = fillDefaults(raw);
    if (name) s.name = name;
    keepProject(s);
    if (Render.comparing()) Compare.exit();
    Store.replace(s);
    link(id, s);
    reframe();
    return s;
  }

  function loadOption(id) {
    const rec = storage.get(id);
    if (!rec) { Toast.show('That option is no longer saved.', 'warn'); return false; }
    show(rec.state, { id: rec.id, name: rec.name });
    Toast.show(`Opened ${quoted(rec.name)}. Undo brings your last design back.`);
    return true;
  }
  /** A preset becomes a new, unsaved option. */
  function loadPreset(id) {
    const p = CONFIG.presets.find((x) => x.id === id);
    if (!p) return false;
    const s = fillDefaults(p.state);
    show(s, { id: null, name: p.name });
    Toast.show(`Started from the preset ${quoted(p.name)}. It is not saved yet.`);
    return true;
  }

  /** Unsaved changes = a design linked to a saved option that no longer matches it, or an unsaved design that differs from the default
   *  (an untouched new design has nothing to lose). The name is ignored, as in the dot next to Save. */
  function hasUnsavedChanges() {
    const rec = currentId && storage.get(currentId);
    return rec ? savedPrint !== fingerprint(Store.raw()) : fingerprint(Store.raw()) !== fingerprint(defaultState());
  }
  /** Start fresh from the built-in default (what a first-ever visit gets) as a new, unsaved option named "Untitled" ("Untitled (2)"
   *  when taken). Saved options are never touched. One undo step brings the previous design back (its name is part of the state;
   *  like loadPreset, the link to a saved option is not restored). Resolves true when it happened, false when the user cancelled. */
  async function newDesign({ confirm = true } = {}) {
    if (confirm && hasUnsavedChanges()) {
      const ok = await confirmDialog(`Start a new design? Unsaved changes to ${quoted(Store.get('name') || 'this design')} will be lost. You can undo this.`, 'Start new');
      if (!ok) return false;
    }
    Select.clear();
    Prompts.close();
    if (Render.comparing()) Compare.exit();
    const s = defaultState();
    s.name = uniqueName0('Untitled');
    keepProject(s);
    Store.replace(s);
    link(null, s);
    if (Render.ready()) Render.setView('axon', true);       // always Axon, whatever view was on screen
    Toast.show('New design started.');
    return true;
  }

  function save() {
    const state = Store.snapshot();
    const known = currentId && storage.get(currentId);
    if (known) {
      storage.update(currentId, state, state.name);
      link(currentId, state);
      Toast.show(`Saved ${quoted(state.name)}`);
    } else {
      const name = uniqueName0(state.name);
      if (name !== state.name) Store.set('name', name, { live: false });
      const id = storage.save(Store.snapshot(), name);
      link(id);
      Toast.show(`Saved ${quoted(name)}`);
    }
    return currentId;
  }
  const uniqueName0 = (name, extra = []) => StorageMod.uniqueName(name, [...savedNames(), ...extra]);

  function duplicate() {
    const base = Store.snapshot();
    const name = uniqueName0(base.name, [base.name]);
    Store.set('name', name, { live: false });
    const id = storage.save(Store.snapshot(), name);
    link(id);
    Toast.show(`Saved a copy as ${quoted(name)}`);
    return id;
  }

  function rename(next) {
    const name = String(next || '').trim().slice(0, 60) || 'Option A';
    Store.set('name', name, { live: false });
    if (currentId && storage.get(currentId)) storage.rename(currentId, name);
    const field = document.getElementById('optionName');
    if (field) field.value = Store.get('name');
    syncDirty();
  }

  async function remove() {
    const rec = currentId && storage.get(currentId);
    if (!rec) { Toast.show('This option is not saved, so there is nothing to delete.', 'warn'); return false; }
    const ok = await confirmDialog(`Delete ${quoted(rec.name)} from the saved options? The design on screen stays open.`, 'Delete', true);
    if (!ok) return false;
    storage.remove(rec.id);
    link(null);
    Toast.show(`Deleted ${quoted(rec.name)}. The design on screen is now unsaved.`);
    return true;
  }

  const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
  const importListeners = [];
  function exportJson() {
    const n = storage.list().length, np = storage.listPrompts().length;
    if (!n && !np) { Toast.show('Nothing to export yet. Save an option first.', 'warn'); return false; }
    storage.downloadExport();
    Toast.show(`Exported ${[n ? plural(n, 'option') : '', np ? plural(np, 'custom prompt') : ''].filter(Boolean).join(' and ')}`);
    return true;
  }
  async function importFile(file) {
    try {
      const { added, skipped, promptsAdded } = await storage.importFile(file);
      const parts = [added || !promptsAdded ? plural(added, 'option') : '', promptsAdded ? plural(promptsAdded, 'custom prompt') : ''].filter(Boolean);
      Toast.show(`Imported ${parts.join(' and ')}${skipped ? `, ${skipped} skipped` : ''}.${added ? ' Open the options from the Option menu.' : ''}`);
      importListeners.forEach((fn) => fn({ added, skipped, promptsAdded }));
      return { added, skipped, promptsAdded };
    } catch (e) {
      Toast.show(e && e.message ? e.message : 'The file could not be imported.', 'bad', 7000);
      return { added: 0, skipped: 0, error: String(e && e.message) };
    }
  }

  const when = (t) => { try { return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); } catch (e) { return ''; } };
  function openMenu(anchor) {
    const el = h('div', { role: 'menu', id: 'optionMenu' });
    const item = (title, sub, onclick, o = {}) => h('button', { class: 'pop-item', type: 'button', role: 'menuitem', id: o.id, disabled: o.disabled, onclick: () => { if (!o.keep) Pop.close(); onclick(); } },
      h('span', { class: 'tick' }, o.tick ? '✓' : ''), h('span', { class: 'grow' }, title, sub ? h('small', null, sub) : null));

    // The option name is edited here. It is committed when the field changes or the menu closes.
    const nameField = h('input', { class: 'pop-name', id: 'optionName', type: 'text', maxlength: '60', spellcheck: 'false', autocomplete: 'off', 'aria-label': 'Option name', value: Store.get('name') || '' });
    const commitName = () => { if (nameField.value.trim() !== (Store.get('name') || '')) rename(nameField.value); };
    nameField.addEventListener('change', commitName);
    nameField.addEventListener('keydown', (e) => { if (e.key === 'Enter') { commitName(); Pop.close(); } });
    el.append(
      item('New design', 'Start fresh from the default bar on a slope', () => { newDesign(); }, { id: 'miNewDesign' }),
      h('div', { class: 'pop-sep' }),
    );
    el.append(h('div', { class: 'label pop-label' }, 'Option name'), h('div', { style: 'padding:0 6px 4px' }, nameField));

    el.append(h('div', { class: 'label pop-label' }, 'This option'));
    el.append(
      item('Save', 'Keep the design as it is now', save, { id: 'miSave' }),
      item('Duplicate', 'Save a copy as a new option', duplicate, { id: 'miDuplicate' }),
      item('Rename', 'Edit the name above', () => { nameField.focus(); nameField.select(); }, { id: 'miRename', keep: true }),
      item('Delete', 'Remove it from the saved options', remove, { id: 'miDelete', disabled: !currentId }),
      item(Compare.isActive() ? 'Exit compare' : 'Compare', 'Compare 2 to 4 options side by side', () => Compare.toggle(), { id: 'miCompare' }),
    );
    el.append(h('div', { class: 'pop-sep' }), h('div', { class: 'label pop-label' }, 'Saved options'));
    const saved = storage.list();
    if (!saved.length) el.append(h('div', { class: 'pop-note' }, 'Nothing saved yet. Use Save to keep this design.'));
    for (const o of saved) el.append(item(o.name, `Saved ${when(o.updatedAt)}`, () => loadOption(o.id), { tick: o.id === currentId }));
    el.append(h('div', { class: 'pop-sep' }), h('div', { class: 'label pop-label' }, 'New from a preset'));
    for (const p of CONFIG.presets) el.append(item(p.name, p.description, () => loadPreset(p.id), { id: `preset-${p.id}` }));
    Pop.open(anchor, el, { onClose: commitName });
  }

  function init({ restore = true } = {}) {
    if (restore) {
      const saved = storage.loadAutosave();
      if (saved) {
        const s = fillDefaults(saved);
        Store.replace(s, { resetHistory: true });
        const rec = uiPrefs.currentId && storage.get(uiPrefs.currentId);
        if (rec) link(rec.id, fillDefaults(rec.state)); else link(null);
      } else link(null);
    } else link(null);
    Store.subscribe((s, info) => {
      if (!autosaveHeld) storage.autosave(s);
      if (!info || !info.live) { clearTimeout(dirtyTimer); dirtyTimer = setTimeout(syncDirty, 250); }
    });
    const input = document.getElementById('importFile');
    input.addEventListener('change', async () => {
      const file = input.files && input.files[0];
      input.value = '';
      if (file) await importFile(file);
    });
  }

  return {
    onImport: (fn) => importListeners.push(fn),
    holdAutosave: (v) => { autosaveHeld = !!v; },
    init, save, duplicate, rename, remove, openMenu, loadOption, loadPreset, newDesign, hasUnsavedChanges, exportJson, importFile, syncDirty,
    list: () => storage.list(), get: (id) => storage.get(id), flush: () => storage.flush(),
    current: () => currentId, storage,
  };
})();

/* ==========================================================================
   PROJECT FILE  (docs/project-file-spec.md; plan section 7)
   `ProjectUI` is the glue between the page and src/shared/project.js (ProjectMod).
   With ?project=<id> the page opens that project. buildGrading reads the project (it is the only reader): the "site" section (ground,
   boundary, roads, neighbors), the "massing" section (footprint) and the "parking" section (levels). This file hands the document to
   the pipeline through dataDoc() and writes the "grading" section back after every change (1 s debounce, and on visibilitychange /
   pagehide). The grading section always has the identity placement: the plan is in the project frame.
   Without a project nothing here runs until the Project menu is used; the tool works standalone.
   ProjectMod.writeSection returns a new project and does not change the one it gets. So a save loads the project
   fresh from storage, writes the section on that copy and saves it (another tool may have saved from a second tab).
   Every storage call is inside try/catch. Tests inject storage, navigation and the address bar with configure().
   ========================================================================== */
const ProjectUI = (() => {
  const $ = (id) => document.getElementById(id);
  const ZERO = () => ({ x: 0, y: 0, rotation: 0, baseZ: 0 });
  const READ_ONLY_TEXT = 'This project was saved by a newer version of this tool. You can view it, but changes will not be saved.';
  const NO_STORAGE_TEXT = 'Saving is unavailable in this browser, so the project is kept only until you close this page.';
  const project = {
    doc: null, timer: 0, dirty: false, readOnly: false, loading: false, noted: {},
    renamed: null,
    storage: null,
    navigate: (url) => { window.location.assign(url); },
    updateUrl: (id) => {
      try {
        const u = new URL(window.location.href);
        if (id) u.searchParams.set('project', id); else u.searchParams.delete('project');
        window.history.replaceState(null, '', u.pathname + u.search + u.hash);
      } catch (e) { /* the address bar is a convenience */ }
    },
  };
  const DEFAULT_NAV = project.navigate, DEFAULT_URL = project.updateUrl;
  const isObjP = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);

  function storageOf() {
    if (project.storage) return project.storage;
    try { return window.localStorage; } catch (e) { return null; }
  }
  function noticeOnce(key, message, kind = 'warn', ms = 9000) {
    if (project.noted[key]) return;
    project.noted[key] = true;
    Toast.show(message, kind, ms);
  }
  const storageNotice = () => ({ onNotice: (message) => noticeOnce(`storage:${message}`, String(message)) });

  /* ---- reading the project ------------------------------------------------------------------ */
  const has = () => !!project.doc;
  function sectionOf(key) {
    if (!project.doc) return null;
    try { return ProjectMod.getSection(project.doc, key); } catch (e) { return null; }
  }
  const placement = () => ZERO();

  /* ---- reading the project (plan section 7) ---------------------------------------------------- */
  const hasSection = (key) => !!sectionOf(key);
  const hasMassing = () => hasSection('massing');
  const hasParking = () => hasSection('parking');
  const hasSiteGround = () => { const sec = sectionOf('site'); return !!(sec && sec.derived && sec.derived.ground); };
  const massingLevels = () => {
    const sec = sectionOf('massing');
    const dv = sec && sec.derived;
    return dv && Array.isArray(dv.levels) ? dv.levels : [];
  };
  /** The project document the layout, the overlay and the metrics read (null without a project). */
  const dataDoc = () => project.doc || null;
  /** A key that changes when the site, massing or parking data changes (not when this tool saves its own section). */
  function dataKey() {
    if (!project.doc) return '';
    const m = sectionOf('massing'), p = sectionOf('parking'), si = sectionOf('site');
    return `${project.doc.id}|${(m && m.updatedAt) || ''}|${(p && p.updatedAt) || ''}|${(si && si.updatedAt) || ''}`;
  }
  /** What the open project offers: { has, tool, levels, noLevels, parking, site }. */
  function massingInfo() {
    const sec = sectionOf('massing');
    const list = massingLevels().filter((l) => l && Array.isArray(l.plates) && l.plates.length);
    return { has: !!sec, tool: sec ? (sec.tool || null) : null, levels: list.length, noLevels: !!sec && list.length === 0, parking: hasParking(), site: hasSiteGround() };
  }
  const massingPlacement = () => null;
  /** The site neighbors in the project frame: [{ id, name, outer, holes, base, height }]. */
  function contextPolys() {
    if (!project.doc) return [];
    try { return ProjectMod.siteContextFor(project.doc, ZERO(), CONFIG.contextRadius).polygons || []; } catch (e) { return []; }
  }
  const isDefaultBar = (b) => b.source === 'typed' && JSON.stringify(b.outer) === JSON.stringify(defaultState().buildings[0].outer) && (b.tiers || []).length === 1;
  const projectBuilding = (source, n) => ({ id: `${source === 'massing' ? 'M' : 'P'}${n}`, name: source === 'massing' ? 'Massing' : 'Parking deck', source, axis: 'auto', tiers: [{ length: null, ffe: 'balance' }], padOffset: 5, padDepth: 1 });
  /**
   * Takes the open project as the source (plan section 7): the site ground becomes the existing ground, and the massing and the parking
   * deck become buildings when the state has none of that source. An untouched default bar makes room for them. One undo step.
   * Returns true when the project offers any of the three.
   */
  function useProject({ quiet = false } = {}) {
    if (!project.doc || !(hasSiteGround() || hasMassing() || hasParking())) { if (!quiet) Toast.show('Open a project that has a site, a massing or a parking deck first (Project menu).', 'warn', 6000); return false; }
    const next = deepClone(Store.raw());
    next.source = 'project';
    if (hasSiteGround()) next.ground.mode = 'site';
    const add = [];
    if (hasMassing() && !next.buildings.some((b) => b.source === 'massing')) add.push(projectBuilding('massing', 1));
    if (hasParking() && !next.buildings.some((b) => b.source === 'parking')) add.push(projectBuilding('parking', 1));
    if (add.length) {
      if (next.buildings.length === 1 && isDefaultBar(next.buildings[0])) next.buildings = [];
      next.buildings.push(...add);
    }
    Store.replace(fillDefaults(next));
    if (!quiet) {
      const info = massingInfo();
      Toast.show(info.noLevels ? 'The project massing has no levels yet.' : `Project: ${[hasSiteGround() ? 'site ground' : null, hasMassing() ? 'massing' : null, hasParking() ? 'parking deck' : null].filter(Boolean).join(', ')}.`);
    }
    return true;
  }
  /** Back to the free-standing design: the project buildings go, and the typed plane is the ground. */
  function useStandalone() {
    const cur = Store.raw();
    if (cur.source === 'standalone') return false;
    const next = deepClone(cur);
    next.source = 'standalone';
    next.ground.mode = 'plane';
    next.buildings = next.buildings.filter((b) => b.source === 'typed');
    if (!next.buildings.length) next.buildings = defaultState().buildings;
    Store.replace(fillDefaults(next));
    return true;
  }

  /* ---- writing the project ---------------------------------------------------------------------- */
  function renderPill() {
    const doc = project.doc, pill = $('projPill');
    if (pill) {
      pill.hidden = !doc;
      if (doc) { pill.textContent = `${doc.name}${project.readOnly ? ' (read only)' : ''}`; pill.title = `Project: ${pill.textContent}`; }
    }
    const line = $('projLine');
    if (line && doc) {
      const bits = [hasSiteGround() ? 'site ground' : null, hasMassing() ? 'massing' : null, hasParking() ? 'parking deck' : null].filter(Boolean);
      line.textContent = `Project “${doc.name}”${project.readOnly ? ' (read only)' : ''}. ${bits.length ? `It has: ${bits.join(', ')}.` : 'It has no site, massing or parking deck yet.'}`;
    }
  }
  function openCheck(doc) {
    let sec = null;
    try { sec = ProjectMod.getSection(doc, 'grading'); } catch (e) { sec = null; }
    const newer = (sec && Number(sec.schema) > CONFIG.projectSchema) || Number(doc.version) > Number(ProjectMod.VERSION || 1);
    return { sec, newer };
  }

  function markDirty() {
    if (!project.doc || project.loading) return;
    project.dirty = true;
    clearTimeout(project.timer);
    project.timer = setTimeout(() => { flush(); }, CONFIG.projectSaveMs);
  }
  function saveFailureText(res) {
    if (!res) return NO_STORAGE_TEXT;
    return String(res.warning || 'The project could not be saved.');
  }
  /** The "grading" section patch for the design on screen. */
  function sectionPatch() {
    const st = Store.snapshot();
    const d = Derived.get();
    const derived = GradDerivedMod.gradingDerived(st, d.built, d.metrics);
    return { tool: CONFIG.tool, schema: CONFIG.projectSchema, placement: ZERO(), state: st, derived, note: st.name };
  }
  /**
   * Writes the grading section and saves the project. Loads the project fresh from storage first, writes the section on that copy,
   * saves it. Returns saveProject's result, { ok: true, skipped: true } when there is nothing to do, or { ok: false }.
   */
  function flush() {
    clearTimeout(project.timer);
    project.timer = 0;
    const doc = project.doc;
    if (!doc || project.readOnly || !project.dirty) return { ok: true, skipped: true };
    const opts = storageNotice();
    let patch;
    try { patch = sectionPatch(); } catch (e) {
      console.error(e);
      Toast.show(`The project could not be updated. ${e && e.message ? e.message : ''}`.trim(), 'bad', 8000);
      return { ok: false };
    }
    let base = doc;
    try { base = ProjectMod.loadProject(storageOf(), doc.id, opts) || doc; } catch (e) { base = doc; }
    let next = null;
    try { next = ProjectMod.writeSection(base, 'grading', patch); } catch (e) {
      if (e && e.readOnly) { project.readOnly = true; renderPill(); noticeOnce('readonly', e.message || READ_ONLY_TEXT); return { ok: false, readOnly: true }; }
      console.error(e);
      Toast.show(`The project could not be updated. ${e && e.message ? e.message : ''}`.trim(), 'bad', 8000);
      return { ok: false };
    }
    if (project.renamed) next.name = project.renamed;
    project.doc = next;
    let res = null;
    try { res = ProjectMod.saveProject(storageOf(), next, opts); } catch (e) { console.error(e); }
    if (!res || res.ok === false) {
      noticeOnce(`save:${(res && res.warning) || ''}`, saveFailureText(res), 'bad', 12000);
      return res || { ok: false };
    }
    project.dirty = false;
    project.renamed = null;
    if (res.warning) noticeOnce('warning', String(res.warning));
    renderPill();
    return res;
  }

  /* ---- opening, creating, closing -------------------------------------------------------------- */
  /** Makes `doc` the open project. A grading section of this tool is loaded; otherwise the design on screen starts on the project (site ground, massing, parking). */
  function openDoc(doc, { startup = false } = {}) {
    if (project.doc && project.doc !== doc) flush();
    clearTimeout(project.timer);
    const { sec, newer } = openCheck(doc);
    Object.assign(project, { doc, timer: 0, dirty: false, readOnly: !!newer, renamed: null });
    if (newer) noticeOnce('readonly', READ_ONLY_TEXT);
    project.loading = true;
    let started = false;
    try {
      const mine = sec && sec.tool === CONFIG.tool && isObjP(sec.state) && Object.keys(sec.state).length;
      if (mine) Store.replace(fillDefaults({ ...sec.state }), { resetHistory: startup });
      else { Store.replace(fillDefaults(deepClone(Store.raw())), { resetHistory: startup }); started = true; }
    } finally { project.loading = false; }
    if (started) {
      project.loading = true;
      try { useProject({ quiet: true }); } finally { project.loading = false; }
      if (!project.readOnly) markDirty();
    }
    renderPill();
    if (Render.ready()) Render.setView(Render.info().preset || 'axon', true);
    return doc;
  }
  /** Forgets the open project (the saved copy stays where it is). */
  function close() {
    flush();
    clearTimeout(project.timer);
    Object.assign(project, { doc: null, timer: 0, dirty: false, readOnly: false, renamed: null });
    project.loading = true;
    try {
      useStandalone();
    } finally { project.loading = false; }
    project.updateUrl(null);
    renderPill();
  }
  const defaultName = () => (String(Store.get('name') || '').trim() || 'New project').slice(0, 80);
  /** New project (a local frame) holding the design on screen. Returns the doc or null. */
  function create(name, { quiet = false } = {}) {
    flush();
    const title = String(name || '').trim().slice(0, 80) || defaultName();
    let doc;
    try { doc = ProjectMod.newProject({ name: title }); } catch (e) {
      console.error(e);
      Toast.show(`The project could not be made. ${e && e.message ? e.message : ''}`.trim(), 'bad', 8000);
      return null;
    }
    Object.assign(project, { doc, timer: 0, dirty: true, readOnly: false, renamed: null });
    project.loading = true;
    project.loading = false;
    const saved = flush();
    project.updateUrl(doc.id);
    renderPill();
    if (!quiet && saved && saved.ok !== false) Toast.show(`Project ${project.doc.name} created.`);
    return project.doc;
  }
  function rename(name) {
    const next = String(name || '').trim().slice(0, 80);
    if (!project.doc || !next || next === project.doc.name) return false;
    project.doc = { ...project.doc, name: next };
    project.renamed = next;
    project.dirty = true;
    renderPill();
    markDirty();
    return true;
  }

  function openById(id) { flush(); project.navigate(`${location.pathname}?project=${encodeURIComponent(id)}`); }
  async function exportFile() {
    const doc = project.doc;
    if (!doc) return false;
    project.dirty = true;
    flush();
    try {
      const { filename, blob } = ProjectMod.exportProject(project.doc);
      const res = await ShotMod.deliverImage(blob, filename);
      if (res === 'downloaded') Toast.show(`Saved ${filename}`);
      return filename;
    } catch (e) { console.error(e); Toast.show(`The project file could not be made. ${e && e.message ? e.message : ''}`.trim(), 'bad', 6000); return false; }
  }
  async function importFile(file) {
    flush();
    try {
      const res = await ProjectMod.importProject(file, storageOf(), storageNotice());
      const doc = res && res.doc;
      if (!doc) throw new Error('The file could not be read.');
      openDoc(doc);
      project.updateUrl(doc.id);
      Toast.show(res.renamed ? `Imported as ${doc.name}.` : `Imported ${doc.name}.`);
      if (res.warning) noticeOnce('warning', String(res.warning));
      return doc;
    } catch (e) { console.error(e); Toast.show(e && e.message ? e.message : 'The file could not be imported.', 'bad', 8000); return null; }
  }
  /** When the page comes back to the front, another tool may have changed the massing: take the fresh project data. */
  function reloadData() {
    if (!project.doc || project.dirty) return false;
    let fresh = null;
    try { fresh = ProjectMod.loadProject(storageOf(), project.doc.id, storageNotice()); } catch (e) { fresh = null; }
    if (!fresh) return false;
    const before = dataKey();
    project.doc = fresh;
    if (dataKey() !== before) { renderPill(); Render.requestRender(); return true; }
    return false;
  }

  /* ---- Project menu -------------------------------------------------------------------------------- */
  const whenText = (t) => { try { const d = new Date(t); return Number.isNaN(d.getTime()) ? '' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); } catch (e) { return ''; } };
  const bytesText = (b) => (Number.isFinite(b) && b > 0 ? (b >= 1048576 ? `${(b / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(b / 1024))} KB`) : '');
  function openMenu(anchor) {
    const el = h('div', { role: 'menu', id: 'projectMenu' });
    const item = (key, title, sub, onclick, o = {}) => h('button', { class: 'pop-item', type: 'button', role: 'menuitem', 'data-proj': key, 'data-project-id': o.id, disabled: o.disabled, onclick: () => { if (!o.keep) Pop.close(); onclick(); } },
      h('span', { class: 'grow' }, title, sub ? h('small', null, sub) : null));
    const nameField = h('input', { class: 'pop-name', id: 'projName', type: 'text', maxlength: '80', spellcheck: 'false', autocomplete: 'off', autocapitalize: 'off', enterkeyhint: 'done', 'aria-label': 'Project name', placeholder: 'Project name', value: defaultName() });
    const doCreate = () => { Pop.close(); create(nameField.value); };
    nameField.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); doCreate(); } });
    const newRow = item('new', 'New project', 'Save this design in a new project', () => { newRow.hidden = true; form.hidden = false; nameField.focus(); nameField.select(); }, { keep: true });
    const form = h('div', { class: 'proj-new', id: 'projNewForm', hidden: true }, nameField,
      h('div', { class: 'pop-actions' },
        h('button', { class: 'btn outline', type: 'button', id: 'projCancel', onclick: () => { form.hidden = true; newRow.hidden = false; } }, 'Cancel'),
        h('button', { class: 'btn solid', type: 'button', id: 'projCreate', onclick: doCreate }, 'Create')));
    el.append(newRow, form);
    el.append(h('div', { class: 'pop-sep' }), h('div', { class: 'label pop-label' }, 'Open'));
    let list = [];
    try { list = ProjectMod.listProjects(storageOf(), storageNotice()) || []; } catch (e) { console.error(e); noticeOnce('storage', NO_STORAGE_TEXT); }
    if (!list.length) el.append(h('div', { class: 'pop-note' }, 'No saved projects yet.'));
    for (const p of list.slice(0, CONFIG.projectListMax)) {
      const here = !!project.doc && p.id === project.doc.id;
      el.append(item('open', p.name, [here ? 'Open now' : whenText(p.updatedAt), bytesText(p.bytes)].filter(Boolean).join(' · '), () => openById(p.id), { id: p.id, disabled: here }));
    }
    if (list.length > CONFIG.projectListMax) el.append(item('all', 'All projects', `${list.length - CONFIG.projectListMax} more on the Workspace page`, () => { flush(); project.navigate('../'); }));
    el.append(h('div', { class: 'pop-sep' }),
      item('import', 'Import', 'Add a project file (.cmrlm.json)', () => $('projFile').click()),
      item('export', 'Export', project.doc ? `Download ${project.doc.name} as a file` : 'Open or create a project first', exportFile, { disabled: !project.doc }),
      item('close', 'Close project', project.doc ? 'Keep working without a project' : 'No project is open', close, { disabled: !project.doc }));
    Pop.open(anchor, el);
  }

  /** The project name field for the Source section. */
  function nameControl() {
    const input = h('input', { class: 'pop-name', id: 'projNameField', type: 'text', maxlength: '80', spellcheck: 'false', autocomplete: 'off', 'aria-label': 'Project name' });
    input.addEventListener('change', () => { rename(input.value); });
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
    const refresh = () => { if (document.activeElement !== input) input.value = project.doc ? project.doc.name : ''; };
    Store.subscribe(refresh);
    return { el: h('div', { class: 'ctl text-row' }, h('label', { class: 'ctl-label', for: 'projNameField' }, 'Project name'), input), refresh };
  }

  /* ---- start ------------------------------------------------------------------------------------------ */
  let wired = false;
  function wire() {
    if (wired) return;
    wired = true;
    Store.subscribe((s, info) => {
      if (project.doc && !project.loading && (!info || !info.live)) markDirty();
      renderPill();
    });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); else reloadData(); });
    window.addEventListener('pagehide', () => { flush(); });
    const file = $('projFile');
    if (file) file.addEventListener('change', async () => {
      const f = file.files && file.files[0];
      file.value = '';
      if (f) await importFile(f);
    });
  }
  /** On start: with ?project=<id> open that project. Without one, a placement left over from an earlier project is cleared. Returns true when a project was opened. */
  function start() {
    wire();
    let id = null;
    try { id = ProjectMod.projectIdFromUrl(location); } catch (e) { id = null; }
    if (!id) {
      if (Store.raw().source !== 'standalone') {
        const next = deepClone(Store.raw());
        next.source = 'standalone';
        if (next.ground.mode === 'site') next.ground.mode = 'plane';
        Store.replace(fillDefaults(next), { resetHistory: true });
      }
      renderPill();
      return false;
    }
    let doc = null, told = false;
    try { doc = ProjectMod.loadProject(storageOf(), id, { onNotice: (message) => { told = true; noticeOnce(`storage:${message}`, String(message)); } }); } catch (e) { console.error(e); }
    if (!doc) {
      if (!told) Toast.show('That project could not be opened. It may have been deleted, or it was saved in another browser.', 'warn', 9000);
      return false;
    }
    openDoc(doc, { startup: true });
    return true;
  }

  return {
    has, hasMassing, hasParking, hasSiteGround, hasSection, massingInfo, placement, useProject, useStandalone, contextPolys, dataDoc, dataKey, massingPlacement,
    start, openDoc, close, create, rename, flush, openMenu, exportFile, importFile, nameControl, reloadData,
    markDirty, renderPill,
    doc: () => project.doc,
    status: () => ({ open: !!project.doc, id: project.doc && project.doc.id, name: project.doc && project.doc.name, dirty: project.dirty, readOnly: project.readOnly }),
    // tests: inject storage, navigation and the address bar
    configure: (o) => { Object.assign(project, o || {}); },
    restoreDefaults: () => { Object.assign(project, { storage: null, navigate: DEFAULT_NAV, updateUrl: DEFAULT_URL }); },
    reset: () => { clearTimeout(project.timer); Object.assign(project, { doc: null, timer: 0, dirty: false, readOnly: false, loading: false, noted: {}, renamed: null }); renderPill(); },
  };
})();

/* ==========================================================================
   SHARED: screenshot
   src/shared/screenshot.js (inlined with the other modules),
   plus `Shots`: the image actions and the overlay choices (shown in the Export menu's
   "Image overlay" view). The choices are kept in state.view.shot.
   ========================================================================== */
const Shots = (() => {
  const SHOT_ITEMS = [
    ['title', 'Option name'], ['date', 'Date'], ['metrics', 'Key metrics'], ['mark', 'CMRLM mark'],
  ];
  const prefersDark = () => !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);

  /** The key metrics on the picture: cut, fill, net, tallest wall and balance, then the sketch caution. */
  function keyMetrics(d) {
    const m = d.hud;
    return [
      ['Cut', Units.formatCy10(m.cutCy)],
      ['Fill', Units.formatCy10(m.fillCy)],
      ['Net', Units.formatSigned(round10(m.netCy), (x) => `${Units.grouped(x)} cy`)],
      ['Tallest wall', m.wallMax > 0 ? Units.formatFt(m.wallMax, 1) : '0 ft'],
      ['Balance', `${(m.balance * 100).toFixed(0)}%`],
      ['Caution', 'Sketch only. Not a grading plan.'],
    ];
  }

  function buildOverlay() {
    const state = Store.raw(), o = state.view.shot || {};
    const overlay = { theme: prefersDark() ? 'dark' : 'light' };
    const comparing = Render.comparing();
    if (o.title) overlay.title = comparing ? Compare.names().join('  |  ') : state.name;
    if (o.date) overlay.date = true;
    if (o.metrics && !comparing) overlay.metrics = keyMetrics(Derived.get());
    if (o.mark) overlay.mark = 'CMRLM';
    return overlay;
  }

  /** Renders the picture. With deliver = true it also downloads it (or opens the share sheet on an iPad). */
  async function capture({ deliver = false, scale = 2 } = {}) {
    const blob = await Render.capture(buildOverlay(), scale);
    if (deliver) {
      const name = Render.comparing() ? `${Store.get('name')}-compare` : Store.get('name');
      const result = await ShotMod.deliverImage(blob, ShotMod.screenshotFilename(name));
      if (result === 'downloaded') Toast.show('Image saved to your downloads.');
    }
    return blob;
  }
  async function take() {
    try { return await capture({ deliver: true }); } catch (e) { console.error(e); Toast.show(e && e.message ? e.message : 'The image could not be made.', 'bad', 6000); return null; }
  }

  /** The AI-ready picture: no overlay, grid, scale figure or wireframe; Model style; light plain sky. Filename `<option>-ai-ready-YYYY-MM-DD.png`. */
  async function aiReady({ deliver = true, scale = 2 } = {}) {
    const blob = await Render.captureClean(scale);
    if (deliver) {
      const result = await ShotMod.deliverImage(blob, ShotMod.screenshotFilename(`${Store.get('name')}-ai-ready`));
      if (result === 'downloaded') Toast.show('AI-ready image saved to your downloads.');
    }
    return blob;
  }
  async function takeAiReady() {
    try { return await aiReady({ deliver: true }); } catch (e) { console.error(e); Toast.show(e && e.message ? e.message : 'The image could not be made.', 'bad', 6000); return null; }
  }

  /** The overlay choices as menu elements (a label and one switch per item). Used by the Export menu's "Image overlay" view. */
  function overlayControls() {
    const out = [h('div', { class: 'label pop-label' }, 'The image shows')];
    for (const [key, text] of SHOT_ITEMS) {
      const btn = h('button', { class: 'toggle-row', type: 'button', role: 'switch', 'aria-checked': String(!!Store.get(`view.shot.${key}`)), 'data-shot': key, style: 'padding:0 8px' },
        h('span', null, text), h('span', { class: 'switch', 'aria-hidden': 'true' }));
      btn.addEventListener('click', () => {
        const next = !Store.get(`view.shot.${key}`);
        Store.set(`view.shot.${key}`, next, { live: false });
        btn.setAttribute('aria-checked', String(next));
      });
      out.push(btn);
    }
    return out;
  }

  return { take, capture, aiReady, takeAiReady, overlayControls, buildOverlay, keyMetrics };
})();

/* ==========================================================================
   COMPARE
   Choose 2 to 4 options. One renderer draws each option in its own part of
   the screen (setViewport / setScissor, see Render.enterCompare), one camera
   control moves them all, and a table under the views lists the metrics with
   the best value in each ranked row in bold.
   ========================================================================== */
const Compare = (() => {
  const CURRENT = '__current';
  const MIN = 2, MAX = 4;
  const $ = (id) => document.getElementById(id);
  let active = false, chosen = [], entries = [], version = 0, refreshTimer = null, ro = null;

  const RULE = 'Bold marks the best value in a row. Only the warning count is ranked (fewer is better). Cut, fill and wall heights compare options; a lower number is not always a better site.';
  const cy = (v) => Units.formatCy(v);
  const ROWS = [
    { label: 'Cut', get: (e) => e.d.hud.cutCy, fmt: cy },
    { label: 'Fill', get: (e) => e.d.hud.fillCy, fmt: cy },
    { label: 'Net (fill minus cut)', get: (e) => e.d.hud.netCy, fmt: (v) => Units.formatSigned(v, cy) },
    { label: 'Balance', get: (e) => e.d.hud.balance, fmt: (v) => `${(v * 100).toFixed(0)}%` },
    { label: 'Tallest wall', get: (e) => e.d.hud.wallMax, fmt: (v) => Units.formatFt(v), lower: true },
    { label: 'Wall length', get: (e) => e.d.hud.wallLength, fmt: Units.formatFeetInches },
    { label: 'Pad area', get: (e) => e.d.hud.padArea, fmt: Units.formatArea },
    { label: 'Disturbed area', get: (e) => e.d.hud.disturbed, fmt: Units.formatArea },
    { label: 'Steepest route', get: (e) => (e.d.hud.routes.length ? e.d.hud.steepestRoute : null), fmt: (v) => pct1(v), lower: true },
    { label: 'Warnings', get: (e) => e.d.warnings.length, fmt: Units.formatInt, lower: true },
  ];

  /** Everything that can be compared: the design on screen (if it differs from its saved copy) and the saved options. */
  function candidates() {
    const list = [];
    if (Options.syncDirty()) list.push({ key: CURRENT, name: `${Store.get('name')} (on screen)`, state: () => Store.snapshot() });
    for (const o of Options.list()) list.push({ key: o.id, name: o.name, state: () => o.state });
    return list;
  }

  function buildEntries() {
    const cands = candidates();
    entries = chosen.map((key) => cands.find((c) => c.key === key)).filter(Boolean).map((c) => {
      const state = fillDefaults(c.state());
      state.name = c.name;
      return { key: c.key, name: c.name, state, d: computeDerived(state, { project: ProjectUI.dataDoc() }), uid: `${c.key}#${version}` };
    });
  }

  function renderBar(cands) {
    const bar = $('cmpBar');
    bar.textContent = '';
    const chips = h('div', { class: 'chips', role: 'group', 'aria-label': 'Options to compare' });
    for (const c of cands) {
      const on = chosen.includes(c.key);
      const b = h('button', { class: 'chip', type: 'button', 'aria-pressed': String(on), 'data-key': c.key, title: on ? 'Click to remove from the comparison' : 'Click to add to the comparison' }, c.name);
      b.addEventListener('click', () => {
        if (on) { if (chosen.length <= MIN) { Toast.show(`Compare needs at least ${MIN} options.`, 'warn'); return; } select(chosen.filter((k) => k !== c.key)); }
        else { if (chosen.length >= MAX) { Toast.show(`Compare shows at most ${MAX} options.`, 'warn'); return; } select([...chosen, c.key]); }
      });
      chips.append(b);
    }
    bar.append(h('span', { class: 'label' }, 'Compare'), chips, h('button', { class: 'btn outline sm', type: 'button', onclick: () => exit() }, 'Close'));
  }

  function renderTable() {
    const t = $('cmpTable');
    const head = h('tr', null, h('th', { title: RULE }, 'Metric'), entries.map((e) => h('th', { title: e.name }, e.name)));
    const body = ROWS.map((row) => {
      const vals = entries.map((e) => row.get(e));
      const nums = vals.filter((v) => typeof v === 'number' && isFinite(v));
      const best = nums.length ? (row.higher ? Math.max(...nums) : row.lower ? Math.min(...nums) : null) : null;
      const allSame = nums.length > 0 && nums.every((v) => Math.abs(v - nums[0]) < 1e-9);
      return h('tr', null,
        h('td', { title: row.higher || row.lower ? RULE : null }, row.label),
        vals.map((v) => {
          const isBest = best !== null && !allSame && typeof v === 'number' && Math.abs(v - best) < 1e-9;
          return h('td', { class: isBest ? 'best' : null }, v == null ? '—' : row.fmt(v));
        }));
    });
    t.replaceChildren(h('table', { class: 'cmp' }, h('thead', null, head), h('tbody', null, body)));
  }

  function positionLabels() {
    const host = $('cmpLabels');
    host.textContent = '';
    if (!active) return;
    const cells = Render.cells();
    entries.forEach((e, i) => {
      const c = cells[i];
      if (!c) return;
      host.append(h('div', { class: 'cmp-label', style: `left:${Math.round(c.x + 8)}px;top:${Math.round(c.y + 8)}px;max-width:${Math.max(60, Math.round(c.w - 16))}px` }, e.name));
    });
  }

  const reserve = () => {
    const bar = $('cmpBar'), table = $('cmpTable');
    return { top: bar.offsetTop + bar.offsetHeight + 6, bottom: table.offsetHeight };
  };
  function layoutChanged() {
    $('viewport').style.setProperty('--cmp-table-h', `${$('cmpTable').offsetHeight}px`);
    Render.refreshInsets(false);
    Render.relayout();
    positionLabels();
  }

  function apply(wasActive = false) {
    version++;
    buildEntries();
    renderBar(candidates());
    renderTable();
    Render.enterCompare(entries.map((e) => ({ name: e.name, state: e.state, d: e.d, uid: e.uid })), reserve, { keepView: wasActive });
    layoutChanged();
    markComparing(true);
  }
  /** The Option button shows a highlight while comparing (the Compare item itself lives in the Option menu). */
  function markComparing(on) {
    const b = $('btnOption');
    if (!b) return;
    b.classList.toggle('is-on', on);
    b.dataset.comparing = on ? 'true' : 'false';
    b.title = on ? 'Comparing options. Open the menu to exit.' : 'Option: name, presets, save, compare';
  }
  function select(keys) {
    chosen = keys.slice(0, MAX);
    apply(true);
  }

  /** Start comparing. keys: option ids (or '__current'); default = the design on screen plus the newest saved one. */
  function enter(keys) {
    const cands = candidates();
    if (cands.length < MIN) {
      Toast.show('Compare needs at least 2 options. Save this design, use Duplicate, change the copy, then try again.', 'warn', 6000);
      return false;
    }
    chosen = (keys && keys.length ? keys : cands.slice(0, 2).map((c) => c.key)).filter((k) => cands.some((c) => c.key === k)).slice(0, MAX);
    if (chosen.length < MIN) chosen = cands.slice(0, 2).map((c) => c.key);
    active = true;
    $('compare').hidden = false;
    $('viewport').dataset.compare = 'true';
    if (!ro) { ro = new ResizeObserver(() => { if (active) layoutChanged(); }); ro.observe($('cmpTable')); ro.observe($('cmpBar')); Render.onResize(() => { if (active) positionLabels(); }); }
    apply();
    return true;
  }
  function exit() {
    if (!active) return;
    active = false; entries = []; chosen = [];
    clearTimeout(refreshTimer);
    Render.exitCompare();
    $('compare').hidden = true;
    $('viewport').dataset.compare = 'false';
    $('viewport').style.removeProperty('--cmp-table-h');
    $('cmpLabels').textContent = '';
    markComparing(false);
  }
  function toggle() { if (active) exit(); else enter(); }

  /** While comparing, edits to the design on screen refresh its column and its view. */
  function init() {
    Store.subscribe((s, info) => {
      if (!active || !chosen.includes(CURRENT) || (info && info.live)) return;
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(() => { if (active) apply(true); }, 200);
    });
  }

  return { toggle, enter, exit, init, names: () => entries.map((e) => e.name), isActive: () => active, chosen: () => chosen.slice(), table: () => $('cmpTable').innerText };
})();

/* ==========================================================================
   TESTS
   Calculation and export tests. Run by adding ?test to the address (plan section 9.2). They cover the shell helpers, the default
   design (cut 330, fill 350, net +20 on the HUD, tallest wall 0), every case in src/grading/testcases.js through the integrated
   pipeline, every preset, the draft quality and the 2x refinement block, the warning list, the SketchUp document, the Revit CSV, the DXF,
   the notes, the derived section and the save / export / import round trip. The other test files (12b page, 12c drawing and selection,
   12d project) run after this one; runAllTests (in 12d) merges the results. The result toast appears in ?test mode only.
   ========================================================================== */
const TestHelp = (() => {
  const eq = (a, b) => (JSON.stringify(a) === JSON.stringify(b) ? true : `got ${JSON.stringify(a)}, expected ${JSON.stringify(b)}`);
  const near = (a, b, tol = 1e-9) => (Math.abs(a - b) <= tol ? true : `got ${a}, expected ${b}`);
  const within = (a, b, pct) => (Math.abs(a - b) <= Math.abs(b) * pct / 100 + 1e-9 ? true : `got ${a}, expected ${b} (+/- ${pct}%)`);
  const make = () => {
    const results = [];
    const t = async (name, fn) => {
      let r;
      try { r = await fn(); } catch (e) { r = `threw ${e && e.message}`; }
      results.push({ name, ok: r === true, detail: r === true ? '' : String(r) });
    };
    return { results, t };
  };
  const $ = (id) => document.getElementById(id);
  const frames = (n = 2) => new Promise((res) => { const f = () => (--n <= 0 ? res() : requestAnimationFrame(f)); requestAnimationFrame(f); });
  const wait = (ms) => new Promise((res) => setTimeout(res, ms));
  const visible = (el) => !!el && el.getClientRects().length > 0 && getComputedStyle(el).visibility !== 'hidden';
  const snap = () => JSON.stringify(Store.snapshot());
  /** One undo returns the state from before the action, and one redo puts the result back (checked by behavior). */
  const oneStep = (before) => { Store.undo(); const back = snap() === before; Store.redo(); return back; };
  const toastText = () => [...document.querySelectorAll('#toasts .toast')].map((x) => x.textContent).join(' | ');
  const merged = (name, results) => {
    const bad = results.filter((r) => !r.ok);
    console.log(`[tests] ${name} ${results.length - bad.length}/${results.length} passed`, bad.length ? JSON.stringify(bad) : '');
  };
  const presetState = (id) => fillDefaults(deepClone(CONFIG.presets.find((p) => p.id === id).state));
  const cases = () => TestCasesMod.TEST_CASES;
  return { eq, near, within, make, $, frames, wait, visible, snap, oneStep, toastText, merged, presetState, cases };
})();

async function runTests() {

  await t('the default design: HUD cut 330, fill 350, net +20, tallest wall 0 (grid 325.1 and 348.2)', () => {

    return eq([d.ok, h.cut, h.fill, h.net, h.wallMax, Math.round(h.cutCy * 10) / 10, Math.round(h.fillCy * 10) / 10], [true, 330, 350, 20, 0, 325.1, 348.2]);

    const d = computeDerived(def());

  });
  await t('the page is showing the default numbers (330 cy, 350 cy, +20 cy, 0 ft)', () => {
    if (!document.getElementById('mCut')) return true;

    Store.replace(saved);
    UI.updateHud(Derived.get());
    return eq(out, ['330 cy', '350 cy', '+20 cy', '0 ft']);
  });
  await t('computeDerived never throws on a broken state', () => {
    const s = def(); s.buildings = null; s.ground = null;
    const err = console.error; console.error = () => {};
    let d;

  });

  /* ---- every hand-calculated case through the pipeline (plan section 8) ---- */
  for (const tc of TestHelp.cases()) {
    await t(`case ${tc.id}: pad tops, cut, fill, net, tallest wall`, () => {
      const d = computeDerived(fillDefaults(deepClone(tc.state))), h = d.hud, e = tc.expect;
      if (!d.ok) return 'not ok';
      const bad = [];
      const chk = (name, got, want, tolerance) => { if (!(Math.abs(got - want) <= tolerance)) bad.push(`${name} ${got} vs ${want}`); };
      const vt = e.volumeTolerance || 0.5, tol = e.tolerance || 0.01;
      (e.padTops || []).forEach((z, i) => chk(`pad top ${i + 1}`, d.metrics.tiers[i] ? d.metrics.tiers[i].padTop : NaN, z, tol));
      if (e.cutCy !== undefined) chk('cut', h.cutCy, e.cutCy, vt);
      if (e.fillCy !== undefined) chk('fill', h.fillCy, e.fillCy, vt);
      if (e.netCy !== undefined) chk('net', h.netCy, e.netCy, vt * 2);
      if (e.wallMax !== undefined) chk('tallest wall', h.wallMax, e.wallMax, tol);
      return bad.length ? bad.join('; ') : true;
    });

  /* ---- every preset ---- */
  for (const p of CONFIG.presets) {
    await t(`preset ${p.id} loads and builds the same as its case`, () => {
      const d = computeDerived(presetState(p.id));
      if (!d.ok) return 'not ok';
      const tc = TestHelp.cases().find((c) => c.id === p.id);
      if (!tc) return true;
      return close(d.hud.cutCy, tc.expect.cutCy, tc.expect.volumeTolerance || 0.5);
    });
  }
  await t('seven presets are in the Option menu list (CONFIG.presets)', () => eq(CONFIG.presets.length, 7));

  /* ---- cautions and wording ---- */
  await t('no warning or note says "compliant" or "complies"', () => {

    texts.push(GradExportsMod.notesMarkdown(def(), Derived.get().built, Derived.get().metrics, {}));
    return eq(texts.filter((x) => /\bcompl(y|ies|iant|iance)\b/i.test(x.replace(/never says "compliant"/g, ''))), []);
  });
  await t('the podium preset flags its tall wall and the long bar flags its step', () => {

  });

  /* ---- draft quality and the 2x refinement ---- */
  await t('draft quality uses one sub-cell and no refinement; full quality refines near the work', () => {
    const s = def();

  });
  await t('the refinement block meets the coarse grid: border midpoints are the neighbor averages (no crack)', () => {
    const d = computeDerived(def()), f = d.fine, N = f.n;
    let worst = 0;
    for (let a = 1; a < N - 1; a += 2) for (const b of [0, N - 1]) worst = Math.max(worst, Math.abs(f.z[b * N + a] - (f.z[b * N + a - 1] + f.z[b * N + a + 1]) / 2));
    for (let b = 1; b < N - 1; b += 2) for (const a of [0, N - 1]) worst = Math.max(worst, Math.abs(f.z[b * N + a] - (f.z[(b - 1) * N + a] + f.z[(b + 1) * N + a]) / 2));

  await t('Ground3D builds the ground, pads, walls and plan labels for the default design and a wall design', () => {

    const r = Ground3D.build(d, s, { key: 'x', quality: 'full' }, { clean: false });
    const kinds = new Set(r.model.map((o) => (o.userData.ground ? 'ground' : o.userData.wallKind ? 'wall' : o.userData.block ? 'block' : 'other')));
    return eq([kinds.has('ground'), kinds.has('wall'), kinds.has('block'), r.overlay.some((o) => o.userData.plan)], [true, true, true, true]);
  });

  /* ---- exports ---- */
  await t('SketchUp document validates, has source grading and solids or meshes', () => {
    const doc = FileExports.sketchupDoc(def());
    const v = SkFmt.validateDoc(doc);
    return v.ok && (v.counts.solid || v.counts.mesh) && doc.source === 'grading' ? true : JSON.stringify(v.errors || v);
  });
  await t('SketchUp document of the garden preset (walls, a lot) validates', () => {
    const s = presetState('garden-falling-site');
    const v = SkFmt.validateDoc(FileExports.sketchupDoc(s, computeDerived(s).built));
    return v.ok ? true : JSON.stringify(v.errors);
  });
  await t('SketchUp download delivers a file named .sketchup.json', () => {
    let name = '';
    const r = FileExports.sketchup({ deliver: (blob, n) => { name = n; } });
    return eq([r.ok, /\.sketchup\.json$/.test(name)], [true, true]);

  await t('the Revit CSV has one x, y, z row per grid node', () => {

  await t('the Revit CSV download delivers a .csv file', () => {
    let name = '';
    const r = FileExports.revit({ deliver: (blob, n) => { name = n; } });
    return eq([r.ok, /\.csv$/.test(name)], [true, true]);
  });
  await t('the contours DXF has the grading layers and the end of file', () => {
    const txt = FileExports.dxfText();
    const layers = ['GRD-EXIST-MINOR', 'GRD-PROP-MINOR', 'GRD-PAD'].filter((l) => txt.includes(l));

    const d = Derived.get(), sec = GradDerivedMod.gradingDerived(Store.snapshot(), d.built, d.metrics);

  });

  return results;
}

/* ==========================================================================
   TESTS: drawing and selection  (plan section 5.3)
   Pointer events are sent to the canvas the way a mouse or a finger would: down, then up in the same place is a tap; down, move, up on a
   handle drags it. Taps snap to pad corners and edges. The wall test follows plan section 9.2: four taps on the south edge of preset 8.1
   change the fill to 297.3 cy (the integrator's corrected value).
   ========================================================================== */
async function runSelectTests() {
  const { eq, near, make, $, frames, wait, snap, oneStep, presetState } = TestHelp;
  const { results, t } = make();
  const savedState = Store.snapshot(), savedTab = UI.activeTab();

  const canvas = Render.canvas();
  if (!Render.ready() || !canvas) { results.push({ name: 'select tests need WebGL (skipped)', ok: true, detail: '' }); Options.holdAutosave(false); return results; }
  // Synthetic pointers have no capture target; the renderer's controls would throw on them.
  canvas.setPointerCapture = () => {}; canvas.releasePointerCapture = () => {};
  const ptr = (type, x, y, o = {}) => canvas.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, clientX: x, clientY: y, pointerId: o.id || 7, pointerType: o.type || 'mouse', button: 0, buttons: type === 'pointerup' ? 0 : 1, altKey: !!o.alt, isPrimary: true }));
  // down and up in one task: a slow software-rendered frame must not turn a tap into a long press (400 ms)
  const tap = async (x, y, o) => { ptr('pointerdown', x, y, o); ptr('pointerup', x, y, o); await wait(15); };
  const key = (k, o = {}) => document.body.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true, ...o }));
  const at = (x, y, z) => Select.screenOf(x, y, z);
  const tapPlan = async (x, y, o) => { const p = at(x, y); await tap(p.x, p.y, o); };
  const toPlan = async () => { Render.setView('plan', false); await frames(3); };
  const fresh = async () => { Select.clear(); Select.cancelDraw(); Store.replace(fillDefaults(defaultState())); await toPlan(); await frames(2); };

  try {
    await fresh();
    await t('Draw: the wall button and key W start a drawing in the plan view; the draw bar shows; Esc cancels', async () => {
      Render.setView('axon', false); await frames(2);
      key('w'); await frames(2);
      const on = Select.drawing(), bar = !$('drawBar').hidden, plan = Render.info().preset;
      key('Escape'); await frames(1);
      return eq([on && on.kind, bar, plan, Select.drawing(), $('drawBar').hidden], ['wall', true, 'plan', null, true]);
    });
    await toPlan();
    let beforeWall = null;
    await t('Draw: four taps on the south edge of preset 8.1 make a wall and the fill is 297.3 cy', async () => {
      beforeWall = snap();
      Select.startDraw('wall'); await frames(2);

      await frames(2);

      const ok = [mid && mid.points, s.walls.length, w && w.line.length, w && w.line[0][0], w && w.line[w.line.length - 1][0], w && w.line.every((p) => Math.abs(p[1] + 32.5) < 1e-6)];
      return Math.abs(h.fillCy - 297.3) <= 0.5 ? eq(ok, [4, 1, 4, -150, 150, true]) : `fill ${h.fillCy}`;
    });
    await t('Draw: the new wall is one undo step, is selected, and its card is open in the Site work tab', async () => {

    await t('Select: a tap on empty ground clears the selection; a tap on the wall selects it', async () => {

    });
    await t('Select: the handles are the 4 vertices and the 3 midpoints of the wall', () => eq(Select.handles(), { vertices: 4, midpoints: 3 }));
    await t('Edit: dragging a vertex moves it, snaps to the grid, turns orbit off while it moves, and is one undo step', async () => {
      const before = snap();
      const p = Select.handleScreen('v', 1), w0 = Store.get('walls.0.line')[1];
      ptr('pointerdown', p.x, p.y); await wait(15);
      const orbitDuring = Render.orbitEnabled();
      ptr('pointermove', p.x, p.y + 25); await wait(15);
      ptr('pointermove', p.x, p.y + 50); await wait(15);
      ptr('pointerup', p.x, p.y + 50); await wait(30);
      const w1 = Store.get('walls.0.line')[1];

    await t('Edit: a drive is picked by a tap inside its outline; a lot likewise', async () => {

    });
    await t('Edit: Redraw keeps the settings and replaces the points', async () => {
      Store.set('drives.0.slope', 7, { live: false });
      Select.select([{ kind: 'drive', id: 'D1' }]);
      Select.redraw({ kind: 'drive', id: 'D1' }); await frames(2);
      await tapPlan(180, -120); await tapPlan(180, 20); key('Enter'); await frames(2);
      const d = Store.get('drives');

    await t('Edit: Delete removes a drive, a lot and a route, one step each', async () => {
      const out = [];
      for (const it of [{ kind: 'drive', id: 'D1' }, { kind: 'lot', id: 'L1' }, { kind: 'route', id: 'R1' }]) {
        Select.select([it]); const before = snap();

        Select.clear();
      }
      return eq([out, Store.get('drives').length, Store.get('lots').length, Store.get('routes').length], [[true, true, true], 0, 0, 0]);
    });
    await t('Snap: grid, pad corner, pad edge, drive end; Option skips snapping', () => {
      const g = Select.snapPoint([10.37, 5.61]);
      const c = Select.snapPoint([-149.6, -32.1]);
      const e = Select.snapPoint([20.2, -32.4]);
      const f = Select.snapPoint([10.37, 5.61], { skip: true });
      return eq([[g.x, g.y, g.kind], [c.x, c.y, c.kind], [Math.round(e.x * 10) / 10, e.y, e.kind], f.kind, f.x], [[10, 6, 'grid'], [-150, -32.5, 'corner'], [20.2, -32.5, 'edge'], 'free', 10.37]);
    });
    await t('Draw: tapping with Option held places the point where the finger is (no snap)', async () => {
      Select.startDraw('wall'); await frames(2);
      const p = at(33.3, 71.7);
      await tap(p.x, p.y, { alt: true });
      const pts = [];
      Select.drawPoint(80, 71.7);
      const n = Select.drawing().points;

    await t('Section: Draw section takes two taps, the profile panel shows and the pads and the length are right', async () => {

    });
    await t('Keys: 1 to 6 switch the view, D switches Model and Cut and fill', async () => {

      const a = Select.count();

/* ==========================================================================
   TESTS: the project file  (plan section 7)
   A hand-built project: a massing of two bars placed at x 40, y 60 (derived.footprint, the shape the Mid-rise Generator writes) and a
   site ground grid that falls 2 percent toward the east. Open it, read the footprint in the project frame, write the grading section
   (1 s debounce, visibilitychange, pagehide), keep every other section, a newer schema, a tower with no levels, a parking deck, close.
   The fixture lives in an in-memory storage, so a ?test visit never touches the saved projects.
   runAllTests (below) runs every test file and merges the results.
   ========================================================================== */
const ProjectFixture = (() => {
  const memory = () => ({ data: {}, getItem(k) { return this.data[k] === undefined ? null : this.data[k]; }, setItem(k, v) { this.data[k] = String(v); }, removeItem(k) { delete this.data[k]; } });
  const rect = (x0, y0, x1, y1) => [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
  /** Two bars in the massing frame: 200 x 60 and 120 x 30. */
  const footprint = () => [{ outer: rect(-100, -30, 100, 30), holes: [] }, { outer: rect(-60, 40, 60, 70), holes: [] }];
  /** An n by n ground, 20 ft apart, z = 100 + 0.02 x. */
  function ground() {
    const n = 21, spacing = 20, x0 = -150, y0 = -100, points = [];
    for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) { const x = x0 + i * spacing; points.push([x, y0 + j * spacing, 100 + 0.02 * x]); }
    return { spacing, n, points };
  }
  const massing = (tool, withFootprint) => ({ tool, schema: 1, placement: { x: 40, y: 60, rotation: 0, baseZ: 0 }, state: {}, derived: withFootprint ? { footprint: footprint(), levels: [{ index: 1, zone: 'bar', z: 0, ftf: 10, plates: footprint() }] } : {} });
  function project({ tool = 'midrise', footprintOn = true, site = true, parking = false, name = 'Fixture' } = {}) {
    let doc = ProjectMod.newProject({ name });
    if (tool) doc = ProjectMod.writeSection(doc, 'massing', massing(tool, footprintOn));
    if (site) doc = ProjectMod.writeSection(doc, 'site', { tool: 'site', schema: 1, placement: { x: 0, y: 0, rotation: 0, baseZ: 0 }, state: {}, derived: { ground: ground() } });
    if (parking) doc = ProjectMod.writeSection(doc, 'parking', { tool: 'parking', schema: 1, placement: { x: 0, y: 0, rotation: 0, baseZ: 0 }, state: {}, derived: { levels: [{ index: 1, z: 0, plate: [{ outer: rect(300, 0, 400, 60), holes: [] }] }] } });
    doc = ProjectMod.writeSection(doc, 'plates', { tool: 'plate', schema: 1, placement: { x: 1, y: 2, rotation: 0, baseZ: 3 }, state: { keep: 'me' }, derived: { levels: [] } });
    return doc;
  }
  return { memory, project, footprint, ground };
})();

async function runProjectTests() {
  const { eq, near, make, $, wait } = TestHelp;
  const { results, t } = make();
  const savedState = Store.snapshot(), savedTab = UI.activeTab();
  Options.holdAutosave(true);
  const mem = ProjectFixture.memory();
  ProjectUI.reset();
  ProjectUI.configure({ storage: mem, navigate: () => {}, updateUrl: () => {} });
  const stored = (id) => ProjectMod.loadProject(mem, id);
  const open = (opts) => { const doc = ProjectFixture.project(opts); ProjectMod.saveProject(mem, doc); ProjectUI.openDoc(doc); return doc; };
  const fresh = () => { Store.replace(fillDefaults(defaultState())); };
  const box = (rings) => { const a = rings.flat(); return [Math.min(...a.map((p) => p[0])), Math.min(...a.map((p) => p[1])), Math.max(...a.map((p) => p[0])), Math.max(...a.map((p) => p[1]))]; };

  try {
    fresh();
    await t('no project: the standalone default bar, the project line is empty', () => eq([ProjectUI.has(), Store.get('source'), Store.get('buildings').length, Store.get('buildings')[0].source], [false, 'standalone', 1, 'typed']));
    await t('opening a project with a massing and a site makes the source "project", the ground "site", and one massing building', () => {
      open();
      const b = Store.get('buildings');
      return eq([ProjectUI.has(), Store.get('source'), Store.get('ground.mode'), b.length, b[0].source, ProjectUI.massingInfo().site], [true, 'project', 'site', 1, 'massing', true]);
    });
    await t('the massing footprint is read in the project frame: both bars, moved by the placement (x 40, y 60)', () => {
      const d = Derived.get(), bld = d.built.buildings[0];
      const bx = bld && box(bld.rings);
      return eq([d.built.source, d.built.ground, bld && bld.id, bld && bld.rings.length, bx], ['project', 'site', 'massing', 2, [-60, 30, 140, 130]]);
    });
    await t('the tier id is massing-T1 and the pad sits on the site ground (the existing ground follows 100 + 0.02 x)', () => {
      const d = Derived.get(), tr = d.built.tiers[0];
      return eq([tr && tr.id, near(d.built.existingAt(0, 0), 100, 1e-6), near(d.built.existingAt(100, 50), 102, 1e-6), d.metrics.tiers[0].id], ['massing-T1', true, true, 'massing-T1']);
    });
    await t('the Buildings tab says where the buildings come from, and the project line names the project', () => {
      UI.setTab('buildings'); UI.updateHud(Derived.get());
      return eq([/Project “Fixture”.*site ground, massing/.test($('projLine').textContent), $('sourceChips').querySelector('[aria-pressed="true"]').dataset.value], [true, 'project']);
    });
    await t('the grading section is written after 1 s, with the state, the derived numbers and every other section kept', async () => {
      const doc = ProjectUI.doc();
      Store.set('buildings.0.padOffset', 8, { live: false });
      await wait(1400);
      const back = stored(doc.id), sec = back && back.sections.grading;
      return eq([!!sec, sec && sec.tool, sec && sec.state.buildings[0].padOffset, !!(sec && sec.derived), !!back.sections.massing, !!back.sections.site, back.sections.plates.state], [true, 'grading', 8, true, true, true, { keep: 'me' }]);
    });
    await t('the grading section has an identity placement and the saved project validates', () => {
      const back = stored(ProjectUI.doc().id), sec = back.sections.grading;
      return eq([sec.placement, ProjectMod.validate(back).ok !== false], [{ x: 0, y: 0, rotation: 0, baseZ: 0 }, true]);
    });
    await t('the massing section is untouched by the write (placement and footprint)', () => {
      const m = stored(ProjectUI.doc().id).sections.massing;
      return eq([m.placement, m.derived.footprint.length], [{ x: 40, y: 60, rotation: 0, baseZ: 0 }, 2]);
    });
    await t('visibilitychange (hidden) and pagehide flush a pending change at once', () => {
      Store.set('buildings.0.padOffset', 6, { live: false });
      Object.defineProperty(document, 'visibilityState', { configurable: true, get: () => 'hidden' });
      document.dispatchEvent(new Event('visibilitychange'));
      delete document.visibilityState;
      const a = stored(ProjectUI.doc().id).sections.grading.state.buildings[0].padOffset;
      Store.set('buildings.0.padOffset', 4, { live: false });
      window.dispatchEvent(new Event('pagehide'));
      const b = stored(ProjectUI.doc().id).sections.grading.state.buildings[0].padOffset;
      return eq([a, b], [6, 4]);
    });
    await t('reopening the project loads the saved grading state', () => {
      const id = ProjectUI.doc().id;
      ProjectUI.flush();
      fresh();
      ProjectUI.openDoc(stored(id));
      return eq([Store.get('buildings')[0].padOffset, Store.get('source')], [4, 'project']);
    });
    await t('a project saved by a newer tool is read only: opened, not written', async () => {
      let doc = ProjectFixture.project({ name: 'Newer' });
      doc.sections.grading = { tool: 'grading', schema: 99, placement: { x: 0, y: 0, rotation: 0, baseZ: 0 }, state: {}, derived: {}, updatedAt: new Date().toISOString() };
      ProjectMod.saveProject(mem, doc);
      ProjectUI.openDoc(doc);
      Store.set('buildings.0.padOffset', 9, { live: false });
      await wait(1300);
      return eq([ProjectUI.status().readOnly, stored(doc.id).sections.grading.schema], [true, 99]);
    });
    await t('a tower project with no levels shows the Tower note and the tower-no-levels warning', () => {
      const doc = ProjectFixture.project({ tool: 'tower', footprintOn: false, site: false, name: 'Tower' });
      ProjectMod.saveProject(mem, doc);
      fresh();
      ProjectUI.openDoc(doc);
      UI.setTab('buildings'); UI.updateHud(Derived.get());
      const w = Derived.get().warnings.find((x) => x.id === 'tower-no-levels');
      return eq([!!w, /The Tower Generator does not write massing levels yet/.test($('sourceNote').textContent), /does not write massing levels yet/.test($('warnList').textContent)], [true, true, true]);
    });
    await t('a project with a parking deck adds a parking building, ids parking-T1, from the lowest plate', () => {
      const doc = ProjectFixture.project({ tool: null, site: false, parking: true, name: 'Deck' });
      ProjectMod.saveProject(mem, doc);
      fresh();
      ProjectUI.openDoc(doc);
      const d = Derived.get(), b = Store.get('buildings');
      return eq([b.length, b[0].source, d.built.tiers[0] && d.built.tiers[0].id, d.built.buildings[0] && box(d.built.buildings[0].rings)], [1, 'parking', 'parking-T1', [300, 0, 400, 60]]);
    });
    await t('Close project goes back to the standalone design: the project buildings go and the plane is the ground', () => {
      const id = ProjectUI.doc().id;
      ProjectUI.close();
      return eq([ProjectUI.has(), Store.get('source'), Store.get('ground.mode'), Store.get('buildings')[0].source, !!stored(id)], [false, 'standalone', 'plane', 'typed', true]);
    });
    await t('the Project menu lists New, Import, Export and Close', () => {
      ProjectUI.openDoc(ProjectFixture.project({ name: 'Menu' }));
      $('btnProject').click();
      const keys = [...document.querySelectorAll('#projectMenu [data-proj]')].map((b) => b.dataset.proj);
      Pop.close();
      ProjectUI.close();
      return eq([keys[0], keys.includes('import'), keys.includes('export'), keys.includes('close')], ['new', true, true, true]);
    });
  } finally {
    ProjectUI.close();
    ProjectUI.restoreDefaults();
    ProjectUI.reset();
    Store.replace(savedState); UI.setTab(savedTab);
    Options.holdAutosave(false);
    UI.updateHud(Derived.get());
  }
  TestHelp.merged('project', results);
  return results;
}
async function runAllTests() {
  const base = await runTests();
  const ui = await runUiTests();
  const select = await runSelectTests();
  const project = await runProjectTests();
  const all = [...base, ...ui, ...select, ...project];
  const failed = all.filter((r) => !r.ok);
  TestHelp.merged('all', all);
  window.__gradingTestResults = { total: all.length, passed: all.length - failed.length, failed, results: all };
  return window.__gradingTestResults;
}

/* ==========================================================================
   Start-up and test hook
   ========================================================================== */
const TEST_MODE = /[?&]test\b/.test(location.search);
Options.init({ restore: !TEST_MODE });
UI.init();
Prompts.init();
Compare.init();
Options.syncDirty();
if (!Render.init(document.getElementById('canvasHost'))) Store.subscribe(() => UI.updateHud(Derived.get()));
Select.init();
SectionView.init();
ProjectUI.start();

const optionInfo = (o) => ({ id: o.id, name: o.name, updatedAt: o.updatedAt });
window.__grading = {
  getState: () => Store.snapshot(),
  setState: (path, value) => { Store.set(path, value, { live: false }); },
  setStateLive: (path, value) => { Store.set(path, value, { live: true }); },
  commit: () => Store.commit(),
  replaceState: (state) => { Store.replace(fillDefaults(state)); },
  getDerived: () => { const d = Derived.get(); return { ok: d.ok, hud: d.hud, warnings: d.warnings, notes: d.notes, quality: d.quality, zBase: d.zBase, refine: d.refine }; },
  getHud: () => Derived.get().hud,
  getMetrics: () => Derived.get().metrics,
  getBuilt: () => Derived.get().built,
  getWarnings: () => Derived.get().warnings,
  loadPreset: (id) => Options.loadPreset(id),
  newDesign: (opts) => Options.newDesign(opts),            // { confirm: false } skips the unsaved-changes question (tests)
  hasUnsavedChanges: () => Options.hasUnsavedChanges(),
  listPresets: () => CONFIG.presets.map((p) => ({ id: p.id, name: p.name })),
  listOptions: () => Options.list().map(optionInfo),
  saveOption: () => Options.save(),
  duplicateOption: () => Options.duplicate(),
  loadOption: (id) => Options.loadOption(id),
  compare: (keys) => Compare.enter(keys),
  exitCompare: () => Compare.exit(),
  getCompare: () => ({ active: Compare.isActive(), names: Compare.names(), chosen: Compare.chosen(), table: Compare.isActive() ? Compare.table() : '' }),
  screenshot: (opts) => Shots.capture(opts),
  openPrompts: () => Prompts.open(),
  closePrompts: () => Prompts.close(),
  getPromptText: (id, values) => Prompts.promptText(id, values),
  getPromptAuto: () => Prompts.currentAuto(),
  listPrompts: () => Prompts.allPrompts().map((p) => ({ id: p.id, group: p.group, title: p.title })),
  aiReadyScreenshot: () => Shots.aiReady({ deliver: false }),
  undo: () => Store.undo(),
  redo: () => Store.redo(),
  history: () => ({ depth: Store.historyDepth(), canUndo: !!Store.canUndo(), canRedo: !!Store.canRedo() }),
  setView: (id, animate = false) => Render.setView(id, animate),
  getView: () => Render.info(),
  units: Units,
  runTests: runAllTests,
  // exports
  sketchupDoc: () => FileExports.sketchupDoc(),
  sketchupDownload: (opts) => FileExports.sketchup(opts),
  revitText: () => FileExports.revitText(),
  revitDownload: (opts) => FileExports.revit(opts),
  dxfText: () => FileExports.dxfText(),
  dxfDownload: (opts) => FileExports.dxf(opts),
  notesText: () => FileExports.notesText(),
  notesDownload: (opts) => FileExports.notes(opts),
  exportJson: () => Options.exportJson(),
  importJson: (file) => Options.importFile(file),
  getDerivedSection: () => { const st = Store.snapshot(), d = Derived.get(); return GradDerivedMod.gradingDerived(st, d.built, d.metrics); },
  overlayInfo: () => Render.overlayInfo(),
  layerInfo: () => Render.layerInfo(),
  sectionInfo: () => SectionView.info(),
  // project file (ProjectUI; tests inject storage and navigation with projectConfigure)
  projectConfigure: (o) => ProjectUI.configure(o),
  projectReset: () => ProjectUI.reset(),
  projectOpenDoc: (doc) => ProjectUI.openDoc(doc),
  projectStatus: () => ProjectUI.status(),
  projectDoc: () => ProjectUI.doc(),
  projectInfo: () => ProjectUI.massingInfo(),
  projectUseProject: () => ProjectUI.useProject({ quiet: true }),
  projectFlush: () => { ProjectUI.markDirty(); return ProjectUI.flush(); },
  projectCreate: (name) => ProjectUI.create(name, { quiet: true }),
  projectClose: () => ProjectUI.close(),
  // panels, selection and drawing (the same functions the clicks and the keys call)
  openItem: (item) => UI.openItem(item),
  setTab: (id) => UI.setTab(id),
  getTab: () => UI.activeTab(),
  applySteps: (i) => UI.applySteps(i),
  select: (items) => Select.select(items),
  getSelection: () => Select.get(),
  clearSelection: () => Select.clear(),
  pickAt: (x, y) => Select.pickAt(x, y),                      // client px -> { kind, id } | null
  clickAt: (x, y) => Select.click(x, y),
  screenOf: (x, y, z) => Select.screenOf(x, y, z),            // plan point -> client px
  startDraw: (kind, opts) => Select.startDraw(kind, opts),
  drawing: () => Select.drawing(),
  drawTap: (cx, cy, alt) => Select.drawTap(cx, cy, alt),
  drawPoint: (x, y) => Select.drawPoint(x, y),
  finishDraw: () => Select.finishDraw(),
  cancelDraw: () => Select.cancelDraw(),
  handles: () => Select.handles(),
  handleScreen: (type, i) => Select.handleScreen(type, i),
  deleteSelected: () => Select.deleteSelected(),
  snapPoint: (p, o) => Select.snapPoint(p, o),
};
if (TEST_MODE) {
  runAllTests().then((r) => {
    document.getElementById('toasts').textContent = '';
    const msg = r.failed.length
      ? `Tests: ${r.failed.length} of ${r.total} failed. ${r.failed.map((f) => `${f.name} (${f.detail})`).join(' | ')}`
      : `Tests: all ${r.total} passed`;
    Toast.show(msg, r.failed.length ? 'bad' : 'test-pass', 0);
  });
}
