const isNum = (v) => typeof v === "number" && Number.isFinite(v);
const n0 = (v) => Math.round(v).toLocaleString("en-US");
const n1 = (v) => (Math.round(v * 10) / 10).toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const n2 = (v) => (Math.round(v * 100) / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = (v) => `${(Math.round(v * 1000) / 10).toFixed(1)} percent`;

/* ---------------- Revit CSV ---------------- */

function revitCsv(built) {
  const g = groundData(built);
  const rows = [];
  for (let j = 0; j < g.n; j++) for (let i = 0; i < g.n; i++) rows.push(`${g.xs[i].toFixed(3)},${g.ys[j].toFixed(3)},${g.pz[j * g.n + i].toFixed(3)}`);
  return rows.join("\n") + "\n";
}

/* ---------------- contours ---------------- */

/** built.contours when the page passes it (its own 2x refinement near features); else contours.js on the node grid. */
function contourData(state, built, g) {
  const c = built.contours;
  const diff = new Float64Array(g.n * g.n);
  for (let k = 0; k < diff.length; k++) diff[k] = g.pz[k] - g.ez[k];
  if (c && Array.isArray(c.existing) && Array.isArray(c.proposed)) return { existing: c.existing, proposed: c.proposed, zero: Array.isArray(c.zero) ? c.zero : zeroLine(g, diff) };
  const iv = state.view && state.view.contours && isNum(state.view.contours.interval) && state.view.contours.interval > 0 ? state.view.contours.interval : 1;
  return { existing: contours(g, g.ez, iv), proposed: contours(g, g.pz, iv), zero: zeroLine(g, diff) };
}

/* ---------------- DXF writer (R12, hand-written like src/site/exports.js) ---------------- */

function fmt(v) {
  let s = (Math.round(v * 1e4) / 1e4).toFixed(4).replace(/0+$/, "");
  if (s.endsWith(".")) s += "0";
  return s === "-0.0" ? "0.0" : s;
}

class Dxf {
  constructor() { this.out = []; this.min = [Infinity, Infinity, Infinity]; this.max = [-Infinity, -Infinity, -Infinity]; this.counts = {}; }
  g(code, v) { this.out.push(String(code).padStart(3, " "), typeof v === "number" && code >= 10 && code <= 59 ? fmt(v) : String(v)); }
  pt(x, y, z, c = 10) {
    this.g(c, x); this.g(c + 10, y); this.g(c + 20, z);
    const v = [x, y, z];
    for (let i = 0; i < 3; i++) { if (v[i] < this.min[i]) this.min[i] = v[i]; if (v[i] > this.max[i]) this.max[i] = v[i]; }
  }
  count(layer) { this.counts[layer] = (this.counts[layer] || 0) + 1; }
  /** 3D polyline (flag 8; closed = flag 9), vertices flag 32. */
  poly3d(layer, line, closed = false) {
    this.count(layer);
    this.g(0, "POLYLINE"); this.g(8, layer); this.g(66, 1); this.g(10, 0); this.g(20, 0); this.g(30, 0); this.g(70, closed ? 9 : 8);
    for (const p of line) { this.g(0, "VERTEX"); this.g(8, layer); this.pt(p[0], p[1], p[2]); this.g(70, 32); }
    this.g(0, "SEQEND"); this.g(8, layer);
  }
  point(layer, x, y, z) { this.count(layer); this.g(0, "POINT"); this.g(8, layer); this.pt(x, y, z); }
  text(layer, x, y, z, h, s) {
    this.count(layer);
    this.g(0, "TEXT"); this.g(8, layer); this.pt(x, y, z); this.g(40, h); this.g(1, String(s).replace(/[^\x20-\x7e]/g, "?"));
  }
}

const elev = (v) => n2(v);                                // "1,008.40"

/** The DXF text of the build. See the file header for the layers. */
function gradingDxf(state, built, metrics) {
  if (!state) throw new Error('gradingDxf: missing input "state".');
  if (!built) throw new Error('gradingDxf: missing input "built".');
  const g = groundData(built), at = built.surface.at, D = new Dxf();
  const wr = wallRecords(state, built), rr = routeRecords(state, built, metrics || {});
  const m = metrics ? metricsSummary(state, built, metrics, wr, rr) : null;

  // contours
  const c = contourData(state, built, g);
  const lay = (set, minor, major) => { for (const k of set) if (k.line.length > 1) D.poly3d(k.major ? major : minor, k.line.map((p) => [p[0], p[1], k.z]), false); };
  lay(c.existing, "GRD-EXIST-MINOR", "GRD-EXIST-MAJOR");
  lay(c.proposed, "GRD-PROP-MINOR", "GRD-PROP-MAJOR");

  // pads and spot elevations
  const spots = new Map();
  const spot = (x, y, z) => { const k = `${x.toFixed(2)},${y.toFixed(2)}`; if (!spots.has(k)) spots.set(k, [x, y, z]); };
  for (const t of tierList(built)) {
    for (const poly of padPolygons(padOf(t))) {
      D.poly3d("GRD-PAD", poly.outer.map((p) => [p[0], p[1], t.padTop]), true);
      for (const h of poly.holes) D.poly3d("GRD-PAD", h.map((p) => [p[0], p[1], t.padTop]), true);
      for (const p of poly.outer) spot(p[0], p[1], t.padTop);
    }
  }

  // walls
  for (const w of wr) {
    D.poly3d("GRD-WALL", w.top, false);
    const s = w.profile.samples;
    if (!s.length) continue;
    const label = (p) => {
      D.text("GRD-WALL-TEXT", p.x, p.y, p.top, 2, `TOP ${elev(p.top)}`);
      D.text("GRD-WALL-TEXT", p.x, p.y - 2.5, p.bottom, 2, `BOT ${elev(p.bottom)}`);
    };
    const seen = new Set();
    for (const i of [0, w.profile.iMax, s.length - 1]) {
      if (seen.has(i)) continue;
      seen.add(i);
      if (i !== 0 && Math.hypot(s[i].x - s[0].x, s[i].y - s[0].y) < 1e-6) continue;       // a closed wall: the last point is the first

    const f = feats.find((x) => x && x.kind === "drive" && x.id === d.id) || null;
    const ring = ringOf(f && f.ring);
    if (ring) D.poly3d("GRD-DRIVE", ringZ(ring, f), true);
    if (Array.isArray(d.line) && d.line.length > 1) {
      D.poly3d("GRD-DRIVE", d.line.map((p) => [p[0], p[1], zOf(f, p[0], p[1])]), false);
      for (const p of [d.line[0], d.line[d.line.length - 1]]) spot(p[0], p[1], zOf(f, p[0], p[1]));
    }
  }
  for (const l of Array.isArray(state.lots) ? state.lots : []) {
    const f = feats.find((x) => x && x.kind === "lot" && x.id === l.id) || null;
    const ring = ringOf(f && f.ring) || ringOf(l.ring);
    if (ring) D.poly3d("GRD-LOT", ringZ(ring, f), true);
  }

  // routes
  for (const r of rr) {
    if (r.points.length > 1) D.poly3d("GRD-ROUTE", r.points, false);
    if (r.points.length) { const a = r.points[0], b = r.points[r.points.length - 1]; spot(a[0], a[1], a[2]); spot(b[0], b[1], b[2]); }
  }

  // spots
  for (const [x, y, z] of spots.values()) {
    D.point("GRD-SPOT", x, y, z);
    D.text("GRD-SPOT", x + 1, y + 1, z, 1.5, elev(z));
  }

  // title and earthwork table, below the grid
  const lines = [`GRADING SKETCH - ${String(state.name || "Option")}`, "SKETCH ONLY - NOT A GRADING PLAN. VERIFY WITH THE CIVIL ENGINEER."];
  if (m) {
    lines.push(`CUT ${n1(m.cutCy)} CY`, `FILL ${n1(m.fillCy)} CY`, `NET ${n1(m.netCy)} CY (+ = IMPORT)`, `BALANCE ${m.balance.toFixed(2)}`,
      `PAD AREA ${n0(m.padArea)} SF`, `DISTURBED AREA ${n0(m.disturbedArea)} SF`, `TALLEST WALL ${n2(m.wallHeightMax)} FT`);
  }
  lines.push("EARTHWORK: GRID METHOD, PLUS OR MINUS 5 TO 10 PERCENT. NOT A TAKEOFF.");
  lines.forEach((s, k) => D.text("GRD-TEXT", g.x0, g.y0 - 20 - k * 4, 0, 2.5, s));

  // assemble
  const head = new Dxf();
  const ext = (a, d) => (isFinite(a) ? a : d);
  head.g(0, "SECTION"); head.g(2, "HEADER");
  head.g(9, "$ACADVER"); head.g(1, "AC1009");
  head.g(9, "$EXTMIN"); head.g(10, ext(D.min[0], 0)); head.g(20, ext(D.min[1], 0)); head.g(30, ext(D.min[2], 0));
  head.g(9, "$EXTMAX"); head.g(10, ext(D.max[0], 0)); head.g(20, ext(D.max[1], 0)); head.g(30, ext(D.max[2], 0));
  head.g(0, "ENDSEC");
  head.g(0, "SECTION"); head.g(2, "TABLES");
  head.g(0, "TABLE"); head.g(2, "LTYPE"); head.g(70, 1);
  head.g(0, "LTYPE"); head.g(2, "CONTINUOUS"); head.g(70, 0); head.g(3, "Solid line"); head.g(72, 65); head.g(73, 0); head.g(40, 0);
  head.g(0, "ENDTAB");
  head.g(0, "TABLE"); head.g(2, "LAYER"); head.g(70, GRADING_DXF_LAYERS.length + 1);
  head.g(0, "LAYER"); head.g(2, "0"); head.g(70, 0); head.g(62, 7); head.g(6, "CONTINUOUS");
  for (const [name, color] of GRADING_DXF_LAYERS) { head.g(0, "LAYER"); head.g(2, name); head.g(70, 0); head.g(62, color); head.g(6, "CONTINUOUS"); }
  head.g(0, "ENDTAB");
  head.g(0, "ENDSEC");
  head.g(0, "SECTION"); head.g(2, "ENTITIES");
  const tail = ["  0", "ENDSEC", "  0", "EOF"];
  return head.out.concat(D.out, tail).join("\n") + "\n";
}

/* ---------------- notes ---------------- */

/**
 * Notes file in Markdown (ASD-STE100 style: short sentences, active voice).
 * @param meta  optional { date, address, release, source ("standalone" | "project"), groundNote }
 */
function notesMarkdown(state, built, metrics, meta) {
  if (!state) throw new Error('notesMarkdown: missing input "state".');
  if (!built) throw new Error('notesMarkdown: missing input "built".');
  if (!metrics) throw new Error('notesMarkdown: missing input "metrics".');
  const mt = meta || {};
  const g = groundData(built);
  const wr = wallRecords(state, built), rr = routeRecords(state, built, metrics);
  const m = metricsSummary(state, built, metrics, wr, rr);
  const date = mt.date || new Date().toISOString().slice(0, 10);
  const site = state.ground && state.ground.mode === "site";
  const pl = state.ground && state.ground.plane;
  const k = state.earthwork && isNum(state.earthwork.subdivide) ? state.earthwork.subdivide : 4;
  const bulking = state.earthwork && isNum(state.earthwork.bulking) ? state.earthwork.bulking : 1;
  const dl = state.daylight || {}, lim = state.limits || {};
  const minZ = (() => { let lo = Infinity; for (const v of g.pz) if (v < lo) lo = v; return lo; })();
  const skShift = Math.round(-minZ * 100) / 100 || 0;
  const skN = Math.abs(skShift).toFixed(2);

  const L = [];
  L.push(`# Grading Sketch: ${String(state.name || "Option")}`, "");
  L.push("This is a sketch for early coordination with the civil engineer. It is not a grading plan.", "");
  L.push(CAUTIONS[0], "");
  L.push("## Project", "");
  L.push(`- Option: ${String(state.name || "Option")}`);
  if (mt.address) L.push(`- Address: ${mt.address}`);
  L.push(`- Source: ${mt.source || state.source || "standalone"}`);
  L.push(`- Date: ${date}`);
  L.push(`- Ground: ${site ? "the Site Model grid (USGS 3D Elevation Program, NAVD88 feet)" : pl ? `a typed plane, ${pl.slope} percent, falling toward ${pl.downhill} degrees, elevation ${n2(pl.z0)} ft at the origin (local feet)` : "a typed plane"}`);
  if (mt.release) L.push(`- Overture release: ${mt.release}`);
  if (mt.groundNote) L.push(`- Ground note: ${mt.groundNote}`);
  L.push(`- Ground grid: ${g.n} by ${g.n} points, ${n0(g.n * g.n)} points in total, spacing ${g.spacing} ft`);
  L.push(`- Units: feet, square feet, and cubic yards (1 cubic yard = 27 cubic feet)`, "");

  L.push("## Earthwork", "");
  L.push("| Item | Value |", "|---|---|");
  L.push(`| Cut | ${n1(m.cutCy)} cy |`, `| Fill | ${n1(m.fillCy)} cy |`);
  L.push(`| Net (fill minus cut; positive = import) | ${m.netCy >= 0 ? "+" : "-"}${n1(Math.abs(m.netCy))} cy |`);
  L.push(`| Balance (smaller over larger) | ${m.balance.toFixed(2)} |`);
  L.push(`| Bulked net (bulking factor ${bulking.toFixed(2)}) | ${m.bulkedNetCy >= 0 ? "+" : "-"}${n1(Math.abs(m.bulkedNetCy))} cy |`);
  L.push(`| Pad area | ${n0(m.padArea)} sf |`, `| Disturbed area (change over 0.1 ft) | ${n0(m.disturbedArea)} sf |`, "");
  L.push(`Method: the tool splits each grid cell into ${k} by ${k} sub-cells. It compares the proposed and the existing ground at each sub-cell center. Balance mode: ${state.balance === "site" ? "site (the daylight slopes count)" : "pad (cut and fill inside the pad only)"}.`, "");
  L.push(CAUTIONS[1], "");

  const tiers = tierList(built);
  L.push("## Finished floor elevations", "");
  if (!tiers.length) L.push("No building is on the site.", "");
  else {
    L.push("| Tier | Source | FFE (ft) | Pad top (ft) | Existing min (ft) | Existing max (ft) |", "|---|---|---|---|---|---|");
    for (const t of tiers) { const id = tierIdentity(t, built); L.push(`| ${id.id} | ${id.source} | ${n2(t.ffe)} | ${n2(t.padTop)} | ${n2(t.existingMin)} | ${n2(t.existingMax)} |`); }
    L.push("");
    const stepMax = isNum(state.maxStep) ? state.maxStep : 4;
    L.push(`The tool warns when a step between tiers is more than ${n1(stepMax)} ft.`, "");
  }
  L.push(CAUTIONS[2], "");

  L.push("## Walls", "");
  if (!wr.length) L.push("No walls.", "");
  else {
    L.push("| Wall | Kind | Length (ft) | Tallest (ft) | Average (ft) | Status |", "|---|---|---|---|---|---|");
    const flag = isNum(lim.wallFlag) ? lim.wallFlag : 4;
    for (const w of wr) L.push(`| ${w.id} | ${w.kind} | ${n1(w.length)} | ${n2(w.heightMax)}${w.heightMax > flag ? " (over " + n1(flag) + " ft)" : ""} | ${n2(w.heightAvg)} | ${w.auto ? (w.accepted ? "accepted" : "not accepted (dashed)") : "accepted"} |`);
    L.push("");
  }
  L.push(CAUTIONS[4], "");

  L.push("## Daylight slopes", "");
  L.push(dl.on === false ? "Daylight slopes are off." : `Daylight slopes: ${dl.fill ?? 3}:1 in fill and ${dl.cut ?? 2}:1 in cut.`, "");
  L.push(CAUTIONS[3], "");

  L.push("## Routes", "");
  if (!rr.length) L.push("No routes.", "");
  else {
    L.push("| Route | Kind | Steepest running slope | Steepest cross slope |", "|---|---|---|---|");
    for (const r of rr) L.push(`| ${r.name} | ${r.kind} | ${pct(r.maxSlope)} | ${pct(r.maxCross)} |`);
    L.push("");
  }
  L.push(`Limits used: walk ${pct(isNum(lim.walk) ? lim.walk : 0.05)}, ramp ${pct(isNum(lim.ramp) ? lim.ramp : 0.0833)}, cross slope ${pct(isNum(lim.cross) ? lim.cross : 0.0208)}, rise per ramp run ${n1(isNum(lim.rampRise) ? lim.rampRise : 2.5)} ft.`, "");
  L.push(CAUTIONS[6], "");

  L.push("## Drives and lots", "");
  const drives = Array.isArray(state.drives) ? state.drives : [], lots = Array.isArray(state.lots) ? state.lots : [];
  if (!drives.length && !lots.length) L.push("No drives or lots.", "");
  else {
    for (const d of drives) L.push(`- Drive ${d.id}: ${pct((d.slope ?? 0) / 100)} along, width ${n1(d.width ?? 0)} ft`);
    for (const l of lots) L.push(`- Lot ${l.id}: ${pct((l.slope ?? 0) / 100)} along, ${pct((l.cross ?? 0) / 100)} across`);
    L.push("");
  }
  L.push(CAUTIONS[5], "");

  const warnings = (Array.isArray(metrics.warnings) ? metrics.warnings : Array.isArray(built.warnings) ? built.warnings : []).filter((w) => w && (w.message || w.code));
  L.push("## Warnings", "");
  if (!warnings.length) L.push("No warnings.", "");
  else { for (const w of warnings) L.push(`- ${w.code ? w.code + ": " : ""}${w.message || ""}`); L.push(""); }

  if (Array.isArray(built.notes) && built.notes.length) { L.push("## Build notes", ""); for (const s of built.notes) L.push(`- ${s}`); L.push(""); }

  L.push("## Data caution", "", CAUTIONS[7], "");
  L.push("## Revit import", "", "Both files use the project frame. They align when you import them as follows.", "");
  L.push("1. Ground: Massing & Site > Toposolid > Create from Import > Create from CSV. Select the CSV file. Choose Decimal feet.");
  L.push("2. Other layers: Insert > Import CAD. Select the DXF file. Set Positioning to Auto - Origin to Internal Origin. Set Units to Foot.", "");
  L.push("The CSV holds the proposed ground. The DXF holds the existing and proposed contours, pads, walls, routes, and spot elevations on the layers named GRD-.", "");
  L.push(skShift <= 0
    ? `SketchUp: use Extensions > CMRLM > Import Design Tools file. The model is lowered by ${skN} ft so the lowest proposed point is 0 ft. Add ${skN} ft to return to the tool elevations.`
    : `SketchUp: use Extensions > CMRLM > Import Design Tools file. The model is raised by ${skN} ft so the lowest proposed point is 0 ft. Subtract ${skN} ft to return to the tool elevations.`, "");
  return L.join("\n");
}

return { GRADING_DXF_LAYERS, CAUTIONS, revitCsv, gradingDxf, notesMarkdown };
})();

/* ---- src/grading/sketchup.js ---- */
const SkGrading = (() => {
/* ==========================================================================
   grading/sketchup.js — Grading Sketch → ".sketchup.json" (docs/sketchup-spec.md, plan section 4)

   gradingToSketchup(state, built, metrics, meta) → a document made with makeDoc (passes validateDoc), source "grading".
     state    the grading state
     built    buildGrading(state, ...) result (plan section 4)
     metrics  computeMetrics result (optional; read only for the notes)
     meta     optional { createdAt, name, location, zShift }

   Groups (a group with nothing in it is left out):
     Proposed ground   one soft mesh over the node grid (tag "Proposed ground")
     Existing ground   one soft mesh, tag "Existing ground", hidden (visible: false)
     Pads              one `faces` node per tier: the pad polygons flat at pad top + 0.05 ft (so they do not fight the ground)
     Walls             one closed mesh per wall: 1 ft thick, centered on the wall line, from the low side to the top
     Routes            one `lines` node per route, 2 ft points, 0.15 ft above the proposed ground

   zShift: every z = tool elevation + zShift, and zShift brings the lowest proposed point (ground node, pad top, or wall
   bottom) to 0, rounded to 0.01 ft, as the Site Model export does. meta.zShift overrides it. The notes state the shift.
   Units: feet. Plan (x, y): x = east, y = north, the project frame. z up.

   Ground triangles per cell, as the Site Model: a = (i, j), b = (i+1, j), c = (i+1, j+1), d = (i, j+1); (a, b, c) and (a, c, d).
   Pure: no DOM, no input mutation.
   ========================================================================== */

const { cleanRing3, makeDoc } = SkFmt;
const { groundData, tierList, tierIdentity, padPolygons, padOf, wallRecords, routeRecords, metricsSummary, sampleLine } = GradDerivedMod;

const SKETCHUP_SOURCE = "grading";

const PAD_LIFT = 0.05;           // ft above the pad top
const ROUTE_LIFT = 0.15;         // ft above the proposed ground
const WALL_THICKNESS = 1;        // ft
const MIN_WALL_H = 0.05;                // ft: a wall shorter than this has no solid
const ROUTE_STEP = 2;                   // ft between route points

const COLORS = { "Proposed ground": "#ece9e1", "Existing ground": "#b4b4ae", Pads: "#d6d0c2", Walls: "#c4b49a", Routes: "#2f8f5b" };

const r3 = (v) => { const r = Math.round(v * 1000) / 1000; return r === 0 ? 0 : r; };
const num = (v, d) => (typeof v === "number" && Number.isFinite(v) ? v : d);

/** Soft mesh over the node grid. z = values[k] + shift. */
function groundMesh(g, values, shift, name, tag, material) {
  const { n } = g;
  const vertices = [];
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) vertices.push([r3(g.xs[i]), r3(g.ys[j]), r3(values[j * n + i] + shift)]);
  const triangles = [];
  for (let j = 0; j < n - 1; j++) for (let i = 0; i < n - 1; i++) {
    const a = j * n + i, b = a + 1, c = a + n + 1, d = a + n;
    triangles.push([a, b, c], [a, c, d]);
  }
  return { type: "mesh", name, tag, material, vertices, triangles, soft: true, closed: false };
}

/** Adds a quad (two triangles) to a mesh, wound so its normal faces `hint`. */
function addQuad(mesh, i0, i1, i2, i3, hint) {
  const v = mesh.vertices, a = v[i0], b = v[i1], c = v[i2];
  const u = [b[0] - a[0], b[1] - a[1], b[2] - a[2]], w = [c[0] - a[0], c[1] - a[1], c[2] - a[2]];
  const nrm = [u[1] * w[2] - u[2] * w[1], u[2] * w[0] - u[0] * w[2], u[0] * w[1] - u[1] * w[0]];
  const flip = nrm[0] * hint[0] + nrm[1] * hint[1] + nrm[2] * hint[2] < 0;
  const q = flip ? [i0, i3, i2, i1] : [i0, i1, i2, i3];
  mesh.triangles.push([q[0], q[1], q[2]], [q[0], q[2], q[3]]);
}

/**
 * Closed prisms for one wall: one per polyline segment, sections every sample (1 ft).
 * Section = four vertices: left-bottom, right-bottom, right-top, left-top (left = +n of the segment).
 */
function wallMesh(w, shift) {
  const s = w.profile.samples, line = w.line;
  const mesh = { vertices: [], triangles: [] };
  const bySeg = new Map();
  s.forEach((p, i) => { if (!bySeg.has(p.seg)) bySeg.set(p.seg, []); bySeg.get(p.seg).push(i); });
  let prev = -1;                                                       // index of the last sample of the previous segment
  for (const seg of [...bySeg.keys()].sort((a, b) => a - b)) {
    const idx = bySeg.get(seg).slice();
    if (prev >= 0) idx.unshift(prev);
    prev = idx[idx.length - 1];
    const a = line[seg], b = line[seg + 1], L = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (!(L > 0) || idx.length < 2) continue;
    const tx = (b[0] - a[0]) / L, ty = (b[1] - a[1]) / L, nx = -ty, ny = tx, h = WALL_THICKNESS / 2;
    const base = mesh.vertices.length;
    for (const i of idx) {
      const p = s[i], top = p.top + shift, bot = Math.min(p.bottom, p.top - MIN_WALL_H) + shift;
      mesh.vertices.push([r3(p.x + nx * h), r3(p.y + ny * h), r3(bot)], [r3(p.x - nx * h), r3(p.y - ny * h), r3(bot)], [r3(p.x - nx * h), r3(p.y - ny * h), r3(top)], [r3(p.x + nx * h), r3(p.y + ny * h), r3(top)]);
    }
    const sec = (k) => base + k * 4;
    for (let k = 0; k < idx.length - 1; k++) {
      const A = sec(k), B = sec(k + 1);
      addQuad(mesh, A, A + 1, B + 1, B, [0, 0, -1]);                 // bottom
      addQuad(mesh, A + 3, A + 2, B + 2, B + 3, [0, 0, 1]);          // top
      addQuad(mesh, A, A + 3, B + 3, B, [nx, ny, 0]);                // left side
      addQuad(mesh, A + 1, A + 2, B + 2, B + 1, [-nx, -ny, 0]);      // right side
    }
    const S = sec(0), E = sec(idx.length - 1);
    addQuad(mesh, S, S + 1, S + 2, S + 3, [-tx, -ty, 0]);            // start cap
    addQuad(mesh, E, E + 1, E + 2, E + 3, [tx, ty, 0]);              // end cap
  }
  return mesh;
}

function gradingToSketchup(state, built, metrics, meta) {
  if (!state) throw new Error('gradingToSketchup: missing input "state".');
  if (!built || !built.grid) throw new Error('gradingToSketchup: missing input "built.grid".');
  const mt = meta || {};
  const g = groundData(built);
  const wr = wallRecords(state, built).filter((w) => w.heightMax >= MIN_WALL_H && w.profile.samples.length > 1);
  const rr = routeRecords(state, built, metrics || {});
  const tiers = tierList(built);

  // zShift: the lowest proposed point
  let lo = Infinity;
  for (let k = 0; k < g.pz.length; k++) if (g.pz[k] < lo) lo = g.pz[k];
  for (const t of tiers) if (Number.isFinite(t.padTop) && t.padTop < lo) lo = t.padTop;
  for (const w of wr) for (const p of w.profile.samples) if (p.bottom < lo) lo = p.bottom;
  const computed = Math.round(-lo * 100) / 100 || 0;
  const shift = num(mt.zShift, computed);
  const shiftNote = shift <= 0
    ? `The model is lowered by ${Math.abs(shift).toFixed(2)} ft so the lowest proposed point is 0 ft. Add ${Math.abs(shift).toFixed(2)} ft to return to the tool elevations.`
    : `The model is raised by ${Math.abs(shift).toFixed(2)} ft so the lowest proposed point is 0 ft. Subtract ${Math.abs(shift).toFixed(2)} ft to return to the tool elevations.`;

  const tagList = [], matList = [], declaredTags = new Set(), declaredMats = new Set();
  const tag = (name, visible = true) => { if (!declaredTags.has(name)) { declaredTags.add(name); tagList.push({ name, color: COLORS[name], visible }); } return name; };
  const mat = (name) => { if (!declaredMats.has(name)) { declaredMats.add(name); matList.push({ name, color: COLORS[name], alpha: 1 }); } return name; };

  const children = [];
  const add = (nm, tg, visible, kids, material) => {
    if (!kids.length) return;
    children.push({ type: "group", name: nm, tag: tag(tg, visible), material: material ? mat(material) : undefined, children: kids });
  };

  // ground
  add("Proposed ground", "Proposed ground", true, [groundMesh(g, g.pz, shift, "Proposed ground mesh", undefined, undefined)], "Proposed ground");
  add("Existing ground", "Existing ground", false, [groundMesh(g, g.ez, shift, "Existing ground mesh", undefined, undefined)], "Existing ground");

  // pads
  const pads = [];
  for (const t of tiers) {
    const id = tierIdentity(t, built);
    const polygons = [];
    for (const poly of padPolygons(padOf(t))) {
      const z = r3(t.padTop + shift + PAD_LIFT);
      const outer = cleanRing3(poly.outer.map((p) => [p[0], p[1], z]));
      if (!outer) continue;
      const holes = poly.holes.map((h) => cleanRing3(h.map((p) => [p[0], p[1], z]), { hole: true })).filter(Boolean);
      polygons.push({ outer, holes });
    }
    if (polygons.length) pads.push({ type: "faces", name: id.id, polygons, attributes: { tier: t.tier, ffe: Math.round(t.ffe * 100) / 100, padTop: Math.round(t.padTop * 100) / 100, source: id.source } });
  }
  add("Pads", "Pads", true, pads, "Pads");

  // walls
  const walls = [];
  for (const w of wr) {
    const m = wallMesh(w, shift);
    if (!m.triangles.length) continue;
    walls.push({
      type: "mesh", name: `${w.id} (${w.kind})`, vertices: m.vertices, triangles: m.triangles, soft: false, closed: true,
      attributes: { kind: w.kind, heightMax: Math.round(w.heightMax * 100) / 100, heightAvg: Math.round(w.heightAvg * 100) / 100, length: Math.round(w.length * 10) / 10, accepted: w.accepted },
    });
  }
  add("Walls", "Walls", true, walls, "Walls");

  // routes
  const routes = [];
  for (const r of rr) {
    const pts = sampleLine(r.line, ROUTE_STEP, built.surface.at).map((p) => [r3(p[0]), r3(p[1]), r3(p[2] + shift + ROUTE_LIFT)]);
    if (pts.length > 1) routes.push({ type: "lines", name: r.name, lines: [pts], attributes: { kind: r.kind, maxSlope: Math.round(r.maxSlope * 10000) / 10000, maxCross: Math.round(r.maxCross * 10000) / 10000 } });
  }
  add("Routes", "Routes", true, routes);

  const name = String(mt.name || state.name || "Grading Sketch");
  const notes = [
    "Plan origin = the project frame origin (0, 0). x = east, y = north. Lengths in feet. z = proposed elevation plus the shift below.",
    `SketchUp: ${shiftNote}`,
    `Grading Sketch: ${g.n} by ${g.n} ground points at ${g.spacing} ft spacing, ${tiers.length} pad tiers, ${wr.length} walls, ${routes.length} routes.`,
  ];
  if (metrics) {
    try {
      const m = metricsSummary(state, built, metrics, wr, rr);
      notes.push(`Earthwork on the grid: cut ${m.cutCy.toFixed(1)} cy, fill ${m.fillCy.toFixed(1)} cy, net ${m.netCy.toFixed(1)} cy (positive = import).`);
    } catch (e) { /* the notes work without the earthwork line */ }
  }
  notes.push(
    "Pads are flat faces 0.05 ft above the pad top. Walls are 1 ft thick, centered on the wall line, from the low side to the top. Existing ground is in a hidden tag.",

// A closed rectangle ring centered on (cx, cy), with the corners in the order the plan lists them.

  const hw = width / 2;
  const hd = depth / 2;
  return [[cx - hw, cy - hd], [cx + hw, cy - hd], [cx + hw, cy + hd], [cx - hw, cy + hd]];

/* ==========================================================================
   SHARED: units
   Decimal feet, elevations, square feet, cubic yards, and parsing of typed values.
   Feet, square feet, and cubic yards only (version 1).
   ========================================================================== */
const Units = (() => {
  const grouped = (n, digits = 0) => n.toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits });

  /** 312.5 -> 312'-6"  (rounds to the nearest inch) */
  function formatFeetInches(ft) {
    if (typeof ft !== 'number' || !isFinite(ft)) return '—';
    const totalIn = Math.round(Math.abs(ft) * 12);
    const f = Math.floor(totalIn / 12), i = totalIn % 12;
    return `${ft < 0 && totalIn > 0 ? '-' : ''}${grouped(f)}'-${i}"`;
  }
  /** 100000 -> "100,000 sf" */
  function formatArea(sf) {
    if (typeof sf !== 'number' || !isFinite(sf)) return '—';
    return `${grouped(Math.round(sf) || 0)} sf`;
  }
  /** 1001 -> "1,001.00" (elevations: NAVD88 feet with a site, local feet without one) */
  const formatElev = (v) => (typeof v === 'number' && isFinite(v) ? grouped(v, 2) : '—');
  /** 1.625 -> "1.63 ft" */
  const formatFt = (v, d = 2) => (typeof v === 'number' && isFinite(v) ? `${grouped(v, d)} ft` : '—');
  /** 1083.33 -> "1,083.3 cy" */
  const formatCy = (v, d = 1) => (typeof v === 'number' && isFinite(v) ? `${grouped(v, d)} cy` : '—');
  /** The HUD rounds volumes to 10 cy (plan risk 1): 325.1 -> "330 cy" */
  const formatCy10 = (v) => (typeof v === 'number' && isFinite(v) ? `${grouped(Math.round(v / 10) * 10 + 0)} cy` : '—');
  const formatSigned = (v, f) => (typeof v === 'number' && isFinite(v) ? `${v > 0.00001 ? '+' : v < -0.00001 ? '−' : '±'}${f(Math.abs(v))}` : '—');
  /** 0.0833 -> "8.3%" */
  const formatPct = (f, d = 1) => (typeof f === 'number' && isFinite(f) ? `${grouped(f * 100, d)}%` : '—');
  const formatInt = (n) => (typeof n === 'number' && isFinite(n)) ? grouped(Math.round(n) || 0) : '—';
  const formatRatio = (n, d = 2) => (typeof n === 'number' && isFinite(n)) ? grouped(n, d) : '—';
  const formatDeg = (n) => `${Math.round(n)}°`;

  /** Parse "10'-6\"", "10.5", "10'", "10' 6", "6\"", "10 ft 6 in", "10-6", "6 1/2\"" to feet. NaN when invalid. */
  function parseLength(input) {
    if (typeof input === 'number') return isFinite(input) ? input : NaN;
    let s = String(input == null ? '' : input).trim().toLowerCase();
    s = s.replace(/[, ]/g, '').replace(/[′’‘]/g, "'").replace(/[″“”]/g, '"').replace(/\s+/g, ' ');
    if (!s) return NaN;
    let sign = 1;
    if (s[0] === '-') { sign = -1; s = s.slice(1).trim(); } else if (s[0] === '+') { s = s.slice(1).trim(); }
    const NUM = '(\\d+\\.?\\d*|\\.\\d+)';
    if (new RegExp('^' + NUM + '$').test(s)) return sign * parseFloat(s);

    const parseInches = (t) => {
      t = t.trim().replace(/\s*(?:"|in\.?|inch|inches)$/, '').trim();
      if (t === '') return 0;
      let m;

function computeBounds(built, zBase, exag) {
  const g = built.grid, L = (g.n - 1) * g.spacing;
  const site = { minX: g.x0, maxX: g.x0 + L, minY: g.y0, maxY: g.y0 + L };
  const work = boxOfFeatures(built) || { minX: g.x0 + L * 0.3, maxX: g.x0 + L * 0.7, minY: g.y0 + L * 0.3, maxY: g.y0 + L * 0.7 };
  const pad = Math.max(80, Math.min(160, 0.35 * Math.max(work.maxX - work.minX, work.maxY - work.minY)));
  const union = {
    minX: Math.max(site.minX, work.minX - pad), maxX: Math.min(site.maxX, work.maxX + pad),
    minY: Math.max(site.minY, work.minY - pad), maxY: Math.min(site.maxY, work.maxY + pad),
  };
  const relief = Math.max(1, (g.max - zBase)) * exag + CONFIG.buildingHeight + 6;
  const mk = (b) => ({ ...b, height: relief });
  return { model: mk(work), site: mk(site), union: mk(union), all: mk(site) };
}

/** The block of coarse cells that gets the 2x refinement: the work grown by 20 ft, made square, kept inside the grid. null in draft quality. */
function refineBlock(built) {
  if (built.quality === 'draft') return null;
  const g = built.grid, work = boxOfFeatures(built);
  if (!work || g.n < 3) return null;
  const sp = g.spacing, n = g.n;
  const grow = 20;
  const ci0 = Math.floor((work.minX - grow - g.x0) / sp), ci1 = Math.ceil((work.maxX + grow - g.x0) / sp);
  const cj0 = Math.floor((work.minY - grow - g.y0) / sp), cj1 = Math.ceil((work.maxY + grow - g.y0) / sp);
  let m = Math.max(ci1 - ci0, cj1 - cj0, 2);
  m = Math.min(m, n - 1);
  const mid = (a, b) => (a + b) / 2;
  const i0 = clamp(Math.round(mid(ci0, ci1) - m / 2), 0, n - 1 - m), j0 = clamp(Math.round(mid(cj0, cj1) - m / 2), 0, n - 1 - m);
  if (m * m > 120 * 120) return null;                      // a very large block would cost more than it shows
  return { i0, j0, m };
}

/** The half-spacing grid over the block: { spacing, n, x0, y0, z }. Border midpoints take the average of their coarse neighbors, so the two meshes meet without a crack. */
function fineGridOf(built, block) {
  if (!block) return null;
  const g = built.grid, at = built.surface.at, sp = g.spacing / 2, N = block.m * 2 + 1;
  const x0 = g.x0 + block.i0 * g.spacing, y0 = g.y0 + block.j0 * g.spacing;
  const z = new Float64Array(N * N);
  for (let b = 0; b < N; b++) for (let a = 0; a < N; a++) {
    if ((a & 1) && (b === 0 || b === N - 1)) continue;
    if ((b & 1) && (a === 0 || a === N - 1)) continue;
    z[b * N + a] = at(x0 + a * sp, y0 + b * sp);
  }
  for (let b = 0; b < N; b++) for (let a = 0; a < N; a++) {
    if ((a & 1) && (b === 0 || b === N - 1)) z[b * N + a] = (z[b * N + a - 1] + z[b * N + a + 1]) / 2;
    else if ((b & 1) && (a === 0 || a === N - 1)) z[b * N + a] = (z[(b - 1) * N + a] + z[(b + 1) * N + a]) / 2;
  }
  return { spacing: sp, n: N, x0, y0, z, block };
}

/** The HUD figures, from the metrics so they always add up. Volumes round to 10 cy on the HUD (concept risk 1); the panel shows 0.1 cy. */
function summarize(s, built, metrics) {
  const cutCy = mv(metrics.cutCy), fillCy = mv(metrics.fillCy), netCy = mv(metrics.netCy);
  const walls = metrics.walls && Array.isArray(metrics.walls.list) ? metrics.walls.list : [];
  return {
    cut: round10(cutCy), fill: round10(fillCy), net: round10(netCy), cutCy, fillCy, netCy, bulkedNetCy: mv(metrics.bulkedNetCy), balance: mv(metrics.balance, 1),
    wallMax: mv(metrics.wallHeightMax), wallAvg: mv(metrics.wallHeightAvg), wallLength: mv(metrics.wallLength), wallCount: walls.length,
    padArea: mv(metrics.padArea), disturbed: mv(metrics.disturbedArea), steepestRoute: mv(metrics.steepestRoute),
    tiers: Array.isArray(metrics.tiers) ? metrics.tiers : [], steps: Array.isArray(metrics.steps) ? metrics.steps : [],
    routes: Array.isArray(metrics.routes) ? metrics.routes : [], walls,
    tierCount: (built.tiers || []).length, subdivide: mv(metrics.subdivide, 4), quality: built.quality || 'full', cellsSampled: mv(metrics.cellsSampled),
  };
}

/** Everything the UI, the renderer, the exports and the compare view need for one state (no caching). */
function computeDerived(s, { project = null, quality = 'full' } = {}) {
  try {
    const built = FeaturesMod.buildGrading(s, { project, quality });
    const metrics = GradMetricsMod.computeMetrics(s, built);
    // metrics.warnings IS the checks() list (it already carries the build warnings); show only that list, never built.warnings on top.
    const checks = Array.isArray(metrics.warnings) ? metrics.warnings : GradMetricsMod.checks(s, metrics);
    const warnings = (checks || []).map(mapWarning);
    const proposedZ = EarthMod.proposedGrid(built);
    let zLo = Infinity, zHi = -Infinity;
    for (let k = 0; k < proposedZ.length; k++) { if (proposedZ[k] < zLo) zLo = proposedZ[k]; if (proposedZ[k] > zHi) zHi = proposedZ[k]; }
    zLo = Math.min(zLo, built.grid.min); zHi = Math.max(zHi, built.grid.max);
    for (const t of built.tiers || []) { if (isFinite(t.ffe)) zHi = Math.max(zHi, t.ffe + CONFIG.buildingHeight); }
    const zBase = Math.floor(zLo) - 4;
    const exag = s.view && s.view.exaggeration ? s.view.exaggeration : 1;
    const hud = summarize(s, built, metrics);
    const refine = refineBlock(built);
    const box = boxOfFeatures(built);
    return {
      ok: true, state: s, built, metrics, warnings: sortWarnings(warnings), box, bounds: computeBounds(built, zBase, exag), hud,
      proposedZ, zBase, zMin: zLo, zMax: zHi, refine, fine: fineGridOf(built, refine), notes: built.notes || [], quality: built.quality,
    };
  } catch (e) {
    console.error(e);
    return emptyDerived('The grading could not be built for these settings.');
  }
}

const Derived = (() => {
  let gKey = null, geomId = 0, counter = 0, cache = null;
  // Geometry key: everything that changes the build or the numbers. The name and the view only change drawing.
  const geomKeyOf = (s) => { const { view, name, ...rest } = s; return JSON.stringify(rest); };
  const qualityNow = () => (Store.gestureActive() && !Store.gesturePath().startsWith('view') ? 'draft' : 'full');
  function get() {
    const s = Store.raw();
    const q = qualityNow();
    const gk = `${geomKeyOf(s)}|${s.view.exaggeration}|${ProjectUI.dataKey()}|${q}`;
    if (gk !== gKey || !cache) {
      gKey = gk; geomId++;
      cache = { id: ++counter, geomId, ...computeDerived(s, { project: ProjectUI.dataDoc(), quality: q }) };
    }
    return cache;
  }
  /** What to draw: the draft or the full build. */
  function display() {
    const d = get();
    return { key: `${d.geomId}`, quality: d.quality === 'draft' ? 'draft' : 'full' };
  }
  return { get, display };
})();

/* ==========================================================================
   OVERLAYS  (flat text labels and lines laid on the deck)
   Objects are plain three.js lines and meshes. Each one owns its material (userData.ownMat), so the renderer
   disposes it when the layer is rebuilt. Text is drawn into a canvas and laid flat on a plane that has a size in feet,
   so it stays readable in plan and shrinks with distance in the axon view.
   ========================================================================== */
const Overlays = (() => {
  const rootCss = (name, fb) => { const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); return new THREE.Color(v || fb); };
  const W = (p, z) => planToWorld(p[0], p[1], z);
  const fmtN = (n) => Math.round(n).toLocaleString('en-US');
  const SEED_COLORS = { stair: '#d9731a', 'exterior-stair': '#d9a22b', elevator: '#7a5cc2' };

  function lines(pos, { color, opacity = 1, dashed = false, order = 4, dash = 4, gap = 3 }) {
    if (!pos.length) return null;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    const mat = dashed
      ? new THREE.LineDashedMaterial({ color, transparent: opacity < 1, opacity, dashSize: dash, gapSize: gap, depthWrite: false })
      : new THREE.LineBasicMaterial({ color, transparent: opacity < 1, opacity, depthWrite: false });
    const ls = new THREE.LineSegments(geo, mat);
    ls.renderOrder = order; ls.frustumCulled = false; ls.userData.ownMat = true;
    if (dashed) ls.computeLineDistances();
    return ls;
  }
  const loopPos = (pos, ring, z) => { for (let i = 0; i < ring.length; i++) pos.push(...W(ring[i], z), ...W(ring[(i + 1) % ring.length], z)); };

  /** Text lying flat on the plan at (x, y, z). `height` is the height of one line of text in feet. */
  function label(text, x, y, z, { height = 5, color = '#1d2733', halo = '#ffffff' } = {}) {
    const rows = String(text).split('\n');
    const px = 48, pad = 12;
    const cv = document.createElement('canvas');
    const ctx0 = cv.getContext('2d');
    ctx0.font = `600 ${px}px system-ui, -apple-system, Segoe UI, sans-serif`;
    const widest = Math.max(...rows.map((r) => ctx0.measureText(r).width));
    cv.width = Math.ceil(widest + pad * 2); cv.height = Math.ceil(rows.length * px * 1.2 + pad * 2);
    const ctx = cv.getContext('2d');
    ctx.font = `600 ${px}px system-ui, -apple-system, Segoe UI, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    rows.forEach((r, i) => {
      const yy = pad + px * 0.6 + i * px * 1.2;
      ctx.lineWidth = 9; ctx.strokeStyle = halo; ctx.strokeText(r, cv.width / 2, yy);
      ctx.fillStyle = color; ctx.fillText(r, cv.width / 2, yy);
    });
    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
    const hh = height * rows.length * 1.2 + (height * 2 * pad) / px, ww = (hh * cv.width) / cv.height;
    const geo = new THREE.PlaneGeometry(ww, hh);
    geo.translate(x, y, 0);
    geo.applyMatrix4(planMatrix(z));
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.renderOrder = 6; mesh.frustumCulled = false; mesh.userData.ownMat = true; mesh.userData.label = text;
    return mesh;
  }

  return { label, lines, loopPos };
})();

/* ==========================================================================
   GROUND 3D
   Builds the three.js objects of a grading sketch from one Derived result (plan section 6):
     the proposed ground as one indexed mesh (the grid, refined 2x inside the work block), a skirt down to a base level,
     cut and fill colors (five steps each), the existing ground as a light wireframe where it differs, contours (proposed solid,
     existing dashed, majors heavier), the zero line, pad outlines and caps, one-story blocks on the tiers, walls (1 ft thick prisms
     from the low side to the top), routes (tubes colored per sample class), drive and lot outlines, the property line, slope
     conflict markers, the section line, and the site neighbors as a ghost.
   Elevations are shifted by the base level (D.zBase) and scaled by the exaggeration; plan coordinates go through planToWorld.
   Everything the renderer owns (materials) is created here with userData.ownMat, so the renderer disposes it on rebuild.
   ========================================================================== */
const Ground3D = (() => {
  const css = (name, fb) => new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fb);
  const col = (hex) => new THREE.Color(hex);
  const SKIRT = '#b9bfc6';

  /** Color of a difference (proposed minus existing) on the cut and fill map: fill blue, cut red, five steps each. */
  function diffColor(diff) {
    const a = Math.abs(diff);
    if (a < CONFIG.noChange) return col(CONFIG.noChangeColor);
    let i = 0;
    while (i < CONFIG.diffEdges.length && a >= CONFIG.diffEdges[i]) i++;
    return col(diff > 0 ? CONFIG.fillColors[i] : CONFIG.cutColors[i]);
  }

  /** The (x, y, elevation) -> world point function for a derived result and a state (exaggeration included). */
  function mapper(D, state) {
    const ex = (state.view && state.view.exaggeration) || 1, zb = D.zBase;
    const Y = (e) => (e - zb) * ex;
    return { Y, W: (x, y, e) => planToWorld(x, y, Y(e)), V: (x, y, e) => new THREE.Vector3(...planToWorld(x, y, Y(e))), ex, zb };
  }

  /* ---- fat lines (LineSegments2): width in CSS pixels, the renderer sets the resolution each frame ---- */
  function fat(pos, hex, width, o = {}) {
    if (!pos.length) return null;
    const geo = new LineSegmentsGeometry();
    geo.setPositions(pos);
    const op = o.opacity == null ? 1 : o.opacity;
    const mat = new LineMaterial({ color: col(hex).getHex(), linewidth: width, transparent: op < 1, opacity: op, depthWrite: false, depthTest: o.depthTest !== false, dashed: !!o.dashed, dashSize: o.dash || 4, gapSize: o.gap || 3 });
    const ls = new LineSegments2(geo, mat);
    if (o.dashed) ls.computeLineDistances();
    ls.renderOrder = o.order == null ? 5 : o.order; ls.frustumCulled = false; ls.userData.ownMat = true;
    return ls;
  }
  const loopPos = (out, ring, z, W) => { for (let i = 0; i < ring.length; i++) { const a = ring[i], b = ring[(i + 1) % ring.length]; out.push(...W(a[0], a[1], z), ...W(b[0], b[1], z)); } };
  /** A ring or a line sampled every `step` ft, each point at the elevation zAt(x, y). */
  function drape(out, pts, closed, step, zAt, W, lift = 0.15) {
    const n = pts.length, last = closed ? n : n - 1;
    for (let i = 0; i < last; i++) {
      const a = pts[i], b = pts[(i + 1) % n];
      const L = Math.hypot(b[0] - a[0], b[1] - a[1]), k = Math.max(1, Math.ceil(L / step));
      let q = null;
      for (let s = 0; s <= k; s++) {
        const f = s / k, x = a[0] + (b[0] - a[0]) * f, y = a[1] + (b[1] - a[1]) * f;
        const p = W(x, y, zAt(x, y) + lift);
        if (q) out.push(...q, ...p);
        q = p;
      }
    }
  }

  /* ---- the ground mesh ---------------------------------------------------------------------------------- */
  function groundObjects(D, state, M) {
    const b = D.built, g = b.grid, n = g.n, sp = g.spacing, pz = D.proposedZ, cutfill = state.view.style === 'cutfill';
    const fine = D.fine, blk = fine ? fine.block : null, nf = fine ? fine.n : 0;
    const nv = n * n + nf * nf;
    const pos = new Float32Array(nv * 3), colr = new Float32Array(nv * 3);
    const modelC = css('--scene-model', '#f6f6f3');
    const put = (k, x, y, z, e) => {
      pos[3 * k] = x; pos[3 * k + 1] = M.Y(z); pos[3 * k + 2] = -y;
      const c = cutfill ? diffColor(z - e) : modelC;
      colr[3 * k] = c.r; colr[3 * k + 1] = c.g; colr[3 * k + 2] = c.b;
    };
    for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) put(j * n + i, g.x0 + i * sp, g.y0 + j * sp, pz[j * n + i], g.z[j * n + i]);
    if (fine) for (let jb = 0; jb < nf; jb++) for (let ia = 0; ia < nf; ia++) {
      const x = fine.x0 + ia * fine.spacing, y = fine.y0 + jb * fine.spacing;
      put(n * n + jb * nf + ia, x, y, fine.z[jb * nf + ia], b.existingAt(x, y));
    }
    const idx = [];
    const inBlock = (i, j) => !!blk && i >= blk.i0 && i < blk.i0 + blk.m && j >= blk.j0 && j < blk.j0 + blk.m;
    for (let j = 0; j < n - 1; j++) for (let i = 0; i < n - 1; i++) {
      if (inBlock(i, j)) continue;
      const a = j * n + i, bb = a + 1, c = a + n + 1, d = a + n;
      idx.push(a, bb, c, a, c, d);
    }
    if (fine) for (let jb = 0; jb < nf - 1; jb++) for (let ia = 0; ia < nf - 1; ia++) {
      const a = n * n + jb * nf + ia, bb = a + 1, c = a + nf + 1, d = a + nf;
      idx.push(a, bb, c, a, c, d);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colr, 3));
    geo.setIndex(new THREE.BufferAttribute(nv > 65535 ? new Uint32Array(idx) : new Uint16Array(idx), 1));
    geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, vertexColors: true, roughness: 0.96, metalness: 0, polygonOffset: true, polygonOffsetFactor: 1.5, polygonOffsetUnits: 1.5 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.userData.model = true; mesh.userData.ownMat = true; mesh.userData.ground = true; mesh.renderOrder = 0;
    const out = [mesh];

    // skirt: the four sides down to the base level (elevation zBase)
    const sk = [], skc = [];
    const top = (i, j) => M.Y(pz[j * n + i]);
    const sc = col(SKIRT);
    const quad = (x0, y0, t0, x1, y1, t1) => {
      sk.push(x0, t0, -y0, x1, t1, -y1, x1, 0, -y1, x0, t0, -y0, x1, 0, -y1, x0, 0, -y0);
      for (let q = 0; q < 6; q++) skc.push(sc.r, sc.g, sc.b);
    };
    for (let i = 0; i < n - 1; i++) {
      quad(g.x0 + i * sp, g.y0, top(i, 0), g.x0 + (i + 1) * sp, g.y0, top(i + 1, 0));
      quad(g.x0 + i * sp, g.y0 + (n - 1) * sp, top(i, n - 1), g.x0 + (i + 1) * sp, g.y0 + (n - 1) * sp, top(i + 1, n - 1));
      quad(g.x0, g.y0 + i * sp, top(0, i), g.x0, g.y0 + (i + 1) * sp, top(0, i + 1));
      quad(g.x0 + (n - 1) * sp, g.y0 + i * sp, top(n - 1, i), g.x0 + (n - 1) * sp, g.y0 + (i + 1) * sp, top(n - 1, i + 1));
    }
    const sgeo = new THREE.BufferGeometry();
    sgeo.setAttribute('position', new THREE.Float32BufferAttribute(sk, 3));
    sgeo.setAttribute('color', new THREE.Float32BufferAttribute(skc, 3));
    sgeo.computeVertexNormals();
    const skirt = new THREE.Mesh(sgeo, new THREE.MeshStandardMaterial({ color: 0xffffff, vertexColors: true, roughness: 1, side: THREE.DoubleSide }));
    skirt.userData.model = true; skirt.userData.ownMat = true; skirt.userData.skirt = true;
    out.push(skirt);
    return out;
  }

  /** Light gray wireframe of the existing ground where it differs from the proposed ground. */
  function existingWire(D, M) {
    const g = D.built.grid, n = g.n, sp = g.spacing, pz = D.proposedZ, ez = g.z;
    const pos = [];
    const changed = (i, j) => {
      for (const [di, dj] of [[0, 0], [1, 0], [1, 1], [0, 1]]) { const k = (j + dj) * n + i + di; if (Math.abs(pz[k] - ez[k]) > 0.05) return true; }
      return false;
    };
    const P = (i, j) => M.W(g.x0 + i * sp, g.y0 + j * sp, ez[j * n + i]);
    for (let j = 0; j < n - 1; j++) for (let i = 0; i < n - 1; i++) {
      if (!changed(i, j)) continue;
      pos.push(...P(i, j), ...P(i + 1, j), ...P(i, j), ...P(i, j + 1));
      if (i === n - 2 || !changed(i + 1, j)) pos.push(...P(i + 1, j), ...P(i + 1, j + 1));
      if (j === n - 2 || !changed(i, j + 1)) pos.push(...P(i, j + 1), ...P(i + 1, j + 1));
    }
    if (!pos.length) return null;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    const ls = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: col(CONFIG.existingColor), transparent: true, opacity: 0.38, depthWrite: false }));
    ls.renderOrder = 3; ls.frustumCulled = false; ls.userData.ownMat = true; ls.userData.wire = true;
    return ls;
  }

  /* ---- contours ----------------------------------------------------------------------------------------- */
  const inRect = (x, y, r) => x >= r.x0 - 1e-6 && x <= r.x1 + 1e-6 && y >= r.y0 - 1e-6 && y <= r.y1 + 1e-6;
  function contourSegs(lines, rect, W, lift, keep) {
    const out = [];
    for (const L of lines) {
      if (!keep(L)) continue;
      for (let i = 0; i + 1 < L.line.length; i++) {
        const a = L.line[i], b = L.line[i + 1];
        if (rect && inRect((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, rect)) continue;
        out.push(...W(a[0], a[1], L.z + lift), ...W(b[0], b[1], L.z + lift));
      }
    }
    return out;
  }
  function safeContours(grid, values, interval) {
    try { return ContoursMod.contours(grid, values, interval, { majorEvery: 5 }); } catch (e) { console.error(e); return []; }
  }
  /** The contour objects (proposed, existing, zero line) and their labels. */
  function contourObjects(D, state, M, overlay) {
    const v = state.view, ci = v.contours;
    const g = D.built.grid, n = g.n, sp = g.spacing;
    const gridLike = { spacing: sp, n, x0: g.x0, y0: g.y0 };
    const fine = D.fine;
    const fineLike = fine ? { spacing: fine.spacing, n: fine.n, x0: fine.x0, y0: fine.y0 } : null;
    const rect = fine ? { x0: fine.x0, y0: fine.y0, x1: fine.x0 + (fine.n - 1) * fine.spacing, y1: fine.y0 + (fine.n - 1) * fine.spacing } : null;
    const lift = 0.06;
    const interval = ci.interval === 2 ? 2 : 1;
    const labels = [];
    if (ci.on && ci.proposed) {
      const coarse = safeContours(gridLike, D.proposedZ, interval), fineL = fine ? safeContours(fineLike, fine.z, interval) : [];
      const lines = coarse.concat(fineL);
      // lines of the coarse set are clipped against the refined block; the refined lines are all kept
      const mk = (major) => contourSegs(coarse, rect, M.W, lift, (L) => L.major === major).concat(contourSegs(fineL, null, M.W, lift, (L) => L.major === major));
      const minor = fat(mk(false), '#3d4650', 1, { opacity: 0.45, order: 4 });
      const major = fat(mk(true), '#2b333b', 1.5, { opacity: 0.85, order: 4 });
      if (minor) { minor.userData.contour = 'proposed'; overlay.push(minor); }
      if (major) { major.userData.contour = 'proposed'; overlay.push(major); }
      // labels on the major lines: the longest piece of each level, at its middle, at most 14
      const best = new Map();
      const len = (line) => polyLength(line);
      for (const L of lines) {
        if (!L.major) continue;
        const l = len(L.line);
        if (l > 70 && (!best.has(L.z) || best.get(L.z).l < l)) best.set(L.z, { l, L });
      }
      for (const { L } of [...best.values()].sort((a, b) => b.l - a.l).slice(0, 14)) {
        const mid = L.line[Math.floor(L.line.length / 2)];
        labels.push({ text: Math.round(L.z).toLocaleString('en-US'), x: mid[0], y: mid[1], z: L.z });
      }
    }
    if (ci.on && ci.existing) {
      const lines = safeContours(gridLike, g.z, interval);
      const dashed = fat(contourSegs(lines, null, M.W, lift, () => true), CONFIG.existingColor, 1, { dashed: true, dash: 3, gap: 2.5, opacity: 0.9, order: 3 });
      if (dashed) { dashed.userData.contour = 'existing'; overlay.push(dashed); }
    }
    if (v.style === 'cutfill') {
      const diff = new Float64Array(n * n);
      for (let k = 0; k < n * n; k++) diff[k] = D.proposedZ[k] - g.z[k];
      let zl = [];
      try { zl = ZeroLineOf(gridLike, diff); } catch (e) { zl = []; }
      const pos = [];
      const addLine = (line, clip) => {
        for (let i = 0; i + 1 < line.length; i++) {
          const a = line[i], b = line[i + 1];
          if (clip && rect && inRect((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, rect)) continue;
          pos.push(...M.W(a[0], a[1], g.at(a[0], a[1]) + 0.2), ...M.W(b[0], b[1], g.at(b[0], b[1]) + 0.2));
        }
      };
      for (const line of zl) addLine(line, true);
      if (fine) {
        const fd = new Float64Array(fine.n * fine.n);
        for (let jb = 0; jb < fine.n; jb++) for (let ia = 0; ia < fine.n; ia++) fd[jb * fine.n + ia] = fine.z[jb * fine.n + ia] - D.built.existingAt(fine.x0 + ia * fine.spacing, fine.y0 + jb * fine.spacing);
        let zf = [];
        try { zf = ZeroLineOf(fineLike, fd); } catch (e) { zf = []; }
        for (const line of zf) addLine(line, false);

      const z = fat(pos, '#1d242b', 2, { order: 6 });

  }
  const ZeroLineOf = (grid, diff) => ContoursMod.zeroLine(grid, diff);

  /* ---- pads, buildings ------------------------------------------------------------------------------------- */
  function padObjects(D, state, M, model, overlay) {
    const cutfill = state.view.style === 'cutfill';
    const modelC = css('--scene-model', '#f6f6f3');
    const edge = css('--scene-edge', '#20262d');
    const pos = [];
    for (const t of D.built.tiers) {
      for (const ring of t.pads || []) loopPos(pos, ring, t.padTop + 0.1, M.W);
      // thin cap in Model style so the pad edge is crisp whatever the grid does
      if (!cutfill) {
        for (const ring of t.pads || []) {
          try {
            const shape = new THREE.Shape(ring.map((q) => new THREE.Vector2(q[0], q[1])));
            const geo = new THREE.ShapeGeometry(shape);
            geo.deleteAttribute('uv');
            geo.applyMatrix4(planMatrix(M.Y(t.padTop) + 0.03));
            const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: modelC, roughness: 0.96, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 }));
            m.userData.model = true; m.userData.ownMat = true; m.userData.padCap = t.id; m.userData.pick = { kind: 'building', id: t.building };
            model.push(m);
          } catch (e) { /* a degenerate ring draws no cap */ }
        }
      }
    }
    const lines = fat(pos, CONFIG.padColor, 2, { order: 6 });
    if (lines) { lines.userData.pads = true; overlay.push(lines); }

    // one-story blocks at each tier, for scale
    const mass = new THREE.MeshStandardMaterial({ color: modelC, roughness: 0.94, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
    const edgeMat = new THREE.LineBasicMaterial({ color: edge, transparent: true, opacity: 0.55 });
    for (const t of D.built.tiers) {
      for (const ring of t.outers || (t.outer && t.outer.length ? [t.outer] : [])) {
        try {
          const shape = new THREE.Shape(ring.map((q) => new THREE.Vector2(q[0], q[1])));
          const depth = Math.max(0.2, (t.ffe - t.padTop + CONFIG.buildingHeight) * M.ex);
          const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, steps: 1, curveSegments: 1 });
          geo.deleteAttribute('uv');
          geo.applyMatrix4(planMatrix(M.Y(t.padTop)));
          const mesh = new THREE.Mesh(geo, mass);
          mesh.userData.model = true; mesh.userData.pick = { kind: 'building', id: t.building }; mesh.userData.block = t.id;
          model.push(mesh);
          const eg = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), edgeMat);
          eg.userData.edges = true; eg.renderOrder = 2;
          model.push(eg);
        } catch (e) { /* skip a bad ring */ }
      }
    }
    // the blocks share one material and one edge material: the first block owns them for disposal
    const first = model.find((o) => o.userData.block);
    if (first) first.userData.ownMat = true;
    const firstEdge = model.find((o) => o.userData.edges);
    if (firstEdge) firstEdge.userData.ownMat = true;
  }

  /* ---- walls ------------------------------------------------------------------------------------------------ */
  const MIN_WALL_H = 0.1;
  function wallGeometry(rec, M) {
    const s = rec.profile.samples, line = rec.line;
    const pos = [];
    const addQuad = (a, b, c, d) => pos.push(...a, ...b, ...c, ...a, ...c, ...d);
    const bySeg = new Map();
    s.forEach((p, i) => { if (!bySeg.has(p.seg)) bySeg.set(p.seg, []); bySeg.get(p.seg).push(i); });
    let prev = -1;
    for (const seg of [...bySeg.keys()].sort((a, b) => a - b)) {
      const idx = bySeg.get(seg).slice();
      if (prev >= 0) idx.unshift(prev);
      prev = idx[idx.length - 1];
      const a = line[seg], b = line[seg + 1], L = Math.hypot(b[0] - a[0], b[1] - a[1]);
      if (!(L > 0) || idx.length < 2) continue;
      const tx = (b[0] - a[0]) / L, ty = (b[1] - a[1]) / L, nx = -ty, ny = tx, hw = 0.5;
      const sec = idx.map((i) => {
        const p = s[i], top = p.top, bot = Math.min(p.bottom, p.top - 0.2);
        const l = (e) => M.W(p.x + nx * hw, p.y + ny * hw, e), r = (e) => M.W(p.x - nx * hw, p.y - ny * hw, e);
        return { lb: l(bot), rb: r(bot), rt: r(top), lt: l(top) };
      });
      for (let k = 0; k + 1 < sec.length; k++) {
        const A = sec[k], B = sec[k + 1];
        addQuad(A.lb, B.lb, B.rb, A.rb);             // bottom
        addQuad(A.lt, A.rt, B.rt, B.lt);             // top
        addQuad(A.lb, A.lt, B.lt, B.lb);             // left side
        addQuad(A.rb, B.rb, B.rt, A.rt);             // right side
      }
      const S = sec[0], E = sec[sec.length - 1];
      addQuad(S.lb, S.rb, S.rt, S.lt);
      addQuad(E.lb, E.lt, E.rt, E.rb);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.computeVertexNormals();
    return geo;
  }
  function wallObjects(D, state, M, model, overlay, labels) {
    let recs = [];
    try { recs = GradDerivedMod.wallRecords(state, D.built); } catch (e) { console.error(e); }
    const flag = state.limits.wallFlag;
    const mats = {};
    const matOf = (key, hex, extra = {}) => mats[key] || (mats[key] = new THREE.MeshStandardMaterial({ color: col(hex), roughness: 0.9, side: THREE.DoubleSide, ...extra }));
    for (const rec of recs) {
      if (rec.heightMax < MIN_WALL_H || rec.profile.samples.length < 2) continue;
      const flagged = rec.heightMax > flag + 1e-9;
      const loose = rec.auto && !rec.accepted;
      let m;
      if (loose) m = matOf('loose', CONFIG.wallColor, { transparent: true, opacity: 0.4, depthWrite: false });
      else if (flagged) m = matOf('flag', CONFIG.wallFlagColor);
      else if (rec.kind === 'pad-step') m = matOf('step', CONFIG.wallStepColor);
      else m = matOf('wall', CONFIG.wallColor);
      const mesh = new THREE.Mesh(wallGeometry(rec, M), m);
      mesh.userData.model = true; mesh.userData.pick = { kind: 'wall', id: rec.id }; mesh.userData.wallKind = rec.kind;
      if (loose) mesh.castShadow = false;
      model.push(mesh);
      // top line
      const pos = [];
      const tl = rec.top;
      for (let i = 0; i + 1 < tl.length; i++) pos.push(...M.W(tl[i][0], tl[i][1], tl[i][2] + 0.05), ...M.W(tl[i + 1][0], tl[i + 1][1], tl[i + 1][2] + 0.05));
      const ln = fat(pos, flagged ? CONFIG.wallFlagColor : '#2a3139', 2, { dashed: loose, dash: 3, gap: 2, order: 6 });
      if (ln) { ln.userData.wallTop = rec.id; overlay.push(ln); }
      // label at the tallest point
      const im = rec.profile.samples[rec.profile.iMax];
      if (im && rec.heightMax >= 0.5) labels.push({ text: `${rec.heightMax.toFixed(1)} ft`, x: im.x, y: im.y, z: im.top, color: flagged ? '#b24a0a' : '#1d2733', id: `wall-${rec.id}` });
    }
    for (const mat of new Set(model.filter((o) => o.userData.wallKind).map((o) => o.material))) { const o = model.find((x) => x.material === mat); if (o) o.userData.ownMat = true; }
  }

  /* ---- routes, drives, lots, property, conflicts, section ----------------------------------------------- */
  function routeObjects(D, state, M, overlay, labels) {
    const limits = state.limits;
    for (const r of state.routes) {
      if (!r.line || r.line.length < 2) continue;
      let prof;
      try { prof = RoutesMod.routeProfile(r, D.built.surface.at, limits); } catch (e) { continue; }
      const S = prof.samples;
      if (S.length < 2) continue;
      let i = 0;
      while (i < S.length - 1) {
        const cls = S[i].cls;
        let j = i + 1;
        while (j < S.length - 1 && S[j].cls === cls) j++;
        const pts = S.slice(i, j + 1).map((p) => M.V(p.x, p.y, p.z + 0.7));
        if (pts.length >= 2) {
          const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
          const geo = new THREE.TubeGeometry(curve, Math.max(2, pts.length), 0.55, 6, false);
          const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: col(CONFIG.classColors[cls] || CONFIG.routeColor), roughness: 0.6 }));
          mesh.userData.ownMat = true; mesh.userData.route = r.id; mesh.userData.pick = { kind: 'route', id: r.id }; mesh.renderOrder = 7;
          overlay.push(mesh);
        }
        i = j;
      }
      const a = S[0], z = S[S.length - 1];
      for (const p of [a, z]) {
        const dot = new THREE.Mesh(new THREE.SphereGeometry(1.1, 12, 8), new THREE.MeshStandardMaterial({ color: col('#1d2733'), roughness: 0.7 }));
        dot.position.copy(M.V(p.x, p.y, p.z + 0.7)); dot.userData.ownMat = true; dot.renderOrder = 7;
        overlay.push(dot);
      }
      const mid = S[Math.floor(S.length / 2)];
      labels.push({ text: `${r.name}\n${(prof.maxSlope * 100).toFixed(1)}% max`, x: mid.x, y: mid.y, z: mid.z + 1.2, color: prof.kind === 'walk' ? '#1f7a44' : '#8a5a00', id: `route-${r.id}` });
    }
  }

  function outlineObjects(D, state, M, overlay) {
    const at = D.built.surface.at;
    const driveP = [], lotP = [], centerP = [];
    for (const f of D.built.features) {
      if (f.kind === 'drive') drape(driveP, f.ring, true, 4, (x, y) => at(x, y), M.W, 0.2);
      if (f.kind === 'lot') drape(lotP, f.ring, true, 4, (x, y) => at(x, y), M.W, 0.2);
    }
    for (const dv of state.drives) if (dv.line && dv.line.length >= 2) drape(centerP, dv.line, false, 4, (x, y) => at(x, y), M.W, 0.25);
    const a = fat(driveP, CONFIG.driveColor, 2, { order: 6 }); if (a) { a.userData.drives = true; overlay.push(a); }
    const c = fat(centerP, CONFIG.driveColor, 1, { dashed: true, dash: 5, gap: 4, order: 6 }); if (c) { c.userData.drives = true; overlay.push(c); }
    const l = fat(lotP, CONFIG.lotColor, 2, { dashed: true, dash: 6, gap: 3, order: 6 }); if (l) { l.userData.lots = true; overlay.push(l); }
    const prop = D.built.property;
    if (prop && prop.length >= 3 && state.property.mode === 'drawn') {
      const pp = [];
      drape(pp, prop, true, 8, (x, y) => at(x, y), M.W, 0.3);
      const pl = fat(pp, CONFIG.propertyColor, 2, { dashed: true, dash: 8, gap: 4, order: 6 });
      if (pl) { pl.userData.property = true; overlay.push(pl); }
    }
    for (const c2 of D.built.conflicts || []) {
      const p0 = M.V(c2.x, c2.y, at(c2.x, c2.y)), p1 = M.V(c2.x, c2.y, at(c2.x, c2.y) + 25 / M.ex);
      const geo = new THREE.BufferGeometry().setFromPoints([p0, p1]);
      const ln = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: col(CONFIG.conflictColor), depthWrite: false }));
      ln.userData.ownMat = true; ln.userData.conflict = true; ln.renderOrder = 8;
      overlay.push(ln);
      const cone = new THREE.Mesh(new THREE.ConeGeometry(2.2, 5, 12), new THREE.MeshStandardMaterial({ color: col(CONFIG.conflictColor), roughness: 0.6 }));
      cone.position.copy(p1); cone.rotation.x = Math.PI; cone.userData.ownMat = true; cone.renderOrder = 8;
      overlay.push(cone);
    }
    const sec = state.view.section;
    if (sec && sec.length === 2) {
      const sp = [];
      drape(sp, sec, false, 3, (x, y) => at(x, y), M.W, 0.5);
      const sl = fat(sp, '#d03a30', 2, { dashed: true, dash: 6, gap: 3, order: 8 });
      if (sl) { sl.userData.sectionLine = true; overlay.push(sl); }
    }
  }

  function tierLabels(D, state, labels) {
    for (const t of D.built.tiers) {
      const ring = t.pad && t.pad.length ? t.pad : t.outer;
      if (!ring || ring.length < 3) continue;
      const c = ring.reduce((a, p) => [a[0] + p[0] / ring.length, a[1] + p[1] / ring.length], [0, 0]);
      labels.push({ text: `FFE ${Units.formatElev(t.ffe)}`, x: c[0], y: c[1], z: t.ffe + CONFIG.buildingHeight + 0.5, color: '#16427a', id: `tier-${t.id}` });
    }
    const sec = state.view.section;
    if (sec && sec.length === 2) {
      const at = D.built.surface.at;
      labels.push({ text: 'A', x: sec[0][0], y: sec[0][1], z: at(sec[0][0], sec[0][1]) + 6, color: '#b52f27', id: 'sec-a', height: 8 });
      labels.push({ text: 'B', x: sec[1][0], y: sec[1][1], z: at(sec[1][0], sec[1][1]) + 6, color: '#b52f27', id: 'sec-b', height: 8 });
    }
  }

  /** The site neighbors, as a ghost (25 percent), standing on the existing ground. */
  function contextObjects(D, state, M) {
    const out = [];
    if (!state.view.context) return out;
    let list = [];
    try { list = ProjectUI.contextPolys() || []; } catch (e) { list = []; }
    const geos = [];
    for (const p of list) {
      try {
        const c = p.outer[0];
        const base = D.built.existingAt(c[0], c[1]);
        const shape = new THREE.Shape(p.outer.map((q) => new THREE.Vector2(q[0], q[1])));
        for (const hole of p.holes || []) shape.holes.push(new THREE.Path(hole.map((q) => new THREE.Vector2(q[0], q[1]))));
        const geo = new THREE.ExtrudeGeometry(shape, { depth: Math.max(0.1, num(p.height, 20)) * M.ex, bevelEnabled: false, steps: 1, curveSegments: 1 });
        geo.deleteAttribute('uv');
        geo.applyMatrix4(planMatrix(M.Y(base)));
        geos.push(geo);
      } catch (e) { /* skip a bad polygon */ }
    }
    if (!geos.length) return out;
    const merged = geos.length === 1 ? geos[0] : BufferGeometryUtils.mergeGeometries(geos, false);
    if (geos.length > 1) geos.forEach((g) => g.dispose());
    if (!merged) return out;
    const mesh = new THREE.Mesh(merged, new THREE.MeshStandardMaterial({ color: col('#9aa3ad'), roughness: 0.95, metalness: 0, transparent: true, opacity: 0.25, depthWrite: false }));
    mesh.userData.model = true; mesh.userData.ownMat = true; mesh.userData.context = true; mesh.renderOrder = 4;
    out.push(mesh);

  }

  /* ---- build ---------------------------------------------------------------------------------------------- */
  /** → { model: [...], overlay: [...] }. model objects cast and receive shadows; overlay objects are lines, tubes and flat labels. */
  function build(D, state, disp, opts = {}) {
    const M = mapper(D, state);

    const clean = !!opts.clean;
    try { model.push(...groundObjects(D, state, M)); } catch (e) { console.error(e); }
    if (clean) { padObjects(D, state, M, model, []); wallObjects(D, state, M, model, [], []); return { model, overlay }; }
    if (state.view.contours.on && state.view.contours.existing || state.view.style === 'cutfill') {
      const w = existingWire(D, M);
      if (w) overlay.push(w);
    }
    const cl = contourObjects(D, state, M, overlay);
    for (const L of cl) labels.push({ ...L, id: `c-${L.text}-${Math.round(L.x)}`, color: '#1d242b', height: 3.2, small: true });
    padObjects(D, state, M, model, overlay);
    wallObjects(D, state, M, model, overlay, labels);
    routeObjects(D, state, M, overlay, labels);
    outlineObjects(D, state, M, overlay);
    tierLabels(D, state, labels);
    // Labels are flat text in feet: they grow with the framed work so they stay readable in plan.
    const ub = D.bounds.union, unit = clamp(Math.max(ub.maxX - ub.minX, ub.maxY - ub.minY) / 300, 1, 2.6);
    for (const L of labels) {
      const lab = Overlays.label(L.text, L.x, L.y, M.Y(L.z) + 0.3, { height: (L.height || 4.5) * unit, color: L.color || '#1d2733' });
      lab.userData.plan = true; lab.userData.labelId = L.id;
      overlay.push(lab);
    }
    return { model, overlay };
  }

  return { build, contextObjects, mapper, diffColor, fat };
})();

/* ==========================================================================
   RENDER
   Scene, cameras, visual styles, performance rules, compare viewports. The terrain, pads, walls and routes come from Ground3D (05c),
   authored in the project frame with elevations shifted by the base level, so the model and overlay layers need no extra matrix.
   Plan coordinates are (x east, y north) in feet; elevation is up.
   Three.js is Y-up, so plan y maps to -z. planToWorld() is the ONLY place
   that mapping is written; geometry uses PLAN_MATRIX built from it.
   ========================================================================== */
/** Plan (x, y, elevation) -> Three.js world [x, y, z]. North (plan +y) is world -z. */
function planToWorld(x, y, elev = 0) { return [x, elev, -y]; }
const worldVec = (x, y, e = 0) => new THREE.Vector3(...planToWorld(x, y, e));
/** Matrix equivalent of planToWorld, for geometry authored in plan space (shape x,y; extrusion up = elevation). */
function planMatrix(elev = 0) {
  const o = worldVec(0, 0, 0);
  const ex = worldVec(1, 0, 0).sub(o), ey = worldVec(0, 1, 0).sub(o), ez = worldVec(0, 0, 1).sub(o);
  const m = new THREE.Matrix4().makeBasis(ex, ey, ez);
  m.setPosition(worldVec(0, 0, elev));
  return m;
}

/** Cells for the compare grid, in pixels, y from the top. `resv` reserves bars at the top and bottom. */
function compareRects(n, W, H, resv = {}, gap = 2) {
  const top = resv.top || 0, bottom = resv.bottom || 0;
  const hh = Math.max(40, H - top - bottom);
  const landscape = W >= hh;
  let cols, rows;
  if (n <= 1) { cols = 1; rows = 1; }
  else if (n === 2) { cols = landscape ? 2 : 1; rows = landscape ? 1 : 2; }
  else if (n === 3) { cols = landscape ? 3 : 1; rows = landscape ? 1 : 3; }
  else { cols = 2; rows = 2; }
  const cw = W / cols, ch = hh / rows, out = [];
  for (let i = 0; i < n; i++) {
    const c = i % cols, r = Math.floor(i / cols);
    out.push({ x: c * cw + gap / 2, y: top + r * ch + gap / 2, w: Math.max(1, cw - gap), h: Math.max(1, ch - gap) });
  }
  return out;
}

const Render = (() => {

    sun.castShadow = true;
    const fine = window.matchMedia && matchMedia('(pointer: fine)').matches;
    sun.shadow.mapSize.set(fine ? 4096 : 2048, fine ? 4096 : 2048);
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 0.4;
    scene.add(sun, sun.target);

    // Grid: 10 ft minor, 50 ft major, drawn in a shader so it stays crisp at any zoom.
    const gp = new THREE.PlaneGeometry(8000, 8000);
    gp.applyMatrix4(planMatrix(-0.05));
    gridMesh = new THREE.Mesh(gp, new THREE.ShaderMaterial({
      uniforms: gridUniforms, transparent: true, depthWrite: false, side: THREE.DoubleSide,
      polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4,
      vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
      fragmentShader: `
        uniform vec3 uMinor; uniform vec3 uMajor; uniform float uMinorA; uniform float uMajorA; uniform vec2 uFade;
        varying vec3 vW;
        float gridLine(vec2 p, float size){
          vec2 c = p / size;
          vec2 fw = max(fwidth(c), vec2(1e-6));
          vec2 g = abs(fract(c - 0.5) - 0.5) / fw;
          float line = 1.0 - min(min(g.x, g.y), 1.0);
          float f = max(fw.x, fw.y);
          return line * (1.0 - smoothstep(0.12, 0.3, f));
        }
        void main(){
          float minor = gridLine(vW.xz, 10.0) * uMinorA;
          float major = gridLine(vW.xz, 50.0) * uMajorA;
          float fade = 1.0 - smoothstep(uFade.x, uFade.y, length(vW.xz));
          float a = max(minor, major) * fade;
          if (a < 0.004) discard;
          gl_FragColor = vec4(major >= minor ? uMajor : uMinor, a);
          #include <colorspace_fragment>

    }));
    gridMesh.renderOrder = 2;
    scene.add(gridMesh);

    // Scale figure, 6 ft tall.
    const fm = new THREE.MeshStandardMaterial({ color: 0x69727c, roughness: 0.9 });
    figure = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.62, 4.7, 16), fm);
    body.position.y = 2.35;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.55, 16, 12), new THREE.MeshStandardMaterial({ color: 0x69727c, roughness: 0.9 }));
    head.position.y = 5.45;
    figure.add(body, head);
    figure.traverse((o) => { if (o.isMesh) o.castShadow = true; });

    selOverlay = new THREE.Group();
    selOverlay.renderOrder = 10;
    scene.add(selOverlay);

    layers = {};
    for (const id of ['model', 'context', 'overlay']) {
      const group = new THREE.Group();
      scene.add(group);
      layers[id] = { group, key: null };
    }
  }

  /* ---- model objects (shared by the main view and the compare view) ----------- */
  function clearGroup(g) {
    for (const o of [...g.children]) {
      g.remove(o);
      if (o.geometry) o.geometry.dispose();
      if (o.userData.ownMat && o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
    }
  }
  function syncLayer(layer, key, build) {
    if (layer.key === key) return false;
    clearGroup(layer.group);
    layer.key = key;
    for (const o of build()) layer.group.add(o);
    return true;
  }

  function syncMain(d, disp, state) {
    const v = state.view;
    let changed = false;
    const mk = [disp.key, v.style, v.exaggeration, v.contours.on, v.contours.interval, v.contours.existing, v.contours.proposed].join('|');
    if (layers.model.key !== mk) {
      const built = Ground3D.build(d, state, disp);
      clearGroup(layers.model.group); clearGroup(layers.overlay.group);
      layers.model.key = mk; layers.overlay.key = mk;
      for (const o of built.model) layers.model.group.add(o);
      for (const o of built.overlay) layers.overlay.group.add(o);
      overlayVis = null; changed = true;
    }
    changed = syncLayer(layers.context, [v.context, v.exaggeration, disp.key, ProjectUI.dataKey(), state.source].join('|'), () => Ground3D.contextObjects(d, state, Ground3D.mapper(d, state))) || changed;
    if (changed) { viewVersion = -1; needsRender = true; }
  }
  /** The plan labels show in the plan view and in Cut and fill style (never while a slider or a handle drags). */
  let overlayVis = null;
  function syncOverlayVisibility(dragging) {
    const on = !dragging && (preset === 'plan' || Store.raw().view.style === 'cutfill');
    const key = `${on}|${dragging}`;
    if (key === overlayVis) return;
    overlayVis = key;
    layers.overlay.group.visible = !cmp;
    layers.overlay.group.children.forEach((o) => { o.visible = !o.userData.plan || on; });
    needsRender = true;
  }

  /** All model meshes in whatever is on screen (main layers or compare groups). */
  function eachModelMesh(fn) {
    const walk = (g) => g.children.forEach((o) => { if (o.userData.model) fn(o); });
    if (cmp) cmp.entries.forEach((e) => walk(e.group)); else { walk(layers.model.group); walk(layers.context.group); }
  }

  /* ---- per-frame view state (cheap) ------------------------------------------------ */
  function currentBounds() {
    if (cmp) return cmp.bounds;
    return Derived.get().bounds;
  }
  function updateSun(view) {
    const bb = currentBounds();
    if (!bb) return;
    const b = bb.union;
    const cx = (b.minX + b.maxX) / 2, cy = (b.minY + b.maxY) / 2, h = b.height;
    const ex = b.maxX - b.minX, ey = b.maxY - b.minY;
    const R = Math.max(60, 0.5 * Math.sqrt(ex * ex + ey * ey + h * h));
    const sunV = view.sun || {};
    const az = rad(num(sunV.azimuth, 135)), alt = rad(clamp(num(sunV.altitude, 40), 3, 90));
    const key = [cx, cy, h, R, az, alt].join('|');
    if (key === sunKey) return;
    sunKey = key;
    sceneRadius = R;
    // Azimuth is a compass bearing: 0 = north (plan +y), clockwise. Altitude is above the horizon.
    const dir = new THREE.Vector3(...planToWorld(Math.sin(az) * Math.cos(alt), Math.cos(az) * Math.cos(alt), Math.sin(alt)));
    const target = worldVec(cx, cy, h / 2);
    sun.target.position.copy(target);
    sun.position.copy(target).addScaledVector(dir, R * 2.5);
    const c = sun.shadow.camera;
    c.left = -R * 1.1; c.right = R * 1.1; c.top = R * 1.1; c.bottom = -R * 1.1;
    c.near = R * 1.2; c.far = R * 3.8;
    c.updateProjectionMatrix();
    sun.target.updateMatrixWorld();
    needsRender = true;
  }

  function applyView() {
    const s = Store.raw(), v = s.view;
    if (themeApplied !== themeEpoch) refreshColors();
    gridMesh.visible = !!v.grid;
    figure.visible = !!v.figure && !cmp;
    const shadowsOn = !!v.shadows;
    // While a slider moves: casters off (no shadow pass work). Sun drags keep shadows so you can see them move.
    const dragging = Store.gestureActive() && !Store.gesturePath().startsWith('view.sun');
    const cast = shadowsOn && !dragging;
    eachModelMesh((m) => { m.castShadow = cast && !m.userData.skirt && !m.userData.context; m.receiveShadow = shadowsOn; });
    figure.traverse((o) => { if (o.isMesh) o.castShadow = cast; });
    // The figure stands near the front-left corner of the work (front = south, plan -y), on the proposed ground.
    if (derived && derived.ok) {
      const u = derived.bounds.model, M = Ground3D.mapper(derived, s);
      const fx = u.minX + 14, fy = u.minY - 14;
      figure.position.set(...M.W(fx, fy, derived.built.surface.at(fx, fy)));
      figure.scale.setScalar(1);
      figure.scale.y = M.ex;
    }
    updateSun(v);
    needsRender = true;
  }

  /* ---- cameras & views ------------------------------------------------------------- */
  const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const tanHalfFov = Math.tan(rad(FOV) / 2);

  function switchCamera(type) {
    if (type === camType) return;
    const target = controls.target;
    const offset = cam.position.clone().sub(target);
    const dist = offset.length();
    if (type === 'ortho') {
      ortho.zoom = (2 * ORTHO_HALF) / (2 * dist * tanHalfFov);
      ortho.position.copy(cam.position); ortho.quaternion.copy(cam.quaternion);

      const visible = (2 * ORTHO_HALF) / ortho.zoom;

      persp.quaternion.copy(cam.quaternion);

    cam.updateProjectionMatrix();

  }

  }

  /* ---- framing: every preset view fits the whole of what is on screen ---------------------- */
  const FIT_MARGIN = 0.05;      // empty fraction of the visible area on each side

  /** Plan extent + height of everything a view must show: plates, crown solids, the context. */
  function boxOf(d) {
    const u = d.bounds.union;
    const b = { minX: u.minX, maxX: u.maxX, minY: u.minY, maxY: u.maxY, height: u.height || 0 };
    const add = (x, y, z) => {
      if (x < b.minX) b.minX = x; if (x > b.maxX) b.maxX = x;
      if (y < b.minY) b.minY = y; if (y > b.maxY) b.maxY = y;
      if (z > b.height) b.height = z;

    return b;
  }
  function framingBox() {
