/* ==========================================================================
   SHARED: units
   Feet-and-inches format, area format, and parsing of typed values.
   Feet and square feet only (version 1).
   ========================================================================== */
const Units = (() => {
  const grouped = (n, digits = 0) => n.toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits });

  /** 312.5 -> 312'-6"  (rounds to the nearest inch) */
  function formatFeetInches(ft) {
    if (typeof ft !== 'number' || !isFinite(ft)) return '—';
    const totalIn = Math.round(Math.abs(ft) * 12);
    const f = Math.floor(totalIn / 12), i = totalIn % 12;
    return `${ft < 0 && totalIn > 0 ? '-' : ''}${grouped(f)}'-${i}"`;
  }
  /** 100000 -> "100,000 sf" */
  function formatArea(sf) {
    if (typeof sf !== 'number' || !isFinite(sf)) return '—';
    return `${grouped(Math.round(sf) || 0)} sf`;
  }
  const formatInt = (n) => (typeof n === 'number' && isFinite(n)) ? grouped(Math.round(n) || 0) : '—';
  const formatRatio = (n, d = 2) => (typeof n === 'number' && isFinite(n)) ? grouped(n, d) : '—';
  const formatDeg = (n) => `${Math.round(n)}°`;

  /** Parse "10'-6\"", "10.5", "10'", "10' 6", "6\"", "10 ft 6 in", "10-6", "6 1/2\"" to feet. NaN when invalid. */
  function parseLength(input) {
    if (typeof input === 'number') return isFinite(input) ? input : NaN;
    let s = String(input == null ? '' : input).trim().toLowerCase();
    s = s.replace(/[, ]/g, '').replace(/[′’‘]/g, "'").replace(/[″“”]/g, '"').replace(/\s+/g, ' ');
    if (!s) return NaN;
    let sign = 1;
    if (s[0] === '-') { sign = -1; s = s.slice(1).trim(); } else if (s[0] === '+') { s = s.slice(1).trim(); }
    const NUM = '(\\d+\\.?\\d*|\\.\\d+)';
    if (new RegExp('^' + NUM + '$').test(s)) return sign * parseFloat(s);

    const parseInches = (t) => {
      t = t.trim().replace(/\s*(?:"|in\.?|inch|inches)$/, '').trim();
      if (t === '') return 0;
      let m;
      if ((m = t.match(new RegExp('^' + NUM + '$')))) return parseFloat(m[1]);
      if ((m = t.match(/^(\d+)\s*\/\s*(\d+)$/))) return +m[2] ? m[1] / m[2] : NaN;
      if ((m = t.match(new RegExp('^' + NUM + '\\s+(\\d+)\\s*/\\s*(\\d+)$')))) return +m[3] ? parseFloat(m[1]) + m[2] / m[3] : NaN;
      return NaN;
    };
    let m;
    if ((m = s.match(new RegExp('^' + NUM + "\\s*(?:'|ft\\.?|feet|foot)\\s*-?\\s*(.*)$")))) {
      const inch = parseInches(m[2]);
      return isNaN(inch) ? NaN : sign * (parseFloat(m[1]) + inch / 12);
    }
    if (/("|in\.?|inch|inches)$/.test(s)) {
      const inch = parseInches(s);
      return isNaN(inch) ? NaN : sign * inch / 12;
    }
    if ((m = s.match(new RegExp('^' + NUM + '\\s*-\\s*(.+)$')))) {   // architect shorthand: 10-6
      const inch = parseInches(m[2]);
      return isNaN(inch) ? NaN : sign * (parseFloat(m[1]) + inch / 12);
    }
    return NaN;
  }
  /** Plain number with optional unit decoration ("45°", "20%", "1,200 sf"). NaN when invalid. */
  function parseNumber(input) {
    if (typeof input === 'number') return isFinite(input) ? input : NaN;
    const s = String(input == null ? '' : input).replace(/[,\s°%]|sf$/gi, '');
    return /^[-+]?(\d+\.?\d*|\.\d+)$/.test(s) ? parseFloat(s) : NaN;
  }
  return { formatFeetInches, formatArea, formatInt, formatRatio, formatDeg, parseLength, parseNumber, grouped };
})();

/* ==========================================================================
   STATE
   The default state and fillDefaults (older, partial or imported states become complete).
   Schema: docs/facade-studio-technical-plan.md section 2. The default state and the presets come from
   src/facade/presets.js (PresetsMod). All lengths are feet, areas square feet, ratios fractions
   (percent on the screen), angles degrees. East = +x, north = +y.
   ========================================================================== */
const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const deepClone = (o) => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));
const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);

const SYSTEM_KEYS = ['punched', 'windowWall', 'curtainWall', 'storefront', 'solid'];
const SHAPES = ['rect', 'L', 'U', 'O'];
const SHAPE_LABELS = { rect: 'Rectangle', L: 'L', U: 'U', O: 'Courtyard (O)' };
const BALCONY_TYPES = ['inset', 'projected'];
const BALCONY_PATTERNS = ['stacked', 'alternating', 'checker', 'per-unit'];
const SOURCE_LABELS = { standalone: 'Standalone massing', project: 'Project massing' };

/** The default design: "Residential punched windows with inset balconies" (plan section 8.1). WWR 0.243, 66 balconies. */
function defaultState() { return PresetsMod.defaultState(); }

/** Fill every missing field from the defaults so older or partial states (presets, imports) are complete. */
function fillDefaults(src) {
  const s = isObj(src) ? deepClone(src) : {};
  const merge = (t, d) => {
    for (const k of Object.keys(d)) {
      if (t[k] === undefined) t[k] = deepClone(d[k]);
      else if (isObj(d[k]) && isObj(t[k])) merge(t[k], d[k]);
    }
  };
  const base = defaultState();
  const keepPlacement = s.placement;
  merge(s, base);
  if (keepPlacement === null || keepPlacement === undefined) s.placement = null;
  if (!['standalone', 'project'].includes(s.source)) s.source = 'standalone';
  const sa = s.standalone;
  if (!SHAPES.includes(sa.shape)) sa.shape = 'rect';
  for (const k of ['width', 'depth', 'arm', 'courtW', 'courtD']) sa[k] = clamp(num(sa[k], base.standalone[k]), 1, CONFIG.limits.maxDim);
  sa.angle = clamp(num(sa.angle, 0), -360, 360);
  sa.floors = Math.round(clamp(num(sa.floors, 5), 1, CONFIG.limits.maxLevels));
  sa.ftf1 = clamp(num(sa.ftf1, 12), 6, 40);
  sa.ftf = clamp(num(sa.ftf, 10), 6, 40);
  sa.podium.on = !!sa.podium.on;
  sa.podium.levels = Math.round(clamp(num(sa.podium.levels, 1), 1, 20));
  sa.podium.ftf = clamp(num(sa.podium.ftf, 11), 6, 40);
  sa.podium.width = clamp(num(sa.podium.width, 300), 1, CONFIG.limits.maxDim);
  sa.podium.depth = clamp(num(sa.podium.depth, 200), 1, CONFIG.limits.maxDim);
  // zones
  const z = s.zones;
  if (z.mode !== 'ranges') z.mode = 'default';
  if (!Array.isArray(z.ranges)) z.ranges = [];
  z.ranges = z.ranges.filter(isObj).slice(0, CONFIG.limits.maxRanges).map((r, i) => ({
    id: typeof r.id === 'string' && r.id ? r.id : `Z${i + 1}`, name: String(r.name || `Range ${i + 1}`).slice(0, 40),
    from: Math.max(1, Math.round(num(r.from, 1))), to: Math.max(1, Math.round(num(r.to, num(r.from, 1)))),
  }));
  if (!isObj(z.rules)) z.rules = {};
  for (const id of ['base', 'middle', 'top', ...z.ranges.map((r) => r.id)]) {
    if (!isObj(z.rules[id])) z.rules[id] = deepClone(z.rules.middle || { system: 'punched' });
    if (!SYSTEM_KEYS.includes(z.rules[id].system)) z.rules[id].system = 'punched';
  }
  if (!isObj(z.overrides)) z.overrides = {};
  for (const id of Object.keys(z.overrides)) {
    if (!isObj(z.overrides[id])) { delete z.overrides[id]; continue; }
    for (const o of Object.keys(z.overrides[id])) {
      if (!CONFIG.orientations.includes(o) || !isObj(z.overrides[id][o])) delete z.overrides[id][o];
      else if (z.overrides[id][o].system !== undefined && !SYSTEM_KEYS.includes(z.overrides[id][o].system)) delete z.overrides[id][o].system;
    }
  }
  const b = s.balconies;
  b.on = !!b.on;
  if (!BALCONY_TYPES.includes(b.type)) b.type = 'projected';
  if (!BALCONY_PATTERNS.includes(b.pattern)) b.pattern = 'stacked';
  b.spacing = Math.round(clamp(num(b.spacing, 2), 1, 20));
  if (!Array.isArray(b.zones)) b.zones = ['middle'];
  if (!Array.isArray(b.orientations)) b.orientations = ['N', 'S'];
  for (const k of ['fins', 'shades']) {
    s[k].on = !!s[k].on;
    if (!Array.isArray(s[k].orientations)) s[k].orientations = [];
    if (!Array.isArray(s[k].zones)) s[k].zones = [];
  }
  s.fins.every = Math.round(clamp(num(s.fins.every, 1), 1, 20));
  if (!Array.isArray(s.bands)) s.bands = [];
  s.bands = s.bands.filter(isObj).slice(0, CONFIG.limits.maxBands).map((x) => (x.every !== undefined
    ? { every: Math.round(clamp(num(x.every, 3), 1, 60)), material: String(x.material || 'metal') }
    : { zone: String(x.zone || 'base'), material: String(x.material || 'metal') }));
  if (s.corners !== 'glass') s.corners = 'solid';
  if (!['auto', 'manual'].includes(s.street.mode)) s.street.mode = 'auto';
  if (!Array.isArray(s.street.manual)) s.street.manual = [];
  s.street.roadDistance = clamp(num(s.street.roadDistance, 60), 0, 2000);
  s.checks.wwrLimit = clamp(num(s.checks.wwrLimit, 0.4), 0, 1);
  s.checks.transparencyTarget = s.checks.transparencyTarget == null ? null : clamp(num(s.checks.transparencyTarget, 0.6), 0, 1);
  if (!Array.isArray(s.materials) || !s.materials.length) s.materials = deepClone(base.materials);
  const v = s.view;
  if (v.style !== 'diagram') v.style = 'model';
  if (v.colorBy !== 'wwr') v.colorBy = 'system';
  if (!CONFIG.orientations.includes(v.elevation)) v.elevation = null;
  v.sun = { azimuth: clamp(num(v.sun && v.sun.azimuth, 135), 0, 360), altitude: clamp(num(v.sun && v.sun.altitude, 40), 3, 90) };
  v.shot = isObj(v.shot) ? v.shot : {};
  merge(v.shot, { title: true, date: true, metrics: true, mark: true });
  s.schema = CONFIG.schema;
  s.name = String(s.name || 'Option A').slice(0, 60);
  return s;
}

/** Saved options at an older schema step up here. Schema 1 is the first, so nothing changes yet. */
function migrateState(state /* , fromSchema */) { return state; }

/* SHARED: store. One state object; get/set by path, subscribe, undo/redo (50 steps). Live sets coalesce into one undo step on commit(). */
const Store = (() => {
  let state = defaultState();
  let version = 0;
  let gesture = null;                  // { base, path } while a live drag is open
  const past = [], future = [];
  const listeners = new Set();

  const clone = (o) => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const keysOf = (p) => (Array.isArray(p) ? p.map(String) : String(p == null ? '' : p).split('.').filter(Boolean));

  function getIn(root, ks) {
    let o = root;
    for (const k of ks) { if (o == null) return undefined; o = o[k]; }
    return o;
  }
  function setIn(root, ks, value) {
    let o = root;
    for (let i = 0; i < ks.length - 1; i++) {
      if (o[ks[i]] == null || typeof o[ks[i]] !== 'object') o[ks[i]] = /^\d+$/.test(ks[i + 1]) ? [] : {};
      o = o[ks[i]];
    }
    o[ks[ks.length - 1]] = value;
  }
  function notify(info) {
    version++;
    for (const fn of listeners) { try { fn(state, info); } catch (e) { console.error(e); } }
  }
  function pushHistory(snapshot) {
    past.push(snapshot);
    while (past.length > CONFIG.limits.maxHistory) past.shift();
    future.length = 0;
  }

  const get = (path) => getIn(state, keysOf(path));

  /** End a live gesture; it becomes a single undo step. */
  function commit() {
    if (!gesture) return false;
    const g = gesture; gesture = null;
    if (!same(g.base, state)) pushHistory(g.base);
    notify({ kind: 'commit', path: g.path, live: false });
    return true;
  }

  /** Set a value by dot path. opts.live = continuous drag (coalesced until commit()). opts.merge = no new undo step (it joins the one before). */
  function set(path, value, opts = {}) {
    const ks = keysOf(path);
    if (!ks.length) return replace(value);
    if (same(getIn(state, ks), value)) return false;
    const pathStr = ks.join('.');
    if (opts.live) {
      if (!gesture) gesture = { base: clone(state), path: pathStr };
    } else if (opts.merge) {
      if (gesture) commit();                 // follows another change: both undo together (the page keeps site neighbors in step with the placement)
    } else {
      if (gesture) commit();
      pushHistory(clone(state));
    }
    setIn(state, ks, (value !== null && typeof value === 'object') ? clone(value) : value);
    notify({ kind: 'set', path: pathStr, live: !!opts.live });
    return true;
  }
  function replace(next, opts = {}) {
    if (gesture) commit();
    if (opts.resetHistory) { past.length = 0; future.length = 0; } else pushHistory(clone(state));
    state = clone(next);
    notify({ kind: 'replace', path: '', live: false });
    return true;
  }
  function undo() {
    commit();
    if (!past.length) return false;
    future.push(clone(state));
    state = past.pop();
    notify({ kind: 'undo', path: '', live: false });
    return true;
  }
  function redo() {
    commit();
    if (!future.length) return false;
    past.push(clone(state));
    state = future.pop();
    notify({ kind: 'redo', path: '', live: false });
    return true;
  }
  function subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); }

  return {
    get, set, commit, replace, undo, redo, subscribe,
    raw: () => state,                         // live reference; treat as read-only
    snapshot: () => clone(state),
    version: () => version,
    canUndo: () => past.length > 0 || (gesture && !same(gesture.base, state)),
    canRedo: () => future.length > 0,
    gestureActive: () => !!gesture,
    gesturePath: () => (gesture ? gesture.path : ''),
    historyDepth: () => past.length,
  };
})();

/* ==========================================================================
   GEOMETRY HELPERS
   Small plan helpers shared by the pipeline, the renderer and the selection code.
   Rings are [[x, y], ...] in the massing (local) frame, in feet. Faces keep their own end points a, b in that frame.
   ========================================================================== */
const ringArea = (ring) => { let a = 0; for (let i = 0, n = ring.length; i < n; i++) { const p = ring[i], q = ring[(i + 1) % n]; a += p[0] * q[1] - q[0] * p[1]; } return a / 2; };
const multiArea = (mp) => (mp || []).reduce((t, pc) => t + Math.abs(ringArea(pc.outer)) - (pc.holes || []).reduce((h, r) => h + Math.abs(ringArea(r)), 0), 0);
const rnd = (v, k = 1000) => Math.round(v * k) / k;

/** Bounding box of a ring list, or null. */
function boxOfRings(rings) {
  const b = { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity };
  for (const r of rings || []) for (const q of r) { b.minX = Math.min(b.minX, q[0]); b.maxX = Math.max(b.maxX, q[0]); b.minY = Math.min(b.minY, q[1]); b.maxY = Math.max(b.maxY, q[1]); }
  return isFinite(b.minX) ? b : null;
}
/** A number from a module row: a number, or an object with .value / .total / .ratio / .area. */
function mv(row, d = 0) {
  if (typeof row === 'number' && isFinite(row)) return row;
  if (row && typeof row === 'object') for (const k of ['value', 'total', 'ratio', 'area', 'count']) if (typeof row[k] === 'number' && isFinite(row[k])) return row[k];
  return d;
}
const pct1 = (f) => `${(f * 100).toFixed(1)}%`;

/* ==========================================================================
   PIPELINE
   state (+ project) -> levels -> faces -> panels -> balconies -> metrics -> checks.
   One cached run per change. Every module is pure (src/facade/*); this file only calls them in order and normalizes what
   the page needs: the HUD numbers, the warnings, the per-group figures, the bounds for framing.
   buildFacade is the only function that reads the project. Never throws: a failure becomes one error warning and an empty facade.
   ========================================================================== */
const SEVERITY_ORDER = { error: 0, warn: 1, info: 2 };
const mapWarning = (w) => ({ id: w.code || w.id, level: w.severity || w.level || 'warn', text: w.message || w.text || String(w.code || w.id || ''), ref: w.ref || null });
const sortWarnings = (list) => list.map((w, i) => [w, i]).sort((a, b) => ((SEVERITY_ORDER[a[0].level] ?? 1) - (SEVERITY_ORDER[b[0].level] ?? 1)) || (a[1] - b[1])).map((x) => x[0]);

const emptyHud = () => ({
  wwr: 0, limit: 0.4, over: false, wall: 0, glazing: 0, worst: null, byOrientation: {}, transparency: null, target: null, targetMet: null,
  balconies: 0, balconyArea: 0, levels: 0, faces: 0, height: 0, exposure: null, projection: [], zones: {}, systems: {},
});

function emptyDerived(message) {
  const built = { source: 'standalone', rotation: 0, levels: [], groups: [], faces: [], balconies: [], fins: [], shades: [], street: { ids: [], source: 'auto' }, warnings: [] };
  return {
    ok: false, state: null, built, metrics: null, levels: [], groups: [], faces: [], groupInfo: {}, street: [], rotation: 0,
    warnings: [{ id: 'internal', level: 'error', text: message || 'The facade could not be built for these settings.', ref: null }],
    box: null, bounds: computeBoundsFor(built), hud: emptyHud(), matrix: new THREE.Matrix4(), geomId: 0,
  };
}

function computeBoundsFor(built) {
  const box = { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity };
  let height = 0;
  for (const lv of built.levels || []) {
    height = Math.max(height, (lv.z || 0) + (lv.ftf || 0));
    for (const poly of lv.plates || []) for (const q of poly.outer) {
      box.minX = Math.min(box.minX, q[0]); box.maxX = Math.max(box.maxX, q[0]); box.minY = Math.min(box.minY, q[1]); box.maxY = Math.max(box.maxY, q[1]);
    }
  }
  if (!isFinite(box.minX)) Object.assign(box, { minX: -50, maxX: 50, minY: -50, maxY: 50 });
  const h = Math.max(height + 9, 20);
  const b = { ...box, height: h };
  return { model: b, site: { ...box, height: h }, union: { ...box, height: h }, all: { ...box, height: h } };
}

/** The HUD figures, the per-orientation table and the per-group figures, computed from the built faces so they always add up. */
function summarize(s, built, metrics) {
  const wall = mv(metrics.wall), glazing = mv(metrics.glazing);
  const byO = {};
  for (const o of CONFIG.orientations) byO[o] = { wall: 0, glazing: 0, wwr: 0 };
  const groupInfo = {};
  const zones = {}, systems = {};
  for (const g of built.groups || []) groupInfo[g.id] = { wall: 0, glazing: 0, wwr: 0, balconies: 0, system: null, faces: 0 };
  for (const f of built.faces || []) {
    const w = mv(f.wall), gl = mv(f.glazing);
    const doors = (f.panels || []).filter((p) => p.kind === 'door').length;
    if (byO[f.orientation]) { byO[f.orientation].wall += w; byO[f.orientation].glazing += gl; }
    const gi = groupInfo[f.groupId];
    if (gi) { gi.wall += w; gi.glazing += gl; gi.balconies += doors; gi.faces++; gi.system = gi.system || (f.rule && f.rule.system) || 'punched'; }
    const z = zones[f.zone] = zones[f.zone] || { wall: 0, glazing: 0 };
    z.wall += w; z.glazing += gl;
    const sy = systems[(f.rule && f.rule.system) || 'punched'] = systems[(f.rule && f.rule.system) || 'punched'] || { wall: 0, glazing: 0 };
    sy.wall += w; sy.glazing += gl;
  }
  for (const o of CONFIG.orientations) byO[o].wwr = byO[o].wall > 0 ? byO[o].glazing / byO[o].wall : 0;
  for (const id of Object.keys(groupInfo)) groupInfo[id].wwr = groupInfo[id].wall > 0 ? groupInfo[id].glazing / groupInfo[id].wall : 0;
  for (const z of Object.values(zones)) z.wwr = z.wall > 0 ? z.glazing / z.wall : 0;
  for (const z of Object.values(systems)) z.wwr = z.wall > 0 ? z.glazing / z.wall : 0;
  let worst = null;
  for (const o of CONFIG.orientations) if (byO[o].wall > 0 && (!worst || byO[o].wwr > worst.wwr + 1e-12)) worst = { o, wwr: byO[o].wwr };
  const overall = isFinite(metrics.wwr) ? metrics.wwr : (wall > 0 ? glazing / wall : 0);
  const limit = num(s.checks.wwrLimit, 0.4);
  const tr = metrics.transparency == null ? null : (mv(metrics.transparency, NaN));
  const target = s.checks.transparencyTarget;
  const top = (built.levels || []).reduce((t, l) => Math.max(t, (l.z || 0) + (l.ftf || 0)), 0);
  return {
    wwr: overall, limit, over: overall > limit + 1e-9, wall, glazing, worst, byOrientation: byO,
    transparency: tr != null && isFinite(tr) ? tr : null, target, targetMet: target != null && tr != null && isFinite(tr) ? tr >= target - 1e-9 : null,
    balconies: mv(metrics.balconyCount), balconyArea: mv(metrics.balconyArea),
    levels: (built.levels || []).length, faces: (built.groups || []).length, height: top,
    exposure: metrics.exposure && typeof metrics.exposure === 'object' ? metrics.exposure : null,
    projection: Array.isArray(metrics.projectionFactors) ? metrics.projectionFactors : [],
    zones, systems, groupInfo,
  };
}

/** Everything the UI, the renderer, the exports and the compare view need for one state (no caching). */
function computeDerived(s, { project = null, quality = 'full' } = {}) {
  try {
    const built = PanelsMod.buildFacade(s, { project, quality });
    const metrics = FacMetricsMod.computeMetrics(s, built, project);
    const checks = FacMetricsMod.checks(s, metrics);
    const seen = new Set();
    const warnings = [];
    for (const w of [...(built.warnings || []), ...(checks || [])]) {
      const key = `${w.code || w.id}|${w.message || w.text}`;
      if (seen.has(key)) continue;
      seen.add(key);
      warnings.push(mapWarning(w));
    }
    const hud = summarize(s, built, metrics);
    const streetIds = new Set((built.street && built.street.ids) || []);
    const box = boxOfRings((built.levels || []).flatMap((l) => (l.plates || []).map((p) => p.outer)));
    return {
      ok: true, state: s, built, metrics, levels: built.levels || [], groups: built.groups || [], faces: built.faces || [],
      groupInfo: hud.groupInfo, street: [...streetIds], rotation: num(built.rotation, 0),
      warnings: sortWarnings(warnings), box, bounds: computeBoundsFor(built), hud, matrix: new THREE.Matrix4(),
    };
  } catch (e) {
    console.error(e);
    return emptyDerived('The facade could not be built for these settings.');
  }
}

const Derived = (() => {
  let gKey = null, geomId = 0, counter = 0, cache = null;
  // Geometry key: everything that changes the build or the numbers. The name and the view only change drawing.
  const geomKeyOf = (s) => { const { view, name, ...rest } = s; return JSON.stringify(rest); };
  function get() {
    const s = Store.raw();
    const gk = geomKeyOf(s) + '|' + ProjectUI.dataKey();
    if (gk !== gKey || !cache) {
      gKey = gk; geomId++;
      cache = { id: ++counter, geomId, ...computeDerived(s, { project: ProjectUI.dataDoc() }) };
    }
    return cache;
  }
  /** What to draw. While a geometry edit drags the draft quality is drawn: no mullions or fins (plan section 6). */
  function display(draft) {
    const d = get();
    return { key: `${draft ? 'd' : 'f'}${d.geomId}`, quality: draft ? 'draft' : 'full' };
  }
  return { get, display };
})();

/* ==========================================================================
   OVERLAYS  (flat text labels and lines laid on the deck)
   Objects are plain three.js lines and meshes. Each one owns its material (userData.ownMat), so the renderer
   disposes it when the layer is rebuilt. Text is drawn into a canvas and laid flat on a plane that has a size in feet,
   so it stays readable in plan and shrinks with distance in the axon view.
   ========================================================================== */
const Overlays = (() => {
  const rootCss = (name, fb) => { const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); return new THREE.Color(v || fb); };
  const W = (p, z) => planToWorld(p[0], p[1], z);
  const fmtN = (n) => Math.round(n).toLocaleString('en-US');
  const SEED_COLORS = { stair: '#d9731a', 'exterior-stair': '#d9a22b', elevator: '#7a5cc2' };

  function lines(pos, { color, opacity = 1, dashed = false, order = 4, dash = 4, gap = 3 }) {
    if (!pos.length) return null;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    const mat = dashed
      ? new THREE.LineDashedMaterial({ color, transparent: opacity < 1, opacity, dashSize: dash, gapSize: gap, depthWrite: false })
      : new THREE.LineBasicMaterial({ color, transparent: opacity < 1, opacity, depthWrite: false });
    const ls = new THREE.LineSegments(geo, mat);
    ls.renderOrder = order; ls.frustumCulled = false; ls.userData.ownMat = true;
    if (dashed) ls.computeLineDistances();
    return ls;
  }
  const loopPos = (pos, ring, z) => { for (let i = 0; i < ring.length; i++) pos.push(...W(ring[i], z), ...W(ring[(i + 1) % ring.length], z)); };

  /** Text lying flat on the plan at (x, y, z). `height` is the height of one line of text in feet. */
  function label(text, x, y, z, { height = 5, color = '#1d2733', halo = '#ffffff' } = {}) {
    const rows = String(text).split('\n');
    const px = 48, pad = 12;
    const cv = document.createElement('canvas');
    const ctx0 = cv.getContext('2d');
    ctx0.font = `600 ${px}px system-ui, -apple-system, Segoe UI, sans-serif`;
    const widest = Math.max(...rows.map((r) => ctx0.measureText(r).width));
    cv.width = Math.ceil(widest + pad * 2); cv.height = Math.ceil(rows.length * px * 1.2 + pad * 2);
    const ctx = cv.getContext('2d');
    ctx.font = `600 ${px}px system-ui, -apple-system, Segoe UI, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    rows.forEach((r, i) => {
      const yy = pad + px * 0.6 + i * px * 1.2;
      ctx.lineWidth = 9; ctx.strokeStyle = halo; ctx.strokeText(r, cv.width / 2, yy);
      ctx.fillStyle = color; ctx.fillText(r, cv.width / 2, yy);
    });
    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
    const hh = height * rows.length * 1.2 + (height * 2 * pad) / px, ww = (hh * cv.width) / cv.height;
    const geo = new THREE.PlaneGeometry(ww, hh);
    geo.translate(x, y, 0);
    geo.applyMatrix4(planMatrix(z));
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.renderOrder = 6; mesh.frustumCulled = false; mesh.userData.ownMat = true; mesh.userData.label = text;
    return mesh;
  }

  return { label, lines, loopPos };
})();

/* ==========================================================================
   FACADE 3D
   Builds the three.js objects of a facade from one Derived result (plan section 6):
     a thin wall box per face and level (0.5 ft), glass boxes (pale blue-gray, 45 to 60 percent), spandrel and solid boxes in the
     zone material, mullions, fins, shades, balconies (slabs and rails, or the dark recess of an inset balcony), a thin roof cap per level.
   Every element of a face and level comes from ElevMod.faceElements(state, face), the same function the elevations DXF and the SketchUp
   export use, so the screen, the elevation and the files agree. Instanced meshes: one each for opaque, glass and mullion boxes.
   Everything is authored in the massing (local) frame, in plan feet, through planToWorld; the face a to b runs along the u axis and
   the outward normal is (dy, -dx) / |d| (the rule of faces.js). Draft quality (a drag in progress) skips mullions and fins.
   Materials come from the renderer: mats.mesh(key), mats.line(key).
   ========================================================================== */
const Facade3D = (() => {
  const W3 = (x, y, e) => planToWorld(x, y, e);
  const UNIT = new THREE.BoxGeometry(1, 1, 1);
  UNIT.deleteAttribute('uv');
  const tmp = new THREE.Matrix4();
  const vX = new THREE.Vector3(), vY = new THREE.Vector3(0, 1, 0), vZ = new THREE.Vector3(), vS = new THREE.Vector3();

  /** A set of instances: matrices, colors and the owning face group of each (for picking). */
  class Buf {
    constructor() { this.m = []; this.c = []; this.owner = []; }
    get n() { return this.owner.length; }
    /** A box on a face: u0..u1 along the face from a, v0..v1 up from the floor, d0..d1 along the outward normal from the face line. */
    box(face, u0, u1, v0, v1, d0, d1, color, owner) {
      const a = face.a, b = face.b;
      const L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
      const dx = (b[0] - a[0]) / L, dy = (b[1] - a[1]) / L;
      const nx = dy, ny = -dx;
      const uc = (u0 + u1) / 2, dc = (d0 + d1) / 2, vc = (v0 + v1) / 2;
      const px = a[0] + dx * uc + nx * dc, py = a[1] + dy * uc + ny * dc, pz = (face.z || 0) + vc;
      vX.set(dx, 0, -dy); vZ.set(nx, 0, -ny);
      tmp.makeBasis(vX, vY, vZ);
      tmp.scale(vS.set(Math.max(0.02, u1 - u0), Math.max(0.02, v1 - v0), Math.max(0.02, d1 - d0)));
      tmp.setPosition(px, pz, -py);
      for (let i = 0; i < 16; i++) this.m.push(tmp.elements[i]);
      this.c.push(color.r, color.g, color.b);
      this.owner.push(owner);
    }
    mesh(material, { cast = false, order = 0 } = {}) {
      if (!this.n) return null;
      const im = new THREE.InstancedMesh(UNIT.clone(), material, this.n);
      im.instanceMatrix.array.set(this.m);
      im.instanceMatrix.needsUpdate = true;
      im.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(this.c), 3);
      im.castShadow = cast; im.receiveShadow = true; im.renderOrder = order; im.frustumCulled = false;
      im.userData.model = true; im.userData.owners = this.owner;
      im.computeBoundingSphere();
      return im;
    }
  }

  const cssModel = () => new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--scene-model').trim() || '#f6f6f3');

  /** Plan extrusion of polygons (outer + holes) from z, `depth` ft up. */
  function extrude(polys, z, depth) {
    const shapes = polys.map((poly) => {
      const shape = new THREE.Shape(poly.outer.map((q) => new THREE.Vector2(q[0], q[1])));
      for (const h of poly.holes || []) shape.holes.push(new THREE.Path(h.map((q) => new THREE.Vector2(q[0], q[1]))));
      return shape;
    });
    const geo = new THREE.ExtrudeGeometry(shapes, { depth: Math.max(0.05, depth), bevelEnabled: false, steps: 1, curveSegments: 1 });
    geo.deleteAttribute('uv');
    geo.applyMatrix4(planMatrix(z));
    return geo;
  }

   RENDER
   Scene, cameras, visual styles, performance rules, compare viewports. The facade objects come from Facade3D (05c),
   authored in the massing (local) frame, so the model and overlay layers need no extra matrix.
   Plan coordinates are (x east, y north) in feet; elevation is up.
   Three.js is Y-up, so plan y maps to -z. planToWorld() is the ONLY place

/** Plan (x, y, elevation) -> Three.js world [x, y, z]. North (plan +y) is world -z. */
function planToWorld(x, y, elev = 0) { return [x, elev, -y]; }

function planMatrix(elev = 0) {

  const m = new THREE.Matrix4().makeBasis(ex, ey, ez);

/** Cells for the compare grid, in pixels, y from the top. `resv` reserves bars at the top and bottom. */
function compareRects(n, W, H, resv = {}, gap = 2) {
  const top = resv.top || 0, bottom = resv.bottom || 0;
  const hh = Math.max(40, H - top - bottom);
  const landscape = W >= hh;
  let cols, rows;
  if (n <= 1) { cols = 1; rows = 1; }
  else if (n === 2) { cols = landscape ? 2 : 1; rows = landscape ? 1 : 2; }
  else if (n === 3) { cols = landscape ? 3 : 1; rows = landscape ? 1 : 3; }
  else { cols = 2; rows = 2; }
  const cw = W / cols, ch = hh / rows, out = [];
  for (let i = 0; i < n; i++) {

    out.push({ x: c * cw + gap / 2, y: top + r * ch + gap / 2, w: Math.max(1, cw - gap), h: Math.max(1, ch - gap) });

    if (derived) figure.position.copy(worldVec(derived.bounds.site.minX + 14, derived.bounds.site.minY + 14, 0));
    updateSun(v);
    needsRender = true;
  }

  /* ---- cameras & views ------------------------------------------------------------- */
  const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const tanHalfFov = Math.tan(rad(FOV) / 2);

  function switchCamera(type) {
    if (type === camType) return;
    const target = controls.target;
    const offset = cam.position.clone().sub(target);
    const dist = offset.length();
    if (type === 'ortho') {
      ortho.zoom = (2 * ORTHO_HALF) / (2 * dist * tanHalfFov);
      ortho.position.copy(cam.position); ortho.quaternion.copy(cam.quaternion);
      cam = ortho;
    } else {
      const visible = (2 * ORTHO_HALF) / ortho.zoom;
      const d = visible / (2 * tanHalfFov);
      persp.position.copy(target).addScaledVector(offset.normalize(), d);
      persp.quaternion.copy(cam.quaternion);
      cam = persp;
    }
    camType = type;
    cam.updateProjectionMatrix();
    controls.object = cam;
  }

  function setCamAspect(a) {
    persp.aspect = a; persp.updateProjectionMatrix();
    ortho.left = -ORTHO_HALF * a; ortho.right = ORTHO_HALF * a; ortho.top = ORTHO_HALF; ortho.bottom = -ORTHO_HALF;
    ortho.updateProjectionMatrix();
  }
  const hostAspect = () => Math.max(0.1, host.clientWidth) / Math.max(1, host.clientHeight);

  /** Space covered by floating panels; views are framed in the remaining area. */
  function applyViewOffset() {
    const w = host.clientWidth, hgt = host.clientHeight;
    const off = cmp ? 0 : clamp(insetProvider().right || 0, 0, w * 0.6) / 2;
    for (const c of [persp, ortho]) {
      if (off > 0) c.setViewOffset(w, hgt, off, 0, w, hgt); else c.clearViewOffset();
    }
    return off * 2;
  }

  /* ---- framing: every preset view fits the whole of what is on screen ---------------------- */
  const FIT_MARGIN = 0.05;      // empty fraction of the visible area on each side

  /** Plan extent + height of everything a view must show: plates, crown solids, the context. */
  function boxOf(d) {
    const u = d.bounds.union;
    const b = { minX: u.minX, maxX: u.maxX, minY: u.minY, maxY: u.maxY, height: u.height || 0 };
    const add = (x, y, z) => {
      if (x < b.minX) b.minX = x; if (x > b.maxX) b.maxX = x;
      if (y < b.minY) b.minY = y; if (y > b.maxY) b.maxY = y;
      if (z > b.height) b.height = z;
    };
    return b;
  }
  function framingBox() {
    if (cmp) {
      const bs = cmp.entries.map((e) => boxOf(e.d));
      return {
        minX: Math.min(...bs.map((x) => x.minX)), maxX: Math.max(...bs.map((x) => x.maxX)),
        minY: Math.min(...bs.map((x) => x.minY)), maxY: Math.max(...bs.map((x) => x.maxY)),
        height: Math.max(...bs.map((x) => x.height)),
      };
    }
    return boxOf(Derived.get());
  }

  /** Perspective: the nearest distance (and the look-at point) that puts all box corners inside the visible area. */
  function fitPersp(box, dir, aspect, H) {
    const corners = [];
    for (const x of [box.minX, box.maxX]) for (const y of [box.minY, box.maxY]) for (const z of [0, H]) corners.push(worldVec(x, y, z));
    const fwd = dir.clone().negate();
    const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0)).normalize();
    const up = new THREE.Vector3().crossVectors(right, fwd).normalize();
    const fit = 1 - 2 * FIT_MARGIN;
    const tY = tanHalfFov, tX = tanHalfFov * aspect;
    const target = worldVec((box.minX + box.maxX) / 2, (box.minY + box.maxY) / 2, H / 2);
    const solve = () => {
      let dist = 1;
      for (const p of corners) {
        const v = p.clone().sub(target), dd = v.dot(dir);
        dist = Math.max(dist, dd + Math.abs(v.dot(right)) / (tX * fit), dd + Math.abs(v.dot(up)) / (tY * fit));
      }
      return dist;
    };
    let dist = solve();
    for (let i = 0; i < 6; i++) {            // centre the projected box in the visible area, then re-solve the distance
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (const p of corners) {
        const v = p.clone().sub(target), z = dist - v.dot(dir);
        const nx = v.dot(right) / (z * tX), ny = v.dot(up) / (z * tY);
        x0 = Math.min(x0, nx); x1 = Math.max(x1, nx); y0 = Math.min(y0, ny); y1 = Math.max(y1, ny);
      }
      target.addScaledVector(right, ((x0 + x1) / 2) * tX * dist).addScaledVector(up, ((y0 + y1) / 2) * tY * dist);
      dist = solve();
    }
    return { dist, target };
  }

  /** Where each preset puts the camera. Every view frames the whole box (see boxOf) with a small margin. */
  function viewTarget(id, box, aspect, rot = 0) {
    const H = Math.max(box.height, 20);
    const ex = box.maxX - box.minX, ey = box.maxY - box.minY;
    const cx = (box.minX + box.maxX) / 2, cy = (box.minY + box.maxY) / 2;
    const fit = 1 - 2 * FIT_MARGIN;
    if (id === 'axon') {
      const az = rad(135), el = rad(28);      // camera sits south-east, looking north-west
      const dirPlan = [Math.sin(az) * Math.cos(el), Math.cos(az) * Math.cos(el), Math.sin(el)];
      const dir = new THREE.Vector3(...planToWorld(...dirPlan)).normalize();
      const f = fitPersp(box, dir, aspect, H);
      return { type: 'persp', dist: f.dist, target: f.target, dir };
    }
    const reach = 0.55 * Math.sqrt(ex * ex + ey * ey + H * H);     // keeps the whole box in front of an orthographic camera
    if (id === 'plan') {
      const vis = Math.max(ey / fit, ex / (aspect * fit), 30);
      const e = 0.0008;     // tiny tilt toward the south keeps "north up" without a degenerate up-vector
      return {
        type: 'ortho', zoom: (2 * ORTHO_HALF) / vis, minDist: reach,
        target: worldVec(cx, cy, 0),
        dir: new THREE.Vector3(...planToWorld(0, -Math.sin(e), Math.cos(e))).normalize(),
      };
    }
    // Elevations: N = looking at the north face from the north, etc.
    // Elevations look at a sector of the PROJECT frame. The scene is in the massing frame, so the viewing direction turns back by the placement rotation.
    const pd = { n: [0, 1], e: [1, 0], s: [0, -1], w: [-1, 0] }[id];
    const rr = rad(rot), cr = Math.cos(rr), sr = Math.sin(rr);
    const d = [pd[0] * cr + pd[1] * sr, -pd[0] * sr + pd[1] * cr];
    const turned = Math.abs(Math.sin(rr * 2)) > 1e-6;
    const along = turned ? Math.hypot(ex, ey) : ((id === 'n' || id === 's') ? ex : ey);
    const vis = Math.max(H / fit, along / (aspect * fit), 40);
    return {
      type: 'ortho', zoom: (2 * ORTHO_HALF) / vis, minDist: reach,
      target: worldVec(cx, cy, H / 2),
      dir: new THREE.Vector3(...planToWorld(d[0], d[1], 0)).normalize(),
    };
  }

  function framingAspect() {
    if (cmp) {
      const r = cmpRects();
      return r.length ? r[0].w / r[0].h : hostAspect();
    }
    return Math.max(0.2, (host.clientWidth - clamp(insetProvider().right || 0, 0, host.clientWidth * 0.6)) / Math.max(1, host.clientHeight));
  }

  function setView(id, animate = true) {
    if (!renderer) return;
    const goal = viewTarget(id, framingBox(), framingAspect(), cmp ? 0 : num(Derived.get().rotation, 0));
    preset = id;
    overlayVis = null;
    tween = null;
    if (goal.type !== camType) switchCamera(goal.type);
    const curTarget = controls.target.clone();
    const curOffset = cam.position.clone().sub(curTarget);
    const curDist = Math.max(1, curOffset.length());
    const fromDir = curOffset.clone().normalize();
    const toDist = goal.type === 'persp' ? goal.dist : Math.max(curDist, goal.minDist || 0);
    const apply = (target, dir, dist, zoom) => {
      controls.target.copy(target);
      cam.position.copy(target).addScaledVector(dir, dist);
      if (camType === 'ortho') cam.zoom = zoom;
      cam.updateProjectionMatrix();
      controls.update();
    };
    if (!animate || reduceMotion) {
      apply(goal.target, goal.dir, toDist, goal.zoom);
    } else {
      tween = {
        t0: performance.now(), dur: 400,
        fromTarget: curTarget, toTarget: goal.target,
        fromDir, toDir: goal.dir, fromDist: curDist, toDist,
        fromZoom: cam.zoom, toZoom: goal.zoom || cam.zoom,
        q: new THREE.Quaternion().setFromUnitVectors(fromDir, goal.dir),
        apply,
      };
    }
    needsRender = true;
    viewListeners.forEach((fn) => fn(preset));
  }

  function stepTween(now) {
    const k = tween;
    const p = clamp((now - k.t0) / k.dur, 0, 1), e = easeInOut(p);
    const target = k.fromTarget.clone().lerp(k.toTarget, e);
    const dir = k.fromDir.clone().applyQuaternion(new THREE.Quaternion().slerp(k.q, e)).normalize();
    const dist = k.fromDist + (k.toDist - k.fromDist) * e;
    const zoom = k.fromZoom * Math.pow(k.toZoom / k.fromZoom, e);
    k.apply(target, dir, dist, zoom);
    needsRender = true;
    if (p >= 1) tween = null;
  }

  function updateClip() {
    const dist = cam.position.distanceTo(controls.target);
    if (camType === 'persp') {
      cam.near = Math.max(0.5, dist * 0.01);
      cam.far = dist * 20 + sceneRadius * 4 + 2000;
    } else {
      cam.near = 0.1;
      cam.far = dist + 60000;
    }
    cam.updateProjectionMatrix();
  }

  function resize() {
    if (!renderer) return;
    const w = Math.max(1, host.clientWidth), h = Math.max(1, host.clientHeight);
    renderer.setSize(w, h, false);
    setCamAspect(w / h);
    applyViewOffset();
    if (preset) setView(preset, false);
    needsRender = true;
    if (cmp) renderCompare(renderer, scene, cam, false); else renderer.render(scene, cam);
    resizeListeners.forEach((fn) => fn());
  }

  /* ---- compare: one renderer, one camera, one viewport per option -------------------------- */
  const cmpReserve = () => (cmp && cmp.reserve ? cmp.reserve() : { top: 0, bottom: 0 });
  function cmpRects(W = host.clientWidth, H = host.clientHeight, reserve = cmpReserve(), gap = 2) {
    return compareRects(cmp ? cmp.entries.length : 0, W, H, reserve, gap);
  }
  /** Draws every option into its own cell. Also used by screenshots (reserve = none, scaled size). */
  function renderCompare(r, s, c, forCapture) {
    if (!cmp || !cmp.entries.length) { r.render(s, c); return; }
    const size = r.getSize(_v2);
    const W = size.x, H = size.y;
    const k = W / Math.max(1, host.clientWidth);
    const reserve = forCapture ? { top: 0, bottom: 0 } : cmpReserve();
    const rects = compareRects(cmp.entries.length, W, H, reserve, 2 * k);
    r.setScissorTest(false);
    r.setViewport(0, 0, W, H);
    r.setClearColor(cssColor('--line'), 1);
    r.clear();
    r.setScissorTest(true);
    rects.forEach((rc, i) => {
      cmp.entries.forEach((e, j) => { e.group.visible = (i === j); });
      const x = Math.round(rc.x), y = Math.round(H - rc.y - rc.h), w = Math.round(rc.w), h = Math.round(rc.h);
      r.setViewport(x, y, w, h);
      r.setScissor(x, y, w, h);
      setCamAspect(rc.w / rc.h);
      r.render(s, c);
    });
    cmp.entries.forEach((e) => { e.group.visible = true; });
    r.setScissorTest(false);
    r.setViewport(0, 0, W, H);
    setCamAspect(hostAspect());
  }
  function combineBounds(list) {
    const ranges = (k) => list.map((d) => d.bounds[k]);
    const merge = (k) => {
      const rs = ranges(k);
      return {
        minX: Math.min(...rs.map((r) => r.minX)), maxX: Math.max(...rs.map((r) => r.maxX)),
        minY: Math.min(...rs.map((r) => r.minY)), maxY: Math.max(...rs.map((r) => r.maxY)),
        height: Math.max(...rs.map((r) => r.height || 0)),
      };
    };
    return { model: merge('model'), site: merge('site'), union: merge('union'), all: merge('all') };
  }
  function syncCompare() {
    const s = Store.raw(), v = s.view;
    const key = [v.style, v.colorBy, v.mullions, cmp.entries.map((e) => e.uid).join(',')].join('|');
    if (key === cmp.key) return;
    cmp.key = key;
    for (const e of cmp.entries) {
      if (e.group) { clearGroup(e.group); scene.remove(e.group); }
      const st = { ...e.state, view: { ...v, elevation: null } };
      const group = new THREE.Group();
      const sub = new THREE.Group();
      setFrame(sub, e.d);
      const built = Facade3D.build(e.d, st, { quality: 'full', key: 'cmp' }, mats);
      for (const o of built.model) sub.add(o);
      group.add(sub);
      e.group = group;
      scene.add(group);
    }
    viewVersion = -1; needsRender = true;
  }
  function enterCompare(entries, reserve, { keepView = false } = {}) {
    const wasComparing = !!cmp;
    exitCompare(true);
    const list = entries.map((e, i) => ({ ...e, uid: `${i}:${e.uid || e.name}`, group: null }));
    cmp = { entries: list, key: null, reserve, bounds: combineBounds(list.map((e) => e.d)) };
    layers.model.group.visible = layers.context.group.visible = layers.overlay.group.visible = false;
    selOverlay.visible = false;
    figure.visible = false;
    applyViewOffset();
    syncCompare();
    viewVersion = -1;
    if (!(keepView && wasComparing)) setView('axon', false);
    needsRender = true;
  }
  function exitCompare(quiet) {
    if (!cmp) return;
    for (const e of cmp.entries) if (e.group) { clearGroup(e.group); scene.remove(e.group); }
    cmp = null;
    layers.model.group.visible = layers.context.group.visible = layers.overlay.group.visible = true;
    selOverlay.visible = true;
    overlayVis = null;
    resetLayers();
    viewVersion = -1;
    if (!quiet) { applyViewOffset(); setCamAspect(hostAspect()); if (preset) setView(preset, false); needsRender = true; }
  }

  /* ---- loop ------------------------------------------------------------------------ */
  function frame(now) {
    requestAnimationFrame(frame);
    if (capturing) return;
    if (tween) stepTween(now);
    const moved = controls.update();
    if (cmp) {
      syncCompare();
      if (viewVersion !== Store.version()) { viewVersion = Store.version(); applyView(); }
      if (moved || needsRender) { updateClip(); renderCompare(renderer, scene, cam, false); needsRender = false; }
      return;
    }
    const d = Derived.get();
    const state = Store.raw();
    // Draft quality only while a geometry slider drags (never for view settings such as the sun).
    const draft = Store.gestureActive() && !Store.gesturePath().startsWith('view');
    const disp = Derived.display(draft);
    const first = derived === null;
    if (d.geomId !== geomIdSeen) {
      if (!first) refitPending = true;                        // geometry changed: re-frame once the edit settles
      geomIdSeen = d.geomId;
    }
    derived = d;
    syncMain(d, disp, state);
    syncOverlayVisibility(disp.quality === 'draft');
    if (first && !preset) setView('axon', false);
    if (rebuildNotified !== d) { rebuildNotified = d; rebuildListeners.forEach((fn) => fn(d)); }
    if (refitPending && !Store.gestureActive()) { refitPending = false; if (preset) setView(preset, true); }
    if (viewVersion !== Store.version()) { viewVersion = Store.version(); applyView(); }
    if (moved || needsRender) {
      for (const fn of frameListeners) { try { fn(); } catch (e) { console.error(e); } }
      updateClip(); renderer.render(scene, cam); needsRender = false;
    }
  }

  /** Screenshot of what is on screen (main or compare). The HUD inset is removed so the model is centred. */
  async function capture(overlay, scale = 2) {
    if (!renderer) throw new Error('The 3D view is not available.');
    capturing = true;
    const overlayWas = selOverlay.visible;
    selOverlay.visible = false;
    try {
      for (const c of [persp, ortho]) c.clearViewOffset();
      return await ShotMod.captureView({
        renderer, scene, camera: cam, scale, overlay,
        render: cmp ? (r, s, c) => renderCompare(r, s, c, true) : undefined,
      });
    } finally {
      capturing = false;
      selOverlay.visible = overlayWas && !cmp;
      applyViewOffset();
      needsRender = true;
    }
  }

  /** AI-ready picture (main view only): Model style, no grid / scale figure / overlay, a plain light sky and ground.
   *  Nothing in the store is touched: the live layers are hidden, a throwaway group is drawn, then everything is put back. */
  async function captureClean(scale = 2) {
    if (!renderer) throw new Error('The 3D view is not available.');
    if (cmp) throw new Error('Leave Compare to save an AI-ready image.');
    const state = Store.raw();
    const view = { ...state.view, style: 'model', elevation: state.view.elevation };
    const st = { ...state, view };
    const d = Derived.get();
    const shadowsOn = !!view.shadows;
    const ctxMat = new THREE.MeshStandardMaterial({ color: new THREE.Color('#c9cdd2'), roughness: 0.95, metalness: 0 });
    const cap = new THREE.Group();
    const sub = new THREE.Group();
    setFrame(sub, d);
    const built = Facade3D.build(d, st, { quality: 'full', key: 'ai' }, { mesh: (k) => materialFor(k), line: lineMaterial });
    for (const o of built.model) {
      if (o.isMesh) { o.castShadow = shadowsOn; o.receiveShadow = shadowsOn; }
      sub.add(o);
    }
    cap.add(sub);
    for (const o of buildContextObjects(st)) {
      if (o.isMesh) { o.material = ctxMat; o.castShadow = shadowsOn; o.receiveShadow = shadowsOn; }
      cap.add(o);
    }
    const prev = {
      bg: scene.background, ground: ground.material.color.clone(), grid: gridMesh.visible, fig: figure.visible,
      model: layers.model.group.visible, ctx: layers.context.group.visible, ov: layers.overlay.group.visible, shadow: shadowPlane.visible,
    };
    const restore = () => {
      scene.remove(cap);
      clearGroup(sub); clearGroup(cap);
      ctxMat.dispose();
      scene.background = prev.bg;
      ground.material.color.copy(prev.ground);
      gridMesh.visible = prev.grid; figure.visible = prev.fig; shadowPlane.visible = prev.shadow;
      layers.model.group.visible = prev.model; layers.context.group.visible = prev.ctx; layers.overlay.group.visible = prev.ov;
      viewVersion = -1;
    };
    capturing = true;
    const overlayWas = selOverlay.visible;
    selOverlay.visible = false;
    let pending;
    try {
      // captureView draws and copies the frame before its first await, so the scene can be put back straight away.
      try {
        scene.add(cap);
        scene.background = new THREE.Color('#f3f5f7');
        ground.material.color.set('#e4e7ea');
        gridMesh.visible = false; figure.visible = false; shadowPlane.visible = shadowsOn;
        layers.model.group.visible = layers.context.group.visible = layers.overlay.group.visible = false;
        for (const c of [persp, ortho]) c.clearViewOffset();
        pending = ShotMod.captureView({ renderer, scene, camera: cam, scale });
      } finally { restore(); }
    } finally {
      capturing = false;
      selOverlay.visible = overlayWas;
      applyViewOffset();
      needsRender = true;
    }
    return await pending;
  }

  function init(hostEl) {
    host = hostEl;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    } catch (e) {
      host.innerHTML = '<div class="gl-fail">WebGL is not available in this browser, so the 3D view cannot start.</div>';
      renderer = null;
      return false;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    host.appendChild(renderer.domElement);

    buildScene();
    persp = new THREE.PerspectiveCamera(FOV, 1, 1, 100000);
    ortho = new THREE.OrthographicCamera(-ORTHO_HALF, ORTHO_HALF, ORTHO_HALF, -ORTHO_HALF, 0.1, 100000);
    cam = persp;
    persp.position.set(300, 250, 300);

    controls = new OrbitControls(cam, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.12;
    controls.maxPolarAngle = Math.PI / 2;      // never below ground; exactly horizontal is allowed (elevations)
    controls.minDistance = 8;
    controls.maxDistance = 60000;
    controls.minZoom = 0.01; controls.maxZoom = 80;
    controls.screenSpacePanning = true;
    controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
    controls.addEventListener('start', () => {
      tween = null;
      if (preset) { preset = null; overlayVis = null; viewListeners.forEach((fn) => fn(null)); }
    });
    controls.addEventListener('change', () => { needsRender = true; });

    const ro = new ResizeObserver(resize);
    ro.observe(host);
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onTheme = () => { themeEpoch++; viewVersion = -1; };
    if (mq.addEventListener) mq.addEventListener('change', onTheme); else if (mq.addListener) mq.addListener(onTheme);

    renderer.domElement.addEventListener('webglcontextlost', (e) => e.preventDefault());
    refreshColors();
    resize();
    requestAnimationFrame(frame);
    return true;
  }

  return {
    init, setView, capture, captureClean, enterCompare, exitCompare,
    sceneFlags: () => ({ grid: gridMesh.visible, figure: figure.visible, model: layers.model.group.visible, context: layers.context.group.visible, overlay: layers.overlay.group.visible, children: scene.children.length }),
    setInsetProvider: (fn) => { insetProvider = fn; },
    refreshInsets: (animate = true) => { if (!renderer) return; applyViewOffset(); if (preset) setView(preset, animate); else needsRender = true; },
    relayout: () => { needsRender = true; resizeListeners.forEach((fn) => fn()); },
    cells: () => (cmp ? cmpRects() : []),
    requestRender: () => { needsRender = true; },
    onRebuild: (fn) => rebuildListeners.push(fn),
    onViewChange: (fn) => viewListeners.push(fn),
    onResize: (fn) => resizeListeners.push(fn),
    overlayInfo: () => { const kids = layers.overlay.group.children; return { total: kids.length, plan: kids.filter((o) => o.userData.plan).length, planVisible: kids.some((o) => o.userData.plan && o.visible), labels: kids.filter((o) => o.userData.label).map((o) => o.userData.label) }; },
    info: () => ({ camera: camType, preset, meshes: layers ? layers.model.group.children.length : 0, tweening: !!tween, distance: cam ? cam.position.distanceTo(controls.target) : 0, zoom: cam ? cam.zoom : 0, compare: !!cmp, drawQuality: derived ? Derived.display(Store.gestureActive() && !Store.gesturePath().startsWith('view')).quality : null }),
    ready: () => !!renderer,
    comparing: () => !!cmp,
    // v1.1 hooks for direct editing (Select): the camera, the orbit controls, the overlay group and a per-frame callback
    overlayGroup: () => selOverlay,
    pickables: () => (layers ? layers.model.group.children.filter((o) => o.userData && o.userData.owners) : []),
    onFrame: (fn) => frameListeners.push(fn),
    camera: () => cam,
    cameraType: () => camType,
    canvas: () => (renderer ? renderer.domElement : null),
    setOrbitEnabled: (on) => { if (controls) { controls.enabled = !!on; if (!on) tween = null; } },
    orbitEnabled: () => !!controls && controls.enabled,
  };
})();

const Toast = (() => {

const Pop = (() => {
  let cur = null;
  function close() {
    if (!cur) return;

    el.classList.add('pop');
    el.style.visibility = 'hidden';
    document.body.append(el);
    const r = anchor.getBoundingClientRect(), w = el.offsetWidth;
    let left = opts.align === 'right' ? r.right - w : r.left;
    left = clamp(left, 8, Math.max(8, window.innerWidth - w - 8));
    const top = Math.min(r.bottom + 6, window.innerHeight - 120);
    el.style.left = `${left}px`; el.style.top = `${top}px`;
    el.style.maxHeight = `${Math.max(160, window.innerHeight - top - 12)}px`;
    el.style.visibility = '';
    anchor.setAttribute('aria-expanded', 'true');
    const onDown = (e) => { if (!el.contains(e.target) && !anchor.contains(e.target)) close(); };
    const onKey = (e) => { if (e.key === 'Escape') { close(); anchor.focus(); } };
    document.addEventListener('pointerdown', onDown, true);
    document.addEventListener('keydown', onKey, true);
    cur = { el, anchor, onDown, onKey, onClose: opts.onClose };
    return true;

})();

/** Small modal question. Resolves true for the confirm button. */
function confirmDialog(message, okLabel = 'OK', danger = false) {
  return new Promise((resolve) => {
    const back = h('div', { class: 'modal-back' });
    const done = (v) => { document.removeEventListener('keydown', onKey, true); back.remove(); resolve(v); };
    const ok = h('button', { class: `btn ${danger ? 'danger' : 'solid'}`, type: 'button', onclick: () => done(true) }, okLabel);
    const cancel = h('button', { class: 'btn outline', type: 'button', onclick: () => done(false) }, 'Cancel');
    const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } };

    back.append(h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' }, h('p', null, message), h('div', { class: 'pop-actions' }, cancel, ok)));

    ok.focus();

  function buildPanel() {
    const host = $('sections');
    host.textContent = '';
    const panels = {};
    for (const t of TABS) {
      panels[t.id] = h('div', { class: 'tabpanel', id: `tabpanel-${t.id}`, role: 'tabpanel', 'aria-labelledby': `tab-${t.id}`, hidden: true });
      host.append(panels[t.id]);
    }
    for (const s of SECTIONS) {
      const parts = s.build();
      const open = prefs.sections && s.id in prefs.sections ? !!prefs.sections[s.id] : !!s.open;
      const sec = Controls.section({
        id: s.id, title: s.title, open, children: els(parts.children || []), more: els(parts.more || []),
        onToggle: (isOpen) => rememberSection(s.id, isOpen),
      });
      sectionCtl[s.id] = sec;
      panels[s.tab].append(sec.el);
    }
  }
  function rememberSection(id, isOpen) { prefs.sections = { ...(prefs.sections || {}), [id]: isOpen }; saveUiPrefs(prefs); }

  /* ---- tabs ------------------------------------------------------------------------ */
  function buildTabs() {
    const bar = $('panelTabs');
    bar.textContent = '';
    for (const t of TABS) {
      bar.append(h('button', {
        class: 'tab', type: 'button', role: 'tab', id: `tab-${t.id}`, 'data-tab': t.id, 'aria-controls': `tabpanel-${t.id}`, 'aria-selected': 'false', tabindex: '-1',
        onclick: () => { setTab(t.id); raiseSheet(); },
      }, t.title));
    }
    bar.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight' && e.key !== 'Home' && e.key !== 'End') return;
      e.preventDefault();
      const i = TABS.findIndex((t) => t.id === activeTab);
      const next = e.key === 'Home' ? 0 : e.key === 'End' ? TABS.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + TABS.length) % TABS.length;
      setTab(TABS[next].id);
      $(`tab-${TABS[next].id}`).focus();
    });
  }
  /** Shows one tab. Remembered in the UI prefs (localStorage), and each tab keeps its own scroll position. */
  function setTab(id, { remember = true } = {}) {
    if (!TABS.some((t) => t.id === id)) return false;
    const scroller = $('panelScroll');
    if (id !== activeTab) scrollPos[activeTab] = scroller.scrollTop;
    activeTab = id;
    for (const t of TABS) {
      const on = t.id === id;
      const btn = $(`tab-${t.id}`), pnl = $(`tabpanel-${t.id}`);
      btn.setAttribute('aria-selected', on ? 'true' : 'false');
      btn.tabIndex = on ? 0 : -1;
      pnl.hidden = !on;
    }
    scroller.scrollTop = scrollPos[id] || 0;
    if (remember && prefs.tab !== id) { prefs.tab = id; saveUiPrefs(prefs); }
    return true;
  }

  /* ---- hooks for the face card ------------------------------------------------------- */
  /**
   * Switches to the Facade tab, opens the card of the face's zone (and its range row) with the face's orientation chosen,
   * and scrolls it into view. item: { kind: 'face', id }. Returns true when something was opened.
   */
  function openItem(item) {
    if (!item || item.kind !== 'face') return false;
    const g = D().groups.find((x) => x.id === item.id);
    if (!g) return false;
    setTab('facade');
    const direct = BASE_ZONES.includes(g.zone);
    const secId = direct ? `zone-${g.zone}` : 'zone-ranges';
    const sec = sectionCtl[secId];
    if (!sec) return false;
    if (!sec.isOpen()) { sec.setOpen(true); rememberSection(secId, true); }
    let target = sec.el;
    if (direct) {
      if (zoneApi[g.zone]) zoneApi[g.zone].setTarget(g.orientation);
    } else {
      const i = (get('zones.ranges') || []).findIndex((r) => r.id === g.zone);
      const row = zoneApi.rangesList && i >= 0 ? zoneApi.rangesList.openAt(i) : null;
      if (row) target = row;
      if (zoneApi[`range:${i}`]) zoneApi[`range:${i}`].setTarget(g.orientation);
    }
    raiseSheet();
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    try { target.scrollIntoView({ block: 'start', behavior: reduce ? 'auto' : 'smooth' }); } catch (e) { target.scrollIntoView(); }
    target.classList.remove('is-focus'); void target.offsetWidth; target.classList.add('is-focus');
    setTimeout(() => target.classList.remove('is-focus'), 1600);
    return true;
  }

  function buildTopBar() {

  /* ---- preset views ------------------------------------------------------------------ */
  const ELEV_OF = { n: 'N', e: 'E', s: 'S', w: 'W' };
  function buildViews() {
    const nav = $('views');
    const items = [['axon', 'Axon'], ['n', 'N'], ['e', 'E'], ['s', 'S'], ['w', 'W'], ['plan', 'Plan']];
    const labels = { axon: 'Axonometric view', n: 'North elevation', e: 'East elevation', s: 'South elevation', w: 'West elevation', plan: 'Plan view' };
    for (const [id, text] of items) nav.append(h('button', { type: 'button', 'data-view': id, 'aria-pressed': 'false', title: labels[id], 'aria-label': labels[id], onclick: () => Render.setView(id, true) }));
    nav.querySelectorAll('button').forEach((b, i) => { b.textContent = items[i][1]; });
    // The state's view.elevation follows the camera preset (an elevation preset is an orthographic elevation); it joins the last undo step.
    Render.onViewChange((active) => {
      nav.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.view === active ? 'true' : 'false'));
      const want = ELEV_OF[active] || null;
      if ((Store.get('view.elevation') || null) !== want) Store.set('view.elevation', want, { merge: true });
    });
    // A loaded option, an undo or an import that changes the elevation moves the camera.
    Store.subscribe((s, info) => {
      if (!info || !['replace', 'undo', 'redo'].includes(info.kind) || !Render.ready() || Render.comparing()) return;
      const e = s.view.elevation, p = Render.info().preset;
      if (e && p !== e.toLowerCase()) Render.setView(e.toLowerCase(), false);
      else if (!e && ELEV_OF[p]) Render.setView('axon', false);
    });
  }

  /* ---- metrics + warnings HUD ---------------------------------------------------------- */
  function buildHud() {
    const hud = $('hud');
    const open = !!prefs.hudOpen;                      // remembered: expanded or compact
    hud.dataset.collapsed = open ? 'false' : 'true';
    hud.innerHTML = `
      <button class="hud-toggle" id="hudToggle" type="button" aria-expanded="${open}" aria-controls="hudBody" title="Show or hide all metrics">
        <span class="hud-top">
          <span class="label">Facade</span>
          <span class="hud-badge" id="hudBadge" data-n="0" title="Warnings">0 warnings</span>
          ${CARET_SVG}
        </span>
        <span class="hud-core">
          <span class="m"><span class="k">WWR</span><span class="v" id="mWwr">-<small id="mWwrSub"></small></span></span>

          <span class="m"><span class="k">Ground transparency</span><span class="v" id="mTrans">-<small id="mTransSub"></small></span></span>

          <div class="m"><dt>Glazing area</dt><dd id="mGlaz">-</dd></div>
          <div class="m"><dt>Balcony area</dt><dd id="mBalcArea">-</dd></div>
          <div class="m"><dt>Levels</dt><dd id="mLevels">-</dd></div>
          <div class="m"><dt>Height</dt><dd id="mHeight">-</dd></div>
          <div class="m"><dt>Face groups</dt><dd id="mFaces">-</dd></div>
        </dl>
        <div class="sec" id="hudOrient"><div class="label">Window-to-wall by orientation</div><dl class="kv" id="hudOrientList"></dl></div>
        <div class="sec" id="hudPf"><div class="label">Shade projection factor</div><dl class="kv" id="hudPfList"></dl></div>
        <div class="sec" id="hudExp"><div class="label">Sun exposure (most exposed = 1)</div><dl class="kv" id="hudExpList"></dl></div>

    Render.setInsetProvider(() => {

  function setHudOpen(open) {
    const hud = $('hud');

    if (!!prefs.hudOpen !== open) { prefs.hudOpen = open; saveUiPrefs(prefs); }
  }
  function setText(id, text) { const el = $(id); if (!el) return; if (el.firstChild && el.firstChild.nodeType === 3) el.firstChild.nodeValue = text; else el.prepend(document.createTextNode(text)); }
  function kvRows(list, rows) {
    if (!list) return;
    list.textContent = '';
    for (const [k, v, cls] of rows) list.append(h('dt', null, k), h('dd', cls ? { class: cls } : null, v));
  }

  function updateHud(d) {
    const m = d.hud, st = Store.raw();
    setText('mWwr', pct1(m.wwr));
    $('mWwrSub').textContent = ` of ${pct1(m.limit)}`;
    $('mWwr').classList.toggle('bad', m.over);
    setText('mWorst', m.worst ? `${m.worst.o} ${pct1(m.worst.wwr)}` : '-');
    $('mWorst').classList.toggle('bad', !!m.worst && m.worst.wwr > m.limit + 1e-9);
    setText('mTrans', m.transparency == null ? (d.street.length ? '-' : 'n/a') : pct1(m.transparency));
    $('mTransSub').textContent = m.transparency == null ? '' : (m.target == null ? ' target off' : ` target ${pct1(m.target)}`);
    $('mTrans').classList.toggle('bad', m.targetMet === false);
    setText('mBalc', Units.formatInt(m.balconies));
    setText('mWall', Units.formatArea(m.wall));
    setText('mGlaz', Units.formatArea(m.glazing));
    setText('mBalcArea', Units.formatArea(m.balconyArea));
    setText('mLevels', Units.formatInt(m.levels));
    setText('mHeight', m.height ? Units.formatFeetInches(m.height) : '-');
    setText('mFaces', Units.formatInt(m.faces));

    kvRows($('hudOrientList'), CONFIG.orientations.map((o) => {
      const b = m.byOrientation[o] || { wall: 0, glazing: 0, wwr: 0 };
      return [CONFIG.orientationLabels[o], b.wall > 0 ? `${pct1(b.wwr)} · ${Units.formatArea(b.glazing)} of ${Units.formatArea(b.wall)}` : 'no wall', b.wall > 0 && b.wwr > m.limit + 1e-9 ? 'tgt-neg' : ''];
    }));
    const pf = m.projection || [];
    $('hudPf').hidden = !pf.length;
    kvRows($('hudPfList'), pf.slice(0, 12).map((r) => [`${r.orientation} · ${zoneName(r.zone)} · ${(CONFIG.systemLabels[r.system] || r.system).toLowerCase()}`, r.pf.toFixed(2)]));
    $('hudExp').hidden = !m.exposure;
    if (m.exposure) kvRows($('hudExpList'), CONFIG.orientations.map((o) => [CONFIG.orientationLabels[o], Units.formatRatio(m.exposure[o] == null ? 0 : m.exposure[o], 2)]));

    const list = $('warnList');
    list.textContent = '';

    $('hudBadge').textContent = `${nw} ${nw === 1 ? 'warning' : 'warnings'}`;

    updateNotes(d);
    updateLegend(d);
