function byZ(levels) {
  return (Array.isArray(levels) ? levels : []).slice().sort((p, q) => (num(p.z) - num(q.z)) || (num(p.index) - num(q.index)));
}

/**
 * Plan 3.1 and section 7. Project source: massing.derived.levels without deck, crown, or empty levels.
 * A missing project massing, or one with no levels, falls back to the standalone massing with a note.
 * → { levels (sorted by z), rotation, source: "project" | "standalone", notes: [string], noteIds: [string] }
 */
function massingLevels(state, project) {
  const st = state || {};
  const notes = [], noteIds = [];
  const note = (id, text) => { noteIds.push(id); notes.push(text); };
  if (st.source === "project") {
    const sec = getSection(project, "massing");
    const der = sec && sec.derived;
    const list = der && Array.isArray(der.levels) ? der.levels : [];
    if (!sec) {
      note("no-project-massing", "No project massing is open. Showing the standalone massing.");
    } else if (!list.length) {
      if (sec.tool === "tower") note("tower-no-levels", "The Tower Generator does not write massing levels yet. Use the standalone massing.");
      else note("no-levels", "The project massing has no levels. Showing the standalone massing.");
    } else {
      const placement = sec.placement || st.placement || {};
      const levels = byZ(list
        .filter((l) => l && !SKIP_ZONES.includes(l.zone))
        .map((l) => ({ index: num(l.index), zone: l.zone, z: r3(num(l.z)), ftf: r3(num(l.ftf)), program: l.program === undefined ? null : l.program, plates: cleanMP(l.plates) }))
        .filter((l) => l.plates.length));
      if (!levels.length) note("no-levels", "The project massing has no levels with plates.");
      return { levels, rotation: num(placement.rotation, 0), source: "project", notes, noteIds };
    }
  }
  const levels = byZ(standaloneLevels(st.standalone).filter((l) => l.plates.length));

}

/* ------------------------------------------------------------ bearings */

/** Plan 3.3: outward normal [nx, ny] (or {x, y}) in the local frame → bearing in the project frame. */
function bearingOf(normal, rotationDeg) {
  const nx = Array.isArray(normal) ? num(normal[0]) : num(normal && normal.x);
  const ny = Array.isArray(normal) ? num(normal[1]) : num(normal && normal.y);
  const r = num(rotationDeg, 0) * DEG;
  const px = nx * Math.cos(r) - ny * Math.sin(r);
  const py = nx * Math.sin(r) + ny * Math.cos(r);
  let b = r3(Math.atan2(px, py) / DEG);
  b = ((b % 360) + 360) % 360;
  b = r3(b);
  return b >= 360 || b === 0 ? 0 : b;
}

/** Plan 3.3: N [315, 45), E [45, 135), S [135, 225), W [225, 315). */
function sectorOf(bearing) {
  const b = ((num(bearing) % 360) + 360) % 360;
  if (b >= 315 || b < 45) return "N";
  if (b < 135) return "E";
  if (b < 225) return "S";
  return "W";
}

/* ------------------------------------------------------------ edges */

const dirOf = (a, b) => Math.atan2(b[1] - a[1], b[0] - a[0]) / DEG;
const angDiff = (x, y) => Math.abs((((x - y) % 360) + 540) % 360 - 180);
const lenOf = (e) => Math.hypot(e.b[0] - e.a[0], e.b[1] - e.a[1]);

/** One merge pass around a closed ring of edges {a, b}. */
function mergePass(list) {
  const n = list.length;
  if (n < 3) return list;
  let s = -1;
  for (let i = 0; i < n; i++) {
    const p = list[(i - 1 + n) % n], c = list[i];
    if (angDiff(dirOf(p.a, p.b), dirOf(c.a, c.b)) >= MERGE_DEG) { s = i; break; }
  }
  if (s < 0) return list;
  const out = [];
  let cur = null;
  for (let k = 0; k < n; k++) {
    const e = list[(s + k) % n];
    if (cur && angDiff(dirOf(cur.a, cur.b), dirOf(e.a, e.b)) < MERGE_DEG) cur = { a: cur.a, b: e.b };
    else { if (cur) out.push(cur); cur = { a: e.a, b: e.b }; }
  }
  out.push(cur);
  return out;
}

/** Plan 3.2: merge near-collinear edges, drop short ones, until stable. */
function ringEdgeList(ring) {
  let list = [];
  for (let i = 0, n = ring.length; i < n; i++) {
    const e = { a: ring[i], b: ring[(i + 1) % n] };
    if (lenOf(e) > 1e-9) list.push(e);
  }
  for (let it = 0; it < 8; it++) {
    const next = mergePass(list).filter((e) => lenOf(e) >= MIN_EDGE);
    const same = next.length === list.length;
    list = next;
    if (same) break;
  }
  return list.length >= 2 ? list : [];
}

/** Plan 3.2 and 3.3: every face edge of one level, outer rings (ring 0) and holes (ring k). */
function levelEdges(level, rotationDeg) {
  const lv = level || {};
  const out = [];
  const plates = cleanMP(lv.plates);
  plates.forEach((pc, piece) => {
    [pc.outer, ...pc.holes].forEach((ring, ringId) => {
      const list = ringEdgeList(ring);
      const m = list.length;
      const turn = (e1, e2) => {
        const d1 = [e1.b[0] - e1.a[0], e1.b[1] - e1.a[1]], d2 = [e2.b[0] - e2.a[0], e2.b[1] - e2.a[1]];
        const cross = d1[0] * d2[1] - d1[1] * d2[0];
        return cross / (Math.hypot(...d1) * Math.hypot(...d2));
      };
      const convex = list.map((e, j) => turn(list[(j - 1 + m) % m], e) > 1e-9);   // vertex at the start of edge j
      list.forEach((e, j) => {
        const dx = e.b[0] - e.a[0], dy = e.b[1] - e.a[1], L = Math.hypot(dx, dy);
        const normal = [r6(dy / L), r6(-dx / L)];
        const bearing = bearingOf([dy / L, -dx / L], rotationDeg);
        out.push({
          levelIndex: lv.index, ring: ringId,
          a: [r3(e.a[0]), r3(e.a[1])], b: [r3(e.b[0]), r3(e.b[1])], length: r3(L),
          normal, bearing, orientation: sectorOf(bearing),
          convexStart: convex[j], convexEnd: convex[(j + 1) % m],
          piece, k: j, z: r3(num(lv.z)), ftf: r3(num(lv.ftf)),
        });
      });
    });
  });
  return out;
}

/* ------------------------------------------------------------ zones */

/** Plan 3.4: default base / middle / top, or level ranges with the default as the fallback. */
function zoneOf(state, levels) {
  const sorted = byZ(levels);
  const out = {};
  if (!sorted.length) return out;
  const podium = sorted.filter((l) => l.zone === "podium").map((l) => l.index);
  const base = new Set(podium.length ? podium : [sorted[0].index]);
  const topIdx = sorted[sorted.length - 1].index;
  for (const l of sorted) out[l.index] = base.has(l.index) ? "base" : l.index === topIdx ? "top" : "middle";
  const z = (state && state.zones) || {};
  if (z.mode === "ranges" && Array.isArray(z.ranges)) {
    for (const l of sorted) {
      const r = z.ranges.find((g) => g && g.id !== undefined && l.index >= num(g.from, Infinity) && l.index <= num(g.to, -Infinity));
      if (r) out[l.index] = String(r.id);
    }
  }
  return out;
}

/* ------------------------------------------------------------ face groups */

const near = (p, q, tol) => Math.hypot(p[0] - q[0], p[1] - q[1]) <= tol;

/** Plan 3.5: faces on touching consecutive levels join when zone, ring, end points (1 ft), and direction (1°) match. */
function faceGroups(state, levels, rotationDeg) {
  const sorted = byZ(levels);
  const zones = zoneOf(state, sorted);
  const groups = [];
  let open = [];        // groups whose last level is the previous level
  let prev = null;
  for (const lv of sorted) {
    const zone = zones[lv.index];
    const touches = prev && Math.abs(num(prev.z) + num(prev.ftf) - num(lv.z)) <= Z_TOL;
    const candidates = touches ? open : [];
    const edges = levelEdges(lv, rotationDeg).sort((p, q) => (p.ring - q.ring) || (p.piece - q.piece) || (p.k - q.k));
    const used = new Set();
    const next = [];
    for (const e of edges) {
      const dir = dirOf(e.a, e.b);
      const g = candidates.find((c) => {
        if (used.has(c) || c.zone !== zone || c.ring !== e.ring) return false;
        const last = c.edges[c.edges.length - 1];
        return near(last.a, e.a, GROUP_TOL) && near(last.b, e.b, GROUP_TOL) && angDiff(dirOf(last.a, last.b), dir) <= GROUP_DEG;
      });
      if (g) {
        used.add(g);
        g.edges.push(e);
        g.levels.push(lv.index);
        g.levelTo = lv.index;
        g.height = r3(g.height + e.ftf);
        next.push(g);
      } else {
        const ng = {
          id: `F${groups.length + 1}`, levelFrom: lv.index, levelTo: lv.index, levels: [lv.index],
          a: e.a.slice(), b: e.b.slice(), length: e.length, bearing: e.bearing, orientation: e.orientation,
          zone, ring: e.ring, convexStart: e.convexStart, convexEnd: e.convexEnd, height: e.ftf,
          normal: e.normal.slice(), piece: e.piece, z: e.z, edges: [e],
        };
        groups.push(ng);
        next.push(ng);
      }
    }
    open = next;
    prev = lv;
  }
  return groups;
}

/* ------------------------------------------------------------ street faces */

function closestOnSegment(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy;
  const t = L2 > 0 ? Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L2)) : 0;
  return [a[0] + t * dx, a[1] + t * dy];
}

/**
 * Plan 3.10. manual: the ids in state.street.manual. auto: lowest-level groups facing S, or, when the
 * project site has road segments, lowest-level groups whose midpoint (project frame) lies within
 * roadDistance of a road centerline and whose normal points toward it. → { ids, source }
 */
function streetFaces(state, groups, levels, project) {
  const st = (state && state.street) || {};
  const list = Array.isArray(groups) ? groups : [];
  if (st.mode === "manual") {
    const want = new Set((Array.isArray(st.manual) ? st.manual : []).map(String));
    return { ids: list.filter((g) => want.has(g.id)).map((g) => g.id), source: "manual" };
  }
  const sorted = byZ(levels);
  if (!sorted.length) return { ids: [], source: "auto" };
  const low = sorted[0].index;
  const ground = list.filter((g) => Array.isArray(g.levels) ? g.levels.includes(low) : g.levelFrom === low);
  const site = getSection(project, "site");
  const segs = site && site.derived && site.derived.roads && Array.isArray(site.derived.roads.segments) ? site.derived.roads.segments : [];
  const roads = segs.map((s) => (s && Array.isArray(s.line) ? s.line.filter((p) => Array.isArray(p) && isNum(p[0]) && isNum(p[1])) : [])).filter((l) => l.length >= 2);
  if (!roads.length) return { ids: ground.filter((g) => g.orientation === "S").map((g) => g.id), source: "auto" };

  const massing = getSection(project, "massing");
  const placement = (state && state.placement) || (massing && massing.placement) || { x: 0, y: 0, rotation: 0, baseZ: 0 };
  const pl = { x: num(placement.x), y: num(placement.y), rotation: num(placement.rotation), baseZ: num(placement.baseZ) };
  const r = pl.rotation * DEG;
  const dist = Math.max(0, num(st.roadDistance, 60));
  const ids = [];
  for (const g of ground) {
    const e = (g.edges || []).find((x) => x.levelIndex === low) || g;
    const mid = toProject(pl, [(e.a[0] + e.b[0]) / 2, (e.a[1] + e.b[1]) / 2]);
    const n = e.normal || g.normal;
    const pn = [n[0] * Math.cos(r) - n[1] * Math.sin(r), n[0] * Math.sin(r) + n[1] * Math.cos(r)];
    const hit = roads.some((line) => {
      for (let i = 0; i + 1 < line.length; i++) {
        const c = closestOnSegment(mid, line[i], line[i + 1]);
        const vx = c[0] - mid[0], vy = c[1] - mid[1];
        if (Math.hypot(vx, vy) <= dist && vx * pn[0] + vy * pn[1] > 0) return true;
      }
      return false;
    });
    if (hit) ids.push(g.id);
  }
  return { ids, source: "auto-site" };
}

return { SECTORS, standaloneLevels, massingLevels, bearingOf, sectorOf, levelEdges, zoneOf, faceGroups, streetFaces };
})();

/* ---- src/facade/balconies.js ---- */
const BalconiesMod = (() => {
/* ==========================================================================
   balconies.js — balcony modules, per-unit balconies, and strip geometry (Facade Studio)

   Contract: docs/facade-studio-technical-plan.md sections 3.8 and 4.
   Pure: no DOM, no Clipper, no mutation of inputs. Units: feet.

   A face runs from `a` to `b` in the local frame. The outward normal is
   (dy, -dx) / |d|, the rule faces.js uses on both outer rings and holes.
   Position `u` is the distance along the face from `a`; `v` is the height
   above the level floor.

   Rule choices where the plan leaves room:
   - balconyModules("per-unit", ...) answers like "stacked". The per-unit
     choice needs Plate Planner units (unitBalconies); buildFacade uses this
     answer as the fallback when a level has none.
   - spacing is rounded to a whole number of at least 1. An unknown pattern
     is stacked. Indices are sorted, unique, and inside [0, n).
   - unitBalconies: a unit edge counts as a facade edge of a face when both
     end points lie within 0.5 ft of the face line and the edge overlaps the
     face. The edge length is the overlap length. The balcony goes at the
     centre of the overlap, in the module that holds it. When that module is
     taken by another unit, the nearest free module is used (the lower index
     on a tie), so each unit keeps one balcony while a free module exists.
   - unitBalconies with `allFaces` (the fourth argument): a unit belongs to
     the face that holds its longest facade edge among those faces, so a
     corner unit gets one balcony, not two. Without it, the unit belongs to
     this face when it has a facade edge here.
   - balconyGeometry: the balcony is centred in its module and clamped to
     the module width. A projected balcony is a slab outside the face, `slab`
     thick, with its top at the level floor (z0 = z - slab, z1 = z). An inset
     balcony is the recess cut into the plate: z0 = z, z1 = z + ftf. The door
     is centred in the module, sill 0, and stands at the recessed plane for an
     inset balcony (door.offset = depth, projected 0).
   ========================================================================== */

const isNum = (v) => typeof v === "number" && Number.isFinite(v);
const r3 = (v) => Math.round(v * 1000) / 1000 + 0;
const mod = (a, b) => ((a % b) + b) % b;
const FACE_TOL = 0.5;   // ft: a unit edge lies on a face within this distance

function need(cond, fn, what) {
  if (!cond) throw new Error(`${fn}: ${what} is missing or not valid`);
}

/* ------------------------------------------------------------- patterns */

/** Plan 3.8. pattern: "stacked" | "alternating" | "checker" | "per-unit". n modules on the face,
    levelIndex k, spacing s. → sorted module indices. */
function balconyModules(pattern, n, levelIndex, spacing) {
  const count = isNum(n) ? Math.max(0, Math.floor(n)) : 0;
  const s = isNum(spacing) ? Math.max(1, Math.round(spacing)) : 2;
  const k = isNum(levelIndex) ? Math.round(levelIndex) : 0;
  let offset = 0;
  if (pattern === "alternating") offset = mod(k, 2) * Math.floor(s / 2);
  else if (pattern === "checker") offset = k;
  const out = [];
  for (let i = 0; i < count; i++) if (mod(i - offset, s) === 0) out.push(i);
  return out;
}

/* ------------------------------------------------------------- geometry */

function frameOf(face) {
  const a = face.a, b = face.b;
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const L = Math.hypot(dx, dy);
  need(L > 1e-9, "balconies", "face a and b");
  return { a, L, d: [dx / L, dy / L], n: [dy / L, -dx / L] };
}

function ccw(ring) {
  let s = 0;
  for (let i = 0; i < ring.length; i++) { const p = ring[i], q = ring[(i + 1) % ring.length]; s += p[0] * q[1] - q[0] * p[1]; }
  return s < 0 ? ring.slice().reverse() : ring;
}

/** A rectangle on a face: from u0 to u1 along the face and `depth` ft off it (outward when depth > 0,
    into the plate when depth < 0). → counter-clockwise Ring, rounded to 0.001 ft. */
function faceStrip(face, u0, u1, depth) {
  need(face && face.a && face.b, "faceStrip", "face");
  const f = frameOf(face);
  const at = (u, off) => [r3(f.a[0] + f.d[0] * u + f.n[0] * off), r3(f.a[1] + f.d[1] * u + f.n[1] * off)];
  return ccw([at(u0, 0), at(u1, 0), at(u1, depth), at(u0, depth)]);
}

function moduleOf(face) {
  if (isNum(face.module) && face.module > 0) return face.module;
  const n = isNum(face.n) && face.n > 0 ? face.n : 1;
  return face.length / n;
}

/** Plan 3.8. face: { a, b, length, module?, n?, z, ftf }. i: module index.
    balconies: state.balconies. → { type, plan, z0, z1, door, u0, u1, width, depth, slab } */
function balconyGeometry(face, i, balconies) {
  need(face && face.a && face.b && isNum(face.length), "balconyGeometry", "face");
  const b = balconies || {};
  const m = moduleOf(face);
  const type = b.type === "inset" ? "inset" : "projected";
  const width = Math.min(isNum(b.width) ? b.width : 12, m);
  const depth = isNum(b.depth) ? b.depth : 6;
  const slab = isNum(b.slab) ? b.slab : 1;
  const uc = (i + 0.5) * m;
  const u0 = uc - width / 2, u1 = uc + width / 2;
  const z = isNum(face.z) ? face.z : 0, ftf = isNum(face.ftf) ? face.ftf : 10;
  const dw = Math.min(b.door && isNum(b.door.width) ? b.door.width : 6, m);
  const dh = Math.min(b.door && isNum(b.door.head) ? b.door.head : 8, ftf);
  return {
    type,
    plan: faceStrip(face, u0, u1, type === "inset" ? -depth : depth),
    z0: r3(type === "inset" ? z : z - slab),
    z1: r3(type === "inset" ? z + ftf : z),
    door: { u0: uc - dw / 2, u1: uc + dw / 2, v0: 0, v1: dh, offset: type === "inset" ? depth : 0 },
    u0, u1, width, depth, slab,
  };
}

/* ------------------------------------------------------------ per unit */

/** The part of a unit edge on a face: { len, mid } (mid = u of the overlap centre), or null. */
function edgeOnFace(face, p, q) {
  const f = frameOf(face);
  const dist = (x) => Math.abs((x[0] - f.a[0]) * f.n[0] + (x[1] - f.a[1]) * f.n[1]);
  if (dist(p) > FACE_TOL || dist(q) > FACE_TOL) return null;
  const tp = (p[0] - f.a[0]) * f.d[0] + (p[1] - f.a[1]) * f.d[1];
  const tq = (q[0] - f.a[0]) * f.d[0] + (q[1] - f.a[1]) * f.d[1];
  const lo = Math.max(0, Math.min(tp, tq)), hi = Math.min(f.L, Math.max(tp, tq));
  if (hi - lo <= 1e-6) return null;
  return { len: hi - lo, mid: (lo + hi) / 2 };
}

function bestOnFace(face, ring) {
  let best = null;
  for (let k = 0; k < ring.length; k++) {
    const e = edgeOnFace(face, ring[k], ring[(k + 1) % ring.length]);
    if (e && (!best || e.len > best.len)) best = e;
  }
  return best;
}

/** Plan 3.8, per-unit. unitsLevel: a plates.derived level { units: [{ outer }] } in the local frame.
    module: the actual module width (ft). allFaces: optional, see the header.
    → sorted unique module indices, one per unit, snapped to the module that holds the balcony. */
function unitBalconies(face, unitsLevel, module, allFaces) {
  need(face && face.a && face.b && isNum(face.length), "unitBalconies", "face");
  const units = unitsLevel && Array.isArray(unitsLevel.units) ? unitsLevel.units : [];
  const m = isNum(module) && module > 0 ? module : moduleOf(face);
  const n = Math.max(1, isNum(face.n) && face.n > 0 ? Math.floor(face.n) : Math.round(face.length / m));
  const same = (g) => g === face || (g.id !== undefined && g.id === face.id);
  const wanted = [];
  for (const u of units) {
    const ring = u && Array.isArray(u.outer) ? u.outer : null;
    if (!ring || ring.length < 3) continue;
    const here = bestOnFace(face, ring);
    if (!here) continue;
    if (Array.isArray(allFaces)) {
      let wins = true;
      for (const g of allFaces) {
        if (same(g) || !g || !g.a || !g.b) continue;
        const other = bestOnFace(g, ring);
        if (other && other.len > here.len + 1e-9) { wins = false; break; }
      }
      if (!wins) continue;
    }
    wanted.push(Math.min(n - 1, Math.max(0, Math.floor(here.mid / m + 1e-9))));
  }
  wanted.sort((p, q) => p - q);
  const taken = new Set();
  for (const w of wanted) {
    if (taken.size >= n) break;
    for (let r = 0; r < n; r++) {
      const lo = w - r, hi = w + r;
      if (lo >= 0 && !taken.has(lo)) { taken.add(lo); break; }
      if (hi < n && !taken.has(hi)) { taken.add(hi); break; }
    }
  }
  return [...taken].sort((p, q) => p - q);
}

return { balconyModules, faceStrip, balconyGeometry, unitBalconies };
})();

/* ---- src/facade/panels.js ---- */
const PanelsMod = (() => {
/* ==========================================================================
   panels.js — rules, panels, and the facade build (Facade Studio)

   Contract: docs/facade-studio-technical-plan.md sections 3.4 to 3.9 and 4.
   Pure: no DOM, no Clipper, no mutation of inputs. Units: feet, square feet.
   buildFacade is the only function that reads the project.

   Caution: these are design defaults. They are not product sizes or code values.

   Rule choices where the plan leaves room:
   - ruleFor: the zone rule, then the orientation override, over the system
     defaults (state.systems over built-in copies of plan section 2). When an
     override changes `system`, the zone rule's system-specific keys (module,
     windowW, sill, head, vision, slabCover, solid) are dropped; `glazing` and
     `material` stay. An unknown system is punched.
   - facePanels order: system, solid pattern, glass corner (overrides the
     pattern, not on solid or storefront), balcony door (not on a solid
     panel). A balcony module that is solid is skipped, so the balcony count
     is the number of "door" panels. Window wall and curtain wall panels
     carry `spandrel: [{ u0, u1, v0, v1 }]` (the opaque bands inside a glazed
     panel); every panel has the key (empty when none).
   - Glass rectangles keep full precision. Face glazing and wall round to
     0.001 sf; metrics round the totals to 0.1 sf.
   - Per-level face geometry comes from group.edges (faces.js) when present,
     else from levelEdges matched to the group (same ring, end points within
     1 ft, direction within 1 degree), else from the group itself.
   - Fins: lines 1 to n-1 where i mod every = 0 (the end lines are left out
     so a corner does not get two). Draft quality skips fins.
   - Shades: one per panel of kind window, glass, or corner; none over a door.
     pf = depth / (glass height + above).
   - Bands: face.band = the material of the first band that matches the zone
     (or, with `every`, the level index mod every = 0).
   - Per-unit balconies read plates.derived only when the massing source is
     the project. A level without units falls back to stacked and raises one
     per-unit-fallback warning.
   - Warnings: { code, severity, floors, message }. massingLevels notes with
     id tower-no-levels, no-levels, or no-project-massing become warnings of
     the same code.
   ========================================================================== */

const FACES = FacesMod;
const { balconyModules, unitBalconies, balconyGeometry, faceStrip } = BalconiesMod;

const isNum = (v) => typeof v === "number" && Number.isFinite(v);
const r3 = (v) => Math.round(v * 1000) / 1000 + 0;
const ZONE_KEYS = ["module", "windowW", "sill", "head", "vision", "slabCover", "solid"];

const DEFAULT_SYSTEMS = {
  punched: { module: 14, windowW: 6, sill: 2.5, head: 8, mullionW: 0.1667, mullionD: 0.333 },
  windowWall: { module: 5, slabCover: 1.3333, mullionW: 0.2083, mullionD: 0.5 },
  curtainWall: { module: 5, vision: 8, sill: 0, mullionW: 0.2083, mullionD: 0.6667 },
  storefront: { module: 5, sill: 1.5, head: 10, mullionW: 0.1667, mullionD: 0.375 },
  solid: { module: 10 },
};
const SYSTEMS = Object.keys(DEFAULT_SYSTEMS);

/* ---------------------------------------------------------------- rules */

/** Plan 3.4. → the merged rule { system, module, ...system keys, solid?, glazing?, material? }. */
function ruleFor(state, zoneId, orientation) {
  const st = state || {};
  const zones = st.zones || {};
  const base = (zones.rules && zones.rules[zoneId]) || {};
  const ov = (zones.overrides && zones.overrides[zoneId] && zones.overrides[zoneId][orientation]) || {};
  let rule = { ...base };
  if (ov.system && ov.system !== (base.system || "punched")) {
    rule = {};
    if (base.glazing !== undefined) rule.glazing = base.glazing;
    if (base.material !== undefined) rule.material = base.material;
  }
  rule = { ...rule, ...ov };
  const system = SYSTEMS.includes(rule.system) ? rule.system : "punched";
  const out = { ...DEFAULT_SYSTEMS[system], ...(st.systems && st.systems[system]), ...rule, system };
  if (out.solid && typeof out.solid === "object") out.solid = { count: out.solid.count, every: out.solid.every };
  else delete out.solid;
  return out;
}

/** Plan 3.6. n = max(1, floor(L / module)); the actual module is L / n. */
function panelize(length, module) {
  const L = isNum(length) && length > 0 ? length : 0;
  const n = isNum(module) && module > 0 ? Math.max(1, Math.floor(L / module + 1e-9)) : 1;
  return { n, module: L / n };
}

/** Plan 3.6 and 3.7. face: { length, convexStart?, convexEnd? }. level: { ftf }.
    opts: { corners: "solid"|"glass", slabCover, balconies: [module index], door: { width, head } }.
    → Panel[] { i, u0, u1, kind, glass: [{ u0, u1, v0, v1 }], spandrel: [...] } (u along the face, v above the floor). */
function facePanels(face, rule, level, opts = {}) {
  const r = rule || {};
  const sys = SYSTEMS.includes(r.system) ? r.system : "punched";
  const L = face.length;
  const h = isNum(level && level.ftf) ? level.ftf : face.ftf;
  const cl = (v) => Math.min(Math.max(v, 0), h);
  const { n, module: m } = panelize(L, r.module);
  const sp = r.solid;
  const every = sp ? Math.floor(sp.every) : 0, count = sp ? Math.floor(sp.count) : 0;
  const patterned = every >= 1 && count >= 1;
  const solidPat = (i) => patterned && i % every >= every - Math.min(count, every);
  const cover = isNum(opts.slabCover) ? opts.slabCover : sys === "windowWall" && isNum(r.slabCover) ? r.slabCover : DEFAULT_SYSTEMS.windowWall.slabCover;
  const cornerGlass = opts.corners === "glass" && sys !== "solid" && sys !== "storefront";
  const doors = new Set(Array.isArray(opts.balconies) ? opts.balconies : []);
  const door = opts.door || {};
  const out = [];
  for (let i = 0; i < n; i++) {
    const u0 = i * m, u1 = i === n - 1 ? L : (i + 1) * m;
    const p = { i, u0, u1, kind: "solid", glass: [], spandrel: [] };
    const full = (v0, v1) => ({ u0, u1, v0, v1 });
    let solid = sys === "solid" || solidPat(i);
    const isCorner = cornerGlass && ((i === 0 && face.convexStart) || (i === n - 1 && face.convexEnd));
    if (isCorner) {
      solid = false;
      p.kind = "corner";
      const v1 = cl(h - cover);
      p.glass.push(full(0, v1));
      if (v1 < h) p.spandrel.push(full(v1, h));
    } else if (!solid) {
      if (sys === "punched") {
        const w = Math.min(isNum(r.windowW) ? r.windowW : 6, u1 - u0);
        const v0 = cl(r.sill), v1 = cl(Math.min(r.head, h));
        p.kind = "window";
        const c = (u0 + u1) / 2;
        if (v1 > v0 && w > 0) p.glass.push({ u0: c - w / 2, u1: c + w / 2, v0, v1 });
      } else if (sys === "windowWall") {
        const v1 = cl(h - cover);
        p.kind = "glass";
        p.glass.push(full(0, v1));
        if (v1 < h) p.spandrel.push(full(v1, h));
      } else if (sys === "curtainWall") {
        const v0 = cl(r.sill), v1 = cl(Math.min((isNum(r.sill) ? r.sill : 0) + r.vision, h));
        p.kind = "glass";
        if (v1 > v0) p.glass.push(full(v0, v1));
        if (v0 > 0) p.spandrel.push(full(0, v0));
        if (v1 < h) p.spandrel.push(full(v1, h));
      } else if (sys === "storefront") {
        const v0 = cl(r.sill), v1 = cl(Math.min(r.head, h));
        p.kind = "glass";
        if (v1 > v0) p.glass.push(full(v0, v1));
      }
    }
    if (!solid && doors.has(i)) {
      const w = Math.min(isNum(door.width) ? door.width : 6, u1 - u0);
      const c = (u0 + u1) / 2;
      p.kind = "door";
      p.glass = [{ u0: c - w / 2, u1: c + w / 2, v0: 0, v1: cl(isNum(door.head) ? door.head : 8) }];
      p.spandrel = [];
    }
    out.push(p);
  }
  return out;
}

/* --------------------------------------------------------------- readers */

const orDefault = (v, d) => (Array.isArray(v) ? v : d);

function balconiesOf(state) {
  const b = state.balconies || {};
  return {
    on: b.on === true, type: b.type === "inset" ? "inset" : "projected", pattern: b.pattern || "stacked",
    spacing: isNum(b.spacing) ? b.spacing : 2, width: isNum(b.width) ? b.width : 12, depth: isNum(b.depth) ? b.depth : 6,
    slab: isNum(b.slab) ? b.slab : 1, door: { width: 6, head: 8, ...(b.door || {}) },
    zones: orDefault(b.zones, ["middle"]), orientations: orDefault(b.orientations, ["N", "E", "S", "W"]),
  };
}

function finsOf(state) {
  const f = state.fins || {};
  return { on: f.on === true, depth: isNum(f.depth) ? f.depth : 1.5, width: isNum(f.width) ? f.width : 0.1667,
    every: isNum(f.every) && f.every >= 1 ? Math.round(f.every) : 1, orientations: orDefault(f.orientations, ["E", "W"]), zones: orDefault(f.zones, ["middle", "top"]) };
}

function shadesOf(state) {
  const s = state.shades || {};
  return { on: s.on === true, depth: isNum(s.depth) ? s.depth : 2, above: isNum(s.above) ? s.above : 0.5,
    orientations: orDefault(s.orientations, ["S"]), zones: orDefault(s.zones, ["middle", "top"]) };
}

const plateSig = (mp) => JSON.stringify((mp || []).map((p) => [(p.outer || []).map((q) => [Math.round(q[0] * 100), Math.round(q[1] * 100)]),
  (p.holes || []).map((h) => h.map((q) => [Math.round(q[0] * 100), Math.round(q[1] * 100)]))]));

/** Plan 3.8: the plates.derived level with the same index, else the nearest lower filled level with an identical plate. */
function unitsFor(project, level, levelByIndex) {
  const list = project && project.sections && project.sections.plates && project.sections.plates.derived && project.sections.plates.derived.levels;
  if (!Array.isArray(list)) return null;
  const filled = (p) => p && Array.isArray(p.units) && p.units.length > 0;
  const exact = list.find((p) => p && p.index === level.index && filled(p));
  if (exact) return exact;
  const sig = plateSig(level.plates);
  const lower = list.filter((p) => filled(p) && p.index < level.index).sort((p, q) => q.index - p.index);
  for (const p of lower) {
    const own = p.plate || (levelByIndex.get(p.index) || {}).plates;
    if (own && plateSig(own) === sig) return p;
  }
  return null;
}

function angleDiff(a, b) {
  return Math.abs((((Math.atan2(a[1], a[0]) - Math.atan2(b[1], b[0])) * 180 / Math.PI) % 360 + 540) % 360 - 180);
}

/** The group's edge on one level: group.edges, else a levelEdges match, else the group itself. */
function edgeOn(F, group, level, rotation, cache) {
  if (Array.isArray(group.edges)) {
    const e = group.edges.find((x) => x.levelIndex === level.index);
    if (e) return e;
  }
  if (!cache.has(level.index)) cache.set(level.index, F.levelEdges ? F.levelEdges(level, rotation) : []);
  const dir = [group.b[0] - group.a[0], group.b[1] - group.a[1]];
  let best = null, bestD = Infinity;
  for (const e of cache.get(level.index)) {
    if (e.ring !== group.ring) continue;
    const da = Math.hypot(e.a[0] - group.a[0], e.a[1] - group.a[1]), db = Math.hypot(e.b[0] - group.b[0], e.b[1] - group.b[1]);
    if (da > 1 || db > 1 || angleDiff([e.b[0] - e.a[0], e.b[1] - e.a[1]], dir) > 1) continue;
    if (da + db < bestD) { best = e; bestD = da + db; }
  }
  return best || group;
}

function groupLevelIndices(group, levelByIndex) {
  if (Array.isArray(group.levels)) return group.levels;
  const out = [];
  for (const [idx] of levelByIndex) if (idx >= group.levelFrom && idx <= group.levelTo) out.push(idx);
  return out.sort((p, q) => levelByIndex.get(p).z - levelByIndex.get(q).z);
}

const warn = (code, message, floors = [], severity = "warn") => ({ code, severity, floors, message });

/* ------------------------------------------------------------------ build */

/** Plan 3.1 to 3.10. opts: { project, quality: "full" | "draft", faces } (`faces` replaces the faces.js
    module, for tests). → { source, rotation, levels, groups, faces, balconies, fins, shades, street, warnings, notes }.
    Face = { id, groupId, levelIndex, z, ftf, a, b, length, orientation, bearing, zone, street, rule, n, module,
             panels, glazing, wall, convexStart, convexEnd, balconyModules, band } */
function buildFacade(state, { project = null, quality = "full", faces: override = null } = {}) {
  if (!state || typeof state !== "object") throw new Error("buildFacade: state is missing or not valid");
  const F = override || FACES;
  const massing = F.massingLevels(state, project);
  const levels = (massing.levels || []).slice().sort((p, q) => p.z - q.z || p.index - q.index);
  const rotation = isNum(massing.rotation) ? massing.rotation : 0;
  const warnings = [];
  const ids = Array.isArray(massing.noteIds) ? massing.noteIds : [];
  (massing.notes || []).forEach((text, k) => {
    const code = ids[k] || (levels.length ? "massing-note" : "no-levels");
    warnings.push(warn(code, text, [], code === "massing-note" || code === "no-project-massing" ? "info" : "warn"));
  });
  const result = { source: massing.source, rotation, levels, groups: [], faces: [], balconies: [], fins: [], shades: [], street: { ids: [], source: "auto" }, warnings, notes: massing.notes || [] };
  if (!levels.length) {
    if (!warnings.some((w) => w.code === "no-levels" || w.code === "tower-no-levels")) warnings.push(warn("no-levels", "There are no massing levels to build a facade on."));
    return result;
  }

  const levelByIndex = new Map(levels.map((l) => [l.index, l]));
  const groups = F.faceGroups(state, levels, rotation);
  const street = F.streetFaces(state, groups, levels, project);
  const streetIds = new Set(street.ids || []);
  const bal = balconiesOf(state), fin = finsOf(state), shd = shadesOf(state);
  const corners = state.corners === "glass" ? "glass" : "solid";
  const slabCover = isNum(state.systems && state.systems.windowWall && state.systems.windowWall.slabCover)
    ? state.systems.windowWall.slabCover : DEFAULT_SYSTEMS.windowWall.slabCover;
  const bands = Array.isArray(state.bands) ? state.bands : [];
  const usePlates = massing.source === "project";
  const cache = new Map();

  // pass 1: one entry per group and level
  const entries = [];
  for (const g of groups) {
    for (const idx of groupLevelIndices(g, levelByIndex)) {
      const lv = levelByIndex.get(idx);
      if (!lv) continue;
      const e = edgeOn(F, g, lv, rotation, cache);
      const a = e.a, b = e.b;
      const length = isNum(e.length) ? e.length : Math.hypot(b[0] - a[0], b[1] - a[1]);
      const rule = ruleFor(state, g.zone, g.orientation);
      const { n, module } = panelize(length, rule.module);
      const eligible = bal.on && rule.system !== "solid" && bal.zones.includes(g.zone) && bal.orientations.includes(g.orientation);
      entries.push({ g, lv, a, b, length, rule, n, module, eligible, convexStart: e.convexStart === undefined ? g.convexStart : e.convexStart,
        convexEnd: e.convexEnd === undefined ? g.convexEnd : e.convexEnd, bearing: isNum(e.bearing) ? e.bearing : g.bearing });
    }
  }

  // pass 2: balcony modules
  let fallbackLevels = [];
  const byLevel = new Map();
  for (const en of entries) { if (!byLevel.has(en.lv.index)) byLevel.set(en.lv.index, []); byLevel.get(en.lv.index).push(en); }
  for (const en of entries) {
    en.balconyModules = [];
    if (!en.eligible) continue;

      const units = usePlates ? unitsFor(project, en.lv, levelByIndex) : null;
      if (units) {
        const peers = byLevel.get(en.lv.index).filter((x) => x.eligible).map((x) => ({ id: `${x.g.id}`, a: x.a, b: x.b, length: x.length, n: x.n, module: x.module }));

    warnings.push(warn("per-unit-fallback", `Per-unit balconies need Plate Planner units. Stacked balconies were used on ${fallbackLevels.length} level${fallbackLevels.length === 1 ? "" : "s"}.`, fallbackLevels.slice().sort((p, q) => p - q)));
  }

  for (const en of entries) {
    const { g, lv, rule } = en;

      id: `${g.id}@${lv.index}`, groupId: g.id, levelIndex: lv.index, z: lv.z, ftf: lv.ftf,

      convexStart: en.convexStart, convexEnd: en.convexEnd, balconyModules: [], band: null,
    };
    face.panels = facePanels({ ...face, length: en.length }, rule, lv, { corners, slabCover, balconies: en.balconyModules, door: bal.door });
    let glass = 0;
    for (const p of face.panels) for (const r of p.glass) glass += (r.u1 - r.u0) * (r.v1 - r.v0);
    face.glazing = r3(glass);
    face.balconyModules = face.panels.filter((p) => p.kind === "door").map((p) => p.i);
    for (const bd of bands) {
      if (!bd) continue;
      if (bd.zone !== undefined ? bd.zone === g.zone : isNum(bd.every) && bd.every >= 1 && lv.index % Math.round(bd.every) === 0) { face.band = bd.material || null; break; }
    }
    result.faces.push(face);

    const geom = { ...face, length: en.length };
    for (const i of face.balconyModules) {
      const geo = balconyGeometry(geom, i, bal);
      result.balconies.push({
        id: `${face.id}#${i}`, faceId: face.id, groupId: g.id, levelIndex: lv.index, orientation: g.orientation, zone: g.zone, i,
        type: geo.type, width: geo.width, depth: geo.depth, slab: geo.slab, area: r3(geo.width * geo.depth),
        plan: geo.plan, z0: geo.z0, z1: geo.z1, door: geo.door,
      });
    }
    if (fin.on && quality !== "draft" && fin.orientations.includes(g.orientation) && fin.zones.includes(g.zone)) {
      for (let i = 1; i < en.n; i++) {
        if (i % fin.every !== 0) continue;
        const u = i * en.module;
        result.fins.push({
          id: `${face.id}|fin${i}`, faceId: face.id, groupId: g.id, levelIndex: lv.index, orientation: g.orientation, zone: g.zone, i, u: r3(u),
          depth: fin.depth, width: fin.width, plan: faceStrip(geom, u - fin.width / 2, u + fin.width / 2, fin.depth), z0: lv.z, z1: r3(lv.z + lv.ftf),
        });
      }
    }
    if (shd.on && shd.orientations.includes(g.orientation) && shd.zones.includes(g.zone)) {
      for (const p of face.panels) {
        if (!(p.kind === "window" || p.kind === "glass" || p.kind === "corner") || !p.glass.length) continue;
        const r = p.glass[0], gh = r.v1 - r.v0;
        result.shades.push({
          id: `${face.id}|shade${p.i}`, faceId: face.id, groupId: g.id, levelIndex: lv.index, orientation: g.orientation, zone: g.zone, system: rule.system, i: p.i,
          u0: r.u0, u1: r.u1, z: r3(lv.z + r.v1 + shd.above), depth: shd.depth, above: shd.above, glassHeight: r3(gh),
          pf: Math.round((shd.depth / (gh + shd.above)) * 10000) / 10000, plan: faceStrip(geom, r.u0, r.u1, shd.depth),
        });
      }
    }
  }
  result.groups = groups;
  result.street = { ids: street.ids || [], source: street.source || "auto" };
  return result;
}

return { ruleFor, panelize, facePanels, buildFacade };
})();

/* ---- src/facade/metrics.js ---- */
const FacMetricsMod = (() => {
/* ==========================================================================
   metrics.js — areas, WWR, transparency, exposure, envelope note, checks (Facade Studio)

   Contract: docs/facade-studio-technical-plan.md sections 3.10 to 3.12 and 4.
   Pure: no DOM, no Clipper, no mutation of inputs.

   Caution: these are design checks against editable values, not a code
   review. The tool never writes "compliant". The 40 percent WWR limit is a
   design value; verify the edition and the path for each project.

   Rule choices where the plan leaves room:
   - Glazing counts the whole window opening (decision 6). Areas round to
     0.1 sf, ratios to 0.0001.
   - wwrByOrientation holds a number, or null for an orientation with no wall.
     wwrByZone and wwrBySystem are { key: wwr }. `areas` holds
     { byOrientation, byZone, bySystem } as { wall, glazing } for the tables.
   - worst = { orientation, wwr } for the highest orientation WWR; a tie goes
     to the first of N, E, S, W. null when there is no wall.
   - transparency = glass inside the band on street faces / sum of
     (group length x band height) over the street groups. null without street
     faces. The band runs from zGround + from to zGround + to; zGround is the
     lowest level z. Glass from every level that reaches the band counts.
   - exposure: samples with altitude >= 0 count (plan 3.12 says > 0, but its
     test 18 needs the altitude 0 sample: with it S 1.00 and E 0.261, without
     it S and E tie at 1.00). Weight = cos(alt) x max(0, cos(az - bearing)),
     summed over samples, length-weighted per orientation, divided by the
     largest. Rounded to 0.001. A negative altitude is skipped.
   - projectionFactors: one row per orientation, zone, system, and pf, from
     built.shades.
   - checks(state, metrics) returns the whole list. The build-time warnings
     (no-levels, tower-no-levels, per-unit-fallback) reach it through
     metrics.buildWarnings, a copy of built.warnings, so the page shows one
     list.
   ========================================================================== */

const isNum = (v) => typeof v === "number" && Number.isFinite(v);
const r1 = (v) => Math.round(v * 10) / 10 + 0;
const r3 = (v) => Math.round(v * 1000) / 1000 + 0;
const r4 = (v) => Math.round(v * 10000) / 10000 + 0;
const ORIENTATIONS = ["N", "E", "S", "W"];
const DEG = Math.PI / 180;

function need(cond, fn, what) {
  if (!cond) throw new Error(`${fn}: ${what} is missing or not valid`);
}

const pct = (v) => `${(Math.round(v * 1000) / 10).toFixed(1)}%`;

/* ------------------------------------------------------------- exposure */

/** Plan 3.12. groups: face groups { length, bearing, orientation }. sunDerived: { samples: [{ azimuth, altitude }] }.
    → { N, E, S, W } scaled so the most exposed is 1, or null without samples. */
function exposure(groups, sunDerived) {
  const samples = sunDerived && Array.isArray(sunDerived.samples) ? sunDerived.samples.filter((s) => s && isNum(s.azimuth) && isNum(s.altitude) && s.altitude >= 0) : [];
  if (!samples.length || !Array.isArray(groups)) return null;
  const sum = {}, len = {};
  for (const o of ORIENTATIONS) { sum[o] = 0; len[o] = 0; }
  for (const g of groups) {
    if (!g || !ORIENTATIONS.includes(g.orientation) || !isNum(g.length) || !isNum(g.bearing)) continue;
    let e = 0;
    for (const s of samples) {
      const c = Math.cos((s.azimuth - g.bearing) * DEG);
      if (c > 0) e += Math.cos(s.altitude * DEG) * c;
    }
    sum[g.orientation] += e * g.length;
    len[g.orientation] += g.length;
  }
  const mean = {};
  let top = 0;
  for (const o of ORIENTATIONS) { mean[o] = len[o] > 0 ? sum[o] / len[o] : 0; top = Math.max(top, mean[o]); }
  const out = {};
  for (const o of ORIENTATIONS) out[o] = top > 0 ? r3(mean[o] / top) : 0;
  return out;
}

/* -------------------------------------------------------------- envelope */

const zoneLabel = (state, id) => {
  const r = state && state.zones && Array.isArray(state.zones.ranges) ? state.zones.ranges.find((x) => x && String(x.id) === String(id)) : null;
  if (r && r.name) return r.name;
  const s = String(id);
  return s.charAt(0).toUpperCase() + s.slice(1);
};

/** Plan 3.12. A plain-text comparison of the glazing and wall values against the limits. [] when envelope.on is off. */
function envelopeNote(state, built) {
  const env = state && state.envelope;
  if (!env || env.on !== true || !built || !Array.isArray(built.faces)) return [];
  const lim = env.limits || {};
  const lines = ["Caution: typical seed values, not product data or code values. Verify every value."];
  const zones = [];
  for (const f of built.faces) if (!zones.includes(f.zone)) zones.push(f.zone);
  const cmp = (v, limit) => (isNum(limit) ? `${v <= limit + 1e-9 ? "at or below" : "above"} the ${limit} limit value` : "with no limit set");
  for (const z of zones) {
    const fs = built.faces.filter((f) => f.zone === z);
    const glazed = fs.filter((f) => f.glazing > 0);
    const glKeys = [], wallKeys = [];
    for (const f of glazed) {
      const k = f.rule && f.rule.glazing ? f.rule.glazing : env.glazingDefault;
      if (!glKeys.includes(k)) glKeys.push(k);
    }
    for (const f of fs) {
      const k = f.rule && f.rule.material && env.walls && env.walls[f.rule.material] ? f.rule.material : env.wallDefault;
      if (!wallKeys.includes(k)) wallKeys.push(k);
    }
    const gl = glKeys.map((k) => {
      const g = env.glazing && env.glazing[k];
      return g ? `${g.label || k}, U ${g.u} (${cmp(g.u, lim.uFixed)}), SHGC ${g.shgc} (${cmp(g.shgc, lim.shgc)})` : `${k} is not in the glazing table`;
    });
    const wl = wallKeys.map((k) => {
      const w = env.walls && env.walls[k];
      return w ? `${w.label || k}, U ${w.u}` : `${k} is not in the wall table`;
    });
    lines.push(`${zoneLabel(state, z)}: glazing ${gl.length ? gl.join("; ") : "none"}. Wall ${wl.length ? wl.join("; ") : "none"}.`);
  }
  return lines;
}

/* --------------------------------------------------------------- metrics */

function ratio(glazing, wall) {
  return wall > 0 ? r4(glazing / wall) : null;
}

/** Plan 3.10 to 3.12. project: the loaded project document or null (reads sections.sun.derived).
    → { wall, glazing, wwr, wwrByOrientation, wwrByZone, wwrBySystem, areas, worst, transparency, balconyCount,
        balconyArea, projectionFactors, exposure, envelope, wwrLimit, levels, buildWarnings } */
function computeMetrics(state, built, project) {
  need(state, "computeMetrics", "state");
  need(built && Array.isArray(built.faces) && Array.isArray(built.levels), "computeMetrics", "built.faces and built.levels");
  const bucket = () => ({ wall: 0, glazing: 0 });
  const byO = Object.fromEntries(ORIENTATIONS.map((o) => [o, bucket()]));
  const byZ = {}, byS = {};
  let wall = 0, glazing = 0;
  for (const f of built.faces) {
    wall += f.wall; glazing += f.glazing;
    const o = byO[f.orientation] || (byO[f.orientation] = bucket());
    o.wall += f.wall; o.glazing += f.glazing;
    const z = byZ[f.zone] || (byZ[f.zone] = bucket());
    z.wall += f.wall; z.glazing += f.glazing;
    const sys = f.rule && f.rule.system ? f.rule.system : "punched";
    const s = byS[sys] || (byS[sys] = bucket());
    s.wall += f.wall; s.glazing += f.glazing;
  }
  const fin = (b) => ({ wall: r1(b.wall), glazing: r1(b.glazing) });
  const finAll = (m) => Object.fromEntries(Object.entries(m).map(([k, b]) => [k, fin(b)]));
  const wwrOf = (m) => Object.fromEntries(Object.entries(m).map(([k, b]) => [k, ratio(b.glazing, b.wall)]));
  const wwrByOrientation = wwrOf(byO);
  let worst = null;
  for (const o of ORIENTATIONS) {
    const v = wwrByOrientation[o];
    if (v !== null && (!worst || v > worst.wwr)) worst = { orientation: o, wwr: v };
  }

  // ground transparency
  const chk = state.checks || {};
  const band = chk.band && isNum(chk.band.from) && isNum(chk.band.to) ? chk.band : { from: 2, to: 10 };
  const ids = new Set(built.street && Array.isArray(built.street.ids) ? built.street.ids : []);
  const zGround = built.levels.reduce((m, l) => Math.min(m, l.z), Infinity);
  let glassInBand = 0, bandArea = 0;
  for (const g of built.groups || []) if (ids.has(g.id)) bandArea += g.length * (band.to - band.from);
  if (Number.isFinite(zGround)) {
    const lo = zGround + band.from, hi = zGround + band.to;
    for (const f of built.faces) {
      if (!ids.has(f.groupId)) continue;
      for (const p of f.panels) for (const r of p.glass) {
        const o = Math.min(f.z + r.v1, hi) - Math.max(f.z + r.v0, lo);
        if (o > 0) glassInBand += o * (r.u1 - r.u0);
      }
    }
  }
  const transparency = bandArea > 0 ? r4(glassInBand / bandArea) : null;

  // balconies and shades
  const balconies = Array.isArray(built.balconies) ? built.balconies : [];
  const pfRows = new Map();
  for (const s of Array.isArray(built.shades) ? built.shades : []) {
    const pf = r3(s.pf);
    const key = `${s.orientation}|${s.zone}|${s.system}|${pf}`;
    const row = pfRows.get(key) || { orientation: s.orientation, zone: s.zone, system: s.system, depth: s.depth, above: s.above, glassHeight: s.glassHeight, pf, count: 0 };
    row.count++;
    pfRows.set(key, row);
  }

  const sun = project && project.sections && project.sections.sun && project.sections.sun.derived;
  return {
    wall: r1(wall),
    glazing: r1(glazing),
    wwr: ratio(glazing, wall) === null ? 0 : ratio(glazing, wall),
    wwrByOrientation,
    wwrByZone: wwrOf(byZ),
    wwrBySystem: wwrOf(byS),
    areas: { byOrientation: finAll(byO), byZone: finAll(byZ), bySystem: finAll(byS) },
    worst,
    transparency,
    balconyCount: balconies.length,
    balconyArea: r1(balconies.reduce((s, b) => s + b.area, 0)),
    projectionFactors: [...pfRows.values()],
    exposure: exposure(built.groups || [], sun),
    envelope: envelopeNote(state, built),
    wwrLimit: isNum(chk.wwrLimit) ? chk.wwrLimit : 0.4,
    levels: built.levels.length,
    buildWarnings: (Array.isArray(built.warnings) ? built.warnings : []).map((w) => ({ ...w, floors: Array.isArray(w.floors) ? w.floors.slice() : [] })),
  };
}

/* ---------------------------------------------------------------- checks */

function warn(code, message, floors = [], severity = "warn", extra = {}) {
  return { code, severity, floors, message, ...extra };
}

/** Plan 3.11. → Warning[] { code, severity, floors, message }: wwr-limit, wwr-orientation, transparency,
    then the build warnings (no-levels, tower-no-levels, per-unit-fallback and any other note). */
function checks(state, metrics) {
  need(state && metrics && isNum(metrics.wwr), "checks", "state and metrics");
  const chk = state.checks || {};
  const limit = isNum(chk.wwrLimit) ? chk.wwrLimit : metrics.wwrLimit;
  const out = [];
  if (isNum(limit) && metrics.wwr > limit + 1e-9) {
    out.push(warn("wwr-limit", `Window-to-wall ratio is ${pct(metrics.wwr)}, above the ${pct(limit)} check value. Design value, not a code review: verify the edition and the path.`));
  }
  if (isNum(limit)) {
    for (const o of ORIENTATIONS) {
      const v = metrics.wwrByOrientation ? metrics.wwrByOrientation[o] : null;
      if (isNum(v) && v > limit + 1e-9) out.push(warn("wwr-orientation", `${o} faces are at ${pct(v)}, above the ${pct(limit)} check value.`, [], "info", { orientation: o }));
    }
  }

  if (isNum(target) && isNum(metrics.transparency) && metrics.transparency < target - 1e-9) {
    out.push(warn("transparency", `Ground transparency is ${pct(metrics.transparency)}, below the ${pct(target)} target. Design value: check the zoning code for the band and the target.`));
  }
  for (const w of Array.isArray(metrics.buildWarnings) ? metrics.buildWarnings : []) out.push({ ...w, floors: Array.isArray(w.floors) ? w.floors.slice() : [] });
  return out;
}

return { exposure, envelopeNote, computeMetrics, checks };
})();

/* ---- src/facade/derived.js ---- */
const FacDerivedMod = (() => {
/* ==========================================================================
   facade/derived.js — Facade Studio → facade.derived (docs/project-file-spec.md 6.5 + plan sections 3.13 and 7)

   facadeDerived(state, built, metrics) → { faces, metrics }
     state    the facade state (plan section 2)
     built    buildFacade(state, ...) result (plan section 4): { groups[], faces[], street, ... }
     metrics  computeMetrics(...) result (plan section 4). Every row is optional; a missing row falls back to a figure
              computed from `built.faces`. A row may be a number or an object with .value / .total / .ratio.

   faces[]    one per face group: id, levelFrom, levelTo, orientation, system, area, glazing, wwr, balconies (count),
              edge [a, b] (local frame, on levelFrom), bearing, zone, street.
              area = Σ wall over the group's faces and levels. glazing counts the whole window opening. balconies = door panels.
              system is the rule's system in the spec's kebab-case: punched, window-wall, curtain-wall, storefront, solid.
   metrics    wwr, wwrByOrientation { N, E, S, W }, groundTransparency (null without street faces), facadeArea, glazingArea,
              balconyCount, balconyArea, wwrLimit, exposure ({ N, E, S, W } or null).

   Areas round to 0.1 sf, ratios to 0.001, coordinates to 0.001 ft. No NaN, no undefined. Pure: no DOM, no input mutation.
   ========================================================================== */

const ORIENTATIONS = ["N", "E", "S", "W"];
const KEBAB = { punched: "punched", windowWall: "window-wall", curtainWall: "curtain-wall", storefront: "storefront", solid: "solid" };

const isNum = (v) => typeof v === "number" && Number.isFinite(v);
const r1 = (v) => { const r = Math.round(v * 10) / 10; return r === 0 ? 0 : r; };
const r3 = (v) => { const r = Math.round(v * 1000) / 1000; return r === 0 ? 0 : r; };
const need = (v, name) => { if (v === undefined || v === null) throw new Error(`facadeDerived: missing input "${name}".`); return v; };

/** A number from a metrics row: the number itself, or .value / .ratio / .total of an object. Else null. */
function metricNumber(v) {
  if (isNum(v)) return v;
  if (v && typeof v === "object" && !Array.isArray(v)) for (const k of ["value", "ratio", "total"]) if (isNum(v[k])) return v[k];
  return null;
}

/** Wall or glazing of a built face: a number, or an object with .area / .total / .value. */
const areaOf = (v) => { const n = metricNumber(v); if (n !== null) return n; return v && isNum(v.area) ? v.area : 0; };

const panelsOf = (f) => (Array.isArray(f && f.panels) ? f.panels : []);
const doorCount = (f) => panelsOf(f).filter((p) => p && p.kind === "door").length;

/** The spec's system name for a rule or a system key. */
function systemName(key) {
  return KEBAB[key] || (typeof key === "string" && key ? key : "punched");
}

function groupSystem(state, group, faces) {
  const f = faces.find((x) => x.rule && x.rule.system);
  if (f) return f.rule.system;
  const zr = state && state.zones && state.zones.rules && state.zones.rules[group.zone];
  const ov = state && state.zones && state.zones.overrides && state.zones.overrides[group.zone] && state.zones.overrides[group.zone][group.orientation];
  return (ov && ov.system) || (zr && zr.system) || "punched";
}

function facadeDerived(state, built, metrics) {
  need(state, "state"); need(built, "built");
  const groups = need(built.groups, "built.groups");
  const faces = Array.isArray(built.faces) ? built.faces : [];
  const m = metrics || {};

  const byGroup = new Map();
  for (const f of faces) {
    if (!f) continue;
    if (!byGroup.has(f.groupId)) byGroup.set(f.groupId, []);
    byGroup.get(f.groupId).push(f);
  }
  const streetIds = new Set(built.street && Array.isArray(built.street.ids) ? built.street.ids : []);

  // fallback totals from the built faces
  const tot = { wall: 0, glazing: 0, balconies: 0, byO: {} };
  for (const o of ORIENTATIONS) tot.byO[o] = { wall: 0, glazing: 0 };

    if (tot.byO[f.orientation]) { tot.byO[f.orientation].wall += w; tot.byO[f.orientation].glazing += g; }
  }

  const outFaces = groups.map((g) => {
    const fs = byGroup.get(g.id) || [];
    const area = fs.reduce((s, f) => s + areaOf(f.wall), 0);
    const glazing = fs.reduce((s, f) => s + areaOf(f.glazing), 0);
    const a = Array.isArray(g.a) ? g.a : [0, 0], b = Array.isArray(g.b) ? g.b : [0, 0];
    return {
      id: String(g.id),
      levelFrom: g.levelFrom,
      levelTo: g.levelTo,
      orientation: g.orientation,
      system: systemName(groupSystem(state, g, fs)),
      area: r1(area),
      glazing: r1(glazing),
      wwr: area > 0 ? r3(glazing / area) : 0,
      balconies: fs.reduce((s, f) => s + doorCount(f), 0),
      edge: [[r3(a[0]), r3(a[1])], [r3(b[0]), r3(b[1])]],
      bearing: isNum(g.bearing) ? r3(g.bearing) : 0,
      zone: String(g.zone),
      street: streetIds.has(g.id) || fs.some((f) => f.street === true),

    for (const l of g.levels) {

      D.text("FAC-TEXT", sh.x0 - 16, l.z + 0.5, 1.5, `L${l.index} ${l.z >= 0 ? "+" : "-"}${fmt(Math.abs(l.z))}`);
    }
    if (top !== null && !zs.some((z) => Math.abs(z - top) < 0.01)) {
      D.line("FAC-LEVEL", [sh.x0, top], [sh.x1, top]);
      D.text("FAC-TEXT", sh.x0 - 16, top + 0.5, 1.5, `TOP +${fmt(top)}`);
    }

    for (const e of g.faces) D.closed2d(L(e.court, "FAC-WALL"), rectRing(X, e));
    for (const e of g.spandrel) D.closed2d(L(e.court, "FAC-SPANDREL"), rectRing(X, e));
    for (const e of g.glass) D.closed2d(L(e.court, "FAC-GLASS"), rectRing(X, e));
    for (const e of g.mullions) D.line(L(e.court, "FAC-MULLION"), [X(e.u), e.z0], [X(e.u), e.z1]);
    for (const e of g.balconies) {
      D.closed2d(L(e.court, "FAC-BALCONY"), rectRing(X, e));
      if (e.rail) D.closed2d(L(e.court, "FAC-BALCONY"), rectRing(X, { u0: e.u0, u1: e.u1, z0: e.z1, z1: e.z1 + RAIL_HEIGHT }));
    }
    for (const e of g.fins) D.closed2d(L(e.court, "FAC-FIN"), rectRing(X, e));
    for (const e of g.shades) D.closed2d(L(e.court, "FAC-SHADE"), rectRing(X, e));
  });

  const head = new Dxf();
  head.g(0, "SECTION"); head.g(2, "HEADER");
  head.g(9, "$ACADVER"); head.g(1, "AC1009");
  const lo = D.min.map((v) => (isFinite(v) ? v : 0)), hi = D.max.map((v) => (isFinite(v) ? v : 0));
  head.g(9, "$EXTMIN"); head.g(10, lo[0]); head.g(20, lo[1]); head.g(30, lo[2]);
  head.g(9, "$EXTMAX"); head.g(10, hi[0]); head.g(20, hi[1]); head.g(30, hi[2]);
  head.g(0, "ENDSEC");
  head.g(0, "SECTION"); head.g(2, "TABLES");
  head.g(0, "TABLE"); head.g(2, "LTYPE"); head.g(70, 1);
  head.g(0, "LTYPE"); head.g(2, "CONTINUOUS"); head.g(70, 0); head.g(3, "Solid line"); head.g(72, 65); head.g(73, 0); head.g(40, 0);
  head.g(0, "ENDTAB");
  head.g(0, "TABLE"); head.g(2, "LAYER"); head.g(70, FACADE_DXF_LAYERS.length + 1);
  head.g(0, "LAYER"); head.g(2, "0"); head.g(70, 0); head.g(62, 7); head.g(6, "CONTINUOUS");
  for (const [name, color] of FACADE_DXF_LAYERS) { head.g(0, "LAYER"); head.g(2, name); head.g(70, 0); head.g(62, color); head.g(6, "CONTINUOUS"); }
  head.g(0, "ENDTAB");
  head.g(0, "ENDSEC");
  head.g(0, "SECTION"); head.g(2, "ENTITIES");
  const tail = ["  0", "ENDSEC", "  0", "EOF"];
  return head.out.concat(D.out, tail).join("\n") + "\n";
}

return { SHEET_ORDER, SHEET_GAP, FACADE_DXF_LAYERS, RAIL_HEIGHT, SHADE_THICKNESS, facePoint, faceNormal, subtractRects, faceElements, elevationGeometry, elevationSheets, elevationsDxf };

/* ---- src/facade/sketchup.js ---- */
const SkFacade = (() => {
/* ==========================================================================
   facade/sketchup.js — Facade Studio → ".sketchup.json" (docs/sketchup-spec.md section 4, plan section 4)

   facadeToSketchup(state, built, metrics, meta) → a document made with makeDoc (passes validateDoc).
     state    the facade state
     built    buildFacade(state, ...) result: { faces[], ... } (plan section 4)
     metrics  computeMetrics result, read only for the notes (optional)
     meta     optional { createdAt, name, location, zShift }

   Pure: no DOM. Units: feet. Plan (x, y): x = east, y = north. z up. Local (massing) frame, like the Parking Deck export.

   Rule choices (where the spec leaves room):
   - Group order: Walls, Glass, Spandrel, Balconies, Fins, Shades. A group with nothing in it is left out.
   - Walls, Glass and Spandrel are `mesh` nodes, one per face and level (named with the face id, "F3@4"). validateDoc
     rejects a vertical `faces` polygon (its plan area is zero), so vertical skin is triangulated quads.
     Walls = the face rectangle minus the glass and spandrel rectangles, cut in horizontal bands.
     Glass sits in the wall plane. Wall + Glass + Spandrel tile the face exactly.
   - Tags by system: "Punched windows", "Window wall", "Curtain wall", "Storefront", "Solid wall" on Walls, Glass and Spandrel
     meshes; tags "Balconies", "Fins", "Shades" on the others.
   - Projected balcony: a solid slab outside the face, `balconies.depth` deep, `balconies.width` wide, `slab` thick, top at the floor.
   - Inset balcony: the face gets an opening (recess width x level height); a back wall, two side returns and the door glass sit
     `depth` inside the face plane; the floor slab is a solid inside the face plane.
   - Fins: one closed mesh box per fin and level. (The default fin footprint is 0.25 sf, the validateDoc minimum for a solid.)
   - Shades: one solid per glazed panel, SHADE_THICKNESS thick.
   - Mullions are not exported.
   ========================================================================== */

const { cleanRing2, makeDoc } = SkFmt;
const { facadeDerived, systemName } = FacDerivedMod;
const { faceElements, facePoint, faceNormal, subtractRects, SHADE_THICKNESS } = ElevMod;

const SKETCHUP_SOURCE = "facade";

const SYSTEM_TAGS = {
  punched: ["Punched windows", "#c9c2b6"], windowWall: ["Window wall", "#aab4bd"], curtainWall: ["Curtain wall", "#7f9db5"],
  storefront: ["Storefront", "#b68f6a"], solid: ["Solid wall", "#a8a8a2"],
};
const COLORS = { Wall: "#f1efe9", Glass: "#9fb4c4", Spandrel: "#8a8f94", Balconies: "#d6cdbd", Fins: "#6f7780", Shades: "#6f7780" };

const r3 = (v) => { const r = Math.round(v * 1000) / 1000; return r === 0 ? 0 : r; };
const num = (v, d) => (typeof v === "number" && Number.isFinite(v) ? v : d);
const MIN_W = 0.01;

/** Adds quads (as two triangles each) to a mesh being built. */
class MeshBuilder {
  constructor() { this.vertices = []; this.triangles = []; }
  quad(p0, p1, p2, p3) {
    const k = this.vertices.length;
    for (const p of [p0, p1, p2, p3]) this.vertices.push([r3(p[0]), r3(p[1]), r3(p[2])]);
    this.triangles.push([k, k + 1, k + 2], [k, k + 2, k + 3]);
  }
  get empty() { return this.triangles.length === 0; }
}

/** Closed box mesh over a plan ring (4 points, either direction) between z0 and z1. */
function boxMesh(ring, z0, z1) {
  const area = ring.reduce((s, p, i) => { const q = ring[(i + 1) % 4]; return s + p[0] * q[1] - q[0] * p[1]; }, 0);
  const r = area >= 0 ? ring : ring.slice().reverse();               // counter-clockwise
  const vertices = [...r.map((p) => [r3(p[0]), r3(p[1]), r3(z0)]), ...r.map((p) => [r3(p[0]), r3(p[1]), r3(z1)])];
  const triangles = [[0, 2, 1], [0, 3, 2], [4, 5, 6], [4, 6, 7]];
  for (let i = 0; i < 4; i++) { const j = (i + 1) % 4; triangles.push([i, j, 4 + j], [i, 4 + j, 4 + i]); }
  return { vertices, triangles };
}

function facadeToSketchup(state, built, metrics, meta) {
  if (!state) throw new Error('facadeToSketchup: missing input "state".');
  if (!built || !Array.isArray(built.faces)) throw new Error('facadeToSketchup: missing input "built.faces".');
  const mt = meta || {};
  const d = facadeDerived(state, built, metrics || {});

  const tagList = [], matList = [], declaredTags = new Set(), declaredMats = new Set();
  const tag = (name, color) => { if (!declaredTags.has(name)) { declaredTags.add(name); tagList.push({ name, color, visible: true }); } return name; };
  const mat = (name, color, alpha = 1) => { if (!declaredMats.has(name)) { declaredMats.add(name); matList.push({ name, color: color || COLORS[name], alpha }); } return name; };
  const sysTag = (sys) => { const [n, c] = SYSTEM_TAGS[sys] || SYSTEM_TAGS.punched; return tag(n, c); };

  const walls = [], glass = [], spandrels = [], balconies = [], fins = [], shades = [];
  const bal = state.balconies || {};

  for (const face of built.faces) {
    if (!face || !Array.isArray(face.a) || !Array.isArray(face.b)) continue;
    const h = num(face.ftf, 0), L = num(face.length, Math.hypot(face.b[0] - face.a[0], face.b[1] - face.a[1])), z = num(face.z, 0);
    if (!(h > 0) || !(L > 0)) continue;
    const sys = (face.rule && face.rule.system) || "punched";
    const n = faceNormal(face);
    const P = (u, v, off = 0) => { const p = facePoint(face, u); return [p[0] - n[0] * off, p[1] - n[1] * off, z + v]; };
    const el = faceElements(state, face);
    const attributes = { level: face.levelIndex, orientation: face.orientation, zone: String(face.zone), system: systemName(sys) };

    const insetIdx = new Set(el.balconies.filter((b) => b.type === "inset").map((b) => b.i));
    const insetOf = (i) => el.balconies.find((b) => b.type === "inset" && b.i === i);
    const wallM = new MeshBuilder(), glassM = new MeshBuilder(), spanM = new MeshBuilder();
    const quad = (m, r, off = 0) => { if (r.u1 - r.u0 > MIN_W && r.v1 - r.v0 > MIN_W) m.quad(P(r.u0, r.v0, off), P(r.u1, r.v0, off), P(r.u1, r.v1, off), P(r.u0, r.v1, off)); };

    const holes = [];
    for (const g of el.glass) {
      if (g.kind === "door" && insetIdx.has(g.i)) quad(glassM, g, insetOf(g.i).depth);        // door at the recessed plane
      else { quad(glassM, g); holes.push(g); }
    }
    for (const s of el.spandrel) if (!insetIdx.has(s.i)) { quad(spanM, s); holes.push(s); }
    for (const b of el.balconies) {
      if (b.type !== "inset") continue;
      holes.push(b);                                                                          // opening in the face
      const doors = el.glass.filter((g) => g.kind === "door" && g.i === b.i);
      for (const r of subtractRects(b, doors)) quad(wallM, r, b.depth);                       // back wall around the door
      for (const u of [b.u0, b.u1]) wallM.quad(P(u, 0, 0), P(u, 0, b.depth), P(u, h, b.depth), P(u, h, 0));   // side returns
    }
    for (const r of subtractRects({ u0: 0, u1: L, v0: 0, v1: h }, holes)) quad(wallM, r);

    const node = (m, nm, tg, mt2) => ({ type: "mesh", name: nm, tag: tg, material: mt2, vertices: m.vertices, triangles: m.triangles, soft: false, closed: false, attributes });
    if (!wallM.empty) walls.push(node(wallM, face.id, sysTag(sys), mat("Wall")));
    if (!glassM.empty) glass.push(node(glassM, face.id, sysTag(sys), mat("Glass", COLORS.Glass, 0.45)));
    if (!spanM.empty) spandrels.push(node(spanM, face.id, sysTag(sys), mat("Spandrel")));

    // balconies
    for (const b of el.balconies) {
      const dir = b.type === "inset" ? -1 : 1;                                                // outward or inward
      const ring = cleanRing2([P(b.u0, 0, 0), P(b.u1, 0, 0), P(b.u1, 0, -dir * b.depth), P(b.u0, 0, -dir * b.depth)].map((p) => [p[0], p[1]]));
      if (!ring) continue;
      balconies.push({
        type: "solid", name: `${face.id} · B${b.i + 1}`, tag: tag("Balconies", COLORS.Balconies), material: mat("Balconies"),
        outer: ring, holes: [], z0: r3(z - b.slab), z1: r3(z), attributes: { level: face.levelIndex, orientation: face.orientation, type: b.type },
      });
    }
    // fins: closed boxes
    for (const [k, f] of el.fins.entries()) {
      const ring = [P(f.u - f.width / 2, 0, 0), P(f.u + f.width / 2, 0, 0), P(f.u + f.width / 2, 0, -f.depth), P(f.u - f.width / 2, 0, -f.depth)].map((p) => [p[0], p[1]]);
      const box = boxMesh(ring, z, z + h);
      fins.push({ type: "mesh", name: `${face.id} · fin ${k + 1}`, tag: tag("Fins", COLORS.Fins), material: mat("Fins"), vertices: box.vertices, triangles: box.triangles, soft: false, closed: true, attributes: { level: face.levelIndex, orientation: face.orientation } });
    }
    // shades
    for (const s of el.shades) {
      const ring = cleanRing2([P(s.u0, 0, 0), P(s.u1, 0, 0), P(s.u1, 0, -s.depth), P(s.u0, 0, -s.depth)].map((p) => [p[0], p[1]]));
      if (!ring) continue;
      shades.push({
        type: "solid", name: `${face.id} · S${s.i + 1}`, tag: tag("Shades", COLORS.Shades), material: mat("Shades"),
        outer: ring, holes: [], z0: r3(z + s.v0), z1: r3(z + s.v0 + SHADE_THICKNESS), attributes: { level: face.levelIndex, orientation: face.orientation },
      });
    }
  }

  const children = [];
  const add = (nm, kids) => { if (kids.length) children.push({ type: "group", name: nm, children: kids }); };
  add("Walls", walls); add("Glass", glass); add("Spandrel", spandrels); add("Balconies", balconies); add("Fins", fins); add("Shades", shades);

  const m = d.metrics;
  const name = String(mt.name || state.name || "Facade");
  const notes = [
    "Plan origin = the tool's plan origin (0, 0) in the massing frame. x = east, y = north. Lengths in feet. z = floor surface above the base.",
    `Facade Studio: ${d.faces.length} face groups, ${built.faces.length} face levels. Wall ${Math.round(m.facadeArea).toLocaleString("en-US")} sf, glazing ${Math.round(m.glazingArea).toLocaleString("en-US")} sf, WWR ${(Math.round(m.wwr * 1000) / 10).toFixed(1)} percent, ${m.balconyCount} balconies.`,
    "Glazing area is the whole window opening, frames included. Inset balcony returns are not wall area. Parapets and roof screens add no wall area.",
    "Walls, Glass and Spandrel are triangulated quads in the wall plane. An inset balcony opens the face; its back wall and door glass sit inside the face plane.",
    "Caution: these are design values for a concept study, not product sizes or code values. Verify every value before use.",
  ];

  return makeDoc({
    source: SKETCHUP_SOURCE, name, location: mt.location || null, zShift: num(mt.zShift, 0), notes,
    tags: tagList, materials: matList, createdAt: mt.createdAt,
    root: { type: "group", name, children },
  });
}

return { SKETCHUP_SOURCE, facadeToSketchup };
})();
