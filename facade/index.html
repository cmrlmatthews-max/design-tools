  }

  return {
    has, hasMassing, massingInfo, placement, useProject, useStandalone, contextPolys, dataDoc, dataKey, massingPlacement,
    start, openDoc, close, create, rename, flush, openMenu, exportFile, importFile, nameControl, reloadData, send,
    markDirty, renderPill,
    doc: () => project.doc,
    status: () => ({ open: !!project.doc, id: project.doc && project.doc.id, name: project.doc && project.doc.name, dirty: project.dirty, readOnly: project.readOnly }),
    // tests: inject storage, navigation and the address bar
    configure: (o) => { Object.assign(project, o || {}); },
    restoreDefaults: () => { Object.assign(project, { storage: null, navigate: DEFAULT_NAV, updateUrl: DEFAULT_URL }); },
    reset: () => { clearTimeout(project.timer); Object.assign(project, { doc: null, timer: 0, dirty: false, readOnly: false, loading: false, noted: {}, renamed: null }); renderPill(); },
  };
})();

/* ==========================================================================
   SHARED: screenshot
   src/shared/screenshot.js (inlined with the other modules),
   plus `Shots`: the image actions and the overlay choices (shown in the Export menu's
   "Image overlay" view). The choices are kept in state.view.shot.
   ========================================================================== */
const Shots = (() => {
  const SHOT_ITEMS = [
    ['title', 'Option name'], ['date', 'Date'], ['metrics', 'Key metrics'], ['mark', 'CMRLM mark'],
  ];
  const prefersDark = () => !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);

  /** The key metrics on the picture: WWR, worst orientation, ground transparency, balconies, facade area and glazing area. */
  function keyMetrics(d) {
    const m = d.hud;
    return [
      ['WWR', pct1(m.wwr)],
      ['Worst orientation', m.worst ? `${m.worst.o} ${pct1(m.worst.wwr)}` : '-'],
      ['Ground transparency', m.transparency == null ? 'n/a' : pct1(m.transparency)],
      ['Balconies', Units.formatInt(m.balconies)],
      ['Facade area', Units.formatArea(m.wall)],
      ['Glazing area', Units.formatArea(m.glazing)],
    ];
  }

  function buildOverlay() {
    const state = Store.raw(), o = state.view.shot || {};
    const overlay = { theme: prefersDark() ? 'dark' : 'light' };
    const comparing = Render.comparing();
    if (o.title) overlay.title = comparing ? Compare.names().join('  |  ') : state.name;
    if (o.date) overlay.date = true;
    if (o.metrics && !comparing) overlay.metrics = keyMetrics(Derived.get());
    if (o.mark) overlay.mark = 'CMRLM';
    return overlay;
  }

  /** Renders the picture. With deliver = true it also downloads it (or opens the share sheet on an iPad). */
  async function capture({ deliver = false, scale = 2 } = {}) {
    const blob = await Render.capture(buildOverlay(), scale);
    if (deliver) {
      const name = Render.comparing() ? `${Store.get('name')}-compare` : Store.get('name');
      const result = await ShotMod.deliverImage(blob, ShotMod.screenshotFilename(name));
      if (result === 'downloaded') Toast.show('Image saved to your downloads.');
    }
    return blob;
  }
  async function take() {
    try { return await capture({ deliver: true }); } catch (e) { console.error(e); Toast.show(e && e.message ? e.message : 'The image could not be made.', 'bad', 6000); return null; }
  }

  /** The AI-ready picture: no overlay, grid, scale figure or wireframe; Model style; light plain sky. Filename `<option>-ai-ready-YYYY-MM-DD.png`. */
  async function aiReady({ deliver = true, scale = 2 } = {}) {
    const blob = await Render.captureClean(scale);
    if (deliver) {
      const result = await ShotMod.deliverImage(blob, ShotMod.screenshotFilename(`${Store.get('name')}-ai-ready`));
      if (result === 'downloaded') Toast.show('AI-ready image saved to your downloads.');
    }
    return blob;
  }
  async function takeAiReady() {
    try { return await aiReady({ deliver: true }); } catch (e) { console.error(e); Toast.show(e && e.message ? e.message : 'The image could not be made.', 'bad', 6000); return null; }
  }

  /** The overlay choices as menu elements (a label and one switch per item). Used by the Export menu's "Image overlay" view. */
  function overlayControls() {
    const out = [h('div', { class: 'label pop-label' }, 'The image shows')];
    for (const [key, text] of SHOT_ITEMS) {
      const btn = h('button', { class: 'toggle-row', type: 'button', role: 'switch', 'aria-checked': String(!!Store.get(`view.shot.${key}`)), 'data-shot': key, style: 'padding:0 8px' },
        h('span', null, text), h('span', { class: 'switch', 'aria-hidden': 'true' }));
      btn.addEventListener('click', () => {
        const next = !Store.get(`view.shot.${key}`);
        Store.set(`view.shot.${key}`, next, { live: false });
        btn.setAttribute('aria-checked', String(next));
      });
      out.push(btn);
    }
    return out;
  }

  return { take, capture, aiReady, takeAiReady, overlayControls, buildOverlay, keyMetrics };
})();

/* ==========================================================================
   COMPARE
   Choose 2 to 4 options. One renderer draws each option in its own part of
   the screen (setViewport / setScissor, see Render.enterCompare), one camera
   control moves them all, and a table under the views lists the metrics with
   the best value in each ranked row in bold.
   ========================================================================== */
const Compare = (() => {
  const CURRENT = '__current';
  const MIN = 2, MAX = 4;
  const $ = (id) => document.getElementById(id);
  let active = false, chosen = [], entries = [], version = 0, refreshTimer = null, ro = null;

  const RULE = 'Bold marks the best value in a row. Only the warning count is ranked (fewer is better). The window-to-wall rows are design values; whether a higher or lower ratio is better depends on the project.';
  const pct = (v) => `${(v * 100).toFixed(1)}%`;
  const ROWS = [
    { label: 'Window-to-wall ratio', get: (e) => e.d.hud.wwr, fmt: pct },
    { label: 'Worst orientation', get: (e) => (e.d.hud.worst ? e.d.hud.worst.wwr : null), fmt: pct },
    { label: 'North', get: (e) => (e.d.hud.byOrientation.N.wall > 0 ? e.d.hud.byOrientation.N.wwr : null), fmt: pct },
    { label: 'East', get: (e) => (e.d.hud.byOrientation.E.wall > 0 ? e.d.hud.byOrientation.E.wwr : null), fmt: pct },
    { label: 'South', get: (e) => (e.d.hud.byOrientation.S.wall > 0 ? e.d.hud.byOrientation.S.wwr : null), fmt: pct },
    { label: 'West', get: (e) => (e.d.hud.byOrientation.W.wall > 0 ? e.d.hud.byOrientation.W.wwr : null), fmt: pct },
    { label: 'Ground transparency', get: (e) => e.d.hud.transparency, fmt: pct },
    { label: 'Facade area', get: (e) => e.d.hud.wall, fmt: Units.formatArea },
    { label: 'Glazing area', get: (e) => e.d.hud.glazing, fmt: Units.formatArea },
    { label: 'Balconies', get: (e) => e.d.hud.balconies, fmt: Units.formatInt },
    { label: 'Balcony area', get: (e) => e.d.hud.balconyArea, fmt: Units.formatArea },
    { label: 'Levels', get: (e) => e.d.hud.levels, fmt: Units.formatInt },
    { label: 'Warnings', get: (e) => e.d.warnings.length, fmt: Units.formatInt, lower: true },
  ];

  /** Everything that can be compared: the design on screen (if it differs from its saved copy) and the saved options. */
  function candidates() {
    const list = [];
    if (Options.syncDirty()) list.push({ key: CURRENT, name: `${Store.get('name')} (on screen)`, state: () => Store.snapshot() });
    for (const o of Options.list()) list.push({ key: o.id, name: o.name, state: () => o.state });
    return list;
  }

  function buildEntries() {
    const cands = candidates();
    entries = chosen.map((key) => cands.find((c) => c.key === key)).filter(Boolean).map((c) => {
      const state = fillDefaults(c.state());
      state.name = c.name;
      return { key: c.key, name: c.name, state, d: computeDerived(state, { project: ProjectUI.dataDoc() }), uid: `${c.key}#${version}` };
    });
  }

  function renderBar(cands) {
    const bar = $('cmpBar');
    bar.textContent = '';
    const chips = h('div', { class: 'chips', role: 'group', 'aria-label': 'Options to compare' });
    for (const c of cands) {
      const on = chosen.includes(c.key);
      const b = h('button', { class: 'chip', type: 'button', 'aria-pressed': String(on), 'data-key': c.key, title: on ? 'Click to remove from the comparison' : 'Click to add to the comparison' }, c.name);
      b.addEventListener('click', () => {
        if (on) { if (chosen.length <= MIN) { Toast.show(`Compare needs at least ${MIN} options.`, 'warn'); return; } select(chosen.filter((k) => k !== c.key)); }
        else { if (chosen.length >= MAX) { Toast.show(`Compare shows at most ${MAX} options.`, 'warn'); return; } select([...chosen, c.key]); }
      });
      chips.append(b);
    }
    bar.append(h('span', { class: 'label' }, 'Compare'), chips, h('button', { class: 'btn outline sm', type: 'button', onclick: () => exit() }, 'Close'));
  }

  function renderTable() {
    const t = $('cmpTable');
    const head = h('tr', null, h('th', { title: RULE }, 'Metric'), entries.map((e) => h('th', { title: e.name }, e.name)));
    const body = ROWS.map((row) => {
      const vals = entries.map((e) => row.get(e));
      const nums = vals.filter((v) => typeof v === 'number' && isFinite(v));
      const best = nums.length ? (row.higher ? Math.max(...nums) : row.lower ? Math.min(...nums) : null) : null;
      const allSame = nums.length > 0 && nums.every((v) => Math.abs(v - nums[0]) < 1e-9);
      return h('tr', null,
        h('td', { title: row.higher || row.lower ? RULE : null }, row.label),
        vals.map((v) => {
          const isBest = best !== null && !allSame && typeof v === 'number' && Math.abs(v - best) < 1e-9;
          return h('td', { class: isBest ? 'best' : null }, v == null ? '—' : row.fmt(v));
        }));
    });
    t.replaceChildren(h('table', { class: 'cmp' }, h('thead', null, head), h('tbody', null, body)));
  }

  function positionLabels() {
    const host = $('cmpLabels');
    host.textContent = '';
    if (!active) return;
    const cells = Render.cells();
    entries.forEach((e, i) => {
      const c = cells[i];
      if (!c) return;
      host.append(h('div', { class: 'cmp-label', style: `left:${Math.round(c.x + 8)}px;top:${Math.round(c.y + 8)}px;max-width:${Math.max(60, Math.round(c.w - 16))}px` }, e.name));
    });
  }

  const reserve = () => {
    const bar = $('cmpBar'), table = $('cmpTable');
    return { top: bar.offsetTop + bar.offsetHeight + 6, bottom: table.offsetHeight };
  };
  function layoutChanged() {
    $('viewport').style.setProperty('--cmp-table-h', `${$('cmpTable').offsetHeight}px`);
    Render.refreshInsets(false);
    Render.relayout();
    positionLabels();
  }

  function apply(wasActive = false) {
    version++;
    buildEntries();
    renderBar(candidates());
    renderTable();
    Render.enterCompare(entries.map((e) => ({ name: e.name, state: e.state, d: e.d, uid: e.uid })), reserve, { keepView: wasActive });
    layoutChanged();
    markComparing(true);
  }
  /** The Option button shows a highlight while comparing (the Compare item itself lives in the Option menu). */
  function markComparing(on) {
    const b = $('btnOption');
    if (!b) return;
    b.classList.toggle('is-on', on);
    b.dataset.comparing = on ? 'true' : 'false';
    b.title = on ? 'Comparing options. Open the menu to exit.' : 'Option: name, presets, save, compare';
  }
  function select(keys) {
    chosen = keys.slice(0, MAX);
    apply(true);
  }

  /** Start comparing. keys: option ids (or '__current'); default = the design on screen plus the newest saved one. */
  function enter(keys) {
    const cands = candidates();
    if (cands.length < MIN) {
      Toast.show('Compare needs at least 2 options. Save this design, use Duplicate, change the copy, then try again.', 'warn', 6000);
      return false;
    }
    chosen = (keys && keys.length ? keys : cands.slice(0, 2).map((c) => c.key)).filter((k) => cands.some((c) => c.key === k)).slice(0, MAX);
    if (chosen.length < MIN) chosen = cands.slice(0, 2).map((c) => c.key);
    active = true;
    $('compare').hidden = false;
    $('viewport').dataset.compare = 'true';
    if (!ro) { ro = new ResizeObserver(() => { if (active) layoutChanged(); }); ro.observe($('cmpTable')); ro.observe($('cmpBar')); Render.onResize(() => { if (active) positionLabels(); }); }
    apply();
    return true;
  }
  function exit() {
    if (!active) return;
    active = false; entries = []; chosen = [];
    clearTimeout(refreshTimer);
    Render.exitCompare();
    $('compare').hidden = true;
    $('viewport').dataset.compare = 'false';
    $('viewport').style.removeProperty('--cmp-table-h');
    $('cmpLabels').textContent = '';
    markComparing(false);
  }
  function toggle() { if (active) exit(); else enter(); }

  /** While comparing, edits to the design on screen refresh its column and its view. */
  function init() {
    Store.subscribe((s, info) => {
      if (!active || !chosen.includes(CURRENT) || (info && info.live)) return;
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(() => { if (active) apply(true); }, 200);
    });
  }

  return { toggle, enter, exit, init, names: () => entries.map((e) => e.name), isActive: () => active, chosen: () => chosen.slice(), table: () => $('cmpTable').innerText };
})();

/* ==========================================================================
   TESTS
   Calculation and export tests. Run by adding ?test to the address (plan section 9.2). They cover the shell helpers, the default
   design (WWR 24.3 percent, N and S 25.4 percent, 66 balconies, transparency 28.9 percent with the target off), every case in
   src/facade/testcases.js through the integrated pipeline, every preset, the draft quality, the SketchUp document, the DXF, the
   derived section and the save / export / import round trip. The other test files (12b page, 12c selection, 12d project) run after
   this one; runAllTests (in 12d) merges the results. The result toast appears in ?test mode only.
   ========================================================================== */
const TestHelp = (() => {
  const eq = (a, b) => (JSON.stringify(a) === JSON.stringify(b) ? true : `got ${JSON.stringify(a)}, expected ${JSON.stringify(b)}`);
  const near = (a, b, tol = 1e-9) => (Math.abs(a - b) <= tol ? true : `got ${a}, expected ${b}`);
  const within = (a, b, pct) => (Math.abs(a - b) <= Math.abs(b) * pct / 100 + 1e-9 ? true : `got ${a}, expected ${b} (+/- ${pct}%)`);
  const make = () => {
    const results = [];
    const t = async (name, fn) => {
      let r;
      try { r = await fn(); } catch (e) { r = `threw ${e && e.message}`; }
      results.push({ name, ok: r === true, detail: r === true ? '' : String(r) });
    };
    return { results, t };
  };
  const $ = (id) => document.getElementById(id);
  const frames = (n = 2) => new Promise((res) => { const f = () => (--n <= 0 ? res() : requestAnimationFrame(f)); requestAnimationFrame(f); });
  const wait = (ms) => new Promise((res) => setTimeout(res, ms));
  const visible = (el) => !!el && el.getClientRects().length > 0 && getComputedStyle(el).visibility !== 'hidden';
  const snap = () => JSON.stringify(Store.snapshot());
  /** One undo returns the state from before the action, and one redo puts the result back (checked by behavior). */
  const oneStep = (before) => { Store.undo(); const back = snap() === before; Store.redo(); return back; };
  const toastText = () => [...document.querySelectorAll('#toasts .toast')].map((x) => x.textContent).join(' | ');
  const merged = (name, results) => {
    const bad = results.filter((r) => !r.ok);
    console.log(`[tests] ${name} ${results.length - bad.length}/${results.length} passed`, bad.length ? JSON.stringify(bad) : '');
  };
  const presetState = (id) => fillDefaults(deepClone(CONFIG.presets.find((p) => p.id === id).state));
  return { eq, near, within, make, $, frames, wait, visible, snap, oneStep, toastText, merged, presetState };
})();

async function runTests() {
  const { eq, near, make, presetState } = TestHelp;
  const { results, t } = make();
  const def = () => fillDefaults(defaultState());
  const pctOf = (v) => Math.round(v * 1000) / 10;

  /* ---- shell helpers ---- */
  await t('formatFeetInches 312.5', () => eq(Units.formatFeetInches(312.5), `312'-6"`));
  await t('formatArea 100000', () => eq(Units.formatArea(100000), '100,000 sf'));
  await t('parseLength 10\'-6" and 10-6', () => eq([Units.parseLength(`10'-6"`), Units.parseLength('10-6')], [10.5, 10.5]));
  await t('planToWorld north is -z', () => eq(planToWorld(3, 4, 5), [3, 5, -4]));
  await t('storage key, title and tool', () => eq([CONFIG.storageKey, document.title, CONFIG.tool], ['facade.options.v1', 'Facade Studio', 'facade']));
  await t('all the src modules are in the page', () => {
    const names = ['FacesMod', 'BalconiesMod', 'PanelsMod', 'FacMetricsMod', 'FacDerivedMod', 'ElevMod', 'SkFacade', 'PresetsMod', 'TestCasesMod', 'ProjectMod', 'PromptsMod', 'StorageMod', 'ShotMod', 'SkFmt'];
    const miss = names.filter((n) => { try { return typeof eval(n) !== 'object'; } catch (e) { return true; } });
    return eq(miss, []);
  });

  /* ---- the default design (plan section 8.1) ---- */
  await t('the default design: WWR 24.3 percent, wall 37,960 sf, glazing 9,240 sf', () => {
    const d = computeDerived(def()), h = d.hud;
    return eq([d.ok, pctOf(h.wwr), Math.round(h.wall), Math.round(h.glazing)], [true, 24.3, 37960, 9240]);
  });
  await t('the default design: worst orientation N or S at 25.4 percent', () => {
    const h = computeDerived(def()).hud;
    return eq([['N', 'S'].includes(h.worst.o), pctOf(h.worst.wwr), pctOf(h.byOrientation.E.wwr), pctOf(h.byOrientation.W.wwr)], [true, 25.4, 19.5, 19.5]);
  });
  await t('the default design: 66 balconies, 4,752 sf, transparency 28.9 percent, target off', () => {
    const h = computeDerived(def()).hud;
    return eq([h.balconies, Math.round(h.balconyArea), pctOf(h.transparency), h.target], [66, 4752, 28.9, null]);
  });
  await t('the default design has no warning and is under the 40 percent check value', () => {
    const d = computeDerived(def());
    return eq([d.warnings.length, d.hud.over, d.hud.limit], [0, false, 0.4]);
  });
  await t('the page is showing the default numbers (24.3 percent, N 25.4 percent, 66 balconies)', () => {
    if (!document.getElementById('mWwr')) return true;
    const saved = Store.snapshot();
    Store.replace(def());
    UI.updateHud(Derived.get());
    const out = [document.getElementById('mWwr').firstChild.nodeValue, document.getElementById('mWorst').firstChild.nodeValue, document.getElementById('mBalc').firstChild.nodeValue];
    Store.replace(saved);
    return eq(out, ['24.3%', 'N 25.4%', '66']);
  });
  await t('computeDerived never throws on a broken state', () => {
    const s = def(); s.standalone.width = -5; s.standalone.floors = 0; s.zones.rules = null;
    const err = console.error; console.error = () => {};
    let d;
    try { d = computeDerived(s); } finally { console.error = err; }
    return d && d.hud && typeof d.hud.wwr === 'number' ? true : 'no hud';
  });

  /* ---- every hand-calculated case through the pipeline (plan section 8) ---- */
  for (const tc of TestCasesMod.TEST_CASES) {
    await t(`case ${tc.id}: WWR, orientation WWRs, transparency, balconies, areas`, () => {
      const d = computeDerived(fillDefaults(deepClone(tc.state))), h = d.hud, e = tc.expect, tol = e.tolerance || 0.001;
      if (!d.ok) return 'not ok';
      const bad = [];
      const chk = (name, got, want, tolerance) => { if (!(Math.abs(got - want) <= tolerance)) bad.push(`${name} ${got} vs ${want}`); };
      chk('wwr', h.wwr, e.wwr, tol);
      for (const o of Object.keys(e.wwrByOrientation || {})) chk(`wwr ${o}`, h.byOrientation[o].wwr, e.wwrByOrientation[o], tol);
      if (e.transparency !== undefined) chk('transparency', h.transparency, e.transparency, tol);
      if (e.balconies) { chk('balconies', h.balconies, e.balconies.count, 0); chk('balcony area', h.balconyArea, e.balconies.area, 0.1); }
      // the module tests hold the areas to 1e-5 (a few cases differ from the rounded plan figures by under half a sf)
      if (e.wall !== undefined) chk('wall', h.wall, e.wall, Math.max(e.areaTolerance || 0.1, e.wall * 1e-5));
      if (e.glazing !== undefined) chk('glazing', h.glazing, e.glazing, Math.max(e.areaTolerance || 0.1, e.glazing * 1e-5));
      return bad.length ? bad.join('; ') : true;
    });
  }

  /* ---- every preset ---- */
  for (const p of CONFIG.presets) {
    await t(`preset ${p.id} loads, builds and matches its WWR`, () => {
      const d = computeDerived(presetState(p.id));
      if (!d.ok) return 'not ok';
      const tc = TestCasesMod.TEST_CASES.find((c) => c.id === p.id);
      if (!tc) return d.hud.wall > 0 ? true : 'no wall';
      return Math.abs(d.hud.wwr - tc.expect.wwr) <= (tc.expect.tolerance || 0.001) ? true : `WWR ${d.hud.wwr} vs ${tc.expect.wwr}`;
    });
  }
  await t('every preset is in the Option menu list (CONFIG.presets)', () => eq(CONFIG.presets.length >= 8, true));

  /* ---- the limit, the target and the wording ---- */
  await t('a design over the 40 percent value gets the wwr-limit warning', () => {
    const d = computeDerived(presetState('hotel-window-wall'));
    return eq([d.hud.over, d.warnings.some((w) => w.id === 'wwr-limit')], [true, true]);
  });
  await t('the transparency target warns when it is not met and is off by default', () => {
    const s = def(); s.checks.transparencyTarget = 0.6;
    const on = computeDerived(s);
    return eq([on.hud.targetMet, on.warnings.some((w) => w.id === 'transparency'), computeDerived(def()).warnings.some((w) => w.id === 'transparency')], [false, true, false]);
  });
  await t('no warning or note says "compliant" or "complies"', () => {
    const texts = [];
    for (const p of CONFIG.presets) { const d = computeDerived(presetState(p.id)); texts.push(...d.warnings.map((w) => w.text)); }
    return eq(texts.filter((x) => /\bcompl(y|ies|iant|iance)\b/i.test(x)), []);
  });

  /* ---- draft quality ---- */
  await t('draft quality is drawn while a slider moves, with no mullions or fins (the display key changes)', () => {
    const a = Derived.display(true), b = Derived.display(false);
    return eq([a.quality, b.quality, a.key !== b.key], ['draft', 'full', true]);
  });
  await t('Facade3D draft has fewer instances than full for a state with fins', () => {
    const s = presetState('tower-glass-corner-fins');
    const d = computeDerived(s);
    const mats = { mesh: () => new THREE.MeshBasicMaterial(), line: () => new THREE.LineBasicMaterial() };
    const count = (quality) => {
      const r = Facade3D.build(d, s, { key: quality, quality }, mats);
      let n = 0;
      for (const o of r.model) if (o.isInstancedMesh) n += o.count;
      return n;
    };
    const full = count('full'), draft = count('draft');
    return draft < full ? true : `draft ${draft}, full ${full}`;
  });

  /* ---- exports ---- */
  await t('SketchUp document validates, has source facade and solids or meshes', () => {
    const doc = SketchupExport.doc(def(), computeDerived(def()));
    const v = SkFmt.validateDoc(doc);
    return v.ok && (v.counts.solid || v.counts.mesh) && doc.source === 'facade' ? true : JSON.stringify(v.errors || v);
  });
  await t('SketchUp document of the hotel preset validates', () => {
    const s = presetState('hotel-window-wall');
    const v = SkFmt.validateDoc(SketchupExport.doc(s, computeDerived(s)));
    return v.ok ? true : JSON.stringify(v.errors);
  });
  await t('SketchUp download delivers a file named .sketchup.json', () => {
    let name = '';
    const r = SketchupExport.download({ deliver: (blob, n) => { name = n; } });
    return eq([r.ok, /\.sketchup\.json$/.test(name)], [true, true]);
  });
  await t('the elevations DXF has the facade layers, four sheets and the end of file', () => {
    const txt = SketchupExport.dxfText();
    const layers = ['FAC-GLASS', 'FAC-TEXT'].filter((l) => txt.includes(l));
    return eq([layers.length, /ENTITIES/.test(txt), /EOF/.test(txt), (txt.match(/WWR/g) || []).length >= 4], [2, true, true, true]);
  });
  await t('the DXF download delivers a file named -elevations.dxf', () => {
    let name = '';
    const r = SketchupExport.dxf({ deliver: (blob, n) => { name = n; } });
    return eq([r.ok, /-elevations\.dxf$/.test(name)], [true, true]);
  });
  await t('the derived section: one face per group, the face areas add up to the wall', () => {
    const d = Derived.get(), sec = FacDerivedMod.facadeDerived(Store.snapshot(), d.built, d.metrics);
    const sum = sec.faces.reduce((s, f) => s + f.area, 0);
    return eq([sec.faces.length, Math.abs(sum - sec.metrics.facadeArea) < 1, sec.metrics.balconyCount, pctOf(sec.metrics.wwr)], [d.groups.length, true, d.hud.balconies, pctOf(d.hud.wwr)]);
  });

  /* ---- AI prompts ---- */
  await t('the AI prompt carries the facade lock, the design material and says building, not tower', () => {
    const txt = Prompts.promptText('time-golden-hour');
    return eq([/Keep every window, door, balcony/.test(txt), /percent glass/.test(txt), /__design__/.test(txt), /\btower\b/i.test(txt)], [true, true, false, false]);
  });
  await t('the AI auto values come from the design: floors, height, form', () => {
    const a = Prompts.autoValues(def(), computeDerived(def()));
    return eq([a.floors, a.height, /five-story rectangular building/.test(a.form)], ['5', '52 feet', true]);
  });

  /* ---- save / export / import ---- */
  await t('state survives a JSON round trip and fillDefaults', () => {
    const s = def(), back = fillDefaults(JSON.parse(JSON.stringify(s)));
    return eq(back, s);
  });
  await t('fillDefaults fills a partial state', () => {
    const s = fillDefaults({ standalone: { width: 200 } });
    return eq([s.standalone.width, s.standalone.depth > 0, s.zones.rules.middle.system, Array.isArray(s.materials)], [200, true, 'punched', true]);
  });
  await t('fillDefaults gives a range its own rule', () => {
    const s = fillDefaults({ zones: { mode: 'ranges', ranges: [{ id: 'Z1', name: 'Mid', from: 2, to: 4 }] } });
    return eq([!!s.zones.rules.Z1, s.zones.rules.Z1.system], [true, 'punched']);
  });
  await t('level ranges: a range zone gets its own rule and shows in the zone table', () => {
    const s = def();
    s.zones.mode = 'ranges';
    s.zones.ranges = [{ id: 'Z1', name: 'Levels 2 to 4', from: 2, to: 4 }];
    s.zones.rules.Z1 = { system: 'windowWall' };
    const d = computeDerived(fillDefaults(s));
    return eq([!!d.hud.zones.Z1, d.hud.zones.Z1 && d.hud.zones.Z1.wwr > 0.5], [true, true]);
  });
  return results;
}

/* ==========================================================================

async function runUiTests() {

    await t('the checks tab: the WWR tables list orientations and zones, with the Caution line', () => {

    await t('the envelope note shows only when it is turned on, with its Caution line', () => {

    await t('the over-the-limit WWR shows in red and the badge counts the warning', () => {

      const out = [$('mWwr').classList.contains('bad'), $('hudBadge').dataset.n !== '0', /40\.0%|check value/.test($('warnList').textContent)];

    await t('shades: the projection factor is listed in the card', () => {
      fresh(); Store.set('shades.on', true, { live: false }); UI.updateHud(Derived.get());
      const text = $('hudPfList').textContent;
      Store.set('shades.on', false, { live: false });
      return eq([/0\.\d\d/.test(text), $('hudPf').hidden], [true, false]);
    });

    /* ---- the top bar and its menus ---- */
    await t('the top bar has Option, Project, Undo, Redo, Model/Diagram, Export and Help', () => eq(
      ['btnOption', 'btnProject', 'btnExport', 'btnHelp'].map((id) => !!$(id)).concat([$('tbHistory').children.length, $('styleToggle').children.length]), [true, true, true, true, 2, 2]));
    await t('the Export menu: Image, AI-ready image, AI Prompts, overlay, SketchUp, Elevations DXF, JSON, Send to Grading Sketch; no CSV', () => {
      click($('btnExport'));
      const ids = [...document.querySelectorAll('#exportMenu .pop-item')].map((b) => b.id);

    });
    await t('the Option menu lists every preset', () => {
      click($('btnOption'));
      const n = document.querySelectorAll('#optionMenu [id^="preset-"]').length;
      Pop.close();
      return eq(n, CONFIG.presets.length);
    });
    await t('loading a preset from the menu replaces the design in one undo step', () => {
      fresh();
      const before = snap();
      Options.loadPreset('hotel-window-wall');
      const out = [Store.get('name'), Derived.get().hud.over];
      const back = oneStep(before);
      return eq([...out, back], ['Hotel window wall', true, true]);

    await t('Model and Diagram buttons switch the style', () => {

      Store.set('view.style', 'model', { live: false });
      Store.set('view.colorBy', 'system', { live: false });
      return eq([sys.includes('Punched windows'), wwr.length >= 5, $('legend').hidden], [true, true, true]);

      fresh();
      const names = [...document.querySelectorAll('#views button')].map((b) => b.textContent);
      if (!Render.ready()) return eq(names, ['Axon', 'N', 'E', 'S', 'W', 'Plan']);
      click(document.querySelector('#views [data-view="s"]'));
      const s = Store.get('view.elevation');
      click(document.querySelector('#views [data-view="axon"]'));
      return eq([names, s, Store.get('view.elevation')], [['Axon', 'N', 'E', 'S', 'W', 'Plan'], 'S', null]);
    });
    await t('an elevation view needs no new undo step and turns the shadows off', async () => {
      fresh();
      if (!Render.ready()) return true;
      const depth = Store.historyDepth();
      Render.setView('e', false);
      const out = [Store.get('view.elevation'), Store.historyDepth() === depth, Render.info().camera];
      Render.setView('axon', false);
      return eq(out, ['E', true, 'ortho']);
    });
    await t('loading a saved option in an elevation view puts the camera there', async () => {
      if (!Render.ready()) return true;
      fresh();

      const p = Render.info().preset;

      const text = ok ? Compare.table() : '';
      Compare.exit();

      return eq([ok, /Window-to-wall ratio/.test(text), /Warnings/.test(text), a != null], [true, true, true, true]);
    });

    /* ---- AI prompts and Help ---- */
    await t('AI Prompts opens from the Export menu; the preview has the facade lock and the design numbers', async () => {
      fresh();
      click($('btnExport')); click($('miAiPrompts'));
      await frames(2);
      const open = Prompts.isOpen();
      const chips = [...document.querySelectorAll('#aiAuto .ai-chip')].map((c) => c.textContent);
      const preview = $('aiPreview') ? $('aiPreview').value : '';
      Prompts.close();
      return eq([open, chips.some((c) => /Floors5/.test(c)), /Keep every window, door, balcony/.test(preview), /percent glass/.test(preview)], [true, true, true, true]);
    });
    await t('the Material menu has a "From the design" choice that is the default', async () => {
      Prompts.open(); Prompts.select('time', 'time-golden-hour'); Prompts.render();
      await frames(1);
      const sel = $('aiField-material');
      const out = sel ? [sel.options[0].textContent, sel.value] : null;
      Prompts.close();
      return eq(out, ['From the design', '__design__']);
    });
    await t('Help opens with the Facade Studio guide and the Caution about the 40 percent value', () => {
      click($('btnHelp'));
      const el = $('helpPanel');
      const out = [!!el, el ? /Facade Studio/.test(el.textContent) : false, el ? /never says a design complies/.test(el.textContent) : false];
      Pop.close();
      return eq(out, [true, true, true]);
    });
  } finally {
    Pop.close(); if (Prompts.isOpen()) Prompts.close();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    if (Compare.isActive()) Compare.exit();
    Store.replace(savedState); UI.setTab(savedTab); UI.setHudOpen(savedHud);
    Options.holdAutosave(false);
    UI.updateHud(Derived.get());
  }
  TestHelp.merged('ui', results);
  return results;
}

/* ==========================================================================
   TESTS: selection
   Click a face in the 3D view (a raycast on the instanced meshes), the face card, the street toggle and the Pick street faces mode,
   Open in panel, and the keys (1 to 6, D, Escape). The clicks run through Select.click, the same function the pointer handler
   calls. Restores the design when done. Without WebGL the pick tests are skipped (they pass as "no WebGL").
   ========================================================================== */
async function runSelectTests() {
  const { eq, make, $, frames, snap, visible } = TestHelp;
  const { results, t } = make();
  const savedState = Store.snapshot(), savedTab = UI.activeTab();
  Options.holdAutosave(true);
  const fresh = () => { Select.clear(); Store.replace(fillDefaults(defaultState())); };
  const glWorks = Render.ready();
  const faceOf = (zone, orient) => Derived.get().groups.find((g) => g.zone === zone && g.orientation === orient);
  const blur = () => { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); };
  const key = (k, opts = {}) => window.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true, ...opts }));

  try {
    await t('select and clear a face; the card shows its name', () => {
      fresh();
      const g = faceOf('middle', 'S');
      Select.select([{ kind: 'face', id: g.id }]);
      const card = $('selection-card');
      const out = [Select.count(), card.hidden, /Face F\d+ · South/.test(card.textContent)];
      Select.clear();
      return eq([out, Select.count(), card.hidden], [[1, false, true], 0, true]);
    });
    await t('only valid faces can be selected', () => {
      fresh();
      Select.select([{ kind: 'face', id: 'nope' }, { kind: 'core', id: 'S1' }]);
      return eq(Select.count(), 0);
    });
    await t('the face card shows S, 300 ft, the level range, the zone and the WWR of the south middle faces', () => {
      fresh();
      const g = faceOf('middle', 'S');
      Select.select([{ kind: 'face', id: g.id }]);
      const text = $('selection-card').textContent;
      const gi = Derived.get().groupInfo[g.id];
      const out = [/South/.test(text), /300'-0"/.test(text), /levels 2 to 4/.test(text), /Middle/.test(text), text.includes(`${(gi.wwr * 100).toFixed(1)}%`)];
      Select.clear();
      return eq(out, [true, true, true, true, true]);
    });
    await t('a click on the south face opens the face card with S, 300 ft and its WWR', () => {
      if (!glWorks) return true;
      fresh();
      const g = faceOf('middle', 'S');
      const pt = Select.screenPointFor({ kind: 'face', id: g.id });
      if (!pt) return 'no screen point for the south face';
      const hit = Select.click(pt.x, pt.y);
      const text = $('selection-card').textContent;
      const out = [hit && hit.id === g.id, Select.get()[0] && Select.get()[0].id === g.id, /South/.test(text), /300'-0"/.test(text), text.includes(`${(Derived.get().groupInfo[g.id].wwr * 100).toFixed(1)}%`)];
      Select.clear();
      return eq(out, [true, true, true, true, true]);
    });
    await t('a click on every face group picks that group', () => {
      if (!glWorks) return true;
      fresh();
      const bad = [];
      let seen = 0;
      for (const g of Derived.get().groups) {
        const pt = Select.screenPointFor({ kind: 'face', id: g.id });
        if (!pt) continue;                                            // a face behind the building cannot be picked from the axon camera
        seen++;
        const hit = Select.pickAt(pt.x, pt.y);
        if (!hit || hit.id !== g.id) bad.push(`${g.id} -> ${hit && hit.id}`);
      }
      if (seen < 6) bad.push(`only ${seen} faces can be picked`);       // the south and east faces, three zones each
      return bad.length ? bad.join(', ') : true;
    });
    await t('a click on empty ground clears the selection', () => {
      if (!glWorks) return true;
      fresh();
      const g = faceOf('middle', 'S');
      Select.select([{ kind: 'face', id: g.id }]);
      const r = Render.canvas().getBoundingClientRect();
      Select.click(r.left + 6, r.top + 6);
      return eq(Select.count(), 0);
    });
    await t('the outline is drawn for the selected face and removed when it is cleared', () => {
      if (!glWorks) return true;
      fresh();
      const g = faceOf('middle', 'S');
      Select.select([{ kind: 'face', id: g.id }]);
      const on = Select.overlayInfo().outline;
      Select.clear();
      return eq([on > 0, Select.overlayInfo().outline], [true, 0]);
    });
    await t('the street switch in the card turns the face into a manual street face (one undo)', () => {
      fresh();
      const g = faceOf('middle', 'N');
      Select.select([{ kind: 'face', id: g.id }]);
      const before = snap();
      $('selection-card').querySelector('[data-action="street"]').click();
      const out = [Store.get('street.mode'), Store.get('street.manual').includes(g.id), Derived.get().street.includes(g.id)];
      const back = TestHelp.oneStep(before);
      Select.clear();
      return eq([...out, back], ['manual', true, true, true]);
    });
    await t('Pick street faces: a click toggles a street face and does not select', () => {
      if (!glWorks) return true;
      fresh();
      const g = faceOf('middle', 'S');
      Select.select([]);
      UI.setStreetPick(true);
      const pt = Select.screenPointFor({ kind: 'face', id: g.id });
      Select.click(pt.x, pt.y);
      const on = Derived.get().street.includes(g.id);
      Select.click(pt.x, pt.y);
      const off = Derived.get().street.includes(g.id);
      UI.setStreetPick(false);
      return eq([on, off, Select.count(), Store.get('street.mode')], [true, false, 0, 'manual']);
    });
    await t('Open in panel opens the zone card of the face with its orientation chosen', () => {
      fresh();
      const g = faceOf('middle', 'S');
      Select.select([{ kind: 'face', id: g.id }]);
      $('selection-card').querySelector('[data-action="open"]').click();
      const out = [UI.activeTab(), UI.zoneTarget('middle'), visible(document.querySelector('[data-section="zone-middle"] .acc-body'))];
      UI.zoneTarget('middle');
      document.querySelector('[data-section="zone-middle"] [data-target="all"]').click();
      Select.clear();
      return eq(out, ['facade', 'S', true]);
    });
    await t('keys 2 to 5 set the elevation views, 1 the axon, 6 the plan', async () => {
      if (!glWorks) return true;
      fresh(); blur();
      const seen = [];
      for (const k of ['2', '3', '4', '5', '6', '1']) { key(k); seen.push(Render.info().preset); }
      return eq(seen, ['n', 'e', 's', 'w', 'plan', 'axon']);
    });
    await t('D switches Model and Diagram; keys are ignored while typing in a field', () => {
      fresh(); blur(); UI.setTab('massing');
      key('d');
      const a = Store.get('view.style');
      const input = document.querySelector('#panelScroll input.numfield');
      input.focus();
      input.dispatchEvent(new KeyboardEvent('keydown', { key: 'd', bubbles: true, cancelable: true }));
      key('d');
      input.blur();
      const b = Store.get('view.style');
      key('d');
      return eq([a, b, Store.get('view.style')], ['diagram', 'diagram', 'model']);
    });
    await t('Escape clears the selection', () => {
      fresh(); blur();
      Select.select([{ kind: 'face', id: faceOf('top', 'N').id }]);
      key('Escape');
      return eq(Select.count(), 0);
    });
    await t('a change that removes the selected face clears the selection', () => {
      fresh();
      const g = faceOf('top', 'N');
      Select.select([{ kind: 'face', id: g.id }]);
      Store.set('standalone.floors', 2, { live: false });
      const n = Select.count();
      return eq(n === 0 || Derived.get().groups.some((x) => x.id === Select.get()[0].id), true);
    });
  } finally {
    Select.clear(); UI.setStreetPick(false);
    Store.replace(savedState); UI.setTab(savedTab);
    Options.holdAutosave(false);
    UI.updateHud(Derived.get());
  }
  TestHelp.merged('select', results);
  return results;
}

/* ==========================================================================
   TESTS: the project file
   Open a project whose massing is a hand-built courtyard (O) of 250 by 220 ft (a podium level and five bar levels, the shape of plan
   section 8.7), read its levels (plan section 7), write the facade section (1 s debounce, visibilitychange, pagehide), keep every
   other section, a newer schema, close. A tower project with no levels shows the plan's note and the warning tower-no-levels.
   A fixture project lives in an in-memory storage, so a ?test visit never touches the saved projects.
   runAllTests (below) runs every test file and merges the results.
   ========================================================================== */
const ProjectFixture = (() => {
  const memory = () => ({ data: {}, getItem(k) { return this.data[k] === undefined ? null : this.data[k]; }, setItem(k, v) { this.data[k] = String(v); }, removeItem(k) { delete this.data[k]; } });
  const rect = (x0, y0, x1, y1) => [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
  /** A courtyard massing, centered on the origin: a solid 250 x 220 podium level (11 ft) and five bar levels (10 ft) with a 120 x 90 court. */
  function courtyardLevels() {
    const levels = [{ index: 1, zone: 'podium', z: 0, ftf: 11, plates: [{ outer: rect(-125, -110, 125, 110), holes: [] }] }];
    for (let i = 0; i < 5; i++) levels.push({ index: 2 + i, zone: 'bar', z: 11 + i * 10, ftf: 10, plates: [{ outer: rect(-125, -110, 125, 110), holes: [[[-60, -45], [-60, 45], [60, 45], [60, -45]]] }] });
    return levels;
  }
  const massing = (tool, levels, rotation = 0) => ({ tool, schema: 1, placement: { x: 40, y: 60, rotation, baseZ: 0 }, state: {}, derived: levels ? { levels, metrics: { units: 120 } } : {} });
  function project({ tool = 'midrise', levels = courtyardLevels(), rotation = 0, name = 'Fixture' } = {}) {
    let doc = ProjectMod.newProject({ name });
    doc = ProjectMod.writeSection(doc, 'massing', massing(tool, levels, rotation));
    doc = ProjectMod.writeSection(doc, 'plates', { tool: 'plate', schema: 1, placement: { x: 1, y: 2, rotation: 0, baseZ: 3 }, state: { keep: 'me' }, derived: { levels: [] } });
    return doc;
  }
  return { memory, courtyardLevels, project };
})();

async function runProjectTests() {
  const { eq, near, make, $, wait, snap, oneStep, presetState } = TestHelp;
  const { results, t } = make();
  const savedState = Store.snapshot(), savedTab = UI.activeTab();
  Options.holdAutosave(true);
  const mem = ProjectFixture.memory();
  const urls = [], navs = [];
  ProjectUI.reset();
  ProjectUI.configure({ storage: mem, navigate: (u) => navs.push(u), updateUrl: (id) => urls.push(id) });
  const stored = (id) => ProjectMod.loadProject(mem, id);
  const open = (opts, name) => { const doc = ProjectFixture.project({ ...opts, name }); ProjectMod.saveProject(mem, doc); ProjectUI.openDoc(doc); return doc; };
  const fresh = () => { Store.replace(fillDefaults(defaultState())); };
  const courtState = () => { const s = presetState('courtyard-multifamily-projected-balconies'); s.source = 'project'; return s; };

  try {
    fresh();
    await t('no project: the standalone massing is the default and the project line is empty', () => eq([ProjectUI.has(), Store.get('source'), ProjectUI.massingInfo().has], [false, 'standalone', false]));
    await t('ProjectUI.send goes to the Grading Sketch only', async () => eq([typeof ProjectUI.send, await ProjectUI.send('nowhere')], ['function', false]));

    await t('opening a project with a massing makes the source "project" and takes its placement', () => {
      open();
      return eq([ProjectUI.has(), Store.get('source'), Store.get('placement'), ProjectUI.massingInfo().levels], [true, 'project', { x: 40, y: 60, rotation: 0, baseZ: 0 }, 6]);
    });
    await t('the project massing builds the courtyard: 8 faces per bar level, a solid podium', () => {
      const d = Derived.get();
      return eq([d.built.source, d.levels.length, d.groups.filter((g) => g.zone === 'middle').length >= 8], ['project', 6, true]);
    });
    await t('the project faces match preset 8.7: WWR 22.9 percent, 184 balconies, 78,340 sf of wall', () => {
      Store.replace(fillDefaults(courtState()));
      const h = Derived.get().hud;
      return eq([Math.round(h.wwr * 1000) / 10, h.balconies, Math.round(h.wall), Math.round(h.glazing)], [22.9, 184, 78340, 17940]);
    });
    await t('the project massing and the standalone O give the same face groups and lengths', () => {
      const proj = Derived.get().groups.map((g) => `${g.zone}:${g.orientation}:${Math.round(g.length)}`).sort();
      const sa = fillDefaults(courtState()); sa.source = 'standalone';
      const alone = computeDerived(sa).groups.map((g) => `${g.zone}:${g.orientation}:${Math.round(g.length)}`).sort();
      return eq(proj, alone);
    });
    await t('the Massing tab says where the massing comes from', () => {
      UI.setTab('massing'); UI.updateHud(Derived.get());
      return eq([/Project massing: 6 levels/.test($('sourceNote').textContent), $('sourceChips').querySelector('[aria-pressed="true"]').dataset.source], [true, 'project']);
    });
    await t('the project line names the project and its levels', () => eq(/Project “Fixture”.*6 levels/.test($('projLine').textContent), true));
    await t('the facade section is written after 1 s, with the state, the derived faces and every other section kept', async () => {
      const doc = ProjectUI.doc();
      Store.set('balconies.spacing', 3, { live: false });
      await wait(1400);
      const back = stored(doc.id), sec = back && back.sections.facade;
      return eq([!!sec, sec && sec.tool, sec && sec.schema, sec && sec.state.balconies.spacing, sec && sec.derived.faces.length > 0, !!back.sections.massing, back.sections.plates.state], [true, 'facade', 1, 3, true, true, { keep: 'me' }]);
    });
    await t('the derived faces carry edge, bearing, zone and street, and the metrics the plan adds', () => {
      const sec = stored(ProjectUI.doc().id).sections.facade.derived, f = sec.faces[0], m = sec.metrics;
      return eq([Array.isArray(f.edge) && f.edge.length === 2, typeof f.bearing, typeof f.zone, typeof f.street, ['facadeArea', 'glazingArea', 'balconyCount', 'balconyArea', 'wwrLimit'].every((k) => typeof m[k] === 'number')], [true, 'number', 'string', 'boolean', true]);
    });
    await t('the saved project validates', () => eq(ProjectMod.validate(stored(ProjectUI.doc().id)).ok !== false, true));
    await t('visibilitychange (hidden) and pagehide flush a pending change at once', () => {
      Store.set('balconies.spacing', 2, { live: false });
      Object.defineProperty(document, 'visibilityState', { configurable: true, get: () => 'hidden' });
      document.dispatchEvent(new Event('visibilitychange'));
      delete document.visibilityState;
      const a = stored(ProjectUI.doc().id).sections.facade.state.balconies.spacing;
      Store.set('balconies.spacing', 4, { live: false });
      window.dispatchEvent(new Event('pagehide'));
      const b = stored(ProjectUI.doc().id).sections.facade.state.balconies.spacing;
      return eq([a, b], [2, 4]);
    });
    await t('a project saved by a newer tool is read only: opened, not written', async () => {
      const doc = ProjectFixture.project({ name: 'Newer' });
      doc.sections.facade = { tool: 'facade', schema: 99, placement: { x: 0, y: 0, rotation: 0, baseZ: 0 }, state: {}, derived: { faces: [], metrics: {} }, updatedAt: new Date().toISOString() };
      ProjectMod.saveProject(mem, doc);
      ProjectUI.openDoc(doc);
      Store.set('balconies.spacing', 5, { live: false });
      await wait(1300);
      const st = ProjectUI.status();
      return eq([st.readOnly, stored(doc.id).sections.facade.schema], [true, 99]);
    });
    await t('a tower project with no levels shows the note and the tower-no-levels warning', () => {
      const doc = ProjectFixture.project({ tool: 'tower', levels: null, name: 'Tower' });
      ProjectMod.saveProject(mem, doc);
      ProjectUI.openDoc(doc);
      UI.setTab('massing'); UI.updateHud(Derived.get());
      const w = Derived.get().warnings.find((x) => x.id === 'tower-no-levels');
      const note = $('sourceNote').textContent;
      const hud = $('warnList').textContent;
      return eq([!!w, /The Tower Generator does not write massing levels yet\. Use the standalone massing\./.test(note), /does not write massing levels yet/.test(hud), Derived.get().built.source], [true, true, true, 'standalone']);
    });
    await t('a rotated project massing turns the faces: a south face of the standalone bar becomes a west face at 90 degrees', () => {
      const doc = ProjectFixture.project({ levels: (() => { const lv = []; for (let i = 0; i < 3; i++) lv.push({ index: i + 1, zone: 'bar', z: i * 10, ftf: 10, plates: [{ outer: [[-150, -32.5], [150, -32.5], [150, 32.5], [-150, 32.5]], holes: [] }] }); return lv; })(), rotation: 90, name: 'Rot' });
      ProjectMod.saveProject(mem, doc);
      ProjectUI.openDoc(doc);
      const o = [...new Set(Derived.get().groups.filter((g) => g.length > 200).map((g) => g.orientation))].sort();
      return eq(o, ['E', 'W']);
    });
    await t('Close project goes back to the standalone massing and keeps the saved copy', () => {
      const id = ProjectUI.doc().id;
      ProjectUI.close();
      return eq([ProjectUI.has(), Store.get('source'), !!stored(id)], [false, 'standalone', true]);
    });
    await t('the Project menu lists New, the saved projects, Import, Export and Close', () => {
      ProjectUI.openDoc(ProjectFixture.project({ name: 'Menu' }));
      $('btnProject').click();
      const keys = [...document.querySelectorAll('#projectMenu [data-proj]')].map((b) => b.dataset.proj);
      Pop.close();
      ProjectUI.close();
      return eq([keys[0], keys.includes('import'), keys.includes('export'), keys.includes('close')], ['new', true, true, true]);
    });
  } finally {
    ProjectUI.close();
    ProjectUI.restoreDefaults();
    ProjectUI.reset();
    Store.replace(savedState); UI.setTab(savedTab);
    Options.holdAutosave(false);
    UI.updateHud(Derived.get());
  }
  TestHelp.merged('project', results);
  return results;
}

/** Every test file, merged. This is what ?test and __facade.runTests run. */
async function runAllTests() {
  const base = await runTests();
  const ui = await runUiTests();
  const select = await runSelectTests();
  const project = await runProjectTests();
  const all = [...base, ...ui, ...select, ...project];
  const failed = all.filter((r) => !r.ok);
  TestHelp.merged('all', all);
  window.__facadeTestResults = { total: all.length, passed: all.length - failed.length, failed, results: all };
  return window.__facadeTestResults;
}

/* ==========================================================================
   Start-up and test hook
   ========================================================================== */
const TEST_MODE = /[?&]test\b/.test(location.search);
Options.init({ restore: !TEST_MODE });
UI.init();
Prompts.init();
Compare.init();
Options.syncDirty();
if (!Render.init(document.getElementById('canvasHost'))) Store.subscribe(() => UI.updateHud(Derived.get()));
Select.init();
ProjectUI.start();
// A restored option may be saved in an elevation view: the camera starts there.
if (Render.ready() && Store.raw().view.elevation) Render.setView(Store.raw().view.elevation.toLowerCase(), false);

const optionInfo = (o) => ({ id: o.id, name: o.name, updatedAt: o.updatedAt });
window.__facade = {
  getState: () => Store.snapshot(),
  setState: (path, value) => { Store.set(path, value, { live: false }); },
  setStateLive: (path, value) => { Store.set(path, value, { live: true }); },
  commit: () => Store.commit(),
  replaceState: (state) => { Store.replace(fillDefaults(state)); },
  getDerived: () => { const d = Derived.get(); return { ok: d.ok, hud: d.hud, warnings: d.warnings, street: d.street, groups: d.groups.map((g) => ({ id: g.id, zone: g.zone, orientation: g.orientation, length: g.length, levelFrom: g.levelFrom, levelTo: g.levelTo })) }; },
  getHud: () => Derived.get().hud,
  getMetrics: () => Derived.get().metrics,
  getWarnings: () => Derived.get().warnings,
  getGroups: () => Derived.get().groups,
  loadPreset: (id) => Options.loadPreset(id),
  newDesign: (opts) => Options.newDesign(opts),            // { confirm: false } skips the unsaved-changes question (tests)
  hasUnsavedChanges: () => Options.hasUnsavedChanges(),
  listPresets: () => CONFIG.presets.map((p) => ({ id: p.id, name: p.name })),
  listOptions: () => Options.list().map(optionInfo),
  saveOption: () => Options.save(),
  duplicateOption: () => Options.duplicate(),
  loadOption: (id) => Options.loadOption(id),
  compare: (keys) => Compare.enter(keys),
  exitCompare: () => Compare.exit(),
  getCompare: () => ({ active: Compare.isActive(), names: Compare.names(), chosen: Compare.chosen(), table: Compare.isActive() ? Compare.table() : '' }),
  screenshot: (opts) => Shots.capture(opts),
  openPrompts: () => Prompts.open(),
  closePrompts: () => Prompts.close(),
  getPromptText: (id, values) => Prompts.promptText(id, values),
  getPromptAuto: () => Prompts.currentAuto(),
  listPrompts: () => Prompts.allPrompts().map((p) => ({ id: p.id, group: p.group, title: p.title })),
  aiReadyScreenshot: () => Shots.aiReady({ deliver: false }),
  undo: () => Store.undo(),
  redo: () => Store.redo(),
  history: () => ({ depth: Store.historyDepth(), canUndo: !!Store.canUndo(), canRedo: !!Store.canRedo() }),
  setView: (id, animate = false) => Render.setView(id, animate),
  getView: () => Render.info(),
  units: Units,
  runTests: runAllTests,
  // exports
  sketchupDoc: () => SketchupExport.doc(),
  sketchupDownload: (opts) => SketchupExport.download(opts),
  dxfText: () => SketchupExport.dxfText(),
  dxfDownload: (opts) => SketchupExport.dxf(opts),
  exportJson: () => Options.exportJson(),
  importJson: (file) => Options.importFile(file),
  getDerivedSection: () => { const st = Store.snapshot(), d = Derived.get(); return FacDerivedMod.facadeDerived(st, d.built, d.metrics); },
  overlayInfo: () => Render.overlayInfo(),
  // project file (ProjectUI; tests inject storage and navigation with projectConfigure)
  projectConfigure: (o) => ProjectUI.configure(o),
  projectReset: () => ProjectUI.reset(),
  projectOpenDoc: (doc) => ProjectUI.openDoc(doc),
  projectStatus: () => ProjectUI.status(),
  projectDoc: () => ProjectUI.doc(),
  projectMassing: () => ProjectUI.massingInfo(),
  projectUseProject: () => ProjectUI.useProject({ quiet: true }),
  projectFlush: () => { ProjectUI.markDirty(); return ProjectUI.flush(); },
  projectCreate: (name) => ProjectUI.create(name, { quiet: true }),
  projectClose: () => ProjectUI.close(),
  // panels and selection (the same functions the clicks and the face card call)
  openItem: (item) => UI.openItem(item),
  setTab: (id) => UI.setTab(id),
  getTab: () => UI.activeTab(),
  select: (items) => Select.select(items),
  getSelection: () => Select.get(),
  clearSelection: () => Select.clear(),
  pickAt: (x, y) => Select.pickAt(x, y),                      // client px -> { kind: 'face', id } | null
  clickAt: (x, y) => Select.click(x, y),
  screenPointFor: (item) => Select.screenPointFor(item),      // a client point where that face can be picked
  toggleStreet: (id) => Select.toggleStreet(id),
  setStreetPick: (on) => UI.setStreetPick(on),
};
if (TEST_MODE) {
  runAllTests().then((r) => {
    document.getElementById('toasts').textContent = '';
    const msg = r.failed.length
      ? `Tests: ${r.failed.length} of ${r.total} failed. ${r.failed.map((f) => `${f.name} (${f.detail})`).join(' | ')}`
      : `Tests: all ${r.total} passed`;
    Toast.show(msg, r.failed.length ? 'bad' : 'test-pass', 0);
  });
}
