    await t('the Option menu has name, Save, Duplicate, Rename, Delete, Compare and the presets', () => {
      $('btnOption').click();
      const ids = ['optionName', 'miSave', 'miDuplicate', 'miRename', 'miDelete', 'miCompare'].filter((id) => !$(id));
      const presets = document.querySelectorAll('#optionMenu [id^="preset-"]').length;
      Pop.close();
      return eq([ids, presets === CONFIG.presets.length], [[], true]);
    });
    await t('the Export menu has Image, AI-ready image, AI Prompts, Image overlay, Export JSON, Import JSON', () => {
      $('btnExport').click();
      const missing = ['miImage', 'miAiReady', 'miAiPrompts', 'miOverlay', 'miExportJson', 'miImportJson'].filter((id) => !$(id));
      $('miOverlay').click();
      const toggles = [...document.querySelectorAll('#exportMenu [data-shot]')].map((b) => b.dataset.shot);
      Pop.close();
      return eq([missing, toggles], [[], ['title', 'date', 'metrics', 'mark']]);
    });
  } finally {
    Pop.close();
    Store.replace(savedState);
    UI.setTab(savedTab);
    UI.setHudOpen(savedHud);
    Options.holdAutosave(false);
  }
  return results;
}

/** The calculation tests plus the layout tests, merged. This is what ?test and __tower.runTests run. */
async function runAllTests() {
  const base = await runTests();
  const layout = await runLayoutTests();
  const select = await runSelectTests();
  const fresh = await runNewDesignTests();
  const sketchup = await runSketchupTests();
  const project = await runProjectTests();     // 12f_tests_project.js
  const sun = await runSunTests();             // 12g_tests_sun.js
  const nosite = await runNoSiteTests();       // 12h_tests_nosite.js
  const all = [...(base.results || []), ...layout, ...select, ...fresh, ...sketchup, ...project, ...sun, ...nosite];
  const failed = all.filter((r) => !r.ok);
  console.log(`[tests] layout ${layout.length - layout.filter((r) => !r.ok).length}/${layout.length} passed`, layout.filter((r) => !r.ok).length ? JSON.stringify(layout.filter((r) => !r.ok)) : '');
  console.log(`[tests] select ${select.length - select.filter((r) => !r.ok).length}/${select.length} passed`, select.filter((r) => !r.ok).length ? JSON.stringify(select.filter((r) => !r.ok)) : '');
  console.log(`[tests] new design ${fresh.length - fresh.filter((r) => !r.ok).length}/${fresh.length} passed`, fresh.filter((r) => !r.ok).length ? JSON.stringify(fresh.filter((r) => !r.ok)) : '');
  console.log(`[tests] sketchup ${sketchup.length - sketchup.filter((r) => !r.ok).length}/${sketchup.length} passed`, sketchup.filter((r) => !r.ok).length ? JSON.stringify(sketchup.filter((r) => !r.ok)) : '');
  console.log(`[tests] project ${project.length - project.filter((r) => !r.ok).length}/${project.length} passed`, project.filter((r) => !r.ok).length ? JSON.stringify(project.filter((r) => !r.ok)) : '');
  console.log(`[tests] sun ${sun.length - sun.filter((r) => !r.ok).length}/${sun.length} passed`, sun.filter((r) => !r.ok).length ? JSON.stringify(sun.filter((r) => !r.ok)) : '');
  window.__towerTestResults = { total: all.length, passed: all.length - failed.length, failed, results: all };
  return window.__towerTestResults;
}

/* ==========================================================================
   TESTS: v1.1 direct editing
   Click picking, the selection card, program change, copy above / below,
   handles (move with snapping, width, top), delete, shortcuts, and that the
   selection never reaches the saved state. Runs after the layout tests
   (runAllTests in 12b merges the results).
   Drags run through the same math the pointer uses (Select.simulateHandleDrag).
   The tests restore the design, the tab, the style and the view when they finish.
   ========================================================================== */
async function runSelectTests() {
  const results = [];
  const eq = (a, b) => (JSON.stringify(a) === JSON.stringify(b) ? true : `got ${JSON.stringify(a)}, expected ${JSON.stringify(b)}`);
  const near = (a, b, tol = 0.01) => (Math.abs(a - b) <= tol ? true : `got ${a}, expected ${b}`);
  const t = async (name, fn) => {
    let r;
    try { r = await fn(); } catch (e) { r = `threw ${e && e.message}`; }
    results.push({ name, ok: r === true, detail: r === true ? '' : String(r) });
  };
  const $ = (id) => document.getElementById(id);
  const frames = (n = 2) => new Promise((res) => { const f = () => (--n <= 0 ? res() : requestAnimationFrame(f)); requestAnimationFrame(f); });
  const wait = (ms) => new Promise((res) => setTimeout(res, ms));
  const key = (k, extra = {}) => window.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true, ...extra }));
  // The undo stack is capped at 50 and these tests fill it, so "one undo step" is checked by behavior: one undo returns the state
  // from before the action, and one redo puts the result back.
  const snap = () => JSON.stringify(Store.snapshot());
  const oneStep = (before) => { Store.undo(); const back = snap() === before; Store.redo(); return back; };

  const savedState = Store.snapshot(), savedTab = UI.activeTab();
  const savedView = Render.info().preset || 'axon';
  Options.holdAutosave(true);

  const seg = (floors, w, d, program = 'residential', ox = 0, oy = 0) => {
    const g = defaultSegment();
    g.floors = floors; g.shape = { type: 'rect', w, d, radius: 0, points: [] }; g.offset = { x: ox, y: oy }; g.program = program;
    return g;
  };
  /** Podium + two stacked segments + stepped crown + a corner carve + the default context block. */
  const full = () => {
    const s = defaultState();
    s.podium = { ...s.podium, on: true, floors: 3, groundFtf: 18, ftf: 14, shape: { type: 'rect', w: 220, d: 170, radius: 0, points: [] }, offset: { x: 0, y: 0 } };
    s.segments = [seg(10, 100, 100), seg(6, 60, 60, 'office')];
    s.crown = { type: 'stepped', height: 20, steps: 3, slopeSide: 'front' };
    s.carves = [{ startFloor: 6, endFloor: 8, kind: 'corner', corner: 'NE', w: 30, d: 30 }];
    return s;
  };
  /** Podium + one segment (100 x 100, centered) + no crown / carve: the snap and resize cases. */
  const one = () => {
    const s = defaultState();
    s.podium = { ...s.podium, on: true, floors: 3, groundFtf: 18, ftf: 14, shape: { type: 'rect', w: 220, d: 170, radius: 0, points: [] }, offset: { x: 0, y: 0 } };
    s.segments = [seg(10, 100, 100)];
    s.crown = { type: 'none', height: 20, steps: 3, slopeSide: 'front' };
    s.carves = [];
    return s;
  };
  /** Two stacked segments, nothing else (copy tests: GFA is plain area x floors). */
  const plain = () => {
    const s = defaultState();
    s.podium.on = false; s.crown.type = 'none'; s.carves = [];
    s.segments = [seg(10, 100, 100), seg(6, 60, 60, 'office')];
    return s;
  };
  // Synchronous on purpose: no frame is drawn between a state change and the checks, so the frame loop's animated re-frame
  // cannot move the camera under a test. (A drawn frame in swiftshader also costs ~0.5 s.)
  const load = (s, view = 'axon') => {
    Select.clear();
    Store.replace(s);
    Render.setView(view, false);
  };
  const toastText = () => [...document.querySelectorAll('#toasts .toast')].map((x) => x.textContent).join(' | ');

  try {
    /* ---- click picking ---- */
    await t('click-pick: a segment, the podium and a context block are found at their projected centers', async () => {
      load(full());
      Store.set('view.snap', { on: true, grid: 5 }, { live: false });
      const out = {};
      const s = Store.raw(), d = Derived.get();
      const mid = (box, z) => worldVec((box.minX + box.maxX) / 2, (box.minY + box.maxY) / 2, z);
      const cases = [
        ['segment0', { kind: 'segment', index: 0 }, mid(SnapMod.itemBox(s, d.plates, { kind: 'segment', index: 0 }), 4 * 14 + 50)],
        ['segment1', { kind: 'segment', index: 1 }, mid(SnapMod.itemBox(s, d.plates, { kind: 'segment', index: 1 }), 3 * 14 + 100 + 30)],
        ['podium', { kind: 'podium', index: 0 }, worldVec(-95, -70, 20)],
        ['context', { kind: 'context', index: 0 }, worldVec(0, -180, 30)],
      ];
      for (const [name, item, p] of cases) {
        const c = Select.screenPointFor(item);
        const pc = (() => { const rect = Render.canvas().getBoundingClientRect(), cam = Render.camera(); cam.updateMatrixWorld(true); const q = p.clone().project(cam); return { x: rect.left + ((q.x + 1) / 2) * rect.width, y: rect.top + ((1 - q.y) / 2) * rect.height }; })();
        const hit = Select.pickAt(pc.x, pc.y) || Select.pickAt(c.x, c.y);
        out[name] = hit ? `${hit.kind}:${hit.index}` : null;
      }
      return eq(out, { segment0: 'segment:0', segment1: 'segment:1', podium: 'podium:0', context: 'context:0' });
    });
    await t('click-pick: the crown is found, and empty sky picks nothing', async () => {
      load(full());
      const p = Select.screenPointFor({ kind: 'crown', index: 0 });
      const hit = p && Select.pickAt(p.x, p.y);
      const rect = Render.canvas().getBoundingClientRect();
      const sky = Select.pickAt(rect.left + 6, rect.top + 6);
      return eq([hit && hit.kind, sky], ['crown', null]);
    });
    await t('click-pick: a carve is pickable only while the Carves section is open or a carve is selected', async () => {
      load(full());
      UI.setTab('view');
      const hidden = [Select.carvesVisible(), Select.screenPointFor({ kind: 'carve', index: 0 })];
      UI.openItem({ kind: 'carve', index: 0 });
      const shown = Select.carvesVisible();
      const p = Select.screenPointFor({ kind: 'carve', index: 0 });
      const hit = p && Select.pickAt(p.x, p.y);
      Select.refreshOverlay();
      const dashed = Select.overlayInfo().carve;
      UI.setTab('view');
      Select.select([{ kind: 'carve', index: 0 }]);
      const viaSelection = Select.carvesVisible();
      Select.clear();
      return eq([hidden, shown, hit, dashed > 0, viaSelection], [[false, null], true, { kind: 'carve', index: 0 }, true, true]);
    });
    await t('Select.click applies shift (add) and empty space (clear)', async () => {
      load(full());
      const a = Select.screenPointFor({ kind: 'segment', index: 0 }), b = Select.screenPointFor({ kind: 'podium', index: 0 });
      Select.click(a.x, a.y, false);
      const first = Select.get();
      Select.click(b.x, b.y, true);
      const second = Select.get();
      Select.click(b.x, b.y, true);                       // shift-click on a selected item removes it
      const third = Select.get();
      const rect = Render.canvas().getBoundingClientRect();
      Select.click(rect.left + 6, rect.top + 6, true);    // shift + empty: no change
      const fourth = Select.get();
      Select.click(rect.left + 6, rect.top + 6, false);   // empty: clear
      return eq([first, second.length, third, fourth, Select.get()], [[{ kind: 'segment', index: 0 }], 2, [{ kind: 'segment', index: 0 }], [{ kind: 'segment', index: 0 }], []]);
    });
    await t('pointer events: a short still press is a click; a drag (orbit) and a long press are not', async () => {
      load(full());
      Render.setOrbitEnabled(false);                       // synthetic pointers have no capture target for the orbit controls
      try {
        const canvas = Render.canvas();
        const p = Select.screenPointFor({ kind: 'segment', index: 0 });
        const ev = (type, x, y, extra = {}) => canvas.dispatchEvent(new PointerEvent(type, { pointerId: 41, pointerType: 'mouse', button: 0, bubbles: true, clientX: x, clientY: y, ...extra }));
        ev('pointerdown', p.x, p.y); ev('pointerup', p.x + 2, p.y + 1);
        const click = Select.get();
        Select.clear();
        ev('pointerdown', p.x, p.y); ev('pointermove', p.x + 20, p.y); ev('pointerup', p.x + 20, p.y);
        const orbit = Select.get();
        ev('pointerdown', p.x, p.y); await wait(450); ev('pointerup', p.x, p.y);
        const longPress = Select.get();
        Render.setView('axon', false);                      // frames were drawn during the wait: put the camera back
        const p2 = Select.screenPointFor({ kind: 'segment', index: 0 }), q = Select.screenPointFor({ kind: 'podium', index: 0 });
        ev('pointerdown', p2.x, p2.y); ev('pointerup', p2.x, p2.y);
        ev('pointerdown', q.x, q.y, { shiftKey: true }); ev('pointerup', q.x, q.y, { shiftKey: true });
        const shift = Select.get().length;
        Select.clear();
        // two fingers: never a click
        ev('pointerdown', p2.x, p2.y); canvas.dispatchEvent(new PointerEvent('pointerdown', { pointerId: 42, pointerType: 'touch', bubbles: true, clientX: p2.x + 40, clientY: p2.y })); ev('pointerup', p2.x, p2.y);
        const pinch = Select.get();
        canvas.dispatchEvent(new PointerEvent('pointerup', { pointerId: 42, pointerType: 'touch', bubbles: true, clientX: p2.x + 40, clientY: p2.y }));
        return eq([click, orbit, longPress, shift, pinch], [[{ kind: 'segment', index: 0 }], [], [], 2, []]);
      } finally { Render.setOrbitEnabled(true); Select.clear(); }
    });
    await t('"Select more" mode adds a tapped item to the selection', async () => {
      load(full());
      const a = Select.screenPointFor({ kind: 'segment', index: 0 }), b = Select.screenPointFor({ kind: 'podium', index: 0 });
      Select.click(a.x, a.y, false);
      const btn = document.querySelector('#selection-card [data-action="more"]');
      btn.click();
      Select.click(b.x, b.y, false);
      const added = Select.get().length, pressed = btn.getAttribute('aria-pressed') || document.querySelector('#selection-card [data-action="more"]').getAttribute('aria-pressed');
      Select.clear();
      return eq([added, pressed, Select.addMode()], [2, 'true', false]);
    });

    /* ---- selection card and state ---- */
    await t('the selection card shows the item, six program buttons and the actions; Clear empties it', async () => {
      load(full());
      Select.select([{ kind: 'segment', index: 1 }]);
      const card = $('selection-card');
      const out = {
        shown: !card.hidden,
        title: card.querySelector('.sc-name').textContent,
        programs: card.querySelectorAll('.sc-pbtn').length,
        pressed: card.querySelector('.sc-pbtn[aria-pressed="true"]').dataset.program,
        actions: [...card.querySelectorAll('.sc-actions [data-action]')].map((b) => b.dataset.action).filter((a) => a !== 'more'),
      };
      card.querySelector('[aria-label="Clear selection"]').click();
      return eq([out, card.hidden, Select.get()], [{ shown: true, title: 'Segment 2', programs: 6, pressed: 'office', actions: ['copy-above', 'copy-below', 'open', 'delete'] }, true, []]);
    });
    await t('a multi-selection card says "N items", has program buttons and Delete, and no Copy or handles', async () => {
      load(full());
      Select.select([{ kind: 'segment', index: 0 }, { kind: 'segment', index: 1 }]);
      const card = $('selection-card');
      const acts = [...card.querySelectorAll('.sc-actions [data-action]')].map((b) => b.dataset.action).filter((a) => a !== 'more');
      return eq([card.querySelector('.sc-name').textContent, card.querySelectorAll('.sc-pbtn').length, acts, Select.visibleHandles()], ['2 items', 6, ['delete'], []]);
    });
    await t('selecting and clearing change nothing in the saved state and add no undo step', async () => {
      load(full());
      const before = snap(), v0 = Store.version();
      Select.select([{ kind: 'segment', index: 0 }, { kind: 'podium', index: 0 }]);
      Select.select([{ kind: 'carve', index: 0 }]);
      const during = snap();
      // Save, autosave and Export all take Store.snapshot(): its keys are exactly the design's, nothing of the selection
      const keys = JSON.stringify(Object.keys(Store.snapshot()).sort()) === JSON.stringify(Object.keys(defaultState()).sort());
      Select.clear();
      const text = during.toLowerCase();
      return eq([during === before, snap() === before, Store.version() === v0, /select|handle|outline/.test(text), keys], [true, true, true, false, true]);
    });
    await t('Escape clears the selection; shortcuts are ignored while a text field has focus', async () => {
      load(full());
      Select.select([{ kind: 'segment', index: 0 }]);
      const input = document.createElement('input');
      input.type = 'text'; document.body.append(input); input.focus();
      key('Escape'); key('4'); key('d');
      const kept = [Select.get().length, Render.info().preset, Store.get('view.style')];
      input.blur(); input.remove();
      key('Escape');
      return eq([kept, Select.get().length], [[1, 'axon', 'model'], 0]);
    });
    await t('keys 1-6 pick the views and D toggles Model / Diagram', async () => {
      load(full());
      const got = [];
      for (const k of ['1', '2', '3', '4', '5', '6']) { key(k); got.push(Render.info().preset); }
      key('d'); const diagram = Store.get('view.style');
      key('D'); const model = Store.get('view.style');
      return eq([got, diagram, model], [['axon', 'n', 'e', 's', 'w', 'plan'], 'diagram', 'model']);
    });
    await t('shortcuts are ignored while a menu is open', async () => {
      load(full());
      Select.select([{ kind: 'segment', index: 0 }]);
      $('btnExport').click();
      const open = Pop.isOpen();
      key('Backspace'); key('3');
      const same = [Store.raw().segments.length, Render.info().preset];
      Pop.close();
      Select.clear();
      return eq([open, same], [true, [2, 'axon']]);
    });
    await t('clicking a segment row title in the panel selects it in the view (two-way link)', async () => {
      load(full());
      UI.setTab('form');
      UI.openItem({ kind: 'segment', index: 1 });
      const head = document.querySelector('#sections [data-section="segments"] .item[data-index="1"] .item-title');
      head.click();
      const sel = Select.get();
      const marked = document.querySelectorAll('#sections [data-section="segments"] .item.sel-row').length;
      return eq([sel, marked], [[{ kind: 'segment', index: 1 }], 1]);
    });
    await t('"Open in panel" opens the item in its tab', async () => {
      load(full());
      UI.setTab('view');
      Select.select([{ kind: 'context', index: 0 }]);
      document.querySelector('#selection-card [data-action="open"]').click();
      const out = [UI.activeTab(), document.querySelector('#sections [data-section="context"]').dataset.open];
      Select.clear();
      return eq(out, ['site', 'true']);
    });

    /* ---- program, copy, delete ---- */
    await t('a program button on 2 selected segments is ONE undo step', async () => {
      load(plain());
      Select.select([{ kind: 'segment', index: 0 }, { kind: 'segment', index: 1 }]);
      const before = snap();
      document.querySelector('#selection-card .sc-pbtn[data-program="hotel"]').click();
      const after = Store.raw().segments.map((g) => g.program);
      const one = oneStep(before);
      Store.undo();
      const undone = Store.raw().segments.map((g) => g.program);
      return eq([after, one, undone], [['hotel', 'hotel'], true, ['residential', 'office']]);
    });
    await t('podium program rows set the ground and the upper program separately', async () => {
      load(full());
      Select.select([{ kind: 'podium', index: 0 }]);
      const rows = document.querySelectorAll('#selection-card .sc-prog');
      rows[0].querySelector('[data-program="hotel"]').click();
      rows[1].querySelector('[data-program="parking"]').click();
      return eq([Store.raw().podium.program, Store.raw().podium.upperProgram, rows.length], ['hotel', 'parking', 2]);
    });
    await t('Copy above adds a segment on top: floors and GFA grow by the copy, one undo restores', async () => {
      load(plain());
      const m0 = Derived.get().metrics, before = snap();
      Select.select([{ kind: 'segment', index: 0 }]);
      document.querySelector('#selection-card [data-action="copy-above"]').click();
      const m1 = Derived.get().metrics;
      const out = [Store.raw().segments.length, m1.floorCount - m0.floorCount, Math.round(m1.gfa - m0.gfa), oneStep(before), Select.get(), Store.raw().segments[1].floors];
      Store.undo();
      const back = [Store.raw().segments.length, Derived.get().metrics.floorCount, Math.round(Derived.get().metrics.gfa)];
      return eq([out, back], [[3, 10, 100000, true, [{ kind: 'segment', index: 1 }], 10], [2, m0.floorCount, Math.round(m0.gfa)]]);
    });
    await t('Copy below puts the copy under the original and selects it; one undo restores', async () => {
      load(plain());
      const m0 = Derived.get().metrics, before = snap();
      Select.select([{ kind: 'segment', index: 1 }]);
      document.querySelector('#selection-card [data-action="copy-below"]').click();
      const m1 = Derived.get().metrics;
      const g = Store.raw().segments;
      const out = [g.length, m1.floorCount - m0.floorCount, Math.round(m1.gfa - m0.gfa), oneStep(before), Select.get(), g.map((x) => x.floors)];
      Store.undo();
      return eq([out, Store.raw().segments.length], [[3, 6, 21600, true, [{ kind: 'segment', index: 1 }], [10, 6, 6]], 2]);
    });
    await t('Cmd+D copies the selected segment above', async () => {
      load(plain());
      Select.select([{ kind: 'segment', index: 0 }]);
      key('d', { metaKey: true });
      return eq([Store.raw().segments.length, Select.get()], [3, [{ kind: 'segment', index: 1 }]]);
    });
    await t('Delete removes the selected segment; undo brings it back', async () => {
      load(plain());
      Select.select([{ kind: 'segment', index: 1 }]);
      const before = snap();
      document.querySelector('#selection-card [data-action="delete"]').click();
      const after = [Store.raw().segments.length, oneStep(before), Select.get()];
      Store.undo();
      return eq([after, Store.raw().segments.length], [[1, true, []], 2]);
    });
    await t('the Delete key removes a multi-selection in one undo step (segment, podium, context, carve, crown)', async () => {
      load(full());
      Select.select([{ kind: 'segment', index: 1 }, { kind: 'podium', index: 0 }, { kind: 'context', index: 0 }, { kind: 'carve', index: 0 }, { kind: 'crown', index: 0 }]);
      const before = snap();
      key('Delete');
      const s = Store.raw();
      const after = [s.segments.length, s.podium.on, s.context.blocks.length, s.carves.length, s.crown.type, oneStep(before)];
      Store.undo();
      const u = Store.raw();
      return eq([after, [u.segments.length, u.podium.on, u.context.blocks.length, u.carves.length, u.crown.type]], [[1, false, 0, 0, 'none', true], [2, true, 1, 1, 'stepped']]);
    });
    await t('the last segment cannot be deleted (a toast says why)', async () => {
      load(one());
      Select.select([{ kind: 'segment', index: 0 }]);
      const v0 = Store.version();
      document.querySelector('#selection-card [data-action="delete"]').click();
      const text = toastText();
      return eq([Store.raw().segments.length, Store.version() === v0, /at least one segment/.test(text)], [1, true, true]);
    });
    await t('deleting every segment in a multi-selection keeps one', async () => {
      load(plain());
      Select.select([{ kind: 'segment', index: 0 }, { kind: 'segment', index: 1 }]);
      key('Backspace');
      return eq(Store.raw().segments.length, 1);
    });

    /* ---- handles ---- */
    await t('handles: all five in the axon, only the sensible ones in N / E and Plan; none for crown, carve or a multi-selection', async () => {
      load(one());
      Select.select([{ kind: 'segment', index: 0 }]);
      const ids = (v) => { Render.setView(v, false); return Select.visibleHandles().sort(); };
      const got = { axon: ids('axon'), n: ids('n'), e: ids('e'), s: ids('s'), plan: ids('plan') };
      Render.setView('axon', false);
      Select.select([{ kind: 'crown', index: 0 }]);
      const crown = Select.visibleHandles();
      Select.select([{ kind: 'segment', index: 0 }, { kind: 'podium', index: 0 }]);
      const multi = Select.visibleHandles();
      Select.select([{ kind: 'podium', index: 0 }]);
      const podium = Select.visibleHandles().sort();
      Select.select([{ kind: 'context', index: 0 }]);
      const context = Select.visibleHandles().sort();
      Select.clear();
      return eq([got, crown, multi, podium, context], [
        { axon: ['depth', 'move-x', 'move-y', 'top', 'width'], n: ['move-x', 'top', 'width'], e: ['depth', 'move-y', 'top'], s: ['move-x', 'top', 'width'], plan: ['depth', 'move-x', 'move-y', 'width'] },

async function runSketchupTests() {
  const results = [];
  const t = async (name, fn) => {
    let r;
    try { r = await fn(); } catch (e) { r = `threw ${e && e.message}`; }
    results.push({ name, ok: r === true, detail: r === true ? '' : String(r) });
  };
  const savedState = Store.snapshot();
  Options.holdAutosave(true);
  try {
    await t('the Export menu has "SketchUp (.json)" with the extension hint', async () => {
      const btn = document.getElementById('btnExport');
      btn.click();
      await new Promise((r) => setTimeout(r, 60));
      const mi = document.getElementById('miSketchup');
      const text = mi ? mi.textContent : '';
      Pop.close();
      return mi && /SketchUp \(\.json\)/.test(text) && /Import with the CMRLM SketchUp extension/.test(text) ? true : `got ${JSON.stringify(text)}`;
    });
    await t('__tower.sketchupDoc() validates, is a tower document, and its floors match the plates', async () => {
      Store.replace(defaultState());
      const d = window.__tower.sketchupDoc();
      const v = SkFmt.validateDoc(d);
      if (!v.ok) return v.errors.join('; ');
      const plates = Derived.get().plates.filter((p) => !p.void).length;
      const floors = [];
      (function walk(n) { if (n.attributes && n.attributes.floor != null) floors.push(n); (n.children || []).forEach(walk); })(d.root);
      return d.source === 'tower' && d.zShift === 0 && floors.length === plates ? true : `source ${d.source}, floors ${floors.length}, plates ${plates}`;
    });
    await t('Export downloads <option>-<date>.sketchup.json as JSON that validates', async () => {
      Store.replace({ ...defaultState(), name: 'Option A' });
      let got = null;
      const r = SketchupExport.download({ deliver: (blob, name) => { got = { blob, name }; } });
      if (!r.ok || !got) return `download failed ${JSON.stringify(r.errors)}`;
      const text = await got.blob.text();
      const back = JSON.parse(text);
      const ok = /^option-a-\d{4}-\d{2}-\d{2}\.sketchup\.json$/.test(got.name) && got.name === SkFmt.sketchupFilename('Option A') && got.blob.type === 'application/json' && SkFmt.validateDoc(back).ok;
      return ok ? true : `name ${got.name}, type ${got.blob.type}`;
    });
  } finally {
    Select.clear();
    Store.replace(savedState);
    Options.holdAutosave(false);
  }
  return results;
}

/* ==========================================================================
   TESTS: project file, placement, context from site, migration (docs/tower-project-sun-plan.md section 9.2)
   Open a project with a site, place the tower on it, load the neighbors, write the massing section (1 s debounce) and the sun
   section, keep every other section, the Mid-Rise replace question, a newer schema, Send to, import, close, and the schema 1 -> 2
   migration. A fixture project lives in an in-memory storage, so a ?test visit never touches the saved projects.
   runAllTests in 12b merges the results.
   ========================================================================== */
const ProjectFixture = (() => {
  const memory = () => ({ data: {}, getItem(k) { return this.data[k] === undefined ? null : this.data[k]; }, setItem(k, v) { this.data[k] = String(v); }, removeItem(k) { delete this.data[k]; } });
  const S = 1000, N = 11, SPACING = 100;
  /** A 1000 ft site square with a sloping ground (z = 1000 + 0.01 x + 0.02 y), a near building and a far one. */
  function siteProject({ withMassing = null, withPlates = false, withGrading = null, withSun = null } = {}) {
    let doc = ProjectMod.newProject({ name: 'Fixture', frame: { kind: 'site', lat: 33.927, lon: -84.339, size: S } });
    const points = [];
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) points.push([i * SPACING, j * SPACING, 1000 + 0.01 * i * SPACING + 0.02 * j * SPACING]);
    const derived = {
      address: 'Fixture', lat: 33.927, lon: -84.339, size: S, release: 'test',
      boundary: [[0, 0], [S, 0], [S, S], [0, S]], ground: { spacing: SPACING, n: N, points },
      buildings: [
        { id: 'near', outer: [[480, 380], [560, 380], [560, 420], [480, 420]], holes: [], base: 1010, height: 40, top: 1050, floors: 3, rule: 'data', name: 'Near' },
        { id: 'far', outer: [[950, 950], [990, 950], [990, 990], [950, 990]], holes: [], base: 1030, height: 30, top: 1060, floors: 2, rule: 'data', name: 'Far' },
      ],
      roads: { segments: [], pavement: [] }, walks: null, trees: [], water: { areas: [], lines: [] },
    };
    doc = ProjectMod.writeSection(doc, 'site', { tool: 'site', schema: 1, placement: { x: 0, y: 0, rotation: 0, baseZ: 0 }, state: { query: 'Fixture', lat: 33.927, lon: -84.339, size: S, release: 'test', walks: false }, derived });
    if (withMassing) doc = ProjectMod.writeSection(doc, 'massing', withMassing);
    if (withPlates) doc = ProjectMod.writeSection(doc, 'plates', { tool: 'plate', schema: 1, placement: { x: 1, y: 2, rotation: 0, baseZ: 3 }, state: { keep: 'me' }, derived: { levels: [] } });
    if (withGrading) doc = ProjectMod.writeSection(doc, 'grading', { tool: 'grading', schema: 1, placement: { x: 0, y: 0, rotation: 0, baseZ: 0 }, state: {}, derived: withGrading });
    if (withSun) doc = ProjectMod.writeSection(doc, 'sun', withSun);
    return doc;
  }
  return { memory, siteProject, S };
})();

async function runProjectTests() {
  const results = [];
  const eq = (a, b) => (JSON.stringify(a) === JSON.stringify(b) ? true : `got ${JSON.stringify(a)}, expected ${JSON.stringify(b)}`);
  const near = (a, b, tol = 1e-9) => (Math.abs(a - b) <= tol ? true : `got ${a}, expected ${b}`);
  const t = async (name, fn) => {
    let r;

    results.push({ name, ok: r === true, detail: r === true ? '' : String(r) });
  };
  const $ = (id) => document.getElementById(id);
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const steps = (fn) => { const d0 = Store.historyDepth(); fn(); return Store.historyDepth() - d0; };

  const savedState = Store.snapshot(), savedTab = UI.activeTab();
  Options.holdAutosave(true);
  const mem = ProjectFixture.memory();

  const stored = (id) => ProjectMod.loadProject(mem, id);

  const fresh = () => { Store.replace(fillDefaults(defaultState()), { resetHistory: true }); };
  const towerMassing = (state, placement) => {
    const d = computeDerived(state);
    return { tool: 'tower', schema: 1, placement: placement || { x: 300, y: 400, rotation: 15, baseZ: 1020 }, state, derived: TowerDerivedMod.towerDerived(state, d, d.metrics) };

    /* ---- new, send, import, close ---- */
    await t('New project (no site) holds the design with a zero placement and a local frame; the Site tab section shows', () => {

    await t('the Export menu has the three Send items, enabled', async () => {

    await t('Send to Plate Planner saves the project, logs the send, and opens ../plate/?project=<id>', async () => {
      navs.length = 0;
      const id = ProjectUI.doc().id;

    });
    await t('Send to Facade Studio opens ../facade/?project=<id>; Send to Grading Sketch opens ../grading/?project=<id>', async () => {
      navs.length = 0;
      const id = ProjectUI.doc().id;
      await ProjectUI.send('facade');

      return eq([navs, log.slice(-2)], [[`../facade/?project=${encodeURIComponent(id)}`, `../grading/?project=${encodeURIComponent(id)}`], ['tower → facade', 'tower → grading']]);
    });
    await t('Send with no project open makes one first; an unknown tool is refused', async () => {

    });
    await t('Import opens the imported project (a taken id becomes a copy named "(2)")', async () => {
      const doc = ProjectFixture.siteProject();
      ProjectMod.saveProject(mem, doc);
      const file = new Blob([JSON.stringify(doc)], { type: 'application/json' });
      const got = await ProjectUI.importFile(file);
      return eq([!!got, got && got.name, got && got.id !== doc.id, ProjectUI.doc().id === got.id, urls.at(-1) === got.id], [true, 'Fixture (2)', true, true, true]);
    });
    await t('Export names the file from the project name (the Export item is enabled with a project)', () => {
      const e = ProjectMod.exportProject(ProjectUI.doc());
      $('btnProject').click();
      const exp = document.querySelector('#projectMenu [data-proj="export"]');
      const enabled = exp && !exp.disabled;
      Pop.close();
      return eq([e.filename, enabled], ['fixture-2.cmrlm.json', true]);
    });
    await t('Close project forgets the project and clears the placement; the saved copy stays; the Site section hides', () => {
      const id = ProjectUI.doc().id;
      ProjectUI.close();
      const sec = document.querySelector('#tabpanel-site [data-section="project"]');
      return eq([ProjectUI.has(), Store.get('placement'), Store.get('context.fromSite'), !!stored(id), $('projPill').hidden, sec && sec.hidden], [false, null, false, true, true, true]);
    });
    await t('the Project menu lists the saved projects to open', () => {
      $('btnProject').click();
      const opens = [...document.querySelectorAll('#projectMenu [data-proj="open"]')].length;
      const items = [...document.querySelectorAll('#projectMenu [data-proj]')].map((b) => b.dataset.proj);
      Pop.close();
      return opens > 0 && ['new', 'import', 'export', 'close'].every((k) => items.includes(k)) || `items ${items}`;
    });
  } finally {
    ProjectUI.reset();
    ProjectUI.restoreDefaults();
    Select.clear();
    Store.replace(savedState);
    UI.setTab(savedTab);
    Options.holdAutosave(false);
  }
  return results;
}

/* ==========================================================================
   TESTS: sun study, sun hours, shadow study sheet (docs/tower-project-sun-plan.md section 9.2)
   The Sun section (mode, date, time, place, time zone, Play), the light that follows the real sun (also turned by the
   placement rotation), shadows off below the horizon, the sun-hours compute (slices, Cancel, out of date, Diagram), the
   project hand-off and the 3 x 3 shadow study sheet. runAllTests in 12b merges the results.
   ========================================================================== */
async function runSunTests() {
  const results = [];
  const eq = (a, b) => (JSON.stringify(a) === JSON.stringify(b) ? true : `got ${JSON.stringify(a)}, expected ${JSON.stringify(b)}`);
  const within = (a, b, tol) => (Math.abs(a - b) <= tol ? true : `got ${a}, expected ${b} (tolerance ${tol})`);
  const t = async (name, fn) => {
    let r;
    try { r = await fn(); } catch (e) { r = `threw ${e && e.message}`; }
    results.push({ name, ok: r === true, detail: r === true ? '' : String(r) });
  };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const frames = (n) => new Promise((resolve) => { let left = n; const step = () => { if (--left <= 0) resolve(); else requestAnimationFrame(step); }; requestAnimationFrame(step); setTimeout(resolve, 300 * n); });
  const $q = (sel) => document.querySelector(sel);
  const YEAR = new Date().getFullYear();
  const ATL = SolarMod.ATLANTA;
  const truePos = (md, minutes, tz = 'us-eastern', lat = ATL.lat, lon = ATL.lon) => SolarMod.sunPosition(lat, lon, SolarMod.localToUTC(`${YEAR}-${md}`, minutes, tz));
  const hasGL = Render.ready();

  const savedState = Store.snapshot(), savedTab = UI.activeTab();
  Options.holdAutosave(true);
  SunUI.play(false);
  SunLayer.clear();
  const mem = ProjectFixture.memory();
  const origWrite = ProjectUI.writeSun;
  const writes = [];
  const fresh = () => { Store.replace(fillDefaults(defaultState()), { resetHistory: true }); };
  const setStudy = (patch) => SunUI.setSun({ mode: 'study', ...patch });
  const timings = {};

  try {
    fresh();

    /* ---- the section ---- */
    await t('the Sun section starts in Manual mode with the azimuth and altitude sliders, and no study controls', () => {
      UI.setTab('view');
      const sec = $q('#tabpanel-view [data-section="sun"]');
      const mode = $q('[data-sun="mode"]');
      const labels = [...sec.querySelectorAll('.ctl-label')].filter((l) => l.offsetParent !== null).map((l) => l.textContent).join('|');
      const dates = $q('[data-sun="date-presets"]');
      return eq([!!sec, mode && mode.value, /Sun azimuth/.test(labels) && /Sun altitude/.test(labels), dates && dates.offsetParent === null], [true, 'manual', true, true]);
    });
    await t('choosing Date and time shows the date buttons Mar 20, Jun 21, Dec 21, the time buttons 9:00, 12:00, 15:00, Play and the place and time zone', () => {
      const mode = $q('[data-sun="mode"]');
      mode.value = 'study';
      mode.dispatchEvent(new Event('change', { bubbles: true }));
      const txt = (sel) => [...document.querySelectorAll(sel)].map((b) => b.textContent);
      const vis = (sel) => { const e = $q(sel); return !!e && e.offsetParent !== null; };
      return eq([SunUI.info().mode, txt('[data-sun="date-presets"] button'), txt('[data-sun="time-presets"] button'), vis('[data-sun="play"]'), vis('[data-sun="place"]'), vis('[data-sun="tz"]'), vis('[data-sun="compute"]'), vis('[data-sun="sheet"]')],
        ['study', ['Mar 20', 'Jun 21', 'Dec 21'], ['9:00', '12:00', '15:00'], true, true, true, true, true]);
    });
    await t('a date button and a time button set the date and time, and the light follows: Jun 21 12:00 Atlanta is azimuth 108.9, altitude 66.0', () => {
      document.querySelector('[data-sun="date-presets"] button[data-value="06-21"]').click();
      document.querySelector('[data-sun="time-presets"] button[data-value="720"]').click();
      const i = SunUI.info(), v = Store.get('view.sun');
      return eq([i.date, i.time, Math.abs(v.azimuth - 108.87) < 0.2, Math.abs(v.altitude - 65.96) < 0.2], ['06-21', 720, true, true]);
    });
    await t('Jun 21 15:00 (the screenshot case) matches SolarMod: view.sun = the true bearing and altitude, rounded to 0.1', () => {
      document.querySelector('[data-sun="time-presets"] button[data-value="900"]').click();
      const p = truePos('06-21', 900), v = Store.get('view.sun');
      const a = within(v.azimuth, p.azimuth, 0.06);
      return a === true ? within(v.altitude, p.altitude, 0.06) : a;
    });
    await t('the readout shows azimuth, altitude, sunrise, sunset and solar noon for the date', () => {
      const text = $q('[data-sun="readout"]').textContent;
      const i = SunUI.info(), tm = SolarMod.sunTimes(ATL.lat, ATL.lon, `${YEAR}-06-21`, 'us-eastern');
      return eq([/Azimuth/.test(text), /Altitude/.test(text), /Sunrise/.test(text), /Sunset/.test(text), /Solar noon/.test(text), Math.abs(i.sunrise - tm.sunrise) < 0.01, Math.abs(i.sunrise - 383) < 8, text.includes(SunUI.hm(tm.sunrise)), text.includes(SunUI.hm(tm.sunset))],
        [true, true, true, true, true, true, true, true, true]);
    });
    await t('the time slider runs from sunrise to sunset in 15-minute steps, and a drag is one undo step', () => {
      const r = $q('[data-sun="time-slider"]');
      const i = SunUI.info();
      const d0 = Store.historyDepth();
      r.value = 780;
      r.dispatchEvent(new Event('input', { bubbles: true }));
      r.value = 810;
      r.dispatchEvent(new Event('input', { bubbles: true }));
      r.dispatchEvent(new Event('change', { bubbles: true }));
      return eq([+r.step, +r.min <= i.sunrise && i.sunrise - +r.min < 15, +r.max >= i.sunset && +r.max - i.sunset < 15, SunUI.info().time, Store.historyDepth() - d0], [15, true, true, 810, 1]);
    });
    await t('every change is one undo step and undo returns the date, the time and the light together', () => {
      document.querySelector('[data-sun="time-presets"] button[data-value="540"]').click();
      const after = { time: SunUI.info().time, v: Store.get('view.sun') };
      const d0 = Store.historyDepth();
      document.querySelector('[data-sun="time-presets"] button[data-value="900"]').click();
      const one = Store.historyDepth() - d0;
      Store.undo();
      const back = { time: SunUI.info().time, v: Store.get('view.sun') };
      return eq([one, back], [1, after]);
    });

    /* ---- real shadows ---- */
    await t('a placement rotation of 90 turns the light: view.sun azimuth = (true bearing + 90) mod 360, and 0 turns it back', () => {
      setStudy({ date: '06-21', time: 900 });
      const p = truePos('06-21', 900);
      const a0 = Store.get('view.sun').azimuth;
      Store.set('placement', { x: 0, y: 0, rotation: 90, baseZ: 0 }, { live: false });
      const a90 = Store.get('view.sun').azimuth;
      const want = SolarMod.localBearing(p.azimuth, 90);
      Store.set('placement', null, { live: false });
      const a00 = Store.get('view.sun').azimuth;
      const r = within(a90, want, 0.06);
      return r === true ? eq([Math.abs(a0 - p.azimuth) < 0.06, a00], [true, a0]) : r;
    });
    await t('the light and the shadows follow in the 3D view (casters stay on while the time slider moves)', async () => {
      if (!hasGL) return true;
      setStudy({ date: '12-21', time: 900 });
      await frames(3);
      const live = Store.get('view.shadows');
      return eq([live, Store.get('view.sun').altitude > 15 && Store.get('view.sun').altitude < 30], [true, true]);
    });
    await t('below the horizon (2:00): shadows turn off, the readout says so, the light stays at 3 degrees; at noon the shadows come back', () => {
      setStudy({ date: '03-20', time: 120 });
      const i = SunUI.info();
      const note = $q('[data-sun="read-note"]');
      const off = [i.below, Store.get('view.shadows'), Store.get('view.sun').altitude, /below the horizon/i.test(note.textContent)];
      setStudy({ time: 720 });
      return eq([off, SunUI.info().below, Store.get('view.shadows')], [[true, false, 3, true], false, true]);
    });
    await t('a shadows switch the user turned off is not turned on again by the sun coming up', () => {
      setStudy({ date: '03-20', time: 720 });
      Store.set('view.shadows', false, { live: false });
      setStudy({ time: 120 });
      setStudy({ time: 720 });
      const r = Store.get('view.shadows');
      Store.set('view.shadows', true, { live: false });
      return eq(r, false);
    });
    await t('going back to Manual keeps the last light on the azimuth and altitude sliders and turns shadows back on', () => {
      setStudy({ date: '03-20', time: 120 });
      const v = deepClone(Store.get('view.sun'));
      SunUI.setSun({ mode: 'manual' });
      return eq([Store.get('view.shadows'), Store.get('view.sun'), SunUI.info().mode], [true, v, 'manual']);
    });

    /* ---- place and time zone ---- */
    await t('Atlanta is the default place; typed latitude and longitude move the sun (noon Mar 20, 40.7, -74.0)', () => {
      setStudy({ date: '03-20', time: 720, place: { source: 'default' } });
      const atl = SunUI.info();
      SunUI.setSun({ place: { source: 'typed', lat: 40.7, lon: -74.0 } });
      const ny = SunUI.info();
      const want = truePos('03-20', 720, 'us-eastern', 40.7, -74.0);
      const r = within(ny.altitude, want.altitude, 0.01);
      SunUI.setSun({ place: { source: 'default' } });
      return r === true ? eq([atl.place.label, ny.place.label, ny.altitude < atl.altitude], ['Atlanta', 'Typed place', true]) : r;
    });
    await t('Site without a project falls back to Atlanta and says so', () => {
      SunUI.setSun({ place: { source: 'site' } });
      const i = SunUI.info();
      const note = $q('[data-sun="place-note"]').textContent;
      const opt = $q('[data-sun="place"] option[value="site"]');
      SunUI.setSun({ place: { source: 'default' } });
      return eq([i.place.source, /no site/i.test(note), opt.disabled], ['default', true, true]);
    });
    await t('the time zone changes the sun for the same clock time: Fixed UTC-5 at 12:00 on Mar 20 is one hour later in the day than Eastern daylight', () => {
      setStudy({ date: '03-20', time: 720, tz: { zone: 'us-eastern' } });
      const dst = SunUI.info();
      SunUI.setSun({ tz: { zone: 'fixed', offset: -5 } });
      const fixed = SunUI.info();
      SunUI.setSun({ tz: { zone: 'us-eastern', offset: -5 } });
      return eq([dst.tz.offset, fixed.tz.offset, fixed.azimuth > dst.azimuth + 8, Math.abs(fixed.altitude - truePos('03-20', 780).altitude) < 0.01], [-4, -5, true, true]);
    });

    /* ---- play ---- */
    await t('Play advances the time (one hour per second) as one undo step, and Stop leaves a whole minute', async () => {
      setStudy({ date: '06-21', time: 600 });
      const d0 = Store.historyDepth();
      SunUI.play(true);
      const on = SunUI.info().playing;
      await wait(800);
      const mid = SunUI.info().time;
      SunUI.play(false);
      const end = SunUI.info();
      const ok = on && mid > 600 + 10 && mid < 600 + 120 && !end.playing && end.time === Math.round(end.time);
      return ok || `on ${on}, mid ${mid}, end ${JSON.stringify([end.playing, end.time])}`;
    });
    await t('Play stops by itself at sunset', async () => {
      setStudy({ date: '06-21', time: 600 });
      const i = SunUI.info();
      SunUI.setSun({ time: Math.floor(i.sunset) - 20 });
      SunUI.play(true);
      await wait(900);
      const end = SunUI.info();
      return eq([end.playing, end.time <= i.sunset, end.time >= Math.floor(i.sunset) - 1], [false, true, true]);
    });
    await t('Play from manual mode switches to the study; the Play button shows Stop while it runs', async () => {
      SunUI.setSun({ mode: 'manual', time: 600 });
      SunUI.play(true);
      const btn = $q('[data-sun="play"]');
      const r = [SunUI.info().mode, SunUI.info().playing, btn.textContent];
      SunUI.play(false);
      return eq([r, btn.textContent], [['study', true, 'Stop'], 'Play']);
    });

    /* ---- sun hours ---- */
    await t('Compute on a small grid (local, 20 ft, 60 min) finishes, shows the layer and the legend, and uses a nearest-filter texture at 75 percent', async () => {
      fresh();
      setStudy({ date: '03-20', time: 720, hours: { spacing: 20, step: 60, date: '03-20', extent: 'local' } });
      const t0 = performance.now();
      const r = await SunUI.compute();
      timings.small = { ms: Math.round(performance.now() - t0), computeMs: r.computeMs, nodes: r.nodes, samples: r.samples };
      if (!hasGL) return r.cancelled === false || 'cancelled';
      await frames(3);
      const i = SunLayer.info();
      const leg = $q('#sunLegend');
      return eq([r.cancelled, r.nodes === r.nx * r.ny, i.shown, !!(leg && !leg.hidden), i.texture && i.texture.filter, i.texture && i.texture.opacity, i.texture && i.texture.w === r.nx, SunUI.info().hours.on],
        [false, true, true, true, 'nearest', 0.75, true, true]);
    });
    await t('the grid is the tower site rectangle plus 300 ft on each side, in the local frame, with the day length at the open nodes', () => {
      const s = SunLayer.info().result, d = Derived.get().bounds;
      const ext = (b) => [b.maxX - b.minX + 600, b.maxY - b.minY + 600];
      const want = [Math.floor((Math.max(d.site.maxX, d.union.maxX) - Math.min(d.site.minX, d.union.minX) + 600) / 20) + 1, Math.floor((Math.max(d.site.maxY, d.union.maxY) - Math.min(d.site.minY, d.union.minY) + 600) / 20) + 1];
      const day = (SolarMod.sunTimes(ATL.lat, ATL.lon, `${YEAR}-03-20`, 'us-eastern'));
      const len = (day.sunset - day.sunrise) / 60;
      const r = eq([s.frame, s.nx, s.ny, s.spacing], ['local', want[0], want[1], 20]);
      return r === true ? within(s.max, len, 0.02) : r;
    });
    await t('nodes in the tower shadow get fewer hours than open nodes; the tower footprint is shaded the whole day', () => {
      const s = SunLayer.info().result;
      const inFootprint = SunLayer.hoursAt(0, 0), north = SunLayer.hoursAt(0, 80), open = SunLayer.hoursAt(-280, -280);
      return eq([inFootprint === 0, north < s.max - 2, north > 0, Math.abs(open - s.max) < 0.02], [true, true, true, true]);
    });
    await t('the project hand-off: the finished result goes to ProjectUI.writeSun with a matching hours array, rounded by the project', async () => {
      ProjectUI.writeSun = (r) => { writes.push(r); return origWrite(r); };
      setStudy({ hours: { spacing: 20, step: 60, extent: 'local' } });
      await SunUI.compute();
      ProjectUI.writeSun = origWrite;
      const r = writes[writes.length - 1];
      return eq([writes.length, !!r, r && r.hours.length === r.nx * r.ny, r && r.frame, r && r.spacing, r && r.date, r && r.step], [1, true, true, 'local', 20, '03-20', 60]);
    });
    await t('a form change after a compute marks it Out of date and keeps the old colors; a new compute clears the mark', async () => {
      if (!hasGL) return true;
      const idBefore = SunLayer.info().result.id;
      Store.set('segments.0.floors', 12, { live: false });
      await frames(3);
      const stale = SunLayer.info().stale, badge = $q('[data-sun="stale"]'), legend = $q('[data-sun="legend-stale"]');
      const shown = SunLayer.info().shown, same = SunLayer.info().result.id;
      const badgeHidden = badge && badge.hidden;
      await SunUI.compute();
      await frames(2);
      return eq([stale, badge && badgeHidden === false, !!legend, shown, same === idBefore, SunLayer.info().stale, SunLayer.info().result.id > idBefore], [true, true, true, true, true, false, true]);
    });
    await t('changing the date, the step or the spacing also marks the result out of date', async () => {
      if (!hasGL) return true;
      await frames(2);
      const out = [];
      for (const patch of [{ date: '06-21' }, { step: 30 }, { spacing: 10 }]) {
        SunUI.setSun({ hours: patch });
        await frames(2);
        out.push(SunLayer.info().stale);
        SunUI.setSun({ hours: { date: '03-20', step: 60, spacing: 20 } });
        await frames(2);
        out.push(SunLayer.info().stale);
      }
      return eq(out, [true, false, true, false, true, false]);
    });
    await t('the sun-hours layer hides in Diagram style and shows again in Model style; Show off hides it', async () => {
      if (!hasGL) return true;
      await frames(2);
      Store.set('view.style', 'diagram', { live: false });
      await frames(3);
      const dia = [SunLayer.info().shown, $q('#sunLegend').hidden];
      Store.set('view.style', 'model', { live: false });
      await frames(3);
      const mod = SunLayer.info().shown;
      SunUI.setSun({ hours: { on: false } });
      await frames(3);
      const off = SunLayer.info().shown;
      SunUI.setSun({ hours: { on: true } });
      await frames(3);
      return eq([dia, mod, off, SunLayer.info().shown], [[false, true], true, false, true]);
    });
    await t('the sun-hours layer is part of the sun group, which the AI-ready image hides', async () => {
      if (!hasGL) return true;
      const before = SunLayer.info().shown;
      const blob = await window.__tower.aiReadyScreenshot();
      await frames(2);
      return eq([before, !!blob && blob.size > 1000, SunLayer.info().shown], [true, true, true]);
    });
    await t('Cancel stops a compute between slices: the promise says cancelled, the old result stays', async () => {
      const idBefore = SunLayer.info().result.id;
      SunUI.setSun({ hours: { spacing: 5, step: 15, extent: 'local' } });
      const p = SunUI.compute();
      const busy = SunUI.info().hours.computing;
      SunUI.cancel();
      const r = await p;
      const bar = $q('[data-sun="cancel"]');
      SunUI.setSun({ hours: { spacing: 20, step: 60 } });
      return eq([busy, r.cancelled, SunLayer.info().result.id === idBefore, SunUI.info().hours.computing, bar.hidden], [true, true, true, false, true]);
    });
    await t('the page stays responsive during a compute (a frame callback runs between slices) and the progress bar fills', async () => {
      SunUI.setSun({ hours: { spacing: 5, step: 15, extent: 'local' } });
      const p = SunUI.compute();
      let ticks = 0, sawProgress = false;
      const timer = setInterval(() => { ticks++; const pr = SunUI.info().hours.progress; if (pr && pr.done > 0 && pr.total > 0) sawProgress = true; }, 5);
      const bar = $q('[data-sun="progress"]');
      const shownBar = bar && !bar.hidden;
      const r = await p;
      clearInterval(timer);
      timings.fine = { ms: r.ms, computeMs: r.computeMs, nodes: r.nodes, samples: r.samples };
      SunUI.setSun({ hours: { spacing: 20, step: 60 } });
      return eq([r.cancelled, shownBar, ticks > 0 || r.ms < 30, sawProgress || r.ms < 30], [false, true, true, true]);
    });
    await t('Compute with a project site uses the site square in the project frame; the open ground gets the full day and the near building shades its north side', async () => {
      ProjectUI.reset();
      ProjectUI.configure({ storage: mem, navigate: () => {}, updateUrl: () => {} });
      const doc = ProjectFixture.siteProject();
      ProjectMod.saveProject(mem, doc);
      ProjectUI.openDoc(doc);
      SunLayer.clear();
      setStudy({ date: '03-20', time: 720, place: { source: 'site' }, hours: { spacing: 20, step: 60, date: '03-20', extent: 'site' } });
      const info = SunUI.info();
      const t0 = performance.now();
      const r = await SunUI.compute();
      timings.site = { ms: Math.round(performance.now() - t0), computeMs: r.computeMs, nodes: r.nodes, samples: r.samples };
      const s = SunLayer.info().result;
      const day = SolarMod.sunTimes(33.927, -84.339, `${YEAR}-03-20`, 'us-eastern');
      const len = (day.sunset - day.sunrise) / 60;
      const open = SunLayer.hoursAt(100, 100);
      const tower = SunLayer.hoursAt(500, 500), north = SunLayer.hoursAt(500, 585);
      const ok = eq([info.place.source, info.place.lat, s.frame, s.nx, s.ny, s.x0, s.y0, tower === 0], ['site', 33.927, 'project', 51, 51, 0, 0, true]);
      if (ok !== true) return ok;
      const a = within(open, len, 0.03);
      return a === true ? (north < len - 1 ? true : `north ${north} vs day ${len}`) : a;
    });
    await t('the heat map sits where the grid is: with the tower rotated 30 degrees the quad corners follow the placement', async () => {
      if (!hasGL) return true;

    await t('a sun-hours result stored in the project comes back when the project is reopened', async () => {

      return eq([!!stored, !!back, back && back.nx, back && back.frame], [true, true, 51, 'project']);
    });
    ProjectUI.reset();
    ProjectUI.restoreDefaults();
    SunLayer.clear();

    /* ---- the study sheet ---- */
    await t('the shadow study sheet makes one PNG of nine panels (3 dates x 3 times) with the state, the view and the history unchanged', async () => {

      if (!r) return 'no result';
      const sig = new Uint8Array(await r.blob.slice(0, 8).arrayBuffer());
      const png = sig[0] === 0x89 && sig[1] === 0x50 && sig[2] === 0x4e && sig[3] === 0x47;
      const after = { sun: Store.snapshot().sun, v: Store.snapshot().view, depth: Store.historyDepth(), preset: Render.info().preset };
      return eq([r.panels, r.rows, r.cols, r.blob.type, png, r.blob.size > 20000, r.width > 1600, r.filename, SunStudy.busy()], [9, 3, 3, 'image/png', true, true, true, 'option-a-shadow-study.png', false])
        === true ? eq(after, before) : eq([r.panels, r.rows, r.cols, r.blob.type, png, r.blob.size, r.width, r.filename, SunStudy.busy()], [9, 3, 3, 'image/png', true, '>20000', '>1600', 'option-a-shadow-study.png', false]);

    await t('the sheet restores a Diagram style and a rotated placement, and leaves shadows as they were', async () => {

      const r = await SunStudy.make({ deliver: false });
      return eq([!!r, r && r.panels, Store.snapshot().view], [true, 9, before]);
    });
    await t('the dates and times of the sheet are editable: other dates and times change the panels and the file keeps nine', async () => {

      const f = $q('[data-sun="sheet-date-0"]'), tf = $q('[data-sun="sheet-time-2"]');
      const fields = [f && f.value, tf && tf.value];

      SunUI.setSun({ dates: ['03-20', '06-21', '12-21'], times: [540, 720, 900] });
      return eq([fields, r && r.panels], [[`${YEAR}-01-15`, '17:00'], 9]);

  } finally {
    SunUI.play(false);
    SunLayer.suppress(false);
    SunLayer.clear();
    ProjectUI.writeSun = origWrite;
    ProjectUI.reset();
    ProjectUI.restoreDefaults();
    Store.replace(savedState);
