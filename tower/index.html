})();

/* ---- src/tower/derived.js ---- */
const TowerDerivedMod = (() => {
/* ==========================================================================
   tower/derived.js — Tower Generator → massing.derived (docs/project-file-spec.md 6.2;
   docs/tower-project-sun-plan.md section 3.1)

   towerDerived(state, built, metrics) → { footprint, height, levels, context, metrics }
     state    the tower state (schema 1 or 2)
     built    buildPlates(state) → { plates, solids, warnings, floors }
     metrics  computeMetrics(state, built.plates); computed here when missing

   Pure: no DOM, no mutation of the inputs. Clipper (globalThis.ClipperLib, SCALE 1000) is used only for the
   footprint union. Units: feet, square feet. Plan (x, y): x = east, y = north, in the tower local frame.
   ========================================================================== */

const { computeMetrics, multiPolyArea } = Geo;
const { cleanRing2 } = SkFmt;

const SCALE = 1000;

const r1 = (v) => Math.round(v * 10) / 10;
const r2 = (v) => Math.round(v * 100) / 100;
const r3 = (v) => Math.round(v * 1000) / 1000;
const isNum = (v) => typeof v === "number" && Number.isFinite(v);
const clone = (o) => JSON.parse(JSON.stringify(o));
const need = (v, name) => { if (v === undefined || v === null) throw new Error(`towerDerived: missing input "${name}".`); return v; };

/* ---------- rings and multipolygons ---------- */

/** One {outer, holes} piece → cleaned piece, or null when the outer ring is degenerate. */
function cleanPiece(poly) {
  const outer = cleanRing2(poly && poly.outer);
  if (!outer) return null;
  const holes = [];
  for (const h of (poly && poly.holes) || []) {
    const c = cleanRing2(h, { hole: true });
    if (c) holes.push(c);
  }
  return { outer, holes };
}
const cleanMulti = (mp) => (Array.isArray(mp) ? mp : []).map(cleanPiece).filter(Boolean);

/** Union of several MultiPolys with Clipper. Returns a cleaned MultiPoly. */
function unionMulti(list) {
  const C = globalThis.ClipperLib;
  if (!C) throw new Error("towerDerived: ClipperLib is not loaded (globalThis.ClipperLib) and the footprint needs it.");
  const toPath = (ring) => ring.map((p) => ({ X: Math.round(p[0] * SCALE), Y: Math.round(p[1] * SCALE) }));
  const clip = new C.Clipper();
  let any = false;
  for (const mp of list) {
    for (const pc of mp) {
      clip.AddPath(toPath(pc.outer), C.PolyType.ptSubject, true);
      for (const h of pc.holes) clip.AddPath(toPath(h), C.PolyType.ptSubject, true);   // outers wind +1, holes 0 under non-zero
      any = true;
    }
  }
  if (!any) return [];
  const tree = new C.PolyTree();
  clip.Execute(C.ClipType.ctUnion, tree, C.PolyFillType.pftNonZero, C.PolyFillType.pftNonZero);
  const ring = (node) => node.Contour().map((p) => [p.X / SCALE, p.Y / SCALE]);
  const out = [];
  const visit = (node) => {
    if (!node.IsHole()) {
      const outer = cleanRing2(ring(node));
      const holes = [];
      for (const ch of node.Childs()) {
        const h = cleanRing2(ring(ch), { hole: true });
        if (h) holes.push(h);
      }
      if (outer) out.push({ outer, holes });
    }
    for (const ch of node.Childs()) for (const g of ch.Childs()) visit(g);   // islands inside holes
  };
  for (const top of tree.Childs()) visit(top);
  return out;
}

/* ---------- the crown ---------- */

/** Convex hull of points (Andrew's monotone chain), counter-clockwise. */
function hull(points) {
  const p = points.map((q) => [q[0], q[1]]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (p.length < 3) return p;
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [];
  for (const q of p) { while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], q) <= 0) lower.pop(); lower.push(q); }
  const upper = [];
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], q) <= 0) upper.pop(); upper.push(q); }
  lower.pop(); upper.pop();
  return lower.concat(upper);
}

/** The footprint (a MultiPoly) of one crown solid. Prisms carry it; a sloped crown sits on the top plate; a spire is its base circle. */
function solidFootprint(solid, state, topPlate) {
  if (Array.isArray(solid.polygons) && solid.polygons.length) return cleanMulti(solid.polygons);
  const type = String((state.crown && state.crown.type) || "").toLowerCase();
  if (type === "sloped") return topPlate ? cleanMulti(topPlate.polygons) : [];
  const pos = solid.positions;
  if (Array.isArray(pos) && pos.length >= 9) {
    let zMin = Infinity;
    for (let i = 2; i < pos.length; i += 3) zMin = Math.min(zMin, pos[i]);
    const base = [];
    for (let i = 0; i < pos.length; i += 3) if (Math.abs(pos[i + 2] - zMin) < 1e-6) base.push([pos[i], pos[i + 1]]);
    const ring = cleanRing2(hull(base));
    return ring ? [{ outer: ring, holes: [] }] : [];
  }
  return [];
}

/* ---------- the writer ---------- */

function towerDerived(state, built, metrics) {
  need(state, "state"); need(built, "built");
  const plates = need(built.plates, "built.plates");
  const solids = Array.isArray(built.solids) ? built.solids : [];
  const m = metrics || computeMetrics(state, plates);

  const levels = plates.map((p) => {
    const isVoid = !!p.void || !(p.area > 0);
    const core = !isVoid && Array.isArray(p.coreRect) ? cleanRing2(p.coreRect) : null;
    return {
      index: p.n,
      name: `Floor ${p.n}`,
      zone: p.zone,
      z: r3(p.z),
      ftf: r3(p.ftf),
      program: p.zone === "mechanical" ? "mechanical" : (p.program === undefined ? null : p.program),
      plates: isVoid ? [] : cleanMulti(p.polygons),
      core,
      spines: [],
      seeds: [],
    };
  });

  // the crown level: only when the crown adds height (a flat crown is a parapet and adds none)
  const crownHeight = isNum(m.crownHeight) ? m.crownHeight : 0;
  const real = plates.filter((p) => !p.void && p.area > 0);
  const topPlate = real.length ? real[real.length - 1] : null;
  const crownSolids = solids.filter((s) => s && (s.role === "screen" || s.role === "crown" || s.role === "spire"));
  const crownPieces = crownSolids.map((s) => ({ s, fp: solidFootprint(s, state, topPlate) }));
  if (crownHeight > 0 && crownPieces.length) {
    const zOf = (c) => (isNum(c.s.z0) ? c.s.z0 : Infinity);
    const lowest = crownPieces.reduce((a, b) => (zOf(b) < zOf(a) ? b : a));
    const lastN = plates.reduce((mx, p) => Math.max(mx, p.n), 0);
    levels.push({
      index: lastN + 1,
      name: "Crown",
      zone: "crown",
      z: r3(isNum(m.topOfFloors) ? m.topOfFloors : plates.reduce((mx, p) => Math.max(mx, p.z + p.ftf), 0)),
      ftf: r3(crownHeight),
      program: null,
      plates: lowest.fp,
      core: null,
      spines: [],
      seeds: [],
    });
  }

  const footprint = unionMulti([...levels.filter((l) => l.zone !== "crown").map((l) => l.plates), ...crownPieces.filter((c) => c.s.polygons).map((c) => c.fp)]);

  const byProgram = m.byProgram || {};
  let units = 0;
  for (const k of ["residential", "hotel"]) if (byProgram[k] && isNum(byProgram[k].unitsWhole)) units += byProgram[k].unitsWhole;

  const gfa = isNum(m.gfa) ? m.gfa : levels.filter((l) => l.zone !== "crown").reduce((s, l) => s + multiPolyArea(l.plates), 0);
  const height = isNum(m.totalHeight) ? m.totalHeight : 0;

  return {
    footprint,
    height: r1(height),
    levels,
    context: { blocks: clone(((state.context && state.context.blocks) || []).map((b) => ({ ...b }))) },
    metrics: {
      gfa: r1(gfa),
      far: r2(isNum(m.far) ? m.far : 0),
      siteCoverage: r3(isNum(m.siteCoverage) ? m.siteCoverage : 0),
      floors: isNum(m.floorCount) ? m.floorCount : real.length,
      height: r1(height),
      units,
    },
  };
}

return { towerDerived };
})();

/* ---- src/shared/solar.js ---- */
const SolarMod = (() => {
// Solar position, sunrise and sunset, and US time zones for the sun study.
// Source: docs/tower-project-sun-plan.md sections 3.3 and 3.4 (the NOAA Solar Calculator equations, after Meeus).
// Pure ES module: no DOM, no Three.js, inputs never changed. Angles are degrees; times are minutes after
// local midnight unless named otherwise. Azimuth is a compass bearing: 0 = north, clockwise.

const ATLANTA = { lat: 33.749, lon: -84.388 };

const RAD = Math.PI / 180;
const rad = (d) => d * RAD;
const deg = (r) => r / RAD;
const mod = (a, n) => ((a % n) + n) % n;
const clamp1 = (v) => Math.max(-1, Math.min(1, v));
const DAY_MS = 86400000;

const ZONES = {
  "us-eastern": { std: -5, dst: true },
  "us-central": { std: -6, dst: true },
  "us-mountain": { std: -7, dst: true },
  "us-pacific": { std: -8, dst: true },
  "us-arizona": { std: -7, dst: false },
};

/* ----------------------------------------------------------------- dates */

/** "YYYY-MM-DD" (or "MM-DD", read in the current year) → { y, m, d }. */
function parseDate(localDate) {
  if (localDate && typeof localDate === "object" && Number.isFinite(localDate.y)) return { y: localDate.y, m: localDate.m, d: localDate.d };
  const s = String(localDate || "");
  let mt = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);
  if (mt) return { y: +mt[1], m: +mt[2], d: +mt[3] };
  mt = /^(\d{1,2})-(\d{1,2})$/.exec(s);
  if (mt) return { y: new Date().getFullYear(), m: +mt[1], d: +mt[2] };
  throw new Error(`solar: bad date "${s}" (use YYYY-MM-DD)`);
}

/** Day number (days since 1970-01-01) of a calendar date. */
const dayNum = ({ y, m, d }) => Math.round(Date.UTC(y, m - 1, d) / DAY_MS);

/** Calendar date of a day number. */
function fromDayNum(n) {
  const t = new Date(n * DAY_MS);
  return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate() };
}

/** Rolls minutes outside 0 … 1440 into the next or previous day. */
function normalize(localDate, localMinutes) {
  const day = dayNum(parseDate(localDate));
  const mins = Number.isFinite(localMinutes) ? localMinutes : 0;
  const k = Math.floor(mins / 1440);
  return { date: fromDayNum(day + k), minutes: mins - k * 1440 };
}

/** Day of month of the nth Sunday of a month (n = 1, 2, …). */
function nthSunday(y, m, n) {
  const dow = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();   // 0 = Sunday
  return 1 + ((7 - dow) % 7) + 7 * (n - 1);
}

/** US daylight time: second Sunday of March 2:00 standard to first Sunday of November 2:00 daylight. */
function usDST(date, minutes) {
  const { y, m, d } = date;
  if (m < 3 || m > 11) return false;
  if (m > 3 && m < 11) return true;
  if (m === 3) {
    const s = nthSunday(y, 3, 2);
    if (d !== s) return d > s;
    return minutes >= 120;         // 2:00 to 3:00 does not exist; it maps forward to daylight time
  }
  const e = nthSunday(y, 11, 1);
  if (d !== e) return d < e;
  return minutes < 120;            // 1:00 to 2:00 happens twice; the plan reads it as daylight time
}

/** zoneOrOffset: a zone name, a number of hours, or { zone, offset } (the state.sun.tz shape). */
function zoneParts(zoneOrOffset, fixedOffset) {
  if (Number.isFinite(zoneOrOffset)) return { zone: "fixed", offset: zoneOrOffset };
  if (zoneOrOffset && typeof zoneOrOffset === "object") {
    return { zone: String(zoneOrOffset.zone || "fixed"), offset: Number.isFinite(zoneOrOffset.offset) ? zoneOrOffset.offset : (Number.isFinite(fixedOffset) ? fixedOffset : 0) };
  }
  return { zone: String(zoneOrOffset || "fixed"), offset: Number.isFinite(fixedOffset) ? fixedOffset : 0 };
}

/* ------------------------------------------------------------ time zones */

/**
 * Hours from UTC for a local date and time (plan section 3.4). zone: us-eastern | us-central | us-mountain |
 * us-pacific | us-arizona | fixed (then fixedOffset, default 0). zone may also be a number or { zone, offset }.
 * localDate "YYYY-MM-DD"; localMinutes after local midnight (outside 0 … 1440 rolls the date).
 */
function tzOffset(zone, localDate, localMinutes, fixedOffset) {
  const z = zoneParts(zone, fixedOffset);
  const info = ZONES[z.zone];
  if (!info) return z.offset;
  if (!info.dst) return info.std;
  const { date, minutes } = normalize(localDate, localMinutes);
  return usDST(date, minutes) ? info.std + 1 : info.std;
}

/** Local date and minutes → the UTC instant (a Date). */
function localToUTC(localDate, localMinutes, zoneOrOffset) {
  const { date, minutes } = normalize(localDate, localMinutes);
  const off = tzOffset(zoneOrOffset, date, minutes);
  return new Date(dayNum(date) * DAY_MS + (minutes - 60 * off) * 60000);
}

/* -------------------------------------------------------- solar position */

/** The date-only parts of the NOAA sheet for an instant (ms): declination, equation of time. */
function solarCore(ms) {
  const JD = ms / DAY_MS + 2440587.5;
  const T = (JD - 2451545) / 36525;
  const L0 = mod(280.46646 + T * (36000.76983 + 0.0003032 * T), 360);
  const M = 357.52911 + T * (35999.05029 - 0.0001537 * T);
  const e = 0.016708634 - T * (0.000042037 + 0.0000001267 * T);
  const Mr = rad(M);
  const C = Math.sin(Mr) * (1.914602 - T * (0.004817 + 0.000014 * T)) + Math.sin(2 * Mr) * (0.019993 - 0.000101 * T) + Math.sin(3 * Mr) * 0.000289;
  const omega = rad(125.04 - 1934.136 * T);
  const lambda = L0 + C - 0.00569 - 0.00478 * Math.sin(omega);
  const eps0 = 23 + (26 + (21.448 - T * (46.815 + T * (0.00059 - 0.001813 * T))) / 60) / 60;
  const eps = eps0 + 0.00256 * Math.cos(omega);
  const decl = deg(Math.asin(Math.sin(rad(eps)) * Math.sin(rad(lambda))));
  const y = Math.tan(rad(eps / 2)) ** 2;
  const L0r = rad(L0);
  const eot = 4 * deg(y * Math.sin(2 * L0r) - 2 * e * Math.sin(Mr) + 4 * e * y * Math.sin(Mr) * Math.cos(2 * L0r)
    - 0.5 * y * y * Math.sin(4 * L0r) - 1.25 * e * e * Math.sin(2 * Mr));
  return { decl, eot };
}

/** Atmospheric refraction in degrees for a geometric altitude h (the NOAA sheet). */
function refraction(h) {
  let arcsec;
  if (h > 85) arcsec = 0;
  else if (h > 5) {
    const t = Math.tan(rad(h));
    arcsec = 58.1 / t - 0.07 / t ** 3 + 0.000086 / t ** 5;
  } else if (h > -0.575) arcsec = 1735 + h * (-518.2 + h * (103.4 + h * (-12.79 + h * 0.711)));
  else arcsec = -20.772 / Math.tan(rad(h));
  return arcsec / 3600;
}

/**
 * Sun position for a place and a UTC instant (Date or ms). Plan section 3.3.
 * → { azimuth (compass, 0 = north, clockwise), altitude (apparent, with refraction), altitudeGeometric,
 *     declination, eot (minutes) }
 */
function sunPosition(lat, lon, dateUTC) {
  const ms = dateUTC instanceof Date ? dateUTC.getTime() : +dateUTC;
  const { decl, eot } = solarCore(ms);
  const utcMin = mod(ms / 60000, 1440);
  const tst = mod(utcMin + eot + 4 * lon, 1440);
  let H = tst / 4 - 180;
  if (H < -180) H += 360;
  const phi = rad(lat), dr = rad(decl), Hr = rad(H);
  const cosZ = clamp1(Math.sin(phi) * Math.sin(dr) + Math.cos(phi) * Math.cos(dr) * Math.cos(Hr));
  const Z = deg(Math.acos(cosZ));
  const h = 90 - Z;
  const sinZ = Math.sin(rad(Z));
  let azimuth;
  const den = Math.cos(phi) * sinZ;
  if (Math.abs(den) < 1e-12) azimuth = lat > 0 ? 180 : 0;   // sun at the zenith or a pole
  else {
    const a = deg(Math.acos(clamp1((Math.sin(phi) * cosZ - Math.sin(dr)) / den)));
    azimuth = H > 0 ? mod(a + 180, 360) : mod(540 - a, 360);
  }
  return { azimuth, altitude: h + refraction(h), altitudeGeometric: h, declination: decl, eot };
}

/* ------------------------------------------------------ sunrise / sunset */

/** Hour angle (degrees) of the sun at apparent altitude −0.833°, or ±Infinity for polar day / night. */
function riseHourAngle(lat, decl) {
  const phi = rad(lat), dr = rad(decl);
  const c = (Math.cos(rad(90.833)) - Math.sin(phi) * Math.sin(dr)) / (Math.cos(phi) * Math.cos(dr));
  if (c < -1) return Infinity;    // the sun never sets
  if (c > 1) return -Infinity;    // the sun never rises
  return deg(Math.acos(c));
}

/**
 * Sunrise, solar noon and sunset as local minutes (plan section 3.3). An event that does not happen
 * (polar day or night) is null, and `polar` says which: "day" | "night" | null.
 * → { sunrise, noon, sunset, polar }
 */
function sunTimes(lat, lon, localDate, zoneOrOffset) {
  const date = parseDate(localDate);
  const day0 = dayNum(date) * DAY_MS;
  const offAt = (mins) => tzOffset(zoneOrOffset, date, mins);
  const utcMs = (localMins) => day0 + (localMins - 60 * offAt(localMins)) * 60000;
  // solar noon, iterated with the equation of time at the event
  let noon = 720 - 4 * lon + 60 * offAt(720);
  for (let i = 0; i < 3; i++) noon = 720 - 4 * lon - solarCore(utcMs(noon)).eot + 60 * offAt(noon);
  const event = (sign) => {
    let t = noon, H0 = 0;
    for (let i = 0; i < 3; i++) {
      const c = solarCore(utcMs(t));
      H0 = riseHourAngle(lat, c.decl);
      if (!Number.isFinite(H0)) return { t: null, polar: H0 > 0 ? "day" : "night" };
      t = 720 - 4 * lon - c.eot + 60 * offAt(t) + sign * 4 * H0;
    }
    return { t, polar: null };
  };
  const rise = event(-1), set = event(1);
  const polar = rise.polar || set.polar;
  return { sunrise: polar ? null : rise.t, noon, sunset: polar ? null : set.t, polar };
}

const hhmm = (mins) => {
  const m = Math.round(mins);
  return `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
};

/**
 * The sun path over one local day, 0:00 to 24:00 at stepMin (default 15).
 * → [{ minutes, time: "HH:MM", azimuth, altitude }] (altitude apparent; negative below the horizon)
 */
function dayPath(lat, lon, localDate, zoneOrOffset, stepMin) {
  const step = Number.isFinite(stepMin) && stepMin > 0 ? stepMin : 15;
  const out = [];
  for (let m = 0; m <= 1440 + 1e-9; m += step) {
    const p = sunPosition(lat, lon, localToUTC(localDate, m, zoneOrOffset));
    out.push({ minutes: m, time: hhmm(m), azimuth: p.azimuth, altitude: p.altitude });
  }
  return out;
}

/** A true bearing in the local frame of a placement turned by `rotation` (plan section 3.2): (A + r) mod 360. */
function localBearing(trueAzimuth, rotation) {
  return mod((+trueAzimuth || 0) + (+rotation || 0), 360);
}

return { ATLANTA, tzOffset, localToUTC, sunPosition, sunTimes, dayPath, localBearing };

/* ---- src/tower/sunhours.js ---- */
const SunHoursMod = (() => {
// Sun hours on flat ground: shadow casters, ground shadows, the node grid and the hours count.
// Source: docs/tower-project-sun-plan.md sections 3.6 and 4.
// Pure ES module: no DOM, no Three.js, inputs never changed. Clipper through globalThis.ClipperLib at SCALE 1000.
// Frames: the grid frame is the project frame when a placement is given, else the tower local frame. In both,
// north is +y and every azimuth is a compass bearing in that frame (0 = north, clockwise).
// Ground is flat at the tower ground floor (plan decision 7): caster heights are above that floor.

const { sunPosition, sunTimes, localToUTC } = SolarMod;

const SCALE = 1000;
const RAD = Math.PI / 180;

const num = (v, d = 0) => (Number.isFinite(+v) && v !== null && v !== "" ? +v : d);
const CL = () => {
  const c = globalThis.ClipperLib;
  if (!c) throw new Error("sunhours: ClipperLib is not loaded");
  return c;
};

/* --------------------------------------------------------------- rings */

function signedArea(r) {
  let a = 0;
  for (let i = 0, n = r.length; i < n; i++) {
    const p = r[i], q = r[(i + 1) % n];
    a += p[0] * q[1] - q[0] * p[1];
  }
  return a / 2;
}

/** A copy of the ring as [x, y] pairs, without a repeated closing point, with the asked orientation. */
function cleanRing(ring, ccw) {
  if (!Array.isArray(ring)) return [];
  const out = [];
  for (const p of ring) {
    if (!Array.isArray(p) || !Number.isFinite(+p[0]) || !Number.isFinite(+p[1])) continue;
    const q = [+p[0], +p[1]];
    const last = out[out.length - 1];
    if (last && last[0] === q[0] && last[1] === q[1]) continue;
    out.push(q);
  }
  if (out.length > 1 && out[0][0] === out[out.length - 1][0] && out[0][1] === out[out.length - 1][1]) out.pop();
  if (out.length < 3) return [];
  const a = signedArea(out);
  if (a === 0) return [];
  if ((a > 0) !== ccw) out.reverse();
  return out;
}

/** Convex test with collinear points allowed (the ring is CCW). */
function isConvexRing(r) {
  const n = r.length;
  if (n < 3) return false;
  for (let i = 0; i < n; i++) {
    const a = r[i], b = r[(i + 1) % n], c = r[(i + 2) % n];
    const cr = (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]);
    if (cr < -1e-9 * (1 + Math.abs(a[0]) + Math.abs(a[1]))) return false;
  }
  return true;
}

/** Monotone-chain convex hull of [x, y] points → CCW ring. */
function hull(points) {
  const pts = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (pts.length < 3) return pts;
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [], upper = [];
  for (const p of pts) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
    lower.push(p);
  }
  for (let i = pts.length - 1; i >= 0; i--) {
    const p = pts[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
    upper.push(p);
  }
  lower.pop(); upper.pop();
  return lower.concat(upper);
}

const toPath = (ring, dx = 0, dy = 0) => ring.map((p) => ({ X: Math.round((p[0] + dx) * SCALE), Y: Math.round((p[1] + dy) * SCALE) }));

/* ----------------------------------------------------------- placement */

/** [sin, cos] of degrees, exact for the quarter turns (as src/shared/project.js). */
function sincos(d) {
  const a = ((d % 360) + 360) % 360;
  if (a === 0) return [0, 1];
  if (a === 90) return [1, 0];
  if (a === 180) return [0, -1];
  if (a === 270) return [-1, 0];
  return [Math.sin(a * RAD), Math.cos(a * RAD)];

/** Local → project (spec 4): xp = x cos r − y sin r + x0, yp = x sin r + y cos r + y0. Identity without a placement. */
function framer(placement) {
  const p = placement && typeof placement === "object" && placement.placement && typeof placement.placement === "object" ? placement.placement : placement;
  if (!p || typeof p !== "object") return (x, y) => [x, y];
  const px = num(p.x), py = num(p.y), [s, c] = sincos(num(p.rotation));
  if (px === 0 && py === 0 && s === 0 && c === 1) return (x, y) => [x, y];
  return (x, y) => [x * c - y * s + px, x * s + y * c + py];

/* -------------------------------------------------------------- casters */

function prismCasters(mp, z0, z1, kind, role, fr) {
  const out = [];
  for (const poly of Array.isArray(mp) ? mp : []) {
    if (!poly) continue;
    const polygon = cleanRing((poly.outer || []).map((q) => fr(+q[0], +q[1])), true);
    if (!polygon.length) continue;
    const holes = (Array.isArray(poly.holes) ? poly.holes : []).map((h) => cleanRing(h.map((q) => fr(+q[0], +q[1])), false)).filter((h) => h.length);
    const c = { polygon, holes, z0, z1, kind, convex: !holes.length && isConvexRing(polygon) };
    if (role) c.role = role;

  }
  return out;
}

function meshCaster(solid, fr) {
  const pos = Array.isArray(solid.positions) || ArrayBuffer.isView(solid.positions) ? solid.positions : [];
  const idx = Array.isArray(solid.indices) || ArrayBuffer.isView(solid.indices) ? solid.indices : [];
  if (pos.length < 9 || idx.length < 3) return null;
  const positions = new Array(pos.length);
  let z0 = Infinity, z1 = -Infinity;
  const xy = [];
  for (let i = 0; i < pos.length; i += 3) {
    const [x, y] = fr(+pos[i], +pos[i + 1]);
    positions[i] = x; positions[i + 1] = y; positions[i + 2] = +pos[i + 2];
    xy.push([x, y]);

  const polygon = hull(xy);
  if (polygon.length < 3) return null;
  // Convex when every vertex lies on one side of every face plane (a spire; a sloped crown on a convex plate).
  const I = Array.from(idx);
  let convex = true;
  for (let f = 0; f + 2 < I.length && convex; f += 3) {
    const A = 3 * I[f], B = 3 * I[f + 1], Cc = 3 * I[f + 2];
    const ux = positions[B] - positions[A], uy = positions[B + 1] - positions[A + 1], uz = positions[B + 2] - positions[A + 2];
    const vx = positions[Cc] - positions[A], vy = positions[Cc + 1] - positions[A + 1], vz = positions[Cc + 2] - positions[A + 2];
    const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    const nl = Math.hypot(nx, ny, nz);
    if (nl < 1e-12) continue;
    let pos = false, neg = false;
    for (let i = 0; i < positions.length; i += 3) {
      const d = (nx * (positions[i] - positions[A]) + ny * (positions[i + 1] - positions[A + 1]) + nz * (positions[i + 2] - positions[A + 2])) / nl;
      if (d > 1e-6) pos = true; else if (d < -1e-6) neg = true;
      if (pos && neg) { convex = false; break; }
    }
  }

}

const ringKey = (mp) => JSON.stringify((mp || []).map((p) => [p.outer, p.holes || []]));

/**
 * Every shadow caster of a tower in the grid frame (plan section 3.6).
 * state: the tower state (context.show, context.blocks); built: buildPlates(state); placement: optional
 * { x, y, rotation, baseZ } (or a section that holds one) → project frame; none → local frame.
 * Stacked plates with the same polygons merge into one caster.
 * → [{ polygon: Ring (CCW), holes: Ring[] (CW), z0, z1, kind: "plate" | "crown" | "context", convex,
 *      role? (crown solids), mesh? ({ positions, indices } for sloped and spire crowns) }]
 */
function casters(state, built, placement) {
  const fr = framer(placement);

    .slice().sort((a, b) => num(a.z) - num(b.z));

  const flush = () => { if (run) out.push(...prismCasters(run.mp, run.z0, run.z1, "plate", null, fr)); run = null; };
  for (const p of plates) {
    const z0 = num(p.z), z1 = z0 + num(p.ftf);
    if (!(z1 > z0)) continue;
    const key = ringKey(p.polygons);
    if (run && run.key === key && Math.abs(run.z1 - z0) < 1e-6) { run.z1 = z1; continue; }
    flush();
    run = { key, mp: p.polygons, z0, z1 };

  flush();

    if (!s) continue;

      const z0 = num(s.z0), z1 = num(s.z1);
      if (z1 > z0) out.push(...prismCasters(s.polygons, z0, z1, "crown", s.role || "crown", fr));
    } else if (s.kind === "mesh") {
      const c = meshCaster(s, fr);

    }

      if (!(w > 0 && d > 0 && h > 0)) continue;
      const ring = [[x - w / 2, y - d / 2], [x + w / 2, y - d / 2], [x + w / 2, y + d / 2], [x - w / 2, y + d / 2]];
      out.push(...prismCasters([{ outer: ring, holes: [] }], base, base + h, "context", null, fr));
    }
  }
  return out;
}

/* -------------------------------------------------------------- shadows */

/** Ground offset per foot of height, pointing away from the sun: v = −(sin A, cos A) / tan h. */
function shadowVector(azimuth, altitude) {
  const t = Math.tan(altitude * RAD);
  return [-Math.sin(azimuth * RAD) / t, -Math.cos(azimuth * RAD) / t];
}

/** Clipper paths (SCALE) of one caster ground shadow; outers CCW, holes CW. */
function shadowPaths(c, v) {
  const C = CL();

    const P = c.mesh.positions, I = c.mesh.indices;
    const proj = (k) => [P[3 * k] + P[3 * k + 2] * v[0], P[3 * k + 1] + P[3 * k + 2] * v[1]];
    if (c.convex) {
      const pts = [];
      for (let k = 0; k < P.length / 3; k++) pts.push(proj(k));
      const h = hull(pts);
      return h.length >= 3 ? [toPath(h)] : [];
    }
    const tris = [];
    for (let i = 0; i + 2 < I.length; i += 3) {
      const t = cleanRing([proj(I[i]), proj(I[i + 1]), proj(I[i + 2])], true);
      if (t.length === 3) tris.push(toPath(t));
    }
    const res = [];
    const cl = new C.Clipper();
    cl.AddPaths(tris, C.PolyType.ptSubject, true);
    cl.Execute(C.ClipType.ctUnion, res, C.PolyFillType.pftNonZero, C.PolyFillType.pftNonZero);

    for (const p of c.polygon) { pts.push([p[0] + ax, p[1] + ay]); pts.push([p[0] + bx, p[1] + by]); }

  const seg = [{ X: Math.round(ax * SCALE), Y: Math.round(ay * SCALE) }, { X: Math.round(bx * SCALE), Y: Math.round(by * SCALE) }];

function unionPaths(paths, tree) {
  const C = CL();
  const cl = new C.Clipper();
  cl.AddPaths(paths, C.PolyType.ptSubject, true);

function treeToMP(tree) {
  const mp = [];
  const walk = (node) => {
    for (const outer of node.Childs()) {
      mp.push({ outer: cleanRing(fromPath(outer.Contour()), true), holes: outer.Childs().map((h) => cleanRing(fromPath(h.Contour()), false)) });
      for (const h of outer.Childs()) walk(h);

/**
 * The ground shadow of one caster for a sun direction (plan section 3.6 step 2). Convex rings use the
 * convex hull of the polygon moved by z0·v and z1·v; other rings a Clipper Minkowski sum.
 * → MultiPoly [{ outer (CCW), holes (CW) }]; [] when the sun is at or below the horizon.

  if (!caster || !(altitude > 0)) return [];
  return treeToMP(unionPaths(shadowPaths(caster, shadowVector(azimuth, altitude)), true));

/* ----------------------------------------------------------------- grid */

/**
 * The node grid over an extent { minX, minY, maxX, maxY } at `spacing` ft. Node (i, j) sits at
 * (x0 + i·spacing, y0 + j·spacing); index j·nx + i (row-major from the south).
 * → { spacing, n (nodes on the longer side; the side count for a square), nx, ny, x0, y0 }
 */
function sunGrid(extentBox, spacing) {

  const b = extentBox || {};

  const maxX = Math.max(minX, num(b.maxX, minX)), maxY = Math.max(minY, num(b.maxY, minY));
  const nx = Math.floor((maxX - minX) / s + 1e-9) + 1, ny = Math.floor((maxY - minY) / s + 1e-9) + 1;
  return { spacing: s, n: Math.max(nx, ny), nx, ny, x0: minX, y0: minY };

/* ------------------------------------------------------------- samples */

/**
 * Sample times for one local date (plan section 3.6): the day from sunrise to sunset cut into `stepMin`
 * intervals; each sample sits at the middle of its interval and carries the interval length `dt`
 * (minutes; the last one is shorter). The dt values add up to the day length. Polar day covers 0 … 1440;
 * polar night gives [].
 * → [{ minutes, azimuth, altitude, dt }]
 */

  const step = num(stepMin, 30) > 0 ? num(stepMin, 30) : 30;
  const t = sunTimes(lat, lon, localDate, zoneOrOffset);
  let start, end;
  if (t.polar === "night") return [];
  if (t.polar === "day") { start = 0; end = 1440; } else { start = t.sunrise; end = t.sunset; }
  const out = [];
  for (let k = 0; start + k * step < end - 1e-9; k++) {
    const a = start + k * step;
    const dt = Math.min(step, end - a);
    const minutes = a + dt / 2;
    const p = sunPosition(lat, lon, localToUTC(localDate, minutes, zoneOrOffset));

/* ------------------------------------------------------------ sun hours */

/** Marks the grid nodes inside the even-odd region of `paths` (row scan). */
function rasterize(paths, grid, mask, rows) {
  const { nx, ny, x0, y0, spacing: s } = grid;
  for (let j = 0; j < ny; j++) rows[j].length = 0;
  for (const path of paths) {
    const n = path.length;
    for (let k = 0; k < n; k++) {
      const p = path[k], q = path[(k + 1) % n];
      const ya = p.Y / SCALE, yb = q.Y / SCALE;
      if (ya === yb) continue;
      const lo = Math.min(ya, yb), hi = Math.max(ya, yb);
      let j0 = Math.ceil((lo - y0) / s), j1 = Math.ceil((hi - y0) / s) - 1;   // rows with lo ≤ y < hi
      if (j0 < 0) j0 = 0;
      if (j1 > ny - 1) j1 = ny - 1;
      if (j0 > j1) continue;
      const xa = p.X / SCALE, xb = q.X / SCALE, k1 = (xb - xa) / (yb - ya);
      for (let j = j0; j <= j1; j++) rows[j].push(xa + (y0 + j * s - ya) * k1);
    }
  }
  for (let j = 0; j < ny; j++) {
    const r = rows[j];
    if (r.length < 2) continue;
    r.sort((a, b) => a - b);
    const base = j * nx;
    for (let k = 0; k + 1 < r.length; k += 2) {
      let i0 = Math.ceil((r[k] - x0) / s), i1 = Math.ceil((r[k + 1] - x0) / s) - 1;   // lo ≤ x < hi
      if (i0 < 0) i0 = 0;
      if (i1 > nx - 1) i1 = nx - 1;
      for (let i = i0; i <= i1; i++) mask[base + i] = 1;
    }
  }
}

/**
 * Hours of direct sun per grid node (plan section 3.6). Synchronous; the page calls it with a few samples
 * at a time and adds the `hours` arrays. Samples at or below the horizon are skipped.
 * samples: [{ minutes, azimuth, altitude, dt }]; onProgress(done, total) after each sample;
 * shouldStop() checked before each sample.
 * → { hours: Float32Array (nx·ny, hours, row-major from the south), samples (samples counted), cancelled }
 */

  const cs = Array.isArray(casterList) ? casterList : [];

  for (let k = 0; k < list.length; k++) {
    if (typeof shouldStop === "function" && shouldStop()) { cancelled = true; break; }
    const smp = list[k];
    const dt = num(smp && smp.dt), alt = num(smp && smp.altitude, -1);
    if (alt > 0 && dt > 0) {
      const v = shadowVector(num(smp.azimuth), alt);
      const all = [];
      for (const c of cs) for (const p of shadowPaths(c, v)) all.push(p);
      mask.fill(0);
      if (all.length) rasterize(unionPaths(all, false), grid, mask, rows);
      const h = dt / 60;
      for (let i = 0; i < N; i++) if (!mask[i]) acc[i] += h;
      used++;

    if (typeof onProgress === "function") onProgress(k + 1, list.length);
  }
  return { hours: Float32Array.from(acc), samples: used, cancelled };

/* ------------------------------------------------------------- ray cast */

function pointInRing(r, x, y) {
  let inside = false;
  for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
    const a = r[i], b = r[j];
    if ((a[1] > y) !== (b[1] > y) && x < ((b[0] - a[0]) * (y - a[1])) / (b[1] - a[1]) + a[0]) inside = !inside;
  }
  return inside;
}

function segsCross(p, q, a, b) {
  const d = (u, v, w) => (v[0] - u[0]) * (w[1] - u[1]) - (v[1] - u[1]) * (w[0] - u[0]);
  const d1 = d(a, b, p), d2 = d(a, b, q), d3 = d(p, q, a), d4 = d(p, q, b);
  return ((d1 > 0) !== (d2 > 0)) && ((d3 > 0) !== (d4 > 0));

function rayHitsTri(o, dir, a, b, c) {
  const e1 = [b[0] - a[0], b[1] - a[1], b[2] - a[2]], e2 = [c[0] - a[0], c[1] - a[1], c[2] - a[2]];
  const p = [dir[1] * e2[2] - dir[2] * e2[1], dir[2] * e2[0] - dir[0] * e2[2], dir[0] * e2[1] - dir[1] * e2[0]];
  const det = e1[0] * p[0] + e1[1] * p[1] + e1[2] * p[2];
  if (Math.abs(det) < 1e-12) return false;
  const inv = 1 / det;
  const s = [o[0] - a[0], o[1] - a[1], o[2] - a[2]];
  const u = (s[0] * p[0] + s[1] * p[1] + s[2] * p[2]) * inv;
  if (u < 0 || u > 1) return false;
  const q = [s[1] * e1[2] - s[2] * e1[1], s[2] * e1[0] - s[0] * e1[2], s[0] * e1[1] - s[1] * e1[0]];
  const w = (dir[0] * q[0] + dir[1] * q[1] + dir[2] * q[2]) * inv;
  if (w < 0 || u + w > 1) return false;
  return (e2[0] * q[0] + e2[1] * q[1] + e2[2] * q[2]) * inv > 1e-9;

/**
 * The direct ray cast (for tests): is the ground point (x, y) in sun? The ray from the point toward the sun
 * is tested against every caster solid. Sun at or below the horizon → false.
 */
function isLit(casterList, x, y, azimuth, altitude) {
  if (!(altitude > 0)) return false;
  const t = Math.tan(altitude * RAD);
  const wx = Math.sin(azimuth * RAD) / t, wy = Math.cos(azimuth * RAD) / t;   // ground offset per foot of rise
  for (const c of casterList || []) {
    if (c.mesh) {
      const P = c.mesh.positions, I = c.mesh.indices;
      const o = [x, y, 0], dir = [wx, wy, 1];
      const V = (k) => [P[3 * k], P[3 * k + 1], P[3 * k + 2]];
      for (let i = 0; i + 2 < I.length; i += 3) if (rayHitsTri(o, dir, V(I[i]), V(I[i + 1]), V(I[i + 2]))) return false;
      continue;
    }
    const p = [x + c.z0 * wx, y + c.z0 * wy], q = [x + c.z1 * wx, y + c.z1 * wy];
    const inRegion = (pt) => pointInRing(c.polygon, pt[0], pt[1]) && !(c.holes || []).some((h) => pointInRing(h, pt[0], pt[1]));
    if (inRegion(p) || inRegion(q)) return false;
    for (const r of [c.polygon, ...(c.holes || [])]) {
      for (let i = 0, n = r.length; i < n; i++) if (segsCross(p, q, r[i], r[(i + 1) % n])) return false;
    }
  }
  return true;
}

return { casters, shadowPolygon, sunGrid, samplesFor, sunHours, isLit };
})();

/* ==========================================================================
   SHARED: units
   Feet-and-inches format, area format, and parsing of typed values.

const Units = (() => {

  /** 312.5 -> 312'-6"  (rounds to the nearest inch) */
