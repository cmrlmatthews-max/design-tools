    render();
    ui.back.hidden = false;
    ui.el.setAttribute('data-open', 'true');
    ui.el.removeAttribute('aria-hidden');
    const btn = document.getElementById('btnExport');
    if (btn) btn.classList.add('is-on');
    try { ui.el.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    return true;
  }
  function close() {
    if (!ui.open) return false;
    ui.open = false;
    ui.back.hidden = true;
    ui.el.setAttribute('data-open', 'false');
    ui.el.setAttribute('aria-hidden', 'true');
    ui.toasts.textContent = '';
    const btn = document.getElementById('btnExport');
    if (btn) btn.classList.remove('is-on');
    const f = ui.restoreFocus;
    ui.restoreFocus = null;
    if (f && f.focus && document.contains(f)) { try { f.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
    return true;
  }
  const toggle = () => (ui.open ? close() : open());

  function init() {
    build();
    window.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape' || !ui.open) return;
      if (document.querySelector('.modal-back')) return;      // a confirm dialog handles its own Escape
      e.preventDefault();
      close();
    });
    // The numbers in the chips and the preview follow the design while the panel is open.
    Store.subscribe(() => {
      if (!ui.open || ui.raf) return;
      ui.raf = requestAnimationFrame(() => { ui.raf = 0; updateChips(); updatePreview(); });
    });
    Options.onImport(({ promptsAdded }) => { if (promptsAdded && ui.el) render(); });
  }

  return {
    init, open, close, toggle, copyPrompt, saveImage, isOpen: () => ui.open,
    formPhrase, autoValues, podiumPhrase, currentAuto, textFor, findPrompt, allPrompts, valuesFor,
    // the same text the preview shows for a prompt id; `values` overrides auto or pick fields
    promptText: (id, values) => { const p = findPrompt(id); return p ? textFor(p, values) : null; },
    startNew, startEdit, saveEditing, cancelEditing, duplicateToEdit, removePrompt,
    editing: () => (ui.editing ? { ...ui.editing } : null),
    setEditing: (patch) => { if (ui.editing) { Object.assign(ui.editing, patch); render(); } },
    select, render,
  };
})();

/* ==========================================================================
   SketchUp export (docs/sketchup-spec.md section 4)
   Export menu > "SketchUp (.json)" downloads <option>-<date>.sketchup.json, which the
   CMRLM SketchUp extension imports. The document is built by src/tower/sketchup.js from
   the same plates the screen shows; the file format helpers are src/shared/sketchup-format.js.
   ========================================================================== */

/* ---- src/tower/sketchup.js ---- */
const SkTower = (() => {
/* ==========================================================================
   tower/sketchup.js — Tower Generator → ".sketchup.json" (docs/sketchup-spec.md section 4)

   towerToSketchup(state, built) → a document made with makeDoc (passes validateDoc).
     state  the tower state (names, programs and colors, context blocks)
     built  buildPlates(state) → { plates, solids }

   Pure: no DOM, no Clipper. Units: feet. Plan (x, y): x = east, y = north. z up.

   Rule choices (where the spec leaves room):
   - Group order: Podium, Segment 1 · Program, …, Crown, Context. A group with nothing in it
     is left out. A mechanical floor goes in the group of the zone it sits in (the segment
     below it, or the podium) and carries the "Mechanical" tag and material.
   - Tags and materials: one per program used (named like the program, "Residential"), plus
     "Crown" and "Context" only when something uses them. Tag color = program color.
   - A floor with one piece is a solid named "Floor n". A floor with several pieces is a
     group "Floor n" holding one solid per piece ("Floor n · piece k"). Tag and material go
     on both the group and its solids. Attributes (floor, program, area_sf) sit on the
     "Floor n" node.
   - Crown meshes are welded (equal points share a vertex) and triangles that collapse are
     dropped. Prisms become solids, one per polygon piece.
   - Context blocks come from state.context.blocks; none when state.context.show is false.
   ========================================================================== */

const { cleanRing2, makeDoc } = SkFmt;

const PROGRAM_COLORS = {
  residential: "#4f7fd1", hotel: "#8a63c9", office: "#2f9e9a", retail: "#d9a22b",
  amenity: "#58a65c", parking: "#8b929a", mechanical: "#e0762f",
};
const CROWN_COLOR = "#d9a22b";
const CONTEXT_COLOR = "#c3c8ce";
const FALLBACK_COLOR = "#8b929a";
const HEX = /^#[0-9a-fA-F]{6}$/;

const r3 = (v) => Math.round(v * 1000) / 1000;
const r2 = (v) => Math.round(v * 100) / 100;
const num = (v, d) => (typeof v === "number" && Number.isFinite(v) ? v : d);
const cap = (s) => { s = String(s || ""); return s.charAt(0).toUpperCase() + s.slice(1); };

/** Tag and material name for a program key: "residential" → "Residential". */
const programLabel = (key) => cap(key) || "Program";

function programColor(state, key) {
  const c = state && state.programs && state.programs[key] && state.programs[key].color;
  return HEX.test(c || "") ? c : PROGRAM_COLORS[key] || FALLBACK_COLOR;
}

/** One multipolygon piece {outer, holes} → { outer, holes } cleaned, or null when the outer ring is degenerate. */
function cleanPiece(poly) {
  const outer = cleanRing2(poly && poly.outer);
  if (!outer) return null;
  const holes = [];
  for (const h of (poly && poly.holes) || []) {
    const c = cleanRing2(h, { hole: true });
    if (c) holes.push(c);
  }
  return { outer, holes };
}

const piecesOf = (mp) => (Array.isArray(mp) ? mp : []).map(cleanPiece).filter(Boolean);

/** Weld equal points of a flat-position mesh and drop triangles that collapse. → { vertices, triangles } */
function weldMesh(positions, indices) {
  const keyToIdx = new Map(), vertices = [], remap = [];
  for (let i = 0; i + 2 < positions.length; i += 3) {
    const p = [r3(positions[i]), r3(positions[i + 1]), r3(positions[i + 2])];
    const key = p.join(",");
    let k = keyToIdx.get(key);
    if (k === undefined) { k = vertices.length; vertices.push(p); keyToIdx.set(key, k); }
    remap.push(k);
  }
  const triangles = [];
  for (let i = 0; i + 2 < indices.length; i += 3) {
    const a = remap[indices[i]], b = remap[indices[i + 1]], c = remap[indices[i + 2]];
    if (a === undefined || b === undefined || c === undefined) continue;
    if (a === b || b === c || a === c) continue;
    triangles.push([a, b, c]);
  }
  return { vertices, triangles };
}

function towerToSketchup(state, built) {
  state = state || {};
  const plates = (built && built.plates) || [];
  const crownSolids = (built && built.solids) || [];

  const tagList = [], matList = [];
  const declared = new Set();
  const declare = (name, color) => {
    if (declared.has(name)) return;
    declared.add(name);
    tagList.push({ name, color, visible: true });
    matList.push({ name, color, alpha: 1 });
  };

  // ---- floors, grouped by zone ------------------------------------------------
  const groups = new Map();                       // key → { name, children, order }
  const groupFor = (plate) => {
    if (plate.zone === "podium" || plate.segmentIndex < 0) return ["podium", "Podium", -1];
    const si = plate.segmentIndex;
    const seg = (state.segments || [])[si];
    const prog = (seg && seg.program) || plate.program;
    return [`seg${si}`, `Segment ${si + 1} · ${programLabel(prog)}`, si];
  };

  let floorSolids = 0;
  for (const p of plates) {
    if (p.void || !(p.area > 0)) continue;
    const pieces = piecesOf(p.polygons);
    if (!pieces.length) continue;
    const prog = p.program || "residential";
    const label = programLabel(prog);
    declare(label, programColor(state, prog));
    const z0 = r3(p.z), z1 = r3(p.z + p.ftf);
    const name = `Floor ${p.n}`;
    const attributes = { floor: p.n, program: prog, area_sf: r2(p.area) };
    const solid = (nm, piece, extra = {}) => ({ type: "solid", name: nm, tag: label, material: label, outer: piece.outer, holes: piece.holes, z0, z1, ...extra });
    let node;
    if (pieces.length === 1) {
      node = solid(name, pieces[0], { attributes });
    } else {
      node = { type: "group", name, tag: label, material: label, attributes, children: pieces.map((pc, i) => solid(`${name} · piece ${i + 1}`, pc)) };
    }
    floorSolids += pieces.length;
    const [key, gname, order] = groupFor(p);
    let g = groups.get(key);
    if (!g) { g = { name: gname, children: [], order }; groups.set(key, g); }
    g.children.push(node);
  }

  const children = [];
  const ordered = [...groups.values()].sort((a, b) => a.order - b.order);
  for (const g of ordered) children.push({ type: "group", name: g.name, children: g.children });

  // ---- crown ---------------------------------------------------------------------
  const crownType = String((state.crown && state.crown.type) || "flat").toLowerCase();
  const crownKids = [];
  let prismN = 0;
  for (const s of crownSolids) {
    if (s.kind === "prism") {
      const base = s.role === "parapet" ? "Parapet" : s.role === "screen" ? "Screen" : "Crown step";
      const pieces = piecesOf(s.polygons);
      const z0 = r3(s.z0), z1 = r3(s.z1);
      if (!(z1 - z0 > 0.001)) continue;
      prismN++;
      pieces.forEach((pc, i) => {
        const nm = base === "Crown step" ? `${base} ${prismN}` : base;
        crownKids.push({ type: "solid", name: pieces.length > 1 ? `${nm} · piece ${i + 1}` : nm, tag: "Crown", material: "Crown", outer: pc.outer, holes: pc.holes, z0, z1 });
      });
    } else if (s.kind === "mesh") {
      const { vertices, triangles } = weldMesh(s.positions || [], s.indices || []);
      if (!vertices.length || !triangles.length) continue;
      crownKids.push({
        type: "mesh", name: crownType === "spire" ? "Spire" : crownType === "sloped" ? "Sloped roof" : "Crown",
        tag: "Crown", material: "Crown", vertices, triangles, soft: false, closed: true,
      });
    }
  }
  if (crownKids.length) {
    declare("Crown", CROWN_COLOR);
    children.push({ type: "group", name: "Crown", tag: "Crown", children: crownKids });
  }

  // ---- context -------------------------------------------------------------------
  const ctx = state.context;
  const blockKids = [];
  if (ctx && ctx.show !== false) {
    for (const b of ctx.blocks || []) {
      const w = num(b && b.w, 0), d = num(b && b.d, 0), h = num(b && b.h, 0);
      if (!(w > 0 && d > 0 && h > 0)) continue;
      const x = num(b.x, 0), y = num(b.y, 0);
      const outer = cleanRing2([[x - w / 2, y - d / 2], [x + w / 2, y - d / 2], [x + w / 2, y + d / 2], [x - w / 2, y + d / 2]]);
      if (!outer) continue;
      blockKids.push({ type: "solid", name: `Block ${blockKids.length + 1}`, tag: "Context", material: "Context", outer, holes: [], z0: 0, z1: r3(h) });
    }
  }
  if (blockKids.length) {
    declare("Context", CONTEXT_COLOR);
    children.push({ type: "group", name: "Context", tag: "Context", material: "Context", children: blockKids });
  }

  const name = String(state.name || "Tower");
  const gfa = plates.reduce((s, p) => s + (p.void ? 0 : num(p.area, 0)), 0);
  const top = plates.reduce((m, p) => Math.max(m, p.z + p.ftf), 0);
  const notes = [
    "Plan origin = the tool's plan origin (0, 0). x = east, y = north. Lengths in feet.",
    `Tower Generator: ${floorSolids} floor solids, gross floor area ${Math.round(gfa).toLocaleString("en-US")} sf, top of floors ${r2(top)} ft.`,
    "Each floor is one solid at full floor-to-floor height. Void floors are skipped.",
  ];

  const doc = makeDoc({
    source: "tower", name, location: null, zShift: 0, notes,
    tags: tagList, materials: matList,
    root: { type: "group", name, children },
  });
  return doc;
}

return { programLabel, towerToSketchup };
})();


const SketchupExport = (() => {
  /** The document for the design on screen (or for `state`/`built` when given). */
  function doc(state, built) {
    const s = state || Store.raw();
    const d = built || Derived.get();
    return SkTower.towerToSketchup(s, { plates: d.plates, solids: d.solids });
  }
  function filename(state) { return SkFmt.sketchupFilename((state || Store.raw()).name); }
  function save(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);   // revoking sooner can break some downloads
  }
  /** Build, check and download. `deliver(blob, filename)` replaces the browser download (tests). → { ok, filename, blob, errors } */
  function download({ deliver } = {}) {
    let d;
    try { d = doc(); } catch (e) { console.error(e); Toast.show('The SketchUp file could not be built for these settings.', 'bad'); return { ok: false, errors: [String(e && e.message)] }; }
    const v = SkFmt.validateDoc(d);
    if (!v.ok) { console.error(v.errors); Toast.show('The SketchUp file did not pass its own check, so it was not saved.', 'bad'); return { ok: false, errors: v.errors }; }
    if (!v.counts.solid && !v.counts.mesh) { Toast.show('Nothing to export yet: the design has no floors.', 'warn'); return { ok: false, errors: ['empty'] }; }
    const name = filename();
    const blob = SkFmt.docToBlob(d);
    (deliver || save)(blob, name);
    if (!deliver) Toast.show(`Saved ${name}. In SketchUp: Extensions > CMRLM > Import Design Tools file.`);
    return { ok: true, filename: name, blob, counts: v.counts };
  }
  return { doc, filename, download };
})();

/* ==========================================================================
   SUN UI  (docs/tower-project-sun-plan.md sections 4.1, 5.3 and 3.5)
   `SunUI` builds the View tab Sun section (it replaces the schema 1 buildSun), drives the study
   (date, time, place, time zone -> state.view.sun through SolarMod), Play, and the sun-hours controls and
   compute loop (SunHoursMod, in slices; SunLayer draws the result). Writes state.sun and state.view.sun only,
   with one exception: below the horizon it turns view.shadows off (plan section 3.5) and turns it back on
   when the sun is up again (only if it was this code that turned it off).
   ========================================================================== */
const SunUI = (() => {
  const ZONES = [
    ['us-eastern', 'US Eastern'], ['us-central', 'US Central'], ['us-mountain', 'US Mountain'], ['us-pacific', 'US Pacific'],
    ['us-arizona', 'US Arizona (no daylight time)'], ['fixed', 'Fixed offset from UTC'],
  ];
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const pad2 = (n) => String(n).padStart(2, '0');
  const r1 = (v) => Math.round(v * 10) / 10;
  const r2 = (v) => Math.round(v * 100) / 100;
  const year = () => new Date().getFullYear();
  const isoOf = (md) => (/^\d{4}-/.test(String(md)) ? String(md) : `${year()}-${md}`);
  const mdOf = (s) => String(s).slice(-5);
  const fmtMD = (md) => { const m = /^(\d{2})-(\d{2})$/.exec(mdOf(md)); return m ? `${MONTHS[+m[1] - 1] || '?'} ${+m[2]}` : String(md); };
  const hm = (min) => { const m = Math.round(min); return `${Math.floor(m / 60) % 24}:${pad2(((m % 60) + 60) % 60)}`; };
  const hm0 = (min) => { const m = Math.round(min); return `${pad2(Math.floor(m / 60) % 24)}:${pad2(((m % 60) + 60) % 60)}`; };
  const parseHM = (s) => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(s || '').trim()); return m ? +m[1] * 60 + +m[2] : NaN; };
  const touch = () => !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);

  const defaults = () => ({
    mode: 'manual',
    place: { source: 'default', lat: 33.749, lon: -84.388 },
    tz: { zone: 'us-eastern', offset: -5 },
    dates: ['03-20', '06-21', '12-21'],
    date: '03-20',
    time: 720,
    times: [540, 720, 900],
    play: false,
    hours: { on: false, spacing: 10, step: 30, date: '03-20', extent: 'site' },
  });
  /** The sun state with every key filled (the stored one may be missing keys). */
  function sunOf(state) {
    const D = defaults(), r = ((state || Store.raw()).sun) || {};
    const three = (a, d) => { const o = Array.isArray(a) ? a.slice(0, 3) : []; while (o.length < 3) o.push(d[o.length]); return o; };
    const fin = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
    return {
      mode: r.mode === 'study' ? 'study' : 'manual',
      place: { ...D.place, ...(r.place || {}) },
      tz: { ...D.tz, ...(r.tz || {}) },
      dates: three(r.dates, D.dates).map((x) => mdOf(x)),
      date: typeof r.date === 'string' ? mdOf(r.date) : D.date,
      time: fin(r.time, D.time),
      times: three(r.times, D.times).map((x, i) => fin(x, D.times[i])),
      play: false,
      hours: { ...D.hours, ...(r.hours || {}) },
    };
  }
  const sunState = () => sunOf(Store.raw());

  /* ---- place, time zone, frame ----------------------------------------------------------------------- */
  function siteLatLon() {
    try {
      if (!ProjectUI.has()) return null;
      if (typeof ProjectUI.sitePlace === 'function') {
        const sp = ProjectUI.sitePlace();
        return sp && isFinite(sp.lat) && isFinite(sp.lon) ? { lat: sp.lat, lon: sp.lon } : null;
      }
      const doc = ProjectUI.doc();
      const f = doc && doc.frame;
      if (f && typeof f.lat === 'number' && typeof f.lon === 'number' && isFinite(f.lat) && isFinite(f.lon)) return { lat: f.lat, lon: f.lon };
    } catch (e) { /* no project */ }
    return null;
  }
  const hasSiteCoords = () => !!siteLatLon();
  function placeOf(sun) {
    if (sun.place.source === 'site') {
      const s = siteLatLon();
      if (s) return { ...s, source: 'site', label: 'Project site' };
    }
    if (sun.place.source === 'typed') {
      return { lat: clamp(num(sun.place.lat, 33.749), -90, 90), lon: clamp(num(sun.place.lon, -84.388), -180, 180), source: 'typed', label: 'Typed place' };
    }
    return { lat: SolarMod.ATLANTA.lat, lon: SolarMod.ATLANTA.lon, source: 'default', label: 'Atlanta' };
  }
  const tzArg = (sun) => ({ zone: sun.tz.zone, offset: num(sun.tz.offset, -5) });
  const zoneLabel = (z) => (ZONES.find((x) => x[0] === z) || [z, z])[1];
  const rotation = () => { const p = Store.raw().placement; return p && typeof p === 'object' ? num(p.rotation, 0) : 0; };
  const offsetText = (o) => `UTC${o < 0 ? '−' : '+'}${Math.abs(o)}`;

  function calcAt(sun, md, minutes) {
    const P = placeOf(sun);
    return SolarMod.sunPosition(P.lat, P.lon, SolarMod.localToUTC(isoOf(md), minutes, tzArg(sun)));
  }
  function timesOf(sun, md) {
    const P = placeOf(sun);
    return SolarMod.sunTimes(P.lat, P.lon, isoOf(md), tzArg(sun));
  }
  /** What the light should be: true bearing -> tower frame azimuth, altitude kept at 3 degrees or more. */
  function viewSunFor(sun, rot) {
    const p = calcAt(sun, sun.date, sun.time);
    return { az: r1(SolarMod.localBearing(p.azimuth, rot)), alt: r1(Math.max(p.altitude, 3)), below: p.altitude <= 0, pos: p };
  }

  /* ---- writing the store ------------------------------------------------------------------------------- */
  let shadowsAutoOff = false, sheetMode = false, fixing = false;
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

  function shadowOp(below) {
    if (sheetMode) return null;
    const on = !!Store.raw().view.shadows;
    if (below && on) { shadowsAutoOff = true; return ['view.shadows', false]; }
    if (!below && shadowsAutoOff) { shadowsAutoOff = false; if (!on) return ['view.shadows', true]; }
    return null;
  }

  /** Merges a patch into state.sun and, in study mode, writes view.sun from the date, time and place.
   *  live = the drag stays open (one undo step when Store.commit runs); otherwise one step now. */
  function setSun(patch, o = {}) {
    const cur = sunOf();
    const next = {
      ...cur, ...patch,
      place: { ...cur.place, ...(patch.place || {}) },
      tz: { ...cur.tz, ...(patch.tz || {}) },
      hours: { ...cur.hours, ...(patch.hours || {}) },
      play: false,
    };
    const ops = [];
    if (next.mode === 'study') {
      const vs = viewSunFor(next, rotation());
      ops.push(['view.sun', { azimuth: vs.az, altitude: vs.alt }]);
      const so = shadowOp(vs.below);
      ops.push(['sun', next]);
      if (so) ops.push(so);
    } else {
      ops.push(['sun', next]);
      const so = shadowOp(false);
      if (so) ops.push(so);
    }
    fixing = true;
    try {
      for (const [path, value] of ops) Store.set(path, value, { live: true });
      if (!o.live) Store.commit();
    } finally { fixing = false; }
    refreshAll();
  }

  /** After any change from elsewhere (rotation, place from the project): keep view.sun matching the study. */
  function ensureConsistent() {
    const sun = sunOf();
    if (sun.mode !== 'study') return;
    const vs = viewSunFor(sun, rotation());
    const cur = Store.raw().view.sun || {};
    const ops = [];
    if (Math.abs(num(cur.azimuth, -999) - vs.az) > 0.05 || Math.abs(num(cur.altitude, -999) - vs.alt) > 0.05) ops.push(['view.sun', { azimuth: vs.az, altitude: vs.alt }]);
    const so = shadowOp(vs.below);
    if (so) ops.push(so);
    if (!ops.length) return;
    const had = Store.gestureActive();
    fixing = true;
    try {
      for (const [path, value] of ops) Store.set(path, value, { live: true });
      if (!had) Store.commit();
    } finally { fixing = false; }
  }

  /* ---- play ------------------------------------------------------------------------------------------------- */
  let playing = false, rafId = 0, lastT = 0;
  const dayBounds = (sun) => {
    const t = timesOf(sun, sun.date);
    if (t.polar === 'night') return null;
    if (t.polar === 'day' || t.sunrise == null || t.sunset == null) return { rise: 0, set: 1440, noon: t.noon };
    return { rise: t.sunrise, set: t.sunset, noon: t.noon };
  };
  function tick(now) {
    if (!playing) return;
    const dt = Math.min(0.25, (now - lastT) / 1000);
    lastT = now;
    const sun = sunOf(), b = dayBounds(sun);
    if (!b) { play(false); return; }
    const t = sun.time + 60 * dt;                       // one hour per second
    if (t >= b.set) { setSun({ time: Math.floor(b.set) }, { live: true }); play(false); return; }
    setSun({ time: r1(t) }, { live: true });
    rafId = requestAnimationFrame(tick);
  }
  function play(on) {
    on = !!on;
    if (on === playing) return;
    if (on) {
      let sun = sunOf();
      if (sun.mode !== 'study') { setSun({ mode: 'study' }); sun = sunOf(); }
      const b = dayBounds(sun);
      if (!b) { refreshAll(); return; }
      playing = true;
      if (sun.time >= b.set - 1 || sun.time < b.rise) setSun({ time: Math.ceil(b.rise) }, { live: true });
      lastT = performance.now();
      rafId = requestAnimationFrame(tick);
    } else {
      playing = false;
      cancelAnimationFrame(rafId);
      setSun({ time: Math.round(sunOf().time) });       // whole minute, closes the drag (one undo step)
    }
    refreshAll();
  }

  /* ---- sun hours ---------------------------------------------------------------------------------------------- */
  let job = null;
  let lastRun = null;                                   // { ms, computeMs, ... } of the last finished compute
  const nextFrame = () => new Promise((resolve) => {
    let done = false;
    const go = () => { if (!done) { done = true; resolve(); } };
    requestAnimationFrame(go);
    setTimeout(go, 60);                                 // a hidden tab does not run animation frames
  });
  const MAX_NODES = 360000;

  function projectFrameOn(sun) {
    return sun.hours.extent !== 'local' && ProjectUI.has() && ProjectUI.hasSite();
  }
  function placementObj() {
    const p = Store.raw().placement;
    return p && typeof p === 'object' && isFinite(p.x) && isFinite(p.y) ? { x: p.x, y: p.y, rotation: num(p.rotation, 0), baseZ: num(p.baseZ, 0) } : null;
  }
  /** The node grid for the current settings: { grid, frame, placement }. */
  function gridFor(sun, d) {
    let box, frame = 'local', pl = null;
    const info = projectFrameOn(sun) ? ProjectUI.siteInfo() : null;
    if (info && Array.isArray(info.boundary) && info.boundary.length >= 3) {
      frame = 'project'; pl = placementObj();
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const q of info.boundary) { minX = Math.min(minX, q[0]); maxX = Math.max(maxX, q[0]); minY = Math.min(minY, q[1]); maxY = Math.max(maxY, q[1]); }
      box = { minX, minY, maxX, maxY };
    } else {
      const s = d.bounds.site, u = d.bounds.union;
      box = { minX: Math.min(s.minX, u.minX) - 300, minY: Math.min(s.minY, u.minY) - 300, maxX: Math.max(s.maxX, u.maxX) + 300, maxY: Math.max(s.maxY, u.maxY) + 300 };
    }
    let spacing = [5, 10, 20].includes(+sun.hours.spacing) ? +sun.hours.spacing : (num(sun.hours.spacing, 10) > 0 ? +sun.hours.spacing : 10);
    let grid = SunHoursMod.sunGrid(box, spacing);
    while (grid.nx * grid.ny > MAX_NODES) { spacing *= 2; grid = SunHoursMod.sunGrid(box, spacing); }
    return { grid, frame, placement: pl };
  }
  /** What a sun-hours result depends on. A change after a compute marks it out of date. */
  function staleKey(state, d) {
    const sun = sunOf(state), c = state.context || {};
    const pl = sun.hours.extent !== 'local' ? state.placement : null;   // the project-frame grid depends on where the tower stands
    const site = sun.place.source === 'site' ? siteLatLon() : null;
    return JSON.stringify([d.geomId, c.show, c.blocks, pl, sun.place, site, sun.tz, sun.hours.date, sun.hours.spacing, sun.hours.step, sun.hours.extent]);
  }

  async function runCompute(j) {
    const t0 = performance.now();
    const state = Store.raw(), sun = sunOf(state), hrs = sun.hours;
    const d = Derived.get();
    const P = placeOf(sun), tz = tzArg(sun);
    const { grid, frame, placement } = gridFor(sun, d);
    const cs = SunHoursMod.casters(state, { plates: d.plates, solids: d.solids }, frame === 'project' ? placement : null);
    const samples = SunHoursMod.samplesFor(P.lat, P.lon, isoOf(hrs.date), tz, num(hrs.step, 30) > 0 ? +hrs.step : 30);
    const key = staleKey(state, d);
    const acc = new Float64Array(grid.nx * grid.ny);
    j.total = samples.length; j.done = 0;
    let computeMs = 0, cancelled = false;
    for (let k = 0; k < samples.length;) {
      if (j.cancel) { cancelled = true; break; }
      const slice0 = performance.now();
      do {
        const r = SunHoursMod.sunHours(cs, grid, samples.slice(k, k + 2));
        for (let i = 0; i < acc.length; i++) acc[i] += r.hours[i];
        k += 2;
      } while (k < samples.length && !j.cancel && performance.now() - slice0 < 10);
      computeMs += performance.now() - slice0;
      j.done = Math.min(k, samples.length);
      refreshHours();
      await nextFrame();
    }
    const out = { cancelled, ms: Math.round(performance.now() - t0), computeMs: Math.round(computeMs), nx: grid.nx, ny: grid.ny, nodes: grid.nx * grid.ny, spacing: grid.spacing, step: +hrs.step, frame, samples: samples.length, casters: cs.length };
    if (cancelled) return out;
    const dayLength = samples.reduce((a, s) => a + s.dt, 0) / 60;
    SunLayer.setResult({
      key, frame, spacing: grid.spacing, nx: grid.nx, ny: grid.ny, x0: grid.x0, y0: grid.y0, date: hrs.date, step: +hrs.step,
      hours: Float32Array.from(acc), dayLength, samples: samples.length, ms: out.ms,
    });
    lastRun = out;
    sendResult({ spacing: grid.spacing, n: grid.n, nx: grid.nx, ny: grid.ny, x0: grid.x0, y0: grid.y0, frame, date: hrs.date, step: +hrs.step, hours: SunLayer.result().hours });
    if (!hrs.on) setSun({ hours: { on: true } });
    return out;
  }

  /** Starts a sun-hours compute (opts may change the form first: spacing, step, date, extent). Resolves to a summary. */
  function compute(opts) {
    if (job) return job.promise;
    const patch = {};
    for (const k of ['spacing', 'step', 'date', 'extent']) if (opts && opts[k] !== undefined) patch[k] = opts[k];
    if (Object.keys(patch).length) setSun({ hours: patch });
    const j = { cancel: false, done: 0, total: 0 };
    job = j;
    j.promise = runCompute(j).then((r) => { job = null; refreshAll(); return r; }, (e) => {
      job = null; refreshAll();
      console.error(e);
      Toast.show(e && e.message ? `Sun hours: ${e.message}` : 'The sun hours could not be computed.', 'bad', 6000);
      return { error: String((e && e.message) || e), cancelled: false };
    });
    refreshAll();
    return j.promise;
  }
  function cancel() { if (job) { job.cancel = true; } }

  /* ---- the project file ------------------------------------------------------------------------------------------- */
  // ProjectUI (09b_project.js) writes the sun section itself (state, samples, place) with the next save; the sun-hours result goes

  const hasWriteSun = () => typeof ProjectUI !== 'undefined' && typeof ProjectUI.writeSun === 'function';

  let restoredFor = null;

        key: staleKey(Store.raw(), Derived.get()), frame: sh.frame === 'local' ? 'local' : 'project', spacing: sh.spacing, nx: sh.nx, ny: sh.ny, x0: sh.x0, y0: sh.y0,
        date: md, step: num(sh.step, 30), hours: sh.hours, dayLength: samples.reduce((a, x) => a + x.dt, 0) / 60, samples: samples.length, ms: 0,
      });
    } catch (e) { console.error(e); }
  }

  /* ---- the panel ---------------------------------------------------------------------------------------------- */
  const refreshers = [];
  function refreshAll() { for (const fn of refreshers) { try { fn(); } catch (e) { console.error(e); } } }
  let hoursRefresh = null;

  function chipRow(label, itemsFn, get, set, attr) {
    const wrap = h('div', { class: 'chips', role: 'group', 'aria-label': label || attr, 'data-sun': attr });
    let key = '';
    const refresh = () => {
      const items = itemsFn(), k = JSON.stringify(items);

  function selectRow(label, options, get, set, attr) {

    };

  }
  const fieldBind = (get, set) => ({ get, set: (v, live) => set(v, !!live), commit: () => Store.commit() });

  function buildTimeRow() {
    const range = h('input', { class: 'range', type: 'range', min: 0, max: 1440, step: 15, 'aria-label': 'Time of day', 'data-sun': 'time-slider' });
    const field = h('input', { class: 'numfield', type: 'time', step: 900, 'aria-label': 'Time', 'data-sun': 'time-field', style: 'width:auto;min-width:96px' });
    range.addEventListener('input', () => setSun({ time: +range.value }, { live: true }));
    for (const ev of ['change', 'pointerup', 'pointercancel', 'blur']) range.addEventListener(ev, () => Store.commit());
    field.addEventListener('change', () => { const m = parseHM(field.value); if (isFinite(m)) setSun({ time: m }); });
    refreshers.push(() => {
      const sun = sunOf(), b = dayBounds(sun);
      const lo = b ? Math.floor(b.rise / 15) * 15 : 0, hi = b ? Math.ceil(b.set / 15) * 15 : 1440;

  }

  function build(ctx) {

    const modeSel = selectRow('Mode', [{ value: 'manual', label: 'Manual (azimuth and altitude)' }, { value: 'study', label: 'Date and time (real sun)' }],
      () => sunOf().mode, (v) => { if (v !== 'study') play(false); setSun({ mode: v }); }, 'mode');

    /* date */
    const dateRow = h('div', { class: 'ctl' }, h('label', { class: 'ctl-label' }, 'Date'));
    const dateChips = chipRow(null, () => sunOf().dates.map((md) => ({ value: md, label: fmtMD(md) })), () => sunOf().date, (md) => setSun({ date: md }), 'date-presets');

    const playBtn = h('button', { class: 'btn outline sm', type: 'button', 'data-sun': 'play', style: 'min-height:44px;min-width:88px', onclick: () => play(!playing) }, 'Play');

    /* place and time zone */
    const placeSel = selectRow('Place', [
      { value: 'default', label: 'Atlanta (default)' },
      { value: 'site', label: 'Project site', disabled: () => !hasSiteCoords() },
      { value: 'typed', label: 'Typed latitude and longitude' },
    ], () => sunOf().place.source, (v) => {
      if (v === 'typed') { const P = placeOf(sunOf()); setSun({ place: { source: 'typed', lat: r2(P.lat), lon: r2(P.lon) } }); } else setSun({ place: { source: v } });
    }, 'place');
    const latF = Controls.slider({ label: 'Latitude (north +)', compact: true, bind: fieldBind(() => num(sunOf().place.lat, 33.749), (v, live) => setSun({ place: { source: 'typed', lat: v } }, { live })), min: -90, max: 90, step: 0.1, hardMin: -90, hardMax: 90, format: (v) => String(Math.round(v * 1000) / 1000), inputMode: 'decimal' });
    const lonF = Controls.slider({ label: 'Longitude (east +)', compact: true, bind: fieldBind(() => num(sunOf().place.lon, -84.388), (v, live) => setSun({ place: { source: 'typed', lon: v } }, { live })), min: -180, max: 180, step: 0.1, hardMin: -180, hardMax: 180, format: (v) => String(Math.round(v * 1000) / 1000), inputMode: 'decimal' });
    const typed = Controls.when(() => sunOf().place.source === 'typed', [Controls.group([latF.el, lonF.el])]);

    const fixedOff = Controls.when(() => sunOf().tz.zone === 'fixed', [offF.el]);
    const siteNote = h('p', { class: 'help', 'data-sun': 'place-note' });
    refreshers.push(() => {
      const sun = sunOf(), P = placeOf(sun);
      const fell = sun.place.source === 'site' && P.source !== 'site';
      siteNote.textContent = fell ? 'This project has no site coordinates, so Atlanta is used.' : `${P.label}: ${P.lat.toFixed(3)}, ${P.lon.toFixed(3)}`;

    const readout = h('div', { 'data-sun': 'readout', style: 'display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;font-size:12.5px;margin:6px 0 4px' });

    refreshers.push(() => {
      const sun = sunOf();
      const p = calcAt(sun, sun.date, sun.time), t = timesOf(sun, sun.date), rot = rotation();
      const off = SolarMod.tzOffset(sun.tz.zone, isoOf(sun.date), sun.time, sun.tz.offset);
      const rows = [

        ['Sunrise', t.sunrise == null ? '—' : hm(t.sunrise)], ['Sunset', t.sunset == null ? '—' : hm(t.sunset)],

    const sheetBtn = h('button', { class: 'btn solid sm', type: 'button', 'data-sun': 'sheet', style: 'min-height:44px', onclick: () => sheetClick() }, 'Make shadow study sheet');
    const sheetFields = h('div', { style: 'display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:4px 0' });

      return f;
    });

      const f = h('input', { class: 'numfield', type: 'text', inputmode: 'numeric', placeholder: 'h:mm', autocomplete: 'off', 'aria-label': `Sheet time ${i + 1} (24-hour, h:mm)`, 'data-sun': `sheet-time-${i}`, style: 'width:100%' });

    const extentRow = Controls.when(() => ProjectUI.has() && ProjectUI.hasSite(), [chipRow('Area', () => [{ value: 'site', label: 'Project site' }, { value: 'local', label: 'Around the tower' }], () => sunOf().hours.extent, (v) => setSun({ hours: { extent: v } }), 'hours-extent')]);
    const computeBtn = h('button', { class: 'btn solid sm', type: 'button', 'data-sun': 'compute', style: 'min-height:44px;min-width:110px', onclick: () => { compute(); } }, 'Compute');
    const cancelBtn = h('button', { class: 'btn outline sm', type: 'button', 'data-sun': 'cancel', style: 'min-height:44px;min-width:88px', onclick: () => cancel() }, 'Cancel');
    const progress = h('progress', { max: 1, value: 0, 'data-sun': 'progress', style: 'width:100%;height:8px' });
    const status = h('p', { class: 'help', 'data-sun': 'hours-status' });
    const badge = h('span', { 'data-sun': 'stale', style: 'color:var(--warn);font-weight:600;font-size:12px' }, 'Out of date');
    const showT = Controls.toggle({ label: 'Show sun hours on the ground', bind: { get: () => !!sunOf().hours.on, set: (v) => setSun({ hours: { on: !!v } }), commit: () => {} } });
    hoursRefresh = () => {
      const busy = !!job, info = SunLayer.info();
      computeBtn.disabled = busy; cancelBtn.hidden = !busy; progress.hidden = !busy;
      if (busy) { progress.max = Math.max(1, job.total); progress.value = job.done; }
      badge.hidden = !(info.stale && info.result);

        ? `${fmtMD(r.date)}: ${r.nx} × ${r.ny} nodes at ${r.spacing} ft, ${r.samples == null ? '' : r.samples + ' times, '}${((r.ms || 0) / 1000).toFixed(2)} s. Day length ${r.dayLength.toFixed(1)} h. Most sun ${r.max.toFixed(1)} h.`

    };

    const noteHours = Controls.help('Sun hours use flat ground at the tower ground floor. The tower and the context blocks cast shadow; terrain does not.');

    const studyBody = [
      dateRow, timeBlock, placeSel, typed.el, siteNote, tzSel, fixedOff.el, readout, readNote,
      Controls.label('Shadow study sheet'),
      Controls.help('Three dates by three times in one picture (plan view, shadows on). Change the dates and times below.'),
      sheetFields, sheetBtn,

    const study = Controls.when(isStudy, studyBody);
    const manual = Controls.when(() => !isStudy(), legacy.children);
    refreshers.push(() => { study.refresh(); });
    refreshAll();
    return { children: [modeSel, manual.el, study.el] };
  }

  async function sheetClick() {
    try { await SunStudy.make({ deliver: true }); } catch (e) { console.error(e); Toast.show(e && e.message ? e.message : 'The sheet could not be made.', 'bad', 6000); }
    refreshAll();
  }

  /* ---- start ------------------------------------------------------------------------------------------------------ */
  function onStore(state, info) {
    const kind = info && info.kind;
    if (kind === 'replace') shadowsAutoOff = false;
    if (!fixing && kind !== 'undo' && kind !== 'redo') ensureConsistent();
    restoreStored();
    refreshAll();
  }
  /** Called once from 13_start.js after UI.init() and before ProjectUI.start(). */
  function init() {
    SunLayer.setKeyFn(staleKey);
    SunLayer.onChange(() => { refreshHours(); });
    Store.subscribe(onStore);
    // A touch device starts with the cheaper sun-hours settings (plan section 5.4). Written silently: no undo step.
    try {
      const raw = Store.raw();
      if (touch() && raw.sun && raw.sun.hours && raw.sun.hours.spacing === 10 && raw.sun.hours.step === 30 && !raw.sun.hours.on) { raw.sun.hours.spacing = 20; raw.sun.hours.step = 60; }
    } catch (e) { /* ignore */ }
    ensureConsistent();
    refreshAll();
  }
  /** For tests and the __tower hooks. */
  function info() {
    const sun = sunOf(), st = Store.raw(), P = placeOf(sun), t = timesOf(sun, sun.date), p = calcAt(sun, sun.date, sun.time);
    return {
      mode: sun.mode, date: sun.date, time: sun.time, dates: sun.dates, times: sun.times, playing, play: playing,
      place: { source: P.source, label: P.label, lat: P.lat, lon: P.lon }, tz: { ...sun.tz, offset: SolarMod.tzOffset(sun.tz.zone, isoOf(sun.date), sun.time, sun.tz.offset) },
      azimuth: p.azimuth, altitude: p.altitude, below: p.altitude <= 0, sunrise: t.sunrise, noon: t.noon, sunset: t.sunset, polar: t.polar,
      rotation: rotation(), viewSun: { ...st.view.sun }, shadows: !!st.view.shadows, shadowsAutoOff,
      hours: { ...sun.hours, computing: !!job, progress: job ? { done: job.done, total: job.total } : null, last: lastRun },
    };
  }

  return {

/* ==========================================================================
   SHARED: storage
   src/shared/storage.js inlined unchanged (apart from the export keywords),
   plus `Options`, the tower tool's glue: save, duplicate, rename, delete, the
   option menu, export / import, autosave and restore.
   Custom AI prompts ride in the same blob (storage.listPrompts / savePrompt / removePrompt).
   Saved options live under localStorage key `towergen.options.v1`; the
   working copy autosaves into the "__current" slot after a 1 s pause.
   ========================================================================== */
/* ---- src/shared/storage.js ---- */
const StorageMod = (() => {
/* ==========================================================================
   SHARED: storage
   Save, load, export and import of design "options" in localStorage.

   One localStorage key holds:
     { schema, options: [{ id, name, createdAt, updatedAt, state }], current }
   where `current` is the autosave slot: { state, updatedAt } (slot "__current").
   An optional `prompts: [{ id, title, template, ... }]` list (custom AI prompts) rides in the same blob; it is
   omitted while empty, travels in export / import, and import renames title collisions "Title (2)".

   Rules
   - Every storage access is inside try/catch. On any failure onNotice(message)
     is called ONCE (per storage instance) and the data stays in memory, so the
     tool keeps working for the rest of the session.
   - `migrate(state, fromSchema)` runs whenever a state with state.schema <
     `schema` is loaded or imported. It must return the migrated state.
   - Pure ES module. No DOM access except export download / visibility flush,
     both guarded.
   ========================================================================== */

const AUTOSAVE_MS = 1000;
const MAX_IMPORT_BYTES = 20 * 1024 * 1024;

/* ---------- small helpers ---------- */

function clone(v) {
  return v === undefined ? undefined : JSON.parse(JSON.stringify(v));
}

function isObj(v) {
  return v !== null && typeof v === "object" && !Array.isArray(v);
}

function newId() {
  try {
    if (globalThis.crypto && typeof globalThis.crypto.randomUUID === "function") return globalThis.crypto.randomUUID();
  } catch (e) { /* fall through */ }
  return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

function pad2(n) { return String(n).padStart(2, "0"); }

/** `towergen-options-YYYY-MM-DD.json` (local date). */
function exportFilename(date = new Date(), prefix = "towergen-options") {
  const d = date instanceof Date ? date : new Date(date);
  return `${prefix}-${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}.json`;
}

/** "Name" → "Name (2)", "Name (3)" … first one not in `taken` (case-insensitive). */
function uniqueName(name, taken) {
  const lower = new Set([...taken].map((n) => String(n).trim().toLowerCase()));
  const base = String(name || "").trim() || "Untitled";
  if (!lower.has(base.toLowerCase())) return base;
  for (let n = 2; n < 100000; n++) {
    const candidate = `${base} (${n})`;
    if (!lower.has(candidate.toLowerCase())) return candidate;
  }
  return `${base} (${newId()})`;
}

/* ---------- factory ---------- */

/**
 * @param {object}   cfg
 * @param {string}   cfg.key       localStorage key, e.g. "towergen.options.v1"
 * @param {number}   cfg.schema    current state schema number
 * @param {Function} [cfg.migrate] (state, fromSchema) => state
 * @param {Function} [cfg.onNotice] (message) => void, called at most once
 * @param {number}   [cfg.debounceMs=1000]  autosave delay
 * @param {string}   [cfg.filePrefix="towergen-options"]  export filename prefix
 * @param {object}   [cfg.storage]  Storage-like object (tests); default window.localStorage
 */
function createStorage({
  key,
  schema,
  migrate,
  onNotice,
  debounceMs = AUTOSAVE_MS,
  filePrefix = "towergen-options",
  storage,
} = {}) {
  if (!key) throw new Error("createStorage: `key` is required");
  if (!Number.isFinite(schema)) throw new Error("createStorage: `schema` must be a number");

  let noticed = false;
  let persistent = true;     // false once any read/write failed
  let readOnly = false;      // data written by a newer app version: never overwrite
  let lastRaw = null;        // last string we know is in storage
  let data = { schema, options: [], current: null, prompts: [] };
  let timer = null;
  let pendingAutosave = null;

  function notice(message) {
    persistent = false;
    if (noticed) return;
    noticed = true;
    try { if (typeof onNotice === "function") onNotice(message); } catch (e) { /* ignore */ }
  }

  function backend() {
    // Accessing window.localStorage itself can throw (blocked site data).
    return storage || globalThis.localStorage;

  /* ----- migration ----- */

  function migrateState(state, fromSchema) {
    if (!isObj(state)) return state;
    const from = Number.isFinite(state.schema) ? state.schema : fromSchema;
    if (!Number.isFinite(from) || from >= schema) {
      if (!Number.isFinite(state.schema)) state.schema = schema;
      return state;
    }
    let out = state;
    try {
      out = typeof migrate === "function" ? migrate(clone(state), from) : state;
      if (!isObj(out)) out = state;
    } catch (e) {
      notice("Some saved options are from an older version and could not be updated.");
      return state;
    }
    out.schema = schema;
    return out;
  }

  /* ----- parse / validate stored blob ----- */

  function normalizeRecord(r, fallbackSchema) {
    if (!isObj(r) || !isObj(r.state)) return null;
    const now = Date.now();
    const num = (v) => (Number.isFinite(v) ? v : now);
    return {
      id: typeof r.id === "string" && r.id ? r.id : newId(),
      name: typeof r.name === "string" && r.name.trim() ? r.name.trim() : "Untitled",
      createdAt: num(r.createdAt),
      updatedAt: num(r.updatedAt),
      state: migrateState(clone(r.state), fallbackSchema),
    };
  }

  /** A custom prompt record (any extra fields are kept), or null when it has no usable title and template. */
  function normalizePrompt(p) {
    if (!isObj(p) || typeof p.title !== "string" || !p.title.trim() || typeof p.template !== "string") return null;
    const now = Date.now();
    const num = (v) => (Number.isFinite(v) ? v : now);
    return {
      ...clone(p),
      id: typeof p.id === "string" && p.id ? p.id : newId(),
      title: p.title.trim(),
      group: "custom",
      template: p.template,
      uses: Array.isArray(p.uses) ? p.uses.filter((u) => typeof u === "string") : [],
      createdAt: num(p.createdAt),

    if (!isObj(obj) || !Array.isArray(obj.options) || !Number.isFinite(obj.schema)) return null;
    const out = { schema, options: [], current: null, prompts: [], newer: obj.schema > schema };
    const seen = new Set();
    for (const r of obj.options) {
      const rec = normalizeRecord(r, obj.schema);
      if (!rec) continue;
      if (seen.has(rec.id)) rec.id = newId();
      seen.add(rec.id);
      out.options.push(rec);
    }
    if (Array.isArray(obj.prompts)) {
      const ids = new Set();
      for (const p of obj.prompts) {
        const rec = normalizePrompt(p);
        if (!rec) continue;
        if (ids.has(rec.id)) rec.id = newId();
        ids.add(rec.id);
        out.prompts.push(rec);
      }
    }
    if (isObj(obj.current) && isObj(obj.current.state)) {
      out.current = {
        state: migrateState(clone(obj.current.state), obj.schema),
        updatedAt: Number.isFinite(obj.current.updatedAt) ? obj.current.updatedAt : Date.now(),
      };

  function load(initial) {
    let raw;

      raw = backend().getItem(key);
    } catch (e) {
      notice("Saving is unavailable in this browser, so options will only be kept until you close this page.");
      return;
    }
    if (raw === lastRaw && !initial) return;       // nothing changed since we last looked
    if (raw === null || raw === undefined) {
      lastRaw = null;
      return;
    }
    const parsed = parseBlob(raw);
    if (!parsed) {
      lastRaw = raw;
      notice("Saved options could not be read and were reset. A backup copy of the old data was kept.");
      if (initial) {
        data = { schema, options: [], current: null, prompts: [] };
        try { backend().setItem(key + ".corrupt", raw); } catch (e) { /* ignore */ }
      }

      return;
    }
    if (parsed.newer) {
      readOnly = true;
      notice("Saved options were made by a newer version of this tool. They can be viewed but changes will not be saved.");
    }
    delete parsed.newer;
    data = parsed;
    lastRaw = raw;
  }

  function persist() {
    if (readOnly) return false;
    let raw;
    try {
      const blob = { schema, options: data.options, current: data.current };
      if (data.prompts.length) blob.prompts = data.prompts;
      raw = JSON.stringify(blob);
    } catch (e) {
      notice("Options could not be saved.");
      return false;
    }
    try {
      backend().setItem(key, raw);
      lastRaw = raw;
      return true;
    } catch (e) {
      notice("Saving is unavailable in this browser (storage is blocked or full). Options will only be kept until you close this page.");
      return false;
    }

  /* ----- records ----- */

  function find(id) { return data.options.find((o) => o.id === id); }
  function names(except) { return data.options.filter((o) => o !== except).map((o) => o.name); }
  function out(rec) { return rec ? clone(rec) : null; }
  function stamp(state) {
    const s = clone(state);
    if (isObj(s) && !Number.isFinite(s.schema)) s.schema = schema;
    return s;
  }

  const api = {
    /** All saved options, most recently updated first: [{id,name,createdAt,updatedAt,state}] (copies). */
    list() {
      load(false);
      return data.options.slice().sort((a, b) => b.updatedAt - a.updatedAt).map(out);
    },

    get(id) {
      load(false);
      return out(find(id));
    },

    /** Saves a new option; returns its id. Name is kept as given (not renamed). */
    save(state, name) {
      load(false);
      const now = Date.now();
      const rec = {
        id: newId(),
        name: String(name || "").trim() || "Untitled",
        createdAt: now,
        updatedAt: now,
        state: stamp(state),
      };
      data.options.push(rec);
      persist();
      return rec.id;
    },

    /** Replaces the state of an existing option (optionally renames). Returns true if found. */
    update(id, state, name) {
      load(false);
      const rec = find(id);
      if (!rec) return false;
      rec.state = stamp(state);
      if (typeof name === "string" && name.trim()) rec.name = name.trim();
      rec.updatedAt = Date.now();
      persist();
      return true;
    },

    rename(id, name) {
      load(false);
      const rec = find(id);
      if (!rec || !String(name || "").trim()) return false;
      rec.name = String(name).trim();
      rec.updatedAt = Date.now();
      persist();
      return true;
    },

    remove(id) {
      load(false);
      const i = data.options.findIndex((o) => o.id === id);
      if (i < 0) return false;
      data.options.splice(i, 1);
      persist();
      return true;
    },

    /** Copies an option; newName defaults to "Name (2)" style. Returns the new id or null. */
    duplicate(id, newName) {
      load(false);
      const src = find(id);
      if (!src) return null;
      const now = Date.now();
      const rec = {
        id: newId(),
        name: uniqueName(String(newName || "").trim() || src.name, names()),
        createdAt: now,
        updatedAt: now,
        state: clone(src.state),
      };
      data.options.push(rec);
      persist();
      return rec.id;
    },

    /** Custom prompts, oldest first (copies). */
    listPrompts() {
      load(false);
      return data.prompts.map(clone);
    },

    /** Adds a custom prompt, or replaces the one with the same id. Returns the saved copy, or null when it has no title / template. */
    savePrompt(prompt) {
      load(false);
      const old = isObj(prompt) ? data.prompts.find((p) => p.id === prompt.id) : null;
      const rec = normalizePrompt({ ...prompt, updatedAt: Date.now(), createdAt: old ? old.createdAt : Date.now() });
      if (!rec) return null;
      if (old) data.prompts[data.prompts.indexOf(old)] = rec; else data.prompts.push(rec);
      persist();
      return clone(rec);
    },

    removePrompt(id) {
      load(false);
      const i = data.prompts.findIndex((p) => p.id === id);
      if (i < 0) return false;
      data.prompts.splice(i, 1);
      persist();
      return true;
    },

    /** Debounced (1 s) save of the working state into the "__current" slot. */
    autosave(state) {
      try { pendingAutosave = stamp(state); } catch (e) { notice("Options could not be saved."); return; }
      if (timer !== null) clearTimeout(timer);
      timer = setTimeout(api.flush, debounceMs);
    },

    /** Writes any pending autosave immediately. */
    flush() {
      if (timer !== null) { clearTimeout(timer); timer = null; }
      if (pendingAutosave === null) return;
      load(false);
      data.current = { state: pendingAutosave, updatedAt: Date.now() };
      pendingAutosave = null;
      persist();
    },

    /** The autosaved working state (migrated copy), or null. A not-yet-flushed autosave counts. */
    loadAutosave() {
      if (pendingAutosave !== null) return clone(pendingAutosave);
      load(false);
      return data.current ? clone(data.current.state) : null;
    },

    /** All saved options (and custom prompts, when there are any) as an application/json Blob. */
    exportAll() {
      load(false);
      const payload = {
        schema,
        exportedAt: new Date().toISOString(),
        options: data.options.map(out),
      };
      if (data.prompts.length) payload.prompts = data.prompts.map(clone);
      return new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    },

    /** `towergen-options-YYYY-MM-DD.json` */
    exportFilename(date) { return exportFilename(date, filePrefix); },

    /** Browser only: triggers a download of exportAll(). */
    downloadExport() {
      const blob = api.exportAll();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = api.exportFilename();
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    },

    /**
     * Appends the options of an exportAll() file. Never replaces existing options.
     * Custom prompts in the file are appended too (a title already in use becomes "Title (2)").
     * Resolves {added, skipped, promptsAdded}; rejects with an Error whose message is shown to the user.
     */
    async importFile(file) {
      if (!file) throw new Error("No file was chosen.");
      if (typeof file.size === "number" && file.size > MAX_IMPORT_BYTES) {
        throw new Error("That file is too large to be an options file.");
      }
      let text;
      try {
        text = typeof file.text === "function" ? await file.text() : await readWithReader(file);
      } catch (e) {
        throw new Error("The file could not be read.");
      }
      let obj;
      try { obj = JSON.parse(text); } catch (e) {
        throw new Error("This file is not valid JSON, so it is not an options file.");
      }
      if (!isObj(obj) || !Array.isArray(obj.options)) {
        throw new Error("This file does not look like an exported options file (no options list found).");
      }
      if (!Number.isFinite(obj.schema)) {
        throw new Error("This file does not look like an exported options file (no schema number).");
      }
      if (obj.schema > schema) {
        throw new Error("This file was made by a newer version of the tool. Update the tool and try again.");
      }

      load(false);
      const taken = new Set(names());
      const incoming = [];
      let skipped = 0;
      for (const r of obj.options) {
        if (!isObj(r) || !isObj(r.state)) { skipped++; continue; }
        const rec = normalizeRecord({ ...r, id: undefined }, obj.schema);   // always a fresh id
        if (!rec) { skipped++; continue; }
        rec.name = uniqueName(rec.name, taken);
        taken.add(rec.name);
        incoming.push(rec);
      }
      const takenTitles = new Set(data.prompts.map((p) => p.title));
      const incomingPrompts = [];
      if (Array.isArray(obj.prompts)) {
        for (const p of obj.prompts) {
          const rec = normalizePrompt({ ...(isObj(p) ? p : {}), id: undefined });
          if (!rec) continue;
          rec.title = uniqueName(rec.title, takenTitles);
          takenTitles.add(rec.title);
          incomingPrompts.push(rec);
        }
      }
      if (incoming.length === 0 && incomingPrompts.length === 0 && obj.options.length > 0) {
        throw new Error("None of the options in this file could be used.");
      }
      data.options.push(...incoming);
      data.prompts.push(...incomingPrompts);
      if (incoming.length || incomingPrompts.length) persist();
      const res = { added: incoming.length, skipped };
      if (incomingPrompts.length) res.promptsAdded = incomingPrompts.length;

    },

    isPersistent() { return persistent; },

    /** Stops timers and listeners (tests). Pending autosave is flushed first. */
    dispose() {
      api.flush();
      if (removeListener) removeListener();
    },
  };

  let removeListener = null;
  try {
    if (typeof document !== "undefined" && document.addEventListener) {
      const onHide = () => { if (document.visibilityState === "hidden") api.flush(); };
      document.addEventListener("visibilitychange", onHide);
      window.addEventListener("pagehide", api.flush);
      removeListener = () => {
        document.removeEventListener("visibilitychange", onHide);
        window.removeEventListener("pagehide", api.flush);
      };
    }
  } catch (e) { /* ignore */ }

  return api;
}

function readWithReader(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result));
    fr.onerror = () => reject(fr.error);
    fr.readAsText(file);
  });
}
