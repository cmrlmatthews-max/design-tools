    hemi = new THREE.HemisphereLight(0xffffff, 0xb4bac2, 2.3);
    scene.add(hemi);

    sun = new THREE.DirectionalLight(0xffffff, 1.7);
    sun.castShadow = true;
    const fine = window.matchMedia && matchMedia('(pointer: fine)').matches;
    sun.shadow.mapSize.set(fine ? 4096 : 2048, fine ? 4096 : 2048);
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 0.4;
    scene.add(sun, sun.target);

    // Ground: a deep slab so elevations show a ground band; top face at elevation 0.
    const slab = new THREE.BoxGeometry(GROUND_SIZE, GROUND_SIZE, GROUND_SIZE);   // plan x, y, elevation
    slab.translate(0, 0, -GROUND_SIZE / 2);
    slab.applyMatrix4(planMatrix(0));
    ground = new THREE.Mesh(slab, new THREE.MeshBasicMaterial({ color: 0xdddddd, side: THREE.DoubleSide }));
    ground.renderOrder = -2;
    scene.add(ground);

    // Shadow catcher on the ground.
    const sp = new THREE.PlaneGeometry(8000, 8000);
    sp.applyMatrix4(planMatrix(0));
    shadowPlane = new THREE.Mesh(sp, new THREE.ShadowMaterial({ opacity: 0.24, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -2 }));
    shadowPlane.receiveShadow = true;
    shadowPlane.renderOrder = 1;
    scene.add(shadowPlane);

    // Grid: 10 ft minor, 50 ft major, drawn in a shader so it stays crisp at any zoom.
    const gp = new THREE.PlaneGeometry(8000, 8000);
    gp.applyMatrix4(planMatrix(0));
    gridMesh = new THREE.Mesh(gp, new THREE.ShaderMaterial({
      uniforms: gridUniforms, transparent: true, depthWrite: false, side: THREE.DoubleSide,
      polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4,
      vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
      fragmentShader: `
        uniform vec3 uMinor; uniform vec3 uMajor; uniform float uMinorA; uniform float uMajorA; uniform vec2 uFade;
        varying vec3 vW;
        float gridLine(vec2 p, float size){
          vec2 c = p / size;
          vec2 fw = max(fwidth(c), vec2(1e-6));
          vec2 g = abs(fract(c - 0.5) - 0.5) / fw;
          float line = 1.0 - min(min(g.x, g.y), 1.0);
          float f = max(fw.x, fw.y);
          return line * (1.0 - smoothstep(0.12, 0.3, f));
        }
        void main(){
          float minor = gridLine(vW.xz, 10.0) * uMinorA;
          float major = gridLine(vW.xz, 50.0) * uMajorA;
          float fade = 1.0 - smoothstep(uFade.x, uFade.y, length(vW.xz));
          float a = max(minor, major) * fade;
          if (a < 0.004) discard;
          gl_FragColor = vec4(major >= minor ? uMajor : uMinor, a);
          #include <colorspace_fragment>
        }`,
    }));
    gridMesh.renderOrder = 2;
    scene.add(gridMesh);

    // Scale figure, 6 ft tall.
    const fm = new THREE.MeshStandardMaterial({ color: 0x69727c, roughness: 0.9 });
    figure = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.62, 4.7, 16), fm);
    body.position.y = 2.35;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.55, 16, 12), new THREE.MeshStandardMaterial({ color: 0x69727c, roughness: 0.9 }));
    head.position.y = 5.45;
    figure.add(body, head);
    figure.traverse((o) => { if (o.isMesh) o.castShadow = true; });
    scene.add(figure);

    selOverlay = new THREE.Group();
    selOverlay.renderOrder = 10;
    scene.add(selOverlay);

    layers = {};
    for (const id of ['model', 'context', 'envelope', 'site', 'sun']) {     // site: SiteLayer (06c), sun: SunLayer (06d)
      const group = new THREE.Group();
      scene.add(group);
      layers[id] = { group, key: null };
    }
  }

  /* ---- model objects (shared by the main view and the compare view) ----------- */
  function extrudePolys(polygons, z, depth) {
    const shapes = polygons.map((poly) => {
      const shape = new THREE.Shape(poly.outer.map((q) => new THREE.Vector2(q[0], q[1])));
      for (const h of poly.holes || []) shape.holes.push(new THREE.Path(h.map((q) => new THREE.Vector2(q[0], q[1]))));
      return shape;
    });
    const geo = new THREE.ExtrudeGeometry(shapes, { depth, bevelEnabled: false, steps: 1, curveSegments: 1 });
    geo.deleteAttribute('uv');
    geo.applyMatrix4(planMatrix(z));
    return geo;
  }
  function meshSolidGeometry(s) {
    let geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(s.positions, 3));
    geo.setIndex(s.indices);
    geo = geo.toNonIndexed();
    geo.computeVertexNormals();                  // flat normals
    geo.applyMatrix4(planMatrix(0));
    return geo;
  }

  function plateMaterialKey(plate, view, programs) {
    if (plate.outsideEnvelopeArea > 1) return 'outside';
    if (view.style !== 'diagram') return 'model';
    if (view.colorBy === 'program') return `prog:${plate.program}:${((programs[plate.program] || CONFIG.programs[plate.program] || {}).color) || '#999'}`;
    return `zone:${plate.zone}`;
  }

  /** Floors, crown, site outline. `disp` = { plates, solids, solidsOutside }. */
  function buildFloorObjects(state, disp) {
    const out = [];
    const view = state.view, diagram = view.style === 'diagram';
    const gap = view.floorLines ? CONFIG.floorGap : 0;
    const groups = new Map();
    const push = (key, geo) => {
      if (!geo.getAttribute('position') || geo.getAttribute('position').count === 0) { geo.dispose(); return; }
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(geo);
    };
    for (const plate of disp.plates) {
      if (plate.void || !plate.polygons.length) continue;
      push(plateMaterialKey(plate, view, state.programs), extrudePolys(plate.polygons, plate.z, Math.max(0.1, plate.ftf - gap)));
    }
    disp.solids.forEach((s, i) => {
      const isMesh = s.kind === 'mesh';
      let geo;
      try { geo = isMesh ? meshSolidGeometry(s) : extrudePolys(s.polygons, s.z0, Math.max(0.05, s.z1 - s.z0)); } catch (e) { console.error(e); return; }
      const outside = disp.solidsOutside[i];
      const base = outside ? 'outside' : (diagram ? 'zone:crown' : 'model');
      push(isMesh ? `${base}|ds` : base, geo);
    });
    for (const [key, geos] of groups) {
      const merged = geos.length === 1 ? geos[0] : BufferGeometryUtils.mergeGeometries(geos, false);
      if (geos.length > 1) geos.forEach((g) => g.dispose());
      if (!merged) continue;
      const mesh = new THREE.Mesh(merged, materialFor(key));
      mesh.userData.model = true;
      out.push(mesh);
      if (diagram) out.push(new THREE.LineSegments(new THREE.EdgesGeometry(merged, 20), lineMaterial('edge')));
    }
    // Site boundary outline (rectangle or polygon), just above the ground.
    const ring = sitePolygon(state);                    // [] when the site is Unlimited: no site line
    if (ring.length) {
      const siteGeo = new THREE.BufferGeometry().setFromPoints(ring.map((q) => worldVec(q[0], q[1], 0.1)));
      out.push(new THREE.LineLoop(siteGeo, lineMaterial('site')));
    }
    return out;
  }

  /** Context blocks: light gray 60% boxes (model) or outlines only (diagram). */
  function buildContextObjects(state, skipSite = false) {
    const out = [];
    if (!state.context || !state.context.show) return out;
    const diagram = state.view.style === 'diagram';
    for (const b of state.context.blocks || []) {
      if (skipSite && b.site) continue;                // drawn by the site layer instead (solid, with edges)
      const w = num(b.w, 0), d = num(b.d, 0), hgt = num(b.h, 0);
      if (!(w > 0 && d > 0 && hgt > 0)) continue;
      const geo = new THREE.BoxGeometry(w, d, hgt);          // plan x, y, elevation
      geo.translate(num(b.x, 0), num(b.y, 0), hgt / 2);
      geo.applyMatrix4(planMatrix(0));
      if (diagram) {
        out.push(new THREE.LineSegments(new THREE.EdgesGeometry(geo), lineMaterial('ctxline')));
        geo.dispose();
      } else {
        const mesh = new THREE.Mesh(geo, materialFor('context'));
        mesh.userData.model = true;
        out.push(mesh);
      }
    }
    return out;
  }

  /** Transparent wireframe of the allowed envelope (setbacks, stepback, height limit). */
  function buildEnvelopeObjects(state, wire) {
    if (!state.view.envelope || !wire || !wire.length) return [];
    const pos = [];
    const seg = (a, b) => { pos.push(a[0], a[1], a[2], b[0], b[1], b[2]); };
    for (const prism of wire) {
      for (const poly of prism.polygons) {
        for (const ring of [poly.outer, ...(poly.holes || [])]) {
          const n = ring.length;
          for (let i = 0; i < n; i++) {
            const a = ring[i], b = ring[(i + 1) % n];
            seg(planToWorld(a[0], a[1], prism.z0), planToWorld(b[0], b[1], prism.z0));
            seg(planToWorld(a[0], a[1], prism.z1), planToWorld(b[0], b[1], prism.z1));
            seg(planToWorld(a[0], a[1], prism.z0), planToWorld(a[0], a[1], prism.z1));
          }
        }
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    const lines = new THREE.LineSegments(geo, lineMaterial('envelope'));
    lines.renderOrder = 3;
    return [lines];
  }

  function clearGroup(g) {
    for (const o of [...g.children]) { g.remove(o); if (o.geometry) o.geometry.dispose(); }
  }
  function syncLayer(layer, key, build) {
    if (layer.key === key) return false;
    clearGroup(layer.group);
    layer.key = key;
    for (const o of build()) layer.group.add(o);
    return true;
  }
  const colorsKey = (state) => (state.view.style === 'diagram' && state.view.colorBy === 'program'
    ? Object.values(state.programs).map((p) => p.color).join(',') : '');

  function syncMain(d, disp, state) {
    const v = state.view;
    let changed = false;
    changed = syncLayer(layers.model, [disp.key, v.floorLines, v.style, v.colorBy, colorsKey(state)].join('|'), () => buildFloorObjects(state, disp)) || changed;
    const siteOn = SiteLayer.isOn(state);        // the site layer draws the site buildings; their context blocks stay in the state but are not drawn
    changed = syncLayer(layers.context, [v.style, JSON.stringify(state.context), siteOn].join('|'), () => buildContextObjects(state, siteOn)) || changed;
    changed = syncLayer(layers.envelope, [d.geomId, v.envelope].join('|'), () => buildEnvelopeObjects(state, d.wire)) || changed;
    const kit = { syncLayer, clearGroup, materialFor, lineMaterial, themeEpoch: () => themeEpoch };
    changed = SiteLayer.update(layers.site, state, d, kit) || changed;     // project site boundary (06c_site.js)
    changed = SunLayer.update(layers.sun, state, d, kit) || changed;       // sun-hours heat map (06d_sunhours.js)
    if (changed) { viewVersion = -1; needsRender = true; }
  }

  /** All model meshes in whatever is on screen (main layers or compare groups). */
  function eachModelMesh(fn) {
    const walk = (g) => g.children.forEach((o) => { if (o.userData.model) fn(o); });
    if (cmp) cmp.entries.forEach((e) => walk(e.group)); else { walk(layers.model.group); walk(layers.context.group); }
  }

  /* ---- per-frame view state (cheap) ------------------------------------------------ */
  function currentBounds() {
    if (cmp) return cmp.bounds;
    return Derived.get().bounds;
  }
  function updateSun(view) {
    const bb = currentBounds();
    if (!bb) return;
    const b = bb.all;
    const cx = (b.minX + b.maxX) / 2, cy = (b.minY + b.maxY) / 2, h = b.height;
    const ex = b.maxX - b.minX, ey = b.maxY - b.minY;
    const R = Math.max(60, 0.5 * Math.sqrt(ex * ex + ey * ey + h * h));
    const az = rad(num(view.sun.azimuth, 135)), alt = rad(clamp(num(view.sun.altitude, 40), 3, 90));
    const key = [cx, cy, h, R, az, alt].join('|');
    if (key === sunKey) return;
    sunKey = key;
    sceneRadius = R;
    // Azimuth is a compass bearing: 0 = north (plan +y), clockwise. Altitude is above the horizon.
    const dir = new THREE.Vector3(...planToWorld(Math.sin(az) * Math.cos(alt), Math.cos(az) * Math.cos(alt), Math.sin(alt)));
    const target = worldVec(cx, cy, h / 2);
    sun.target.position.copy(target);
    sun.position.copy(target).addScaledVector(dir, R * 2.5);
    const c = sun.shadow.camera;
    c.left = -R * 1.1; c.right = R * 1.1; c.top = R * 1.1; c.bottom = -R * 1.1;
    c.near = R * 1.2; c.far = R * 3.8;
    c.updateProjectionMatrix();
    sun.target.updateMatrixWorld();
    needsRender = true;
  }

  function applyView() {
    const s = Store.raw(), v = s.view;
    if (styleApplied !== v.style || themeApplied !== themeEpoch) refreshColors();
    const diagram = v.style === 'diagram';
    gridMesh.visible = !!v.grid;
    figure.visible = !!v.figure && !cmp;
    const shadowsOn = !diagram && !!v.shadows;
    // While a slider moves: casters off (no shadow pass work). Sun drags keep shadows so you can see them move.
    const dragging = Store.gestureActive() && !Store.gesturePath().startsWith('view.sun');
    const cast = shadowsOn && !dragging;
    // With the site layer's ground on screen (docs/site-layer-technical-plan.md section 2): the flat slab drops 4 ft under the lowest ground
    // node, the grid fades to 40% (it stays at the base elevation), the 8,000 ft shadow plane hides and shadows fall on the site ground mesh.
    const siteInfo = SiteLayer.info();
    const siteGround = !cmp && layers.site.group.visible && siteInfo.ground && !!siteInfo.bounds;
    ground.position.y = siteGround ? siteInfo.bounds.zMin - 4 : 0;
    gridUniforms.uMinorA.value = siteGround ? 0.42 * 0.4 : 0.42;
    gridUniforms.uMajorA.value = siteGround ? 0.8 * 0.4 : 0.8;
    shadowPlane.visible = shadowsOn && !siteGround;
    eachModelMesh((m) => { m.castShadow = cast; m.receiveShadow = shadowsOn; });
    SiteLayer.applyShadows(cast, shadowsOn);
    figure.traverse((o) => { if (o.isMesh) o.castShadow = cast; });
    // The figure stands near the front-left corner of the site (front = south, plan -y), on the site ground when it shows.
    if (derived) {
      const fx = derived.bounds.site.minX + 14, fy = derived.bounds.site.minY + 14;
      const fz = !cmp && layers.site.group.visible ? SiteLayer.groundZ(fx, fy) : null;
      figure.position.copy(worldVec(fx, fy, fz == null ? 0 : fz));
    }
    updateSun(v);
    needsRender = true;
  }

  /* ---- cameras & views ------------------------------------------------------------- */
  const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const tanHalfFov = Math.tan(rad(FOV) / 2);

  function switchCamera(type) {
    if (type === camType) return;
    const target = controls.target;
    const offset = cam.position.clone().sub(target);
    const dist = offset.length();
    if (type === 'ortho') {
      ortho.zoom = (2 * ORTHO_HALF) / (2 * dist * tanHalfFov);
      ortho.position.copy(cam.position); ortho.quaternion.copy(cam.quaternion);
      cam = ortho;
    } else {
      const visible = (2 * ORTHO_HALF) / ortho.zoom;
      const d = visible / (2 * tanHalfFov);
      persp.position.copy(target).addScaledVector(offset.normalize(), d);
      persp.quaternion.copy(cam.quaternion);
      cam = persp;
    }
    camType = type;
    cam.updateProjectionMatrix();
    controls.object = cam;
  }

  function setCamAspect(a) {
    persp.aspect = a; persp.updateProjectionMatrix();
    ortho.left = -ORTHO_HALF * a; ortho.right = ORTHO_HALF * a; ortho.top = ORTHO_HALF; ortho.bottom = -ORTHO_HALF;
    ortho.updateProjectionMatrix();
  }
  const hostAspect = () => Math.max(0.1, host.clientWidth) / Math.max(1, host.clientHeight);

  /** Space covered by floating panels; views are framed in the remaining area. */
  function applyViewOffset() {
    const w = host.clientWidth, hgt = host.clientHeight;
    const off = cmp ? 0 : clamp(insetProvider().right || 0, 0, w * 0.6) / 2;
    for (const c of [persp, ortho]) {
      if (off > 0) c.setViewOffset(w, hgt, off, 0, w, hgt); else c.clearViewOffset();
    }
    return off * 2;
  }

  /* ---- framing: every preset view fits the whole of what is on screen ---------------------- */
  const FIT_MARGIN = 0.05;      // empty fraction of the visible area on each side

  /** Plan extent + height of everything a view must show: plates, crown solids, the envelope wireframe (when shown), the site. */
  function boxOf(d, showEnv) {
    const u = d.bounds.union;
    const b = { minX: u.minX, maxX: u.maxX, minY: u.minY, maxY: u.maxY, height: u.height || 0 };
    const add = (x, y, z) => {
      if (x < b.minX) b.minX = x; if (x > b.maxX) b.maxX = x;
      if (y < b.minY) b.minY = y; if (y > b.maxY) b.maxY = y;
      if (z > b.height) b.height = z;
    };
    for (const s of d.solids || []) {
      if (s.kind === 'mesh') { const p = s.positions; for (let i = 0; i + 2 < p.length; i += 3) add(p[i], p[i + 1], p[i + 2]); }
      else for (const poly of s.polygons) for (const q of poly.outer) add(q[0], q[1], s.z1);
    }
    if (showEnv) for (const prism of d.wire || []) for (const poly of prism.polygons) for (const q of poly.outer) add(q[0], q[1], prism.z1);
    return b;
  }
  function framingBox(id) {
    const showEnv = !!Store.raw().view.envelope;
    if (cmp) {
      const bs = cmp.entries.map((e) => boxOf(e.d, showEnv));
      return {
        minX: Math.min(...bs.map((x) => x.minX)), maxX: Math.max(...bs.map((x) => x.maxX)),
        minY: Math.min(...bs.map((x) => x.minY)), maxY: Math.max(...bs.map((x) => x.maxY)),
        height: Math.max(...bs.map((x) => x.height)),
      };
    }
    const box = boxOf(Derived.get(), showEnv);
    // Axon and Plan frame the building with a margin of max(150 ft, 0.6 x its larger plan span), clamped to the project site: the site runs past the edges of the view. The elevations keep the building box.
    const sb = id === 'axon' || id === 'plan' ? SiteLayer.frameBounds() : null;
    if (sb) {
      Object.assign(box, SiteLayer3D.frameAround(box, sb));
      box.minZ = Math.min(0, sb.zMin); box.height = Math.max(box.height, sb.zMax);
    }
    return box;
  }

  /** Perspective: the nearest distance (and the look-at point) that puts all box corners inside the visible area. */
  function fitPersp(box, dir, aspect, H) {
    const corners = [];
    const z0 = box.minZ || 0;
    for (const x of [box.minX, box.maxX]) for (const y of [box.minY, box.maxY]) for (const z of [z0, H]) corners.push(worldVec(x, y, z));
    const fwd = dir.clone().negate();
    const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0)).normalize();
    const up = new THREE.Vector3().crossVectors(right, fwd).normalize();
    const fit = 1 - 2 * FIT_MARGIN;
    const tY = tanHalfFov, tX = tanHalfFov * aspect;
    const target = worldVec((box.minX + box.maxX) / 2, (box.minY + box.maxY) / 2, (z0 + H) / 2);
    const solve = () => {
      let dist = 1;
      for (const p of corners) {
        const v = p.clone().sub(target), dd = v.dot(dir);
        dist = Math.max(dist, dd + Math.abs(v.dot(right)) / (tX * fit), dd + Math.abs(v.dot(up)) / (tY * fit));
      }
      return dist;
    };
    let dist = solve();
    for (let i = 0; i < 6; i++) {            // centre the projected box in the visible area, then re-solve the distance
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (const p of corners) {
        const v = p.clone().sub(target), z = dist - v.dot(dir);
        const nx = v.dot(right) / (z * tX), ny = v.dot(up) / (z * tY);
        x0 = Math.min(x0, nx); x1 = Math.max(x1, nx); y0 = Math.min(y0, ny); y1 = Math.max(y1, ny);
      }
      target.addScaledVector(right, ((x0 + x1) / 2) * tX * dist).addScaledVector(up, ((y0 + y1) / 2) * tY * dist);
      dist = solve();
    }
    return { dist, target };
  }

  /** Where each preset puts the camera. Every view frames the whole box (see boxOf) with a small margin. */
  function viewTarget(id, box, aspect) {
    const H = Math.max(box.height, 20);
    const ex = box.maxX - box.minX, ey = box.maxY - box.minY;
    const cx = (box.minX + box.maxX) / 2, cy = (box.minY + box.maxY) / 2;
    const fit = 1 - 2 * FIT_MARGIN;
    if (id === 'axon') {
      const az = rad(135), el = rad(28);      // camera sits south-east, looking north-west
      const dirPlan = [Math.sin(az) * Math.cos(el), Math.cos(az) * Math.cos(el), Math.sin(el)];
      const dir = new THREE.Vector3(...planToWorld(...dirPlan)).normalize();
      const f = fitPersp(box, dir, aspect, H);
      return { type: 'persp', dist: f.dist, target: f.target, dir };
    }
    const reach = 0.55 * Math.sqrt(ex * ex + ey * ey + H * H);     // keeps the whole box in front of an orthographic camera
    if (id === 'plan') {
      const vis = Math.max(ey / fit, ex / (aspect * fit), 30);
      const e = 0.0008;     // tiny tilt toward the south keeps "north up" without a degenerate up-vector
      return {
        type: 'ortho', zoom: (2 * ORTHO_HALF) / vis, minDist: reach,
        target: worldVec(cx, cy, 0),
        dir: new THREE.Vector3(...planToWorld(0, -Math.sin(e), Math.cos(e))).normalize(),
      };
    }
    // Elevations: N = looking at the north face from the north, etc.
    const dirs = { n: [0, 1], e: [1, 0], s: [0, -1], w: [-1, 0] };
    const d = dirs[id];
    const along = (id === 'n' || id === 's') ? ex : ey;
    const vis = Math.max(H / fit, along / (aspect * fit), 40);
    return {
      type: 'ortho', zoom: (2 * ORTHO_HALF) / vis, minDist: reach,
      target: worldVec(cx, cy, H / 2),
      dir: new THREE.Vector3(...planToWorld(d[0], d[1], 0)).normalize(),
    };
  }

  function framingAspect() {
    if (cmp) {
      const r = cmpRects();
      return r.length ? r[0].w / r[0].h : hostAspect();
    }
    return Math.max(0.2, (host.clientWidth - clamp(insetProvider().right || 0, 0, host.clientWidth * 0.6)) / Math.max(1, host.clientHeight));
  }

  function setView(id, animate = true) {
    if (!renderer) return;
    const goal = viewTarget(id, framingBox(id), framingAspect());
    preset = id;
    tween = null;
    if (goal.type !== camType) switchCamera(goal.type);
    const curTarget = controls.target.clone();
    const curOffset = cam.position.clone().sub(curTarget);
    const curDist = Math.max(1, curOffset.length());
    const fromDir = curOffset.clone().normalize();
    const toDist = goal.type === 'persp' ? goal.dist : Math.max(curDist, goal.minDist || 0);
    const apply = (target, dir, dist, zoom) => {
      controls.target.copy(target);
      cam.position.copy(target).addScaledVector(dir, dist);
      if (camType === 'ortho') cam.zoom = zoom;
      cam.updateProjectionMatrix();
      controls.update();
    };
    if (!animate || reduceMotion) {
      apply(goal.target, goal.dir, toDist, goal.zoom);
    } else {
      tween = {
        t0: performance.now(), dur: 400,
        fromTarget: curTarget, toTarget: goal.target,
        fromDir, toDir: goal.dir, fromDist: curDist, toDist,
        fromZoom: cam.zoom, toZoom: goal.zoom || cam.zoom,
        q: new THREE.Quaternion().setFromUnitVectors(fromDir, goal.dir),
        apply,
      };
    }
    needsRender = true;
    viewListeners.forEach((fn) => fn(preset));
  }

  function stepTween(now) {
    const k = tween;
    const p = clamp((now - k.t0) / k.dur, 0, 1), e = easeInOut(p);
    const target = k.fromTarget.clone().lerp(k.toTarget, e);
    const dir = k.fromDir.clone().applyQuaternion(new THREE.Quaternion().slerp(k.q, e)).normalize();
    const dist = k.fromDist + (k.toDist - k.fromDist) * e;
    const zoom = k.fromZoom * Math.pow(k.toZoom / k.fromZoom, e);
    k.apply(target, dir, dist, zoom);
    needsRender = true;
    if (p >= 1) tween = null;
  }

  function updateClip() {
    const dist = cam.position.distanceTo(controls.target);
    if (camType === 'persp') {
      cam.near = Math.max(0.5, dist * 0.01);
      cam.far = dist * 20 + sceneRadius * 4 + 2000;
    } else {
      cam.near = 0.1;
      cam.far = dist + 60000;
    }
    cam.updateProjectionMatrix();
  }

  function resize() {
    if (!renderer) return;
    const w = Math.max(1, host.clientWidth), h = Math.max(1, host.clientHeight);
    renderer.setSize(w, h, false);
    setCamAspect(w / h);
    applyViewOffset();
    if (preset) setView(preset, false);
    needsRender = true;
    if (cmp) renderCompare(renderer, scene, cam, false); else renderer.render(scene, cam);
    resizeListeners.forEach((fn) => fn());
  }

  /* ---- compare: one renderer, one camera, one viewport per option -------------------------- */
  const cmpReserve = () => (cmp && cmp.reserve ? cmp.reserve() : { top: 0, bottom: 0 });
  function cmpRects(W = host.clientWidth, H = host.clientHeight, reserve = cmpReserve(), gap = 2) {
    return compareRects(cmp ? cmp.entries.length : 0, W, H, reserve, gap);
  }
  /** Draws every option into its own cell. Also used by screenshots (reserve = none, scaled size). */
  function renderCompare(r, s, c, forCapture) {
    if (!cmp || !cmp.entries.length) { r.render(s, c); return; }
    const size = r.getSize(_v2);
    const W = size.x, H = size.y;
    const k = W / Math.max(1, host.clientWidth);
    const reserve = forCapture ? { top: 0, bottom: 0 } : cmpReserve();
    const rects = compareRects(cmp.entries.length, W, H, reserve, 2 * k);
    r.setScissorTest(false);
    r.setViewport(0, 0, W, H);
    r.setClearColor(cssColor('--line'), 1);
    r.clear();
    r.setScissorTest(true);
    rects.forEach((rc, i) => {
      cmp.entries.forEach((e, j) => { e.group.visible = (i === j); });
      const x = Math.round(rc.x), y = Math.round(H - rc.y - rc.h), w = Math.round(rc.w), h = Math.round(rc.h);
      r.setViewport(x, y, w, h);
      r.setScissor(x, y, w, h);
      setCamAspect(rc.w / rc.h);
      r.render(s, c);
    });
    cmp.entries.forEach((e) => { e.group.visible = true; });
    r.setScissorTest(false);
    r.setViewport(0, 0, W, H);
    setCamAspect(hostAspect());
  }
  function combineBounds(list) {
    const ranges = (k) => list.map((d) => d.bounds[k]);
    const merge = (k) => {
      const rs = ranges(k);
      return {
        minX: Math.min(...rs.map((r) => r.minX)), maxX: Math.max(...rs.map((r) => r.maxX)),
        minY: Math.min(...rs.map((r) => r.minY)), maxY: Math.max(...rs.map((r) => r.maxY)),
        height: Math.max(...rs.map((r) => r.height || 0)),
      };
    };
    return { model: merge('model'), site: merge('site'), union: merge('union'), all: merge('all') };
  }
  function syncCompare() {
    const s = Store.raw(), v = s.view;
    const key = [v.style, v.colorBy, v.floorLines, v.envelope, s.context.show, colorsKey(s), cmp.entries.map((e) => e.uid).join(',')].join('|');
    if (key === cmp.key) return;
    cmp.key = key;
    for (const e of cmp.entries) {
      if (e.group) { clearGroup(e.group); scene.remove(e.group); }
      const st = { ...e.state, view: v, context: { ...e.state.context, show: s.context.show }, programs: e.state.programs };
      const group = new THREE.Group();
      const disp = { plates: e.d.plates, solids: e.d.solids, solidsOutside: e.d.solidsOutside };
      for (const o of [...buildFloorObjects(st, disp), ...buildContextObjects(st), ...buildEnvelopeObjects(st, e.d.wire)]) group.add(o);
      e.group = group;
      scene.add(group);
    }
    viewVersion = -1; needsRender = true;
  }
  function enterCompare(entries, reserve, { keepView = false } = {}) {
    const wasComparing = !!cmp;
    exitCompare(true);
    const list = entries.map((e, i) => ({ ...e, uid: `${i}:${e.uid || e.name}`, group: null }));
    cmp = { entries: list, key: null, reserve, bounds: combineBounds(list.map((e) => e.d)) };
    layers.model.group.visible = layers.context.group.visible = layers.envelope.group.visible = false;
    layers.site.group.visible = layers.sun.group.visible = false;
    selOverlay.visible = false;
    figure.visible = false;
    applyViewOffset();
    syncCompare();
    viewVersion = -1;
    if (!(keepView && wasComparing)) setView('axon', false);
    needsRender = true;
  }
  function exitCompare(quiet) {
    if (!cmp) return;
    for (const e of cmp.entries) if (e.group) { clearGroup(e.group); scene.remove(e.group); }
    cmp = null;
    layers.model.group.visible = layers.context.group.visible = layers.envelope.group.visible = true;
    layers.site.group.visible = layers.sun.group.visible = true;
    selOverlay.visible = true;
    resetLayers();
    viewVersion = -1;
    if (!quiet) { applyViewOffset(); setCamAspect(hostAspect()); if (preset) setView(preset, false); needsRender = true; }
  }

  /* ---- loop ------------------------------------------------------------------------ */
  function frame(now) {
    requestAnimationFrame(frame);
    if (capturing) return;
    if (tween) stepTween(now);
    const moved = controls.update();
    if (cmp) {
      syncCompare();
      if (viewVersion !== Store.version()) { viewVersion = Store.version(); applyView(); }
      if (moved || needsRender) { updateClip(); renderCompare(renderer, scene, cam, false); needsRender = false; }
      return;
    }
    const d = Derived.get();
    const state = Store.raw();
    // Draft quality only while a geometry slider drags (never for view settings such as the sun).
    const draft = Store.gestureActive() && !Store.gesturePath().startsWith('view');
    const disp = Derived.display(draft);
    const first = derived === null;
    if (d.geomId !== geomIdSeen) {
      if (!first) refitPending = true;                        // geometry changed: re-frame once the edit settles
      geomIdSeen = d.geomId;
    }
    derived = d;
    const envOn = !!state.view.envelope;
    if (envSeen !== null && envOn !== envSeen) refitPending = true;     // the envelope is part of the framed box
    envSeen = envOn;
    const sfk = SiteLayer.frameKey();
    if (siteFrameSeen !== null && sfk !== siteFrameSeen) refitPending = true;     // the site layer switched on or off: it is part of the framed box
    siteFrameSeen = sfk;
    syncMain(d, disp, state);
    if (first && !preset) setView('axon', false);
    if (rebuildNotified !== d) { rebuildNotified = d; rebuildListeners.forEach((fn) => fn(d)); }
    if (refitPending && !Store.gestureActive()) { refitPending = false; if (preset) setView(preset, true); }
    if (viewVersion !== Store.version()) { viewVersion = Store.version(); applyView(); }
    if (moved || needsRender) {
      for (const fn of frameListeners) { try { fn(); } catch (e) { console.error(e); } }
      updateClip(); renderer.render(scene, cam); needsRender = false;
    }
  }

  /** Screenshot of what is on screen (main or compare). The HUD inset is removed so the model is centred. */
  async function capture(overlay, scale = 2) {
    if (!renderer) throw new Error('The 3D view is not available.');
    capturing = true;
    const overlayWas = selOverlay.visible;
    selOverlay.visible = false;
    try {
      for (const c of [persp, ortho]) c.clearViewOffset();
      return await ShotMod.captureView({
        renderer, scene, camera: cam, scale, overlay,
        render: cmp ? (r, s, c) => renderCompare(r, s, c, true) : undefined,
      });
    } finally {
      capturing = false;
      selOverlay.visible = overlayWas && !cmp;
      applyViewOffset();
      needsRender = true;
    }
  }

  /** AI-ready picture (main view only): Model style, no grid / scale figure / envelope wireframe / overlay, plates that are
   *  outside the envelope drawn like the rest (white, not red), a plain light sky and ground. Context blocks stay.
   *  Nothing in the store is touched: the live layers are hidden, a throwaway group is drawn, then everything is put back. */
  async function captureClean(scale = 2) {
    if (!renderer) throw new Error('The 3D view is not available.');
    if (cmp) throw new Error('Leave Compare to save an AI-ready image.');
    const state = Store.raw();
    const view = { ...state.view, style: 'model' };
    const st = { ...state, view };
    const real = Derived.display(false);
    const disp = {
      key: 'ai', quality: 'full', solids: real.solids,
      plates: real.plates.map((p) => (p.outsideEnvelopeArea > 0 ? { ...p, outsideEnvelopeArea: 0 } : p)),
      solidsOutside: real.solids.map(() => false),
    };
    const shadowsOn = !!view.shadows;
    // Opaque context blocks: see-through blocks read as glass to image AIs, and the prompts call them "light-gray blocks".
    const ctxMat = new THREE.MeshStandardMaterial({ color: new THREE.Color('#c9cdd2'), roughness: 0.95, metalness: 0 });
    const cap = new THREE.Group();
    for (const o of [...buildFloorObjects(st, disp), ...buildContextObjects(st)]) {
      if (o.isLineLoop) { if (o.geometry) o.geometry.dispose(); continue; }       // no site outline
      if (o.isMesh) {
        if (o.material.transparent) o.material = ctxMat;
        o.castShadow = shadowsOn; o.receiveShadow = shadowsOn;
      }
      cap.add(o);
    }
    const prev = {
      bg: scene.background, ground: ground.material.color.clone(), grid: gridMesh.visible, fig: figure.visible,
      model: layers.model.group.visible, ctx: layers.context.group.visible, env: layers.envelope.group.visible, shadow: shadowPlane.visible,
      site: layers.site.group.visible, sun: layers.sun.group.visible, groundY: ground.position.y,
    };
    const restore = () => {
      scene.remove(cap);
      clearGroup(cap);
      ctxMat.dispose();
      scene.background = prev.bg;
      ground.material.color.copy(prev.ground);
      gridMesh.visible = prev.grid; figure.visible = prev.fig; shadowPlane.visible = prev.shadow;
      layers.model.group.visible = prev.model; layers.context.group.visible = prev.ctx; layers.envelope.group.visible = prev.env;
      layers.site.group.visible = prev.site; layers.sun.group.visible = prev.sun;
      ground.position.y = prev.groundY;
      viewVersion = -1;
    };
    capturing = true;
    const overlayWas = selOverlay.visible;
    selOverlay.visible = false;
    let pending;
    try {
      // captureView draws and copies the frame before its first await, so the scene can be put back straight away.
      try {
        scene.add(cap);
        scene.background = new THREE.Color('#f3f5f7');
        ground.material.color.set('#e4e7ea');
        gridMesh.visible = false; figure.visible = false; shadowPlane.visible = shadowsOn;
        ground.position.y = 0;
        layers.model.group.visible = layers.context.group.visible = layers.envelope.group.visible = false;
        layers.site.group.visible = layers.sun.group.visible = false;
        for (const c of [persp, ortho]) c.clearViewOffset();
        pending = ShotMod.captureView({ renderer, scene, camera: cam, scale });
      } finally { restore(); }
    } finally {
      capturing = false;
      selOverlay.visible = overlayWas;
      applyViewOffset();
      needsRender = true;
    }
    return await pending;
  }

  function init(hostEl) {
    host = hostEl;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    } catch (e) {
      host.innerHTML = '<div class="gl-fail">WebGL is not available in this browser, so the 3D view cannot start.</div>';
      renderer = null;
      return false;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    host.appendChild(renderer.domElement);

    buildScene();
    persp = new THREE.PerspectiveCamera(FOV, 1, 1, 100000);
    ortho = new THREE.OrthographicCamera(-ORTHO_HALF, ORTHO_HALF, ORTHO_HALF, -ORTHO_HALF, 0.1, 100000);
    cam = persp;
    persp.position.set(300, 250, 300);

    controls = new OrbitControls(cam, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.12;
    controls.maxPolarAngle = Math.PI / 2;      // never below ground; exactly horizontal is allowed (elevations)
    controls.minDistance = 8;
    controls.maxDistance = 60000;
    controls.minZoom = 0.01; controls.maxZoom = 80;
    controls.screenSpacePanning = true;
    controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
    controls.addEventListener('start', () => {
      tween = null;
      if (preset) { preset = null; viewListeners.forEach((fn) => fn(null)); }
    });
    controls.addEventListener('change', () => { needsRender = true; });

    const ro = new ResizeObserver(resize);
    ro.observe(host);
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onTheme = () => { themeEpoch++; viewVersion = -1; };
    if (mq.addEventListener) mq.addEventListener('change', onTheme); else if (mq.addListener) mq.addListener(onTheme);

    renderer.domElement.addEventListener('webglcontextlost', (e) => e.preventDefault());
    refreshColors();
    resize();
    requestAnimationFrame(frame);
    return true;
  }

  return {
    init, setView, capture, captureClean, enterCompare, exitCompare,
    sceneFlags: () => ({ grid: gridMesh.visible, figure: figure.visible, model: layers.model.group.visible, context: layers.context.group.visible, envelope: layers.envelope.group.visible, children: scene.children.length }),
    setInsetProvider: (fn) => { insetProvider = fn; },
    refreshInsets: (animate = true) => { if (!renderer) return; applyViewOffset(); if (preset) setView(preset, animate); else needsRender = true; },
    relayout: () => { needsRender = true; resizeListeners.forEach((fn) => fn()); },
    cells: () => (cmp ? cmpRects() : []),
    requestRender: () => { needsRender = true; },
    onRebuild: (fn) => rebuildListeners.push(fn),
    onViewChange: (fn) => viewListeners.push(fn),
    onResize: (fn) => resizeListeners.push(fn),
    framedBox: (id = 'axon') => framingBox(id),       // tests: the box a preset frames
    info: () => ({ siteLines: layers ? layers.model.group.children.filter((o) => o.isLineLoop).length : 0, envelopeLines: layers ? layers.envelope.group.children.length : 0, camera: camType, preset, meshes: layers ? layers.model.group.children.length : 0, tweening: !!tween, distance: cam ? cam.position.distanceTo(controls.target) : 0, zoom: cam ? cam.zoom : 0, compare: !!cmp, drawQuality: derived ? Derived.display(Store.gestureActive() && !Store.gesturePath().startsWith('view')).quality : null }),
    ready: () => !!renderer,
    comparing: () => !!cmp,
    // v1.1 hooks for direct editing (Select): the camera, the orbit controls, the overlay group and a per-frame callback
    overlayGroup: () => selOverlay,
    onFrame: (fn) => frameListeners.push(fn),
    camera: () => cam,
    cameraType: () => camType,
    canvas: () => (renderer ? renderer.domElement : null),
    setOrbitEnabled: (on) => { if (controls) { controls.enabled = !!on; if (!on) tween = null; } },
    orbitEnabled: () => !!controls && controls.enabled,
    // the massing meshes only (not context blocks or the site layer): the placement gizmo's hit test (docs/site-layer-technical-plan.md section 6)
    // moves the camera and its target as a solid (the placement gizmo keeps the view still while the building moves in the project frame)
    shiftView: (rotDeg, dx, dy, dz = 0) => { if (!controls || !cam) return; const m = new THREE.Matrix4().makeRotationY(rotDeg * Math.PI / 180); m.setPosition(dx, dz, -dy); cam.position.applyMatrix4(m); controls.target.applyMatrix4(m); controls.update(); needsRender = true; },
    modelMeshes: () => { const out = []; if (!cmp && layers) layers.model.group.children.forEach((o) => { if (o.isMesh && o.userData.model) out.push(o); }); return out; },
    // the site layer's effect on the flat ground, for tests; the theme epoch moves with the color scheme (bumpTheme: tests)
    siteFlags: () => ({ slabY: ground.position.y, shadowPlane: shadowPlane.visible, gridMinorA: gridUniforms.uMinorA.value, siteVisible: layers.site.group.visible, contextMeshes: layers.context.group.children.length, figureY: figure.position.y }),
    themeEpoch: () => themeEpoch,
    bumpTheme: () => { themeEpoch++; viewVersion = -1; needsRender = true; },
  };
})();

/* ==========================================================================
   SITE LAYER 3D  (docs/site-layer-technical-plan.md sections 4 and 5)
   `SiteLayer3D` turns the data of SiteLayerMod.buildSiteLayerData (plain arrays in a tool's local frame, z relative to the
   tool's base) into Three.js objects: the ground with elevation shading and a skirt, the draped boundary with its north arrow,
   the neighbor buildings (solid, with dark edges), roads, walks, water and trees. One merged BufferGeometry per kind.
   Same look as the Site Model scene (build/site/03_scene.js).

   Shared by every tool. Page globals used (at call time only): THREE, BufferGeometryUtils, planToWorld, planMatrix, worldVec.
   The tool's own 06c_site.js (SiteLayer) decides when to build and calls objects() inside kit.syncLayer.

   Everything draped on the ground (roads, walks, trees, the boundary arrow) samples the drawn ground MESH (the same two
   triangles per cell as the ground geometry), so nothing floats or sinks. Without a ground the sampler gives 0.
   ========================================================================== */
const SiteLayer3D = (() => {
  const ALL_PARTS = ['ground', 'boundary', 'buildings', 'roads', 'walks', 'water', 'trees'];
  const EDGE_ANGLE = 30;
  const BOUNDARY_COLOR = 0xc0701a;       // the Tower's dashed site loop
  const ARROW_COLOR = 0x1d2733;

  /* ---- colors from the CSS tokens (light value, dark value when the page has no token yet) ---- */
  const FALLBACK = {
    '--scene-terrain-lo': ['#d6dadd', '#3a4047'], '--scene-terrain-hi': ['#eceeef', '#4a5159'], '--scene-skirt': ['#bcc2c8', '#2a2f35'],
    '--scene-est': ['#efe2cf', '#dccaa9'], '--scene-road': ['#9ba1a8', '#656c74'], '--scene-walk': ['#c6cacd', '#858d95'],
    '--scene-water': ['#8dbbe3', '#3f72a6'], '--scene-tree': ['#8fa88b', '#6e8d6c'], '--scene-trunk': ['#8a8378', '#8a8378'],
    '--scene-model': ['#f6f6f3', '#efefec'], '--scene-edge': ['#20262d', '#e7eaee'],
  };
  const isDark = () => { try { return !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); } catch (e) { return false; } };
  function defaultCss(name, fallback) {
    let v = '';
    try { v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); } catch (e) { v = ''; }
    const fb = fallback || (FALLBACK[name] ? FALLBACK[name][isDark() ? 1 : 0] : '#888888');
    try { return new THREE.Color(v || fb); } catch (e) { return new THREE.Color(fb); }
  }

  /* ---- the drawn ground surface: elevation at a local point (relative z) ---- */
  /** Sampler over data.ground. The grid may be rotated (a rotated placement turns the mesh as a solid), so the query point is
   *  projected on the two grid axes. Same triangles as the mesh: cell split a-b-c / a-c-d, u >= v. null without a ground. */
  function makeSampler(g) {
    if (!g || !g.positions || !(g.n >= 2)) return null;
    const P = g.positions, n = g.n, d = g.spacing;
    const x0 = P[0], y0 = P[1];
    let e1x = (P[3] - x0) / d, e1y = (P[4] - y0) / d;
    let e2x = (P[3 * n] - x0) / d, e2y = (P[3 * n + 1] - y0) / d;
    const l1 = Math.hypot(e1x, e1y) || 1, l2 = Math.hypot(e2x, e2y) || 1;
    e1x /= l1; e1y /= l1; e2x /= l2; e2y /= l2;
    const L = n - 1;
    return (x, y) => {
      const dx = x - x0, dy = y - y0;
      const cu = Math.min(L, Math.max(0, (dx * e1x + dy * e1y) / d)), cv = Math.min(L, Math.max(0, (dx * e2x + dy * e2y) / d));
      const i = Math.min(Math.floor(cu), n - 2), j = Math.min(Math.floor(cv), n - 2);
      const u = cu - i, v = cv - j, o = j * n + i;
      const za = P[3 * o + 2], zb = P[3 * (o + 1) + 2], zc = P[3 * (o + n + 1) + 2], zd = P[3 * (o + n) + 2];
      return u >= v ? za + u * (zb - za) + v * (zc - zb) : za + u * (zc - zd) + v * (zd - za);
    };
  }

  /* ---- helpers ---- */
  /** Maps the y (elevation) of a world-space geometry through zOf. Only for a non-identity zOf. */
  function mapElevation(geo, zOf) {
    if (!zOf) return geo;
    const p = geo.getAttribute('position');
    for (let i = 0; i < p.count; i++) p.setY(i, zOf(p.getY(i)));
    p.needsUpdate = true;
    return geo;
  }
  function densifyRing(ring, step) {
    const out = [];
    for (let i = 0; i < ring.length; i++) {
      const a = ring[i], b = ring[(i + 1) % ring.length];
      out.push(a);
      const L = Math.hypot(b[0] - a[0], b[1] - a[1]), k = Math.ceil(L / step);
      for (let s = 1; s < k; s++) out.push([a[0] + (b[0] - a[0]) * s / k, a[1] + (b[1] - a[1]) * s / k]);
    }
    return out;
  }
  /** Drops a repeated closing point (ShapeUtils would drop it and shift the hole indices). */
  function trimRing(r) {
    const o = r.slice();
    while (o.length > 1 && o[0][0] === o[o.length - 1][0] && o[0][1] === o[o.length - 1][1]) o.pop();
    return o;
  }
  /** polys: [{ outer, holes }]. elevOf(x, y) gives the local elevation, zOf maps it to world y. Returns a BufferGeometry or null. */
  function polyGeometry(polys, elevOf, zOf, step) {
    const pos = [], idx = [];
    for (const p of polys) {
      try {
        const outer = step ? densifyRing(trimRing(p.outer), step) : trimRing(p.outer);
        const holes = (p.holes || []).map((hh) => (step ? densifyRing(trimRing(hh), step) : trimRing(hh)));
        const tris = THREE.ShapeUtils.triangulateShape(outer.map((q) => new THREE.Vector2(q[0], q[1])), holes.map((hh) => hh.map((q) => new THREE.Vector2(q[0], q[1]))));
        const all = outer.concat(...holes), base = pos.length / 3;
        for (const q of all) pos.push(q[0], zOf(elevOf(q[0], q[1])), -q[1]);
        for (const [a, b, c] of tris) {
          const ax = all[a][0], ay = all[a][1], bx = all[b][0], by = all[b][1], cx = all[c][0], cy = all[c][1];
          const ccw = (bx - ax) * (cy - ay) - (by - ay) * (cx - ax) > 0;      // plan CCW = facing up
          if (ccw) idx.push(base + a, base + b, base + c); else idx.push(base + a, base + c, base + b);
        }
      } catch (e) { console.warn('site polygon skipped', e); }
    }
    if (!idx.length) return null;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    return geo;
  }
  const mergeAll = (list) => {
    if (list.length === 1) return list[0];
    const merged = BufferGeometryUtils.mergeGeometries(list, false);
    list.forEach((g) => g.dispose());
    return merged;
  };

  /* ---- the parts ---- */
  function buildGround(data, o, mats, out, info) {
    const g = data.ground;
    if (!g) return;
    const n = g.n, N = n * n, P = g.positions;
    const lo = o.css('--scene-terrain-lo'), hi = o.css('--scene-terrain-hi'), c = new THREE.Color();
    const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
    for (let k = 0; k < N; k++) {
      pos[3 * k] = P[3 * k]; pos[3 * k + 1] = o.zOf(P[3 * k + 2]); pos[3 * k + 2] = -P[3 * k + 1];
      c.copy(lo).lerp(hi, g.shade[k]);
      col[3 * k] = c.r; col[3 * k + 1] = c.g; col[3 * k + 2] = c.b;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    geo.setIndex(new THREE.BufferAttribute(g.indices, 1));
    geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, metalness: 0, polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 2 });
    mats.push(mat);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.userData.kind = 'site-ground';
    mesh.userData.site = true;
    mesh.userData.receives = true;
    out.push(mesh);
    info.triangles += g.indices.length / 3;

    // skirt: a thin plate under the ground, the site reads as a physical model
    const sk = g.skirt;
    if (sk && sk.positions && sk.indices) {
      const sp = new Float32Array(sk.positions.length);
      for (let k = 0; k < sk.positions.length; k += 3) { sp[k] = sk.positions[k]; sp[k + 1] = o.zOf(sk.positions[k + 2]); sp[k + 2] = -sk.positions[k + 1]; }
      const sg = new THREE.BufferGeometry();
      sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
      sg.setIndex(new THREE.BufferAttribute(sk.indices, 1));
      sg.computeVertexNormals();
      const smat = new THREE.MeshStandardMaterial({ color: o.css('--scene-skirt'), roughness: 1, metalness: 0 });
      mats.push(smat);
      const skirt = new THREE.Mesh(sg, smat);
      skirt.userData.kind = 'site-skirt';
      skirt.userData.site = true;
      out.push(skirt);
      info.triangles += sk.indices.length / 3;
    }
  }

  /** The dashed site loop, just above the ground, and the north arrow beside its north-east corner (turns with the placement). */
  function buildBoundary(data, o, mats, out, zAt) {
    const ring = data.boundary;
    if (!ring || ring.length < 3) return;
    const dashed = new THREE.LineDashedMaterial({ color: BOUNDARY_COLOR, dashSize: 12, gapSize: 8 });
    const solid = new THREE.LineBasicMaterial({ color: ARROW_COLOR });
    mats.push(dashed, solid);
    const loop = new THREE.BufferGeometry().setFromPoints(ring.map((q) => worldVec(q[0], q[1], o.zOf(q[2]))));
    const line = new THREE.LineLoop(loop, dashed);
    line.computeLineDistances();
    line.userData.kind = 'site-boundary';
    out.push(line);

    // north arrow: project north in the local frame is (sin r, cos r); a shaft, a head and an N, flat on the ground
    const r = ((o.rotation || 0) * Math.PI) / 180, nx = Math.sin(r), ny = Math.cos(r), ex = ny, ey = -nx;     // north and east unit vectors
    let maxX = -Infinity, maxY = -Infinity, minX = Infinity, minY = Infinity;
    for (const q of ring) { maxX = Math.max(maxX, q[0]); maxY = Math.max(maxY, q[1]); minX = Math.min(minX, q[0]); minY = Math.min(minY, q[1]); }
    const span = Math.max(maxX - minX, maxY - minY, 1);
    const k = Math.max(0.5, Math.min(4, span / 1000));                                         // scales with the site, 1 at 1,000 ft
    let best = null;                                                                           // the boundary corner farthest toward north-east
    for (const q of ring) { const s = q[0] * (ex + nx) + q[1] * (ey + ny); if (!best || s > best.s) best = { s, q }; }
    const base = [best.q[0] + (ex - nx) * 30 * k, best.q[1] + (ey - ny) * 30 * k];
    const P = (a, b) => [base[0] + ex * a * k + nx * b * k, base[1] + ey * a * k + ny * b * k];   // a = east, b = north
    const pts = [];
    const seg = (p, q) => { pts.push(worldVec(p[0], p[1], o.zOf(zAt(p[0], p[1]) + 0.3)), worldVec(q[0], q[1], o.zOf(zAt(q[0], q[1]) + 0.3))); };
    // each stroke is cut into short pieces so it follows a sloping ground
    const stroke = (p, q) => { const m = Math.max(1, Math.ceil(Math.hypot(q[0] - p[0], q[1] - p[1]) / (6 * k))); for (let s = 0; s < m; s++) seg([p[0] + (q[0] - p[0]) * s / m, p[1] + (q[1] - p[1]) * s / m], [p[0] + (q[0] - p[0]) * (s + 1) / m, p[1] + (q[1] - p[1]) * (s + 1) / m]); };
    stroke(P(0, 0), P(0, 40)); stroke(P(0, 40), P(-7, 26)); stroke(P(0, 40), P(7, 26));
    stroke(P(-6, 50), P(-6, 68)); stroke(P(-6, 68), P(6, 50)); stroke(P(6, 50), P(6, 68));      // the letter N
    const arrow = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), solid);
    arrow.userData.kind = 'site-arrow';
    out.push(arrow);
  }

  function buildBuildings(data, o, mats, out, info) {
    const plain = [], est = [];
    let count = 0;
    for (const b of data.buildings || []) {
      try {
        if (!b.outer || b.outer.length < 3) continue;
        const shape = new THREE.Shape(b.outer.map((q) => new THREE.Vector2(q[0], q[1])));
        for (const hole of b.holes || []) if (hole.length >= 3) shape.holes.push(new THREE.Path(hole.map((q) => new THREE.Vector2(q[0], q[1]))));
        const geo = new THREE.ExtrudeGeometry(shape, { depth: Math.max(0.1, b.height) + 1, bevelEnabled: false, steps: 1, curveSegments: 1 });
        geo.deleteAttribute('uv');
        geo.applyMatrix4(planMatrix(b.base - 1));
        mapElevation(geo, o.identity ? null : o.zOf);
        (b.rule === 'estimate' ? est : plain).push(geo);
        count++;
      } catch (e) { console.warn('site building skipped', b && b.id, e); }
    }
    for (const [list, color] of [[plain, o.css('--scene-model')], [est, o.css('--scene-est')]]) {
      if (!list.length) continue;
      const merged = mergeAll(list);
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.94, metalness: 0 });
      mats.push(mat);
      const mesh = new THREE.Mesh(merged, mat);
      mesh.userData.kind = 'site-buildings';
      mesh.userData.site = true;
      mesh.userData.casts = true; mesh.userData.receives = true;
      out.push(mesh);
      info.triangles += (merged.index ? merged.index.count : merged.getAttribute('position').count) / 3;
      if (o.edges) {
        const emat = new THREE.LineBasicMaterial({ color: o.css('--scene-edge') });
        mats.push(emat);
        const edges = new THREE.LineSegments(new THREE.EdgesGeometry(merged, EDGE_ANGLE), emat);
        edges.userData.kind = 'site-building-edges';
        edges.userData.site = true;
        out.push(edges);
      }
    }
    info.buildings = count;
  }

  function buildPavement(polys, colorName, lift, factor, kind, o, mats, out, info, zAt) {
    if (!polys || !polys.length) return;
    const geo = polyGeometry(polys, (x, y) => zAt(x, y) + lift, o.zOf, 10);
    if (!geo) return;
    const mat = new THREE.MeshStandardMaterial({ color: o.css(colorName), roughness: 1, metalness: 0, polygonOffset: true, polygonOffsetFactor: factor, polygonOffsetUnits: factor });
    mats.push(mat);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.userData.kind = kind;
    mesh.userData.site = true;
    mesh.userData.receives = true;
    out.push(mesh);
    info.triangles += geo.index.count / 3;
    info[kind === 'site-roads' ? 'roads' : 'walks'] = polys.length;
  }

  function buildWater(data, o, mats, out, info) {
    const w = data.water || {};
    const geos = [];
    for (const a of w.areas || []) {
      const g = polyGeometry([a], () => a.level, o.zOf, 0);
      if (g) geos.push(g);
    }
    info.waterAreas = geos.length;
    const color = o.css('--scene-water');
    if (geos.length) {
      const merged = mergeAll(geos);
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0, polygonOffset: true, polygonOffsetFactor: -3, polygonOffsetUnits: -3 });
      mats.push(mat);
      const mesh = new THREE.Mesh(merged, mat);
      mesh.userData.kind = 'site-water';
      mesh.userData.site = true;
      mesh.userData.receives = true;
      out.push(mesh);
      info.triangles += merged.index.count / 3;
    }
    const seg = [];
    for (const line of w.lines || []) {
      for (let i = 1; i < line.length; i++) {
        const a = line[i - 1], b = line[i];
        seg.push(a[0], o.zOf(a[2]), -a[1], b[0], o.zOf(b[2]), -b[1]);
      }
    }
    if (seg.length) {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(seg, 3));
      const lmat = new THREE.LineBasicMaterial({ color });
      mats.push(lmat);
      const lines = new THREE.LineSegments(g, lmat);
      lines.userData.kind = 'site-water-lines';
      out.push(lines);
    }
  }

  /** Two InstancedMesh (low-poly canopy, thin trunk), like the Site Model. */
  function buildTrees(data, o, mats, out, info, zAt) {
    const trees = data.trees || [];
    if (!trees.length) return;
    info.trees = trees.length;
    const canopyGeo = new THREE.IcosahedronGeometry(1, 1);
    const trunkGeo = new THREE.CylinderGeometry(0.55, 0.8, 1, 6);
    trunkGeo.translate(0, 0.5, 0);
    const cm = new THREE.MeshStandardMaterial({ color: o.css('--scene-tree'), roughness: 0.94, metalness: 0, flatShading: true });
    const tm = new THREE.MeshStandardMaterial({ color: o.css('--scene-trunk'), roughness: 0.94, metalness: 0 });
    mats.push(cm, tm);
    const canopy = new THREE.InstancedMesh(canopyGeo, cm, trees.length);
    const trunk = new THREE.InstancedMesh(trunkGeo, tm, trees.length);
    const ky = o.identity ? 1 : o.zOf(1) - o.zOf(0);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), s = new THREE.Vector3();
    trees.forEach((t, i) => {
      const e = o.hasGround ? zAt(t.x, t.y) : t.z, r = t.canopy / 2;
      p.set(t.x, o.zOf(e + t.height - r), -t.y); s.set(r, r * 0.9 * ky, r);
      canopy.setMatrixAt(i, m.compose(p, q, s));
      p.set(t.x, o.zOf(e), -t.y); s.set(1, (t.height - r) * ky, 1);
      trunk.setMatrixAt(i, m.compose(p, q, s));
    });
    canopy.instanceMatrix.needsUpdate = trunk.instanceMatrix.needsUpdate = true;
    canopy.computeBoundingSphere(); trunk.computeBoundingSphere();
    for (const mesh of [trunk, canopy]) { mesh.userData.kind = 'site-trees'; mesh.userData.site = true; mesh.userData.casts = true; out.push(mesh); }
    info.triangles += (canopyGeo.index ? canopyGeo.index.count / 3 : 0) * trees.length + (trunkGeo.index ? trunkGeo.index.count / 3 : 0) * trees.length;
  }

  /* ---- public ---- */
  /** THREE objects for a data result of SiteLayerMod.buildSiteLayerData.
   *  opts: { parts: ['ground','boundary','buildings','roads','walks','water','trees'] (default all),
   *          zOf: (localZ) => worldY (default identity; the Grading Sketch passes its exaggeration mapper),
   *          css: (name, fallback) => THREE.Color, edges: true, shadows: true,
   *          rotation: placement rotation in degrees (turns the north arrow; default 0),
   *          zAt: (x, y) => local ground z (default: the drawn ground mesh) }
   *  Returns { objects: [THREE.Object3D], info: { ground, buildings, roads, walks, waterAreas, trees, triangles, bounds } }.
   *  Each object has userData.kind ('site-ground', 'site-skirt', 'site-boundary', 'site-arrow', 'site-buildings',
   *  'site-building-edges', 'site-roads', 'site-walks', 'site-water', 'site-water-lines', 'site-trees') and userData.site = true;
   *  userData.casts / userData.receives say which shadow flags setShadows() turns on. */
  function objects(data, opts = {}) {
    const info = { ground: false, buildings: 0, roads: 0, walks: 0, waterAreas: 0, trees: 0, triangles: 0, bounds: data && data.bounds ? { ...data.bounds } : null };
    const out = [], mats = [];
    if (!data || !data.ok) return { objects: out, info };
    const parts = new Set(Array.isArray(opts.parts) ? opts.parts : ALL_PARTS);
    const identity = typeof opts.zOf !== 'function';
    const o = {
      zOf: identity ? (z) => z : opts.zOf, identity,
      css: typeof opts.css === 'function' ? opts.css : defaultCss,
      edges: opts.edges !== false, rotation: opts.rotation || 0,
      hasGround: !!data.ground,
    };
    const sampler = makeSampler(data.ground);
    const zAt = typeof opts.zAt === 'function' ? opts.zAt : (sampler || (() => 0));
    if (parts.has('ground')) { buildGround(data, o, mats, out, info); info.ground = !!data.ground; }
    if (parts.has('boundary')) buildBoundary(data, o, mats, out, zAt);
    if (parts.has('buildings')) buildBuildings(data, o, mats, out, info);
    if (parts.has('roads')) buildPavement(data.roads, '--scene-road', 0.3, -2, 'site-roads', o, mats, out, info, zAt);
    if (parts.has('walks')) buildPavement(data.walks, '--scene-walk', 0.45, -4, 'site-walks', o, mats, out, info, zAt);
    if (parts.has('water')) buildWater(data, o, mats, out, info);
    if (parts.has('trees')) buildTrees(data, o, mats, out, info, zAt);
    info.triangles = Math.round(info.triangles);
    const shadows = opts.shadows !== false;
    for (const obj of out) {
      obj.userData.ownMaterials = mats;             // all of this call's materials; dispose() frees them once
      obj.castShadow = shadows && !!obj.userData.casts;
      obj.receiveShadow = shadows && !!obj.userData.receives;
    }
    return { objects: out, info };
  }

  /** Disposes the geometries and the own materials of objects made by objects(). Safe to call twice. */
  function dispose(objs) {
    const done = new Set();
    for (const o of objs || []) {
      if (o.geometry) o.geometry.dispose();
      if (o.isInstancedMesh) o.dispose();
      const list = o.userData && o.userData.ownMaterials;
      if (list && !done.has(list)) { done.add(list); list.forEach((m) => m.dispose()); }
    }
  }

  /** Turns the shadow flags of objects made by objects() on or off (casters only when `cast`, receivers only when `receive`). */
  function setShadows(objs, cast, receive) {
    for (const o of objs || []) {
      if (!o.userData || !o.userData.site) continue;
      o.castShadow = !!cast && !!o.userData.casts;
      o.receiveShadow = !!receive && !!o.userData.receives;
    }
  }

  /** The cache key for a tool's syncLayer: `${siteUpdatedAt}|${x},${y},${rot},${baseZ}|${showFlags}|${themeEpoch}`.
   *  doc: the project document (or null); show: a string or an object of flags. */
  function keyFor(doc, placement, show, themeEpoch) {
    let stamp = '';
    try {
      const sec = ProjectMod.getSection(doc, 'site');
      if (sec) {
        const dv = sec.derived || {};
        stamp = `${sec.updatedAt || ''}#${dv.ground ? dv.ground.n : 0}.${(dv.buildings || []).length}`;
      }
    } catch (e) { stamp = ''; }
    const p = placement || {};
    const flags = show && typeof show === 'object' ? Object.keys(show).sort().map((k) => `${k}=${show[k] ? 1 : 0}`).join(',') : String(show === undefined ? '' : show);
    return `${stamp}|${p.x || 0},${p.y || 0},${p.rotation || 0},${p.baseZ || 0}|${flags}|${themeEpoch || 0}`;
  }

  /** The box a view frames when a site is open: the building box grown by max(150 ft, 0.6 x its larger plan span) on every side,
   *  then clamped to the site square, so the site runs past the edges of the view. A building that sticks out of the square stays inside the box.
   *  b, sb: { minX, maxX, minY, maxY } (b may carry height and minZ, which are kept). → a new box. */
  function frameAround(b, sb) {
    const span = Math.max(b.maxX - b.minX, b.maxY - b.minY);
    const m = Math.max(150, 0.6 * span);
    return {
      ...b,
      minX: Math.min(b.minX, Math.max(b.minX - m, sb.minX)), maxX: Math.max(b.maxX, Math.min(b.maxX + m, sb.maxX)),
      minY: Math.min(b.minY, Math.max(b.minY - m, sb.minY)), maxY: Math.max(b.maxY, Math.min(b.maxY + m, sb.maxY)),
    };
  }

  return { objects, dispose, setShadows, keyFor, makeSampler, frameAround };
})();

/* ---- src/tower/snap.js ---- */
const SnapMod = (() => {
/* ==========================================================================
   snap.js — snapping for direct editing in the tower generator (v1.1)

   Pure: no DOM, no three. Plan coordinates in feet, north = +y.
   Contract: docs/v1.1-spec.md, "Contract: src/tower/snap.js".

   A target line: { axis: "x" | "y", value, kind, label, from, to }
     axis "x" = a vertical line in plan at x = value (it constrains x);
                from/to = its y extent (used to draw the guide).
     axis "y" = a horizontal line at y = value; from/to = its x extent.
     kind: "grid" | "site" | "setback" | "podium" | "segment" | "context".

   Public API:
     collectSnapTargets(state, plates, { exclude })        → { lines }
     snapMove(box, delta, targets, { tolerance, grid, enabled }) → { dx, dy, guides }
     snapEdge(value, axis, targets, { tolerance, grid, enabled, span }) → { value, guide }
     snapLength(length, { step })                          → number
   Extra helper (not in the contract, for the UI):
     itemBox(state, plates, { kind, index })               → box | null

   Notes
   - `plates` may be the Plate[] from buildPlates(...).plates or the whole
     buildPlates result. A segment's box is the bbox of its first tower plate
     (so rotation, taper at t = 0 and offset are included). When a segment or
     the podium has no plate (empty, or plates not passed), the box falls back
     to the shape from the state (rotated and offset).
   - Context blocks are targets unless state.context.show === false.
   - Ties: candidates within 0.25 ft of the best distance are compared by
     priority segment > podium > context > setback > site > grid, then by
     distance.
   - Grid is a fallback per axis: only when no line on that axis is within
     tolerance and grid > 0 does the moved min edge snap to the nearest grid
     line (any distance). A line within tolerance therefore always beats the
     grid (priority "grid" is last). Grid guides have kind "grid"; the UI may
     choose not to draw them.
   ========================================================================== */

const { allowedFootprint } = Env;
const { shapeToRing } = Geo;

const TIE = 0.25;   // ft
const EPS = 1e-9;
const PRIORITY = { segment: 6, podium: 5, context: 4, setback: 3, site: 2, grid: 1 };

const DIR = {
  x: { min: "west", max: "east" },
  y: { min: "south", max: "north" },
};

function num(v, d = 0) {
  const n = typeof v === "number" ? v : parseFloat(v);
  return Number.isFinite(n) ? n : d;
}

/* ------------------------------------------------------------ boxes */

function emptyBox() {
  return { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };
}

function growRing(b, ring) {
  for (const q of ring) {
    if (q[0] < b.minX) b.minX = q[0];
    if (q[0] > b.maxX) b.maxX = q[0];
    if (q[1] < b.minY) b.minY = q[1];
    if (q[1] > b.maxY) b.maxY = q[1];
  }
  return b;
}

function mpBox(mp) {
  const b = emptyBox();
  for (const p of mp || []) if (p && p.outer) growRing(b, p.outer);
  return validBox(b) ? b : null;
}

function validBox(b) {
  return !!b && Number.isFinite(b.minX) && Number.isFinite(b.maxX) &&
    Number.isFinite(b.minY) && Number.isFinite(b.maxY) && b.maxX >= b.minX && b.maxY >= b.minY;
}

function plateList(plates) {
  if (Array.isArray(plates)) return plates;
  if (plates && Array.isArray(plates.plates)) return plates.plates;
  return [];
}

/** Box of a shape placed with rotation (deg, about the shape's origin) and offset. */
function shapeBox(shape, rotation, ox, oy) {
  const ring = shapeToRing(shape, { segments: 32 });
  if (ring.length < 3) return null;
  const th = (num(rotation, 0) * Math.PI) / 180;
  const c = Math.cos(th), s = Math.sin(th);
  const b = emptyBox();
  for (const q of ring) {
    const x = q[0] * c - q[1] * s + ox, y = q[0] * s + q[1] * c + oy;
    if (x < b.minX) b.minX = x; if (x > b.maxX) b.maxX = x;
    if (y < b.minY) b.minY = y; if (y > b.maxY) b.maxY = y;
  }
  return validBox(b) ? b : null;
}

/** First-plate boxes: { podium: box|null, segments: Map<index, box> } in one pass. */
function plateBoxes(plates) {
  let podium = null;
  const segments = new Map();
  for (const p of plateList(plates)) {
    if (!p || p.void) continue;
    if (p.zone === "podium") {
      if (!podium) podium = mpBox(p.polygons);
    } else if (p.zone === "tower") {
      const i = p.segmentIndex;
      if (!segments.has(i)) {
        const b = mpBox(p.polygons);
        if (b) segments.set(i, b);
      }
    }
  }
  return { podium, segments };
}

function podiumFallback(state) {
  const pod = state && state.podium;
  if (!pod || !pod.on) return null;
  return shapeBox(pod.shape, 0, num(pod.offset && pod.offset.x, 0), num(pod.offset && pod.offset.y, 0));
}

function segmentFallback(state, i) {
  const seg = state && Array.isArray(state.segments) ? state.segments[i] : null;
  if (!seg) return null;
  return shapeBox(seg.shape, num(seg.rotation, 0), num(seg.offset && seg.offset.x, 0), num(seg.offset && seg.offset.y, 0));
}

function contextBox(b) {
  const w = num(b && b.w, 0), d = num(b && b.d, 0);
  if (!(w > 0 && d > 0)) return null;
  const x = num(b.x, 0), y = num(b.y, 0);
  return { minX: x - w / 2, maxX: x + w / 2, minY: y - d / 2, maxY: y + d / 2 };

    const hd = info && info.hs.find((x) => x.id === id);
    if (!hd) return false;
    const f = viewDirAt(hd.anchor);
    const n = f.clone().addScaledVector(hd.axis, -f.dot(hd.axis));
    if (n.lengthSq() < 1e-8) return false;

    const sn = snapSettings();
    const enabled = sn.on && !alt;
    const it = drag.item, fp = drag.fp, id = drag.id;
    const centerName = it.kind === 'context' ? 'Center' : 'Offset';
    const base = drag.base;

    const posPath = (axis) => (it.kind === 'context' ? `context.blocks.${it.index}.${axis}` : `${it.kind === 'segment' ? `segments.${it.index}` : 'podium'}.offset.${axis}`);
    const posBase = (axis) => (it.kind === 'context' ? num(base[axis], 0) : num(base.offset && base.offset[axis], 0));

      const ax = id === 'move-x' ? 'x' : 'y';

      const v = rnd(posBase(ax) + delta, 10000);
      write(posPath(ax), v);
      label = `${centerName} ${ax} ${fmt(v)}`;
    } else if (id === 'width' || id === 'depth') {
      const ax = id === 'width' ? 'x' : 'y';
      const lo = ax === 'x' ? fp.box.minX : fp.box.minY, hi = ax === 'x' ? fp.box.maxX : fp.box.maxY;
      const span = ax === 'x' ? { from: fp.box.minY, to: fp.box.maxY } : { from: fp.box.minX, to: fp.box.maxX };
      const r = SnapMod.snapEdge(hi + t, ax, drag.targets, { tolerance: drag.tol, grid: 0, enabled, span });
      let ext = r.value - lo;
      if (!r.guide) ext = SnapMod.snapLength(ext, { step: enabled ? 1 : 0.1 });
      ext = clamp(ext, 1, MAXD);
      if (r.guide && r.guide.kind !== 'grid') guides = [r.guide];

    } else if (id === 'top') {

        write(`context.blocks.${it.index}.h`, hh);
        label = `Height ${fmt(hh)}`;
      } else {
        const ftf = Math.max(1, num(base.ftf, 10));
        const n0 = Math.round(num(base.floors, 1));
        const n = clamp(Math.max(1, n0 + Math.round(t / ftf)), 1, CONFIG.limits.maxFloors);
        write(it.kind === 'segment' ? `segments.${it.index}.floors` : 'podium.floors', n);
        const hgt = it.kind === 'podium' ? num(base.groundFtf, ftf) + (n - 1) * ftf : n * ftf;

    }

  }
  function setLabel(text, guides, cx, cy) {
    const rect = canvasRect();
    labelEl.hidden = false;
    labelEl.textContent = '';
    labelEl.append(h('b', null, text));
    const g = (guides || []).find((x) => x && x.label);
    if (g) labelEl.append(h('span', null, g.label));
    const x = clamp(cx - rect.left + 18, 8, rect.width - 190), y = clamp(cy - rect.top - 52, 8, rect.height - 60);

  }

  }

  /** Test hook: the same drag math as a real drag, driven by world deltas (feet) instead of pointer events.

    if (!ready) return null;

    const info = items.length === 1 ? handleInfo(items[0]) : null;
    const hd = info && info.hs.find((x) => x.id === id);
    if (!hd) return null;
    const amount = (id === 'move-x' || id === 'width') ? a : (b !== 0 ? b : a);

  /* ==========================================================================

     ========================================================================== */
  function setItems(next) {
    const out = [];
    for (const it of next || []) {

      const n = normItem(it);
      if (isValid(n) && !out.some((o) => sameItem(o, n))) out.push(n);
    }
    const changed = JSON.stringify(out) !== JSON.stringify(items);
    if (changed && drag) endDrag(false);
    items = out;
    if (!items.length) addMode = false;
    if (changed) onChanged();
    return changed;
  }
  function toggleItem(it) {

  }
  const clear = () => setItems([]);
  function onChanged() {
    renderCard();
    refreshOverlay();

  }
  /** Drops items that no longer exist (undo, delete, podium turned off). */
  function sanitize() {
    const kept = items.filter(isValid);
    if (kept.length !== items.length) { items = kept; if (!items.length) addMode = false; if (drag) endDrag(false); onChanged(); return true; }
    return false;
  }

  function deleteItems(list) {
    const sel = (list || items).map(normItem).filter(isValid);
    if (!sel.length) return 0;
    const next = clone(Store.raw());
    let removed = 0;
    let segIdx = [...new Set(sel.filter((i) => i.kind === 'segment').map((i) => i.index))].sort((a, b) => a - b);
    if (segIdx.length && segIdx.length >= next.segments.length) {
      segIdx = segIdx.slice(1);                  // never delete the last segment: the lowest one stays
      Toast.show('A tower needs at least one segment, so one was kept.', 'warn');
    }
    for (const i of segIdx.slice().reverse()) { next.segments.splice(i, 1); removed++; }
    for (const i of [...new Set(sel.filter((x) => x.kind === 'carve').map((x) => x.index))].sort((a, b) => b - a)) { next.carves.splice(i, 1); removed++; }
    for (const i of [...new Set(sel.filter((x) => x.kind === 'context').map((x) => x.index))].sort((a, b) => b - a)) { next.context.blocks.splice(i, 1); removed++; }
    if (sel.some((x) => x.kind === 'podium') && next.podium.on) { next.podium.on = false; removed++; }
    if (sel.some((x) => x.kind === 'crown') && next.crown.type !== 'none') { next.crown.type = 'none'; removed++; }
    if (!removed) return 0;
    Store.replace(next);
    setItems([]);
    return removed;
  }

  function copySegment(index, where = 'above') {
    const s = Store.raw();
    if (!s.segments[index]) return false;
    const next = clone(s);
    const at = where === 'below' ? index : index + 1;
    next.segments.splice(at, 0, clone(next.segments[index]));

  /* ==========================================================================

  /* ==========================================================================

  let cardFns = [], cardRefs = null;

  const lenF = (label, path, extra = {}) => Controls.slider({
    label, bind: bsp(path), min: 0, max: 1, step: 1, hardMin: 1, hardMax: MAXD, format: Units.formatFeetInches, parse: Units.parseLength, inputMode: 'text', compact: true, ...extra,
  });

    label, bind: bsp(path), min: 0, max: 1, step: 1, hardMin: 1, hardMax: CONFIG.limits.maxFloors, integer: true, format: Units.formatInt, inputMode: 'numeric', compact: true, ...extra,
  });
  const degF = (label, path) => Controls.slider({
    label, bind: bsp(path), min: 0, max: 1, step: 1, hardMin: -3600, hardMax: 3600, format: (v) => `${Math.round(v * 10) / 10}°`, inputMode: 'decimal', compact: true,

  const shapeTypeOf = (prefix) => () => String(Store.get(`${prefix}.type`) || 'rect').toLowerCase();

  function fieldsFor(it) {
    const els = (list) => list.map((c) => c.el || c);
    if (it.kind === 'segment' || it.kind === 'podium') {
      const p = it.kind === 'segment' ? `segments.${it.index}` : 'podium';
      const ty = shapeTypeOf(`${p}.shape`);
      const f = [intF('Floors', `${p}.floors`)];
      if (it.kind === 'podium') f.push(lenF('Ground FTF', `${p}.groundFtf`, { step: 0.5, hardMin: 6 }), lenF('FTF', `${p}.ftf`, { step: 0.5, hardMin: 6 }));
      else f.push(lenF('FTF', `${p}.ftf`, { step: 0.5, hardMin: 6 }));

        Controls.when(() => ['rect', 'ellipse', 'triangle', 'l', 'u'].includes(ty()), [lenF('Width', `${p}.shape.w`), lenF('Depth', `${p}.shape.d`)]),
        Controls.when(() => ty() === 'square', [lenF('Side', `${p}.shape.w`)]),
        Controls.when(() => ty() === 'circle', [lenF('Diameter', `${p}.shape.w`)]),
        offF('Offset x', `${p}.offset.x`), offF('Offset y', `${p}.offset.y`),
      );

    }

      const type = () => Store.get('crown.type');

        selF('Type', 'crown.type', [['none', 'None'], ['flat', 'Flat (parapet)'], ['stepped', 'Stepped'], ['sloped', 'Sloped'], ['spire', 'Spire'], ['screen', 'Screen']]),

        Controls.when(() => kind() === 'corner', [selF('Corner', `${p}.corner`, [['NE', 'North-east'], ['NW', 'North-west'], ['SE', 'South-east'], ['SW', 'South-west']])]),
        intF('From floor', `${p}.startFloor`), intF('To floor', `${p}.endFloor`),

  const PROGRAM_KEYS = () => Object.keys(CONFIG.programs).filter((k) => k !== 'mechanical');
  function programItems(part) {

      const dot = h('span', { class: 'sc-dot', 'aria-hidden': 'true' });

  function renderCard() {

    card.textContent = '';

    if (!items.length) { card.hidden = true; return; }
    card.hidden = false;
    const one = items.length === 1 ? items[0] : null;
    const refs = cardRefs = {};
    const extra = [];
    const built = Controls.scoped(() => {
      refs.title = h('b', { class: 'sc-name' });
      refs.sub = h('span', { class: 'sc-sub' });

        else rows.push(programRow(null, null));

      }

  }
  function syncCardText() {

  /** Marks the panel rows of the selected items (the other half of the two-way link). */
  function syncRows() {
    const map = { segments: 'segment', carves: 'carve', context: 'context' };
    for (const [sec, kind] of Object.entries(map)) {
      document.querySelectorAll(`#sections [data-section="${sec}"] .item[data-index]`).forEach((row) => {
        row.classList.toggle('sel-row', items.some((i) => i.kind === kind && i.index === +row.dataset.index));
      });
    }
  }
  function initPanelLink() {
    $('sections').addEventListener('click', (e) => {
      const head = e.target.closest && e.target.closest('.item-title');

      if (!row || !sec) return;
      const kind = { segments: 'segment', carves: 'carve', context: 'context' }[sec.dataset.section];

      const it = { kind, index: +row.dataset.index };

    });
  }

  /* ==========================================================================

     ========================================================================== */

  function typing(e) {
    const t = e.target, a = document.activeElement;

  }
  function onKey(e) {
    if (!ready || typing(e) || menuOpen()) return;

    const cmd = e.metaKey || e.ctrlKey;
