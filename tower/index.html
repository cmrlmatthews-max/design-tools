    Options.holdAutosave(false);
  }
  window.__sunTimings = timings;
  console.log('[sun] timings', JSON.stringify(timings));
  return results;
}

/* ==========================================================================
   TESTS: Unlimited site (site.shape 'none')
   The default design has no site line, no site checks and "—" for the site numbers; Rectangle brings them back;
   a preset keeps "no site"; old states keep their rectangle. runAllTests in 12b merges the results.
   The tests restore the design, the tab and the metrics card when they finish, and hold the autosave.
   ========================================================================== */
async function runNoSiteTests() {
  const results = [];
  const eq = (a, b) => (JSON.stringify(a) === JSON.stringify(b) ? true : `got ${JSON.stringify(a)}, expected ${JSON.stringify(b)}`);
  const t = async (name, fn) => {
    let r;
    try { r = await fn(); } catch (e) { r = `threw ${e && e.message}`; }
    results.push({ name, ok: r === true, detail: r === true ? '' : String(r) });
  };
  const $ = (id) => document.getElementById(id);
  const visible = (el) => !!el && el.getClientRects().length > 0 && getComputedStyle(el).visibility !== 'hidden';
  const frames = async (n = 4) => { for (let i = 0; i < n; i++) await new Promise((r) => requestAnimationFrame(() => r())); };
  const savedState = Store.snapshot(), savedTab = UI.activeTab(), savedHud = UI.hudOpen();
  Options.holdAutosave(true);
  const siteSetSite = (shape) => Store.set('site.shape', shape, { live: false });
  const finite = (o) => !/NaN|Infinity/.test(JSON.stringify(o));
  /** True when some element of the Site and Height sections with exactly this text is on screen (a hidden section or control has no layout boxes). */
  const rowVisible = (label) => [...document.querySelectorAll('#tabpanel-site [data-section="site"] *, #tabpanel-site [data-section="height"] *')].some((e) => e.children.length === 0 && e.textContent.trim() === label && visible(e));

  try {
    /* ---- the state ---- */
    await t('the default design has an Unlimited site and no height limit; width, depth and setbacks stay for Rectangle', () => {
      const s = defaultState().site;
      return eq([s.shape, s.heightLimit, s.width, s.depth, s.setbacks.front, s.stepback.aboveHeight], ['none', 0, 250, 200, 10, 85]);
    });
    await t('a state with a site and no shape stays a rectangle; a state with no site is Unlimited; a polygon stays', () => {
      const old = fillDefaults({ site: { width: 200, depth: 100, setbacks: { front: 5, back: 5, left: 5, right: 5 }, heightLimit: 300 } });
      const poly = fillDefaults({ site: { shape: 'polygon', points: [[0, 0], [100, 0], [100, 80]] } });
      return eq([old.site.shape, old.site.width, old.site.heightLimit, fillDefaults({}).site.shape, poly.site.shape], ['rect', 200, 300, 'none', 'polygon']);
    });
    await t('every preset keeps its own site when it loads (rect, its numbers, its height limit)', () => {
      const bad = CONFIG.presets.filter((p) => JSON.stringify(fillDefaults(p.state).site) !== JSON.stringify(p.state.site)).map((p) => p.id);
      return eq(bad, []);
    });
    await t('sitePolygon is empty and siteArea is 0 with no site; Rectangle gives the ring and the area', () => {
      const s = defaultState();
      const a = [sitePolygon(s).length, siteArea(s)];
      s.site.shape = 'rect';
      return eq([a, sitePolygon(s).length, siteArea(s)], [[0, 0], 4, 50000]);
    });

    /* ---- numbers and warnings ---- */
    await t('no site: zero warnings on the default design, no red plates, and every metric is finite', () => {
      const d = computeDerived(defaultState());
      return eq([d.warnings.length, d.plates.some((p) => p.outsideEnvelopeArea > 0), d.metrics.hasSite, d.metrics.siteArea, d.metrics.far, d.metrics.siteCoverage, finite(d.metrics), d.wire.length],
        [0, false, false, 0, 0, 0, true, 0]);
    });
    await t('no site: a huge building has no setback, stepback or outside warning', () => {
      const s = defaultState(); s.segments[0].shape.w = 900; s.segments[0].shape.d = 900; s.site.stepback = { on: true, aboveHeight: 20, distance: 300 };
      const d = computeDerived(s);
      return eq([d.warnings.map((w) => w.id), d.plates.some((p) => p.outsideEnvelopeArea > 0)], [[], false]);
    });
    await t('no site: the height limit still works, and 0 means no limit', () => {
      const s = defaultState(); s.site.heightLimit = 55;
      const w = computeDerived(s).warnings.map((x) => x.id);
      s.site.heightLimit = 0;
      return eq([w.includes('height'), computeDerived(s).warnings.length], [true, 0]);
    });
    await t('switching to Rectangle brings back the setback check, FAR and coverage', () => {
      const s = defaultState(); s.segments[0].shape.w = 240; s.site.shape = 'rect';
      const d = computeDerived(s);
      return eq([d.warnings.some((w) => w.id === 'setback'), d.metrics.hasSite, d.metrics.siteArea, d.metrics.far > 0, d.metrics.siteCoverage > 0], [true, true, 50000, true, true]);
    });
    await t('Surround without a site goes around the building', () => {
      const b = surroundBlocks(defaultState());
      return eq([b.length, b.every((k) => finite(k))], [4, true]);
    });
    await t('the bounds without a site are the building plus a margin (framing, scale figure, sun grid)', () => {
      const d = computeDerived(defaultState());
      const { model, site } = d.bounds;
      return eq([site.minX < model.minX, site.maxX > model.maxX, site.minY < model.minY, site.maxY > model.maxY, finite(d.bounds)], [true, true, true, true, true]);
    });

    /* ---- exports ---- */
    await t('SketchUp export and the project derived section are valid with no site', () => {
      Store.replace(fillDefaults(defaultState()));
      const v = SkFmt.validateDoc(SketchupExport.doc());
      const derived = TowerDerivedMod.towerDerived(Store.snapshot(), Derived.get(), Derived.get().metrics);
      const doc = ProjectMod.writeSection(ProjectMod.newProject({ name: 'No site' }), 'massing', { tool: 'tower', schema: 1, placement: { x: 0, y: 0, rotation: 0, baseZ: 0 }, state: Store.snapshot(), derived });
      const pv = ProjectMod.validate(doc);
      return (v.ok && pv.ok && finite(derived) && doc.sections.massing.state.site.shape === 'none') || `sketchup ${v.errors} project ${pv.errors}`;
    });
    /* ---- presets ---- */
    await t('a preset loaded while the site is Unlimited keeps no site and no height limit, with its other site numbers', () => {
      Store.replace(fillDefaults(defaultState()));
      Options.loadPreset('point-tower');
      const s = Store.raw().site;
      const a = [s.shape, s.heightLimit, s.width, s.depth, s.setbacks.left];
      siteSetSite('rect');
      return eq([a, Store.raw().site.width], [['none', 0, 150, 150, 10], 150]);
    });
    await t('a preset loaded over a Rectangle site brings its own site and height limit', () => {
      const s0 = fillDefaults(defaultState()); s0.site.shape = 'rect';
      Store.replace(s0);
      Options.loadPreset('point-tower');
      const s = Store.raw().site;
      return eq([s.shape, s.heightLimit, s.width], ['rect', 550, 150]);
    });

    /* ---- panel and metrics card ---- */
    await t('Site tab with Unlimited: the Shape control lists it, one help line shows, width, depth, corners, setbacks and stepback hide, the height limit stays', async () => {
      Store.replace(fillDefaults(defaultState()));
      UI.setTab('site');
      await frames();
      const opts = [...document.querySelectorAll('#tabpanel-site select')[0].options].map((o) => o.textContent);
      const help = [...document.querySelectorAll('#tabpanel-site .help')].filter(visible).map((e) => e.textContent);
      const setbacks = document.querySelector('#tabpanel-site [data-section="setbacks"]');
      return eq([opts, help.includes('Unlimited: no site line, setbacks, or site checks. Pick Rectangle or Polygon to test a real site.'),
        rowVisible('Width'), rowVisible('Depth'), rowVisible('Site corners (x, y in feet)'), visible(setbacks), rowVisible('Height limit (0 = none)'), rowVisible('Stepback above a height')],
      [['Unlimited', 'Rectangle', 'Polygon'], true, false, false, false, false, true, false]);
    });
    await t('Site tab: picking Rectangle in the Shape control shows width, depth and setbacks; the numbers come back', async () => {
      const sel = document.querySelectorAll('#tabpanel-site select')[0];
      sel.value = 'rect'; sel.dispatchEvent(new Event('change', { bubbles: true }));
      await frames();
      const setbacks = document.querySelector('#tabpanel-site [data-section="setbacks"]');
      return eq([Store.get('site.shape'), rowVisible('Width'), rowVisible('Depth'), visible(setbacks), rowVisible('Stepback above a height')], ['rect', true, true, true, true]);
    });
    await t('Metrics card: "—" with a small "no site" for FAR, site area and coverage; Rectangle shows the numbers', () => {
      UI.setHudOpen(true);
      Store.replace(fillDefaults(defaultState()));
      UI.updateHud(Derived.get());
      const none = ['mFar', 'mSite', 'mCover'].map((id) => [$(id).firstChild.nodeValue, !!$(id).querySelector('small.nosite')]);
      siteSetSite('rect');
      UI.updateHud(Derived.get());
      const rect = ['mFar', 'mSite', 'mCover'].map((id) => [$(id).firstChild.nodeValue, !!$(id).querySelector('small.nosite')]);
      return eq([none, rect], [[['—', true], ['—', true], ['—', true]], [['2.00', false], ['50,000 sf', false], ['20.0%', false]]]);
    });
    await t('the default design shows "No warnings" in the card', () => {
      Store.replace(fillDefaults(defaultState()));
      UI.updateHud(Derived.get());
      return eq([$('warnCount').textContent, $('hudBadge').textContent], ['0', '0 warnings']);
    });

    /* ---- drawing ---- */
    if (Render.ready()) {
      await t('no site line is drawn and the envelope box is empty; Rectangle draws the site line and the envelope; back to Unlimited removes them', async () => {
        Store.replace(fillDefaults(defaultState()));
        await frames();
        const a = Render.info();
        siteSetSite('rect');
        await frames();
        const b = Render.info();
        siteSetSite('none');
        await frames();
        const c = Render.info();
        return eq([[a.siteLines, a.envelopeLines > 0], [b.siteLines, b.envelopeLines > 0], [c.siteLines, c.envelopeLines > 0]], [[0, false], [1, true], [0, false]]);
      });
    }
  } finally {
    Pop.close();
    Store.replace(savedState);
    UI.setTab(savedTab);
    UI.setHudOpen(savedHud);
    Options.holdAutosave(false);
  }
  console.log(`[tests] no site ${results.length - results.filter((r) => !r.ok).length}/${results.length} passed`, results.filter((r) => !r.ok).length ? JSON.stringify(results.filter((r) => !r.ok)) : '');
  return results;
}

/* ==========================================================================
   TESTS: the site layer  (docs/site-layer-technical-plan.md section 9.2, tests 1 to 6)
   1. no project: no layer, the flat slab and the shadow plane stay;  2. a site project: ground, boundary, neighbors, no double
   building, slab and shadow plane follow the plan;  3. the View "Site" toggle;  4. Compare hides the layer;
   5. the AI-ready image hides the layer;  6. a theme change rebuilds the layer.
   Uses the in-memory fixture of 12f_tests_project.js. Wrapped around runAllTests below, so ?test and __tower.runTests run them.
   ========================================================================== */
async function runSiteLayerTests() {
  const results = [];
  const eq = (a, b) => (JSON.stringify(a) === JSON.stringify(b) ? true : `got ${JSON.stringify(a)}, expected ${JSON.stringify(b)}`);
  const t = async (name, fn) => {
    let r;
    try { r = await fn(); } catch (e) { r = `threw ${e && e.message}`; }
    results.push({ name, ok: r === true, detail: r === true ? '' : String(r) });
  };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const errors = [];
  const onError = (e) => errors.push(String((e && e.message) || e));
  window.addEventListener('error', onError);
  const savedState = Store.snapshot(), savedTab = UI.activeTab();
  Options.holdAutosave(true);
  const mem = ProjectFixture.memory();
  ProjectUI.reset();
  ProjectUI.configure({ storage: mem, navigate: () => {}, updateUrl: () => {} });
  const live = Render.ready();
  const openSite = async () => {
    Store.replace(fillDefaults(defaultState()), { resetHistory: true });
    const doc = ProjectFixture.siteProject();
    ProjectMod.saveProject(mem, doc);
    ProjectUI.openDoc(doc);
    await wait(300);
  };

  try {
    await t('1. no project: the site layer is off, the flat slab and the shadow plane stay', async () => {
      if (!live) return true;
      Store.replace(fillDefaults(defaultState()), { resetHistory: true });
      await wait(250);
      const i = SiteLayer.info(), f = Render.siteFlags();
      return eq([i.shown, i.ground, i.buildings, f.slabY, f.shadowPlane, SiteLayer.groundMesh()], [false, false, 0, 0, true, null]);
    });

    await t('2. a site project: ground (121 nodes), skirt, boundary, both neighbors (solid, with edges), the site context blocks left out of the context layer; slab, grid and shadow plane follow the plan', async () => {
      if (!live) return true;
      await openSite();
      const i = SiteLayer.info(), f = Render.siteFlags(), gm = SiteLayer.groundMesh();
      const group = [];
      gm && gm.parent && gm.parent.children.forEach((o) => group.push(o.userData.kind));
      const ctx = Store.get('context');
      const slab = i.bounds ? i.bounds.zMin - 4 : NaN;
      const checks = {
        shown: i.shown, ground: i.ground, buildings: i.buildings, contextMeshes: f.contextMeshes, nodes: gm && gm.geometry.getAttribute('position').count,
        receives: gm && gm.receiveShadow, kinds: ['site-ground', 'site-skirt', 'site-boundary', 'site-arrow', 'site-buildings', 'site-building-edges'].every((k) => group.includes(k)),
        ctx: ctx.blocks.filter((b) => b.site).length, slab: Math.abs(f.slabY - slab) < 1e-6, shadowPlane: f.shadowPlane, grid: Math.abs(f.gridMinorA - 0.42 * 0.4) < 1e-9, triangles: i.triangles > 200, errors: errors.length,
      };
      return eq(checks, { shown: true, ground: true, buildings: 2, contextMeshes: 0, nodes: 121, receives: true, kinds: true, ctx: 1, slab: true, shadowPlane: false, grid: true, triangles: true, errors: 0 });
    });

    await t('2b. the layer draws both neighbors with the context blocks on or off; the context blocks stay in the state', async () => {
      if (!live) return true;
      Store.set('context.show', false, { live: false });
      await wait(300);
      const off = SiteLayer.info().buildings;
      Store.set('context.show', true, { live: false });
      await wait(300);
      return eq([off, SiteLayer.info().buildings, Store.get('context.blocks').length], [2, 2, 1]);
    });

    await t('2c. the scale figure stands on the site ground', async () => {
      if (!live) return true;
      const p = Store.get('placement'), d = Derived.get();
      const gz = SiteLayer.groundZ(d.bounds.site.minX + 14, d.bounds.site.minY + 14);
      return (gz !== null && Math.abs(Render.siteFlags().figureY - gz) < 1e-6 && Math.abs(gz - (1000 + 0.01 * (p.x + d.bounds.site.minX + 14) + 0.02 * (p.y + d.bounds.site.minY + 14) - p.baseZ)) < 0.5) || `figureY ${Render.siteFlags().figureY}, ground ${gz}`;
    });

    await t('3. the View "Site" toggle: off hides the layer, restores the slab and shadow plane and draws the site context blocks again; on brings it back', async () => {
      if (!live) return true;
      UI.setTab('view');
      const row = [...document.querySelectorAll('#tabpanel-view .toggle-row')].find((b) => b.textContent.trim() === 'Site');
      const labelled = !!row;
      if (row) row.click();
      await wait(300);
      const off = SiteLayer.info(), f = Render.siteFlags();
      const offFlags = [off.shown, off.buildings, f.slabY, f.shadowPlane, SiteLayer.groundMesh(), f.contextMeshes];
      const checked = row ? row.getAttribute('aria-checked') : null;
      if (row) row.click();
      await wait(300);
      const on = SiteLayer.info();
      return eq([labelled, checked, offFlags, on.shown, on.ground, on.buildings], [true, 'false', [false, 0, 0, true, null, 1], true, true, 2]);
    });

    await t('3b. view.site defaults to true and an old save without it gets true', () => {
      const old = defaultState(); delete old.view.site;
      return eq([defaultState().view.site, fillDefaults(old).view.site], [true, true]);
    });

    await t('4. the Compare view hides the layer; closing Compare shows it again', async () => {
      if (!live) return true;
      const st = Store.snapshot();
      const entry = (uid) => ({ name: uid, state: st, d: Derived.get(), uid });
      Render.enterCompare([entry('a'), entry('b')], null);
      await wait(250);
      const inCmp = [Render.siteFlags().siteVisible, Render.siteFlags().slabY, Render.siteFlags().shadowPlane];
      Render.exitCompare();
      await wait(350);
      const back = [Render.siteFlags().siteVisible, SiteLayer.info().shown, SiteLayer.info().buildings];
      return eq([inCmp, back], [[false, 0, true], [true, true, 2]]);
    });

    await t('5. the AI-ready image hides the layer and puts the flat ground back, then restores both', async () => {
      if (!live) return true;
      const real = ShotMod.captureView, seen = [];
      ShotMod.captureView = async () => { const f = Render.siteFlags(); seen.push([f.siteVisible, f.slabY, f.shadowPlane]); return new Blob(['x']); };
      try { await Render.captureClean(1); } finally { ShotMod.captureView = real; }
      await wait(150);
      const f = Render.siteFlags();
      return eq([seen, f.siteVisible, f.slabY < -10, SiteLayer.info().shown], [[[false, 0, Store.get('view.shadows')]], true, true, true]);
    });

    await t('6. a theme change rebuilds the layer (the key carries the theme epoch)', async () => {
      if (!live) return true;
      const before = SiteLayer.info().key, mesh = SiteLayer.groundMesh(), epoch = Render.themeEpoch();
      Render.bumpTheme();
      await wait(350);
      const after = SiteLayer.info().key, mesh2 = SiteLayer.groundMesh();
      return eq([Render.themeEpoch() === epoch + 1, after !== before, mesh2 !== mesh, SiteLayer.info().shown], [true, true, true, true]);
    });

    await t('6b. Axon and Plan frame the building plus a margin of max(150 ft, 0.6 x its span), clamped to the site square: smaller than the site, holding the building (the elevations keep the building box)', async () => {
      if (!live) return true;
      const out = [];
      for (const id of ['axon', 'plan', 'e']) {
        Store.set('view.site', false, { live: false });
        await wait(150);
        const off = Render.framedBox(id);
        Store.set('view.site', true, { live: false });
        await wait(150);
        const on = Render.framedBox(id), sb = SiteLayer.frameBounds();
        const m = Math.max(150, 0.6 * Math.max(off.maxX - off.minX, off.maxY - off.minY));
        const holds = on.minX <= off.minX && on.maxX >= off.maxX && on.minY <= off.minY && on.maxY >= off.maxY;
        const smaller = on.maxX - on.minX < sb.maxX - sb.minX - 1 && on.maxY - on.minY < sb.maxY - sb.minY - 1;
        const margin = [on.minX - Math.min(off.minX, Math.max(off.minX - m, sb.minX)), on.maxX - Math.max(off.maxX, Math.min(off.maxX + m, sb.maxX)), on.minY - Math.min(off.minY, Math.max(off.minY - m, sb.minY)), on.maxY - Math.max(off.maxY, Math.min(off.maxY + m, sb.maxY))].every((v) => Math.abs(v) < 1e-6);
        out.push(id === 'e' ? [holds, on.maxX - on.minX === off.maxX - off.minX] : [holds, smaller, margin, m >= 150]);
      }
      return eq(out, [[true, true, true, true], [true, true, true, true], [true, true]]);
    });

    await t('7a. a live placement drag moves the built layer as a solid without rebuilding it; the commit rebuilds it', async () => {
      if (!live) return true;
      await wait(400);                                   // a frame may still be rebuilding the layer after the earlier tests
      const pl = Store.get('placement'), mesh = SiteLayer.groundMesh();
      Store.set('placement', { ...pl, x: pl.x + 40 }, { live: true });
      await wait(300);
      const g = mesh.parent;
      if (!g) return `the ground mesh left the scene during the drag; gesture ${Store.gestureActive()} ${Store.gesturePath()}; key ${SiteLayer.info().key}`;
      const during = [SiteLayer.groundMesh() === mesh, Math.round(g.position.x), Math.round(g.position.z)];
      Store.commit();
      await wait(350);
      const after = [SiteLayer.groundMesh() !== mesh, g.position.x, SiteLayer.info().shown];
      Store.set('placement', pl, { live: false });
      await wait(300);
      return eq([during, after], [[true, -40, 0], [true, 0, true]]);
    });

    await t('7. closing the project removes the layer; the slab and shadow plane come back', async () => {
      if (!live) return true;
      ProjectUI.close();
      await wait(350);
      const f = Render.siteFlags();
      return eq([SiteLayer.info().shown, SiteLayer.groundMesh(), f.slabY, f.shadowPlane, errors.length], [false, null, 0, true, 0]);
    });
  } finally {
    window.removeEventListener('error', onError);
    ProjectUI.reset();
    ProjectUI.restoreDefaults();
    Select.clear();
    Store.replace(savedState);
    UI.setTab(savedTab);
    Options.holdAutosave(false);
  }
  return results;
}

/** Adds the site layer tests to the merged results of runAllTests (the previous definition runs first). */
const runAllTestsBeforeSiteLayer = runAllTests;
runAllTests = async function runAllTests() {
  const prev = await runAllTestsBeforeSiteLayer();
  const site = await runSiteLayerTests();
  const bad = site.filter((r) => !r.ok);
  console.log(`[tests] site layer ${site.length - bad.length}/${site.length} passed`, bad.length ? JSON.stringify(bad) : '');
  const all = [...prev.results, ...site];
  const failed = all.filter((r) => !r.ok);
  window.__towerTestResults = { total: all.length, passed: all.length - failed.length, failed, results: all };
  return window.__towerTestResults;
};

/* ==========================================================================
   TESTS: placement gizmo (docs/site-layer-technical-plan.md section 9.2, tests 7 to 9) - Tower
   Drag the building: placement.x / y move in the project frame, the base elevation snaps to the ground, ONE undo step, the
   context blocks from the site follow on release only. Rotation handle in 5 degree steps. No drag without a project.
   Uses its own in-memory site project, so a ?test visit never touches the saved projects. runAllTests is extended at the end of
   this file (no edit of the other test files needed).
   ========================================================================== */
const GizmoFixture = (() => {
  const S = 1000, N = 11, SPACING = 100;
  const memory = () => ({ data: {}, getItem(k) { return this.data[k] === undefined ? null : this.data[k]; }, setItem(k, v) { this.data[k] = String(v); }, removeItem(k) { delete this.data[k]; } });
  /** A 1000 ft site square with a sloping ground (z = 1000 + 0.01 x + 0.02 y), a near building and a far one. */
  function siteProject() {
    let doc = ProjectMod.newProject({ name: 'Gizmo fixture', frame: { kind: 'site', lat: 33.927, lon: -84.339, size: S } });
    const points = [];
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) points.push([i * SPACING, j * SPACING, 1000 + 0.01 * i * SPACING + 0.02 * j * SPACING]);
    const derived = {
      address: 'Fixture', lat: 33.927, lon: -84.339, size: S, release: 'test',
      boundary: [[0, 0], [S, 0], [S, S], [0, S]], ground: { spacing: SPACING, n: N, points },
      buildings: [
        { id: 'near', outer: [[480, 380], [560, 380], [560, 420], [480, 420]], holes: [], base: 1010, height: 40, top: 1050, floors: 3, rule: 'data', name: 'Near' },
        { id: 'far', outer: [[950, 950], [990, 950], [990, 990], [950, 990]], holes: [], base: 1030, height: 30, top: 1060, floors: 2, rule: 'data', name: 'Far' },
      ],
      roads: { segments: [], pavement: [] }, walks: null, trees: [], water: { areas: [], lines: [] },
    };
    doc = ProjectMod.writeSection(doc, 'site', { tool: 'site', schema: 1, placement: { x: 0, y: 0, rotation: 0, baseZ: 0 }, state: { query: 'Fixture', lat: 33.927, lon: -84.339, size: S, release: 'test', walks: false }, derived });
    return doc;
  }
  /** Ground elevation by the same rule the site fixture was built with. */
  const groundAt = (x, y) => 1000 + 0.01 * Math.min(Math.max(x, 0), S) + 0.02 * Math.min(Math.max(y, 0), S);
  return { memory, siteProject, groundAt, S };
})();

async function runGizmoTests() {
  const results = [];
  const eq = (a, b) => (JSON.stringify(a) === JSON.stringify(b) ? true : `got ${JSON.stringify(a)}, expected ${JSON.stringify(b)}`);
  const t = async (name, fn) => {
    let r;
    try { r = await fn(); } catch (e) { r = `threw ${e && e.message}`; }
    results.push({ name, ok: r === true, detail: r === true ? '' : String(r) });
  };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const G = PlacementGizmo;
  const savedState = Store.snapshot();
  Options.holdAutosave(true);
  const mem = GizmoFixture.memory();
  ProjectUI.reset();
  ProjectUI.configure({ storage: mem, navigate: () => {}, updateUrl: () => {} });
  const fresh = () => { Store.replace(fillDefaults(defaultState()), { resetHistory: true }); };
  const openSite = async () => {
    fresh();
    const doc = GizmoFixture.siteProject();
    ProjectMod.saveProject(mem, doc);
    ProjectUI.openDoc(doc);
    
    await wait(300);
  };
  const pl = () => Store.get('placement');
  const depth = () => Store.historyDepth();
  const HAS_CTX = true;
  const ctxKey = () => JSON.stringify((Store.get('context') || {}).blocks || []);

  try {
    /* ---- test 9 (first half): no project, no gizmo ---- */
    await t('9. no project: the placement gizmo is not active, begin does nothing, nothing is written', () => {
      if (!Render.ready()) return true;
      fresh();
      const before = JSON.stringify(Store.snapshot());
      const info = G.info();
      const began = G.begin('move', 100, 100) || G.begin('rotate', 100, 100);
      return eq([ProjectUI.has(), info.active, info.handles, began, JSON.stringify(Store.snapshot()) === before], [false, false, 0, false, true]);
    });

    await openSite();

    await t('7. the gizmo is active with a project open and shows the rotation grip', () => {
      if (!Render.ready()) return true;
      const i = G.info();
      return eq([i.active, i.dragging, i.handles], [true, null, 1]);
    });

    await t('7. a drag over the building moves placement.x / y in 1 ft steps, the base elevation snaps to the ground, ONE undo step', () => {
      if (!Render.ready()) return true;
      const p0 = { ...pl() };
      const pt = G.modelPoint();
      if (!pt) return 'no model point on screen';
      const d0 = depth();
      if (!G.begin('move', pt.x, pt.y)) return 'begin refused';
      const during = G.info().dragging;
      G.move(pt.x + 100, pt.y);
      const live = { ...pl() };
      const gestureOpen = Store.gestureActive();
      G.end();
      const p1 = { ...pl() };
      const gz = GizmoFixture.groundAt(p1.x, p1.y);
      const moved = p1.x !== p0.x || p1.y !== p0.y;
      return (moved && during === 'move' && gestureOpen && live.x === p1.x && live.y === p1.y && Number.isInteger(p1.x) && Number.isInteger(p1.y)
        && Math.abs(p1.baseZ - gz) <= 0.05 && p1.rotation === p0.rotation && depth() - d0 === 1 && !Store.gestureActive() && G.info().dragging === null)
        || `p0 ${JSON.stringify(p0)} p1 ${JSON.stringify(p1)} groundZ ${gz} steps ${depth() - d0} during ${during} gesture ${gestureOpen}`;
    });

    await t('7. undo returns the placement and the context blocks in the one step; redo puts them back', () => {
      if (!Render.ready()) return true;
      const after = JSON.stringify(Store.get('placement')), ctxAfter = ctxKey();
      Store.undo();
      const undone = JSON.stringify(Store.get('placement')), ctxUndone = ctxKey();
      Store.redo();
      const redone = JSON.stringify(Store.get('placement')), ctxRedone = ctxKey();
      return (undone !== after && redone === after && (!HAS_CTX || (ctxUndone !== ctxAfter && ctxRedone === ctxAfter))) || `placement ${undone} -> ${after}`;
    });

    await t('7. the context blocks from the site follow the placement on release only (no rewrite per live step)', () => {
      if (!Render.ready()) return true;
      const pt = G.modelPoint();
      if (!pt) return 'no model point on screen';
      ProjectUI.centerOnSite({ quiet: true });                       // back at the site center so the near building is a context block
      ProjectUI.contextFromSite(undefined, { quiet: true });
      const pt2 = G.modelPoint() || pt;
      const ctx0 = ctxKey();
      let writes = 0;
      const off = Store.subscribe((s, info) => { if (String(info && info.path || '').startsWith('context')) writes++; });
      G.begin('move', pt2.x, pt2.y);
      G.move(pt2.x + 30, pt2.y); G.move(pt2.x + 60, pt2.y + 5); G.move(pt2.x + 90, pt2.y + 10);
      const midWrites = writes, midCtx = ctxKey();
      G.end();
      off();
      const p = pl(), blk = (Store.get('context.blocks') || []).find((b) => Math.abs(b.w - 80) < 0.1);
      const ok = midWrites === 0 && midCtx === ctx0 && writes >= 1 && ctxKey() !== ctx0 && blk && Math.abs(blk.x - (520 - p.x)) < 0.05 && Math.abs(blk.y - (400 - p.y)) < 0.05;
      return ok || `live writes ${midWrites}, writes ${writes}, block ${JSON.stringify(blk)}, placement ${JSON.stringify(p)}`;
    });

    await t('7. Shift snaps the move to 5 ft', () => {
      if (!Render.ready()) return true;
      const pt = G.modelPoint();
      if (!pt) return 'no model point on screen';
      G.begin('move', pt.x, pt.y);
      G.move(pt.x - 37, pt.y + 21, { shift: true });
      const p = { ...pl() };
      G.end(false);
      return (p.x % 5 === 0 && p.y % 5 === 0) || `x ${p.x} y ${p.y}`;
    });

    await t('7. a drag that is cancelled (end(false)) restores the placement and adds no undo step', () => {
      if (!Render.ready()) return true;
      const p0 = JSON.stringify(pl()), d0 = depth(), ctx0 = ctxKey();
      const pt = G.modelPoint();
      if (!pt) return 'no model point on screen';
      G.begin('move', pt.x, pt.y);
      G.move(pt.x + 80, pt.y - 40);
      const during = JSON.stringify(pl());
      G.end(false);
      return (during !== p0 && JSON.stringify(pl()) === p0 && depth() === d0 && ctxKey() === ctx0 && !Store.gestureActive()) || `during ${during} after ${JSON.stringify(pl())}`;
    });

    await t('7. a press on empty ground does not start a placement drag, and orbit stays on', () => {
      if (!Render.ready()) return true;
      const rect = Render.canvas().getBoundingClientRect();
      const began = G.begin('move', rect.left + 2, rect.top + 2);
      return eq([began, G.info().dragging, Render.orbitEnabled()], [false, null, true]);
    });

    await t('7. a real pointer drag on the model: needs 6 px of travel, orbit is off during it and on after, one undo step', async () => {
      if (!Render.ready()) return true;
      const pt = G.modelPoint();
      if (!pt) return 'no model point on screen';
      const canvas = Render.canvas();
      const ev = (type, x, y) => new PointerEvent(type, { pointerId: 41, pointerType: 'mouse', button: 0, buttons: type === 'pointerup' ? 0 : 1, clientX: x, clientY: y, bubbles: true, cancelable: true });
      const p0 = JSON.stringify(pl()), d0 = depth();
      canvas.dispatchEvent(ev('pointerdown', pt.x, pt.y));
      const orbitOffDown = !Render.orbitEnabled();
      window.dispatchEvent(ev('pointermove', pt.x + 3, pt.y));
      const small = JSON.stringify(pl()) === p0 && G.info().dragging === null;
      window.dispatchEvent(ev('pointermove', pt.x + 60, pt.y + 10));
      await wait(60);
      const dragging = G.info().dragging;
      const moved = JSON.stringify(pl()) !== p0;
      window.dispatchEvent(ev('pointerup', pt.x + 60, pt.y + 10));
      const ok = orbitOffDown && small && dragging === 'move' && moved && Render.orbitEnabled() && depth() - d0 === 1 && G.info().dragging === null;
      return ok || `orbitOffDown ${orbitOffDown} small ${small} dragging ${dragging} moved ${moved} orbit ${Render.orbitEnabled()} steps ${depth() - d0}`;
    });

    await t('7. a press on the model that never travels 6 px changes nothing and gives orbit back', () => {
      if (!Render.ready()) return true;
      const pt = G.modelPoint();
      if (!pt) return 'no model point on screen';
      const ev = (type, x, y) => new PointerEvent(type, { pointerId: 42, pointerType: 'mouse', button: 0, clientX: x, clientY: y, bubbles: true, cancelable: true });
      const p0 = JSON.stringify(pl()), d0 = depth();
      Render.canvas().dispatchEvent(ev('pointerdown', pt.x, pt.y));
      window.dispatchEvent(ev('pointermove', pt.x + 2, pt.y + 1));
      window.dispatchEvent(ev('pointerup', pt.x + 2, pt.y + 1));
      return eq([JSON.stringify(pl()) === p0, depth() === d0, Render.orbitEnabled(), G.info().dragging], [true, true, true, null]);
    });

    /* ---- test 8: rotation ---- */
    await t('8. the rotation handle turns the placement in 5 degree steps about the box center, ONE undo step', () => {
      if (!Render.ready()) return true;
      const p0 = { ...pl() };
      const b = Derived.get().bounds.model;
      const c = [(b.minX + b.maxX) / 2, (b.minY + b.maxY) / 2];
      const cBefore = ProjectMod.toProject(p0, c);
      const a = G.ringPoint(0), z = G.ringPoint(90);
      const d0 = depth();
      if (!G.begin('rotate', a.x, a.y)) return 'begin refused';
      const during = G.info().dragging;
      G.move(z.x, z.y);
      const live = pl().rotation;
      G.end();
      const p1 = { ...pl() };
      const cAfter = ProjectMod.toProject(p1, c);
      const ok = during === 'rotate' && p1.rotation % 5 === 0 && Math.abs(p1.rotation - p0.rotation - 90) <= 5 && live === p1.rotation
        && Math.hypot(cAfter[0] - cBefore[0], cAfter[1] - cBefore[1]) < 0.01 && depth() - d0 === 1
        && Math.abs(p1.baseZ - GizmoFixture.groundAt(p1.x, p1.y)) <= 0.05;
      return ok || `rot ${p0.rotation} -> ${p1.rotation}, center moved ${Math.hypot(cAfter[0] - cBefore[0], cAfter[1] - cBefore[1])}, steps ${depth() - d0}`;
    });

    await t('8. every rotation step along a sweep is a multiple of 5; Alt gives 1 degree steps', () => {
      if (!Render.ready()) return true;
      const a = G.ringPoint(0);
      G.begin('rotate', a.x, a.y);
      const seen = [];
      for (let deg = 3; deg <= 100; deg += 7) { const q = G.ringPoint(deg); G.move(q.x, q.y); seen.push(pl().rotation); }
      const q = G.ringPoint(37.4);
      G.move(q.x, q.y, { alt: true });
      const fine = pl().rotation;
      G.end(false);
      return (seen.every((r) => r % 5 === 0) && Number.isInteger(fine) && fine % 5 !== 0) || `seen ${seen} fine ${fine}`;
    });

    await t('8. Escape during a rotation restores the placement and commits nothing', () => {
      if (!Render.ready()) return true;
      const p0 = JSON.stringify(pl()), d0 = depth();
      const a = G.ringPoint(0), z = G.ringPoint(60);
      G.begin('rotate', a.x, a.y);
      G.move(z.x, z.y);
      window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      return eq([JSON.stringify(pl()) === p0, depth() === d0, G.info().dragging, Render.orbitEnabled()], [true, true, null, true]);
    });

    /* ---- test 9 (second half) ---- */
    
    await t('9. closing the project turns the gizmo off again', () => {
      if (!Render.ready()) return true;
      ProjectUI.reset();
      const info = G.info();
      return eq([info.active, info.handles, G.begin('rotate', 100, 100)], [false, 0, false]);
    });
  } finally {
    try { G.end(false); } catch (e) { /* no drag open */ }
    ProjectUI.reset();
    ProjectUI.restoreDefaults();
    Select.clear();
    Store.replace(savedState);
    Options.holdAutosave(false);
  }
  return results;
}

/* Extend runAllTests with the gizmo tests (the other test files stay as they are). */
runAllTests = ((base) => async function runAllWithGizmo() {
  const r = await base();
  const g = await runGizmoTests();
  const bad = g.filter((x) => !x.ok);
  r.results.push(...g);
  r.total += g.length;
  r.passed += g.length - bad.length;
  r.failed.push(...bad);
  console.log(`[tests] gizmo ${g.length - bad.length}/${g.length} passed`, bad.length ? JSON.stringify(bad) : '');
  return r;
})(runAllTests);

  screenPointFor: (item) => Select.screenPointFor(item),      // a client point where that item can be picked
  visibleHandles: () => Select.visibleHandles(),
  // Runs the handle-drag math without pointer events. ('move-x', dx) ('move-y', 0, dy) ('width', dx) ('depth', 0, dy) ('top', 0, dz);
  // opts { alt, hold }. hold keeps the drag open (guides and label stay) until releaseHandleDrag().
  simulateHandleDrag: (id, a, b, opts) => Select.simulateHandleDrag(id, a, b, opts),
  releaseHandleDrag: () => Select.releaseHandleDrag(),
  getDrag: () => ({ active: Select.dragging(), last: Select.lastDrag(), overlay: Select.overlayInfo(), orbit: Render.orbitEnabled() }),
};
if (TEST_MODE) {
  runAllTests().then((r) => {
    const msg = r.failed.length
      ? `Tests: ${r.failed.length} of ${r.total} failed. ${r.failed.map((f) => `${f.name} (${f.detail})`).join(' | ')}`
      : `Tests: all ${r.total} passed`;
    Toast.show(msg, r.failed.length ? 'bad' : 'test-pass', 0);
  });
}

</script>
</body>
</html>
