  function rename(next) {
    const name = String(next || '').trim().slice(0, 60) || 'Option A';
    Store.set('name', name, { live: false });
    if (currentId && storage.get(currentId)) storage.rename(currentId, name);
    const field = document.getElementById('optionName');
    if (field) field.value = Store.get('name');
    syncDirty();
  }

  async function remove() {
    const rec = currentId && storage.get(currentId);
    if (!rec) { Toast.show('This option is not saved, so there is nothing to delete.', 'warn'); return false; }
    const ok = await confirmDialog(`Delete ${quoted(rec.name)} from the saved options? The design on screen stays open.`, 'Delete', true);
    if (!ok) return false;
    storage.remove(rec.id);
    link(null);
    Toast.show(`Deleted ${quoted(rec.name)}. The design on screen is now unsaved.`);
    return true;
  }

  const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
  const importListeners = [];
  function exportJson() {
    const n = storage.list().length, np = storage.listPrompts().length;
    if (!n && !np) { Toast.show('Nothing to export yet. Save an option first.', 'warn'); return false; }
    storage.downloadExport();
    Toast.show(`Exported ${[n ? plural(n, 'option') : '', np ? plural(np, 'custom prompt') : ''].filter(Boolean).join(' and ')}`);
    return true;
  }
  async function importFile(file) {
    try {
      const { added, skipped, promptsAdded } = await storage.importFile(file);
      const parts = [added || !promptsAdded ? plural(added, 'option') : '', promptsAdded ? plural(promptsAdded, 'custom prompt') : ''].filter(Boolean);
      Toast.show(`Imported ${parts.join(' and ')}${skipped ? `, ${skipped} skipped` : ''}.${added ? ' Open the options from the Option menu.' : ''}`);
      importListeners.forEach((fn) => fn({ added, skipped, promptsAdded }));
      return { added, skipped, promptsAdded };
    } catch (e) {
      Toast.show(e && e.message ? e.message : 'The file could not be imported.', 'bad', 7000);
      return { added: 0, skipped: 0, error: String(e && e.message) };
    }
  }

  const when = (t) => { try { return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); } catch (e) { return ''; } };
  function openMenu(anchor) {
    const el = h('div', { role: 'menu', id: 'optionMenu' });
    const item = (title, sub, onclick, o = {}) => h('button', { class: 'pop-item', type: 'button', role: 'menuitem', id: o.id, disabled: o.disabled, onclick: () => { if (!o.keep) Pop.close(); onclick(); } },
      h('span', { class: 'tick' }, o.tick ? '✓' : ''), h('span', { class: 'grow' }, title, sub ? h('small', null, sub) : null));

    // The option name is edited here. It is committed when the field changes or the menu closes.
    const nameField = h('input', { class: 'pop-name', id: 'optionName', type: 'text', maxlength: '60', spellcheck: 'false', autocomplete: 'off', 'aria-label': 'Option name', value: Store.get('name') || '' });
    const commitName = () => { if (nameField.value.trim() !== (Store.get('name') || '')) rename(nameField.value); };
    nameField.addEventListener('change', commitName);
    nameField.addEventListener('keydown', (e) => { if (e.key === 'Enter') { commitName(); Pop.close(); } });
    el.append(
      item('New design', 'Start fresh from the default tower', () => { newDesign(); }, { id: 'miNewDesign' }),
      h('div', { class: 'pop-sep' }),
    );
    el.append(h('div', { class: 'label pop-label' }, 'Option name'), h('div', { style: 'padding:0 6px 4px' }, nameField));

    el.append(h('div', { class: 'label pop-label' }, 'This option'));
    el.append(
      item('Save', 'Keep the design as it is now', save, { id: 'miSave' }),
      item('Duplicate', 'Save a copy as a new option', duplicate, { id: 'miDuplicate' }),
      item('Rename', 'Edit the name above', () => { nameField.focus(); nameField.select(); }, { id: 'miRename', keep: true }),
      item('Delete', 'Remove it from the saved options', remove, { id: 'miDelete', disabled: !currentId }),
      item(Compare.isActive() ? 'Exit compare' : 'Compare', 'Compare 2 to 4 options side by side', () => Compare.toggle(), { id: 'miCompare' }),
    );
    el.append(h('div', { class: 'pop-sep' }), h('div', { class: 'label pop-label' }, 'Saved options'));
    const saved = storage.list();
    if (!saved.length) el.append(h('div', { class: 'pop-note' }, 'Nothing saved yet. Use Save to keep this design.'));
    for (const o of saved) el.append(item(o.name, `Saved ${when(o.updatedAt)}`, () => loadOption(o.id), { tick: o.id === currentId }));
    el.append(h('div', { class: 'pop-sep' }), h('div', { class: 'label pop-label' }, 'New from a preset'));
    for (const p of CONFIG.presets) el.append(item(p.name, p.description, () => loadPreset(p.id), { id: `preset-${p.id}` }));
    Pop.open(anchor, el, { onClose: commitName });
  }

  function init({ restore = true } = {}) {
    if (restore) {
      const saved = storage.loadAutosave();
      if (saved) {
        const s = fillDefaults(saved);
        Store.replace(s, { resetHistory: true });
        const rec = uiPrefs.currentId && storage.get(uiPrefs.currentId);
        if (rec) link(rec.id, fillDefaults(rec.state)); else link(null);
      } else link(null);
    } else link(null);
    Store.subscribe((s, info) => {
      if (!autosaveHeld) storage.autosave(s);
      if (!info || !info.live) { clearTimeout(dirtyTimer); dirtyTimer = setTimeout(syncDirty, 250); }
    });
    const input = document.getElementById('importFile');
    input.addEventListener('change', async () => {
      const file = input.files && input.files[0];
      input.value = '';
      if (file) await importFile(file);
    });
  }

  return {
    onImport: (fn) => importListeners.push(fn),
    holdAutosave: (v) => { autosaveHeld = !!v; },
    init, save, duplicate, rename, remove, openMenu, loadOption, loadPreset, newDesign, hasUnsavedChanges, exportJson, importFile, syncDirty,
    list: () => storage.list(), get: (id) => storage.get(id), flush: () => storage.flush(),
    current: () => currentId, storage,
  };
})();

/* ==========================================================================
   PROJECT FILE  (docs/project-file-spec.md sections 8, 10 and 12; docs/tower-project-sun-plan.md sections 3.2, 5.2 and 7)
   `ProjectUI` is the glue between the page and src/shared/project.js (ProjectMod).
   With ?project=<id> the page opens that project, loads its "massing" section when the Tower Generator wrote it, and writes
   that section back after every change (1 s debounce, and on visibilitychange / pagehide). The "sun" section is written in the
   same save when the Sun Study is on (state.sun.mode === "study") or a sun-hours result exists (writeSun below).
   Without a project nothing here runs until the Project menu or a Send item is used.
   A massing written by another tool (the Mid-Rise Generator) is kept until you confirm the replacement.
   ProjectMod.writeSection returns a new project and does not change the one it gets. So a save loads the project fresh from
   storage, writes the sections on that copy and saves it (another tool may have saved from a second tab).
   Every storage call is inside try/catch. Tests inject storage, navigation and the address bar with configure().
   ========================================================================== */
const ProjectUI = (() => {
  const $ = (id) => document.getElementById(id);
  const ZERO = () => ({ x: 0, y: 0, rotation: 0, baseZ: 0 });
  const READ_ONLY_TEXT = 'This project was saved by a newer version of this tool. You can view it, but changes will not be saved.';
  const NO_STORAGE_TEXT = 'Saving is unavailable in this browser, so the project is kept only until you close this page.';
  const MAX_CONTEXT = 300;
  const TOOL_NAMES = { midrise: 'Mid-Rise', tower: 'Tower', plate: 'Plate Planner', parking: 'Parking Deck', facade: 'Facade Studio', grading: 'Grading Sketch' };
  const SEND_TOOLS = ['plate', 'parking', 'facade', 'grading'];
  const project = {
    doc: null, timer: 0, dirty: false, readOnly: false, loading: false, noted: {},
    replaceNeeded: false, replaceTool: null, confirmed: false, asking: false, renamed: null,
    keepManual: false,           // "Keep manual blocks" next to Context from site
    sunHours: null,              // the sun-hours payload written into the sun section (null = none)
    storage: null,
    navigate: (url) => { window.location.assign(url); },
    updateUrl: (id) => {
      try {
        const u = new URL(window.location.href);
        if (id) u.searchParams.set('project', id); else u.searchParams.delete('project');
        window.history.replaceState(null, '', u.pathname + u.search + u.hash);
      } catch (e) { /* the address bar is a convenience */ }
    },
  };
  const DEFAULT_NAV = project.navigate, DEFAULT_URL = project.updateUrl;
  const isObjP = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);
  const toolName = (id) => TOOL_NAMES[id] || 'another tool';

  function storageOf() {
    if (project.storage) return project.storage;
    try { return window.localStorage; } catch (e) { return null; }
  }
  function noticeOnce(key, message, kind = 'warn', ms = 9000) {
    if (project.noted[key]) return;
    project.noted[key] = true;
    Toast.show(message, kind, ms);
  }
  const storageNotice = () => ({ onNotice: (message) => noticeOnce(`storage:${message}`, String(message)) });

  /* ---- reading the project ------------------------------------------------------------------ */
  const has = () => !!project.doc;
  function sectionOf(key) {
    if (!project.doc) return null;
    try { return ProjectMod.getSection(project.doc, key); } catch (e) { return null; }
  }
  const placement = () => {
    const p = Store.raw().placement;
    return isObjP(p) ? { x: num(p.x, 0), y: num(p.y, 0), rotation: num(p.rotation, 0), baseZ: num(p.baseZ, 0) } : ZERO();
  };

  /** The site of the project: { size, boundary (project frame), center, ground, updatedAt } or null. */
  function siteInfo() {
    const sec = sectionOf('site');
    if (!sec || !isObjP(sec.derived)) return null;
    const dv = sec.derived, frame = (project.doc && project.doc.frame) || {};
    const S = num(dv.size, num(frame.size, 0));
    let boundary = Array.isArray(dv.boundary) && dv.boundary.length >= 3 ? dv.boundary : null;
    if (!boundary && S > 0) boundary = [[0, 0], [S, 0], [S, S], [0, S]];
    if (!boundary) return null;
    let ring = boundary;
    try { ring = ProjectMod.transformRing(sec, boundary, 'toProject'); } catch (e) { ring = boundary; }
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const q of ring) { minX = Math.min(minX, q[0]); maxX = Math.max(maxX, q[0]); minY = Math.min(minY, q[1]); maxY = Math.max(maxY, q[1]); }
    return { size: S, boundary: ring, center: [(minX + maxX) / 2, (minY + maxY) / 2], ground: isObjP(dv.ground) ? dv.ground : null, updatedAt: sec.updatedAt || '' };
  }
  const hasSite = () => !!siteInfo();

  /** The place of the site: { lat, lon } from the project frame (or the site section), or null. For the Sun section's "Site" place. */
  function sitePlace() {
    if (!project.doc || !hasSite()) return null;
    const frame = project.doc.frame || {}, dv = (sectionOf('site') || {}).derived || {};
    const lat = Number.isFinite(frame.lat) ? frame.lat : dv.lat, lon = Number.isFinite(frame.lon) ? frame.lon : dv.lon;
    return Number.isFinite(lat) && Number.isFinite(lon) ? { lat, lon } : null;
  }

  /** The ground elevation (project frame, ft) at a project point: bilinear on the site grid. null without a grid. */
  function groundAt(xp, yp) {
    const sec = sectionOf('site');
    return sec && isObjP(sec.derived) ? SiteLayerMod.groundZAt(sec.derived, xp, yp) : null;
  }

  /** The Grading Sketch tier that sets the ground floor of the massing: { ffe, source, id } or null (spec section 4: the lowest tier). */
  function gradingFfe() {
    const sec = sectionOf('grading');
    const list = sec && isObjP(sec.derived) && Array.isArray(sec.derived.ffe) ? sec.derived.ffe : [];
    let best = null;
    for (const t of list) if (isObjP(t) && t.source === 'massing' && Number.isFinite(t.ffe) && (!best || t.ffe < best.ffe)) best = { ffe: t.ffe, source: t.source, id: t.id };
    return best;
  }

  /** The site boundary in the building's own (local) frame, for the renderer. null without a site. */
  let bCache = { key: null, ring: null };
  const clearBoundary = () => { bCache = { key: null, ring: null }; };
  function boundaryKey() {
    if (!project.doc) return '';
    const info = siteInfo();
    if (!info) return 'none';
    return `${info.updatedAt}|${JSON.stringify(placement())}`;
  }
  function boundaryLocal() {
    const key = boundaryKey();
    if (!key || key === 'none') return null;
    if (bCache.key === key) return bCache.ring;
    let ring = null;
    try { ring = ProjectMod.transformRing(placement(), siteInfo().boundary, 'toLocal'); } catch (e) { ring = null; }
    bCache = { key, ring };
    return ring;
  }

  /* ---- placement and context ----------------------------------------------------------------- */
  /** Neighbor blocks from the site for a placement and radius, as context blocks. { blocks, trimmed } or null on an error. */
  function siteBlocks(pl, radius, keepManual, current) {
    let res;
    try { res = ProjectMod.siteContextFor(project.doc, pl, radius); } catch (e) { console.error(e); return null; }
    let blocks = res.blocks.map((b) => ({ x: b.x, y: b.y, w: b.w, d: b.d, h: b.h, base: b.base, site: true }));
    let trimmed = 0;
    if (blocks.length > MAX_CONTEXT) {
      blocks.sort((a, b) => Math.hypot(a.x, a.y) - Math.hypot(b.x, b.y));
      trimmed = blocks.length - MAX_CONTEXT;
      blocks = blocks.slice(0, MAX_CONTEXT);
    }
    if (keepManual) blocks = [...(current || []).filter((b) => b && !b.site).map((b) => ({ ...b })), ...blocks];
    return { blocks, trimmed };
  }

  /** Puts the tower at the site center, with its ground floor at the ground there. One undo step (the neighbors follow in the same step). */
  function centerOnSite({ quiet = false } = {}) {
    const info = siteInfo();
    if (!info) { if (!quiet) Toast.show('This project has no site yet. Send a site from the Site Model first.', 'warn'); return false; }
    const z = groundAt(info.center[0], info.center[1]);
    const cur = placement();
    const next = { x: Math.round(info.center[0] * 100) / 100, y: Math.round(info.center[1] * 100) / 100, rotation: cur.rotation, baseZ: z == null ? cur.baseZ : Math.round(z * 10) / 10 };
    const st = deepClone(Store.raw());
    st.placement = next;
    if (st.context && st.context.fromSite) {
      const r = siteBlocks(next, num(st.context.radius, CONFIG.contextRadius), project.keepManual, st.context.blocks);
      if (r) st.context.blocks = r.blocks;
    }
    Store.replace(st);
    if (!quiet) Toast.show(z == null ? 'Centered on the site.' : `Centered on the site. Ground floor at ${Units.formatFeetInches(next.baseZ)} above sea level.`);
    return true;
  }
  /** The site buildings near the tower become context blocks (fromSite = true). One undo step. Returns the count, or -1.
   *  opts { quiet, merge (no new undo step when the Store supports it), keepManual (default: the Keep manual blocks toggle) }. */
  function contextFromSite(radius, { quiet = false, merge = false, keepManual } = {}) {
    if (!project.doc) { if (!quiet) Toast.show('Open a project first.', 'warn'); return -1; }
    if (!hasSite()) { if (!quiet) Toast.show('This project has no site, so there are no neighbors to load.', 'warn'); return -1; }
    const r = Number.isFinite(radius) && radius > 0 ? radius : num(Store.get('context.radius'), CONFIG.contextRadius);
    const cur = Store.raw().context;
    const res = siteBlocks(placement(), r, keepManual === undefined ? project.keepManual : !!keepManual, cur.blocks);
    if (!res) { Toast.show('The neighbors could not be read from the site.', 'bad'); return -1; }
    Store.set('context', { ...deepClone(cur), blocks: res.blocks, fromSite: true, show: true, radius: r }, { live: false, merge });
    const n = res.blocks.filter((b) => b.site).length;
    if (!quiet) Toast.show(n ? `Loaded ${n} neighbor${n === 1 ? '' : 's'} within ${Units.formatFeetInches(r)}.${res.trimmed ? ` ${res.trimmed} farther ones were left out.` : ''}` : `No site buildings within ${Units.formatFeetInches(r)}.`);
    return n;
  }

  /* ---- the sun section ----------------------------------------------------------------------------- */
  const year = () => new Date().getFullYear();
  const isMD = (s) => typeof s === 'string' && /^\d\d-\d\d$/.test(s);
  const hhmm = (m) => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(Math.round(m) % 60).padStart(2, '0')}`;
  const r2 = (v) => Math.round(v * 100) / 100;

  /** The place of the study: the site (when the project has one and the place says so), typed, or Atlanta. */
  function sunPlace(st) {
    const pl = (st.sun && st.sun.place) || {};
    if (pl.source === 'site') { const sp = sitePlace(); if (sp) return sp; }
    if ((pl.source === 'typed' || pl.source === 'site') && Number.isFinite(pl.lat) && Number.isFinite(pl.lon)) return { lat: pl.lat, lon: pl.lon };
    return { lat: SolarMod.ATLANTA.lat, lon: SolarMod.ATLANTA.lon };
  }
  /** A finished sun-hours result (SunHoursMod output plus grid and date) → the form written into the project, or null. */
  function sunHoursPayload(r) {
    if (!r || !r.hours || !(r.spacing > 0)) return null;
    const len = r.hours.length;
    const nx = Number.isFinite(r.nx) ? r.nx : (Number.isFinite(r.n) ? r.n : Math.round(Math.sqrt(len)));
    const ny = Number.isFinite(r.ny) ? r.ny : (nx > 0 ? len / nx : 0);
    if (!(nx > 0 && ny > 0) || nx * ny !== len) return null;
    const date = isMD(r.date) ? `${year()}-${r.date}` : (typeof r.date === 'string' ? r.date : null);
    return {
      spacing: r.spacing, n: Number.isFinite(r.n) ? r.n : Math.max(nx, ny), nx, ny, x0: num(r.x0, 0), y0: num(r.y0, 0),
      frame: r.frame === 'local' ? 'local' : 'project', date, step: num(r.step, 30),
      hours: Array.from(r.hours, (v) => r2(v)),
    };
  }
  /** sun.derived (spec 6.6 plus the additive keys of plan section 7). */
  function sunDerived(st) {
    const sun = st.sun || {};
    const { lat, lon } = sunPlace(st);
    const tz = isObjP(sun.tz) && sun.tz.zone ? sun.tz : { zone: 'us-eastern', offset: -5 };
    const dates = (Array.isArray(sun.dates) ? sun.dates : []).filter(isMD).map((md) => `${year()}-${md}`);
    const times = (Array.isArray(sun.times) ? sun.times : []).filter((m) => Number.isFinite(m)).sort((a, b) => a - b);
    const samples = [], seen = new Set();
    const add = (date, minutes, always) => {
      const time = hhmm(minutes), key = `${date} ${time}`;
      if (seen.has(key)) return;
      const p = SolarMod.sunPosition(lat, lon, SolarMod.localToUTC(date, minutes, tz));
      if (!always && !(p.altitude > 0)) return;
      seen.add(key);
      samples.push({ date, time, azimuth: r2(p.azimuth), altitude: r2(p.altitude) });
    };
    for (const date of dates) {
      for (const m of times) add(date, m, true);                 // the study sheet: every date x time
      for (let m = 0; m < 1440; m += 60) add(date, m, false);    // each date hourly, daylight only
    }
    return {
      lat, lon, tzOffset: dates.length ? SolarMod.tzOffset(tz, dates[0], 720) : num(tz.offset, -5), zone: tz.zone,
      dates, samples, sunHours: project.sunHours ? deepClone(project.sunHours) : null,
    };
  }
  const sunWanted = () => { const s = Store.raw().sun; return !!project.sunHours || !!(s && s.mode === 'study'); };
  /** The "sun" section patch for the design on screen. */
  function sunPatch() {
    const st = Store.snapshot();
    const state = deepClone(st.sun) || {};
    state.play = false;
    return { tool: CONFIG.tool, schema: CONFIG.projectSchema, placement: ZERO(), state, derived: sunDerived(st), note: 'sun study' };
  }
  /**
   * For the Sun UI: keeps a finished sun-hours result (SunHoursMod output plus { spacing, n, nx, ny, x0, y0, frame, date, step };
   * hours = Float32Array or array; date "MM-DD" or "YYYY-MM-DD") and writes the "sun" section with it, or with null to clear it.
   * The write happens with the next project save (1 s). Returns true when a project is open to take it.
   */
  function writeSun(result) {
    project.sunHours = result ? sunHoursPayload(result) : null;
    if (!project.doc) return false;
    markDirty();
    return true;
  }
  /** The sun-hours result stored in the open project's sun section (hours as a Float32Array), or null. */
  function sunHoursStored() {
    const sec = sectionOf('sun');
    const sh = sec && isObjP(sec.derived) ? sec.derived.sunHours : null;
    if (!sh || !Array.isArray(sh.hours)) return null;
    return { ...sh, hours: Float32Array.from(sh.hours) };
  }

  /* ---- writing the project ---------------------------------------------------------------------- */
  function renderPill() {
    const doc = project.doc, pill = $('projPill');
    if (pill) {
      pill.hidden = !doc;
      if (doc) { pill.textContent = `${doc.name}${project.readOnly ? ' (read only)' : ''}`; pill.title = `Project: ${pill.textContent}`; }
    }
    const line = $('projLine');
    if (line && doc) {
      const info = siteInfo();
      line.textContent = `Project “${doc.name}”${project.readOnly ? ' (read only)' : ''}. ${info ? `Site: ${Units.formatFeetInches(info.size)} square.` : 'No site in this project.'}`;
    }
    const note = $('ctxSiteNote');
    if (note) {
      const n = (Store.raw().context.blocks || []).filter((b) => b && b.site).length;
      note.textContent = Store.raw().context.fromSite ? `${n} block${n === 1 ? '' : 's'} from the site.` : '';
    }
    const ffe = $('ffeNote'), tier = gradingFfe();
    if (ffe) {
      ffe.hidden = !doc;
      ffe.textContent = !doc ? '' : tier
        ? `Grading Sketch sets the ground floor at ${Units.formatFeetInches(tier.ffe)}. The other tools read that height; the base elevation below stays editable.`
        : 'No Grading Sketch height yet, so the tools read the base elevation below as the ground floor.';
    }
  }
  function openCheck(doc) {
    let sec = null, sunSec = null;
    try { sec = ProjectMod.getSection(doc, 'massing'); sunSec = ProjectMod.getSection(doc, 'sun'); } catch (e) { sec = null; }
    const above = (s) => !!s && Number(s.schema) > CONFIG.projectSchema;
    const newerState = !!sec && sec.tool === CONFIG.tool && isObjP(sec.state) && Number(sec.state.schema) > CONFIG.schema;
    const newer = above(sec) || above(sunSec) || newerState || Number(doc.version) > Number(ProjectMod.VERSION || 1);
    return { sec, newer };
  }

  function markDirty() {
    if (!project.doc || project.loading) return;
    project.dirty = true;
    clearTimeout(project.timer);
    project.timer = setTimeout(() => { flush(); }, CONFIG.projectSaveMs);
  }
  function saveFailureText(res) {
    if (!res) return NO_STORAGE_TEXT;
    return String(res.warning || 'The project could not be saved.');
  }
  async function askReplace() {
    if (project.asking) return false;
    project.asking = true;
    const other = toolName(project.replaceTool);
    const ok = await confirmDialog(`This project holds a massing from the ${other}. Saving here replaces it with this tower.`, `Replace the ${other} massing with this tower`);
    project.asking = false;
    if (ok) { project.confirmed = true; project.readOnly = false; renderPill(); flush(); return true; }
    project.readOnly = true;
    renderPill();
    Toast.show(`The project keeps the ${other} massing. Changes here will not be saved to it.`, 'warn', 8000);
    return false;
  }

  /** The "massing" section patch for the design on screen. */
  function sectionPatch() {
    const st = Store.snapshot();
    st.sun.play = false;
    const d = Derived.get();
    const derived = TowerDerivedMod.towerDerived(st, d, d.metrics);
    const pl = placement();
    return { tool: CONFIG.tool, schema: CONFIG.projectSchema, placement: pl, state: { ...st, placement: pl }, derived, note: st.name };
  }
  /**
   * Writes the massing section (and the sun section when it is wanted) and saves the project. Loads the project fresh from storage
   * first, writes the sections on that copy, saves it. Returns saveProject's result, { ok: true, skipped: true } when there is
   * nothing to do, or { ok: false }.
   */
  function flush() {
    clearTimeout(project.timer);
    project.timer = 0;
    const doc = project.doc;
    if (!doc || project.readOnly || !project.dirty) return { ok: true, skipped: true };
    if (project.replaceNeeded && !project.confirmed) { askReplace(); return { ok: true, skipped: true, asking: true }; }
    const opts = storageNotice();
    let patch;
    try { patch = sectionPatch(); } catch (e) {
      console.error(e);
      Toast.show(`The project could not be updated. ${e && e.message ? e.message : ''}`.trim(), 'bad', 8000);
      return { ok: false };
    }
    let base = doc;
    try { base = ProjectMod.loadProject(storageOf(), doc.id, opts) || doc; } catch (e) { base = doc; }
    let next = null;
    try { next = ProjectMod.writeSection(base, 'massing', patch); } catch (e) {
      if (e && e.readOnly) { project.readOnly = true; renderPill(); noticeOnce('readonly', e.message || READ_ONLY_TEXT); return { ok: false, readOnly: true }; }
      console.error(e);
      Toast.show(`The project could not be updated. ${e && e.message ? e.message : ''}`.trim(), 'bad', 8000);
      return { ok: false };
    }
    if (sunWanted()) {
      try { next = ProjectMod.writeSection(next, 'sun', sunPatch()); } catch (e) {
        if (e && e.readOnly) { project.readOnly = true; renderPill(); noticeOnce('readonly', e.message || READ_ONLY_TEXT); return { ok: false, readOnly: true }; }
        console.error(e);       // the massing is still saved; the sun section waits for the next change
        noticeOnce('sun-write', `The sun study could not be saved to the project. ${e && e.message ? e.message : ''}`.trim(), 'warn', 8000);
      }
    }
    if (project.renamed) next.name = project.renamed;
    project.doc = next;
    let res = null;
    try { res = ProjectMod.saveProject(storageOf(), next, opts); } catch (e) { console.error(e); }
    if (!res || res.ok === false) {
      noticeOnce(`save:${(res && res.warning) || ''}`, saveFailureText(res), 'bad', 12000);
      return res || { ok: false };
    }
    project.dirty = false;
    project.renamed = null;
    if (res.warning) noticeOnce('warning', String(res.warning));
    renderPill();
    return res;
  }

  /* ---- opening, creating, closing -------------------------------------------------------------- */
  /** Gets the screen ready for a new state: no selection, no compare, no half-done handle drag. */
  function readyScreen() {
    try { if (Render.comparing()) Compare.exit(); } catch (e) { /* the compare view is optional here */ }
    try { Select.cancelHandleDrag(); Select.clear(); } catch (e) { /* nothing selected */ }
  }
  /** Makes `doc` the open project and loads its massing (or sets the placement for a design that has none). */
  function openDoc(doc, { startup = false } = {}) {
    if (project.doc && project.doc !== doc) flush();
    clearTimeout(project.timer);
    const { sec, newer } = openCheck(doc);
    Object.assign(project, { doc, timer: 0, dirty: false, readOnly: !!newer, replaceNeeded: false, replaceTool: null, confirmed: false, renamed: null });
    clearBoundary();
    project.sunHours = null;
    { const s = sectionOf('sun'); if (s && s.tool === CONFIG.tool && isObjP(s.derived) && s.derived.sunHours) project.sunHours = deepClone(s.derived.sunHours); }
    if (newer) noticeOnce('readonly', READ_ONLY_TEXT);
    readyScreen();
    project.loading = true;
    try {
      const hasState = !!sec && isObjP(sec.state) && Object.keys(sec.state).length > 0;
      const mine = !!sec && sec.tool === CONFIG.tool && hasState;
      const foreign = !!sec && !!sec.tool && sec.tool !== CONFIG.tool && (hasState || (isObjP(sec.derived) && Object.keys(sec.derived).length > 0));
      if (mine) {
        let st = deepClone(sec.state);
        if (!(st.schema >= 2)) st = migrateTower(st, Number(st.schema) || 1);
        Store.replace(fillDefaults({ ...st, placement: isObjP(sec.placement) ? sec.placement : ZERO() }), { resetHistory: startup });
      } else {
        if (foreign) { project.replaceNeeded = true; project.replaceTool = sec.tool; }
        const cur = deepClone(Store.raw());
        cur.placement = ZERO();
        if (hasSite()) {
          const info = siteInfo();
          if (foreign && isObjP(sec.placement)) cur.placement = { x: num(sec.placement.x, 0), y: num(sec.placement.y, 0), rotation: num(sec.placement.rotation, 0), baseZ: num(sec.placement.baseZ, 0) };
          else {
            // a project with a site and no tower yet: the tower starts at the site center, on the ground there
            const z = groundAt(info.center[0], info.center[1]);
            cur.placement = { x: Math.round(info.center[0] * 100) / 100, y: Math.round(info.center[1] * 100) / 100, rotation: 0, baseZ: z == null ? 0 : Math.round(z * 10) / 10 };
          }
        } else if (cur.context && cur.context.fromSite) cur.context.fromSite = false;
        Store.replace(fillDefaults(cur), { resetHistory: startup });
      }
    } finally { project.loading = false; }
    if (!(sec && sec.tool === CONFIG.tool && isObjP(sec.state) && Object.keys(sec.state).length)) {
      if (hasSite() && !project.readOnly) {
        project.loading = true;
        try { contextFromSite(undefined, { quiet: true, keepManual: false }); } finally { project.loading = false; }
      }
      if (!project.readOnly) markDirty();              // the new massing section is written (another tool's massing waits for the question)
    }
    renderPill();
    if (Render.ready()) Render.setView(Render.info().preset || 'axon', true);

  }
  /** Forgets the open project (the saved copy stays where it is). */
  function close() {

    clearBoundary();
    project.loading = true;
    try {
      const cur = deepClone(Store.raw());
      cur.placement = null;

  }
  const defaultName = () => (String(Store.get('name') || '').trim() || 'New project').slice(0, 80);
  /** New project (a local frame, no site) holding the design on screen. Returns the doc or null. */
  function create(name, { quiet = false } = {}) {
    flush();
    const title = String(name || '').trim().slice(0, 80) || defaultName();
    let doc;
    try { doc = ProjectMod.newProject({ name: title }); } catch (e) {
      console.error(e);
      Toast.show(`The project could not be made. ${e && e.message ? e.message : ''}`.trim(), 'bad', 8000);
      return null;
    }

    project.loading = true;

  function rename(name) {

    project.dirty = true;

  /** Send: the project holds this massing (a project is made now when none is open), then the next tool opens with ?project=<id>. */
  async function send(toolId) {

    if (project.replaceNeeded && !project.confirmed) { const ok = await askReplace(); if (!ok) return false; }

  /* ---- the Site tab: Project site ---------------------------------------------------------------- */

/* ==========================================================================
   SHARED: screenshot

/* ---- src/shared/screenshot.js ---- */
const ShotMod = (() => {
/* ==========================================================================
   SHARED: screenshot
   Capture a three.js view at higher resolution, annotate it on a 2D canvas,
   and deliver the PNG (share sheet on iPad, download elsewhere).

   Does not need preserveDrawingBuffer (the frame is copied in the same task
   it is rendered in).

const FONT_STACK = '-apple-system, "SF Pro Text", "Inter", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';

/** Total pixel budget. iOS Safari limits a canvas to 16,777,216 px (4096 x 4096). */
const DEFAULT_MAX_PIXELS = 16000000;

/* Duck-typed targets so we do not need THREE.Vector2 / Vector4. */
function vec2() { return { x: 0, y: 0, set(x, y) { this.x = x; this.y = y; return this; } }; }
function vec4() {
  return {
    x: 0, y: 0, z: 0, w: 0,
    set(x, y, z, w) { this.x = x; this.y = y; this.z = z; this.w = w; return this; },
    copy(v) { this.x = v.x; this.y = v.y; this.z = v.z; this.w = v.w; return this; },
  };
}

/** Largest scale <= requested that fits the GPU and canvas limits. */
function fitScale(renderer, baseW, baseH, scale, maxPixels) {
  let s = scale;
  let maxDim = Infinity;
  try {
    const gl = renderer.getContext();
    maxDim = Math.min(
      gl.getParameter(gl.MAX_RENDERBUFFER_SIZE) || Infinity,
      gl.getParameter(gl.MAX_TEXTURE_SIZE) || Infinity

    const vp = gl.getParameter(gl.MAX_VIEWPORT_DIMS);
    if (vp) maxDim = Math.min(maxDim, vp[0], vp[1]);
  } catch (e) { /* ignore */ }
  maxDim = Math.min(maxDim, 16384);
  s = Math.min(s, maxDim / baseW, maxDim / baseH);
  const px = baseW * baseH;
  if (px * s * s > maxPixels) s = Math.sqrt(maxPixels / px);
  return Math.max(s, 1 / Math.max(baseW, baseH));     // never zero
}

/**
 * Renders the scene at `scale` x the renderer's current drawing-buffer size and
 * returns a PNG Blob with the overlay drawn on top.

 * @param {object}   o
 * @param {object}   o.renderer  THREE.WebGLRenderer
 * @param {object}   o.scene
 * @param {object}   o.camera
 * @param {number}   [o.scale=2]
 * @param {object}   [o.overlay]  { title?, date?, metrics?: Array<[label,value]>, mark?: "CMRLM", theme?: "light"|"dark" }

 * @param {Function} [o.render]  optional (renderer, scene, camera) => void replacing renderer.render

async function captureView({ renderer, scene, camera, scale = 2, overlay, render, maxPixels = DEFAULT_MAX_PIXELS } = {}) {

  const eff = fitScale(renderer, baseW, baseH, scale, maxPixels);

  const H = Math.max(1, Math.round(baseH * eff));

  const out = document.createElement("canvas");
  out.width = W;
  out.height = H;
  const ctx = out.getContext("2d");
  if (!ctx) throw new Error("Could not create a 2D canvas for the screenshot.");

  const setBuffer = (w, h, ratio) => {
    // pixel ratio 1 with an explicit size gives an exact W x H buffer; style is never touched
    if (typeof renderer.setDrawingBufferSize === "function") renderer.setDrawingBufferSize(w, h, ratio);
    else { renderer.setPixelRatio(ratio); renderer.setSize(w, h, false); }
  };

  try {
    setBuffer(W, H, 1);
    renderer.setScissorTest(false);
    renderer.setViewport(0, 0, W, H);
    if (aspect !== null) { camera.aspect = W / H; camera.updateProjectionMatrix(); }

    draw();
    // Copy NOW, in the same task as the render (works without preserveDrawingBuffer).
    ctx.drawImage(canvas3d, 0, 0, W, H);
  } finally {
    /* ---- restore everything, then repaint the live view ---- */
    setBuffer(cssW, cssH, pr);
    renderer.setViewport(viewport.x, viewport.y, viewport.z, viewport.w);
    renderer.setScissor(scissor.x, scissor.y, scissor.z, scissor.w);
    renderer.setScissorTest(scissorTest);
    if (aspect !== null) { camera.aspect = aspect; camera.updateProjectionMatrix(); }
    try { draw(); } catch (e) { /* the app's own loop will repaint */ }
  }

  /* ---- overlay, sized in "CSS pixels of the original view" so it matches the app's look ---- */
  if (overlay) drawOverlay(ctx, W, H, W / Math.max(1, cssW), overlay);

  const blob = await canvasToBlob(out);
  try { blob.captureInfo = { width: W, height: H, scale: eff, requestedScale: scale }; } catch (e) { /* ignore */ }
  return blob;
}

/* ---------- overlay ---------- */

function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function formatDate(d) {
  if (d === true) d = new Date();
  if (d instanceof Date) {
    try { return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }); }
    catch (e) { return d.toISOString().slice(0, 10); }
  }
  return String(d);
}

/** Draw text with manual letter spacing (canvas letterSpacing is not in every Safari). */
function spacedWidth(ctx, text, tracking) {
  let w = 0;
  for (const ch of text) w += ctx.measureText(ch).width + tracking;
  return w - tracking;
}
function drawSpaced(ctx, text, x, y, tracking) {
  let cx = x;
  for (const ch of text) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + tracking; }
}

function drawOverlay(ctx, W, H, u, overlay) {
  const dark = overlay.theme === "dark";
  const panel = dark ? "rgba(23, 27, 31, 0.86)" : "rgba(255, 255, 255, 0.88)";
  const edge = dark ? "rgba(255, 255, 255, 0.14)" : "rgba(16, 20, 26, 0.14)";
  const ink = dark ? "#e7eaee" : "#1b1f24";
  const ink2 = dark ? "#a5adb7" : "#4e5763";
  const m = 16 * u;           // outer margin
  const pad = 10 * u;         // panel padding
  const radius = 8 * u;

  ctx.save();
  ctx.textBaseline = "alphabetic";
  ctx.lineWidth = Math.max(1, u);

  const box = (x, y, w, h) => {
    roundRect(ctx, x, y, w, h, radius);
    ctx.fillStyle = panel; ctx.fill();
    ctx.strokeStyle = edge; ctx.stroke();
  };

  /* title + date, top-left */
  const title = overlay.title ? String(overlay.title) : "";
  const date = overlay.date ? formatDate(overlay.date) : "";
  if (title || date) {
    const tSize = 17 * u, dSize = 12 * u;
    ctx.font = `600 ${tSize}px ${FONT_STACK}`;
    const tw = title ? ctx.measureText(title).width : 0;
    ctx.font = `400 ${dSize}px ${FONT_STACK}`;
    const dw = date ? ctx.measureText(date).width : 0;
    const w = Math.max(tw, dw) + pad * 2;
    const h = pad * 2 + (title ? tSize : 0) + (title && date ? 5 * u : 0) + (date ? dSize : 0);
    box(m, m, w, h);
    let y = m + pad;
    if (title) {
      y += tSize * 0.82;
      ctx.font = `600 ${tSize}px ${FONT_STACK}`;
      ctx.fillStyle = ink; ctx.fillText(title, m + pad, y);
      y += tSize * 0.18 + 5 * u;
    }
    if (date) {
      y += dSize * 0.82;
      ctx.font = `400 ${dSize}px ${FONT_STACK}`;
      ctx.fillStyle = ink2; ctx.fillText(date, m + pad, y);
    }
  }

  /* metrics, bottom-left */
  const rows = Array.isArray(overlay.metrics) ? overlay.metrics.filter((r) => Array.isArray(r) && r.length >= 2) : [];
  if (rows.length) {
    const size = 12.5 * u, rowH = 19 * u, gap = 18 * u;
    ctx.font = `400 ${size}px ${FONT_STACK}`;
    let lw = 0;
    for (const [l] of rows) lw = Math.max(lw, ctx.measureText(String(l)).width);
    ctx.font = `600 ${size}px ${FONT_STACK}`;
    let vw = 0;
    for (const [, v] of rows) vw = Math.max(vw, ctx.measureText(String(v)).width);
    const w = pad * 2 + lw + gap + vw;
    const h = pad * 2 + rowH * rows.length - (rowH - size);
    const x = m, y = H - m - h;
    box(x, y, w, h);
    rows.forEach(([l, v], i) => {
      const by = y + pad + size * 0.9 + i * rowH;
      ctx.textAlign = "left";
      ctx.font = `400 ${size}px ${FONT_STACK}`;
      ctx.fillStyle = ink2; ctx.fillText(String(l), x + pad, by);
      ctx.textAlign = "right";
      ctx.font = `600 ${size}px ${FONT_STACK}`;
      ctx.fillStyle = ink; ctx.fillText(String(v), x + w - pad, by);
    });
    ctx.textAlign = "left";
  }

  /* mark, bottom-right */
  if (overlay.mark) {
    const text = String(overlay.mark).toUpperCase();
    const size = 11 * u, tracking = 3 * u, padX = 10 * u, padY = 7 * u;
    ctx.font = `600 ${size}px ${FONT_STACK}`;
    const tw = spacedWidth(ctx, text, tracking);
    const w = tw + padX * 2, h = size + padY * 2;
    const x = W - m - w, y = H - m - h;
    box(x, y, w, h);
    ctx.fillStyle = ink2;
    drawSpaced(ctx, text, x + padX, y + padY + size * 0.82, tracking);
  }

  ctx.restore();
}

/* ---------- output ---------- */

function canvasToBlob(canvas) {
  return new Promise((resolve, reject) => {
    const fallback = () => {
      try {
        const url = canvas.toDataURL("image/png");
        const bin = atob(url.split(",")[1]);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        resolve(new Blob([bytes], { type: "image/png" }));
      } catch (e) {
        reject(new Error("The screenshot could not be created (image too large for this device)."));
      }
    };
    try {
      canvas.toBlob((b) => (b ? resolve(b) : fallback()), "image/png");
    } catch (e) { fallback(); }
  });
}

function isTouchApple() {
  const ua = navigator.userAgent || "";
  if (/iPad|iPhone|iPod/.test(ua)) return true;
  // iPadOS reports a Mac user agent; it is the only "Mac" with a touch screen
  return /Mac/.test(navigator.platform || ua) && (navigator.maxTouchPoints || 0) > 1;
}

function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);   // revoking sooner can break iOS downloads
}

/**
 * iPad (touch Apple device): share sheet with the PNG file. Everything else, or
 * if sharing is unavailable/fails: download through a temporary <a download>.
 * A cancelled share sheet (AbortError) does nothing.
 *
 * @param {Blob}   blob
 * @param {string} filename
 * @param {object} [opts]  { share: "auto" | "always" | "never" }  "auto" = only on iPad/iPhone
 * @returns {Promise<"shared"|"cancelled"|"downloaded">}
 */
async function deliverImage(blob, filename, { share = "auto" } = {}) {
  const useShare = share === "always" || (share === "auto" && isTouchApple());
  if (useShare && typeof navigator.share === "function" && typeof navigator.canShare === "function") {
    try {
      const file = new File([blob], filename, { type: blob.type || "image/png" });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return "shared";
      }
    } catch (e) {
      if (e && e.name === "AbortError") return "cancelled";
      // NotAllowedError (user activation expired) or anything else: fall through to download
    }
  }
  download(blob, filename);
  return "downloaded";
}

/** `title-YYYY-MM-DD.png`, safe for file systems. */
function screenshotFilename(name = "tower", date = new Date()) {
  const p = (n) => String(n).padStart(2, "0");
  const slug = String(name).trim().replace(/[^\w\-]+/g, "-").replace(/^-+|-+$/g, "").toLowerCase() || "view";
  return `${slug}-${date.getFullYear()}-${p(date.getMonth() + 1)}-${p(date.getDate())}.png`;
}

return { DEFAULT_MAX_PIXELS, captureView, deliverImage, screenshotFilename };
})();


const Shots = (() => {
  const SHOT_ITEMS = [
    ['title', 'Option name'], ['date', 'Date'], ['metrics', 'Six key metrics'], ['mark', 'CMRLM mark'],
  ];
  const prefersDark = () => !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);

  /** The six metrics on the picture: GFA, FAR, height, floors, units (or coverage), efficiency. */
  function keyMetrics(d) {
    const m = d.metrics;
    const ub = unitBreakdown(m);      // residential units + hotel keys; parking spaces are not counted
    return [
      ['GFA', Units.formatArea(m.gfa)],
      ['FAR', m.hasSite === false ? '—' : Units.formatRatio(m.far)],
      ['Height', Units.formatFeetInches(m.totalHeight)],
      ['Floors', Units.formatInt(m.floorCount)],
      ub.hasTotal ? [ub.label, Units.formatInt(ub.total)] : ['Site coverage', m.hasSite === false ? '—' : `${(m.siteCoverage * 100).toFixed(1)}%`],
      ['Efficiency', `${(m.efficiencyAvg * 100).toFixed(1)}%`],
    ];
  }

  function buildOverlay() {
    const state = Store.raw(), o = state.view.shot || {};
    const overlay = { theme: prefersDark() ? 'dark' : 'light' };
    const comparing = Render.comparing();
    if (o.title) overlay.title = comparing ? Compare.names().join('  |  ') : state.name;
    if (o.date) overlay.date = true;
    if (o.metrics && !comparing) overlay.metrics = keyMetrics(Derived.get());
    if (o.mark) overlay.mark = 'CMRLM';
    return overlay;
  }

  /** Renders the picture. With deliver = true it also downloads it (or opens the share sheet on an iPad). */
  async function capture({ deliver = false, scale = 2 } = {}) {
    const blob = await Render.capture(buildOverlay(), scale);
    if (deliver) {
      const name = Render.comparing() ? `${Store.get('name')}-compare` : Store.get('name');
      const result = await ShotMod.deliverImage(blob, ShotMod.screenshotFilename(name));
      if (result === 'downloaded') Toast.show('Image saved to your downloads.');
    }
    return blob;
  }
  async function take() {
    try { return await capture({ deliver: true }); } catch (e) { console.error(e); Toast.show(e && e.message ? e.message : 'The image could not be made.', 'bad', 6000); return null; }
  }

  /** The AI-ready picture: no overlay, grid, scale figure or wireframe; Model style; light plain sky. Filename `<option>-ai-ready-YYYY-MM-DD.png`. */
  async function aiReady({ deliver = true, scale = 2 } = {}) {
    const blob = await Render.captureClean(scale);
    if (deliver) {
      const result = await ShotMod.deliverImage(blob, ShotMod.screenshotFilename(`${Store.get('name')}-ai-ready`));
      if (result === 'downloaded') Toast.show('AI-ready image saved to your downloads.');
    }
    return blob;
  }
  async function takeAiReady() {
    try { return await aiReady({ deliver: true }); } catch (e) { console.error(e); Toast.show(e && e.message ? e.message : 'The image could not be made.', 'bad', 6000); return null; }
  }

  /** The overlay choices as menu elements (a label and one switch per item). Used by the Export menu's "Image overlay" view. */
  function overlayControls() {
    const out = [h('div', { class: 'label pop-label' }, 'The image shows')];
    for (const [key, text] of SHOT_ITEMS) {
      const btn = h('button', { class: 'toggle-row', type: 'button', role: 'switch', 'aria-checked': String(!!Store.get(`view.shot.${key}`)), 'data-shot': key, style: 'padding:0 8px' },
        h('span', null, text), h('span', { class: 'switch', 'aria-hidden': 'true' }));
      btn.addEventListener('click', () => {
        const next = !Store.get(`view.shot.${key}`);
        Store.set(`view.shot.${key}`, next, { live: false });
        btn.setAttribute('aria-checked', String(next));
      });
      out.push(btn);
    }
    return out;
  }

  return { take, capture, aiReady, takeAiReady, overlayControls, buildOverlay, keyMetrics };
})();

/* ==========================================================================
   SHADOW STUDY SHEET  (docs/tower-project-sun-plan.md sections 4.1 and 6.3)
   `SunStudy` makes the 3 x 3 shadow-range sheet: for each study date (rows) and time (columns), the Plan view with
   shadows, captured with ShotMod.captureView (through Render.capture), laid out on one canvas with labels and the
   CMRLM footer. Downloads <option>-shadow-study.png. Restores the view after.
   While it runs it changes the sun, the shadows switch, the style and the camera as one open drag; at the end every
   value goes back and the drag closes with no net change, so the sheet adds no undo step.
   ========================================================================== */
const SunStudy = (() => {
  let working = false;
  const CELL_W = 560;                 // px: each panel is scaled to this width on the sheet
  const frames = (n) => new Promise((resolve) => {
    let left = n;
    const step = () => { if (--left <= 0) resolve(); else requestAnimationFrame(step); };
    requestAnimationFrame(step);
    setTimeout(resolve, 400 * n);      // a hidden tab does not run animation frames
  });
  const toBitmap = async (blob) => {
    if (typeof createImageBitmap === 'function') return await createImageBitmap(blob);
    const url = URL.createObjectURL(blob);
    try {
      return await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('The panel could not be read.')); im.src = url; });
    } finally { setTimeout(() => URL.revokeObjectURL(url), 1000); }
  };
  const cssVar = (name, fallback) => { try { return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback; } catch (e) { return fallback; } };

  /** opts { deliver = true }. Resolves to { blob, width, height, panels, rows, cols, filename } (or null when it cannot run). */
  async function make(opts = {}) {
    const deliver = opts.deliver !== false;
    if (working) return null;
    if (!Render.ready()) { Toast.show('The 3D view is not available.', 'bad'); return null; }
    if (Render.comparing()) { Toast.show('Leave Compare to make the shadow study sheet.', 'warn'); return null; }
    working = true;
    SunUI.play(false);
    const sun0 = SunUI.sunState();
    const dates = sun0.dates.slice(0, 3), times = sun0.times.slice(0, 3);
    const st = Store.raw();
    const saved = {
      sun: deepClone(st.sun), viewSun: deepClone(st.view.sun), shadows: st.view.shadows, style: st.view.style,
      preset: Render.info().preset || null, hoursOn: !!(st.sun && st.sun.hours && st.sun.hours.on),
    };
    let sheet = null, sctx = null, cellH = 0, cols = 0;
    const lay = { margin: 36, rowLabel: 92, head: 84, colLabel: 40, foot: 56, gap: 12 };
    const captions = [];
    try {
      SunUI.sheetMode(true);
      SunLayer.suppress(true);
      // Open the drag with a view.sun write, so the shadow casters stay on while the panels are made.
      const vs = saved.viewSun || { azimuth: 135, altitude: 40 };
      Store.set('view.sun', { azimuth: vs.azimuth, altitude: num(vs.altitude, 40) + 0.5 }, { live: true });
      if (saved.style !== 'model') Store.set('view.style', 'model', { live: true });
      Render.setView('plan', false);
      for (let r = 0; r < dates.length; r++) {
        for (let c = 0; c < times.length; c++) {
          SunUI.setSun({ mode: 'study', date: dates[r], time: times[c] }, { live: true });
          const info = SunUI.calcAt(dates[r], times[c]);
          const up = info.altitude > 0;
          if (!!Store.raw().view.shadows !== up) Store.set('view.shadows', up, { live: true });
          await frames(3);
          const blob = await Render.capture(null, 1);
          const bmp = await toBitmap(blob);
          if (!sheet) {
            cols = times.length;
            cellH = Math.round(CELL_W * bmp.height / bmp.width);
            sheet = document.createElement('canvas');
            sheet.width = lay.margin * 2 + lay.rowLabel + cols * CELL_W + (cols - 1) * lay.gap;
            sheet.height = lay.margin + lay.head + lay.colLabel + dates.length * cellH + (dates.length - 1) * lay.gap + lay.foot + lay.margin / 2;
            sctx = sheet.getContext('2d');
            if (!sctx) throw new Error('Could not create a 2D canvas for the sheet.');
            sctx.fillStyle = '#ffffff';
            sctx.fillRect(0, 0, sheet.width, sheet.height);
          }
          const x = lay.margin + lay.rowLabel + c * (CELL_W + lay.gap);
          const y = lay.margin + lay.head + lay.colLabel + r * (cellH + lay.gap);
          sctx.drawImage(bmp, x, y, CELL_W, cellH);
          if (bmp.close) bmp.close();
          sctx.strokeStyle = '#d5d9de'; sctx.lineWidth = 1;
          sctx.strokeRect(x + 0.5, y + 0.5, CELL_W - 1, cellH - 1);
          captions.push({ x, y, text: up ? `Azimuth ${info.azimuth.toFixed(0)}°   Altitude ${info.altitude.toFixed(0)}°` : 'Sun below the horizon' });
        }
      }
      // labels, captions, header and footer
      const ink = '#1d2530', ink2 = '#5b6572';
      const font = (w, s) => `${w} ${s}px -apple-system, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif`;
      sctx.textBaseline = 'alphabetic';
      sctx.fillStyle = ink; sctx.font = font(650, 26); sctx.textAlign = 'left';
      sctx.fillText(`${Store.get('name') || 'Tower'}: shadow study`, lay.margin, lay.margin + 28);
      sctx.fillStyle = ink2; sctx.font = font(400, 15);
      sctx.fillText(`Plan view, north up. ${SunUI.placeText()}. Time zone: ${SunUI.tzText()}.`, lay.margin, lay.margin + 54);
      sctx.font = font(600, 17); sctx.fillStyle = ink; sctx.textAlign = 'center';
      times.forEach((t, c) => sctx.fillText(SunUI.hm(t), lay.margin + lay.rowLabel + c * (CELL_W + lay.gap) + CELL_W / 2, lay.margin + lay.head + 26));
      sctx.textAlign = 'left';
      dates.forEach((md, r) => {
        const y = lay.margin + lay.head + lay.colLabel + r * (cellH + lay.gap) + cellH / 2;
        sctx.fillStyle = ink; sctx.font = font(600, 18);
        sctx.fillText(SunUI.fmtMD(md), lay.margin, y);
        sctx.fillStyle = ink2; sctx.font = font(400, 12.5);
        sctx.fillText(SunUI.dayOffsetText(md), lay.margin, y + 18);
      });
      for (const cp of captions) {
        sctx.font = font(500, 12.5);
        const w = sctx.measureText(cp.text).width + 14;
        sctx.fillStyle = 'rgba(255,255,255,0.82)';
        sctx.fillRect(cp.x + 8, cp.y + 8, w, 22);
        sctx.fillStyle = ink; sctx.fillText(cp.text, cp.x + 15, cp.y + 24);
      }
      const fy = sheet.height - lay.margin / 2 - 18;
      sctx.fillStyle = ink2; sctx.font = font(400, 13); sctx.textAlign = 'left';
      sctx.fillText(`Shadows from the real sun at each date and time${rotationText()}. Generated ${new Date().toISOString().slice(0, 10)}.`, lay.margin, fy);
      sctx.fillStyle = ink; sctx.font = font(700, 16); sctx.textAlign = 'right';
      sctx.fillText('CMRLM', sheet.width - lay.margin, fy);
    } finally {
      // Put everything back. The drag closes with the original values, so the history gets nothing.
      SunUI.sheetMode(false);
      SunLayer.suppress(false);
      try {
        Store.set('sun', saved.sun === undefined ? { mode: 'manual' } : saved.sun, { live: true });
        Store.set('view.sun', saved.viewSun, { live: true });
        Store.set('view.shadows', saved.shadows, { live: true });
        Store.set('view.style', saved.style, { live: true });
        Store.commit();
        Render.setView(saved.preset || 'axon', false);
      } catch (e) { console.error(e); }
      working = false;
    }
    const blob = await new Promise((resolve, reject) => sheet.toBlob((b) => (b ? resolve(b) : reject(new Error('The sheet could not be saved as a PNG.'))), 'image/png'));
    const slug = String(Store.get('name') || 'tower').trim().replace(/[^\w\-]+/g, '-').replace(/^-+|-+$/g, '').toLowerCase() || 'tower';
    const filename = `${slug}-shadow-study.png`;
    const out = { blob, width: sheet.width, height: sheet.height, panels: dates.length * times.length, rows: dates.length, cols: times.length, filename };
    if (deliver) {
      const result = await ShotMod.deliverImage(blob, filename);
      if (result === 'downloaded') Toast.show('Shadow study sheet saved to your downloads.');
    }
    return out;
  }
  function rotationText() {
    const p = Store.raw().placement;
    const r = p && typeof p === 'object' ? num(p.rotation, 0) : 0;
    return r ? `; the tower is turned ${r}° from true north` : '';
  }
  return { make, busy: () => working };
})();

/* ==========================================================================
   COMPARE
   Choose 2 to 4 options. One renderer draws each option in its own part of
   the screen (setViewport / setScissor, see Render.enterCompare), one camera
   control moves them all, and a table under the views lists the metrics with
   the best value in each ranked row in bold.
   ========================================================================== */
const Compare = (() => {
  const CURRENT = '__current';
  const MIN = 2, MAX = 4;
  const $ = (id) => document.getElementById(id);
  let active = false, chosen = [], entries = [], version = 0, refreshTimer = null, ro = null;

  const RULE = 'Bold marks the best value in a row. Higher is better for GFA, FAR, units and keys, and efficiency. Parking spaces are counted apart and never added to units. Other rows are not ranked.';
  const totalUnits = (m) => { const ub = unitBreakdown(m); return ub.hasTotal ? ub.total : null; };      // residential units + hotel keys
  const parkingSpaces = (m) => { const ub = unitBreakdown(m); return ub.spaces.length ? ub.spaces.reduce((a, r) => a + r.count, 0) : null; };
  const ROWS = [
    { label: 'GFA', get: (e) => e.d.metrics.gfa, fmt: Units.formatArea, higher: true },
    { label: 'FAR', get: (e) => (e.d.metrics.hasSite === false ? null : e.d.metrics.far), fmt: (v) => Units.formatRatio(v, 2), higher: true },
    { label: 'Units + keys (estimate)', get: (e) => totalUnits(e.d.metrics), fmt: Units.formatInt, higher: true },
    { label: 'Parking spaces (estimate)', get: (e) => parkingSpaces(e.d.metrics), fmt: Units.formatInt },
    { label: 'Efficiency (avg)', get: (e) => e.d.metrics.efficiencyAvg, fmt: (v) => `${(v * 100).toFixed(1)}%`, higher: true },
    { label: 'Floors', get: (e) => e.d.metrics.floorCount, fmt: Units.formatInt },
    { label: 'Total height', get: (e) => e.d.metrics.totalHeight, fmt: Units.formatFeetInches },
    { label: 'Site coverage', get: (e) => (e.d.metrics.hasSite === false ? null : e.d.metrics.siteCoverage), fmt: (v) => `${(v * 100).toFixed(1)}%` },
    { label: 'Tower plate (avg)', get: (e) => e.d.metrics.plateAvg, fmt: Units.formatArea },
    { label: 'Net area', get: (e) => e.d.metrics.netArea, fmt: Units.formatArea },
    { label: 'Warnings', get: (e) => e.d.warnings.length, fmt: Units.formatInt },
  ];

  /** Everything that can be compared: the design on screen (if it differs from its saved copy) and the saved options. */
  function candidates() {
    const list = [];
    if (Options.syncDirty()) list.push({ key: CURRENT, name: `${Store.get('name')} (on screen)`, state: () => Store.snapshot() });
    for (const o of Options.list()) list.push({ key: o.id, name: o.name, state: () => o.state });
    return list;
  }

  function buildEntries() {
    const cands = candidates();
    entries = chosen.map((key) => cands.find((c) => c.key === key)).filter(Boolean).map((c) => {
      const state = fillDefaults(c.state());
      state.name = c.name;
      return { key: c.key, name: c.name, state, d: computeDerived(state), uid: `${c.key}#${version}` };
    });
  }

  function renderBar(cands) {
    const bar = $('cmpBar');
    bar.textContent = '';
    const chips = h('div', { class: 'chips', role: 'group', 'aria-label': 'Options to compare' });
    for (const c of cands) {
      const on = chosen.includes(c.key);
      const b = h('button', { class: 'chip', type: 'button', 'aria-pressed': String(on), 'data-key': c.key, title: on ? 'Click to remove from the comparison' : 'Click to add to the comparison' }, c.name);
      b.addEventListener('click', () => {
        if (on) { if (chosen.length <= MIN) { Toast.show(`Compare needs at least ${MIN} options.`, 'warn'); return; } select(chosen.filter((k) => k !== c.key)); }
        else { if (chosen.length >= MAX) { Toast.show(`Compare shows at most ${MAX} options.`, 'warn'); return; } select([...chosen, c.key]); }
      });
      chips.append(b);
    }
    bar.append(h('span', { class: 'label' }, 'Compare'), chips, h('button', { class: 'btn outline sm', type: 'button', onclick: () => exit() }, 'Close'));
  }

  function renderTable() {
    const t = $('cmpTable');
    const head = h('tr', null, h('th', { title: RULE }, 'Metric'), entries.map((e) => h('th', { title: e.name }, e.name)));
    const body = ROWS.map((row) => {
      const vals = entries.map((e) => row.get(e));
      const nums = vals.filter((v) => typeof v === 'number' && isFinite(v));
      const best = row.higher && nums.length ? Math.max(...nums) : null;
      const allSame = nums.length > 0 && nums.every((v) => Math.abs(v - nums[0]) < 1e-9);
      return h('tr', null,
        h('td', { title: row.higher ? RULE : null }, row.label),
        vals.map((v) => {
          const isBest = best !== null && !allSame && typeof v === 'number' && Math.abs(v - best) < 1e-9;
          return h('td', { class: isBest ? 'best' : null }, v == null ? '—' : row.fmt(v));
        }));
    });
    t.replaceChildren(h('table', { class: 'cmp' }, h('thead', null, head), h('tbody', null, body)));
  }

  function positionLabels() {
    const host = $('cmpLabels');
    host.textContent = '';
    if (!active) return;
    const cells = Render.cells();
    entries.forEach((e, i) => {
      const c = cells[i];
      if (!c) return;
      host.append(h('div', { class: 'cmp-label', style: `left:${Math.round(c.x + 8)}px;top:${Math.round(c.y + 8)}px;max-width:${Math.max(60, Math.round(c.w - 16))}px` }, e.name));
    });
  }

  const reserve = () => {
    const bar = $('cmpBar'), table = $('cmpTable');
    return { top: bar.offsetTop + bar.offsetHeight + 6, bottom: table.offsetHeight };
  };
  function layoutChanged() {
    $('viewport').style.setProperty('--cmp-table-h', `${$('cmpTable').offsetHeight}px`);
    Render.refreshInsets(false);
    Render.relayout();
    positionLabels();
  }

  function apply(wasActive = false) {
    version++;
    buildEntries();
    renderBar(candidates());
    renderTable();
    Render.enterCompare(entries.map((e) => ({ name: e.name, state: e.state, d: e.d, uid: e.uid })), reserve, { keepView: wasActive });
    layoutChanged();
    markComparing(true);
  }
  /** The Option button shows a highlight while comparing (the Compare item itself lives in the Option menu). */
  function markComparing(on) {
    const b = $('btnOption');
    if (!b) return;
    b.classList.toggle('is-on', on);
    b.dataset.comparing = on ? 'true' : 'false';
    b.title = on ? 'Comparing options. Open the menu to exit.' : 'Option: name, presets, save, compare';
  }
  function select(keys) {
    chosen = keys.slice(0, MAX);
    apply(true);
  }

  /** Start comparing. keys: option ids (or '__current'); default = the design on screen plus the newest saved one. */
  function enter(keys) {
    const cands = candidates();
    if (cands.length < MIN) {
      Toast.show('Compare needs at least 2 options. Save this design, use Duplicate, change the copy, then try again.', 'warn', 6000);
      return false;
    }
    chosen = (keys && keys.length ? keys : cands.slice(0, 2).map((c) => c.key)).filter((k) => cands.some((c) => c.key === k)).slice(0, MAX);
    if (chosen.length < MIN) chosen = cands.slice(0, 2).map((c) => c.key);
    active = true;
    $('compare').hidden = false;
    $('viewport').dataset.compare = 'true';
    if (!ro) { ro = new ResizeObserver(() => { if (active) layoutChanged(); }); ro.observe($('cmpTable')); ro.observe($('cmpBar')); Render.onResize(() => { if (active) positionLabels(); }); }
    apply();
    return true;
  }
  function exit() {
    if (!active) return;
    active = false; entries = []; chosen = [];
    clearTimeout(refreshTimer);
    Render.exitCompare();
    $('compare').hidden = true;
    $('viewport').dataset.compare = 'false';
    $('viewport').style.removeProperty('--cmp-table-h');
    $('cmpLabels').textContent = '';
    markComparing(false);
  }
  function toggle() { if (active) exit(); else enter(); }

  /** While comparing, edits to the design on screen refresh its column and its view. */
  function init() {
    Store.subscribe((s, info) => {
      if (!active || !chosen.includes(CURRENT) || (info && info.live)) return;
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(() => { if (active) apply(true); }, 200);
    });
  }

  return { toggle, enter, exit, init, names: () => entries.map((e) => e.name), isActive: () => active, chosen: () => chosen.slice(), table: () => $('cmpTable').innerText };
})();

/* ==========================================================================
   TESTS
   Calculation tests. Run by adding ?test to the address. They cover the
   shell helpers, every hand-calculated case in src/tower/testcases.js
   (through the integrated pipeline), every preset, and the save / export /
   import round trip. The result toast appears in ?test mode only.
   ========================================================================== */
/* ---- src/tower/testcases.js ---- */
const TestCasesMod = (() => {
// Hand-calculated test cases for the tower massing tool (plan section 12, phase 6).
// Every expected value below was worked out by hand. The arithmetic is in each comment.
//
// Conventions (plan sections 2, 3 and 5):
//  - Floor numbers start at 1. Within a segment, t = i / (n - 1): 0 at the bottom floor, 1 at the top.
//  - A setback with floor F applies to floor F and to every floor above it.
//  - GFA = sum of all plate areas, mechanical floors included. A crown adds no floor area.
//  - Total height = top of the highest floor + crown height.
//  - Site is the default 250 x 200 ft (50,000 sf). Setbacks are the default 10 ft. Every plate in these
//    cases fits inside the 230 x 180 allowed footprint, so the envelope never changes GFA.
//  - The base crown is flat with height 0, so height = top of the highest floor. Only TC-08 uses a crown height.
//    (The default state has a flat crown of 20 ft. It is set to 0 here so each height is easy to check by hand.)
//  - tolerancePct 0.01 is used for every case. All values are exact in binary floating point.
//  - expect has only gfa, floors, height and tolerancePct, per the module contract. FAR and site coverage
//    are checked through gfa: FAR = gfa / 50,000 and coverage = floor 1 area / 50,000 (noted in the comments).

const { PROGRAM_DEFAULTS } = PresetsMod;

const copyPrograms = () =>
  Object.fromEntries(Object.entries(PROGRAM_DEFAULTS).map(([k, v]) => [k, { ...v }]));

const rect = (w, d) => ({ type: 'rect', w, d, radius: 0, points: [] });

// One tower segment. Defaults are the default-state segment: 10 floors, 10 ft, 100 x 100, no transforms.
const seg = (over = {}) => ({
  floors: 10,
  ftf: 10,
  program: 'residential',
  shape: rect(100, 100),
  offset: { x: 0, y: 0 },
  rotation: 0,
  taper: { x: 0, y: 0, curve: 'linear' },
  twist: { deg: 0, start: 0, end: 1, curve: 'linear' },
  lean: { x: 0, y: 0 },
  ...over,
});

// Podium off by default. podium(...) turns it on with the given overrides.
const podium = (over = {}) => ({
  on: true,
  floors: 4,
  groundFtf: 18,
  ftf: 14,
  shape: rect(220, 170),
  offset: { x: 0, y: 0 },
  program: 'retail',
  upperProgram: 'amenity',
  ...over,
});

// Full default-state structure (plan section 2). Only the patch changes per case.
const baseState = () => ({
  schema: 1,
  name: 'Test',
  site: {
    shape: 'rect',
    width: 250,
    depth: 200,
    points: [],
    setbacks: { front: 10, back: 10, left: 10, right: 10 },
    heightLimit: 400,
    stepback: { on: false, aboveHeight: 85, distance: 15 },
  },
  context: { show: true, blocks: [{ x: 0, y: -180, w: 200, d: 120, h: 60 }] },
  podium: podium({ on: false }),
  segments: [seg()],
  setbacks: [],
  mechanical: [],
  carves: [],
  cuts: [],
  crown: { type: 'flat', height: 0, steps: 3, slopeSide: 'front' },
  core: { mode: 'percent', percent: 20, w: 40, d: 30 },
  programs: copyPrograms(),
  targets: { gfa: 0, far: 0 },
  view: {
    style: 'model',
    colorBy: 'zone',
    floorLines: true,
    shadows: true,
    sun: { azimuth: 135, altitude: 40 },
    grid: true,
    figure: true,
  },
});

const makeState = (name, patch) => ({ ...baseState(), name, ...patch });

const ALL_SIDES = ['front', 'back', 'left', 'right'];

const TEST_CASES = [
  {
    id: 'tc-01-box-default',
    description: 'Default 100 x 100 box, 10 floors at 10 ft. GFA, height, FAR 2.00 on the 50,000 sf site.',
    // GFA = 100 x 100 x 10 = 100,000 sf. Height = 10 x 10 = 100 ft. FAR = 100,000 / 50,000 = 2.00.
    state: makeState('TC-01', { segments: [seg({ floors: 10 })] }),
    expect: { gfa: 100000, floors: 10, height: 100, tolerancePct: 0.01 },
  },

  {
    id: 'tc-02-box-60x40-25f-ftf13.5',
    description: 'Box 60 x 40, 25 floors at 13.5 ft. Different plate size, floor count and floor height.',
    // GFA = 60 x 40 x 25 = 2,400 x 25 = 60,000 sf. Height = 25 x 13.5 = 337.5 ft.
    state: makeState('TC-02', { segments: [seg({ floors: 25, ftf: 13.5, shape: rect(60, 40) })] }),

  {
    id: 'tc-03-single-floor-coverage',
    description: 'Single 180 x 90 floor at 10 ft. GFA equals the floor 1 area, so site coverage is checked here.',
    // GFA = 180 x 90 = 16,200 sf. Coverage = 16,200 / 50,000 = 32.4%. Height = 1 x 10 = 10 ft.
    state: makeState('TC-03', { segments: [seg({ floors: 1, shape: rect(180, 90) })] }),
    expect: { gfa: 16200, floors: 1, height: 10, tolerancePct: 0.01 },
  },

  {
    id: 'tc-04-far-120x80-12f',
    description: 'Box 120 x 80, 12 floors at 10 ft. FAR check: 115,200 / 50,000 = 2.304.',
    // Plate = 120 x 80 = 9,600 sf. GFA = 9,600 x 12 = 115,200 sf. FAR = 115,200 / 50,000 = 2.304.
    // Height = 12 x 10 = 120 ft.
    state: makeState('TC-04', { segments: [seg({ floors: 12, shape: rect(120, 80) })] }),
    expect: { gfa: 115200, floors: 12, height: 120, tolerancePct: 0.01 },
  },

  {
    id: 'tc-05-podium-tower-gfa',
    description: 'Four-floor podium (220 x 170, ground 18 ft, upper 15 ft) plus a 30-floor 110 x 80 tower at 10 ft.',

    // GFA = 149,600 + 264,000 = 413,600 sf. Floors = 4 + 30 = 34.

    state: makeState('TC-05', {

    id: 'tc-06-podium-ground-ftf',
    description: 'Two-floor podium (100 x 100, ground 18 ft, floor 2 at 15 ft) plus a 5-floor 80 x 80 tower at 10 ft.',
    // Podium GFA = 100 x 100 x 2 = 20,000 sf. Tower GFA = 80 x 80 x 5 = 6,400 x 5 = 32,000 sf.
    // GFA = 20,000 + 32,000 = 52,000 sf. Floors = 2 + 5 = 7.
    // Height = 18 (ground) + 15 (floor 2) + 5 x 10 = 33 + 50 = 83 ft.
    state: makeState('TC-06', {

  {

    state: makeState('TC-07', {

  },

  {
    id: 'tc-08-screen-crown-height',
    description: 'Box 100 x 100, 10 floors at 10 ft, with a 20 ft screen crown. The crown adds height, not area.',

    state: makeState('TC-08', {
      segments: [seg({ floors: 10 })],

  },

  {
    id: 'tc-09-setback-all-sides-floor6',
    description: 'Box 100 x 100, 10 floors. All-sides 10 ft setback from floor 6 gives an inner 80 x 80 square above floor 5.',
    // Floors 1-5: 100 x 100 = 10,000 sf each, total 50,000 sf.
    // Floors 6-10: (100 - 2 x 10) = 80 square = 6,400 sf each, total 32,000 sf.
    // GFA = 50,000 + 32,000 = 82,000 sf. Height = 100 ft.
    state: makeState('TC-09', {
      segments: [seg({ floors: 10 })],
      setbacks: [{ floor: 6, distance: 10, sides: ALL_SIDES }],
    }),
    expect: { gfa: 82000, floors: 10, height: 100, tolerancePct: 0.01 },

  {

    // Plate = w x (d - s) = 100 x (100 - 10) = 100 x 90 = 9,000 sf.
    // GFA = 9,000 x 10 = 90,000 sf. Height = 100 ft.
    state: makeState('TC-10', {
      segments: [seg({ floors: 10 })],
      setbacks: [{ floor: 1, distance: 10, sides: ['front'] }],
    }),
    expect: { gfa: 90000, floors: 10, height: 100, tolerancePct: 0.01 },
  },

  {
    id: 'tc-11-linear-taper',
    description: 'Three floors of a 90 x 90 plate, tapering -10% in X and Y from bottom to top (linear).',
    // Scale = 1 + (-10/100) x t. t = 0, 0.5, 1 for floors 1, 2, 3, so scales are 1.00, 0.95, 0.90.
    // Floor 1: 90 x 90 = 8,100 sf.
    // Floor 2: (90 x 0.95) x (90 x 0.95) = 85.5 x 85.5 = 7,310.25 sf.
    // Floor 3: (90 x 0.90) x (90 x 0.90) = 81 x 81 = 6,561 sf.
    // GFA = 8,100 + 7,310.25 + 6,561 = 21,971.25 sf. Height = 3 x 10 = 30 ft.
    state: makeState('TC-11', {

  {
    id: 'tc-12-twist-keeps-gfa',

    // Each plate is a rotated 100 x 100 square. Area = 100 x 100 = 10,000 sf per floor.
    // GFA = 10,000 x 10 = 100,000 sf. Height = 100 ft.
    state: makeState('TC-12', {
      segments: [seg({ floors: 10, twist: { deg: 45, start: 0, end: 1, curve: 'linear' } })],

    // GFA = 10,000 x 10 = 100,000 sf. Height = 100 ft.
    state: makeState('TC-13', {
      segments: [seg({ floors: 10, offset: { x: 20, y: -10 }, lean: { x: 30, y: 0 } })],

  },

  {
    id: 'tc-14-two-segments',
    description: 'Two stacked segments: 4 floors of 100 x 100 at 10 ft, then 6 floors of 60 x 60 at 13.5 ft.',
    // Segment 1 GFA = 100 x 100 x 4 = 40,000 sf. Segment 2 GFA = 60 x 60 x 6 = 3,600 x 6 = 21,600 sf.
    // GFA = 40,000 + 21,600 = 61,600 sf. Floors = 4 + 6 = 10.
    // Height = 4 x 10 + 6 x 13.5 = 40 + 81 = 121 ft.
    state: makeState('TC-14', {
      segments: [
        seg({ floors: 4, ftf: 10, shape: rect(100, 100) }),
        seg({ floors: 6, ftf: 13.5, shape: rect(60, 60) }),
      ],
    }),

  {
    id: 'tc-15-u-podium-gfa-floors',
    description: 'U-shaped multifamily on podium (the U preset): 260 x 220 site, 6-floor podium, then 1 amenity + 16 residential floors on a 200 x 140 U with 50 ft arms.',
    // Podium plate = 240 x 200 = 48,000 sf. Podium GFA = 48,000 x 6 = 288,000 sf.
    // U plate = w x d - (w - 2a) x (d - a) = 200 x 140 - (200 - 100) x (140 - 50) = 28,000 - 9,000 = 19,000 sf.
    // Tower = 1 + 16 = 17 floors, all on the U plate. Tower GFA = 19,000 x 17 = 323,000 sf.
    // GFA = 288,000 + 323,000 = 611,000 sf. Floors = 6 + 17 = 23.
    state: makeState('TC-15', {
      site: { ...baseState().site, width: 260, depth: 220, heightLimit: 0 },
      podium: podium({ floors: 6, groundFtf: 18, ftf: 10.5, shape: rect(240, 200), program: 'retail', upperProgram: 'parking' }),
      segments: [
        seg({ floors: 1, ftf: 15, program: 'amenity', shape: { type: 'U', w: 200, d: 140, radius: 0, arm: 50, points: [] } }),
        seg({ floors: 16, ftf: 10, shape: { type: 'U', w: 200, d: 140, radius: 0, arm: 50, points: [] } }),
      ],

    }),
    expect: { gfa: 611000, floors: 23, tolerancePct: 0.01 },
  },
];

return { TEST_CASES };
})();


async function runTests() {
  const results = [];
  const eq = (a, b) => (JSON.stringify(a) === JSON.stringify(b) ? true : `got ${JSON.stringify(a)}, expected ${JSON.stringify(b)}`);
  const near = (a, b, tol = 1e-9) => (Math.abs(a - b) <= tol ? true : `got ${a}, expected ${b}`);
  const t = async (name, fn) => {
    let r;
    try { r = await fn(); } catch (e) { r = `threw ${e && e.message}`; }
    results.push({ name, ok: r === true, detail: r === true ? '' : String(r) });
  };

  /* ---- shell helpers ---- */
  await t('formatFeetInches 312.5', () => eq(Units.formatFeetInches(312.5), `312'-6"`));
  await t('formatFeetInches 0', () => eq(Units.formatFeetInches(0), `0'-0"`));
  await t('formatFeetInches rounds up to next foot', () => eq(Units.formatFeetInches(9.999), `10'-0"`));
  await t('formatArea 100000', () => eq(Units.formatArea(100000), '100,000 sf'));
  await t('parseLength 10\'-6"', () => near(Units.parseLength(`10'-6"`), 10.5));
  await t('parseLength 10.5', () => near(Units.parseLength('10.5'), 10.5));
  await t("parseLength 10'", () => near(Units.parseLength("10'"), 10));
  await t('parseLength 10 ft 6 in', () => near(Units.parseLength('10 ft 6 in'), 10.5));
  await t('parseLength 6"', () => near(Units.parseLength('6"'), 0.5));
  await t('parseLength 10-6', () => near(Units.parseLength('10-6'), 10.5));
  await t('parseLength bad input', () => eq(isNaN(Units.parseLength('abc')), true));
  await t('ringArea square', () => near(Geo.ringArea(siteRect(100, 100)), 10000));
  await t('default GFA', () => near(computeDerived(defaultState()).metrics.gfa, 100000));
  await t('default floor list', () => { const f = Geo.buildFloorList(defaultState()); return eq([f.length, f[0].z, f[9].z, f[9].t], [10, 0, 90, 1]); });
  await t('planToWorld north is -z', () => eq(planToWorld(3, 4, 5), [3, 5, -4]));
  await t('floor cap', () => { const s = defaultState(); s.segments[0].floors = 1000; return eq(Geo.buildPlates(s).plates.length, CONFIG.limits.maxFloors); });

  /* ---- integration decisions ---- */
  await t('unitFactor is a fraction or null in every program', () => {
    const bad = Object.entries(defaultState().programs).filter(([, p]) => !(p.unitFactor === null || (p.unitFactor > 0 && p.unitFactor <= 1)));
    return bad.length === 0 || `bad: ${bad.map(([k]) => k)}`;
  });
  await t('flat crown adds 0 height; stepped adds its height', () => {
    const s = defaultState(); s.crown = { type: 'flat', height: 20, steps: 3, slopeSide: 'front' };
    const flat = computeDerived(s).metrics.totalHeight;
    s.crown.type = 'stepped';
    return eq([flat, computeDerived(s).metrics.totalHeight], [100, 120]);
  });
  await t('floor count = podium + tower + mechanical', () => {
    const s = defaultState(); s.podium.on = true; s.podium.floors = 2; s.mechanical = [{ afterFloor: 5, ftf: 16 }];
    return eq(computeDerived(s).metrics.floorCount, 13);
  });

  });
  await t('the panel text for every built-in prompt matches getPromptText', () => {
    for (const p of PromptsMod.PROMPTS) { const x = Prompts.promptText(p.id); if (!x || x.includes('[') || x.includes('{{')) return `${p.id}: ${String(x).slice(0, 80)}`; }
    return eq(Prompts.promptText('no-such-prompt'), null);
  });
  await t('the form phrase is non-empty for every preset', () => {
    for (const st of presetStates) { const f = Prompts.formPhrase(st); if (!/^an? .+ tower with .+/.test(f)) return `${st.name}: "${f}"`; }

  });
  await t('form phrase rules (shape, setbacks, twist, taper, sky garden, crown)', () => {

    out.push(Prompts.formPhrase(s));

    const fresh = StorageMod.createStorage({ key: 'k2', schema: 1, storage: memory() });

  await t('an export with no prompts has no "prompts" key (older files stay the same)', async () => {

  await t('AI-ready filename', () => eq(ShotMod.screenshotFilename('Option A-ai-ready', new Date(2026, 9, 20)), 'option-a-ai-ready-2026-10-20.png'));

  /* ---- screenshot ---- */
  if (Render.ready()) {
    await t('AI-ready capture returns a PNG and puts the scene back exactly', async () => {
      const before = JSON.stringify(Render.sceneFlags()), style = Store.get('view.style');
      const blob = await Shots.aiReady({ deliver: false, scale: 1 });

    });

      return (blob.type === 'image/png' && blob.size > 2000) || `type ${blob.type} size ${blob.size}`;
    });
  }

  const failed = results.filter((r) => !r.ok);
  console.log(`[tests] ${results.length - failed.length}/${results.length} passed`, failed.length ? JSON.stringify(failed) : '');
  window.__towerTestResults = { total: results.length, passed: results.length - failed.length, failed, results };
  return window.__towerTestResults;
}

   Panel tabs, program colors and legend, snap state, metrics card, the
   Option and Export menus, and the hooks for the selection card (openItem,
   setProgramForItems). Runs after the calculation tests in 12_tests.js
