    const wrap = h('div', { class: 'ai-editor' });
    const title = h('input', { type: 'text', id: 'aiEditTitle', maxlength: '60', value: e.title, autocomplete: 'off', spellcheck: 'false', 'aria-label': 'Prompt title' });
    title.addEventListener('input', () => { e.title = title.value; updatePreview(); });
    const tpl = h('textarea', { id: 'aiEditTemplate', rows: '8', 'aria-label': 'Prompt text', spellcheck: 'true' });
    tpl.value = e.template;
    tpl.addEventListener('input', () => { e.template = tpl.value; updatePreview(); });
    wrap.append(
      h('div', { class: 'label' }, e.id ? 'Edit prompt' : 'New prompt'),
      h('label', { class: 'ai-lab', for: 'aiEditTitle' }, 'Title'), title,
      h('label', { class: 'ai-lab', for: 'aiEditTemplate' }, 'Prompt text'), tpl,
      h('p', { class: 'points-note', id: 'aiTokenHelp' }, TOKEN_HELP),
      h('div', { class: 'label' }, 'Menus to show'),
    );
    const uses = h('div', { class: 'ai-uses', role: 'group', 'aria-label': 'Menus to show' });
    for (const k of FIELD_KEYS) {
      const cb = h('input', { type: 'checkbox', id: `aiUse-${k}` });
      cb.checked = e.uses.includes(k);
      cb.addEventListener('change', () => { e.uses = FIELD_KEYS.filter((x) => (x === k ? cb.checked : e.uses.includes(x))); refreshFields(); updatePreview(); });
      uses.append(h('label', { class: 'ai-check', for: `aiUse-${k}` }, cb, h('span', null, PROMPT_FIELDS[k].label)));
    }
    wrap.append(uses);
    if (ui.error) wrap.append(h('p', { class: 'points-note bad', role: 'alert' }, ui.error));
    wrap.append(h('div', { class: 'ai-actions' },
      h('button', { class: 'btn outline sm', type: 'button', id: 'aiEditCancel', onclick: cancelEditing }, 'Cancel'),
      h('button', { class: 'btn solid sm', type: 'button', id: 'aiEditSave', onclick: saveEditing }, 'Save prompt')));
    return wrap;
  }

  function detailEl() {
    const wrap = h('div', { class: 'ai-detail' });
    if (ui.editing) {
      const host = h('div', { class: 'ai-fields-host' });
      const refreshFields = () => { host.textContent = ''; host.append(fieldsEl(activePrompt(), ui.editing.uses, null)); };
      wrap.append(editorEl(refreshFields), host, autoEl(), previewEl());
      refreshFields();
      return wrap;
    }
    const p = currentPrompt();
    if (!p) { wrap.append(h('p', { class: 'help' }, 'Select a prompt to see its fields.')); ui.preview = null; ui.chips = null; return wrap; }
    const custom = p.group === 'custom';
    const head = h('div', { class: 'ai-dhead' }, h('div', { class: 'ai-dtitle' }, p.title));
    const desc = p.description ? h('p', { class: 'ai-ddesc', id: 'aiDesc' }, p.description) : null;
    const acts = h('div', { class: 'ai-dacts' });
    if (custom) {
      acts.append(
        h('button', { class: 'btn outline sm', type: 'button', id: 'aiEdit', onclick: () => startEdit(p) }, 'Edit'),
        h('button', { class: 'btn outline sm danger-text', type: 'button', id: 'aiDelete', onclick: () => removePrompt(p) }, 'Delete'));
    } else {
      acts.append(h('button', { class: 'btn outline sm', type: 'button', id: 'aiDuplicate', onclick: () => duplicateToEdit(p) }, 'Duplicate to edit'));
    }
    head.append(acts);
    wrap.append(head);
    if (desc) wrap.append(desc);
    const uses = (p.uses || []).filter((k) => PROMPT_FIELDS[k]);
    if (uses.length) wrap.append(h('div', { class: 'label' }, 'Choose'), fieldsEl(p, uses, null));
    wrap.append(autoEl(), previewEl());
    return wrap;
  }

  function render() {
    if (!ui.el) return;
    const keepScroll = ui.body.scrollTop;
    ui.body.textContent = '';
    ui.body.append(tabsEl(), listEl(), detailEl());
    updateChips();
    updatePreview();
    syncSteps();
    ui.body.scrollTop = keepScroll;
    if (ui.editing && ui.editing.focus) {
      const f = ui.editing.focus; ui.editing.focus = null;
      const el = document.getElementById(f === 'title' ? 'aiEditTitle' : 'aiEditTemplate');
      if (el && ui.open) { try { el.focus({ preventScroll: true }); if (f === 'title') el.select(); } catch (e) { /* ignore */ } }
    }
  }

  /* ---- open / close ------------------------------------------------------------------------------ */
  function open() {
    if (!ui.el) return false;
    if (ui.open) return true;
    Pop.close();
    ui.open = true;
    ui.restoreFocus = document.activeElement;
    render();
    ui.back.hidden = false;
    ui.el.setAttribute('data-open', 'true');
    ui.el.removeAttribute('aria-hidden');
    const btn = document.getElementById('btnAiPrompts');
    if (btn) { btn.setAttribute('aria-expanded', 'true'); btn.classList.add('is-on'); }
    try { ui.el.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    return true;
  }
  function close() {
    if (!ui.open) return false;
    ui.open = false;
    ui.back.hidden = true;
    ui.el.setAttribute('data-open', 'false');
    ui.el.setAttribute('aria-hidden', 'true');
    ui.toasts.textContent = '';
    const btn = document.getElementById('btnAiPrompts');
    if (btn) { btn.setAttribute('aria-expanded', 'false'); btn.classList.remove('is-on'); }
    const f = ui.restoreFocus;
    ui.restoreFocus = null;
    if (f && f.focus && document.contains(f)) { try { f.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
    return true;
  }
  const toggle = () => (ui.open ? close() : open());

  function init() {
    build();
    window.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape' || !ui.open) return;
      if (document.querySelector('.modal-back')) return;      // a confirm dialog handles its own Escape
      e.preventDefault();
      close();
    });
    // The numbers in the chips and the preview follow the design while the panel is open.
    Store.subscribe(() => {
      if (!ui.open || ui.raf) return;
      ui.raf = requestAnimationFrame(() => { ui.raf = 0; updateChips(); updatePreview(); });
    });
    Options.onImport(({ promptsAdded }) => { if (promptsAdded && ui.el) render(); });
  }

  return {
    init, open, close, toggle, copyPrompt, saveImage, isOpen: () => ui.open,
    formPhrase, autoValues, podiumPhrase, currentAuto, textFor, findPrompt, allPrompts, valuesFor,
    // the same text the preview shows for a prompt id; `values` overrides auto or pick fields
    promptText: (id, values) => { const p = findPrompt(id); return p ? textFor(p, values) : null; },
    startNew, startEdit, saveEditing, cancelEditing, duplicateToEdit, removePrompt,
    editing: () => (ui.editing ? { ...ui.editing } : null),
    setEditing: (patch) => { if (ui.editing) { Object.assign(ui.editing, patch); render(); } },
    select, render,
  };
})();

/* ==========================================================================
   SHARED: storage
   src/shared/storage.js inlined unchanged (apart from the export keywords),
   plus `Options`, the tower tool's glue: save, duplicate, rename, delete, the
   option menu, export / import, autosave and restore.
   Custom AI prompts ride in the same blob (storage.listPrompts / savePrompt / removePrompt).
   Saved options live under localStorage key `towergen.options.v1`; the
   working copy autosaves into the "__current" slot after a 1 s pause.
   ========================================================================== */
const StorageMod = (() => {
/* ==========================================================================
   SHARED: storage
   Save, load, export and import of design "options" in localStorage.

   One localStorage key holds:
     { schema, options: [{ id, name, createdAt, updatedAt, state }], current }
   where `current` is the autosave slot: { state, updatedAt } (slot "__current").
   An optional `prompts: [{ id, title, template, ... }]` list (custom AI prompts) rides in the same blob; it is
   omitted while empty, travels in export / import, and import renames title collisions "Title (2)".

   Rules
   - Every storage access is inside try/catch. On any failure onNotice(message)
     is called ONCE (per storage instance) and the data stays in memory, so the
     tool keeps working for the rest of the session.
   - `migrate(state, fromSchema)` runs whenever a state with state.schema <
     `schema` is loaded or imported. It must return the migrated state.
   - Pure ES module. No DOM access except export download / visibility flush,
     both guarded.
   ========================================================================== */

const AUTOSAVE_MS = 1000;
const MAX_IMPORT_BYTES = 20 * 1024 * 1024;

/* ---------- small helpers ---------- */

function clone(v) {
  return v === undefined ? undefined : JSON.parse(JSON.stringify(v));
}

function isObj(v) {
  return v !== null && typeof v === "object" && !Array.isArray(v);
}

function newId() {
  try {
    if (globalThis.crypto && typeof globalThis.crypto.randomUUID === "function") return globalThis.crypto.randomUUID();
  } catch (e) { /* fall through */ }
  return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

function pad2(n) { return String(n).padStart(2, "0"); }

/** `towergen-options-YYYY-MM-DD.json` (local date). */
function exportFilename(date = new Date(), prefix = "towergen-options") {
  const d = date instanceof Date ? date : new Date(date);
  return `${prefix}-${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}.json`;
}

/** "Name" → "Name (2)", "Name (3)" … first one not in `taken` (case-insensitive). */
function uniqueName(name, taken) {
  const lower = new Set([...taken].map((n) => String(n).trim().toLowerCase()));
  const base = String(name || "").trim() || "Untitled";
  if (!lower.has(base.toLowerCase())) return base;
  for (let n = 2; n < 100000; n++) {
    const candidate = `${base} (${n})`;
    if (!lower.has(candidate.toLowerCase())) return candidate;
  }
  return `${base} (${newId()})`;
}

/* ---------- factory ---------- */

/**
 * @param {object}   cfg
 * @param {string}   cfg.key       localStorage key, e.g. "towergen.options.v1"
 * @param {number}   cfg.schema    current state schema number
 * @param {Function} [cfg.migrate] (state, fromSchema) => state
 * @param {Function} [cfg.onNotice] (message) => void, called at most once
 * @param {number}   [cfg.debounceMs=1000]  autosave delay
 * @param {string}   [cfg.filePrefix="towergen-options"]  export filename prefix
 * @param {object}   [cfg.storage]  Storage-like object (tests); default window.localStorage
 */
function createStorage({
  key,
  schema,
  migrate,
  onNotice,
  debounceMs = AUTOSAVE_MS,
  filePrefix = "towergen-options",
  storage,
} = {}) {
  if (!key) throw new Error("createStorage: `key` is required");
  if (!Number.isFinite(schema)) throw new Error("createStorage: `schema` must be a number");

  let noticed = false;
  let persistent = true;     // false once any read/write failed
  let readOnly = false;      // data written by a newer app version: never overwrite
  let lastRaw = null;        // last string we know is in storage
  let data = { schema, options: [], current: null, prompts: [] };
  let timer = null;
  let pendingAutosave = null;

  function notice(message) {
    persistent = false;
    if (noticed) return;
    noticed = true;
    try { if (typeof onNotice === "function") onNotice(message); } catch (e) { /* ignore */ }
  }

  function backend() {
    // Accessing window.localStorage itself can throw (blocked site data).
    return storage || globalThis.localStorage;
  }

  /* ----- migration ----- */

  function migrateState(state, fromSchema) {
    if (!isObj(state)) return state;
    const from = Number.isFinite(state.schema) ? state.schema : fromSchema;
    if (!Number.isFinite(from) || from >= schema) {
      if (!Number.isFinite(state.schema)) state.schema = schema;
      return state;
    }
    let out = state;
    try {
      out = typeof migrate === "function" ? migrate(clone(state), from) : state;
      if (!isObj(out)) out = state;
    } catch (e) {
      notice("Some saved options are from an older version and could not be updated.");
      return state;
    }
    out.schema = schema;
    return out;
  }

  /* ----- parse / validate stored blob ----- */

  function normalizeRecord(r, fallbackSchema) {
    if (!isObj(r) || !isObj(r.state)) return null;
    const now = Date.now();
    const num = (v) => (Number.isFinite(v) ? v : now);
    return {
      id: typeof r.id === "string" && r.id ? r.id : newId(),
      name: typeof r.name === "string" && r.name.trim() ? r.name.trim() : "Untitled",
      createdAt: num(r.createdAt),
      updatedAt: num(r.updatedAt),
      state: migrateState(clone(r.state), fallbackSchema),
    };
  }

  /** A custom prompt record (any extra fields are kept), or null when it has no usable title and template. */
  function normalizePrompt(p) {
    if (!isObj(p) || typeof p.title !== "string" || !p.title.trim() || typeof p.template !== "string") return null;
    const now = Date.now();
    const num = (v) => (Number.isFinite(v) ? v : now);
    return {
      ...clone(p),
      id: typeof p.id === "string" && p.id ? p.id : newId(),
      title: p.title.trim(),
      group: "custom",
      template: p.template,
      uses: Array.isArray(p.uses) ? p.uses.filter((u) => typeof u === "string") : [],
      createdAt: num(p.createdAt),
      updatedAt: num(p.updatedAt),
    };
  }

  /** @returns {object|null} normalized data, or null when raw is unusable. */
  function parseBlob(raw) {
    let obj;
    try { obj = JSON.parse(raw); } catch (e) { return null; }
    if (!isObj(obj) || !Array.isArray(obj.options) || !Number.isFinite(obj.schema)) return null;
    const out = { schema, options: [], current: null, prompts: [], newer: obj.schema > schema };
    const seen = new Set();
    for (const r of obj.options) {
      const rec = normalizeRecord(r, obj.schema);
      if (!rec) continue;
      if (seen.has(rec.id)) rec.id = newId();
      seen.add(rec.id);
      out.options.push(rec);
    }
    if (Array.isArray(obj.prompts)) {
      const ids = new Set();
      for (const p of obj.prompts) {
        const rec = normalizePrompt(p);
        if (!rec) continue;
        if (ids.has(rec.id)) rec.id = newId();
        ids.add(rec.id);
        out.prompts.push(rec);
      }
    }
    if (isObj(obj.current) && isObj(obj.current.state)) {
      out.current = {
        state: migrateState(clone(obj.current.state), obj.schema),
        updatedAt: Number.isFinite(obj.current.updatedAt) ? obj.current.updatedAt : Date.now(),
      };
    }
    return out;
  }

  /** Read storage into memory. `initial` = first load (corrupt value is replaced). */
  function load(initial) {
    let raw;
    try {
      raw = backend().getItem(key);
    } catch (e) {
      notice("Saving is unavailable in this browser, so options will only be kept until you close this page.");
      return;
    }
    if (raw === lastRaw && !initial) return;       // nothing changed since we last looked
    if (raw === null || raw === undefined) {
      lastRaw = null;
      return;
    }
    const parsed = parseBlob(raw);
    if (!parsed) {
      lastRaw = raw;
      notice("Saved options could not be read and were reset. A backup copy of the old data was kept.");
      if (initial) {
        data = { schema, options: [], current: null, prompts: [] };
        try { backend().setItem(key + ".corrupt", raw); } catch (e) { /* ignore */ }
      }
      // Not initial: keep the good in-memory copy; the next write overwrites the bad value.
      return;
    }
    if (parsed.newer) {
      readOnly = true;
      notice("Saved options were made by a newer version of this tool. They can be viewed but changes will not be saved.");
    }
    delete parsed.newer;
    data = parsed;
    lastRaw = raw;
  }

  function persist() {
    if (readOnly) return false;
    let raw;
    try {
      const blob = { schema, options: data.options, current: data.current };
      if (data.prompts.length) blob.prompts = data.prompts;
      raw = JSON.stringify(blob);
    } catch (e) {
      notice("Options could not be saved.");
      return false;
    }
    try {
      backend().setItem(key, raw);
      lastRaw = raw;
      return true;
    } catch (e) {
      notice("Saving is unavailable in this browser (storage is blocked or full). Options will only be kept until you close this page.");
      return false;
    }
  }

  load(true);

  /* ----- records ----- */

  function find(id) { return data.options.find((o) => o.id === id); }
  function names(except) { return data.options.filter((o) => o !== except).map((o) => o.name); }
  function out(rec) { return rec ? clone(rec) : null; }
  function stamp(state) {
    const s = clone(state);
    if (isObj(s) && !Number.isFinite(s.schema)) s.schema = schema;
    return s;
  }

  const api = {
    /** All saved options, most recently updated first: [{id,name,createdAt,updatedAt,state}] (copies). */
    list() {
      load(false);
      return data.options.slice().sort((a, b) => b.updatedAt - a.updatedAt).map(out);
    },

    get(id) {
      load(false);
      return out(find(id));
    },

    /** Saves a new option; returns its id. Name is kept as given (not renamed). */
    save(state, name) {
      load(false);
      const now = Date.now();
      const rec = {
        id: newId(),
        name: String(name || "").trim() || "Untitled",
        createdAt: now,
        updatedAt: now,
        state: stamp(state),
      };
      data.options.push(rec);
      persist();
      return rec.id;
    },

    /** Replaces the state of an existing option (optionally renames). Returns true if found. */
    update(id, state, name) {
      load(false);
      const rec = find(id);
      if (!rec) return false;
      rec.state = stamp(state);
      if (typeof name === "string" && name.trim()) rec.name = name.trim();
      rec.updatedAt = Date.now();
      persist();
      return true;
    },

    rename(id, name) {
      load(false);
      const rec = find(id);
      if (!rec || !String(name || "").trim()) return false;
      rec.name = String(name).trim();
      rec.updatedAt = Date.now();
      persist();
      return true;
    },

    remove(id) {
      load(false);
      const i = data.options.findIndex((o) => o.id === id);
      if (i < 0) return false;
      data.options.splice(i, 1);
      persist();
      return true;
    },

    /** Copies an option; newName defaults to "Name (2)" style. Returns the new id or null. */
    duplicate(id, newName) {
      load(false);
      const src = find(id);
      if (!src) return null;
      const now = Date.now();
      const rec = {
        id: newId(),
        name: uniqueName(String(newName || "").trim() || src.name, names()),
        createdAt: now,
        updatedAt: now,
        state: clone(src.state),
      };
      data.options.push(rec);
      persist();
      return rec.id;
    },

    /** Custom prompts, oldest first (copies). */
    listPrompts() {
      load(false);
      return data.prompts.map(clone);
    },

    /** Adds a custom prompt, or replaces the one with the same id. Returns the saved copy, or null when it has no title / template. */
    savePrompt(prompt) {
      load(false);
      const old = isObj(prompt) ? data.prompts.find((p) => p.id === prompt.id) : null;
      const rec = normalizePrompt({ ...prompt, updatedAt: Date.now(), createdAt: old ? old.createdAt : Date.now() });
      if (!rec) return null;
      if (old) data.prompts[data.prompts.indexOf(old)] = rec; else data.prompts.push(rec);
      persist();
      return clone(rec);
    },

    removePrompt(id) {
      load(false);
      const i = data.prompts.findIndex((p) => p.id === id);
      if (i < 0) return false;
      data.prompts.splice(i, 1);
      persist();
      return true;
    },

    /** Debounced (1 s) save of the working state into the "__current" slot. */
    autosave(state) {
      try { pendingAutosave = stamp(state); } catch (e) { notice("Options could not be saved."); return; }
      if (timer !== null) clearTimeout(timer);
      timer = setTimeout(api.flush, debounceMs);
    },

    /** Writes any pending autosave immediately. */
    flush() {
      if (timer !== null) { clearTimeout(timer); timer = null; }
      if (pendingAutosave === null) return;
      load(false);
      data.current = { state: pendingAutosave, updatedAt: Date.now() };
      pendingAutosave = null;
      persist();
    },

    /** The autosaved working state (migrated copy), or null. A not-yet-flushed autosave counts. */
    loadAutosave() {
      if (pendingAutosave !== null) return clone(pendingAutosave);
      load(false);
      return data.current ? clone(data.current.state) : null;
    },

    /** All saved options (and custom prompts, when there are any) as an application/json Blob. */
    exportAll() {
      load(false);
      const payload = {
        schema,
        exportedAt: new Date().toISOString(),
        options: data.options.map(out),
      };
      if (data.prompts.length) payload.prompts = data.prompts.map(clone);
      return new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    },

    /** `towergen-options-YYYY-MM-DD.json` */
    exportFilename(date) { return exportFilename(date, filePrefix); },

    /** Browser only: triggers a download of exportAll(). */
    downloadExport() {
      const blob = api.exportAll();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = api.exportFilename();
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    },

    /**
     * Appends the options of an exportAll() file. Never replaces existing options.
     * Custom prompts in the file are appended too (a title already in use becomes "Title (2)").
     * Resolves {added, skipped, promptsAdded}; rejects with an Error whose message is shown to the user.
     */
    async importFile(file) {
      if (!file) throw new Error("No file was chosen.");
      if (typeof file.size === "number" && file.size > MAX_IMPORT_BYTES) {
        throw new Error("That file is too large to be an options file.");
      }
      let text;
      try {
        text = typeof file.text === "function" ? await file.text() : await readWithReader(file);
      } catch (e) {
        throw new Error("The file could not be read.");
      }
      let obj;
      try { obj = JSON.parse(text); } catch (e) {
        throw new Error("This file is not valid JSON, so it is not an options file.");
      }
      if (!isObj(obj) || !Array.isArray(obj.options)) {
        throw new Error("This file does not look like an exported options file (no options list found).");
      }
      if (!Number.isFinite(obj.schema)) {
        throw new Error("This file does not look like an exported options file (no schema number).");
      }
      if (obj.schema > schema) {
        throw new Error("This file was made by a newer version of the tool. Update the tool and try again.");
      }

      load(false);
      const taken = new Set(names());
      const incoming = [];
      let skipped = 0;
      for (const r of obj.options) {
        if (!isObj(r) || !isObj(r.state)) { skipped++; continue; }
        const rec = normalizeRecord({ ...r, id: undefined }, obj.schema);   // always a fresh id
        if (!rec) { skipped++; continue; }
        rec.name = uniqueName(rec.name, taken);
        taken.add(rec.name);
        incoming.push(rec);
      }
      const takenTitles = new Set(data.prompts.map((p) => p.title));
      const incomingPrompts = [];
      if (Array.isArray(obj.prompts)) {
        for (const p of obj.prompts) {
          const rec = normalizePrompt({ ...(isObj(p) ? p : {}), id: undefined });
          if (!rec) continue;
          rec.title = uniqueName(rec.title, takenTitles);
          takenTitles.add(rec.title);
          incomingPrompts.push(rec);
        }
      }
      if (incoming.length === 0 && incomingPrompts.length === 0 && obj.options.length > 0) {
        throw new Error("None of the options in this file could be used.");
      }
      data.options.push(...incoming);
      data.prompts.push(...incomingPrompts);
      if (incoming.length || incomingPrompts.length) persist();
      const res = { added: incoming.length, skipped };
      if (incomingPrompts.length) res.promptsAdded = incomingPrompts.length;
      return res;
    },

    /** True while saving to browser storage works (false after a failure; data is then memory-only). */
    isPersistent() { return persistent; },

    /** Stops timers and listeners (tests). Pending autosave is flushed first. */
    dispose() {
      api.flush();

        window.removeEventListener("pagehide", api.flush);

    }

/* ==========================================================================
   SHARED: screenshot
   src/shared/screenshot.js inlined unchanged (apart from the export keywords),
   plus `Shots`: the tower tool's button and the popover that chooses which
   overlay items appear. The choices are kept in state.view.shot.
   ========================================================================== */
const ShotMod = (() => {
/* ==========================================================================
   SHARED: screenshot
   Capture a three.js view at higher resolution, annotate it on a 2D canvas,
   and deliver the PNG (share sheet on iPad, download elsewhere).

   No dependency on three: the renderer is only used through its public API.
   Does not need preserveDrawingBuffer (the frame is copied in the same task
   it is rendered in).
   ========================================================================== */

const FONT_STACK = '-apple-system, "SF Pro Text", "Inter", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';

/** Total pixel budget. iOS Safari limits a canvas to 16,777,216 px (4096 x 4096). */
const DEFAULT_MAX_PIXELS = 16000000;

/* Duck-typed targets so we do not need THREE.Vector2 / Vector4. */
function vec2() { return { x: 0, y: 0, set(x, y) { this.x = x; this.y = y; return this; } }; }
function vec4() {
  return {
    x: 0, y: 0, z: 0, w: 0,
    set(x, y, z, w) { this.x = x; this.y = y; this.z = z; this.w = w; return this; },
    copy(v) { this.x = v.x; this.y = v.y; this.z = v.z; this.w = v.w; return this; },
  };
}

/** Largest scale <= requested that fits the GPU and canvas limits. */
function fitScale(renderer, baseW, baseH, scale, maxPixels) {
  let s = scale;
  let maxDim = Infinity;
  try {
    const gl = renderer.getContext();
    maxDim = Math.min(
      gl.getParameter(gl.MAX_RENDERBUFFER_SIZE) || Infinity,
      gl.getParameter(gl.MAX_TEXTURE_SIZE) || Infinity
    );
    const vp = gl.getParameter(gl.MAX_VIEWPORT_DIMS);
    if (vp) maxDim = Math.min(maxDim, vp[0], vp[1]);
  } catch (e) { /* ignore */ }
  maxDim = Math.min(maxDim, 16384);
  s = Math.min(s, maxDim / baseW, maxDim / baseH);
  const px = baseW * baseH;
  if (px * s * s > maxPixels) s = Math.sqrt(maxPixels / px);
  return Math.max(s, 1 / Math.max(baseW, baseH));     // never zero
}

/**
 * Renders the scene at `scale` x the renderer's current drawing-buffer size and
 * returns a PNG Blob with the overlay drawn on top.
 *
 * @param {object}   o
 * @param {object}   o.renderer  THREE.WebGLRenderer
 * @param {object}   o.scene
 * @param {object}   o.camera
 * @param {number}   [o.scale=2]
 * @param {object}   [o.overlay]  { title?, date?, metrics?: Array<[label,value]>, mark?: "CMRLM", theme?: "light"|"dark" }
 *                                 date: string | Date | true (today)
 * @param {Function} [o.render]  optional (renderer, scene, camera) => void replacing renderer.render
 *                               (for custom viewports); called at the capture size and again after restore
 * @param {number}   [o.maxPixels=16000000]  scale is reduced to stay within this budget and GPU limits
 * @returns {Promise<Blob>} image/png. blob.captureInfo = { width, height, scale, requestedScale }
 */
async function captureView({ renderer, scene, camera, scale = 2, overlay, render, maxPixels = DEFAULT_MAX_PIXELS } = {}) {
  if (!renderer || !scene || !camera) throw new Error("captureView needs renderer, scene and camera.");

  const canvas3d = renderer.domElement;
  const draw = typeof render === "function"
    ? () => render(renderer, scene, camera)
    : () => renderer.render(scene, camera);

  /* ---- remember everything we will change ---- */
  const size = renderer.getSize(vec2());
  const cssW = size.x, cssH = size.y;
  const pr = renderer.getPixelRatio();
  const baseW = canvas3d.width, baseH = canvas3d.height;        // current drawing-buffer size
  const viewport = renderer.getViewport(vec4());
  const scissor = renderer.getScissor(vec4());
  const scissorTest = renderer.getScissorTest();
  const aspect = camera.isPerspectiveCamera ? camera.aspect : null;

  const eff = fitScale(renderer, baseW, baseH, scale, maxPixels);
  const W = Math.max(1, Math.round(baseW * eff));
  const H = Math.max(1, Math.round(baseH * eff));

  const out = document.createElement("canvas");
  out.width = W;
  out.height = H;
  const ctx = out.getContext("2d");
  if (!ctx) throw new Error("Could not create a 2D canvas for the screenshot.");

  const setBuffer = (w, h, ratio) => {
    // pixel ratio 1 with an explicit size gives an exact W x H buffer; style is never touched
    if (typeof renderer.setDrawingBufferSize === "function") renderer.setDrawingBufferSize(w, h, ratio);
    else { renderer.setPixelRatio(ratio); renderer.setSize(w, h, false); }
  };

  try {
    setBuffer(W, H, 1);
    renderer.setScissorTest(false);
    renderer.setViewport(0, 0, W, H);
    if (aspect !== null) { camera.aspect = W / H; camera.updateProjectionMatrix(); }

    draw();
    // Copy NOW, in the same task as the render (works without preserveDrawingBuffer).
    ctx.drawImage(canvas3d, 0, 0, W, H);
  } finally {
    /* ---- restore everything, then repaint the live view ---- */
    setBuffer(cssW, cssH, pr);
    renderer.setViewport(viewport.x, viewport.y, viewport.z, viewport.w);
    renderer.setScissor(scissor.x, scissor.y, scissor.z, scissor.w);
    renderer.setScissorTest(scissorTest);
    if (aspect !== null) { camera.aspect = aspect; camera.updateProjectionMatrix(); }
    try { draw(); } catch (e) { /* the app's own loop will repaint */ }
  }

  /* ---- overlay, sized in "CSS pixels of the original view" so it matches the app's look ---- */
  if (overlay) drawOverlay(ctx, W, H, W / Math.max(1, cssW), overlay);

  const blob = await canvasToBlob(out);
  try { blob.captureInfo = { width: W, height: H, scale: eff, requestedScale: scale }; } catch (e) { /* ignore */ }
  return blob;
}

/* ---------- overlay ---------- */

function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function formatDate(d) {
  if (d === true) d = new Date();
  if (d instanceof Date) {
    try { return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }); }
    catch (e) { return d.toISOString().slice(0, 10); }
  }
  return String(d);
}

/** Draw text with manual letter spacing (canvas letterSpacing is not in every Safari). */
function spacedWidth(ctx, text, tracking) {
  let w = 0;
  for (const ch of text) w += ctx.measureText(ch).width + tracking;
  return w - tracking;
}
function drawSpaced(ctx, text, x, y, tracking) {
  let cx = x;
  for (const ch of text) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + tracking; }
}

function drawOverlay(ctx, W, H, u, overlay) {
  const dark = overlay.theme === "dark";
  const panel = dark ? "rgba(23, 27, 31, 0.86)" : "rgba(255, 255, 255, 0.88)";
  const edge = dark ? "rgba(255, 255, 255, 0.14)" : "rgba(16, 20, 26, 0.14)";
  const ink = dark ? "#e7eaee" : "#1b1f24";
  const ink2 = dark ? "#a5adb7" : "#4e5763";
  const m = 16 * u;           // outer margin
  const pad = 10 * u;         // panel padding
  const radius = 8 * u;

  ctx.save();
  ctx.textBaseline = "alphabetic";
  ctx.lineWidth = Math.max(1, u);

  const box = (x, y, w, h) => {
    roundRect(ctx, x, y, w, h, radius);
    ctx.fillStyle = panel; ctx.fill();
    ctx.strokeStyle = edge; ctx.stroke();
  };

  /* title + date, top-left */
  const title = overlay.title ? String(overlay.title) : "";
  const date = overlay.date ? formatDate(overlay.date) : "";
  if (title || date) {
    const tSize = 17 * u, dSize = 12 * u;
    ctx.font = `600 ${tSize}px ${FONT_STACK}`;
    const tw = title ? ctx.measureText(title).width : 0;
    ctx.font = `400 ${dSize}px ${FONT_STACK}`;
    const dw = date ? ctx.measureText(date).width : 0;
    const w = Math.max(tw, dw) + pad * 2;
    const h = pad * 2 + (title ? tSize : 0) + (title && date ? 5 * u : 0) + (date ? dSize : 0);
    box(m, m, w, h);
    let y = m + pad;
    if (title) {
      y += tSize * 0.82;
      ctx.font = `600 ${tSize}px ${FONT_STACK}`;
      ctx.fillStyle = ink; ctx.fillText(title, m + pad, y);
      y += tSize * 0.18 + 5 * u;
    }
    if (date) {
      y += dSize * 0.82;
      ctx.font = `400 ${dSize}px ${FONT_STACK}`;
      ctx.fillStyle = ink2; ctx.fillText(date, m + pad, y);
    }
  }

  /* metrics, bottom-left */
  const rows = Array.isArray(overlay.metrics) ? overlay.metrics.filter((r) => Array.isArray(r) && r.length >= 2) : [];
  if (rows.length) {
    const size = 12.5 * u, rowH = 19 * u, gap = 18 * u;
    ctx.font = `400 ${size}px ${FONT_STACK}`;
    let lw = 0;
    for (const [l] of rows) lw = Math.max(lw, ctx.measureText(String(l)).width);
    ctx.font = `600 ${size}px ${FONT_STACK}`;
    let vw = 0;
    for (const [, v] of rows) vw = Math.max(vw, ctx.measureText(String(v)).width);
    const w = pad * 2 + lw + gap + vw;
    const h = pad * 2 + rowH * rows.length - (rowH - size);
    const x = m, y = H - m - h;
    box(x, y, w, h);
    rows.forEach(([l, v], i) => {
      const by = y + pad + size * 0.9 + i * rowH;
      ctx.textAlign = "left";
      ctx.font = `400 ${size}px ${FONT_STACK}`;
      ctx.fillStyle = ink2; ctx.fillText(String(l), x + pad, by);
      ctx.textAlign = "right";
      ctx.font = `600 ${size}px ${FONT_STACK}`;
      ctx.fillStyle = ink; ctx.fillText(String(v), x + w - pad, by);
    });
    ctx.textAlign = "left";
  }

  /* mark, bottom-right */
  if (overlay.mark) {
    const text = String(overlay.mark).toUpperCase();
    const size = 11 * u, tracking = 3 * u, padX = 10 * u, padY = 7 * u;
    ctx.font = `600 ${size}px ${FONT_STACK}`;
    const tw = spacedWidth(ctx, text, tracking);
    const w = tw + padX * 2, h = size + padY * 2;
    const x = W - m - w, y = H - m - h;
    box(x, y, w, h);
    ctx.fillStyle = ink2;
    drawSpaced(ctx, text, x + padX, y + padY + size * 0.82, tracking);
  }

  ctx.restore();
}

/* ---------- output ---------- */

function canvasToBlob(canvas) {
  return new Promise((resolve, reject) => {
    const fallback = () => {
      try {
        const url = canvas.toDataURL("image/png");
        const bin = atob(url.split(",")[1]);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        resolve(new Blob([bytes], { type: "image/png" }));
      } catch (e) {
        reject(new Error("The screenshot could not be created (image too large for this device)."));
      }
    };
    try {
      canvas.toBlob((b) => (b ? resolve(b) : fallback()), "image/png");
    } catch (e) { fallback(); }
  });
}

function isTouchApple() {
  const ua = navigator.userAgent || "";
  if (/iPad|iPhone|iPod/.test(ua)) return true;
  // iPadOS reports a Mac user agent; it is the only "Mac" with a touch screen
  return /Mac/.test(navigator.platform || ua) && (navigator.maxTouchPoints || 0) > 1;
}

function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);   // revoking sooner can break iOS downloads
}

/**
 * iPad (touch Apple device): share sheet with the PNG file. Everything else, or
 * if sharing is unavailable/fails: download through a temporary <a download>.
 * A cancelled share sheet (AbortError) does nothing.
 *
 * @param {Blob}   blob
 * @param {string} filename
 * @param {object} [opts]  { share: "auto" | "always" | "never" }  "auto" = only on iPad/iPhone
 * @returns {Promise<"shared"|"cancelled"|"downloaded">}
 */
async function deliverImage(blob, filename, { share = "auto" } = {}) {
  const useShare = share === "always" || (share === "auto" && isTouchApple());
  if (useShare && typeof navigator.share === "function" && typeof navigator.canShare === "function") {
    try {
      const file = new File([blob], filename, { type: blob.type || "image/png" });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return "shared";
      }
    } catch (e) {
      if (e && e.name === "AbortError") return "cancelled";
      // NotAllowedError (user activation expired) or anything else: fall through to download
    }
  }
  download(blob, filename);
  return "downloaded";
}

/** `title-YYYY-MM-DD.png`, safe for file systems. */
function screenshotFilename(name = "tower", date = new Date()) {
  const p = (n) => String(n).padStart(2, "0");
  const slug = String(name).trim().replace(/[^\w\-]+/g, "-").replace(/^-+|-+$/g, "").toLowerCase() || "view";
  return `${slug}-${date.getFullYear()}-${p(date.getMonth() + 1)}-${p(date.getDate())}.png`;
}

return { DEFAULT_MAX_PIXELS, captureView, deliverImage, screenshotFilename };

const Shots = (() => {

      ['Height', Units.formatFeetInches(m.totalHeight)],
      ['Floors', Units.formatInt(m.floorCount)],
      ub.hasTotal ? [ub.label, Units.formatInt(ub.total)] : ['Site coverage', `${(m.siteCoverage * 100).toFixed(1)}%`],
      ['Efficiency', `${(m.efficiencyAvg * 100).toFixed(1)}%`],
    ];
  }

  function buildOverlay() {
    const state = Store.raw(), o = state.view.shot || {};
    const overlay = { theme: prefersDark() ? 'dark' : 'light' };
    const comparing = Render.comparing();
    if (o.title) overlay.title = comparing ? Compare.names().join('  |  ') : state.name;
    if (o.date) overlay.date = true;
    if (o.metrics && !comparing) overlay.metrics = keyMetrics(Derived.get());
    if (o.mark) overlay.mark = 'CMRLM';
    return overlay;
  }

  /** Renders the picture. With deliver = true it also downloads it (or opens the share sheet on an iPad). */
  async function capture({ deliver = false, scale = 2 } = {}) {
    const blob = await Render.capture(buildOverlay(), scale);
    if (deliver) {
      const name = Render.comparing() ? `${Store.get('name')}-compare` : Store.get('name');
      const result = await ShotMod.deliverImage(blob, ShotMod.screenshotFilename(name));
      if (result === 'downloaded') Toast.show('Image saved to your downloads.');
    }
    return blob;
  }
  async function take() {
    try { return await capture({ deliver: true }); } catch (e) { console.error(e); Toast.show(e && e.message ? e.message : 'The image could not be made.', 'bad', 6000); return null; }
  }

  /** The AI-ready picture: no overlay, grid, scale figure or wireframe; Model style; light plain sky. Filename `<option>-ai-ready-YYYY-MM-DD.png`. */
  async function aiReady({ deliver = true, scale = 2 } = {}) {
    const blob = await Render.captureClean(scale);
    if (deliver) {
      const result = await ShotMod.deliverImage(blob, ShotMod.screenshotFilename(`${Store.get('name')}-ai-ready`));
      if (result === 'downloaded') Toast.show('AI-ready image saved to your downloads.');
    }
    return blob;
  }
  async function takeAiReady() {
    try { return await aiReady({ deliver: true }); } catch (e) { console.error(e); Toast.show(e && e.message ? e.message : 'The image could not be made.', 'bad', 6000); return null; }
  }

  function openMenu(anchor) {
    const el = h('div', { role: 'group', 'aria-label': 'Image options' });
    el.append(h('div', { class: 'label pop-label' }, 'The image shows'));
    for (const [key, text] of SHOT_ITEMS) {
      const btn = h('button', { class: 'toggle-row', type: 'button', role: 'switch', 'aria-checked': String(!!Store.get(`view.shot.${key}`)), style: 'padding:0 8px' },
        h('span', null, text), h('span', { class: 'switch', 'aria-hidden': 'true' }));
      btn.addEventListener('click', () => {
        const next = !Store.get(`view.shot.${key}`);
        Store.set(`view.shot.${key}`, next, { live: false });
        btn.setAttribute('aria-checked', String(next));
      });
      el.append(btn);
    }
    el.append(h('div', { class: 'pop-sep' }));
    el.append(h('button', { class: 'pop-item', type: 'button', role: 'menuitem', id: 'btnAiReady', onclick: () => { Pop.close(); takeAiReady(); } },
      h('span', { class: 'grow' }, 'AI-ready image', h('small', null, 'Plain model, no overlay, grid or wireframe. For ChatGPT or Gemini.'))));
    el.append(h('div', { class: 'pop-actions' }, h('button', { class: 'btn solid', type: 'button', onclick: () => { Pop.close(); take(); } }, 'Save image')));
    Pop.open(anchor, el, { align: 'right' });
  }

  return { take, capture, aiReady, takeAiReady, openMenu, buildOverlay, keyMetrics };
})();

/* ==========================================================================
   COMPARE
   Choose 2 to 4 options. One renderer draws each option in its own part of
   the screen (setViewport / setScissor, see Render.enterCompare), one camera
   control moves them all, and a table under the views lists the metrics with
   the best value in each ranked row in bold.
   ========================================================================== */
const Compare = (() => {
  const CURRENT = '__current';
  const MIN = 2, MAX = 4;
  const $ = (id) => document.getElementById(id);
  let active = false, chosen = [], entries = [], version = 0, refreshTimer = null, ro = null;

  const RULE = 'Bold marks the best value in a row. Higher is better for GFA, FAR, units and keys, and efficiency. Parking spaces are counted apart and never added to units. Other rows are not ranked.';
  const totalUnits = (m) => { const ub = unitBreakdown(m); return ub.hasTotal ? ub.total : null; };      // residential units + hotel keys
  const parkingSpaces = (m) => { const ub = unitBreakdown(m); return ub.spaces.length ? ub.spaces.reduce((a, r) => a + r.count, 0) : null; };
  const ROWS = [
    { label: 'GFA', get: (e) => e.d.metrics.gfa, fmt: Units.formatArea, higher: true },
    { label: 'FAR', get: (e) => e.d.metrics.far, fmt: (v) => Units.formatRatio(v, 2), higher: true },
    { label: 'Units + keys (estimate)', get: (e) => totalUnits(e.d.metrics), fmt: Units.formatInt, higher: true },
    { label: 'Parking spaces (estimate)', get: (e) => parkingSpaces(e.d.metrics), fmt: Units.formatInt },
    { label: 'Efficiency (avg)', get: (e) => e.d.metrics.efficiencyAvg, fmt: (v) => `${(v * 100).toFixed(1)}%`, higher: true },
    { label: 'Floors', get: (e) => e.d.metrics.floorCount, fmt: Units.formatInt },
    { label: 'Total height', get: (e) => e.d.metrics.totalHeight, fmt: Units.formatFeetInches },
    { label: 'Site coverage', get: (e) => e.d.metrics.siteCoverage, fmt: (v) => `${(v * 100).toFixed(1)}%` },
    { label: 'Tower plate (avg)', get: (e) => e.d.metrics.plateAvg, fmt: Units.formatArea },
    { label: 'Net area', get: (e) => e.d.metrics.netArea, fmt: Units.formatArea },
    { label: 'Warnings', get: (e) => e.d.warnings.length, fmt: Units.formatInt },
  ];

  /** Everything that can be compared: the design on screen (if it differs from its saved copy) and the saved options. */
  function candidates() {
    const list = [];
    if (Options.syncDirty()) list.push({ key: CURRENT, name: `${Store.get('name')} (on screen)`, state: () => Store.snapshot() });
    for (const o of Options.list()) list.push({ key: o.id, name: o.name, state: () => o.state });
    return list;
  }

  function buildEntries() {
    const cands = candidates();
    entries = chosen.map((key) => cands.find((c) => c.key === key)).filter(Boolean).map((c) => {
      const state = fillDefaults(c.state());
      state.name = c.name;
      return { key: c.key, name: c.name, state, d: computeDerived(state), uid: `${c.key}#${version}` };
    });
  }

  function renderBar(cands) {
    const bar = $('cmpBar');
    bar.textContent = '';
    const chips = h('div', { class: 'chips', role: 'group', 'aria-label': 'Options to compare' });
    for (const c of cands) {
      const on = chosen.includes(c.key);
      const b = h('button', { class: 'chip', type: 'button', 'aria-pressed': String(on), 'data-key': c.key, title: on ? 'Click to remove from the comparison' : 'Click to add to the comparison' }, c.name);
      b.addEventListener('click', () => {
        if (on) { if (chosen.length <= MIN) { Toast.show(`Compare needs at least ${MIN} options.`, 'warn'); return; } select(chosen.filter((k) => k !== c.key)); }
        else { if (chosen.length >= MAX) { Toast.show(`Compare shows at most ${MAX} options.`, 'warn'); return; } select([...chosen, c.key]); }
      });
      chips.append(b);
    }
    bar.append(h('span', { class: 'label' }, 'Compare'), chips, h('button', { class: 'btn outline sm', type: 'button', onclick: () => exit() }, 'Close'));
  }

  function renderTable() {
    const t = $('cmpTable');
    const head = h('tr', null, h('th', { title: RULE }, 'Metric'), entries.map((e) => h('th', { title: e.name }, e.name)));
    const body = ROWS.map((row) => {
      const vals = entries.map((e) => row.get(e));
      const nums = vals.filter((v) => typeof v === 'number' && isFinite(v));
      const best = row.higher && nums.length ? Math.max(...nums) : null;
      const allSame = nums.length > 0 && nums.every((v) => Math.abs(v - nums[0]) < 1e-9);
      return h('tr', null,
        h('td', { title: row.higher ? RULE : null }, row.label),
        vals.map((v) => {
          const isBest = best !== null && !allSame && typeof v === 'number' && Math.abs(v - best) < 1e-9;
          return h('td', { class: isBest ? 'best' : null }, v == null ? '—' : row.fmt(v));
        }));
    });
    t.replaceChildren(h('table', { class: 'cmp' }, h('thead', null, head), h('tbody', null, body)));
  }

  function positionLabels() {
    const host = $('cmpLabels');
    host.textContent = '';
    if (!active) return;
    const cells = Render.cells();
    entries.forEach((e, i) => {
      const c = cells[i];
      if (!c) return;
      host.append(h('div', { class: 'cmp-label', style: `left:${Math.round(c.x + 8)}px;top:${Math.round(c.y + 8)}px;max-width:${Math.max(60, Math.round(c.w - 16))}px` }, e.name));
    });
  }

  const reserve = () => {
    const bar = $('cmpBar'), table = $('cmpTable');
    return { top: bar.offsetTop + bar.offsetHeight + 6, bottom: table.offsetHeight };
  };
  function layoutChanged() {
    $('viewport').style.setProperty('--cmp-table-h', `${$('cmpTable').offsetHeight}px`);
    Render.refreshInsets(false);
    Render.relayout();
    positionLabels();
  }

  function apply(wasActive = false) {
    version++;
    buildEntries();
    renderBar(candidates());
    renderTable();
    Render.enterCompare(entries.map((e) => ({ name: e.name, state: e.state, d: e.d, uid: e.uid })), reserve, { keepView: wasActive });
    layoutChanged();
    $('btnCompare').classList.add('is-on');
    $('btnCompare').setAttribute('aria-pressed', 'true');
  }
  function select(keys) {
    chosen = keys.slice(0, MAX);
    apply(true);
  }

  /** Start comparing. keys: option ids (or '__current'); default = the design on screen plus the newest saved one. */
  function enter(keys) {
    const cands = candidates();
    if (cands.length < MIN) {
      Toast.show('Compare needs at least 2 options. Save this design, use Duplicate, change the copy, then try again.', 'warn', 6000);
      return false;
    }
    chosen = (keys && keys.length ? keys : cands.slice(0, 2).map((c) => c.key)).filter((k) => cands.some((c) => c.key === k)).slice(0, MAX);
    if (chosen.length < MIN) chosen = cands.slice(0, 2).map((c) => c.key);
    active = true;
    $('compare').hidden = false;
    $('viewport').dataset.compare = 'true';
    if (!ro) { ro = new ResizeObserver(() => { if (active) layoutChanged(); }); ro.observe($('cmpTable')); ro.observe($('cmpBar')); Render.onResize(() => { if (active) positionLabels(); }); }
    apply();
    return true;
  }
  function exit() {
    if (!active) return;
    active = false; entries = []; chosen = [];
    clearTimeout(refreshTimer);
    Render.exitCompare();
    $('compare').hidden = true;
    $('viewport').dataset.compare = 'false';
    $('viewport').style.removeProperty('--cmp-table-h');
    $('cmpLabels').textContent = '';
    const b = $('btnCompare');
    b.classList.remove('is-on'); b.setAttribute('aria-pressed', 'false');
  }
  function toggle() { if (active) exit(); else enter(); }

  /** While comparing, edits to the design on screen refresh its column and its view. */
  function init() {
    Store.subscribe((s, info) => {
      if (!active || !chosen.includes(CURRENT) || (info && info.live)) return;
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(() => { if (active) apply(true); }, 200);
    });
  }

  return { toggle, enter, exit, init, names: () => entries.map((e) => e.name), isActive: () => active, chosen: () => chosen.slice(), table: () => $('cmpTable').innerText };
})();

/* ==========================================================================
   TESTS
   Calculation tests. Run by adding ?test to the address. They cover the
   shell helpers, every hand-calculated case in src/tower/testcases.js
   (through the integrated pipeline), every preset, and the save / export /
   import round trip. The result toast appears in ?test mode only.
   ========================================================================== */
const TestCasesMod = (() => {
// Hand-calculated test cases for the tower massing tool (plan section 12, phase 6).
// Every expected value below was worked out by hand. The arithmetic is in each comment.
//
// Conventions (plan sections 2, 3 and 5):
//  - Floor numbers start at 1. Within a segment, t = i / (n - 1): 0 at the bottom floor, 1 at the top.
//  - A setback with floor F applies to floor F and to every floor above it.
//  - GFA = sum of all plate areas, mechanical floors included. A crown adds no floor area.
//  - Total height = top of the highest floor + crown height.
//  - Site is the default 250 x 200 ft (50,000 sf). Setbacks are the default 10 ft. Every plate in these
//    cases fits inside the 230 x 180 allowed footprint, so the envelope never changes GFA.
//  - The base crown is flat with height 0, so height = top of the highest floor. Only TC-08 uses a crown height.
//    (The default state has a flat crown of 20 ft. It is set to 0 here so each height is easy to check by hand.)
//  - tolerancePct 0.01 is used for every case. All values are exact in binary floating point.
//  - expect has only gfa, floors, height and tolerancePct, per the module contract. FAR and site coverage
//    are checked through gfa: FAR = gfa / 50,000 and coverage = floor 1 area / 50,000 (noted in the comments).

const { PROGRAM_DEFAULTS } = PresetsMod;

const copyPrograms = () =>
  Object.fromEntries(Object.entries(PROGRAM_DEFAULTS).map(([k, v]) => [k, { ...v }]));

const rect = (w, d) => ({ type: 'rect', w, d, radius: 0, points: [] });

// One tower segment. Defaults are the default-state segment: 10 floors, 10 ft, 100 x 100, no transforms.
const seg = (over = {}) => ({
  floors: 10,
  ftf: 10,
  program: 'residential',
  shape: rect(100, 100),
  offset: { x: 0, y: 0 },
  rotation: 0,
  taper: { x: 0, y: 0, curve: 'linear' },
  twist: { deg: 0, start: 0, end: 1, curve: 'linear' },
  lean: { x: 0, y: 0 },
  ...over,
});

// Podium off by default. podium(...) turns it on with the given overrides.
const podium = (over = {}) => ({
  on: true,
  floors: 4,
  groundFtf: 18,
  ftf: 14,
  shape: rect(220, 170),
  offset: { x: 0, y: 0 },
  program: 'retail',
  upperProgram: 'amenity',
  ...over,
});

// Full default-state structure (plan section 2). Only the patch changes per case.
const baseState = () => ({
  schema: 1,
  name: 'Test',
  site: {
    shape: 'rect',
    width: 250,
    depth: 200,
    points: [],
    setbacks: { front: 10, back: 10, left: 10, right: 10 },
    heightLimit: 400,
    stepback: { on: false, aboveHeight: 85, distance: 15 },
  },
  context: { show: true, blocks: [{ x: 0, y: -180, w: 200, d: 120, h: 60 }] },
  podium: podium({ on: false }),
  segments: [seg()],
  setbacks: [],
  mechanical: [],
  carves: [],
  cuts: [],
  crown: { type: 'flat', height: 0, steps: 3, slopeSide: 'front' },
  core: { mode: 'percent', percent: 20, w: 40, d: 30 },
  programs: copyPrograms(),
  targets: { gfa: 0, far: 0 },
  view: {
    style: 'model',
    colorBy: 'zone',
    floorLines: true,
    shadows: true,
    sun: { azimuth: 135, altitude: 40 },
    grid: true,
    figure: true,
  },
});

const makeState = (name, patch) => ({ ...baseState(), name, ...patch });

const ALL_SIDES = ['front', 'back', 'left', 'right'];

const TEST_CASES = [
  {
    id: 'tc-01-box-default',
    description: 'Default 100 x 100 box, 10 floors at 10 ft. GFA, height, FAR 2.00 on the 50,000 sf site.',
    // GFA = 100 x 100 x 10 = 100,000 sf. Height = 10 x 10 = 100 ft. FAR = 100,000 / 50,000 = 2.00.
    state: makeState('TC-01', { segments: [seg({ floors: 10 })] }),
    expect: { gfa: 100000, floors: 10, height: 100, tolerancePct: 0.01 },
  },

  {
    id: 'tc-02-box-60x40-25f-ftf13.5',
    description: 'Box 60 x 40, 25 floors at 13.5 ft. Different plate size, floor count and floor height.',
    // GFA = 60 x 40 x 25 = 2,400 x 25 = 60,000 sf. Height = 25 x 13.5 = 337.5 ft.
    state: makeState('TC-02', { segments: [seg({ floors: 25, ftf: 13.5, shape: rect(60, 40) })] }),
    expect: { gfa: 60000, floors: 25, height: 337.5, tolerancePct: 0.01 },
  },

  {
    id: 'tc-03-single-floor-coverage',
    description: 'Single 180 x 90 floor at 10 ft. GFA equals the floor 1 area, so site coverage is checked here.',
    // GFA = 180 x 90 = 16,200 sf. Coverage = 16,200 / 50,000 = 32.4%. Height = 1 x 10 = 10 ft.
    state: makeState('TC-03', { segments: [seg({ floors: 1, shape: rect(180, 90) })] }),
    expect: { gfa: 16200, floors: 1, height: 10, tolerancePct: 0.01 },
  },

  {
    id: 'tc-04-far-120x80-12f',
    description: 'Box 120 x 80, 12 floors at 10 ft. FAR check: 115,200 / 50,000 = 2.304.',
    // Plate = 120 x 80 = 9,600 sf. GFA = 9,600 x 12 = 115,200 sf. FAR = 115,200 / 50,000 = 2.304.
    // Height = 12 x 10 = 120 ft.
    state: makeState('TC-04', { segments: [seg({ floors: 12, shape: rect(120, 80) })] }),
    expect: { gfa: 115200, floors: 12, height: 120, tolerancePct: 0.01 },
  },

  {
    id: 'tc-05-podium-tower-gfa',
    description: 'Four-floor podium (220 x 170, ground 18 ft, upper 15 ft) plus a 30-floor 110 x 80 tower at 10 ft.',
    // Podium plate = 220 x 170 = 37,400 sf. Podium GFA = 37,400 x 4 = 149,600 sf.
    // Tower plate = 110 x 80 = 8,800 sf. Tower GFA = 8,800 x 30 = 264,000 sf.
    // GFA = 149,600 + 264,000 = 413,600 sf. Floors = 4 + 30 = 34.
    // Podium height = 18 + 15 x 3 = 63 ft. Tower height = 30 x 10 = 300 ft. Total = 63 + 300 = 363 ft.
    state: makeState('TC-05', {
      podium: podium({ floors: 4, groundFtf: 18, ftf: 15, shape: rect(220, 170) }),
      segments: [seg({ floors: 30, shape: rect(110, 80) })],
    }),
    expect: { gfa: 413600, floors: 34, height: 363, tolerancePct: 0.01 },
  },

  {
    id: 'tc-06-podium-ground-ftf',
    description: 'Two-floor podium (100 x 100, ground 18 ft, floor 2 at 15 ft) plus a 5-floor 80 x 80 tower at 10 ft.',
    // Podium GFA = 100 x 100 x 2 = 20,000 sf. Tower GFA = 80 x 80 x 5 = 6,400 x 5 = 32,000 sf.
    // GFA = 20,000 + 32,000 = 52,000 sf. Floors = 2 + 5 = 7.
    // Height = 18 (ground) + 15 (floor 2) + 5 x 10 = 33 + 50 = 83 ft.
    state: makeState('TC-06', {
      podium: podium({ floors: 2, groundFtf: 18, ftf: 15, shape: rect(100, 100) }),
      segments: [seg({ floors: 5, shape: rect(80, 80) })],
    }),
    expect: { gfa: 52000, floors: 7, height: 83, tolerancePct: 0.01 },
  },

  {
    id: 'tc-07-mechanical-floor',
    description: 'Box 100 x 100, 10 floors at 10 ft, with a 16 ft mechanical floor after floor 5.',
    // Mechanical plate = plate of floor 5 = 100 x 100 = 10,000 sf. Mechanical floors count in GFA.
    // GFA = 100,000 + 10,000 = 110,000 sf. Floors = 10 + 1 = 11.
    // Height = 10 x 10 + 16 = 116 ft.
    state: makeState('TC-07', {
      segments: [seg({ floors: 10 })],
      mechanical: [{ afterFloor: 5, ftf: 16 }],
    }),
    expect: { gfa: 110000, floors: 11, height: 116, tolerancePct: 0.01 },
  },

  {
    id: 'tc-08-screen-crown-height',
    description: 'Box 100 x 100, 10 floors at 10 ft, with a 20 ft screen crown. The crown adds height, not area.',
    // GFA = 100 x 100 x 10 = 100,000 sf (crown adds no floor area).
    // Height = top of floor 10 (100 ft) + crown 20 ft = 120 ft.
    state: makeState('TC-08', {
      segments: [seg({ floors: 10 })],
      crown: { type: 'screen', height: 20, steps: 3, slopeSide: 'front' },
    }),
    expect: { gfa: 100000, height: 120, tolerancePct: 0.01 },
  },

  {
    id: 'tc-09-setback-all-sides-floor6',
    description: 'Box 100 x 100, 10 floors. All-sides 10 ft setback from floor 6 gives an inner 80 x 80 square above floor 5.',
    // Floors 1-5: 100 x 100 = 10,000 sf each, total 50,000 sf.
    // Floors 6-10: (100 - 2 x 10) = 80 square = 6,400 sf each, total 32,000 sf.
    // GFA = 50,000 + 32,000 = 82,000 sf. Height = 100 ft.
    state: makeState('TC-09', {
      segments: [seg({ floors: 10 })],
      setbacks: [{ floor: 6, distance: 10, sides: ALL_SIDES }],
    }),
    expect: { gfa: 82000, floors: 10, height: 100, tolerancePct: 0.01 },
  },

  {
    id: 'tc-10-setback-front-only',
    description: 'Box 100 x 100, 10 floors. A 10 ft front-only setback from floor 1 leaves a 100 x 90 plate.',
    // Plate = w x (d - s) = 100 x (100 - 10) = 100 x 90 = 9,000 sf.
    // GFA = 9,000 x 10 = 90,000 sf. Height = 100 ft.
    state: makeState('TC-10', {
      segments: [seg({ floors: 10 })],
      setbacks: [{ floor: 1, distance: 10, sides: ['front'] }],
    }),
    expect: { gfa: 90000, floors: 10, height: 100, tolerancePct: 0.01 },
  },

  {
    id: 'tc-11-linear-taper',
    description: 'Three floors of a 90 x 90 plate, tapering -10% in X and Y from bottom to top (linear).',
    // Scale = 1 + (-10/100) x t. t = 0, 0.5, 1 for floors 1, 2, 3, so scales are 1.00, 0.95, 0.90.
    // Floor 1: 90 x 90 = 8,100 sf.
    // Floor 2: (90 x 0.95) x (90 x 0.95) = 85.5 x 85.5 = 7,310.25 sf.
    // Floor 3: (90 x 0.90) x (90 x 0.90) = 81 x 81 = 6,561 sf.
    // GFA = 8,100 + 7,310.25 + 6,561 = 21,971.25 sf. Height = 3 x 10 = 30 ft.
    state: makeState('TC-11', {
      segments: [seg({ floors: 3, shape: rect(90, 90), taper: { x: -10, y: -10, curve: 'linear' } })],
    }),
    expect: { gfa: 21971.25, floors: 3, height: 30, tolerancePct: 0.01 },
  },

  {
    id: 'tc-12-twist-keeps-gfa',
    description: 'Box 100 x 100, 10 floors, twisting 45 degrees over the height. Rotation must not change GFA.',
    // Each plate is a rotated 100 x 100 square. Area = 100 x 100 = 10,000 sf per floor.
    // GFA = 10,000 x 10 = 100,000 sf. Height = 100 ft.
    state: makeState('TC-12', {
      segments: [seg({ floors: 10, twist: { deg: 45, start: 0, end: 1, curve: 'linear' } })],
    }),
    expect: { gfa: 100000, floors: 10, height: 100, tolerancePct: 0.01 },
  },

  {
    id: 'tc-13-shift-and-lean-keep-gfa',
    description: 'Box 100 x 100, 10 floors, shifted by (20, -10) and leaning 30 ft in X. Translation must not change GFA.',
    // Each plate is a translated 100 x 100 square. Area = 10,000 sf per floor.
    // GFA = 10,000 x 10 = 100,000 sf. Height = 100 ft.
    state: makeState('TC-13', {
      segments: [seg({ floors: 10, offset: { x: 20, y: -10 }, lean: { x: 30, y: 0 } })],
    }),
    expect: { gfa: 100000, floors: 10, height: 100, tolerancePct: 0.01 },
  },

  {
    id: 'tc-14-two-segments',
    description: 'Two stacked segments: 4 floors of 100 x 100 at 10 ft, then 6 floors of 60 x 60 at 13.5 ft.',
    // Segment 1 GFA = 100 x 100 x 4 = 40,000 sf. Segment 2 GFA = 60 x 60 x 6 = 3,600 x 6 = 21,600 sf.
    // GFA = 40,000 + 21,600 = 61,600 sf. Floors = 4 + 6 = 10.
    // Height = 4 x 10 + 6 x 13.5 = 40 + 81 = 121 ft.
    state: makeState('TC-14', {
      segments: [
        seg({ floors: 4, ftf: 10, shape: rect(100, 100) }),
        seg({ floors: 6, ftf: 13.5, shape: rect(60, 60) }),
      ],
    }),
    expect: { gfa: 61600, floors: 10, height: 121, tolerancePct: 0.01 },
  },
];

return { TEST_CASES };
})();


async function runTests() {
  const results = [];
  const eq = (a, b) => (JSON.stringify(a) === JSON.stringify(b) ? true : `got ${JSON.stringify(a)}, expected ${JSON.stringify(b)}`);
  const near = (a, b, tol = 1e-9) => (Math.abs(a - b) <= tol ? true : `got ${a}, expected ${b}`);
  const t = async (name, fn) => {
    let r;
    try { r = await fn(); } catch (e) { r = `threw ${e && e.message}`; }
    results.push({ name, ok: r === true, detail: r === true ? '' : String(r) });
  };

  /* ---- shell helpers ---- */
  await t('formatFeetInches 312.5', () => eq(Units.formatFeetInches(312.5), `312'-6"`));
  await t('formatFeetInches 0', () => eq(Units.formatFeetInches(0), `0'-0"`));
  await t('formatFeetInches rounds up to next foot', () => eq(Units.formatFeetInches(9.999), `10'-0"`));
  await t('formatArea 100000', () => eq(Units.formatArea(100000), '100,000 sf'));
  await t('parseLength 10\'-6"', () => near(Units.parseLength(`10'-6"`), 10.5));
  await t('parseLength 10.5', () => near(Units.parseLength('10.5'), 10.5));
  await t("parseLength 10'", () => near(Units.parseLength("10'"), 10));
  await t('parseLength 10 ft 6 in', () => near(Units.parseLength('10 ft 6 in'), 10.5));
  await t('parseLength 6"', () => near(Units.parseLength('6"'), 0.5));
  await t('parseLength 10-6', () => near(Units.parseLength('10-6'), 10.5));
  await t('parseLength bad input', () => eq(isNaN(Units.parseLength('abc')), true));
  await t('ringArea square', () => near(Geo.ringArea(siteRect(100, 100)), 10000));
  await t('default GFA', () => near(computeDerived(defaultState()).metrics.gfa, 100000));
  await t('default floor list', () => { const f = Geo.buildFloorList(defaultState()); return eq([f.length, f[0].z, f[9].z, f[9].t], [10, 0, 90, 1]); });
  await t('planToWorld north is -z', () => eq(planToWorld(3, 4, 5), [3, 5, -4]));
  await t('floor cap', () => { const s = defaultState(); s.segments[0].floors = 1000; return eq(Geo.buildPlates(s).plates.length, CONFIG.limits.maxFloors); });

  /* ---- integration decisions ---- */
  await t('unitFactor is a fraction or null in every program', () => {
    const bad = Object.entries(defaultState().programs).filter(([, p]) => !(p.unitFactor === null || (p.unitFactor > 0 && p.unitFactor <= 1)));
    return bad.length === 0 || `bad: ${bad.map(([k]) => k)}`;
  });
  await t('flat crown adds 0 height; stepped adds its height', () => {
    const s = defaultState(); s.crown = { type: 'flat', height: 20, steps: 3, slopeSide: 'front' };
    const flat = computeDerived(s).metrics.totalHeight;
    s.crown.type = 'stepped';
    return eq([flat, computeDerived(s).metrics.totalHeight], [100, 120]);
  });
  await t('floor count = podium + tower + mechanical', () => {
    const s = defaultState(); s.podium.on = true; s.podium.floors = 2; s.mechanical = [{ afterFloor: 5, ftf: 16 }];
    return eq(computeDerived(s).metrics.floorCount, 13);
  });
  await t('groupFloors and envelope describeFloors give the same text', () => {
    for (const a of [[5], [31, 32, 33, 34, 40], [1, 2, 3], [2, 4, 6], [10, 11, 20, 21, 22]]) if (Geo.groupFloors(a) !== Env.describeFloors(a)) return `differs for ${a}`;
    return true;
  });
  await t('warnings use grouped floors (height limit)', () => {
    const s = defaultState(); s.site.heightLimit = 55;
    const w = computeDerived(s).warnings.find((x) => x.id === 'height');
    return eq(w && w.text, 'Floors 6–10 exceed the height limit.');
  });
  await t('plates above the height limit count as outside (they turn red)', () => {
    const s = defaultState(); s.site.heightLimit = 55;
    const p = computeDerived(s).plates;
    return eq([p.filter((x) => x.outsideEnvelopeArea > 1).map((x) => x.n)], [[6, 7, 8, 9, 10]]);
  });
  await t('a plate that touches the allowed footprint exactly is inside', () => {
    const s = defaultState(); s.segments[0].shape.w = 230; s.segments[0].shape.d = 180;
    return eq(computeDerived(s).plates.filter((x) => x.outsideEnvelopeArea > 1).length, 0);
  });
  await t('a plate past the setback is outside and listed', () => {
    const s = defaultState(); s.segments[0].shape.w = 240;
    const d = computeDerived(s);
    return eq([d.plates.every((x) => x.outsideEnvelopeArea > 1), d.warnings.some((x) => x.id === 'setback')], [true, true]);
  });
  await t('draft build has the same area as the full build (circle)', () => {
    const s = defaultState(); s.segments[0].shape = { type: 'circle', w: 100, d: 100, radius: 0, points: [] };
    const full = Geo.buildPlates(s).plates[0].area, draft = Geo.buildPlates(s, { quality: 'draft' }).plates[0].area;
    return (hasCurves(s) && Math.abs(full - draft) / full < 1e-3) || `full ${full} draft ${draft}`;
  });
  await t('Surround makes one block per side, outside the site', () => {
    const b = surroundBlocks(defaultState());
    return eq([b.length, b.every((k) => Math.abs(k.x) + k.w / 2 > 125 || Math.abs(k.y) + k.d / 2 > 100)], [4, true]);
  });
  await t('compare grid: 2 options landscape = 2 columns; 4 = 2 x 2', () => {
    const a = compareRects(2, 1000, 500, {}, 0), b = compareRects(4, 1000, 500, {}, 0);
    return eq([a.map((r) => [r.x, r.y, r.w, r.h]), b.map((r) => [r.x, r.y, r.w, r.h])],
      [[[0, 0, 500, 500], [500, 0, 500, 500]], [[0, 0, 500, 250], [500, 0, 500, 250], [0, 250, 500, 250], [500, 250, 500, 250]]]);
  });

  /* ---- every hand-calculated case, through the integrated pipeline ---- */
  for (const tc of TestCasesMod.TEST_CASES) {
    await t(`case ${tc.id}`, () => {
      const d = computeDerived(fillDefaults(tc.state));
      const e = tc.expect, tol = e.tolerancePct == null ? 0.01 : e.tolerancePct;
      const pct = (a, b) => (b === 0 ? Math.abs(a) : (Math.abs(a - b) / Math.abs(b)) * 100);
      const bad = [];
      if (e.gfa != null && pct(d.metrics.gfa, e.gfa) > tol) bad.push(`gfa ${d.metrics.gfa} vs ${e.gfa}`);
      if (e.floors != null && d.metrics.floorCount !== e.floors) bad.push(`floors ${d.metrics.floorCount} vs ${e.floors}`);
      if (e.height != null && pct(d.metrics.totalHeight, e.height) > tol) bad.push(`height ${d.metrics.totalHeight} vs ${e.height}`);
      return bad.length === 0 || bad.join('; ');
    });
  }

  /* ---- every preset loads with zero error warnings ---- */
  for (const p of CONFIG.presets) {
    await t(`preset ${p.id} loads with zero error-severity warnings`, () => {
      const s = fillDefaults(p.state); s.context.blocks = surroundBlocks(s);
      const d = computeDerived(s);
      const errors = d.warnings.filter((w) => w.level === 'error');
      return (errors.length === 0 && d.metrics.gfa > 0 && d.plates.length > 0) || `errors: ${errors.map((w) => w.text).join(' | ')} gfa ${d.metrics.gfa}`;
    });
  }

  /* ---- save, export, import ---- */
  const memory = () => { const m = new Map(); return { getItem: (k) => (m.has(k) ? m.get(k) : null), setItem: (k, v) => m.set(k, String(v)), removeItem: (k) => m.delete(k) }; };
  await t('autosave round trip', () => {
    const a = StorageMod.createStorage({ key: 'k', schema: 1, storage: memory(), debounceMs: 5 });
    const s = fillDefaults(CONFIG.presets[0].state);
    a.autosave(s); a.flush();
    return eq(a.loadAutosave(), s);
  });
  await t('export then import gives the same metrics', async () => {
    const a = StorageMod.createStorage({ key: 'k', schema: 1, storage: memory() });
    const originals = CONFIG.presets.map((p) => fillDefaults(p.state));
    originals.forEach((s, i) => a.save(s, `Preset ${i}`));
    const blob = a.exportAll();
    const b = StorageMod.createStorage({ key: 'k2', schema: 1, storage: memory() });
    const res = await b.importFile(new File([blob], 'x.json', { type: 'application/json' }));
    const imported = b.list().sort((x, y) => x.name.localeCompare(y.name));
    if (res.added !== originals.length) return `added ${res.added}`;
    for (let i = 0; i < originals.length; i++) {
      const g1 = computeDerived(originals[i]).metrics.gfa, g2 = computeDerived(fillDefaults(imported[i].state)).metrics.gfa;
      if (Math.abs(g1 - g2) > 1e-6) return `option ${i}: ${g1} vs ${g2}`;
    }
    return true;
  });
  await t('import appends and renames duplicates', async () => {
    const a = StorageMod.createStorage({ key: 'k', schema: 1, storage: memory() });
    a.save(defaultState(), 'Same');
    const res = await a.importFile(new File([a.exportAll()], 'x.json'));
    return eq([res.added, a.list().map((o) => o.name).sort()], [1, ['Same', 'Same (2)']]);
  });

  /* ---- AI prompts ---- */
  const presetStates = CONFIG.presets.map((p) => fillDefaults(p.state));
  await t('every built-in prompt fills with no "[" or "{{" left (default design and every preset)', () => {
    const states = [fillDefaults(defaultState()), ...presetStates];
    for (const st of states) {
      const auto = Prompts.autoValues(st, computeDerived(st).metrics);
      for (const p of PromptsMod.PROMPTS) {
        const text = PromptsMod.fillPrompt(p, { ...auto, ...Object.fromEntries(Object.keys(PromptsMod.PROMPT_FIELDS).map((k) => [k, Prompts.valuesFor(p)[k]])) });
        if (text.includes('[') || text.includes('{{')) return `${p.id} (${st.name}) left a token: ${(text.match(/\[[^\]]*\]|\{\{[^}]*\}\}/) || [''])[0]}`;
        if (!text.startsWith(PromptsMod.FORM_LOCK.slice(0, 20))) return `${p.id} does not start with the form lock`;
      }
    }
    return true;
  });
  await t('the panel text for every built-in prompt matches getPromptText', () => {
    for (const p of PromptsMod.PROMPTS) { const x = Prompts.promptText(p.id); if (!x || x.includes('[') || x.includes('{{')) return `${p.id}: ${String(x).slice(0, 80)}`; }
    return eq(Prompts.promptText('no-such-prompt'), null);
  });
  await t('the form phrase is non-empty for every preset', () => {
    for (const st of presetStates) { const f = Prompts.formPhrase(st); if (!/^an? .+ tower with .+/.test(f)) return `${st.name}: "${f}"`; }
    return true;
  });
  await t('form phrase rules (shape, setbacks, twist, taper, sky garden, crown)', () => {
    const s = fillDefaults(defaultState());
    const out = [Prompts.formPhrase(s)];
    s.setbacks = [{ floor: 4, distance: 10, sides: ['front'] }, { floor: 7, distance: 10, sides: ['front'] }]; s.crown.type = 'stepped';
    out.push(Prompts.formPhrase(s));
    s.segments[0].shape.type = 'ellipse'; s.segments[0].twist.deg = 20; s.carves = [{ startFloor: 5, endFloor: 6, kind: 'full' }]; s.crown.type = 'spire';
    out.push(Prompts.formPhrase(s));
    s.segments[0].shape.type = 'L'; s.segments[0].twist.deg = 0; s.segments[0].taper.x = -10; s.setbacks = [s.setbacks[0]]; s.carves = []; s.crown.type = 'screen';
    out.push(Prompts.formPhrase(s));
    s.segments[0].shape.type = 'polygon'; s.segments[0].taper.x = 0; s.crown.type = 'sloped';
    out.push(Prompts.formPhrase(s));
    return eq(out, [
      'a rectangular tower with a flat roof',
      'a rectangular tower with two setbacks and a stepped crown',
      'a twisting elliptical tower with two setbacks, a sky garden and a spire',
      'a tapering L-shaped tower with one setback and a rooftop screen',
      'a custom-shaped tower with one setback and a sloped crown',
    ]);
  });
  await t('auto fields: floors, height, program of the tallest segment, podium', () => {
    const s = fillDefaults(defaultState());
    s.podium.on = true; s.podium.floors = 8;
    s.segments = [{ ...s.segments[0], floors: 5, program: 'retail' }, { ...s.segments[0], floors: 20, ftf: 10, program: 'hotel' }];
    const m = computeDerived(s).metrics, a = Prompts.autoValues(s, m);
    s.podium.on = false;
    return eq([a.floors, a.height, a.program, a.podium, Prompts.autoValues(s, computeDerived(s).metrics).podium],
      [String(m.floorCount), `${Math.round(m.totalHeight)} feet`, 'hotel', 'an 8-story podium', 'no podium']);
  });
  await t('custom prompts: save, export, import (title collisions become "Title (2)"), remove', async () => {
    const a = StorageMod.createStorage({ key: 'k', schema: 1, storage: memory() });
    const rec = a.savePrompt({ title: 'Evening mood', template: 'A {{height}} tower at {{time}}.', uses: ['time'] });
    a.savePrompt({ title: 'Second', template: 'Second prompt', uses: [] });
    if (!rec || rec.group !== 'custom' || !rec.id) return `bad record ${JSON.stringify(rec)}`;
    const blob = a.exportAll();
    const payload = JSON.parse(await blob.text());
    if (!Array.isArray(payload.prompts) || payload.prompts.length !== 2) return `export has ${JSON.stringify(payload.prompts)}`;
    const fresh = StorageMod.createStorage({ key: 'k2', schema: 1, storage: memory() });
    const r1 = await fresh.importFile(new File([blob], 'x.json'));
    const back = fresh.listPrompts();
    if (r1.promptsAdded !== 2 || back.length !== 2) return `imported ${JSON.stringify(r1)}`;
    const same = (x, y) => x.title === y.title && x.template === y.template && JSON.stringify(x.uses) === JSON.stringify(y.uses) && x.group === 'custom';
    if (!same(back[0], rec) || !same(back[1], a.listPrompts()[1])) return `round trip differs: ${JSON.stringify(back)}`;
    const r2 = await fresh.importFile(new File([blob], 'x.json'));
    const titles = fresh.listPrompts().map((x) => x.title).sort();
    if (r2.promptsAdded !== 2 || JSON.stringify(titles) !== JSON.stringify(['Evening mood', 'Evening mood (2)', 'Second', 'Second (2)'])) return `titles ${titles}`;
    if (!fresh.removePrompt(back[0].id) || fresh.listPrompts().length !== 3) return 'remove failed';
    const mem = memory(), b1 = StorageMod.createStorage({ key: 'k3', schema: 1, storage: mem }); b1.savePrompt({ title: 'Kept', template: 'x', uses: ['season'] });
    b1.flush();
    return eq(StorageMod.createStorage({ key: 'k3', schema: 1, storage: mem }).listPrompts().map((x) => [x.title, x.uses]), [['Kept', ['season']]]);
  });
  await t('an export with no prompts has no "prompts" key (older files stay the same)', async () => {
    const a = StorageMod.createStorage({ key: 'k', schema: 1, storage: memory() });
    a.save(defaultState(), 'Only an option');
    return eq('prompts' in JSON.parse(await a.exportAll().text()), false);
  });
  await t('AI-ready filename', () => eq(ShotMod.screenshotFilename('Option A-ai-ready', new Date(2026, 9, 20)), 'option-a-ai-ready-2026-10-20.png'));

  /* ---- screenshot ---- */
  if (Render.ready()) {
    await t('AI-ready capture returns a PNG and puts the scene back exactly', async () => {
      const before = JSON.stringify(Render.sceneFlags()), style = Store.get('view.style');
      const blob = await Shots.aiReady({ deliver: false, scale: 1 });
      const after = JSON.stringify(Render.sceneFlags());
      return (blob.type === 'image/png' && blob.size > 2000 && before === after && style === Store.get('view.style')) || `type ${blob.type} size ${blob.size} before ${before} after ${after}`;
    });
    await t('screenshot capture returns a PNG blob', async () => {
      const blob = await Shots.capture({ scale: 1 });
      return (blob.type === 'image/png' && blob.size > 2000) || `type ${blob.type} size ${blob.size}`;
    });
  }

  const failed = results.filter((r) => !r.ok);
  console.log(`[tests] ${results.length - failed.length}/${results.length} passed`, failed.length ? JSON.stringify(failed) : '');
  window.__towerTestResults = { total: results.length, passed: results.length - failed.length, failed, results };
  return window.__towerTestResults;
}


/* ==========================================================================
   Start-up and test hook
   ========================================================================== */
const TEST_MODE = /[?&]test\b/.test(location.search);
Options.init({ restore: !TEST_MODE });
UI.init();
Prompts.init();
Compare.init();
Options.syncDirty();
if (!Render.init(document.getElementById('canvasHost'))) Store.subscribe(() => UI.updateHud(Derived.get()));

const optionInfo = (o) => ({ id: o.id, name: o.name, updatedAt: o.updatedAt });
window.__tower = {
  getState: () => Store.snapshot(),
  setState: (path, value) => { Store.set(path, value, { live: false }); },
  setStateLive: (path, value) => { Store.set(path, value, { live: true }); },
  commit: () => Store.commit(),
  replaceState: (state) => { Store.replace(fillDefaults(state)); },
  getPlates: () => Derived.get().plates,
  getMetrics: () => Derived.get().metrics,
  // extras for automated tests
  getWarnings: () => Derived.get().warnings,
  getFloors: () => Derived.get().floors,
  getEnvelope: () => {
    const d = Derived.get(), s = Store.raw();
    return {
      heightLimit: s.site.heightLimit,
      wireframe: d.wire,
      outside: d.plates.filter((p) => p.outsideEnvelopeArea > 0).map((p) => ({ n: p.n, area: p.outsideEnvelopeArea })),
      crownOutside: d.solidsOutside,
      warnings: d.warnings.filter((w) => ['height', 'setback', 'stepback', 'crown-height'].includes(w.id)),
      allowedAt: (z) => Env.allowedFootprint(s, z),
    };
  },
  loadPreset: (id) => Options.loadPreset(id),
  listPresets: () => CONFIG.presets.map((p) => ({ id: p.id, name: p.name })),
  listOptions: () => Options.list().map(optionInfo),
  saveOption: () => Options.save(),
  duplicateOption: () => Options.duplicate(),
  loadOption: (id) => Options.loadOption(id),
  compare: (keys) => Compare.enter(keys),
  exitCompare: () => Compare.exit(),
  getCompare: () => ({ active: Compare.isActive(), names: Compare.names(), chosen: Compare.chosen(), table: Compare.isActive() ? Compare.table() : '' }),
  screenshot: (opts) => Shots.capture(opts),
  // AI prompts: the panel, the filled text of a prompt (by id; `values` overrides auto or pick fields), the AI-ready picture
  openPrompts: () => Prompts.open(),
  closePrompts: () => Prompts.close(),
  getPromptText: (id, values) => Prompts.promptText(id, values),
  getPromptAuto: () => Prompts.currentAuto(),
  listPrompts: () => Prompts.allPrompts().map((p) => ({ id: p.id, group: p.group, title: p.title })),
  aiReadyScreenshot: () => Shots.aiReady({ deliver: false }),
  undo: () => Store.undo(),
  redo: () => Store.redo(),
  history: () => ({ depth: Store.historyDepth(), canUndo: !!Store.canUndo(), canRedo: !!Store.canRedo() }),
  setView: (id, animate = false) => Render.setView(id, animate),
  getView: () => Render.info(),
  units: Units,
  runTests,
};
if (TEST_MODE) {
  runTests().then((r) => {
    const msg = r.failed.length
      ? `Tests: ${r.failed.length} of ${r.total} failed. ${r.failed.map((f) => `${f.name} (${f.detail})`).join(' | ')}`
      : `Tests: all ${r.total} passed`;
    Toast.show(msg, r.failed.length ? 'bad' : 'test-pass', 0);
  });
}
</script>
