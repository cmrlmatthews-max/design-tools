      openDoc(doc);
      project.updateUrl(doc.id);
      Toast.show(res.renamed ? `Imported as ${doc.name}.` : `Imported ${doc.name}.`);
      if (res.warning) noticeOnce('warning', String(res.warning));
      return doc;
    } catch (e) { console.error(e); Toast.show(e && e.message ? e.message : 'The file could not be imported.', 'bad', 8000); return null; }
  }
  /** When the page comes back to the front, another tool may have changed the massing: take the fresh project data. */
  function reloadData() {
    if (!project.doc || project.dirty) return false;
    let fresh = null;
    try { fresh = ProjectMod.loadProject(storageOf(), project.doc.id, storageNotice()); } catch (e) { fresh = null; }
    if (!fresh) return false;
    const before = dataKey();
    const siteBefore = (sectionOf('site') || {}).updatedAt || '';
    project.doc = fresh;
    const siteChanged = ((sectionOf('site') || {}).updatedAt || '') !== siteBefore;
    if (siteChanged) followGround({ merge: true });          // a new site arrived: the base follows its ground
    if (dataKey() !== before || siteChanged) { renderPill(); Render.requestRender(); return true; }
    return false;
  }

  /* ---- Project menu -------------------------------------------------------------------------------- */
  const whenText = (t) => { try { const d = new Date(t); return Number.isNaN(d.getTime()) ? '' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); } catch (e) { return ''; } };
  const bytesText = (b) => (Number.isFinite(b) && b > 0 ? (b >= 1048576 ? `${(b / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(b / 1024))} KB`) : '');
  function openMenu(anchor) {
    const el = h('div', { role: 'menu', id: 'projectMenu' });
    const item = (key, title, sub, onclick, o = {}) => h('button', { class: 'pop-item', type: 'button', role: 'menuitem', 'data-proj': key, 'data-project-id': o.id, disabled: o.disabled, onclick: () => { if (!o.keep) Pop.close(); onclick(); } },
      h('span', { class: 'grow' }, title, sub ? h('small', null, sub) : null));
    const nameField = h('input', { class: 'pop-name', id: 'projName', type: 'text', maxlength: '80', spellcheck: 'false', autocomplete: 'off', autocapitalize: 'off', enterkeyhint: 'done', 'aria-label': 'Project name', placeholder: 'Project name', value: defaultName() });
    const doCreate = () => { Pop.close(); create(nameField.value); };
    nameField.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); doCreate(); } });
    const newRow = item('new', 'New project', 'Save this design in a new project', () => { newRow.hidden = true; form.hidden = false; nameField.focus(); nameField.select(); }, { keep: true });
    const form = h('div', { class: 'proj-new', id: 'projNewForm', hidden: true }, nameField,
      h('div', { class: 'pop-actions' },
        h('button', { class: 'btn outline', type: 'button', id: 'projCancel', onclick: () => { form.hidden = true; newRow.hidden = false; } }, 'Cancel'),
        h('button', { class: 'btn solid', type: 'button', id: 'projCreate', onclick: doCreate }, 'Create')));
    el.append(newRow, form);
    el.append(h('div', { class: 'pop-sep' }), h('div', { class: 'label pop-label' }, 'Open'));
    let list = [];
    try { list = ProjectMod.listProjects(storageOf(), storageNotice()) || []; } catch (e) { console.error(e); noticeOnce('storage', NO_STORAGE_TEXT); }
    if (!list.length) el.append(h('div', { class: 'pop-note' }, 'No saved projects yet.'));
    for (const p of list.slice(0, CONFIG.projectListMax)) {
      const here = !!project.doc && p.id === project.doc.id;
      el.append(item('open', p.name, [here ? 'Open now' : whenText(p.updatedAt), bytesText(p.bytes)].filter(Boolean).join(' · '), () => openById(p.id), { id: p.id, disabled: here }));
    }
    if (list.length > CONFIG.projectListMax) el.append(item('all', 'All projects', `${list.length - CONFIG.projectListMax} more on the Workspace page`, () => { flush(); project.navigate('../'); }));
    el.append(h('div', { class: 'pop-sep' }),
      item('import', 'Import', 'Add a project file (.cmrlm.json)', () => $('projFile').click()),
      item('export', 'Export', project.doc ? `Download ${project.doc.name} as a file` : 'Open or create a project first', exportFile, { disabled: !project.doc }),
      item('close', 'Close project', project.doc ? 'Keep working without a project' : 'No project is open', close, { disabled: !project.doc }));
    Pop.open(anchor, el);
  }

  /** The project name field for the Layout tab. */
  function nameControl() {
    const input = h('input', { class: 'pop-name', id: 'projNameField', type: 'text', maxlength: '80', spellcheck: 'false', autocomplete: 'off', 'aria-label': 'Project name' });
    input.addEventListener('change', () => { rename(input.value); });
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
    const refresh = () => { if (document.activeElement !== input) input.value = project.doc ? project.doc.name : ''; };
    Store.subscribe(refresh);
    return { el: h('div', { class: 'ctl text-row' }, h('label', { class: 'ctl-label', for: 'projNameField' }, 'Project name'), input), refresh };
  }

  /* ---- start ------------------------------------------------------------------------------------------ */
  let wired = false;
  function wire() {
    if (wired) return;
    wired = true;
    Store.subscribe((s, info) => {
      if (project.doc && !project.loading && info && !info.live) {
        const path = String(info.path || '');
        // a change that moves the footprint (or a whole new state): the base elevation follows the ground in the same undo step
        if ((info.kind === 'replace' || footprintPath(path)) && info.kind !== 'undo' && info.kind !== 'redo') followGround({ merge: true });
      }
      if (project.doc && !project.loading && (!info || !info.live)) markDirty();
      renderPill();
    });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); else reloadData(); });
    window.addEventListener('pagehide', () => { flush(); });
    const file = $('projFile');
    if (file) file.addEventListener('change', async () => {
      const f = file.files && file.files[0];
      file.value = '';
      if (f) await importFile(f);
    });
  }
  /** On start: with ?project=<id> open that project. Without one, a placement left over from an earlier project is cleared. Returns true when a project was opened. */
  function start() {
    wire();
    let id = null;
    try { id = ProjectMod.projectIdFromUrl(location); } catch (e) { id = null; }
    if (!id) {
      const cur = Store.raw();
      if (cur.placement || cur.source !== 'standalone') {
        const next = deepClone(cur);
        next.placement = null;
        if (next.source !== 'standalone') { next.source = 'standalone'; next.sourceLevel = null; }
        Store.replace(next, { resetHistory: true });
      }
      renderPill();
      return false;
    }
    let doc = null, told = false;
    try { doc = ProjectMod.loadProject(storageOf(), id, { onNotice: (message) => { told = true; noticeOnce(`storage:${message}`, String(message)); } }); } catch (e) { console.error(e); }
    if (!doc) {
      if (!told) Toast.show('That project could not be opened. It may have been deleted, or it was saved in another browser.', 'warn', 9000);
      return false;
    }
    openDoc(doc, { startup: true });
    return true;
  }

  return {
    has, hasMassing, placement, sources, useSource, useStandalone, ghostLevels, dataDoc, dataKey, massingUnits, massingPlacement,
    start, openDoc, close, create, rename, flush, send, openMenu, exportFile, importFile, nameControl, reloadData,
    markDirty, renderPill,
    baseMode, setBaseMode, groundUnderFootprint, followGround, baseFor, baseControl, siteDerived,
    doc: () => project.doc,
    status: () => ({ open: !!project.doc, id: project.doc && project.doc.id, name: project.doc && project.doc.name, dirty: project.dirty, readOnly: project.readOnly }),
    // tests: inject storage, navigation and the address bar
    configure: (o) => { Object.assign(project, o || {}); },
    restoreDefaults: () => { Object.assign(project, { storage: null, navigate: DEFAULT_NAV, updateUrl: DEFAULT_URL }); },
    reset: () => { clearTimeout(project.timer); Object.assign(project, { doc: null, timer: 0, dirty: false, readOnly: false, loading: false, noted: {}, renamed: null }); renderPill(); },
  };
})();

/* ==========================================================================
   SHARED: screenshot
   src/shared/screenshot.js (inlined with the other modules),
   plus `Shots`: the image actions and the overlay choices (shown in the Export menu's
   "Image overlay" view). The choices are kept in state.view.shot.
   ========================================================================== */
const Shots = (() => {
  const SHOT_ITEMS = [
    ['title', 'Option name'], ['date', 'Date'], ['metrics', 'Key metrics'], ['mark', 'CMRLM mark'],
  ];
  const prefersDark = () => !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);

  /** The key metrics on the picture: stalls, square feet per stall, levels, maximum ramp slope, accessible stalls and the balance. */
  function keyMetrics(d) {
    const m = d.hud;
    return [
      ['Stalls', Units.formatInt(m.stalls)],
      ['Sf per stall', Units.formatRatio(m.sfPerStall, 1)],
      ['Levels', Units.formatInt(m.levels)],
      ['Max ramp slope', `${(m.maxSlope * 100).toFixed(1)}%`],
      ['Accessible', Units.formatInt(m.accessible.provided)],
      ['Balance', `${m.balance > 0 ? '+' : ''}${Units.formatInt(m.balance)}`],
    ];
  }

  function buildOverlay() {
    const state = Store.raw(), o = state.view.shot || {};
    const overlay = { theme: prefersDark() ? 'dark' : 'light' };
    const comparing = Render.comparing();
    if (o.title) overlay.title = comparing ? Compare.names().join('  |  ') : state.name;
    if (o.date) overlay.date = true;
    if (o.metrics && !comparing) overlay.metrics = keyMetrics(Derived.get());
    if (o.mark) overlay.mark = 'CMRLM';
    return overlay;
  }

  /** Renders the picture. With deliver = true it also downloads it (or opens the share sheet on an iPad). */
  async function capture({ deliver = false, scale = 2 } = {}) {
    const blob = await Render.capture(buildOverlay(), scale);
    if (deliver) {
      const name = Render.comparing() ? `${Store.get('name')}-compare` : Store.get('name');
      const result = await ShotMod.deliverImage(blob, ShotMod.screenshotFilename(name));
      if (result === 'downloaded') Toast.show('Image saved to your downloads.');
    }
    return blob;
  }
  async function take() {
    try { return await capture({ deliver: true }); } catch (e) { console.error(e); Toast.show(e && e.message ? e.message : 'The image could not be made.', 'bad', 6000); return null; }
  }

  /** The AI-ready picture: no overlay, grid, scale figure or wireframe; Model style; light plain sky. Filename `<option>-ai-ready-YYYY-MM-DD.png`. */
  async function aiReady({ deliver = true, scale = 2 } = {}) {
    const blob = await Render.captureClean(scale);
    if (deliver) {
      const result = await ShotMod.deliverImage(blob, ShotMod.screenshotFilename(`${Store.get('name')}-ai-ready`));
      if (result === 'downloaded') Toast.show('AI-ready image saved to your downloads.');
    }
    return blob;
  }
  async function takeAiReady() {
    try { return await aiReady({ deliver: true }); } catch (e) { console.error(e); Toast.show(e && e.message ? e.message : 'The image could not be made.', 'bad', 6000); return null; }
  }

  /** The overlay choices as menu elements (a label and one switch per item). Used by the Export menu's "Image overlay" view. */
  function overlayControls() {
    const out = [h('div', { class: 'label pop-label' }, 'The image shows')];
    for (const [key, text] of SHOT_ITEMS) {
      const btn = h('button', { class: 'toggle-row', type: 'button', role: 'switch', 'aria-checked': String(!!Store.get(`view.shot.${key}`)), 'data-shot': key, style: 'padding:0 8px' },
        h('span', null, text), h('span', { class: 'switch', 'aria-hidden': 'true' }));
      btn.addEventListener('click', () => {
        const next = !Store.get(`view.shot.${key}`);
        Store.set(`view.shot.${key}`, next, { live: false });
        btn.setAttribute('aria-checked', String(next));
      });
      out.push(btn);
    }
    return out;
  }

  return { take, capture, aiReady, takeAiReady, overlayControls, buildOverlay, keyMetrics };
})();

/* ==========================================================================
   COMPARE
   Choose 2 to 4 options. One renderer draws each option in its own part of
   the screen (setViewport / setScissor, see Render.enterCompare), one camera
   control moves them all, and a table under the views lists the metrics with
   the best value in each ranked row in bold.
   ========================================================================== */
const Compare = (() => {
  const CURRENT = '__current';
  const MIN = 2, MAX = 4;
  const $ = (id) => document.getElementById(id);
  let active = false, chosen = [], entries = [], version = 0, refreshTimer = null, ro = null;

  const RULE = 'Bold marks the best value in a row. Higher is better for stalls, parking balance, efficiency and clear height. Lower is better for square feet per stall, ramp slope and conflicts. Other rows are not ranked.';
  const pct = (v) => `${(v * 100).toFixed(1)}%`;
  const ROWS = [
    { label: 'Stalls', get: (e) => e.d.hud.stalls, fmt: Units.formatInt, higher: true },
    { label: 'Square feet per stall', get: (e) => e.d.hud.sfPerStall, fmt: (v) => Units.formatRatio(v, 1), lower: true },
    { label: 'Levels', get: (e) => e.d.hud.levels, fmt: Units.formatInt },
    { label: 'Max ramp slope', get: (e) => e.d.hud.maxSlope, fmt: pct, lower: true },
    { label: 'Gross deck area', get: (e) => e.d.hud.gross, fmt: Units.formatArea },
    { label: 'Efficiency', get: (e) => e.d.hud.efficiency, fmt: pct, higher: true },
    { label: 'Accessible stalls', get: (e) => e.d.hud.accessible.provided, fmt: Units.formatInt },
    { label: 'Parking balance', get: (e) => e.d.hud.balance, fmt: (v) => `${v > 0 ? '+' : ''}${Units.formatInt(v)}`, higher: true },
    { label: 'Lowest clear height', get: (e) => e.d.hud.lowestClear, fmt: Units.formatFeetInches, higher: true },
    { label: 'Column conflicts', get: (e) => e.d.hud.conflicts, fmt: Units.formatInt, lower: true },
    { label: 'Warnings', get: (e) => e.d.warnings.length, fmt: Units.formatInt, lower: true },
  ];

  /** Everything that can be compared: the design on screen (if it differs from its saved copy) and the saved options. */
  function candidates() {
    const list = [];
    if (Options.syncDirty()) list.push({ key: CURRENT, name: `${Store.get('name')} (on screen)`, state: () => Store.snapshot() });
    for (const o of Options.list()) list.push({ key: o.id, name: o.name, state: () => o.state });
    return list;
  }

  function buildEntries() {
    const cands = candidates();
    entries = chosen.map((key) => cands.find((c) => c.key === key)).filter(Boolean).map((c) => {
      const state = fillDefaults(c.state());
      state.name = c.name;
      return { key: c.key, name: c.name, state, d: computeDerived(state, { project: ProjectUI.dataDoc() }), uid: `${c.key}#${version}` };
    });
  }

  function renderBar(cands) {
    const bar = $('cmpBar');
    bar.textContent = '';
    const chips = h('div', { class: 'chips', role: 'group', 'aria-label': 'Options to compare' });
    for (const c of cands) {
      const on = chosen.includes(c.key);
      const b = h('button', { class: 'chip', type: 'button', 'aria-pressed': String(on), 'data-key': c.key, title: on ? 'Click to remove from the comparison' : 'Click to add to the comparison' }, c.name);
      b.addEventListener('click', () => {
        if (on) { if (chosen.length <= MIN) { Toast.show(`Compare needs at least ${MIN} options.`, 'warn'); return; } select(chosen.filter((k) => k !== c.key)); }
        else { if (chosen.length >= MAX) { Toast.show(`Compare shows at most ${MAX} options.`, 'warn'); return; } select([...chosen, c.key]); }
      });
      chips.append(b);
    }
    bar.append(h('span', { class: 'label' }, 'Compare'), chips, h('button', { class: 'btn outline sm', type: 'button', onclick: () => exit() }, 'Close'));
  }

  function renderTable() {
    const t = $('cmpTable');
    const head = h('tr', null, h('th', { title: RULE }, 'Metric'), entries.map((e) => h('th', { title: e.name }, e.name)));
    const body = ROWS.map((row) => {
      const vals = entries.map((e) => row.get(e));
      const nums = vals.filter((v) => typeof v === 'number' && isFinite(v));
      const best = nums.length ? (row.higher ? Math.max(...nums) : row.lower ? Math.min(...nums) : null) : null;
      const allSame = nums.length > 0 && nums.every((v) => Math.abs(v - nums[0]) < 1e-9);
      return h('tr', null,
        h('td', { title: row.higher || row.lower ? RULE : null }, row.label),
        vals.map((v) => {
          const isBest = best !== null && !allSame && typeof v === 'number' && Math.abs(v - best) < 1e-9;
          return h('td', { class: isBest ? 'best' : null }, v == null ? '—' : row.fmt(v));
        }));
    });
    t.replaceChildren(h('table', { class: 'cmp' }, h('thead', null, head), h('tbody', null, body)));
  }

  function positionLabels() {
    const host = $('cmpLabels');
    host.textContent = '';
    if (!active) return;
    const cells = Render.cells();
    entries.forEach((e, i) => {
      const c = cells[i];
      if (!c) return;
      host.append(h('div', { class: 'cmp-label', style: `left:${Math.round(c.x + 8)}px;top:${Math.round(c.y + 8)}px;max-width:${Math.max(60, Math.round(c.w - 16))}px` }, e.name));
    });
  }

  const reserve = () => {
    const bar = $('cmpBar'), table = $('cmpTable');
    return { top: bar.offsetTop + bar.offsetHeight + 6, bottom: table.offsetHeight };
  };
  function layoutChanged() {
    $('viewport').style.setProperty('--cmp-table-h', `${$('cmpTable').offsetHeight}px`);
    Render.refreshInsets(false);
    Render.relayout();
    positionLabels();
  }

  function apply(wasActive = false) {
    version++;
    buildEntries();
    renderBar(candidates());
    renderTable();
    Render.enterCompare(entries.map((e) => ({ name: e.name, state: e.state, d: e.d, uid: e.uid })), reserve, { keepView: wasActive });
    layoutChanged();
    markComparing(true);
  }
  /** The Option button shows a highlight while comparing (the Compare item itself lives in the Option menu). */
  function markComparing(on) {
    const b = $('btnOption');
    if (!b) return;
    b.classList.toggle('is-on', on);
    b.dataset.comparing = on ? 'true' : 'false';
    b.title = on ? 'Comparing options. Open the menu to exit.' : 'Option: name, presets, save, compare';
  }
  function select(keys) {
    chosen = keys.slice(0, MAX);
    apply(true);
  }

  /** Start comparing. keys: option ids (or '__current'); default = the design on screen plus the newest saved one. */
  function enter(keys) {
    const cands = candidates();
    if (cands.length < MIN) {
      Toast.show('Compare needs at least 2 options. Save this design, use Duplicate, change the copy, then try again.', 'warn', 6000);
      return false;
    }
    chosen = (keys && keys.length ? keys : cands.slice(0, 2).map((c) => c.key)).filter((k) => cands.some((c) => c.key === k)).slice(0, MAX);
    if (chosen.length < MIN) chosen = cands.slice(0, 2).map((c) => c.key);
    active = true;
    $('compare').hidden = false;
    $('viewport').dataset.compare = 'true';
    if (!ro) { ro = new ResizeObserver(() => { if (active) layoutChanged(); }); ro.observe($('cmpTable')); ro.observe($('cmpBar')); Render.onResize(() => { if (active) positionLabels(); }); }
    apply();
    return true;
  }
  function exit() {
    if (!active) return;
    active = false; entries = []; chosen = [];
    clearTimeout(refreshTimer);
    Render.exitCompare();
    $('compare').hidden = true;
    $('viewport').dataset.compare = 'false';
    $('viewport').style.removeProperty('--cmp-table-h');
    $('cmpLabels').textContent = '';
    markComparing(false);
  }
  function toggle() { if (active) exit(); else enter(); }

  /** While comparing, edits to the design on screen refresh its column and its view. */
  function init() {
    Store.subscribe((s, info) => {
      if (!active || !chosen.includes(CURRENT) || (info && info.live)) return;
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(() => { if (active) apply(true); }, 200);
    });
  }

  return { toggle, enter, exit, init, names: () => entries.map((e) => e.name), isActive: () => active, chosen: () => chosen.slice(), table: () => $('cmpTable').innerText };
})();

/* ==========================================================================
   TESTS
   Calculation and export tests. Run by adding ?test to the address (plan section 9.2). They cover the shell helpers, the
   default deck (496 stalls, 378 sf per stall, 5 levels, 2.2 percent), every hand-calculated case in src/parking/testcases.js
   through the integrated pipeline, every preset, EV tagging, the draft quality, the SketchUp document, the DXF, the stall
   list, the derived section and the save / export / import round trip. The other test files (12b page, 12c selection and
   handles, 12d project) run after this one; runAllTests (in 12d) merges the results. The result toast appears in ?test mode only.
   ========================================================================== */
const TestHelp = (() => {
  const eq = (a, b) => (JSON.stringify(a) === JSON.stringify(b) ? true : `got ${JSON.stringify(a)}, expected ${JSON.stringify(b)}`);
  const near = (a, b, tol = 1e-9) => (Math.abs(a - b) <= tol ? true : `got ${a}, expected ${b}`);
  const within = (a, b, pct) => (Math.abs(a - b) <= Math.abs(b) * pct / 100 + 1e-9 ? true : `got ${a}, expected ${b} (+/- ${pct}%)`);
  const make = () => {
    const results = [];
    const t = async (name, fn) => {
      let r;
      try { r = await fn(); } catch (e) { r = `threw ${e && e.message}`; }
      results.push({ name, ok: r === true, detail: r === true ? '' : String(r) });
    };
    return { results, t };
  };
  const $ = (id) => document.getElementById(id);
  const frames = (n = 2) => new Promise((res) => { const f = () => (--n <= 0 ? res() : requestAnimationFrame(f)); requestAnimationFrame(f); });
  const wait = (ms) => new Promise((res) => setTimeout(res, ms));
  const visible = (el) => !!el && el.getClientRects().length > 0 && getComputedStyle(el).visibility !== 'hidden';
  const snap = () => JSON.stringify(Store.snapshot());
  /** One undo returns the state from before the action, and one redo puts the result back (checked by behavior). */
  const oneStep = (before) => { Store.undo(); const back = snap() === before; Store.redo(); return back; };
  const toastText = () => [...document.querySelectorAll('#toasts .toast')].map((x) => x.textContent).join(' | ');
  const merged = (name, results) => {
    const bad = results.filter((r) => !r.ok);
    console.log(`[tests] ${name} ${results.length - bad.length}/${results.length} passed`, bad.length ? JSON.stringify(bad) : '');
  };
  const presetState = (id) => fillDefaults(deepClone(CONFIG.presets.find((p) => p.id === id).state));
  /** Opens one panel section (every section starts collapsed: docs/site-base-style-technical-plan.md section 4.4). Does not touch the saved choice. */
  const openSection = (id) => { const c = UI.sectionCtl[id]; if (c && !c.isOpen()) c.setOpen(true); return !!c; };
  return { openSection, eq, near, within, make, $, frames, wait, visible, snap, oneStep, toastText, merged, presetState };
})();

async function runTests() {
  const { eq, near, within, make, presetState } = TestHelp;
  const { results, t } = make();
  const def = () => fillDefaults(defaultState());
  const level1Slope = (d) => Math.max(0, ...d.ramps.filter((r) => r.level === 1).map((r) => Math.abs(r.slope)));

  /* ---- shell helpers ---- */
  await t('formatFeetInches 312.5', () => eq(Units.formatFeetInches(312.5), `312'-6"`));
  await t('formatArea 100000', () => eq(Units.formatArea(100000), '100,000 sf'));
  await t('parseLength 10\'-6" and 10-6', () => eq([Units.parseLength(`10'-6"`), Units.parseLength('10-6')], [10.5, 10.5]));
  await t('planToWorld north is -z', () => eq(planToWorld(3, 4, 5), [3, 5, -4]));
  await t('storage key, title and tool', () => eq([CONFIG.storageKey, document.title, CONFIG.tool], ['parking.options.v1', 'Parking Deck Generator', 'parking']));
  await t('all the src modules are in the page', () => {
    const names = ['LayoutMod', 'RampsMod', 'GridMod', 'AccessibleMod', 'OverlayMod', 'MetricsMod', 'ParkDerivedMod', 'ExportsMod', 'SkPark', 'PresetsMod', 'TestCasesMod', 'ProjectMod'];
    const miss = names.filter((n) => { try { return typeof eval(n) !== 'object'; } catch (e) { return true; } });
    return eq(miss, []);
  });

  /* ---- the default deck ---- */
  await t('the default deck: 496 stalls, 378.0 sf per stall, 5 levels, 2.2 percent', () => {
    const d = computeDerived(def()), h = d.hud;
    return eq([d.ok, h.stalls, Math.round(h.sfPerStall * 10) / 10, h.levels, Math.round(h.maxSlope * 10000) / 10000], [true, 496, 378.0, 5, 0.022]);
  });
  await t('the default deck: 25 EV installed and 99 EV ready', () => {
    const d = computeDerived(def()), all = d.levels.flatMap((l) => l.stalls);
    return eq([all.filter((s) => s.kind === 'ev').length, all.filter((s) => s.evReady).length], [25, 99]);
  });
  await t('the default deck: accessible 9 required (2 van, 7 car), all provided', () => {
    const a = computeDerived(def()).hud.accessible;
    return eq([a.required, a.van, a.car, a.provided], [9, 2, 7, 9]);
  });
  await t('the default deck has no error warning', () => eq(computeDerived(def()).warnings.filter((w) => w.level === 'error').map((w) => w.id), []));
  await t('the page is showing the default numbers (496 stalls, 378 sf per stall)', () => {
    if (!document.getElementById('mStalls')) return true;
    const saved = Store.snapshot();
    Store.replace(def());
    UI.updateHud(Derived.get());
    const out = [document.getElementById('mStalls').firstChild.nodeValue, document.getElementById('mSfStall').firstChild.nodeValue];
    Store.replace(saved);
    return eq(out, ['496', '378']);
  });
  await t('computeDerived never throws on a broken state', () => {
    const s = def(); s.footprint.width = -5; s.levels.count = 0;
    const err = console.error; console.error = () => {};
    let d;
    try { d = computeDerived(s); } finally { console.error = err; }
    return typeof d.hud.stalls === 'number' ? true : 'no hud';
  });

  /* ---- every hand-calculated case through the pipeline ---- */
  for (const tc of TestCasesMod.TEST_CASES) {
    await t(`case ${tc.id}: stalls, sf per stall, slope, accessible`, () => {
      const d = computeDerived(fillDefaults(deepClone(tc.state))), h = d.hud, e = tc.expect;
      const got = { stalls: h.stalls, sf: Math.round(h.sfPerStall * 10) / 10, req: h.accessible.required, van: h.accessible.van, car: h.accessible.car };
      const want = { stalls: e.stalls, sf: e.sfPerStall, req: e.accessible.required, van: e.accessible.van, car: e.accessible.car };
      const a = eq(got, want);
      if (a !== true) return a;
      return e.slope == null ? true : near(level1Slope(d), e.slope, 1e-4);
    });
  }

  /* ---- every preset ---- */
  for (const p of CONFIG.presets) {
    await t(`preset ${p.id} builds with no error warning`, () => {
      const d = computeDerived(presetState(p.id));
      if (!d.ok) return 'not ok';
      const err = d.warnings.filter((w) => w.level === 'error');
      return err.length ? err.map((w) => w.text).join(' | ') : (d.hud.stalls > 0 ? true : 'no stalls');
    });
  }
  await t('every preset is in the Option menu list (CONFIG.presets)', () => eq(CONFIG.presets.length >= 6, true));

  /* ---- draft quality ---- */
  await t('draft quality keeps the same stall count as full', () => {
    const s = def();
    const full = LayoutMod.layout(s, { project: null, quality: 'full' }), draft = LayoutMod.layout(s, { project: null, quality: 'draft' });
    const n = (r) => r.levels.reduce((t0, l) => t0 + l.stalls.length, 0);
    return eq(n(draft), n(full));
  });
  await t('the display key changes between draft and full', () => {
    const a = Derived.display(true), b = Derived.display(false);
    return eq([a.quality, b.quality, a.key !== b.key], ['draft', 'full', true]);
  });

  /* ---- columns, clear heights, overlay ---- */
  await t('columns: one set per level, no conflicts without a project', () => {
    const d = computeDerived(def());
    return eq([d.columns.points.length > 0, d.hud.conflicts, d.overlay.source], [true, 0, 'none']);
  });
  await t('clear heights: one per level; level 1 is the van route', () => {
    const d = computeDerived(def());
    return eq([d.hud.clearHeights.length, d.hud.clearHeights[0].min], [5, def().checks.clearVan]);
  });
  await t('a low floor-to-floor gives a clear-height warning', () => {
    const s = def(); s.levels.ftf = 8; s.levels.ftf1 = 8;
    return eq(computeDerived(s).warnings.some((w) => /^clear-height/.test(w.id)), true);
  });
  await t('a ramp over its slope limit warns and turns red in the slope colors', () => {
    const s = def(); s.checks.slopeParking = 0.01;
    const d = computeDerived(s);
    return eq([d.warnings.some((w) => /slope/.test(w.id)), d.ramps.some((r) => !r.ok)], [true, true]);
  });

  /* ---- cores ---- */
  await t('a core in an aisle is flagged, and Move to the nearest row clears it', () => {
    const s = def();
    const row = LayoutMod.layout(s, { project: null }).bays[0];
    s.cores = [{ id: 'S1', kind: 'stair', x: 60, y: (row.aisle.y0 + row.aisle.y1) / 2 - 6, w: 22, d: 12 }];
    const d = computeDerived(s);
    if (d.coreIssues.S1 !== 'aisle') return `issue ${d.coreIssues.S1}`;
    if (!d.warnings.some((w) => w.action === 'move-to-row' && w.ref === 'S1')) return 'no move-to-row action';
    const r = LayoutMod.moveCoreToRow(d.raw.cores[0], d.raw);
    s.cores[0].x = r.x; s.cores[0].y = r.y;
    return eq(computeDerived(s).coreIssues.S1 || null, null);
  });
  await t('cores at the same place on every level cost the same stalls on every level', () => {
    const d = computeDerived(def());
    const per = d.levels.map((l) => l.stalls.length);
    return eq(new Set(per.slice(0, -1)).size <= 2, true);
  });

  /* ---- ramps ---- */
  await t('ramp type none: no ramps, no slope', () => {
    const s = def(); s.ramp.type = 'none';
    const d = computeDerived(s);
    return eq([d.ramps.length, d.hud.maxSlope], [0, 0]);
  });
  await t('each ramp type builds', () => {
    for (const type of RAMP_TYPES) {
      const s = def(); s.ramp.type = type;
      const d = computeDerived(s);
      if (!d.ok || !(d.hud.stalls > 0)) return `${type}: ${d.ok} ${d.hud.stalls}`;
    }
    return true;
  });

  /* ---- exports ---- */
  await t('SketchUp document validates and has solids', () => {
    const v = SkFmt.validateDoc(SketchupExport.doc(def(), computeDerived(def())));
    return v.ok && (v.counts.solid || v.counts.mesh) ? true : JSON.stringify(v.errors || v);
  });
  await t('SketchUp download delivers a file named .sketchup.json', () => {
    let name = '';
    const r = SketchupExport.download({ deliver: (blob, n) => { name = n; } });
    return eq([r.ok, /\.sketchup\.json$/.test(name)], [true, true]);
  });
  await t('DXF text has the layers and the entities', () => {
    const txt = SketchupExport.dxfText();
    return eq([/ENTITIES/.test(txt), /EOF/.test(txt), txt.length > 2000], [true, true, true]);
  });
  await t('stall CSV has one row per stall plus the header', () => {
    const rows = SketchupExport.csvText().trim().split('\n');
    return eq(rows.length, Derived.get().hud.stalls + 1);
  });
  await t('the derived section has stalls, levels and ramps', () => {
    const d = Derived.get(), sec = ParkDerivedMod.parkingDerived(Store.snapshot(), d.built, d.metrics);
    return eq([typeof sec, sec && sec.metrics ? sec.metrics.stalls : sec.stalls], ['object', d.hud.stalls]);
  });

  await t('Hero render: the first prompt, no form lock; the hero text carries the numbers of the design and the chosen material', () => {
    const p0 = PromptsMod.PROMPTS[0];
    if (p0.id !== 'hero-render' || !p0.noLock) return `first prompt ${p0.id}`;
    const st = def(), h = computeDerived(st).hud;
    const hero = PromptsMod.heroFor('parking', st, h);
    const text = PromptsMod.fillPrompt(p0, { hero, material: 'warm red-brown brick with tall windows set in deep reveals' });
    const checks = {
      opens: text.startsWith('Edit the attached massing model image'), sections: ['KEEP EXACTLY AS SHOWN', 'CONTEXT BUILDINGS — KEEP AS WHITE MODEL', 'GROUND PLANE — RENDER PHOTOREAL', 'LIGHT AND SKY'].every((x) => text.includes(x)),
      material: text.includes('The facade is warm red-brown brick with tall windows set in deep reveals.'), noTower: !/tower/i.test(text), clean: !/\[|\{\{/.test(text),
      levels: text.includes(`${h.levels}-level parking deck`), height: text.includes(`${Math.round(h.topOfDeck)} feet`), open: text.includes('with open sides'),
    };
    const bad = Object.entries(checks).filter(([, v]) => v !== true).map(([k]) => k);
    return bad.length ? `failed: ${bad.join(', ')} | ${hero}` : true;
  });
  await t('Hero render in the panel: promptText fills the hero from the current design', () => {
    const text = Prompts.promptText('hero-render');
    const h = Derived.get().hud;
    return eq([!!text && text.startsWith('Edit the attached massing model image'), text.includes(`${h.levels}-level parking deck`), text.includes(`${Math.round(h.topOfDeck)} feet`), /\[|\{\{/.test(text), /\btower\b/i.test(text)], [true, true, true, false, false]);
  });
  /* ---- save / export / import ---- */
  await t('state survives a JSON round trip and fillDefaults', () => {
    const s = def(), back = fillDefaults(JSON.parse(JSON.stringify(s)));
    return eq(back, s);
  });
  await t('fillDefaults fills a partial state', () => {
    const s = fillDefaults({ footprint: { width: 200 } });
    return eq([s.footprint.width, s.footprint.depth > 0, s.levels.count > 0, Array.isArray(s.cores)], [200, true, true, true]);
  });
  await t('Send to an unknown tool does nothing', async () => {
    const r = await ProjectUI.send('nowhere');
    return eq(r, false);
  });
  return results;
}

    await t('Compare lists stalls, sf per stall and max slope, and marks the best', async () => {

  return results;

/* ==========================================================================

/* ==========================================================================
   TESTS: the project file
   Open a project with a Mid-Rise style massing (deck levels, a bar level with core seeds), read the deck levels and plates
   (plan section 7), write the parking section (1 s debounce, visibilitychange, pagehide), keep every other section, a newer
   schema, close. A fixture project lives in an in-memory storage, so a ?test visit never touches the saved projects.
   runAllTests (below) runs every test file and merges the results.
   ========================================================================== */
const ProjectFixture = (() => {
  const memory = () => ({ data: {}, getItem(k) { return this.data[k] === undefined ? null : this.data[k]; }, setItem(k, v) { this.data[k] = String(v); }, removeItem(k) { delete this.data[k]; } });
  const rect = (w, d) => [[0, 0], [w, 0], [w, d], [0, d]];
  /** A massing section: 5 deck levels of 300 x 125 ft (floor-to-floor `ftf`), 4 bar levels above, 100 units. `seeds`: core seeds on the bar levels. */
  function massing({ ftf = 10.5, seeds = false, units = 100 } = {}) {
    const levels = [];
    for (let i = 0; i < 5; i++) levels.push({ index: i + 1, zone: 'deck', z: i * ftf, ftf, plates: [{ outer: rect(300, 125), holes: [] }] });
    for (let i = 0; i < 4; i++) {
      const lv = { index: 6 + i, zone: 'bar', z: 5 * ftf + i * 10, ftf: 10, plates: [{ outer: rect(300, 90), holes: [] }] };
      if (seeds) lv.seeds = [{ kind: 'stair', outer: [[40, 10], [62, 10], [62, 22], [40, 22]] }, { kind: 'elevator', outer: [[70, 10], [80, 10], [80, 20], [70, 20]] }];
      levels.push(lv);
    }
    return { tool: 'midrise', schema: 1, placement: { x: 10, y: 20, rotation: 0, baseZ: 0 }, state: {}, derived: { levels, metrics: { units } } };
  }
  function project(opts = {}, name = 'Fixture') {
    let doc = ProjectMod.newProject({ name });
    doc = ProjectMod.writeSection(doc, 'massing', massing(opts));
    doc = ProjectMod.writeSection(doc, 'plates', { tool: 'plate', schema: 1, placement: { x: 1, y: 2, rotation: 0, baseZ: 3 }, state: { keep: 'me' }, derived: { levels: [] } });
    return doc;
  }
  return { memory, massing, project };
})();

/** Every test file, merged. This is what ?test and __parking.runTests run. */
async function runAllTests() {
  const base = await runTests();
  const ui = await runUiTests();
  const select = await runSelectTests();
  const project = await runProjectTests();
  const all = [...base, ...ui, ...select, ...project];
  const failed = all.filter((r) => !r.ok);
  TestHelp.merged('all', all);
  window.__parkingTestResults = { total: all.length, passed: all.length - failed.length, failed, results: all };
  return window.__parkingTestResults;
}

/* ==========================================================================
   TESTS: the project site layer  (docs/site-layer-technical-plan.md section 9.2, tests 1 to 6)
   A project with a 1,000 ft site (a sloping 11 x 11 ground, two buildings, a road, a walk, a pond and three trees) and a deck massing
   placed on it. The layer draws the whole site: the ground, the neighbors, the pavement, the water and the trees. View > Site switches
   it, Compare and the AI-ready image hide it, a theme change rebuilds it. A fixture project lives in an in-memory storage, so a ?test
   visit never touches the saved projects. runAllTests below picks these tests up after the others.
   ========================================================================== */
const SiteFixture = (() => {
  const memory = () => ({ data: {}, getItem(k) { return this.data[k] === undefined ? null : this.data[k]; }, setItem(k, v) { this.data[k] = String(v); }, removeItem(k) { delete this.data[k]; } });
  const S = 1000, N = 11, SPACING = 100;
  const rect = (x0, y0, x1, y1) => [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
  /** The massing placement on the site: its ground floor at the ground there (1000 + 0.01 x + 0.02 y = 1008 at x 300, y 250). */
  const PLACEMENT = { x: 300, y: 250, rotation: 0, baseZ: 1008 };
  /** A 1000 ft site square with a sloping ground (z = 1000 + 0.01 x + 0.02 y), a near and a far building, a road, a walk, a pond and trees. */
  function siteProject({ massing = null } = {}) {
    let doc = ProjectMod.newProject({ name: 'Site fixture', frame: { kind: 'site', lat: 33.927, lon: -84.339, size: S } });
    const points = [];
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) points.push([i * SPACING, j * SPACING, 1000 + 0.01 * i * SPACING + 0.02 * j * SPACING]);
    const derived = {
      address: 'Fixture', lat: 33.927, lon: -84.339, size: S, release: 'test',
      boundary: rect(0, 0, S, S), ground: { spacing: SPACING, n: N, points },
      buildings: [
        { id: 'near', outer: rect(480, 380, 560, 420), holes: [], base: 1010, height: 40, top: 1050, floors: 3, rule: 'data', name: 'Near' },
        { id: 'far', outer: rect(950, 950, 990, 990), holes: [], base: 1030, height: 30, top: 1060, floors: 2, rule: 'data', name: 'Far' },
      ],
      roads: { segments: [], pavement: [{ outer: rect(0, 560, S, 600), holes: [] }] },
      walks: [{ outer: rect(0, 610, S, 618), holes: [] }],
      trees: [{ x: 620, y: 300, z: 1010, canopy: 22, height: 34 }, { x: 660, y: 330, z: 1011, canopy: 18, height: 30 }, { x: 700, y: 280, z: 1010, canopy: 20, height: 32 }],
      water: { areas: [{ outer: rect(760, 120, 860, 200), holes: [], level: 1010 }], lines: [] },
    };
    doc = ProjectMod.writeSection(doc, 'site', { tool: 'site', schema: 1, placement: { x: 0, y: 0, rotation: 0, baseZ: 0 }, state: { query: 'Fixture', lat: 33.927, lon: -84.339, size: S, release: 'test', walks: false }, derived });
    if (massing) doc = ProjectMod.writeSection(doc, 'massing', massing);
    return doc;
  }
  return { memory, siteProject, S, PLACEMENT };
})();

async function runSiteTests() {

      const ok = {
        solid: eq(out.solid, { style: 'solid', mesh: true, transparent: false, opacity: 1, depthWrite: true, order: 0, edges: n, edgeOrder: 0, roads: [false, 1], buildings: 2 }),
        glass: eq(out.glass, { style: 'glass', mesh: true, transparent: true, opacity: 0.25, depthWrite: false, order: 2, edges: n, edgeOrder: 3, roads: [false, 1], buildings: 2 }),
        wire: eq(out.wireframe, { style: 'wireframe', mesh: false, transparent: null, opacity: null, depthWrite: null, order: null, edges: n, edgeOrder: 3, roads: [false, 1], buildings: 2 }),
        keys: keys[0] !== keys[1] && keys[1] !== keys[2] && keys[0] !== keys[2] && keys[3] === keys[0],
        edges: n > 0, errors: errors.length,
      };
      const bad = Object.entries(ok).filter(([k, v]) => k === 'errors' ? v !== 0 : v !== true);
      return bad.length ? JSON.stringify(bad) : true;
    });

    await t('8t site style chips: the View tab has Site style Solid, Glass, Wireframe under the Site toggle (hidden while Site is off); a click sets view.siteStyle; an unknown saved value fills as solid', async () => {
      if (!SiteLayer.info().shown) open();
      await frames(4);
      const q = (v) => document.querySelector(`#siteStyleChips [data-value="${v}"]`);
      const row = document.getElementById('siteStyleChips');
      const labels = row ? [...row.querySelectorAll('[data-value]')].map((b) => b.textContent.trim()) : [];
      const visible = () => !!row && !row.closest('.when[hidden]');
      Store.set('view.siteStyle', 'solid', { live: false });
      await frames(4);
      const a = [visible(), q('solid') && q('solid').getAttribute('aria-pressed')];
      q('glass').click();
      await frames(4);
      const b = [Store.get('view.siteStyle'), q('glass').getAttribute('aria-pressed'), q('solid').getAttribute('aria-pressed')];
      Store.set('view.site', false, { live: false });
      await frames(4);
      const hidden = !visible();
      Store.set('view.site', true, { live: false });
      Store.set('view.siteStyle', 'solid', { live: false });
      await frames(4);
      const fill = [fillDefaults({ view: { siteStyle: 'bogus' } }).view.siteStyle, fillDefaults({ view: { siteStyle: 'glass' } }).view.siteStyle, fillDefaults({}).view.siteStyle];
      return eq([labels, a, b, hidden, fill], [['Solid', 'Glass', 'Wireframe'], [true, 'true'], ['glass', 'true', 'false'], true, ['solid', 'glass', 'solid']]);
    });

    await t('8 closing the project removes the layer', async () => {
      ProjectUI.close();
      await frames(3);
      return eq([SiteLayer.info().shown, Render.sceneFlags().slabY], [false, 0]);
    });
  } finally {
    window.removeEventListener('error', onErr);
    if (Compare.isActive()) Compare.exit();
    ProjectUI.reset();
    ProjectUI.restoreDefaults();
    Select.clear();
    Store.replace(savedState);
    UI.setTab(savedTab, { remember: false });
    Options.holdAutosave(false);
  }
  return results;
}

/* ==========================================================================
   TESTS: placement gizmo (docs/site-layer-technical-plan.md section 9.2, tests 7 to 9) - Parking Deck
   Drag the building: placement.x / y move in the project frame, the base elevation snaps to the ground, ONE undo step, the
   context blocks from the site follow on release only. Rotation handle in 5 degree steps. No drag without a project and, for a wrap deck, no drag.
   Uses its own in-memory site project, so a ?test visit never touches the saved projects. runAllTests is extended at the end of
   this file (no edit of the other test files needed).
   ========================================================================== */
const GizmoFixture = (() => {
  const S = 1000, N = 11, SPACING = 100;
  const memory = () => ({ data: {}, getItem(k) { return this.data[k] === undefined ? null : this.data[k]; }, setItem(k, v) { this.data[k] = String(v); }, removeItem(k) { delete this.data[k]; } });
  /** A 1000 ft site square with a sloping ground (z = 1000 + 0.01 x + 0.02 y), a near building and a far one. */
  function siteProject() {
    let doc = ProjectMod.newProject({ name: 'Gizmo fixture', frame: { kind: 'site', lat: 33.927, lon: -84.339, size: S } });
    const points = [];
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) points.push([i * SPACING, j * SPACING, 1000 + 0.01 * i * SPACING + 0.02 * j * SPACING]);
    const derived = {
      address: 'Fixture', lat: 33.927, lon: -84.339, size: S, release: 'test',
      boundary: [[0, 0], [S, 0], [S, S], [0, S]], ground: { spacing: SPACING, n: N, points },
      buildings: [
        { id: 'near', outer: [[480, 380], [560, 380], [560, 420], [480, 420]], holes: [], base: 1010, height: 40, top: 1050, floors: 3, rule: 'data', name: 'Near' },
        { id: 'far', outer: [[950, 950], [990, 950], [990, 990], [950, 990]], holes: [], base: 1030, height: 30, top: 1060, floors: 2, rule: 'data', name: 'Far' },
      ],
      roads: { segments: [], pavement: [] }, walks: null, trees: [], water: { areas: [], lines: [] },
    };
    doc = ProjectMod.writeSection(doc, 'site', { tool: 'site', schema: 1, placement: { x: 0, y: 0, rotation: 0, baseZ: 0 }, state: { query: 'Fixture', lat: 33.927, lon: -84.339, size: S, release: 'test', walks: false }, derived });
    return doc;
  }
  /** Ground elevation by the same rule the site fixture was built with. */
  const groundAt = (x, y) => 1000 + 0.01 * Math.min(Math.max(x, 0), S) + 0.02 * Math.min(Math.max(y, 0), S);
  return { memory, siteProject, groundAt, S };
})();

async function runGizmoTests() {
  const results = [];
  const eq = (a, b) => (JSON.stringify(a) === JSON.stringify(b) ? true : `got ${JSON.stringify(a)}, expected ${JSON.stringify(b)}`);
  const t = async (name, fn) => {
    let r;
    try { r = await fn(); } catch (e) { r = `threw ${e && e.message}`; }
    results.push({ name, ok: r === true, detail: r === true ? '' : String(r) });
  };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const G = PlacementGizmo;
  const savedState = Store.snapshot();
  Options.holdAutosave(true);
  const mem = GizmoFixture.memory();
  ProjectUI.reset();
  ProjectUI.configure({ storage: mem, navigate: () => {}, updateUrl: () => {} });
  const fresh = () => { Store.replace(fillDefaults(defaultState()), { resetHistory: true }); };
  const openSite = async () => {
    fresh();
    const doc = GizmoFixture.siteProject();
    ProjectMod.saveProject(mem, doc);
    ProjectUI.openDoc(doc);
    
    await wait(300);
  };
  const pl = () => Store.get('placement');
  const depth = () => Store.historyDepth();
  const HAS_CTX = false;
  const ctxKey = () => JSON.stringify((Store.get('context') || {}).blocks || []);

  try {
    /* ---- test 9 (first half): no project, no gizmo ---- */
    await t('9. no project: the placement gizmo is not active, begin does nothing, nothing is written', () => {
      if (!Render.ready()) return true;
      fresh();
      const before = JSON.stringify(Store.snapshot());
      const info = G.info();
      const began = G.begin('move', 100, 100) || G.begin('rotate', 100, 100);
      return eq([ProjectUI.has(), info.active, info.handles, began, JSON.stringify(Store.snapshot()) === before], [false, false, 0, false, true]);
    });

    await openSite();

    await t('7. the gizmo is active with a project open and shows the rotation grip', () => {
      if (!Render.ready()) return true;
      const i = G.info();
      return eq([i.active, i.dragging, i.handles], [true, null, 1]);
    });

    await t('7. a drag over the building moves placement.x / y in 1 ft steps, the base elevation snaps to the ground, ONE undo step', () => {
      if (!Render.ready()) return true;
      const p0 = { ...pl() };
      const pt = G.modelPoint();
      if (!pt) return 'no model point on screen';
      const d0 = depth();
      if (!G.begin('move', pt.x, pt.y)) return 'begin refused';
      const during = G.info().dragging;
      G.move(pt.x + 100, pt.y);
      const live = { ...pl() };
      const gestureOpen = Store.gestureActive();
      G.end();
      const p1 = { ...pl() };
      const gz = ProjectUI.groundUnderFootprint(p1);   // the lowest ground under the footprint (base rule), not the ground at the origin
      const moved = p1.x !== p0.x || p1.y !== p0.y;
      return (moved && during === 'move' && gestureOpen && live.x === p1.x && live.y === p1.y && Number.isInteger(p1.x) && Number.isInteger(p1.y)
        && Math.abs(p1.baseZ - gz) <= 0.05 && p1.rotation === p0.rotation && depth() - d0 === 1 && !Store.gestureActive() && G.info().dragging === null)
        || `p0 ${JSON.stringify(p0)} p1 ${JSON.stringify(p1)} groundZ ${gz} steps ${depth() - d0} during ${during} gesture ${gestureOpen}`;
    });

    await t('7. undo returns the placement and the context blocks in the one step; redo puts them back', () => {
      if (!Render.ready()) return true;
      const after = JSON.stringify(Store.get('placement')), ctxAfter = ctxKey();
      Store.undo();
      const undone = JSON.stringify(Store.get('placement')), ctxUndone = ctxKey();
      Store.redo();
      const redone = JSON.stringify(Store.get('placement')), ctxRedone = ctxKey();
      return (undone !== after && redone === after && (!HAS_CTX || (ctxUndone !== ctxAfter && ctxRedone === ctxAfter))) || `placement ${undone} -> ${after}`;
    });

    

    await t('7. Shift snaps the move to 5 ft', () => {
      if (!Render.ready()) return true;
      const pt = G.modelPoint();
      if (!pt) return 'no model point on screen';
      G.begin('move', pt.x, pt.y);
      G.move(pt.x - 37, pt.y + 21, { shift: true });
      const p = { ...pl() };
      G.end(false);
      return (p.x % 5 === 0 && p.y % 5 === 0) || `x ${p.x} y ${p.y}`;
    });

    await t('7. a drag that is cancelled (end(false)) restores the placement and adds no undo step', () => {
      if (!Render.ready()) return true;
      const p0 = JSON.stringify(pl()), d0 = depth(), ctx0 = ctxKey();
      const pt = G.modelPoint();
      if (!pt) return 'no model point on screen';
      G.begin('move', pt.x, pt.y);
      G.move(pt.x + 80, pt.y - 40);
      const during = JSON.stringify(pl());
      G.end(false);
      return (during !== p0 && JSON.stringify(pl()) === p0 && depth() === d0 && ctxKey() === ctx0 && !Store.gestureActive()) || `during ${during} after ${JSON.stringify(pl())}`;
    });

    await t('7. a press on empty ground does not start a placement drag, and orbit stays on', () => {
      if (!Render.ready()) return true;
      const rect = Render.canvas().getBoundingClientRect();
      const began = G.begin('move', rect.left + 2, rect.top + 2);
      return eq([began, G.info().dragging, Render.orbitEnabled()], [false, null, true]);
    });

    await t('7. a real pointer drag on the model: needs 6 px of travel, orbit is off during it and on after, one undo step', async () => {
      if (!Render.ready()) return true;
      const pt = G.modelPoint();
      if (!pt) return 'no model point on screen';
      const canvas = Render.canvas();
      const ev = (type, x, y) => new PointerEvent(type, { pointerId: 41, pointerType: 'mouse', button: 0, buttons: type === 'pointerup' ? 0 : 1, clientX: x, clientY: y, bubbles: true, cancelable: true });
      const p0 = JSON.stringify(pl()), d0 = depth();
      canvas.dispatchEvent(ev('pointerdown', pt.x, pt.y));
      const orbitOffDown = !Render.orbitEnabled();
      window.dispatchEvent(ev('pointermove', pt.x + 3, pt.y));
      const small = JSON.stringify(pl()) === p0 && G.info().dragging === null;
      window.dispatchEvent(ev('pointermove', pt.x + 60, pt.y + 10));
      await wait(60);
      const dragging = G.info().dragging;
      const moved = JSON.stringify(pl()) !== p0;
      window.dispatchEvent(ev('pointerup', pt.x + 60, pt.y + 10));
      const ok = orbitOffDown && small && dragging === 'move' && moved && Render.orbitEnabled() && depth() - d0 === 1 && G.info().dragging === null;
      return ok || `orbitOffDown ${orbitOffDown} small ${small} dragging ${dragging} moved ${moved} orbit ${Render.orbitEnabled()} steps ${depth() - d0}`;
    });

    await t('7. a press on the model that never travels 6 px changes nothing and gives orbit back', () => {
      if (!Render.ready()) return true;
      const pt = G.modelPoint();
      if (!pt) return 'no model point on screen';
      const ev = (type, x, y) => new PointerEvent(type, { pointerId: 42, pointerType: 'mouse', button: 0, clientX: x, clientY: y, bubbles: true, cancelable: true });
      const p0 = JSON.stringify(pl()), d0 = depth();
      Render.canvas().dispatchEvent(ev('pointerdown', pt.x, pt.y));
      window.dispatchEvent(ev('pointermove', pt.x + 2, pt.y + 1));
      window.dispatchEvent(ev('pointerup', pt.x + 2, pt.y + 1));
      return eq([JSON.stringify(pl()) === p0, depth() === d0, Render.orbitEnabled(), G.info().dragging], [true, true, true, null]);
    });

    /* ---- test 8: rotation ---- */
    await t('8. the rotation handle turns the placement in 5 degree steps about the box center, ONE undo step', () => {
      if (!Render.ready()) return true;
      const p0 = { ...pl() };
      const b = Derived.get().bounds.model;
      const c = [(b.minX + b.maxX) / 2, (b.minY + b.maxY) / 2];
      const cBefore = ProjectMod.toProject(p0, c);
      const a = G.ringPoint(0), z = G.ringPoint(90);
      const d0 = depth();
      if (!G.begin('rotate', a.x, a.y)) return 'begin refused';
      const during = G.info().dragging;
      G.move(z.x, z.y);
      const live = pl().rotation;
      G.end();
      const p1 = { ...pl() };
      const cAfter = ProjectMod.toProject(p1, c);
      const ok = during === 'rotate' && p1.rotation % 5 === 0 && Math.abs(p1.rotation - p0.rotation - 90) <= 5 && live === p1.rotation
        && Math.hypot(cAfter[0] - cBefore[0], cAfter[1] - cBefore[1]) < 0.01 && depth() - d0 === 1
        && Math.abs(p1.baseZ - ProjectUI.groundUnderFootprint(p1)) <= 0.05;
      return ok || `rot ${p0.rotation} -> ${p1.rotation}, center moved ${Math.hypot(cAfter[0] - cBefore[0], cAfter[1] - cBefore[1])}, steps ${depth() - d0}`;
    });

    await t('8. every rotation step along a sweep is a multiple of 5; Alt gives 1 degree steps', () => {
      if (!Render.ready()) return true;
      const a = G.ringPoint(0);
      G.begin('rotate', a.x, a.y);
      const seen = [];
      for (let deg = 3; deg <= 100; deg += 7) { const q = G.ringPoint(deg); G.move(q.x, q.y); seen.push(pl().rotation); }
      const q = G.ringPoint(37.4);
      G.move(q.x, q.y, { alt: true });
      const fine = pl().rotation;
      G.end(false);
      return (seen.every((r) => r % 5 === 0) && Number.isInteger(fine) && fine % 5 !== 0) || `seen ${seen} fine ${fine}`;
    });

    await t('8. Escape during a rotation restores the placement and commits nothing', () => {
      if (!Render.ready()) return true;
      const p0 = JSON.stringify(pl()), d0 = depth();
      const a = G.ringPoint(0), z = G.ringPoint(60);
      G.begin('rotate', a.x, a.y);
      G.move(z.x, z.y);
      window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      return eq([JSON.stringify(pl()) === p0, depth() === d0, G.info().dragging, Render.orbitEnabled()], [true, true, null, true]);
    });

    /* ---- test 9 (second half) ---- */
    await t('9. a wrap deck follows the massing: the gizmo is not active and begin does nothing', () => {
      if (!Render.ready()) return true;
      ProjectUI.reset();
      fresh();
      const doc = ProjectFixture.project();
      ProjectMod.saveProject(mem, doc);
      ProjectUI.openDoc(doc);
      const info = G.info();
      const src = Store.get('source');
      const p0 = JSON.stringify(Store.get('placement'));
      const began = G.begin('move', 300, 300) || G.begin('rotate', 300, 300);
      return eq([src, info.active, info.handles, began, JSON.stringify(Store.get('placement')) === p0], ['wrap', false, 0, false, true]);
    });
    await t('9. closing the project turns the gizmo off again', () => {
      if (!Render.ready()) return true;
      ProjectUI.reset();
      const info = G.info();
      return eq([info.active, info.handles, G.begin('rotate', 100, 100)], [false, 0, false]);
    });
  } finally {
    try { G.end(false); } catch (e) { /* no drag open */ }
    ProjectUI.reset();
    ProjectUI.restoreDefaults();
    Select.clear();
    Store.replace(savedState);
    Options.holdAutosave(false);
  }
  return results;
}

/* Extend runAllTests with the gizmo tests (the other test files stay as they are). */
runAllTests = ((base) => async function runAllWithGizmo() {
  const r = await base();
  const g = await runGizmoTests();
  const bad = g.filter((x) => !x.ok);
  r.results.push(...g);
  r.total += g.length;
  r.passed += g.length - bad.length;
  r.failed.push(...bad);
  console.log(`[tests] gizmo ${g.length - bad.length}/${g.length} passed`, bad.length ? JSON.stringify(bad) : '');
  return r;
})(runAllTests);

/* ==========================================================================
   TESTS: base elevation follows the ground (docs/site-base-style-technical-plan.md section 1.5) - Parking Deck
   The base elevation is the lowest ground under the building footprint (Follow ground), or the typed value (Typed).
   Uses its own in-memory sloped site project (z = 1000 + 0.01 x + 0.02 y on an 11 x 11 grid), so a ?test visit never touches the
   saved projects. runAllTests is extended at the end of this file (no edit of the other test files needed).
   ========================================================================== */
const BaseFixture = (() => {
  const S = 1000, N = 11, SPACING = 100;
  const memory = () => ({ data: {}, getItem(k) { return this.data[k] === undefined ? null : this.data[k]; }, setItem(k, v) { this.data[k] = String(v); }, removeItem(k) { delete this.data[k]; } });
  /** The ground by the rule the fixture grid was built with. */
  const groundAt = (x, y) => 1000 + 0.01 * Math.min(Math.max(x, 0), S) + 0.02 * Math.min(Math.max(y, 0), S);
  /** A 1000 ft site square with a sloping ground and one near building (base 1010, 40 ft high). */
  function siteDoc(withSite = true) {
    let doc = ProjectMod.newProject(withSite ? { name: 'Base fixture', frame: { kind: 'site', lat: 33.927, lon: -84.339, size: S } } : { name: 'Base fixture, no site' });
    if (!withSite) return doc;
    const points = [];
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) points.push([i * SPACING, j * SPACING, groundAt(i * SPACING, j * SPACING)]);
    const derived = {
      address: 'Fixture', lat: 33.927, lon: -84.339, size: S, release: 'test',
      boundary: [[0, 0], [S, 0], [S, S], [0, S]], ground: { spacing: SPACING, n: N, points },
      buildings: [{ id: 'near', outer: [[480, 380], [560, 380], [560, 420], [480, 420]], holes: [], base: 1010, height: 40, top: 1050, floors: 3, rule: 'data', name: 'Near' }],
      roads: { segments: [], pavement: [] }, walks: null, trees: [], water: { areas: [], lines: [] },
    };
    return ProjectMod.writeSection(doc, 'site', { tool: 'site', schema: 1, placement: { x: 0, y: 0, rotation: 0, baseZ: 0 }, state: { query: 'Fixture', lat: 33.927, lon: -84.339, size: S, release: 'test', walks: false }, derived });
  }
  return { memory, groundAt, siteDoc, S };
})();

async function runBaseTests() {
  const results = [];
  const eq = (a, b) => (JSON.stringify(a) === JSON.stringify(b) ? true : `got ${JSON.stringify(a)}, expected ${JSON.stringify(b)}`);
  const t = async (name, fn) => {
    let r;
    try { r = await fn(); } catch (e) { r = `threw ${e && e.message}`; }
    results.push({ name, ok: r === true, detail: r === true ? '' : String(r) });
  };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const G = PlacementGizmo;
  const savedState = Store.snapshot();
  Options.holdAutosave(true);
  const mem = BaseFixture.memory();
  ProjectUI.reset();
  ProjectUI.configure({ storage: mem, navigate: () => {}, updateUrl: () => {} });
  const HAS_CTX = false;
  const fresh = () => { Store.replace(fillDefaults(defaultState()), { resetHistory: true }); };
  const pl = () => Store.get('placement');
  const depth = () => Store.historyDepth();
  const r1 = (v) => Math.round(v * 10) / 10;
  /** The lowest ground under the footprint, found a second way: the four corners of the model box (the fixture ground is a plane). */
  const lowest = () => {
    const b = Derived.get().bounds.model, p = ProjectUI.placement();
    let low = Infinity;
    for (const [x, y] of [[b.minX, b.minY], [b.maxX, b.minY], [b.maxX, b.maxY], [b.minX, b.maxY]]) {
      const q = ProjectMod.toProject(p, [x, y]);
      low = Math.min(low, BaseFixture.groundAt(q[0], q[1]));
    }
    return r1(low);
  };
  const atOrigin = () => r1(BaseFixture.groundAt(pl().x, pl().y));
  /** An old save: the base was typed as 0, no baseMode key, the footprint far from the placement origin. */
  const oldSaveDoc = () => {
    const doc = BaseFixture.siteDoc(true);
    const st = fillDefaults(defaultState());
    const placement = { x: 600, y: 600, rotation: 180, baseZ: 0 };
    return ProjectMod.writeSection(doc, 'parking', { tool: 'parking', schema: CONFIG.projectSchema, placement, state: { ...st, placement }, derived: {} });
  };
  const openOld = async () => {
    fresh();
    const doc = oldSaveDoc();
    ProjectMod.saveProject(mem, doc);
    ProjectUI.openDoc(doc);
    await wait(300);
  };
  const ctxBase = () => {
    const b = (Store.get('context.blocks') || []).find((x) => x && x.site && x.h === 40);
    return b ? b.base : null;
  };
  const field = () => document.querySelector('[aria-label="Base elevation (ft) value"]');
  const chip = (mode) => document.querySelector(`#baseModeChips [data-base-mode="${mode}"]`);

  try {
    /* ---- 1. opening a project with a sloped site ---- */
    await openOld();

    await t('1. a project with a sloped site opens: baseZ is the lowest ground under the footprint, not the ground at the origin', () => {
      const z = pl().baseZ, low = lowest(), origin = atOrigin();
      return (Math.abs(z - low) <= 0.051 && Math.abs(origin - low) >= 1 && z !== 0 && Math.abs(z - ProjectUI.groundUnderFootprint()) <= 1e-9)
        || `baseZ ${z}, lowest ground under the footprint ${low}, ground at the origin ${origin}`;
    });

    await t('5. an old save without baseMode loads as follow', () => eq([pl().baseMode, ProjectUI.baseMode()], ['follow', 'follow']));

    await t('5. fillDefaults: a missing or unknown baseMode becomes follow, typed stays typed, no placement stays null', () => {
      const a = fillDefaults({ placement: { x: 1, y: 2, rotation: 0, baseZ: 3 } }).placement;
      const b = fillDefaults({ placement: { x: 1, y: 2, rotation: 0, baseZ: 3, baseMode: 'typed' } }).placement;
      const c = fillDefaults({ placement: { x: 1, y: 2, rotation: 0, baseZ: 3, baseMode: 'sideways' } }).placement;
      return eq([a.baseMode, b.baseMode, c.baseMode, fillDefaults({}).placement], ['follow', 'typed', 'follow', null]);
    });

    await t('1. the section written to the project keeps baseMode in the placement and the state', () => {
      ProjectUI.markDirty();
      const res = ProjectUI.flush();
      const sec = ProjectMod.getSection(ProjectUI.doc(), 'parking');
      return (res && res.ok !== false && sec && sec.placement.baseMode === 'follow' && sec.state.placement.baseMode === 'follow' && sec.placement.baseZ === pl().baseZ)
        || `section placement ${JSON.stringify(sec && sec.placement)}`;
    });

    if (HAS_CTX) {
      await t('6. the context blocks from the site keep their base relative to the new baseZ', () => {
        const base = ctxBase();
        return (base !== null && Math.abs(base - (1010 - pl().baseZ)) <= 0.02 && Store.get('context.fromSite') === true) || `block base ${base}, expected ${1010 - pl().baseZ}`;
      });
    }

    /* ---- 2. a footprint move: the base follows in the same undo step ---- */
    await t('2. a layout change (a wider footprint) moves the footprint: baseZ follows the footprint in the same undo step', () => {
      const before = { z: pl().baseZ, v: JSON.stringify(Store.get('footprint.width')) };
      const d0 = depth();
      Store.set('footprint.width', 600, { live: false });
      const z1 = pl().baseZ, low = lowest(), steps = depth() - d0;
      const moved = JSON.stringify(Store.get('footprint.width')) !== before.v;
      Store.undo();
      const back = pl().baseZ === before.z && JSON.stringify(Store.get('footprint.width')) === before.v;
      Store.redo();
      return (moved && z1 !== before.z && Math.abs(z1 - low) <= 0.051 && steps === 1 && back && pl().baseZ === z1)
        || `moved ${moved}, baseZ ${before.z} -> ${z1}, lowest ${low}, steps ${steps}, undo restores both ${back}`;
    });

    if (HAS_CTX) {
      await t('6. after the move the neighbors keep their base relative to the new baseZ, in the same step', () => {
        const base = ctxBase();
        return (base !== null && Math.abs(base - (1010 - pl().baseZ)) <= 0.02) || `block base ${base}, expected ${1010 - pl().baseZ}`;
      });
    }

    await t('2. a change that does not move the footprint leaves baseZ and the undo depth alone', () => {
      const z = pl().baseZ, d0 = depth();
      Store.set('bays.stallW', 9.5, { live: false });
      return eq([pl().baseZ, depth() - d0], [z, 1]);
    });

    /* ---- 3. typed mode ---- */
    await t('3. Typed: the same move leaves baseZ alone; switching back to Follow sets it', () => {
      ProjectUI.setBaseMode('typed');
      const typed = pl().baseMode, z0 = pl().baseZ;
      Store.set('footprint.width', 250, { live: false });
      const stayed = pl().baseZ === z0;
      const lowTyped = lowest();
      ProjectUI.setBaseMode('follow');
      const z2 = pl().baseZ;
      return (typed === 'typed' && stayed && Math.abs(lowTyped - z0) > 0.5 && pl().baseMode === 'follow' && Math.abs(z2 - lowTyped) <= 0.051)
        || `mode ${typed}, kept ${stayed}, baseZ ${z0} -> ${z2}, lowest ${lowTyped}`;
    });

    await t('3. Typed keeps a typed value through a footprint change; the typed field writes placement.baseZ', () => {
      ProjectUI.setBaseMode('typed');
      Store.set('placement.baseZ', 1234.5, { live: false });
      Store.set('footprint.width', 600, { live: false });
      const kept = pl().baseZ;
      ProjectUI.setBaseMode('follow');
      return eq([kept, pl().baseMode], [1234.5, 'follow']);
    });

    await t('3. followGround does nothing in Typed mode and reports no change', () => {
      ProjectUI.setBaseMode('typed');
      Store.set('placement.baseZ', 1111, { live: false });
      const changed = ProjectUI.followGround();
      const z = pl().baseZ;
      ProjectUI.setBaseMode('follow');
      return eq([changed, z], [false, 1111]);
    });

    /* ---- the Site tab control ---- */
    await t('3. the control: Follow ground and Typed chips, a read-only line in Follow, the typed field only in Typed', () => {
      Controls.refreshAll();
      const f = field(), line = document.getElementById('baseLine');
      if (!f || !line || !chip('follow') || !chip('typed')) return 'the control is missing';
      const followState = [chip('follow').getAttribute('aria-pressed'), chip('typed').getAttribute('aria-pressed'), f.closest('.when').hidden, line.closest('.when').hidden];
      const text = line.textContent;
      chip('typed').click();
      Controls.refreshAll();
      const typedState = [chip('follow').getAttribute('aria-pressed'), chip('typed').getAttribute('aria-pressed'), f.closest('.when').hidden, line.closest('.when').hidden];
      chip('follow').click();
      Controls.refreshAll();
      const backState = [pl().baseMode, f.closest('.when').hidden];
      const expectText = `Ground floor at ${(Math.round(pl().baseZ * 10) / 10).toLocaleString('en-US', { maximumFractionDigits: 1 })} ft above sea level.`;
      return (JSON.stringify(followState) === JSON.stringify(['true', 'false', true, false]) && text === expectText
        && JSON.stringify(typedState) === JSON.stringify(['false', 'true', false, true]) && JSON.stringify(backState) === JSON.stringify(['follow', true]))
        || `follow ${JSON.stringify(followState)} "${text}" (expected "${expectText}"), typed ${JSON.stringify(typedState)}, back ${JSON.stringify(backState)}`;
    });

    /* ---- 4. the gizmo release ---- */
    await t('4. the gizmo release in Follow mode uses the footprint rule, in ONE undo step', () => {
      if (!Render.ready()) return true;
      const p0 = { ...pl() };
      const pt = G.modelPoint();
      if (!pt) return 'no model point on screen';
      const d0 = depth();
      if (!G.begin('move', pt.x, pt.y)) return 'begin refused';
      G.move(pt.x + 100, pt.y);
      G.end();
      const p1 = { ...pl() };
      const rule = ProjectUI.groundUnderFootprint(p1);
      return (p1.x !== p0.x && Math.abs(p1.baseZ - lowest()) <= 0.06 && Math.abs(p1.baseZ - rule) <= 1e-9 && depth() - d0 === 1 && p1.baseMode === 'follow' && !Store.gestureActive())
        || `p0 ${JSON.stringify(p0)} p1 ${JSON.stringify(p1)} rule ${rule} lowest ${lowest()} steps ${depth() - d0}`;
    });

    await t('4. the gizmo release in Typed mode leaves baseZ and baseMode alone', () => {
      if (!Render.ready()) return true;
      ProjectUI.setBaseMode('typed');
      const p0 = { ...pl() };
      const pt = G.modelPoint();
      if (!pt) return 'no model point on screen';
      if (!G.begin('move', pt.x, pt.y)) return 'begin refused';
      G.move(pt.x - 60, pt.y);
      G.end();
      const p1 = { ...pl() };
      ProjectUI.setBaseMode('follow');
      return (p1.x !== p0.x && p1.baseZ === p0.baseZ && p1.baseMode === 'typed') || `p0 ${JSON.stringify(p0)} p1 ${JSON.stringify(p1)}`;
    });

    await t('4. a turn with the ring in Follow mode also follows the footprint', () => {
      if (!Render.ready()) return true;
      const p0 = { ...pl() };
      const a = G.ringPoint(0), b = G.ringPoint(90);
      if (!a || !b) return 'no ring point on screen';
      if (!G.begin('rotate', a.x, a.y)) return 'begin refused';
      G.move(b.x, b.y);
      G.end();
      const p1 = { ...pl() };
      return (p1.rotation !== p0.rotation && Math.abs(p1.baseZ - lowest()) <= 0.06) || `p0 ${JSON.stringify(p0)} p1 ${JSON.stringify(p1)} lowest ${lowest()}`;
    });

    /* ---- no site ground ---- */
    await t('2. without a site ground the base does not change (and Follow reports nothing to do)', async () => {
      fresh();
      let doc = BaseFixture.siteDoc(false);
      const st = fillDefaults(defaultState());
      const placement = { x: 0, y: 0, rotation: 0, baseZ: 7 };
      doc = ProjectMod.writeSection(doc, 'parking', { tool: 'parking', schema: CONFIG.projectSchema, placement, state: { ...st, placement }, derived: {} });
      ProjectMod.saveProject(mem, doc);
      ProjectUI.openDoc(doc);
      await wait(100);
      const z0 = pl().baseZ;
      Store.set('footprint.width', 600, { live: false });
      return eq([ProjectUI.groundUnderFootprint(), ProjectUI.followGround(), pl().baseZ, z0, pl().baseMode], [null, false, 7, 7, 'follow']);
    });

    await t('1. closing the project: nothing follows any more', () => {
      ProjectUI.close();
      return eq([ProjectUI.followGround(), ProjectUI.baseFor({ x: 0, y: 0, rotation: 0, baseZ: 0 })], [false, null]);
    });
  } finally {
    try { G.end(false); } catch (e) { /* no drag open */ }
    ProjectUI.reset();
    ProjectUI.restoreDefaults();
    Select.clear();
    Store.replace(savedState);
    Options.holdAutosave(false);
  }
  return results;
}
