/* ==========================================================================
   SHARED: units
   Feet-and-inches format, area format, and parsing of typed values.
   Feet and square feet only (version 1).
   ========================================================================== */
const Units = (() => {
  const grouped = (n, digits = 0) => n.toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits });

  /** 312.5 -> 312'-6"  (rounds to the nearest inch) */
  function formatFeetInches(ft) {
    if (typeof ft !== 'number' || !isFinite(ft)) return '—';
    const totalIn = Math.round(Math.abs(ft) * 12);
    const f = Math.floor(totalIn / 12), i = totalIn % 12;
    return `${ft < 0 && totalIn > 0 ? '-' : ''}${grouped(f)}'-${i}"`;
  }
  /** 100000 -> "100,000 sf" */
  function formatArea(sf) {
    if (typeof sf !== 'number' || !isFinite(sf)) return '—';
    return `${grouped(Math.round(sf) || 0)} sf`;
  }
  const formatInt = (n) => (typeof n === 'number' && isFinite(n)) ? grouped(Math.round(n) || 0) : '—';
  const formatRatio = (n, d = 2) => (typeof n === 'number' && isFinite(n)) ? grouped(n, d) : '—';
  const formatDeg = (n) => `${Math.round(n)}°`;

  /** Parse "10'-6\"", "10.5", "10'", "10' 6", "6\"", "10 ft 6 in", "10-6", "6 1/2\"" to feet. NaN when invalid. */
  function parseLength(input) {
    if (typeof input === 'number') return isFinite(input) ? input : NaN;
    let s = String(input == null ? '' : input).trim().toLowerCase();
    s = s.replace(/[, ]/g, '').replace(/[′’‘]/g, "'").replace(/[″“”]/g, '"').replace(/\s+/g, ' ');
    if (!s) return NaN;
    let sign = 1;
    if (s[0] === '-') { sign = -1; s = s.slice(1).trim(); } else if (s[0] === '+') { s = s.slice(1).trim(); }
    const NUM = '(\\d+\\.?\\d*|\\.\\d+)';
    if (new RegExp('^' + NUM + '$').test(s)) return sign * parseFloat(s);

    const parseInches = (t) => {
      t = t.trim().replace(/\s*(?:"|in\.?|inch|inches)$/, '').trim();
      if (t === '') return 0;
      let m;
      if ((m = t.match(new RegExp('^' + NUM + '$')))) return parseFloat(m[1]);
      if ((m = t.match(/^(\d+)\s*\/\s*(\d+)$/))) return +m[2] ? m[1] / m[2] : NaN;
      if ((m = t.match(new RegExp('^' + NUM + '\\s+(\\d+)\\s*/\\s*(\\d+)$')))) return +m[3] ? parseFloat(m[1]) + m[2] / m[3] : NaN;
      return NaN;
    };
    let m;
    if ((m = s.match(new RegExp('^' + NUM + "\\s*(?:'|ft\\.?|feet|foot)\\s*-?\\s*(.*)$")))) {
      const inch = parseInches(m[2]);
      return isNaN(inch) ? NaN : sign * (parseFloat(m[1]) + inch / 12);
    }
    if (/("|in\.?|inch|inches)$/.test(s)) {
      const inch = parseInches(s);
      return isNaN(inch) ? NaN : sign * inch / 12;
    }
    if ((m = s.match(new RegExp('^' + NUM + '\\s*-\\s*(.+)$')))) {   // architect shorthand: 10-6
      const inch = parseInches(m[2]);
      return isNaN(inch) ? NaN : sign * (parseFloat(m[1]) + inch / 12);
    }
    return NaN;
  }
  /** Plain number with optional unit decoration ("45°", "20%", "1,200 sf"). NaN when invalid. */
  function parseNumber(input) {
    if (typeof input === 'number') return isFinite(input) ? input : NaN;
    const s = String(input == null ? '' : input).replace(/[,\s°%]|sf$/gi, '');
    return /^[-+]?(\d+\.?\d*|\.\d+)$/.test(s) ? parseFloat(s) : NaN;
  }
  return { formatFeetInches, formatArea, formatInt, formatRatio, formatDeg, parseLength, parseNumber, grouped };
})();

/* ==========================================================================
   STATE
   The default state and fillDefaults (older, partial or imported states become complete).
   Schema: docs/parking-deck-technical-plan.md section 2. The default state and the presets come from
   src/parking/presets.js (PresetsMod). All lengths are feet, areas square feet, slopes fractions
   (percent on the screen), angles degrees. East = +x, north = +y. Cores, entries and the speed ramp
   are in the layout frame (origin at the south-west corner of the footprint's bounding rectangle).
   ========================================================================== */
const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const deepClone = (o) => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));
const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);

const RAMP_TYPES = ['single-helix', 'double-helix', 'speed', 'split', 'sloped-floor', 'none'];
const RAMP_LABELS = { 'single-helix': 'Single helix', 'double-helix': 'Double helix', speed: 'Speed ramp', split: 'Split-level', 'sloped-floor': 'Sloped floor', none: 'None' };
const SOURCE_LABELS = { standalone: 'Standalone deck', wrap: 'Wrap deck', podium: 'Podium parking' };
const SIDES = ['west', 'east', 'south', 'north'];

/** The default design: "Two-bay single helix, five levels" (plan section 8.1). 496 stalls, 378 sf per stall. */
function defaultState() { return PresetsMod.defaultState(); }

/** Fill every missing field from the defaults so older or partial states (presets, imports) are complete. */
function fillDefaults(src) {
  const s = isObj(src) ? deepClone(src) : {};
  const merge = (t, d) => {
    for (const k of Object.keys(d)) {
      if (t[k] === undefined) t[k] = deepClone(d[k]);
      else if (isObj(d[k]) && isObj(t[k])) merge(t[k], d[k]);
    }
  };
  const base = defaultState();
  const keepPlacement = s.placement;
  merge(s, base);
  if (keepPlacement === null || keepPlacement === undefined) s.placement = null;
  if (isObj(s.placement)) s.placement.baseMode = s.placement.baseMode === 'typed' ? 'typed' : 'follow';       // base elevation: Follow ground (default, and the migration for old saves) | Typed
  if (!['standalone', 'wrap', 'podium'].includes(s.source)) s.source = 'standalone';
  if (s.footprint.shape !== 'polygon') s.footprint.shape = 'rect';
  if (!Array.isArray(s.footprint.points)) s.footprint.points = [];
  s.footprint.points = s.footprint.points.filter((p) => Array.isArray(p) && isFinite(p[0]) && isFinite(p[1])).map((p) => [p[0], p[1]]);
  if (s.footprint.shape === 'polygon' && s.footprint.points.length < 3) s.footprint.shape = 'rect';
  s.levels.count = Math.round(clamp(num(s.levels.count, 5), 1, CONFIG.limits.maxLevels));
  s.levels.belowGrade = Math.round(clamp(num(s.levels.belowGrade, 0), 0, s.levels.count));
  s.levels.openTop = s.levels.openTop !== false;
  if (!RAMP_TYPES.includes(s.ramp.type)) s.ramp.type = 'single-helix';
  if (!['straight', 'circular'].includes(s.ramp.speed.shape)) s.ramp.speed.shape = 'straight';
  if (![8, 12, 16].includes(s.ramp.speed.segments)) s.ramp.speed.segments = 12;
  if (s.grid.span !== 'short') s.grid.span = 'long';
  if (!Array.isArray(s.cores)) s.cores = [];
  s.cores = s.cores.filter(isObj).map((c, i) => ({
    id: typeof c.id === 'string' && c.id ? c.id : `C${i + 1}`, kind: c.kind === 'elevator' ? 'elevator' : 'stair',
    x: num(c.x, 0), y: num(c.y, 0), w: num(c.w, c.kind === 'elevator' ? 10 : 22), d: num(c.d, c.kind === 'elevator' ? 10 : 12),
  })).slice(0, CONFIG.limits.maxCores);
  if (!Array.isArray(s.entries)) s.entries = [];
  s.entries = s.entries.filter(isObj).map((e, i) => ({
    id: typeof e.id === 'string' && e.id ? e.id : `N${i + 1}`, side: SIDES.includes(e.side) ? e.side : 'west', at: num(e.at, 0), width: num(e.width, 24),
  })).slice(0, CONFIG.limits.maxEntries);
  if (!['south', 'north', 'east', 'west'].includes(s.liner.side)) s.liner.side = 'south';
  if (!Array.isArray(s.liner.levels)) s.liner.levels = [1];
  if (!Array.isArray(s.accessible.table) || !s.accessible.table.length) s.accessible.table = deepClone(base.accessible.table);
  if (s.bike.mode !== 'count') s.bike.mode = 'per-units';
  if (s.bike.rack !== 'two-tier') s.bike.rack = 'single';
  const v = s.view;
  v.site = v.site !== false;                       // the project site layer (ground, roads, water, trees, neighbors); on unless switched off
  v.siteStyle = ['solid', 'glass', 'wireframe'].includes(v.siteStyle) ? v.siteStyle : 'solid';     // neighbor buildings in the site layer: solid, glass or wireframe
  if (v.colorBy !== 'slope') v.colorBy = 'kind';
  if (v.style !== 'diagram') v.style = 'model';
  v.level = Math.round(clamp(num(v.level, 0), 0, s.levels.count));
  v.snap = { on: v.snap.on !== false, grid: v.snap.grid === 5 ? 5 : 1 };
  v.shot = isObj(v.shot) ? v.shot : {};
  merge(v.shot, { title: true, date: true, metrics: true, mark: true });
  s.schema = CONFIG.schema;
  s.name = String(s.name || 'Option A').slice(0, 60);
  return s;
}

/** Saved options at an older schema step up here. Schema 1 is the first, so nothing changes yet. */
function migrateState(state /* , fromSchema */) { return state; }

/* SHARED: store. One state object; get/set by path, subscribe, undo/redo (50 steps). Live sets coalesce into one undo step on commit(). */
const Store = (() => {
  let state = defaultState();
  let version = 0;
  let gesture = null;                  // { base, path } while a live drag is open
  const past = [], future = [];
  const listeners = new Set();

  const clone = (o) => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const keysOf = (p) => (Array.isArray(p) ? p.map(String) : String(p == null ? '' : p).split('.').filter(Boolean));

  function getIn(root, ks) {
    let o = root;
    for (const k of ks) { if (o == null) return undefined; o = o[k]; }
    return o;
  }
  function setIn(root, ks, value) {
    let o = root;
    for (let i = 0; i < ks.length - 1; i++) {
      if (o[ks[i]] == null || typeof o[ks[i]] !== 'object') o[ks[i]] = /^\d+$/.test(ks[i + 1]) ? [] : {};
      o = o[ks[i]];
    }
    o[ks[ks.length - 1]] = value;
  }
  function notify(info) {
    version++;
    for (const fn of listeners) { try { fn(state, info); } catch (e) { console.error(e); } }
  }
  function pushHistory(snapshot) {
    past.push(snapshot);
    while (past.length > CONFIG.limits.maxHistory) past.shift();
    future.length = 0;
  }

  const get = (path) => getIn(state, keysOf(path));

  /** End a live gesture; it becomes a single undo step. */
  function commit() {
    if (!gesture) return false;
    const g = gesture; gesture = null;
    if (!same(g.base, state)) pushHistory(g.base);
    notify({ kind: 'commit', path: g.path, live: false });
    return true;
  }

  /** Set a value by dot path. opts.live = continuous drag (coalesced until commit()). opts.merge = no new undo step (it joins the one before). */
  function set(path, value, opts = {}) {
    const ks = keysOf(path);
    if (!ks.length) return replace(value);
    if (same(getIn(state, ks), value)) return false;
    const pathStr = ks.join('.');
    if (opts.live) {
      if (!gesture) gesture = { base: clone(state), path: pathStr };
    } else if (opts.merge) {
      if (gesture) commit();                 // follows another change: both undo together (the page keeps site neighbors in step with the placement)
    } else {
      if (gesture) commit();
      pushHistory(clone(state));
    }
    setIn(state, ks, (value !== null && typeof value === 'object') ? clone(value) : value);
    notify({ kind: 'set', path: pathStr, live: !!opts.live });
    return true;
  }
  function replace(next, opts = {}) {
    if (gesture) commit();
    if (opts.resetHistory) { past.length = 0; future.length = 0; } else pushHistory(clone(state));
    state = clone(next);
    notify({ kind: 'replace', path: '', live: false });
    return true;
  }
  function undo() {
    commit();
    if (!past.length) return false;
    future.push(clone(state));
    state = past.pop();
    notify({ kind: 'undo', path: '', live: false });
    return true;
  }
  function redo() {
    commit();
    if (!future.length) return false;
    past.push(clone(state));
    state = future.pop();
    notify({ kind: 'redo', path: '', live: false });
    return true;
  }
  function subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); }

  return {
    get, set, commit, replace, undo, redo, subscribe,
    raw: () => state,                         // live reference; treat as read-only
    snapshot: () => clone(state),
    version: () => version,
    canUndo: () => past.length > 0 || (gesture && !same(gesture.base, state)),
    canRedo: () => future.length > 0,
    gestureActive: () => !!gesture,
    gesturePath: () => (gesture ? gesture.path : ''),
    historyDepth: () => past.length,
  };
})();

/* ==========================================================================
   GEOMETRY HELPERS
   Small plan helpers shared by the pipeline, the renderer and the selection code.
   Rings are [[x, y], ...]. The layout frame belongs to the deck (origin at the south-west corner of the footprint's bounding
   rectangle); the local frame is the massing frame. built.frame.toLocal / toLayout convert points between them.
   ========================================================================== */
const ringArea = (ring) => { let a = 0; for (let i = 0, n = ring.length; i < n; i++) { const p = ring[i], q = ring[(i + 1) % n]; a += p[0] * q[1] - q[0] * p[1]; } return a / 2; };
const multiArea = (mp) => (mp || []).reduce((t, pc) => t + Math.abs(ringArea(pc.outer)) - (pc.holes || []).reduce((h, r) => h + Math.abs(ringArea(r)), 0), 0);
const rectRing = (x, y, w, d) => [[x, y], [x + w, y], [x + w, y + d], [x, y + d]];
const rnd = (v, k = 1000) => Math.round(v * k) / k;

/** Bounding box of a ring list, or null. */
function boxOfRings(rings) {
  const b = { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity };
  for (const r of rings || []) for (const q of r) { b.minX = Math.min(b.minX, q[0]); b.maxX = Math.max(b.maxX, q[0]); b.minY = Math.min(b.minY, q[1]); b.maxY = Math.max(b.maxY, q[1]); }
  return isFinite(b.minX) ? b : null;
}
const boxOfPolys = (polys) => boxOfRings((polys || []).map((p) => p.outer));
/** Metric reader: the modules return a number or { total | value | ratio }. */
function mv(row, d = 0) {
  if (typeof row === 'number' && isFinite(row)) return row;
  if (row && typeof row === 'object') for (const k of ['total', 'value', 'ratio', 'count']) if (typeof row[k] === 'number' && isFinite(row[k])) return row[k];
  return d;
}

/* ---- Clipper helpers (SCALE 1000, as in the layout module) ---------------------------- */
const CLIP_SCALE = 1000;
const clipPath = (ring) => ring.map((p) => ({ X: Math.round(p[0] * CLIP_SCALE), Y: Math.round(p[1] * CLIP_SCALE) }));
const clipRing = (path) => path.map((p) => [p.X / CLIP_SCALE, p.Y / CLIP_SCALE]);
function treeToPolys(tree) {
  const out = [];
  const visit = (node) => {
    for (const child of node.Childs()) {
      if (!child.IsHole()) {
        const poly = { outer: clipRing(child.Contour()), holes: [] };
        for (const hole of child.Childs()) { poly.holes.push(clipRing(hole.Contour())); visit(hole); }
        if (Math.abs(ringArea(poly.outer)) > 1e-6) out.push(poly);
      } else visit(child);
    }
  };
  visit(tree);
  return out;
}
/** Union ('union'), difference ('diff') or intersection ('and') of two lists of { outer, holes }. Non-zero fill. */
function clipPolys(subj, clip, op) {
  const L = globalThis.ClipperLib;
  const c = new L.Clipper();
  const add = (list, type) => {
    for (const p of list) {
      const outer = ringArea(p.outer) < 0 ? p.outer.slice().reverse() : p.outer;
      c.AddPath(clipPath(outer), type, true);
      for (const h of p.holes || []) c.AddPath(clipPath(ringArea(h) > 0 ? h.slice().reverse() : h), type, true);
    }
  };
  add(subj, L.PolyType.ptSubject);
  add(clip, L.PolyType.ptClip);
  const tree = new L.PolyTree();
  const type = op === 'diff' ? L.ClipType.ctDifference : op === 'and' ? L.ClipType.ctIntersection : L.ClipType.ctUnion;
  c.Execute(type, tree, L.PolyFillType.pftNonZero, L.PolyFillType.pftNonZero);
  return treeToPolys(tree);
}
/** A ring inset by `d` ft (Clipper offset, miter joins). Returns a ring or null. */
function insetRing(ring, d) {
  const L = globalThis.ClipperLib;
  const o = new L.ClipperOffset(10, 0.25);
  const path = clipPath(ringArea(ring) < 0 ? ring.slice().reverse() : ring);
  o.AddPath(path, L.JoinType.jtMiter, L.EndType.etClosedPolygon);
  const out = new L.Paths();
  o.Execute(out, -d * CLIP_SCALE);
  if (!out.length) return null;
  let best = out[0];
  for (const p of out) if (Math.abs(L.Clipper.Area(p)) > Math.abs(L.Clipper.Area(best))) best = p;
  return clipRing(best);
}

/* ==========================================================================
   PIPELINE
   state -> layout (bays, rows, stalls, cuts) -> ramps -> columns -> accessible group -> overlay -> metrics -> checks.
   One cached run per change. Every module is pure (src/parking/*); this file only calls them in order, merges the final
   stalls into the built levels (the exports and the project file read the final stalls), and normalizes what the page needs:
   the HUD numbers, the warnings, the cores with their issues, the bounds for framing, and the frame matrix.
   Never throws: a failure becomes one error warning and an empty deck.
   ========================================================================== */
const pt2 = (p) => (Array.isArray(p) ? [p[0], p[1]] : [p.x, p.y]);

/** MultiPoly from whatever a module gave: [{ outer, holes }], one ring, or a list of rings. */
function asMulti(v) {
  if (!Array.isArray(v) || !v.length) return [];
  if (Array.isArray(v[0]) && typeof v[0][0] === 'number') return [{ outer: v, holes: [] }];
  if (Array.isArray(v[0]) && Array.isArray(v[0][0])) return v.map((r) => ({ outer: r, holes: [] }));
  return v.filter((p) => p && Array.isArray(p.outer)).map((p) => ({ outer: p.outer, holes: p.holes || [] }));
}

/** The matrix that puts geometry authored in the layout frame (through planToWorld) into the massing frame. */
function frameMatrix(frame) {
  const o = pt2(frame.toLocal([0, 0])), ex = pt2(frame.toLocal([1, 0])), ey = pt2(frame.toLocal([0, 1]));
  const a = ex[0] - o[0], b = ex[1] - o[1], c = ey[0] - o[0], d = ey[1] - o[1];
  return new THREE.Matrix4().set(
    a, 0, -c, o[0],
    0, 1, 0, 0,
    -b, 0, d, -o[1],
    0, 0, 0, 1,
  );
}

/** Cores in the layout frame with a box each: from the layout result, else the state. */
function normalizeCores(state, raw) {
  const src = Array.isArray(raw.cores) && raw.cores.length ? raw.cores : state.cores;
  const out = [];
  (src || []).forEach((c, i) => {
    if (!c) return;
    let box = null;
    if (Array.isArray(c.outer) || Array.isArray(c.ring)) box = boxOfRings([c.outer || c.ring]);
    else if (isFinite(c.x) && isFinite(c.y)) box = { minX: c.x, maxX: c.x + num(c.w, c.kind === 'elevator' ? 10 : 22), minY: c.y, maxY: c.y + num(c.d, c.kind === 'elevator' ? 10 : 12) };
    if (!box) return;
    out.push({ id: String(c.id || `C${i + 1}`), kind: c.kind === 'elevator' ? 'elevator' : 'stair', box, fromProject: !!c.fromProject || c.source === 'project', inAisle: !!c.inAisle, outside: !!c.outside, hasFlags: c.inAisle !== undefined, w: box.maxX - box.minX, d: box.maxY - box.minY, x: box.minX, y: box.minY });
  });
  return out;
}
/** id -> 'aisle' | 'outside' for the cores that sit in a drive aisle or outside the plate on any level. */
function coreIssuesOf(cores, levels) {
  const issues = {};
  for (const c of cores) {
    if (c.hasFlags) { if (c.inAisle) issues[c.id] = 'aisle'; else if (c.outside) issues[c.id] = 'outside'; continue; }     // the layout already decided
    const ring = rectRing(c.box.minX, c.box.minY, c.w, c.d);
    for (const lv of levels) {
      try {
        const aisle = lv.aisles && lv.aisles.length ? multiArea(clipPolys([{ outer: ring, holes: [] }], lv.aisles, 'and')) : 0;
        if (aisle > 1) { issues[c.id] = 'aisle'; break; }
      } catch (e) { /* ignore */ }
    }
    if (!issues[c.id]) {
      const lv = levels[0];
      if (lv && lv.plate && lv.plate.length) {
        try { if (multiArea(clipPolys([{ outer: ring, holes: [] }], lv.plate, 'and')) < c.w * c.d - 1) issues[c.id] = 'outside'; } catch (e) { /* ignore */ }
      }
    }
  }
  return issues;
}

const SEVERITY_ORDER = { error: 0, warn: 1, info: 2 };
const mapWarning = (w) => ({ id: w.code || w.id, level: w.severity || w.level || 'warn', text: w.message || w.text, floors: w.levels || w.floors || [], action: w.action || null, ref: w.code ? (w.id || null) : null });
const sortWarnings = (list) => list.map((w, i) => [w, i]).sort((a, b) => ((SEVERITY_ORDER[a[0].level] ?? 1) - (SEVERITY_ORDER[b[0].level] ?? 1)) || (a[1] - b[1])).map((x) => x[0]);

function emptyDerived(message) {
  const frame = { W: 0, D: 0, toLocal: (p) => p, toLayout: (p) => p };
  const built = { frame, levels: [], bays: [], strip: null, cores: [], warnings: [] };
  return {
    ok: false, state: null, raw: built, built, levels: [], ramps: [], columns: { lines: [], points: [], module: 0 }, clear: [], acc: { stalls: [], lost: 0, warnings: [] },
    overlay: { conflicts: [], suggestion: null, source: 'none', unitWidth: 0, tolerance: 2, checked: 0 }, demising: [], metrics: null, cores: [], coreIssues: {},
    warnings: [{ id: 'internal', level: 'error', text: message || 'The layout could not be built for these settings.', floors: [] }],
    box: null, bounds: computeBoundsFor(null, built, []), frame, matrix: new THREE.Matrix4(), solids: [], wire: [], hud: hudOf(null, []),
  };
}

function computeBoundsFor(state, built, levels) {
  const box = () => ({ minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity });
  const model = box();
  let height = 0;
  for (const lv of levels) {
    height = Math.max(height, (lv.z || 0) + (lv.ftf || 0));
    for (const poly of lv.plate || []) for (const q of poly.outer) {
      const p = pt2(built.frame.toLocal(q));
      model.minX = Math.min(model.minX, p[0]); model.maxX = Math.max(model.maxX, p[0]); model.minY = Math.min(model.minY, p[1]); model.maxY = Math.max(model.maxY, p[1]);
    }
  }
  if (!isFinite(model.minX)) Object.assign(model, { minX: -50, maxX: 50, minY: -50, maxY: 50 });
  const h = Math.max(height + 9, 20);
  const b = { ...model, height: h };
  return { model: b, site: { ...model, height: h }, union: { ...model, height: h }, all: { ...model, height: h } };
}

/** The numbers the HUD, the screenshot and the compare table read, with fallbacks computed from the built levels. */
function hudOf(metrics, levels) {
  const m = metrics || {};
  const stalls = isFinite(m.stalls) ? m.stalls : levels.reduce((t, l) => t + (l.stalls || []).length, 0);
  const gross = isFinite(m.grossArea) ? m.grossArea : levels.reduce((t, l) => t + multiArea(l.plate), 0);
  return {
    stalls, sfPerStall: isFinite(m.sfPerStall) ? m.sfPerStall : (stalls ? Math.round(gross / stalls * 10) / 10 : 0), levels: isFinite(m.levels) ? m.levels : levels.length,
    maxSlope: isFinite(m.maxRampSlope) ? m.maxRampSlope : 0, gross, efficiency: m.efficiency || 0,
    required: m.required ? m.required.total : 0, balance: isFinite(m.balance) ? m.balance : 0,
    accessible: m.accessible || { required: 0, provided: 0, van: 0, car: 0, lost: 0 }, ev: m.ev || { installed: 0, ready: 0, targetInstalled: 0, targetReady: 0 },
    bike: m.bike || { required: 0, areaSf: 0 }, lowestClear: m.lowestClear || 0, clearHeights: m.clearHeights || [], conflicts: m.conflicts || 0,
    byKind: m.byKind || {}, byLevel: m.byLevel || [], topOfDeck: m.topOfDeck || 0, columns: m.columns || { perLevel: 0, total: 0, module: 0, conflicts: 0, source: 'none', suggestion: null },
    rampSlopes: m.rampSlopes || [],
  };
}

/** Everything the UI, the renderer, the exports and the compare view need for one state (no caching). */
function computeDerived(s, { project = null, quality = 'full' } = {}) {
  try {
    const raw = LayoutMod.layout(s, { project, quality });
    const ramps = RampsMod.rampsFor(s, raw);
    const columns = GridMod.columnsFor(s, raw);
    const clear = GridMod.clearHeights(s);
    const acc0 = AccessibleMod.placeAccessible(s, raw);
    const acc = { ...acc0, stalls: AccessibleMod.tagEv(s, acc0.stalls) };      // plan 3.7: EV installed = kind "ev", EV ready = evReady
    const byLevel = new Map();
    for (const st of acc.stalls) { if (!byLevel.has(st.level)) byLevel.set(st.level, []); byLevel.get(st.level).push(st); }
    const levels = raw.levels.map((lv) => ({
      ...lv, plate: asMulti(lv.plate), aisles: asMulti(lv.aisles), turnZones: asMulti(lv.turnZones),
      stalls: (byLevel.get(lv.index) || []),
    }));
    const built = { ...raw, levels, ramps, columns };
    let demising = [], demisingInfo = null;
    try { demisingInfo = OverlayMod.demisingLines(project, raw.frame); demising = demisingInfo.xs || []; } catch (e) { demisingInfo = null; }
    const ov = OverlayMod.overlay(s, built, project, columns);
    const metrics = MetricsMod.computeMetrics(s, built, ramps, columns, acc, project);
    const checks = MetricsMod.checks(s, built, ramps, metrics);
    const cores = normalizeCores(s, raw);
    const coreIssues = coreIssuesOf(cores, levels);
    const seen = new Set();
    const warnings = [];
    for (const w of [...(raw.warnings || []), ...(acc.warnings || []), ...checks]) {
      const key = `${w.code}|${w.message}`;
      if (seen.has(key)) continue;
      seen.add(key);
      warnings.push(mapWarning(w));
    }
    const box = boxOfRings(levels.flatMap((l) => l.plate.map((p) => p.outer)));
    return {
      ok: true, state: s, raw, built, levels, ramps, columns, clear, acc, overlay: ov, demising, demisingInfo, metrics, cores, coreIssues,
      warnings: sortWarnings(warnings), box, bounds: computeBoundsFor(s, built, levels), frame: raw.frame, matrix: frameMatrix(raw.frame),
      solids: [], wire: [], hud: hudOf(metrics, levels),
    };
  } catch (e) {
    console.error(e);
    return emptyDerived('The layout could not be built for these settings.');
  }
}

const Derived = (() => {
  let gKey = null, geomId = 0, counter = 0, cache = null;
  // Geometry key: everything that changes the build or the numbers. The name, the view and the placement only change drawing.
  const geomKeyOf = (s) => JSON.stringify([s.source, s.sourceLevel, s.footprint, s.levels, s.bays, s.grid, s.ramp, s.cores, s.coresFromProject, s.entries, s.liner, s.checks, s.accessible, s.ev, s.bike, s.required]);
  function get() {
    const s = Store.raw();
    const pk = ProjectUI.dataKey();
    const gk = geomKeyOf(s) + '|' + pk;
    if (gk !== gKey || !cache) {
      gKey = gk; geomId++;
      cache = { id: ++counter, geomId, ...computeDerived(s, { project: ProjectUI.dataDoc() }) };
    }
    return cache;
  }
  /** What to draw. While a geometry edit drags the draft quality is drawn: rows as strips, no columns (plan section 6). */
  function display(draft) {
    const d = get();
    return { key: `${draft ? 'd' : 'f'}${d.geomId}`, quality: draft ? 'draft' : 'full' };
  }
  return { get, display };
})();

/* ==========================================================================
   OVERLAYS  (flat text labels and lines laid on the deck)
   Objects are plain three.js lines and meshes. Each one owns its material (userData.ownMat), so the renderer
   disposes it when the layer is rebuilt. Text is drawn into a canvas and laid flat on a plane that has a size in feet,
   so it stays readable in plan and shrinks with distance in the axon view.
   ========================================================================== */
const Overlays = (() => {
  const rootCss = (name, fb) => { const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); return new THREE.Color(v || fb); };
  const W = (p, z) => planToWorld(p[0], p[1], z);
  const fmtN = (n) => Math.round(n).toLocaleString('en-US');
  const SEED_COLORS = { stair: '#d9731a', 'exterior-stair': '#d9a22b', elevator: '#7a5cc2' };

  function lines(pos, { color, opacity = 1, dashed = false, order = 4, dash = 4, gap = 3 }) {
    if (!pos.length) return null;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    const mat = dashed
      ? new THREE.LineDashedMaterial({ color, transparent: opacity < 1, opacity, dashSize: dash, gapSize: gap, depthWrite: false })
      : new THREE.LineBasicMaterial({ color, transparent: opacity < 1, opacity, depthWrite: false });
    const ls = new THREE.LineSegments(geo, mat);
    ls.renderOrder = order; ls.frustumCulled = false; ls.userData.ownMat = true;
    if (dashed) ls.computeLineDistances();
    return ls;
  }
  const loopPos = (pos, ring, z) => { for (let i = 0; i < ring.length; i++) pos.push(...W(ring[i], z), ...W(ring[(i + 1) % ring.length], z)); };

  /** Text lying flat on the plan at (x, y, z). `height` is the height of one line of text in feet. */
  function label(text, x, y, z, { height = 5, color = '#1d2733', halo = '#ffffff' } = {}) {
    const rows = String(text).split('\n');
    const px = 48, pad = 12;
    const cv = document.createElement('canvas');
    const ctx0 = cv.getContext('2d');
    ctx0.font = `600 ${px}px system-ui, -apple-system, Segoe UI, sans-serif`;
    const widest = Math.max(...rows.map((r) => ctx0.measureText(r).width));
    cv.width = Math.ceil(widest + pad * 2); cv.height = Math.ceil(rows.length * px * 1.2 + pad * 2);
    const ctx = cv.getContext('2d');
    ctx.font = `600 ${px}px system-ui, -apple-system, Segoe UI, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    rows.forEach((r, i) => {
      const yy = pad + px * 0.6 + i * px * 1.2;
      ctx.lineWidth = 9; ctx.strokeStyle = halo; ctx.strokeText(r, cv.width / 2, yy);
      ctx.fillStyle = color; ctx.fillText(r, cv.width / 2, yy);
    });
    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
    const hh = height * rows.length * 1.2 + (height * 2 * pad) / px, ww = (hh * cv.width) / cv.height;
    const geo = new THREE.PlaneGeometry(ww, hh);
    geo.translate(x, y, 0);
    geo.applyMatrix4(planMatrix(z));
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.renderOrder = 6; mesh.frustumCulled = false; mesh.userData.ownMat = true; mesh.userData.label = text;
    return mesh;
  }

  return { label, lines, loopPos };
})();

/* ==========================================================================
   DECK 3D
   Builds the three.js objects of a parking deck from one Derived result (plan section 6):
     slabs (1 ft thick, one per level, sloped pieces for helix and sloped-floor bays), stall lines and (Diagram style) stall fills,
     ramps, columns, cores, barriers, plus the overlay layer (entry lanes, ramp arrows, slope labels, demising lines, stall numbers).
   Everything is authored in the LAYOUT frame, in plan feet, through planToWorld; the Render layer's matrix (frameMatrix) puts the
   group in the massing frame. Materials come from the renderer: mats.mesh(key), mats.line(key).
   Draft quality (a drag in progress): rows are drawn as filled strips, not single stalls, and columns are skipped.
   ========================================================================== */
const Deck3D = (() => {
  const W3 = (x, y, e) => planToWorld(x, y, e);
  const BAND_TYPES = new Set(['single-helix', 'double-helix', 'sloped-floor']);
  const kindOfStall = (s) => (s && CONFIG.kindColors[s.kind] ? s.kind : 'standard');

  /* ---- ramp geometry helpers ---------------------------------------------------- */
  function rampBox(r) {
    const b = boxOfRings([(r.outer3d || []).map((p) => [p[0], p[1]])]);
    return b;
  }
  /** z = a x + b y + c through the corners of a ramp (a planar quad). */
  function rampPlane(r) {
    const pts = r.outer3d || [];
    if (pts.length < 3) return null;
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) for (let k = j + 1; k < pts.length; k++) {
      const p = pts[i], q = pts[j], s = pts[k];
      const ux = q[0] - p[0], uy = q[1] - p[1], uz = q[2] - p[2], vx = s[0] - p[0], vy = s[1] - p[1], vz = s[2] - p[2];
      const det = ux * vy - uy * vx;
      if (Math.abs(det) < 1e-6) continue;
      const a = (uz * vy - uy * vz) / det, b = (ux * vz - uz * vx) / det;
      return { a, b, c: p[2] - a * p[0] - b * p[1] };
    }
    return null;
  }

  /** The pieces of a level: the plate cut into flat landings, sloped runs and the rest. Used for slabs, fills and heights. */
  function levelPieces(D, lv) {
    const plate = lv.plate || [];
    const box = boxOfPolys(plate);
    const out = { box, bands: [], voids: [] };
    if (!box) return out;
    for (const r of D.ramps || []) {
      if (!r || !Array.isArray(r.outer3d) || r.outer3d.length < 3) continue;
      const rb = rampBox(r);
      if (!rb) continue;
      if (r.level === lv.index && BAND_TYPES.has(r.type)) {
        const plane = rampPlane(r);
        if (!plane) continue;
        out.bands.push({ ramp: r, plane, box: rb, west: plane.a * rb.minX + plane.b * ((rb.minY + rb.maxY) / 2) + plane.c, east: plane.a * rb.maxX + plane.b * ((rb.minY + rb.maxY) / 2) + plane.c });
      } else if ((r.type === 'speed' && (r.level === lv.index || r.level === lv.index - 1)) || (r.type === 'split' && r.level === lv.index)) {
        const ring = r.footprint || (r.outer3d.length === 4 ? r.outer3d.map((p) => [p[0], p[1]]) : null);
        if (ring) out.voids.push({ ramp: r, ring });
      }
    }
    return out;
  }
  /** Height function (layout x, y) -> z for a level: sloped inside a band, flat landings at the band's ends, the level surface elsewhere. */
  function heightFn(D, lv) {
    const pc = levelPieces(D, lv);
    return (x, y) => {
      for (const b of pc.bands) {
        if (y >= b.box.minY - 1e-6 && y <= b.box.maxY + 1e-6) {
          const xc = clamp(x, b.box.minX, b.box.maxX);
          return b.plane.a * xc + b.plane.b * y + b.plane.c;
        }
      }
      return lv.z;
    };
  }

  /* ---- geometry builders --------------------------------------------------------- */
  function extrude(polys, z0, depth) {
    const shapes = polys.map((poly) => {
      const shape = new THREE.Shape(poly.outer.map((q) => new THREE.Vector2(q[0], q[1])));
      for (const h of poly.holes || []) shape.holes.push(new THREE.Path(h.map((q) => new THREE.Vector2(q[0], q[1]))));
      return shape;
    });
    const geo = new THREE.ExtrudeGeometry(shapes, { depth: Math.max(0.05, depth), bevelEnabled: false, steps: 1, curveSegments: 1 });
    geo.deleteAttribute('uv');
    geo.applyMatrix4(planMatrix(z0));
    return geo;
  }
  /** Flat or height-mapped fill of polys (ShapeGeometry), `lift` ft above fn(x, y). */
  function fill(polys, fn, lift) {
    const shapes = polys.map((poly) => {
      const shape = new THREE.Shape(poly.outer.map((q) => new THREE.Vector2(q[0], q[1])));
      for (const h of poly.holes || []) shape.holes.push(new THREE.Path(h.map((q) => new THREE.Vector2(q[0], q[1]))));
      return shape;
    });
    const geo = new THREE.ShapeGeometry(shapes, 1);
    geo.deleteAttribute('uv'); geo.deleteAttribute('normal');
    const a = geo.getAttribute('position');
    for (let i = 0; i < a.count; i++) {
      const x = a.getX(i), y = a.getY(i);
      const p = W3(x, y, fn(x, y) + lift);
      a.setXYZ(i, p[0], p[1], p[2]);
    }
    a.needsUpdate = true;
    // ShapeGeometry faces +z in plan space; after the plan -> world map the winding flips, so draw double sided via the material
    geo.computeVertexNormals();
    return geo;
  }
  /** A closed prism from a 3D outline: top follows the outline, bottom is `t` ft lower. Quads are two triangles; other outlines are ear-clipped in plan. */
  function prism(outer3d, t) {
    let pts = outer3d.map((p) => [p[0], p[1], p[2]]);
    const flat = pts.map((p) => [p[0], p[1]]);
    if (ringArea(flat) < 0) pts = pts.reverse();
    const n = pts.length;
    const pos = [];
    const P = (p, dz) => W3(p[0], p[1], p[2] + dz);
    const tri = (a, b, c) => pos.push(...a, ...b, ...c);
    let tris;
    try { tris = n === 4 ? [[0, 1, 2], [0, 2, 3]] : ExportsMod.parkTriangulate(pts.map((p) => [p[0], p[1]])); } catch (e) { tris = n >= 3 ? Array.from({ length: n - 2 }, (_, i) => [0, i + 1, i + 2]) : []; }
    for (const [i, j, k] of tris) {
      tri(P(pts[i], 0), P(pts[j], 0), P(pts[k], 0));            // top
      tri(P(pts[i], -t), P(pts[k], -t), P(pts[j], -t));          // bottom
    }
    for (let i = 0; i < n; i++) {
      const a = pts[i], b = pts[(i + 1) % n];
      tri(P(a, -t), P(b, -t), P(b, 0)); tri(P(a, -t), P(b, 0), P(a, 0));
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.computeVertexNormals();
    return geo;
  }
  const boxGeo = (x0, y0, x1, y1, z0, z1) => {
    const geo = new THREE.BoxGeometry(Math.max(0.01, x1 - x0), Math.max(0.01, y1 - y0), Math.max(0.01, z1 - z0));
    geo.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
    geo.applyMatrix4(planMatrix(0));
    geo.deleteAttribute('uv');
    return geo;
  };
  const rectPoly = (x0, y0, x1, y1) => ({ outer: [[x0, y0], [x1, y0], [x1, y1], [x0, y1]], holes: [] });
  const within = (polys, rect) => (polys.length ? clipPolys(polys, [rect], 'and') : []);

  /* ---- slab, per level ---------------------------------------------------------------- */
  function slabGeos(D, lv) {
    const T = CONFIG.slabThickness;
    const pc = levelPieces(D, lv);
    const geos = [];
    const plate = lv.plate || [];
    if (!pc.box || !plate.length) return geos;
    const big = 1e5;
    let rest = plate;
    const cutters = [];
    for (const b of pc.bands) {
      cutters.push(rectPoly(pc.box.minX - 1, b.box.minY, pc.box.maxX + 1, b.box.maxY));
      const west = within(plate, rectPoly(pc.box.minX - 1, b.box.minY, b.box.minX, b.box.maxY));
      const east = within(plate, rectPoly(b.box.maxX, b.box.minY, pc.box.maxX + 1, b.box.maxY));
      if (west.length) geos.push(extrude(west, b.west - T, T));
      if (east.length) geos.push(extrude(east, b.east - T, T));
      geos.push(prism(b.ramp.outer3d, T));
    }
    for (const v of pc.voids) cutters.push({ outer: v.ring, holes: [] });
    if (cutters.length) rest = clipPolys(plate, cutters, 'diff');
    if (rest.length) geos.push(extrude(rest, lv.z - T, T));
    for (const v of pc.voids) {
      const r = v.ramp;
      if (r.level === lv.index && r.outer3d.length >= 3) geos.push(prism(r.outer3d, T));
    }
    void big;
    return geos;
  }

  /* ---- build ------------------------------------------------------------------------- */
  /**
   * D: the Derived result. disp: { quality: 'full' | 'draft' }. view: state.view. mats: { mesh(key), line(key) }.
   * → { model: [objects], overlay: [objects] } in the layout frame.
   */
  function build(D, state, disp, mats) {
    const view = state.view, diagram = view.style === 'diagram';
    const draft = disp.quality === 'draft';
    const only = view.level > 0 ? view.level : 0;
    const levels = (D.levels || []).filter((l) => !only || l.index === only);
    const model = [];
    const meshGroups = new Map();
    const pushMesh = (key, geo) => {
      if (!geo || !geo.getAttribute('position') || !geo.getAttribute('position').count) { if (geo) geo.dispose(); return; }
      if (!meshGroups.has(key)) meshGroups.set(key, []);
      meshGroups.get(key).push(geo);
    };
    const edgeGeos = [];
    const linePos = { stall: [], conflict: [] };
    const fillPos = new Map();     // kind -> positions
    const fillQuad = (kind, ring, fn, lift) => {
      if (!fillPos.has(kind)) fillPos.set(kind, []);
      const arr = fillPos.get(kind);
      const pts = ring.map((p) => W3(p[0], p[1], fn(p[0], p[1]) + lift));
      for (let i = 1; i + 1 < pts.length; i++) arr.push(...pts[0], ...pts[i], ...pts[i + 1]);
    };
    const ringLines = (arr, ring, fn, lift) => {
      for (let i = 0; i < ring.length; i++) {
        const a = ring[i], b = ring[(i + 1) % ring.length];
        arr.push(...W3(a[0], a[1], fn(a[0], a[1]) + lift), ...W3(b[0], b[1], fn(b[0], b[1]) + lift));
      }
    };
    const top = levels.length ? Math.max(...levels.map((l) => l.z + l.ftf)) : 0;
    const conflictKeys = new Set((D.overlay && D.overlay.conflicts ? D.overlay.conflicts : []).map((c) => `${rnd(c.column[0], 10)},${rnd(c.column[1], 10)}`));

    for (const lv of levels) {
      const fn = heightFn(D, lv);
      /* slab */
      for (const g of slabGeos(D, lv)) pushMesh(diagram ? 'slab-diagram' : 'slab', g);
      /* aisles and turn zones (Diagram style) */
      if (diagram && !draft) {
        const pc = levelPieces(D, lv);
        const asl = lv.aisles || [], tz = lv.turnZones || [];
        const pieces = (polys) => {
          if (!pc.bands.length) return [[polys, () => lv.z]];
          const out = [];
          let rest = polys;
          for (const b of pc.bands) {
            const rb = pc.box;
            const run = within(polys, rectPoly(b.box.minX, b.box.minY, b.box.maxX, b.box.maxY));
            const west = within(polys, rectPoly(rb.minX - 1, b.box.minY, b.box.minX, b.box.maxY));
            const east = within(polys, rectPoly(b.box.maxX, b.box.minY, rb.maxX + 1, b.box.maxY));
            if (run.length) out.push([run, (x, y) => b.plane.a * x + b.plane.b * y + b.plane.c]);
            if (west.length) out.push([west, () => b.west]);
            if (east.length) out.push([east, () => b.east]);
            rest = clipPolys(rest, [rectPoly(rb.minX - 1, b.box.minY, rb.maxX + 1, b.box.maxY)], 'diff');
          }
          if (rest.length) out.push([rest, () => lv.z]);
          return out;
        };
        for (const [polys, f] of pieces(asl)) pushMesh('aisle', fill(polys, f, 0.03));
        for (const [polys, f] of pieces(tz)) pushMesh('turn', fill(polys, f, 0.03));
      }
      /* stalls */
      if (draft) {
        const rows = new Map();
        for (const s of lv.stalls || []) {
          const key = `${s.bay}|${s.row}`;
          const b = rows.get(key) || { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity };
          for (const q of s.outer) { b.minX = Math.min(b.minX, q[0]); b.maxX = Math.max(b.maxX, q[0]); b.minY = Math.min(b.minY, q[1]); b.maxY = Math.max(b.maxY, q[1]); }
          rows.set(key, b);
        }
        for (const b of rows.values()) {
          const ring = [[b.minX, b.minY], [b.maxX, b.minY], [b.maxX, b.maxY], [b.minX, b.maxY]];
          fillQuad('standard', ring, fn, 0.04);
          ringLines(linePos.stall, ring, fn, 0.06);
        }
      } else {
        for (const s of lv.stalls || []) {
          const kind = kindOfStall(s);
          if (diagram && view.colorBy === 'kind') fillQuad(kind, s.outer, fn, 0.04);
          else if (diagram) fillQuad('standard', s.outer, fn, 0.04);
          else if (kind !== 'standard') fillQuad(kind, s.outer, fn, 0.04);
          ringLines(linePos.stall, s.outer, fn, 0.07);
        }
      }
      /* columns */
      if (!draft) {
        const pts = (D.columns && D.columns.points) || [];
        const c = num(state.grid.column, 2);
        const nextZ = (D.levels.find((l) => l.index === lv.index + 1) || {}).z;
        const isTop = nextZ === undefined;
        const z0 = lv.z, z1 = isTop ? lv.z + (state.levels.openTop ? 3 : lv.ftf - CONFIG.slabThickness) : nextZ - CONFIG.slabThickness;
        for (const p of pts) {
          const bad = conflictKeys.has(`${rnd(p[0], 10)},${rnd(p[1], 10)}`);
          pushMesh(bad ? 'column-bad' : 'column', boxGeo(p[0] - c / 2, p[1] - c / 2, p[0] + c / 2, p[1] + c / 2, Math.min(z0, fn(p[0], p[1])), Math.max(z0 + 1, z1)));
        }
      }
      /* barrier at the slab edge */
      const bh = num(state.checks.barrierProvided, 3.5);
      const thick = Math.max(0.4, num(state.footprint.perimeter, 1));
      for (const poly of lv.plate || []) {
        const inner = insetRing(poly.outer, thick);
        const wall = { outer: poly.outer, holes: inner ? [inner] : [] };
        if (inner) {
          // the wall rises from the slab top; on a helix level the landing heights differ, so it follows the level surface
          pushMesh('barrier', extrude([wall], lv.z, bh));
        }
      }
    }
    /* cores (whole height, all levels), drawn once */
    if (levels.length) {
      const zLow = Math.min(...levels.map((l) => l.z)) - CONFIG.slabThickness;
      for (const c of D.cores || []) {
        const issue = (D.coreIssues || {})[c.id];
        const key = issue ? 'core-bad' : `core-${c.kind}`;
        const b = c.box;
        pushMesh(key, boxGeo(b.minX, b.minY, b.maxX, b.maxY, zLow, top + (state.levels.openTop ? 9 : 0)));
      }
    }

    /* merge the mesh groups */
    for (const [key, geos] of meshGroups) {
      const merged = geos.length === 1 ? geos[0] : BufferGeometryUtils.mergeGeometries(geos, false);
      if (geos.length > 1) geos.forEach((g) => g.dispose());
      if (!merged) continue;
      const mesh = new THREE.Mesh(merged, mats.mesh(key));
      mesh.userData.model = true;
      mesh.userData.key = key;
      if (key === 'aisle' || key === 'turn') { mesh.renderOrder = 1; mesh.userData.model = false; }
      model.push(mesh);
      const edged = key === 'slab' || key === 'slab-diagram' || key === 'column' || key === 'column-bad' || key.startsWith('core') || key === 'barrier';
      if (edged && !(draft && key === 'barrier')) {
        const edge = new THREE.LineSegments(new THREE.EdgesGeometry(merged, 20), mats.line('edge'));
        edge.userData.edge = true;
        model.push(edge);
      }
    }
    /* stall fills */
    for (const [kind, pos] of fillPos) {
      if (!pos.length) continue;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      const mesh = new THREE.Mesh(geo, mats.mesh(`kind:${kind}`));
      mesh.renderOrder = 2; mesh.frustumCulled = false;
      model.push(mesh);
    }
    if (linePos.stall.length) {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(linePos.stall, 3));
      const ls = new THREE.LineSegments(geo, mats.line(diagram ? 'stall-diagram' : 'stall'));
      ls.renderOrder = 3; ls.frustumCulled = false;
      model.push(ls);
    }
    /* ramps coloured by slope (Diagram style): a thin tint over the sloped top */
    if (diagram) {
      for (const r of D.ramps || []) {
        if (!only || r.level === only) {
          if (!Array.isArray(r.outer3d) || r.outer3d.length < 3) continue;
          const lim = r.limit || 1;
          const key = !r.ok ? 'over' : Math.abs(r.slope) > 0.8 * lim ? 'near' : 'ok';
          const g = prism(r.outer3d.map((p) => [p[0], p[1], p[2] + 0.02]), 0.02);
          g.userData = { slope: key };
          const m = new THREE.Mesh(g, mats.mesh(`slope:${key}`));
          m.renderOrder = 1;
          model.push(m);
        }
      }
    }
    return { model, overlay: buildOverlay(D, state, disp, levels, mats) };
  }

  /* ---- overlay: entries, ramp arrows and labels, demising lines, stall numbers ------------ */
  function buildOverlay(D, state, disp, levels, mats) {
    const out = [];
    const view = state.view;
    if (disp.quality === 'draft') return out;
    const tag = (o) => { o.userData.plan = true; return o; };
    /* demising lines of the building above (thin orange), across the deck */
    if (view.overlay && D.demising && D.demising.length && D.box) {
      const topLv = levels.length ? levels[levels.length - 1] : null;
      const e = topLv ? topLv.z + topLv.ftf + 0.5 : 0.5;
      const pos = [];
      for (const x of D.demising) pos.push(...W3(x, D.box.minY, e), ...W3(x, D.box.maxY, e));
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      const ls = new THREE.LineSegments(geo, mats.line('demising'));
      ls.frustumCulled = false; ls.renderOrder = 5; ls.userData.keep = true;
      out.push(ls);
    }
    /* entries on the entry level: the lane and an arrow */

    changed = SiteLayer.update(layers.site, state, d, { syncLayer, clearGroup, cssColor, themeEpoch: () => themeEpoch }) || changed;     // the project site (06c_site.js)
    changed = syncLayer(layers.context, [v.style, v.context, ProjectUI.dataKey(), state.source, state.sourceLevel, state.levels.count].join('|'), () => buildContextObjects(state)) || changed;
    if (changed) { viewVersion = -1; needsRender = true; }
  }
  /** The plan labels show in the plan view and in Diagram style (never while a geometry slider drags). */
  let overlayVis = null;
  function syncOverlayVisibility(dragging) {
    const on = !dragging && (preset === 'plan' || Store.raw().view.style === 'diagram');
    const key = `${on}|${dragging}`;
    if (key === overlayVis) return;
    overlayVis = key;
    layers.overlay.group.visible = !cmp && !dragging;
    layers.overlay.group.children.forEach((o) => { o.visible = !o.userData.plan || on; });
    needsRender = true;
  }

  /** All model meshes in whatever is on screen (main layers or compare groups). */
  function eachModelMesh(fn) {
    const walk = (g) => g.children.forEach((o) => { if (o.userData.model) fn(o); });
    if (cmp) cmp.entries.forEach((e) => walk(e.group)); else { walk(layers.model.group); walk(layers.context.group); }
  }

  /* ---- per-frame view state (cheap) ------------------------------------------------ */
  function currentBounds() {
    if (cmp) return cmp.bounds;
    return Derived.get().bounds;
  }
  function updateSun(view) {
    const bb = currentBounds();
    if (!bb) return;
    const b = bb.all;
    const cx = (b.minX + b.maxX) / 2, cy = (b.minY + b.maxY) / 2, h = b.height;
    const ex = b.maxX - b.minX, ey = b.maxY - b.minY;
    const R = Math.max(60, 0.5 * Math.sqrt(ex * ex + ey * ey + h * h));
    const sunV = view.sun || {};
    const az = rad(num(sunV.azimuth, 135)), alt = rad(clamp(num(sunV.altitude, 40), 3, 90));
    const key = [cx, cy, h, R, az, alt].join('|');
    if (key === sunKey) return;
    sunKey = key;
    sceneRadius = R;
    // Azimuth is a compass bearing: 0 = north (plan +y), clockwise. Altitude is above the horizon.
    const dir = new THREE.Vector3(...planToWorld(Math.sin(az) * Math.cos(alt), Math.cos(az) * Math.cos(alt), Math.sin(alt)));
    const target = worldVec(cx, cy, h / 2);
    sun.target.position.copy(target);
    sun.position.copy(target).addScaledVector(dir, R * 2.5);
    const c = sun.shadow.camera;
    c.left = -R * 1.1; c.right = R * 1.1; c.top = R * 1.1; c.bottom = -R * 1.1;
    c.near = R * 1.2; c.far = R * 3.8;
    c.updateProjectionMatrix();
    sun.target.updateMatrixWorld();
    needsRender = true;
  }

  /** True while the site ground is on screen: the layer has one, it is switched on, and this is neither Compare nor an AI-ready capture. */
  const siteGroundOn = () => !cmp && !capturing && SiteLayer.info().ground;

  function applyView() {
    const s = Store.raw(), v = s.view;
    if (styleApplied !== v.style || themeApplied !== themeEpoch) refreshColors();
    const diagram = v.style === 'diagram';
    gridMesh.visible = !!v.grid;
    figure.visible = !!v.figure && !cmp;
    const shadowsOn = !diagram && !!v.shadows;
    // While a slider moves: casters off (no shadow pass work). Sun drags keep shadows so you can see them move.
    const dragging = Store.gestureActive() && !Store.gesturePath().startsWith('view.sun');
    const cast = shadowsOn && !dragging;
    // With a site ground on screen the flat slab drops under it, the grid fades, and shadows fall on the site ground (the 8,000 ft catcher hides).
    const siteGround = siteGroundOn();
    const bottom = siteGround ? SiteLayer.groundBottom() : null;
    ground.position.y = bottom == null ? 0 : bottom - SLAB_DROP;          // plan z is world y
    gridUniforms.uMinorA.value = GRID_MINOR_A * (siteGround ? GRID_SITE_FADE : 1);
    gridUniforms.uMajorA.value = GRID_MAJOR_A * (siteGround ? GRID_SITE_FADE : 1);
    shadowPlane.visible = shadowsOn && !siteGround;
    eachModelMesh((m) => { m.castShadow = cast; m.receiveShadow = shadowsOn; });
    SiteLayer3D.setShadows(layers.site.group.children, cast, shadowsOn);
    figure.traverse((o) => { if (o.isMesh) o.castShadow = cast; });
    // The figure stands near the front-left corner of the site (front = south, plan -y), on the site ground when there is one.
    if (derived) {
      const fx = derived.bounds.site.minX + 14, fy = derived.bounds.site.minY + 14;
      figure.position.copy(worldVec(fx, fy, (siteGround && SiteLayer.groundZ(fx, fy)) || 0));
    }
    updateSun(v);
    needsRender = true;
  }

  /* ---- cameras & views ------------------------------------------------------------- */
  const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const tanHalfFov = Math.tan(rad(FOV) / 2);

  function switchCamera(type) {
    if (type === camType) return;
    const target = controls.target;
    const offset = cam.position.clone().sub(target);
    const dist = offset.length();
    if (type === 'ortho') {
      ortho.zoom = (2 * ORTHO_HALF) / (2 * dist * tanHalfFov);
      ortho.position.copy(cam.position); ortho.quaternion.copy(cam.quaternion);
      cam = ortho;
    } else {
      const visible = (2 * ORTHO_HALF) / ortho.zoom;
      const d = visible / (2 * tanHalfFov);
      persp.position.copy(target).addScaledVector(offset.normalize(), d);
      persp.quaternion.copy(cam.quaternion);
      cam = persp;
    }

    cam.updateProjectionMatrix();

  function setCamAspect(a) {

  const hostAspect = () => Math.max(0.1, host.clientWidth) / Math.max(1, host.clientHeight);

  /** Space covered by floating panels; views are framed in the remaining area. */
  function applyViewOffset() {
    const w = host.clientWidth, hgt = host.clientHeight;
    const off = cmp ? 0 : clamp(insetProvider().right || 0, 0, w * 0.6) / 2;
    for (const c of [persp, ortho]) {
      if (off > 0) c.setViewOffset(w, hgt, off, 0, w, hgt); else c.clearViewOffset();
    }

  }

  /* ---- framing: every preset view fits the whole of what is on screen ---------------------- */
  const FIT_MARGIN = 0.05;      // empty fraction of the visible area on each side

  /** Plan extent + height of everything a view must show: plates, crown solids, the context. */
  function boxOf(d) {
    const u = d.bounds.union;
    const b = { minX: u.minX, maxX: u.maxX, minY: u.minY, maxY: u.maxY, height: u.height || 0 };
    const add = (x, y, z) => {
      if (x < b.minX) b.minX = x; if (x > b.maxX) b.maxX = x;
      if (y < b.minY) b.minY = y; if (y > b.maxY) b.maxY = y;
      if (z > b.height) b.height = z;
    };
    for (const s of d.solids || []) {
      if (s.kind === 'mesh') { const p = s.positions; for (let i = 0; i + 2 < p.length; i += 3) add(p[i], p[i + 1], p[i + 2]); }
      else for (const poly of s.polygons) for (const q of poly.outer) add(q[0], q[1], s.z1);
    }
    return b;
  }
  function framingBox(withSite = false) {
    if (cmp) {
      const bs = cmp.entries.map((e) => boxOf(e.d));
      return {
        minX: Math.min(...bs.map((x) => x.minX)), maxX: Math.max(...bs.map((x) => x.maxX)),
        minY: Math.min(...bs.map((x) => x.minY)), maxY: Math.max(...bs.map((x) => x.maxY)),
        height: Math.max(...bs.map((x) => x.height)),
      };
    }
    const b = boxOf(Derived.get());
    const sb = withSite ? SiteLayer.frameBox(Store.raw()) : null;       // Axon frames the building with a margin of max(150 ft, 0.6 x its larger plan span), clamped to the site square; the elevations and the plan keep the building box
    if (sb) Object.assign(b, SiteLayer3D.frameAround(b, sb));
    return b;
  }

  /** Perspective: the nearest distance (and the look-at point) that puts all box corners inside the visible area. */
  function fitPersp(box, dir, aspect, H) {
    const corners = [];
    for (const x of [box.minX, box.maxX]) for (const y of [box.minY, box.maxY]) for (const z of [0, H]) corners.push(worldVec(x, y, z));
    const fwd = dir.clone().negate();
    const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0)).normalize();
    const up = new THREE.Vector3().crossVectors(right, fwd).normalize();
    const fit = 1 - 2 * FIT_MARGIN;
    const tY = tanHalfFov, tX = tanHalfFov * aspect;
    const target = worldVec((box.minX + box.maxX) / 2, (box.minY + box.maxY) / 2, H / 2);
    const solve = () => {
      let dist = 1;
      for (const p of corners) {
        const v = p.clone().sub(target), dd = v.dot(dir);
        dist = Math.max(dist, dd + Math.abs(v.dot(right)) / (tX * fit), dd + Math.abs(v.dot(up)) / (tY * fit));
      }
      return dist;
    };
    let dist = solve();
    for (let i = 0; i < 6; i++) {            // centre the projected box in the visible area, then re-solve the distance
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (const p of corners) {
        const v = p.clone().sub(target), z = dist - v.dot(dir);
        const nx = v.dot(right) / (z * tX), ny = v.dot(up) / (z * tY);
        x0 = Math.min(x0, nx); x1 = Math.max(x1, nx); y0 = Math.min(y0, ny); y1 = Math.max(y1, ny);
      }
      target.addScaledVector(right, ((x0 + x1) / 2) * tX * dist).addScaledVector(up, ((y0 + y1) / 2) * tY * dist);
      dist = solve();
    }
    return { dist, target };
  }

  /** Where each preset puts the camera. Every view frames the whole box (see boxOf) with a small margin. */
  function viewTarget(id, box, aspect) {
    const H = Math.max(box.height, 20);
    const ex = box.maxX - box.minX, ey = box.maxY - box.minY;
    const cx = (box.minX + box.maxX) / 2, cy = (box.minY + box.maxY) / 2;
    const fit = 1 - 2 * FIT_MARGIN;
    if (id === 'axon') {
      const az = rad(135), el = rad(28);      // camera sits south-east, looking north-west
      const dirPlan = [Math.sin(az) * Math.cos(el), Math.cos(az) * Math.cos(el), Math.sin(el)];
      const dir = new THREE.Vector3(...planToWorld(...dirPlan)).normalize();
      const f = fitPersp(box, dir, aspect, H);
      return { type: 'persp', dist: f.dist, target: f.target, dir };
    }
    const reach = 0.55 * Math.sqrt(ex * ex + ey * ey + H * H);     // keeps the whole box in front of an orthographic camera
    if (id === 'plan') {
      const vis = Math.max(ey / fit, ex / (aspect * fit), 30);
      const e = 0.0008;     // tiny tilt toward the south keeps "north up" without a degenerate up-vector
      return {
        type: 'ortho', zoom: (2 * ORTHO_HALF) / vis, minDist: reach,
        target: worldVec(cx, cy, 0),
        dir: new THREE.Vector3(...planToWorld(0, -Math.sin(e), Math.cos(e))).normalize(),
      };
    }
    // Elevations: N = looking at the north face from the north, etc.
    const dirs = { n: [0, 1], e: [1, 0], s: [0, -1], w: [-1, 0] };
    const d = dirs[id];
    const along = (id === 'n' || id === 's') ? ex : ey;
    const vis = Math.max(H / fit, along / (aspect * fit), 40);
    return {
      type: 'ortho', zoom: (2 * ORTHO_HALF) / vis, minDist: reach,
      target: worldVec(cx, cy, H / 2),
      dir: new THREE.Vector3(...planToWorld(d[0], d[1], 0)).normalize(),
    };
  }

  function framingAspect() {
    if (cmp) {
      const r = cmpRects();
      return r.length ? r[0].w / r[0].h : hostAspect();
    }
    return Math.max(0.2, (host.clientWidth - clamp(insetProvider().right || 0, 0, host.clientWidth * 0.6)) / Math.max(1, host.clientHeight));
  }

  function setView(id, animate = true) {
    if (!renderer) return;
    const goal = viewTarget(id, framingBox(id === 'axon'), framingAspect());
    preset = id;
    overlayVis = null;
    tween = null;
    if (goal.type !== camType) switchCamera(goal.type);
    const curTarget = controls.target.clone();
    const curOffset = cam.position.clone().sub(curTarget);
    const curDist = Math.max(1, curOffset.length());
    const fromDir = curOffset.clone().normalize();
    const toDist = goal.type === 'persp' ? goal.dist : Math.max(curDist, goal.minDist || 0);
    const apply = (target, dir, dist, zoom) => {
      controls.target.copy(target);
      cam.position.copy(target).addScaledVector(dir, dist);
      if (camType === 'ortho') cam.zoom = zoom;
      cam.updateProjectionMatrix();
      controls.update();
    };
    if (!animate || reduceMotion) {
      apply(goal.target, goal.dir, toDist, goal.zoom);
    } else {
      tween = {
        t0: performance.now(), dur: 400,
        fromTarget: curTarget, toTarget: goal.target,
        fromDir, toDir: goal.dir, fromDist: curDist, toDist,
        fromZoom: cam.zoom, toZoom: goal.zoom || cam.zoom,
        q: new THREE.Quaternion().setFromUnitVectors(fromDir, goal.dir),
        apply,
      };
    }

    viewListeners.forEach((fn) => fn(preset));
  }

  function stepTween(now) {
    const k = tween;
    const p = clamp((now - k.t0) / k.dur, 0, 1), e = easeInOut(p);
    const target = k.fromTarget.clone().lerp(k.toTarget, e);
    const dir = k.fromDir.clone().applyQuaternion(new THREE.Quaternion().slerp(k.q, e)).normalize();
    const dist = k.fromDist + (k.toDist - k.fromDist) * e;
    const zoom = k.fromZoom * Math.pow(k.toZoom / k.fromZoom, e);
    k.apply(target, dir, dist, zoom);

    if (p >= 1) tween = null;
  }

  function updateClip() {
    const dist = cam.position.distanceTo(controls.target);

  }

  function resize() {
    if (!renderer) return;

    needsRender = true;
    if (cmp) renderCompare(renderer, scene, cam, false); else renderer.render(scene, cam);
    resizeListeners.forEach((fn) => fn());
  }

  /* ---- compare: one renderer, one camera, one viewport per option -------------------------- */
  const cmpReserve = () => (cmp && cmp.reserve ? cmp.reserve() : { top: 0, bottom: 0 });
  function cmpRects(W = host.clientWidth, H = host.clientHeight, reserve = cmpReserve(), gap = 2) {
    return compareRects(cmp ? cmp.entries.length : 0, W, H, reserve, gap);
  }
  /** Draws every option into its own cell. Also used by screenshots (reserve = none, scaled size). */
  function renderCompare(r, s, c, forCapture) {
    if (!cmp || !cmp.entries.length) { r.render(s, c); return; }
    const size = r.getSize(_v2);
    const W = size.x, H = size.y;
    const k = W / Math.max(1, host.clientWidth);
    const reserve = forCapture ? { top: 0, bottom: 0 } : cmpReserve();
    const rects = compareRects(cmp.entries.length, W, H, reserve, 2 * k);

    r.setViewport(0, 0, W, H);
    r.setClearColor(cssColor('--line'), 1);

    rects.forEach((rc, i) => {
      cmp.entries.forEach((e, j) => { e.group.visible = (i === j); });

      r.setViewport(x, y, w, h);

      r.render(s, c);

    r.setViewport(0, 0, W, H);

        minX: Math.min(...rs.map((r) => r.minX)), maxX: Math.max(...rs.map((r) => r.maxX)),
        minY: Math.min(...rs.map((r) => r.minY)), maxY: Math.max(...rs.map((r) => r.maxY)),
        height: Math.max(...rs.map((r) => r.height || 0)),
      };
    };
    return { model: merge('model'), site: merge('site'), union: merge('union'), all: merge('all') };
  }
  function syncCompare() {
    const s = Store.raw(), v = s.view;
    const key = [v.style, v.colorBy, v.level, v.context, cmp.entries.map((e) => e.uid).join(',')].join('|');
    if (key === cmp.key) return;
    cmp.key = key;
    for (const e of cmp.entries) {
      if (e.group) { clearGroup(e.group); scene.remove(e.group); }
      const st = { ...e.state, view: { ...v, overlay: false, stallNumbers: false } };
      const group = new THREE.Group();
      const sub = new THREE.Group();
      setFrame(sub, e.d);

    cmp = { entries: list, key: null, reserve, bounds: combineBounds(list.map((e) => e.d)) };

      if (moved || needsRender) { updateClip(); renderCompare(renderer, scene, cam, false); needsRender = false; }
      return;
    }
    const d = Derived.get();
    const state = Store.raw();

    const draft = Store.gestureActive() && !Store.gesturePath().startsWith('view');
    const disp = Derived.display(draft);
    const first = derived === null;
    if (d.geomId !== geomIdSeen) {
      if (!first) refitPending = true;                        // geometry changed: re-frame once the edit settles
      geomIdSeen = d.geomId;
    }
    derived = d;
    const sfk = SiteLayer.frameKey(Store.raw());

    siteFrameSeen = sfk;

    syncOverlayVisibility(disp.quality === 'draft');
    if (first && !preset) setView('axon', false);
    if (rebuildNotified !== d) { rebuildNotified = d; rebuildListeners.forEach((fn) => fn(d)); }
    if (refitPending && !Store.gestureActive()) { refitPending = false; if (preset) setView(preset, true); }
    if (viewVersion !== Store.version()) { viewVersion = Store.version(); applyView(); }
    if (moved || needsRender) {
      for (const fn of frameListeners) { try { fn(); } catch (e) { console.error(e); } }
      updateClip(); renderer.render(scene, cam); needsRender = false;
    }
  }

  /** Screenshot of what is on screen (main or compare). The HUD inset is removed so the model is centred. */
  async function capture(overlay, scale = 2) {
    if (!renderer) throw new Error('The 3D view is not available.');
    capturing = true;
    const overlayWas = selOverlay.visible;
    selOverlay.visible = false;
    try {
      for (const c of [persp, ortho]) c.clearViewOffset();
      return await ShotMod.captureView({
        renderer, scene, camera: cam, scale, overlay,
        render: cmp ? (r, s, c) => renderCompare(r, s, c, true) : undefined,
      });
    } finally {
      capturing = false;
      selOverlay.visible = overlayWas && !cmp;
      applyViewOffset();
      needsRender = true;
    }

  /** What was visible while captureClean drew its picture ({ site, boundary, arrow, grid, figure, overlay, ... }), or null before the first one. */
  let lastCapture = null;
  /** Hides the dashed site boundary and the north arrow inside the site layer. Returns the function that shows them again. */
  function hideSiteMarks() {
    const hid = [];
    for (const o of layers.site.group.children) {
      const k = o.userData && o.userData.kind;
      if ((k === 'site-boundary' || k === 'site-arrow') && o.visible) { o.visible = false; hid.push(o); }
    }
    return () => { for (const o of hid) o.visible = true; };
  }

  /** AI-ready picture (main view only): Model style, no grid / scale figure / overlay, a plain light sky and ground.

   *  Nothing in the store is touched: the live layers are hidden, a throwaway group is drawn, then everything is put back. */
  async function captureClean(scale = 2) {
    if (!renderer) throw new Error('The 3D view is not available.');
    if (cmp) throw new Error('Leave Compare to save an AI-ready image.');
    const state = Store.raw();
    const view = { ...state.view, style: 'model', overlay: false, stallNumbers: false };
    const st = { ...state, view };
    const d = Derived.get();
    const shadowsOn = !!view.shadows;
    const ctxMat = new THREE.MeshStandardMaterial({ color: new THREE.Color('#c9cdd2'), roughness: 0.95, metalness: 0 });
    const cap = new THREE.Group();
    const sub = new THREE.Group();
    setFrame(sub, d);
    const built = Deck3D.build(d, st, { quality: 'full', key: 'ai' }, { mesh: (k) => (k === 'slab' || k === 'slab-diagram' ? materialFor('slab') : materialFor(k)), line: lineMaterial });
    for (const o of built.model) {
      if (o.isMesh) { o.castShadow = shadowsOn; o.receiveShadow = shadowsOn; }
      sub.add(o);
    }
    cap.add(sub);
    for (const o of buildContextObjects(st)) {
      if (o.isMesh) { o.material = ctxMat; o.castShadow = shadowsOn; o.receiveShadow = shadowsOn; }
      cap.add(o);
    }
    const prev = {
      bg: scene.background, ground: ground.material.color.clone(), grid: gridMesh.visible, fig: figure.visible,
      model: layers.model.group.visible, ctx: layers.context.group.visible, ov: layers.overlay.group.visible, shadow: shadowPlane.visible,
      site: layers.site.group.visible, slabY: ground.position.y,
    };
    let showMarks = () => {};
    const restore = () => {
      scene.remove(cap);
      clearGroup(sub); clearGroup(cap);
      ctxMat.dispose();
      showMarks();
      scene.background = prev.bg;
      ground.material.color.copy(prev.ground);
      gridMesh.visible = prev.grid; figure.visible = prev.fig; shadowPlane.visible = prev.shadow;
      layers.model.group.visible = prev.model; layers.context.group.visible = prev.ctx; layers.overlay.group.visible = prev.ov;
      layers.site.group.visible = prev.site; ground.position.y = prev.slabY;

    };

    const overlayWas = selOverlay.visible;
    selOverlay.visible = false;
    let pending;
    try {
      // captureView draws and copies the frame before its first await, so the scene can be put back straight away.
      try {
        scene.add(cap);
        scene.background = new THREE.Color('#f3f5f7');
        ground.material.color.set('#e4e7ea');
        // The site layer stays on screen: the flat slab drops under its ground, as in the live view.
        const siteGround = layers.site.group.visible && SiteLayer.info().ground;
        const bottom = siteGround ? SiteLayer.groundBottom() : null;
        gridMesh.visible = false; figure.visible = false; shadowPlane.visible = shadowsOn && !siteGround;
        layers.model.group.visible = layers.context.group.visible = layers.overlay.group.visible = false;
        ground.position.y = bottom == null ? 0 : bottom - SLAB_DROP;
        showMarks = hideSiteMarks();
        lastCapture = {
          site: layers.site.group.visible, boundary: siteMarkFlag('site-boundary'), arrow: siteMarkFlag('site-arrow'),
          grid: gridMesh.visible, figure: figure.visible, overlay: selOverlay.visible || layers.overlay.group.visible,
          siteObjects: layers.site.group.children.filter((o) => o.visible).length,
        };
        for (const c of [persp, ortho]) c.clearViewOffset();

      } finally { restore(); }
    } finally {

      selOverlay.visible = overlayWas;
