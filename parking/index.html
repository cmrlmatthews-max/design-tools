    init, updateHud, rebuildPanel: () => { Controls.refreshAll(); },
    // test hooks: the section controllers, and a rebuild of the panel from the saved UI prefs (a simulated reload)
    sectionCtl, rebuildSections: () => { buildPanel(); setTab(activeTab, { remember: false }); Controls.refreshAll(); },
    // hooks for the selection card
    openItem, setTab, activeTab: () => activeTab, tabs: () => TABS.map((t) => t.id),
    moveCoreById, moveAllCoresToRows, makeCoresEditable,
    setHudOpen, hudOpen: () => $('hud').dataset.collapsed === 'false', sections: () => SECTIONS.map((s) => ({ id: s.id, tab: s.tab })),
  };
})();

/* SLOT: ai-prompts */
/* Filled: the entry is the AI Prompts item (#miAiPrompts) in the Export menu (UI.openExportMenu above); the panel and its logic are in 08b_prompts.js. */

/* ==========================================================================
   AI PROMPTS
   The prompt library (src/tower/prompts.js) is inlined with the other
   modules. Its text says "tower"; the filled text says "building" (textFor). `Prompts` is the panel: a right-hand drawer on desktop and iPad
   landscape, a full-height sheet on iPad portrait / narrow screens.
   Step 1 saves the AI-ready picture, step 2 copies the filled prompt.
   Custom prompts live in the options storage blob (key `prompts`).
   ========================================================================== */

const Prompts = (() => {
  const { PROMPT_FIELDS, PROMPTS, fillPrompt } = PromptsMod;
  const FIELD_ORDER = ['time', 'material', 'location', 'season'];
  const ROW_LABELS = { time: 'Time', material: 'Material', location: 'Context', season: 'Season' };
  /** The rows to show for a prompt: its pick fields in the panel order (Time, Material, Context, Season). */
  const rowKeys = (uses) => [...FIELD_ORDER.filter((k) => uses.includes(k)), ...uses.filter((k) => !FIELD_ORDER.includes(k))].filter((k) => PROMPT_FIELDS[k]);
  const AUTO = [['floors', 'Floors'], ['height', 'Height'], ['program', 'Program'], ['podium', 'Podium'], ['form', 'Form']];
  const FIELD_KEYS = Object.keys(PROMPT_FIELDS);
    const NUMBER_WORDS = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
  const TOKEN_HELP = 'Sentence slots: "The facade is {{material}}." · "The setting is {{location}}" · "photographed {{time}}" · ", {{season}}." From your design: {{floors}} {{height}} {{program}} {{podium}} {{form}}. Tick a choice below to show a row of chips for that slot. The fixed form-lock text is added in front of every prompt.';
  const STARTER = 'Make a photorealistic render of this {{height}} {{program}} building in {{location}} at {{time}}.';

  /* ---- auto fields, computed from the current option ------------------------------ */
  const articleFor = (phrase) => (/^(?:[aeio]|L-|8|11|18)/i.test(phrase) ? 'an' : 'a');
  const countWord = (n) => (n >= 0 && n < NUMBER_WORDS.length ? NUMBER_WORDS[n] : String(n));
  const oxford = (list) => (list.length <= 1 ? list.join('') : `${list.slice(0, -1).join(', ')} and ${list[list.length - 1]}`);

  /** "a five-level open parking deck with a single helix ramp" */
  function formPhrase(state, metrics) {
    const n = metrics.levels || state.levels.count;
    const ramp = { 'single-helix': 'a single helix ramp', 'double-helix': 'a double helix ramp', speed: 'a speed ramp', split: 'split-level end ramps', 'sloped-floor': 'a sloped parking floor', none: 'no ramp' }[state.ramp.type] || 'a ramp';
    const lead = state.source === 'wrap' ? `a ${countWord(n)}-level parking deck wrapped by a building` : state.source === 'podium' ? `a ${countWord(n)}-level parking podium under a building` : `a ${countWord(n)}-level ${state.levels.openTop ? 'open ' : ''}parking deck`;
    const withs = [ramp];
    if (state.liner && state.liner.on) withs.push('a retail liner');
    return `${lead} with ${oxford(withs)}`;
  }
  function podiumPhrase(state) {
    return state.source === 'podium' ? 'a parking podium' : state.source === 'wrap' ? 'a wrap deck' : 'no podium';
  }
  /** { floors, height, program, podium, form } for a state and its metrics. */
  function autoValues(state, metrics) {
    return {
      floors: String(metrics.levels || state.levels.count),
      height: `${Math.round(metrics.topOfDeck || 0)} feet`,
      program: 'open-air parking',
      podium: podiumPhrase(state),
      form: formPhrase(state, metrics),
      hero: PromptsMod.heroFor('parking', state, metrics),
    };
  }
  const currentAuto = () => autoValues(Store.raw(), Derived.get().hud);

  /* ---- prompts and values ---------------------------------------------------------- */
  const prefs = () => (uiPrefs.prompts = uiPrefs.prompts || {});
  const customList = () => Options.storage.listPrompts();
  const allPrompts = () => [...PROMPTS, ...customList()];
  const findPrompt = (id) => allPrompts().find((p) => p.id === id) || null;

  /** Menu value: field default, then the prompt's own default, then the user's last pick for THIS prompt (remembered per prompt id). */
  function fieldValue(prompt, key) {
    const f = PROMPT_FIELDS[key];
    const shown = !prompt || (prompt.uses || []).includes(key);       // a choice only counts where the prompt shows that menu
    const remembered = shown && prompt ? ((prefs().fields || {})[prompt.id] || {})[key] : null;
    if (remembered != null && f.options.some((o) => o.value === remembered)) return remembered;
    const d = prompt && prompt.defaults && prompt.defaults[key];
    if (d != null && f.options.some((o) => o.value === d)) return d;
    return f.default != null ? f.default : (f.options[0] || {}).value;
  }
  function rememberField(prompt, key, value) {
    const p = prefs();
    const all = p.fields || {};
    p.fields = { ...all, [prompt.id]: { ...(all[prompt.id] || {}), [key]: value } };
    saveUiPrefs(uiPrefs);
  }
  /** Auto fields plus every pick field (chosen where the prompt shows a menu for it, its default elsewhere). */
  function valuesFor(prompt, overrides) {
    const v = { ...currentAuto() };
    for (const k of FIELD_KEYS) v[k] = fieldValue(prompt, k);
    return { ...v, ...(overrides || {}) };
  }
  /** The library was written for towers; this tool draws parking decks. */
  const buildingWords = (t) => t.replace(/\btowers\b/g, 'parking decks').replace(/\bTowers\b/g, 'Parking decks').replace(/\btower\b/g, 'parking deck').replace(/\bTower\b/g, 'Parking deck');
  const textFor = (prompt, overrides) => buildingWords(fillPrompt(prompt, valuesFor(prompt, overrides)));
  const wordCount = (t) => (t.trim() ? t.trim().split(/\s+/).length : 0);

  /* ---- view state ------------------------------------------------------------------ */
  // Mode 'lib': one of the built-in prompts is selected. Mode 'custom': the My prompts chip is on and a saved prompt is selected.
  const ui = { open: false, mode: null, editing: null, el: null, restoreFocus: null, raf: 0, busy: false, error: '' };
  const selectedId = (g) => (prefs().selected || {})[g];
  const currentMode = () => ui.mode || (prefs().group === 'custom' ? 'custom' : 'lib');
  function currentPrompt() {
    if (currentMode() === 'custom') {
      const list = customList();
      return list.find((p) => p.id === selectedId('custom')) || list[0] || null;
    }
    return PROMPTS.find((p) => p.id === selectedId('lib')) || PROMPTS[0] || null;     // a fresh profile starts on the Hero render
  }
  /** select('custom', id) picks a saved prompt; select(any other word, id) picks a built-in prompt. */
  function select(group, id) {
    const custom = group === 'custom';
    const p = prefs();
    p.group = custom ? 'custom' : 'lib';
    p.selected = { ...(p.selected || {}), [custom ? 'custom' : 'lib']: id };
    ui.mode = custom ? 'custom' : 'lib';
    saveUiPrefs(uiPrefs);
  }
  /** The prompt the preview and Copy use: the draft while editing, else the selected one. */
  function activePrompt() {
    if (ui.editing) return { id: ui.editing.id || 'draft', group: 'custom', title: ui.editing.title, template: ui.editing.template, uses: ui.editing.uses, defaults: {} };
    return currentPrompt();
  }
  const activeText = () => { const p = activePrompt(); return p ? textFor(p) : ''; };

  /* ---- notices: inside the panel while it is open (the 3D view's toasts sit beneath it) --------- */
  function notify(message, kind = '') {
    if (!ui.open || !ui.toasts) { Toast.show(message, kind); return; }
    const t = h('div', { class: `toast ${kind}`.trim(), role: 'status' }, message);
    ui.toasts.append(t);
    setTimeout(() => t.remove(), 3200);
  }

  /* ---- clipboard ------------------------------------------------------------------------------ */
  function selectAll(ta, text) {
    try { ta.focus({ preventScroll: true }); ta.select(); ta.setSelectionRange(0, text.length); } catch (e) { /* ignore */ }
  }
  async function copyPrompt() {
    const text = activeText();
    if (!text) { notify('Pick a prompt first.', 'warn'); return false; }
    try {
      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        await navigator.clipboard.writeText(text);
        notify('Prompt copied.');
        return true;
      }
    } catch (e) { /* fall back to select + copy */ }
    let ta = ui.preview;
    let temp = false;
    if (!ta || !ta.isConnected || !ui.open) { ta = h('textarea', { readonly: true, style: 'position:fixed;left:-9999px;top:0;opacity:0' }); document.body.append(ta); temp = true; }
    ta.value = text;
    selectAll(ta, text);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    if (temp) ta.remove();
    if (ok) { notify('Prompt copied.'); return true; }
    if (!temp) selectAll(ta, text);
    notify('Select and copy the text.', 'warn');
    return false;
  }

  async function saveImage() {
    if (ui.busy) return null;
    ui.busy = true; syncSteps();
    try { return await Shots.takeAiReady(); } finally { ui.busy = false; syncSteps(); }
  }

  /* ---- custom prompts -------------------------------------------------------------------------- */
  const uniqueTitle = (title, exceptId) => StorageMod.uniqueName(title, customList().filter((p) => p.id !== exceptId).map((p) => p.title));
  function startNew() {
    ui.error = '';
    ui.editing = { id: null, title: StorageMod.uniqueName('New prompt', customList().map((p) => p.title)), template: STARTER, uses: ['location', 'time'], focus: 'title' };
    ui.mode = 'custom';
    render();
  }
  function startEdit(p) {
    ui.error = '';
    ui.editing = { id: p.id, title: p.title, template: p.template, uses: [...(p.uses || [])], focus: 'template' };
    render();
  }
  function duplicateToEdit(p) {
    ui.error = '';
    ui.editing = { id: null, title: StorageMod.uniqueName(`${p.title} (copy)`, customList().map((x) => x.title)), template: p.template, uses: [...(p.uses || [])], focus: 'title' };
    ui.mode = 'custom';
    render();
    notify('Copied to My prompts. Change it and press Save.');
  }
  function saveEditing() {
    const e = ui.editing;
    if (!e) return null;
    const title = e.title.trim();
    if (!title) { ui.error = 'Give the prompt a title.'; render(); return null; }
    if (!e.template.trim()) { ui.error = 'Write the prompt text.'; render(); return null; }
    const rec = Options.storage.savePrompt({ id: e.id || undefined, title: uniqueTitle(title, e.id), template: e.template, uses: e.uses.filter((k) => FIELD_KEYS.includes(k)) });
    if (!rec) { ui.error = 'The prompt could not be saved.'; render(); return null; }
    ui.editing = null; ui.error = '';
    select('custom', rec.id);
    render();
    notify('Prompt saved.');
    return rec;
  }
  function cancelEditing() { ui.editing = null; ui.error = ''; render(); }
  async function removePrompt(p) {
    const ok = await confirmDialog(`Delete the prompt “${p.title}”? This cannot be undone.`, 'Delete', true);
    if (!ok) return false;
    Options.storage.removePrompt(p.id);
    render();
    notify('Prompt deleted.');
    return true;
  }

  /* ---- DOM --------------------------------------------------------------------------------------- */
  function build() {
    const back = h('div', { class: 'ai-back', id: 'aiBack', hidden: true });
    back.addEventListener('pointerdown', () => close());
    const closeBtn = h('button', { class: 'ibtn', type: 'button', 'aria-label': 'Close AI Prompts', title: 'Close (Esc)', html: ICON_X, onclick: () => close() });
    ui.saveBtn = h('button', { class: 'btn outline step', type: 'button', id: 'aiStepImage', onclick: () => saveImage() }, '1. Save AI-ready image');
    ui.copyBtn = h('button', { class: 'btn solid step', type: 'button', id: 'aiStepCopy', onclick: () => copyPrompt() }, '2. Copy prompt');
    ui.body = h('div', { class: 'ai-body', id: 'aiBody' });
    ui.toasts = h('div', { class: 'ai-toasts', 'aria-live': 'polite' });
    const panel = h('aside', { class: 'ai-panel', id: 'aiPanel', role: 'dialog', 'aria-label': 'AI Prompts', 'aria-modal': 'false', 'data-open': 'false', 'aria-hidden': 'true', tabindex: '-1' },
      h('header', { class: 'ai-head' }, h('h2', null, 'AI Prompts'), closeBtn),
      h('div', { class: 'ai-steps' },
        h('div', { class: 'ai-step-row' }, ui.saveBtn, ui.copyBtn),
        h('p', { class: 'help' }, 'Paste the image and the prompt into ChatGPT or Gemini.')),
      ui.body, ui.toasts);
    document.body.append(back, panel);
    ui.back = back; ui.el = panel;
  }
  function syncSteps() { if (ui.saveBtn) { ui.saveBtn.disabled = ui.busy; ui.saveBtn.textContent = ui.busy ? 'Saving image…' : '1. Save AI-ready image'; } }

  /* The Prompt row: one chip per built-in prompt (the Hero render first) and a My prompts chip at the end. */
  function promptRowEl() {
    const mode = currentMode(), cur = currentPrompt();
    const chips = h('div', { class: 'chips', role: 'group', 'aria-label': 'Prompt', id: 'aiPromptRow' });
    for (const p of PROMPTS) {
      chips.append(h('button', {
        class: 'chip', type: 'button', 'aria-pressed': String(mode === 'lib' && !ui.editing && !!cur && cur.id === p.id), 'data-id': p.id, 'data-group': p.group,
        onclick: () => { ui.editing = null; select('lib', p.id); render(); },
      }, p.title));
    }
    chips.append(h('button', {
      class: 'chip ai-mine', type: 'button', id: 'aiMine', 'aria-pressed': String(mode === 'custom'),
      onclick: () => { ui.editing = null; select('custom', selectedId('custom')); render(); },
    }, 'My prompts'));
    return h('div', { class: 'ai-row' }, h('div', { class: 'ai-row-label' }, 'Prompt'), chips);
  }

  /* The My prompts row: the saved prompts as chips and a New prompt chip. Only while the My prompts chip is on. */
  function customRowEl() {
    if (currentMode() !== 'custom') return null;
    const list = customList(), cur = currentPrompt();
    const chips = h('div', { class: 'chips', role: 'group', 'aria-label': 'My prompts', id: 'aiCustomRow' });
    for (const p of list) {
      chips.append(h('button', {
        class: 'chip', type: 'button', 'aria-pressed': String(ui.editing ? ui.editing.id === p.id : !!cur && cur.id === p.id), 'data-id': p.id,
        onclick: () => { ui.editing = null; select('custom', p.id); render(); },
      }, p.title));
    }
    if (ui.editing && !ui.editing.id) chips.append(h('span', { class: 'chip is-draft', 'aria-pressed': 'true' }, ui.editing.title || 'New prompt'));
    chips.append(h('button', { class: 'chip ai-new', type: 'button', id: 'aiNew', onclick: startNew }, '+ New prompt'));
    const row = h('div', { class: 'ai-row' }, h('div', { class: 'ai-row-label' }, 'Mine'), chips);
    if (!list.length && !ui.editing) row.append(h('p', { class: 'help ai-empty' }, 'Nothing here yet. Use New prompt, or pick a built-in prompt and press Duplicate to edit.'));
    return row;
  }

  /* One chip row per field the prompt uses (Time, Material, Context, Season). A pick is remembered for this prompt. */
  function fieldsEl(prompt, uses, onPick) {
    const wrap = h('div', { class: 'ai-fields' });
    for (const key of rowKeys(uses)) {
      const f = PROMPT_FIELDS[key];
      const label = ROW_LABELS[key] || f.label;
      const group = h('div', { class: 'chips', role: 'group', 'aria-label': label, id: `aiField-${key}`, 'data-field': key });
      const current = fieldValue(prompt, key);
      for (const o of f.options) {
        const b = h('button', { class: 'chip', type: 'button', 'aria-pressed': String(o.value === current), 'data-value': o.value }, o.label);
        b.addEventListener('click', () => {
          rememberField(prompt, key, o.value);
          for (const x of group.children) x.setAttribute('aria-pressed', String(x === b));
          if (onPick) onPick();
          updatePreview();
        });
        group.append(b);
      }
      wrap.append(h('div', { class: 'ai-row' }, h('div', { class: 'ai-row-label' }, label), group));
    }
    return wrap;
  }

  function autoEl() {
    const wrap = h('div', { class: 'ai-auto', id: 'aiAuto' });
    wrap.append(h('div', { class: 'label' }, 'From your design'));
    const chips = h('div', { class: 'ai-chips' });
    ui.chips = {};
    for (const [k, label] of AUTO) {
      const v = h('span', { class: 'v' });
      ui.chips[k] = v;
      chips.append(h('span', { class: `ai-chip${k === 'form' ? ' wide' : ''}`, 'data-auto': k }, h('span', { class: 'k' }, label), v));
    }
    wrap.append(chips);
    return wrap;
  }
  function updateChips() {
    if (!ui.chips) return;
    const a = currentAuto();
    for (const [k] of AUTO) if (ui.chips[k]) ui.chips[k].textContent = a[k];
  }

  function previewEl() {
    const wrap = h('div', { class: 'ai-preview-wrap' });
    ui.preview = h('textarea', { class: 'ai-preview', id: 'aiPreview', readonly: true, rows: '9', 'aria-label': 'Prompt preview', spellcheck: 'false' });
    ui.count = h('span', { class: 'ai-count', id: 'aiCount' });
    wrap.append(h('div', { class: 'sub-title' }, h('span', { class: 'label' }, 'Prompt preview'), ui.count), ui.preview);
    return wrap;
  }
  function updatePreview() {
    if (!ui.preview) return;
    const text = activeText();
    if (ui.preview.value !== text) ui.preview.value = text;
    if (ui.count) ui.count.textContent = `${wordCount(text)} words`;
    ui.copyBtn.disabled = !text;
  }

  function editorEl(refreshFields) {
    const e = ui.editing;
    const wrap = h('div', { class: 'ai-editor' });
    const title = h('input', { type: 'text', id: 'aiEditTitle', maxlength: '60', value: e.title, autocomplete: 'off', spellcheck: 'false', 'aria-label': 'Prompt title' });
    title.addEventListener('input', () => { e.title = title.value; updatePreview(); });
    const tpl = h('textarea', { id: 'aiEditTemplate', rows: '8', 'aria-label': 'Prompt text', spellcheck: 'true' });
    tpl.value = e.template;
    tpl.addEventListener('input', () => { e.template = tpl.value; updatePreview(); });
    wrap.append(
      h('div', { class: 'label' }, e.id ? 'Edit prompt' : 'New prompt'),
      h('label', { class: 'ai-lab', for: 'aiEditTitle' }, 'Title'), title,
      h('label', { class: 'ai-lab', for: 'aiEditTemplate' }, 'Prompt text'), tpl,
      h('p', { class: 'points-note', id: 'aiTokenHelp' }, TOKEN_HELP),
      h('div', { class: 'label' }, 'Choices to show'),
    );
    const uses = h('div', { class: 'ai-uses', role: 'group', 'aria-label': 'Choices to show' });
    for (const k of FIELD_KEYS) {
      const cb = h('input', { type: 'checkbox', id: `aiUse-${k}` });
      cb.checked = e.uses.includes(k);
      cb.addEventListener('change', () => { e.uses = FIELD_KEYS.filter((x) => (x === k ? cb.checked : e.uses.includes(x))); refreshFields(); updatePreview(); });
      uses.append(h('label', { class: 'ai-check', for: `aiUse-${k}` }, cb, h('span', null, PROMPT_FIELDS[k].label)));
    }
    wrap.append(uses);
    if (ui.error) wrap.append(h('p', { class: 'points-note bad', role: 'alert' }, ui.error));
    wrap.append(h('div', { class: 'ai-actions' },
      h('button', { class: 'btn outline sm', type: 'button', id: 'aiEditCancel', onclick: cancelEditing }, 'Cancel'),
      h('button', { class: 'btn solid sm', type: 'button', id: 'aiEditSave', onclick: saveEditing }, 'Save prompt')));
    return wrap;
  }

  function detailEl() {
    const wrap = h('div', { class: 'ai-detail' });
    if (ui.editing) {
      const host = h('div', { class: 'ai-fields-host' });
      const refreshFields = () => { host.textContent = ''; host.append(fieldsEl(activePrompt(), ui.editing.uses, null)); };
      wrap.append(editorEl(refreshFields), host, autoEl(), previewEl());
      refreshFields();
      return wrap;
    }
    const p = currentPrompt();
    if (!p) { ui.preview = null; ui.chips = null; return wrap; }
    const custom = p.group === 'custom';
    if (p.description) wrap.append(h('p', { class: 'ai-ddesc', id: 'aiDesc' }, p.description));
    const uses = (p.uses || []).filter((k) => PROMPT_FIELDS[k]);
    if (uses.length) wrap.append(fieldsEl(p, uses, null));
    const acts = h('div', { class: 'ai-dacts' });
    if (custom) {
      acts.append(
        h('button', { class: 'btn outline sm', type: 'button', id: 'aiEdit', onclick: () => startEdit(p) }, 'Edit'),
        h('button', { class: 'btn outline sm danger-text', type: 'button', id: 'aiDelete', onclick: () => removePrompt(p) }, 'Delete'));
    } else {
      acts.append(h('button', { class: 'btn outline sm', type: 'button', id: 'aiDuplicate', onclick: () => duplicateToEdit(p) }, 'Duplicate to edit'));
    }
    wrap.append(autoEl(), previewEl(), acts);
    return wrap;
  }

  function render() {
    if (!ui.el) return;
    const keepScroll = ui.body.scrollTop;
    ui.body.textContent = '';
    ui.body.append(promptRowEl());
    const mine = customRowEl();
    if (mine) ui.body.append(mine);
    ui.body.append(detailEl());
    updateChips();
    updatePreview();
    syncSteps();
    ui.body.scrollTop = keepScroll;
    if (ui.editing && ui.editing.focus) {
      const f = ui.editing.focus; ui.editing.focus = null;
      const el = document.getElementById(f === 'title' ? 'aiEditTitle' : 'aiEditTemplate');
      if (el && ui.open) { try { el.focus({ preventScroll: true }); if (f === 'title') el.select(); } catch (e) { /* ignore */ } }
    }
  }

  /* ---- open / close ------------------------------------------------------------------------------ */
  function open() {
    if (!ui.el) return false;
    if (ui.open) return true;
    Pop.close();
    ui.open = true;
    { const ae = document.activeElement; ui.restoreFocus = ae && ae !== document.body && document.contains(ae) ? ae : document.getElementById('btnExport'); }
    render();
    ui.back.hidden = false;
    ui.el.setAttribute('data-open', 'true');
    ui.el.removeAttribute('aria-hidden');
    const btn = document.getElementById('btnExport');
    if (btn) btn.classList.add('is-on');
    try { ui.el.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    return true;
  }
  function close() {
    if (!ui.open) return false;
    ui.open = false;
    ui.back.hidden = true;
    ui.el.setAttribute('data-open', 'false');
    ui.el.setAttribute('aria-hidden', 'true');
    ui.toasts.textContent = '';
    const btn = document.getElementById('btnExport');
    if (btn) btn.classList.remove('is-on');
    const f = ui.restoreFocus;
    ui.restoreFocus = null;
    if (f && f.focus && document.contains(f)) { try { f.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
    return true;
  }
  const toggle = () => (ui.open ? close() : open());

  function init() {
    build();
    window.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape' || !ui.open) return;
      if (document.querySelector('.modal-back')) return;      // a confirm dialog handles its own Escape
      e.preventDefault();
      close();
    });
    // The numbers in the chips and the preview follow the design while the panel is open.
    Store.subscribe(() => {
      if (!ui.open || ui.raf) return;
      ui.raf = requestAnimationFrame(() => { ui.raf = 0; updateChips(); updatePreview(); });
    });
    Options.onImport(({ promptsAdded }) => { if (promptsAdded && ui.el) render(); });
  }

  return {
    init, open, close, toggle, copyPrompt, saveImage, isOpen: () => ui.open,
    formPhrase, autoValues, podiumPhrase, currentAuto, textFor, findPrompt, allPrompts, valuesFor,
    // the same text the preview shows for a prompt id; `values` overrides auto or pick fields
    promptText: (id, values) => { const p = findPrompt(id); return p ? textFor(p, values) : null; },
    startNew, startEdit, saveEditing, cancelEditing, duplicateToEdit, removePrompt,
    editing: () => (ui.editing ? { ...ui.editing } : null),
    setEditing: (patch) => { if (ui.editing) { Object.assign(ui.editing, patch); render(); } },
    select, render,
  };
})();

/* ==========================================================================
   FILE EXPORTS: SketchUp, DXF, stall CSV  (plan sections 3 and 4)
   Export menu > "SketchUp (.json)" downloads <option>-<date>.sketchup.json, which the CMRLM SketchUp extension imports. The
   document is built by src/parking/sketchup.js (SkPark). "DXF (.dxf)" is the R12 file from src/parking/exports.js; "Stall list
   (.csv)" is one row per stall. All three read the same final stalls the screen shows (Derived.get().built); the file format
   helpers are src/shared/sketchup-format.js.
   ========================================================================== */

const SketchupExport = (() => {
  /** The document for the design on screen (or for `state`/`built` when given). */
  function doc(state, built) {
    const s = state || Store.raw();
    const d = built || Derived.get();
    return SkPark.parkingToSketchup(s, d.built, d.metrics, { name: s.name });
  }
  function filename(state) { return SkFmt.sketchupFilename((state || Store.raw()).name); }
  function save(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);   // revoking sooner can break some downloads
  }
  /** Build, check and download. `deliver(blob, filename)` replaces the browser download (tests). → { ok, filename, blob, errors } */
  function download({ deliver } = {}) {
    let d;
    try { d = doc(); } catch (e) { console.error(e); Toast.show('The SketchUp file could not be built for these settings.', 'bad'); return { ok: false, errors: [String(e && e.message)] }; }
    const v = SkFmt.validateDoc(d);
    if (!v.ok) { console.error(v.errors); Toast.show('The SketchUp file did not pass its own check, so it was not saved.', 'bad'); return { ok: false, errors: v.errors }; }
    if (!v.counts.solid && !v.counts.mesh) { Toast.show('Nothing to export yet: the design has no levels.', 'warn'); return { ok: false, errors: ['empty'] }; }
    const name = filename();
    const blob = SkFmt.docToBlob(d);
    (deliver || save)(blob, name);
    if (!deliver) Toast.show(`Saved ${name}. In SketchUp: Extensions > CMRLM > Import Design Tools file.`);
    return { ok: true, filename: name, blob, counts: v.counts };
  }

  /* ---- DXF and CSV ---- */
  const slug = (name) => String(name || 'deck').trim().replace(/[^\w\-]+/g, '-').replace(/^-+|-+$/g, '').toLowerCase() || 'deck';
  const stamp = () => { const d = new Date(), p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
  const dxfText = () => {
    const d = Derived.get();
    return ExportsMod.parkingDxf(Store.raw(), d.built, { ramps: d.ramps, columnPoints: d.columns.points, clearHeights: d.clear });
  };
  const csvText = () => ExportsMod.stallCsv(Store.raw(), Derived.get().built);
  function fileOut(kind, { deliver } = {}) {
    let text;
    try { text = kind === 'dxf' ? dxfText() : csvText(); } catch (e) { console.error(e); Toast.show(`The ${kind.toUpperCase()} file could not be built for these settings.`, 'bad'); return { ok: false, errors: [String(e && e.message)] }; }
    const name = `${slug(Store.get('name'))}-${stamp()}${kind === 'dxf' ? '.dxf' : '-stalls.csv'}`;
    const blob = new Blob([text], { type: kind === 'dxf' ? 'application/dxf' : 'text/csv' });
    (deliver || save)(blob, name);
    if (!deliver) Toast.show(`Saved ${name}`);
    return { ok: true, filename: name, blob, text };
  }
  return { doc, filename, download, dxf: (o) => fileOut('dxf', o), csv: (o) => fileOut('csv', o), dxfText, csvText };
})();

/* ==========================================================================
   SHARED: storage
   src/shared/storage.js (inlined with the other modules),
   plus `Options`, the mid-rise tool's glue: save, duplicate, rename, delete, the
   option menu, export / import, autosave and restore.
   Custom AI prompts ride in the same blob (storage.listPrompts / savePrompt / removePrompt).
   Saved options live under localStorage key `parking.options.v1`; the
   working copy autosaves into the "__current" slot after a 1 s pause.
   ========================================================================== */
const Options = (() => {
  const storage = StorageMod.createStorage({
    key: CONFIG.storageKey, schema: CONFIG.schema, migrate: (s) => s, filePrefix: 'parking-options',
    onNotice: (message) => Toast.show(message, 'warn', 7000),
  });
  let currentId = null;            // the saved option the working copy came from (null = unsaved)
  let savedPrint = null;           // fingerprint of that option's state, to show "unsaved changes"
  let dirtyTimer = null;
  let autosaveHeld = false;       // tests hold the autosave so a ?test visit cannot overwrite the saved working copy

  const fingerprint = (s) => JSON.stringify({ ...s, name: '' });
  const savedNames = () => storage.list().map((o) => o.name);
  const quoted = (name) => `“${name}”`;

  function syncDirty() {
    clearTimeout(dirtyTimer);
    const dot = document.getElementById('unsavedDot');
    const dirty = !currentId || savedPrint !== fingerprint(Store.raw());
    if (dot) dot.hidden = !dirty;
    const btn = document.getElementById('btnSave');
    if (btn) btn.classList.toggle('is-on', dirty);
    return dirty;
  }
  function link(id, state) {
    currentId = id || null;
    uiPrefs.currentId = currentId;
    saveUiPrefs(uiPrefs);
    savedPrint = currentId ? fingerprint(state || Store.raw()) : null;
    syncDirty();
  }
  /** While a project is open, a design that replaces the one on screen stays where the project put it: same placement, same site context. */
  function keepProject(s) {
    if (!(typeof ProjectUI !== 'undefined' && ProjectUI.has())) return s;
    const cur = Store.raw();
    s.placement = deepClone(cur.placement);
    return s;
  }
  const reframe = () => { if (Render.ready()) Render.setView(Render.info().preset || 'axon', true); };

  /** Put a state on screen as the working copy. Undo brings the previous design back. */
  function show(raw, { id = null, name } = {}) {
    const s = fillDefaults(raw);
    if (name) s.name = name;
    keepProject(s);
    if (Render.comparing()) Compare.exit();
    Store.replace(s);
    link(id, s);
    reframe();
    return s;
  }

  function loadOption(id) {
    const rec = storage.get(id);
    if (!rec) { Toast.show('That option is no longer saved.', 'warn'); return false; }
    show(rec.state, { id: rec.id, name: rec.name });
    Toast.show(`Opened ${quoted(rec.name)}. Undo brings your last design back.`);
    return true;
  }
  /** A preset becomes a new, unsaved option. */
  function loadPreset(id) {
    const p = CONFIG.presets.find((x) => x.id === id);
    if (!p) return false;
    const s = fillDefaults(p.state);
    show(s, { id: null, name: p.name });
    Toast.show(`Started from the preset ${quoted(p.name)}. It is not saved yet.`);
    return true;
  }

  /** Unsaved changes = a design linked to a saved option that no longer matches it, or an unsaved design that differs from the default
   *  (an untouched new design has nothing to lose). The name is ignored, as in the dot next to Save. */
  function hasUnsavedChanges() {
    const rec = currentId && storage.get(currentId);
    return rec ? savedPrint !== fingerprint(Store.raw()) : fingerprint(Store.raw()) !== fingerprint(defaultState());
  }
  /** Start fresh from the built-in default (what a first-ever visit gets) as a new, unsaved option named "Untitled" ("Untitled (2)"
   *  when taken). Saved options are never touched. One undo step brings the previous design back (its name is part of the state;
   *  like loadPreset, the link to a saved option is not restored). Resolves true when it happened, false when the user cancelled. */
  async function newDesign({ confirm = true } = {}) {
    if (confirm && hasUnsavedChanges()) {
      const ok = await confirmDialog(`Start a new design? Unsaved changes to ${quoted(Store.get('name') || 'this design')} will be lost. You can undo this.`, 'Start new');
      if (!ok) return false;
    }
    Select.cancelHandleDrag();
    Select.clear();
    Prompts.close();
    if (Render.comparing()) Compare.exit();
    const s = defaultState();
    s.name = uniqueName0('Untitled');
    keepProject(s);
    Store.replace(s);
    link(null, s);
    if (Render.ready()) Render.setView('axon', true);       // always Axon, whatever view was on screen
    Toast.show('New design started.');
    return true;
  }

  function save() {
    const state = Store.snapshot();
    const known = currentId && storage.get(currentId);
    if (known) {
      storage.update(currentId, state, state.name);
      link(currentId, state);
      Toast.show(`Saved ${quoted(state.name)}`);
    } else {
      const name = uniqueName0(state.name);
      if (name !== state.name) Store.set('name', name, { live: false });
      const id = storage.save(Store.snapshot(), name);
      link(id);
      Toast.show(`Saved ${quoted(name)}`);
    }
    return currentId;
  }
  const uniqueName0 = (name, extra = []) => StorageMod.uniqueName(name, [...savedNames(), ...extra]);

  function duplicate() {
    const base = Store.snapshot();
    const name = uniqueName0(base.name, [base.name]);
    Store.set('name', name, { live: false });
    const id = storage.save(Store.snapshot(), name);
    link(id);
    Toast.show(`Saved a copy as ${quoted(name)}`);
    return id;
  }

  function rename(next) {
    const name = String(next || '').trim().slice(0, 60) || 'Option A';
    Store.set('name', name, { live: false });
    if (currentId && storage.get(currentId)) storage.rename(currentId, name);
    const field = document.getElementById('optionName');
    if (field) field.value = Store.get('name');
    syncDirty();
  }

  async function remove() {
    const rec = currentId && storage.get(currentId);
    if (!rec) { Toast.show('This option is not saved, so there is nothing to delete.', 'warn'); return false; }
    const ok = await confirmDialog(`Delete ${quoted(rec.name)} from the saved options? The design on screen stays open.`, 'Delete', true);
    if (!ok) return false;
    storage.remove(rec.id);
    link(null);
    Toast.show(`Deleted ${quoted(rec.name)}. The design on screen is now unsaved.`);
    return true;
  }

  const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
  const importListeners = [];
  function exportJson() {
    const n = storage.list().length, np = storage.listPrompts().length;
    if (!n && !np) { Toast.show('Nothing to export yet. Save an option first.', 'warn'); return false; }
    storage.downloadExport();
    Toast.show(`Exported ${[n ? plural(n, 'option') : '', np ? plural(np, 'custom prompt') : ''].filter(Boolean).join(' and ')}`);
    return true;
  }
  async function importFile(file) {
    try {
      const { added, skipped, promptsAdded } = await storage.importFile(file);
      const parts = [added || !promptsAdded ? plural(added, 'option') : '', promptsAdded ? plural(promptsAdded, 'custom prompt') : ''].filter(Boolean);
      Toast.show(`Imported ${parts.join(' and ')}${skipped ? `, ${skipped} skipped` : ''}.${added ? ' Open the options from the Option menu.' : ''}`);
      importListeners.forEach((fn) => fn({ added, skipped, promptsAdded }));
      return { added, skipped, promptsAdded };
    } catch (e) {
      Toast.show(e && e.message ? e.message : 'The file could not be imported.', 'bad', 7000);
      return { added: 0, skipped: 0, error: String(e && e.message) };
    }
  }

  const when = (t) => { try { return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); } catch (e) { return ''; } };
  function openMenu(anchor) {
    const el = h('div', { role: 'menu', id: 'optionMenu' });
    const item = (title, sub, onclick, o = {}) => h('button', { class: 'pop-item', type: 'button', role: 'menuitem', id: o.id, disabled: o.disabled, onclick: () => { if (!o.keep) Pop.close(); onclick(); } },
      h('span', { class: 'tick' }, o.tick ? '✓' : ''), h('span', { class: 'grow' }, title, sub ? h('small', null, sub) : null));

    // The option name is edited here. It is committed when the field changes or the menu closes.
    const nameField = h('input', { class: 'pop-name', id: 'optionName', type: 'text', maxlength: '60', spellcheck: 'false', autocomplete: 'off', 'aria-label': 'Option name', value: Store.get('name') || '' });
    const commitName = () => { if (nameField.value.trim() !== (Store.get('name') || '')) rename(nameField.value); };
    nameField.addEventListener('change', commitName);
    nameField.addEventListener('keydown', (e) => { if (e.key === 'Enter') { commitName(); Pop.close(); } });
    el.append(
      item('New design', 'Start fresh from the default deck', () => { newDesign(); }, { id: 'miNewDesign' }),
      h('div', { class: 'pop-sep' }),
    );
    el.append(h('div', { class: 'label pop-label' }, 'Option name'), h('div', { style: 'padding:0 6px 4px' }, nameField));

    el.append(h('div', { class: 'label pop-label' }, 'This option'));
    el.append(
      item('Save', 'Keep the design as it is now', save, { id: 'miSave' }),
      item('Duplicate', 'Save a copy as a new option', duplicate, { id: 'miDuplicate' }),
      item('Rename', 'Edit the name above', () => { nameField.focus(); nameField.select(); }, { id: 'miRename', keep: true }),
      item('Delete', 'Remove it from the saved options', remove, { id: 'miDelete', disabled: !currentId }),
      item(Compare.isActive() ? 'Exit compare' : 'Compare', 'Compare 2 to 4 options side by side', () => Compare.toggle(), { id: 'miCompare' }),
    );
    el.append(h('div', { class: 'pop-sep' }), h('div', { class: 'label pop-label' }, 'Saved options'));
    const saved = storage.list();
    if (!saved.length) el.append(h('div', { class: 'pop-note' }, 'Nothing saved yet. Use Save to keep this design.'));
    for (const o of saved) el.append(item(o.name, `Saved ${when(o.updatedAt)}`, () => loadOption(o.id), { tick: o.id === currentId }));
    el.append(h('div', { class: 'pop-sep' }), h('div', { class: 'label pop-label' }, 'New from a preset'));
    for (const p of CONFIG.presets) el.append(item(p.name, p.description, () => loadPreset(p.id), { id: `preset-${p.id}` }));
    Pop.open(anchor, el, { onClose: commitName });
  }

  function init({ restore = true } = {}) {
    if (restore) {
      const saved = storage.loadAutosave();
      if (saved) {
        const s = fillDefaults(saved);
        Store.replace(s, { resetHistory: true });
        const rec = uiPrefs.currentId && storage.get(uiPrefs.currentId);
        if (rec) link(rec.id, fillDefaults(rec.state)); else link(null);
      } else link(null);
    } else link(null);
    Store.subscribe((s, info) => {
      if (!autosaveHeld) storage.autosave(s);
      if (!info || !info.live) { clearTimeout(dirtyTimer); dirtyTimer = setTimeout(syncDirty, 250); }
    });
    const input = document.getElementById('importFile');
    input.addEventListener('change', async () => {
      const file = input.files && input.files[0];
      input.value = '';
      if (file) await importFile(file);
    });
  }

  return {
    onImport: (fn) => importListeners.push(fn),
    holdAutosave: (v) => { autosaveHeld = !!v; },
    init, save, duplicate, rename, remove, openMenu, loadOption, loadPreset, newDesign, hasUnsavedChanges, exportJson, importFile, syncDirty,
    list: () => storage.list(), get: (id) => storage.get(id), flush: () => storage.flush(),
    current: () => currentId, storage,
  };
})();

/* ==========================================================================
   PROJECT FILE  (docs/project-file-spec.md; plan section 7)
   `ProjectUI` is the glue between the page and src/shared/project.js (ProjectMod).
   With ?project=<id> the page opens that project. It reads the "massing" section (deck and podium levels, plates, core seeds,
   placement, units) and the "plates" section (demising lines) through dataDoc(), and writes the "parking" section back after
   every change (1 s debounce, and on visibilitychange / pagehide).
   Without a project nothing here runs until the Project menu is used; the tool works standalone.
   ProjectMod.writeSection returns a new project and does not change the one it gets. So a save loads the project
   fresh from storage, writes the section on that copy and saves it (another tool may have saved from a second tab).
   Every storage call is inside try/catch. Tests inject storage, navigation and the address bar with configure().
   ========================================================================== */
const ProjectUI = (() => {
  const $ = (id) => document.getElementById(id);
  const ZERO = () => ({ x: 0, y: 0, rotation: 0, baseZ: 0 });
  const READ_ONLY_TEXT = 'This project was saved by a newer version of this tool. You can view it, but changes will not be saved.';
  const NO_STORAGE_TEXT = 'Saving is unavailable in this browser, so the project is kept only until you close this page.';
  const project = {
    doc: null, timer: 0, dirty: false, readOnly: false, loading: false, noted: {},
    renamed: null,
    storage: null,
    navigate: (url) => { window.location.assign(url); },
    updateUrl: (id) => {
      try {
        const u = new URL(window.location.href);
        if (id) u.searchParams.set('project', id); else u.searchParams.delete('project');
        window.history.replaceState(null, '', u.pathname + u.search + u.hash);
      } catch (e) { /* the address bar is a convenience */ }
    },
  };
  const DEFAULT_NAV = project.navigate, DEFAULT_URL = project.updateUrl;
  const isObjP = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);

  function storageOf() {
    if (project.storage) return project.storage;
    try { return window.localStorage; } catch (e) { return null; }
  }
  function noticeOnce(key, message, kind = 'warn', ms = 9000) {
    if (project.noted[key]) return;
    project.noted[key] = true;
    Toast.show(message, kind, ms);
  }
  const storageNotice = () => ({ onNotice: (message) => noticeOnce(`storage:${message}`, String(message)) });

  /* ---- reading the project ------------------------------------------------------------------ */
  const has = () => !!project.doc;
  function sectionOf(key) {
    if (!project.doc) return null;
    try { return ProjectMod.getSection(project.doc, key); } catch (e) { return null; }
  }
  const placement = () => {
    const p = Store.raw().placement;
    return isObjP(p) ? { x: num(p.x, 0), y: num(p.y, 0), rotation: num(p.rotation, 0), baseZ: num(p.baseZ, 0) } : ZERO();
  };

  /* ---- reading the massing (plan section 7) ---------------------------------------------------- */
  const massing = () => sectionOf('massing');
  const massingLevels = () => {
    const sec = massing();
    const dv = sec && sec.derived;
    return dv && Array.isArray(dv.levels) ? dv.levels : [];
  };
  /** The project document the layout, the overlay and the metrics read (null without a project). */
  const dataDoc = () => project.doc || null;
  /** A key that changes when the massing or plates data changes (not when this tool saves its own section). */
  function dataKey() {
    if (!project.doc) return '';
    const m = sectionOf('massing'), p = sectionOf('plates');
    return `${project.doc.id}|${(m && m.updatedAt) || ''}|${(p && p.updatedAt) || ''}`;
  }
  /** Deck and podium levels of the massing, lowest first: { zone, levels: [{ index, z, ftf, area }] } for each zone that has some. */
  function sources() {
    const out = [];
    for (const [source, zone] of [['wrap', 'deck'], ['podium', 'podium']]) {
      const list = massingLevels().filter((l) => l && l.zone === zone && Array.isArray(l.plates) && l.plates.length)
        .slice().sort((a, b) => num(a.z, 0) - num(b.z, 0));
      if (list.length) out.push({ source, zone, levels: list.map((l) => ({ index: l.index, z: num(l.z, 0), ftf: num(l.ftf, 10.5), area: Math.round(multiArea(l.plates)) })) });
    }
    return out;
  }
  const hasMassing = () => !!massing();
  const massingPlacement = () => {
    const sec = massing();
    const p = sec && sec.placement;
    return isObjP(p) ? { x: num(p.x, 0), y: num(p.y, 0), rotation: num(p.rotation, 0), baseZ: num(p.baseZ, 0) } : null;
  };
  /** The units the massing reports (null when none). */
  const massingUnits = () => {
    const sec = massing();
    const m = sec && sec.derived && sec.derived.metrics;
    return m && isFinite(m.units) ? m.units : null;
  };
  /** The massing levels shown as a ghost above the deck: { polys, z, ftf }. In the massing (local) frame. */
  function ghostLevels(state) {
    if (!project.doc) return [];
    const skip = state.source === 'wrap' ? 'deck' : state.source === 'podium' ? 'podium' : null;
    const out = [];
    for (const l of massingLevels()) {
      if (!l || !Array.isArray(l.plates) || !l.plates.length) continue;
      if (l.zone === skip) continue;
      if (state.source === 'standalone' && l.zone !== 'bar') continue;
      out.push({ polys: l.plates, z: num(l.z, 0), ftf: num(l.ftf, 10.5) });
    }
    return out;
  }
  /** Takes the deck or the podium of the massing as the footprint and the level stack. One undo step. Returns true when it worked. */
  function useSource(source, { quiet = false } = {}) {
    const src = sources().find((x) => x.source === source);
    if (!src) { if (!quiet) Toast.show(source === 'wrap' ? 'The project has no deck levels. Send a design with a deck from the Mid-Rise Generator.' : 'The project has no podium levels. Send a design with a podium from the Mid-Rise Generator.', 'warn', 6000); return false; }
    const next = deepClone(Store.raw());
    const lv = src.levels;
    next.source = source;
    next.sourceLevel = lv[0].index;
    next.levels.count = Math.min(CONFIG.limits.maxLevels, lv.length);
    next.levels.ftf1 = lv[0].ftf;
    next.levels.ftf = lv[1] ? lv[1].ftf : lv[0].ftf;
    next.levels.belowGrade = lv.filter((l) => l.z < -0.01).length;
    next.coresFromProject = true;
    const pl = massingPlacement();
    if (pl) next.placement = pl;
    Store.replace(fillDefaults(next));
    if (!quiet) Toast.show(`${SOURCE_LABELS[source]}: ${lv.length} level${lv.length === 1 ? '' : 's'} from the project.`);
    return true;
  }
  /** Back to a free-standing deck (the footprint and levels in the state stay as they are). */
  function useStandalone() {
    if (Store.raw().source === 'standalone') return false;
    Store.set('source', 'standalone', { live: false });
    return true;
  }

  /* ---- base elevation: Follow ground or Typed (docs/site-base-style-technical-plan.md section 1) ------------------------------- */
  // A committed change under one of these paths moves the footprint, so followGround runs again.
  const FOOTPRINT_KEYS = ['placement', 'source', 'sourceLevel', 'footprint', 'levels', 'bays', 'grid', 'ramp', 'cores', 'entries', 'liner'];
  const footprintPath = (path) => FOOTPRINT_KEYS.some((k) => path === k || path.startsWith(`${k}.`));
  const r1 = (v) => Math.round(v * 10) / 10;
  /** The base elevation mode of the open design: 'follow' (the default, and an old save) or 'typed'. */
  const baseMode = () => { const p = Store.raw().placement; return isObjP(p) && p.baseMode === 'typed' ? 'typed' : 'follow'; };
  /** site.derived of the open project, or null. */
  function siteDerived() {
    const sec = sectionOf('site');
    return sec && isObjP(sec.derived) ? sec.derived : null;
  }
  /** The lowest ground under the model footprint (project frame, ft NAVD88), or null without a site grid.
   *  A 9 x 9 grid over the plan box of the model, each point turned into the project frame and read from the site ground. Rounded to 0.1 ft. */
  function groundUnderFootprint(pl = placement(), bounds) {
    const dv = siteDerived();
    if (!dv) return null;
    let b = bounds;
    if (!b) { try { b = Derived.get().bounds.model; } catch (e) { b = null; } }
    if (!b || ![b.minX, b.maxX, b.minY, b.maxY].every(Number.isFinite)) return null;
    const N = 9;
    let low = Infinity;
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const p = ProjectMod.toProject(pl, [b.minX + ((b.maxX - b.minX) * i) / (N - 1), b.minY + ((b.maxY - b.minY) * j) / (N - 1)]);
      const z = SiteLayerMod.groundZAt(dv, p[0], p[1]);
      if (Number.isFinite(z) && z < low) low = z;
    }
    return Number.isFinite(low) ? r1(low) : null;
  }
  /** True when the base elevation follows the ground now: a project is open, the mode is Follow and the deck is standalone. */
  const followsGround = () => !!project.doc && isObjP(Store.raw().placement) && baseMode() === 'follow' && Store.raw().source === 'standalone';
  /** For the placement gizmo: the base elevation for the moved placement `pl`, or null to leave the base alone. */
  function baseFor(pl) {
    return followsGround() ? groundUnderFootprint(pl) : null;
  }
  /** Sets placement.baseZ to the lowest ground under the footprint when the mode is Follow and the project has a site ground.
   *  opts.merge: no new undo step (the change joins the one before). Returns true when the base changed. */
  function followGround({ merge = false } = {}) {
    if (!followsGround() || Store.gestureActive()) return false;
    const z = groundUnderFootprint();
    if (z == null || Math.abs(z - placement().baseZ) < 1e-9) return false;
    const was = project.loading;
    project.loading = true;                 // the Store hook ignores this write; the context below follows once
    try {
      Store.set('placement.baseZ', z, { live: false, merge });
    } finally { project.loading = was; }
    if (!was) markDirty();
    return true;
  }
  /** Follow ground or Typed. Switching to Follow runs followGround once. */
  function setBaseMode(mode) {
    if (!project.doc || !isObjP(Store.raw().placement) || (mode !== 'follow' && mode !== 'typed') || baseMode() === mode) return false;
    Store.set('placement.baseMode', mode, { live: false });
    if (mode === 'follow') followGround({ merge: true });
    return true;
  }
  /** The line under the chips in Follow mode. */
  function baseLineText() {
    const ft = (v) => `${(Math.round(v * 10) / 10).toLocaleString('en-US', { maximumFractionDigits: 1 })} ft`;
    const z = placement().baseZ;
    return siteDerived() && groundUnderFootprint() != null ? `Ground floor at ${ft(z)} above sea level.` : `This project has no site ground. The base stays at ${ft(z)}.`;
  }
  /** The base elevation control for the Site tab: Follow ground / Typed chips, a read-only line (Follow) or the typed field (Typed).
   *  lenF = the page's length field maker. Returns a list of elements. */
  function baseControl(lenF) {
    const chips = h('div', { class: 'chips', role: 'group', 'aria-label': 'Base elevation mode', id: 'baseModeChips' });
    const btns = [['follow', 'Follow ground'], ['typed', 'Typed']].map(([mode, text]) => {
      const b = h('button', { class: 'chip', type: 'button', 'aria-pressed': 'false', 'data-base-mode': mode, onclick: () => setBaseMode(mode) }, text);
      chips.append(b);
      return b;
    });
    const line = h('p', { class: 'help', id: 'baseLine' });
    const typed = lenF('Base elevation (ft)', 'placement.baseZ', { hardMin: -1e5, hardMax: 1e5, step: 0.5 });
    return [
      Controls.when(() => { btns.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.baseMode === baseMode()))); return true; },
        [h('div', { class: 'ctl' }, h('div', { class: 'ctl-label' }, 'Base elevation'), chips)]).el,
      Controls.when(() => { line.textContent = baseLineText(); return baseMode() === 'follow'; }, [line]).el,
      Controls.when(() => baseMode() === 'typed', [typed.el]).el,
      Controls.help('Follow ground sets the base to the lowest ground under the building. Typed keeps the value you enter.'),
    ];
  }

  /* ---- writing the project ---------------------------------------------------------------------- */
  function renderPill() {
    const doc = project.doc, pill = $('projPill');
    if (pill) {
      pill.hidden = !doc;
      if (doc) { pill.textContent = `${doc.name}${project.readOnly ? ' (read only)' : ''}`; pill.title = `Project: ${pill.textContent}`; }
    }
    const line = $('projLine');
    if (line && doc) {
      const n = sources().map((s) => `${s.levels.length} ${s.zone} level${s.levels.length === 1 ? '' : 's'}`).join(', ');
      line.textContent = `Project “${doc.name}”${project.readOnly ? ' (read only)' : ''}. ${hasMassing() ? `Massing: ${n || 'no deck or podium levels'}.` : 'No massing in this project yet.'}`;
    }
  }
  function openCheck(doc) {
    let sec = null;
    try { sec = ProjectMod.getSection(doc, 'parking'); } catch (e) { sec = null; }
    const newer = (sec && Number(sec.schema) > CONFIG.projectSchema) || Number(doc.version) > Number(ProjectMod.VERSION || 1);
    return { sec, newer };
  }

  function markDirty() {
    if (!project.doc || project.loading) return;
    project.dirty = true;
    clearTimeout(project.timer);
    project.timer = setTimeout(() => { flush(); }, CONFIG.projectSaveMs);
  }
  function saveFailureText(res) {
    if (!res) return NO_STORAGE_TEXT;
    return String(res.warning || 'The project could not be saved.');
  }
  /** The "parking" section patch for the design on screen. */
  function sectionPatch() {
    const st = Store.snapshot();
    const d = Derived.get();
    const derived = ParkDerivedMod.parkingDerived(st, d.built, d.metrics);
    const pl = { ...placement(), baseMode: baseMode() };
    return { tool: CONFIG.tool, schema: CONFIG.projectSchema, placement: pl, state: { ...st, placement: pl }, derived, note: st.name };
  }
  /**
   * Writes the parking section and saves the project. Loads the project fresh from storage first, writes the section on that copy,
   * saves it. Returns saveProject's result, { ok: true, skipped: true } when there is nothing to do, or { ok: false }.
   */
  function flush() {
    clearTimeout(project.timer);
    project.timer = 0;
    const doc = project.doc;
    if (!doc || project.readOnly || !project.dirty) return { ok: true, skipped: true };
    const opts = storageNotice();
    let patch;
    try { patch = sectionPatch(); } catch (e) {
      console.error(e);
      Toast.show(`The project could not be updated. ${e && e.message ? e.message : ''}`.trim(), 'bad', 8000);
      return { ok: false };
    }
    let base = doc;
    try { base = ProjectMod.loadProject(storageOf(), doc.id, opts) || doc; } catch (e) { base = doc; }
    let next = null;
    try { next = ProjectMod.writeSection(base, 'parking', patch); } catch (e) {
      if (e && e.readOnly) { project.readOnly = true; renderPill(); noticeOnce('readonly', e.message || READ_ONLY_TEXT); return { ok: false, readOnly: true }; }
      console.error(e);
      Toast.show(`The project could not be updated. ${e && e.message ? e.message : ''}`.trim(), 'bad', 8000);
      return { ok: false };
    }
    if (project.renamed) next.name = project.renamed;
    project.doc = next;
    let res = null;
    try { res = ProjectMod.saveProject(storageOf(), next, opts); } catch (e) { console.error(e); }
    if (!res || res.ok === false) {
      noticeOnce(`save:${(res && res.warning) || ''}`, saveFailureText(res), 'bad', 12000);
      return res || { ok: false };
    }
    project.dirty = false;
    project.renamed = null;
    if (res.warning) noticeOnce('warning', String(res.warning));
    renderPill();
    return res;
  }

  /* ---- opening, creating, closing -------------------------------------------------------------- */
  /** Makes `doc` the open project. A parking section of this tool is loaded; otherwise the massing decides the start. */
  function openDoc(doc, { startup = false } = {}) {
    if (project.doc && project.doc !== doc) flush();
    clearTimeout(project.timer);
    const { sec, newer } = openCheck(doc);
    Object.assign(project, { doc, timer: 0, dirty: false, readOnly: !!newer, renamed: null });
    if (newer) noticeOnce('readonly', READ_ONLY_TEXT);
    project.loading = true;
    let started = false;
    try {
      const mine = sec && sec.tool === CONFIG.tool && isObjP(sec.state) && Object.keys(sec.state).length;
      if (mine) {
        const st = fillDefaults({ ...sec.state, placement: isObjP(sec.placement) ? sec.placement : (massingPlacement() || ZERO()) });
        Store.replace(st, { resetHistory: startup });
      } else {
        const cur = deepClone(Store.raw());
        cur.placement = massingPlacement() || ZERO();
        Store.replace(fillDefaults(cur), { resetHistory: startup });
        started = true;
      }
    } finally { project.loading = false; }
    if (started) {
      // a project with a deck (or a podium) starts with it; otherwise the free-standing deck stays
      const found = sources();
      project.loading = true;
      try { if (found.length) useSource(found[0].source, { quiet: true }); } finally { project.loading = false; }
      if (!project.readOnly) markDirty();
    }
    if (!project.readOnly) followGround({ merge: true });     // a standalone deck: the base elevation is the lowest ground under the footprint
    renderPill();
    if (Render.ready()) Render.setView(Render.info().preset || 'axon', true);
    return doc;
  }
  /** Forgets the open project (the saved copy stays where it is). */
  function close() {
    flush();
    clearTimeout(project.timer);
    Object.assign(project, { doc: null, timer: 0, dirty: false, readOnly: false, renamed: null });
    project.loading = true;
    try {
      const cur = deepClone(Store.raw());
      cur.placement = null;
      if (cur.source !== 'standalone') { cur.source = 'standalone'; cur.sourceLevel = null; }
      Store.replace(cur);
    } finally { project.loading = false; }
    project.updateUrl(null);
    renderPill();
  }
  const defaultName = () => (String(Store.get('name') || '').trim() || 'New project').slice(0, 80);
  /** New project (a local frame) holding the design on screen. Returns the doc or null. */
  function create(name, { quiet = false } = {}) {
    flush();
    const title = String(name || '').trim().slice(0, 80) || defaultName();
    let doc;
    try { doc = ProjectMod.newProject({ name: title }); } catch (e) {
      console.error(e);
      Toast.show(`The project could not be made. ${e && e.message ? e.message : ''}`.trim(), 'bad', 8000);
      return null;
    }
    Object.assign(project, { doc, timer: 0, dirty: true, readOnly: false, renamed: null });
    project.loading = true;
    try { Store.set('placement', { ...ZERO(), baseMode: 'follow' }, { live: false }); } finally { project.loading = false; }
    const saved = flush();
    project.updateUrl(doc.id);
    renderPill();
    if (!quiet && saved && saved.ok !== false) Toast.show(`Project ${project.doc.name} created.`);
    return project.doc;
  }
  function rename(name) {
    const next = String(name || '').trim().slice(0, 80);

    project.doc = { ...project.doc, name: next };
    project.renamed = next;
    project.dirty = true;
    renderPill();
    markDirty();
    return true;
  }

  /** Send to Facade Studio: save the project, then open ../facade/?project=<id>. With no project open, one is made first. */
  async function send(toolId) {
    Pop.close();
    if (toolId !== 'facade' && toolId !== 'grading') return false;
    if (!project.doc && !create(defaultName(), { quiet: true })) return false;
    if (project.readOnly) { noticeOnce('readonly', READ_ONLY_TEXT); return false; }
    project.dirty = true;
    const saved = flush();
    if (saved && saved.ok === false) return false;
    let url = null;
    try { url = ProjectMod.sendTo(storageOf(), project.doc, toolId, CONFIG.tool, storageNotice()); } catch (e) {
      console.error(e);
      Toast.show(`The project could not be sent. ${e && e.message ? e.message : ''}`.trim(), 'bad', 8000);
      return false;
    }
    if (!url) { Toast.show('The project could not be sent.', 'bad', 8000); return false; }
    try { project.doc = ProjectMod.loadProject(storageOf(), project.doc.id, storageNotice()) || project.doc; } catch (e) { /* keep the copy in memory */ }
    project.dirty = false;
    project.navigate(url);
    return url;
  }
  function openById(id) { flush(); project.navigate(`${location.pathname}?project=${encodeURIComponent(id)}`); }
  async function exportFile() {
    const doc = project.doc;
    if (!doc) return false;
    project.dirty = true;
    flush();
    try {
      const { filename, blob } = ProjectMod.exportProject(project.doc);
      const res = await ShotMod.deliverImage(blob, filename);
      if (res === 'downloaded') Toast.show(`Saved ${filename}`);
      return filename;
    } catch (e) { console.error(e); Toast.show(`The project file could not be made. ${e && e.message ? e.message : ''}`.trim(), 'bad', 6000); return false; }
  }
  async function importFile(file) {
    flush();
    try {
      const res = await ProjectMod.importProject(file, storageOf(), storageNotice());
