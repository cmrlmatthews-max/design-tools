  }
  while (carsLeft > 0) {
    seq.push("accessible"); carsLeft--;
    aisle(aC);
    if (carsLeft > 0) { seq.push("accessible"); carsLeft--; }
  }
  return seq;
}

/* ------------------------------------------------------------ placement */

const bbox = (ring) => {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of ring) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); }
  return { x0, y0, x1, y1 };
};

function copyStall(s) {
  return { ...s, outer: s.outer.map((p) => [p[0], p[1]]) };
}

function rowIdOf(s) {
  const id = typeof s.id === "string" ? s.id.replace(/-\d+$/, "") : "";
  return id || `P${s.level}-${s.bay}${s.row}`;
}

function elevatorCenter(state, built) {
  const cores = Array.isArray(built.cores) && built.cores.length ? built.cores : Array.isArray(state.cores) ? state.cores : [];
  const c = cores.find((k) => k && k.kind === "elevator") || cores[0];
  if (!c || !isNum(c.x) || !isNum(c.y)) return null;
  return { cx: c.x + (isNum(c.w) ? c.w : 0) / 2, cy: c.y + (isNum(c.d) ? c.d : 0) / 2 };
}

/** Plan 3.6 steps 1 and 8. → { stalls, lost, rowId, warnings, rowIds, level,
    required, van, car, provided, aisleLength, n0, need }.
    `stalls` is every stall of every level (new objects), lost slots removed. */
function placeAccessible(state, built) {
  need(state && state.accessible && state.bays && isNum(state.bays.stallW), "placeAccessible", "state.accessible and state.bays.stallW");
  need(built && Array.isArray(built.levels), "placeAccessible", "built.levels");

  const copies = built.levels.map((lv) => (lv.stalls || []).map(copyStall));
  const removed = new Set();
  const warnings = [];
  const n0 = copies.reduce((s, l) => s + l.length, 0);
  const req = requiredAccessible(n0, state.accessible, state.source);
  const La = aisleLength(req.van, req.car, state.accessible);
  const result = (rowIds, level, provided) => ({
    stalls: copies.flatMap((l) => l.filter((s) => !removed.has(s))),
    lost: removed.size, rowId: rowIds.length ? rowIds[0] : null, warnings, rowIds, level,
    required: req.required, van: req.van, car: req.car, provided, aisleLength: La, n0, need: req,
  });
  if (req.required === 0) return result([], null, 0);

  // entry level: floor z nearest 0, lowest index on a tie
  let pos = 0;
  built.levels.forEach((lv, i) => {
    const best = built.levels[pos];
    const dz = Math.abs(isNum(lv.z) ? lv.z : 0), db = Math.abs(isNum(best.z) ? best.z : 0);
    if (dz < db - 1e-9 || (Math.abs(dz - db) <= 1e-9 && lv.index < best.index)) pos = i;
  });
  const entry = built.levels[pos];
  const elev = elevatorCenter(state, built);

  const rowMap = new Map();
  for (const s of copies[pos]) {
    const key = `${s.bay}|${s.row}`;
    if (!rowMap.has(key)) rowMap.set(key, { key, id: rowIdOf(s), stalls: [], midY: 0 });
    rowMap.get(key).stalls.push(s);
  }
  const rows = [...rowMap.values()];
  for (const r of rows) {
    r.stalls.sort((a, b) => a.k - b.k);
    const b = bbox(r.stalls[0].outer);
    r.midY = (b.y0 + b.y1) / 2;
  }
  const dist = (r) => (elev ? Math.abs(r.midY - elev.cy) : r.midY);
  rows.sort((a, b) => {
    const d = Math.round(dist(a) * 1e6) - Math.round(dist(b) * 1e6);
    if (d) return d;
    if (Math.abs(a.midY - b.midY) > 1e-9) return a.midY - b.midY;
    return a.key < b.key ? -1 : a.key > b.key ? 1 : 0;
  });

  const seq = accessibleSlots(req.van, req.car, state.accessible, state.bays.stallW);
  const isFree = (s) => !removed.has(s) && (s.kind === undefined || s.kind === "standard");
  const rowIds = [];
  let at = 0, placedStalls = 0, lostSlots = 0;

  for (const row of rows) {
    if (at >= seq.length) break;
    const free = row.stalls.filter(isFree);
    if (!free.length) continue;
    const byK = new Map(free.map((s) => [s.k, s]));
    const cx = (s) => { const b = bbox(s.outer); return (b.x0 + b.x1) / 2; };
    let start = free[0];
    if (elev) {
      for (const s of free) if (Math.abs(cx(s) - elev.cx) < Math.abs(cx(start) - elev.cx) - 1e-9) start = s;
    }
    let east = 0, west = 0;
    while (byK.has(start.k + east)) east++;
    while (byK.has(start.k - west)) west++;
    const left = seq.length - at;
    const dir = east >= left ? 1 : west >= left ? -1 : west > east ? -1 : 1;
    const take = Math.min(dir === 1 ? east : west, left);
    for (let i = 0; i < take; i++) {
      const s = byK.get(start.k + dir * i);
      const item = seq[at++];
      if (item === "lost") { removed.add(s); lostSlots++; } else { s.kind = item; placedStalls++; }
    }
    rowIds.push(row.id);
  }

  if (placedStalls < req.required || lostSlots < seq.filter((x) => x === "lost").length) {
    warnings.push({
      code: "accessible-short", severity: "warn", floors: [entry.index],
      message: `The accessible group needs ${req.required} stalls and ${seq.filter((x) => x === "lost").length} aisle slots on level ${entry.index}; only ${placedStalls} stalls and ${lostSlots} slots fit in free stalls.`,
    });
  }
  if (rowIds.length > 1) {
    warnings.push({
      code: "accessible-split", severity: "info", floors: [entry.index],
      message: `The accessible group continues into more than one row (${rowIds.join(", ")}).`,
    });
  }
  return result(rowIds, entry.index, placedStalls);
}

/* ---------- EV tags (plan section 3.7) ---------- */

/**
 * Tags EV stalls. Returns NEW stall objects (inputs unchanged).
 * - EV installed: round(total × ev.installedShare) standard stalls become kind "ev".
 * - EV ready: round(total × ev.readyShare) other standard stalls get evReady: true (kind unchanged).
 * Order: level 1 first, then the distance from the stall center to the first entry (layout frame).
 * Without an entry, the distance runs from the southwest corner of the stalls.
 * Compact rows (compactShare > 0) are not built in version 1; the default share is 0.
 * @param {object} state  parking state (reads state.ev, state.entries)
 * @param {Array} stalls  every stall on every level, after placeAccessible
 * @returns {Array}
 */
function tagEv(state, stalls) {
  if (!Array.isArray(stalls)) throw new Error("tagEv: stalls must be an array.");
  const ev = (state && state.ev) || {};
  const total = stalls.length;
  const nInstalled = Math.round(total * (Number(ev.installedShare) || 0));
  const nReady = Math.round(total * (Number(ev.readyShare) || 0));
  const center = (s) => {
    const r = s.outer || [];
    let x = 0, y = 0;
    for (const p of r) { x += p[0]; y += p[1]; }
    return r.length ? [x / r.length, y / r.length] : [0, 0];
  };
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const s of stalls) for (const p of s.outer || []) {
    minX = Math.min(minX, p[0]); minY = Math.min(minY, p[1]); maxX = Math.max(maxX, p[0]); maxY = Math.max(maxY, p[1]);
  }
  if (!Number.isFinite(minX)) { minX = minY = maxX = maxY = 0; }
  const e = Array.isArray(state && state.entries) && state.entries[0];
  let ref = [minX, minY];
  if (e) {
    const at = Number(e.at) || 0, w = Number(e.width) || 0, mid = at + w / 2;
    if (e.side === "west") ref = [minX, minY + mid];
    else if (e.side === "east") ref = [maxX, minY + mid];
    else if (e.side === "south") ref = [minX + mid, minY];
    else if (e.side === "north") ref = [minX + mid, maxY];
  }
  const order = stalls
    .map((s, i) => ({ i, level: Number(s.level) || 0, d: Math.hypot(center(s)[0] - ref[0], center(s)[1] - ref[1]) }))
    .filter((o) => stalls[o.i].kind === "standard")
    .sort((a, b) => a.level - b.level || a.d - b.d || a.i - b.i);
  const out = stalls.map((s) => ({ ...s, outer: (s.outer || []).map((p) => p.slice()) }));
  order.forEach((o, n) => {
    if (n < nInstalled) out[o.i].kind = "ev";
    else if (n < nInstalled + nReady) out[o.i].evReady = true;
  });
  return out;
}

return { requiredAccessible, aisleLength, accessibleSlots, placeAccessible, tagEv };
})();

/* ---- src/parking/overlay.js ---- */
const OverlayMod = (() => {
/* ==========================================================================
   overlay.js — column overlay against the unit demising lines
   (Parking Deck Generator)

   Contract: docs/parking-deck-technical-plan.md sections 3.8, 3.9 and 4.
   Pure: no DOM, no Clipper, no mutation of inputs.

   Sources (plan 3.9 step 1), in this order:
   - "plates": sections.plates.derived.levels, the lowest-index level whose
     massing program is "residential" (any level with demising lines when
     none is labeled residential); each unit's `demising` lines.
   - "midrise": sections.massing.derived.levels, the lowest-index
     "residential" level with spines; a tick every unitWidth along each spine
     (unitWidth = sections.massing.state.programs[program].unitWidth).
   - "none": no project, or neither source has data.

   Rule choices where the plan leaves room:
   - A demising line counts when it is within 5 degrees of the layout y axis
     (perpendicular to the run) and at least 5 ft long. Lines closer than
     0.25 ft in x merge. A mid-rise tick counts when its spine segment is
     within 5 degrees of the layout x axis.
   - unitWidth = the median spacing between neighbouring lines, using
     spacings from 4 to 60 ft only (the gap between two bars is not a unit).
   - A column is "under the building" when it lies inside the source level's
     plate (layout frame); with no plate it counts when its x lies within the
     demising lines' x range, plus the tolerance.
   - Short-span suggestion: m = max(1, round((column + n x stallW) / U)),
     w* = (m x U - column) / n (the module length replaces n x stallW in m).
   - The suggestion is null when w* is outside 8 to 10 ft or equals the
     current stall width (already aligned).
   - The run (xs, xe) comes from built.run when the layout supplies it, else
     from the footprint perimeter and the turn zone (the split-level end
     zone included).
   - overlay takes the columnsFor result as an optional fourth argument.
     Without it, columnsFromState (plan 3.8, same rules) supplies the
     columns, so this file stands alone.
   ========================================================================== */

const isNum = (v) => typeof v === "number" && Number.isFinite(v);
const r3 = (v) => Math.round(v * 1000) / 1000 + 0;   // + 0 turns -0 into 0
const TAN5 = Math.tan((5 * Math.PI) / 180);
const MIN_W = 8, MAX_W = 10;

function need(cond, fn, what) {
  if (!cond) throw new Error(`${fn}: ${what} is missing or not valid`);
}

/* -------------------------------------------------------------- helpers */

function median(list) {
  if (!list.length) return 0;
  const a = list.slice().sort((p, q) => p - q);
  const m = a.length >> 1;
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
}

function mergeClose(sorted, gap) {
  const out = [];
  for (const x of sorted) if (!out.length || x - out[out.length - 1] > gap) out.push(x);
  return out;
}

function unitWidthOf(xs) {
  const spacings = [];
  for (let i = 1; i < xs.length; i++) {
    const d = xs[i] - xs[i - 1];
    if (d >= 4 && d <= 60) spacings.push(d);
  }
  return r3(median(spacings));
}

function inRing(pt, ring) {
  let c = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const a = ring[i], b = ring[j];
    if ((a[1] > pt[1]) !== (b[1] > pt[1]) && pt[0] < ((b[0] - a[0]) * (pt[1] - a[1])) / (b[1] - a[1]) + a[0]) c = !c;
  }
  return c;
}

function inMultiPoly(pt, mp) {
  for (const poly of mp || []) {
    if (!inRing(pt, poly.outer)) continue;
    if ((poly.holes || []).some((h) => inRing(pt, h))) continue;
    return true;
  }
  return false;
}

function mpToLayout(mp, frame) {
  return (mp || []).map((p) => ({
    outer: (p.outer || []).map((q) => frame.toLayout(q)),
    holes: (p.holes || []).map((h) => h.map((q) => frame.toLayout(q))),
  }));
}

/* --------------------------------------------------------- demising xs */

function fromPlates(project, frame) {
  const plates = project.sections && project.sections.plates && project.sections.plates.derived;
  const levels = plates && Array.isArray(plates.levels) ? plates.levels : [];
  const massing = project.sections && project.sections.massing && project.sections.massing.derived;
  const program = (index) => {
    const m = massing && Array.isArray(massing.levels) ? massing.levels.find((l) => l.index === index) : null;
    return m ? m.program : null;
  };
  const withLines = levels.filter((lv) => Array.isArray(lv.units) && lv.units.some((u) => Array.isArray(u.demising) && u.demising.length));
  if (!withLines.length) return null;
  const byIndex = (a, b) => a.index - b.index;
  const pick = withLines.filter((lv) => program(lv.index) === "residential").sort(byIndex)[0] || withLines.slice().sort(byIndex)[0];

  const xs = [], widths = [];
  for (const u of pick.units) {
    const own = [];
    for (const line of u.demising || []) {
      if (!Array.isArray(line) || line.length < 2) continue;
      const a = frame.toLayout(line[0]), b = frame.toLayout(line[1]);
      const dx = Math.abs(b[0] - a[0]), dy = Math.abs(b[1] - a[1]);
      if (dy < 5 || dx > TAN5 * dy) continue;
      xs.push((a[0] + b[0]) / 2);
      own.push((a[0] + b[0]) / 2);
    }
    if (own.length >= 2) widths.push(Math.max(...own) - Math.min(...own));
  }
  if (!xs.length) return null;
  xs.sort((p, q) => p - q);
  const merged = mergeClose(xs, 0.25).map(r3);
  // Unit width: the median of each unit's own width between its two cuts. On a double-loaded bar the north and
  // south cuts interleave, so the spacing between neighbouring lines would read about half the true width.
  const unitWidth = widths.length ? r3(median(widths)) : unitWidthOf(merged);
  return { source: "plates", xs: merged, unitWidth, footprint: mpToLayout(pick.plate, frame), level: pick.index };
}

function fromMidrise(project, frame) {
  const massing = project.sections && project.sections.massing;
  const derived = massing && massing.derived;
  const levels = derived && Array.isArray(derived.levels) ? derived.levels : [];
  const state = massing && massing.state;
  const cand = levels.filter((l) => l.program === "residential" && Array.isArray(l.spines) && l.spines.length).sort((a, b) => a.index - b.index)[0];
  if (!cand) return null;
  const prog = state && state.programs && state.programs[cand.program];
  const U = prog && isNum(prog.unitWidth) && prog.unitWidth > 0 ? prog.unitWidth : 0;
  if (!U) return null;

  const xs = [];
  for (const spine of cand.spines) {
    if (!Array.isArray(spine) || spine.length < 2) continue;
    const pts = spine.map((p) => frame.toLayout(p));
    let walked = 0, nextTick = 0;
    for (let i = 0; i + 1 < pts.length; i++) {
      const a = pts[i], b = pts[i + 1];
      const dx = b[0] - a[0], dy = b[1] - a[1];
      const len = Math.hypot(dx, dy);
      if (len < 1e-9) continue;
      const alongX = Math.abs(dy) <= TAN5 * Math.abs(dx);
      while (nextTick <= walked + len + 1e-9) {
        const t = Math.min(1, Math.max(0, (nextTick - walked) / len));
        if (alongX) xs.push(a[0] + t * dx);
        nextTick += U;
      }
      walked += len;
    }
  }
  if (!xs.length) return null;
  xs.sort((p, q) => p - q);
  const merged = mergeClose(xs, 0.25).map(r3);
  return { source: "midrise", xs: merged, unitWidth: r3(U), footprint: mpToLayout(cand.plates, frame), level: cand.index };
}

/** Plan 3.9 steps 1 and 2. frame: layoutFrame(state) (needs toLayout).
    → { source: "plates" | "midrise" | "none", xs, unitWidth, footprint, level }.
    xs are the demising lines' x in the layout frame, sorted. footprint is the
    source level's plate as a MultiPoly in the layout frame (or null). */
function demisingLines(project, frame) {
  need(frame && typeof frame.toLayout === "function", "demisingLines", "frame.toLayout");
  const none = { source: "none", xs: [], unitWidth: 0, footprint: null, level: null };
  if (!project || typeof project !== "object" || !project.sections) return none;
  return fromPlates(project, frame) || fromMidrise(project, frame) || none;
}

/* ------------------------------------------------------------- columns */

function turnZoneOf(state) {
  if (state.ramp && state.ramp.type === "split") {
    const tr = state.ramp.transition || {};
    return (isNum(state.ramp.splitLength) ? state.ramp.splitLength : 0) + 2 * (isNum(tr.length) ? tr.length : 0);
  }
  return isNum(state.bays.turnZone) ? state.bays.turnZone : state.bays.aisle;
}

function runOf(state, built) {
  const run = built.run;
  if (run && isNum(run.xs) && isNum(run.xe)) return { xs: run.xs, xe: run.xe, R: run.xe - run.xs };
  const p = isNum(state.footprint.perimeter) ? state.footprint.perimeter : 0;
  const t = turnZoneOf(state);
  const xs = p + t, xe = built.frame.W - p - t;
  return { xs, xe, R: xe - xs };
}

/** Stalls in one row of run length R at stall width w (plan 3.3). */
function rowCount(R, w, grid) {
  if (!(R > 0) || !(w > 0)) return 0;
  const eps = 1e-9;
  if (grid.span === "short") {
    const n = grid.stallsPerModule, M = grid.column + n * w;
    const k = Math.floor(R / M + eps);
    const rr = R - k * M;
    return k * n + Math.floor(Math.max(0, rr - grid.column) / w + eps);
  }
  return Math.floor(R / w + eps);
}

/** Plan 3.8: column lines and points in the layout frame, as grid.columnsFor
    returns them. → { lines: [{ y, xs }], points, module }. */
function columnsFromState(state, built) {
  need(state && state.grid && state.bays && state.footprint, "columnsFromState", "state.grid, state.bays and state.footprint");
  need(built && built.frame && isNum(built.frame.W), "columnsFromState", "built.frame");
  const grid = state.grid, short = grid.span === "short";
  const n = grid.stallsPerModule, w = state.bays.stallW;
  const module = short ? grid.column + n * w : n * w;
  const { xs: xs0, xe, R } = runOf(state, built);

  const bayList = Array.isArray(built.bays) ? built.bays : (built.bays && built.bays.bays) || [];
  const ys = new Set();
  for (const b of bayList) {
    const all = [...(b.rows || []).flatMap((r) => [r.y0, r.y1]), ...(b.aisle ? [b.aisle.y0, b.aisle.y1] : [])];
    if (!all.length) continue;
    const lo = Math.min(...all), hi = Math.max(...all);
    ys.add(r3(lo)); ys.add(r3(hi));
    if (short) for (const y of all) ys.add(r3(y));
  }
  const xsList = [];
  if (R > 0) {
    const k = Math.floor(R / module + 1e-9);
    for (let j = 0; j <= k; j++) xsList.push(r3(xs0 + j * module));
    if (xe - xsList[xsList.length - 1] > 0.5) xsList.push(r3(xe));
  }
  const lines = [...ys].sort((p, q) => p - q).map((y) => ({ y, xs: xsList.slice() }));
  const points = lines.flatMap((l) => l.xs.map((x) => [x, l.y]));
  return { lines, points, module: r3(module) };
}

/* ------------------------------------------------------------- overlay */

/** Plan 3.9 steps 3 and 4. columns: the columnsFor result (optional).
    → { conflicts: [{ column: [x, y], distance }], suggestion: { stallW, stallsPerRow } | null,
        source, unitWidth, tolerance, checked }.
    `checked` = columns under the building; distance is in ft along x. */
function overlay(state, built, project, columns) {
  need(state && state.grid && state.bays && state.footprint && state.checks, "overlay", "state.grid, state.bays, state.footprint and state.checks");
  need(built && built.frame, "overlay", "built.frame");
  const tol = isNum(state.checks.overlayTolerance) ? state.checks.overlayTolerance : 2;
  const dem = demisingLines(project, built.frame);
  const empty = { conflicts: [], suggestion: null, source: dem.source, unitWidth: dem.unitWidth, tolerance: tol, checked: 0 };
  if (dem.source === "none" || !dem.xs.length) return { ...empty, source: "none" };

  const cols = columns && Array.isArray(columns.points) ? columns : columnsFromState(state, built);
  const lo = dem.xs[0] - tol, hi = dem.xs[dem.xs.length - 1] + tol;
  const hasPlate = dem.footprint && dem.footprint.length > 0;
  const conflicts = [];
  let checked = 0;
  for (const c of cols.points) {
    const under = hasPlate ? inMultiPoly(c, dem.footprint) : c[0] >= lo && c[0] <= hi;
    if (!under) continue;
    checked++;
    let d = Infinity;
    for (const x of dem.xs) d = Math.min(d, Math.abs(c[0] - x));
    if (d > tol + 1e-9) conflicts.push({ column: [c[0], c[1]], distance: r3(d) });
  }

  // suggestion (decision 12): the tool never changes the width by itself
  let suggestion = null;
  const U = dem.unitWidth;
  if (U > 0) {
    const grid = state.grid, n = grid.stallsPerModule, w = state.bays.stallW, short = grid.span === "short";
    const moduleNow = short ? grid.column + n * w : n * w;
    const m = Math.max(1, Math.round(moduleNow / U));
    const wStar = short ? (m * U - grid.column) / n : (m * U) / n;
    if (wStar >= MIN_W - 1e-9 && wStar <= MAX_W + 1e-9 && Math.abs(wStar - w) > 0.005) {
      const { R } = runOf(state, built);
      suggestion = { stallW: r3(wStar), stallsPerRow: rowCount(R, wStar, grid) };
    }
  }
  return { conflicts, suggestion, source: dem.source, unitWidth: U, tolerance: tol, checked };
}

return { demisingLines, columnsFromState, overlay };
})();

/* ---- src/parking/metrics.js ---- */
const MetricsMod = (() => {
/* ==========================================================================
   metrics.js — metrics and design checks (Parking Deck Generator)

   Contract: docs/parking-deck-technical-plan.md sections 3.10, 3.11 and 4.
   Pure: no DOM, no Clipper, no mutation of inputs. Areas come from
   src/midrise/bars.js (ringArea, multiPolyArea, clipAreaConvex).

   Arguments after `built`:
   - ramps: the rampsFor result ([{ id, type, level, rise, length, slope,
     limit, ok, footprint }]).
   - columns: the columnsFor result ({ lines, points, module }).
   - accessible: the placeAccessible result. Its `stalls` are the final
     stalls. Without it the built stalls count and nothing is reported lost.
   - project: the loaded project document or null (units, overlay).

   Caution: these are design checks against editable values, not a code review.

   Rule choices where the plan leaves room:
   - Gross deck area = sum of level plate areas - the liner strip on the
     levels the liner lists. The strip is [0, depth] from the chosen side of
     the layout frame, clipped to the plate.
   - Parking area = final stall areas + the accessible aisle slots (lost x
     stallW x stallD) + aisles + turn zones, over all levels. Efficiency =
     parking area / gross.
   - Required parking = ceil(units x ratio + retailSf / 1000 x 3). units =
     state.required.units, else massing.derived.metrics.units, else 0.
   - EV: installed = stalls of kind "ev"; ready = stalls with evReady. The
     targets (round(stalls x share)) are reported beside them. Tagging is the
     layout's job; this file counts the tags.
   - Clear height per level = level ftf - structureDepth[span]; the lowest
     index level is level 1 (ftf1, van route); the others use clearGeneral.
     The top level of an open-top deck has no structure above: clear null,
     ok true, open true (same as grid.clearHeights).
   - Warnings use the layout's shape { code, severity, floors, message }.
     Core warnings the layout already raised (built.warnings, same code and
     id) are not raised twice.

     its own floor-to-floor when openTop is false. That is the sum of the

const { ringArea, multiPolyArea, clipAreaConvex } = BarsMod;

const isNum = (v) => typeof v === "number" && Number.isFinite(v);
const r1 = (v) => Math.round(v * 10) / 10 + 0;
const r3 = (v) => Math.round(v * 1000) / 1000 + 0;

const KINDS = ["standard", "compact", "accessible", "van", "ev"];
const RETAIL_PER_1000 = 3;

function need(cond, fn, what) {

}

const rect = (x0, y0, x1, y1) => [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];

function fmtFtIn(ft) {

}

function stripOf(built) {
  if (built.strip) return built.strip;
  return built.bays && !Array.isArray(built.bays) && built.bays.strip ? built.bays.strip : null;
}

/** The liner strip as a rectangle in the layout frame, or null. */
function linerRect(state, frame) {
  const ln = state.liner;
  if (!ln || !ln.on || !isNum(ln.depth) || ln.depth <= 0) return null;
  const W = frame.W, D = frame.D, d = ln.depth;
  switch (ln.side) {
    case "north": return rect(0, D - d, W, D);
    case "east": return rect(W - d, 0, W, D);
    case "west": return rect(0, 0, d, D);
    default: return rect(0, 0, W, d);

  const depth = g.structureDepth && isNum(g.structureDepth[g.span]) ? g.structureDepth[g.span] : 0;
  const lv = state.levels || {};
  const ftf = isNum(level.ftf) ? level.ftf : lowest ? lv.ftf1 : lv.ftf;
  return { ftf, clear: r3(ftf - depth), depth };

/* -------------------------------------------------------------- metrics */

/** Plan 3.11. → one object with a row for every metric:
    stalls, byLevel, byKind, grossArea, sfPerStall, parkingArea, efficiency,
    required { units, unitsSource, ratio, retailSf, total }, balance,
    accessible { required, provided, van, car, lost, aisleLength, table, r2 },
    ev { installed, ready, targetInstalled, targetReady }, bike { required,

  need(state && state.bays && state.levels && state.required, "computeMetrics", "state.bays, state.levels and state.required");
  need(built && Array.isArray(built.levels) && built.frame, "computeMetrics", "built.levels and built.frame");
  const levels = built.levels;

  const n = stalls.length;

  // by level, by kind
  const byLevel = levels.map((lv) => ({ index: lv.index, stalls: stalls.filter((s) => s.level === lv.index).length }));
  const byKind = Object.fromEntries(KINDS.map((k) => [k, 0]));

  const acc = {
    required: need0.required,
    provided: byKind.accessible + byKind.van,
    van: need0.van,
    car: need0.car,
    lost,
    aisleLength: state.accessible ? aisleLength(need0.van, need0.car, state.accessible) : 0,
    table: need0.table,
    r2: need0.r2,
  };

  // EV
  const ev = state.ev || {};

    installed: byKind.ev,
    ready: stalls.filter((s) => s.evReady).length,
    targetInstalled: Math.round(n * (isNum(ev.installedShare) ? ev.installedShare : 0)),
    targetReady: Math.round(n * (isNum(ev.readyShare) ? ev.readyShare : 0)),

  // bike
  const bk = state.bike || {};

  // ramps

    const below = isNum(state.levels.belowGrade) ? state.levels.belowGrade : 0;

    stalls: n,
    byLevel,
    byKind,
    grossArea: gross,
    sfPerStall: n > 0 ? r1(gross / n) : 0,
    parkingArea,
    efficiency: gross > 0 ? r3(parkingArea / gross) : 0,
    required: { units, unitsSource, ratio, retailSf, total },
    balance: n - total,
    accessible: acc,
    ev: evOut,
    bike,
    rampSlopes,
    maxRampSlope,
    clearHeights,
    lowestClear: Number.isFinite(lowestClear) ? lowestClear : 0,

      perLevel, total: perLevel * levels.length, module: columns && isNum(columns.module) ? columns.module : 0,
      conflicts: ov.conflicts.length, source: ov.source, suggestion: ov.suggestion,
    },
    conflicts: ov.conflicts.length,
    levels: levels.length,
    topOfDeck,
  };
}

/* -------------------------------------------------------------- checks */

function warn(code, message, floors = [], severity = "warn", extra = {}) {
  return { code, severity, floors, message, ...extra };
}

/** Plan 3.10. → Warning[] ({ code, severity, floors, message, id?, action? }, the
    same shape layout() raises), in the order of the plan's table. */
function checks(state, built, ramps, metrics) {

  need(built && Array.isArray(built.levels) && built.frame, "checks", "built.levels and built.frame");
  need(metrics && Array.isArray(metrics.clearHeights), "checks", "metrics");
  const lim = state.checks;
  const out = [];
  const pct = (v) => `${(Math.round(v * 1000) / 10).toFixed(1)}%`;

  // ramp slope
  for (const r of Array.isArray(ramps) ? ramps : []) {
    if (r.ok === false || (isNum(r.limit) && r.slope > r.limit + 1e-9)) {

    }
  }

  const depth = state.grid && state.grid.structureDepth ? state.grid.structureDepth[state.grid.span] : 0;
  const ceilHalf = (v) => Math.ceil(v * 2 - 1e-9) / 2;
  for (const c of metrics.clearHeights) {
    if (c.ok) continue;
    const van = c.min === lim.clearVan;
    const fix = ceilHalf(c.min + depth);
    out.push(warn(van ? "clear-height-van" : "clear-height",
      `Level ${c.level} clear height ${fmtFtIn(c.clear)} is below the ${fmtFtIn(c.min)} ${van ? "van route" : "general minimum"}. Set level ${c.level} floor-to-floor to ${fix} ft.`, [c.level]));
  }

  if (isNum(lim.barrierProvided) && isNum(lim.barrier) && lim.barrierProvided < lim.barrier - 1e-9) {
    out.push(warn("barrier-height", `The vehicle barrier is ${fmtFtIn(lim.barrierProvided)}; the check value is ${fmtFtIn(lim.barrier)}.`));
  }
  if (built.levels.length > 1 && isNum(lim.barrierProvided) && isNum(lim.guard) && lim.barrierProvided < lim.guard - 1e-9) {

    const outside = built.levels.filter((lv) => clipAreaConvex(lv.plate, r) < w * d - 1).map((lv) => lv.index);

  }

})();

  const m = metrics || {};

  const ramps = Array.isArray(m.ramps) ? m.ramps : Array.isArray(built.ramps) ? built.ramps : [];
  const cores = coreRings(state, built);
  const cols = columnPointsOf(state, built, m).map((p) => { const q = map(p); return [r3(q[0]), r3(q[1])]; });

  const byKind = {};

    const index = isNum(l.index) ? l.index : i + 1;
    const plate = localMulti(l.plate, map);

    const stalls = [];
    for (const s of l.stalls || []) {

  const units = unitsIn !== null ? unitsIn : isNum(state.required && state.required.units) ? state.required.units : 0;
  const bikeReq = isNum(mb.required) ? mb.required

    levels,
    metrics: {
      stalls: stallCount,
      byKind: kindOrder,
      sfPerStall: r1(sf !== null ? sf : stallCount > 0 ? gross / stallCount : 0),
      levels: levels.length,
      accessible: {
        required: isNum(ma.required) ? ma.required : accessibleCount,
        provided: isNum(ma.provided) ? ma.provided : accessibleCount,
        van: isNum(ma.van) ? ma.van : byKind.van || 0,
      },
      ev: { installed: isNum(me.installed) ? me.installed : byKind.ev || 0, ready: isNum(me.ready) ? me.ready : evReady },
      bike: { required: bikeReq, areaSf: isNum(mb.areaSf) ? mb.areaSf : bike.rack === "two-tier" ? 0 : r1(bikeReq * 12) },

/* ---- src/parking/exports.js ---- */
const ExportsMod = (() => {
/* ==========================================================================
   parking/exports.js — Parking Deck Generator: DXF R12 and stall CSV (plan sections 4 and 9.1, tests 17 and 18)

   parkingDxf(state, built, parts) → DXF R12 text (AC1009), local (massing) frame, z = floor surface above baseZ
     parts (optional) { ramps, columnPoints, clearHeights }  rampsFor / columnsFor.points / clearHeights results.
           Without them the DXF reads built.ramps, built.columns and the computed fallbacks of derived.js.
     Layers  PARK-SLAB       plate outlines, one closed polyline per piece and hole, per level
             PARK-STALL      one closed polyline per standard, compact or EV stall
             PARK-ACCESSIBLE one closed polyline per accessible or van stall
             PARK-AISLE      aisle outlines, closed polylines
             PARK-RAMP       3D faces from each ramp's outer3d (a quad stays one face); a circular speed ramp also
                             writes its inside and outside circle (the true arc) at the lower level
             PARK-RAMP-SEG   circular speed ramp only: the centerline as `segments` straight 3D lines, rising with the ramp
             PARK-COLUMN     one closed square polyline per column per level
             PARK-CORE       one closed polyline per core per level
             PARK-TEXT       level labels, ramp slopes, core ids

   stallCsv(state, built) → "level,id,kind,ev_ready,x,y,width,depth\n…"
     x, y = stall center in the local frame (3 decimals); width = along the row (layout x), depth = along the stall (layout y).
     ev_ready is true or false. One row per final stall, in level order.

   parkTriangulate(ring) → [[i, j, k], …]   ear clipping of a simple plan ring [[x, y, …], …]; shared with sketchup.js.

   Pure: no DOM. Units: feet.
   ========================================================================== */

const { parkingDerived, localMapper } = ParkDerivedMod;

const PARK_DXF_LAYERS = [
  ["PARK-SLAB", 8], ["PARK-STALL", 7], ["PARK-ACCESSIBLE", 5], ["PARK-AISLE", 9], ["PARK-RAMP", 3],
  ["PARK-RAMP-SEG", 2], ["PARK-COLUMN", 1], ["PARK-CORE", 6], ["PARK-TEXT", 7],
];

const isNum = (v) => typeof v === "number" && Number.isFinite(v);
const r3 = (v) => Math.round(v * 1000) / 1000;

/* ---------- ear clipping (simple ring, no holes) ---------- */

const cross2 = (a, b, c) => (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);

function parkTriangulate(ring) {
  const n = ring.length;
  if (n < 3) return [];
  let area = 0;
  for (let i = 0; i < n; i++) { const p = ring[i], q = ring[(i + 1) % n]; area += p[0] * q[1] - q[0] * p[1]; }
  const loop = ring.map((_, i) => i);
  if (area < 0) loop.reverse();                                   // work counter-clockwise
  const tris = [];
  let guard = n * n + 10;
  while (loop.length > 3 && guard-- > 0) {
    const m = loop.length;
    let ear = -1;
    for (let i = 0; i < m && ear < 0; i++) {
      const a = ring[loop[(i + m - 1) % m]], b = ring[loop[i]], c = ring[loop[(i + 1) % m]];
      if (cross2(a, b, c) <= 1e-9) continue;
      let ok = true;
      for (let j = 0; j < m && ok; j++) {
        const q = ring[loop[j]];
        if (q === a || q === b || q === c) continue;
        if (cross2(a, b, q) >= 0 && cross2(b, c, q) >= 0 && cross2(c, a, q) >= 0) ok = false;
      }
      if (ok) ear = i;
    }
    if (ear < 0) ear = 0;                                         // give up on exactness: clip any vertex
    tris.push([loop[(ear + m - 1) % m], loop[ear], loop[(ear + 1) % m]]);
    loop.splice(ear, 1);
  }
  if (loop.length === 3) tris.push(loop.slice());
  return tris.filter((t) => Math.abs(cross2(ring[t[0]], ring[t[1]], ring[t[2]])) > 1e-9);
}

/* ---------- DXF writer ---------- */

function fmt(v) {
  let s = (Math.round(v * 1e4) / 1e4).toFixed(4).replace(/0+$/, "");
  if (s.endsWith(".")) s += "0";
  return s === "-0.0" ? "0.0" : s;
}

class Dxf {
  constructor() { this.out = []; this.min = [Infinity, Infinity, Infinity]; this.max = [-Infinity, -Infinity, -Infinity]; }
  g(code, v) { this.out.push(String(code).padStart(3, " "), typeof v === "number" && code >= 10 && code <= 59 ? fmt(v) : String(v)); }
  pt(x, y, z, c = 10) {
    this.g(c, x); this.g(c + 10, y); this.g(c + 20, z);
    const v = [x, y, z];
    for (let i = 0; i < 3; i++) { if (v[i] < this.min[i]) this.min[i] = v[i]; if (v[i] > this.max[i]) this.max[i] = v[i]; }
  }
  /** Closed 2D polyline (flag 1) at elevation z. */
  closed2d(layer, ring, z) {
    this.g(0, "POLYLINE"); this.g(8, layer); this.g(66, 1); this.g(10, 0); this.g(20, 0); this.g(30, z); this.g(70, 1);
    for (const p of ring) { this.g(0, "VERTEX"); this.g(8, layer); this.pt(p[0], p[1], z); }
    this.g(0, "SEQEND"); this.g(8, layer);
  }
  /** 3DFACE with 3 or 4 corners (a triangle repeats its third corner). */
  face(layer, pts) {
    this.g(0, "3DFACE"); this.g(8, layer);
    const q = pts.length === 3 ? [...pts, pts[2]] : pts;
    q.forEach((p, k) => this.pt(p[0], p[1], p[2], 10 + k));
  }
  line(layer, a, b) { this.g(0, "LINE"); this.g(8, layer); this.pt(a[0], a[1], a[2]); this.pt(b[0], b[1], b[2], 11); }
  circle(layer, x, y, z, r) { this.g(0, "CIRCLE"); this.g(8, layer); this.pt(x, y, z); this.g(40, r); }
  text(layer, x, y, z, height, s) { this.g(0, "TEXT"); this.g(8, layer); this.pt(x, y, z); this.g(40, height); this.g(1, String(s).replace(/[^\x20-\x7e]/g, "?")); }
}

const bboxOf = (ring) => {
  const xs = ring.map((p) => p[0]), ys = ring.map((p) => p[1]);
  return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)];
};

function partsOf(built, parts) {
  const p = parts || {};
  return {
    ramps: Array.isArray(p.ramps) ? p.ramps : Array.isArray(built.ramps) ? built.ramps : [],
    columnPoints: p.columnPoints,
    clearHeights: p.clearHeights,
  };
}

function parkingDxf(state, built, parts) {
  if (!state) throw new Error('parkingDxf: missing input "state".');
  if (!built || !Array.isArray(built.levels)) throw new Error('parkingDxf: missing input "built.levels".');
  const pr = partsOf(built, parts);
  const map = localMapper(built);
  const d = parkingDerived(state, built, { ramps: pr.ramps, columnPoints: pr.columnPoints, clearHeights: pr.clearHeights });
  const col = (state.grid && state.grid.column) || 2;
  const D = new Dxf();

  d.levels.forEach((lv, i) => {
    const z = lv.z, src = built.levels[i] || {};
    for (const pc of lv.plate) { D.closed2d("PARK-SLAB", pc.outer, z); for (const h of pc.holes) D.closed2d("PARK-SLAB", h, z); }
    for (const pc of lv.aisles) { D.closed2d("PARK-AISLE", pc.outer, z); for (const h of pc.holes) D.closed2d("PARK-AISLE", h, z); }
    for (const s of lv.stalls) D.closed2d(s.kind === "accessible" || s.kind === "van" ? "PARK-ACCESSIBLE" : "PARK-STALL", s.outer, z);
    for (const c of lv.cores) { D.closed2d("PARK-CORE", c.outer, z); const b = bboxOf(c.outer); D.text("PARK-TEXT", b[0] + 1, b[1] + 1, z, 1.5, c.id); }
    for (const c of lv.columns) D.closed2d("PARK-COLUMN", [[c[0] - col / 2, c[1] - col / 2], [c[0] + col / 2, c[1] - col / 2], [c[0] + col / 2, c[1] + col / 2], [c[0] - col / 2, c[1] + col / 2]], z);
    const outerAll = lv.plate.flatMap((pc) => pc.outer);
    if (outerAll.length) {
      const b = bboxOf(outerAll);
      D.text("PARK-TEXT", b[0], b[1] - 6, z, 3, `LEVEL ${lv.index}  Z ${fmt(z)}  ${lv.stalls.length} STALLS${isNum(src.ftf) ? `  FTF ${fmt(src.ftf)}` : ""}`);
    }
    for (const rp of lv.ramps) {
      const pts = rp.outer3d;
      if (pts.length === 4) D.face("PARK-RAMP", pts);
      else for (const t of parkTriangulate(pts)) D.face("PARK-RAMP", [pts[t[0]], pts[t[1]], pts[t[2]]]);
      const cx = pts.reduce((s, p) => s + p[0], 0) / pts.length, cy = pts.reduce((s, p) => s + p[1], 0) / pts.length;
      D.text("PARK-TEXT", cx, cy, Math.min(...pts.map((p) => p[2])), 2, `${rp.id} ${fmt(Math.round(rp.slope * 1000) / 10)} PCT`);
    }
  });

  // circular speed ramp: true arc (circles) and straight segments
  const sp = (state.ramp && state.ramp.speed) || {};
  if (state.ramp && state.ramp.type === "speed" && sp.shape === "circular") {
    const N = sp.segments || 12, rIn = sp.insideRadius || 30, w = sp.width || 24;
    for (const rp of pr.ramps) {
      if (!rp || rp.type !== "speed" || !Array.isArray(rp.footprint) || !rp.footprint.length) continue;
      const lv = d.levels.find((l) => l.index === rp.level);
      if (!lv) continue;
      const b = bboxOf(rp.footprint), c = [(b[0] + b[2]) / 2, (b[1] + b[3]) / 2];
      const cl = map(c), rise = isNum(rp.rise) ? rp.rise : 0;
      D.circle("PARK-RAMP", cl[0], cl[1], lv.z, rIn);
      D.circle("PARK-RAMP", cl[0], cl[1], lv.z, rIn + w);
      const rm = rIn + w / 2, at = (k) => {
        const a = (2 * Math.PI * k) / N, q = map([c[0] + rm * Math.cos(a), c[1] + rm * Math.sin(a)]);
        return [r3(q[0]), r3(q[1]), r3(lv.z + (rise * k) / N)];
      };
      for (let k = 0; k < N; k++) D.line("PARK-RAMP-SEG", at(k), at(k + 1));
    }
  }

  const head = new Dxf();
  head.g(0, "SECTION"); head.g(2, "HEADER");
  head.g(9, "$ACADVER"); head.g(1, "AC1009");
  const lo = D.min.map((v) => (isFinite(v) ? v : 0)), hi = D.max.map((v) => (isFinite(v) ? v : 0));
  head.g(9, "$EXTMIN"); head.g(10, lo[0]); head.g(20, lo[1]); head.g(30, lo[2]);
  head.g(9, "$EXTMAX"); head.g(10, hi[0]); head.g(20, hi[1]); head.g(30, hi[2]);
  head.g(0, "ENDSEC");
  head.g(0, "SECTION"); head.g(2, "TABLES");
  head.g(0, "TABLE"); head.g(2, "LTYPE"); head.g(70, 1);
  head.g(0, "LTYPE"); head.g(2, "CONTINUOUS"); head.g(70, 0); head.g(3, "Solid line"); head.g(72, 65); head.g(73, 0); head.g(40, 0);
  head.g(0, "ENDTAB");
  head.g(0, "TABLE"); head.g(2, "LAYER"); head.g(70, PARK_DXF_LAYERS.length + 1);
  head.g(0, "LAYER"); head.g(2, "0"); head.g(70, 0); head.g(62, 7); head.g(6, "CONTINUOUS");
  for (const [name, color] of PARK_DXF_LAYERS) { head.g(0, "LAYER"); head.g(2, name); head.g(70, 0); head.g(62, color); head.g(6, "CONTINUOUS"); }
  head.g(0, "ENDTAB");
  head.g(0, "ENDSEC");
  head.g(0, "SECTION"); head.g(2, "ENTITIES");
  const tail = ["  0", "ENDSEC", "  0", "EOF"];
  return head.out.concat(D.out, tail).join("\n") + "\n";
}

/* ---------- stall CSV ---------- */

const csvCell = (v) => { const s = String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };

function stallCsv(state, built) {
  if (!built || !Array.isArray(built.levels)) throw new Error('stallCsv: missing input "built.levels".');
  const map = localMapper(built);
  const rows = ["level,id,kind,ev_ready,x,y,width,depth"];
  built.levels.forEach((l, i) => {
    const index = isNum(l.index) ? l.index : i + 1;
    for (const s of l.stalls || []) {
      if (!s || !Array.isArray(s.outer) || s.outer.length < 3) continue;
      const b = bboxOf(s.outer), c = map([(b[0] + b[2]) / 2, (b[1] + b[3]) / 2]);
      rows.push([index, csvCell(s.id), csvCell(s.kind || "standard"), s.evReady ? "true" : "false", c[0].toFixed(3), c[1].toFixed(3), (b[2] - b[0]).toFixed(3), (b[3] - b[1]).toFixed(3)].join(","));
    }

/* ---- src/parking/sketchup.js ---- */
const SkPark = (() => {
/* ==========================================================================
   parking/sketchup.js — Parking Deck Generator → ".sketchup.json" (docs/sketchup-spec.md section 4)

   parkingToSketchup(state, built, metrics, meta) → a document made with makeDoc (passes validateDoc).
     state    the parking state
     built    layout(state): { frame, levels[{ index, z, ftf, plate, stalls, aisles }], cores, bays, … }
     metrics  computeMetrics rows; also read for the optional parts of derived.js:
              metrics.ramps (rampsFor rows), metrics.columnPoints (columnsFor points), metrics.clearHeights
     meta     optional { createdAt, name, location, zShift }

   Pure: no DOM, no Clipper. Units: feet. Plan (x, y): x = east, y = north. z up. Local (massing) frame.

   Rule choices (where the spec leaves room):
   - Group order: Levels, Stalls, Ramps, Columns, Cores, Barriers. A group with nothing in it is left out.
   - Levels: one slab solid per level, 1 ft thick, its top at the floor surface z. A plate that falls into
     several pieces is a group "Level n" with one solid per piece ("Level n · piece k").
   - Stalls: closed outlines at the floor surface, one group per level, one "lines" node per tag:
     "Stalls" (standard, compact), "Accessible" (accessible, van), "EV" (ev).
   - Ramps: one mesh per ramp per level, from its outer3d (ear-clipped in plan). A helix or sloped bay is
     drawn on top of the flat slab, so the slab and the ramp overlap in those bays.
   - Columns: one solid per column per level, floor surface to the underside of the slab above (ftf - 1).
   - Cores: one solid per core, from the lowest slab to the top of the highest level.
   - Barriers: a wall of `checks.barrierProvided` (default 3.5 ft) along every plate edge, thickness
     `footprint.perimeter` (default 0.5 ft) inward of the edge, one solid per edge per level.
   - doc.source is "parking" (SKETCHUP_SOURCE). validateDoc accepts it; the SketchUp importer needs the same.
   ========================================================================== */

const { cleanRing2, makeDoc } = SkFmt;
const { parkingDerived } = ParkDerivedMod;
const { parkTriangulate } = ExportsMod;

const SKETCHUP_SOURCE = "parking";

const COLORS = {
  Levels: "#9aa1a9", Stalls: "#5b6670", Accessible: "#2f6fd1", EV: "#58a65c",
  Ramps: "#d9a22b", Columns: "#6b7280", Cores: "#c2607a", Barriers: "#7a8fa6",
};
const SLAB = 1;

const r3 = (v) => Math.round(v * 1000) / 1000;
const r2 = (v) => Math.round(v * 100) / 100;
const num = (v, d) => (typeof v === "number" && Number.isFinite(v) ? v : d);

function ringsArea(pc) {
  const a = (ring) => { let s = 0; for (let i = 0; i < ring.length; i++) { const p = ring[i], q = ring[(i + 1) % ring.length]; s += p[0] * q[1] - q[0] * p[1]; } return Math.abs(s / 2); };
  return a(pc.outer) - pc.holes.reduce((s, h) => s + a(h), 0);
}

const closedLine = (ring, z) => [...ring, ring[0]].map((p) => [p[0], p[1], z]);
const square = (c, s) => [[c[0] - s / 2, c[1] - s / 2], [c[0] + s / 2, c[1] - s / 2], [c[0] + s / 2, c[1] + s / 2], [c[0] - s / 2, c[1] + s / 2]];

/** Inward wall rectangles along a ring (counter-clockwise outer or clockwise hole: the slab is on the left of each edge). */
function wallRings(ring, t) {
  const out = [];
  for (let i = 0; i < ring.length; i++) {
    const a = ring[i], b = ring[(i + 1) % ring.length];
    const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);
    if (len < 0.5) continue;
    const nx = (-dy / len) * t, ny = (dx / len) * t;
    const w = cleanRing2([a, b, [b[0] + nx, b[1] + ny], [a[0] + nx, a[1] + ny]]);
    if (w) out.push(w);
  }
  return out;
}

function parkingToSketchup(state, built, metrics, meta) {
  if (!state) throw new Error('parkingToSketchup: missing input "state".');
  if (!built || !Array.isArray(built.levels)) throw new Error('parkingToSketchup: missing input "built.levels".');
  const mt = meta || {};
  const d = parkingDerived(state, built, metrics);

  const tagList = [], matList = [], declared = new Set();
  const declare = (name, visible = true) => {
    if (declared.has(name)) return;
    declared.add(name);
    tagList.push({ name, color: COLORS[name], visible });
    matList.push({ name, color: COLORS[name], alpha: 1 });
  };

  const levelsKids = [], stallKids = [], rampKids = [], columnKids = [], barrierKids = [];
  const column = num(state.grid && state.grid.column, 2);
  const barrierH = num(state.checks && state.checks.barrierProvided, 3.5);
  const wallT = num(state.footprint && state.footprint.perimeter, 0) > 0 ? state.footprint.perimeter : 0.5;
  let slabs = 0, gross = 0, ramps = 0;
  let zLow = Infinity, zTop = -Infinity;

  d.levels.forEach((lv, i) => {
    const src = built.levels[i] || {};
    const ftf = num(src.ftf, 10.5);
    const name = `Level ${lv.index}`;
    const z = lv.z;
    zLow = Math.min(zLow, z - SLAB);
    zTop = Math.max(zTop, z + ftf);

    // slab
    if (lv.plate.length) {
      declare("Levels");
      const solid = (nm, pc, extra = {}) => ({ type: "solid", name: nm, tag: "Levels", material: "Levels", outer: pc.outer, holes: pc.holes, z0: r3(z - SLAB), z1: r3(z), ...extra });
      const area = lv.plate.reduce((s, pc) => s + ringsArea(pc), 0);
      const attributes = { level: lv.index, stalls: lv.stalls.length, area_sf: r2(area) };
      levelsKids.push(lv.plate.length === 1
        ? solid(name, lv.plate[0], { attributes })
        : { type: "group", name, tag: "Levels", material: "Levels", attributes, children: lv.plate.map((pc, k) => solid(`${name} · piece ${k + 1}`, pc)) });
      slabs += lv.plate.length;
      gross += area;
    }

    // stalls
    const by = { Stalls: [], Accessible: [], EV: [] };
    for (const s of lv.stalls) by[s.kind === "accessible" || s.kind === "van" ? "Accessible" : s.kind === "ev" ? "EV" : "Stalls"].push(closedLine(s.outer, z));
    const nodes = [];
    for (const [tag, lines] of Object.entries(by)) {
      if (!lines.length) continue;
      declare(tag);
      nodes.push({ type: "lines", name: `${name} ${tag.toLowerCase()}`, tag, material: tag, lines });
    }
    if (nodes.length) stallKids.push({ type: "group", name, children: nodes });

    // ramps
    for (const rp of lv.ramps) {
      const tris = parkTriangulate(rp.outer3d);
      if (!tris.length) continue;
      declare("Ramps");
      rampKids.push({ type: "mesh", name: `${name} · ${rp.id}`, tag: "Ramps", material: "Ramps", vertices: rp.outer3d.map((p) => p.slice()), triangles: tris, soft: false, closed: false, attributes: { level: lv.index, slope: rp.slope } });
      ramps++;
    }

    // columns
    if (lv.columns.length && ftf - SLAB > 0.5) {
      declare("Columns");
      const kids = [];
      lv.columns.forEach((c, k) => {
        const outer = cleanRing2(square(c, column));
        if (outer) kids.push({ type: "solid", name: `C${k + 1}`, tag: "Columns", material: "Columns", outer, holes: [], z0: r3(z), z1: r3(z + ftf - SLAB) });
      });
      if (kids.length) columnKids.push({ type: "group", name, children: kids });
    }

    // barriers
    const walls = [];
    for (const pc of lv.plate) for (const ring of [pc.outer, ...pc.holes]) for (const w of wallRings(ring, wallT)) walls.push(w);
    if (walls.length && barrierH > 0.1) {
      declare("Barriers");
      barrierKids.push({ type: "group", name, children: walls.map((w, k) => ({ type: "solid", name: `Wall ${k + 1}`, tag: "Barriers", material: "Barriers", outer: w, holes: [], z0: r3(z), z1: r3(z + barrierH) })) });
    }
  });

  // cores: the same in plan on every level
  const coreKids = [];
  const cores = d.levels.length ? d.levels[0].cores : [];
  if (cores.length && isFinite(zLow) && zTop - zLow > 0.01) {
    declare("Cores");
    for (const c of cores) coreKids.push({ type: "solid", name: c.id, tag: "Cores", material: "Cores", outer: c.outer, holes: [], z0: r3(zLow), z1: r3(zTop), attributes: { kind: c.kind } });
  }

  const children = [];
  if (levelsKids.length) children.push({ type: "group", name: "Levels", children: levelsKids });
  if (stallKids.length) children.push({ type: "group", name: "Stalls", children: stallKids });
  if (rampKids.length) children.push({ type: "group", name: "Ramps", children: rampKids });
  if (columnKids.length) children.push({ type: "group", name: "Columns", children: columnKids });
  if (coreKids.length) children.push({ type: "group", name: "Cores", children: coreKids });
  if (barrierKids.length) children.push({ type: "group", name: "Barriers", children: barrierKids });

  const m = d.metrics;
  const name = String(mt.name || state.name || "Parking Deck");
  const notes = [
    "Plan origin = the tool's plan origin (0, 0) in the massing frame. x = east, y = north. Lengths in feet. z = floor surface above the base.",
    `Parking Deck Generator: ${m.levels} levels, ${m.stalls} stalls, ${m.sfPerStall} sf per stall, gross deck area ${Math.round(gross).toLocaleString("en-US")} sf, ${ramps} ramp meshes.`,
    "Each level is a 1 ft slab whose top is the floor surface. Stalls are outlines on the floor surface. Helix and sloped bays show as ramp meshes on top of the flat slab.",
  ];

  return makeDoc({
    source: SKETCHUP_SOURCE, name, location: mt.location || null, zShift: num(mt.zShift, 0), notes,
    tags: tagList, materials: matList, createdAt: mt.createdAt,
    root: { type: "group", name, children },
  });
}

return { SKETCHUP_SOURCE, parkingToSketchup };
})();
