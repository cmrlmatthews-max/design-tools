  function init(hostEl) {
    host = hostEl;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    } catch (e) {
      host.innerHTML = '<div class="gl-fail">WebGL is not available in this browser, so the 3D view cannot start.</div>';
      renderer = null;
      return false;
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    host.appendChild(renderer.domElement);

    buildScene();
    persp = new THREE.PerspectiveCamera(FOV, 1, 1, 100000);
    ortho = new THREE.OrthographicCamera(-ORTHO_HALF, ORTHO_HALF, ORTHO_HALF, -ORTHO_HALF, 0.1, 100000);
    cam = persp;
    persp.position.set(300, 250, 300);

    controls = new OrbitControls(cam, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.12;
    controls.maxPolarAngle = Math.PI / 2;      // never below ground; exactly horizontal is allowed (elevations)
    controls.minDistance = 8;
    controls.maxDistance = 60000;
    controls.minZoom = 0.01; controls.maxZoom = 80;
    controls.screenSpacePanning = true;
    controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
    controls.addEventListener('start', () => {
      tween = null;
      if (preset) { preset = null; overlayVis = null; viewListeners.forEach((fn) => fn(null)); }
    });
    controls.addEventListener('change', () => { needsRender = true; });

    const ro = new ResizeObserver(resize);
    ro.observe(host);
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onTheme = () => { themeEpoch++; viewVersion = -1; };
    if (mq.addEventListener) mq.addEventListener('change', onTheme); else if (mq.addListener) mq.addListener(onTheme);

    renderer.domElement.addEventListener('webglcontextlost', (e) => e.preventDefault());
    refreshColors();
    resize();
    requestAnimationFrame(frame);
    return true;
  }

  return {
    init, setView, capture, captureClean, captureFlags: () => (lastCapture ? { ...lastCapture } : null), enterCompare, exitCompare,
    sceneFlags: () => ({ site: layers.site.group.visible, slabY: ground.position.y, shadowPlane: shadowPlane.visible, grid: gridMesh.visible, figure: figure.visible, model: layers.model.group.visible, context: layers.context.group.visible, overlay: layers.overlay.group.visible, children: scene.children.length }),
    setInsetProvider: (fn) => { insetProvider = fn; },
    refreshInsets: (animate = true) => { if (!renderer) return; applyViewOffset(); if (preset) setView(preset, animate); else needsRender = true; },
    relayout: () => { needsRender = true; resizeListeners.forEach((fn) => fn()); },
    cells: () => (cmp ? cmpRects() : []),
    requestRender: () => { needsRender = true; },
    onRebuild: (fn) => rebuildListeners.push(fn),
    onViewChange: (fn) => viewListeners.push(fn),
    onResize: (fn) => resizeListeners.push(fn),
    overlayInfo: () => { const kids = layers.overlay.group.children; return { total: kids.length, plan: kids.filter((o) => o.userData.plan).length, planVisible: kids.some((o) => o.userData.plan && o.visible), labels: kids.filter((o) => o.userData.label).map((o) => o.userData.label) }; },
    framedBox: (id = 'axon') => framingBox(id === 'axon'),       // tests: the box a preset frames
    info: () => ({ camera: camType, preset, meshes: layers ? layers.model.group.children.length : 0, tweening: !!tween, distance: cam ? cam.position.distanceTo(controls.target) : 0, zoom: cam ? cam.zoom : 0, compare: !!cmp, drawQuality: derived ? Derived.display(Store.gestureActive() && !Store.gesturePath().startsWith('view')).quality : null }),
    ready: () => !!renderer,
    comparing: () => !!cmp,
    // v1.1 hooks for direct editing (Select): the camera, the orbit controls, the overlay group and a per-frame callback
    overlayGroup: () => selOverlay,
    onFrame: (fn) => frameListeners.push(fn),
    camera: () => cam,
    cameraType: () => camType,
    canvas: () => (renderer ? renderer.domElement : null),
    shiftView: (rotDeg, dx, dy, dz = 0) => { if (!controls || !cam) return; const m = new THREE.Matrix4().makeRotationY(rotDeg * Math.PI / 180); m.setPosition(dx, dz, -dy); cam.position.applyMatrix4(m); controls.target.applyMatrix4(m); controls.update(); needsRender = true; },     // the placement gizmo: the view follows a moved building
    themeChanged: () => { themeEpoch++; viewVersion = -1; needsRender = true; },        // tests: what a light/dark switch does
    sceneObjects: () => { const out = []; scene.traverse((o) => out.push(o)); return out; },        // tests
    modelMeshes: () => { const out = []; if (!cmp && layers) layers.model.group.children.forEach((o) => { if (o.isMesh && o.userData.model) out.push(o); }); return out; },
    setOrbitEnabled: (on) => { if (controls) { controls.enabled = !!on; if (!on) tween = null; } },
    orbitEnabled: () => !!controls && controls.enabled,
  };
})();

/* ==========================================================================
   SITE LAYER 3D  (docs/site-layer-technical-plan.md sections 4 and 5)
   `SiteLayer3D` turns the data of SiteLayerMod.buildSiteLayerData (plain arrays in a tool's local frame, z relative to the
   tool's base) into Three.js objects: the ground with elevation shading and a skirt, the draped boundary with its north arrow,
   the neighbor buildings (solid, with dark edges), roads, walks, water and trees. One merged BufferGeometry per kind.
   Same look as the Site Model scene (build/site/03_scene.js).

   Shared by every tool. Page globals used (at call time only): THREE, BufferGeometryUtils, planToWorld, planMatrix, worldVec.
   The tool's own 06c_site.js (SiteLayer) decides when to build and calls objects() inside kit.syncLayer.

   Everything draped on the ground (roads, walks, trees, the boundary arrow) samples the drawn ground MESH (the same two
   triangles per cell as the ground geometry), so nothing floats or sinks. Without a ground the sampler gives 0.
   ========================================================================== */
const SiteLayer3D = (() => {
  const ALL_PARTS = ['ground', 'boundary', 'buildings', 'roads', 'walks', 'water', 'trees'];
  const EDGE_ANGLE = 30;
  const GLASS_OPACITY = 0.25;            // site style 'glass'
  const STYLES = ['solid', 'glass', 'wireframe'];
  const BOUNDARY_COLOR = 0xc0701a;       // the Tower's dashed site loop
  const ARROW_COLOR = 0x1d2733;

  /* ---- colors from the CSS tokens (light value, dark value when the page has no token yet) ---- */
  const FALLBACK = {
    '--scene-terrain-lo': ['#d6dadd', '#3a4047'], '--scene-terrain-hi': ['#eceeef', '#4a5159'], '--scene-skirt': ['#bcc2c8', '#2a2f35'],
    '--scene-est': ['#efe2cf', '#dccaa9'], '--scene-road': ['#9ba1a8', '#656c74'], '--scene-walk': ['#c6cacd', '#858d95'],
    '--scene-water': ['#8dbbe3', '#3f72a6'], '--scene-tree': ['#8fa88b', '#6e8d6c'], '--scene-trunk': ['#8a8378', '#8a8378'],
    '--scene-model': ['#f6f6f3', '#efefec'], '--scene-edge': ['#20262d', '#e7eaee'],
  };
  const isDark = () => { try { return !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); } catch (e) { return false; } };
  function defaultCss(name, fallback) {
    let v = '';
    try { v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); } catch (e) { v = ''; }
    const fb = fallback || (FALLBACK[name] ? FALLBACK[name][isDark() ? 1 : 0] : '#888888');
    try { return new THREE.Color(v || fb); } catch (e) { return new THREE.Color(fb); }
  }

  /* ---- the drawn ground surface: elevation at a local point (relative z) ---- */
  /** Sampler over data.ground. The grid may be rotated (a rotated placement turns the mesh as a solid), so the query point is
   *  projected on the two grid axes. Same triangles as the mesh: cell split a-b-c / a-c-d, u >= v. null without a ground. */
  function makeSampler(g) {
    if (!g || !g.positions || !(g.n >= 2)) return null;
    const P = g.positions, n = g.n, d = g.spacing;
    const x0 = P[0], y0 = P[1];
    let e1x = (P[3] - x0) / d, e1y = (P[4] - y0) / d;
    let e2x = (P[3 * n] - x0) / d, e2y = (P[3 * n + 1] - y0) / d;
    const l1 = Math.hypot(e1x, e1y) || 1, l2 = Math.hypot(e2x, e2y) || 1;
    e1x /= l1; e1y /= l1; e2x /= l2; e2y /= l2;
    const L = n - 1;
    return (x, y) => {
      const dx = x - x0, dy = y - y0;
      const cu = Math.min(L, Math.max(0, (dx * e1x + dy * e1y) / d)), cv = Math.min(L, Math.max(0, (dx * e2x + dy * e2y) / d));
      const i = Math.min(Math.floor(cu), n - 2), j = Math.min(Math.floor(cv), n - 2);
      const u = cu - i, v = cv - j, o = j * n + i;
      const za = P[3 * o + 2], zb = P[3 * (o + 1) + 2], zc = P[3 * (o + n + 1) + 2], zd = P[3 * (o + n) + 2];
      return u >= v ? za + u * (zb - za) + v * (zc - zb) : za + u * (zc - zd) + v * (zd - za);
    };
  }

  /* ---- helpers ---- */
  /** Maps the y (elevation) of a world-space geometry through zOf. Only for a non-identity zOf. */
  function mapElevation(geo, zOf) {
    if (!zOf) return geo;
    const p = geo.getAttribute('position');
    for (let i = 0; i < p.count; i++) p.setY(i, zOf(p.getY(i)));
    p.needsUpdate = true;
    return geo;
  }
  function densifyRing(ring, step) {
    const out = [];
    for (let i = 0; i < ring.length; i++) {
      const a = ring[i], b = ring[(i + 1) % ring.length];
      out.push(a);
      const L = Math.hypot(b[0] - a[0], b[1] - a[1]), k = Math.ceil(L / step);
      for (let s = 1; s < k; s++) out.push([a[0] + (b[0] - a[0]) * s / k, a[1] + (b[1] - a[1]) * s / k]);
    }
    return out;
  }
  /** Drops a repeated closing point (ShapeUtils would drop it and shift the hole indices). */
  function trimRing(r) {
    const o = r.slice();
    while (o.length > 1 && o[0][0] === o[o.length - 1][0] && o[0][1] === o[o.length - 1][1]) o.pop();
    return o;
  }
  /** polys: [{ outer, holes }]. elevOf(x, y) gives the local elevation, zOf maps it to world y. Returns a BufferGeometry or null. */
  function polyGeometry(polys, elevOf, zOf, step) {
    const pos = [], idx = [];
    for (const p of polys) {
      try {
        const outer = step ? densifyRing(trimRing(p.outer), step) : trimRing(p.outer);
        const holes = (p.holes || []).map((hh) => (step ? densifyRing(trimRing(hh), step) : trimRing(hh)));
        const tris = THREE.ShapeUtils.triangulateShape(outer.map((q) => new THREE.Vector2(q[0], q[1])), holes.map((hh) => hh.map((q) => new THREE.Vector2(q[0], q[1]))));
        const all = outer.concat(...holes), base = pos.length / 3;
        for (const q of all) pos.push(q[0], zOf(elevOf(q[0], q[1])), -q[1]);
        for (const [a, b, c] of tris) {
          const ax = all[a][0], ay = all[a][1], bx = all[b][0], by = all[b][1], cx = all[c][0], cy = all[c][1];
          const ccw = (bx - ax) * (cy - ay) - (by - ay) * (cx - ax) > 0;      // plan CCW = facing up
          if (ccw) idx.push(base + a, base + b, base + c); else idx.push(base + a, base + c, base + b);
        }
      } catch (e) { console.warn('site polygon skipped', e); }
    }
    if (!idx.length) return null;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    return geo;
  }
  const mergeAll = (list) => {
    if (list.length === 1) return list[0];
    const merged = BufferGeometryUtils.mergeGeometries(list, false);
    list.forEach((g) => g.dispose());
    return merged;
  };

  /* ---- the parts ---- */
  function buildGround(data, o, mats, out, info) {
    const g = data.ground;
    if (!g) return;
    const n = g.n, N = n * n, P = g.positions;
    const lo = o.css('--scene-terrain-lo'), hi = o.css('--scene-terrain-hi'), c = new THREE.Color();
    const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
    for (let k = 0; k < N; k++) {
      pos[3 * k] = P[3 * k]; pos[3 * k + 1] = o.zOf(P[3 * k + 2]); pos[3 * k + 2] = -P[3 * k + 1];
      c.copy(lo).lerp(hi, g.shade[k]);
      col[3 * k] = c.r; col[3 * k + 1] = c.g; col[3 * k + 2] = c.b;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    geo.setIndex(new THREE.BufferAttribute(g.indices, 1));
    geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, metalness: 0, polygonOffset: true, polygonOffsetFactor: 2, polygonOffsetUnits: 2 });
    mats.push(mat);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.userData.kind = 'site-ground';
    mesh.userData.site = true;
    mesh.userData.receives = true;
    out.push(mesh);
    info.triangles += g.indices.length / 3;

    // skirt: a thin plate under the ground, the site reads as a physical model
    const sk = g.skirt;
    if (sk && sk.positions && sk.indices) {
      const sp = new Float32Array(sk.positions.length);
      for (let k = 0; k < sk.positions.length; k += 3) { sp[k] = sk.positions[k]; sp[k + 1] = o.zOf(sk.positions[k + 2]); sp[k + 2] = -sk.positions[k + 1]; }
      const sg = new THREE.BufferGeometry();
      sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
      sg.setIndex(new THREE.BufferAttribute(sk.indices, 1));
      sg.computeVertexNormals();
      const smat = new THREE.MeshStandardMaterial({ color: o.css('--scene-skirt'), roughness: 1, metalness: 0 });
      mats.push(smat);
      const skirt = new THREE.Mesh(sg, smat);
      skirt.userData.kind = 'site-skirt';
      skirt.userData.site = true;
      out.push(skirt);
      info.triangles += sk.indices.length / 3;
    }
  }

  /** The dashed site loop, just above the ground, and the north arrow beside its north-east corner (turns with the placement). */
  function buildBoundary(data, o, mats, out, zAt) {
    const ring = data.boundary;
    if (!ring || ring.length < 3) return;
    const dashed = new THREE.LineDashedMaterial({ color: BOUNDARY_COLOR, dashSize: 12, gapSize: 8 });
    const solid = new THREE.LineBasicMaterial({ color: ARROW_COLOR });
    mats.push(dashed, solid);
    const loop = new THREE.BufferGeometry().setFromPoints(ring.map((q) => worldVec(q[0], q[1], o.zOf(q[2]))));
    const line = new THREE.LineLoop(loop, dashed);
    line.computeLineDistances();
    line.userData.kind = 'site-boundary';
    out.push(line);

    // north arrow: project north in the local frame is (sin r, cos r); a shaft, a head and an N, flat on the ground
    const r = ((o.rotation || 0) * Math.PI) / 180, nx = Math.sin(r), ny = Math.cos(r), ex = ny, ey = -nx;     // north and east unit vectors
    let maxX = -Infinity, maxY = -Infinity, minX = Infinity, minY = Infinity;
    for (const q of ring) { maxX = Math.max(maxX, q[0]); maxY = Math.max(maxY, q[1]); minX = Math.min(minX, q[0]); minY = Math.min(minY, q[1]); }
    const span = Math.max(maxX - minX, maxY - minY, 1);
    const k = Math.max(0.5, Math.min(4, span / 1000));                                         // scales with the site, 1 at 1,000 ft
    let best = null;                                                                           // the boundary corner farthest toward north-east
    for (const q of ring) { const s = q[0] * (ex + nx) + q[1] * (ey + ny); if (!best || s > best.s) best = { s, q }; }
    const base = [best.q[0] + (ex - nx) * 30 * k, best.q[1] + (ey - ny) * 30 * k];
    const P = (a, b) => [base[0] + ex * a * k + nx * b * k, base[1] + ey * a * k + ny * b * k];   // a = east, b = north
    const pts = [];
    const seg = (p, q) => { pts.push(worldVec(p[0], p[1], o.zOf(zAt(p[0], p[1]) + 0.3)), worldVec(q[0], q[1], o.zOf(zAt(q[0], q[1]) + 0.3))); };
    // each stroke is cut into short pieces so it follows a sloping ground
    const stroke = (p, q) => { const m = Math.max(1, Math.ceil(Math.hypot(q[0] - p[0], q[1] - p[1]) / (6 * k))); for (let s = 0; s < m; s++) seg([p[0] + (q[0] - p[0]) * s / m, p[1] + (q[1] - p[1]) * s / m], [p[0] + (q[0] - p[0]) * (s + 1) / m, p[1] + (q[1] - p[1]) * (s + 1) / m]); };
    stroke(P(0, 0), P(0, 40)); stroke(P(0, 40), P(-7, 26)); stroke(P(0, 40), P(7, 26));
    stroke(P(-6, 50), P(-6, 68)); stroke(P(-6, 68), P(6, 50)); stroke(P(6, 50), P(6, 68));      // the letter N
    const arrow = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), solid);
    arrow.userData.kind = 'site-arrow';
    out.push(arrow);
  }

  function buildBuildings(data, o, mats, out, info) {
    const plain = [], est = [];
    let count = 0;
    for (const b of data.buildings || []) {
      try {
        if (!b.outer || b.outer.length < 3) continue;
        const shape = new THREE.Shape(b.outer.map((q) => new THREE.Vector2(q[0], q[1])));
        for (const hole of b.holes || []) if (hole.length >= 3) shape.holes.push(new THREE.Path(hole.map((q) => new THREE.Vector2(q[0], q[1]))));
        const geo = new THREE.ExtrudeGeometry(shape, { depth: Math.max(0.1, b.height) + 1, bevelEnabled: false, steps: 1, curveSegments: 1 });
        geo.deleteAttribute('uv');
        geo.applyMatrix4(planMatrix(b.base - 1));
        mapElevation(geo, o.identity ? null : o.zOf);
        (b.rule === 'estimate' ? est : plain).push(geo);
        count++;
      } catch (e) { console.warn('site building skipped', b && b.id, e); }
    }
    const style = o.style;
    for (const [list, color] of [[plain, o.css('--scene-model')], [est, o.css('--scene-est')]]) {
      if (!list.length) continue;
      const merged = mergeAll(list);
      let tris = 0;
      if (style !== 'wireframe') {                                  // wireframe: edges only, no faces
        const glass = style === 'glass';
        const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.94, metalness: 0 });
        if (glass) { mat.transparent = true; mat.opacity = GLASS_OPACITY; mat.depthWrite = false; }
        mats.push(mat);
        const mesh = new THREE.Mesh(merged, mat);
        mesh.userData.kind = 'site-buildings';
        mesh.userData.site = true;
        mesh.userData.casts = true; mesh.userData.receives = !glass;
        if (glass) mesh.renderOrder = 2;                            // after the ground and the roads
        out.push(mesh);
        tris = (merged.index ? merged.index.count : merged.getAttribute('position').count) / 3;
        info.triangles += tris;
      }
      if (o.edges || style === 'wireframe') {                       // a wireframe is its edges: they stay even when edges is off
        const emat = new THREE.LineBasicMaterial({ color: o.css('--scene-edge') });
        mats.push(emat);
        const edges = new THREE.LineSegments(new THREE.EdgesGeometry(merged, EDGE_ANGLE), emat);
        edges.userData.kind = 'site-building-edges';
        edges.userData.site = true;
        if (style !== 'solid') edges.renderOrder = 3;
        out.push(edges);
      }
      if (style === 'wireframe') merged.dispose();                  // no mesh holds it
    }
    info.buildings = count;
  }

  function buildPavement(polys, colorName, lift, factor, kind, o, mats, out, info, zAt) {
    if (!polys || !polys.length) return;
    const geo = polyGeometry(polys, (x, y) => zAt(x, y) + lift, o.zOf, 10);
    if (!geo) return;
    const mat = new THREE.MeshStandardMaterial({ color: o.css(colorName), roughness: 1, metalness: 0, polygonOffset: true, polygonOffsetFactor: factor, polygonOffsetUnits: factor });
    mats.push(mat);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.userData.kind = kind;
    mesh.userData.site = true;
    mesh.userData.receives = true;
    out.push(mesh);
    info.triangles += geo.index.count / 3;
    info[kind === 'site-roads' ? 'roads' : 'walks'] = polys.length;
  }

  function buildWater(data, o, mats, out, info) {
    const w = data.water || {};
    const geos = [];

          const dir = isW ? [Math.cos(a), Math.sin(a)] : [-Math.sin(a), Math.cos(a)];
          const e0 = isW ? num(base.width, 0) : num(base.depth, 0);
          const ext = clamp(SnapMod.snapLength(e0 + t, { step: enabled ? 1 : 0.1 }), 20, MAXD);
          const shift = (ext - e0) / 2;                                  // the opposite edge stays
          write(`${bp}.${isW ? 'width' : 'depth'}`, r4(ext));
          write(`${bp}.x`, r4(num(base.x, 0) + dir[0] * shift));
          write(`${bp}.y`, r4(num(base.y, 0) + dir[1] * shift));
          label = `${isW ? 'Width' : 'Depth'} ${fmt(ext)}`;
        }
      } else if (it.kind === 'core') {
        const ax = id === 'move-x' ? 'x' : 'y';
        const res = SnapMod.snapMove(box, ax === 'x' ? { dx: t, dy: 0 } : { dx: 0, dy: t }, drag.targets, tolOpts);
        const delta = enabled ? (ax === 'x' ? res.dx : res.dy) : rnd(t, 10);
        guides = res.guides.filter((g) => g.axis === ax && g.kind !== 'grid');
        const v = r4(num(base[ax], 0) + delta);
        write(`${bp}.${ax}`, v);
        label = `Core ${ax} ${fmt(v)}`;
      } else if (it.kind === 'entry') {
        const alongY = base.side === 'west' || base.side === 'east';
        const ax = alongY ? 'y' : 'x';
        const res = SnapMod.snapMove(box, ax === 'x' ? { dx: t, dy: 0 } : { dx: 0, dy: t }, drag.targets, tolOpts);
        const delta = enabled ? (ax === 'x' ? res.dx : res.dy) : rnd(t, 10);
        guides = res.guides.filter((g) => g.axis === ax && g.kind !== 'grid');
        const wdt = num(base.width, 24), len = alongY ? drag.frameD : drag.frameW;
        const at = clamp(r4(num(base.at, 0) + delta), Math.min(wdt / 2, len / 2), Math.max(len - wdt / 2, len / 2));
        write(`${bp}.at`, at);
        label = `Entry at ${fmt(at)}`;
      } else {
        // the speed ramp
        const fpBox = box;
        const bw = fpBox.maxX - fpBox.minX, bd = fpBox.maxY - fpBox.minY;
        if (id === 'move-x' || id === 'move-y') {
          const ax = id === 'move-x' ? 'x' : 'y';
          const res = SnapMod.snapMove(fpBox, ax === 'x' ? { dx: t, dy: 0 } : { dx: 0, dy: t }, drag.targets, tolOpts);
          let delta = enabled ? (ax === 'x' ? res.dx : res.dy) : rnd(t, 10);
          guides = res.guides.filter((g) => g.axis === ax && g.kind !== 'grid');
          let v = num(base[ax], 0) + delta;
          if (ax === 'y' && drag.strip && drag.strip.y1 - drag.strip.y0 >= bd - 0.001) v = clamp(v, drag.strip.y0, drag.strip.y1 - bd);   // stays in the strip
          if (ax === 'x') v = clamp(v, 0, Math.max(0, drag.frameW - bw));
          write(`${bp}.${ax}`, r4(v));
          label = `Ramp ${ax} ${fmt(v)}`;
        } else {
          const T = RampsMod.speedRampFootprint({ ...Store.raw(), ramp: { ...Store.raw().ramp, speed: base } });
          const tr = T ? (T.box[2] - T.box[0]) - num(base.length, 0) : 0;      // the two transitions
          const r = SnapMod.snapEdge(fpBox.maxX + t, 'x', drag.targets, { tolerance: drag.tol, grid: 0, enabled, span: { from: fpBox.minY, to: fpBox.maxY } });
          let L = r.value - fpBox.minX - tr;
          if (!r.guide) L = SnapMod.snapLength(L, { step: enabled ? 1 : 0.1 });
          if (r.guide && r.guide.kind !== 'grid') guides = [r.guide];
          L = clamp(L, 20, Math.max(20, Math.min(400, drag.frameW - num(base.x, 0) - tr)));
          write(`${bp}.length`, r4(L));
          label = `Length ${fmt(L)}`;
        }
      }
    }
    lastDrag = { id, label, guides: guides.map((g) => ({ axis: g.axis, value: g.value, kind: g.kind, label: g.label })) };
    showGuides(guides, drag.info.z1, drag.frame);
    setLabel(label, guides, cx, cy);
    return lastDrag;
  }
  function setLabel(text, guides, cx, cy) {
    const rect = canvasRect();
    labelEl.hidden = false;
    labelEl.textContent = '';
    labelEl.append(h('b', null, text));
    const g = (guides || []).find((x) => x && x.label);
    if (g) labelEl.append(h('span', null, g.label));
    const x = clamp(cx - rect.left + 18, 8, rect.width - 190), y = clamp(cy - rect.top - 52, 8, rect.height - 60);
    labelEl.style.transform = `translate(${x.toFixed(0)}px, ${y.toFixed(0)}px)`;
  }
  function endDrag(ok = true) {
    if (!drag) return;
    const d = drag;
    if (d.raf) cancelAnimationFrame(d.raf);
    drag = null;
    if (!ok) for (const [path, v] of Object.entries(d.orig)) Store.set(path, v, { live: true });
    Store.commit();
    Render.setOrbitEnabled(true);
    delete $('viewport').dataset.dragging;
    clearGroup(guideGroup);
    labelEl.hidden = true;
    Render.requestRender();
    syncHandles();
  }

  /** Test hook: the same drag math as a real drag, driven by world deltas (feet) instead of pointer events.
   *  simulateHandleDrag('move-x', dx) · ('move-y', 0, dy) · ('slide', d) · ('width', dw) · ('depth', dd) · ('length', dl)
   *  · ('rotate', angleDegrees); opts { alt, hold }. With hold the drag stays open (guides and label stay on screen) until releaseHandleDrag(). */
  function simulateHandleDrag(id, a = 0, b = 0, opts = {}) {
    if (!ready) return null;
    if (drag) endDrag(true);
    const info = items.length === 1 ? handleInfo(items[0]) : null;
    const hd = info && info.hs.find((x) => x.id === id);
    if (!hd) return null;
    let target;
    if (id === 'rotate') {
      const f = Store.get('footprint');
      const off = Math.atan2(num(f.depth, 1), num(f.width, 1));
      const rad = (a * Math.PI) / 180 + off, R = 100;
      target = worldVec(num(f.x, 0) + R * Math.cos(rad), num(f.y, 0) + R * Math.sin(rad), info.z0);
    } else {
      const amount = (id === 'move-y') ? (b !== 0 ? b : a) : a;
      target = hd.anchor.clone().addScaledVector(hd.axis, amount);

    const p0 = toClient(hd.anchor), p1 = toClient(target);
    if (!startDrag(id, p0.x, p0.y, { touch: !!opts.touch })) return null;
    const res = dragMove(p1.x, p1.y, !!opts.alt);
    if (!opts.hold) endDrag(true);
    return res;
  }

  /* ==========================================================================
     Selection actions
     ========================================================================== */
  function setItems(next) {
    const out = [];
    for (const it of next || []) {
      if (!it || !KINDS.includes(it.kind)) continue;
      const n = normItem(it);
      if (isValid(n) && !out.some((o) => sameItem(o, n))) out.push(n);
    }
    const changed = JSON.stringify(out) !== JSON.stringify(items);
    if (changed && drag) endDrag(false);
    items = out;
    if (changed) onChanged();
    return changed;
  }
  function toggleItem(it) {
    const n = normItem(it);
    return setItems(items.some((o) => sameItem(o, n)) ? items.filter((o) => !sameItem(o, n)) : [...items, n]);
  }
  const clear = () => setItems([]);
  function onChanged() {
    renderCard();
    refreshOverlay();
    syncHandles();
    syncRows();
    listeners.forEach((fn) => { try { fn(items.map((i) => ({ ...i }))); } catch (e) { console.error(e); } });
  }
  /** Drops items that no longer exist (undo, delete, the source changed). */
  function sanitize() {
    const kept = items.filter(isValid);
    if (kept.length !== items.length) { items = kept; if (drag) endDrag(false); onChanged(); return true; }
    return false;
  }

  function deleteItems(list) {
    const sel = (list || items).map(normItem).filter(isValid);
    if (!sel.length) return 0;
    const next = clone(Store.raw());
    let removed = 0;
    const coreIds = new Set(sel.filter((i) => i.kind === 'core' && editable(i)).map((i) => i.id));
    if (coreIds.size) { next.cores = next.cores.filter((c) => !coreIds.has(c.id)); removed += coreIds.size; }
    const entryIds = new Set(sel.filter((i) => i.kind === 'entry').map((i) => i.id));
    if (entryIds.size) { next.entries = next.entries.filter((e) => !entryIds.has(e.id)); removed += entryIds.size; }
    if (!removed) {
      if (sel.some((i) => i.kind === 'core')) Toast.show('These cores come from the project. Make the cores editable first.', 'warn', 4200);
      return 0;
    }
    Store.replace(next);
    setItems([]);
    return removed;
  }
  function deleteSelection() { return deleteItems(items); }

  /* ==========================================================================
     Click picking
     ========================================================================== */
  const downs = new Map();
  function initPointer() {
    const canvas = Render.canvas();
    canvas.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      for (const r of downs.values()) r.cancel = true;                 // a second finger: a pinch or a pan, never a click
      downs.set(e.pointerId, { x: e.clientX, y: e.clientY, t: performance.now(), cancel: downs.size > 0 });
    });
    canvas.addEventListener('pointermove', (e) => {
      const r = downs.get(e.pointerId);
      if (r && Math.hypot(e.clientX - r.x, e.clientY - r.y) > PICK_PX) r.cancel = true;
    });
    canvas.addEventListener('pointercancel', (e) => downs.delete(e.pointerId));
    canvas.addEventListener('pointerup', (e) => {
      const r = downs.get(e.pointerId);
      downs.delete(e.pointerId);
      if (!r || r.cancel || downs.size) return;
      if (Math.hypot(e.clientX - r.x, e.clientY - r.y) > PICK_PX || performance.now() - r.t > PICK_MS) return;
      click(e.clientX, e.clientY, e.shiftKey);
    });
    canvas.addEventListener('dblclick', (e) => {
      const hit = pickAt(e.clientX, e.clientY);
      if (hit) { setItems([hit]); UI.openItem(hit); }
    });
  }
  function click(cx, cy, shift) {
    const hit = pickAt(cx, cy);
    if (hit) { if (shift) toggleItem(hit); else setItems([hit]); }
    else if (!shift) clear();
    return hit;
  }

  /* ==========================================================================
     Selection card (#selection-card)
     ========================================================================== */
  let cardFns = [], cardRefs = null;
  /** A store bind for a field of the selected item, found by its id each time (so reordering the lists never breaks the card). */
  const bindItem = (it, sub) => ({
    get: () => { const p = basePath(it); return p ? Store.get(`${p}.${sub}`) : undefined; },
    set: (v, live) => { const p = basePath(it); if (p) Store.set(`${p}.${sub}`, v, { live }); },
    commit: () => Store.commit(),
  });
  const lenF = (it, label, sub, extra = {}) => Controls.slider({
    label, bind: bindItem(it, sub), min: 0, max: 1, step: 1, hardMin: 1, hardMax: MAXD, format: Units.formatFeetInches, parse: Units.parseLength, inputMode: 'text', compact: true, ...extra,
  });
  const offF = (it, label, sub) => lenF(it, label, sub, { hardMin: -MAXD });
  const degF = (it, label, sub) => Controls.slider({
    label, bind: bindItem(it, sub), min: 0, max: 1, step: 1, hardMin: -360, hardMax: 360, format: (v) => `${Math.round(v * 10) / 10}°`, inputMode: 'decimal', compact: true,
  });

  function fieldsFor(it) {
    const els = (list) => list.map((c) => c.el || c);
    if (!editable(it)) return [];
    if (it.kind === 'footprint') {
      if (Store.get('footprint.shape') === 'polygon') return [];
      return els([offF(it, 'Center x', 'x'), offF(it, 'Center y', 'y'), lenF(it, 'Width', 'width'), lenF(it, 'Depth', 'depth'), degF(it, 'Angle', 'angle')]);
    }
    if (it.kind === 'core') return els([offF(it, 'x', 'x'), offF(it, 'y', 'y'), lenF(it, 'Width', 'w'), lenF(it, 'Depth', 'd')]);
    if (it.kind === 'entry') return els([lenF(it, 'Along the side', 'at', { hardMin: 0 }), lenF(it, 'Lane width', 'width', { hardMin: 10, hardMax: 60 })]);
    if (it.kind === 'speed') return els([offF(it, 'x', 'x'), offF(it, 'y', 'y'), lenF(it, 'Width', 'width', { hardMin: 10, hardMax: 60 }), ...(Store.get('ramp.speed.shape') === 'circular' ? [] : [lenF(it, 'Length', 'length', { hardMin: 20 })])]);
    return [];
  }

  function renderCard() {
    const card = $('selection-card');
    if (!card) return;
    card.textContent = '';
    cardFns = []; cardRefs = null;
    if (!items.length) { card.hidden = true; return; }
    card.hidden = false;
    const one = items.length === 1 ? items[0] : null;
    const refs = cardRefs = {};
    const built = Controls.scoped(() => {
      refs.title = h('b', { class: 'sc-name' });
      refs.sub = h('span', { class: 'sc-sub' });
      const clearBtn = h('button', { class: 'ibtn', type: 'button', 'aria-label': 'Clear selection', title: 'Clear selection (Esc)', html: ICON_X, onclick: clear });
      card.append(h('div', { class: 'sc-head' }, h('div', { class: 'sc-titles' }, refs.title, refs.sub), clearBtn));

      const actions = h('div', { class: 'sc-actions' });
      if (one && one.kind === 'core') {
        if (editable(one)) actions.append(h('button', { class: 'btn outline sm', type: 'button', 'data-action': 'move-to-row', onclick: () => UI.moveCoreById(one.id) }, 'Move to nearest row'));
        else actions.append(h('button', { class: 'btn outline sm', type: 'button', 'data-action': 'make-editable', onclick: () => { UI.makeCoresEditable(); } }, 'Make the cores editable'));
      }
      if (one) actions.append(h('button', { class: 'btn outline sm', type: 'button', 'data-action': 'open', onclick: () => UI.openItem(one) }, 'Open in panel'));
      if (items.some((i) => i.kind === 'core' || i.kind === 'entry')) actions.append(h('button', { class: 'btn outline sm danger-text', type: 'button', 'data-action': 'delete', onclick: () => deleteSelection() }, 'Delete'));
      card.append(actions);
      if (one && fieldsFor(one).length) {
        const fields = h('div', { class: 'sc-fields', hidden: !fieldsOpen }, fieldsFor(one));
        const tog = h('button', { class: 'sc-toggle', type: 'button', 'aria-expanded': String(fieldsOpen), html: `<span>Dimensions</span>${CARET_SVG}`, onclick: () => {
          fieldsOpen = !fieldsOpen; fields.hidden = !fieldsOpen; tog.setAttribute('aria-expanded', String(fieldsOpen));
        } });
        card.append(tog, fields);
      }
    });

    cardFns.forEach((fn) => fn());
  }
  function syncCardText() {
    if (!cardRefs || !items.length) return;
    if (items.length === 1) { cardRefs.title.textContent = itemName(items[0]); cardRefs.sub.textContent = itemSub(items[0]); }
    else {
      const counts = {};
      for (const i of items) counts[i.kind] = (counts[i.kind] || 0) + 1;
      cardRefs.title.textContent = `${items.length} items`;
      cardRefs.sub.textContent = Object.entries(counts).map(([k, n]) => `${n} ${k}${n === 1 ? '' : 's'}`).join(' · ');
    }
  }

  /** Marks the panel rows of the selected items (the other half of the two-way link). */
  const rowItem = (sec, index) => {
    const s = Store.raw();
    if (sec === 'cores') return s.cores[index] ? { kind: 'core', id: s.cores[index].id } : null;
    if (sec === 'entries') return s.entries[index] ? { kind: 'entry', id: s.entries[index].id } : null;
    return null;
  };
  function syncRows() {
    for (const sec of ['cores', 'entries']) {
      document.querySelectorAll(`#sections [data-section="${sec}"] .item[data-index]`).forEach((row) => {
        const it = rowItem(sec, +row.dataset.index);
        row.classList.toggle('sel-row', !!it && items.some((i) => sameItem(i, it)));
      });
    }
  }
  function initPanelLink() {
    $('sections').addEventListener('click', (e) => {
      const head = e.target.closest && e.target.closest('.item-title');
      if (!head) return;
      const row = head.closest('.item[data-index]'), sec = head.closest('[data-section]');
      if (!row || !sec) return;
      const it = rowItem(sec.dataset.section, +row.dataset.index);
      if (!it) return;
      if (e.shiftKey) toggleItem(it); else setItems([it]);
    });
  }

  /* ==========================================================================
     Keyboard (Mac shortcuts)
     ========================================================================== */
  const VIEW_KEYS = { 1: 'axon', 2: 'n', 3: 'e', 4: 's', 5: 'w', 6: 'plan' };
  function typing(e) {
    const t = e.target, a = document.activeElement;
    const inField = (n) => !!n && n.nodeType === 1 && (n.matches('input, textarea, select') || n.isContentEditable);
    return inField(t) || inField(a);
  }
  function menuOpen() {
    return Pop.isOpen() || !!document.querySelector('.modal-back') || !!document.querySelector('.ai-panel[data-open="true"]');
  }
  /** L: isolate the next level (all levels after the last); Shift+L: all levels. */
  function nextLevel(all) {
    const n = D().levels.length;
    const cur = num(Store.get('view.level'), 0);
    const next = all ? 0 : cur >= n ? 0 : cur + 1;
    Store.set('view.level', next, { live: false });
    return next;
  }
  function onKey(e) {
    if (!ready || typing(e) || menuOpen()) return;
    if (Compare.isActive()) return;
    const key = e.key;
    const cmd = e.metaKey || e.ctrlKey;
    if (cmd || e.altKey) return;
    if (key === 'Escape') { if (drag) { endDrag(false); e.preventDefault(); } else if (items.length) { clear(); e.preventDefault(); } return; }
    if (key === 'Delete' || key === 'Backspace') { if (items.length) { e.preventDefault(); deleteSelection(); } return; }
    if (key === 'L') { e.preventDefault(); nextLevel(true); return; }
    if (e.shiftKey) return;
    if (VIEW_KEYS[key]) { e.preventDefault(); Render.setView(VIEW_KEYS[key], true); return; }
    if (key === 'd' || key === 'D') { e.preventDefault(); Store.set('view.style', Store.get('view.style') === 'diagram' ? 'model' : 'diagram', { live: false }); return; }
    if (key === 'l') { e.preventDefault(); nextLevel(false); }
  }

  /* ==========================================================================
     Init
     ========================================================================== */
  function init() {
    ready = Render.ready();
    if (!$('selection-card')) return;
    initPanelLink();
    Store.subscribe(() => {
      sanitize();
      syncCardText();
      cardFns.forEach((fn) => fn());
      syncRows();
    });
    if (!ready) return;
    initOverlay();
    buildHandleLayer();
    initPointer();
    window.addEventListener('keydown', onKey, true);
    Render.onFrame(syncHandles);
    Render.onRebuild(() => { if (items.length) { sanitize(); refreshOverlay(); } });
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    (mq.addEventListener ? mq.addEventListener('change', refreshOverlay) : mq.addListener(refreshOverlay));
    window.addEventListener('resize', () => Render.requestRender());
  }

  return {
    init,
    select: (list) => setItems(list), add: (it) => setItems([...items, it]), toggle: toggleItem, clear,
    get: () => items.map((i) => ({ ...i })), count: () => items.length,
    deleteSelection, deleteItems, nextLevel,
    pickAt, click, screenPointFor, visibleHandles, simulateHandleDrag,
    releaseHandleDrag: () => { flushMove(); endDrag(true); },
    cancelHandleDrag: () => endDrag(false),
    dragging: () => !!drag, lastDrag: () => lastDrag,
    onChange: (fn) => listeners.push(fn),
    refreshOverlay,
    overlayInfo: () => ({ outline: outlineGroup ? outlineGroup.children.length : 0, guides: guideGroup ? guideGroup.children.length : 0 }),
    footprint: footprintOf, editable,
  };
})();

/* ==========================================================================
   PLACEMENT GIZMO  (shared by the Tower, the Mid-Rise Generator and the Parking Deck)
   Drag the building to place it on the project site, turn it with the ring handle.

   - Move: a pointer down on a model mesh (Render.modelMeshes()) starts a move after 6 px of travel. The ground plane of the
     drag is the horizontal plane through the grabbed point. The pointer position is turned into a PROJECT-frame point, so the
     delta is added to placement.x / placement.y directly (no rotation maths). 1 ft steps, 5 ft with Shift.
   - Rotate: a ring around the building box and a grip (DOM, `.hdl.hdl-rotate`) on its local +x side. The building turns about
     its box center in 5 degree steps (1 degree with Alt).
   - Live preview with Store.set(path, value, { live: true }); ONE undo step on release (Store.commit()). On release the base
     elevation follows the ground when the building was moved or turned: ProjectUI.baseFor(placement) gives the lowest ground under
     the footprint (Follow ground), or null to leave the base alone (Typed, no site ground, a wrap or podium deck). A page without
     ProjectUI.baseFor snaps to the ground at the placement origin (SiteLayerMod.groundZAt). Escape or a second finger
     restores the original values and commits nothing.
   - The pointer maths always uses a SNAPSHOT of the camera taken at the start of the drag. While the drag runs, Render.shiftView
     (when the page has it) carries the camera along with the local frame, so the site stays still on screen and the building
     follows the finger. Without that export the building stays still and the site slides: same numbers, less natural.
   - Orbit is off from the pointer down on the model until the pointer is released; it starts on empty ground as before.
   - The Store notifies live sets with live = true: 09b_project.js (Tower, Mid-Rise) re-runs Context from site only on the
     commit notification, so a drag never rewrites the context blocks per frame.

   Globals used at call time: THREE, Store, Render, ProjectUI, ProjectMod, SiteLayerMod (optional, falls back to
   ProjectUI.groundAt), Units, worldVec, h.
   ========================================================================== */
const PlacementGizmo = (() => {
  const PICK_PX = 6;                       // travel before a press on the model becomes a move
  const RING_K = 1.15;                     // ring radius = 1.15 x the half diagonal of the building box
  const MIN_DIRY = 0.12;                   // a view this close to horizontal cannot place on the ground (elevations)
  const SEGS = 72;
  const MAX_ABS = 1e6;
  const TAU = Math.PI * 2;

  let opts = null, ready = false, wired = false;
  let layer = null, svg = null, ringEl = null, rotEl = null, labelEl = null;
  let pend = null;                         // pointer down on the model, no drag yet: { pointerId, x, y, cam, rect, planeY, orbitOff }
  let drag = null;                         // the drag in progress
  let lastLabel = '';
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();

  const fin = (v, d = 0) => (Number.isFinite(+v) ? +v : d);
  const r3 = (v) => Math.round(v * 1000) / 1000;
  const r2 = (v) => Math.round(v * 100) / 100;
  const pathOf = () => (opts && opts.path) || 'placement';
  const isCoarse = () => !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
  const fmt = (v) => (typeof Units !== 'undefined' && Units.formatFeetInches ? Units.formatFeetInches(v) : `${Math.round(v)} ft`);
  const normDeg = (d) => { let r = ((d + 180) % 360 + 360) % 360 - 180; if (r === -180) r = 180; return r; };
  const wrapRad = (a) => { let r = a % TAU; if (r > Math.PI) r -= TAU; if (r < -Math.PI) r += TAU; return r; };

  /* ---- reading the world ------------------------------------------------------------------- */
  function readPlacement() {
    const p = Store.get(pathOf());
    if (!p || typeof p !== 'object') return null;
    const out = { x: fin(p.x), y: fin(p.y), rotation: fin(p.rotation), baseZ: fin(p.baseZ) };
    if (typeof p.baseMode === 'string') out.baseMode = p.baseMode;       // Follow ground / Typed: a move never drops it
    return out;
  }
  function active() {
    if (!opts || !ready) return false;
    try {

/* ---- small shared widgets: toast, popover, confirm ------------------------------ */
const Toast = (() => {
  function show(message, kind = '', ms = 3600) {
    const host = document.getElementById('toasts');
    const t = h('div', { class: `toast ${kind}`.trim() }, message);
    t.addEventListener('click', () => t.remove());
    host.append(t);
    while (host.children.length > 4) host.firstChild.remove();
    if (ms > 0) setTimeout(() => t.remove(), ms);
    return t;
  }
  return { show };
})();

const Pop = (() => {
  let cur = null;
  function close() {
    if (!cur) return;
    const c = cur; cur = null;
    c.el.remove();
    document.removeEventListener('pointerdown', c.onDown, true);
    document.removeEventListener('keydown', c.onKey, true);
    c.anchor.setAttribute('aria-expanded', 'false');
    if (c.onClose) c.onClose();
  }
  /** Opens `el` under `anchor`. Returns false (and closes) when that anchor's popover was already open. */
  function open(anchor, el, opts = {}) {
    const wasSame = cur && cur.anchor === anchor;
    close();
    if (wasSame) return false;
    el.classList.add('pop');
    el.style.visibility = 'hidden';
    document.body.append(el);
    const r = anchor.getBoundingClientRect(), w = el.offsetWidth;
    let left = opts.align === 'right' ? r.right - w : r.left;
    left = clamp(left, 8, Math.max(8, window.innerWidth - w - 8));
    const top = Math.min(r.bottom + 6, window.innerHeight - 120);
    el.style.left = `${left}px`; el.style.top = `${top}px`;
    el.style.maxHeight = `${Math.max(160, window.innerHeight - top - 12)}px`;
    el.style.visibility = '';
    anchor.setAttribute('aria-expanded', 'true');
    const onDown = (e) => { if (!el.contains(e.target) && !anchor.contains(e.target)) close(); };
    const onKey = (e) => { if (e.key === 'Escape') { close(); anchor.focus(); } };
    document.addEventListener('pointerdown', onDown, true);
    document.addEventListener('keydown', onKey, true);
    cur = { el, anchor, onDown, onKey, onClose: opts.onClose };
    return true;
  }
  return { open, close, isOpen: () => !!cur };
})();

/** Small modal question. Resolves true for the confirm button. */
function confirmDialog(message, okLabel = 'OK', danger = false) {
  return new Promise((resolve) => {
    const back = h('div', { class: 'modal-back' });
    const done = (v) => { document.removeEventListener('keydown', onKey, true); back.remove(); resolve(v); };
    const ok = h('button', { class: `btn ${danger ? 'danger' : 'solid'}`, type: 'button', onclick: () => done(true) }, okLabel);
    const cancel = h('button', { class: 'btn outline', type: 'button', onclick: () => done(false) }, 'Cancel');
    const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } };
    document.addEventListener('keydown', onKey, true);
    back.append(h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' }, h('p', null, message), h('div', { class: 'pop-actions' }, cancel, ok)));
    back.addEventListener('pointerdown', (e) => { if (e.target === back) done(false); });
    document.body.append(back);
    ok.focus();
  });
}

      const sec = Controls.section({

        onToggle: (isOpen) => rememberSection(s.id, isOpen),
      });
      sectionCtl[s.id] = sec;
      panels[s.tab].append(sec.el);

  function rememberSection(id, isOpen) { prefs.sections = { ...(prefs.sections || {}), [id]: isOpen }; saveUiPrefs(prefs); }

  /* ---- tabs ------------------------------------------------------------------------ */
  function buildTabs() {
    const bar = $('panelTabs');
    bar.textContent = '';
    for (const t of TABS) {
      bar.append(h('button', {
        class: 'tab', type: 'button', role: 'tab', id: `tab-${t.id}`, 'data-tab': t.id, 'aria-controls': `tabpanel-${t.id}`, 'aria-selected': 'false', tabindex: '-1',
        onclick: () => { setTab(t.id); raiseSheet(); },

    }
    bar.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight' && e.key !== 'Home' && e.key !== 'End') return;
      e.preventDefault();
      const i = TABS.findIndex((t) => t.id === activeTab);
      const next = e.key === 'Home' ? 0 : e.key === 'End' ? TABS.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + TABS.length) % TABS.length;
      setTab(TABS[next].id);
      $(`tab-${TABS[next].id}`).focus();
    });
  }
  /** Shows one tab. Remembered in the UI prefs (localStorage), and each tab keeps its own scroll position. */
  function setTab(id, { remember = true } = {}) {
    if (!TABS.some((t) => t.id === id)) return false;
    const scroller = $('panelScroll');
    if (id !== activeTab) scrollPos[activeTab] = scroller.scrollTop;
    activeTab = id;
    for (const t of TABS) {
      const on = t.id === id;
      const btn = $(`tab-${t.id}`), pnl = $(`tabpanel-${t.id}`);
      btn.setAttribute('aria-selected', on ? 'true' : 'false');
      btn.tabIndex = on ? 0 : -1;
      pnl.hidden = !on;
    }
    scroller.scrollTop = scrollPos[id] || 0;
    if (remember && prefs.tab !== id) { prefs.tab = id; saveUiPrefs(prefs); }
    return true;
  }

  /* ---- hooks for the selection card ------------------------------------------------- */
  const ITEM_MAP = {
    footprint: { tab: 'layout', section: 'footprint' },
    core: { tab: 'layout', section: 'cores', list: () => coreList, index: (it) => Store.raw().cores.findIndex((c) => c.id === it.id) },

  /**
   * Switches to the tab that holds the item, opens its section (and its row when the kind is a list), and scrolls it into view.
   * item: { kind: 'footprint' | 'speed' } | { kind: 'core' | 'entry', id }. Returns true when something was opened.
   */
  function openItem(item) {
    const m = item && ITEM_MAP[item.kind];
    if (!m) return false;
    setTab(m.tab);
    const sec = sectionCtl[m.section];
    if (!sec) return false;
    if (!sec.isOpen()) { sec.setOpen(true); rememberSection(m.section, true); }
    let target = sec.el;
    if (m.list) {
      const lst = m.list();
      const i = m.index(item);
      const row = lst && Number.isInteger(i) && i >= 0 ? lst.openAt(i) : null;
      if (row) target = row;
    }
    raiseSheet();
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    try { target.scrollIntoView({ block: 'start', behavior: reduce ? 'auto' : 'smooth' }); } catch (e) { target.scrollIntoView(); }
    target.classList.remove('is-focus'); void target.offsetWidth; target.classList.add('is-focus');
    setTimeout(() => target.classList.remove('is-focus'), 1600);
    return true;
  }

  /* ---- color legend (Diagram style) ------------------------------------------------------ */
  function updateLegend(d) {
    const box = $('legend');
    const st = Store.raw(), v = st.view;
    if (v.style !== 'diagram' || Render.comparing()) { box.hidden = true; return; }
    const rows = [];
    if (v.colorBy === 'slope') {
      rows.push([CONFIG.slopeColors.ok, 'Under 80% of the limit', 'slope-ok'], [CONFIG.slopeColors.near, 'Up to the limit', 'slope-near'], [CONFIG.slopeColors.over, 'Over the limit', 'slope-over']);
    } else {
      const seen = new Set();
      for (const lv of (d && d.levels) || []) for (const s of lv.stalls) seen.add(s.kind || 'standard');
      for (const k of Object.keys(CONFIG.kindColors)) if (seen.has(k)) rows.push([CONFIG.kindColors[k], CONFIG.kindLabels[k], `kind-${k}`]);
    }
    rows.push([CONFIG.coreColors.stair, 'Stair', 'core-stair'], [CONFIG.coreColors.elevator, 'Elevator', 'core-elevator']);
    if (d && d.overlay && d.overlay.conflicts.length) rows.push([CONFIG.conflictColor, 'Column conflict', 'conflict']);
    const key = JSON.stringify([rows, v.colorBy]);
    box.hidden = !rows.length;
    if (box.dataset.key === key) return;
    box.dataset.key = key;
    box.textContent = '';
    box.append(h('div', { class: 'label' }, v.colorBy === 'slope' ? 'Ramp slope' : 'Stalls'));
    for (const [color, text, id] of rows) box.append(h('div', { class: 'lg-row', 'data-key': id }, h('span', { class: 'sw', style: `background:${color}` }), h('span', null, text)));

  /* ---- bottom sheet (iPad portrait / narrow) -------------------------------------------- */
  function initSheet() {
    const app = $('app'), grabber = $('grabber');
    const GRAB = 44;
    const total = () => app.clientHeight;
    // The lowest stop shows the grabber and the tab bar, so the tabs sit at the top of the sheet even when it is pulled down.
    const lowest = () => GRAB + ($('panelTabs').offsetHeight || 45) + 2;
    const snaps = () => [lowest(), Math.round(total() * 0.42), Math.round(total() * 0.86)];
    const setH = (px) => app.style.setProperty('--sheet-h', `${Math.round(clamp(px, lowest(), total() * 0.9))}px`);
    const curH = () => $('panel').getBoundingClientRect().height;
    const animateTo = (to) => {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return setH(to);
      const from = curH(), t0 = performance.now();
      const step = (now) => {
        const p = clamp((now - t0) / 180, 0, 1);
        setH(from + (to - from) * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    };
    let drag = null;
    grabber.addEventListener('pointerdown', (e) => {
      grabber.setPointerCapture(e.pointerId);
      drag = { y: e.clientY, h: curH(), moved: false };
    });
    grabber.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const dy = drag.y - e.clientY;
      if (Math.abs(dy) > 4) drag.moved = true;
      if (drag.moved) setH(drag.h + dy);
    });
    const end = () => {
      if (!drag) return;
      const s = snaps(), now = curH();
      if (!drag.moved) {                                   // tap: cycle to the next snap
        const next = s.find((v) => v > now + 8) || s[0];
        animateTo(next);
      } else {
        animateTo(s.reduce((a, b) => (Math.abs(b - now) < Math.abs(a - now) ? b : a)));
      }
      drag = null;
    };
    grabber.addEventListener('pointerup', end);
    grabber.addEventListener('pointercancel', end);
    grabber.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
      e.preventDefault();
      setH(curH() + (e.key === 'ArrowUp' ? 60 : -60));
    });
    const reset = () => { if (sheetQuery.matches) setH(total() * 0.42); else app.style.removeProperty('--sheet-h'); };
    (sheetQuery.addEventListener ? sheetQuery.addEventListener('change', reset) : sheetQuery.addListener(reset));
    reset();
    window.addEventListener('resize', () => { if (sheetQuery.matches) { const px = parseFloat(app.style.getPropertyValue('--sheet-h')); if (px) setH(px); } });
    /** Pulls a collapsed sheet up to its middle stop (a tab was tapped, or an item was opened). */
    sheetRaise = () => { if (sheetQuery.matches && curH() < lowest() + 24) animateTo(snaps()[1]); };
  }
  let sheetRaise = () => {};
  const raiseSheet = () => sheetRaise();

  /* ---- keyboard ---------------------------------------------------------------------------- */
  function initKeys() {
    window.addEventListener('keydown', (e) => {
      if (!(e.metaKey || e.ctrlKey) || e.altKey) return;
      const key = e.key.toLowerCase();
      if (key === 's') { e.preventDefault(); Options.save(); return; }
      if (key !== 'z' && key !== 'y') return;
      const t = e.target;
      if (t && t.matches && t.matches('input[type="text"], textarea') && t.dataset.dirty === '1') return;   // let the browser undo typing
      e.preventDefault();
      if (key === 'y' || e.shiftKey) Store.redo(); else Store.undo();
    });
  }

  function init() {
    buildTopBar();
    buildPanel();
    buildTabs();
    setTab(TABS.some((t) => t.id === prefs.tab) ? prefs.tab : 'layout', { remember: false });
    buildViews();
    buildHud();
    initSheet();
    initKeys();
    Store.subscribe(() => { Controls.refreshAll(); updateLegend(Derived.get()); });
    Controls.refreshAll();
    Render.onRebuild(updateHud);
    // A viewport that is not WebGL-capable still gets numbers.
    updateHud(Derived.get());
  }
