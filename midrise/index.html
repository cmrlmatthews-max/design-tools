  }

  /* ---- metrics + warnings HUD ---------------------------------------------------------- */
  const pct1 = (f) => `${(f * 100).toFixed(1)}%`;
  const signed = (v, fmt) => `${v > 0 ? '+' : v < 0 ? '−' : '±'}${fmt(Math.abs(v))}`;

  function buildHud() {
    const hud = $('hud');
    const open = !!prefs.hudOpen;                      // remembered: expanded or compact
    hud.dataset.collapsed = open ? 'false' : 'true';
    hud.innerHTML = `
      <button class="hud-toggle" id="hudToggle" type="button" aria-expanded="${open}" aria-controls="hudBody" title="Show or hide all metrics">
        <span class="hud-top">
          <span class="label">Metrics</span>
          <span class="hud-badge" id="hudBadge" data-n="0" title="Warnings">0 warnings</span>
          ${CARET_SVG}
        </span>
        <span class="hud-core">
          <span class="m"><span class="k">Units</span><span class="v" id="mUnits">-</span></span>
          <span class="m"><span class="k">Density</span><span class="v" id="mDensity">-<small id="mDensitySub"></small></span></span>
          <span class="m"><span class="k">Parking ratio</span><span class="v" id="mParkRatio">-<small id="mParkSub"></small></span></span>
          <span class="m"><span class="k">Height</span><span class="v" id="mHeight">-<small id="mHeightSub"></small></span></span>
        </span>
      </button>
      <div class="hud-body" id="hudBody">
        <dl class="metrics compact">
          <div class="m"><dt>GFA</dt><dd id="mGfa">-</dd></div>
          <div class="m"><dt>FAR</dt><dd id="mFar">-</dd></div>
          <div class="m"><dt>Site area</dt><dd id="mSite">-</dd></div>
          <div class="m"><dt>Site coverage</dt><dd id="mCover">-</dd></div>
          <div class="m"><dt>Efficiency (est.)</dt><dd id="mEff">-</dd></div>
          <div class="m"><dt>Open space</dt><dd id="mOpen">-</dd></div>
          <div class="m"><dt>Corridor</dt><dd id="mCorr">-</dd></div>
          <div class="m"><dt>Courtyards</dt><dd id="mCourts">-</dd></div>
          <div class="m"><dt>Stairs / elevators</dt><dd id="mStairs">-</dd></div>
          <div class="m"><dt>Bars</dt><dd id="mBars">-</dd></div>
        </dl>
        <div class="sec"><div class="label">Construction hint</div><p class="hint-text" id="mHint">-</p><p class="help" id="mHintCaution"></p></div>
        <div class="sec" id="hudParking"><div class="label">Parking</div><dl class="kv" id="hudParkingList"></dl></div>
        <div class="sec" id="hudUnits" hidden><div class="label">Units (estimate)</div><dl class="kv" id="hudUnitsList"></dl></div>
        <div class="sec" id="hudTargets" hidden><div class="label">Target check</div><dl class="kv" id="hudTargetsList"></dl></div>
        <div class="warn-block" id="warnBlock" data-n="0">
          <div class="label">Warnings <span class="count" id="warnCount">0</span></div>
          <ul class="warns" id="warnList"></ul>
        </div>
      </div>`;
    const head = $('hudToggle');
    head.addEventListener('click', () => setHudOpen(hud.dataset.collapsed === 'true'));
    // Views are framed beside the HUD when there is room for both. The card is the same width compact or expanded, so toggling never reframes.
    Render.setInsetProvider(() => {
      if (Render.comparing()) return { right: 0 };
      const vw = $('viewport').clientWidth, w = hud.offsetWidth + 24;
      return { right: vw - w >= 380 ? w : 0 };
    });
  }
  function setHudOpen(open) {
    const hud = $('hud');
    hud.dataset.collapsed = open ? 'false' : 'true';
    $('hudToggle').setAttribute('aria-expanded', open ? 'true' : 'false');
    if (!!prefs.hudOpen !== open) { prefs.hudOpen = open; saveUiPrefs(prefs); }
  }
  function setText(id, text) { const el = $(id); if (el.firstChild && el.firstChild.nodeType === 3) el.firstChild.nodeValue = text; else el.prepend(document.createTextNode(text)); }
  function kvRows(list, rows) {
    list.textContent = '';
    for (const [k, v, cls] of rows) list.append(h('dt', null, k), h('dd', cls ? { class: cls } : null, v));
  }
  function updateHud(d) {
    const m = d.metrics, st = Store.raw();
    setText('mUnits', Units.formatInt(m.units));
    setText('mDensity', `${Units.formatRatio(m.density, 1)} /ac`);
    $('mDensitySub').textContent = `${Units.formatRatio(m.siteAcres, 2)} acres`;
    const pk = m.parking;
    setText('mParkRatio', Units.formatRatio(pk.ratioProvided, 2));
    $('mParkSub').textContent = `${Units.formatInt(pk.provided)} of ${Units.formatInt(pk.required)} stalls`;
    $('mParkRatio').classList.toggle('bad', !!pk.deficit);
    setText('mHeight', Units.formatFeetInches(m.height));
    const fd = m.floorsDetail || {};
    $('mHeightSub').textContent = `${Units.formatInt(m.floors)} floors${fd.deck ? ` · ${fd.deck} deck` : ''}`;

    setText('mGfa', Units.formatArea(m.gfa));
    setText('mFar', Units.formatRatio(m.far, 2));
    setText('mSite', Units.formatArea(m.siteArea));
    setText('mCover', pct1(m.siteCoverage));
    setText('mEff', pct1(m.efficiency));
    setText('mOpen', pct1(m.openSpace.ratio));
    $('mOpen').classList.toggle('bad', !m.openSpace.ok);
    setText('mCorr', `${Units.formatInt(m.corridorLength)} ft`);
    setText('mCourts', m.courtyards.count ? `${m.courtyards.count} · ${Units.formatInt(m.courtyards.area)} sf · min ${Units.formatFeetInches(m.courtyards.minDim)}` : 'none');
    setText('mStairs', `${m.stairs.total} / ${m.elevators}`);
    setText('mBars', m.bars.longest ? `${m.bars.count} · longest ${Units.formatFeetInches(m.bars.longest.length)}` : '0');
    $('mHint').textContent = m.constructionHint || 'None';
    $('mHintCaution').textContent = m.constructionHint ? (m.constructionCaution || '') : '';

    const req = pk.requiredDetail, prov = pk.providedDetail;
    const rows = [['Required', Units.formatInt(pk.required)]];
    if (req) {
      for (const [prog, n] of Object.entries(req.byProgram || {})) if (n > 0) rows.push([`  ${(CONFIG.programs[prog] || {}).label || prog}`, Units.formatInt(n)]);
      if (req.retail > 0) rows.push(['  Retail', `${Units.formatInt(req.retail)} for ${Units.formatInt(req.retailArea)} sf`]);
    }
    rows.push(['Provided', Units.formatInt(pk.provided)]);
    if (prov) {
      if (prov.surface) rows.push(['  Surface (typed)', Units.formatInt(prov.surface)]);
      if (prov.lot) rows.push(['  Surface lot', Units.formatInt(prov.lot)]);
      if (prov.deck) rows.push(['  Deck', Units.formatInt(prov.deck)]);
      const pod = (prov.podium || []).reduce((t, n) => t + n, 0);
      if (pod) rows.push(['  Podium', Units.formatInt(pod)]);
    }
    rows.push([pk.surplus < 0 ? 'Short by' : 'Surplus', Units.formatInt(Math.abs(pk.surplus)), pk.surplus < 0 ? 'tgt-neg' : 'tgt-pos']);
    kvRows($('hudParkingList'), rows);

    const ud = m.unitsDetail;
    const urows = [];
    for (const [prog, n] of Object.entries(ud.byProgram || {})) urows.push([(CONFIG.programs[prog] || {}).label || prog, Units.formatInt(n)]);
    if (Object.keys(ud.byBar || {}).length > 1) for (const b of st.bars) { const u = ud.byBar[b.id]; if (u) urows.push([`  ${b.name}`, `${Units.formatInt(u.total)} (${u.perFloor}/fl)`]); }
    kvRows($('hudUnitsList'), urows);
    $('hudUnits').hidden = !urows.length;

    const trows = [];
    const addTarget = (label, t, fmt) => {
      if (!t) return;
      trows.push([`${label} (target ${fmt(t.target)})`, `${signed(t.diff, fmt)} (${signed(t.pct, (v) => `${v.toFixed(1)}%`)})`, t.diff >= 0 ? 'tgt-pos' : 'tgt-neg']);
    };
    addTarget('Units', m.target.units, Units.formatInt);
    addTarget('Density', m.target.density, (v) => Units.formatRatio(v, 1));
    kvRows($('hudTargetsList'), trows);
    $('hudTargets').hidden = !trows.length;

    const list = $('warnList');
    list.textContent = '';
    if (!d.warnings.length) list.append(h('li', { class: 'none' }, 'No warnings'));
    for (const w of d.warnings) list.append(h('li', { class: `warn-${w.level}` }, w.text));
    $('warnCount').textContent = String(d.warnings.length);
    $('warnBlock').dataset.n = String(d.warnings.length);
    const nw = d.warnings.length;
    $('hudBadge').dataset.n = String(nw);
    $('hudBadge').textContent = `${nw} ${nw === 1 ? 'warning' : 'warnings'}`;
    updateLegend(d);
  }

  /* ---- color legend (Diagram style) ------------------------------------------------------ */
  /** Lists what appears in the model: programs, or bars, the roof screen, and red for anything outside the envelope. */
  function updateLegend(d) {
    const box = $('legend');
    const st = Store.raw(), v = st.view;
    if (v.style !== 'diagram' || Render.comparing()) { box.hidden = true; return; }
    const plates = (d && d.plates) || [];
    const used = plates.filter((p) => p.polygons && p.polygons.length);
    const rows = [];
    if (v.colorBy === 'program') {
      const seen = new Set();
      for (const b of st.bars) for (const l of BarsMod.barLevels(b, st)) seen.add(l.program);
      if (st.podium.on) for (const l of st.podium.levels) seen.add(l.program);
      if (st.deck.on) seen.add('parking');
      for (const k of Object.keys(CONFIG.programs)) if (seen.has(k)) rows.push([progColor(k), CONFIG.programs[k].label, `prog-${k}`]);
    } else {
      st.bars.forEach((b, i) => rows.push([barColor(i), b.name, `bar-${b.id}`]));
      if (used.some((p) => p.zone === 'podium')) rows.push([CONFIG.zoneColors.podium, 'Podium', 'zone-podium']);
      if (used.some((p) => p.zone === 'deck')) rows.push([CONFIG.zoneColors.deck, 'Deck', 'zone-deck']);
    }
    if ((d && d.solids || []).some((x, i) => !(d.solidsOutside && d.solidsOutside[i]))) rows.push([CONFIG.zoneColors.screen, 'Roof screen', 'screen']);
    if (used.some((p) => p.outsideEnvelopeArea > 1) || (d && (d.solidsOutside || []).some(Boolean))) rows.push([CONFIG.outsideColor, 'Outside envelope', 'outside']);
    const key = JSON.stringify([rows, v.colorBy]);
    box.hidden = !rows.length;
    if (box.dataset.key === key) return;
    box.dataset.key = key;
    box.textContent = '';
    box.append(h('div', { class: 'label' }, v.colorBy === 'program' ? 'Program' : 'Bar'));
    for (const [color, text, id] of rows) box.append(h('div', { class: 'lg-row', 'data-key': id }, h('span', { class: 'sw', style: `background:${color}` }), h('span', null, text)));
  }

  /* ---- bottom sheet (iPad portrait / narrow) -------------------------------------------- */
  function initSheet() {
    const app = $('app'), grabber = $('grabber');
    const GRAB = 44;
    const total = () => app.clientHeight;
    // The lowest stop shows the grabber and the tab bar, so the tabs sit at the top of the sheet even when it is pulled down.
    const lowest = () => GRAB + ($('panelTabs').offsetHeight || 45) + 2;
    const snaps = () => [lowest(), Math.round(total() * 0.42), Math.round(total() * 0.86)];
    const setH = (px) => app.style.setProperty('--sheet-h', `${Math.round(clamp(px, lowest(), total() * 0.9))}px`);
    const curH = () => $('panel').getBoundingClientRect().height;
    const animateTo = (to) => {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return setH(to);
      const from = curH(), t0 = performance.now();
      const step = (now) => {
        const p = clamp((now - t0) / 180, 0, 1);
        setH(from + (to - from) * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    };
    let drag = null;
    grabber.addEventListener('pointerdown', (e) => {
      grabber.setPointerCapture(e.pointerId);
      drag = { y: e.clientY, h: curH(), moved: false };
    });
    grabber.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const dy = drag.y - e.clientY;
      if (Math.abs(dy) > 4) drag.moved = true;
      if (drag.moved) setH(drag.h + dy);
    });
    const end = () => {
      if (!drag) return;
      const s = snaps(), now = curH();
      if (!drag.moved) {                                   // tap: cycle to the next snap
        const next = s.find((v) => v > now + 8) || s[0];
        animateTo(next);
      } else {
        animateTo(s.reduce((a, b) => (Math.abs(b - now) < Math.abs(a - now) ? b : a)));
      }
      drag = null;
    };
    grabber.addEventListener('pointerup', end);
    grabber.addEventListener('pointercancel', end);
    grabber.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
      e.preventDefault();
      setH(curH() + (e.key === 'ArrowUp' ? 60 : -60));
    });
    const reset = () => { if (sheetQuery.matches) setH(total() * 0.42); else app.style.removeProperty('--sheet-h'); };
    (sheetQuery.addEventListener ? sheetQuery.addEventListener('change', reset) : sheetQuery.addListener(reset));
    reset();
    window.addEventListener('resize', () => { if (sheetQuery.matches) { const px = parseFloat(app.style.getPropertyValue('--sheet-h')); if (px) setH(px); } });
    /** Pulls a collapsed sheet up to its middle stop (a tab was tapped, or an item was opened). */
    sheetRaise = () => { if (sheetQuery.matches && curH() < lowest() + 24) animateTo(snaps()[1]); };
  }
  let sheetRaise = () => {};
  const raiseSheet = () => sheetRaise();

  /* ---- keyboard ---------------------------------------------------------------------------- */
  function initKeys() {
    window.addEventListener('keydown', (e) => {
      if (!(e.metaKey || e.ctrlKey) || e.altKey) return;
      const key = e.key.toLowerCase();
      if (key === 's') { e.preventDefault(); Options.save(); return; }
      if (key !== 'z' && key !== 'y') return;
      const t = e.target;
      if (t && t.matches && t.matches('input[type="text"], textarea') && t.dataset.dirty === '1') return;   // let the browser undo typing
      e.preventDefault();
      if (key === 'y' || e.shiftKey) Store.redo(); else Store.undo();
    });
  }

  function init() {
    buildTopBar();
    buildPanel();
    buildTabs();
    setTab(TABS.some((t) => t.id === prefs.tab) ? prefs.tab : 'form', { remember: false });
    buildViews();
    buildHud();
    initSheet();
    initKeys();
    Store.subscribe(() => { Controls.refreshAll(); swatchSyncs.forEach((fn) => fn()); updateLegend(Derived.get()); });
    Controls.refreshAll();
    swatchSyncs.forEach((fn) => fn());
    Render.onRebuild(updateHud);
    // A viewport that is not WebGL-capable still gets numbers.
    updateHud(Derived.get());
  }
  return {
    init, updateHud, rebuildPanel: () => { Controls.refreshAll(); },
    // hooks for the selection card
    openItem, setProgramForItems, setTab, activeTab: () => activeTab, tabs: () => TABS.map((t) => t.id), reorderBars,
    setHudOpen, hudOpen: () => $('hud').dataset.collapsed === 'false', sections: () => SECTIONS.map((s) => ({ id: s.id, tab: s.tab })),
  };
})();

/* SLOT: ai-prompts */
/* Filled: the entry is the AI Prompts item (#miAiPrompts) in the Export menu (UI.openExportMenu above); the panel and its logic are in 08b_prompts.js. */

/* ==========================================================================
   AI PROMPTS
   The prompt library (src/tower/prompts.js) is inlined with the other
   modules. Its text says "tower"; the filled text says "building" (textFor). `Prompts` is the panel: a right-hand drawer on desktop and iPad
   landscape, a full-height sheet on iPad portrait / narrow screens.
   Step 1 saves the AI-ready picture, step 2 copies the filled prompt.
   Custom prompts live in the options storage blob (key `prompts`).
   ========================================================================== */

const Prompts = (() => {
  const { PROMPT_FIELDS, PROMPTS, fillPrompt } = PromptsMod;
  const GROUPS = [['time', 'Time'], ['material', 'Material'], ['context', 'Context'], ['camera', 'Camera'], ['custom', 'My prompts']];
  const AUTO = [['floors', 'Floors'], ['height', 'Height'], ['program', 'Program'], ['podium', 'Podium'], ['form', 'Form']];
  const FIELD_KEYS = Object.keys(PROMPT_FIELDS);
  const PROGRAM_WORDS = { residential: 'residential', hotel: 'hotel', senior: 'senior living' };
  const NUMBER_WORDS = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
  const TOKEN_HELP = 'Sentence slots: "The facade is {{material}}." · "The setting is {{location}}" · "photographed {{time}}" · ", {{season}}." From your design: {{floors}} {{height}} {{program}} {{podium}} {{form}}. Tick a menu below to let the user choose that slot. The fixed form-lock text is added in front of every prompt.';
  const STARTER = 'Make a photorealistic render of this {{height}} {{program}} building in {{location}} at {{time}}.';

  /* ---- auto fields, computed from the current option ------------------------------ */
  const articleFor = (phrase) => (/^(?:[aeio]|L-|8|11|18)/i.test(phrase) ? 'an' : 'a');
  const countWord = (n) => (n >= 0 && n < NUMBER_WORDS.length ? NUMBER_WORDS[n] : String(n));
  /** The tallest bar (the first one on a tie). */
  function tallestBar(state) {
    let best = null, bestH = -1;
    for (const bar of state.bars || []) {
      const hgt = num(bar.floors, 0);
      if (hgt > bestH) { best = bar; bestH = hgt; }
    }
    return best;
  }
  const oxford = (list) => (list.length <= 1 ? list.join('') : `${list.slice(0, -1).join(', ')} and ${list[list.length - 1]}`);

  /** "a U-shaped building with a parking deck and a flat roof" */
  function formPhrase(state) {
    const bars = state.bars || [];
    const courts = (state.courts || []).length, deck = !!(state.deck && state.deck.on);
    let lead;
    if (state.type === 'wrap' || (deck && bars.length >= 4)) lead = 'a building wrapped around a parking deck';
    else if (state.type === 'courtyard' || state.type === 'podium') lead = courts >= 2 ? 'an E-shaped building' : bars.length === 2 ? 'an L-shaped building' : bars.length === 3 ? 'a U-shaped building' : 'a courtyard building around a closed court';
    else if (state.type === 'garden' || state.type === 'corridor-garden') lead = bars.length > 1 ? 'a group of low bars' : 'a single low bar';
    else lead = bars.length > 1 ? `a building of ${countWord(bars.length)} bars` : 'a single bar';
    const withs = [];
    if (deck && !/parking deck/.test(lead)) withs.push('a parking deck');
    if (courts && state.type !== 'courtyard' && state.type !== 'podium') withs.push(`${countWord(courts)} open court${courts === 1 ? '' : 's'}`);
    if (bars.some((b) => (b.bends || []).length)) withs.push('bent bars');
    withs.push(state.roof && state.roof.type === 'screen' ? 'a rooftop screen' : 'a flat roof');
    return `${lead} with ${oxford(withs)}`;
  }
  function podiumPhrase(state) {
    if (!state.podium || !state.podium.on) return 'no podium';
    const n = Math.max(1, (state.podium.levels || []).length);
    return `${articleFor(String(n))} ${n}-story podium`;
  }
  /** { floors, height, program, podium, form } for a state and its metrics. */
  function autoValues(state, metrics) {
    const bar = tallestBar(state);
    return {
      floors: String(metrics.floors),
      height: `${Math.round(metrics.height)} feet`,
      program: PROGRAM_WORDS[bar && bar.program] || 'mixed-use',
      podium: podiumPhrase(state),
      form: formPhrase(state),
    };
  }
  const currentAuto = () => autoValues(Store.raw(), Derived.get().metrics);

  /* ---- prompts and values ---------------------------------------------------------- */
  const prefs = () => (uiPrefs.prompts = uiPrefs.prompts || {});
  const customList = () => Options.storage.listPrompts();
  const allPrompts = () => [...PROMPTS, ...customList()];
  const findPrompt = (id) => allPrompts().find((p) => p.id === id) || null;
  const groupPrompts = (g) => (g === 'custom' ? customList() : PROMPTS.filter((p) => p.group === g));

  /** Menu value: field default, then the prompt's own default, then the user's last pick for THIS prompt (remembered per prompt id). */
  function fieldValue(prompt, key) {
    const f = PROMPT_FIELDS[key];
    const shown = !prompt || (prompt.uses || []).includes(key);       // a choice only counts where the prompt shows that menu
    const remembered = shown && prompt ? ((prefs().fields || {})[prompt.id] || {})[key] : null;
    if (remembered != null && f.options.some((o) => o.value === remembered)) return remembered;
    const d = prompt && prompt.defaults && prompt.defaults[key];
    if (d != null && f.options.some((o) => o.value === d)) return d;
    return f.default != null ? f.default : (f.options[0] || {}).value;
  }
  function rememberField(prompt, key, value) {
    const p = prefs();
    const all = p.fields || {};
    p.fields = { ...all, [prompt.id]: { ...(all[prompt.id] || {}), [key]: value } };
    saveUiPrefs(uiPrefs);
  }
  /** Auto fields plus every pick field (chosen where the prompt shows a menu for it, its default elsewhere). */
  function valuesFor(prompt, overrides) {
    const v = { ...currentAuto() };
    for (const k of FIELD_KEYS) v[k] = fieldValue(prompt, k);
    return { ...v, ...(overrides || {}) };
  }
  /** The library was written for towers; a mid-rise is a building. */
  const buildingWords = (t) => t.replace(/\btowers\b/g, 'buildings').replace(/\bTowers\b/g, 'Buildings').replace(/\btower\b/g, 'building').replace(/\bTower\b/g, 'Building');
  const textFor = (prompt, overrides) => buildingWords(fillPrompt(prompt, valuesFor(prompt, overrides)));
  const wordCount = (t) => (t.trim() ? t.trim().split(/\s+/).length : 0);

  /* ---- view state ------------------------------------------------------------------ */
  const ui = { open: false, group: null, editing: null, el: null, restoreFocus: null, raf: 0, busy: false, error: '' };
  const selectedId = (g) => (prefs().selected || {})[g];
  function currentGroup() {
    const g = ui.group || prefs().group;
    return GROUPS.some((x) => x[0] === g) ? g : 'time';
  }
  function currentPrompt() {
    const g = currentGroup(), list = groupPrompts(g);
    return list.find((p) => p.id === selectedId(g)) || list[0] || null;
  }
  function select(group, id) {
    const p = prefs();
    p.group = group;
    p.selected = { ...(p.selected || {}), [group]: id };
    ui.group = group;
    saveUiPrefs(uiPrefs);
  }
  /** The prompt the preview and Copy use: the draft while editing, else the selected one. */
  function activePrompt() {
    if (ui.editing) return { id: ui.editing.id || 'draft', group: 'custom', title: ui.editing.title, template: ui.editing.template, uses: ui.editing.uses, defaults: {} };
    return currentPrompt();
  }
  const activeText = () => { const p = activePrompt(); return p ? textFor(p) : ''; };

  /* ---- notices: inside the panel while it is open (the 3D view's toasts sit beneath it) --------- */
  function notify(message, kind = '') {
    if (!ui.open || !ui.toasts) { Toast.show(message, kind); return; }
    const t = h('div', { class: `toast ${kind}`.trim(), role: 'status' }, message);
    ui.toasts.append(t);
    setTimeout(() => t.remove(), 3200);
  }

  /* ---- clipboard ------------------------------------------------------------------------------ */
  function selectAll(ta, text) {
    try { ta.focus({ preventScroll: true }); ta.select(); ta.setSelectionRange(0, text.length); } catch (e) { /* ignore */ }
  }
  async function copyPrompt() {
    const text = activeText();
    if (!text) { notify('Pick a prompt first.', 'warn'); return false; }
    try {
      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        await navigator.clipboard.writeText(text);
        notify('Prompt copied.');
        return true;
      }
    } catch (e) { /* fall back to select + copy */ }
    let ta = ui.preview;
    let temp = false;
    if (!ta || !ta.isConnected || !ui.open) { ta = h('textarea', { readonly: true, style: 'position:fixed;left:-9999px;top:0;opacity:0' }); document.body.append(ta); temp = true; }
    ta.value = text;
    selectAll(ta, text);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    if (temp) ta.remove();
    if (ok) { notify('Prompt copied.'); return true; }
    if (!temp) selectAll(ta, text);
    notify('Select and copy the text.', 'warn');
    return false;
  }

  async function saveImage() {
    if (ui.busy) return null;
    ui.busy = true; syncSteps();
    try { return await Shots.takeAiReady(); } finally { ui.busy = false; syncSteps(); }
  }

  /* ---- custom prompts -------------------------------------------------------------------------- */
  const uniqueTitle = (title, exceptId) => StorageMod.uniqueName(title, customList().filter((p) => p.id !== exceptId).map((p) => p.title));
  function startNew() {
    ui.error = '';
    ui.editing = { id: null, title: StorageMod.uniqueName('New prompt', customList().map((p) => p.title)), template: STARTER, uses: ['location', 'time'], focus: 'title' };
    ui.group = 'custom';
    render();
  }
  function startEdit(p) {
    ui.error = '';
    ui.editing = { id: p.id, title: p.title, template: p.template, uses: [...(p.uses || [])], focus: 'template' };
    render();
  }
  function duplicateToEdit(p) {
    ui.error = '';
    ui.editing = { id: null, title: StorageMod.uniqueName(`${p.title} (copy)`, customList().map((x) => x.title)), template: p.template, uses: [...(p.uses || [])], focus: 'title' };
    ui.group = 'custom';
    render();
    notify('Copied to My prompts. Change it and press Save.');
  }
  function saveEditing() {
    const e = ui.editing;
    if (!e) return null;
    const title = e.title.trim();
    if (!title) { ui.error = 'Give the prompt a title.'; render(); return null; }
    if (!e.template.trim()) { ui.error = 'Write the prompt text.'; render(); return null; }
    const rec = Options.storage.savePrompt({ id: e.id || undefined, title: uniqueTitle(title, e.id), template: e.template, uses: e.uses.filter((k) => FIELD_KEYS.includes(k)) });
    if (!rec) { ui.error = 'The prompt could not be saved.'; render(); return null; }
    ui.editing = null; ui.error = '';
    select('custom', rec.id);
    render();
    notify('Prompt saved.');
    return rec;
  }
  function cancelEditing() { ui.editing = null; ui.error = ''; render(); }
  async function removePrompt(p) {
    const ok = await confirmDialog(`Delete the prompt “${p.title}”? This cannot be undone.`, 'Delete', true);
    if (!ok) return false;
    Options.storage.removePrompt(p.id);
    render();
    notify('Prompt deleted.');
    return true;
  }

  /* ---- DOM --------------------------------------------------------------------------------------- */
  function build() {
    const back = h('div', { class: 'ai-back', id: 'aiBack', hidden: true });
    back.addEventListener('pointerdown', () => close());
    const closeBtn = h('button', { class: 'ibtn', type: 'button', 'aria-label': 'Close AI Prompts', title: 'Close (Esc)', html: ICON_X, onclick: () => close() });
    ui.saveBtn = h('button', { class: 'btn outline step', type: 'button', id: 'aiStepImage', onclick: () => saveImage() }, '1. Save AI-ready image');
    ui.copyBtn = h('button', { class: 'btn solid step', type: 'button', id: 'aiStepCopy', onclick: () => copyPrompt() }, '2. Copy prompt');
    ui.body = h('div', { class: 'ai-body', id: 'aiBody' });
    ui.toasts = h('div', { class: 'ai-toasts', 'aria-live': 'polite' });
    const panel = h('aside', { class: 'ai-panel', id: 'aiPanel', role: 'dialog', 'aria-label': 'AI Prompts', 'aria-modal': 'false', 'data-open': 'false', 'aria-hidden': 'true', tabindex: '-1' },
      h('header', { class: 'ai-head' }, h('h2', null, 'AI Prompts'), closeBtn),
      h('div', { class: 'ai-steps' },
        h('div', { class: 'ai-step-row' }, ui.saveBtn, ui.copyBtn),
        h('p', { class: 'help' }, 'Paste the image and the prompt into ChatGPT or Gemini.')),
      ui.body, ui.toasts);
    document.body.append(back, panel);
    ui.back = back; ui.el = panel;
  }
  function syncSteps() { if (ui.saveBtn) { ui.saveBtn.disabled = ui.busy; ui.saveBtn.textContent = ui.busy ? 'Saving image…' : '1. Save AI-ready image'; } }

  function tabsEl() {
    const g = currentGroup();
    const tabs = h('div', { class: 'ai-tabs', role: 'tablist', 'aria-label': 'Prompt groups' });
    for (const [id, label] of GROUPS) {
      tabs.append(h('button', {
        class: 'ai-tab', type: 'button', role: 'tab', id: `aiTab-${id}`, 'aria-selected': String(id === g), 'data-group': id,
        onclick: () => { if (ui.editing && id !== 'custom') ui.editing = null; ui.group = id; select(id, selectedId(id) || (groupPrompts(id)[0] || {}).id); render(); },
      }, label));
    }
    return tabs;
  }

  function listEl() {
    const g = currentGroup(), list = groupPrompts(g), cur = currentPrompt();
    const wrap = h('div', { class: 'ai-listwrap' });
    if (g === 'custom') {
      wrap.append(h('div', { class: 'ai-listbar' }, h('button', { class: 'btn outline sm', type: 'button', id: 'aiNew', onclick: startNew }, '+ New prompt')));
      if (!list.length && !ui.editing) wrap.append(h('p', { class: 'help ai-empty' }, 'Nothing here yet. Use New prompt, or open any other tab and press Duplicate to edit.'));
    }
    const ul = h('div', { class: 'ai-list', role: 'group', 'aria-label': 'Prompts' });
    for (const p of list) {
      ul.append(h('button', {
        class: 'ai-item', type: 'button', 'aria-pressed': String(ui.editing ? ui.editing.id === p.id : !!cur && cur.id === p.id), 'data-id': p.id,
        onclick: () => { ui.editing = null; select(g, p.id); render(); },
      }, h('span', { class: 'ai-item-title' }, p.title), p.description ? h('span', { class: 'ai-item-desc' }, p.description) : null));
    }
    if (ui.editing && !ui.editing.id) ul.append(h('div', { class: 'ai-item is-draft', 'aria-pressed': 'true' }, h('span', { class: 'ai-item-title' }, ui.editing.title || 'New prompt'), h('span', { class: 'ai-item-desc' }, 'Not saved yet')));
    wrap.append(ul);
    return wrap;
  }

  function fieldsEl(prompt, uses, onPick) {
    const wrap = h('div', { class: 'ai-fields' });
    for (const key of uses) {
      const f = PROMPT_FIELDS[key];
      if (!f) continue;
      const id = `aiField-${key}`;
      const sel = h('select', { id }, f.options.map((o) => h('option', { value: o.value }, o.label)));
      sel.value = fieldValue(prompt, key);
      sel.addEventListener('change', () => { rememberField(prompt, key, sel.value); if (onPick) onPick(); updatePreview(); });
      wrap.append(h('div', { class: 'ctl select-row' }, h('label', { for: id }, f.label), sel));
    }
    return wrap;
  }

  function autoEl() {
    const wrap = h('div', { class: 'ai-auto', id: 'aiAuto' });
    wrap.append(h('div', { class: 'label' }, 'From your design'));
    const chips = h('div', { class: 'ai-chips' });
    ui.chips = {};
    for (const [k, label] of AUTO) {
      const v = h('span', { class: 'v' });
      ui.chips[k] = v;
      chips.append(h('span', { class: `ai-chip${k === 'form' ? ' wide' : ''}`, 'data-auto': k }, h('span', { class: 'k' }, label), v));
    }
    wrap.append(chips);
    return wrap;
  }
  function updateChips() {
    if (!ui.chips) return;
    const a = currentAuto();
    for (const [k] of AUTO) if (ui.chips[k]) ui.chips[k].textContent = a[k];
  }

  function previewEl() {
    const wrap = h('div', { class: 'ai-preview-wrap' });
    ui.preview = h('textarea', { class: 'ai-preview', id: 'aiPreview', readonly: true, rows: '9', 'aria-label': 'Prompt preview', spellcheck: 'false' });
    ui.count = h('span', { class: 'ai-count', id: 'aiCount' });
    wrap.append(h('div', { class: 'sub-title' }, h('span', { class: 'label' }, 'Prompt preview'), ui.count), ui.preview);
    return wrap;
  }
  function updatePreview() {
    if (!ui.preview) return;
    const text = activeText();
    if (ui.preview.value !== text) ui.preview.value = text;
    if (ui.count) ui.count.textContent = `${wordCount(text)} words`;
    ui.copyBtn.disabled = !text;
  }

  function editorEl(refreshFields) {
    const e = ui.editing;
    const wrap = h('div', { class: 'ai-editor' });
    const title = h('input', { type: 'text', id: 'aiEditTitle', maxlength: '60', value: e.title, autocomplete: 'off', spellcheck: 'false', 'aria-label': 'Prompt title' });
    title.addEventListener('input', () => { e.title = title.value; updatePreview(); });
    const tpl = h('textarea', { id: 'aiEditTemplate', rows: '8', 'aria-label': 'Prompt text', spellcheck: 'true' });
    tpl.value = e.template;
    tpl.addEventListener('input', () => { e.template = tpl.value; updatePreview(); });
    wrap.append(
      h('div', { class: 'label' }, e.id ? 'Edit prompt' : 'New prompt'),
      h('label', { class: 'ai-lab', for: 'aiEditTitle' }, 'Title'), title,
      h('label', { class: 'ai-lab', for: 'aiEditTemplate' }, 'Prompt text'), tpl,
      h('p', { class: 'points-note', id: 'aiTokenHelp' }, TOKEN_HELP),
      h('div', { class: 'label' }, 'Menus to show'),
    );
    const uses = h('div', { class: 'ai-uses', role: 'group', 'aria-label': 'Menus to show' });
    for (const k of FIELD_KEYS) {
      const cb = h('input', { type: 'checkbox', id: `aiUse-${k}` });
      cb.checked = e.uses.includes(k);
      cb.addEventListener('change', () => { e.uses = FIELD_KEYS.filter((x) => (x === k ? cb.checked : e.uses.includes(x))); refreshFields(); updatePreview(); });
      uses.append(h('label', { class: 'ai-check', for: `aiUse-${k}` }, cb, h('span', null, PROMPT_FIELDS[k].label)));
    }
    wrap.append(uses);
    if (ui.error) wrap.append(h('p', { class: 'points-note bad', role: 'alert' }, ui.error));
    wrap.append(h('div', { class: 'ai-actions' },
      h('button', { class: 'btn outline sm', type: 'button', id: 'aiEditCancel', onclick: cancelEditing }, 'Cancel'),
      h('button', { class: 'btn solid sm', type: 'button', id: 'aiEditSave', onclick: saveEditing }, 'Save prompt')));
    return wrap;
  }

  function detailEl() {
    const wrap = h('div', { class: 'ai-detail' });
    if (ui.editing) {
      const host = h('div', { class: 'ai-fields-host' });
      const refreshFields = () => { host.textContent = ''; host.append(fieldsEl(activePrompt(), ui.editing.uses, null)); };
      wrap.append(editorEl(refreshFields), host, autoEl(), previewEl());
      refreshFields();
      return wrap;
    }
    const p = currentPrompt();
    if (!p) { wrap.append(h('p', { class: 'help' }, 'Select a prompt to see its fields.')); ui.preview = null; ui.chips = null; return wrap; }
    const custom = p.group === 'custom';
    const head = h('div', { class: 'ai-dhead' }, h('div', { class: 'ai-dtitle' }, p.title));
    const desc = p.description ? h('p', { class: 'ai-ddesc', id: 'aiDesc' }, p.description) : null;
    const acts = h('div', { class: 'ai-dacts' });
    if (custom) {
      acts.append(
        h('button', { class: 'btn outline sm', type: 'button', id: 'aiEdit', onclick: () => startEdit(p) }, 'Edit'),
        h('button', { class: 'btn outline sm danger-text', type: 'button', id: 'aiDelete', onclick: () => removePrompt(p) }, 'Delete'));
    } else {
      acts.append(h('button', { class: 'btn outline sm', type: 'button', id: 'aiDuplicate', onclick: () => duplicateToEdit(p) }, 'Duplicate to edit'));
    }
    head.append(acts);
    wrap.append(head);
    if (desc) wrap.append(desc);
    const uses = (p.uses || []).filter((k) => PROMPT_FIELDS[k]);
    if (uses.length) wrap.append(h('div', { class: 'label' }, 'Choose'), fieldsEl(p, uses, null));
    wrap.append(autoEl(), previewEl());
    return wrap;
  }

  function render() {
    if (!ui.el) return;
    const keepScroll = ui.body.scrollTop;
    ui.body.textContent = '';
    ui.body.append(tabsEl(), listEl(), detailEl());
    updateChips();
    updatePreview();
    syncSteps();
    ui.body.scrollTop = keepScroll;
    if (ui.editing && ui.editing.focus) {
      const f = ui.editing.focus; ui.editing.focus = null;
      const el = document.getElementById(f === 'title' ? 'aiEditTitle' : 'aiEditTemplate');
      if (el && ui.open) { try { el.focus({ preventScroll: true }); if (f === 'title') el.select(); } catch (e) { /* ignore */ } }
    }
  }

  /* ---- open / close ------------------------------------------------------------------------------ */
  function open() {
    if (!ui.el) return false;
    if (ui.open) return true;
    Pop.close();
    ui.open = true;
    { const ae = document.activeElement; ui.restoreFocus = ae && ae !== document.body && document.contains(ae) ? ae : document.getElementById('btnExport'); }
    render();
    ui.back.hidden = false;
    ui.el.setAttribute('data-open', 'true');
    ui.el.removeAttribute('aria-hidden');
    const btn = document.getElementById('btnExport');
    if (btn) btn.classList.add('is-on');
    try { ui.el.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    return true;
  }
  function close() {
    if (!ui.open) return false;
    ui.open = false;
    ui.back.hidden = true;
    ui.el.setAttribute('data-open', 'false');
    ui.el.setAttribute('aria-hidden', 'true');
    ui.toasts.textContent = '';
    const btn = document.getElementById('btnExport');
    if (btn) btn.classList.remove('is-on');
    const f = ui.restoreFocus;
    ui.restoreFocus = null;
    if (f && f.focus && document.contains(f)) { try { f.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
    return true;
  }
  const toggle = () => (ui.open ? close() : open());

  function init() {
    build();
    window.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape' || !ui.open) return;
      if (document.querySelector('.modal-back')) return;      // a confirm dialog handles its own Escape
      e.preventDefault();
      close();
    });
    // The numbers in the chips and the preview follow the design while the panel is open.
    Store.subscribe(() => {
      if (!ui.open || ui.raf) return;
      ui.raf = requestAnimationFrame(() => { ui.raf = 0; updateChips(); updatePreview(); });
    });
    Options.onImport(({ promptsAdded }) => { if (promptsAdded && ui.el) render(); });
  }

  return {
    init, open, close, toggle, copyPrompt, saveImage, isOpen: () => ui.open,
    formPhrase, autoValues, podiumPhrase, currentAuto, textFor, findPrompt, allPrompts, valuesFor,
    // the same text the preview shows for a prompt id; `values` overrides auto or pick fields
    promptText: (id, values) => { const p = findPrompt(id); return p ? textFor(p, values) : null; },
    startNew, startEdit, saveEditing, cancelEditing, duplicateToEdit, removePrompt,
    editing: () => (ui.editing ? { ...ui.editing } : null),
    setEditing: (patch) => { if (ui.editing) { Object.assign(ui.editing, patch); render(); } },
    select, render,
  };
})();

/* ==========================================================================
   SketchUp export (plan section 8)
   Export menu > "SketchUp (.json)" downloads <option>-<date>.sketchup.json, which the
   CMRLM SketchUp extension imports. The document is built by src/midrise/sketchup.js (SkMid) from
   the same plates the screen shows; the file format helpers are src/shared/sketchup-format.js.
   ========================================================================== */

const SketchupExport = (() => {
  /** The document for the design on screen (or for `state`/`built` when given). */
  function doc(state, built) {
    const s = state || Store.raw();
    const d = built || Derived.get();
    return SkMid.midriseToSketchup(s, d.built, d.metrics, { name: s.name });
  }
  function filename(state) { return SkFmt.sketchupFilename((state || Store.raw()).name); }
  function save(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);   // revoking sooner can break some downloads
  }
  /** Build, check and download. `deliver(blob, filename)` replaces the browser download (tests). → { ok, filename, blob, errors } */
  function download({ deliver } = {}) {
    let d;
    try { d = doc(); } catch (e) { console.error(e); Toast.show('The SketchUp file could not be built for these settings.', 'bad'); return { ok: false, errors: [String(e && e.message)] }; }
    const v = SkFmt.validateDoc(d);
    if (!v.ok) { console.error(v.errors); Toast.show('The SketchUp file did not pass its own check, so it was not saved.', 'bad'); return { ok: false, errors: v.errors }; }
    if (!v.counts.solid && !v.counts.mesh) { Toast.show('Nothing to export yet: the design has no floors.', 'warn'); return { ok: false, errors: ['empty'] }; }
    const name = filename();
    const blob = SkFmt.docToBlob(d);
    (deliver || save)(blob, name);
    if (!deliver) Toast.show(`Saved ${name}. In SketchUp: Extensions > CMRLM > Import Design Tools file.`);
    return { ok: true, filename: name, blob, counts: v.counts };
  }
  return { doc, filename, download };
})();

/* ==========================================================================
   TEMPLATES
   Form tab > Templates > "Choose a template". Nine layouts (src/midrise/presets.js templateState): a small card
   asks for the few numbers that matter, then the template replaces the bars, courts, deck and podium of the design.
   The site, the context, the programs, the parking, the rules, the roof, the targets, the view and the project
   placement stay. One undo step brings the last layout back.
   ========================================================================== */
const Templates = (() => {
  const LEN = 'len', INT = 'int';
  const F = {
    length: { label: 'Bar length', kind: LEN, min: 40, max: 600 },
    depth: { label: 'Bar depth', kind: LEN, min: 30, max: 120 },
    floors: { label: 'Floors', kind: INT, min: 1, max: CONFIG.limits.maxFloors },
    courtW: { label: 'Court width (east-west)', kind: LEN, min: 20, max: 600 },
    courtD: { label: 'Court depth (north-south)', kind: LEN, min: 20, max: 600 },
    deckW: { label: 'Deck width (east-west)', kind: LEN, min: 40, max: 600 },
    deckD: { label: 'Deck depth (north-south)', kind: LEN, min: 40, max: 600 },
    deckLevels: { label: 'Deck levels', kind: INT, min: 1, max: 10 },
  };
  const TYPES = [
    { id: 'garden', name: 'Garden walk-up', note: 'Low bars with stairs, around a green court', fields: ['length', 'depth', 'floors'] },
    { id: 'corridor-garden', name: 'Corridor garden', note: 'Two bars that meet in an L', fields: ['depth', 'floors'] },
    { id: 'bar', name: 'Double-loaded bar', note: 'One bar with a corridor in the middle', fields: ['length', 'depth', 'floors'] },
    { id: 'courtyard-L', name: 'Courtyard L', note: 'Two bars and a court on two sides', fields: ['courtW', 'courtD', 'depth', 'floors'] },
    { id: 'courtyard-U', name: 'Courtyard U', note: 'Three bars around a court open to one side', fields: ['courtW', 'courtD', 'depth', 'floors'] },
    { id: 'courtyard-O', name: 'Courtyard O', note: 'Four bars around a closed court', fields: ['courtW', 'courtD', 'depth', 'floors'] },
    { id: 'courtyard-E', name: 'Courtyard E', note: 'Two courts between three wings', fields: ['courtW', 'courtD', 'depth', 'floors'] },
    { id: 'wrap', name: 'Wrap with deck', note: 'Bars wrapped around a parking deck', fields: ['deckW', 'deckD', 'deckLevels', 'depth', 'floors'] },
    { id: 'podium', name: 'Podium', note: 'A U of bars over a parking podium', fields: ['courtW', 'courtD', 'depth', 'floors'] },
  ];
  const typeById = (id) => TYPES.find((t) => t.id === id) || null;

  /** What each field holds when nothing is chosen (the template's own numbers). */
  function defaultsFor(type) {
    const out = {};
    try {
      const t = PresetsMod.templateState(type);
      const b = t.bars[0];
      out.length = b.length; out.depth = b.depth; out.floors = b.floors;
      if (type.startsWith('courtyard')) { out.courtW = 120; out.courtD = type === 'courtyard-E' ? 210 : 90; }
      if (type === 'podium') { out.courtW = 170; out.courtD = 135; }
      if (type === 'wrap') { out.deckW = t.deck.w; out.deckD = t.deck.d; out.deckLevels = t.deck.levels; }
    } catch (e) { console.error(e); }
    return out;
  }
  const saved = () => (uiPrefs.templates = uiPrefs.templates || {});
  function valuesFor(type) {
    const d = defaultsFor(type), s = saved()[type] || {};
    const out = {};
    for (const k of typeById(type).fields) out[k] = typeof s[k] === 'number' && isFinite(s[k]) ? s[k] : d[k];
    return out;
  }

  /** A rectangular site that is too small for the template grows (never shrinks), so the new layout starts inside the setbacks. */
  function growSite(s) {
    if (s.site.shape === 'polygon') return;
    const warn = (st) => computeDerived(st).warnings.some((w) => w.id === 'bar-outside-site');
    if (!warn(s)) return;
    const d = computeDerived(s);
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const p of d.plates) for (const poly of p.polygons) for (const q of poly.outer) { minX = Math.min(minX, q[0]); maxX = Math.max(maxX, q[0]); minY = Math.min(minY, q[1]); maxY = Math.max(maxY, q[1]); }
    if (!isFinite(minX)) return;
    const sb = s.site.setbacks, up = (v) => Math.ceil(v / 10) * 10;
    const halfW = Math.max(Math.abs(minX) - sb.left, Math.abs(maxX) - sb.right, 0), halfD = Math.max(Math.abs(minY) - sb.front, Math.abs(maxY) - sb.back, 0);
    s.site.width = Math.max(s.site.width, up(2 * (halfW + Math.max(sb.left, sb.right) + 5)));
    s.site.depth = Math.max(s.site.depth, up(2 * (halfD + Math.max(sb.front, sb.back) + 5)));
  }

  /**
   * Replaces the layout of the design on screen with a template. `options` as templateState. One undo step.
   * Returns the new state, or null when the template could not be built.
   */
  function apply(type, options = {}) {
    if (!typeById(type)) return null;
    let t;
    try { t = PresetsMod.templateState(type, options); } catch (e) {
      console.error(e);
      Toast.show('That template could not be built with these numbers.', 'bad');
      return null;
    }
    const next = deepClone(Store.raw());
    next.bars = t.bars; next.courts = t.courts; next.deck = t.deck; next.podium = t.podium;
    next.type = t.type; next.floors = t.floors; next.surface = t.surface;
    const s = fillDefaults(next);
    growSite(s);
    if (typeof Select !== 'undefined') { Select.cancelHandleDrag(); Select.clear(); }
    if (Render.comparing()) Compare.exit();
    Store.replace(s);
    if (Render.ready()) Render.setView(Render.info().preset || 'axon', true);
    return s;
  }

  /* ---- the menu ---------------------------------------------------------------------------------------- */
  function openMenu(anchor) {
    const el = h('div', { role: 'menu', id: 'templateMenu' });
    const list = () => {
      el.textContent = '';
      el.append(h('div', { class: 'label pop-label' }, 'Choose a template'));
      for (const t of TYPES) {
        el.append(h('button', { class: 'pop-item', type: 'button', role: 'menuitem', id: `tpl-${t.id}`, 'data-template': t.id, onclick: () => card(t) },
          h('span', { class: 'grow' }, t.name, h('small', null, t.note)), h('span', { html: ICONS.chev, class: 'chev-r', style: 'display:contents' })));
      }
      el.append(h('div', { class: 'pop-note' }, 'A template replaces the bars, courts, deck and podium. The site and the programs stay. Undo brings the last layout back.'));
    };
    const card = (t) => {
      el.textContent = '';
      const vals = valuesFor(t.id);
      const inputs = {};
      el.append(h('button', { class: 'pop-item', type: 'button', id: 'tplBack', onclick: list }, h('span', { class: 'grow' }, '‹  Templates')));
      el.append(h('div', { class: 'label pop-label' }, t.name));
      for (const k of t.fields) {
        const f = F[k];
        const input = h('input', { class: 'numfield', type: 'text', id: `tplf-${k}`, 'data-field': k, inputmode: f.kind === INT ? 'numeric' : 'text', autocomplete: 'off', spellcheck: 'false', 'aria-label': f.label });
        input.value = f.kind === INT ? Units.formatInt(vals[k]) : Units.formatFeetInches(vals[k]);
        input.addEventListener('focus', () => setTimeout(() => input.select(), 0));
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); go(); } });
        inputs[k] = input;
        el.append(h('div', { class: 'ctl select-row tpl-row' }, h('label', { for: `tplf-${k}` }, f.label), input));
      }
      const read = () => {
        const out = {};
        for (const k of t.fields) {
          const f = F[k];
          let v = f.kind === INT ? Units.parseNumber(inputs[k].value) : Units.parseLength(inputs[k].value);
          if (!isFinite(v)) v = vals[k];
          if (f.kind === INT) v = Math.round(v);
          out[k] = clamp(v, f.min, f.max);
        }
        return out;
      };
      function go() {
        const o = read();
        saved()[t.id] = o;
        saveUiPrefs(uiPrefs);
        Pop.close();
        if (apply(t.id, o)) Toast.show(`Applied ${t.name}. Undo brings the last layout back.`);
      }
      el.append(h('div', { class: 'pop-actions' },
        h('button', { class: 'btn outline', type: 'button', id: 'tplReset', onclick: () => { delete saved()[t.id]; saveUiPrefs(uiPrefs); card(t); } }, 'Reset numbers'),
        h('button', { class: 'btn solid', type: 'button', id: 'tplApply', onclick: go }, 'Apply')));
      const first = el.querySelector('input');
      if (first) setTimeout(() => first.focus(), 0);
    };
    list();
    Pop.open(anchor, el);
  }

  return { openMenu, apply, types: () => TYPES.map((t) => ({ id: t.id, name: t.name, fields: t.fields.slice() })), defaultsFor, valuesFor };
})();
