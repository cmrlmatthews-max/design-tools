      if (s < s0) s0 = s; if (s > s1) s1 = s;
      if (t < t0) t0 = t; if (t > t1) t1 = t;
    }
    const w = s1 - s0, h = t1 - t0;
    if (w * h < bestArea - EPS) { bestArea = w * h; bestMin = Math.min(w, h); }
  }
  return bestMin;
}

/* ------------------------------------------------------------ bars */

function barName(bar) {
  return bar.name || `Bar ${bar.id}`;
}

/** Leg spine line (point + unit direction), shifted for single-loaded bars (plan 3.2). */
function legSpineLine(leg, bar, rules) {
  const th = (num(leg.angle) * Math.PI) / 180;
  const ux = Math.cos(th), uy = Math.sin(th);
  let shift = 0;
  if (bar.corridor === "single") {
    const off = num(leg.depth) / 2 - num(rules && rules.corridorWidth, 5.67) / 2;
    shift = bar.unitSide === "right" ? off : -off;    // toward the side opposite the units
  }
  return { px: leg.x0 - uy * shift, py: leg.y0 + ux * shift, ux, uy };
}

function lineMeet(a, b) {
  const den = a.ux * b.uy - a.uy * b.ux;
  if (Math.abs(den) < 1e-9) return null;
  const t = ((b.px - a.px) * b.uy - (b.py - a.py) * b.ux) / den;
  return [a.px + t * a.ux, a.py + t * a.uy];
}

/** Position of an overlap along a leg: "end" within depth of its start or end, else "through". */
function legPosition(leg, ring) {
  const th = (num(leg.angle) * Math.PI) / 180;
  const ux = Math.cos(th), uy = Math.sin(th);
  let s0 = Infinity, s1 = -Infinity;
  for (const p of ring) {
    const s = (p[0] - leg.x0) * ux + (p[1] - leg.y0) * uy;
    if (s < s0) s0 = s;
    if (s > s1) s1 = s;
  }
  const d = num(leg.depth), L = num(leg.length), tol = 0.01;
  if (s1 <= d + tol || s0 >= L - d - tol) return "end";
  return "through";
}

function ringCentroid(ring) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0, n = ring.length; i < n; i++) {
    const p = ring[i], q = ring[(i + 1) % n];
    const k = p[0] * q[1] - q[0] * p[1];
    a += k; cx += (p[0] + q[0]) * k; cy += (p[1] + q[1]) * k;
  }
  if (Math.abs(a) < EPS) {
    const n = ring.length || 1;
    return [ring.reduce((s, p) => s + p[0], 0) / n, ring.reduce((s, p) => s + p[1], 0) / n];
  }
  return [cx / (3 * a), cy / (3 * a)];
}

/* ------------------------------------------------------------ spine graph */

function polyLen(pts) {
  let s = 0;
  for (let i = 1; i < pts.length; i++) s += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  return s;
}

/** Closest parameter s along a polyline. */
function projectOn(pts, p) {
  let best = { s: 0, d: Infinity }, acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
    if (L < EPS) continue;
    let t = ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (L * L);
    t = Math.max(0, Math.min(1, t));
    const d = Math.hypot(p[0] - (a[0] + t * dx), p[1] - (a[1] + t * dy));
    if (d < best.d) best = { s: acc + t * L, d };
    acc += L;
  }
  return best.s;
}

/** Point at parameter s. */
function pointAt(pts, s) {
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (s <= acc + L + EPS || i === pts.length - 1) {
      const t = L > EPS ? Math.max(0, Math.min(1, (s - acc) / L)) : 0;
      return [r3(a[0] + t * (b[0] - a[0])), r3(a[1] + t * (b[1] - a[1]))];
    }
    acc += L;
  }
  return pts[0].slice();
}

/** Extend a spine to a node that lies beyond its start or end (touch joints, plan 3.5 step 6). */
function extendTo(pts, node) {
  const tol = 0.01;
  const a = pts[0], b = pts[1];
  const L0 = Math.hypot(b[0] - a[0], b[1] - a[1]);
  if (L0 > EPS) {
    const t = ((node[0] - a[0]) * (b[0] - a[0]) + (node[1] - a[1]) * (b[1] - a[1])) / L0;
    if (t < -tol && ptSeg(node, a, b) > tol) return [node.slice(), ...pts];
  }
  const c = pts[pts.length - 2], d = pts[pts.length - 1];
  const L1 = Math.hypot(d[0] - c[0], d[1] - c[1]);
  if (L1 > EPS) {
    const t = ((node[0] - d[0]) * (d[0] - c[0]) + (node[1] - d[1]) * (d[1] - c[1])) / L1;
    if (t > tol && ptSeg(node, c, d) > tol) return [...pts, node.slice()];
  }
  return pts;
}

function buildSpineGraph(bars, spines, joints) {
  const nodes = [], edges = [], pieces = new Map();   // pieces: barId → [[p, q], …]
  for (const j of joints) nodes.push({ id: j.id, x: j.node[0], y: j.node[1], kind: "joint" });

  for (const bar of bars) {
    let pts = spines.get(bar.id);
    if (!pts || pts.length < 2) continue;
    const mine = joints.filter((j) => j.barIds.includes(bar.id));
    for (const j of mine) pts = extendTo(pts, j.node);
    const total = polyLen(pts);

    // node stops along the spine
    const stops = mine.map((j) => ({ s: projectOn(pts, j.node), id: j.id }));
    const nearStop = (s) => stops.find((q) => Math.abs(q.s - s) < 0.01);
    if (!nearStop(0)) {
      const id = `${bar.id}.start`;
      nodes.push({ id, x: r3(pts[0][0]), y: r3(pts[0][1]), kind: "end" });
      stops.push({ s: 0, id });
    }
    if (!nearStop(total)) {
      const id = `${bar.id}.end`;
      const e = pts[pts.length - 1];
      nodes.push({ id, x: r3(e[0]), y: r3(e[1]), kind: "end" });
      stops.push({ s: total, id });
    }
    stops.sort((a, b) => a.s - b.s);

    // bend parameters (interior vertices)
    const bends = [];
    for (let i = 1, acc = 0; i < pts.length; i++) {
      acc += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      if (i < pts.length - 1) bends.push(acc);
    }

    for (let k = 1; k < stops.length; k++) {
      const s0 = stops[k - 1].s, s1 = stops[k].s;
      if (s1 - s0 < 0.001) continue;
      const cuts = [s0, ...bends.filter((s) => s > s0 + 0.001 && s < s1 - 0.001), s1];
      const points = cuts.map((s) => pointAt(pts, s));
      edges.push({ from: stops[k - 1].id, to: stops[k].id, barId: bar.id, length: r3(s1 - s0), points });
    }

    // drawing pieces: split at every node stop and bend
    const cuts = [...new Set([...stops.map((q) => q.s), ...bends].map((s) => Math.round(s * 1000)))]
      .sort((a, b) => a - b).map((s) => s / 1000);
    const list = [];
    for (let k = 1; k < cuts.length; k++) {
      if (cuts[k] - cuts[k - 1] < 0.001) continue;
      list.push([pointAt(pts, cuts[k - 1]), pointAt(pts, cuts[k])]);
    }
    pieces.set(bar.id, list);
  }
  return { graph: { nodes, edges }, pieces };
}

/* ------------------------------------------------------------ podium, deck, site */

function mpCentroid(mp) {
  let a = 0, cx = 0, cy = 0;
  const add = (ring, sign) => {
    const ra = Math.abs(ringArea(ring));
    const c = ringCentroid(ring);
    a += sign * ra; cx += sign * ra * c[0]; cy += sign * ra * c[1];
  };
  for (const p of mp) { add(p.outer, 1); for (const h of p.holes) add(h, -1); }
  return Math.abs(a) > EPS ? [cx / a, cy / a] : [0, 0];
}

/** Podium plate (plan 3.4). Returns { polygons, warning|null }. */
function podiumPlate(state, barRings, full) {
  const pod = state.podium || {};
  const fp = pod.footprint || {};
  if (fp.mode === "offset") {
    const b = emptyBox();
    for (const r of barRings) growBox(b, r);
    if (!boxOk(b)) return { polygons: [], warning: null };
    const o = num(fp.offset, 0);
    const ring = [[b.minX - o, b.minY - o], [b.maxX + o, b.minY - o], [b.maxX + o, b.maxY + o], [b.minX - o, b.maxY + o]]
      .map((p) => [r3(p[0]), r3(p[1])]);
    return { polygons: [{ outer: ring, holes: [] }], warning: null };
  }
  // "allowed": the allowed footprint scaled about its centroid so its AREA is `percent` of the allowed area
  const base = allowedFootprint(state, 0);
  if (!base.length) return { polygons: [], warning: null };
  const pct = Math.max(0, num(fp.percent, 100)) / 100;
  if (Math.abs(pct - 1) < 1e-9) return { polygons: base.map((p) => ({ outer: p.outer.map((q) => [r3(q[0]), r3(q[1])]), holes: p.holes.map((h) => h.map((q) => [r3(q[0]), r3(q[1])])) })), warning: null };
  const k = Math.sqrt(pct);
  const [cx, cy] = mpCentroid(base);
  const sc = (ring) => ring.map((q) => [r3(cx + (q[0] - cx) * k), r3(cy + (q[1] - cy) * k)]);
  const scaled = base.map((p) => ({ outer: sc(p.outer), holes: p.holes.map(sc) }));
  if (!full) return { polygons: scaled, warning: null };
  // risk table: a concave footprint can self-intersect; union it with itself and compare areas
  const L = CL();
  const c = new L.Clipper();
  c.AddPaths(mpPaths(scaled), L.PolyType.ptSubject, true);
  const tree = new L.PolyTree();
  c.Execute(L.ClipType.ctUnion, tree, L.PolyFillType.pftNonZero, L.PolyFillType.pftNonZero);
  const fixed = treeToMP(tree);
  const a0 = mpArea(scaled), a1 = mpArea(fixed);
  const warning = a0 > 0 && Math.abs(a1 - a0) / a0 > 0.01
    ? { code: "podium-shape", severity: "warn", floors: [], message: "The scaled podium footprint overlaps itself; check its shape." }
    : null;
  return { polygons: fixed, warning };
}

function siteRing(state) {
  const s = state.site || {};
  if (s.shape === "polygon" && Array.isArray(s.points) && s.points.length >= 3) {
    return ccw(s.points.map((p) => [num(p[0]), num(p[1])]));
  }
  const w = num(s.width, 0), d = num(s.depth, 0);
  if (!(w > 0 && d > 0)) return null;
  return rectRing(0, 0, w, d);
}

/* ------------------------------------------------------------ assemble */

/**
 * Build the mid-rise from its state (plan sections 3.3 – 3.8).
 * See the header for the return shape. quality "draft" skips every Clipper call.
 */
function assemble(state, { quality = "full" } = {}) {
  need(state && typeof state === "object", "assemble: state is required");
  need(Array.isArray(state.bars), "assemble: state.bars is required (an array)");
  need(state.site && typeof state.site === "object", "assemble: state.site is required");
  need(state.floors && typeof state.floors === "object", "assemble: state.floors is required");
  const full = quality !== "draft";
  if (full) need(globalThis.ClipperLib, "assemble: globalThis.ClipperLib is required for quality \"full\"");

  const rules = state.rules || {};
  const programs = state.programs || {};
  const site = state.site;
  const warnings = [];

  /* ---- bars, legs, rings ---- */
  const bars = state.bars.filter((b) => b && num(b.floors, 0) >= 1 && num(b.length, 0) > 0 && num(b.depth, 0) > 0);
  const legs = [];                       // { leg, ring, box, bar }
  const legsByBar = new Map();
  const spines = new Map();
  for (const bar of bars) {
    const list = legsOf(bar).map((leg) => {
      const ring = legRing(leg);
      return { leg, ring, box: growBox(emptyBox(), ring), bar };
    });
    legsByBar.set(bar.id, list);
    legs.push(...list);
    spines.set(bar.id, barSpine(bar, rules));
  }

  /* ---- levels (plan 3.3) ---- */
  const base = buildingLevels(state);
  const onLevel = new Map();             // level index → bar ids
  for (const bar of bars) {
    for (const lv of barLevels(bar, state)) {
      if (!onLevel.has(lv.index)) onLevel.set(lv.index, []);
      onLevel.get(lv.index).push(bar.id);
    }
  }

  /* ---- joints (plan 3.5) ---- */
  const joints = [];
  if (full) {
    for (let i = 0; i < legs.length; i++) {
      for (let j = i + 1; j < legs.length; j++) {
        const A = legs[i], B = legs[j];
        if (A.bar.id === B.bar.id) continue;            // one bar's legs never join (miter rule)
        if (boxGap(A.box, B.box) >= GAP) continue;
        const ov = intersect(A.ring, B.ring);
        let zone = null;
        if (ov.area >= MIN_OVERLAP) {
          zone = pathsToPoly(ov.paths);
        } else if (ringDist(A.ring, B.ring) < GAP) {
          // touch: the zone is the bridge between the rings grown by the touch offset
          const g = clip(offsetRing(A.ring, TOUCH), offsetRing(B.ring, TOUCH), CL().ClipType.ctIntersection);
          zone = pathsToPoly(g.paths);
        }
        if (!zone) continue;
        const pa = legPosition(A.leg, zone.outer), pb = legPosition(B.leg, zone.outer);
        const type = pa === "end" && pb === "end" ? "L" : pa === "through" && pb === "through" ? "cross" : "T";
        const la = legSpineLine(A.leg, A.bar, rules), lb = legSpineLine(B.leg, B.bar, rules);
        const meet = lineMeet(la, lb) || ringCentroid(zone.outer);
        joints.push({
          id: `J${joints.length + 1}`,
          barIds: [A.bar.id, B.bar.id],
          legs: [A.leg.legIndex, B.leg.legIndex],
          type,
          insideCorners: CORNERS[type],
          zone,
          node: [r3(meet[0]), r3(meet[1])],
        });
      }
    }
  }

  /* ---- spine graph (plan 3.6) ---- */
  const { graph: spineGraph, pieces } = buildSpineGraph(bars, spines, joints);

  /* ---- plates per level (plan 3.4) ---- */
  const allBarRings = legs.map((l) => l.ring);
  const podium = state.podium && state.podium.on ? podiumPlate(state, allBarRings, full) : null;
  if (podium && podium.warning) warnings.push(podium.warning);
  const deck = state.deck && state.deck.on
    ? [{ outer: rectRing(num(state.deck.x), num(state.deck.y), num(state.deck.w), num(state.deck.d)), holes: [] }]
    : [];

  const unionCache = new Map();          // key = sorted bar ids on the level → MultiPoly
  const levels = base.map((lv) => {
    const out = { index: lv.index, zone: lv.zone, z: lv.z, ftf: lv.ftf, program: lv.program,
      plates: [], spines: [], joints: [], cornerZones: [], barIds: [] };
    if (lv.zone === "podium") { out.plates = podium ? podium.polygons : []; return out; }
    if (lv.zone === "deck") { out.plates = deck; return out; }
    const ids = onLevel.get(lv.index) || [];
    out.barIds = ids.slice();
    const rings = ids.flatMap((id) => legsByBar.get(id).map((l) => l.ring));
    if (full) {
      const key = ids.join("\u0001");
      if (!unionCache.has(key)) unionCache.set(key, touchUnion(rings));   // one union per distinct bar set
      out.plates = unionCache.get(key);
    } else {
      out.plates = rings.map((r) => ({ outer: r.map((q) => q.slice()), holes: [] }));
    }
    out.spines = ids.flatMap((id) => (pieces.get(id) || []).map((s) => [s[0].slice(), s[1].slice()]));
    out.joints = joints.filter((j) => ids.includes(j.barIds[0]) && ids.includes(j.barIds[1]));
    out.cornerZones = out.joints.map((j) => j.zone);
    return out;
  });

  /* ---- courtyards (plan 3.7) ---- */
  const courtyards = [];
  const firstBar = levels.find((l) => l.zone === "bar");
  if (full && firstBar) {
    let n = 0;
    for (const p of firstBar.plates) {
      for (const h of p.holes) {
        n++;
        courtyards.push({ kind: "closed", id: `Y${n}`, area: r1(Math.abs(ringArea(h))), minDim: r3(minDimension(h)), ring: ccw(h) });
      }
    }
  }
  for (const c of state.courts || []) {
    const w = num(c.w), d = num(c.d);
    if (!(w > 0 && d > 0)) continue;
    courtyards.push({ kind: "open", id: c.id, area: r1(w * d), minDim: r3(Math.min(w, d)), ring: rectRing(num(c.x), num(c.y), w, d) });
  }
  const cmin = num(site.courtyardMin, 0);
  for (const c of courtyards) {
    if (cmin > 0 && c.minDim < cmin - EPS) {
      const what = c.kind === "closed" ? "Closed courtyard" : `Court ${c.id}`;
      warnings.push({ code: "courtyard", severity: "warn", floors: [],
        message: `${what} is ${fmtFt(c.minDim)} at its narrowest, under the ${fmtFt(cmin)} minimum.` });
    }
  }

  /* ---- separation (plan 3.7) ---- */
  const separation = [];
  if (full) {
    const joined = new Set(joints.map((j) => pairKey(j.barIds[0], j.barIds[1])));
    const smin = num(site.separationMin, 0);
    for (let i = 0; i < bars.length; i++) {
      for (let j = i + 1; j < bars.length; j++) {
        const a = bars[i], b = bars[j];
        if (joined.has(pairKey(a.id, b.id))) continue;
        let m = Infinity;
        for (const la of legsByBar.get(a.id)) for (const lb of legsByBar.get(b.id)) m = Math.min(m, ringDist(la.ring, lb.ring));
        const distance = r3(m);
        separation.push({ barIds: [a.id, b.id], distance });
        if (smin > 0 && distance < smin - EPS) {
          warnings.push({ code: "separation", severity: "warn", floors: [],
            message: `${barName(a)} and ${barName(b)} are ${fmtFt(distance)} apart, under the ${fmtFt(smin)} separation minimum.` });
        }
      }
    }
  }

  /* ---- per-bar warnings: sliver, sharp bend, outside the site, over a court ---- */
  const sRing = full ? siteRing(state) : null;
  const courtPaths = full ? courtyards.filter((c) => c.kind === "open").map((c) => ({ id: c.id, path: toPath(c.ring) })) : [];
  for (const bar of bars) {
    const prog = programs[bar.program] || {};
    const w = num(bar.unitWidth, 0) > 0 ? num(bar.unitWidth) : num(prog.unitWidth, 0);
    if (w > 0 && num(bar.length) < 2 * w - EPS) {
      warnings.push({ code: "sliver", severity: "warn", floors: [], message: `${barName(bar)} is shorter than two units.` });
    }
    if ((bar.bends || []).some((b) => Math.abs(num(b.deg)) > 135)) {
      warnings.push({ code: "bend", severity: "warn", floors: [], message: `${barName(bar)} has a bend sharper than 135 degrees.` });
    }
    if (!full) continue;
    const paths = legsByBar.get(bar.id).map((l) => ccwPath(l.ring));
    if (sRing) {
      const out = clip(paths, [toPath(sRing)], CL().ClipType.ctDifference).area;
      if (out > MIN_OVERLAP) {
        warnings.push({ code: "bar-outside-site", severity: "warn", floors: [], message: `${barName(bar)} extends past the site.` });
      }
    }
    for (const c of courtPaths) {
      const ov = clip(paths, [c.path], CL().ClipType.ctIntersection).area;
      if (ov > MIN_OVERLAP) {
        warnings.push({ code: "bar-over-court", severity: "warn", floors: [], message: `${barName(bar)} overlaps court ${c.id}.` });
      }
    }
  }

  /* ---- envelope (plan 3.8) ---- */
  let plates = levels.map((l) => ({
    n: l.index, zone: l.zone, program: l.program, z: l.z, ftf: l.ftf,
    polygons: l.plates, area: r1(mpArea(l.plates)), coreArea: 0, coreRect: null, outsideEnvelopeArea: 0,
  }));
  const solids = roofSolids(state, levels, legsByBar, bars, full);
  if (full) {
    const env = checkEnvelope(state, plates, solids);
    plates = env.plates;
    for (const wn of env.warnings) {
      warnings.push(wn.code === "crown-height" ? { ...wn, code: "screen-height", message: "The roof screen exceeds the height limit." } : wn);
    }
  }

  return { quality: full ? "full" : "draft", levels, spineGraph, joints, courtyards, separation, plates, solids, warnings };
}

/** Roof screen prisms: one per group of bars that top out on the same level (plan 3.8). */
function roofSolids(state, levels, legsByBar, bars, full) {
  const roof = state.roof || {};
  const h = num(roof.height, 0);
  if (roof.type !== "screen" || !(h > 0)) return [];
  const byLevel = new Map();
  const barLevelsOnly = levels.filter((l) => l.zone === "bar");
  for (const bar of bars) {
    let top = null;
    for (const l of barLevelsOnly) if (l.barIds.includes(bar.id)) top = l;
    if (!top) continue;
    if (!byLevel.has(top.index)) byLevel.set(top.index, { level: top, ids: [] });
    byLevel.get(top.index).ids.push(bar.id);
  }
  const out = [];
  for (const { level, ids } of byLevel.values()) {
    const rings = ids.flatMap((id) => legsByBar.get(id).map((l) => l.ring));
    const polygons = full ? touchUnion(rings) : rings.map((r) => ({ outer: r.map((q) => q.slice()), holes: [] }));
    const z0 = r3(level.z + level.ftf);
    out.push({ kind: "prism", polygons, z0, z1: r3(z0 + h), role: "screen" });
  }
  return out;
}

function pairKey(a, b) {
  return a < b ? `${a}\u0001${b}` : `${b}\u0001${a}`;
}

function fmtFt(v) {
  const r = Math.round(v * 10) / 10;
  return `${Number.isInteger(r) ? r : r.toFixed(1)} ft`;
}

return { assemble };
})();

/* ---- src/midrise/units.js ---- */
const UnitsMod = (() => {
/* ==========================================================================
   units.js — units estimate (Mid-Rise Generator)

   Contract: docs/mid-rise-generator-technical-plan.md sections 3.9, 3.5 and 4.
   unitsEstimate(state, built) reads the build result for its joints only
   (built.joints). Pure: no DOM, no Clipper, no mutation of inputs.

   Rule choices where the plan leaves room:
   - A unit program is any program whose state.programs entry has a unitWidth
     above 0 (residential, hotel, senior by default).
   - bar.unitWidth, when set, applies to every unit floor of that bar.
   - Corner loss = rules.cornerLoss (clamped 0 to 2) x insideCorners per
     floor. A joint charges the bar that comes FIRST in state.bars, on the
     floors where the other bar of the joint also stands. Each bend inside a
     bar is one inside corner and charges that bar on all of its floors.
   - Units on a floor never go below 0.
   - byBar[id].perFloor and lossPerFloor read the lowest typical floor (bar
     floor 2, or floor 1 for a one-floor bar); total is the exact sum.
   - Sliver (plan 3.9): a unit-program bar with length < 2 w warns with code
     "sliver".
   ========================================================================== */

const { legsOf, barLevels } = BarsMod;

const isNum = (v) => typeof v === "number" && Number.isFinite(v);

function need(cond, what) {
  if (!cond) throw new Error(`unitsEstimate: ${what} is missing or not valid`);
}

function isUnitProgram(state, key) {
  const p = state.programs && state.programs[key];
  return !!p && isNum(p.unitWidth) && p.unitWidth > 0;
}

function floorUnits(corridor, length, w, breezewayWidth) {
  const eps = 1e-9;
  if (corridor === "single") return Math.floor(length / w + eps);
  if (corridor === "breezeway") return 4 * Math.floor(length / (2 * w + breezewayWidth) + eps);
  return 2 * Math.floor(length / w + eps);
}

/** → { total, byBar: { [id]: { perFloor, floors, total, lossPerFloor } }, byProgram: { [program]: n }, warnings } */
function unitsEstimate(state, built) {
  need(state && typeof state === "object", "state");
  need(Array.isArray(state.bars), "state.bars");
  need(state.programs && typeof state.programs === "object", "state.programs");
  need(state.rules && isNum(state.rules.breezewayWidth), "state.rules.breezewayWidth");
  need(built && Array.isArray(built.joints), "built.joints");

  const rules = state.rules;
  const cornerLoss = Math.max(0, Math.min(2, isNum(rules.cornerLoss) ? rules.cornerLoss : 0));
  const bars = state.bars;
  const order = new Map(bars.map((b, i) => [b.id, i]));
  const levelSets = new Map(bars.map((b) => [b.id, new Set(barLevels(b, state).map((l) => l.index))]));

  // joints that charge each bar: [{ other, loss }]
  const charges = new Map(bars.map((b) => [b.id, []]));
  for (const j of built.joints) {
    const ids = (j.barIds || []).filter((id) => order.has(id));
    if (ids.length < 2) continue;
    const first = ids.reduce((a, b) => (order.get(a) <= order.get(b) ? a : b));
    const other = ids.find((id) => id !== first);
    if (other === undefined) continue;
    charges.get(first).push({ other, loss: cornerLoss * (isNum(j.insideCorners) ? j.insideCorners : 0) });
  }

  const byBar = {};
  const byProgram = {};
  const warnings = [];
  let total = 0;

  for (const bar of bars) {
    need(state.programs[bar.program], `state.programs.${bar.program} (bar ${bar.id})`);
    const levels = barLevels(bar, state);
    const bendLoss = cornerLoss * (legsOf(bar).length - 1);
    let sum = 0;
    const rows = [];   // { rank, n, loss } for each unit floor

    for (let rank = 0; rank < levels.length; rank++) {
      const lv = levels[rank];
      if (!isUnitProgram(state, lv.program)) continue;
      const w = isNum(bar.unitWidth) && bar.unitWidth > 0 ? bar.unitWidth : state.programs[lv.program].unitWidth;
      const base = floorUnits(bar.corridor, bar.length, w, rules.breezewayWidth);
      let loss = bendLoss;
      for (const c of charges.get(bar.id)) if (levelSets.get(c.other).has(lv.index)) loss += c.loss;
      const n = Math.max(0, base - loss);
      sum += n;
      rows.push({ rank, n, loss: base - n });
      byProgram[lv.program] = (byProgram[lv.program] || 0) + n;
    }
    // typical floor: bar floor 2 when it carries units, else the first unit floor
    const typical = rows.find((r) => r.rank === 1) || rows[0] || null;

    byBar[bar.id] = {
      perFloor: typical ? typical.n : 0,
      floors: rows.length,
      total: sum,
      lossPerFloor: typical ? typical.loss : 0,
    };
    total += sum;

    if (isUnitProgram(state, bar.program)) {
      const w = isNum(bar.unitWidth) && bar.unitWidth > 0 ? bar.unitWidth : state.programs[bar.program].unitWidth;
      if (bar.length < 2 * w) {
        warnings.push({
          code: "sliver", severity: "warn", barId: bar.id, floors: [],
          message: `${bar.name || bar.id} is shorter than two units.`,
        });
      }
    }
  }

  return { total, byBar, byProgram, warnings };
}

return { unitsEstimate };
})();

/* ---- src/midrise/parking.js ---- */
const ParkingMod = (() => {
/* ==========================================================================
   parking.js — parking required and provided (Mid-Rise Generator)

   Contract: docs/mid-rise-generator-technical-plan.md sections 3.10 and 4.
   Reads the build result for podium plates (built.levels, zone "podium") and
   for joints. Pure: no DOM, no Clipper, no mutation of inputs.

   Rule choices where the plan leaves room:
   - Required total = ceil(sum) so a half stall counts as a stall (323.5 -> 324).
     byProgram values are the unrounded products (to 0.01).
   - Retail area = ground-floor retail bars (length x depth, less the overlap
     of every joint, charged to the bar that comes LATER in state.bars) + the
     plate area of every podium level whose program is retail + the liner
     strip when podium level 1 is not itself retail.
   - Liner strip = the podium level-1 plate cut by a strip of `liner.depth`
     along the named side of the plate's bounding box (front = south, back =
     north, left = west, right = east).
   - Podium stalls per level: 0 unless the level program is parking; level 1
     loses the liner strip first; floor((area - liner) / sfPerStallDeck).
   - Surface: `surface` is the typed count, `lot` the stalls of the drawn lot
     (floor(area / sfPerStallSurface)); both are provided stalls.
   ========================================================================== */

const { ringArea, multiPolyArea, clipAreaConvex } = BarsMod;

const isNum = (v) => typeof v === "number" && Number.isFinite(v);
const r2 = (v) => Math.round(v * 100) / 100;

function need(fn, cond, what) {
  if (!cond) throw new Error(`${fn}: ${what} is missing or not valid`);
}

function podiumPlates(built) {
  return (built.levels || [])
    .filter((l) => l && l.zone === "podium")
    .slice()
    .sort((a, b) => a.index - b.index);
}

function bboxOf(mp) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of mp || []) for (const [x, y] of p.outer) {
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  }
  return minX === Infinity ? null : { minX, minY, maxX, maxY };
}

/** Area of the podium plate inside the liner strip. */
function linerArea(plate, liner) {
  if (!liner || !liner.on || !isNum(liner.depth) || liner.depth <= 0) return 0;
  const b = bboxOf(plate);
  if (!b) return 0;
  const d = liner.depth;
  let rect;
  switch (liner.side) {
    case "back":  rect = [[b.minX, b.maxY - d], [b.maxX, b.maxY - d], [b.maxX, b.maxY], [b.minX, b.maxY]]; break;
    case "left":  rect = [[b.minX, b.minY], [b.minX + d, b.minY], [b.minX + d, b.maxY], [b.minX, b.maxY]]; break;
    case "right": rect = [[b.maxX - d, b.minY], [b.maxX, b.minY], [b.maxX, b.maxY], [b.maxX - d, b.maxY]]; break;
    default:      rect = [[b.minX, b.minY], [b.maxX, b.minY], [b.maxX, b.minY + d], [b.minX, b.minY + d]];
  }
  return clipAreaConvex(plate, rect);
}

function barFootprint(state, bar, built) {
  let a = bar.length * bar.depth;                 // exact for any bend (plan 3.1 miter rule)
  const order = new Map(state.bars.map((b, i) => [b.id, i]));
  for (const j of built.joints || []) {
    const ids = j.barIds || [];
    if (!ids.includes(bar.id) || ids.length < 2) continue;
    const later = ids.reduce((x, y) => (order.get(x) >= order.get(y) ? x : y));
    if (later === bar.id && j.zone) a -= Math.abs(ringArea(j.zone.outer));
  }
  return Math.max(0, a);
}

/** Retail area in sf: { total, groundBars, podium, liner }. */
function retailArea(state, built) {
  need("retailArea", state && Array.isArray(state.bars), "state.bars");
  need("retailArea", built && typeof built === "object", "built");
  let groundBars = 0;
  for (const bar of state.bars) if (bar.groundProgram === "retail") groundBars += barFootprint(state, bar, built);

  let podium = 0, liner = 0;
  if (state.podium && state.podium.on) {
    const plates = podiumPlates(built);
    const levels = state.podium.levels || [];
    plates.forEach((lv, i) => {
      if (levels[i] && levels[i].program === "retail") podium += multiPolyArea(lv.plates);
    });
    if (plates[0] && levels[0] && levels[0].program !== "retail") liner = linerArea(plates[0].plates, state.podium.liner);
  }
  return { total: groundBars + podium + liner, groundBars, podium, liner };
}

/** units = the result of unitsEstimate. → { total, byProgram, retail, retailArea } */
function parkingRequired(state, units, built) {
  need("parkingRequired", state && state.programs, "state.programs");
  need("parkingRequired", state.parking && isNum(state.parking.retailPerThousand), "state.parking.retailPerThousand");
  need("parkingRequired", units && units.byProgram, "units.byProgram");
  need("parkingRequired", built && typeof built === "object", "built");
  const byProgram = {};
  let sum = 0;
  for (const [prog, n] of Object.entries(units.byProgram)) {
    const pr = state.programs[prog];
    const ratio = pr && isNum(pr.parkingRatio) ? pr.parkingRatio : 0;
    const req = n * ratio;
    byProgram[prog] = r2(req);
    sum += req;
  }
  const area = retailArea(state, built);
  const retail = (area.total / 1000) * state.parking.retailPerThousand;
  sum += retail;
  return { total: Math.ceil(sum - 1e-9), byProgram, retail: r2(retail), retailArea: Math.round(area.total * 10) / 10 };
}

/** → { total, surface, lot, deck, podium: [n per podium level] } */
function parkingProvided(state, built) {
  need("parkingProvided", state && state.parking, "state.parking");
  need("parkingProvided", isNum(state.parking.sfPerStallSurface) && state.parking.sfPerStallSurface > 0, "state.parking.sfPerStallSurface");
  need("parkingProvided", isNum(state.parking.sfPerStallDeck) && state.parking.sfPerStallDeck > 0, "state.parking.sfPerStallDeck");
  need("parkingProvided", built && typeof built === "object", "built");
  const sp = state.parking;
  const eps = 1e-9;

  const surfaceCfg = state.surface || {};
  const surface = Math.max(0, Math.floor(isNum(surfaceCfg.count) ? surfaceCfg.count : 0));
  const lotRing = Array.isArray(surfaceCfg.lot) && surfaceCfg.lot.length >= 3 ? surfaceCfg.lot : null;
  const lot = lotRing ? Math.floor(Math.abs(ringArea(lotRing)) / sp.sfPerStallSurface + eps) : 0;

  let deck = 0;
  const d = state.deck;
  if (d && d.on) {
    need("parkingProvided", isNum(d.levels) && isNum(d.w) && isNum(d.d), "state.deck levels, w and d");
    deck = Math.floor((Math.max(0, d.levels) * d.w * d.d) / sp.sfPerStallDeck + eps);
  }

  const podium = [];
  if (state.podium && state.podium.on) {
    const plates = podiumPlates(built);
    const levels = state.podium.levels || [];
    plates.forEach((lv, i) => {
      const prog = levels[i] && levels[i].program;
      if (prog !== "parking") { podium.push(0); return; }
      let area = multiPolyArea(lv.plates);
      if (i === 0) area -= linerArea(lv.plates, state.podium.liner);
      podium.push(Math.max(0, Math.floor(area / sp.sfPerStallDeck + eps)));
    });
  }

  return { total: surface + lot + deck + podium.reduce((a, b) => a + b, 0), surface, lot, deck, podium };
}

/** Required, provided, ratio and balance together. Convenience for the shell and
    for computeMetrics. → { required, provided, ratioProvided, surplus } */
function parkingBalance(state, units, built) {
  const required = parkingRequired(state, units, built);
  const provided = parkingProvided(state, built);
  const n = units && isNum(units.total) ? units.total : 0;
  return {
    required, provided,
    ratioProvided: n > 0 ? Math.round((provided.total / n) * 1000) / 1000 : 0,
    surplus: provided.total - required.total,
  };
}

return { linerArea, retailArea, parkingRequired, parkingProvided, parkingBalance };
})();

/* ---- src/midrise/metrics.js ---- */
const MetricsMod = (() => {
/* ==========================================================================
   metrics.js — every metric row of plan section 3.13 (Mid-Rise Generator)

   Contract: docs/mid-rise-generator-technical-plan.md sections 3.11 to 3.13
   and 4. computeMetrics(state, built, units, parking) reads the build result
   (levels with plates, spineGraph, courtyards, joints). Pure: no DOM, no
   Clipper, no mutation of inputs.

   Arguments after `built`:
   - units: the result of unitsEstimate (computed here when omitted).
   - parking: { required, provided } from parkingRequired and parkingProvided,
     or the object parkingBalance returns (computed here when omitted).

   Shape notes (top-level keys other modules read):
   - units (number), unitsDetail { total, byBar, byProgram }
   - gfa, far, siteCoverage (0 to 1 ratio), siteCoverageArea
   - floors (number: tallest bar floor count + podium levels), floorsDetail
     { bar, podium, deck }
   - height (ft; bar top, plus the screen height when the roof is a screen),
     deckTop (ft)

   Rule choices where the plan leaves room:
   - Site coverage = level 1 plate (index 1) + a deck level standing at z = 0,
     minus the overlap of the two (deck is a rectangle, so the overlap is
     exact without Clipper).
   - Exit stair = 12 x 22 ft, exterior stair = 10 x 20, elevator = 10 x 10.
     The stair and elevator areas come off every bar level they stand on
     (elevators stand on the levels of the longest bar).
   - Corridor length of a bar = the sum of its spineGraph edges (0 for a
     breezeway bar); it falls back to bar.length when the graph has no edge
     for the bar.
   - Open space = (site - level-1 coverage - lot area - typed stalls x
     sfPerStallSurface) / site, never below 0.
   ========================================================================== */

const { barLevels, multiPolyArea, ringArea, clipAreaConvex } = BarsMod;
const { unitsEstimate } = UnitsMod;
const { parkingBalance } = ParkingMod;

const CONSTRUCTION_CAUTION = "Caution: the hint is a reminder only. Verify the construction type against the adopted code.";
const SEED_CAUTION = "Caution: stair and elevator counts are a seed, not a code count. Verify them against the adopted code.";

const EXIT_STAIR_AREA = 12 * 22;
const EXTERIOR_STAIR_AREA = 10 * 20;
const ELEVATOR_AREA = 10 * 10;

const isNum = (v) => typeof v === "number" && Number.isFinite(v);
const r1 = (v) => Math.round(v * 10) / 10;
const r3 = (v) => Math.round(v * 1000) / 1000;

function need(fn, cond, what) {
  if (!cond) throw new Error(`${fn}: ${what} is missing or not valid`);
}

/* ------------------------------------------------------------ formatting */

function formatArea(sf) {
  return `${Math.round(sf).toLocaleString("en-US")} sf`;
}

function formatDensity(perAcre) {
  return `${(Math.round(perAcre * 10) / 10).toFixed(1)} per acre`;
}

/** 52 → 52' 0"; 63.5 → 63' 6" */
function formatHeight(ft) {
  let f = Math.floor(ft + 1e-9);
  let inch = Math.round((ft - f) * 12);
  if (inch === 12) { f += 1; inch = 0; }
  return `${f}' ${inch}"`;
}

/* ---------------------------------------------------- construction hint */

/** Plan 3.12. First row of rules.constructionHints that matches; "" with no bars. */
function constructionHint(state) {
  need("constructionHint", state && state.rules && Array.isArray(state.rules.constructionHints), "state.rules.constructionHints");
  const bars = Array.isArray(state.bars) ? state.bars : [];
  const tallest = bars.reduce((m, b) => Math.max(m, isNum(b.floors) ? b.floors : 0), 0);
  if (tallest <= 0) return "";
  const hasPodium = !!(state.podium && state.podium.on && Array.isArray(state.podium.levels) && state.podium.levels.length);
  for (const row of state.rules.constructionHints) {
    if (tallest > row.maxFloors) continue;
    const pod = row.podium || "any";
    if (pod === "any" || (pod === "yes" && hasPodium) || (pod === "none" && !hasPodium)) return row.hint;
  }
  return "";
}

/* -------------------------------------------------------------- helpers */

function siteAreaOf(state) {
  const s = state && state.site;
  need("computeMetrics", s, "state.site");
  if (s.shape === "polygon" && Array.isArray(s.points) && s.points.length >= 3) {
    return Math.abs(ringArea(s.points.map((p) => [+p[0], +p[1]])));
  }
  return (isNum(s.width) ? s.width : 0) * (isNum(s.depth) ? s.depth : 0);
}

function corridorLengthOf(bar, built) {
  if (bar.corridor === "breezeway") return 0;
  const edges = ((built.spineGraph && built.spineGraph.edges) || []).filter((e) => e.barId === bar.id);
  if (!edges.length) return bar.length;
  return edges.reduce((s, e) => s + (isNum(e.length) ? e.length : 0), 0);
}

/** Plan 3.11 counts. units = the result of unitsEstimate.
    → { exit, extra, exterior, stairs, elevators, byBar: { [id]: { exit, extra, exterior } } } */
function stairElevatorCounts(state, built, units) {
  need("stairElevatorCounts", state && Array.isArray(state.bars) && state.rules, "state.bars and state.rules");
  need("stairElevatorCounts", built && typeof built === "object", "built");
  const rules = state.rules;
  const byBar = {};
  let exit = 0, extra = 0, exterior = 0;
  for (const bar of state.bars) {
    const ends = bar.ends || {};
    const ends2 = (ends.start === "stair" ? 1 : 0) + (ends.end === "stair" ? 1 : 0);
    const len = corridorLengthOf(bar, built);
    const more = len > 0 ? Math.max(0, Math.ceil(len / rules.stairPer - 1e-9) - 1) : 0;
    let ext = 0;
    if (bar.corridor === "breezeway") {
      const prog = state.programs && state.programs[bar.program];
      const w = isNum(bar.unitWidth) && bar.unitWidth > 0 ? bar.unitWidth : (prog && prog.unitWidth) || 28;
      ext = Math.floor(bar.length / (2 * w + rules.breezewayWidth) + 1e-9);
    }
    byBar[bar.id] = { exit: ends2, extra: more, exterior: ext };
    exit += ends2; extra += more; exterior += ext;
  }
  const total = units && isNum(units.total) ? units.total : 0;
  const anyTall = state.bars.some((b) => b.floors >= 3);
  const allBreezeway = state.bars.length > 0 && state.bars.every((b) => b.corridor === "breezeway");
  let elevators = allBreezeway ? 0 : Math.ceil(total / rules.elevatorPer - 1e-9);
  if (!allBreezeway && anyTall) elevators = Math.max(1, elevators);
  if (!state.bars.length) elevators = 0;
  return { exit, extra, exterior, stairs: exit + extra + exterior, elevators, byBar };
}

function levelPlatesArea(lv) {
  return multiPolyArea(lv.plates);
}

function efficiencyOf(state, built, counts) {
  const bars = state.bars;
  const barLv = (built.levels || []).filter((l) => l.zone === "bar");
  if (!barLv.length || !bars.length) return 0;
  const cw = isNum(state.rules.corridorWidth) ? state.rules.corridorWidth : 0;
  const occupied = new Map(bars.map((b) => [b.id, new Set(barLevels(b, state).map((l) => l.index))]));
  let longest = bars[0];
  for (const b of bars) if (b.length > longest.length) longest = b;
  let gross = 0, net = 0;
  for (const lv of barLv) {
    const area = levelPlatesArea(lv);
    let corridor = 0, stairs = 0;
    for (const b of bars) {
      if (!occupied.get(b.id).has(lv.index)) continue;
      corridor += corridorLengthOf(b, built) * cw;
      const c = counts.byBar[b.id];
      stairs += (c.exit + c.extra) * EXIT_STAIR_AREA + c.exterior * EXTERIOR_STAIR_AREA;
    }
    const lift = counts.elevators > 0 && occupied.get(longest.id).has(lv.index) ? counts.elevators * ELEVATOR_AREA : 0;
    gross += area;
    net += area - corridor - stairs - lift;
  }
  return gross > 0 ? net / gross : 0;
}

const check = (target, current) => (isNum(target) && target > 0
  ? { target, current, diff: r3(current - target), pct: r1(((current - target) / target) * 100) }
  : null);

/* -------------------------------------------------------------- metrics */

/** Plan 3.13. Every row. */
function computeMetrics(state, built, units, parking) {
  need("computeMetrics", state && Array.isArray(state.bars) && state.rules, "state");
  need("computeMetrics", built && Array.isArray(built.levels), "built.levels");
  if (!units) units = unitsEstimate(state, built);
  if (!parking || !parking.required || !parking.provided) parking = parkingBalance(state, units, built);

  const siteArea = siteAreaOf(state);
  const acres = siteArea / 43560;
  const levels = built.levels;

  // GFA and level 1 coverage
  let gfa = 0;
  for (const lv of levels) gfa += levelPlatesArea(lv);
  const level1 = levels.find((l) => l.index === 1);
  let coverageArea = level1 ? levelPlatesArea(level1) : 0;
  const deckGround = levels.find((l) => l.zone === "deck" && Math.abs(l.z) < 1e-6);
  if (deckGround && !(level1 && level1.zone === "deck")) {
    const deckArea = levelPlatesArea(deckGround);
    let overlap = 0;
    if (level1 && deckGround.plates.length === 1 && deckGround.plates[0].outer.length >= 3 && !(deckGround.plates[0].holes || []).length) {
      overlap = clipAreaConvex(level1.plates, deckGround.plates[0].outer);
    }
    coverageArea += deckArea - overlap;
  }

  // height and floors
  const barLv = levels.filter((l) => l.zone === "bar");
  const podLv = levels.filter((l) => l.zone === "podium");
  const deckLv = levels.filter((l) => l.zone === "deck");
  const top = (list) => list.reduce((m, l) => Math.max(m, l.z + l.ftf), 0);
  const roofScreen = state.roof && state.roof.type === "screen" && isNum(state.roof.height) ? state.roof.height : 0;
  const base = barLv.length ? top(barLv) : top(podLv);
  const height = base + (base > 0 ? roofScreen : 0);

  // corridor, stairs, elevators
  const counts = stairElevatorCounts(state, built, units);
  let corridor = 0;
  for (const b of state.bars) corridor += corridorLengthOf(b, built);
  const totalUnits = units.total;

  // parking
  const required = parking.required, provided = parking.provided;
  const reqTotal = isNum(required) ? required : required.total;
  const provTotal = isNum(provided) ? provided : provided.total;

  // courtyards
  const courts = built.courtyards || [];
  const courtItems = courts.map((c) => ({ kind: c.kind, id: c.id, area: c.area, minDim: c.minDim }));

  // bars
  let longest = null;
  for (const b of state.bars) if (!longest || b.length > longest.length) longest = b;

  // open space
  const sp = state.parking || {};
  const surfaceCfg = state.surface || {};
  const lotArea = Array.isArray(surfaceCfg.lot) && surfaceCfg.lot.length >= 3 ? Math.abs(ringArea(surfaceCfg.lot)) : 0;
  const typedArea = (isNum(surfaceCfg.count) ? surfaceCfg.count : 0) * (isNum(sp.sfPerStallSurface) ? sp.sfPerStallSurface : 0);
  const openArea = siteArea > 0 ? Math.max(0, siteArea - coverageArea - lotArea - typedArea) : 0;
  const openRatio = siteArea > 0 ? openArea / siteArea : 0;

  const density = acres > 0 ? totalUnits / acres : 0;
  const far = siteArea > 0 ? gfa / siteArea : 0;
  const tg = state.targets || {};
  const site = state.site || {};

  const surplus = provTotal - reqTotal;
  const ratioProvided = totalUnits > 0 ? provTotal / totalUnits : 0;
  const warnings = [];
  if (surplus < 0) {
    warnings.push({ code: "parking-deficit", severity: "warn", floors: [], message: `Parking provided is ${-surplus} stalls short of the ${reqTotal} required.` });
  }
  if (isNum(site.densityCap) && site.densityCap > 0 && density > site.densityCap + 1e-9) {
    warnings.push({ code: "density-cap", severity: "warn", floors: [], message: `Density ${formatDensity(density)} is over the cap of ${site.densityCap} per acre.` });
  }
  if (isNum(site.openSpaceShare) && site.openSpaceShare > 0 && openRatio < site.openSpaceShare - 1e-9) {
    warnings.push({ code: "open-space", severity: "warn", floors: [], message: `Open space ${r1(openRatio * 100)} percent is under the ${r1(site.openSpaceShare * 100)} percent rule.` });
  }

  return {
    units: totalUnits,
    unitsDetail: { total: units.total, byBar: units.byBar, byProgram: units.byProgram },
    siteArea: r1(siteArea),
    siteAcres: r3(acres),
    density: r3(density),
    gfa: r1(gfa),
    far: r3(far),
    siteCoverage: siteArea > 0 ? r3(coverageArea / siteArea) : 0,
    siteCoverageArea: r1(coverageArea),
    efficiency: r3(efficiencyOf(state, built, counts)),
    corridorLength: r1(corridor),
    corridorPerUnit: totalUnits > 0 ? r1(corridor / totalUnits) : 0,
    parking: {
      required: reqTotal,
      provided: provTotal,
      ratioProvided: r3(ratioProvided),
      surplus,
      deficit: surplus < 0,
      requiredDetail: isNum(required) ? null : required,
      providedDetail: isNum(provided) ? null : provided,
    },
    courtyards: {
      count: courts.length,
      area: r1(courts.reduce((s, c) => s + (isNum(c.area) ? c.area : 0), 0)),
      minDim: courts.length ? Math.min(...courts.map((c) => c.minDim)) : 0,
      items: courtItems,
    },
    bars: {
      count: state.bars.length,
      longest: longest ? { id: longest.id, name: longest.name || longest.id, length: longest.length } : null,
    },
    height: r3(height),
    deckTop: r3(top(deckLv)),
    floors: barLv.length + podLv.length,
    floorsDetail: { bar: barLv.length, podium: podLv.length, deck: deckLv.length },
    stairs: { exit: counts.exit + counts.extra, exterior: counts.exterior, total: counts.stairs, byBar: counts.byBar },
    elevators: counts.elevators,
    seedCaution: SEED_CAUTION,
    constructionHint: constructionHint(state),
    constructionCaution: CONSTRUCTION_CAUTION,
    openSpace: {
      area: r1(openArea),
      ratio: r3(openRatio),
      required: isNum(site.openSpaceShare) ? site.openSpaceShare : 0,
      ok: !(isNum(site.openSpaceShare) && site.openSpaceShare > 0 && openRatio < site.openSpaceShare - 1e-9),

    target: {
      units: check(tg.units, totalUnits),
      density: check(tg.density, density),

    warnings,

}

return { CONSTRUCTION_CAUTION, SEED_CAUTION, formatArea, formatDensity, formatHeight, constructionHint, siteAreaOf, stairElevatorCounts, computeMetrics };
})();

/* ---- src/midrise/derived.js ---- */
const MidDerivedMod = (() => {
/* ==========================================================================
   midrise/derived.js — Mid-Rise Generator → massing.derived (docs/project-file-spec.md 6.2)

   midriseDerived(state, built, metrics) → { footprint, height, levels, context, metrics }
     state    the mid-rise state (docs/mid-rise-generator-technical-plan.md section 2)
     built    assemble(state) (plan section 4): levels[{ index, zone, z, ftf, program, plates, spines, barIds }], solids
     metrics  computeMetrics(...) rows. A number is read as is; an object is read through .total / .value.
              A missing row falls back to a figure computed from `built`.

   seedBlocks(state, built) → { [levelIndex]: [{ kind, outer }] }   (plan section 3.11, bar levels only)
     kind "stair" | "exterior-stair" | "elevator"; outer = a clean counter-clockwise ring.

   levelNames(levels) → ["Podium 1", "Floor 2", …, "Deck 1", …]   (shared with sketchup.js)

   Pure: no DOM. Clipper (globalThis.ClipperLib, SCALE 1000) is used only for the footprint union.
   Units: feet. Plan (x, y): x = east, y = north.
   ========================================================================== */

const { cleanRing2 } = SkFmt;

const SCALE = 1000;
const STAIR = { along: 12, across: 22, inset: 6 };     // exit stair, plan section 3.11
const EXT_STAIR = { along: 10, across: 20 };           // exterior stair at a breezeway
const ELEV = { along: 10, across: 10 };                // elevator

const r1 = (v) => Math.round(v * 10) / 10;
const r3 = (v) => Math.round(v * 1000) / 1000;
const isNum = (v) => typeof v === "number" && Number.isFinite(v);
const clone = (o) => JSON.parse(JSON.stringify(o));
const need = (v, name) => { if (v === undefined || v === null) throw new Error(`midriseDerived: missing input "${name}".`); return v; };

/* ---------- rings and multipolygons ---------- */

/** One {outer, holes} piece → cleaned piece, or null when the outer ring is degenerate. */
function cleanPiece(poly) {
  const outer = cleanRing2(poly && poly.outer);
  if (!outer) return null;
  const holes = [];
  for (const h of (poly && poly.holes) || []) {
    const c = cleanRing2(h, { hole: true });
    if (c) holes.push(c);
  }
  return { outer, holes };
}
const cleanMulti = (mp) => (Array.isArray(mp) ? mp : []).map(cleanPiece).filter(Boolean);

function ringArea(ring) {
  let a = 0;
  for (let i = 0, n = ring.length; i < n; i++) { const p = ring[i], q = ring[(i + 1) % n]; a += p[0] * q[1] - q[0] * p[1]; }
  return a / 2;
}
const multiArea = (mp) => mp.reduce((s, pc) => s + Math.abs(ringArea(pc.outer)) - pc.holes.reduce((h, r) => h + Math.abs(ringArea(r)), 0), 0);

/** Union of several MultiPolys with Clipper. Returns a cleaned MultiPoly. */
function unionMulti(list) {
  const C = globalThis.ClipperLib;
  if (!C) throw new Error("midriseDerived: ClipperLib is not loaded (globalThis.ClipperLib) and the footprint needs it.");
  const toPath = (ring) => ring.map((p) => ({ X: Math.round(p[0] * SCALE), Y: Math.round(p[1] * SCALE) }));
  const clip = new C.Clipper();
  let any = false;
  for (const mp of list) {
    for (const pc of mp) {
      clip.AddPath(toPath(pc.outer), C.PolyType.ptSubject, true);
      for (const h of pc.holes) clip.AddPath(toPath(h), C.PolyType.ptSubject, true);   // regions wind 1 or 0, so windings add up correctly
      any = true;
    }
  }
  if (!any) return [];
  const tree = new C.PolyTree();
  clip.Execute(C.ClipType.ctUnion, tree, C.PolyFillType.pftNonZero, C.PolyFillType.pftNonZero);
  const ring = (node) => node.Contour().map((p) => [p.X / SCALE, p.Y / SCALE]);
  const out = [];
  const visit = (node) => {
    if (!node.IsHole()) {
      const outer = cleanRing2(ring(node));
      const holes = [];
      for (const ch of node.Childs()) {
        const h = cleanRing2(ring(ch), { hole: true });
        if (h) holes.push(h);
      }
      if (outer) out.push({ outer, holes });
    }
    for (const ch of node.Childs()) for (const g of ch.Childs()) visit(g);   // islands inside holes
  };
  for (const top of tree.Childs()) visit(top);
  return out;
}

/* ---------- level names ---------- */

/** "Podium n" (n = level index), "Floor n" (n = level index), "Deck n" (n counts deck levels from 1). */
function levelNames(levels) {
  let deck = 0;
  return (levels || []).map((l) => {
    if (l.zone === "podium") return `Podium ${l.index}`;
    if (l.zone === "deck") return `Deck ${++deck}`;
    return `Floor ${l.index}`;
  });
}

/* ---------- bar spines (plan section 3.1 and 3.2, kept here so this file stands alone) ---------- */

const dirOf = (deg) => { const a = (deg * Math.PI) / 180; return [Math.cos(a), Math.sin(a)]; };

/** The centerline vertices of a bar: start, each bend point, end. */
function centerline(bar) {
  const length = need(bar.length, "bar.length");
  const bends = (bar.bends || []).filter((b) => b && isNum(b.at) && b.at > 0 && b.at < length).sort((a, b) => a.at - b.at);
  const pts = [[bar.x || 0, bar.y || 0]];
  let angle = bar.angle || 0, at = 0;
  const stops = [...bends.map((b) => ({ at: b.at, deg: b.deg || 0 })), { at: length, deg: 0 }];
  for (const s of stops) {
    const [dx, dy] = dirOf(angle), p = pts[pts.length - 1], d = s.at - at;
    pts.push([p[0] + dx * d, p[1] + dy * d]);
    at = s.at; angle += s.deg;
  }
  return pts;
}

/** Offset a polyline to its left by s ft with mitered corners. */
function offsetPath(pts, s) {
  if (!s) return pts.map((p) => p.slice());
  const n = pts.length, normals = [];
  for (let i = 0; i + 1 < n; i++) {
    const dx = pts[i + 1][0] - pts[i][0], dy = pts[i + 1][1] - pts[i][1], l = Math.hypot(dx, dy) || 1;
    normals.push([-dy / l, dx / l]);
  }
  return pts.map((p, i) => {
    let nx, ny;
    if (i === 0) [nx, ny] = normals[0];
    else if (i === n - 1) [nx, ny] = normals[n - 2];
    else {
      const a = normals[i - 1], b = normals[i], k = 1 + a[0] * b[0] + a[1] * b[1];
      nx = (a[0] + b[0]) / (k || 1); ny = (a[1] + b[1]) / (k || 1);
    }
    return [p[0] + nx * s, p[1] + ny * s];
  });
}

/** The corridor spine: the centerline, shifted toward the corridor side for single-loaded bars. */
function spineOf(bar, rules) {
  const pts = centerline(bar);
  if (bar.corridor !== "single") return pts;
  const shift = (bar.depth || 0) / 2 - ((rules && rules.corridorWidth) || 5.67) / 2;
  return offsetPath(pts, bar.unitSide === "right" ? shift : -shift);       // corridor is opposite the units
}

const pathLength = (pts) => pts.reduce((s, p, i) => (i ? s + Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1]) : 0), 0);

/** Point and unit direction at `dist` ft along a polyline (clamped to its ends). */
function pointAt(pts, dist) {
  let left = Math.max(0, dist);
  for (let i = 0; i + 1 < pts.length; i++) {
    const dx = pts[i + 1][0] - pts[i][0], dy = pts[i + 1][1] - pts[i][1], l = Math.hypot(dx, dy);
    if (left <= l || i + 2 === pts.length) {
      const t = l ? Math.min(left, l) / l : 0;
      return { x: pts[i][0] + dx * t, y: pts[i][1] + dy * t, ux: l ? dx / l : 1, uy: l ? dy / l : 0 };
    }
    left -= l;
  }
  return { x: pts[0][0], y: pts[0][1], ux: 1, uy: 0 };
}

/** A rectangle `along` × `across` centred at `dist` along the spine and `offset` ft to its left. CCW ring. */
function blockAt(pts, dist, offset, along, across) {
  const p = pointAt(pts, dist), vx = -p.uy, vy = p.ux;
  const cx = p.x + vx * offset, cy = p.y + vy * offset, a = along / 2, b = across / 2;
  const c = (s, t) => [r3(cx + p.ux * s + vx * t), r3(cy + p.uy * s + vy * t)];
  return [c(-a, -b), c(a, -b), c(a, b), c(-a, b)];
}

/* ---------- seeds (plan section 3.11) ---------- */

function unitWidthOf(state, bar) {
  const prog = (state.programs || {})[bar.program] || {};
  return bar.unitWidth || prog.unitWidth || 28;
}

/** Per-bar seed blocks (kind + ring), the same on every level the bar occupies. → { [barId]: [{ kind, outer }] } */
function seedsByBar(state, unitsTotal) {
  const rules = state.rules || {};
  const bars = state.bars || [];
  const stairPer = rules.stairPer || 250, elevPer = rules.elevatorPer || 100, bw = rules.breezewayWidth || 8, cw = rules.corridorWidth || 5.67;
  const out = {};
  const push = (id, kind, ring) => { const outer = cleanRing2(ring); if (outer) (out[id] = out[id] || []).push({ kind, outer }); };
  const spines = {};

  for (const bar of bars) {
    const spine = spineOf(bar, rules);
    spines[bar.id] = spine;
    const L = pathLength(spine);
    const ends = bar.ends || {};
    if (ends.start === "stair") push(bar.id, "stair", blockAt(spine, STAIR.inset, 0, STAIR.along, STAIR.across));
    if (ends.end === "stair") push(bar.id, "stair", blockAt(spine, L - STAIR.inset, 0, STAIR.along, STAIR.across));
    if (bar.corridor === "breezeway") {
      const w = unitWidthOf(state, bar), module = 2 * w + bw, n = Math.floor(L / module);
      for (let i = 0; i < n; i++) push(bar.id, "exterior-stair", blockAt(spine, i * module + w + bw / 2, 0, EXT_STAIR.along, EXT_STAIR.across));
    } else {
      const extra = Math.max(0, Math.ceil(L / stairPer) - 1);                 // corridor length: breezeway bars add 0
      for (let k = 1; k <= extra; k++) push(bar.id, "stair", blockAt(spine, (L * k) / (extra + 1), 0, STAIR.along, STAIR.across));
    }
  }

  // elevators: all on the longest bar that has a corridor, at its mid-length, on the unitSide side
  const withCorridor = bars.filter((b) => b.corridor !== "breezeway");
  if (withCorridor.length) {
    const tall = bars.some((b) => (b.floors || 0) >= 3);
    let count = Math.ceil((unitsTotal || 0) / elevPer);
    if (tall) count = Math.max(1, count);
    if (count > 0) {
      let host = withCorridor[0];
      for (const b of withCorridor) if (pathLength(spines[b.id]) > pathLength(spines[host.id])) host = b;
      const spine = spines[host.id], L = pathLength(spine), side = host.unitSide === "right" ? -1 : 1;
      for (let k = 0; k < count; k++) {
        push(host.id, "elevator", blockAt(spine, L / 2 + (k - (count - 1) / 2) * ELEV.along, side * (cw / 2 + ELEV.across / 2), ELEV.along, ELEV.across));
      }
    }
  }
  return out;
}

const metricNumber = (v) => {
  if (isNum(v)) return v;
  if (v && typeof v === "object") for (const k of ["total", "value", "ratio"]) if (isNum(v[k])) return v[k];
  return null;
};

/** Which bars sit on a built level: level.barIds, else every bar tall enough. */
function barsOnLevel(state, level, podiumLevels) {
  if (level.zone !== "bar") return [];
  const bars = state.bars || [];
  if (Array.isArray(level.barIds)) return bars.filter((b) => level.barIds.includes(b.id));
  return bars.filter((b) => level.index - podiumLevels <= (b.floors || 0));
}

/**
 * The seed blocks of every bar level. → { [levelIndex]: [{ kind, outer }] }
 * `units` (optional number) overrides the unit count used for the elevator count.
 */
function seedBlocks(state, built, units) {
  need(state, "state"); need(built, "built");
  const podiumLevels = state.podium && state.podium.on ? (state.podium.levels || []).length : 0;
  const perBar = seedsByBar(state, isNum(units) ? units : 0);
  const out = {};
  for (const level of built.levels || []) {
    if (level.zone !== "bar") continue;
    const list = [];
    for (const bar of barsOnLevel(state, level, podiumLevels)) for (const s of perBar[bar.id] || []) list.push({ kind: s.kind, outer: s.outer.map((p) => p.slice()) });
    out[level.index] = list;
  }
  return out;
}

/* ---------- site area, for the fallbacks ---------- */

function siteArea(state) {
  const s = (state && state.site) || {};
  if (s.shape === "polygon" && Array.isArray(s.points) && s.points.length >= 3) return Math.abs(ringArea(s.points));
  return (s.width || 0) * (s.depth || 0);
}

/* ---------- the writer ---------- */

function midriseDerived(state, built, metrics) {
  need(state, "state"); need(built, "built");
  const builtLevels = need(built.levels, "built.levels");
  const m = metrics || {};

  const levelsIn = builtLevels.map((l) => ({ ...l, plates: cleanMulti(l.plates) }));
  const elevUnits = metricNumber(m.units);
  const seeds = seedBlocks(state, { ...built, levels: levelsIn }, elevUnits === null ? 0 : elevUnits);
  const names = levelNames(levelsIn);

  const levels = levelsIn.map((l, i) => {
    const spines = (l.zone === "bar" ? l.spines || [] : []).filter((s) => Array.isArray(s) && s.length >= 2).map((s) => s.map((p) => [r3(p[0]), r3(p[1])]));
    return {
      index: l.index, name: names[i], zone: l.zone, z: r3(l.z), ftf: r3(l.ftf), program: l.program,
      plates: l.plates, core: null, spines, seeds: l.zone === "bar" ? seeds[l.index] || [] : [],
    };
  });

  const footprint = unionMulti(levels.map((l) => l.plates));

  const gfaFallback = levels.reduce((s, l) => s + multiArea(l.plates), 0);
  const gfa = metricNumber(m.gfa);
  const area = siteArea(state);
  const far = metricNumber(m.far);
  const cov = metricNumber(m.siteCoverage);
  const level1 = levels.filter((l) => l.z === 0).map((l) => l.plates);
  const covFallback = area > 0 ? multiArea(unionMulti(level1)) / area : 0;
  const barLevels = levels.filter((l) => l.zone !== "deck");
  const screen = state.roof && state.roof.type === "screen" ? state.roof.height || 0 : 0;
  const heightFallback = barLevels.reduce((mx, l) => Math.max(mx, l.z + l.ftf), 0) + screen;
  const height = metricNumber(m.height);
  const podiumCount = levels.filter((l) => l.zone === "podium").length;
  const tallest = Math.max(0, ...(state.bars || []).map((b) => b.floors || 0));
  const floors = metricNumber(m.floors);
  const units = metricNumber(m.units);

  return {
    footprint,
    height: r1(height === null ? heightFallback : height),
    levels,
    context: { blocks: clone(((state.context && state.context.blocks) || []).map((b) => ({ x: b.x, y: b.y, w: b.w, d: b.d, h: b.h }))) },
    metrics: {
      gfa: Math.round(gfa === null ? gfaFallback : gfa),
      far: Math.round((far === null ? (area > 0 ? gfaFallback / area : 0) : far) * 100) / 100,
      siteCoverage: Math.round((cov === null ? covFallback : cov) * 1000) / 1000,
      floors: floors === null ? podiumCount + tallest : floors,
      height: r1(height === null ? heightFallback : height),
      units: units === null ? 0 : units,
    },
  };
}

return { levelNames, seedBlocks, midriseDerived };
})();

/* ---- src/midrise/snaptargets.js ---- */
const SnapTargetsMod = (() => {
/* ==========================================================================
   snaptargets.js — snap lines for the mid-rise generator (plan 4, 5.3)

   Pure ES module. No DOM, no three, no mutation of inputs.
   The lines are in the exact shape src/tower/snap.js consumes
   (docs/v1.1-spec.md, "Contract: src/tower/snap.js"):
     { axis: "x" | "y", value, kind, label, from, to }
   so snapMove, snapEdge and snapLength work unchanged.

   kind stays inside snap.js's list, which also sets the tie priority
   (segment > podium > context > setback > site > grid):
     bar edges and centers  → kind "segment"
     deck edges             → kind "podium"
     court edges            → kind "context"
     context blocks         → kind "context"   (only when context.show)
     site, setback          → from collectSnapTargets in snap.js
   Every line also carries `source` ("site" | "setback" | "bar" | "deck" |
   "court" | "context") and, for bars and courts, `id`. snap.js ignores the
   extras and copies them onto the guides it returns.
   The grid is not a line: pass grid = state.view.snap.grid to snapMove.

   exclude: { kind: "bar" | "deck" | "court" | "context", id?, index? }
            or an array of them (a multi-selection being moved).
   ========================================================================== */

const { collectSnapTargets } = SnapMod;
const { legsOf, legRing } = BarsMod;

function num(v, d = 0) {
  const n = typeof v === "number" ? v : parseFloat(v);
  return Number.isFinite(n) ? n : d;
}

function rectBox(x, y, w, d) {
  if (!(w > 0 && d > 0)) return null;
  return { minX: x - w / 2, maxX: x + w / 2, minY: y - d / 2, maxY: y + d / 2 };
}

function boxLines(out, b, kind, name, extra, withCenter) {
  const add = (axis, value, label, from, to) => out.push({ axis, value, kind, label, from, to, ...extra });
  add("x", b.minX, `${name} west edge`, b.minY, b.maxY);
  add("x", b.maxX, `${name} east edge`, b.minY, b.maxY);
  add("y", b.minY, `${name} south edge`, b.minX, b.maxX);
  add("y", b.maxY, `${name} north edge`, b.minX, b.maxX);
  if (withCenter) {
    add("x", (b.minX + b.maxX) / 2, `${name} center`, b.minY, b.maxY);
    add("y", (b.minY + b.maxY) / 2, `${name} center`, b.minX, b.maxX);
  }
}

function excluded(list, kind, id, index) {
  return list.some((e) => e && e.kind === kind &&
    ((e.id !== undefined && e.id === id) || (e.index !== undefined && num(e.index, -1) === index) ||
     (e.id === undefined && e.index === undefined)));
}

/**
 * Plan box of one bar: the bbox of its leg rings (rotation, bends and miter
 * extensions included). Computed from the state, so it is current during a
 * drag even when `built` is stale. → { minX, maxX, minY, maxY } | null
 */
function barBox(state, built, barId) {
  if (!state || !Array.isArray(state.bars)) throw new Error("barBox: state.bars is required");
  const bar = state.bars.find((b) => b && b.id === barId);
  if (!bar || !(num(bar.length) > 0) || !(num(bar.depth) > 0)) return null;
  const b = { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity };
  for (const leg of legsOf(bar)) {
    for (const q of legRing(leg)) {
      if (q[0] < b.minX) b.minX = q[0];
      if (q[0] > b.maxX) b.maxX = q[0];
      if (q[1] < b.minY) b.minY = q[1];
      if (q[1] > b.maxY) b.maxY = q[1];
    }
  }
  return Number.isFinite(b.minX) ? b : null;
}

/**
 * Box of any movable item, for snapMove (extra helper, like itemBox in snap.js).
 * item: { kind: "bar", id } | { kind: "deck" } | { kind: "court", id?, index? } | { kind: "context", index }
 * → { minX, maxX, minY, maxY } | null
 */
function midriseItemBox(state, built, item) {
  if (!state) throw new Error("midriseItemBox: state is required");
  if (!item) return null;
  if (item.kind === "bar") {
    const id = item.id !== undefined ? item.id : ((state.bars || [])[num(item.index, -1)] || {}).id;
    return barBox(state, built, id);
  }
  if (item.kind === "deck") {
    const d = state.deck;
    return d ? rectBox(num(d.x), num(d.y), num(d.w), num(d.d)) : null;
  }
  if (item.kind === "court") {
    const courts = state.courts || [];
    const c = item.id !== undefined ? courts.find((k) => k && k.id === item.id) : courts[num(item.index, -1)];
    return c ? rectBox(num(c.x), num(c.y), num(c.w), num(c.d)) : null;
  }
  if (item.kind === "context") {
    const c = ((state.context && state.context.blocks) || [])[num(item.index, -1)];
    return c ? rectBox(num(c.x), num(c.y), num(c.w), num(c.d)) : null;
  }
  return null;
}

/**
 * All snap lines for a drag (plan 5.3): site edges, setback lines, other bars'
 * edges and centers, deck edges, court edges, and context blocks when shown.
 * Build once at drag start with `exclude` = the moving item(s). → { lines }
 */
function collectBarSnapTargets(state, built, { exclude } = {}) {
  if (!state || typeof state !== "object") throw new Error("collectBarSnapTargets: state is required");
  if (!state.site) throw new Error("collectBarSnapTargets: state.site is required");
  const ex = Array.isArray(exclude) ? exclude : exclude ? [exclude] : [];
  const lines = [];

  // site edges and setback lines from the tower module (a site-only state: no podium, segments or context)
  for (const l of collectSnapTargets({ site: state.site }, []).lines) lines.push({ ...l, source: l.kind });

  const bars = Array.isArray(state.bars) ? state.bars : [];
  bars.forEach((bar, i) => {
    if (!bar || excluded(ex, "bar", bar.id, i)) return;
    const b = barBox(state, built, bar.id);
    if (b) boxLines(lines, b, "segment", bar.name || `Bar ${bar.id}`, { source: "bar", id: bar.id }, true);
  });

  const deck = state.deck;
  if (deck && deck.on && !excluded(ex, "deck", undefined, 0)) {
    const b = rectBox(num(deck.x), num(deck.y), num(deck.w), num(deck.d));
    if (b) boxLines(lines, b, "podium", "Deck", { source: "deck" }, false);
  }

  (state.courts || []).forEach((c, i) => {
    if (!c || excluded(ex, "court", c.id, i)) return;
    const b = rectBox(num(c.x), num(c.y), num(c.w), num(c.d));
    if (b) boxLines(lines, b, "context", `Court ${c.id || i + 1}`, { source: "court", id: c.id }, false);
  });

  const ctx = state.context;
  if (ctx && ctx.show !== false && Array.isArray(ctx.blocks)) {
    ctx.blocks.forEach((c, i) => {
      if (!c || excluded(ex, "context", undefined, i)) return;
      const b = rectBox(num(c.x), num(c.y), num(c.w), num(c.d));
      if (b) boxLines(lines, b, "context", `Context block ${i + 1}`, { source: "context" }, true);
    });
  }

  return { lines };
}

return { barBox, midriseItemBox, collectBarSnapTargets };
})();

/* ---- src/midrise/sketchup.js ---- */
const SkMid = (() => {
/* ==========================================================================
   midrise/sketchup.js — Mid-Rise Generator → ".sketchup.json" (docs/sketchup-spec.md section 4)

   midriseToSketchup(state, built, metrics, meta) → a document made with makeDoc (passes validateDoc).
     state    the mid-rise state (names, programs and colors, courts, context blocks)
     built    assemble(state): levels[{ index, zone, z, ftf, program, plates }], courtyards, solids
     metrics  computeMetrics rows (a number, or an object with .total / .value); only used for the notes
     meta     optional { createdAt, name, location, zShift }

   Pure: no DOM, no Clipper. Units: feet. Plan (x, y): x = east, y = north. z up.

   Rule choices (where the spec leaves room):
   - Group order: Podium, Bars, Deck, Courts, Context. A group with nothing in it is left out.
   - Bars holds one solid per bar level ("Floor n"), at full floor-to-floor height. The level plate is the
     union of the bars on that level, so a level whose bars do not touch is a group "Floor n" with one solid
     per piece ("Floor n · piece k"). Podium and Deck levels are named the same way ("Podium n", "Deck n").
   - Tags and materials: one per program used (named like the program, "Residential"), plus "Roof", "Courts"
     and "Context" only when something uses them. Tag color = program color. The "Courts" tag is hidden.
   - Courts: outline lines at ground level, in a hidden group: the open courts of state.courts and the
     closed courtyards of built.courtyards.
   - The roof screen (a prism in built.solids) is a solid "Screen" inside Bars.
   - doc.source is "midrise" (SKETCHUP_SOURCE). validateDoc and the SketchUp importer accept it.
   ========================================================================== */

const { cleanRing2, makeDoc } = SkFmt;
const { levelNames } = MidDerivedMod;

/** The `source` value written to the document. Change to "midrise" once validateDoc and importer.rb accept it. */
const SKETCHUP_SOURCE = "midrise";

const PROGRAM_COLORS = {
  residential: "#4f7fd1", hotel: "#8a63c9", senior: "#c2607a", retail: "#d9a22b",
  amenity: "#58a65c", leasing: "#7a8fa6", parking: "#8b929a",
};
const ROOF_COLOR = "#d9a22b";
const COURT_COLOR = "#58a65c";
const CONTEXT_COLOR = "#c3c8ce";
const FALLBACK_COLOR = "#8b929a";
const HEX = /^#[0-9a-fA-F]{6}$/;

const r3 = (v) => Math.round(v * 1000) / 1000;
const r2 = (v) => Math.round(v * 100) / 100;
const num = (v, d) => (typeof v === "number" && Number.isFinite(v) ? v : d);
const cap = (s) => { s = String(s || ""); return s.charAt(0).toUpperCase() + s.slice(1); };
const metricNumber = (v) => {
  if (typeof v === "number" && Number.isFinite(v)) return v;
  if (v && typeof v === "object") for (const k of ["total", "value"]) if (typeof v[k] === "number" && Number.isFinite(v[k])) return v[k];
  return null;
};

/** Tag and material name for a program key: "residential" → "Residential". */
const programLabel = (key) => cap(key) || "Program";

function programColor(state, key) {
  const c = state && state.programs && state.programs[key] && state.programs[key].color;
  return HEX.test(c || "") ? c : PROGRAM_COLORS[key] || FALLBACK_COLOR;
}

function cleanPiece(poly) {
  const outer = cleanRing2(poly && poly.outer);
  if (!outer) return null;
  const holes = [];
  for (const h of (poly && poly.holes) || []) {
    const c = cleanRing2(h, { hole: true });
    if (c) holes.push(c);
  }
  return { outer, holes };
}
const piecesOf = (mp) => (Array.isArray(mp) ? mp : []).map(cleanPiece).filter(Boolean);

function pieceArea(pc) {
  const a = (ring) => { let s = 0; for (let i = 0; i < ring.length; i++) { const p = ring[i], q = ring[(i + 1) % ring.length]; s += p[0] * q[1] - q[0] * p[1]; } return Math.abs(s / 2); };
  return a(pc.outer) - pc.holes.reduce((s, h) => s + a(h), 0);
}

const rectRing = (x, y, w, d) => [[x - w / 2, y - d / 2], [x + w / 2, y - d / 2], [x + w / 2, y + d / 2], [x - w / 2, y + d / 2]];

function midriseToSketchup(state, built, metrics, meta) {
  if (!state) throw new Error('midriseToSketchup: missing input "state".');
  if (!built || !Array.isArray(built.levels)) throw new Error('midriseToSketchup: missing input "built.levels".');
  const m = metrics || {}, mt = meta || {};

  const tagList = [], matList = [], declared = new Set();
  const declare = (name, color, visible = true) => {
    if (declared.has(name)) return;
    declared.add(name);
    tagList.push({ name, color, visible });
    matList.push({ name, color, alpha: 1 });
  };

  // ---- levels, by zone -----------------------------------------------------------
  const names = levelNames(built.levels);
  const zoneKids = { podium: [], bar: [], deck: [] };
  let floorSolids = 0, gfa = 0, top = 0;
  built.levels.forEach((l, i) => {
    const pieces = piecesOf(l.plates);
    if (!pieces.length || !(num(l.ftf, 0) > 0)) return;
    const prog = l.program || (l.zone === "deck" ? "parking" : "residential");
    const label = programLabel(prog);
    declare(label, programColor(state, prog));
    const z0 = r3(l.z), z1 = r3(l.z + l.ftf);
    const area = pieces.reduce((s, pc) => s + pieceArea(pc), 0);
    const name = names[i];
    const attributes = { level: l.index, zone: l.zone, program: prog, area_sf: r2(area) };
    const solid = (nm, pc, extra = {}) => ({ type: "solid", name: nm, tag: label, material: label, outer: pc.outer, holes: pc.holes, z0, z1, ...extra });
    const node = pieces.length === 1
      ? solid(name, pieces[0], { attributes })
      : { type: "group", name, tag: label, material: label, attributes, children: pieces.map((pc, k) => solid(`${name} · piece ${k + 1}`, pc)) };
    floorSolids += pieces.length;
    gfa += area;
    if (l.zone !== "deck") top = Math.max(top, z1);
    (zoneKids[l.zone] || zoneKids.bar).push(node);
  });

  // ---- roof screen ---------------------------------------------------------------
  for (const s of built.solids || []) {
    if (!s || s.kind !== "prism" || s.role !== "screen") continue;
    const z0 = r3(s.z0), z1 = r3(s.z1);
    if (!(z1 - z0 > 0.001)) continue;
    const pieces = piecesOf(s.polygons);
    if (!pieces.length) continue;
    declare("Roof", ROOF_COLOR);
    pieces.forEach((pc, k) => zoneKids.bar.push({ type: "solid", name: pieces.length > 1 ? `Screen · piece ${k + 1}` : "Screen", tag: "Roof", material: "Roof", outer: pc.outer, holes: pc.holes, z0, z1 }));
    top = Math.max(top, z1);
  }

  const children = [];
  if (zoneKids.podium.length) children.push({ type: "group", name: "Podium", children: zoneKids.podium });
  if (zoneKids.bar.length) children.push({ type: "group", name: "Bars", children: zoneKids.bar });
  if (zoneKids.deck.length) children.push({ type: "group", name: "Deck", children: zoneKids.deck });

  // ---- courts (hidden guides) ----------------------------------------------------
  const lines = [];
  const outline = (ring) => { const c = cleanRing2(ring); return c ? [...c, c[0]].map((p) => [p[0], p[1], 0]) : null; };
  for (const c of state.courts || []) {
    if (!(num(c.w, 0) > 0 && num(c.d, 0) > 0)) continue;
    const l = outline(rectRing(num(c.x, 0), num(c.y, 0), c.w, c.d));
    if (l) lines.push(l);
  }
  for (const c of built.courtyards || []) {
    if (c && c.kind === "closed" && Array.isArray(c.ring)) { const l = outline(c.ring); if (l) lines.push(l); }
  }
  if (lines.length) {
    declare("Courts", COURT_COLOR, false);
    children.push({ type: "group", name: "Courts", tag: "Courts", children: [{ type: "lines", name: "Court outlines", lines }] });
  }

  // ---- context -------------------------------------------------------------------
  const ctx = state.context;
  const blockKids = [];
  if (ctx && ctx.show !== false) {
    for (const b of ctx.blocks || []) {
      const w = num(b && b.w, 0), d = num(b && b.d, 0), h = num(b && b.h, 0);
      if (!(w > 0 && d > 0 && h > 0)) continue;
      const outer = cleanRing2(rectRing(num(b.x, 0), num(b.y, 0), w, d));
      if (!outer) continue;
      blockKids.push({ type: "solid", name: `Block ${blockKids.length + 1}`, tag: "Context", material: "Context", outer, holes: [], z0: 0, z1: r3(h) });
    }
  }
  if (blockKids.length) {
    declare("Context", CONTEXT_COLOR);
    children.push({ type: "group", name: "Context", tag: "Context", material: "Context", children: blockKids });
  }

  const name = String(mt.name || state.name || "Mid-Rise");
  const units = metricNumber(m.units);
  const gfaOut = metricNumber(m.gfa);
  const notes = [
    "Plan origin = the tool's plan origin (0, 0). x = east, y = north. Lengths in feet.",
    `Mid-Rise Generator: ${floorSolids} level solids, gross floor area ${Math.round(gfaOut === null ? gfa : gfaOut).toLocaleString("en-US")} sf, top of floors ${r2(top)} ft${units === null ? "" : `, about ${units} units (estimate)`}.`,
    "Each level is one solid at full floor-to-floor height. The Courts group is hidden; turn on the Courts tag to see the outlines.",
  ];

  return makeDoc({
    source: SKETCHUP_SOURCE, name, location: mt.location || null, zShift: num(mt.zShift, 0), notes,
    tags: tagList, materials: matList, createdAt: mt.createdAt,
    root: { type: "group", name, children },
  });
}

return { SKETCHUP_SOURCE, programLabel, midriseToSketchup };
})();
