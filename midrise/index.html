/* ==========================================================================
   SHARED: storage
   src/shared/storage.js (inlined with the other modules),
   plus `Options`, the mid-rise tool's glue: save, duplicate, rename, delete, the
   option menu, export / import, autosave and restore.
   Custom AI prompts ride in the same blob (storage.listPrompts / savePrompt / removePrompt).
   Saved options live under localStorage key `midrise.options.v1`; the
   working copy autosaves into the "__current" slot after a 1 s pause.
   ========================================================================== */
const Options = (() => {
  const storage = StorageMod.createStorage({
    key: CONFIG.storageKey, schema: CONFIG.schema, migrate: (s) => s, filePrefix: 'midrise-options',
    onNotice: (message) => Toast.show(message, 'warn', 7000),
  });
  let currentId = null;            // the saved option the working copy came from (null = unsaved)
  let savedPrint = null;           // fingerprint of that option's state, to show "unsaved changes"
  let dirtyTimer = null;
  let autosaveHeld = false;       // tests hold the autosave so a ?test visit cannot overwrite the saved working copy

  const fingerprint = (s) => JSON.stringify({ ...s, name: '' });
  const savedNames = () => storage.list().map((o) => o.name);
  const quoted = (name) => `“${name}”`;

  function syncDirty() {
    clearTimeout(dirtyTimer);
    const dot = document.getElementById('unsavedDot');
    const dirty = !currentId || savedPrint !== fingerprint(Store.raw());
    if (dot) dot.hidden = !dirty;
    const btn = document.getElementById('btnSave');
    if (btn) btn.classList.toggle('is-on', dirty);
    return dirty;
  }
  function link(id, state) {
    currentId = id || null;
    uiPrefs.currentId = currentId;
    saveUiPrefs(uiPrefs);
    savedPrint = currentId ? fingerprint(state || Store.raw()) : null;
    syncDirty();
  }
  /** While a project is open, a design that replaces the one on screen stays where the project put it: same placement, same site context. */
  function keepProject(s) {
    if (!(typeof ProjectUI !== 'undefined' && ProjectUI.has())) return s;
    const cur = Store.raw();
    s.placement = deepClone(cur.placement);
    if (cur.context && cur.context.fromSite) s.context = deepClone(cur.context);
    return s;
  }
  const reframe = () => { if (Render.ready()) Render.setView(Render.info().preset || 'axon', true); };

  /** Put a state on screen as the working copy. Undo brings the previous design back. */
  function show(raw, { id = null, name } = {}) {
    const s = fillDefaults(raw);
    if (name) s.name = name;
    keepProject(s);
    if (Render.comparing()) Compare.exit();
    Store.replace(s);
    link(id, s);
    reframe();
    return s;
  }

  function loadOption(id) {
    const rec = storage.get(id);
    if (!rec) { Toast.show('That option is no longer saved.', 'warn'); return false; }
    show(rec.state, { id: rec.id, name: rec.name });
    Toast.show(`Opened ${quoted(rec.name)}. Undo brings your last design back.`);
    return true;
  }
  /** A preset becomes a new, unsaved option. It keeps its own context blocks (the preset sites have their own neighbors). */
  function loadPreset(id) {
    const p = CONFIG.presets.find((x) => x.id === id);
    if (!p) return false;
    const s = fillDefaults(p.state);
    s.context.show = true;
    s.view.colorBy = 'program';          // v1.1: a preset is a new option, and new options color the Diagram by program
    show(s, { id: null, name: p.name });
    Toast.show(`Started from the preset ${quoted(p.name)}. It is not saved yet.`);
    return true;
  }

  /** Unsaved changes = a design linked to a saved option that no longer matches it, or an unsaved design that differs from the default
   *  (an untouched new design has nothing to lose). The name is ignored, as in the dot next to Save. */
  function hasUnsavedChanges() {
    const rec = currentId && storage.get(currentId);
    return rec ? savedPrint !== fingerprint(Store.raw()) : fingerprint(Store.raw()) !== fingerprint(defaultState());
  }
  /** Start fresh from the built-in default (what a first-ever visit gets) as a new, unsaved option named "Untitled" ("Untitled (2)"
   *  when taken). Saved options are never touched. One undo step brings the previous design back (its name is part of the state;
   *  like loadPreset, the link to a saved option is not restored). Resolves true when it happened, false when the user cancelled. */
  async function newDesign({ confirm = true } = {}) {
    if (confirm && hasUnsavedChanges()) {
      const ok = await confirmDialog(`Start a new design? Unsaved changes to ${quoted(Store.get('name') || 'this design')} will be lost. You can undo this.`, 'Start new');
      if (!ok) return false;
    }
    Select.cancelHandleDrag();
    Select.clear();
    Prompts.close();
    if (Render.comparing()) Compare.exit();
    const s = defaultState();
    s.name = uniqueName0('Untitled');
    keepProject(s);
    Store.replace(s);
    link(null, s);
    if (Render.ready()) Render.setView('axon', true);       // always Axon, whatever view was on screen
    Toast.show('New design started.');
    return true;
  }

  function save() {
    const state = Store.snapshot();
    const known = currentId && storage.get(currentId);
    if (known) {
      storage.update(currentId, state, state.name);
      link(currentId, state);
      Toast.show(`Saved ${quoted(state.name)}`);
    } else {
      const name = uniqueName0(state.name);
      if (name !== state.name) Store.set('name', name, { live: false });
      const id = storage.save(Store.snapshot(), name);
      link(id);
      Toast.show(`Saved ${quoted(name)}`);
    }
    return currentId;
  }
  const uniqueName0 = (name, extra = []) => StorageMod.uniqueName(name, [...savedNames(), ...extra]);

  function duplicate() {
    const base = Store.snapshot();
    const name = uniqueName0(base.name, [base.name]);
    Store.set('name', name, { live: false });
    const id = storage.save(Store.snapshot(), name);
    link(id);
    Toast.show(`Saved a copy as ${quoted(name)}`);
    return id;
  }

  function rename(next) {
    const name = String(next || '').trim().slice(0, 60) || 'Option A';
    Store.set('name', name, { live: false });
    if (currentId && storage.get(currentId)) storage.rename(currentId, name);
    const field = document.getElementById('optionName');
    if (field) field.value = Store.get('name');
    syncDirty();
  }

  async function remove() {
    const rec = currentId && storage.get(currentId);
    if (!rec) { Toast.show('This option is not saved, so there is nothing to delete.', 'warn'); return false; }
    const ok = await confirmDialog(`Delete ${quoted(rec.name)} from the saved options? The design on screen stays open.`, 'Delete', true);
    if (!ok) return false;
    storage.remove(rec.id);
    link(null);
    Toast.show(`Deleted ${quoted(rec.name)}. The design on screen is now unsaved.`);
    return true;
  }

  const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
  const importListeners = [];
  function exportJson() {
    const n = storage.list().length, np = storage.listPrompts().length;
    if (!n && !np) { Toast.show('Nothing to export yet. Save an option first.', 'warn'); return false; }
    storage.downloadExport();
    Toast.show(`Exported ${[n ? plural(n, 'option') : '', np ? plural(np, 'custom prompt') : ''].filter(Boolean).join(' and ')}`);
    return true;
  }
  async function importFile(file) {
    try {
      const { added, skipped, promptsAdded } = await storage.importFile(file);
      const parts = [added || !promptsAdded ? plural(added, 'option') : '', promptsAdded ? plural(promptsAdded, 'custom prompt') : ''].filter(Boolean);
      Toast.show(`Imported ${parts.join(' and ')}${skipped ? `, ${skipped} skipped` : ''}.${added ? ' Open the options from the Option menu.' : ''}`);
      importListeners.forEach((fn) => fn({ added, skipped, promptsAdded }));
      return { added, skipped, promptsAdded };
    } catch (e) {
      Toast.show(e && e.message ? e.message : 'The file could not be imported.', 'bad', 7000);
      return { added: 0, skipped: 0, error: String(e && e.message) };
    }
  }

  const when = (t) => { try { return new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); } catch (e) { return ''; } };
  function openMenu(anchor) {
    const el = h('div', { role: 'menu', id: 'optionMenu' });
    const item = (title, sub, onclick, o = {}) => h('button', { class: 'pop-item', type: 'button', role: 'menuitem', id: o.id, disabled: o.disabled, onclick: () => { if (!o.keep) Pop.close(); onclick(); } },
      h('span', { class: 'tick' }, o.tick ? '✓' : ''), h('span', { class: 'grow' }, title, sub ? h('small', null, sub) : null));

    // The option name is edited here. It is committed when the field changes or the menu closes.
    const nameField = h('input', { class: 'pop-name', id: 'optionName', type: 'text', maxlength: '60', spellcheck: 'false', autocomplete: 'off', 'aria-label': 'Option name', value: Store.get('name') || '' });
    const commitName = () => { if (nameField.value.trim() !== (Store.get('name') || '')) rename(nameField.value); };
    nameField.addEventListener('change', commitName);
    nameField.addEventListener('keydown', (e) => { if (e.key === 'Enter') { commitName(); Pop.close(); } });
    el.append(
      item('New design', 'Start fresh from the default bar', () => { newDesign(); }, { id: 'miNewDesign' }),
      h('div', { class: 'pop-sep' }),
    );
    el.append(h('div', { class: 'label pop-label' }, 'Option name'), h('div', { style: 'padding:0 6px 4px' }, nameField));

    el.append(h('div', { class: 'label pop-label' }, 'This option'));
    el.append(
      item('Save', 'Keep the design as it is now', save, { id: 'miSave' }),
      item('Duplicate', 'Save a copy as a new option', duplicate, { id: 'miDuplicate' }),
      item('Rename', 'Edit the name above', () => { nameField.focus(); nameField.select(); }, { id: 'miRename', keep: true }),
      item('Delete', 'Remove it from the saved options', remove, { id: 'miDelete', disabled: !currentId }),
      item(Compare.isActive() ? 'Exit compare' : 'Compare', 'Compare 2 to 4 options side by side', () => Compare.toggle(), { id: 'miCompare' }),
    );
    el.append(h('div', { class: 'pop-sep' }), h('div', { class: 'label pop-label' }, 'Saved options'));
    const saved = storage.list();
    if (!saved.length) el.append(h('div', { class: 'pop-note' }, 'Nothing saved yet. Use Save to keep this design.'));
    for (const o of saved) el.append(item(o.name, `Saved ${when(o.updatedAt)}`, () => loadOption(o.id), { tick: o.id === currentId }));
    el.append(h('div', { class: 'pop-sep' }), h('div', { class: 'label pop-label' }, 'New from a preset'));
    for (const p of CONFIG.presets) el.append(item(p.name, p.description, () => loadPreset(p.id), { id: `preset-${p.id}` }));
    Pop.open(anchor, el, { onClose: commitName });
  }

  function init({ restore = true } = {}) {
    if (restore) {
      const saved = storage.loadAutosave();
      if (saved) {
        const s = fillDefaults(saved);
        Store.replace(s, { resetHistory: true });
        const rec = uiPrefs.currentId && storage.get(uiPrefs.currentId);
        if (rec) link(rec.id, fillDefaults(rec.state)); else link(null);
      } else link(null);
    } else link(null);
    Store.subscribe((s, info) => {
      if (!autosaveHeld) storage.autosave(s);
      if (!info || !info.live) { clearTimeout(dirtyTimer); dirtyTimer = setTimeout(syncDirty, 250); }
    });
    const input = document.getElementById('importFile');
    input.addEventListener('change', async () => {
      const file = input.files && input.files[0];
      input.value = '';
      if (file) await importFile(file);
    });
  }

  return {
    onImport: (fn) => importListeners.push(fn),
    holdAutosave: (v) => { autosaveHeld = !!v; },
    init, save, duplicate, rename, remove, openMenu, loadOption, loadPreset, newDesign, hasUnsavedChanges, exportJson, importFile, syncDirty,
    list: () => storage.list(), get: (id) => storage.get(id), flush: () => storage.flush(),
    current: () => currentId, storage,
  };
})();

/* ==========================================================================
   PROJECT FILE  (docs/project-file-spec.md, sections 8 and 10; plan section 7)
   `ProjectUI` is the glue between the page and src/shared/project.js (ProjectMod).
   With ?project=<id> the page opens that project, loads its "massing" section when the Mid-Rise Generator wrote it,
   and writes that section back after every change (1 s debounce, and on visibilitychange / pagehide).
   Without a project nothing here runs until the Project menu or a Send item is used.
   ProjectMod.writeSection returns a new project and does not change the one it gets. So a save loads the project
   fresh from storage, writes the section on that copy and saves it (another tool may have saved from a second tab).
   Every storage call is inside try/catch. Tests inject storage, navigation and the address bar with configure().
   ========================================================================== */
const ProjectUI = (() => {
  const $ = (id) => document.getElementById(id);
  const ZERO = () => ({ x: 0, y: 0, rotation: 0, baseZ: 0 });
  const READ_ONLY_TEXT = 'This project was saved by a newer version of this tool. You can view it, but changes will not be saved.';
  const NO_STORAGE_TEXT = 'Saving is unavailable in this browser, so the project is kept only until you close this page.';
  const MAX_CONTEXT = 300;
  const project = {
    doc: null, timer: 0, dirty: false, readOnly: false, loading: false, noted: {},
    replaceNeeded: false, confirmed: false, asking: false, renamed: null,
    storage: null,
    navigate: (url) => { window.location.assign(url); },
    updateUrl: (id) => {
      try {
        const u = new URL(window.location.href);
        if (id) u.searchParams.set('project', id); else u.searchParams.delete('project');
        window.history.replaceState(null, '', u.pathname + u.search + u.hash);
      } catch (e) { /* the address bar is a convenience */ }
    },
  };
  const DEFAULT_NAV = project.navigate, DEFAULT_URL = project.updateUrl;
  const isObjP = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);

  function storageOf() {
    if (project.storage) return project.storage;
    try { return window.localStorage; } catch (e) { return null; }
  }
  function noticeOnce(key, message, kind = 'warn', ms = 9000) {
    if (project.noted[key]) return;
    project.noted[key] = true;
    Toast.show(message, kind, ms);
  }
  const storageNotice = () => ({ onNotice: (message) => noticeOnce(`storage:${message}`, String(message)) });

  /* ---- reading the project ------------------------------------------------------------------ */
  const has = () => !!project.doc;
  function sectionOf(key) {
    if (!project.doc) return null;
    try { return ProjectMod.getSection(project.doc, key); } catch (e) { return null; }
  }
  const placement = () => {
    const p = Store.raw().placement;
    return isObjP(p) ? { x: num(p.x, 0), y: num(p.y, 0), rotation: num(p.rotation, 0), baseZ: num(p.baseZ, 0) } : ZERO();
  };

  /** The site of the project: { size, boundary (project frame), center, ground } or null. */
  function siteInfo() {
    const sec = sectionOf('site');
    if (!sec || !isObjP(sec.derived)) return null;
    const dv = sec.derived, frame = (project.doc && project.doc.frame) || {};
    const S = num(dv.size, num(frame.size, 0));
    let boundary = Array.isArray(dv.boundary) && dv.boundary.length >= 3 ? dv.boundary : null;
    if (!boundary && S > 0) boundary = [[0, 0], [S, 0], [S, S], [0, S]];
    if (!boundary) return null;
    let ring = boundary;
    try { ring = ProjectMod.transformRing(sec, boundary, 'toProject'); } catch (e) { ring = boundary; }
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const q of ring) { minX = Math.min(minX, q[0]); maxX = Math.max(maxX, q[0]); minY = Math.min(minY, q[1]); maxY = Math.max(maxY, q[1]); }
    return { size: S, boundary: ring, center: [(minX + maxX) / 2, (minY + maxY) / 2], ground: isObjP(dv.ground) ? dv.ground : null, updatedAt: sec.updatedAt || '' };
  }
  const hasSite = () => !!siteInfo();

  /** The ground elevation (project frame, ft) at a project point: bilinear on the site grid. null without a grid. */
  function groundAt(xp, yp) {
    const info = siteInfo();
    const g = info && info.ground;
    if (!g || !Array.isArray(g.points) || !(g.n >= 2) || !(g.spacing > 0) || g.points.length !== g.n * g.n) return null;
    const x0 = g.points[0][0], y0 = g.points[0][1];
    const fi = clamp((xp - x0) / g.spacing, 0, g.n - 1), fj = clamp((yp - y0) / g.spacing, 0, g.n - 1);
    const i = Math.min(Math.floor(fi), g.n - 2), j = Math.min(Math.floor(fj), g.n - 2);
    const tx = fi - i, ty = fj - j;
    const z = (a, b) => g.points[b * g.n + a][2];
    return z(i, j) * (1 - tx) * (1 - ty) + z(i + 1, j) * tx * (1 - ty) + z(i, j + 1) * (1 - tx) * ty + z(i + 1, j + 1) * tx * ty;
  }

  /** The site boundary in the building's own (local) frame, for the renderer. null without a site. */
  let bCache = { key: null, ring: null };
  function boundaryKey() {
    if (!project.doc) return '';
    const info = siteInfo();
    if (!info) return 'none';
    return `${info.updatedAt}|${JSON.stringify(placement())}`;
  }
  function boundaryLocal() {
    const key = boundaryKey();
    if (!key || key === 'none') return null;
    if (bCache.key === key) return bCache.ring;
    let ring = null;
    try { ring = ProjectMod.transformRing(placement(), siteInfo().boundary, 'toLocal'); } catch (e) { ring = null; }
    bCache = { key, ring };
    return ring;
  }

  /* ---- placement and context ----------------------------------------------------------------- */
  /** Puts the building at the site center, with its floor at the ground there. One undo step. */
  function centerOnSite({ quiet = false } = {}) {
    const info = siteInfo();
    if (!info) { if (!quiet) Toast.show('This project has no site yet. Send a site from the Site Model first.', 'warn'); return false; }
    const z = groundAt(info.center[0], info.center[1]);
    const next = { x: Math.round(info.center[0] * 100) / 100, y: Math.round(info.center[1] * 100) / 100, rotation: placement().rotation, baseZ: z == null ? placement().baseZ : Math.round(z * 10) / 10 };
    Store.set('placement', next, { live: false });
    if (!quiet) Toast.show(z == null ? 'Centered on the site.' : `Centered on the site. Floor at ${Units.formatFeetInches(next.baseZ)} above sea level.`);
    return true;
  }
  /** The site buildings near the building become context blocks (fromSite = true). One undo step. Returns the count, or -1. */
  function contextFromSite(radius, { quiet = false, merge = false } = {}) {
    if (!project.doc) { if (!quiet) Toast.show('Open a project first.', 'warn'); return -1; }
    if (!hasSite()) { if (!quiet) Toast.show('This project has no site, so there are no neighbors to load.', 'warn'); return -1; }
    const r = Number.isFinite(radius) && radius > 0 ? radius : num(Store.get('context.radius'), CONFIG.contextRadius);
    let res;
    try { res = ProjectMod.siteContextFor(project.doc, placement(), r); } catch (e) { console.error(e); Toast.show('The neighbors could not be read from the site.', 'bad'); return -1; }
    let blocks = res.blocks.map((b) => ({ x: b.x, y: b.y, w: b.w, d: b.d, h: b.h, base: b.base }));
    let trimmed = 0;
    if (blocks.length > MAX_CONTEXT) {
      blocks.sort((a, b) => Math.hypot(a.x, a.y) - Math.hypot(b.x, b.y));
      trimmed = blocks.length - MAX_CONTEXT;
      blocks = blocks.slice(0, MAX_CONTEXT);
    }
    const cur = Store.raw().context;
    Store.set('context', { ...deepClone(cur), blocks, fromSite: true, show: true, radius: r }, { live: false, merge });
    if (!quiet) Toast.show(blocks.length ? `Loaded ${blocks.length} neighbor${blocks.length === 1 ? '' : 's'} within ${Units.formatFeetInches(r)}.${trimmed ? ` ${trimmed} farther ones were left out.` : ''}` : `No site buildings within ${Units.formatFeetInches(r)}.`);
    return blocks.length;
  }

  /* ---- writing the project ---------------------------------------------------------------------- */
  function renderPill() {
    const doc = project.doc, pill = $('projPill');
    if (pill) {
      pill.hidden = !doc;
      if (doc) { pill.textContent = `${doc.name}${project.readOnly ? ' (read only)' : ''}`; pill.title = `Project: ${pill.textContent}`; }
    }
    const line = $('projLine');
    if (line && doc) {
      const info = siteInfo();
      line.textContent = `Project “${doc.name}”${project.readOnly ? ' (read only)' : ''}. ${info ? `Site: ${Units.formatFeetInches(info.size)} square.` : 'No site in this project.'}`;
    }
    const note = $('ctxSiteNote');
    if (note) {
      const n = (Store.raw().context.blocks || []).length;
      note.textContent = Store.raw().context.fromSite ? `${n} block${n === 1 ? '' : 's'} from the site.` : '';
    }
  }
  function openCheck(doc) {
    let sec = null;
    try { sec = ProjectMod.getSection(doc, 'massing'); } catch (e) { sec = null; }
    const newer = (sec && Number(sec.schema) > CONFIG.projectSchema) || Number(doc.version) > Number(ProjectMod.VERSION || 1);
    return { sec, newer };
  }

  function markDirty() {
    if (!project.doc || project.loading) return;
    project.dirty = true;
    clearTimeout(project.timer);
    project.timer = setTimeout(() => { flush(); }, CONFIG.projectSaveMs);
  }
  function saveFailureText(res) {
    if (!res) return NO_STORAGE_TEXT;
    return String(res.warning || 'The project could not be saved.');
  }
  async function askReplace() {
    if (project.asking) return false;
    project.asking = true;
    const ok = await confirmDialog('This project holds a massing from the Tower Generator. Saving here replaces it with this mid-rise design.', 'Replace the tower massing with this option');
    project.asking = false;
    if (ok) { project.confirmed = true; project.readOnly = false; renderPill(); flush(); return true; }
    project.readOnly = true;
    renderPill();
    Toast.show('The project keeps the tower massing. Changes here will not be saved to it.', 'warn', 8000);
    return false;
  }

  /** The "massing" section patch for the design on screen. */
  function sectionPatch() {
    const st = Store.snapshot();
    const d = Derived.get();
    const derived = MidDerivedMod.midriseDerived(st, d.built, d.metrics);
    const pl = placement();
    return { tool: CONFIG.tool, schema: CONFIG.projectSchema, placement: pl, state: { ...st, placement: pl }, derived, note: st.name };
  }
  /**
   * Writes the massing section and saves the project. Loads the project fresh from storage first, writes the section on that copy,
   * saves it. Returns saveProject's result, { ok: true, skipped: true } when there is nothing to do, or { ok: false }.
   */
  function flush() {
    clearTimeout(project.timer);
    project.timer = 0;
    const doc = project.doc;
    if (!doc || project.readOnly || !project.dirty) return { ok: true, skipped: true };
    if (project.replaceNeeded && !project.confirmed) { askReplace(); return { ok: true, skipped: true, asking: true }; }
    const opts = storageNotice();
    let patch;
    try { patch = sectionPatch(); } catch (e) {
      console.error(e);
      Toast.show(`The project could not be updated. ${e && e.message ? e.message : ''}`.trim(), 'bad', 8000);
      return { ok: false };
    }
    let base = doc;
    try { base = ProjectMod.loadProject(storageOf(), doc.id, opts) || doc; } catch (e) { base = doc; }
    let next = null;
    try { next = ProjectMod.writeSection(base, 'massing', patch); } catch (e) {
      if (e && e.readOnly) { project.readOnly = true; renderPill(); noticeOnce('readonly', e.message || READ_ONLY_TEXT); return { ok: false, readOnly: true }; }
      console.error(e);
      Toast.show(`The project could not be updated. ${e && e.message ? e.message : ''}`.trim(), 'bad', 8000);
      return { ok: false };
    }
    if (project.renamed) next.name = project.renamed;
    project.doc = next;
    let res = null;
    try { res = ProjectMod.saveProject(storageOf(), next, opts); } catch (e) { console.error(e); }
    if (!res || res.ok === false) {
      noticeOnce(`save:${(res && res.warning) || ''}`, saveFailureText(res), 'bad', 12000);
      return res || { ok: false };
    }
    project.dirty = false;
    project.renamed = null;
    if (res.warning) noticeOnce('warning', String(res.warning));
    renderPill();
    return res;
  }

  /* ---- opening, creating, closing -------------------------------------------------------------- */
  /** Makes `doc` the open project and loads its massing (or sets the placement for a design that has none). */
  function openDoc(doc, { startup = false } = {}) {
    if (project.doc && project.doc !== doc) flush();
    clearTimeout(project.timer);
    const { sec, newer } = openCheck(doc);
    Object.assign(project, { doc, timer: 0, dirty: false, readOnly: !!newer, replaceNeeded: false, confirmed: false, renamed: null });
    bCache = { key: null, ring: null };
    if (newer) noticeOnce('readonly', READ_ONLY_TEXT);
    project.loading = true;
    try {
      const mine = sec && sec.tool === CONFIG.tool && isObjP(sec.state) && Object.keys(sec.state).length;
      const tower = sec && sec.tool === 'tower' && isObjP(sec.state) && Object.keys(sec.state).length;
      if (mine) {
        const st = fillDefaults({ ...sec.state, placement: isObjP(sec.placement) ? sec.placement : ZERO() });
        Store.replace(st, { resetHistory: startup });
      } else {
        if (tower) project.replaceNeeded = true;
        const cur = deepClone(Store.raw());
        cur.placement = ZERO();
        if (!tower && hasSite()) {
          // a project with a site and no mid-rise yet: the building starts at the site center, with the real neighbors
          const info = siteInfo();
          const z = groundAt(info.center[0], info.center[1]);
          cur.placement = { x: Math.round(info.center[0] * 100) / 100, y: Math.round(info.center[1] * 100) / 100, rotation: 0, baseZ: z == null ? 0 : Math.round(z * 10) / 10 };
        } else if (tower && hasSite()) {
          const info = siteInfo();
          if (isObjP(sec.placement)) cur.placement = { x: num(sec.placement.x, 0), y: num(sec.placement.y, 0), rotation: num(sec.placement.rotation, 0), baseZ: num(sec.placement.baseZ, 0) };
          else cur.placement = { x: info.center[0], y: info.center[1], rotation: 0, baseZ: 0 };
        }
        if (!hasSite() && cur.context && cur.context.fromSite) cur.context.fromSite = false;
        Store.replace(fillDefaults(cur), { resetHistory: startup });
      }
    } finally { project.loading = false; }
    if (!sec || !(sec.tool === CONFIG.tool)) {
      if (hasSite() && !project.replaceNeeded && !project.readOnly) {
        project.loading = true;
        try { contextFromSite(undefined, { quiet: true }); } finally { project.loading = false; }
        markDirty();                                     // the new massing section is written (a tower project waits for the question)
      } else if (!project.replaceNeeded && !project.readOnly) markDirty();
    }
    renderPill();
    if (Render.ready()) Render.setView(Render.info().preset || 'axon', true);
    return doc;
  }
  /** Forgets the open project (the saved copy stays where it is). */
  function close() {
    flush();
    clearTimeout(project.timer);
    Object.assign(project, { doc: null, timer: 0, dirty: false, readOnly: false, replaceNeeded: false, confirmed: false, renamed: null });
    bCache = { key: null, ring: null };
    project.loading = true;
    try {
      const cur = deepClone(Store.raw());
      cur.placement = null;
      if (cur.context) cur.context.fromSite = false;
      Store.replace(cur);
    } finally { project.loading = false; }
    project.updateUrl(null);
    renderPill();
  }
  const defaultName = () => (String(Store.get('name') || '').trim() || 'New project').slice(0, 80);
  /** New project (a local frame, no site) holding the design on screen. Returns the doc or null. */
  function create(name, { quiet = false } = {}) {
    flush();
    const title = String(name || '').trim().slice(0, 80) || defaultName();
    let doc;
    try { doc = ProjectMod.newProject({ name: title }); } catch (e) {
      console.error(e);
      Toast.show(`The project could not be made. ${e && e.message ? e.message : ''}`.trim(), 'bad', 8000);
      return null;
    }
    Object.assign(project, { doc, timer: 0, dirty: true, readOnly: false, replaceNeeded: false, confirmed: false, renamed: null });
    bCache = { key: null, ring: null };
    project.loading = true;
    try { Store.set('placement', ZERO(), { live: false }); } finally { project.loading = false; }
    const saved = flush();
    project.updateUrl(doc.id);
    renderPill();
    if (!quiet && saved && saved.ok !== false) Toast.show(`Project ${project.doc.name} created.`);
    return project.doc;
  }
  function rename(name) {
    const next = String(name || '').trim().slice(0, 80);
    if (!project.doc || !next || next === project.doc.name) return false;
    project.doc = { ...project.doc, name: next };
    project.renamed = next;
    project.dirty = true;
    renderPill();
    markDirty();
    return true;
  }

  /** Send: the project holds this massing (a project is made now when none is open), then the next tool opens with ?project=<id>. */
  async function send(toolId) {
    Pop.close();
    if (!['plate', 'parking', 'facade', 'grading'].includes(toolId)) return false;
    if (!project.doc && !create(defaultName(), { quiet: true })) return false;
    if (project.readOnly && !(project.replaceNeeded && !project.confirmed)) { noticeOnce('readonly', READ_ONLY_TEXT); return false; }
    if (project.replaceNeeded && !project.confirmed) { const ok = await askReplace(); if (!ok) return false; }
    project.dirty = true;
    const saved = flush();
    if (saved && saved.ok === false) return false;
    let url = null;
    try { url = ProjectMod.sendTo(storageOf(), project.doc, toolId, CONFIG.tool, storageNotice()); } catch (e) {
      console.error(e);
      Toast.show(`The project could not be sent. ${e && e.message ? e.message : ''}`.trim(), 'bad', 8000);
      return false;
    }
    if (!url) { Toast.show('The project could not be sent.', 'bad', 8000); return false; }
    try { project.doc = ProjectMod.loadProject(storageOf(), project.doc.id, storageNotice()) || project.doc; } catch (e) { /* keep the copy in memory */ }
    project.dirty = false;
    project.navigate(url);
    return url;
  }
  function openById(id) { flush(); project.navigate(`${location.pathname}?project=${encodeURIComponent(id)}`); }
  async function exportFile() {
    const doc = project.doc;
    if (!doc) return false;
    project.dirty = true;
    flush();
    try {
      const { filename, blob } = ProjectMod.exportProject(project.doc);
      const res = await ShotMod.deliverImage(blob, filename);
      if (res === 'downloaded') Toast.show(`Saved ${filename}`);
      return filename;
    } catch (e) { console.error(e); Toast.show(`The project file could not be made. ${e && e.message ? e.message : ''}`.trim(), 'bad', 6000); return false; }
  }
  async function importFile(file) {
    flush();
    try {
      const res = await ProjectMod.importProject(file, storageOf(), storageNotice());
      const doc = res && res.doc;
      if (!doc) throw new Error('The file could not be read.');
      openDoc(doc);
      project.updateUrl(doc.id);
      Toast.show(res.renamed ? `Imported as ${doc.name}.` : `Imported ${doc.name}.`);
      if (res.warning) noticeOnce('warning', String(res.warning));
      return doc;
    } catch (e) { console.error(e); Toast.show(e && e.message ? e.message : 'The file could not be imported.', 'bad', 8000); return null; }
  }

  /* ---- Project menu -------------------------------------------------------------------------------- */
  const whenText = (t) => { try { const d = new Date(t); return Number.isNaN(d.getTime()) ? '' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); } catch (e) { return ''; } };
  const bytesText = (b) => (Number.isFinite(b) && b > 0 ? (b >= 1048576 ? `${(b / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(b / 1024))} KB`) : '');
  function openMenu(anchor) {
    const el = h('div', { role: 'menu', id: 'projectMenu' });
    const item = (key, title, sub, onclick, o = {}) => h('button', { class: 'pop-item', type: 'button', role: 'menuitem', 'data-proj': key, 'data-project-id': o.id, disabled: o.disabled, onclick: () => { if (!o.keep) Pop.close(); onclick(); } },
      h('span', { class: 'grow' }, title, sub ? h('small', null, sub) : null));
    const nameField = h('input', { class: 'pop-name', id: 'projName', type: 'text', maxlength: '80', spellcheck: 'false', autocomplete: 'off', autocapitalize: 'off', enterkeyhint: 'done', 'aria-label': 'Project name', placeholder: 'Project name', value: defaultName() });
    const doCreate = () => { Pop.close(); create(nameField.value); };
    nameField.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); doCreate(); } });
    const newRow = item('new', 'New project', 'Save this design in a new project (no site)', () => { newRow.hidden = true; form.hidden = false; nameField.focus(); nameField.select(); }, { keep: true });
    const form = h('div', { class: 'proj-new', id: 'projNewForm', hidden: true }, nameField,
      h('div', { class: 'pop-actions' },
        h('button', { class: 'btn outline', type: 'button', id: 'projCancel', onclick: () => { form.hidden = true; newRow.hidden = false; } }, 'Cancel'),
        h('button', { class: 'btn solid', type: 'button', id: 'projCreate', onclick: doCreate }, 'Create')));
    el.append(newRow, form);
    if (project.replaceNeeded && !project.confirmed) {
      el.append(item('replace', 'Replace the tower massing with this option', 'The project keeps the tower massing until you do', () => { project.confirmed = true; project.readOnly = false; project.dirty = true; renderPill(); flush(); }));
    }
    el.append(h('div', { class: 'pop-sep' }), h('div', { class: 'label pop-label' }, 'Open'));
    let list = [];
    try { list = ProjectMod.listProjects(storageOf(), storageNotice()) || []; } catch (e) { console.error(e); noticeOnce('storage', NO_STORAGE_TEXT); }
    if (!list.length) el.append(h('div', { class: 'pop-note' }, 'No saved projects yet.'));
    for (const p of list.slice(0, CONFIG.projectListMax)) {
      const here = !!project.doc && p.id === project.doc.id;
      el.append(item('open', p.name, [here ? 'Open now' : whenText(p.updatedAt), bytesText(p.bytes)].filter(Boolean).join(' · '), () => openById(p.id), { id: p.id, disabled: here }));
    }
    if (list.length > CONFIG.projectListMax) el.append(item('all', 'All projects', `${list.length - CONFIG.projectListMax} more on the Workspace page`, () => { flush(); project.navigate('../'); }));
    el.append(h('div', { class: 'pop-sep' }),
      item('import', 'Import', 'Add a project file (.cmrlm.json)', () => $('projFile').click()),
      item('export', 'Export', project.doc ? `Download ${project.doc.name} as a file` : 'Open or create a project first', exportFile, { disabled: !project.doc }),
      item('close', 'Close project', project.doc ? 'Keep working without a project' : 'No project is open', close, { disabled: !project.doc }));
    Pop.open(anchor, el);
  }

  /** The project name field for the Site tab. */
  function nameControl() {
    const input = h('input', { class: 'pop-name', id: 'projNameField', type: 'text', maxlength: '80', spellcheck: 'false', autocomplete: 'off', 'aria-label': 'Project name' });
    input.addEventListener('change', () => { rename(input.value); });
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
    const refresh = () => { if (document.activeElement !== input) input.value = project.doc ? project.doc.name : ''; };
    Store.subscribe(refresh);
    return { el: h('div', { class: 'ctl text-row' }, h('label', { class: 'ctl-label', for: 'projNameField' }, 'Project name'), input), refresh };
  }

  /* ---- start ------------------------------------------------------------------------------------------ */
  let wired = false;
  function wire() {
    if (wired) return;
    wired = true;
    Store.subscribe((s, info) => {
      if (project.doc && !project.loading && info && !info.live) {
        const path = String(info.path || '');
        // placement or radius changes keep site neighbors in step
        if (s.context && s.context.fromSite && (path === 'context.radius' || path.startsWith('placement'))) {
          project.loading = true;
          try { contextFromSite(undefined, { quiet: true, merge: true }); } finally { project.loading = false; }
        }
      }
      if (project.doc && !project.loading && (!info || !info.live)) markDirty();
      renderPill();
    });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
    window.addEventListener('pagehide', () => { flush(); });
    const file = $('projFile');
    if (file) file.addEventListener('change', async () => {
      const f = file.files && file.files[0];
      file.value = '';
      if (f) await importFile(f);
    });
  }
  /** On start: with ?project=<id> open that project. Without one, a placement left over from an earlier project is cleared. Returns true when a project was opened. */
  function start() {
    wire();
    let id = null;
    try { id = ProjectMod.projectIdFromUrl(location); } catch (e) { id = null; }
    if (!id) {
      const cur = Store.raw();
      if (cur.placement || (cur.context && cur.context.fromSite)) {
        const next = deepClone(cur);
        next.placement = null;
        if (next.context) next.context.fromSite = false;
        Store.replace(next, { resetHistory: true });
      }
      renderPill();
      return false;
    }
    let doc = null, told = false;
    try { doc = ProjectMod.loadProject(storageOf(), id, { onNotice: (message) => { told = true; noticeOnce(`storage:${message}`, String(message)); } }); } catch (e) { console.error(e); }
    if (!doc) {
      if (!told) Toast.show('That project could not be opened. It may have been deleted, or it was saved in another browser.', 'warn', 9000);
      return false;
    }
    openDoc(doc, { startup: true });
    return true;
  }

  return {
    has, hasSite, siteInfo, groundAt, boundaryKey, boundaryLocal, placement,
    start, openDoc, close, create, rename, flush, send, openMenu, exportFile, importFile, nameControl,
    centerOnSite, contextFromSite, markDirty, askReplace, renderPill,
    doc: () => project.doc,
    status: () => ({ open: !!project.doc, id: project.doc && project.doc.id, name: project.doc && project.doc.name, dirty: project.dirty, readOnly: project.readOnly, replaceNeeded: project.replaceNeeded, confirmed: project.confirmed }),
    // tests: inject storage, navigation and the address bar
    configure: (o) => { Object.assign(project, o || {}); },
    restoreDefaults: () => { Object.assign(project, { storage: null, navigate: DEFAULT_NAV, updateUrl: DEFAULT_URL }); },
    reset: () => { clearTimeout(project.timer); Object.assign(project, { doc: null, timer: 0, dirty: false, readOnly: false, loading: false, noted: {}, replaceNeeded: false, confirmed: false, asking: false, renamed: null }); bCache = { key: null, ring: null }; renderPill(); },
  };
})();

/* ==========================================================================
   SHARED: screenshot
   src/shared/screenshot.js (inlined with the other modules),
   plus `Shots`: the image actions and the overlay choices (shown in the Export menu's
   "Image overlay" view). The choices are kept in state.view.shot.
   ========================================================================== */
const Shots = (() => {
  const SHOT_ITEMS = [
    ['title', 'Option name'], ['date', 'Date'], ['metrics', 'Key metrics'], ['mark', 'CMRLM mark'],
  ];
  const prefersDark = () => !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);

  /** The key metrics on the picture: units, density, parking ratio, height, GFA and FAR. */
  function keyMetrics(d) {
    const m = d.metrics;
    return [
      ['Units', Units.formatInt(m.units)],
      ['Density', `${Units.formatRatio(m.density, 1)} /ac`],
      ['Parking', `${Units.formatRatio(m.parking.ratioProvided, 2)} /unit`],
      ['Height', Units.formatFeetInches(m.height)],
      ['GFA', Units.formatArea(m.gfa)],
      ['FAR', Units.formatRatio(m.far)],
    ];
  }

  function buildOverlay() {
    const state = Store.raw(), o = state.view.shot || {};
    const overlay = { theme: prefersDark() ? 'dark' : 'light' };
    const comparing = Render.comparing();
    if (o.title) overlay.title = comparing ? Compare.names().join('  |  ') : state.name;
    if (o.date) overlay.date = true;
    if (o.metrics && !comparing) overlay.metrics = keyMetrics(Derived.get());
    if (o.mark) overlay.mark = 'CMRLM';
    return overlay;
  }

  /** Renders the picture. With deliver = true it also downloads it (or opens the share sheet on an iPad). */
  async function capture({ deliver = false, scale = 2 } = {}) {
    const blob = await Render.capture(buildOverlay(), scale);
    if (deliver) {
      const name = Render.comparing() ? `${Store.get('name')}-compare` : Store.get('name');
      const result = await ShotMod.deliverImage(blob, ShotMod.screenshotFilename(name));
      if (result === 'downloaded') Toast.show('Image saved to your downloads.');
    }
    return blob;
  }
  async function take() {
    try { return await capture({ deliver: true }); } catch (e) { console.error(e); Toast.show(e && e.message ? e.message : 'The image could not be made.', 'bad', 6000); return null; }
  }

  /** The AI-ready picture: no overlay, grid, scale figure or wireframe; Model style; light plain sky. Filename `<option>-ai-ready-YYYY-MM-DD.png`. */
  async function aiReady({ deliver = true, scale = 2 } = {}) {
    const blob = await Render.captureClean(scale);
    if (deliver) {
      const result = await ShotMod.deliverImage(blob, ShotMod.screenshotFilename(`${Store.get('name')}-ai-ready`));
      if (result === 'downloaded') Toast.show('AI-ready image saved to your downloads.');
    }
    return blob;
  }
  async function takeAiReady() {
    try { return await aiReady({ deliver: true }); } catch (e) { console.error(e); Toast.show(e && e.message ? e.message : 'The image could not be made.', 'bad', 6000); return null; }
  }

  /** The overlay choices as menu elements (a label and one switch per item). Used by the Export menu's "Image overlay" view. */
  function overlayControls() {
    const out = [h('div', { class: 'label pop-label' }, 'The image shows')];
    for (const [key, text] of SHOT_ITEMS) {
      const btn = h('button', { class: 'toggle-row', type: 'button', role: 'switch', 'aria-checked': String(!!Store.get(`view.shot.${key}`)), 'data-shot': key, style: 'padding:0 8px' },
        h('span', null, text), h('span', { class: 'switch', 'aria-hidden': 'true' }));
      btn.addEventListener('click', () => {
        const next = !Store.get(`view.shot.${key}`);
        Store.set(`view.shot.${key}`, next, { live: false });
        btn.setAttribute('aria-checked', String(next));
      });
      out.push(btn);
    }
    return out;
  }

  return { take, capture, aiReady, takeAiReady, overlayControls, buildOverlay, keyMetrics };
})();

/* ==========================================================================
   COMPARE
   Choose 2 to 4 options. One renderer draws each option in its own part of
   the screen (setViewport / setScissor, see Render.enterCompare), one camera
   control moves them all, and a table under the views lists the metrics with
   the best value in each ranked row in bold.
   ========================================================================== */
const Compare = (() => {
  const CURRENT = '__current';
  const MIN = 2, MAX = 4;
  const $ = (id) => document.getElementById(id);
  let active = false, chosen = [], entries = [], version = 0, refreshTimer = null, ro = null;

  const RULE = 'Bold marks the best value in a row. Higher is better for units, density, GFA, FAR and efficiency, and for parking provided. Other rows are not ranked.';
  const pct = (v) => `${(v * 100).toFixed(1)}%`;
  const ROWS = [
    { label: 'Units', get: (e) => e.d.metrics.units, fmt: Units.formatInt, higher: true },
    { label: 'Density (per acre)', get: (e) => e.d.metrics.density, fmt: (v) => Units.formatRatio(v, 1), higher: true },
    { label: 'Parking provided', get: (e) => e.d.metrics.parking.provided, fmt: Units.formatInt, higher: true },
    { label: 'Parking required', get: (e) => e.d.metrics.parking.required, fmt: Units.formatInt },
    { label: 'Parking ratio (per unit)', get: (e) => e.d.metrics.parking.ratioProvided, fmt: (v) => Units.formatRatio(v, 2) },
    { label: 'GFA', get: (e) => e.d.metrics.gfa, fmt: Units.formatArea, higher: true },
    { label: 'FAR', get: (e) => e.d.metrics.far, fmt: (v) => Units.formatRatio(v, 2), higher: true },
    { label: 'Height', get: (e) => e.d.metrics.height, fmt: Units.formatFeetInches },
    { label: 'Floors', get: (e) => e.d.metrics.floors, fmt: Units.formatInt },
    { label: 'Site coverage', get: (e) => e.d.metrics.siteCoverage, fmt: pct },
    { label: 'Efficiency (est.)', get: (e) => e.d.metrics.efficiency, fmt: pct, higher: true },
    { label: 'Warnings', get: (e) => e.d.warnings.length, fmt: Units.formatInt },
  ];

  /** Everything that can be compared: the design on screen (if it differs from its saved copy) and the saved options. */
  function candidates() {
    const list = [];
    if (Options.syncDirty()) list.push({ key: CURRENT, name: `${Store.get('name')} (on screen)`, state: () => Store.snapshot() });
    for (const o of Options.list()) list.push({ key: o.id, name: o.name, state: () => o.state });
    return list;
  }

  function buildEntries() {
    const cands = candidates();
    entries = chosen.map((key) => cands.find((c) => c.key === key)).filter(Boolean).map((c) => {
      const state = fillDefaults(c.state());
      state.name = c.name;
      return { key: c.key, name: c.name, state, d: computeDerived(state), uid: `${c.key}#${version}` };
    });
  }

  function renderBar(cands) {
    const bar = $('cmpBar');
    bar.textContent = '';
    const chips = h('div', { class: 'chips', role: 'group', 'aria-label': 'Options to compare' });
    for (const c of cands) {
      const on = chosen.includes(c.key);
      const b = h('button', { class: 'chip', type: 'button', 'aria-pressed': String(on), 'data-key': c.key, title: on ? 'Click to remove from the comparison' : 'Click to add to the comparison' }, c.name);
      b.addEventListener('click', () => {
        if (on) { if (chosen.length <= MIN) { Toast.show(`Compare needs at least ${MIN} options.`, 'warn'); return; } select(chosen.filter((k) => k !== c.key)); }
        else { if (chosen.length >= MAX) { Toast.show(`Compare shows at most ${MAX} options.`, 'warn'); return; } select([...chosen, c.key]); }
      });
      chips.append(b);
    }
    bar.append(h('span', { class: 'label' }, 'Compare'), chips, h('button', { class: 'btn outline sm', type: 'button', onclick: () => exit() }, 'Close'));
  }

  function renderTable() {
    const t = $('cmpTable');
    const head = h('tr', null, h('th', { title: RULE }, 'Metric'), entries.map((e) => h('th', { title: e.name }, e.name)));
    const body = ROWS.map((row) => {
      const vals = entries.map((e) => row.get(e));
      const nums = vals.filter((v) => typeof v === 'number' && isFinite(v));
      const best = row.higher && nums.length ? Math.max(...nums) : null;
      const allSame = nums.length > 0 && nums.every((v) => Math.abs(v - nums[0]) < 1e-9);
      return h('tr', null,
        h('td', { title: row.higher ? RULE : null }, row.label),
        vals.map((v) => {
          const isBest = best !== null && !allSame && typeof v === 'number' && Math.abs(v - best) < 1e-9;
          return h('td', { class: isBest ? 'best' : null }, v == null ? '—' : row.fmt(v));
        }));
    });
    t.replaceChildren(h('table', { class: 'cmp' }, h('thead', null, head), h('tbody', null, body)));
  }

  function positionLabels() {
    const host = $('cmpLabels');
    host.textContent = '';
    if (!active) return;
    const cells = Render.cells();
    entries.forEach((e, i) => {
      const c = cells[i];
      if (!c) return;
      host.append(h('div', { class: 'cmp-label', style: `left:${Math.round(c.x + 8)}px;top:${Math.round(c.y + 8)}px;max-width:${Math.max(60, Math.round(c.w - 16))}px` }, e.name));
    });
  }

  const reserve = () => {
    const bar = $('cmpBar'), table = $('cmpTable');
    return { top: bar.offsetTop + bar.offsetHeight + 6, bottom: table.offsetHeight };
  };
  function layoutChanged() {
    $('viewport').style.setProperty('--cmp-table-h', `${$('cmpTable').offsetHeight}px`);
    Render.refreshInsets(false);
    Render.relayout();
    positionLabels();
  }

  function apply(wasActive = false) {
    version++;
    buildEntries();
    renderBar(candidates());
    renderTable();
    Render.enterCompare(entries.map((e) => ({ name: e.name, state: e.state, d: e.d, uid: e.uid })), reserve, { keepView: wasActive });
    layoutChanged();
    markComparing(true);
  }
  /** The Option button shows a highlight while comparing (the Compare item itself lives in the Option menu). */
  function markComparing(on) {
    const b = $('btnOption');
    if (!b) return;
    b.classList.toggle('is-on', on);
    b.dataset.comparing = on ? 'true' : 'false';
    b.title = on ? 'Comparing options. Open the menu to exit.' : 'Option: name, presets, save, compare';
  }
  function select(keys) {
    chosen = keys.slice(0, MAX);
    apply(true);
  }

  /** Start comparing. keys: option ids (or '__current'); default = the design on screen plus the newest saved one. */
  function enter(keys) {
    const cands = candidates();
    if (cands.length < MIN) {
      Toast.show('Compare needs at least 2 options. Save this design, use Duplicate, change the copy, then try again.', 'warn', 6000);
      return false;
    }
    chosen = (keys && keys.length ? keys : cands.slice(0, 2).map((c) => c.key)).filter((k) => cands.some((c) => c.key === k)).slice(0, MAX);
    if (chosen.length < MIN) chosen = cands.slice(0, 2).map((c) => c.key);
    active = true;
    $('compare').hidden = false;
    $('viewport').dataset.compare = 'true';
    if (!ro) { ro = new ResizeObserver(() => { if (active) layoutChanged(); }); ro.observe($('cmpTable')); ro.observe($('cmpBar')); Render.onResize(() => { if (active) positionLabels(); }); }
    apply();
    return true;
  }
  function exit() {
    if (!active) return;
    active = false; entries = []; chosen = [];
    clearTimeout(refreshTimer);
    Render.exitCompare();
    $('compare').hidden = true;
    $('viewport').dataset.compare = 'false';
    $('viewport').style.removeProperty('--cmp-table-h');
    $('cmpLabels').textContent = '';
    markComparing(false);
  }
  function toggle() { if (active) exit(); else enter(); }

  /** While comparing, edits to the design on screen refresh its column and its view. */
  function init() {
    Store.subscribe((s, info) => {
      if (!active || !chosen.includes(CURRENT) || (info && info.live)) return;
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(() => { if (active) apply(true); }, 200);
    });
  }

  return { toggle, enter, exit, init, names: () => entries.map((e) => e.name), isActive: () => active, chosen: () => chosen.slice(), table: () => $('cmpTable').innerText };
})();

/* ==========================================================================
   TESTS
   Calculation and export tests. Run by adding ?test to the address (plan section 9.2). They cover the shell helpers,
   the default design (100 units, 52 ft), every hand-calculated case in src/midrise/testcases.js through the integrated
   pipeline, every preset, every template, the envelope marks, the SketchUp document, the derived section, and the save /
   export / import round trip. The other test files (12b UI, 12c selection and handles, 12d project) run after this one;
   runAllTests (in 12d) merges the results. The result toast appears in ?test mode only.
   ========================================================================== */
const TestHelp = (() => {
  const eq = (a, b) => (JSON.stringify(a) === JSON.stringify(b) ? true : `got ${JSON.stringify(a)}, expected ${JSON.stringify(b)}`);
  const near = (a, b, tol = 1e-9) => (Math.abs(a - b) <= tol ? true : `got ${a}, expected ${b}`);
  const within = (a, b, pct) => (Math.abs(a - b) <= Math.abs(b) * pct / 100 + 1e-9 ? true : `got ${a}, expected ${b} (+/- ${pct}%)`);
  const make = () => {
    const results = [];
    const t = async (name, fn) => {
      let r;
      try { r = await fn(); } catch (e) { r = `threw ${e && e.message}`; }
      results.push({ name, ok: r === true, detail: r === true ? '' : String(r) });
    };
    return { results, t };
  };
  const $ = (id) => document.getElementById(id);
  const frames = (n = 2) => new Promise((res) => { const f = () => (--n <= 0 ? res() : requestAnimationFrame(f)); requestAnimationFrame(f); });
  const wait = (ms) => new Promise((res) => setTimeout(res, ms));
  const visible = (el) => !!el && el.getClientRects().length > 0 && getComputedStyle(el).visibility !== 'hidden';
  const snap = () => JSON.stringify(Store.snapshot());
  /** One undo returns the state from before the action, and one redo puts the result back (the undo stack is capped, so this is checked by behavior). */
  const oneStep = (before) => { Store.undo(); const back = snap() === before; Store.redo(); return back; };
  const toastText = () => [...document.querySelectorAll('#toasts .toast')].map((x) => x.textContent).join(' | ');
  const merged = (name, results) => {
    const bad = results.filter((r) => !r.ok);
    console.log(`[tests] ${name} ${results.length - bad.length}/${results.length} passed`, bad.length ? JSON.stringify(bad) : '');
  };
  return { eq, near, within, make, $, frames, wait, visible, snap, oneStep, toastText, merged };
})();

const ENVELOPE_CODES = ['bar-outside-site', 'bar-over-court', 'separation', 'sliver', 'bend', 'courtyard', 'podium-shape', 'screen-height'];

async function runTests() {
  const { eq, near, within, make } = TestHelp;
  const { results, t } = make();

  /* ---- shell helpers ---- */
  await t('formatFeetInches 312.5', () => eq(Units.formatFeetInches(312.5), `312'-6"`));
  await t('formatFeetInches 0', () => eq(Units.formatFeetInches(0), `0'-0"`));
  await t('formatArea 100000', () => eq(Units.formatArea(100000), '100,000 sf'));
  await t('parseLength 10\'-6"', () => near(Units.parseLength(`10'-6"`), 10.5));
  await t('parseLength 10-6 and bad input', () => eq([Units.parseLength('10-6'), isNaN(Units.parseLength('abc'))], [10.5, true]));
  await t('planToWorld north is -z', () => eq(planToWorld(3, 4, 5), [3, 5, -4]));
  await t('storage key and title', () => eq([CONFIG.storageKey, document.title], ['midrise.options.v1', 'Mid-Rise Generator']));

  /* ---- the default design ---- */
  await t('the default design: 100 units, 52 ft, 5 floors, 120 of 125 stalls', () => {
    const d = computeDerived(defaultState()), m = d.metrics;
    return eq([m.units, m.height, m.floors, m.parking.provided, m.parking.required, m.gfa], [100, 52, 5, 120, 125, 97500]);
  });
  await t('the default design shows one parking warning and no geometry warning', () => {
    const d = computeDerived(defaultState());
    return eq(d.warnings.map((w) => w.id), ['parking-deficit']);
  });
  await t('the parking warning can be turned off (view.warnParking)', () => {
    const s = defaultState(); s.view.warnParking = false;
    return eq(computeDerived(s).warnings.length, 0);
  });
  await t('the page is showing the default numbers (units 100, height 52 ft)', () => {
    if (!Render.ready() && !document.getElementById('mUnits')) return true;
    const s = defaultState();
    const saved = Store.snapshot();
    Store.replace(s);
    UI.updateHud(Derived.get());
    const out = [document.getElementById('mUnits').textContent, document.getElementById('mHeight').firstChild.nodeValue];
    Store.replace(saved);
    return eq(out, ['100', `52'-0"`]);
  });
  await t('floor cap per bar', () => {
    const s = fillDefaults({ bars: [{ ...defaultBar('A'), floors: 1000 }] });
    return eq(s.bars[0].floors, CONFIG.limits.maxFloors);
  });
  await t('fillDefaults fills a partial state and keeps bar ids unique', () => {
    const s = fillDefaults({ bars: [{ id: 'A' }, { id: 'A' }, {}] });
    return eq([s.bars.length, new Set(s.bars.map((b) => b.id)).size, s.bars[1].length], [3, 3, 300]);
  });
  await t('programs: unitFactor is a fraction or null', () => {
    const bad = Object.entries(defaultState().programs).filter(([, p]) => !(p.unitFactor === null || (p.unitFactor > 0 && p.unitFactor <= 1)));
    return bad.length === 0 || `bad: ${bad.map(([k]) => k)}`;
  });

  /* ---- hand-calculated cases (src/midrise/testcases.js) ---- */
  for (const tc of TestCasesMod.TEST_CASES) {
    await t(`case ${tc.id}: units, parking, GFA${tc.expect.unionArea ? ', union area' : ''}`, () => {
      const d = computeDerived(fillDefaults(tc.state)), m = d.metrics, e = tc.expect, tol = e.tolerancePct == null ? 0.5 : e.tolerancePct;
      const checks = [
        ['units', m.units, e.units], ['parkingRequired', m.parking.required, e.parkingRequired],
        ['parkingProvided', m.parking.provided, e.parkingProvided], ['gfa', m.gfa, e.gfa],
      ];
      if (e.unionArea) {
        const lv = d.built.levels.find((l) => l.zone === 'bar');
        checks.push(['unionArea', lv ? BarsMod.multiPolyArea(lv.plates) : NaN, e.unionArea]);
      }
      for (const [name, got, want] of checks) { const r = within(got, want, tol); if (r !== true) return `${name}: ${r}`; }
      return true;
    });
  }

  /* ---- presets ---- */
  await t('six presets exist with unique ids and names', () => {
    const ids = CONFIG.presets.map((p) => p.id), names = CONFIG.presets.map((p) => p.name);
    return eq([ids.length, new Set(ids).size, new Set(names).size], [6, 6, 6]);
  });
  for (const p of CONFIG.presets) {
    await t(`preset ${p.id} loads and builds with no geometry warning`, () => {
      const s = fillDefaults(p.state), d = computeDerived(s);
      const bad = d.warnings.filter((w) => ENVELOPE_CODES.includes(w.id));
      return (d.built.levels.length > 0 && d.metrics.units > 0 && bad.length === 0) || `levels ${d.built.levels.length} units ${d.metrics.units} warnings ${bad.map((w) => w.id)}`;
    });
  }
  await t('every preset passes through Options.loadPreset as one undo step', () => {
    const saved = Store.snapshot();
    const out = [];
    for (const p of CONFIG.presets) {
      const before = TestHelp.snap();
      Options.loadPreset(p.id);
      out.push(Store.get('name') === p.name && TestHelp.oneStep(before));
    }
    Store.replace(saved);
    return out.every(Boolean) || `got ${out}`;
  });

  /* ---- templates ---- */
  await t('nine templates, each applied to the default design builds with only planned parking warnings (a too-small site grows)', () => {
    const saved = Store.snapshot();
    const types = Templates.types().map((x) => x.id);
    if (types.length !== 9) return `types ${types}`;
    let msg = true;
    for (const id of types) {
      Store.replace(fillDefaults(defaultState()));
      Templates.apply(id);
      const d = computeDerived(Store.raw());
      const bad = d.warnings.filter((w) => ENVELOPE_CODES.includes(w.id));
      if (!d.built.levels.length || bad.length) { msg = `${id}: levels ${d.built.levels.length}, ${bad.map((w) => `${w.id}: ${w.text}`)}`; break; }
    }
    Store.replace(saved);
    return msg;
  });
  await t('template options change the numbers (length, depth, floors, court size, deck size)', () => {
    const a = PresetsMod.templateState('bar', { length: 240, depth: 70, floors: 4 });
    const u = PresetsMod.templateState('courtyard-U', { courtW: 150, courtD: 100, floors: 6 });
    const w = PresetsMod.templateState('wrap', { deckW: 200, deckD: 100, deckLevels: 3 });
    return eq([a.bars[0].length, a.bars[0].depth, a.bars[0].floors, u.bars[0].floors, w.deck.w, w.deck.levels], [240, 70, 4, 6, 200, 3]);
  });
  await t('applying a template replaces the layout, keeps the site, the programs and the name, and is one undo step', () => {
    const saved = Store.snapshot();
    const s0 = fillDefaults({ ...defaultState(), name: 'Keep me' });
    s0.site.heightLimit = 90; s0.programs.residential.unitSize = 777;
    Store.replace(s0);
    const before = TestHelp.snap();
    const next = Templates.apply('courtyard-U', { floors: 4 });
    const ok = next && Store.get('bars').length === 3 && Store.get('courts').length === 1 && Store.get('type') === 'courtyard'
      && Store.get('site.heightLimit') === 90 && Store.get('programs.residential.unitSize') === 777 && Store.get('name') === 'Keep me' && TestHelp.oneStep(before);
    Store.replace(saved);
    return ok || 'the template did not apply as described';
  });

  /* ---- envelope marks ---- */
  await t('plates above the height limit count as outside (they turn red)', () => {
    const s = defaultState(); s.site.heightLimit = 35;
    const d = computeDerived(s);
    const out = d.plates.filter((p) => p.outsideEnvelopeArea > 1).map((p) => p.n);
    return eq(out, [4, 5]);
  });
  await t('a bar past the setback is outside and listed', () => {
    const s = defaultState(); s.bars[0].length = 340;
    const d = computeDerived(s);
    return eq([d.plates.every((p) => p.outsideEnvelopeArea > 1), d.warnings.some((w) => w.id === 'bar-outside-site')], [true, true]);
  });
  await t('a roof screen adds its height; a parapet adds none', () => {
    const s = defaultState(); s.roof = { type: 'screen', height: 12 };
    const h1 = computeDerived(s).metrics.height; s.roof.type = 'parapet';
    return eq([h1, computeDerived(s).metrics.height], [64, 52]);
  });
  await t('the draft build has the same footprint area as the full build', () => {
    const s = defaultState();
    const full = computeGeometry(s, 'full'), draft = computeGeometry(s, 'draft');
    return within(draft.plates[0].area, full.plates[0].area, 0.5);
  });

  /* ---- exports ---- */
  await t('the SketchUp document validates for the default design and every preset', () => {
    for (const s of [defaultState(), ...CONFIG.presets.map((p) => fillDefaults(p.state))]) {
      const d = computeDerived(s);
      const v = SkFmt.validateDoc(SkMid.midriseToSketchup(s, d.built, d.metrics, { name: s.name }));
      if (!v.ok) return `${s.name}: ${v.errors.join('; ')}`;
    }
    return true;
  });
  await t('the SketchUp download builds a named blob and counts solids', () => {
    let got = null;
    const r = SketchupExport.download({ deliver: (blob, name) => { got = { type: blob.type, name, size: blob.size }; } });
    return (r.ok && got && got.size > 500 && /\.sketchup\.json$/.test(got.name) && r.counts.solid > 0) || `result ${JSON.stringify(r && { ok: r.ok, errors: r.errors })} got ${JSON.stringify(got)}`;
  });
  await t('the project derived section validates: 5 bar levels, rings clean, seeds present (preset wrap-deck has 5 + 5)', () => {
    const p = CONFIG.presets.find((x) => x.id === 'wrap-deck');
    const s = fillDefaults(p.state), d = computeDerived(s);
    const dv = MidDerivedMod.midriseDerived(s, d.built, d.metrics);
    const zones = dv.levels.reduce((a, l) => { a[l.zone] = (a[l.zone] || 0) + 1; return a; }, {});
    let doc = ProjectMod.newProject({ name: 'test' });
    doc = ProjectMod.writeSection(doc, 'massing', { tool: 'midrise', schema: 1, placement: { x: 10, y: 20, rotation: 0, baseZ: 5 }, state: s, derived: dv });
    const v = ProjectMod.validate(doc);
    const seeds = dv.levels.some((l) => (l.seeds || []).length > 0);
    return (v.ok && zones.bar === 5 && zones.deck === 5 && seeds) || `valid ${v.ok} ${v.errors} zones ${JSON.stringify(zones)} seeds ${seeds}`;
  });
  await t('derived metrics repeat the page metrics (units, height, floors)', () => {
    const s = defaultState(), d = computeDerived(s);
    const dv = MidDerivedMod.midriseDerived(s, d.built, d.metrics);
    return eq([dv.metrics.units, dv.metrics.height, dv.metrics.floors], [100, 52, 5]);
  });
  await t('export JSON then import JSON keeps the option and its metrics', async () => {
    const saved = Store.snapshot();
    const key = `__t${Date.now()}`;
    const mem = { data: {}, getItem(k) { return this.data[k] === undefined ? null : this.data[k]; }, setItem(k, v) { this.data[k] = String(v); }, removeItem(k) { delete this.data[k]; } };
    const st = StorageMod.createStorage({ key, schema: CONFIG.schema, migrate: (x) => x, storage: mem });
    const s = fillDefaults(CONFIG.presets[3].state);
    const id = st.save(s, 'Round trip');
    const blob = st.exportAll();
    const mem2 = { data: {}, getItem(k) { return this.data[k] === undefined ? null : this.data[k]; }, setItem(k, v) { this.data[k] = String(v); }, removeItem(k) { delete this.data[k]; } };
    const st2 = StorageMod.createStorage({ key, schema: CONFIG.schema, migrate: (x) => x, storage: mem2 });
    const res = await st2.importFile(blob);
    const back = st2.list()[0];
    const a = computeDerived(fillDefaults(back.state)).metrics, b = computeDerived(s).metrics;
    const ok = id && res.added === 1 && a.units === b.units && a.gfa === b.gfa && a.height === b.height && /^midrise-options-/.test(Options.storage.exportFilename());
    Store.replace(saved);
    return ok || 'the imported option differs';
  });

  /* ---- screenshots ---- */
  if (Render.ready()) {
    await t('AI-ready capture returns a PNG and puts the scene back exactly', async () => {
      const before = JSON.stringify(Render.sceneFlags()), style = Store.get('view.style');
      const blob = await Shots.aiReady({ deliver: false, scale: 1 });
      const after = JSON.stringify(Render.sceneFlags());
      return (blob.type === 'image/png' && blob.size > 2000 && before === after && style === Store.get('view.style')) || `type ${blob.type} size ${blob.size} before ${before} after ${after}`;
    });
    await t('screenshot capture returns a PNG blob; key metrics are units, density, parking, height, GFA, FAR', async () => {
      const blob = await Shots.capture({ scale: 1 });
      const keys = Shots.keyMetrics(Derived.get()).map((x) => x[0]);
      return (blob.type === 'image/png' && blob.size > 2000 && JSON.stringify(keys) === JSON.stringify(['Units', 'Density', 'Parking', 'Height', 'GFA', 'FAR'])) || `type ${blob.type} size ${blob.size} keys ${keys}`;
    });
  }

  TestHelp.merged('calculation', results);
  return results;
}

/* ==========================================================================
   TESTS: direct editing
   Click picking, the selection card, handles (move with snapping, length, depth, rotate, floors), duplicate, add, delete,
   drawing a surface lot, shortcuts, and that the selection never reaches the saved state. Drags run through the same
   math the pointer uses (Select.simulateHandleDrag). The tests restore the design, the tab, the style and the view.
   ========================================================================== */
async function runSelectTests() {
  const { eq, near, make, $, wait, snap, oneStep } = TestHelp;
  const { results, t } = make();
  const savedState = Store.snapshot(), savedTab = UI.activeTab();
  const savedView = Render.info().preset || 'axon';
  Options.holdAutosave(true);
  const key = (k, extra = {}) => window.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true, ...extra }));
  // Synchronous on purpose: no frame is drawn between a state change and the checks (a drawn frame in software rendering costs ~0.5 s).
  const load = (s, view = 'axon') => { Select.clear(); Store.replace(fillDefaults(s)); Render.setView(view, false); };
  /** A wide, empty site with one bar well inside it: no setback line or other bar is near, so only the grid and 1 ft steps matter. */
  const open = () => {
    const s = defaultState();
    s.site.width = 800; s.site.depth = 600;
    s.bars[0] = { ...s.bars[0], x: -100, y: 0, length: 200, depth: 60 };
    s.context.blocks = [];
    return s;
  };
  const bar = (i = 0) => Store.get(`bars.${i}`);
  const only = (obj, keys) => JSON.stringify(keys.map((k) => obj[k]));

  try {
    if (!Render.ready()) { TestHelp.merged('direct editing (skipped: no WebGL)', results); return results; }

    /* ---- click picking ---- */
    await t('click-pick: each bar, the deck, and a context block are found at their projected centers', () => {
      const s = fillDefaults(CONFIG.presets.find((p) => p.id === 'wrap-deck').state);
      s.context.blocks = [{ x: 0, y: -330, w: 200, d: 120, h: 40 }];
      load(s);
      const out = {};
      for (const it of [{ kind: 'bar', id: 'S' }, { kind: 'bar', id: 'N' }, { kind: 'deck' }, { kind: 'context', index: 0 }]) {
        const p = Select.screenPointFor(it);
        const hit = p && Select.pickAt(p.x, p.y);
        out[`${it.kind}${it.id || it.index || ''}`] = hit ? `${hit.kind}:${hit.id !== undefined ? hit.id : (hit.index !== undefined ? hit.index : '')}` : null;
      }
      return eq(out, { barS: 'bar:S', barN: 'bar:N', deck: 'deck:', context: 'context:0' });
    });
    await t('click-pick: empty sky picks nothing; Select.click applies shift (add) and empty space (clear)', () => {
      load(fillDefaults(CONFIG.presets.find((p) => p.id === 'courtyard-5-over-1').state));
      const a = Select.screenPointFor({ kind: 'bar', id: 'S' }), b = Select.screenPointFor({ kind: 'bar', id: 'N' });
      const rect = Render.canvas().getBoundingClientRect();
      const sky = Select.pickAt(rect.left + 6, rect.top + 6);
      Select.click(a.x, a.y, false);
      const first = Select.get();
      Select.click(b.x, b.y, true);
      const second = Select.get().length;
      Select.click(b.x, b.y, true);
      const third = Select.get();
      Select.click(rect.left + 6, rect.top + 6, false);
      return eq([sky, first, second, third, Select.get()], [null, [{ kind: 'bar', id: 'S' }], 2, [{ kind: 'bar', id: 'S' }], []]);
    });
    await t('pointer events: a short still press is a click; a drag (orbit) and a long press are not', async () => {
      load(fillDefaults(CONFIG.presets.find((p) => p.id === 'courtyard-5-over-1').state));
      Render.setOrbitEnabled(false);
      try {
        const canvas = Render.canvas();
        const p = Select.screenPointFor({ kind: 'bar', id: 'S' });
        const ev = (type, x, y, extra = {}) => canvas.dispatchEvent(new PointerEvent(type, { pointerId: 41, pointerType: 'mouse', button: 0, bubbles: true, clientX: x, clientY: y, ...extra }));
        ev('pointerdown', p.x, p.y); ev('pointerup', p.x + 2, p.y + 1);
        const click = Select.get();
        Select.clear();
        ev('pointerdown', p.x, p.y); ev('pointermove', p.x + 20, p.y); ev('pointerup', p.x + 20, p.y);
        const orbit = Select.get();
        ev('pointerdown', p.x, p.y); await wait(450); ev('pointerup', p.x, p.y);
        const longPress = Select.get();
        return eq([click, orbit, longPress], [[{ kind: 'bar', id: 'S' }], [], []]);
      } finally { Render.setOrbitEnabled(true); Select.clear(); Render.setView('axon', false); }
    });

    /* ---- the selection reaches the card, not the saved state ---- */
    await t('selecting a bar opens the card and outlines it; the selection never reaches the saved state', () => {
      load(open());
      Select.select([{ kind: 'bar', id: 'A' }]);
      Select.refreshOverlay();
      const card = $('selection-card');
      const out = [!card.hidden, Select.overlayInfo().outline > 0, /"selection"|"items"/.test(snap())];
      Select.clear();
      return eq(out, [true, true, false]);
    });
    await t('a selected bar shows move, rotate, length, depth and floors handles (axon view)', () => {
      load(open());
      Select.select([{ kind: 'bar', id: 'A' }]);
      const got = Select.visibleHandles();

      btn.click();
      const active = Select.lotActive();
      const rect = Render.canvas().getBoundingClientRect();
      const at = (px, py) => { const cam = Render.camera(); cam.updateMatrixWorld(true); const q = new THREE.Vector3(...planToWorld(px, py, 0)).project(cam); return [rect.left + ((q.x + 1) / 2) * rect.width, rect.top + ((1 - q.y) / 2) * rect.height]; };
      for (const [px, py] of [[-150, -150], [-50, -150], [-50, -80]]) { const [cx, cy] = at(px, py); Select.click(cx, cy, false); }
      btn.click();                                                     // the button now says Finish lot

    });
    await t('a drawn lot adds stalls by its area (area / stall size)', () => {
      const s = open();
      s.surface = { count: 0, lot: [[-150, -150], [-50, -150], [-50, -50], [-150, -50]] };
      const d = computeDerived(fillDefaults(s));
      return eq(d.metrics.parking.providedDetail.lot, Math.floor(10000 / 350));
    });
  } finally {
    Select.cancelHandleDrag();
    Select.finishLot(false);
    Select.clear();
    Store.replace(savedState);
    UI.setTab(savedTab);
    Render.setView(savedView, false);
  }
  TestHelp.merged('direct editing', results);
  return results;
}

/* ==========================================================================
   TESTS: project file
   Open a project with a site, place the building on it, load the neighbors, write the massing section (1 s debounce),
   keep every other section, the Tower Generator massing question, a newer schema, Send to, import, close.
   A fixture project lives in an in-memory storage, so a ?test visit never touches the saved projects.
   runAllTests (below) runs every test file and merges the results.
   ========================================================================== */
const ProjectFixture = (() => {
  const memory = () => ({ data: {}, getItem(k) { return this.data[k] === undefined ? null : this.data[k]; }, setItem(k, v) { this.data[k] = String(v); }, removeItem(k) { delete this.data[k]; } });
  const S = 1000, N = 11, SPACING = 100;
  /** A 1000 ft site square with a sloping ground (z = 1000 + 0.01 x + 0.02 y), a near building and a far one. */
  function siteProject({ withMassing = null, withPlates = false } = {}) {
    let doc = ProjectMod.newProject({ name: 'Fixture', frame: { kind: 'site', lat: 33.927, lon: -84.339, size: S } });
    const points = [];
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) points.push([i * SPACING, j * SPACING, 1000 + 0.01 * i * SPACING + 0.02 * j * SPACING]);
    const derived = {
      address: 'Fixture', lat: 33.927, lon: -84.339, size: S, release: 'test',
      boundary: [[0, 0], [S, 0], [S, S], [0, S]], ground: { spacing: SPACING, n: N, points },
      buildings: [
        { id: 'near', outer: [[480, 380], [560, 380], [560, 420], [480, 420]], holes: [], base: 1010, height: 40, top: 1050, floors: 3, rule: 'data', name: 'Near' },
        { id: 'far', outer: [[950, 950], [990, 950], [990, 990], [950, 990]], holes: [], base: 1030, height: 30, top: 1060, floors: 2, rule: 'data', name: 'Far' },
      ],
      roads: { segments: [], pavement: [] }, walks: null, trees: [], water: { areas: [], lines: [] },
    };
    doc = ProjectMod.writeSection(doc, 'site', { tool: 'site', schema: 1, placement: { x: 0, y: 0, rotation: 0, baseZ: 0 }, state: { query: 'Fixture', lat: 33.927, lon: -84.339, size: S, release: 'test', walks: false }, derived });
    if (withMassing) doc = ProjectMod.writeSection(doc, 'massing', withMassing);
    if (withPlates) doc = ProjectMod.writeSection(doc, 'plates', { tool: 'plate', schema: 1, placement: { x: 1, y: 2, rotation: 0, baseZ: 3 }, state: { keep: 'me' }, derived: { levels: [] } });
    return doc;
  }
  return { memory, siteProject, S };
})();

async function runProjectTests() {
  const { eq, near, make, $, wait, snap, oneStep } = TestHelp;
  const { results, t } = make();
  const savedState = Store.snapshot(), savedTab = UI.activeTab();
  Options.holdAutosave(true);
  const mem = ProjectFixture.memory();
  const urls = [], navs = [];
  ProjectUI.reset();
  ProjectUI.configure({ storage: mem, navigate: (u) => navs.push(u), updateUrl: (id) => urls.push(id) });
  const stored = (id) => ProjectMod.loadProject(mem, id);
  const modal = () => document.querySelector('.modal-back');
  const answer = (yes) => { const m = modal(); if (!m) return false; const btns = m.querySelectorAll('.btn'); (yes ? btns[1] : btns[0]).click(); return true; };
  const fresh = () => { Store.replace(fillDefaults(defaultState())); };

  try {
    await t('the fixture project is valid and carries a site', () => {
      const doc = ProjectFixture.siteProject();

    });
