        const p = out[i], q = out[(i + 1) % n];
        if ((q[0] - p[0]) * L[i][2] + (q[1] - p[1]) * L[i][3] <= 1e-9) { okFast = false; break; }
      }
      if (okFast) return out;
    }
  }
  let poly = ring;
  for (let i = 0; i < n; i++) {
    const p = ring[i], q = ring[(i + 1) % n];
    const dx = q[0] - p[0], dy = q[1] - p[1];
    const len = Math.hypot(dx, dy);
    if (len < 1e-12) continue;
    const nx = -dy / len, ny = dx / len;   // inward normal for a CCW ring (exact ±1 / 0 on axis edges)
    poly = clipRingHalf(poly, nx, ny, nx * p[0] + ny * p[1] + D);
    if (poly.length < 3) return [];
  }
  return poly;
}

/** Inward offset of a MultiPoly by D ft (D > 0). Miter joins keep rectangles rectangular. */
function insetMP(mp, D) {
  if (!(D > 0)) return mp;
  if (!mp.length) return mp;
  if (isSimpleConvex(mp)) {
    const r = offsetConvexInward(mp[0].outer, D);
    return r.length >= 3 && ringArea(r) > AREA_EPS ? [{ outer: r, holes: [] }] : [];
  }
  return clipperOffset(mp, -D);
}

/* ------------------------------------------------------------------ shapes */

function arcPoints(cx, cy, r, a0, a1, m) {
  // m segments, end points on r, interior points on k*r so the fan area is exact.
  const theta = a1 - a0, dl = theta / m;
  let k = 1;
  if (m >= 3) {
    const A = m - 2, B = 2, C = -theta / Math.sin(dl);
    k = (-B + Math.sqrt(B * B - 4 * A * C)) / (2 * A);
  } else if (m === 2) k = theta / (2 * Math.sin(dl));
  const pts = [];
  for (let i = 0; i <= m; i++) {
    const a = a0 + dl * i, rr = i === 0 || i === m ? r : r * k;
    let x = cx + rr * Math.cos(a), y = cy + rr * Math.sin(a);
    if (i === 0 || i === m) {   // snap end points exactly onto the straight edges
      const c = Math.round(Math.cos(a)), s = Math.round(Math.sin(a));
      x = cx + r * c; y = cy + r * s;
    }
    pts.push([x, y]);
  }
  return pts;
}

function rectRing(w, d, radius = 0) {
  const x = w / 2, y = d / 2;
  const r = clamp(num(radius, 0), 0, Math.min(x, y));
  if (r <= 0) return [[-x, -y], [x, -y], [x, y], [-x, y]];
  const h = Math.PI / 2;
  const pts = [
    ...arcPoints(x - r, -y + r, r, -h, 0, CORNER_SEGMENTS),       // SE
    ...arcPoints(x - r, y - r, r, 0, h, CORNER_SEGMENTS),         // NE
    ...arcPoints(-x + r, y - r, r, h, 2 * h, CORNER_SEGMENTS),    // NW
    ...arcPoints(-x + r, -y + r, r, 2 * h, 3 * h, CORNER_SEGMENTS), // SW
  ];
  return dedupe(pts);
}

function ellipseRing(a, b, n) {
  // Equal-area polygon: N/2 * k^2 * a*b * sin(2pi/N) = pi*a*b.
  const k = Math.sqrt((2 * Math.PI) / (n * Math.sin((2 * Math.PI) / n)));
  const pts = [];
  for (let i = 0; i < n; i++) {
    const t = (2 * Math.PI * i) / n;
    pts.push([k * a * Math.cos(t), k * b * Math.sin(t)]);
  }
  return pts;
}

/**
 * Ring for a shape definition, centred on (0, 0) by bounding box (polygon: as given).
 * shape: { type, w, d, radius, arm, points }. Returns [] when the shape has no area.
 */
function shapeToRing(shape, { segments = 96 } = {}) {
  const s = shape || {};
  const type = String(s.type || "rect").toLowerCase();
  const w = clamp(num(s.w, 0), 0, MAX_DIM);
  const d = clamp(num(s.d, 0), 0, MAX_DIM);
  const n = Math.max(8, Math.round(num(segments, 96)));
  switch (type) {
    case "square": {
      const side = w > 0 ? w : d;
      return side > 0 ? rectRing(side, side, s.radius) : [];
    }
    case "circle": {
      const dia = w > 0 ? w : d;
      return dia > 0 ? ellipseRing(dia / 2, dia / 2, n) : [];
    }
    case "ellipse":
      return w > 0 && d > 0 ? ellipseRing(w / 2, d / 2, n) : [];
    case "triangle":
      return w > 0 && d > 0 ? [[-w / 2, -d / 2], [w / 2, -d / 2], [0, d / 2]] : [];
    case "l": {
      if (!(w > 0 && d > 0)) return [];
      const a = num(s.arm, 0) > 0 ? num(s.arm, 0) : 0.4 * Math.min(w, d);
      if (a >= Math.min(w, d)) return rectRing(w, d);
      const x = w / 2, y = d / 2;
      return [[-x, -y], [x, -y], [x, -y + a], [-x + a, -y + a], [-x + a, y], [-x, y]];
    }
    case "u": {
      if (!(w > 0 && d > 0)) return [];
      const a = num(s.arm, 0) > 0 ? num(s.arm, 0) : 0.4 * Math.min(w, d);
      if (a >= w / 2 || a >= d) return rectRing(w, d);
      const x = w / 2, y = d / 2;
      return [[-x, -y], [x, -y], [x, y], [x - a, y], [x - a, -y + a], [-x + a, -y + a], [-x + a, y], [-x, y]];
    }
    case "polygon":
    case "custom": {
      const pts = (Array.isArray(s.points) ? s.points : [])
        .filter((p) => Array.isArray(p) && Number.isFinite(+p[0]) && Number.isFinite(+p[1]))
        .map((p) => [clamp(+p[0], -MAX_DIM, MAX_DIM), clamp(+p[1], -MAX_DIM, MAX_DIM)]);
      const r = dedupe(pts);
      if (r.length < 3) return [];
      const xs = r.map((p) => p[0]), ys = r.map((p) => p[1]);
      if ((Math.max(...xs) - Math.min(...xs)) * (Math.max(...ys) - Math.min(...ys)) <= AREA_EPS) return [];
      return ccw(r);   // a self-intersecting ring is returned as given; shapeToMP repairs it
    }
    case "rect":
    default:
      return w > 0 && d > 0 ? rectRing(w, d, s.radius) : [];
  }
}

/** Shape → MultiPoly. Custom polygons pass through a Clipper union to fix self-intersections. */
function shapeToMP(shape, segments) {
  const ring = shapeToRing(shape, { segments });
  if (ring.length < 3) return [];
  const type = String((shape && shape.type) || "rect").toLowerCase();
  if (type === "polygon" || type === "custom") {
    if (isConvexRing(ring)) return [{ outer: ring, holes: [] }];
    return boolOp([], [ring], "union");
  }
  return [{ outer: ring, holes: [] }];
}

/* -------------------------------------------------------------- floor list */

function programsOf(state) {
  const sp = state && state.programs && typeof state.programs === "object" ? state.programs : {};
  const out = {};
  for (const k of new Set([...Object.keys(PROGRAM_DEFAULTS), ...Object.keys(sp)])) {
    out[k] = { ...(PROGRAM_DEFAULTS[k] || { ftf: 10, unitSize: 0, unitFactor: 0 }), ...(sp[k] || {}) };
  }
  return out;
}

function floorListInternal(state, warnings) {
  const floors = [];
  let n = 0, z = 0, capped = false;
  const progs = programsOf(state);
  const mechDefs = (Array.isArray(state.mechanical) ? state.mechanical : []).map((m) => ({
    afterFloor: Math.round(num(m && m.afterFloor, 0)),
    ftf: Math.max(1, num(m && m.ftf, num(progs.mechanical && progs.mechanical.ftf, 16))),
    used: false,
  }));
  const push = (zone, program, segmentIndex, t, ftf) => {
    if (n >= MAX_FLOORS) { capped = true; return false; }
    n += 1;
    floors.push({ n, zone, program, segmentIndex, t, z, ftf });
    z += ftf;
    return true;
  };
  const insertMechanical = (segmentIndex, t) => {
    let again = true;
    while (again) {
      again = false;
      for (const m of mechDefs) {
        if (!m.used && m.afterFloor === n) {
          m.used = true;
          if (push("mechanical", "mechanical", segmentIndex, t, m.ftf)) again = true;
        }
      }
    }
  };
  const pod = state.podium;
  if (pod && pod.on) {
    const count = Math.max(1, Math.round(num(pod.floors, 1)));
    for (let i = 0; i < count; i++) {
      const t = count > 1 ? i / (count - 1) : 0;
      const ftf = Math.max(1, num(i === 0 ? pod.groundFtf : pod.ftf, 14));
      if (!push("podium", (i === 0 ? pod.program : pod.upperProgram) || "retail", -1, t, ftf)) break;
      insertMechanical(-1, t);
    }
  }
  (Array.isArray(state.segments) ? state.segments : []).forEach((seg, si) => {
    const count = Math.max(1, Math.round(num(seg && seg.floors, 1)));
    for (let i = 0; i < count; i++) {
      const t = count > 1 ? i / (count - 1) : 0;
      if (!push("tower", (seg && seg.program) || "residential", si, t, Math.max(1, num(seg && seg.ftf, 10)))) break;
      insertMechanical(si, t);
    }
  });
  if (capped) warnings.push(warn("floor-cap", [], `Floor count is limited to ${MAX_FLOORS}. Extra floors were not built.`));
  const unplaced = mechDefs.filter((m) => !m.used).map((m) => m.afterFloor);
  if (unplaced.length) {
    warnings.push(warn("mechanical-unplaced", [], `A mechanical floor after floor ${unplaced.join(", ")} has no floor below it and was not built.`));
  }
  return floors;
}

/** Plan 3.1: ordered floors { n, zone, program, segmentIndex, t, z, ftf }, bottom up. */
function buildFloorList(state) {
  return floorListInternal(state || {}, []);
}

/* ---------------------------------------------------------- normalizers */

const SIDES = ["front", "back", "left", "right"];

function normSetbacks(list) {
  return (Array.isArray(list) ? list : []).map((s) => {
    let sides = Array.isArray(s && s.sides) ? s.sides.map((x) => String(x).toLowerCase()) : [];
    if (!sides.length || sides.includes("all")) sides = SIDES.slice();
    sides = SIDES.filter((x) => sides.includes(x));
    return { floor: Math.round(num(s && s.floor, 1)), distance: Math.max(0, num(s && s.distance, 0)), all: sides.length === 4, sides };
  }).filter((s) => s.distance > 0 && s.sides.length);
}

function setbackAt(setbacks, n) {
  const r = { all: 0, front: 0, back: 0, left: 0, right: 0 };
  for (const s of setbacks) {
    if (n < s.floor) continue;
    if (s.all) r.all += s.distance; else for (const side of s.sides) r[side] += s.distance;
  }
  return r;
}

function normRange(o, lastN) {
  let a = Math.round(num(o && o.startFloor, 1)), b = Math.round(num(o && o.endFloor, a));
  if (b < a) [a, b] = [b, a];
  return [Math.max(1, a), Math.min(lastN, b)];
}

function normCarves(list, lastN) {
  return (Array.isArray(list) ? list : []).map((c) => {
    const [s, e] = normRange(c, lastN);
    const kind = String((c && c.kind) || "corner").toLowerCase();
    const corner = String((c && c.corner) || "NE").toUpperCase();
    return { s, e, kind, corner: ["NE", "NW", "SE", "SW"].includes(corner) ? corner : "NE",
      w: Math.max(0, num(c && c.w, 0)), d: Math.max(0, num(c && c.d, 0)) };
  }).filter((c) => c.s <= c.e && (c.kind === "full" || (c.w > 0 && c.d > 0)));
}

function normCuts(list, lastN, floorByN) {
  return (Array.isArray(list) ? list : []).map((c) => {
    const [s, e] = normRange(c, lastN);
    const side = String((c && c.side) || "front").toLowerCase();
    const fs = floorByN.get(s), fe = floorByN.get(e);
    return { s, e, side: SIDES.includes(side) ? side : "front", depth: Math.max(0, num(c && c.depth, 0)),
      zs: fs ? fs.z : 0, ze: fe ? fe.z : 0, ref: null };
  }).filter((c) => c.s <= c.e && c.depth > 0);
}

/* ---------------------------------------------------------------- core */

function rectQuad(cx, cy, w, d, theta) {
  const c = Math.cos(theta), s = Math.sin(theta), x = w / 2, y = d / 2;
  const pts = [[-x, -y], [x, -y], [x, y], [-x, y]];
  if (theta === 0) return pts.map((p) => [p[0] + cx, p[1] + cy]);
  return pts.map((p) => [cx + p[0] * c - p[1] * s, cy + p[0] * s + p[1] * c]);
}

function pointInMP(mp, x, y) {
  let inside = false;
  const test = (ring) => {
    for (let i = 0, n = ring.length, j = n - 1; i < n; j = i++) {
      const a = ring[i], b = ring[j];
      if ((a[1] > y) !== (b[1] > y) && x < ((b[0] - a[0]) * (y - a[1])) / (b[1] - a[1]) + a[0]) inside = !inside;
    }
  };
  for (const p of mp) { test(p.outer); for (const h of p.holes || []) test(h); }
  return inside;
}
function orient(a, b, c) { return (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]); }
function segCross(a, b, c, d) {
  const o1 = orient(a, b, c), o2 = orient(a, b, d), o3 = orient(c, d, a), o4 = orient(c, d, b);
  return ((o1 > 0 && o2 < 0) || (o1 < 0 && o2 > 0)) && ((o3 > 0 && o4 < 0) || (o3 < 0 && o4 > 0));
}
/** True only when the convex quad is certainly inside the plate (strict tests, no Clipper). */
function quadInsideFast(q, mp) {
  for (const p of q) if (!pointInMP(mp, p[0], p[1])) return false;
  const rings = [];
  for (const p of mp) { rings.push(p.outer); for (const h of p.holes || []) rings.push(h); }
  for (const r of rings) {
    for (let i = 0, n = r.length; i < n; i++) {
      const a = r[i], b = r[(i + 1) % n];
      // vertex inside or on the quad → not certain
      let inQ = true;
      for (let k = 0; k < 4; k++) if (orient(q[k], q[(k + 1) % 4], a) < -1e-9) { inQ = false; break; }
      if (inQ) return false;
      for (let k = 0; k < 4; k++) if (segCross(a, b, q[k], q[(k + 1) % 4])) return false;
    }
  }
  return true;
}

/* ---------------------------------------------------------------- crown */

function triangulate(poly) {
  // Ear clipping with hole bridging. Returns { pts, tris } (tris: flat index list, CCW).
  let ring = ccw(dedupe(poly.outer.map((p) => [p[0], p[1]])));
  const holes = (poly.holes || []).map((h) => cw(dedupe(h.map((p) => [p[0], p[1]])))).filter((h) => h.length >= 3);
  holes.sort((a, b) => Math.max(...b.map((p) => p[0])) - Math.max(...a.map((p) => p[0])));
  const allEdgesBlock = (M, P, rest) => {
    const check = (r) => {
      for (let i = 0; i < r.length; i++) {
        const a = r[i], b = r[(i + 1) % r.length];
        if (segCross(M, P, a, b)) return true;
      }
      return false;
    };
    if (check(ring)) return true;
    for (const h of rest) if (check(h)) return true;
    return false;
  };
  for (let hi = 0; hi < holes.length; hi++) {
    const h = holes[hi];
    let mi = 0;
    for (let i = 1; i < h.length; i++) if (h[i][0] > h[mi][0]) mi = i;
    const M = h[mi];
    const order = ring.map((p, i) => [i, (p[0] - M[0]) ** 2 + (p[1] - M[1]) ** 2]).sort((a, b) => a[1] - b[1]);
    let pi = order[0][0];
    for (const [i] of order) { if (!allEdgesBlock(M, ring[i], holes.slice(hi))) { pi = i; break; } }
    const hRot = [...h.slice(mi), ...h.slice(0, mi), [M[0], M[1]]];
    ring = [...ring.slice(0, pi + 1), ...hRot, [ring[pi][0], ring[pi][1]], ...ring.slice(pi + 1)];
  }
  const pts = ring;
  const idx = pts.map((_, i) => i);
  const tris = [];
  const inTri = (p, a, b, c) => orient(a, b, p) >= 0 && orient(b, c, p) >= 0 && orient(c, a, p) >= 0;
  let guard = 0;
  while (idx.length > 3 && guard++ < 100000) {
    let found = false;
    for (let i = 0; i < idx.length; i++) {
      const i0 = idx[(i + idx.length - 1) % idx.length], i1 = idx[i], i2 = idx[(i + 1) % idx.length];
      const a = pts[i0], b = pts[i1], c = pts[i2];
      if (orient(a, b, c) <= 1e-12) continue;
      let ok = true;
      for (const j of idx) {
        if (j === i0 || j === i1 || j === i2) continue;
        const p = pts[j];
        if ((p[0] === a[0] && p[1] === a[1]) || (p[0] === b[0] && p[1] === b[1]) || (p[0] === c[0] && p[1] === c[1])) continue;
        if (inTri(p, a, b, c)) { ok = false; break; }
      }
      if (!ok) continue;
      tris.push(i0, i1, i2);
      idx.splice(i, 1);
      found = true;
      break;
    }
    if (!found) {   // degenerate remainder: drop a vertex so the loop ends
      const i0 = idx[idx.length - 1], i1 = idx[0], i2 = idx[1];
      if (orient(pts[i0], pts[i1], pts[i2]) > 0) tris.push(i0, i1, i2);
      idx.splice(0, 1);
    }
  }
  if (idx.length === 3 && orient(pts[idx[0]], pts[idx[1]], pts[idx[2]]) > 0) tris.push(idx[0], idx[1], idx[2]);
  return { pts, tris };
}

function slopedMesh(mp, z0, h, side) {
  const b = mpBounds(mp);
  const span = side === "front" || side === "back" ? b.maxY - b.minY : b.maxX - b.minX;
  const zt = (p) => {
    const dd = side === "front" ? p[1] - b.minY : side === "back" ? b.maxY - p[1]
      : side === "left" ? p[0] - b.minX : b.maxX - p[0];
    return z0 + (span > 0 ? (h * dd) / span : h);
  };
  const positions = [], indices = [];
  const v = (x, y, z) => { positions.push(x, y, z); return positions.length / 3 - 1; };
  for (const poly of mp) {
    const { pts, tris } = triangulate(poly);
    const top = pts.map((p) => v(p[0], p[1], zt(p)));
    const bot = pts.map((p) => v(p[0], p[1], z0));
    for (let i = 0; i < tris.length; i += 3) {
      indices.push(top[tris[i]], top[tris[i + 1]], top[tris[i + 2]]);
      indices.push(bot[tris[i]], bot[tris[i + 2]], bot[tris[i + 1]]);
    }
    for (const ring of [ccw(poly.outer), ...(poly.holes || []).map(cw)]) {
      for (let i = 0; i < ring.length; i++) {
        const p = ring[i], q = ring[(i + 1) % ring.length];
        const p0 = v(p[0], p[1], z0), q0 = v(q[0], q[1], z0), q1 = v(q[0], q[1], zt(q)), p1 = v(p[0], p[1], zt(p));
        indices.push(p0, q0, q1, p0, q1, p1);
      }
    }
  }
  return { kind: "mesh", positions, indices, role: "crown" };
}

function spireMesh(cx, cy, r, z0, h, n) {
  const positions = [cx, cy, z0 + h, cx, cy, z0];
  const indices = [];
  for (let i = 0; i < n; i++) {
    const a = (2 * Math.PI * i) / n;
    positions.push(cx + r * Math.cos(a), cy + r * Math.sin(a), z0);
  }
  for (let i = 0; i < n; i++) {
    const a = 2 + i, b = 2 + ((i + 1) % n);
    indices.push(a, b, 0);      // side, outward
    indices.push(1, b, a);      // base, facing down
  }
  return { kind: "mesh", positions, indices, role: "crown" };
}

/** The plate minus its inward offset: a ring `thickness` ft wide (parapet, screen). */
function ringOf(mp, thickness) {
  const inner = insetMP(mp, thickness);
  if (!inner.length) return cloneMP(mp);
  if (isSimpleConvex(mp) && inner.length === 1) {
    return [{ outer: mp[0].outer.map((q) => [q[0], q[1]]), holes: [cw(inner[0].outer)] }];
  }
  // Clip rings: outers CCW (+1), holes CW (0 under non-zero) → exactly the inner region.
  return boolOp(mp, inner.flatMap((p) => [ccw(p.outer), ...(p.holes || []).map(cw)]), "diff");
}

function buildCrown(state, topMP, z0, segN) {
  const c = state.crown || {};
  const type = String(c.type || "flat").toLowerCase();
  const h = Math.max(0, num(c.height, 0));
  if (!topMP || !topMP.length || type === "none") return [];
  const b = mpBounds(topMP);
  const minWD = Math.min(b.maxX - b.minX, b.maxY - b.minY);
  switch (type) {
    case "stepped": {
      if (!(h > 0)) return [];
      const steps = clamp(Math.round(num(c.steps, 3)), 1, 20);
      const s = Math.min(0.08 * minWD, minWD / (2 * (steps + 1)));
      const out = [];
      for (let i = 1; i <= steps; i++) {
        const mp = insetMP(topMP, i * s);
        if (!mp.length) break;
        out.push({ kind: "prism", polygons: mp, z0: z0 + ((i - 1) * h) / steps, z1: z0 + (i * h) / steps, role: "crown" });
      }
      return out;
    }
    case "sloped": {
      if (!(h > 0)) return [];
      const side = SIDES.includes(String(c.slopeSide).toLowerCase()) ? String(c.slopeSide).toLowerCase() : "front";
      return [slopedMesh(topMP, z0, h, side)];
    }
    case "spire": {
      if (!(h > 0)) return [];
      const [cx, cy] = mpCentroid(topMP);
      return [spireMesh(cx, cy, Math.max(1, 0.06 * minWD), z0, h, segN === 32 ? 12 : 24)];
    }
    case "screen": {
      if (!(h > 0)) return [];
      return [{ kind: "prism", polygons: ringOf(topMP, RING_THICKNESS), z0, z1: z0 + h, role: "screen" }];
    }
    case "flat":
    default:
      return [{ kind: "prism", polygons: ringOf(topMP, RING_THICKNESS), z0, z1: z0 + PARAPET_HEIGHT, role: "parapet" }];
  }
}

/** Extra height the crown adds above the top floor (flat and none add 0). */
function crownExtra(state) {
  const c = (state && state.crown) || {};
  const type = String(c.type || "flat").toLowerCase();
  return type === "flat" || type === "none" ? 0 : Math.max(0, num(c.height, 0));
}

/* -------------------------------------------------------------- plates */

function prepSegment(seg, segN) {
  const base = shapeToMP(seg && seg.shape, segN);
  const tp = (seg && seg.taper) || {}, tw = (seg && seg.twist) || {};
  return {
    base,
    bounds: base.length ? mpBounds(base) : null,
    taperX: num(tp.x, 0), taperY: num(tp.y, 0), taperCurve: tp.curve,
    twistDeg: num(tw.deg, 0), twistStart: num(tw.start, 0), twistEnd: num(tw.end, 1), twistCurve: tw.curve,
    rotation: num(seg && seg.rotation, 0),
    ox: num(seg && seg.offset && seg.offset.x, 0), oy: num(seg && seg.offset && seg.offset.y, 0),
    lx: num(seg && seg.lean && seg.lean.x, 0), ly: num(seg && seg.lean && seg.lean.y, 0),
    cache: new Map(),
    core: undefined,     // set from the first plate of the segment
  };
}

function twistT(sc, t) {
  const a = clamp(sc.twistStart, 0, 1), b = clamp(sc.twistEnd, 0, 1);
  if (b <= a) return t >= a ? 1 : 0;
  return clamp((t - a) / (b - a), 0, 1);
}

/** Steps 1–4 for one tower floor. Returns { mp, local, theta, cause }. */
function towerPre(sc, f, setbacks) {
  if (!sc.base.length) return { mp: [], cause: "shape" };
  const sx = 1 + (sc.taperX / 100) * curveOf(f.t, sc.taperCurve);
  const sy = 1 + (sc.taperY / 100) * curveOf(f.t, sc.taperCurve);
  if (!(sx > 0 && sy > 0)) return { mp: [], cause: "taper" };
  const sb = setbackAt(setbacks, f.n);
  const key = `${sx},${sy},${sb.all},${sb.front},${sb.back},${sb.left},${sb.right}`;
  let local = sc.cache.get(key);
  if (!local) {
    // 1. taper
    let mp = sx === 1 && sy === 1 ? sc.base : mapMP(sc.base, (q) => [q[0] * sx, q[1] * sy]);
    // 2. setbacks (local frame, before rotation)
    const bb = { minX: sc.bounds.minX * sx, maxX: sc.bounds.maxX * sx, minY: sc.bounds.minY * sy, maxY: sc.bounds.maxY * sy };
    if (sb.all > 0) mp = insetMP(mp, sb.all);
    if (mp.length && sb.front > 0) mp = clipSide(mp, "front", bb.minY + sb.all + sb.front);
    if (mp.length && sb.back > 0) mp = clipSide(mp, "back", bb.maxY - sb.all - sb.back);
    if (mp.length && sb.left > 0) mp = clipSide(mp, "left", bb.minX + sb.all + sb.left);
    if (mp.length && sb.right > 0) mp = clipSide(mp, "right", bb.maxX - sb.all - sb.right);
    local = mp;
    sc.cache.set(key, local);
  }
  if (!local.length || multiPolyArea(local) <= AREA_EPS) return { mp: [], cause: "setbacks" };
  // 3. rotation
  const theta = (sc.rotation + sc.twistDeg * curveOf(twistT(sc, f.t), sc.twistCurve)) * DEG;
  // 4. translation
  const tx = sc.ox + sc.lx * f.t, ty = sc.oy + sc.ly * f.t;
  let mp = local;
  if (theta !== 0) {
    const c = Math.cos(theta), s = Math.sin(theta);
    mp = mapMP(mp, (q) => [q[0] * c - q[1] * s + tx, q[0] * s + q[1] * c + ty]);
  } else if (tx !== 0 || ty !== 0) {
    mp = mapMP(mp, (q) => [q[0] + tx, q[1] + ty]);
  } else {
    mp = cloneMP(mp);
  }
  return { mp, local, theta, tx, ty, cause: null };
}

function makeCore(state, sc, pre) {
  const core = state.core || {};
  const mode = String(core.mode || "percent").toLowerCase();
  const b = mpBounds(pre.local);
  const W = b.maxX - b.minX, D = b.maxY - b.minY;
  let cw0, cd0;
  if (mode === "percent") {
    const A = (clamp(num(core.percent, 0), 0, 100) / 100) * multiPolyArea(pre.mp);
    if (!(A > 0) || !(W > 0) || !(D > 0)) return null;
    cw0 = Math.sqrt((A * W) / D); cd0 = Math.sqrt((A * D) / W);
  } else {
    cw0 = Math.max(0, num(core.w, 0)); cd0 = Math.max(0, num(core.d, 0));
    if (!(cw0 > 0 && cd0 > 0)) return null;
  }
  // Work in the local frame (after taper and setbacks, before rotation and translation).
  let [cx, cy] = mpCentroid(pre.local);
  if (!quadInsideFast(rectQuad(cx, cy, cw0, cd0, 0), pre.local)) {
    // L, U and other concave plates: the centroid can sit outside the material. Use the
    // grid point nearest the centroid where the whole core fits (25 x 25 over the bounds).
    const G = 24, cands = [];
    for (let i = 0; i <= G; i++) for (let j = 0; j <= G; j++) {
      const x = b.minX + (W * i) / G, y = b.minY + (D * j) / G;
      cands.push([x, y, (x - cx) ** 2 + (y - cy) ** 2]);
    }
    cands.sort((p, q) => p[2] - q[2]);
    for (const [x, y] of cands) {
      if (quadInsideFast(rectQuad(x, y, cw0, cd0, 0), pre.local)) { cx = x; cy = y; break; }
    }
  }
  const c = Math.cos(pre.theta), s = Math.sin(pre.theta);
  const quad = rectQuad(cx, cy, cw0, cd0, 0).map((q) => (pre.theta === 0
    ? [q[0] + pre.tx, q[1] + pre.ty]
    : [q[0] * c - q[1] * s + pre.tx, q[0] * s + q[1] * c + pre.ty]));
  return { quad, area: cw0 * cd0 };
}

/**
 * Build every floor plate, the crown solids and the geometry warnings.
 * → { plates: Plate[], solids: Solid[], warnings: Warning[], floors }
 */
function buildPlates(state, { quality = "full" } = {}) {
  state = state || {};
  const segN = quality === "draft" ? 32 : 96;
  const warnings = [];
  const floors = floorListInternal(state, warnings);
  const lastN = floors.length ? floors[floors.length - 1].n : 0;
  const floorByN = new Map(floors.map((f) => [f.n, f]));

  const segs = (Array.isArray(state.segments) ? state.segments : []).map((s) => prepSegment(s, segN));
  const pod = state.podium && state.podium.on ? state.podium : null;
  let podiumMP = [];
  if (pod) {
    const ox = num(pod.offset && pod.offset.x, 0), oy = num(pod.offset && pod.offset.y, 0);
    podiumMP = shapeToMP(pod.shape, segN);
    if (ox !== 0 || oy !== 0) podiumMP = mapMP(podiumMP, (q) => [q[0] + ox, q[1] + oy]);
  }
  const setbacks = normSetbacks(state.setbacks);
  const carves = normCarves(state.carves, lastN);
  const cuts = normCuts(state.cuts, lastN, floorByN);

  const plates = [];
  const empty = { shape: [], taper: [], setbacks: [], carves: [], cuts: [] };
  const coreOut = [];
  let below = null;   // { mp (pre-carve), core, segmentIndex } of the floor below

  for (const f of floors) {
    let pre, core = null, cause = null;
    if (f.zone === "podium") {
      pre = cloneMP(podiumMP);
      if (!pre.length) cause = "shape";
    } else if (f.zone === "mechanical") {
      pre = below ? cloneMP(below.mp) : [];
      core = below ? below.core : null;
      if (!pre.length) cause = below && below.cause ? below.cause : "shape";
    } else {
      const sc = segs[f.segmentIndex];
      const r = towerPre(sc, f, setbacks);
      pre = r.mp; cause = r.cause;
      if (pre.length && sc.core === undefined) sc.core = makeCore(state, sc, r);
      core = sc.core || null;
    }
    below = { mp: pre, core, cause };
    if (!pre.length) { empty[cause || "shape"].push(f.n); continue; }

    // 5. carves
    let mp = pre, isVoid = false;
    const here = carves.filter((c) => f.n >= c.s && f.n <= c.e);
    if (here.some((c) => c.kind === "full")) {
      isVoid = true; mp = [];
    } else if (here.length) {
      const bb = mpBounds(pre);
      const [cx, cy] = mpCentroid(pre);
      const rects = [];
      for (const c of here) {
        let x0, x1, y0, y1;
        if (c.kind === "center") {
          x0 = cx - c.w / 2; x1 = cx + c.w / 2; y0 = cy - c.d / 2; y1 = cy + c.d / 2;
        } else {
          const m = 1;   // reach past the bounding box so no sliver is left on the edge
          if (c.corner.includes("E")) { x0 = bb.maxX - c.w; x1 = bb.maxX + m; } else { x0 = bb.minX - m; x1 = bb.minX + c.w; }
          if (c.corner.includes("N")) { y0 = bb.maxY - c.d; y1 = bb.maxY + m; } else { y0 = bb.minY - m; y1 = bb.minY + c.d; }
        }
        rects.push([[x0, y0], [x1, y0], [x1, y1], [x0, y1]]);
      }
      mp = boolOp(pre, rects, "diff");
      if (!mp.length || multiPolyArea(mp) <= AREA_EPS) { empty.carves.push(f.n); continue; }
    }

    // 6. cuts
    if (!isVoid) {
      let cutEmpty = false;
      for (const c of cuts) {
        if (f.n < c.s || f.n > c.e) continue;
        if (!c.ref) c.ref = mpBounds(pre);
        const dz = c.ze - c.zs;
        const dep = dz > 0 ? (c.depth * (f.z - c.zs)) / dz : c.depth;
        if (!(dep > 0)) continue;
        const v = c.side === "front" ? c.ref.minY + dep : c.side === "back" ? c.ref.maxY - dep
          : c.side === "left" ? c.ref.minX + dep : c.ref.maxX - dep;
        mp = clipSide(mp, c.side, v);
        if (!mp.length) { cutEmpty = true; break; }
      }
      if (cutEmpty || multiPolyArea(mp) <= AREA_EPS) { empty.cuts.push(f.n); continue; }
    }

    const area = isVoid ? 0 : multiPolyArea(mp);
    // core
    let coreArea = 0;
    const coreRect = f.zone === "podium" || !core ? null : core.quad.map((q) => [q[0], q[1]]);
    if (coreRect && !isVoid) {
      if (quadInsideFast(core.quad, mp)) {
        coreArea = core.area;
      } else {
        const inside = multiPolyArea(boolOp(mp, [core.quad], "int"));
        const outside = core.area - inside;
        if (outside > CORE_TOL) { coreOut.push(f.n); coreArea = Math.min(inside, area); }
        else coreArea = Math.min(core.area, area);
      }
    }
    plates.push({
      n: f.n, zone: f.zone, program: f.program, segmentIndex: f.segmentIndex,
      t: f.t, z: f.z, ftf: f.ftf,
      polygons: mp, area, coreArea, coreRect,
      outsideEnvelopeArea: 0,
      void: isVoid,
    });
  }

  // warnings
  const why = { shape: "the shape has no size", taper: "taper", setbacks: "setbacks", carves: "carves", cuts: "cuts" };
  for (const k of Object.keys(empty)) {
    const list = empty[k];
    if (!list.length) continue;
    const verb = list.length === 1 ? "has" : "have";
    const msg = k === "shape" ? `${groupFloors(list)} ${verb} no area: ${why[k]}.` : `${groupFloors(list)} ${verb} no area after ${why[k]}.`;
    warnings.push(warn("plate-empty", list, msg));
  }
  if (coreOut.length) {
    warnings.push(warn("core-outside", coreOut, `${groupFloors(coreOut)}: the core does not fit inside the plate.`));
  }

  // crown
  let solids = [];
  const real = plates.filter((p) => !p.void && p.area > AREA_EPS);
  if (real.length) {
    const top = real[real.length - 1];
    const topOfFloors = plates.reduce((m, p) => Math.max(m, p.z + p.ftf), 0);
    solids = buildCrown(state, top.polygons, topOfFloors, segN);
  }
  return { plates, solids, warnings, floors };
}

/* ---------------------------------------------------------------- metrics */

function siteAreaOf(state) {
  const s = state.site || {};
  if (s.shape === "polygon" && Array.isArray(s.points) && s.points.length >= 3) {
    return Math.abs(ringArea(s.points.map((p) => [+p[0], +p[1]])));
  }
  return clamp(num(s.width, 0), 0, MAX_DIM) * clamp(num(s.depth, 0), 0, MAX_DIM);
}

function factorOf(v) {
  const f = num(v, 0);
  return f > 1 ? f / 100 : Math.max(0, f);
}

/** Plan section 5: every metric, from the plate list. */
function computeMetrics(state, plates) {
  state = state || {};
  plates = plates || [];
  const progs = programsOf(state);
  let gfa = 0, top = 0, coreArea = 0, mechanicalArea = 0, netArea = 0, floorCount = 0, voidFloors = 0;
  let towerArea = 0, towerNet = 0;
  const byZone = { podium: 0, tower: 0, mechanical: 0, crown: 0 };
  const towerAreas = [];
  const efficiency = [];
  const byProgram = {};
  let floor1Area = 0;

  for (const p of plates) {
    top = Math.max(top, p.z + p.ftf);
    if (p.void || !(p.area > 0)) { voidFloors += p.void ? 1 : 0; continue; }
    const area = p.area, core = Math.min(num(p.coreArea, 0), area);
    gfa += area;
    floorCount += 1;
    byZone[p.zone] = (byZone[p.zone] || 0) + 1;
    if (p.n === 1) floor1Area = area;
    efficiency.push({ n: p.n, zone: p.zone, efficiency: (area - core) / area });
    const key = p.program || p.zone;
    const bp = byProgram[key] || (byProgram[key] = { floors: 0, gross: 0, core: 0, net: 0 });
    bp.floors += 1; bp.gross += area;
    if (p.zone === "mechanical") {
      mechanicalArea += area;
    } else {
      coreArea += core; netArea += area - core;
      bp.core += core; bp.net += area - core;
    }
    if (p.zone === "tower") { towerAreas.push(area); towerArea += area; towerNet += area - core; }
  }
  for (const [k, bp] of Object.entries(byProgram)) {
    const pr = progs[k] || {};
    const unitSize = Math.max(0, num(pr.unitSize, 0));
    const unitFactor = factorOf(pr.unitFactor);
    bp.unitSize = unitSize;
    bp.unitFactor = unitFactor;
    bp.units = unitSize > 0 && unitFactor > 0 ? (bp.net * unitFactor) / unitSize : null;
    bp.unitsWhole = bp.units == null ? null : Math.floor(bp.units + 1e-9);
  }

  const crownHeight = floorCount ? crownExtra(state) : 0;
  const siteArea = siteAreaOf(state);
  const far = siteArea > 0 ? gfa / siteArea : 0;
  const t = state.targets || {};
  const check = (target, current) => (num(target, 0) > 0
    ? { target, current, diff: current - target, pct: ((current - target) / target) * 100 }
    : null);

  return {
    gfa,
    floorCount,
    voidFloors,
    levelCount: plates.length,
    floorsByZone: byZone,
    topOfFloors: top,
    crownHeight,
    totalHeight: top + crownHeight,
    plateMin: towerAreas.length ? Math.min(...towerAreas) : 0,
    plateMax: towerAreas.length ? Math.max(...towerAreas) : 0,
    plateAvg: towerAreas.length ? towerArea / towerAreas.length : 0,
    siteArea,
    far,
    floor1Area,
    siteCoverage: siteArea > 0 ? floor1Area / siteArea : 0,
    coreArea,
    mechanicalArea,
    netArea,
    efficiency,
    efficiencyAvg: towerArea > 0 ? towerNet / towerArea : 0,
    byProgram,
    target: { gfa: check(num(t.gfa, 0), gfa), far: check(num(t.far, 0), far) },
  };
}

/* ---------------------------------------------------------------- text */

/** [31,32,33,34,40] → "Floors 31–34 and 40"; [5] → "Floor 5". En dash for ranges. */
function groupFloors(numbers) {
  const nums = [...new Set((numbers || []).map((x) => Math.round(+x)).filter(Number.isFinite))].sort((a, b) => a - b);
  if (!nums.length) return "";
  const groups = [];
  for (const n of nums) {
    const g = groups[groups.length - 1];
    if (g && n === g[1] + 1) g[1] = n; else groups.push([n, n]);
  }
  const parts = groups.map(([a, b]) => (a === b ? `${a}` : `${a}–${b}`));
  const list = parts.length === 1 ? parts[0] : `${parts.slice(0, -1).join(", ")} and ${parts[parts.length - 1]}`;
  return `${nums.length === 1 ? "Floor" : "Floors"} ${list}`;
}

return { SCALE, PROGRAM_DEFAULTS, ringArea, multiPolyArea, shapeToRing, buildFloorList, buildPlates, computeMetrics, groupFloors };
})();

/* ---- src/tower/envelope.js ---- */
const Env = (() => {
/* ==========================================================================
   envelope.js — zoning envelope for the tower generator (Agent E)

   Units: feet, square feet. Plan coordinates (x, y); front = -y, back = +y,
   left = -x, right = +x. Elevation z is up.

   Public API (see docs/module-contracts.md):
     allowedFootprint(state, z)
     envelopeWireframe(state, topZ)
     checkEnvelope(state, plates, solids)
   Extra helper: describeFloors(numbers)  (grouped floor text, en-dash ranges)

   Clipper (globalThis.ClipperLib) works in integers; SCALE = 1000 so one
   unit is 0.001 ft. SCALE stays inside this module.

   --- Method notes ---------------------------------------------------------
   Rect site: the allowed footprint is exact:
     x in [-w/2 + left, +w/2 - right], y in [-d/2 + front, +d/2 - back].

   Polygon site (site.points):
     1. Make the ring counter-clockwise and drop duplicate / collinear points.
     2. For every edge compute the OUTWARD normal n = (dy, -dx) / |d|.
        Classify the edge to the side whose axis the normal is closest to:
        front (0,-1), back (0,+1), left (-1,0), right (+1,0), i.e. the
        largest of  -ny, +ny, -nx, +nx.  Ties (exact 45 degrees) resolve in
        the order front, back, left, right.
     3. Move each edge inward along its inward normal by the setback of its
        side. The new vertices are the intersections of adjacent moved edge
        lines (a mitered offset with a different distance per edge).
     4. Resolve self-intersections caused by oversized setbacks: the moved
        ring is intersected with the site ring using the positive fill rule,
        so inverted loops disappear and the result never leaves the site.
   Stepback: above `aboveHeight` the base allowed footprint is offset inward
   by `distance` on all sides (Clipper mitered offset).
   ========================================================================== */

const SCALE = 1000;

const AREA_TOL = 1;          // sf: a plate is "outside" above this area
const H_TOL = 0.01;          // ft: height tolerance
const STEP_EPS = 1e-6;

const C = () => globalThis.ClipperLib;

/* ---------------- small helpers ---------------- */

function num(v, d = 0) {
  const n = typeof v === "number" ? v : parseFloat(v);
  return Number.isFinite(n) ? n : d;
}

function ringSignedArea(r) {
  let a = 0;
  for (let i = 0, n = r.length; i < n; i++) {
    const p = r[i], q = r[(i + 1) % n];
    a += p[0] * q[1] - q[0] * p[1];
  }
  return a / 2;
}

function multiPolyArea(mp) {
  let a = 0;
  for (const poly of mp) {
    a += Math.abs(ringSignedArea(poly.outer));
    for (const h of poly.holes || []) a -= Math.abs(ringSignedArea(h));
  }
  return a;
}

function cloneMultiPoly(mp) {
  return (mp || []).map((p) => ({
    outer: p.outer.map((q) => [q[0], q[1]]),
    holes: (p.holes || []).map((h) => h.map((q) => [q[0], q[1]])),
  }));
}

/* ---------------- Clipper plumbing ---------------- */

const ringToPath = (ring) => ring.map((p) => ({ X: Math.round(p[0] * SCALE), Y: Math.round(p[1] * SCALE) }));
const pathToRing = (path) => path.map((p) => [p.X / SCALE, p.Y / SCALE]);

function mpToPaths(mp) {
  const paths = [];
  for (const poly of mp || []) {
    if (poly.outer && poly.outer.length >= 3) paths.push(ringToPath(poly.outer));
    for (const h of poly.holes || []) if (h.length >= 3) paths.push(ringToPath(h));
  }
  return paths;
}

/** Convert a Clipper PolyTree to a MultiPoly (outers CCW, holes CW). */
function treeToMultiPoly(tree) {
  const out = [];
  const ccw = (ring) => (ringSignedArea(ring) < 0 ? ring.slice().reverse() : ring);
  const cw = (ring) => (ringSignedArea(ring) > 0 ? ring.slice().reverse() : ring);
  const visit = (node) => {
    for (const child of node.Childs()) {
      if (!child.IsHole()) {
        const poly = { outer: ccw(pathToRing(child.Contour())), holes: [] };
        for (const hole of child.Childs()) {
          poly.holes.push(cw(pathToRing(hole.Contour())));
          visit(hole);                       // islands inside holes
        }
        if (Math.abs(ringSignedArea(poly.outer)) > 1e-9) out.push(poly);
      } else {
        visit(child);
      }
    }
  };
  visit(tree);
  return out;
}

/** Boolean op on two MultiPolys. EvenOdd fill makes the winding of the inputs irrelevant. */
function boolOp(subj, clip, type, subjFill, clipFill) {
  const L = C();
  const cl = new L.Clipper();
  cl.AddPaths(mpToPaths(subj), L.PolyType.ptSubject, true);
  if (clip) cl.AddPaths(mpToPaths(clip), L.PolyType.ptClip, true);
  const tree = new L.PolyTree();
  cl.Execute(type, tree,
    subjFill || L.PolyFillType.pftEvenOdd,
    clipFill || L.PolyFillType.pftEvenOdd);
  return treeToMultiPoly(tree);
}

/** Area (sf) of subject minus clip, without building a tree. */
function differenceArea(subj, clip) {
  if (!subj.length) return 0;
  const L = C();
  const cl = new L.Clipper();
  cl.AddPaths(mpToPaths(subj), L.PolyType.ptSubject, true);
  if (clip && clip.length) cl.AddPaths(mpToPaths(clip), L.PolyType.ptClip, true);
  const sol = [];
  cl.Execute(L.ClipType.ctDifference, sol, L.PolyFillType.pftEvenOdd, L.PolyFillType.pftEvenOdd);
  let a = 0;
  for (const p of sol) a += L.Clipper.Area(p);       // outers positive, holes negative
  return Math.abs(a) / (SCALE * SCALE);
}

function offsetMultiPoly(mp, delta) {
  const L = C();
  const co = new L.ClipperOffset(10, 0.25);
  co.AddPaths(mpToPaths(mp), L.JoinType.jtMiter, L.EndType.etClosedPolygon);
  const tree = new L.PolyTree();
  co.Execute(tree, delta * SCALE);
  return treeToMultiPoly(tree);
}

/* ---------------- site and setbacks ---------------- */

function setbacksOf(state) {
  const sb = (state.site && state.site.setbacks) || {};
  const g = (k) => Math.max(0, num(sb[k], 0));
  return { front: g("front"), back: g("back"), left: g("left"), right: g("right") };
}

function usePolygonSite(state) {
  const s = state.site || {};
  return s.shape === "polygon" && Array.isArray(s.points) && s.points.length >= 3;
}

function rectRing(w, d) {
  return [[-w / 2, -d / 2], [w / 2, -d / 2], [w / 2, d / 2], [-w / 2, d / 2]];
}

/** Site ring, counter-clockwise, cleaned of duplicate and collinear points. */
function siteRing(state) {
  const s = state.site || {};
  if (!usePolygonSite(state)) return rectRing(Math.max(0, num(s.width, 0)), Math.max(0, num(s.depth, 0)));
  let ring = s.points.map((p) => [num(p[0]), num(p[1])]);
  if (ringSignedArea(ring) < 0) ring.reverse();
  // drop duplicates and collinear points (repeat until stable)
  for (let changed = true; changed && ring.length >= 3;) {
    changed = false;
    for (let i = 0; i < ring.length; i++) {
      const a = ring[(i + ring.length - 1) % ring.length], b = ring[i], c = ring[(i + 1) % ring.length];
      const cross = (b[0] - a[0]) * (c[1] - b[1]) - (b[1] - a[1]) * (c[0] - b[0]);
      const dup = Math.hypot(b[0] - a[0], b[1] - a[1]) < 1e-9;
      if (dup || Math.abs(cross) < 1e-9 * Math.max(1, Math.hypot(b[0] - a[0], b[1] - a[1]) * Math.hypot(c[0] - b[0], c[1] - b[1]))) {
        ring.splice(i, 1);
        changed = true;
        break;
      }
    }
  }
  return ring;
}

/** Classify an edge by its outward normal: "front" | "back" | "left" | "right". */
function classifyEdge(a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const len = Math.hypot(dx, dy) || 1;
  const nx = dy / len, ny = -dx / len;           // outward normal for a CCW ring
  const scores = [["front", -ny], ["back", ny], ["left", -nx], ["right", nx]];
  let best = scores[0];
  for (const s of scores) if (s[1] > best[1] + 1e-9) best = s;
  return best[0];
}

/** Mitered inward offset of a CCW ring with one distance per edge. */
function offsetRingPerEdge(ring, dist) {
  const n = ring.length;
  const m = ring.map((a, i) => {                  // inward unit normals
    const b = ring[(i + 1) % n];
    const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;
    return [-dy / len, dx / len];
  });
  const out = [];
  for (let i = 0; i < n; i++) {
    const ea = (i + n - 1) % n, eb = i;           // edges meeting at vertex i
    const ma = m[ea], mb = m[eb], sa = dist[ea], sb = dist[eb], v = ring[i];
    const det = ma[0] * mb[1] - ma[1] * mb[0];
    if (Math.abs(det) < 1e-9) {
      const s = (sa + sb) / 2;
      out.push([v[0] + ma[0] * s, v[1] + ma[1] * s]);
    } else {
      // solve ma.(X - v) = sa,  mb.(X - v) = sb
      const x = (sa * mb[1] - sb * ma[1]) / det;
      const y = (ma[0] * sb - mb[0] * sa) / det;
      out.push([v[0] + x, v[1] + y]);
    }
  }
  return out;
}

/** Base allowed footprint: site minus side setbacks. Returns MultiPoly. */
function baseFootprint(state) {
  const sb = setbacksOf(state);
  const s = state.site || {};
  if (!usePolygonSite(state)) {
    const w = Math.max(0, num(s.width, 0)), d = Math.max(0, num(s.depth, 0));
    const x0 = -w / 2 + sb.left, x1 = w / 2 - sb.right;
    const y0 = -d / 2 + sb.front, y1 = d / 2 - sb.back;
    if (x1 - x0 <= 1e-9 || y1 - y0 <= 1e-9) return [];
    return [{ outer: [[x0, y0], [x1, y0], [x1, y1], [x0, y1]], holes: [] }];
  }
  const ring = siteRing(state);
  if (ring.length < 3) return [];
  const dist = ring.map((a, i) => sb[classifyEdge(a, ring[(i + 1) % ring.length])]);
  const moved = offsetRingPerEdge(ring, dist);
  const L = C();
  const cl = new L.Clipper();
  cl.AddPath(ringToPath(moved), L.PolyType.ptSubject, true);
  cl.AddPath(ringToPath(ring), L.PolyType.ptClip, true);
  const tree = new L.PolyTree();
  cl.Execute(L.ClipType.ctIntersection, tree, L.PolyFillType.pftPositive, L.PolyFillType.pftNonZero);
  return treeToMultiPoly(tree);
}

function stepbackOf(state) {
  const sb = (state.site && state.site.stepback) || {};
  const distance = Math.max(0, num(sb.distance, 0));
  return { on: !!sb.on && distance > 0, aboveHeight: Math.max(0, num(sb.aboveHeight, 0)), distance };
}

function stepFootprint(state, base) {
  const sb = stepbackOf(state);
  return offsetMultiPoly(base, -sb.distance);
}

/* ---------------- public: allowed footprint ---------------- */

/** MultiPoly allowed at elevation z. Stepback applies for z strictly above aboveHeight. */
function allowedFootprint(state, z) {
  const base = baseFootprint(state);
  const sb = stepbackOf(state);
  if (sb.on && z > sb.aboveHeight + STEP_EPS) return stepFootprint(state, base);
  return base;
}

/* ---------------- public: wireframe ---------------- */

/** Prisms to draw. Height = heightLimit if set, else topZ. */
function envelopeWireframe(state, topZ) {
  const limit = Math.max(0, num(state.site && state.site.heightLimit, 0));
  const top = limit > 0 ? limit : num(topZ, 0);
  if (!(top > 0)) return [];
  const base = baseFootprint(state);
  if (!base.length) return [];
  const sb = stepbackOf(state);
  if (sb.on && sb.aboveHeight < top - STEP_EPS) {
    const out = [];
    if (sb.aboveHeight > 0) out.push({ polygons: base, z0: 0, z1: sb.aboveHeight });
    const step = stepFootprint(state, base);
    if (step.length) out.push({ polygons: step, z0: sb.aboveHeight, z1: top });
    return out;
  }
  return [{ polygons: base, z0: 0, z1: top }];
}

/* ---------------- floor grouping text ---------------- */

/** [31,32,33,34,40] -> "Floors 31–34 and 40"; [5] -> "Floor 5". */
function describeFloors(numbers) {
  const nums = [...new Set(numbers)].sort((a, b) => a - b);
  if (!nums.length) return "";
  const groups = [];
  for (const n of nums) {
    const g = groups[groups.length - 1];
    if (g && n === g[1] + 1) g[1] = n; else groups.push([n, n]);
  }
  const parts = groups.map(([a, b]) => (a === b ? `${a}` : `${a}–${b}`));
  const list = parts.length === 1 ? parts[0]
    : parts.slice(0, -1).join(", ") + " and " + parts[parts.length - 1];
  return (nums.length === 1 ? "Floor " : "Floors ") + list;
}

function floorWarning(code, floors, verbSingular, verbPlural, tail) {
  const text = describeFloors(floors);
  return {
    code, severity: "error", floors: floors.slice().sort((a, b) => a - b),
    message: `${text} ${floors.length === 1 ? verbSingular : verbPlural} ${tail}.`,
  };
}

/* ---------------- public: check ---------------- */

function solidMaxZ(s) {
  if (s.kind === "mesh") {
    let m = -Infinity;
    const p = s.positions || [];
    for (let i = 2; i < p.length; i += 3) if (p[i] > m) m = p[i];
    return m;
  }
  return Math.max(num(s.z0, -Infinity), num(s.z1, -Infinity));
}

function copyPlate(p) {
  return {
    ...p,
    polygons: cloneMultiPoly(p.polygons),
    coreRect: p.coreRect ? p.coreRect.map((q) => [q[0], q[1]]) : p.coreRect,
  };
}

/**
 * @returns {{plates: object[], outside: Map<number, number>, solidsOutside: boolean[], warnings: object[]}}
 */
function checkEnvelope(state, plates, solids = []) {
  const limit = Math.max(0, num(state.site && state.site.heightLimit, 0));
  const sb = stepbackOf(state);
  const base = baseFootprint(state);
  const step = sb.on ? stepFootprint(state, base) : base;

  const outside = new Map();
  const heightFloors = [], setbackFloors = [], stepbackFloors = [];
  const outPlates = [];

  for (const src of plates || []) {
    const p = copyPlate(src);
    const top = num(p.z, 0) + num(p.ftf, 0);
    // The floor is in the stepback zone if any part of it lies above aboveHeight.
    const stepped = sb.on && top > sb.aboveHeight + H_TOL;
    const allowed = stepped ? step : base;

    const area = differenceArea(p.polygons, allowed);
    p.outsideEnvelopeArea = area;
    outside.set(p.n, area);

    if (limit > 0 && top > limit + H_TOL) heightFloors.push(p.n);
    if (area > AREA_TOL) {
      // Which rule? If the plate already breaks the base (setback) footprint it is a setback
      // problem; otherwise it only breaks the stepped footprint.
      const baseOver = stepped ? differenceArea(p.polygons, base) : area;
      if (baseOver > AREA_TOL) setbackFloors.push(p.n); else stepbackFloors.push(p.n);
    }
    outPlates.push(p);
  }

  const solidsOutside = (solids || []).map((s) => limit > 0 && solidMaxZ(s) > limit + H_TOL);

  const warnings = [];
  if (heightFloors.length) warnings.push(floorWarning("height", heightFloors, "exceeds", "exceed", "the height limit"));
  if (setbackFloors.length) warnings.push(floorWarning("setback", setbackFloors, "extends", "extend", "past the setbacks"));
  if (stepbackFloors.length) warnings.push(floorWarning("stepback", stepbackFloors, "extends", "extend", "past the stepback"));
  if (solidsOutside.some(Boolean)) {
    warnings.push({ code: "crown-height", severity: "error", floors: [], message: "The crown exceeds the height limit." });
  }

  return { plates: outPlates, outside, solidsOutside, warnings };
}

return { SCALE, allowedFootprint, envelopeWireframe, describeFloors, checkEnvelope };
})();

/* ---- src/tower/snap.js ---- */
const SnapMod = (() => {
/* ==========================================================================
   snap.js — snapping for direct editing in the tower generator (v1.1)

   Pure: no DOM, no three. Plan coordinates in feet, north = +y.
   Contract: docs/v1.1-spec.md, "Contract: src/tower/snap.js".

   A target line: { axis: "x" | "y", value, kind, label, from, to }
     axis "x" = a vertical line in plan at x = value (it constrains x);
                from/to = its y extent (used to draw the guide).
     axis "y" = a horizontal line at y = value; from/to = its x extent.
     kind: "grid" | "site" | "setback" | "podium" | "segment" | "context".

   Public API:
     collectSnapTargets(state, plates, { exclude })        → { lines }
     snapMove(box, delta, targets, { tolerance, grid, enabled }) → { dx, dy, guides }
     snapEdge(value, axis, targets, { tolerance, grid, enabled, span }) → { value, guide }
     snapLength(length, { step })                          → number
   Extra helper (not in the contract, for the UI):
     itemBox(state, plates, { kind, index })               → box | null

   Notes
   - `plates` may be the Plate[] from buildPlates(...).plates or the whole
     buildPlates result. A segment's box is the bbox of its first tower plate
     (so rotation, taper at t = 0 and offset are included). When a segment or
     the podium has no plate (empty, or plates not passed), the box falls back
     to the shape from the state (rotated and offset).
   - Context blocks are targets unless state.context.show === false.
   - Ties: candidates within 0.25 ft of the best distance are compared by
     priority segment > podium > context > setback > site > grid, then by
     distance.
   - Grid is a fallback per axis: only when no line on that axis is within
     tolerance and grid > 0 does the moved min edge snap to the nearest grid
     line (any distance). A line within tolerance therefore always beats the
     grid (priority "grid" is last). Grid guides have kind "grid"; the UI may
     choose not to draw them.
   ========================================================================== */

const { allowedFootprint } = Env;
const { shapeToRing } = Geo;

const TIE = 0.25;   // ft
const EPS = 1e-9;
const PRIORITY = { segment: 6, podium: 5, context: 4, setback: 3, site: 2, grid: 1 };

const DIR = {
  x: { min: "west", max: "east" },
  y: { min: "south", max: "north" },
};

function num(v, d = 0) {
  const n = typeof v === "number" ? v : parseFloat(v);
  return Number.isFinite(n) ? n : d;
}

/* ------------------------------------------------------------ boxes */

function emptyBox() {
  return { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };
}

function growRing(b, ring) {
  for (const q of ring) {
    if (q[0] < b.minX) b.minX = q[0];
    if (q[0] > b.maxX) b.maxX = q[0];
    if (q[1] < b.minY) b.minY = q[1];
    if (q[1] > b.maxY) b.maxY = q[1];
  }
  return b;
}

function mpBox(mp) {
  const b = emptyBox();
  for (const p of mp || []) if (p && p.outer) growRing(b, p.outer);
  return validBox(b) ? b : null;
}

function validBox(b) {
  return !!b && Number.isFinite(b.minX) && Number.isFinite(b.maxX) &&
    Number.isFinite(b.minY) && Number.isFinite(b.maxY) && b.maxX >= b.minX && b.maxY >= b.minY;
}

function plateList(plates) {
  if (Array.isArray(plates)) return plates;
  if (plates && Array.isArray(plates.plates)) return plates.plates;
  return [];
}

/** Box of a shape placed with rotation (deg, about the shape's origin) and offset. */
function shapeBox(shape, rotation, ox, oy) {
  const ring = shapeToRing(shape, { segments: 32 });
  if (ring.length < 3) return null;
  const th = (num(rotation, 0) * Math.PI) / 180;
  const c = Math.cos(th), s = Math.sin(th);
  const b = emptyBox();
  for (const q of ring) {
    const x = q[0] * c - q[1] * s + ox, y = q[0] * s + q[1] * c + oy;
    if (x < b.minX) b.minX = x; if (x > b.maxX) b.maxX = x;
    if (y < b.minY) b.minY = y; if (y > b.maxY) b.maxY = y;
  }
  return validBox(b) ? b : null;
}

/** First-plate boxes: { podium: box|null, segments: Map<index, box> } in one pass. */
function plateBoxes(plates) {
  let podium = null;
  const segments = new Map();
  for (const p of plateList(plates)) {
    if (!p || p.void) continue;
    if (p.zone === "podium") {
      if (!podium) podium = mpBox(p.polygons);
    } else if (p.zone === "tower") {
      const i = p.segmentIndex;
      if (!segments.has(i)) {
        const b = mpBox(p.polygons);
        if (b) segments.set(i, b);
      }
    }
  }
  return { podium, segments };
}

function podiumFallback(state) {
  const pod = state && state.podium;
  if (!pod || !pod.on) return null;
  return shapeBox(pod.shape, 0, num(pod.offset && pod.offset.x, 0), num(pod.offset && pod.offset.y, 0));
}

function segmentFallback(state, i) {
  const seg = state && Array.isArray(state.segments) ? state.segments[i] : null;
  if (!seg) return null;
  return shapeBox(seg.shape, num(seg.rotation, 0), num(seg.offset && seg.offset.x, 0), num(seg.offset && seg.offset.y, 0));
}

function contextBox(b) {
  const w = num(b && b.w, 0), d = num(b && b.d, 0);
  if (!(w > 0 && d > 0)) return null;
  const x = num(b.x, 0), y = num(b.y, 0);
  return { minX: x - w / 2, maxX: x + w / 2, minY: y - d / 2, maxY: y + d / 2 };
}

function contextShown(state) {
  return !!(state && state.context && state.context.show !== false && Array.isArray(state.context.blocks));
}

/**
 * Plan box of an item, for the UI to pass to snapMove (extra helper).
 * kind "segment" → bbox of its first plate; "podium" → podium plate bbox;
 * "context" → x ± w/2, y ± d/2. Anything else → null.
 */
function itemBox(state, plates, item) {
  if (!item) return null;
  const i = num(item.index, 0);
  if (item.kind === "context") {
    const blocks = (state && state.context && state.context.blocks) || [];
    return contextBox(blocks[i]);
  }
  if (item.kind === "podium") return plateBoxes(plates).podium || podiumFallback(state);
  if (item.kind === "segment") return plateBoxes(plates).segments.get(i) || segmentFallback(state, i);
  return null;
}

/* ------------------------------------------------------------ targets */

function boxLines(out, b, kind, name, withCenter) {
  out.push({ axis: "x", value: b.minX, kind, label: `${name} west edge`, from: b.minY, to: b.maxY });
  out.push({ axis: "x", value: b.maxX, kind, label: `${name} east edge`, from: b.minY, to: b.maxY });
  out.push({ axis: "y", value: b.minY, kind, label: `${name} south edge`, from: b.minX, to: b.maxX });
  out.push({ axis: "y", value: b.maxY, kind, label: `${name} north edge`, from: b.minX, to: b.maxX });
  if (withCenter) {
    out.push({ axis: "x", value: (b.minX + b.maxX) / 2, kind, label: `${name} center`, from: b.minY, to: b.maxY });
    out.push({ axis: "y", value: (b.minY + b.maxY) / 2, kind, label: `${name} center`, from: b.minX, to: b.maxX });
  }
}

function usePolygonSite(site) {
  return site && site.shape === "polygon" && Array.isArray(site.points) && site.points.length >= 3;
}

function siteLines(out, state) {
  const site = (state && state.site) || {};
  if (usePolygonSite(site)) {
    const pts = site.points.map((p) => [num(p[0]), num(p[1])]);
    const b = growRing(emptyBox(), pts);
    if (!validBox(b)) return;
    boxLines(out, b, "site", "Site", false);
    // axis-aligned polygon edges that are not already on the bbox
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], c = pts[(i + 1) % pts.length];
      if (Math.abs(a[0] - c[0]) < EPS && Math.abs(a[1] - c[1]) > EPS) {
        if (Math.abs(a[0] - b.minX) < EPS || Math.abs(a[0] - b.maxX) < EPS) continue;
        out.push({ axis: "x", value: a[0], kind: "site", label: "Site edge",
          from: Math.min(a[1], c[1]), to: Math.max(a[1], c[1]) });
      } else if (Math.abs(a[1] - c[1]) < EPS && Math.abs(a[0] - c[0]) > EPS) {
        if (Math.abs(a[1] - b.minY) < EPS || Math.abs(a[1] - b.maxY) < EPS) continue;
        out.push({ axis: "y", value: a[1], kind: "site", label: "Site edge",
          from: Math.min(a[0], c[0]), to: Math.max(a[0], c[0]) });
      }
    }
    return;
  }
  const w = Math.max(0, num(site.width, 0)), d = Math.max(0, num(site.depth, 0));
  if (!(w > 0 && d > 0)) return;
  boxLines(out, { minX: -w / 2, maxX: w / 2, minY: -d / 2, maxY: d / 2 }, "site", "Site", false);
}

function setbackLines(out, state) {
  if (!state || !state.site) return;
  let mp;
  try { mp = allowedFootprint(state, 0); } catch (e) { return; }   // polygon site without Clipper
  const b = mpBox(mp);
  if (!b) return;
  out.push({ axis: "x", value: b.minX, kind: "setback", label: "West setback line", from: b.minY, to: b.maxY });
  out.push({ axis: "x", value: b.maxX, kind: "setback", label: "East setback line", from: b.minY, to: b.maxY });
  out.push({ axis: "y", value: b.minY, kind: "setback", label: "South setback line", from: b.minX, to: b.maxX });
  out.push({ axis: "y", value: b.maxY, kind: "setback", label: "North setback line", from: b.minX, to: b.maxX });
}

/**
 * All snap lines for a drag. exclude: { kind, index } of the item being moved.
 * → { lines: Line[] }
 */
function collectSnapTargets(state, plates, { exclude } = {}) {
  state = state || {};
  const lines = [];
  const ex = exclude || {};
  const exIndex = num(ex.index, -1);

  siteLines(lines, state);
  setbackLines(lines, state);

  const pb = plateBoxes(plates);

  if (ex.kind !== "podium" && state.podium && state.podium.on) {
    const b = pb.podium || podiumFallback(state);
    if (b) boxLines(lines, b, "podium", "Podium", true);
  }

  const segs = Array.isArray(state.segments) ? state.segments : [];
  for (let i = 0; i < segs.length; i++) {
    if (ex.kind === "segment" && exIndex === i) continue;
    const b = pb.segments.get(i) || segmentFallback(state, i);
    if (b) boxLines(lines, b, "segment", `Segment ${i + 1}`, true);
  }

  if (contextShown(state)) {
    const blocks = state.context.blocks;
    for (let i = 0; i < blocks.length; i++) {
      if (ex.kind === "context" && exIndex === i) continue;
      const b = contextBox(blocks[i]);
      if (b) boxLines(lines, b, "context", `Context block ${i + 1}`, true);
    }
  }

  return { lines };
}

/* ------------------------------------------------------------ snapping */

function targetLines(targets) {
  if (Array.isArray(targets)) return targets;
  return (targets && Array.isArray(targets.lines)) ? targets.lines : [];
}

/** Pick among candidates { d, line, feature }: best distance, ties (0.25 ft) by priority. */
function pick(cands) {
  if (!cands.length) return null;
  let m = Infinity;
  for (const c of cands) if (Math.abs(c.d) < m) m = Math.abs(c.d);
  let best = null;
  for (const c of cands) {
    const a = Math.abs(c.d);
    if (a > m + TIE + EPS) continue;
    if (!best) { best = c; continue; }
    const pc = PRIORITY[c.line.kind] || 0, pbst = PRIORITY[best.line.kind] || 0;
    if (pc > pbst || (pc === pbst && a < Math.abs(best.d))) best = c;
  }
  return best;
}

function gridLine(axis, value, grid) {
  return { axis, value, kind: "grid", label: `Grid ${grid} ft`, from: 0, to: 0 };
}

/** Snap one axis. features: [[name, coord], ...]; min edge first (used for grid). */
function snapAxis(axis, features, lines, tolerance, grid) {
  const cands = [];
  for (const line of lines) {
    if (!line || line.axis !== axis || !Number.isFinite(line.value)) continue;
    for (const [feature, v] of features) {
      const d = line.value - v;
      if (Math.abs(d) <= tolerance + EPS) cands.push({ d, line, feature });
    }
  }
  const hit = pick(cands);
  if (hit || !(grid > 0)) return hit;
  // fallback: the min edge (or the single edge) to the nearest grid line
  const v = features[0][1];
  const g = Math.round(v / grid) * grid;
  return { d: g - v, line: gridLine(axis, g, grid), feature: features[0][0] };
}

/**
 * Snap a moving box. box: { minX, maxX, minY, maxY } before the move; delta: { dx, dy } raw.
 * → { dx, dy, guides }
 */
function snapMove(box, delta, targets, { tolerance = 0, grid = 0, enabled = true } = {}) {
  const rdx = num(delta && delta.dx, 0), rdy = num(delta && delta.dy, 0);
  if (!enabled || !box) return { dx: rdx, dy: rdy, guides: [] };
  const lines = targetLines(targets);
  const tol = Math.max(0, num(tolerance, 0));
  const g = Math.max(0, num(grid, 0));

  const x0 = box.minX + rdx, x1 = box.maxX + rdx;
  const y0 = box.minY + rdy, y1 = box.maxY + rdy;
  const hx = snapAxis("x", [["min", x0], ["max", x1], ["center", (x0 + x1) / 2]], lines, tol, g);
  const hy = snapAxis("y", [["min", y0], ["max", y1], ["center", (y0 + y1) / 2]], lines, tol, g);

  const dx = rdx + (hx ? hx.d : 0);
  const dy = rdy + (hy ? hy.d : 0);
  const m = { minX: box.minX + dx, maxX: box.maxX + dx, minY: box.minY + dy, maxY: box.maxY + dy };

  const guides = [];
  if (hx) {
    const L = hx.line, grid0 = L.kind === "grid";
    guides.push({ ...L, from: grid0 ? m.minY : Math.min(L.from, m.minY), to: grid0 ? m.maxY : Math.max(L.to, m.maxY), feature: hx.feature });
  }
  if (hy) {
    const L = hy.line, grid0 = L.kind === "grid";
    guides.push({ ...L, from: grid0 ? m.minX : Math.min(L.from, m.minX), to: grid0 ? m.maxX : Math.max(L.to, m.maxX), feature: hy.feature });
  }
  return { dx, dy, guides };
}

/**
 * Snap one moving edge coordinate (resize handles).
 * span (optional extra): { from, to } extent of the moving edge, used to widen the guide.
 * → { value, guide }   (a grid snap returns a guide only when span is given)
 */
function snapEdge(value, axis, targets, { tolerance = 0, grid = 0, enabled = true, span } = {}) {
  const v = num(value, 0);
  if (!enabled) return { value: v, guide: null };
  const lines = targetLines(targets);
  const tol = Math.max(0, num(tolerance, 0));
  const g = Math.max(0, num(grid, 0));
  const hit = snapAxis(axis, [["edge", v]], lines, tol, g);
  if (!hit) return { value: v, guide: null };
  const out = v + hit.d;
  const L = hit.line;
  const hasSpan = span && Number.isFinite(span.from) && Number.isFinite(span.to);
  if (L.kind === "grid") {
    if (!hasSpan) return { value: out, guide: null };
    return { value: out, guide: { ...L, from: Math.min(span.from, span.to), to: Math.max(span.from, span.to) } };
  }
  const guide = { ...L };
  if (hasSpan) {
    guide.from = Math.min(L.from, span.from, span.to);
    guide.to = Math.max(L.to, span.from, span.to);
  }
  return { value: out, guide };
}

/** Round a dimension to the step (1 ft default). */
function snapLength(length, { step = 1 } = {}) {
  const L = num(length, 0);
  const s = num(step, 1);
  if (!(s > 0)) return L;
  const r = Math.round(L / s) * s;
  const clean = Math.round(r * 1e9) / 1e9;
  return clean === 0 ? 0 : clean;
}

return { itemBox, collectSnapTargets, snapMove, snapEdge, snapLength };
})();

// Full prompt text: FORM_LOCK + blank line + template, with every {{token}} replaced.
// Value order (later wins): PROMPT_FIELDS defaults < prompt.defaults < values.
// Empty, null, or undefined entries in values do not override a default.
// Unknown tokens stay visible as [token].
function fillPrompt(prompt, values = {}) {
  const merged = {};
  for (const [key, field] of Object.entries(PROMPT_FIELDS)) merged[key] = field.default;
  for (const [key, v] of Object.entries((prompt && prompt.defaults) || {})) {
    if (v !== undefined && v !== null && v !== "") merged[key] = v;
  }
  for (const [key, v] of Object.entries(values || {})) {
    if (v !== undefined && v !== null && v !== "") merged[key] = v;
  }
  const text = FORM_LOCK + "\n\n" + ((prompt && prompt.template) || "");
  return text
    .replace(/\{\{\s*([A-Za-z0-9_]+)\s*\}\}/g, (_, key) =>
      Object.prototype.hasOwnProperty.call(merged, key) ? String(merged[key]) : `[${key}]`)
    .replace(/[ \t]{2,}/g, " ")
    .replace(/ +\n/g, "\n")
    .trim();
}
