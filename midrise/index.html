// Court bars for the templates. The court is w wide (x) and h high (y), centered at (cx, cy). Bars are d deep.
// Kinds:
//   O  four bars around a closed court (preset 8.4; the wrap uses it with the deck plus two gaps as the court).
//      The south and north bars are full width w + 2d. The side bars are full height h + 2d.
//   U  three bars: south, west, east. The side bars stop at the north edge of the court, so the court is open to the north.
//   L  two bars: south and west. Open to the north and east.
//   E  a spine on the west (height h + 2d) and three arms running east (length w + d): south, middle, north.
//      Each court sits between two arms and is open to the east.
// Corners overlap by d x d, so each corner is one L joint. Arm ends follow preset 8.6: start open, end stair.
function courtBars(kind, w, h, d, cx, cy, floors) {
  const x0 = cx - (w + 2 * d) / 2;      // start x of the south and north bars
  const yBottom = cy - (h + 2 * d) / 2; // start y of a side bar that runs the full height
  const yS = cy - (h + d) / 2;          // centerline y of the south bar
  const yN = cy + (h + d) / 2;          // centerline y of the north bar
  const xW = cx - (w + d) / 2;          // centerline x of the west bar
  const xE = cx + (w + d) / 2;          // centerline x of the east bar
  const stairs = pair('stair', 'stair');
  const opens = pair('open', 'open');
  const arm = pair('open', 'stair');    // a bar that joins another at its start
  const south = () => bar({ id: 'S', x: x0, y: yS, angle: 0, length: w + 2 * d, floors, depth: d, ends: stairs });

  switch (kind) {
    case 'O':
      return [
        south(),
        bar({ id: 'N', x: x0, y: yN, angle: 0, length: w + 2 * d, floors, depth: d, ends: stairs }),
        bar({ id: 'W', x: xW, y: yBottom, angle: 90, length: h + 2 * d, floors, depth: d, ends: opens }),
        bar({ id: 'E', x: xE, y: yBottom, angle: 90, length: h + 2 * d, floors, depth: d, ends: opens }),
      ];
    case 'U':
      return [
        south(),
        bar({ id: 'W', x: xW, y: yBottom, angle: 90, length: h + d, floors, depth: d, ends: arm }),
        bar({ id: 'E', x: xE, y: yBottom, angle: 90, length: h + d, floors, depth: d, ends: arm }),
      ];
    case 'L':
      return [
        south(),
        bar({ id: 'W', x: xW, y: yBottom, angle: 90, length: h + d, floors, depth: d, ends: arm }),
      ];
    case 'E':
      return [
        bar({ id: 'W', x: xW, y: yBottom, angle: 90, length: h + 2 * d, floors, depth: d, ends: stairs }),
        bar({ id: 'S', x: xW, y: yS, angle: 0, length: w + d, floors, depth: d, ends: arm }),
        bar({ id: 'M', x: xW, y: cy, angle: 0, length: w + d, floors, depth: d, ends: arm }),
        bar({ id: 'N', x: xW, y: yN, angle: 0, length: w + d, floors, depth: d, ends: arm }),
      ];
    default:
      throw new Error(`courtBars: unknown kind "${kind}"`);
  }
}

// Open court objects for a court template (plan section 1.2). The O kind has none: its court is the closed
// hole in the plate union.
function courtRecords(kind, w, h, d, cx, cy) {
  if (kind === 'O') return [];
  if (kind === 'E') {
    const ch = (h - d) / 2;   // height of each court between two arms
    const off = (h + d) / 4;  // each court center sits this far from cy
    return [
      { id: 'C1', x: cx, y: cy - off, w, d: ch },
      { id: 'C2', x: cx, y: cy + off, w, d: ch },
    ];
  }
  return [{ id: 'C1', x: cx, y: cy, w, d: h }]; // U and L: open on the north side
}

// Each template type starts from the preset listed here.
const TEMPLATE_SOURCE = {
  garden: 'garden-walkup',
  'corridor-garden': 'corridor-garden',
  bar: 'double-bar',
  'courtyard-L': 'courtyard-5-over-1',
  'courtyard-U': 'courtyard-5-over-1',
  'courtyard-O': 'courtyard-5-over-1',
  'courtyard-E': 'courtyard-5-over-1',
  wrap: 'wrap-deck',
  podium: 'podium-5-over-2',
};

const TEMPLATE_NAME = {
  garden: 'Garden walk-up',
  'corridor-garden': 'Corridor garden',
  bar: 'Double-loaded bar',
  'courtyard-L': 'Courtyard L',
  'courtyard-U': 'Courtyard U',
  'courtyard-O': 'Courtyard O',
  'courtyard-E': 'Courtyard E',
  wrap: 'Wrap with deck',
  podium: 'Podium',
};

// Returns a complete state for a template, built from its preset with the options applied.
// Options (all optional):
//   length            bar length in ft. Garden and bar templates only. Other templates take lengths from their shape.
//   depth             bar depth in ft, all templates (default 65; the garden template keeps its 66).
//   floors            floors per bar, all templates (default 5; the garden template keeps its 3).
//   courtW, courtD    court width (x) and court height (y) in ft. Courtyard templates default to 120 x 90 (E: 120 x 210, so each of its two courts clears courtyardMin).
//                     The podium template keeps its preset court, 170 x 135.
//   deckW, deckD      wrap deck width and depth in ft (default 300 x 125). Wrap template only.
//   deckLevels        wrap deck levels (default 5). Wrap template only.
// The wrap bars sit one WRAP_GAP (10 ft) outside the deck on every side.
function templateState(type, options = {}) {
  const sourceId = TEMPLATE_SOURCE[type];
  if (!sourceId) throw new Error(`templateState: unknown template type "${type}"`);
  const s = structuredClone(PRESETS.find((p) => p.id === sourceId).state);
  s.name = TEMPLATE_NAME[type];
  s.type = type.startsWith('courtyard') ? 'courtyard' : type;

  switch (type) {
    case 'garden':
    case 'corridor-garden':
    case 'bar': {
      const canResize = type !== 'corridor-garden'; // corridor garden lengths make its L joint, so they stay
      s.bars = s.bars.map((b) => ({
        ...b,
        length: canResize ? (options.length ?? b.length) : b.length,
        depth: options.depth ?? b.depth,
        floors: options.floors ?? b.floors,
      }));
      break;
    }
    case 'courtyard-O':
    case 'courtyard-U':
    case 'courtyard-L':
    case 'courtyard-E': {
      const kind = type.slice(-1);
      const w = options.courtW ?? 120;
      // E holds two courts in its height: (h - d) / 2 each. 210 ft gives two 72.5 ft courts, above courtyardMin 40.
      const h = options.courtD ?? (kind === 'E' ? 210 : 90);
      const d = options.depth ?? BAR_DEPTH;
      s.bars = courtBars(kind, w, h, d, 0, 0, options.floors ?? 5);
      s.courts = courtRecords(kind, w, h, d, 0, 0);
      break;
    }
    case 'podium': {
      const w = options.courtW ?? 170;
      const h = options.courtD ?? 135;
      const d = options.depth ?? BAR_DEPTH;
      s.bars = courtBars('U', w, h, d, 0, PODIUM_COURT_Y, options.floors ?? 5);
      s.courts = courtRecords('U', w, h, d, 0, PODIUM_COURT_Y);
      break;
    }
    case 'wrap': {
      const dw = options.deckW ?? 300;
      const dd = options.deckD ?? 125;
      const d = options.depth ?? BAR_DEPTH;
      s.bars = courtBars('O', dw + 2 * WRAP_GAP, dd + 2 * WRAP_GAP, d, 0, 0, options.floors ?? 5);
      s.deck = { ...s.deck, on: true, x: 0, y: 0, w: dw, d: dd, levels: options.deckLevels ?? 5 };
      break;
    }
    default:
      throw new Error(`templateState: no builder for "${type}"`);
  }
  return s;
}

return { PROGRAM_DEFAULTS, defaultState, PRESETS, templateState };
})();

/* ==========================================================================
   SHARED: units
   Feet-and-inches format, area format, and parsing of typed values.
   Feet and square feet only (version 1).
   ========================================================================== */
const Units = (() => {
  const grouped = (n, digits = 0) => n.toLocaleString('en-US', { minimumFractionDigits: digits, maximumFractionDigits: digits });

  /** 312.5 -> 312'-6"  (rounds to the nearest inch) */
  function formatFeetInches(ft) {
    if (typeof ft !== 'number' || !isFinite(ft)) return '—';
    const totalIn = Math.round(Math.abs(ft) * 12);
    const f = Math.floor(totalIn / 12), i = totalIn % 12;
    return `${ft < 0 && totalIn > 0 ? '-' : ''}${grouped(f)}'-${i}"`;
  }
  /** 100000 -> "100,000 sf" */
  function formatArea(sf) {
    if (typeof sf !== 'number' || !isFinite(sf)) return '—';
    return `${grouped(Math.round(sf) || 0)} sf`;
  }
  const formatInt = (n) => (typeof n === 'number' && isFinite(n)) ? grouped(Math.round(n) || 0) : '—';
  const formatRatio = (n, d = 2) => (typeof n === 'number' && isFinite(n)) ? grouped(n, d) : '—';
  const formatDeg = (n) => `${Math.round(n)}°`;

  /** Parse "10'-6\"", "10.5", "10'", "10' 6", "6\"", "10 ft 6 in", "10-6", "6 1/2\"" to feet. NaN when invalid. */
  function parseLength(input) {
    if (typeof input === 'number') return isFinite(input) ? input : NaN;
    let s = String(input == null ? '' : input).trim().toLowerCase();
    s = s.replace(/[, ]/g, '').replace(/[′’‘]/g, "'").replace(/[″“”]/g, '"').replace(/\s+/g, ' ');
    if (!s) return NaN;
    let sign = 1;
    if (s[0] === '-') { sign = -1; s = s.slice(1).trim(); } else if (s[0] === '+') { s = s.slice(1).trim(); }
    const NUM = '(\\d+\\.?\\d*|\\.\\d+)';
    if (new RegExp('^' + NUM + '$').test(s)) return sign * parseFloat(s);

    const parseInches = (t) => {
      t = t.trim().replace(/\s*(?:"|in\.?|inch|inches)$/, '').trim();
      if (t === '') return 0;
      let m;
      if ((m = t.match(new RegExp('^' + NUM + '$')))) return parseFloat(m[1]);
      if ((m = t.match(/^(\d+)\s*\/\s*(\d+)$/))) return +m[2] ? m[1] / m[2] : NaN;
      if ((m = t.match(new RegExp('^' + NUM + '\\s+(\\d+)\\s*/\\s*(\\d+)$')))) return +m[3] ? parseFloat(m[1]) + m[2] / m[3] : NaN;
      return NaN;
    };
    let m;
    if ((m = s.match(new RegExp('^' + NUM + "\\s*(?:'|ft\\.?|feet|foot)\\s*-?\\s*(.*)$")))) {
      const inch = parseInches(m[2]);
      return isNaN(inch) ? NaN : sign * (parseFloat(m[1]) + inch / 12);
    }
    if (/("|in\.?|inch|inches)$/.test(s)) {
      const inch = parseInches(s);
      return isNaN(inch) ? NaN : sign * inch / 12;
    }
    if ((m = s.match(new RegExp('^' + NUM + '\\s*-\\s*(.+)$')))) {   // architect shorthand: 10-6
      const inch = parseInches(m[2]);
      return isNaN(inch) ? NaN : sign * (parseFloat(m[1]) + inch / 12);
    }
    return NaN;
  }
  /** Plain number with optional unit decoration ("45°", "20%", "1,200 sf"). NaN when invalid. */
  function parseNumber(input) {
    if (typeof input === 'number') return isFinite(input) ? input : NaN;
    const s = String(input == null ? '' : input).replace(/[,\s°%]|sf$/gi, '');
    return /^[-+]?(\d+\.?\d*|\.\d+)$/.test(s) ? parseFloat(s) : NaN;
  }
  return { formatFeetInches, formatArea, formatInt, formatRatio, formatDeg, parseLength, parseNumber, grouped };
})();

/* ==========================================================================
   STATE
   The default state, defaults for a bar, and fillDefaults (older, partial or
   imported states become complete). Schema: docs/mid-rise-generator-technical-plan.md section 2.
   All lengths are feet, areas square feet, angles degrees. North = +y, east = +x.
   ========================================================================== */
const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const deepClone = (o) => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));
const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);

function defaultPrograms() {
  const programs = {};
  for (const [k, p] of Object.entries(CONFIG.programs)) {
    programs[k] = { ftf: p.ftf, unitSize: p.unitSize, unitFactor: p.unitFactor, unitWidth: p.unitWidth, parkingRatio: p.parkingRatio, color: p.color };
  }
  return programs;
}
function defaultBar(id = 'A') {
  return {
    id, name: `Bar ${id}`,
    x: -150, y: 0, angle: 0,
    length: 300, depth: 65,
    floors: 5,
    program: 'residential', groundProgram: null,
    corridor: 'double', unitSide: 'left',
    ends: { start: 'stair', end: 'stair' },
    bends: [],
    unitWidth: null,
  };
}
/** The next free bar id: A..Z, then A2..Z2, and so on. */
function nextBarId(bars) {
  const used = new Set((bars || []).map((b) => b.id));
  for (let round = 1; round < 50; round++) {
    for (let i = 0; i < 26; i++) {
      const id = String.fromCharCode(65 + i) + (round > 1 ? String(round) : '');
      if (!used.has(id)) return id;
    }
  }
  return `B${used.size + 1}`;
}

/** Fill every missing field from the defaults so older or partial states (presets, imports) are complete. */
function fillDefaults(src) {
  const s = isObj(src) ? deepClone(src) : {};
  const merge = (t, d) => {
    for (const k of Object.keys(d)) {
      if (t[k] === undefined) t[k] = deepClone(d[k]);
      else if (isObj(d[k]) && isObj(t[k])) merge(t[k], d[k]);
    }
  };
  const base = defaultState();
  const keepPlacement = s.placement;
  merge(s, base);
  if (keepPlacement === null || keepPlacement === undefined) s.placement = null;
  // view
  const v = s.view;
  if (v.colorBy !== 'bar' && v.colorBy !== 'program') v.colorBy = 'program';
  if (v.style !== 'diagram') v.style = 'model';
  v.snap = { on: v.snap.on !== false, grid: v.snap.grid === 10 ? 10 : 5 };
  // bars
  if (!Array.isArray(s.bars) || !s.bars.length) s.bars = [defaultBar('A')];
  s.bars = s.bars.filter(isObj);
  if (!s.bars.length) s.bars = [defaultBar('A')];
  const ids = new Set();
  s.bars.forEach((b) => { if (typeof b.id === 'string' && b.id && !ids.has(b.id)) ids.add(b.id); else b.id = null; });
  s.bars.forEach((b) => { if (!b.id) { b.id = nextBarId([...ids].map((id) => ({ id }))); ids.add(b.id); } });
  s.bars.forEach((b) => {
    merge(b, defaultBar('A'));
    if (typeof b.name !== 'string' || !b.name) b.name = `Bar ${b.id}`;
    if (!Array.isArray(b.bends)) b.bends = [];
    b.bends = b.bends.filter((x) => x && isFinite(x.at) && isFinite(x.deg)).slice(0, CONFIG.limits.maxBends);
    b.floors = Math.round(clamp(num(b.floors, 5), 1, CONFIG.limits.maxFloors));
  });
  if (!Array.isArray(s.courts)) s.courts = [];
  s.courts = s.courts.filter(isObj).map((c, i) => ({ id: c.id || `C${i + 1}`, x: num(c.x, 0), y: num(c.y, 0), w: num(c.w, 100), d: num(c.d, 80) }));
  if (!Array.isArray(s.podium.levels) || !s.podium.levels.length) s.podium.levels = deepClone(base.podium.levels);
  if (!Array.isArray(s.surface.lot)) s.surface.lot = [];
  if (!Array.isArray(s.context.blocks)) s.context.blocks = [];
  // programs: every program key exists and is complete
  for (const k of Object.keys(CONFIG.programs)) {
    if (!isObj(s.programs[k])) s.programs[k] = deepClone(base.programs[k]);
    const p = s.programs[k];
    merge(p, base.programs[k]);
    if (typeof p.unitFactor === 'number' && p.unitFactor > 1) p.unitFactor = p.unitFactor / 100;
  }
  s.schema = CONFIG.schema;
  s.name = String(s.name || 'Option A').slice(0, 60);

/** Saved options at an older schema step up here. Schema 1 is the first, so nothing changes yet. */
function migrateState(state /* , fromSchema */) { return state; }

/* SHARED: store. One state object; get/set by path, subscribe, undo/redo (50 steps). Live sets coalesce into one undo step on commit(). */
const Store = (() => {
  let state = defaultState();
  let version = 0;
  let gesture = null;                  // { base, path } while a live drag is open
  const past = [], future = [];
  const listeners = new Set();

  const clone = (o) => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const keysOf = (p) => (Array.isArray(p) ? p.map(String) : String(p == null ? '' : p).split('.').filter(Boolean));

  function getIn(root, ks) {
    let o = root;
    for (const k of ks) { if (o == null) return undefined; o = o[k]; }
    return o;
  }
  function setIn(root, ks, value) {
    let o = root;
    for (let i = 0; i < ks.length - 1; i++) {
      if (o[ks[i]] == null || typeof o[ks[i]] !== 'object') o[ks[i]] = /^\d+$/.test(ks[i + 1]) ? [] : {};
      o = o[ks[i]];
    }
    o[ks[ks.length - 1]] = value;
  }
  function notify(info) {
    version++;
    for (const fn of listeners) { try { fn(state, info); } catch (e) { console.error(e); } }
  }
  function pushHistory(snapshot) {
    past.push(snapshot);
    while (past.length > CONFIG.limits.maxHistory) past.shift();
    future.length = 0;
  }

  const get = (path) => getIn(state, keysOf(path));

  /** End a live gesture; it becomes a single undo step. */
  function commit() {
    if (!gesture) return false;
    const g = gesture; gesture = null;
    if (!same(g.base, state)) pushHistory(g.base);
    notify({ kind: 'commit', path: g.path, live: false });
    return true;
  }

  /** Set a value by dot path. opts.live = continuous drag (coalesced until commit()). opts.merge = no new undo step (it joins the one before). */
  function set(path, value, opts = {}) {
    const ks = keysOf(path);
    if (!ks.length) return replace(value);
    if (same(getIn(state, ks), value)) return false;
    const pathStr = ks.join('.');
    if (opts.live) {
      if (!gesture) gesture = { base: clone(state), path: pathStr };
    } else if (opts.merge) {
      if (gesture) commit();                 // follows another change: both undo together (the page keeps site neighbors in step with the placement)
    } else {
      if (gesture) commit();
      pushHistory(clone(state));
    }
    setIn(state, ks, (value !== null && typeof value === 'object') ? clone(value) : value);
    notify({ kind: 'set', path: pathStr, live: !!opts.live });
    return true;
  }
  function replace(next, opts = {}) {
    if (gesture) commit();
    if (opts.resetHistory) { past.length = 0; future.length = 0; } else pushHistory(clone(state));
    state = clone(next);
    notify({ kind: 'replace', path: '', live: false });
    return true;
  }
  function undo() {
    commit();
    if (!past.length) return false;
    future.push(clone(state));
    state = past.pop();
    notify({ kind: 'undo', path: '', live: false });
    return true;
  }
  function redo() {
    commit();
    if (!future.length) return false;
    past.push(clone(state));
    state = future.pop();
    notify({ kind: 'redo', path: '', live: false });
    return true;
  }
  function subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); }

  return {
    get, set, commit, replace, undo, redo, subscribe,
    raw: () => state,                         // live reference; treat as read-only
    snapshot: () => clone(state),
    version: () => version,
    canUndo: () => past.length > 0 || (gesture && !same(gesture.base, state)),
    canRedo: () => future.length > 0,
    gestureActive: () => !!gesture,
    gesturePath: () => (gesture ? gesture.path : ''),
    historyDepth: () => past.length,
  };
})();

/* ==========================================================================
   SITE HELPERS
   The site polygon and area, the "Surround" context set, and small plan helpers.
   The zoning rules live in src/tower/envelope.js (Env); the building geometry
   lives in src/midrise/assemble.js (AssembleMod).
   ========================================================================== */
const siteRect = (w, d) => { const x = w / 2, y = d / 2; return [[-x, -y], [x, -y], [x, y], [-x, y]]; };
function sitePolygon(state) {
  const s = state.site;
  if (s.shape === 'polygon' && Array.isArray(s.points) && s.points.length >= 3) return s.points.map((p) => [p[0], p[1]]);
  return siteRect(clamp(num(s.width, 0), 0, CONFIG.limits.maxDim * 4), clamp(num(s.depth, 0), 0, CONFIG.limits.maxDim * 4));
}
function siteArea(state) { return Math.abs(BarsMod.ringArea(sitePolygon(state))); }

/** Surround set: one block on each side of the site, 20 ft off the boundary. */
function surroundBlocks(state) {
  const ring = sitePolygon(state);
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const q of ring) { minX = Math.min(minX, q[0]); maxX = Math.max(maxX, q[0]); minY = Math.min(minY, q[1]); maxY = Math.max(maxY, q[1]); }
  if (!isFinite(minX)) return [];
  const gap = 20, depth = 80;
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2, W = maxX - minX, D = maxY - minY;
  const r = (v) => Math.round(v * 10) / 10;
  return [
    { x: r(cx), y: r(minY - gap - depth / 2), w: r(W), d: depth, h: 40 },    // front (south)
    { x: r(cx), y: r(maxY + gap + depth / 2), w: r(W), d: depth, h: 60 },    // back (north)
    { x: r(minX - gap - depth / 2), y: r(cy), w: depth, d: r(D), h: 30 },    // left (west)
    { x: r(maxX + gap + depth / 2), y: r(cy), w: depth, d: r(D), h: 50 },    // right (east)
  ];
}

/** Bounding box of a MultiPoly list, or null. */
function boxOfPolys(polys) {
  const b = { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity };
  for (const p of polys || []) for (const q of p.outer) { b.minX = Math.min(b.minX, q[0]); b.maxX = Math.max(b.maxX, q[0]); b.minY = Math.min(b.minY, q[1]); b.maxY = Math.max(b.maxY, q[1]); }
  return isFinite(b.minX) ? b : null;
}
/** Rectangle ring (counter-clockwise) from a center and a size. */
const rectRingAt = (x, y, w, d) => [[x - w / 2, y - d / 2], [x + w / 2, y - d / 2], [x + w / 2, y + d / 2], [x - w / 2, y + d / 2]];
/** Metric reader: the modules return a number or { total | value | ratio }. */
function mv(row, d = 0) {
  if (typeof row === 'number' && isFinite(row)) return row;
  if (row && typeof row === 'object') for (const k of ['total', 'value', 'ratio']) if (typeof row[k] === 'number' && isFinite(row[k])) return row[k];
  return d;
}

/** Centerline vertices of a bar: its start, the bend points and its end (plan feet). */
function barVertices(bar) {
  const legs = BarsMod.legsOf(bar);
  const pts = [[bar.x, bar.y]];
  for (const l of legs) {
    const a = (l.angle * Math.PI) / 180;
    const p = pts[pts.length - 1];
    pts.push([p[0] + l.length * Math.cos(a), p[1] + l.length * Math.sin(a)]);
  }
  return pts;
}

function barBoxOf(bar) {
  try { return SnapTargetsMod.barBox({ bars: [bar] }, null, bar.id); } catch (e) { return null; }
}

/** A new bar for "Add bar": north of the existing bars, with the size of the last one. */
function newBarFor(state) {
  const bars = state.bars;
  const last = bars[bars.length - 1] || defaultBar('A');
  const id = nextBarId(bars);
  let maxY = -Infinity;
  for (const b of bars) { const bb = barBoxOf(b); if (bb) maxY = Math.max(maxY, bb.maxY); }
  const sep = num(state.site && state.site.separationMin, 20);
  const depth = last.depth;
  const bar = deepClone(last);
  Object.assign(bar, { id, name: `Bar ${id}`, angle: 0, bends: [], depth, y: isFinite(maxY) ? Math.round(maxY + Math.max(sep, 20) + depth / 2) : 0, x: last.x });
  if (Math.abs(last.angle) > 1e-6) bar.x = last.x;

}
/** A copy of a bar, moved one bar-depth plus the separation minimum to its left. */
function duplicateBarOf(state, bar) {
  const id = nextBarId(state.bars);
  const copy = deepClone(bar);
  const a = (num(bar.angle, 0) * Math.PI) / 180;
  const off = bar.depth + Math.max(num(state.site && state.site.separationMin, 20), 20);
  Object.assign(copy, { id, name: `Bar ${id}`, x: Math.round((bar.x - Math.sin(a) * off) * 1000) / 1000, y: Math.round((bar.y + Math.cos(a) * off) * 1000) / 1000 });
  return copy;
}

/* ==========================================================================
   PIPELINE
   state -> assemble (bars, levels, unions, joints, courtyards, warnings)
         -> envelope marks (height limit) -> units -> parking -> metrics.
   One cached run per change. The envelope itself (allowed footprint, wireframe)
   is src/tower/envelope.js, used by assemble and here (Env).
   Also: bounds for framing, Diagram pieces (the bar that owns each part of a
   level), and the Derived cache that the renderer, the HUD and the exports read.
   ========================================================================== */

/** Model + site bounds in plan coordinates (framing views, shadow frustum). `height` includes the roof screen. */
function computeBounds(state, plates, solids, height) {
  const box = () => ({ minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity });
  const add = (b, x, y) => { b.minX = Math.min(b.minX, x); b.maxX = Math.max(b.maxX, x); b.minY = Math.min(b.minY, y); b.maxY = Math.max(b.maxY, y); };
  const model = box(), site = box();
  for (const p of plates) for (const poly of p.polygons) for (const q of poly.outer) add(model, q[0], q[1]);
  for (const q of sitePolygon(state)) add(site, q[0], q[1]);
  if (!isFinite(site.minX)) Object.assign(site, { minX: -50, maxX: 50, minY: -50, maxY: 50 });
  if (!isFinite(model.minX)) Object.assign(model, site);
  const union = {
    minX: Math.min(model.minX, site.minX), maxX: Math.max(model.maxX, site.maxX),
    minY: Math.min(model.minY, site.minY), maxY: Math.max(model.maxY, site.maxY),
  };
  const all = { ...union };                       // `all` also holds the context blocks; only the sun uses it so shadows reach the neighbors
  if (state.context && state.context.show) {
    for (const b of state.context.blocks || []) {
      const hw = num(b.w, 0) / 2, hd = num(b.d, 0) / 2;
      add(all, num(b.x, 0) - hw, num(b.y, 0) - hd); add(all, num(b.x, 0) + hw, num(b.y, 0) + hd);
    }
  }
  const h = Math.max(0, height || 0);
  return { model: { ...model, height: h }, site, union: { ...union, height: h }, all: { ...all, height: h } };
}

/* ---- Clipper helpers for the Diagram pieces (assemble owns the real unions) ---------- */
const CLIP_SCALE = 1000;
const clipPath = (ring) => ring.map((p) => ({ X: Math.round(p[0] * CLIP_SCALE), Y: Math.round(p[1] * CLIP_SCALE) }));
const clipRing = (path) => path.map((p) => [p.X / CLIP_SCALE, p.Y / CLIP_SCALE]);
function treeToPolys(tree) {
  const out = [];
  const visit = (node) => {
    for (const child of node.Childs()) {
      if (!child.IsHole()) {
        const poly = { outer: clipRing(child.Contour()), holes: [] };
        for (const hole of child.Childs()) { poly.holes.push(clipRing(hole.Contour())); visit(hole); }
        if (Math.abs(BarsMod.ringArea(poly.outer)) > 1e-6) out.push(poly);
      } else visit(child);
    }

  visit(tree);

}
/** Union (type 'union') or difference ('diff') of two lists of { outer, holes }. Non-zero fill; outers counter-clockwise, holes clockwise. */
function clipPolys(subj, clip, op) {
  const L = globalThis.ClipperLib;
  const c = new L.Clipper();
  const add = (list, type) => {
    for (const p of list) {
      const outer = BarsMod.ringArea(p.outer) < 0 ? p.outer.slice().reverse() : p.outer;
      c.AddPath(clipPath(outer), type, true);
      for (const h of p.holes || []) c.AddPath(clipPath(BarsMod.ringArea(h) > 0 ? h.slice().reverse() : h), type, true);
    }

/**
 * For each bar level: the part of the plate that each bar owns. A bar owns its own rings minus the bars before it
 * in state.bars, so the corner zone is drawn one time. → Map(level index -> [{ barId, barIndex, program, polygons }])
 */
function computePieces(state, built) {
  const out = new Map();
  const cache = new Map();
  const barById = new Map(state.bars.map((b, i) => [b.id, { bar: b, i }]));
  const ringsOf = new Map();
  for (const lv of built.levels) {
    if (lv.zone !== 'bar' || !(lv.barIds || []).length) continue;
    const ids = state.bars.map((b) => b.id).filter((id) => lv.barIds.includes(id));
    const key = ids.join('|');
    if (!cache.has(key)) {
      let acc = [];
      const list = [];
      for (const id of ids) {
        const { bar, i } = barById.get(id);
        if (!ringsOf.has(id)) ringsOf.set(id, BarsMod.legsOf(bar).map((leg) => ({ outer: BarsMod.legRing(leg), holes: [] })));
        const own = clipPolys(ringsOf.get(id), [], 'union');

        if (piece.length) list.push({ barId: id, barIndex: i, polygons: piece });
        acc = acc.length ? clipPolys(acc, own, 'union') : own;
      }
      cache.set(key, list);
    }
    out.set(lv.index, cache.get(key).map((p) => {
      const bl = BarsMod.barLevels(barById.get(p.barId).bar, state).find((l) => l.index === lv.index);
      return { ...p, program: bl ? bl.program : lv.program };
    }));
  }
  return out;
}

/* ---- Derived data: one cached run of the pipeline per change ---------------------------- */
const SEVERITY_ORDER = { error: 0, warn: 1, info: 2 };
const mapWarning = (w) => ({ id: w.code || w.id, level: w.severity || w.level || 'warn', text: w.message || w.text, floors: w.floors || [] });
const sortWarnings = (list) => list.map((w, i) => [w, i]).sort((a, b) => ((SEVERITY_ORDER[a[0].level] ?? 1) - (SEVERITY_ORDER[b[0].level] ?? 1)) || (a[1] - b[1])).map((x) => x[0]);

/** Geometry for one state: assemble plus the height-limit marks. Never throws: a failure becomes one error warning. */
function computeGeometry(s, quality = 'full') {
  try {
    const built = AssembleMod.assemble(s, { quality });
    const limit = Math.max(0, num(s.site && s.site.heightLimit, 0));
    const plates = built.plates.map((p) => ({ ...p }));
    // assemble's envelope check measures footprint overlap only. A level whose top is above the height limit is outside too,
    // so the whole plate counts as outside (it turns red). The roof screen is outside when its top is above the limit.
    if (limit > 0) for (const p of plates) if (p.z + p.ftf > limit + 0.01 && p.area > 0) p.outsideEnvelopeArea = Math.max(p.outsideEnvelopeArea || 0, p.area);
    const solidsOutside = built.solids.map((sol) => limit > 0 && num(sol.z1, 0) > limit + 0.01);
    return { built, plates, solids: built.solids, solidsOutside, warnings: built.warnings.slice(), ok: true };
  } catch (e) {
    console.error(e);
    const built = { quality, levels: [], spineGraph: { nodes: [], edges: [] }, joints: [], courtyards: [], separation: [], plates: [], solids: [], warnings: [] };
    return { built, plates: [], solids: [], solidsOutside: [], warnings: [{ code: 'internal', severity: 'error', message: 'The geometry could not be built for these settings.', floors: [] }], ok: false };
  }
}
function safeWire(s, topZ) { try { return Env.envelopeWireframe(s, topZ); } catch (e) { console.error(e); return []; } }

/** Units, parking, metrics and the merged warning list for a built geometry. */

    corridorLength: 0, corridorPerUnit: 0, parking: { required: 0, provided: 0, ratioProvided: 0, surplus: 0, deficit: false }, courtyards: { count: 0, area: 0, minDim: 0, items: [] },
    bars: { count: 0, longest: null }, height: 0, deckTop: 0, floors: 0, floorsDetail: { bar: 0, podium: 0, deck: 0 }, stairs: { exit: 0, exterior: 0, total: 0, byBar: {} }, elevators: 0,
    constructionHint: '', openSpace: { area: 0, ratio: 0, required: 0, ok: true }, target: { units: null, density: null }, warnings: [] };
  if (!g.ok) return { units: { total: 0, byBar: {}, byProgram: {}, warnings: [] }, balance: null, metrics: empty };

    const units = UnitsMod.unitsEstimate(s, g.built);
    const balance = ParkingMod.parkingBalance(s, units, g.built);
    const metrics = MetricsMod.computeMetrics(s, g.built, units, balance);
    return { units, balance, metrics };
  } catch (e) {
    console.error(e);
    g.warnings.push({ code: 'internal', severity: 'error', message: 'The numbers could not be worked out for these settings.', floors: [] });

function mergeWarnings(s, g, n) {

    if (w.code === 'parking-deficit' && s.view.warnParking === false) return;
    const key = `${w.code}|${w.message}`;
    if (seen.has(key)) return;
    seen.add(key);
    out.push(mapWarning(w));
  };
  g.warnings.forEach(add);
  (n.units.warnings || []).forEach(add);
  (n.metrics.warnings || []).forEach(add);
  return sortWarnings(out);

/** Everything the UI, the renderer, the exports and the compare view need for one state (no caching). */
function computeDerived(s) {
  const g = computeGeometry(s);
  const n = computeNumbers(s, g);
  const m = n.metrics;
  return {
    built: g.built, plates: g.plates, solids: g.solids, solidsOutside: g.solidsOutside, floors: g.built.levels,
    units: n.units, balance: n.balance, metrics: m, warnings: mergeWarnings(s, g, n),
    bounds: computeBounds(s, g.plates, g.solids, m.height), wire: safeWire(s, m.height),
  };

const Derived = (() => {
  let gKey = null, aKey = null, geomId = 0, counter = 0;
  let full = null, nums = null, cache = null, draftCache = null, piecesCache = null;
  // Geometry key: everything that changes the build or the numbers. The name, the view, the context, the targets and the placement only change drawing or the warning list.
  const geomKeyOf = (s) => JSON.stringify([s.site, s.floors, s.bars, s.courts, s.deck, s.podium, s.surface, s.programs, s.parking, s.rules, s.roof]);

  function get() {
    const s = Store.raw();
    const gk = geomKeyOf(s);
    if (gk !== gKey || !full) {
      gKey = gk; geomId++; full = computeGeometry(s); nums = computeNumbers(s, full); aKey = null; draftCache = null; piecesCache = null;
    }
    const ak = JSON.stringify([s.context, s.view.warnParking]);
    if (ak !== aKey || !cache) {
      aKey = ak;
      cache = {
        id: ++counter, geomId, built: full.built, plates: full.plates, solids: full.solids, solidsOutside: full.solidsOutside, floors: full.built.levels,
        units: nums.units, balance: nums.balance, metrics: nums.metrics, warnings: mergeWarnings(s, full, nums),
        bounds: computeBounds(s, full.plates, full.solids, nums.metrics.height), wire: safeWire(s, nums.metrics.height),

  function display(draft) {

    if (!draft || !d.built.levels.length) return fullDisp;

      const g = computeGeometry(s, 'draft');

      draftCache = {

        plates: g.plates.map((p) => ({ ...p, outsideEnvelopeArea: out.get(p.n) || 0 })),

/* ==========================================================================
   OVERLAYS  (plan section 6, "Plan overlays")
   Lines and flat text labels the renderer adds on top of the massing.
     ground  always on: open courts, the drawn surface lot, the project boundary and the north arrow
     plan    plan view and Diagram style: dashed spines, unit ticks, hatched corner zones, courtyard labels,
             stall counts on the deck and the podium, podium outline, the lot count, stair and elevator seeds
   Objects are plain three.js lines and meshes. Each one owns its material (userData.ownMat), so the renderer
   disposes it when the layer is rebuilt. Text is drawn into a canvas and laid flat on a plane that has a size in feet,

const Overlays = (() => {

  function lines(pos, { color, opacity = 1, dashed = false, order = 4, dash = 4, gap = 3 }) {

    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));

      ? new THREE.LineDashedMaterial({ color, transparent: opacity < 1, opacity, dashSize: dash, gapSize: gap, depthWrite: false })
      : new THREE.LineBasicMaterial({ color, transparent: opacity < 1, opacity, depthWrite: false });

/* ==========================================================================
   RENDER
   Scene, cameras, meshes, visual styles, performance rules, compare viewports.
   Plan coordinates are (x east, y north) in feet; elevation is up.
   Three.js is Y-up, so plan y maps to -z. planToWorld() is the ONLY place
   that mapping is written; geometry uses PLAN_MATRIX built from it.

/** Plan (x, y, elevation) -> Three.js world [x, y, z]. North (plan +y) is world -z. */
function planToWorld(x, y, elev = 0) { return [x, elev, -y]; }
const worldVec = (x, y, e = 0) => new THREE.Vector3(...planToWorld(x, y, e));
/** Matrix equivalent of planToWorld, for geometry authored in plan space (shape x,y; extrusion up = elevation). */
function planMatrix(elev = 0) {
  const o = worldVec(0, 0, 0);
  const ex = worldVec(1, 0, 0).sub(o), ey = worldVec(0, 1, 0).sub(o), ez = worldVec(0, 0, 1).sub(o);
  const m = new THREE.Matrix4().makeBasis(ex, ey, ez);
  m.setPosition(worldVec(0, 0, elev));
  return m;
}

/** Cells for the compare grid, in pixels, y from the top. `resv` reserves bars at the top and bottom. */
function compareRects(n, W, H, resv = {}, gap = 2) {
  const top = resv.top || 0, bottom = resv.bottom || 0;
  const hh = Math.max(40, H - top - bottom);
  const landscape = W >= hh;
  let cols, rows;
  if (n <= 1) { cols = 1; rows = 1; }
  else if (n === 2) { cols = landscape ? 2 : 1; rows = landscape ? 1 : 2; }
  else if (n === 3) { cols = landscape ? 3 : 1; rows = landscape ? 1 : 3; }
  else { cols = 2; rows = 2; }
  const cw = W / cols, ch = hh / rows, out = [];
  for (let i = 0; i < n; i++) {
    const c = i % cols, r = Math.floor(i / cols);
    out.push({ x: c * cw + gap / 2, y: top + r * ch + gap / 2, w: Math.max(1, cw - gap), h: Math.max(1, ch - gap) });
  }
  return out;

  /* ---- model objects (shared by the main view and the compare view) ----------- */
  function extrudePolys(polygons, z, depth) {
    const shapes = polygons.map((poly) => {
      const shape = new THREE.Shape(poly.outer.map((q) => new THREE.Vector2(q[0], q[1])));
      for (const h of poly.holes || []) shape.holes.push(new THREE.Path(h.map((q) => new THREE.Vector2(q[0], q[1]))));
      return shape;
    });
    const geo = new THREE.ExtrudeGeometry(shapes, { depth, bevelEnabled: false, steps: 1, curveSegments: 1 });
    geo.deleteAttribute('uv');
    geo.applyMatrix4(planMatrix(z));
    return geo;
  }
  function meshSolidGeometry(s) {
    let geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(s.positions, 3));
    geo.setIndex(s.indices);
    geo = geo.toNonIndexed();
    geo.computeVertexNormals();                  // flat normals
    geo.applyMatrix4(planMatrix(0));
    return geo;
  }

  const progColorOf = (programs, k) => ((programs[k] || CONFIG.programs[k] || {}).color) || '#999';
  const barColorOf = (index) => CONFIG.barColors[index % CONFIG.barColors.length];

  /** Floors, roof screen, site outline. `disp` = { plates, solids, solidsOutside, pieces?, quality }. */
  function buildFloorObjects(state, disp) {
    const out = [];
    const view = state.view, diagram = view.style === 'diagram';
    const gap = view.floorLines ? CONFIG.floorGap : 0;
    const groups = new Map();
    const push = (key, geo) => {
      if (!geo.getAttribute('position') || geo.getAttribute('position').count === 0) { geo.dispose(); return; }
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(geo);
    };
    const pieces = diagram ? disp.pieces : null;
    for (const plate of disp.plates) {
      if (!plate.polygons.length) continue;
      const depth = Math.max(0.1, plate.ftf - gap);
      if (plate.outsideEnvelopeArea > 1) { push('outside', extrudePolys(plate.polygons, plate.z, depth)); continue; }
      if (!diagram) { push(plate.zone === 'deck' ? 'deck' : 'model', extrudePolys(plate.polygons, plate.z, depth)); continue; }
      const pcs = plate.zone === 'bar' && pieces ? pieces.get(plate.n) : null;
      if (pcs && pcs.length) {
        for (const pc of pcs) {
          const key = view.colorBy === 'bar' ? `barc:${barColorOf(pc.barIndex)}` : `prog:${pc.program}:${progColorOf(state.programs, pc.program)}`;
          push(key, extrudePolys(pc.polygons, plate.z, depth));
        }
      } else {
        const key = view.colorBy === 'bar' ? `zone:${plate.zone}` : `prog:${plate.program}:${progColorOf(state.programs, plate.program)}`;
        push(key, extrudePolys(plate.polygons, plate.z, depth));
      }
    }
    disp.solids.forEach((s, i) => {
      let geo;
      try { geo = extrudePolys(s.polygons, s.z0, Math.max(0.05, s.z1 - s.z0)); } catch (e) { console.error(e); return; }
      push(disp.solidsOutside[i] ? 'outside' : (diagram ? 'zone:screen' : 'model'), geo);
    });
    const edges = disp.quality !== 'draft';
    for (const [key, geos] of groups) {
      const merged = geos.length === 1 ? geos[0] : BufferGeometryUtils.mergeGeometries(geos, false);
      if (geos.length > 1) geos.forEach((g) => g.dispose());
      if (!merged) continue;
      const mesh = new THREE.Mesh(merged, materialFor(key));
      mesh.userData.model = true;
      out.push(mesh);
      if (edges) out.push(new THREE.LineSegments(new THREE.EdgesGeometry(merged, 20), lineMaterial('edge')));
    }
    // Site boundary outline (rectangle or polygon), just above the ground.
    const ring = sitePolygon(state);
    const siteGeo = new THREE.BufferGeometry().setFromPoints(ring.map((q) => worldVec(q[0], q[1], 0.1)));
    out.push(new THREE.LineLoop(siteGeo, lineMaterial('site')));
    return out;
  }

  /** Context blocks: light gray 60% boxes (model) or outlines only (diagram). */
  function buildContextObjects(state) {
    const out = [];
    if (!state.context || !state.context.show) return out;
    const diagram = state.view.style === 'diagram';
    for (const b of state.context.blocks || []) {
      const w = num(b.w, 0), d = num(b.d, 0), hgt = num(b.h, 0);
      if (!(w > 0 && d > 0 && hgt > 0)) continue;
      const geo = new THREE.BoxGeometry(w, d, hgt);          // plan x, y, elevation
      geo.translate(num(b.x, 0), num(b.y, 0), num(b.base, 0) + hgt / 2);
      geo.applyMatrix4(planMatrix(0));
      if (diagram) {
        out.push(new THREE.LineSegments(new THREE.EdgesGeometry(geo), lineMaterial('ctxline')));
        geo.dispose();
      } else {
        const mesh = new THREE.Mesh(geo, materialFor('context'));
        mesh.userData.model = true;
        out.push(mesh);
      }
    }
    return out;
  }

  /** Transparent wireframe of the allowed envelope (setbacks, stepback, height limit). */
  function buildEnvelopeObjects(state, wire) {
    if (!state.view.envelope || !wire || !wire.length) return [];
    const pos = [];
    const seg = (a, b) => { pos.push(a[0], a[1], a[2], b[0], b[1], b[2]); };
    for (const prism of wire) {
      for (const poly of prism.polygons) {
        for (const ring of [poly.outer, ...(poly.holes || [])]) {
          const n = ring.length;
          for (let i = 0; i < n; i++) {
            const a = ring[i], b = ring[(i + 1) % n];
            seg(planToWorld(a[0], a[1], prism.z0), planToWorld(b[0], b[1], prism.z0));
            seg(planToWorld(a[0], a[1], prism.z1), planToWorld(b[0], b[1], prism.z1));
            seg(planToWorld(a[0], a[1], prism.z0), planToWorld(a[0], a[1], prism.z1));
          }
        }
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    const lines = new THREE.LineSegments(geo, lineMaterial('envelope'));
    lines.renderOrder = 3;
    return [lines];
  }

  function clearGroup(g) {
    for (const o of [...g.children]) {
      g.remove(o);
      if (o.geometry) o.geometry.dispose();
      if (o.userData.ownMat && o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
    }
  }
  function syncLayer(layer, key, build) {
    if (layer.key === key) return false;
    clearGroup(layer.group);
    layer.key = key;
    for (const o of build()) layer.group.add(o);
    return true;
  }
  const colorsKey = (state) => (state.view.style === 'diagram' && state.view.colorBy === 'program'
    ? Object.values(state.programs).map((p) => p.color).join(',') : '');

  function syncMain(d, disp, state) {
    const v = state.view;
    let changed = false;
    changed = syncLayer(layers.model, [disp.key, v.floorLines, v.style, v.colorBy, colorsKey(state)].join('|'), () => buildFloorObjects(state, disp)) || changed;
    changed = syncLayer(layers.context, [v.style, JSON.stringify(state.context)].join('|'), () => buildContextObjects(state)) || changed;
    changed = syncLayer(layers.envelope, [d.geomId, v.envelope].join('|'), () => buildEnvelopeObjects(state, d.wire)) || changed;
    const dragging = disp.quality === 'draft';
    if (!dragging) {
      const proj = ProjectUI.boundaryKey();
      const key = ['o', d.id, v.ticks, v.style, JSON.stringify(state.courts), JSON.stringify(state.surface.lot), proj].join('|');
      if (syncLayer(layers.overlay, key, () => {
        const o = Overlays.build(state, d, { projectBoundary: ProjectUI.boundaryLocal() });
        o.plan.forEach((x) => { x.userData.plan = true; });
        return [...o.ground, ...o.plan];
      })) { overlayVis = null; changed = true; }
    }
    if (changed) { viewVersion = -1; needsRender = true; }
  }
  /** The plan overlays show in the plan view and in Diagram style (never while a geometry slider drags). */
  let overlayVis = null;
  function syncOverlayVisibility(dragging) {
    const on = !dragging && (preset === 'plan' || Store.raw().view.style === 'diagram');
    const key = `${on}|${dragging}`;
    if (key === overlayVis) return;
    overlayVis = key;
    layers.overlay.group.visible = !cmp && !dragging;
    layers.overlay.group.children.forEach((o) => { o.visible = !o.userData.plan || on; });
    needsRender = true;
  }

  /** All model meshes in whatever is on screen (main layers or compare groups). */
  function eachModelMesh(fn) {
    const walk = (g) => g.children.forEach((o) => { if (o.userData.model) fn(o); });
    if (cmp) cmp.entries.forEach((e) => walk(e.group)); else { walk(layers.model.group); walk(layers.context.group); }
  }

  /* ---- per-frame view state (cheap) ------------------------------------------------ */
  function currentBounds() {
    if (cmp) return cmp.bounds;
    return Derived.get().bounds;
  }
  function updateSun(view) {
    const bb = currentBounds();
    if (!bb) return;
    const b = bb.all;
    const cx = (b.minX + b.maxX) / 2, cy = (b.minY + b.maxY) / 2, h = b.height;
    const ex = b.maxX - b.minX, ey = b.maxY - b.minY;
    const R = Math.max(60, 0.5 * Math.sqrt(ex * ex + ey * ey + h * h));
    const az = rad(num(view.sun.azimuth, 135)), alt = rad(clamp(num(view.sun.altitude, 40), 3, 90));
    const key = [cx, cy, h, R, az, alt].join('|');
    if (key === sunKey) return;
    sunKey = key;
    sceneRadius = R;
    // Azimuth is a compass bearing: 0 = north (plan +y), clockwise. Altitude is above the horizon.
    const dir = new THREE.Vector3(...planToWorld(Math.sin(az) * Math.cos(alt), Math.cos(az) * Math.cos(alt), Math.sin(alt)));
    const target = worldVec(cx, cy, h / 2);
    sun.target.position.copy(target);
    sun.position.copy(target).addScaledVector(dir, R * 2.5);
    const c = sun.shadow.camera;
    c.left = -R * 1.1; c.right = R * 1.1; c.top = R * 1.1; c.bottom = -R * 1.1;
    c.near = R * 1.2; c.far = R * 3.8;
    c.updateProjectionMatrix();
    sun.target.updateMatrixWorld();
    needsRender = true;
  }

  function applyView() {
    const s = Store.raw(), v = s.view;
    if (styleApplied !== v.style || themeApplied !== themeEpoch) refreshColors();
    const diagram = v.style === 'diagram';
    gridMesh.visible = !!v.grid;
    figure.visible = !!v.figure && !cmp;
    const shadowsOn = !diagram && !!v.shadows;
    // While a slider moves: casters off (no shadow pass work). Sun drags keep shadows so you can see them move.
    const dragging = Store.gestureActive() && !Store.gesturePath().startsWith('view.sun');
    const cast = shadowsOn && !dragging;
    shadowPlane.visible = shadowsOn;
    eachModelMesh((m) => { m.castShadow = cast; m.receiveShadow = shadowsOn; });
    figure.traverse((o) => { if (o.isMesh) o.castShadow = cast; });
    // The figure stands near the front-left corner of the site (front = south, plan -y).
    if (derived) figure.position.copy(worldVec(derived.bounds.site.minX + 14, derived.bounds.site.minY + 14, 0));
    updateSun(v);
    needsRender = true;
  }

  /* ---- cameras & views ------------------------------------------------------------- */
  const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const tanHalfFov = Math.tan(rad(FOV) / 2);

  function switchCamera(type) {
    if (type === camType) return;
    const target = controls.target;
    const offset = cam.position.clone().sub(target);
    const dist = offset.length();
    if (type === 'ortho') {
      ortho.zoom = (2 * ORTHO_HALF) / (2 * dist * tanHalfFov);
      ortho.position.copy(cam.position); ortho.quaternion.copy(cam.quaternion);
      cam = ortho;
    } else {
      const visible = (2 * ORTHO_HALF) / ortho.zoom;
      const d = visible / (2 * tanHalfFov);
      persp.position.copy(target).addScaledVector(offset.normalize(), d);
      persp.quaternion.copy(cam.quaternion);
      cam = persp;
    }
    camType = type;
    cam.updateProjectionMatrix();
    controls.object = cam;
  }

  function setCamAspect(a) {
    persp.aspect = a; persp.updateProjectionMatrix();
    ortho.left = -ORTHO_HALF * a; ortho.right = ORTHO_HALF * a; ortho.top = ORTHO_HALF; ortho.bottom = -ORTHO_HALF;
    ortho.updateProjectionMatrix();
  }
  const hostAspect = () => Math.max(0.1, host.clientWidth) / Math.max(1, host.clientHeight);

  /** Space covered by floating panels; views are framed in the remaining area. */
  function applyViewOffset() {
    const w = host.clientWidth, hgt = host.clientHeight;
    const off = cmp ? 0 : clamp(insetProvider().right || 0, 0, w * 0.6) / 2;
    for (const c of [persp, ortho]) {
      if (off > 0) c.setViewOffset(w, hgt, off, 0, w, hgt); else c.clearViewOffset();
    }
    return off * 2;
  }

  /* ---- framing: every preset view fits the whole of what is on screen ---------------------- */
  const FIT_MARGIN = 0.05;      // empty fraction of the visible area on each side

  /** Plan extent + height of everything a view must show: plates, crown solids, the envelope wireframe (when shown), the site. */
  function boxOf(d, showEnv) {
    const u = d.bounds.union;
    const b = { minX: u.minX, maxX: u.maxX, minY: u.minY, maxY: u.maxY, height: u.height || 0 };
    const add = (x, y, z) => {
      if (x < b.minX) b.minX = x; if (x > b.maxX) b.maxX = x;
      if (y < b.minY) b.minY = y; if (y > b.maxY) b.maxY = y;
      if (z > b.height) b.height = z;
    };
    for (const s of d.solids || []) {
      if (s.kind === 'mesh') { const p = s.positions; for (let i = 0; i + 2 < p.length; i += 3) add(p[i], p[i + 1], p[i + 2]); }
      else for (const poly of s.polygons) for (const q of poly.outer) add(q[0], q[1], s.z1);
    }
    if (showEnv) for (const prism of d.wire || []) for (const poly of prism.polygons) for (const q of poly.outer) add(q[0], q[1], prism.z1);
    return b;
  }
  function framingBox() {
    const showEnv = !!Store.raw().view.envelope;
    if (cmp) {
      const bs = cmp.entries.map((e) => boxOf(e.d, showEnv));
      return {
        minX: Math.min(...bs.map((x) => x.minX)), maxX: Math.max(...bs.map((x) => x.maxX)),
        minY: Math.min(...bs.map((x) => x.minY)), maxY: Math.max(...bs.map((x) => x.maxY)),
        height: Math.max(...bs.map((x) => x.height)),
      };
    }
    return boxOf(Derived.get(), showEnv);
  }

  /** Perspective: the nearest distance (and the look-at point) that puts all box corners inside the visible area. */
  function fitPersp(box, dir, aspect, H) {
    const corners = [];
    for (const x of [box.minX, box.maxX]) for (const y of [box.minY, box.maxY]) for (const z of [0, H]) corners.push(worldVec(x, y, z));
    const fwd = dir.clone().negate();
    const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0)).normalize();
    const up = new THREE.Vector3().crossVectors(right, fwd).normalize();
    const fit = 1 - 2 * FIT_MARGIN;
    const tY = tanHalfFov, tX = tanHalfFov * aspect;
    const target = worldVec((box.minX + box.maxX) / 2, (box.minY + box.maxY) / 2, H / 2);
    const solve = () => {
      let dist = 1;
      for (const p of corners) {
        const v = p.clone().sub(target), dd = v.dot(dir);
        dist = Math.max(dist, dd + Math.abs(v.dot(right)) / (tX * fit), dd + Math.abs(v.dot(up)) / (tY * fit));
      }
      return dist;
    };
    let dist = solve();
    for (let i = 0; i < 6; i++) {            // centre the projected box in the visible area, then re-solve the distance
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (const p of corners) {
        const v = p.clone().sub(target), z = dist - v.dot(dir);
        const nx = v.dot(right) / (z * tX), ny = v.dot(up) / (z * tY);
        x0 = Math.min(x0, nx); x1 = Math.max(x1, nx); y0 = Math.min(y0, ny); y1 = Math.max(y1, ny);
      }
      target.addScaledVector(right, ((x0 + x1) / 2) * tX * dist).addScaledVector(up, ((y0 + y1) / 2) * tY * dist);
      dist = solve();
    }
    return { dist, target };
  }

  /** Where each preset puts the camera. Every view frames the whole box (see boxOf) with a small margin. */
  function viewTarget(id, box, aspect) {
    const H = Math.max(box.height, 20);
    const ex = box.maxX - box.minX, ey = box.maxY - box.minY;
    const cx = (box.minX + box.maxX) / 2, cy = (box.minY + box.maxY) / 2;
    const fit = 1 - 2 * FIT_MARGIN;
    if (id === 'axon') {
      const az = rad(135), el = rad(28);      // camera sits south-east, looking north-west
      const dirPlan = [Math.sin(az) * Math.cos(el), Math.cos(az) * Math.cos(el), Math.sin(el)];
      const dir = new THREE.Vector3(...planToWorld(...dirPlan)).normalize();
      const f = fitPersp(box, dir, aspect, H);
      return { type: 'persp', dist: f.dist, target: f.target, dir };
    }
    const reach = 0.55 * Math.sqrt(ex * ex + ey * ey + H * H);     // keeps the whole box in front of an orthographic camera
    if (id === 'plan') {
      const vis = Math.max(ey / fit, ex / (aspect * fit), 30);
      const e = 0.0008;     // tiny tilt toward the south keeps "north up" without a degenerate up-vector
      return {
        type: 'ortho', zoom: (2 * ORTHO_HALF) / vis, minDist: reach,
        target: worldVec(cx, cy, 0),
        dir: new THREE.Vector3(...planToWorld(0, -Math.sin(e), Math.cos(e))).normalize(),
      };
    }
    // Elevations: N = looking at the north face from the north, etc.
    const dirs = { n: [0, 1], e: [1, 0], s: [0, -1], w: [-1, 0] };
    const d = dirs[id];
    const along = (id === 'n' || id === 's') ? ex : ey;
    const vis = Math.max(H / fit, along / (aspect * fit), 40);
    return {
      type: 'ortho', zoom: (2 * ORTHO_HALF) / vis, minDist: reach,
      target: worldVec(cx, cy, H / 2),
      dir: new THREE.Vector3(...planToWorld(d[0], d[1], 0)).normalize(),
    };
  }

  function framingAspect() {
    if (cmp) {
      const r = cmpRects();
      return r.length ? r[0].w / r[0].h : hostAspect();
    }
    return Math.max(0.2, (host.clientWidth - clamp(insetProvider().right || 0, 0, host.clientWidth * 0.6)) / Math.max(1, host.clientHeight));
  }

  function setView(id, animate = true) {
    if (!renderer) return;
    const goal = viewTarget(id, framingBox(), framingAspect());
    preset = id;
    overlayVis = null;
    tween = null;
    if (goal.type !== camType) switchCamera(goal.type);
    const curTarget = controls.target.clone();
    const curOffset = cam.position.clone().sub(curTarget);
    const curDist = Math.max(1, curOffset.length());
    const fromDir = curOffset.clone().normalize();
    const toDist = goal.type === 'persp' ? goal.dist : Math.max(curDist, goal.minDist || 0);
    const apply = (target, dir, dist, zoom) => {
      controls.target.copy(target);
      cam.position.copy(target).addScaledVector(dir, dist);
      if (camType === 'ortho') cam.zoom = zoom;
      cam.updateProjectionMatrix();
      controls.update();
    };
    if (!animate || reduceMotion) {
      apply(goal.target, goal.dir, toDist, goal.zoom);
    } else {
      tween = {
        t0: performance.now(), dur: 400,
        fromTarget: curTarget, toTarget: goal.target,
        fromDir, toDir: goal.dir, fromDist: curDist, toDist,
        fromZoom: cam.zoom, toZoom: goal.zoom || cam.zoom,
        q: new THREE.Quaternion().setFromUnitVectors(fromDir, goal.dir),
        apply,
      };
    }
    needsRender = true;
    viewListeners.forEach((fn) => fn(preset));
  }

  function stepTween(now) {
    const k = tween;
    const p = clamp((now - k.t0) / k.dur, 0, 1), e = easeInOut(p);
    const target = k.fromTarget.clone().lerp(k.toTarget, e);
    const dir = k.fromDir.clone().applyQuaternion(new THREE.Quaternion().slerp(k.q, e)).normalize();
    const dist = k.fromDist + (k.toDist - k.fromDist) * e;
    const zoom = k.fromZoom * Math.pow(k.toZoom / k.fromZoom, e);
    k.apply(target, dir, dist, zoom);
    needsRender = true;
    if (p >= 1) tween = null;
  }

  function updateClip() {
    const dist = cam.position.distanceTo(controls.target);
    if (camType === 'persp') {
      cam.near = Math.max(0.5, dist * 0.01);
      cam.far = dist * 20 + sceneRadius * 4 + 2000;
    } else {
      cam.near = 0.1;
      cam.far = dist + 60000;
    }
    cam.updateProjectionMatrix();
  }

  function resize() {
    if (!renderer) return;
    const w = Math.max(1, host.clientWidth), h = Math.max(1, host.clientHeight);
    renderer.setSize(w, h, false);
    setCamAspect(w / h);
    applyViewOffset();
    if (preset) setView(preset, false);
    needsRender = true;
    if (cmp) renderCompare(renderer, scene, cam, false); else renderer.render(scene, cam);
    resizeListeners.forEach((fn) => fn());
  }

  /* ---- compare: one renderer, one camera, one viewport per option -------------------------- */
  const cmpReserve = () => (cmp && cmp.reserve ? cmp.reserve() : { top: 0, bottom: 0 });
  function cmpRects(W = host.clientWidth, H = host.clientHeight, reserve = cmpReserve(), gap = 2) {
    return compareRects(cmp ? cmp.entries.length : 0, W, H, reserve, gap);
  }
  /** Draws every option into its own cell. Also used by screenshots (reserve = none, scaled size). */
  function renderCompare(r, s, c, forCapture) {
    if (!cmp || !cmp.entries.length) { r.render(s, c); return; }
    const size = r.getSize(_v2);
    const W = size.x, H = size.y;
    const k = W / Math.max(1, host.clientWidth);
    const reserve = forCapture ? { top: 0, bottom: 0 } : cmpReserve();
    const rects = compareRects(cmp.entries.length, W, H, reserve, 2 * k);
    r.setScissorTest(false);
    r.setViewport(0, 0, W, H);
    r.setClearColor(cssColor('--line'), 1);
    r.clear();
    r.setScissorTest(true);
    rects.forEach((rc, i) => {
      cmp.entries.forEach((e, j) => { e.group.visible = (i === j); });
      const x = Math.round(rc.x), y = Math.round(H - rc.y - rc.h), w = Math.round(rc.w), h = Math.round(rc.h);
      r.setViewport(x, y, w, h);
      r.setScissor(x, y, w, h);
      setCamAspect(rc.w / rc.h);
      r.render(s, c);
    });
    cmp.entries.forEach((e) => { e.group.visible = true; });
    r.setScissorTest(false);
    r.setViewport(0, 0, W, H);
    setCamAspect(hostAspect());
  }
  function combineBounds(list) {
    const ranges = (k) => list.map((d) => d.bounds[k]);
    const merge = (k) => {
      const rs = ranges(k);
      return {
        minX: Math.min(...rs.map((r) => r.minX)), maxX: Math.max(...rs.map((r) => r.maxX)),
        minY: Math.min(...rs.map((r) => r.minY)), maxY: Math.max(...rs.map((r) => r.maxY)),

  function syncCompare() {
    const s = Store.raw(), v = s.view;

    cmp.key = key;
    for (const e of cmp.entries) {
      if (e.group) { clearGroup(e.group); scene.remove(e.group); }

      if (v.style === 'diagram') { try { pieces = e.d.pieces || computePieces(e.state, e.d.built); } catch (err) { console.error(err); } }
      const disp = { plates: e.d.plates, solids: e.d.solids, solidsOutside: e.d.solidsOutside, quality: 'full', pieces };
      for (const o of [...buildFloorObjects(st, disp), ...buildContextObjects(st), ...buildEnvelopeObjects(st, e.d.wire)]) group.add(o);

    selOverlay.visible = false;
    figure.visible = false;

    for (const e of cmp.entries) if (e.group) { clearGroup(e.group); scene.remove(e.group); }

    layers.model.group.visible = layers.context.group.visible = layers.envelope.group.visible = layers.overlay.group.visible = true;
    selOverlay.visible = true;
    overlayVis = null;
    resetLayers();
    viewVersion = -1;

      if (moved || needsRender) { updateClip(); renderCompare(renderer, scene, cam, false); needsRender = false; }
      return;
    }
    const d = Derived.get();
    const state = Store.raw();
    // Draft quality only while a geometry slider drags (never for view settings such as the sun).
    const draft = Store.gestureActive() && !Store.gesturePath().startsWith('view');
    const disp = Derived.display(draft);
    const first = derived === null;
    if (d.geomId !== geomIdSeen) {
      if (!first) refitPending = true;                        // geometry changed: re-frame once the edit settles
      geomIdSeen = d.geomId;

    derived = d;
    const envOn = !!state.view.envelope;
    if (envSeen !== null && envOn !== envSeen) refitPending = true;     // the envelope is part of the framed box

    syncMain(d, disp, state);
    syncOverlayVisibility(disp.quality === 'draft');
    if (first && !preset) setView('axon', false);

    if (refitPending && !Store.gestureActive()) { refitPending = false; if (preset) setView(preset, true); }

  /** Screenshot of what is on screen (main or compare). The HUD inset is removed so the model is centred. */
  async function capture(overlay, scale = 2) {
    if (!renderer) throw new Error('The 3D view is not available.');
    capturing = true;

    selOverlay.visible = false;
    try {
      for (const c of [persp, ortho]) c.clearViewOffset();
      return await ShotMod.captureView({
        renderer, scene, camera: cam, scale, overlay,
        render: cmp ? (r, s, c) => renderCompare(r, s, c, true) : undefined,

  async function captureClean(scale = 2) {
    if (!renderer) throw new Error('The 3D view is not available.');
    if (cmp) throw new Error('Leave Compare to save an AI-ready image.');
    const state = Store.raw();
    const view = { ...state.view, style: 'model' };
    const st = { ...state, view };
    const real = Derived.display(false);
    const disp = {
      key: 'ai', quality: 'full', pieces: null, solids: real.solids,
      plates: real.plates.map((p) => (p.outsideEnvelopeArea > 0 ? { ...p, outsideEnvelopeArea: 0 } : p)),
      solidsOutside: real.solids.map(() => false),
    };

    // Opaque context blocks: see-through blocks read as glass to image AIs, and the prompts call them "light-gray blocks".
    const ctxMat = new THREE.MeshStandardMaterial({ color: new THREE.Color('#c9cdd2'), roughness: 0.95, metalness: 0 });
    const cap = new THREE.Group();
    for (const o of [...buildFloorObjects(st, disp), ...buildContextObjects(st)]) {
      if (o.isLineLoop) { if (o.geometry) o.geometry.dispose(); continue; }       // no site outline
      if (o.isMesh) {
        if (o.material.transparent) o.material = ctxMat;
        o.castShadow = shadowsOn; o.receiveShadow = shadowsOn;
      }
      cap.add(o);
    }

      bg: scene.background, ground: ground.material.color.clone(), grid: gridMesh.visible, fig: figure.visible,
      model: layers.model.group.visible, ctx: layers.context.group.visible, env: layers.envelope.group.visible, ov: layers.overlay.group.visible, shadow: shadowPlane.visible,
    };
    const restore = () => {
      scene.remove(cap);
      clearGroup(cap);
      ctxMat.dispose();
      scene.background = prev.bg;
      ground.material.color.copy(prev.ground);
      gridMesh.visible = prev.grid; figure.visible = prev.fig; shadowPlane.visible = prev.shadow;
      layers.model.group.visible = prev.model; layers.context.group.visible = prev.ctx; layers.envelope.group.visible = prev.env; layers.overlay.group.visible = prev.ov;

    const overlayWas = selOverlay.visible;
    selOverlay.visible = false;

    try {
      // captureView draws and copies the frame before its first await, so the scene can be put back straight away.
      try {
        scene.add(cap);
        scene.background = new THREE.Color('#f3f5f7');
        ground.material.color.set('#e4e7ea');
        gridMesh.visible = false; figure.visible = false; shadowPlane.visible = shadowsOn;
        layers.model.group.visible = layers.context.group.visible = layers.envelope.group.visible = layers.overlay.group.visible = false;
        for (const c of [persp, ortho]) c.clearViewOffset();
        pending = ShotMod.captureView({ renderer, scene, camera: cam, scale });

    } finally {
      capturing = false;
      selOverlay.visible = overlayWas;
      applyViewOffset();

  }

  function init(hostEl) {
    host = hostEl;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    } catch (e) {

      renderer = null;

    onFrame: (fn) => frameListeners.push(fn),
    camera: () => cam,
    cameraType: () => camType,
    canvas: () => (renderer ? renderer.domElement : null),
    setOrbitEnabled: (on) => { if (controls) { controls.enabled = !!on; if (!on) tween = null; } },
    orbitEnabled: () => !!controls && controls.enabled,
  };
})();

/* ==========================================================================

   duplicate, delete and the Mac shortcuts.

   Selection state lives HERE, never in the Store, so it is never saved,
   exported or undone. Every edit goes through the Store: a handle drag is a
   run of live sets that commit as ONE undo step; menu-style edits (program,
   duplicate, delete) are one Store.replace.

   Items:  { kind: 'bar', id } · { kind: 'court', id } · { kind: 'deck' } · { kind: 'podium' } · { kind: 'context', index }

   Handles are DOM elements in a layer over the canvas. They follow the camera
   every drawn frame (Render.onFrame), so they keep a constant size on screen
   and the hit area is simply the element (44 CSS px on touch). The selection
   outline and the snap guides are 3D lines in the Render overlay group
   (hidden in screenshots and in Compare).
     bar      move x, move y, rotate (beyond the end), length (both ends), depth (left side), floors (top)
     deck     move x, move y, width, depth, levels (top)
     court    move x, move y, width, depth

  const HIDE_DOT = 0.95;                     // a handle whose axis points along the view direction is hidden

    if (it.kind === 'context') return { kind: 'context', index: it.index | 0 };
    return { kind: it.kind };

    switch (it.kind) {

      case 'court': return courtIndex(s, it.id) >= 0;
      case 'deck': return !!s.deck.on;

  function basePath(it) {

      case 'court': return `Court ${it.id}`;
      case 'deck': return 'Deck';

        case 'court': { const c = s.courts[courtIndex(s, it.id)]; return `Open court · ${fmt(c.w)} × ${fmt(c.d)}`; }

    if (it.kind === 'bar') {

      const lv = bar ? BarsMod.barLevels(bar, s) : [];
      return lv.length ? { z0: lv[0].z, z1: lv[lv.length - 1].z + lv[lv.length - 1].ftf } : null;
    }
    if (it.kind === 'deck' || it.kind === 'podium') {
      const list = d.built.levels.filter((l) => l.zone === it.kind);
      return list.length ? { z0: Math.min(...list.map((l) => l.z)), z1: Math.max(...list.map((l) => l.z + l.ftf)) } : null;

     Footprints (the plan box of an item) and the paths that resize a rectangle item
     ========================================================================== */
  const rectBox = (r) => ({ minX: r.x - r.w / 2, maxX: r.x + r.w / 2, minY: r.y - r.d / 2, maxY: r.y + r.d / 2 });
  function footprint(it) {

      return b ? { box: b, resize: false } : null;
    }

    const rect = { x: num(r.x, 0), y: num(r.y, 0), w: num(r.w, 0), d: num(r.d, 0) };

  function extentWrites(it, axis, extent, center) {

  function mergeInto(meshes, geos, item, rank) {

    if (!list.length) return;

  function pickSet() {

      for (const leg of BarsMod.legsOf(bar)) { try { geos.push(extrude([{ outer: BarsMod.legRing(leg), holes: [] }], z0, z1 - z0)); } catch (e) { /* skip */ } }

    for (const c of s.courts || []) {
