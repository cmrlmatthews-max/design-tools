<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

/* ==========================================================================
   CONFIG
   Program defaults, limits, palettes, and the inlined src modules.
   The src modules (shared, tower and mid-rise) are wrapped in functions so
   their names do not clash with the rest of the file; build.py puts them in
   dependency order at the marker below.
   ========================================================================== */
/* ---- src/shared/storage.js ---- */
const StorageMod = (() => {
/* ==========================================================================
   SHARED: storage
   Save, load, export and import of design "options" in localStorage.

   One localStorage key holds:
     { schema, options: [{ id, name, createdAt, updatedAt, state }], current }
   where `current` is the autosave slot: { state, updatedAt } (slot "__current").
   An optional `prompts: [{ id, title, template, ... }]` list (custom AI prompts) rides in the same blob; it is
   omitted while empty, travels in export / import, and import renames title collisions "Title (2)".

   Rules
   - Every storage access is inside try/catch. On any failure onNotice(message)
     is called ONCE (per storage instance) and the data stays in memory, so the
     tool keeps working for the rest of the session.
   - `migrate(state, fromSchema)` runs whenever a state with state.schema <
     `schema` is loaded or imported. It must return the migrated state.
   - Pure ES module. No DOM access except export download / visibility flush,
     both guarded.
   ========================================================================== */

const AUTOSAVE_MS = 1000;
const MAX_IMPORT_BYTES = 20 * 1024 * 1024;

/* ---------- small helpers ---------- */

function clone(v) {
  return v === undefined ? undefined : JSON.parse(JSON.stringify(v));
}

function isObj(v) {
  return v !== null && typeof v === "object" && !Array.isArray(v);
}

function newId() {
  try {
    if (globalThis.crypto && typeof globalThis.crypto.randomUUID === "function") return globalThis.crypto.randomUUID();
  } catch (e) { /* fall through */ }
  return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

function pad2(n) { return String(n).padStart(2, "0"); }

/** `towergen-options-YYYY-MM-DD.json` (local date). */
function exportFilename(date = new Date(), prefix = "towergen-options") {
  const d = date instanceof Date ? date : new Date(date);
  return `${prefix}-${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}.json`;
}

/** "Name" → "Name (2)", "Name (3)" … first one not in `taken` (case-insensitive). */
function uniqueName(name, taken) {
  const lower = new Set([...taken].map((n) => String(n).trim().toLowerCase()));
  const base = String(name || "").trim() || "Untitled";
  if (!lower.has(base.toLowerCase())) return base;
  for (let n = 2; n < 100000; n++) {
    const candidate = `${base} (${n})`;
    if (!lower.has(candidate.toLowerCase())) return candidate;
  }
  return `${base} (${newId()})`;
}

/* ---------- factory ---------- */

/**
 * @param {object}   cfg
 * @param {string}   cfg.key       localStorage key, e.g. "towergen.options.v1"
 * @param {number}   cfg.schema    current state schema number
 * @param {Function} [cfg.migrate] (state, fromSchema) => state
 * @param {Function} [cfg.onNotice] (message) => void, called at most once
 * @param {number}   [cfg.debounceMs=1000]  autosave delay
 * @param {string}   [cfg.filePrefix="towergen-options"]  export filename prefix
 * @param {object}   [cfg.storage]  Storage-like object (tests); default window.localStorage
 */
function createStorage({
  key,
  schema,
  migrate,
  onNotice,
  debounceMs = AUTOSAVE_MS,
  filePrefix = "towergen-options",
  storage,
} = {}) {
  if (!key) throw new Error("createStorage: `key` is required");
  if (!Number.isFinite(schema)) throw new Error("createStorage: `schema` must be a number");

  let noticed = false;
  let persistent = true;     // false once any read/write failed
  let readOnly = false;      // data written by a newer app version: never overwrite
  let lastRaw = null;        // last string we know is in storage
  let data = { schema, options: [], current: null, prompts: [] };
  let timer = null;
  let pendingAutosave = null;

  function notice(message) {
    persistent = false;
    if (noticed) return;
    noticed = true;
    try { if (typeof onNotice === "function") onNotice(message); } catch (e) { /* ignore */ }
  }

  function backend() {
    // Accessing window.localStorage itself can throw (blocked site data).
    return storage || globalThis.localStorage;
  }

  /* ----- migration ----- */

  function migrateState(state, fromSchema) {
    if (!isObj(state)) return state;
    const from = Number.isFinite(state.schema) ? state.schema : fromSchema;
    if (!Number.isFinite(from) || from >= schema) {
      if (!Number.isFinite(state.schema)) state.schema = schema;
      return state;
    }
    let out = state;
    try {
      out = typeof migrate === "function" ? migrate(clone(state), from) : state;
      if (!isObj(out)) out = state;
    } catch (e) {
      notice("Some saved options are from an older version and could not be updated.");
      return state;
    }
    out.schema = schema;
    return out;
  }

  /* ----- parse / validate stored blob ----- */

  function normalizeRecord(r, fallbackSchema) {
    if (!isObj(r) || !isObj(r.state)) return null;
    const now = Date.now();
    const num = (v) => (Number.isFinite(v) ? v : now);
    return {
      id: typeof r.id === "string" && r.id ? r.id : newId(),
      name: typeof r.name === "string" && r.name.trim() ? r.name.trim() : "Untitled",
      createdAt: num(r.createdAt),
      updatedAt: num(r.updatedAt),
      state: migrateState(clone(r.state), fallbackSchema),
    };
  }

  /** A custom prompt record (any extra fields are kept), or null when it has no usable title and template. */
  function normalizePrompt(p) {
    if (!isObj(p) || typeof p.title !== "string" || !p.title.trim() || typeof p.template !== "string") return null;
    const now = Date.now();
    const num = (v) => (Number.isFinite(v) ? v : now);
    return {
      ...clone(p),
      id: typeof p.id === "string" && p.id ? p.id : newId(),
      title: p.title.trim(),
      group: "custom",
      template: p.template,
      uses: Array.isArray(p.uses) ? p.uses.filter((u) => typeof u === "string") : [],
      createdAt: num(p.createdAt),
      updatedAt: num(p.updatedAt),
    };
  }

  /** @returns {object|null} normalized data, or null when raw is unusable. */
  function parseBlob(raw) {
    let obj;
    try { obj = JSON.parse(raw); } catch (e) { return null; }
    if (!isObj(obj) || !Array.isArray(obj.options) || !Number.isFinite(obj.schema)) return null;
    const out = { schema, options: [], current: null, prompts: [], newer: obj.schema > schema };
    const seen = new Set();
    for (const r of obj.options) {
      const rec = normalizeRecord(r, obj.schema);
      if (!rec) continue;
      if (seen.has(rec.id)) rec.id = newId();
      seen.add(rec.id);
      out.options.push(rec);
    }
    if (Array.isArray(obj.prompts)) {
      const ids = new Set();
      for (const p of obj.prompts) {
        const rec = normalizePrompt(p);
        if (!rec) continue;
        if (ids.has(rec.id)) rec.id = newId();
        ids.add(rec.id);
        out.prompts.push(rec);
      }
    }
    if (isObj(obj.current) && isObj(obj.current.state)) {
      out.current = {
        state: migrateState(clone(obj.current.state), obj.schema),
        updatedAt: Number.isFinite(obj.current.updatedAt) ? obj.current.updatedAt : Date.now(),
      };
    }
    return out;
  }

  /** Read storage into memory. `initial` = first load (corrupt value is replaced). */
  function load(initial) {
    let raw;
    try {
      raw = backend().getItem(key);
    } catch (e) {
      notice("Saving is unavailable in this browser, so options will only be kept until you close this page.");
      return;
    }
    if (raw === lastRaw && !initial) return;       // nothing changed since we last looked
    if (raw === null || raw === undefined) {
      lastRaw = null;
      return;
    }
    const parsed = parseBlob(raw);
    if (!parsed) {
      lastRaw = raw;
      notice("Saved options could not be read and were reset. A backup copy of the old data was kept.");
      if (initial) {
        data = { schema, options: [], current: null, prompts: [] };
        try { backend().setItem(key + ".corrupt", raw); } catch (e) { /* ignore */ }
      }
      // Not initial: keep the good in-memory copy; the next write overwrites the bad value.
      return;
    }
    if (parsed.newer) {
      readOnly = true;
      notice("Saved options were made by a newer version of this tool. They can be viewed but changes will not be saved.");
    }
    delete parsed.newer;
    data = parsed;
    lastRaw = raw;
  }

  function persist() {
    if (readOnly) return false;
    let raw;
    try {
      const blob = { schema, options: data.options, current: data.current };
      if (data.prompts.length) blob.prompts = data.prompts;
      raw = JSON.stringify(blob);
    } catch (e) {
      notice("Options could not be saved.");
      return false;
    }
    try {
      backend().setItem(key, raw);
      lastRaw = raw;
      return true;
    } catch (e) {
      notice("Saving is unavailable in this browser (storage is blocked or full). Options will only be kept until you close this page.");
      return false;
    }
  }

  load(true);

  /* ----- records ----- */

  function find(id) { return data.options.find((o) => o.id === id); }
  function names(except) { return data.options.filter((o) => o !== except).map((o) => o.name); }
  function out(rec) { return rec ? clone(rec) : null; }
  function stamp(state) {
    const s = clone(state);
    if (isObj(s) && !Number.isFinite(s.schema)) s.schema = schema;
    return s;
  }

  const api = {
    /** All saved options, most recently updated first: [{id,name,createdAt,updatedAt,state}] (copies). */
    list() {
      load(false);
      return data.options.slice().sort((a, b) => b.updatedAt - a.updatedAt).map(out);
    },

    get(id) {
      load(false);
      return out(find(id));
    },

    /** Saves a new option; returns its id. Name is kept as given (not renamed). */
    save(state, name) {
      load(false);
      const now = Date.now();
      const rec = {
        id: newId(),
        name: String(name || "").trim() || "Untitled",
        createdAt: now,
        updatedAt: now,
        state: stamp(state),
      };
      data.options.push(rec);
      persist();
      return rec.id;
    },

    /** Replaces the state of an existing option (optionally renames). Returns true if found. */
    update(id, state, name) {
      load(false);
      const rec = find(id);
      if (!rec) return false;
      rec.state = stamp(state);
      if (typeof name === "string" && name.trim()) rec.name = name.trim();
      rec.updatedAt = Date.now();
      persist();
      return true;
    },

    rename(id, name) {
      load(false);
      const rec = find(id);
      if (!rec || !String(name || "").trim()) return false;
      rec.name = String(name).trim();
      rec.updatedAt = Date.now();
      persist();
      return true;
    },

    remove(id) {
      load(false);
      const i = data.options.findIndex((o) => o.id === id);
      if (i < 0) return false;
      data.options.splice(i, 1);
      persist();
      return true;
    },

    /** Copies an option; newName defaults to "Name (2)" style. Returns the new id or null. */
    duplicate(id, newName) {
      load(false);
      const src = find(id);
      if (!src) return null;
      const now = Date.now();
      const rec = {
        id: newId(),
        name: uniqueName(String(newName || "").trim() || src.name, names()),
        createdAt: now,
        updatedAt: now,
        state: clone(src.state),
      };
      data.options.push(rec);
      persist();
      return rec.id;
    },

    /** Custom prompts, oldest first (copies). */
    listPrompts() {
      load(false);
      return data.prompts.map(clone);
    },

    /** Adds a custom prompt, or replaces the one with the same id. Returns the saved copy, or null when it has no title / template. */
    savePrompt(prompt) {
      load(false);
      const old = isObj(prompt) ? data.prompts.find((p) => p.id === prompt.id) : null;
      const rec = normalizePrompt({ ...prompt, updatedAt: Date.now(), createdAt: old ? old.createdAt : Date.now() });
      if (!rec) return null;
      if (old) data.prompts[data.prompts.indexOf(old)] = rec; else data.prompts.push(rec);
      persist();
      return clone(rec);
    },

    removePrompt(id) {
      load(false);
      const i = data.prompts.findIndex((p) => p.id === id);
      if (i < 0) return false;
      data.prompts.splice(i, 1);
      persist();
      return true;
    },

    /** Debounced (1 s) save of the working state into the "__current" slot. */
    autosave(state) {
      try { pendingAutosave = stamp(state); } catch (e) { notice("Options could not be saved."); return; }
      if (timer !== null) clearTimeout(timer);
      timer = setTimeout(api.flush, debounceMs);
    },

    /** Writes any pending autosave immediately. */
    flush() {
      if (timer !== null) { clearTimeout(timer); timer = null; }
      if (pendingAutosave === null) return;
      load(false);
      data.current = { state: pendingAutosave, updatedAt: Date.now() };
      pendingAutosave = null;
      persist();
    },

    /** The autosaved working state (migrated copy), or null. A not-yet-flushed autosave counts. */
    loadAutosave() {
      if (pendingAutosave !== null) return clone(pendingAutosave);
      load(false);
      return data.current ? clone(data.current.state) : null;
    },

    /** All saved options (and custom prompts, when there are any) as an application/json Blob. */
    exportAll() {
      load(false);
      const payload = {
        schema,
        exportedAt: new Date().toISOString(),
        options: data.options.map(out),
      };
      if (data.prompts.length) payload.prompts = data.prompts.map(clone);
      return new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    },

    /** `towergen-options-YYYY-MM-DD.json` */
    exportFilename(date) { return exportFilename(date, filePrefix); },

    /** Browser only: triggers a download of exportAll(). */
    downloadExport() {
      const blob = api.exportAll();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = api.exportFilename();
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    },

    /**
     * Appends the options of an exportAll() file. Never replaces existing options.
     * Custom prompts in the file are appended too (a title already in use becomes "Title (2)").
     * Resolves {added, skipped, promptsAdded}; rejects with an Error whose message is shown to the user.
     */
    async importFile(file) {
      if (!file) throw new Error("No file was chosen.");
      if (typeof file.size === "number" && file.size > MAX_IMPORT_BYTES) {
        throw new Error("That file is too large to be an options file.");
      }
      let text;
      try {
        text = typeof file.text === "function" ? await file.text() : await readWithReader(file);
      } catch (e) {
        throw new Error("The file could not be read.");
      }
      let obj;
      try { obj = JSON.parse(text); } catch (e) {
        throw new Error("This file is not valid JSON, so it is not an options file.");
      }
      if (!isObj(obj) || !Array.isArray(obj.options)) {
        throw new Error("This file does not look like an exported options file (no options list found).");
      }
      if (!Number.isFinite(obj.schema)) {
        throw new Error("This file does not look like an exported options file (no schema number).");
      }
      if (obj.schema > schema) {
        throw new Error("This file was made by a newer version of the tool. Update the tool and try again.");
      }

      load(false);
      const taken = new Set(names());
      const incoming = [];
      let skipped = 0;
      for (const r of obj.options) {
        if (!isObj(r) || !isObj(r.state)) { skipped++; continue; }
        const rec = normalizeRecord({ ...r, id: undefined }, obj.schema);   // always a fresh id
        if (!rec) { skipped++; continue; }
        rec.name = uniqueName(rec.name, taken);
        taken.add(rec.name);
        incoming.push(rec);
      }
      const takenTitles = new Set(data.prompts.map((p) => p.title));
      const incomingPrompts = [];
      if (Array.isArray(obj.prompts)) {
        for (const p of obj.prompts) {
          const rec = normalizePrompt({ ...(isObj(p) ? p : {}), id: undefined });
          if (!rec) continue;
          rec.title = uniqueName(rec.title, takenTitles);
          takenTitles.add(rec.title);
          incomingPrompts.push(rec);
        }
      }
      if (incoming.length === 0 && incomingPrompts.length === 0 && obj.options.length > 0) {
        throw new Error("None of the options in this file could be used.");
      }
      data.options.push(...incoming);
      data.prompts.push(...incomingPrompts);
      if (incoming.length || incomingPrompts.length) persist();
      const res = { added: incoming.length, skipped };
      if (incomingPrompts.length) res.promptsAdded = incomingPrompts.length;
      return res;
    },

    /** True while saving to browser storage works (false after a failure; data is then memory-only). */
    isPersistent() { return persistent; },

    /** Stops timers and listeners (tests). Pending autosave is flushed first. */
    dispose() {
      api.flush();
      if (removeListener) removeListener();
    },
  };

  /* Flush a pending autosave when the page is hidden (iPad Safari can kill background tabs). */
  let removeListener = null;
  try {
    if (typeof document !== "undefined" && document.addEventListener) {
      const onHide = () => { if (document.visibilityState === "hidden") api.flush(); };
      document.addEventListener("visibilitychange", onHide);
      window.addEventListener("pagehide", api.flush);
      removeListener = () => {
        document.removeEventListener("visibilitychange", onHide);
        window.removeEventListener("pagehide", api.flush);
      };
    }
  } catch (e) { /* ignore */ }

  return api;
}

function readWithReader(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result));
    fr.onerror = () => reject(fr.error);
    fr.readAsText(file);
  });
}

return { exportFilename, uniqueName, createStorage };
})();

/* ---- src/shared/screenshot.js ---- */
const ShotMod = (() => {
/* ==========================================================================
   SHARED: screenshot
   Capture a three.js view at higher resolution, annotate it on a 2D canvas,
   and deliver the PNG (share sheet on iPad, download elsewhere).

   No dependency on three: the renderer is only used through its public API.
   Does not need preserveDrawingBuffer (the frame is copied in the same task
   it is rendered in).
   ========================================================================== */

const FONT_STACK = '-apple-system, "SF Pro Text", "Inter", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';

/** Total pixel budget. iOS Safari limits a canvas to 16,777,216 px (4096 x 4096). */
const DEFAULT_MAX_PIXELS = 16000000;

/* Duck-typed targets so we do not need THREE.Vector2 / Vector4. */
function vec2() { return { x: 0, y: 0, set(x, y) { this.x = x; this.y = y; return this; } }; }
function vec4() {
  return {
    x: 0, y: 0, z: 0, w: 0,
    set(x, y, z, w) { this.x = x; this.y = y; this.z = z; this.w = w; return this; },
    copy(v) { this.x = v.x; this.y = v.y; this.z = v.z; this.w = v.w; return this; },
  };
}

/** Largest scale <= requested that fits the GPU and canvas limits. */
function fitScale(renderer, baseW, baseH, scale, maxPixels) {
  let s = scale;
  let maxDim = Infinity;
  try {
    const gl = renderer.getContext();
    maxDim = Math.min(
      gl.getParameter(gl.MAX_RENDERBUFFER_SIZE) || Infinity,
      gl.getParameter(gl.MAX_TEXTURE_SIZE) || Infinity
    );
    const vp = gl.getParameter(gl.MAX_VIEWPORT_DIMS);
    if (vp) maxDim = Math.min(maxDim, vp[0], vp[1]);
  } catch (e) { /* ignore */ }
  maxDim = Math.min(maxDim, 16384);
  s = Math.min(s, maxDim / baseW, maxDim / baseH);
  const px = baseW * baseH;
  if (px * s * s > maxPixels) s = Math.sqrt(maxPixels / px);
  return Math.max(s, 1 / Math.max(baseW, baseH));     // never zero
}

/**
 * Renders the scene at `scale` x the renderer's current drawing-buffer size and
 * returns a PNG Blob with the overlay drawn on top.
 *
 * @param {object}   o
 * @param {object}   o.renderer  THREE.WebGLRenderer
 * @param {object}   o.scene
 * @param {object}   o.camera
 * @param {number}   [o.scale=2]
 * @param {object}   [o.overlay]  { title?, date?, metrics?: Array<[label,value]>, mark?: "CMRLM", theme?: "light"|"dark" }
 *                                 date: string | Date | true (today)
 * @param {Function} [o.render]  optional (renderer, scene, camera) => void replacing renderer.render
 *                               (for custom viewports); called at the capture size and again after restore
 * @param {number}   [o.maxPixels=16000000]  scale is reduced to stay within this budget and GPU limits
 * @returns {Promise<Blob>} image/png. blob.captureInfo = { width, height, scale, requestedScale }
 */
async function captureView({ renderer, scene, camera, scale = 2, overlay, render, maxPixels = DEFAULT_MAX_PIXELS } = {}) {
  if (!renderer || !scene || !camera) throw new Error("captureView needs renderer, scene and camera.");

  const canvas3d = renderer.domElement;
  const draw = typeof render === "function"
    ? () => render(renderer, scene, camera)
    : () => renderer.render(scene, camera);

  /* ---- remember everything we will change ---- */
  const size = renderer.getSize(vec2());
  const cssW = size.x, cssH = size.y;
  const pr = renderer.getPixelRatio();
  const baseW = canvas3d.width, baseH = canvas3d.height;        // current drawing-buffer size
  const viewport = renderer.getViewport(vec4());
  const scissor = renderer.getScissor(vec4());
  const scissorTest = renderer.getScissorTest();
  const aspect = camera.isPerspectiveCamera ? camera.aspect : null;

  const eff = fitScale(renderer, baseW, baseH, scale, maxPixels);
  const W = Math.max(1, Math.round(baseW * eff));
  const H = Math.max(1, Math.round(baseH * eff));

  const out = document.createElement("canvas");
  out.width = W;
  out.height = H;
  const ctx = out.getContext("2d");
  if (!ctx) throw new Error("Could not create a 2D canvas for the screenshot.");

  const setBuffer = (w, h, ratio) => {
    // pixel ratio 1 with an explicit size gives an exact W x H buffer; style is never touched
    if (typeof renderer.setDrawingBufferSize === "function") renderer.setDrawingBufferSize(w, h, ratio);
    else { renderer.setPixelRatio(ratio); renderer.setSize(w, h, false); }
  };

  try {
    setBuffer(W, H, 1);
    renderer.setScissorTest(false);
    renderer.setViewport(0, 0, W, H);
    if (aspect !== null) { camera.aspect = W / H; camera.updateProjectionMatrix(); }

    draw();
    // Copy NOW, in the same task as the render (works without preserveDrawingBuffer).
    ctx.drawImage(canvas3d, 0, 0, W, H);
  } finally {
    /* ---- restore everything, then repaint the live view ---- */
    setBuffer(cssW, cssH, pr);
    renderer.setViewport(viewport.x, viewport.y, viewport.z, viewport.w);
    renderer.setScissor(scissor.x, scissor.y, scissor.z, scissor.w);
    renderer.setScissorTest(scissorTest);
    if (aspect !== null) { camera.aspect = aspect; camera.updateProjectionMatrix(); }
    try { draw(); } catch (e) { /* the app's own loop will repaint */ }
  }

  /* ---- overlay, sized in "CSS pixels of the original view" so it matches the app's look ---- */
  if (overlay) drawOverlay(ctx, W, H, W / Math.max(1, cssW), overlay);

  const blob = await canvasToBlob(out);
  try { blob.captureInfo = { width: W, height: H, scale: eff, requestedScale: scale }; } catch (e) { /* ignore */ }
  return blob;
}

/* ---------- overlay ---------- */

function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function formatDate(d) {
  if (d === true) d = new Date();
  if (d instanceof Date) {
    try { return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }); }
    catch (e) { return d.toISOString().slice(0, 10); }
  }
  return String(d);
}

/** Draw text with manual letter spacing (canvas letterSpacing is not in every Safari). */
function spacedWidth(ctx, text, tracking) {
  let w = 0;
  for (const ch of text) w += ctx.measureText(ch).width + tracking;
  return w - tracking;
}
function drawSpaced(ctx, text, x, y, tracking) {
  let cx = x;
  for (const ch of text) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + tracking; }
}

function drawOverlay(ctx, W, H, u, overlay) {
  const dark = overlay.theme === "dark";
  const panel = dark ? "rgba(23, 27, 31, 0.86)" : "rgba(255, 255, 255, 0.88)";
  const edge = dark ? "rgba(255, 255, 255, 0.14)" : "rgba(16, 20, 26, 0.14)";
  const ink = dark ? "#e7eaee" : "#1b1f24";
  const ink2 = dark ? "#a5adb7" : "#4e5763";
  const m = 16 * u;           // outer margin
  const pad = 10 * u;         // panel padding
  const radius = 8 * u;

  ctx.save();
  ctx.textBaseline = "alphabetic";
  ctx.lineWidth = Math.max(1, u);

  const box = (x, y, w, h) => {
    roundRect(ctx, x, y, w, h, radius);
    ctx.fillStyle = panel; ctx.fill();
    ctx.strokeStyle = edge; ctx.stroke();
  };

  /* title + date, top-left */
  const title = overlay.title ? String(overlay.title) : "";
  const date = overlay.date ? formatDate(overlay.date) : "";
  if (title || date) {
    const tSize = 17 * u, dSize = 12 * u;
    ctx.font = `600 ${tSize}px ${FONT_STACK}`;
    const tw = title ? ctx.measureText(title).width : 0;
    ctx.font = `400 ${dSize}px ${FONT_STACK}`;
    const dw = date ? ctx.measureText(date).width : 0;
    const w = Math.max(tw, dw) + pad * 2;
    const h = pad * 2 + (title ? tSize : 0) + (title && date ? 5 * u : 0) + (date ? dSize : 0);
    box(m, m, w, h);
    let y = m + pad;
    if (title) {
      y += tSize * 0.82;
      ctx.font = `600 ${tSize}px ${FONT_STACK}`;
      ctx.fillStyle = ink; ctx.fillText(title, m + pad, y);
      y += tSize * 0.18 + 5 * u;
    }
    if (date) {
      y += dSize * 0.82;
      ctx.font = `400 ${dSize}px ${FONT_STACK}`;
      ctx.fillStyle = ink2; ctx.fillText(date, m + pad, y);
    }
  }

  /* metrics, bottom-left */
  const rows = Array.isArray(overlay.metrics) ? overlay.metrics.filter((r) => Array.isArray(r) && r.length >= 2) : [];
  if (rows.length) {
    const size = 12.5 * u, rowH = 19 * u, gap = 18 * u;
    ctx.font = `400 ${size}px ${FONT_STACK}`;
    let lw = 0;
    for (const [l] of rows) lw = Math.max(lw, ctx.measureText(String(l)).width);
    ctx.font = `600 ${size}px ${FONT_STACK}`;
    let vw = 0;
    for (const [, v] of rows) vw = Math.max(vw, ctx.measureText(String(v)).width);
    const w = pad * 2 + lw + gap + vw;
    const h = pad * 2 + rowH * rows.length - (rowH - size);
    const x = m, y = H - m - h;
    box(x, y, w, h);
    rows.forEach(([l, v], i) => {
      const by = y + pad + size * 0.9 + i * rowH;
      ctx.textAlign = "left";
      ctx.font = `400 ${size}px ${FONT_STACK}`;
      ctx.fillStyle = ink2; ctx.fillText(String(l), x + pad, by);
      ctx.textAlign = "right";
      ctx.font = `600 ${size}px ${FONT_STACK}`;
      ctx.fillStyle = ink; ctx.fillText(String(v), x + w - pad, by);
    });
    ctx.textAlign = "left";
  }

  /* mark, bottom-right */
  if (overlay.mark) {
    const text = String(overlay.mark).toUpperCase();
    const size = 11 * u, tracking = 3 * u, padX = 10 * u, padY = 7 * u;
    ctx.font = `600 ${size}px ${FONT_STACK}`;
    const tw = spacedWidth(ctx, text, tracking);
    const w = tw + padX * 2, h = size + padY * 2;
    const x = W - m - w, y = H - m - h;
    box(x, y, w, h);
    ctx.fillStyle = ink2;
    drawSpaced(ctx, text, x + padX, y + padY + size * 0.82, tracking);
  }

  ctx.restore();
}

/* ---------- output ---------- */

function canvasToBlob(canvas) {
  return new Promise((resolve, reject) => {
    const fallback = () => {
      try {
        const url = canvas.toDataURL("image/png");
        const bin = atob(url.split(",")[1]);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        resolve(new Blob([bytes], { type: "image/png" }));
      } catch (e) {
        reject(new Error("The screenshot could not be created (image too large for this device)."));
      }
    };
    try {
      canvas.toBlob((b) => (b ? resolve(b) : fallback()), "image/png");
    } catch (e) { fallback(); }
  });
}

function isTouchApple() {
  const ua = navigator.userAgent || "";
  if (/iPad|iPhone|iPod/.test(ua)) return true;
  // iPadOS reports a Mac user agent; it is the only "Mac" with a touch screen
  return /Mac/.test(navigator.platform || ua) && (navigator.maxTouchPoints || 0) > 1;
}

function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);   // revoking sooner can break iOS downloads
}

/**
 * iPad (touch Apple device): share sheet with the PNG file. Everything else, or
 * if sharing is unavailable/fails: download through a temporary <a download>.
 * A cancelled share sheet (AbortError) does nothing.
 *
 * @param {Blob}   blob
 * @param {string} filename
 * @param {object} [opts]  { share: "auto" | "always" | "never" }  "auto" = only on iPad/iPhone
 * @returns {Promise<"shared"|"cancelled"|"downloaded">}
 */
async function deliverImage(blob, filename, { share = "auto" } = {}) {
  const useShare = share === "always" || (share === "auto" && isTouchApple());
  if (useShare && typeof navigator.share === "function" && typeof navigator.canShare === "function") {
    try {
      const file = new File([blob], filename, { type: blob.type || "image/png" });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return "shared";
      }
    } catch (e) {
      if (e && e.name === "AbortError") return "cancelled";
      // NotAllowedError (user activation expired) or anything else: fall through to download
    }
  }
  download(blob, filename);
  return "downloaded";
}

/** `title-YYYY-MM-DD.png`, safe for file systems. */
function screenshotFilename(name = "tower", date = new Date()) {
  const p = (n) => String(n).padStart(2, "0");
  const slug = String(name).trim().replace(/[^\w\-]+/g, "-").replace(/^-+|-+$/g, "").toLowerCase() || "view";
  return `${slug}-${date.getFullYear()}-${p(date.getMonth() + 1)}-${p(date.getDate())}.png`;
}

return { DEFAULT_MAX_PIXELS, captureView, deliverImage, screenshotFilename };
})();

/* ---- src/shared/sketchup-format.js ---- */
const SkFmt = (() => {
/* ==========================================================================
   SHARED: sketchup-format
   The ".sketchup.json" file that the CMRLM SketchUp extension imports.
   Spec: docs/sketchup-spec.md. Pure functions, no DOM except docToBlob.
   Units: feet. Plan (x, y): x = east, y = north. z up.
   ========================================================================== */

const FORMAT = "cmrlm-design-tools/sketchup";
const VERSION = 1;

const MIN_STEP = 0.01;      // ft: drop points closer than this to the previous point
const MIN_AREA = 0.25;      // sf: drop smaller rings
const r3 = (v) => Math.round(v * 1000) / 1000;

/** Signed plan area (positive = counter-clockwise seen from above). Works on [x,y] or [x,y,z]. */
function ringArea2(ring) {
  let a = 0;
  for (let i = 0, n = ring.length; i < n; i++) {
    const p = ring[i], q = ring[(i + 1) % n];
    a += p[0] * q[1] - q[0] * p[1];
  }
  return a / 2;
}

function clean(ring, dims, hole) {
  if (!Array.isArray(ring)) return null;
  let pts = ring
    .filter((p) => Array.isArray(p) && p.length >= dims && p.slice(0, dims).every(Number.isFinite))
    .map((p) => p.slice(0, dims).map(r3));
  // drop closing duplicate and near-duplicate neighbours
  const out = [];
  for (const p of pts) {
    const last = out[out.length - 1];
    if (last && Math.hypot(...p.map((v, k) => v - last[k])) < MIN_STEP) continue;
    out.push(p);
  }
  while (out.length > 1 && Math.hypot(...out[0].map((v, k) => v - out[out.length - 1][k])) < MIN_STEP) out.pop();
  // drop collinear points (repeat until stable)
  let changed = true;
  while (changed && out.length > 3) {
    changed = false;
    for (let i = 0; i < out.length && out.length > 3; i++) {
      const a = out[(i - 1 + out.length) % out.length], b = out[i], c = out[(i + 1) % out.length];
      const u = b.map((v, k) => v - a[k]), w = c.map((v, k) => v - b[k]);
      const lu = Math.hypot(...u), lw = Math.hypot(...w);
      if (!lu || !lw) { out.splice(i, 1); changed = true; i--; continue; }
      let cross;
      if (dims === 2) cross = Math.abs(u[0] * w[1] - u[1] * w[0]);
      else cross = Math.hypot(u[1] * w[2] - u[2] * w[1], u[2] * w[0] - u[0] * w[2], u[0] * w[1] - u[1] * w[0]);
      const dot = u.reduce((s, v, k) => s + v * w[k], 0);
      if (cross / (lu * lw) < 1e-9 && dot > 0) { out.splice(i, 1); changed = true; i--; }
    }
  }
  if (out.length < 3) return null;
  const area = ringArea2(out);
  if (Math.abs(area) < MIN_AREA) return null;
  if ((area > 0) === !!hole) out.reverse();     // outer CCW, hole CW
  return out;
}

/** Clean a plan ring [[x,y],…]. Returns null when the ring is degenerate. */
const cleanRing2 = (ring, { hole = false } = {}) => clean(ring, 2, hole);
/** Clean a 3D ring [[x,y,z],…] (orientation judged in plan). Returns null when degenerate. */
const cleanRing3 = (ring, { hole = false } = {}) => clean(ring, 3, hole);

function makeDoc({ source, name, location = null, zShift = 0, notes = [], tags = [], materials = [], root, createdAt }) {
  return {
    format: FORMAT,
    version: VERSION,
    source,
    name: String(name || "Untitled"),
    createdAt: createdAt || new Date().toISOString(),
    units: "feet",
    location: location && Number.isFinite(location.lat) && Number.isFinite(location.lon) ? { lat: location.lat, lon: location.lon } : null,
    zShift: Math.round((zShift || 0) * 100) / 100,
    notes,
    tags,
    materials,
    root,
  };
}

const HEX = /^#[0-9a-fA-F]{6}$/;
const isPt = (p, d) => Array.isArray(p) && p.length === d && p.every(Number.isFinite);

/** Check a document against the spec. → { ok, errors, counts } */
function validateDoc(doc) {
  const errors = [];
  const counts = { group: 0, solid: 0, mesh: 0, faces: 0, lines: 0 };
  const err = (path, msg) => { if (errors.length < 50) errors.push(`${path}: ${msg}`); };
  if (!doc || typeof doc !== "object") return { ok: false, errors: ["document: not an object"], counts };
  if (doc.format !== FORMAT) err("format", `must be "${FORMAT}"`);
  if (doc.version !== VERSION) err("version", `must be ${VERSION}`);
  if (!["tower", "site", "midrise", "parking", "facade", "grading", "plate"].includes(doc.source)) err("source", "must be tower, site, midrise, parking, facade, grading, or plate");
  if (doc.units !== "feet") err("units", "must be feet");
  if (!Number.isFinite(doc.zShift)) err("zShift", "must be a number");
  const tagNames = new Set(), matNames = new Set();
  for (const [i, t] of (doc.tags || []).entries()) {
    if (!t.name) err(`tags[${i}]`, "needs a name");
    if (!HEX.test(t.color || "")) err(`tags[${i}]`, "color must be #rrggbb");
    tagNames.add(t.name);
  }
  for (const [i, m] of (doc.materials || []).entries()) {
    if (!m.name) err(`materials[${i}]`, "needs a name");
    if (!HEX.test(m.color || "")) err(`materials[${i}]`, "color must be #rrggbb");
    if (!(m.alpha > 0 && m.alpha <= 1)) err(`materials[${i}]`, "alpha must be in (0, 1]");
    matNames.add(m.name);
  }
  const ringOk = (ring, d, path, hole) => {
    if (!Array.isArray(ring) || ring.length < 3 || !ring.every((p) => isPt(p, d))) return err(path, `ring needs 3+ points of ${d} numbers`);
    const a = ringArea2(ring);
    if (Math.abs(a) < MIN_AREA) err(path, "ring area too small");
    else if ((a > 0) === hole) err(path, hole ? "hole must be clockwise" : "outer ring must be counter-clockwise");
  };
  const walk = (n, path) => {
    if (!n || typeof n !== "object") return err(path, "node is not an object");
    if (!(n.type in counts)) return err(path, `unknown type ${n.type}`);
    counts[n.type]++;
    if (typeof n.name !== "string" || !n.name) err(path, "needs a name");
    if (n.tag != null && !tagNames.has(n.tag)) err(path, `tag "${n.tag}" is not in tags`);
    if (n.material != null && !matNames.has(n.material)) err(path, `material "${n.material}" is not in materials`);
    switch (n.type) {
      case "group":
        if (!Array.isArray(n.children)) err(path, "group needs children");
        else n.children.forEach((c, i) => walk(c, `${path}/${c && c.name ? c.name : i}`));
        break;
      case "solid":
        ringOk(n.outer, 2, `${path}.outer`, false);
        (n.holes || []).forEach((h, i) => ringOk(h, 2, `${path}.holes[${i}]`, true));
        if (!(Number.isFinite(n.z0) && Number.isFinite(n.z1) && n.z1 - n.z0 > 0.001)) err(path, "needs z1 > z0");
        break;
      case "mesh": {
        const nv = (n.vertices || []).length;
        if (!nv || !n.vertices.every((p) => isPt(p, 3))) err(path, "vertices must be [x,y,z]");
        if (!Array.isArray(n.triangles) || !n.triangles.length) err(path, "needs triangles");
        else for (const t of n.triangles) if (!(Array.isArray(t) && t.length === 3 && t.every((k) => Number.isInteger(k) && k >= 0 && k < nv) && new Set(t).size === 3)) { err(path, "bad triangle index"); break; }
        break;
      }
      case "faces":
        if (!Array.isArray(n.polygons) || !n.polygons.length) err(path, "needs polygons");
        else n.polygons.forEach((p, i) => { ringOk(p.outer, 3, `${path}.polygons[${i}].outer`, false); (p.holes || []).forEach((h, j) => ringOk(h, 3, `${path}.polygons[${i}].holes[${j}]`, true)); });
        break;
      case "lines":
        if (!Array.isArray(n.lines) || !n.lines.length) err(path, "needs lines");
        else for (const l of n.lines) if (!(Array.isArray(l) && l.length >= 2 && l.every((p) => isPt(p, 3)))) { err(path, "each line needs 2+ [x,y,z] points"); break; }
        break;
    }
  };
  if (!doc.root || doc.root.type !== "group") err("root", "must be a group");
  else walk(doc.root, doc.root.name || "root");
  return { ok: errors.length === 0, errors, counts };
}

/** "Option A" → "option-a-2026-10-21.sketchup.json" */
function sketchupFilename(name, date = new Date()) {
  const slug = String(name || "design").toLowerCase().normalize("NFKD").replace(/[^\w\s-]/g, "").trim().replace(/[\s_]+/g, "-").replace(/-+/g, "-").slice(0, 60) || "design";
  const d = date instanceof Date ? date : new Date(date);
  const ymd = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  return `${slug}-${ymd}.sketchup.json`;
}

/** Compact JSON as a Blob for download. */
function docToBlob(doc) {
  return new Blob([JSON.stringify(doc)], { type: "application/json" });
}

return { FORMAT, VERSION, ringArea2, cleanRing2, cleanRing3, makeDoc, validateDoc, sketchupFilename, docToBlob };
})();

/* ---- src/shared/project.js ---- */
const ProjectMod = (() => {
/* ==========================================================================
   SHARED: project
   The shared project file ("name.cmrlm.json") that carries one design study
   through the tools: site, massing, plates, parking, facade, sun, grading, egress.
   Spec: docs/project-file-spec.md (the contract; change the spec first).

   Units: feet, square feet, degrees. Plan (x, y): x = east, y = north. z is up.

   Storage (localStorage, shared by every tool on the origin)
     cmrlm.project.index    [{ id, name, updatedAt, bytes }], newest first
     cmrlm.project.<id>     the project file, as JSON text
     cmrlm.project.last     the id of the last saved project

   Rules
   - Every storage access is inside try/catch. On any failure the optional
     `onNotice(message)` (pass it as { onNotice } in the last argument of the
     storage functions) is called ONCE per storage object. The data stays in
     memory with the caller, so the tool keeps working.
   - No function mutates its inputs. writeSection returns a new project.
   - A tool writes only its own section and keeps every other section and every
     unknown key as it was. To avoid overwriting another tool that saved from a
     second tab, load the project fresh, writeSection on that copy, then saveProject.
   - Pure ES module, self-contained (no imports) so a build script can inline it.
     No DOM access: Blob and FileReader are used only when they exist.
   ========================================================================== */

const FORMAT = "cmrlm-design-tools/project";
const VERSION = 1;
const SECTIONS = ["site", "massing", "plates", "parking", "facade", "sun", "grading", "egress"];
const SIZE_WARN = 3 * 1024 * 1024;
const SIZE_MAX = 4 * 1024 * 1024;

const LOG_MAX = 200;
const MAX_IMPORT_BYTES = 20 * 1024 * 1024;
const KEY_PREFIX = "cmrlm.project.";
const KEY_INDEX = "cmrlm.project.index";
const KEY_LAST = "cmrlm.project.last";
const PLACEMENT_KEYS = ["x", "y", "rotation", "baseZ"];
const DEFAULT_TOOL = { site: "site", massing: "tower", plates: "plate", parking: "parking", facade: "facade", sun: "tower", grading: "grading", egress: "egress" };
const NEWER_MSG = "This project was saved by a newer version of this tool. You can view it, but changes will not be saved.";

/* ---------- small helpers ---------- */

function clone(v) {
  return v === undefined ? undefined : JSON.parse(JSON.stringify(v));
}

function isObj(v) {
  return v !== null && typeof v === "object" && !Array.isArray(v);
}

function hasOwn(o, k) {
  return Object.prototype.hasOwnProperty.call(o, k);
}

function newId() {
  try {
    if (globalThis.crypto && typeof globalThis.crypto.randomUUID === "function") return globalThis.crypto.randomUUID();
  } catch (e) { /* fall through */ }
  return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

/** Round to 0.001 ft (and never return -0). */
function r3(v) {
  const r = Math.round(v * 1000) / 1000;
  return r === 0 ? 0 : r;
}

/** Round to 0.01 (and never return -0). */
function r2(v) {
  const r = Math.round(v * 100) / 100;
  return r === 0 ? 0 : r;
}

/** An ISO time for now that is later than every ISO time in `prev`, so updatedAt always moves forward. */
function stamp(...prev) {
  let t = new Date().toISOString();
  for (const p of prev) {
    if (typeof p !== "string") continue;
    const ms = Date.parse(p);
    try {
      if (Number.isFinite(ms) && Date.parse(t) <= ms) t = new Date(ms + 1).toISOString();
    } catch (e) { /* keep t */ }
  }
  return t;
}

/** A usable project id: a non-empty string that does not clash with the other storage keys. */
function okId(id) {
  return typeof id === "string" && id !== "" && id !== "index" && id !== "last";
}

function readOnlyError() {
  const e = new Error(NEWER_MSG);
  e.readOnly = true;
  return e;
}

/* ---------- create, validate, migrate, read ---------- */

/**
 * A new empty project. `frame` is { kind, lat, lon, size, zDatum }; leave it out for a local frame
 * (no site, zDatum "local"). Missing frame fields get their defaults; other values are kept as given.
 */
function newProject({ name, frame } = {}) {
  const now = new Date().toISOString();
  const f = isObj(frame) ? clone(frame) : {};
  return {
    format: FORMAT,
    version: VERSION,
    id: newId(),
    name: String(name || "").trim() || "Untitled",
    createdAt: now,
    updatedAt: now,
    units: "feet",
    frame: {
      ...f,
      kind: f.kind === undefined ? "local" : f.kind,
      lat: f.lat === undefined ? null : f.lat,
      lon: f.lon === undefined ? null : f.lon,
      size: f.size === undefined ? null : f.size,
      zDatum: f.zDatum === undefined ? (f.kind === "site" ? "NAVD88" : "local") : f.zDatum,
    },
    sections: {},
    log: [],
  };
}

/**
 * Checks the envelope: format, version (a newer one is an error), units, frame, every known section
 * (six keys, numeric placement) and the log. Unknown keys and unknown sections are allowed.
 * @returns {{ ok: boolean, errors: string[] }}
 */
function validate(doc) {
  const errors = [];
  const err = (msg) => { if (errors.length < 50) errors.push(msg); };
  if (!isObj(doc)) return { ok: false, errors: ["project: not an object"] };
  if (doc.format !== FORMAT) err(`format: must be "${FORMAT}"`);
  if (!Number.isInteger(doc.version) || doc.version < 1) err("version: must be a whole number, 1 or more");
  else if (doc.version > VERSION) err(`version: ${doc.version} is newer than this tool understands (${VERSION})`);
  if (doc.units !== undefined && doc.units !== "feet") err('units: must be "feet"');
  const f = doc.frame;
  if (!isObj(f)) err("frame: missing or not an object");
  else {
    if (f.kind !== "site" && f.kind !== "local") err('frame.kind: must be "site" or "local"');
    for (const k of ["lat", "lon", "size"]) {
      if (f[k] !== null && !Number.isFinite(f[k])) err(`frame.${k}: must be a number or null`);
    }
    if (typeof f.zDatum !== "string" || !f.zDatum) err('frame.zDatum: must be text such as "NAVD88" or "local"');
  }
  if (doc.sections !== undefined && !isObj(doc.sections)) err("sections: must be an object");
  else if (isObj(doc.sections)) {
    for (const key of SECTIONS) {
      if (!hasOwn(doc.sections, key)) continue;
      const s = doc.sections[key];
      const at = `sections.${key}`;
      if (!isObj(s)) { err(`${at}: must be an object`); continue; }
      if (typeof s.tool !== "string" || !s.tool) err(`${at}.tool: must be a tool id`);
      if (!Number.isFinite(s.schema)) err(`${at}.schema: must be a number`);
      if (typeof s.updatedAt !== "string" || !s.updatedAt) err(`${at}.updatedAt: must be a date string`);
      if (!isObj(s.placement)) err(`${at}.placement: missing or not an object`);
      else for (const k of PLACEMENT_KEYS) if (!Number.isFinite(s.placement[k])) err(`${at}.placement.${k}: must be a number`);
      if (!isObj(s.state)) err(`${at}.state: must be an object`);
      if (!isObj(s.derived)) err(`${at}.derived: must be an object`);
    }
  }
  if (!Array.isArray(doc.log)) err("log: must be an array");
  return { ok: errors.length === 0, errors };
}

/**
 * Brings a project up to VERSION and returns it (the input itself when nothing changes, else a copy).
 * Version 1 needs no change beyond filling a missing `log` with [] and a missing `units` with "feet".
 * A project from a newer version is returned untouched. Section state is the tool's business.
 */
function migrate(doc) {
  if (!isObj(doc)) return doc;
  if (Number.isFinite(doc.version) && doc.version > VERSION) return doc;
  const blank = (v) => v === undefined || v === null || v === "";
  const older = Number.isFinite(doc.version) && doc.version < VERSION;
  if (!older && doc.log !== undefined && doc.log !== null && !blank(doc.units)) return doc;
  const out = clone(doc);
  if (older) out.version = VERSION;
  if (out.log === undefined || out.log === null) out.log = [];
  if (blank(out.units)) out.units = "feet";
  return out;
}

/** The section object for `key`, or null. Never throws. Treat the result as read-only. */
function getSection(doc, key) {
  try {
    const secs = doc && doc.sections;
    if (!isObj(secs) || !hasOwn(secs, key)) return null;
    return isObj(secs[key]) ? secs[key] : null;
  } catch (e) {
    return null;
  }
}

/* ---------- write one section ---------- */

/** Adds one entry to the log (newest 200 kept) and moves the project updatedAt to the entry time. */
function appendLog(doc, entry) {
  const log = Array.isArray(doc.log) ? doc.log : [];
  log.push(entry);
  doc.log = log.length > LOG_MAX ? log.slice(log.length - LOG_MAX) : log;
  doc.updatedAt = entry.at;
}

/** The four placement numbers: given values first, then the old placement, then 0. Extra given keys are kept. */
function mergePlacement(given, old) {
  const base = isObj(old) ? old : {};
  const out = {};
  for (const k of PLACEMENT_KEYS) {
    const v = given[k] !== undefined ? given[k] : base[k] !== undefined ? base[k] : 0;
    if (!Number.isFinite(v)) throw new Error(`writeSection: placement.${k} must be a number.`);
    out[k] = v;
  }
  for (const k of Object.keys(given)) if (!hasOwn(out, k)) out[k] = clone(given[k]);
  return out;
}

/**
 * Writes one section and returns a NEW project; the input is not changed.
 * Only the fields given in `patch` (tool, schema, placement, state, derived) are replaced. Unknown keys of
 * the section and of the project stay as they were. A new section gets defaults for what is missing
 * (the usual tool, schema 1, an identity placement, empty state and derived). Sets section.updatedAt and
 * project.updatedAt, appends one log entry { at, tool, action: "write", note } and keeps the newest 200.
 * Throws a plain Error when `key` is not in SECTIONS. Throws an Error with `readOnly = true` when the stored
 * section schema is newer than `patch.schema` (or the project is from a newer version): the tool must not save.
 */
function writeSection(doc, key, patch) {
  if (!SECTIONS.includes(key)) throw new Error(`Unknown section "${key}". Use one of: ${SECTIONS.join(", ")}.`);
  if (!isObj(doc)) throw new Error("writeSection: the project must be an object.");
  const p = isObj(patch) ? patch : {};
  if (Number.isFinite(doc.version) && doc.version > VERSION) throw readOnlyError();
  const stored = getSection(doc, key);
  if (p.tool !== undefined && (typeof p.tool !== "string" || !p.tool)) throw new Error("writeSection: tool must be a tool id.");
  if (p.schema !== undefined && !(Number.isInteger(p.schema) && p.schema >= 1)) throw new Error("writeSection: schema must be a whole number, 1 or more.");
  for (const k of ["placement", "state", "derived"]) {
    if (p[k] !== undefined && !isObj(p[k])) throw new Error(`writeSection: ${k} must be an object.`);
  }
  // Last: a stored section that is newer than the writer means the writer must not save.
  if (stored && Number.isFinite(stored.schema) && Number.isFinite(p.schema) && stored.schema > p.schema) throw readOnlyError();

  const now = stamp(doc.updatedAt, stored && stored.updatedAt);
  const out = clone(doc);
  if (!isObj(out.sections)) out.sections = {};
  const s = isObj(out.sections[key]) ? out.sections[key] : {};
  s.tool = p.tool !== undefined ? p.tool : (typeof s.tool === "string" && s.tool ? s.tool : DEFAULT_TOOL[key]);
  s.schema = p.schema !== undefined ? p.schema : (Number.isFinite(s.schema) ? s.schema : 1);
  s.updatedAt = now;
  s.placement = p.placement !== undefined ? mergePlacement(p.placement, s.placement) : (isObj(s.placement) ? s.placement : mergePlacement({}, null));
  s.state = p.state !== undefined ? clone(p.state) : (isObj(s.state) ? s.state : {});
  s.derived = p.derived !== undefined ? clone(p.derived) : (isObj(s.derived) ? s.derived : {});
  out.sections[key] = s;
  appendLog(out, { at: now, tool: s.tool, action: "write", note: p.note === undefined || p.note === null ? "" : String(p.note) });
  return out;
}

/* ---------- placement math (spec section 4) ---------- */

/** The placement numbers of a section (or of a bare placement object). A missing number counts as 0. */
function placementOf(s) {
  const p = isObj(s) && isObj(s.placement) ? s.placement : s;
  const n = (v) => (Number.isFinite(v) ? v : 0);
  return isObj(p) ? { x: n(p.x), y: n(p.y), rotation: n(p.rotation), baseZ: n(p.baseZ) } : { x: 0, y: 0, rotation: 0, baseZ: 0 };
}

/** [sin, cos] of an angle in degrees, exact for the four quarter turns. */
function sincos(deg) {
  const d = ((deg % 360) + 360) % 360;
  if (d === 0) return [0, 1];
  if (d === 90) return [1, 0];
  if (d === 180) return [0, -1];
  if (d === 270) return [-1, 0];
  const r = (deg * Math.PI) / 180;
  return [Math.sin(r), Math.cos(r)];
}

function forward(pl, x, y, z) {
  const [s, c] = sincos(pl.rotation);
  return [x * c - y * s + pl.x, x * s + y * c + pl.y, z + pl.baseZ];
}

function inverse(pl, xp, yp, zp) {
  const [s, c] = sincos(pl.rotation);
  const dx = xp - pl.x, dy = yp - pl.y;
  return [dx * c + dy * s, -dx * s + dy * c, zp - pl.baseZ];
}

function zOf(p) {
  return Number.isFinite(p[2]) ? p[2] : 0;
}

function checkDir(dir, fn) {
  if (dir !== "toProject" && dir !== "toLocal") throw new Error(`${fn}: dir must be "toProject" or "toLocal".`);
}

/** Maps a ring of [x, y] or [x, y, z] points. Rounds to 0.001 ft. A point keeps its length (2 or 3 numbers). */
function mapRing(pl, ring, fwd) {
  if (!Array.isArray(ring)) return [];
  return ring.map((p) => {
    const three = Array.isArray(p) && p.length >= 3 && Number.isFinite(p[2]);
    const t = fwd ? forward(pl, p[0], p[1], zOf(p)) : inverse(pl, p[0], p[1], zOf(p));
    return three ? [r3(t[0]), r3(t[1]), r3(t[2])] : [r3(t[0]), r3(t[1])];
  });
}

/**
 * Local point to project point: xp = x cos r - y sin r + placement.x, yp = x sin r + y cos r + placement.y,
 * zp = z + placement.baseZ. `r` is placement.rotation in degrees, counter-clockwise. z is optional (0).
 * `section` is a section object or a bare placement. Returns [xp, yp, zp], not rounded.
 */
function toProject(section, point) {
  return forward(placementOf(section), point[0], point[1], zOf(point));
}

/** The inverse of toProject: project point to local point [x, y, z]. z is optional (0). Not rounded. */
function toLocal(section, point) {
  return inverse(placementOf(section), point[0], point[1], zOf(point));
}

/**
 * Transforms a ring (or a 3D line) of points. dir is "toProject" or "toLocal". Returns a new array
 * rounded to 0.001 ft; 2D points stay 2D, 3D points stay 3D (z moves with baseZ).
 */
function transformRing(section, ring, dir) {
  checkDir(dir, "transformRing");
  return mapRing(placementOf(section), ring, dir === "toProject");
}

/** Transforms a MultiPoly [{ outer, holes }] the same way. Other keys of each polygon are kept. */
function transformMultiPoly(section, mp, dir) {
  checkDir(dir, "transformMultiPoly");
  const pl = placementOf(section), fwd = dir === "toProject";
  return (Array.isArray(mp) ? mp : []).map((poly) => {
    const q = isObj(poly) ? poly : {};
    return { ...q, outer: mapRing(pl, q.outer, fwd), holes: (Array.isArray(q.holes) ? q.holes : []).map((h) => mapRing(pl, h, fwd)) };
  });
}

/**
 * Site buildings near a massing, in that massing LOCAL frame. `placement` is the massing placement.
 * Includes a building when its local plan bounding box touches the circle of radiusFt around the local
 * origin (a missing radius means no limit). Returns
 *   { blocks:   [{ id, name, x, y, w, d, h, base }],            axis-aligned box of each building (x, y = box center)
 *     polygons: [{ id, name, outer, holes, base, height }] }    the building rings, in the local frame
 * where base is the building base minus placement.baseZ. Numbers are rounded to 0.01 ft (rings to 0.001).
 * Empty lists when the project has no site section.
 */
function siteContextFor(doc, placement, radiusFt) {
  const out = { blocks: [], polygons: [] };
  const site = getSection(doc, "site");
  const list = site && isObj(site.derived) && Array.isArray(site.derived.buildings) ? site.derived.buildings : [];
  const pl = placementOf(placement);
  const radius = Number.isFinite(radiusFt) ? radiusFt : Infinity;
  for (const b of list) {
    if (!isObj(b) || !Array.isArray(b.outer) || b.outer.length < 3) continue;
    const outer = mapRing(pl, b.outer, false);
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const [x, y] of outer) {
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
    }
    if (!(Number.isFinite(minX) && Number.isFinite(minY))) continue;
    const gapX = Math.max(minX, 0, -maxX), gapY = Math.max(minY, 0, -maxY);
    if (Math.hypot(gapX, gapY) > radius) continue;
    const name = typeof b.name === "string" ? b.name : "";
    const height = Number.isFinite(b.height) ? b.height : (Number.isFinite(b.top) && Number.isFinite(b.base) ? b.top - b.base : 0);
    const base = r2((Number.isFinite(b.base) ? b.base : pl.baseZ) - pl.baseZ);
    out.blocks.push({ id: b.id, name, x: r2((minX + maxX) / 2), y: r2((minY + maxY) / 2), w: r2(maxX - minX), d: r2(maxY - minY), h: r2(height), base });
    out.polygons.push({ id: b.id, name, outer, holes: (Array.isArray(b.holes) ? b.holes : []).map((h) => mapRing(pl, h, false)), base, height: r2(height) });
  }
  return out;
}

/* ---------- size ---------- */

let encoder = null;

/** Bytes of a text when written as UTF-8 (TextEncoder when present, else the string length). */
function utf8Length(text) {
  if (typeof text !== "string") return 0;
  try {
    if (typeof TextEncoder !== "undefined") {
      if (!encoder) encoder = new TextEncoder();
      return encoder.encode(text).length;
    }
  } catch (e) { /* fall through */ }
  return text.length;
}

/** UTF-8 byte length of the project JSON (what saveProject counts against SIZE_WARN and SIZE_MAX). */
function projectBytes(doc) {
  try {
    return utf8Length(JSON.stringify(doc));
  } catch (e) {
    return 0;
  }
}

/** The section with the most JSON bytes: { key, bytes }. { key: null, bytes: 0 } when there are none. */
function largestSection(doc) {
  let best = { key: null, bytes: 0 };
  const secs = isObj(doc) && isObj(doc.sections) ? doc.sections : {};
  for (const key of Object.keys(secs)) {
    const bytes = projectBytes(secs[key]);
    if (bytes > best.bytes) best = { key, bytes };
  }
  return best;
}

function fmtSize(bytes) {
  return bytes >= 1048576 ? `${(bytes / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(bytes / 1024))} KB`;
}

/** The text shown when a project is over SIZE_WARN (saved) or over SIZE_MAX (refused). Names the largest section. */
function sizeMessage(doc, bytes, refused) {
  const big = largestSection(doc);
  const part = big.key ? ` The largest part is "${big.key}" (${fmtSize(big.bytes)}).` : "";
  return refused
    ? `This project is ${fmtSize(bytes)}, which is over the ${fmtSize(SIZE_MAX)} limit, so it was not saved.${part} Delete old projects or simplify that part.`
    : `This project is ${fmtSize(bytes)}. Browsers keep about 5 MB for all projects together.${part} Delete old projects to make room.`;
}

/* ---------- storage access (every call inside try/catch, one notice per storage object) ---------- */

const noticed = new WeakSet();
let noticedDefault = false;

/** Calls opts.onNotice(message) once per storage object (the default localStorage counts as one object). */
function notice(storage, opts, message) {
  if (!opts || typeof opts.onNotice !== "function") return;
  if (storage && typeof storage === "object") {
    if (noticed.has(storage)) return;
    noticed.add(storage);
  } else {
    if (noticedDefault) return;
    noticedDefault = true;
  }
  try { opts.onNotice(message); } catch (e) { /* ignore */ }
}

const NO_STORE = "Saving is unavailable in this browser, so projects will only be kept until you close this page.";
const NO_WRITE = "Saving is unavailable in this browser (storage is blocked or full). The project will only be kept until you close this page.";

function backend(storage) {
  // Reading globalThis.localStorage itself can throw (blocked site data).
  return storage || globalThis.localStorage;
}

/** The stored text for a key, or null when missing or when storage fails. */
function readRaw(storage, opts, key) {
  try {
    const raw = backend(storage).getItem(key);
    return raw === undefined || raw === null ? null : String(raw);
  } catch (e) {
    notice(storage, opts, NO_STORE);
    return null;
  }
}

function writeRaw(storage, opts, key, value) {
  try {
    backend(storage).setItem(key, value);
    return true;
  } catch (e) {
    notice(storage, opts, NO_WRITE);
    return false;
  }
}

function removeRaw(storage, opts, key) {
  try {
    backend(storage).removeItem(key);
    return true;
  } catch (e) {
    notice(storage, opts, NO_WRITE);
    return false;
  }
}

const keyFor = (id) => KEY_PREFIX + id;
const byNewest = (a, b) => (a.updatedAt < b.updatedAt ? 1 : a.updatedAt > b.updatedAt ? -1 : 0);

/** The index entries [{ id, name, updatedAt, bytes }], newest first. A corrupt index is backed up and read as empty. */
function readIndex(storage, opts) {
  const raw = readRaw(storage, opts, KEY_INDEX);
  if (raw === null) return [];
  let arr = null;
  try { arr = JSON.parse(raw); } catch (e) { arr = null; }
  if (!Array.isArray(arr)) {
    notice(storage, opts, "The project list could not be read and was reset. A backup copy of the old list was kept.");
    try { backend(storage).setItem(KEY_INDEX + ".corrupt", raw); } catch (e) { /* ignore */ }
    return [];
  }
  const seen = new Set(), out = [];
  for (const e of arr) {
    if (!isObj(e) || !okId(e.id) || seen.has(e.id)) continue;
    seen.add(e.id);
    out.push({
      id: e.id,
      name: typeof e.name === "string" && e.name ? e.name : "Untitled",
      updatedAt: typeof e.updatedAt === "string" ? e.updatedAt : "",
      bytes: Number.isFinite(e.bytes) ? e.bytes : 0,
    });
  }
  return out.sort(byNewest);
}

function writeIndex(storage, opts, entries) {
  return writeRaw(storage, opts, KEY_INDEX, JSON.stringify(entries.slice().sort(byNewest)));
}

/* ---------- saved projects ---------- */

/**
 * The saved projects as index entries [{ id, name, updatedAt, bytes }], newest first (copies).
 * `storage` is a Storage-like object (getItem, setItem, removeItem); the default is localStorage.
 * `opts` is optional: { onNotice(message) }, called once when storage fails.
 */
function listProjects(storage, opts) {
  return readIndex(storage, opts);
}

/**
 * Loads, migrates and validates a saved project. Returns null when it is missing, unreadable, invalid,
 * or from a newer version of the tools (opts.onNotice then says why). Does not write anything.
 */
function loadProject(storage, id, opts) {
  if (!okId(id)) return null;
  const raw = readRaw(storage, opts, keyFor(id));
  if (raw === null) return null;
  let obj;
  try {
    obj = JSON.parse(raw);
  } catch (e) {
    notice(storage, opts, "This project could not be read, so it was not opened.");
    return null;
  }
  if (isObj(obj) && Number.isFinite(obj.version) && obj.version > VERSION) {
    notice(storage, opts, "This project was made by a newer version of the design tools, so it cannot be opened here.");
    return null;
  }
  const doc = migrate(obj);
  return validate(doc).ok ? doc : null;
}

/**
 * Saves a project and updates the index (newest first) and cmrlm.project.last. The project is validated
 * first, so a file that loadProject would reject is never stored. Returns { ok, bytes, warning }:
 *   - over SIZE_MAX: ok false, nothing written, warning names the largest section
 *   - over SIZE_WARN: ok true, warning set (also names the largest section)
 *   - storage failure or an invalid project: ok false, warning says why
 * `warning` is null when there is nothing to say. The project object itself is not changed.
 */
function saveProject(storage, doc, opts) {
  const m = migrate(doc);
  if (isObj(m) && Number.isFinite(m.version) && m.version > VERSION) return { ok: false, bytes: 0, warning: NEWER_MSG };
  const check = validate(m);
  if (!check.ok || !okId(m.id)) {
    const why = !check.ok ? check.errors[0] : 'id: must be text other than "index" or "last"';
    return { ok: false, bytes: 0, warning: `This project could not be saved because it is not valid (${why}).` };
  }
  let text;
  try {
    text = JSON.stringify(m);
  } catch (e) {
    return { ok: false, bytes: 0, warning: "This project could not be saved because it could not be written as text." };
  }
  const bytes = utf8Length(text);
  if (bytes > SIZE_MAX) return { ok: false, bytes, warning: sizeMessage(m, bytes, true) };
  if (!writeRaw(storage, opts, keyFor(m.id), text)) return { ok: false, bytes, warning: NO_WRITE };
  const entry = {
    id: m.id,
    name: typeof m.name === "string" && m.name ? m.name : "Untitled",
    updatedAt: typeof m.updatedAt === "string" ? m.updatedAt : (typeof m.createdAt === "string" ? m.createdAt : ""),
    bytes,
  };
  const index = readIndex(storage, opts).filter((e) => e.id !== m.id);
  index.unshift(entry);
  if (!writeIndex(storage, opts, index)) return { ok: false, bytes, warning: NO_WRITE };
  writeRaw(storage, opts, KEY_LAST, m.id);
  return { ok: true, bytes, warning: bytes > SIZE_WARN ? sizeMessage(m, bytes, false) : null };
}

/**
 * Removes a saved project: its file, its index entry, and cmrlm.project.last when it points at it.
 * Returns true when something was removed.
 */
function deleteProject(storage, id, opts) {
  if (!okId(id)) return false;
  const existed = readRaw(storage, opts, keyFor(id)) !== null;
  const entries = readIndex(storage, opts);
  const listed = entries.some((e) => e.id === id);
  removeRaw(storage, opts, keyFor(id));
  if (listed) writeIndex(storage, opts, entries.filter((e) => e.id !== id));
  if (readRaw(storage, opts, KEY_LAST) === id) removeRaw(storage, opts, KEY_LAST);
  return existed || listed;
}

/* ---------- export, import, handoff ---------- */

/** "Ravinia test" -> "ravinia-test": lowercase, spaces to dashes, only letters, digits and dashes. */
function slug(name) {
  return String(name || "").toLowerCase().normalize("NFKD").replace(/[^\w\s-]/g, "").trim()
    .replace(/[\s_]+/g, "-").replace(/-+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "project";
}

/** "Name" -> "Name (2)", "Name (3)" ... the first one not in `taken` (case-insensitive). */
function copyName(name, taken) {
